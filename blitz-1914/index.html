<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Бліц-соло · Україна в 1914–1921 рр.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.lb-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; will-change: transform; }
.pic { touch-action: pan-x pan-y; }   /* щипок на зображенні не збільшує всю сторінку — відкриває перегляд */
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


.brand { margin: 28px 0 6px; text-align: center; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }

/* «← Усі теми» — повернення на полицю тем спільної оболонки */
.tback { display: inline-block; margin: 14px 0 0; font-weight: 700; font-size: 15px; color: var(--acc2); text-decoration: underline; }
/* курс: вхід, бліци, тести */
.tback + .who { margin-top: 8px; }
.who { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--panel); border-radius: 12px; padding: 10px 14px; margin: 14px 0 0; font-weight: 700; font-size: 15px; }
.lnk { background: none; border: 0; color: var(--acc2); font: inherit; font-size: 14.5px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }
.login { display: grid; gap: 14px; margin-top: 18px; }
.login label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
.login input { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--panel2); background: var(--bg); color: var(--txt); }
.login input:focus { outline: none; border-color: var(--acc); }
.err { color: var(--bad); font-weight: 700; }
.locked { opacity: .55; }
.shake { animation: shk .4s; } @keyframes shk { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.okc { color: var(--ok); } .badc { color: var(--bad); }
.sync { font-size: 14.5px; color: var(--muted); margin-top: 16px; text-align: center; }
.bz-card .meta { color: var(--muted); font-size: 15px; }
.bz-card .best { background: var(--panel2); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.bz-card .best b { color: var(--acc2); }
.bz-card .btn { margin-top: 4px; }
.bz-in { display: grid; gap: 14px; padding-top: 14px; }
.bz-top { display: flex; align-items: center; gap: 10px; }
.bz-top .cnt { font-weight: 700; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.bz-top .pts { margin-left: auto; background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-weight: 800; color: var(--acc2); font-variant-numeric: tabular-nums; }
.bz-top .x { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; width: 40px; height: 36px; font-size: 17px; cursor: pointer; }
.qtype { font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--acc2); }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.38; }
.pic.qi { border-radius: 12px; overflow: hidden; position: relative; background: #0f0f0f; }
.pic.qi img { width: 100%; height: auto; max-height: 62vh; object-fit: contain; display: block; }
.tiles { display: grid; gap: 10px; }
.tile { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; border: 3px solid transparent; border-radius: 14px; padding: 12px; font: inherit; font-size: 16.5px; font-weight: 600; color: #fff; cursor: pointer; min-height: 58px; }
.tile .l { width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.25); display: grid; place-items: center; font-weight: 800; }
.tile.c0 { background: #b8463a; } .tile.c1 { background: #2f6fa8; } .tile.c2 { background: #b38419; } .tile.c3 { background: #3f8a55; }
.tile.n { background: var(--panel2); }
.tile.sel { border-color: var(--acc2); background: #4a3524; }
.tile[disabled] { cursor: default; }
.tile.dim { opacity: .38; }
.tile.right { border-color: #9ff0b4; opacity: 1; }
.tile.wrong { border-color: #ffb3a6; opacity: 1; }
.tile .ord { width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: #161616; display: grid; place-items: center; font-weight: 800; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile.wi { grid-template-columns: 1fr; padding: 8px; position: relative; align-content: start; }
.tile.wi .l, .tile.wi .ord { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(0,0,0,.65); }
.tile.wi .ord { background: var(--acc); }
.oi { position: relative; display: block; border-radius: 10px; overflow: hidden; background: #0f0f0f; }
.oi img { width: 100%; height: 150px; object-fit: contain; display: block; }
.oi .zoom-hint { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.65); display: grid; place-items: center; font-size: 18px; color: #fff; }
.mlist { background: var(--panel); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-size: 15.5px; }
.mo { display: grid; grid-template-columns: 24px 1fr; gap: 6px; align-items: start; }
.mo .oi img { height: 120px; }
.mrow { display: grid; gap: 6px; }
.ml { font-weight: 600; }
.ml .pic.ri { margin-top: 6px; }
.pic.ri { border-radius: 10px; overflow: hidden; background: #0f0f0f; position: relative; }
.pic.ri img { width: 100%; height: 170px; object-fit: contain; display: block; }
.mbtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mb { background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 10px; height: 44px; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
.mb.on { background: var(--acc); color: #161616; }
.mb.right { border-color: #9ff0b4; }
.mb.wrong { border-color: #ffb3a6; }
.bz-act { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.fb { border-radius: 14px; padding: 14px; display: grid; gap: 6px; }
.fb.good { background: #1f3a27; } .fb.bad { background: #3a231e; } .fb.part { background: #3a311c; }
.fb .h { font-weight: 800; font-size: 18px; }
.res { text-align: center; display: grid; gap: 6px; background: var(--panel); border-radius: 18px; padding: 22px 16px; }
.res .big { font-size: 46px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; line-height: 1.1; }
.res .gr { font-size: 18px; font-weight: 800; }
.tintro p { margin: 0 0 8px; }
.tnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.tnav.stk { flex-wrap: nowrap; overflow-x: auto; position: sticky; top: 53px; z-index: 5; background: var(--bg); padding: 8px 0; scrollbar-width: none; }
.tnav.stk::-webkit-scrollbar { display: none; }
.tnav.stk .nv { flex: 0 0 auto; }
.nv { min-width: 38px; height: 38px; border-radius: 10px; background: var(--panel2); color: var(--txt); display: grid; place-items: center; font-weight: 800; font-size: 15px; text-decoration: none; position: relative; }
.nv.on { background: #2c5a3a; } .nv.pt { background: #5a4a22; } .nv.no { background: #5a2c24; }
.nv i { position: absolute; right: 2px; bottom: 0; font-size: 10px; font-style: normal; opacity: .8; }
.task { display: grid; gap: 12px; scroll-margin-top: 110px; }
.rst { justify-self: start; }
.tsend { display: grid; gap: 8px; margin-top: 18px; text-align: center; }
.dlg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dlg[hidden] { display: none; }
.dlg-in { background: var(--panel); border-radius: 18px; padding: 20px; display: grid; gap: 10px; max-width: 420px; }
.dlg-in h3 { margin: 0; }

/* автор і ліцензія під фото — дрібно й приглушено */
.cap .cr, .hero-cap .cr { display: block; margin-top: 2px; font-size: 10px; line-height: 1.3; opacity: .6; letter-spacing: .01em; }

/* уривок джерела в умові завдання: підпис джерела — дрібніше */
.qtext .a2 { display: inline-block; font-size: 14px; font-weight: 600; color: var(--muted); }

.fb .ex { font-size: 15px; line-height: 1.45; color: #e8e8e8; border-top: 1px solid rgba(255,255,255,.15); padding-top: 8px; margin-top: 2px; }
.mini-card { margin-top: 18px; }
.mini-card .h { font-weight: 800; font-size: 18px; margin-bottom: 4px; }
.bz-top .tm { background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-weight: 800; font-variant-numeric: tabular-nums; color: #f2f2f2; }
.bz-top .tm.warn, .bar .tm.warn { background: #7a2b20; color: #fff; }
.bar .tm { margin-left: auto; background: var(--panel2); border-radius: 10px; padding: 5px 10px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bz-top .tm { margin-left: auto; } .bz-top .tm + .pts { margin-left: 0; }

/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }

/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }

.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
/* бліц-соло онлайн */

.res.pz { gap: 10px; }
.res .gr.okc { color: var(--acc2); font-size: 22px; }
.bz-act .btn[disabled] { opacity: .45; }

.rv .pts.b { background: rgba(198,40,40,.15); color: #c62828; }
.rv-o { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.rvo { padding: 8px 10px; border-radius: 10px; border: 2px solid var(--panel2); font-size: 15px; display: flex; gap: 6px; align-items: baseline; }
.rvo .mk { min-width: 1.1em; font-weight: 800; }

.rvo.bad { border-color: #c62828; background: rgba(198,40,40,.12); }

.rv-s { font-size: 15px; margin: 6px 0; }
.rv-s .okt { color: #2e7d32; }
.rv-e { font-size: 14.5px; line-height: 1.45; background: var(--panel2); padding: 10px 12px; border-radius: 10px; margin-top: 8px; }

/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };

function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}

const EXPL = {"q01": "Головну українську раду (ГУР) у серпні 1914 р. утворили українські партії Галичини; її головою став Кость Левицький, він же з 1915 р. очолив Загальну українську раду. Є. Петрушевич — президент Української Національної Ради (1918), Д. Донцов — серед засновників Союзу визволення України, М. Галущинський — командант легіону УСС.", "q02": "Союз визволення України (СВУ) заснували у Львові в серпні 1914 р. емігранти з Наддніпрянщини, серед них А. Жук і Д. Донцов. СВУ вів агітацію серед полонених українців російської армії. Головну українську раду й Українську бойову управу створили галицькі діячі, Загальну українську раду — у Відні 1915 р.", "q03": "Педагог, директор гімназії в Рогатині Михайло Галущинський у серпні 1914 р. став командантом легіону УСС, а після війни багато років очолював «Просвіту». Д. Вітовський — сотник УСС, керівник Листопадового зриву 1918 р.; К. Левицький — голова ГУР і ЗУР; М. Омелянович-Павленко — командувач УГА, згодом — Першого Зимового походу.", "q04": "Вільгельм Габсбург, який називав себе Василем Вишиваним і носив вишиванку, у 1918 р. командував бойовою групою, основу якої становили УСС, на Херсонщині. Генерал-губернатором окупованих Галичини й Буковини був російський граф Г. Бобринський; ЗУР очолював К. Левицький; делегацію УНР у Бересті — О. Севрюк.", "q05": "Після Галицької битви 1914 р. Російська імперія утворила на зайнятих землях Східної Галичини й Північної Буковини Галицько-Буковинське генерал-губернаторство (очільник — граф Г. Бобринський). Влада закривала українські школи й товариства, переслідувала греко-католицьке духовенство. Улітку 1915 р. німецько-австрійські війська після Горлицького прориву витіснили росіян з Галичини, і генерал-губернаторство припинило існування. Брусиловський прорив 1916 р. повернув росіянам лише Буковину й частину Галичини.", "q06": "Галицька битва (серпень – вересень 1914 р.) закінчилася перемогою Росії: російські війська зайняли Львів, Східну Галичину й Північну Буковину. Витіснили росіян з Галичини німецько-австрійські війська під час Горлицького прориву 1915 р. Закарпаття росіяни не займали.", "q07": "Наступ Південно-Західного фронту під командуванням О. Брусилова розпочався в червні 1916 р. Російські війська зайняли Луцьк, Буковину, частину Галичини. 1914 р. — Галицька битва, 1915 р. — Горлицький прорив, 1917 р. — «червневий наступ».", "q08": "Евакуація — організоване вивезення з місцевості, якій загрожує небезпека, населення, установ, підприємств, майна. Улітку 1915 р., під час відступу російської армії, частину заводів і навчальних закладів з українських губерній вивезли до Росії. Реквізиція — примусове вилучення майна для потреб армії; депортація — примусове виселення людей (так росіяни виселяли з Галичини греко-католицьких священиків), а не вивезення установ і майна.", "q09": "Мобілізація — переведення збройних сил і господарства держави на воєнний стан, призов військовозобов’язаних до армії. Українці, мобілізовані до армій ворожих імперій, воювали одні проти одних. Українізація армії почалася лише в 1917 р., демобілізація — переведення армії на мирний стан.", "q10": "Світова війна — війна, у якій беруть участь провідні держави кількох континентів; бойові дії ведуться на суходолі й морях різних частин світу, а держави мобілізують усі свої ресурси. У Першій світовій війні брали участь 38 держав, проте не всі держави світу; бої точилися не лише в Європі.", "q11": "Маніфест «До українського народу» оприлюднила 3 серпня 1914 р. Головна українська рада у Львові. Галицькі політики закликали підтримати Австро-Угорщину як союзницю у боротьбі проти Росії. Маркер — слово «наша» щодо Австро-Угорщини і заклик до галицького населення. СВУ складали наддніпрянські емігранти, ЗУР утворена 1915 р. у Відні, УЦР — 1917 р. у Києві.", "q12": "На фото — Дмитро Донцов, уродженець Мелітополя, перший голова Союзу визволення України (1914), згодом — ідеолог українського націоналізму. ГУР і ЗУР очолював К. Левицький, легіон УСС у 1914 р. — М. Галущинський, Василем Вишиваним називав себе архикнязь Вільгельм Габсбург.", "q13": "Заштриховано Східну Галичину й Північну Буковину, які російські війська зайняли після Галицької битви 1914 р.; тут утворили Галицько-Буковинське генерал-губернаторство. Королівство Галичини та Володимирії — австрійський коронний край (до 1918 р.), Південно-Західний край — російська назва Київської, Волинської й Подільської губерній, Західна область УНР — назва ЗУНР після Акта злуки 1919 р.", "q14": "Стрілки ведуть із Волині й Поділля на Львів, Галич і далі до Сяну та Перемишля — це наступ російських армій під час Галицької битви (серпень – вересень 1914 р.). Горлицький прорив 1915 р. — наступ німецько-австрійських військ у протилежному напрямку. Брусиловський прорив (1916) мав напрямки на Луцьк і Буковину й Львова не досяг; «червневий наступ» 1917 р. провалився після кількох днів.", "q15": "Шлях починається у Львові (1914), далі — Карпати (бої на горі Маківка, 1915), околиці Бережан (гора Лисоня, 1916) і Південна Україна, куди УСС прибули з австрійською армією в 1918 р. Січові стрільці Є. Коновальця сформувалися в Києві 1918 р., УГА — у листопаді 1918 р. в Галичині, Перший Зимовий похід проходив Правобережжям у 1919–1920 рр.", "q16": "Загальна українська рада утворилася у Відні 5 травня 1915 р. замість ГУР; до неї увійшли представники галицьких і буковинських партій та СВУ, очолив її К. Левицький. Серпень 1914 р. — ГУР, УСС, СВУ; червень 1916 р. — Брусиловський прорив; березень 1917 р. — УЦР.", "q17": "Це заява російського генерал-губернатора Г. Бобринського у Львові (1914). Окупаційна влада вважала Галичину «корінною частиною єдиної Русі», запроваджувала російську мову, закривала українські установи, переслідувала греко-католицьку церкву. Галицькі й наддніпрянські українські організації такі погляди відкидали.", "q18": "1914 р.: серпень — ГУР, легіон УСС, СВУ; серпень – вересень — Галицька битва. Горлицький прорив і утворення ЗУР — 1915 р., Брусиловський прорив і бої на горі Лисоня — 1916 р.", "q19": "Україна стала ареною боїв: прифронтові райони зруйновано, українці гинули й потрапляли в полон в арміях обох воюючих імперій, під час відступу 1915 р. росіяни вивезли частину населення в глиб імперії («біженство»). Автономії Галичині Росія не давала, столипінську реформу війна перервала, перші українські партії постали ще наприкінці XIX ст.", "q20": "Галицька битва — серпень – вересень 1914 р.; бій на горі Маківка — квітень – травень 1915 р.; Брусиловський прорив — червень 1916 р.; УЦР — березень 1917 р.", "q21": "УЦР утворилася в березні 1917 р.; у квітні 1917 р. Всеукраїнський національний конгрес у Києві переобрав її склад і підтвердив М. Грушевського головою. Червень 1917 р. — І Універсал, листопад — ІІІ Універсал.", "q22": "На фото — історик Михайло Грушевський, голова Української Центральної Ради (1917–1918). Генеральний секретаріат і Директорію спершу очолював В. Винниченко, президентом Української академії наук став В. Вернадський.", "q23": "Генеральний секретаріат (червень 1917 р.) очолив письменник Володимир Винниченко (портрет В). На інших портретах — М. Грушевський (голова УЦР), С. Єфремов (заступник голови УЦР, генеральний секретар міжнаціональних справ) та А. Жук (діяч СВУ).", "q24": "Це І Універсал УЦР (10 (23) червня 1917 р.): після відмови Тимчасового уряду визнати автономію Центральна Рада проголосила її самочинно — «не відділяючись від Росії». ІІ Універсал — липень 1917 р., ІІІ — листопад 1917 р., IV — січень 1918 р.", "q25": "ІІ Універсал (3 (16) липня 1917 р.) з’явився після переговорів УЦР з міністрами Тимчасового уряду, що приїхали до Києва. Тимчасовий уряд визнав Генеральний секретаріат крайовим органом влади, а УЦР відмовилася від самочинного запровадження автономії до Всеросійських Установчих зборів.", "q26": "«Тимчасова інструкція» (серпень 1917 р.) обмежила владу Генерального секретаріату п’ятьма губерніями: Київською, Волинською, Подільською, Полтавською й Чернігівською. ІІІ Універсал (листопад 1917 р.) включив до УНР ще Херсонщину, Катеринославщину, Харківщину й материкову Таврію (цифра 3). Інші цифри: Холмщина (відійшла до УНР за Берестейським миром), Крим (до складу УНР не входив), Східна Галичина (з листопада 1918 р. — ЗУНР).", "q27": "Заштриховано Холмщину й Південне Підляшшя — землі на захід від Бугу, які за Берестейським мирним договором (січень (лютий) 1918 р.) відійшли до УНР. ІІІ Універсал їх не згадував, до ЗУНР вони не належали, у 1914–1915 рр. тут була російська влада, але не Галицько-Буковинське генерал-губернаторство.", "q28": "IV Універсал ухвалено 9 (22) січня 1918 р. 7 (20) листопада 1917 р. — ІІІ Універсал, 27 січня (9 лютого) 1918 р. — Берестейський мирний договір, 29 квітня 1918 р. — гетьманський переворот і ухвалення Конституції УНР.", "q29": "Стрілки показують наступ більшовицьких військ на Київ у першій війні радянської Росії проти УНР (грудень 1917 – лютий 1918 р.): з Харкова через Полтаву й з півночі через Бахмач. На шляху з Бахмача до Ніжина, біля станції Крути, у січні 1918 р. відбувся бій. Мотовилівка (листопад 1918 р.) — бій Директорії з гетьманцями, Базар (листопад 1921 р.) — трагедія Другого Зимового походу, Чортків — початок наступу УГА 1919 р.", "q30": "УНР підписала договір у січні (лютому) 1918 р., коли більшовицькі війська наступали на Київ. Мир дав УНР міжнародне визнання й військову допомогу Німеччини та Австро-Угорщини, що вигнали більшовиків. Східна Галичина за таємним додатком мала стати окремим краєм Австро-Угорщини, а не частиною УНР; Антанта мира не схвалювала.", "q31": "Самостійники вимагали відразу повної незалежності України. Їхнім лідером був М. Міхновський (Українська народна партія). Більшість УЦР — М. Грушевський, В. Винниченко, С. Єфремов — у 1917 р. обстоювали автономію України у складі федеративної Росії (автономісти).", "q32": "IV Універсал перейменував Генеральний секретаріат на Раду народних міністрів УНР. Рада міністрів — уряд Української Держави гетьмана, Державний секретаріат — уряд ЗУНР, Народний секретаріат — радянський уряд, створений більшовиками в Харкові в грудні 1917 р.", "q33": "Вільне козацтво — добровільні загони самооборони, що постали навесні 1917 р. на Київщині. З’їзд Вільного козацтва в Чигирині (жовтень 1917 р.) обрав почесним отаманом генерала П. Скоропадського, майбутнього гетьмана.", "q34": "Установчі збори — обраний населенням орган, який мав ухвалити конституцію й визначити державний устрій. ІІІ Універсал призначив вибори до Всеукраїнських Установчих зборів на грудень 1917 р.; через війну скликати їх не вдалося. Трудовий конгрес зібрався вже за Директорії (січень 1919 р.).", "q35": "Більшовики не здобули більшості на Всеукраїнському з’їзді рад у Києві й перенесли з’їзд до Харкова, де в грудні 1917 р. проголосили Україну Республікою Рад (Українська Народна Республіка Рад) і створили Народний секретаріат. Донецько-Криворізьку республіку проголосили в Харкові в лютому 1918 р., назву УСРР запроваджено 1919 р.", "q36": "Ультиматум РНК (грудень 1917 р.) звинувачував УЦР у «буржуазній політиці» й вимагав не пропускати козачі частини на Дон до генерала Каледіна, не роззброювати радянські полки й червоногвардійців. УЦР ультиматум відхилила — почалася перша війна радянської Росії проти УНР. Тимчасовий уряд на той час уже був повалений.", "q37": "Курултай — національні збори кримських татар; у грудні 1917 р. в Бахчисараї курултай ухвалив конституцію і проголосив Кримську Народну Республіку, її уряд (Директорію) очолив Номан Челебіджіхан. Меджліс — виконавчий орган, обраний курултаєм у 1991 р., диван — рада при хані за часів Кримського ханства.", "q38": "Полковник П. Болбочан у квітні 1918 р. очолив Кримську групу Армії УНР, яка вибила більшовиків з Криму й зайняла Сімферополь і Бахчисарай. Перший Зимовий похід очолив М. Омелянович-Павленко, Листопадовим зривом керував Д. Вітовський.", "q39": "Між І Універсалом (червень 1917 р.) і ІІІ Універсалом (листопад 1917 р.): Генеральний секретаріат (червень), переговори з міністрами Тимчасового уряду (липень), бої за владу в Києві (кінець жовтня — початок листопада 1917 р.). Національний конгрес — квітень 1917 р. (раніше); ультиматум РНК — грудень 1917 р., Крути й Берестейський мир — січень (лютий) 1918 р. (пізніше).", "q40": "М. Грушевський — голова УЦР, В. Винниченко — заступник голови й голова Генерального секретаріату, С. Єфремов — заступник голови. А. Жук і Д. Донцов — діячі СВУ, що діяли в Австро-Угорщині, М. Галущинський і К. Левицький — галицькі діячі.", "q41": "Національний конгрес — квітень 1917 р.; ІІ Універсал — липень 1917 р.; ультиматум РНК — грудень 1917 р.; Берестейський мир — січень (лютий) 1918 р.", "q42": "Крути — 29 січня 1918 р.; війська Муравйова захопили Київ 8–9 лютого (26–27 січня ст. ст.) 1918 р.; УЦР повернулася до Києва на початку березня 1918 р. з допомогою німецьких військ; Конституцію УНР ухвалено 29 квітня 1918 р.", "q43": "Українську академію наук заснували в Українській Державі гетьмана Павла Скоропадського (портрет Г). На інших портретах — сам В. Вернадський, перший президент УАН, В. Липківський (митрополит УАПЦ) і П. Болбочан (полковник Армії УНР, керівник походу на Крим 1918 р.).", "q44": "Це «Грамота до всього українського народу» гетьмана П. Скоропадського від 29 квітня 1918 р. — дня перевороту, що поклав край УЦР. Маркер — відновлення права приватної власності, яку скасовували універсали й земельний закон УЦР.", "q45": "Гетьман П. Скоропадський вважав Крим необхідним для Української Держави; восени 1918 р. уряд запровадив економічну блокаду («митну війну») Криму, і кримський уряд погодився на переговори про входження до Української Держави (цифра 2). Кубань у 1918 р. вела з Україною переговори про союз, Бессарабію анексувала Румунія, Східна Галичина в листопаді 1918 р. стала ЗУНР.", "q46": "Директорію утворили 14 листопада 1918 р. для керівництва повстанням проти гетьмана; її головою став В. Винниченко, С. Петлюра — головним отаманом військ. Головою Директорії Петлюра став у лютому 1919 р., після відставки Винниченка. Є. Петрушевич увійшов до Директорії після Акта злуки.", "q47": "Листопадовий зрив очолив сотник УСС Дмитро Вітовський, згодом — державний секретар військових справ ЗУНР. Є. Коновалець командував Січовими стрільцями в Києві, М. Галущинський — командант УСС (1914), М. Омелянович-Павленко очолив Перший Зимовий похід.", "q48": "Українську Національну Раду очолював Євген Петрушевич; у червні 1919 р. він став диктатором ЗУНР. К. Левицький і С. Голубович очолювали уряд (Державний секретаріат), Д. Вітовський — керівник Листопадового зриву.", "q49": "Універсал Директорії про злуку оголосили в Києві 22 січня 1919 р., у першу річницю IV Універсалу (22 січня 1918 р. за новим стилем); 13 листопада 1918 р. проголошено ЗУНР; 14 листопада 1918 р. утворено Директорію.", "q50": "Соборність — єдність усіх українських етнічних земель в одній державі. Її втілював Акт злуки УНР і ЗУНР 22 січня 1919 р. Незалежність від інших держав — самостійність, незалежність церкви — автокефалія.", "q51": "Отаманщина — свавілля командирів повстанських загонів (отаманів), які не підкорялися Директорії, діяли на власний розсуд, нерідко чинили погроми й переходили з боку на бік. Вона послаблювала армію УНР у 1919 р. Головний отаман — посада С. Петлюри, а не явище.", "q52": "Наприкінці серпня 1919 р. УГА й Армія УНР вступили до Києва, але того ж дня до міста ввійшли денікінці. Командування УГА не наважилося на бій, і українські війська залишили Київ. Невдача поглибила розлад між УНР і ЗУНР.", "q53": "Продрозкладка — примусове вилучення в селян «надлишків» хліба за безцінь, заборона вільної торгівлі — основа політики воєнного комунізму більшовиків у 1919–1921 рр. Неп (з 1921 р.) замінив розкладку продподатком і дозволив торгівлю. Гетьман відновлював приватну власність.", "q54": "Червоний терор — масові репресії більшовиків проти «класових ворогів»: розстріли заручників, «буржуазії», духовенства, офіцерів. Його проводили надзвичайні комісії (ЧК). Каральні загони Державної варти (1918) і репресії денікінців (білий терор) спрямовувалися проти прихильників більшовиків; погроми отаманів — прояв отаманщини.", "q55": "Інтервенція — втручання іноземних держав у внутрішні справи країни, зокрема збройне. Наприкінці 1918 р. в Одесі, Миколаєві, Херсоні, Севастополі висадилися війська Антанти (французи, греки та ін.); навесні 1919 р. під тиском повстанців і Червоної армії вони відійшли. Німецькі війська 1918 р. прийшли на запрошення УНР за Берестейським миром.", "q56": "На фото — Нестор Махно, ватажок Революційної повстанської армії України з центром у Гуляйполі. Холодний Яр — осередок Холодноярської республіки (1919–1922), Кам’янець-Подільський — тимчасова столиця УНР 1919 р., Таращанська дивізія — червоні загони.", "q57": "На фото — Симон Петлюра, головний отаман військ УНР, з лютого 1919 р. — голова Директорії. У квітні 1920 р. уклав Варшавську угоду з Польщею. Директорію спершу очолював В. Винниченко, Листопадовий зрив — Д. Вітовський, УНРаду — Є. Петрушевич.", "q58": "Ризький мир (березень 1921 р.) між Польщею, радянською Росією й УСРР завершив польсько-радянську війну: Польща визнала УСРР і зобов’язалася не підтримувати УНР; Східна Галичина й Західна Волинь лишилися за Польщею. Холмщина й Підляшшя після 1919 р. належали Польщі й за нею залишилися.", "q59": "Автокефальна церква — незалежна від інших церков, з власним предстоятелем. Всеукраїнський православний собор у жовтні 1921 р. утворив УАПЦ і обрав митрополитом Василя Липківського. А. Шептицький і Й. Сліпий — митрополити УГКЦ; І. Огієнко, міністр віросповідань УНР, став митрополитом лише в еміграції.", "q60": "Пам’ятник у Ромнах (1918) — робота скульптора Івана Кавалерідзе. О. Архипенко — скульптор-авангардист, що працював за кордоном, М. Бойчук — художник-монументаліст, засновник школи «бойчукістів», В. Кричевський — архітектор і художник, автор малого герба УНР.", "q61": "Це «Еней та його військо» (1919) Георгія Нарбута — графіка, ректора Української академії мистецтв, автора державних знаків (гербів, грошей, марок) Української Держави й УНР. Характерні риси — чіткий контур, яскраві площини кольору, декоративність.", "q62": "Закон про заснування УАН гетьман П. Скоропадський затвердив у листопаді 1918 р.; президентом став В. Вернадський. Березень 1917 р. — УЦР, січень 1919 р. — Акт злуки, жовтень 1921 р. — собор, що утворив УАПЦ.", "q63": "Маршрут — глибокий рейд тилами противника від Житомирщини через Київщину до Єлисаветграда, на південь до Вознесенська й Ананьєва і назад до Ямполя — це Перший Зимовий похід (грудень 1919 – травень 1920 р.). Другий Зимовий похід (листопад 1921 р.) — короткий рейд з Волині до Коростеня й Базара; наступ на Київ 1920 р. — прямо зі заходу; Чортківська офензива — у Галичині.", "q64": "1921 р.: березень — Ризький мир, жовтень — собор УАПЦ, листопад — Другий Зимовий похід. Варшавська угода й завершення Першого Зимового походу — 1920 р., Акт злуки й Чортківська офензива — 1919 р.", "q65": "ЗУНР (проголошена 13 листопада 1918 р.) мала парламент — Українську Національну Раду (президент Є. Петрушевич), уряд — Державний секретаріат, армію — УГА. Гетьман — в Українській Державі, Рада народних міністрів і Директорія — в УНР, ради — у радянській Україні.", "q66": "Причини поразки: розкол і суперечки в українському таборі (УЦР — гетьман — Директорія, УНР — ЗУНР), слабка армія й отаманщина, боротьба з більшовиками, білими, поляками без надійних союзників. Директорія з Денікіним воювала, УЦР ухвалила земельний закон, Антанта українських урядів не підтримувала, земельне питання було для селян головним.", "q67": "29 квітня 1918 р. — гетьманський переворот; 1 листопада 1918 р. — Листопадовий зрив; 14 листопада 1918 р. — Директорія; 22 січня 1919 р. — Акт злуки.", "q68": "Чортківська офензива — червень 1919 р.; Перший Зимовий похід почався в грудні 1919 р.; Варшавська угода — квітень 1920 р.; Другий Зимовий похід — листопад 1921 р.", "q69": "Кримська Народна Республіка — грудень 1917 р.; німецькі й австро-угорські війська прийшли за Берестейським миром — лютий – березень 1918 р.; десант Антанти в Одесі — грудень 1918 р.; розгром Врангеля Червоною армією за участі махновців — листопад 1920 р.", "q70": "Генеральний секретар військових справ — червень 1917 р.; Директорія — листопад 1918 р.; голова Директорії — лютий 1919 р.; Варшавська угода — квітень 1920 р."};   // пояснення: учень бачить їх лише після своєї спроби
const MINUTES = 46;   // орієнтовна тривалість (таймери + паузи)
const TZ = 'Europe/Kiev';
const HEAD = {
  'Результати': ['Завершено', 'Клас', 'Учень', 'Бали', 'Максимум', '%', 'Оцінка (1–12)', 'Тривалість, хв (телефон)', 'Від початку, хв (сервер)',
    'Виходи зі сторінки', 'Без відповіді'].concat(KEYS.map(function (k) { return String(k.n); })),
  'Питання': ['№', 'Розділ', 'Тип', 'Умова (початок)', 'id'],
};
function ss_() { return SpreadsheetApp.openById(PropertiesService.getScriptProperties().getProperty('SS')); }
function doGet() { return out_({ ok: true, server: 'blitz1914-solo', ready: !!PropertiesService.getScriptProperties().getProperty('SS') }); }
function doPost(e) {
  const lock = LockService.getScriptLock(); lock.waitLock(25000);
  try { return out_(handle_(JSON.parse(e.postData.contents))); }
  catch (err) { return out_({ error: String(err.message || err) }); }
  finally { lock.releaseLock(); }
}
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function sheet_(name) {
  const ss = ss_(); let s = ss.getSheetByName(name);
  if (!s) { s = ss.insertSheet(name); s.setFrozenRows(1); }
  const H = HEAD[name];
  if (s.getRange(1, 1, 1, H.length).getValues()[0].join('|') !== H.join('|')) s.getRange(1, 1, 1, H.length).setValues([H]).setFontWeight('bold');
  return s;
}
const now_ = function (d) { return Utilities.formatDate(d || new Date(), TZ, 'dd.MM.yyyy HH:mm:ss'); };

/* ---------- списки класів ---------- */
function norm_(s) { return String(s || '').toLowerCase().replace(/[’ʼ\x60´']/g, '\'').replace(/ё/g, 'е').replace(/[^a-zа-яіїєґ'\- ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function clsNorm_(c) { return String(c || '').toUpperCase().replace(/\s+/g, '').replace(/^(\d+)([А-ЯІЇЄҐ])$/, '$1-$2'); }
function key_(s) { return norm_(s).split(' ').filter(String).sort().join(' '); }
function hash_(name, cls, pin) {
  const raw = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, 'b1914|' + cls + '|' + key_(name) + '|' + pin, Utilities.Charset.UTF_8);
  return Utilities.base64Encode(raw).slice(0, 22);
}

/* ---------- дії ---------- */
function handle_(b) {
  const P = PropertiesService.getScriptProperties();
  const cls = clsNorm_(b.cls), name = nameNorm_(b.name);
  if (CLASSES.indexOf(cls) < 0 || name.split(' ').length < 2) throw new Error('roster');
  const id = cls + '|' + key_(name), pin = String(b.pin || '');

  const r = S.done;
  app.innerHTML = `<div class="wrap bz-in"><div class="home-head"><div class="kick">${esc(U.cls)} · ${esc(U.name)}</div><h1>${esc(INFO.title)}</h1></div>
    <div class="res"><div>Ваш результат</div><div class="big">${r.pts} з ${r.max}</div><div class="cap">${r.pct} % балів</div>
      <div class="gr okc">Оцінка: ${r.grade}</div></div>
    <p class="cap" style="text-align:center">Результат збережено на цьому телефоні. Спроба одна, тож пройти бліц ще раз не можна.</p>
    ${r.review ? reviewHtml(r.review) : ''}</div>`;
  const f = document.getElementById('rvf');
  if (f) f.querySelectorAll('button').forEach(b => b.onclick = () => {
    f.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.rv').forEach(c => c.style.display = b.dataset.f === 'err' && c.dataset.full === '1' ? 'none' : '');
  });
}
/* розбір: питання в порядку бліцу (№ — як у таблиці вчителя), позначки: ✓ ваша правильна, ✗ ваша хибна, ○ правильна, яку ви не обрали */
function reviewHtml(rv) {
  const by = {}; rv.forEach(x => by[x.id] = x);
  const err = rv.filter(x => x.p < (QS.find(q => q.id === x.id).t === 'single' ? 1 : 3)).length;
  const cards = QS.map(q => {
    const x = by[q.id]; if (!x) return '';
    const m = q.t === 'single' ? 1 : 3, full = x.p >= m;
    const a = x.a, ok = x.ok;
    let body;
    if (q.t === 'seq') {
      const lt = j => q.fix ? q.opts[j] : LET[j];
      body = `<div class="rv-o">${q.opts.map((o, j) => `<div class="rvo"><b>${LET[j]}</b> ${md(o)}</div>`).join('')}</div>
        <div class="rv-s">Ваш порядок: <b>${Array.isArray(a) && a.some(v => v !== null) ? a.map(j => j === null ? '—' : LET[j]).join(' → ') : 'немає відповіді'}</b><br>
        Правильний: <b class="okt">${ok.map(j => LET[j]).join(' → ')}</b></div>`;
    } else {
      const mine = q.t === 'single' ? (a === null || a === undefined ? [] : [a]) : (Array.isArray(a) ? a.filter(v => v !== null) : []);
      body = `<div class="rv-o">${q.opts.map((o, j) => {
        const isOk = ok.indexOf(j) >= 0, isMine = mine.indexOf(j) >= 0;
        const c = isOk && isMine ? 'good' : isMine ? 'bad' : isOk ? 'miss' : '';
        const mk = isOk && isMine ? '✓' : isMine ? '✗' : isOk ? '○' : '';
        const lb = q.fix ? '' : `<b>${q.t === 'three' ? j + 1 : LET[j]}</b> `;
        return `<div class="rvo ${c}"><span class="mk">${mk}</span>${lb}${md(o)}</div>`; }).join('')}</div>
        ${mine.length ? '' : '<div class="rv-s">Немає відповіді — час минув.</div>'}`;
    }
    return `<div class="card rv${full ? ' full' : ''}" data-full="${full ? 1 : 0}"><div class="rv-h"><b>${q.n}</b><span class="pts ${full ? 'g' : x.p ? 'h' : 'b'}">${x.p} з ${m}</span></div>
      <div class="qtext">${md(q.q).replace(/\n/g, '<br>')}</div>${(q.img || []).map(k => pic(k, 'qi')).join('')}
      ${body}<div class="rv-e">${md(x.e)}</div></div>`;
  }).join('');
  return `<h2 class="rv-t">Розбір · помилок: ${err}</h2>
    <p class="cap">✓ — ваша правильна відповідь, ✗ — ваша хибна, ○ — правильна відповідь, яку ви не обрали. У питаннях з картою, фото чи портретами варіанти — це цифри або літери на зображенні.</p>
    <div class="rvf" id="rvf"><button class="btn ghost on" data-f="all">Усі питання</button><button class="btn ghost" data-f="err">Лише з помилками</button></div>${cards}`;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && S && !S.done && S.qi != null && S.qi < N) { S.exits = (S.exits || 0) + 1; save(); }
  if (!document.hidden && S && !S.done && S.qi != null) resume();
});
window.addEventListener('online', () => Q.flush());

if (!API) app.innerHTML = '<div class="wrap"><p>Сторінка ще не підключена до сервера.</p></div>';
else if (!U) login();
else if (S && S.done) result();
else if (!S || S.qi == null) login();
else { Q.flush(); resume(); }

</script>
</body>
</html>

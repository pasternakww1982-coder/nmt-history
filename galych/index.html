<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галицько-Волинська держава (Королівство Руське)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.lb-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; will-change: transform; }
.pic { touch-action: pan-x pan-y; }   /* щипок на зображенні не збільшує всю сторінку — відкриває перегляд */
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


.brand { margin: 28px 0 6px; text-align: center; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }

/* «← Усі теми» — повернення на полицю тем спільної оболонки */
.tback { display: inline-block; margin: 14px 0 0; font-weight: 700; font-size: 15px; color: var(--acc2); text-decoration: underline; }

/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }
.tlv .ev { position: relative; padding: 0 0 16px; display: grid; gap: 3px; }
.tlv .ev i { position: absolute; left: -25px; top: 4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--bg); }
.tlv .ev .y { color: var(--acc2); font-weight: 800; font-variant-numeric: tabular-nums; }
.tlv .ev .y.yprog { justify-self: start; background: var(--acc2); color: #161616; border-radius: 8px; padding: 1px 8px; }
.tlv .ev b { font-size: 17px; }
.legend { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.legend span.sw { width: 34px; height: 16px; background: var(--acc2); border-radius: 6px; }
/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }
.gp .tr { position: relative; height: 18px; background: #262626; border-radius: 6px; }
.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }
.part-btn .th img { max-width: 100%; max-height: 100%; }
.part-btn h3 { font-size: 18px; }
.part-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
/* курс: вхід, бліци, тести */
.tback + .who { margin-top: 8px; }
.who { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--panel); border-radius: 12px; padding: 10px 14px; margin: 14px 0 0; font-weight: 700; font-size: 15px; }
.lnk { background: none; border: 0; color: var(--acc2); font: inherit; font-size: 14.5px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }
.login { display: grid; gap: 14px; margin-top: 18px; }
.login label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
.login input { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--panel2); background: var(--bg); color: var(--txt); }
.login input:focus { outline: none; border-color: var(--acc); }
.err { color: var(--bad); font-weight: 700; }
.locked { opacity: .55; }
.shake { animation: shk .4s; } @keyframes shk { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.okc { color: var(--ok); } .badc { color: var(--bad); }
.sync { font-size: 14.5px; color: var(--muted); margin-top: 16px; text-align: center; }
.bz-card .meta { color: var(--muted); font-size: 15px; }
.bz-card .best { background: var(--panel2); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.bz-card .best b { color: var(--acc2); }
.bz-card .btn { margin-top: 4px; }
.bz-in { display: grid; gap: 14px; padding-top: 14px; }
.bz-top { display: flex; align-items: center; gap: 10px; }
.bz-top .cnt { font-weight: 700; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.bz-top .pts { margin-left: auto; background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-weight: 800; color: var(--acc2); font-variant-numeric: tabular-nums; }
.bz-top .x { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; width: 40px; height: 36px; font-size: 17px; cursor: pointer; }
.qtype { font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--acc2); }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.38; }
.pic.qi { border-radius: 12px; overflow: hidden; position: relative; background: #0f0f0f; }
.pic.qi img { width: 100%; height: auto; max-height: 62vh; object-fit: contain; display: block; }
.tiles { display: grid; gap: 10px; }
.tile { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; border: 3px solid transparent; border-radius: 14px; padding: 12px; font: inherit; font-size: 16.5px; font-weight: 600; color: #fff; cursor: pointer; min-height: 58px; }
.tile .l { width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.25); display: grid; place-items: center; font-weight: 800; }
.tile.c0 { background: #b8463a; } .tile.c1 { background: #2f6fa8; } .tile.c2 { background: #b38419; } .tile.c3 { background: #3f8a55; }
.tile.n { background: var(--panel2); }
.tile.sel { border-color: var(--acc2); background: #4a3524; }
.tile[disabled] { cursor: default; }
.tile.dim { opacity: .38; }
.tile.right { border-color: #9ff0b4; opacity: 1; }
.tile.wrong { border-color: #ffb3a6; opacity: 1; }
.tile .ord { width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: #161616; display: grid; place-items: center; font-weight: 800; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile.wi { grid-template-columns: 1fr; padding: 8px; position: relative; align-content: start; }
.tile.wi .l, .tile.wi .ord { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(0,0,0,.65); }
.tile.wi .ord { background: var(--acc); }
.oi { position: relative; display: block; border-radius: 10px; overflow: hidden; background: #0f0f0f; }
.oi img { width: 100%; height: 150px; object-fit: contain; display: block; }
.oi .zoom-hint { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.65); display: grid; place-items: center; font-size: 18px; color: #fff; }
.mlist { background: var(--panel); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-size: 15.5px; }
.mo { display: grid; grid-template-columns: 24px 1fr; gap: 6px; align-items: start; }
.mo .oi img { height: 120px; }
.mrow { display: grid; gap: 6px; }
.ml { font-weight: 600; }
.ml .pic.ri { margin-top: 6px; }
.pic.ri { border-radius: 10px; overflow: hidden; background: #0f0f0f; position: relative; }
.pic.ri img { width: 100%; height: 170px; object-fit: contain; display: block; }
.mbtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mb { background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 10px; height: 44px; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
.mb.on { background: var(--acc); color: #161616; }
.mb.right { border-color: #9ff0b4; }
.mb.wrong { border-color: #ffb3a6; }
.bz-act { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

<script>
const LESSONS = [{"id": "p1", "num": 1, "title": "Галицько-Волинська держава (Королівство Руське)", "part": "Частина 1. Утворення держави й монгольська навала", "sub": "1199 – 1241 рр.: Роман Мстиславич, боротьба за спадщину, Данило до навали, Калка, похід Батия", "cover": {"key": "danylo_mon", "cap": "Пам’ятник королю Данилу в Галичі. Фото: Dmytro Petishkin / Wikimedia Commons, CC BY 4.0"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **1199 р.** — утворення Галицько-Волинської держави", "• **1223 р.** — битва біля р. Калка", "• **1238 – 1264 рр.** — правління Данила Романовича (початок — у цій частині)", "• **1240 р.** — захоплення м. Київ монголами"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії", "light": false}, {"k": "p", "paras": ["• **Роман Мстиславович** (Мстиславич)", "• **Данило Романович** (король Данило) — продовження в частині 2"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Картосхеми", "light": false}, {"k": "p", "paras": ["• Королівство Руське (Галицько-Волинська держава) за **Романа Мстиславовича** та **Данила Романовича**", "• **Напрямки походів монголів** на південно-західні землі Русі"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Знати й пояснювати", "light": false}, {"k": "p", "paras": ["• передумови, особливості й значення **утворення держави**", "• наслідки **монгольської навали**", "• працювати з **джерелами**: Галицько-Волинський літопис, Плано Карпіні"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 4. Дати 1245 і 1253, поняття «ярлик» і «баскак», персоналії Лев Данилович, Юрій I, Юрій II і пам’ятки культури — у частині 2."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Утворення держави", "sub": "Галичина й Волинь, Роман Мстиславич, боротьба за спадщину 1205 – 1238 рр.", "cover": {"key": "ipat1", "cap": ""}, "cards": [{"type": "cols", "title": "Галицьке й Волинське князівства до 1199 р.", "badges": [], "intro": "Обидва князівства межували між собою й мали тих самих сусідів: Польщу й Угорщину на заході, половців на півдні. Через ці землі йшли торгові шляхи з Причорномор’я до Польщі й Німеччини.", "blocks": [{"h": "Галицьке князівство", "paras": ["• Князь **Володимирко** об’єднав землі над Дністром і Сяном, а в **1141 р.** зробив столицею **Галич**.", "• Найбільшої сили князівство досягло за його сина **Ярослава Осмомисла** (1153 – 1187).", "• Багатство давали **соляні промисли** Прикарпаття й торгівля Дністром і Дунаєм.", "• Сильні місцеві **бояри** самі вирішували, кого кликати на князювання.", "• У **1199 р.** рід Ростиславичів згас."]}, {"h": "Волинське князівство", "paras": ["• Волинню правили нащадки **Ізяслава Мстиславича**, онука Володимира Мономаха.", "• Головне місто — **Володимир**; великими містами були також Луцьк, Берестя, Белз.", "• Бояри тут були слабші, ніж у Галичині, тож князь тримав їх у покорі.", "• З **1170 р.** на Волині княжив **Роман Мстиславич**."]}]}, {"type": "text", "kicker": "Утворення держави", "title": "Роман Мстиславич", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Роман був сином волинського князя Мстислава Ізяславича й праправнуком Володимира Мономаха. Волинь із головним містом Володимиром він отримав **1170 р.**", "Галич Роман уперше захопив ще 1188 р., але втримати його не зміг: місто зайняли угорці. Нова нагода випала **1199 р.**, коли помер останній галицький князь із роду Ростиславичів. Роман увійшов у Галич і об’єднав обидва князівства в **Галицько-Волинську державу**.", "Бояр, які йому опиралися, Роман стратив або вигнав і забрав їхні маєтки, а спирався на міщан, дрібних землевласників і дружину. У **1201 р.** він зайняв **Київ** і посадив там свого ставленика. Не раз він ходив і на половців.", "У **1205 р.** Роман загинув у сутичці з поляками під **Завихостом** на Віслі. Його синам Данилові й Василькові було чотири й два роки, і держава розпалася."], "imgs": [{"key": "roman", "cap": "Роман Мстиславич. Мініатюра Лицевого літописного зводу (XVI ст.) — пізня ілюстрація, не прижиттєве зображення. Суспільне надбання"}]}, {"type": "map", "title": "Держава Романа Мстиславича (1199 – 1205)", "steps": [{"key": "roman0", "label": "До 1199 р."}, {"key": "roman1", "label": "Держава Романа"}]}, {"type": "text", "title": "", "badges": [], "paras": ["На карті — два князівства до 1199 р.: **Волинське**, де з 1170 р. княжив Роман, і **Галицьке**, де правили Ростиславичі.", "**1199 р.** Роман об’єднав князівства в одну державу зі столицею в **Галичі**.", "**1201 – 1202 рр.** під його владою опинився **Київ**, а ймовірно, і **Переяслав**.", "Пунктир — сучасний кордон України: більша частина держави Романа лежить на нашій території."], "imgs": []}, {"type": "doc", "title": "Яким літописець змалював Романа", "quote": ["…самодержця всієї Русі, що здолав усі поганські народи, мудрістю розуму ходячи за заповідями Божими.", "Кидався бо він на поганих, як лев, сердитий же був, як рись, і губив їх, як крокодил, і переходив землю їхню, як орел, хоробрий бо був, як тур.", "Бо ревнував він дідові своєму Мономаху, що погубив поганих ізмаїльтян, тобто половців…"], "source": "Галицько-Волинський літопис, початок (переклад-переказ, скорочено)", "comment": ["Цими словами починається Галицько-Волинський літопис. Його укладали вже за Данила, тож літописець прославив Данилового батька як ідеального воїна.", "Літописець ставить Романа поруч із **Володимиром Мономахом**, який сто років перед тим водив руських князів на половців.", "__Слова з літопису:__ **самодержець** — правитель, що ні від кого не залежить; **погані, поганські народи** — нехристияни, тут половці; **ізмаїльтяни** — книжна назва кочовиків; **тур** — дикий бик."], "img": null}, {"type": "doc", "title": "Роман очима західного хроніста", "quote": ["Король Русі на ім’я Роман, вийшовши за межі своїх кордонів і бажаючи пройти через Польщу до Саксонії… з волі Божої вбитий двома братами, князями польськими, Лешком і Конрадом, на річці Віслі."], "source": "Німецька хроніка XIII ст. (Кельн), під 1205 р. (переклад-переказ)", "comment": ["Руські літописці називали Романа князем, а західний хроніст — **королем** (rex). Отже, у Європі Романа знали й вважали рівним королям.", "Навіщо Роман ішов до Саксонії, невідомо. За однією з версій, він хотів допомогти німецькому королю **Філіппу Швабському** в боротьбі за престол.", "__Слова з джерела:__ **Саксонія** — герцогство в Німеччині; **Лешко й Конрад** — польські князі Лешко Білий і Конрад Мазовецький."], "img": {"key": "roman_seal", "cap": "Печатка, яку приписують Романові Мстиславичу: два святі воїни. Зображення з попередньої версії презентації"}}, {"type": "defs", "title": "Боротьба за спадщину Романа (1205 – 1238)", "badges": [], "items": [{"name": "Малі князі", "paras": ["**1205 р.** вдова Романа Анна з синами втекла з Галича.", "Бояри покликали чернігівських князів **Ігоревичів**. Ті стратили сотні бояр, і **1211 р.** бояри їх повісили."], "img": null}, {"name": "Боярин-князь", "paras": ["**1213 р.** боярин **Володислав Кормильчич** сам сів на галицький стіл.", "Це єдиний випадок на Русі, коли князем став не Рюрикович."], "img": null}, {"name": "Угорці й поляки", "paras": ["**1214 р.** король Андрій II і князь Лешко Білий уклали **Спиську угоду** й посадили в Галичі угорського королевича.", "**1219 – 1227 рр.** Галичем правив Мстислав Удатний."], "img": null}, {"name": "Данило збирає землі", "paras": ["Спершу Данило утвердився на **Волині** (до 1230 р.): його підтримали міста й дрібні землевласники.", "Галич він кілька разів здобував і втрачав. Остаточно опанував його **1238 р.**"], "img": null}], "note": "Боротьба тривала 33 роки, бо сини Романа були ще дітьми, галицькі бояри — сильними, а Угорщина й Польща раз у раз втручалися в справи Галичини."}, {"type": "doc", "title": "Галицькі бояри в літописі", "quote": ["Володислав же ввійшов у Галич і вокняжився, і сів на столі. [події 1213 р.]", "Бояри ж галицькі Данила князем собі називали, а самі всю землю тримали. [1240 р.]", "А Доброслав їхав в одному каптані, гордий, і на землю не дивився, а галичани бігли біля його стремена."], "source": "Галицько-Волинський літопис (переклад-переказ, скорочено)", "comment": ["Галицькі бояри мали великі маєтки й соляні промисли, власні загони й зв’язки в Угорщині та Польщі. Тому вони не залежали від князя й самі вирішували, кого кликати на стіл, а кого виганяти.", "Навіть коли Данило вже правив Галичем, боярин **Доброслав Суддич** роздавав землі на власний розсуд. Данило схопив його й ув’язнив. Таку владу групи найбагатших землевласників історики називають **боярською олігархією** (поняття поза програмою НМТ).", "__Слова з літопису:__ **вокняжитися** — стати князем; **стіл** — княжа влада; **каптан** — верхній одяг; **стремено** — опора для ноги вершника."], "img": null}]}, {"id": "s2", "num": "II", "title": "Данило Романович до навали", "sub": "Повернення Галича, внутрішня політика, нові міста, Дорогичин 1238", "cover": {"key": "hunt", "cap": ""}, "cards": [{"type": "text", "kicker": "Данило Романович", "title": "Данило Романович", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Данило, старший син Романа, народився **1201 р.** Після загибелі батька чотирирічний княжич із матір’ю й братом **Васильком** переховувався в Польщі та Угорщині.", "Дорослим Данило спершу об’єднав під своєю владою **Волинь**, а **1238 р.** остаточно здобув **Галич**. Галичиною він правив сам, а Волинь віддав Василькові. Брати діяли разом усе життя.", "Данило бився на **Калці** (1223), розбив хрестоносців під **Дорогичином** (1238), тримав **Київ** (1239 – 1240), переміг суперників під **Ярославом** (1245). Щоб уберегти землю від нового погрому, він поїхав до Батия по ярлик, а згодом шукав проти Орди союзників на Заході й **1253 р.** прийняв королівську корону.", "Данило заснував **Холм** і зробив його своєю резиденцією. Помер він у **1264 р.**, поховали його в Холмі."], "imgs": [{"key": "danylo", "cap": "Король Данило. Ілюстрація до «Ілюстрованої історії України» М. Грушевського (1912). Суспільне надбання"}]}, {"type": "text", "kicker": "Данило Романович", "title": "Внутрішня політика Данила", "badges": [], "paras": ["Повернувши Галич, Данило мусив приборкати бояр, які роками вирішували, хто тут княжитиме. Зрадників він позбавляв маєтків, а землі роздавав своїм дружинникам.", "Князь спирався на тих, кому сильна влада була вигідна. **Міщани** хотіли торгувати без боярського свавілля, а **дрібні землевласники** отримували від князя землю за службу.", "Данило будував і укріплював міста — **Холм, Данилів, Кременець** — і кликав до них ремісників: німців, вірмен, євреїв, поляків.", "**Військова реформа.** Данило створив **піхоту** з міщан і селян, щоб не залежати від боярських загонів. **Важку кінноту**, озброєну за західним зразком, він готував до війн із сусідами-рицарями, а **легку** — до боротьби зі степовиками."], "imgs": [{"key": "stamp", "cap": "Поштова марка України «Кіннотник Данила Галицького XIII ст.» (2004)"}]}, {"type": "doc", "title": "Як постав Холм", "quote": ["Одного разу, коли Данило їздив на лови, побачив він місце гарне й лісисте на горі, а довкола нього поле. І спитав він місцевих: «Як зветься це місце?» Вони ж сказали: «Холм ім’я йому». І сподобалося йому місце те, і задумав він поставити на ньому городок.", "Побачивши ж це, почали приходити німці, і русини, й іншомовці, і ляхи. Ішли вони день у день, і юнаки, і майстри всякі втікали від татар: сідельники, і лучники, і тульники, і ковалі заліза, і міді, і срібла. І було життя, і наповнили вони доми."], "source": "Галицько-Волинський літопис, оповідь про заснування Холма (переклад-переказ, скорочено)", "comment": ["Данило заснував Холм близько **1237 р.** З 1240-х рр. місто стало його резиденцією: тут стояли княжий двір і кам’яні храми, тут князя й поховали.", "Літописець наголошує, що майстри тікали до Холма **від татар**. Міста Данила приймали людей зі спустошених земель.", "__Слова з літопису:__ **лови** — полювання; **ляхи** — поляки; **сідельники** — майстри сідел; **тульники** — майстри сагайдаків (тулів)."], "img": {"key": "founding", "cap": "Закладення міста. Історична ілюстрація"}}, {"type": "text", "kicker": "Данило Романович", "title": "Нові міста й вежі", "badges": [], "paras": ["**Холм** став резиденцією Данила й найбільшим містом його володінь.", "Неподалік Холма збереглася кам’яна **вежа в Столп’ї**. Такі вежі-«стовпи» ставили на Волині в XIII ст., щоб стерегти дороги й кордони.", "**Кременець** і **Данилів** мали такі міцні укріплення, що 1241 р. їх не змогли взяти навіть монголи.", "**Львів** уперше згадано в літописі під **1256 р.** Місто назвали на честь Данилового сина **Лева**."], "imgs": [{"key": "stolpie", "cap": "Вежа в Столп’ї поблизу Холма, XIII ст. Фото: Wikimedia Commons, CC BY 3.0"}]}, {"type": "map", "title": "Відновлення держави (1238)", "steps": [{"key": "danylo0", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**1238 р.** під **Дорогичином** Данило розбив лицарів Добжинського ордену, яких польський князь поселив на руській землі. За літописом, Данило сказав: «Не годиться держати нашої отчини хрестоносцям».", "Того ж року Данило остаточно опанував **Галич**. Держава Романа відродилася: Галичиною правив Данило, Волинню — **Василько**.", "Резиденцією Данила став **Холм**.", "Наступного, **1239 р.**, Данило зайняв **Київ** і залишив там свого тисяцького **Дмитра**. Як держава Данила змінилася після навали, побачите в частині 2."], "imgs": []}]}, {"id": "s3", "num": "III", "title": "Монгольська навала", "sub": "Хто такі монголи, Чингісхан і його імперія, Калка, походи 1236 – 1241 рр.", "cover": {"key": "dietz", "cap": ""}, "cards": [{"type": "text", "kicker": "Монголи", "title": "Хто такі монголи", "badges": ["поза програмою"], "paras": ["Монголи — кочові племена, що жили в степах Центральної Азії, на землях сучасної Монголії. Вони пасли коней, овець, верблюдів і биків, переходячи зі стадами з пасовища на пасовище.", "Жили вони в **юртах** — повстяних наметах на дерев’яному каркасі, які легко розібрати й перевезти. Змалку кожен чоловік був вершником і лучником.", "Монголи вірили у **Вічне Синє Небо — Тенгрі**, шанували шаманів і духів предків.", "До кінця XII ст. монгольські племена постійно воювали між собою, аж поки їх не об’єднав **Темучин**."], "imgs": [{"key": "yurt", "cap": "Модель монгольської юрти на возі. Кочовики перевозили житла разом зі стадами. Фото: Wikimedia Commons, CC0"}]}, {"type": "text", "kicker": "Монголи", "title": "Чингісхан (бл. 1162 – 1227)", "badges": ["поза програмою"], "paras": ["Темучин рано втратив батька, жив у бідності, побував у полоні. Проте зібрав навколо себе воїнів і силою та хитрістю об’єднав монгольські племена.", "У **1206 р.** з’їзд монгольської знаті — **курултай** — проголосив його **Чингісханом**, тобто великим ханом. Він видав **Ясу** — закони, що вимагали залізної дисципліни й служби в армії.", "Війська Чингісхана здобули Північний Китай (1215 р. — Пекін) і Хорезм у Середній Азії (1219 – 1221).", "Перед смертю Чингісхан поділив імперію між синами на **улуси**."], "imgs": [{"key": "chinggis", "cap": "Портрет Чингісхана з альбому імператорів династії Юань, XIV ст. Національний палацовий музей, Тайбей. Суспільне надбання"}]}, {"type": "text", "kicker": "Монголи", "title": "Чому монголи перемагали", "badges": ["поза програмою"], "paras": ["**Десятки, сотні, тисячі.** Військо ділили на десятки, сотні, тисячі й тумени (10 тисяч). За втечу одного воїна карали весь десяток.", "**Командири за здібностями.** Воєначальників призначали за хоробрість і вміння, а не за знатність роду.", "**Кінні лучники.** Складний лук і два-три коні на воїна давали швидкість. Улюблений прийом — удаваний відступ, а потім оточення.", "**Облогові машини.** Китайські й мусульманські майстри будували для монголів каменемети й тарани, тож фортеці перестали бути неприступними.", "**Розвідка й залякування.** Перед походом монголи збирали відомості про ворога. Жителів міст, що опиралися, винищували, щоб інші здавалися без бою."], "imgs": [{"key": "siege", "cap": "Монголи облягають місто. Мініатюра до «Збірника літописів» Рашид ад-Діна, поч. XIV ст. Суспільне надбання"}]}, {"type": "text", "kicker": "Монголи", "title": "Як була влаштована Монгольська імперія", "badges": ["поза програмою"], "paras": ["**Великий хан і курултай.** Імперією правив хан із роду Чингісхана, а найважливіші питання вирішував курултай. Столицею став **Каракорум**.", "**Ям і пайцза.** Ям — мережа поштових станцій зі свіжими кіньми. Пайцза — металева пластина, за якою ханський посланець отримував коней, їжу й охорону.", "**Перепис і данина.** Монголи переписували підкорені народи, обкладали їх даниною, забирали ремісників і воїнів.", "**Віротерпимість.** Монголи не нав’язували своєї віри; духовенство різних релігій часто звільняли від податків."], "imgs": [{"key": "paiza", "cap": "Пайцза — посвідчення монгольського посланця (копія). Фото: Wikimedia Commons, CC0"}]}, {"type": "map", "title": "Монгольська імперія та її улуси", "steps": [{"key": "empire", "label": ""}]}, {"type": "text", "title": "", "badges": ["поза програмою"], "paras": ["За пів століття монголи створили **найбільшу суходільну імперію** в історії — від Тихого океану до Дунаю.", "Після смерті Чингісхана держава складалася з **улусів** — володінь його синів і онуків.", "Бірюзовим позначено сучасну Україну: порівняйте її розміри з імперією."], "imgs": []}, {"type": "defs", "title": "Поняття", "badges": [], "note": null, "items": [{"name": "Улус", "paras": ["Володіння, яке хан передавав у спадок нащадкам разом із кочовим населенням."], "img": null}, {"name": "Улус Джучі — Золота Орда", "paras": ["Західний улус нащадків старшого сина Чингісхана, Джучі. Його засновник — **Батий**, столиця — Сарай на Волзі. Саме від цього улусу залежала Русь."], "img": null}]}, {"type": "doc", "title": "Перед Калкою: половці просять допомоги (1223)", "quote": ["Прийшли народи, яких ніхто добре не знає: хто вони, і звідки прийшли, і яка мова їхня, і якого племені вони, і яка віра їхня. А звуть їх татарами…", "Котян же, тесть Мстислава Галицького, прийшов із князями половецькими до зятя свого в Галич і приніс дари многі: коней, і верблюдів, і буйволів, і дівчат. І казав: «Нашу землю нині відняли, а вашу завтра, прийшовши, візьмуть»."], "source": "Літописні оповіді про битву на Калці (Лаврентіївський та Іпатіївський літописи), переклад-переказ, скорочено", "comment": ["У 1222 р. монгольський загін полководців **Джебе** й **Субедея** пройшов через Кавказ і розбив половців. Половецький хан **Котян** попросив допомоги в зятя — галицького князя **Мстислава Удатного**.", "Князі зібралися в Києві й вирішили зустріти ворога в степу. Вирушили **Мстислав Київський**, **Мстислав Чернігівський**, **Мстислав Удатний** і молодий **Данило Романович** із волинськими полками.", "__Слова з літопису:__ **татари** — так на Русі називали монгольське військо; **тесть** — батько дружини."], "img": null}, {"type": "map", "title": "Битва на Калці (31 травня 1223 р.)", "steps": [{"key": "kalka", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["Руські полки кілька днів ішли за монголами в степ — до річки **Калки** (сучасна Донеччина).", "① **Мстислав Удатний** із Данилом, чернігівцями й половцями перейшов Калку, не попередивши київського князя.", "② Монголи вдарили з двох боків. Половці побігли й зім’яли руські полки. **Данило**, поранений у груди, урятувався втечею.", "③ **Мстислав Київський** три дні відбивався в таборі. Монголи обіцяли його відпустити, він здався — і загинув з іншими князями.", "На Калці бився лише **розвідувальний загін** монголів. Після перемоги він пішов на схід, тож погром Русі відсунувся на 14 років."], "imgs": []}, {"type": "text", "kicker": "Монголи", "title": "Західний похід Батия (1235 – 1240)", "badges": ["поза програмою"], "paras": ["**1235 р.** курултай вирішив іти на захід, «до останнього моря». Військо очолив **Батий**, онук Чингісхана, а досвідченим полководцем при ньому був **Субедей**.", "Монголи йшли шляхом, який вони розвідали ще в поході 1222 – 1223 рр., коли відбулася битва на Калці.", "Спершу вони вдарили на **Волзьку Булгарію** (1236) і **Північно-Східну Русь** (1237 – 1238). Руські князі зустрічали ворога поодинці й гинули один за одним.", "У **1239 р.** монголи напали на Південну Русь, а в **1240 р.** — на Київ і Галицько-Волинську землю."], "imgs": [{"key": "suzdal", "cap": "Взяття Суздаля військом Батия, 1238 р. Мініатюра Лицевого літописного зводу (XVI ст.) — пізня ілюстрація. Суспільне надбання"}]}, {"type": "map", "title": "Західний похід Батия: 1236 – 1238 рр.", "steps": [{"key": "navala_pre", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["① **Осінь 1236 р.** — монголи розгромили **Волзьку Булгарію**.", "② **Грудень 1237 р.** — після п’ятиденної облоги впала **Рязань**.", "③ **Лютий 1238 р.** — здобуто **Володимир-на-Клязьмі** й **Суздаль**. У березні на річці **Сіть** загинув великий князь Юрій Всеволодович. До **Новгорода** монголи не дійшли: завадило весняне бездоріжжя.", "④ **Весна 1238 р.** — сім тижнів опирався **Козельськ**. Потім монголи відійшли в половецький степ і готували похід на південь."], "imgs": []}, {"type": "map", "title": "Навала на Південну Русь: 1239 р.", "steps": [{"key": "navala0", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["① **Березень 1239 р.** — монголи здобули й спалили **Переяслав**.", "② **Жовтень 1239 р.** — після облоги впав **Чернігів**.", "Київський князь Михайло Всеволодович утік до Угорщини. **Данило** зайняв Київ і залишив там тисяцького **Дмитра**.", "Наприкінці **1240 р.** Батий рушив на **Київ**."], "imgs": []}, {"type": "doc", "title": "Облога Києва 1240 р.", "quote": ["Прийшов Батий до Києва в силі тяжкій, з многим множеством сили своєї, і окружив город. І не можна було чути голосу від скрипіння возів його, від ревіння множества верблюдів його й від іржання стад коней його.", "Поставив же Батий пороки до города біля воріт Лядських. Пороки безперестанно били день і ніч і вибили стіни. І зійшли городяни на вибиті стіни, і тут видно було, як ламалися списи і щити розколювалися, а стріли затьмарили світло…"], "source": "Галицько-Волинський літопис, під 1240 р. (переклад-переказ, скорочено)", "comment": ["Місто обороняв тисяцький **Дмитро**, якого поставив Данило; самого князя в Києві не було. Останні захисники сховалися в **Десятинній церкві**, і вона завалилася під вагою людей.", "Київ упав у грудні 1240 р. (за традицією — **6 грудня**). Пораненого Дмитра Батий помилував «за мужність».", "__Слова з літопису:__ **пороки** — стінобитні машини; **Лядські ворота** — південно-східні ворота Києва; **тисяцький** — воєвода міського ополчення."], "img": {"key": "kyiv1240", "cap": "Облога Києва 1240 р. Мініатюра Лицевого літописного зводу (XVI ст.). Суспільне надбання"}}, {"type": "map", "title": "Як обороняли Київ (1240)", "steps": [{"key": "kyiv_def", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["Київ мав два укріплені кола: велике **місто Ярослава** із Золотими й Лядськими воротами та давніше **місто Володимира** з Десятинною церквою.", "① Батий поставив **пороки** біля **Лядських воріт**. Пороки день і ніч били в стіну, доки не проломили її. Тоді захисники стали до бою в проломі.", "② Монголи опанували місто Ярослава. Кияни на чолі з тисяцьким **Дмитром** відійшли в місто Володимира — **друге коло оборони**.", "③ За ніч вони звели нове укріплення довкола **Десятинної церкви**. Люди з майном ховалися на її склепіннях, і від цієї ваги стіни церкви завалилися."], "imgs": []}, {"type": "doc", "title": "Київ очима Плано Карпіні (1246)", "quote": ["Вони пішли проти Русі й учинили велике спустошення в землі Руській, зруйнували міста й фортеці, вбили людей, обложили Київ, що був столицею Русі, і після тривалої облоги взяли його й убили жителів міста.", "Тому, коли ми їхали через їхню землю, то знаходили безліч голів і кісток мертвих людей, що лежали на полі. Це місто було дуже велике й людне, а тепер воно зведене майже нанівець: ледве існує там двісті будинків, а людей тих тримають у найтяжчому рабстві."], "source": "Джованні дель Плано Карпіні, «Історія монголів» (переклад-переказ, скорочено)", "comment": ["**Плано Карпіні** — італійський чернець-францисканець. Папа римський відправив його послом до великого хана, і 1246 р. він проїжджав через Київ до Каракорума.", "Його свідчення цінне: сторонній очевидець побачив Київ через шість років після погрому.", "__Слова з джерела:__ **зведене нанівець** — майже знищене; **вони** — монголи."], "img": {"key": "desiat", "cap": "Фундаменти Десятинної церкви в Києві. Фото: Wikimedia Commons, CC BY-SA 4.0"}}, {"type": "map", "title": "Навала на Південну Русь: 1239 – 1241 рр.", "steps": [{"key": "navala1", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["③ **Грудень 1240 р.** — військо Батия здобуло **Київ**.", "④ **Зима 1240 – 1241 рр.** — монголи рушили на захід і зруйнували **Колодяжин, Ізяслав, Володимир, Галич** та інші міста.", "**Кременець, Данилів і Холм** вони взяти не змогли.", "Данило в цей час був в Угорщині й Польщі: шукав допомоги, але не отримав її.", "⑤ **Весна 1241 р.** — військо Батия вдерлося в **Польщу** й **Угорщину**. 1242 р. Батий повернув у степи."], "imgs": []}, {"type": "text", "kicker": "Монгольська навала", "title": "Похід у Центральну Європу (1241 – 1242)", "badges": ["поза програмою"], "paras": ["З галицьких і волинських земель військо Батия рушило двома шляхами.", "Північне крило вдерлося до Польщі й **9 квітня 1241 р.** розбило польсько-німецьке військо під **Легницею**.", "Головні сили вдарили на Угорщину: **11 квітня 1241 р.** король Бела IV програв битву на річці Шайо (біля Мохі). Монголи дійшли до узбережжя Адріатики.", "У **1242 р.** Батий повернув у степи: у Каракорумі помер великий хан Угедей, а військо втомилося від війни."], "imgs": [{"key": "legnica", "cap": "Битва під Легницею, 1241 р. Мініатюра з Ядвізького кодексу (1353). Суспільне надбання"}]}, {"type": "cols", "title": "Наслідки навали", "badges": [], "intro": "Монголи спустошили всі руські землі, але Галичина й Волинь постраждали менше, ніж Подніпров’я.", "blocks": [{"h": "Для всієї Русі", "paras": ["• Десятки тисяч людей загинули або потрапили в полон; більшість міст монголи зруйнували.", "• Занепали ремесла: майстрів, що робили емаль і скло, монголи вбили або забрали до Орди.", "• **Київ** перестав бути головним містом Русі.", "• Руські землі стали залежними від **Золотої Орди**."]}, {"h": "Для Галицько-Волинської держави", "paras": ["• Укріплених **Кременця, Данилова й Холма** монголи взяти не змогли.", "• Люди з Подніпров’я тікали на захід — у Галичину й Волинь.", "• Данило відбудовував міста й кликав до них ремісників.", "• Після занепаду Києва саме держава Романовичів зберігала державність на українських землях."]}]}]}, {"id": "s4", "num": "IV", "title": "Підсумки частини 1", "sub": "Що часто плутають, стрічки часу", "cover": {"key": "danylo_vol", "cap": ""}, "cards": [{"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Плутають", "Як правильно"], ["1199 і 1238", "**1199** — Роман утворив державу; **1238** — Данило відновив її, повернувши Галич"], ["Калка і Каяла", "**Калка, 1223** — перша битва з монголами; **Каяла, 1185** — похід Ігоря на половців"], ["Три Мстислави на Калці", "Мстислав **Удатний** (Галич), Мстислав **Київський**, Мстислав **Чернігівський**"], ["Хто обороняв Київ 1240 р.", "Тисяцький **Дмитро** — воєвода Данила; самого Данила в Києві не було"], ["Дорогичин", "**1238** — перемога над хрестоносцями; **1253** — коронація Данила (частина 2)"], ["Роман і Данило", "**Роман** — батько, утворив державу (1199); **Данило** — син, відновив її й став королем"]]}, {"type": "tl_events", "title": "Стрічка часу: події 1199 – 1241 рр.", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "1199 e97132", "sub": "Данило й Василько"}, {"a": 1238, "b": 1245, "color": "#cb934c", "sub": "Василько"}]}, {"name": "Степ", "segs": [{"a": 1222, "b": 1223.6, "color": "#e05a47", "sub": ""}, {"a": 1239, "b": 1242, "color": "#e05a47", "sub": "навала"}]}]}]}]}, {"id": "p2", "num": 2, "title": "Галицько-Волинська держава (Королівство Руське)", "part": "Частина 2. Королівство Руське", "sub": "1245 – 1340 рр.: Ярослав, Батий і ярлик, коронація, нащадки Данила, культура, підсумки теми", "cover": {"key": "danylo_lviv", "cap": "Пам’ятник королю Данилу у Львові. Фото: Половко Сергей Николаевич / Wikimedia Commons, CC BY-SA 4.0"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **1238 – 1264 рр.** — правління Данила Романовича", "• **1245 р.** — битва біля м. Ярослав; поїздка Данила Романовича в Золоту Орду", "• **1253 р.** — коронування Данила Романовича"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії й поняття", "light": false}, {"k": "p", "paras": ["• **Данило Романович** (король Данило), **Лев Данилович**, **Юрій I Львович**, **Юрій II Болеслав**", "• поняття **«ярлик»**, **«баскак»**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятки й картосхема", "light": false}, {"k": "p", "paras": ["• **Успенський собор** у м. Володимир (1160 р., сучасний вигляд); **церква святого Пантелеймона** поблизу Галича (кін. XII ст.)", "• **Холмська ікона Богородиці** (XII ст.); **Дорогобузька ікона Богородиці** (остання третина XIII ст.)", "• картосхема: Королівство Руське за **Данила Романовича**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Знати й пояснювати", "light": false}, {"k": "p", "paras": ["• залежність від **Золотої Орди** та її наслідки; **особливості золотоординського панування** на південно-західних землях", "• політичне, соціальне й господарське життя Королівства Руського"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 4. Дати 1199, 1223, 1240 і карта навали — у частині 1."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Між Ордою й Заходом", "sub": "Ярослав 1245, Золота Орда, ярлик і баскак, коронація 1253, боротьба з Ордою", "cover": {"key": "batu_throne", "cap": ""}, "cards": [{"type": "map", "title": "Битва під Ярославом: передумови", "steps": [{"key": "yar_pre", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["Навіть повернувши Галич, Данило мав суперника — чернігівського князя **Ростислава Михайловича**. Він був зятем угорського короля **Бели IV** і хотів сісти в Галичі.", "Влітку **1245 р.** Ростислав з угорським військом воєводи **Фільнія** й польськими загонами обложив місто **Ярослав** над Сяном.", "Данило й Василько зібрали військо й рушили на допомогу обложеним."], "imgs": []}, {"type": "map", "title": "Битва під Ярославом (17 серпня 1245 р.)", "steps": [{"key": "yaroslav", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["① Ростислав, угорці й поляки облягали Ярослав, підтягнувши тарани. Романовичі підійшли з-за Сяну.", "② Ростислав з угорськими рицарями вдарив на полк **Андрія-дворського**.", "③ **Данило** з півдня вдарив угорцям у фланг, а **Василько** розбив поляків воєводи Флоріана.", "④ Угорці й поляки побігли, Ростислав утік до Угорщини, а Фільнія схопили. Перемога завершила боротьбу за Романову спадщину, яка точилася з 1205 р."], "imgs": []}, {"type": "defs", "title": "Що змінила битва під Ярославом", "badges": [], "items": [{"name": "Кінець війни за Галич", "paras": ["Сорок років боротьби за спадщину Романа закінчилися.", "Відтоді ніхто не зазіхав на владу **Романовичів** у Галичині."], "img": null}, {"name": "Мир з Угорщиною", "paras": ["Бела IV помирився з Данилом.", "Близько **1251 р.** син Данила **Лев** одружився з угорською королівною **Констанцією**."], "img": null}, {"name": "Нова загроза", "paras": ["Перемога додала Данилові поваги.", "Але вже восени **1245 р.** ординський воєвода зажадав від нього: «Дай Галич!»"], "img": null}], "note": "Літопис: «Фільнія ж гордого спіймав Андрій-дворський і привів до Данила, і вбив його Данило… і багато угрів було вбито, і взято було безліч бранців»."}, {"type": "text", "kicker": "Між Ордою й Заходом", "title": "Золота Орда (Улус Джучі)", "badges": ["поза програмою"], "paras": ["Золоту Орду заснував **Батий** після повернення з походу на захід (1242). Вона простягалася від Іртиша до Дунаю, а столицею став **Сарай** на нижній Волзі.", "Спершу Орда була частиною Монгольської імперії, а з 1260-х рр. стала фактично самостійною державою.", "Більшість її населення становили тюркомовні кочовики, серед них нащадки половців. У XIV ст. за хана Узбека правителі Орди прийняли іслам.", "Назву «Золота Орда» пізніше вжили руські книжники; самі ординці казали «Улус Джучі»."], "imgs": [{"key": "batu_nobles", "cap": "Хан зі знаттю. Перська мініатюра XIV ст. (Національна бібліотека Франції). Суспільне надбання"}, {"key": "berke_coin", "cap": "Срібна монета хана Берке, карбована в Криму. Фото: Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "Між Ордою й Заходом", "title": "Як Орда керувала руськими землями", "badges": ["НМТ: поняття"], "paras": ["**Ярлик** — ханська грамота на право князювати. Князь їхав по неї до хана, а без ярлика не міг правити. Церкві ханський ярлик гарантував землі й звільнення від податків.", "**Баскак** — ханський намісник із загоном воїнів. Він стежив за князями й за тим, щоб справно платили данину.", "**Данина («вихід»).** Щоб розрахувати її, ординці переписували населення.", "**Військова служба.** Князі мусили ходити з ординцями в походи, наприклад на Литву й Польщу 1258 – 1259 рр.", "Таку залежність руських земель від Орди називають **золотоординським пануванням**."], "imgs": [{"key": "yarlyk", "cap": "Ярлик хана Тохтамиша, 1382 р. Суспільне надбання"}, {"key": "baskaky", "cap": "С. Іванов. «Баскаки» (1909). Суспільне надбання"}]}, {"type": "doc", "title": "Данило в Батия (1245 – 1246)", "quote": ["Прийшов він до Батия… і сказав йому Батий: «Данило! Чому ти давно не прийшов? А нині, що прийшов, то добре це. Чи п’єш ти чорне молоко, наше питво, кобилячий кумис?» Він же сказав: «Досі не пив я. Нині ж, як ти велиш, — п’ю». А той сказав: «Ти вже наш, татарин. Пий наше питво».", "О, лихіша від лиха честь татарська! Данило Романович, князь великий, що володів Руською землею — Києвом, і Володимиром, і Галичем з братом своїм, — нині сидить на колінах і холопом називається!"], "source": "Галицько-Волинський літопис, під 1250 р. (переклад-переказ, скорочено)", "comment": ["Восени 1245 р. ординський воєвода зажадав: «Дай Галич!». Щоб не віддати місто й не накликати нового погрому, Данило сам поїхав до Батия на Волгу, визнав владу хана й отримав **ярлик**.", "Літопис записав цю подію під **1250 р.**, але поїздка відбулася наприкінці 1245 — на початку 1246 р.", "__Слова з літопису:__ **кумис** — кисле кобиляче молоко; **холоп** — невільник; **честь татарська** — тут гірка іронія: ханська «ласка» принизлива."], "img": {"key": "batu_lantern", "cap": "Князь Данило в ставці Батия. Світлова картина (діапозитив) А. Земінова, поч. XX ст. Суспільне надбання"}}, {"type": "map", "title": "Особливості ординського панування", "steps": [{"key": "horde", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**Галичина й Волинь** — васальна держава: Данило мав **ярлик**, але зберіг владу й військо та сам вів зовнішню політику. Романовичі платили данину й ходили з Ордою в походи; постійних баскаків тут не було.", "**Київщиною** правили намісники ханських ставлеників: 1243 р. хан віддав Київ Ярославу Всеволодовичу, 1249 р. — Олександрові Невському. **Переяславщиною** порядкували ординські урядники.", "**Пониззя й Болохівщина** — «люди татарські»: громади самі визнали владу Орди й платили данину просто ханові. У **Бакоті** сидів **баскак** Мілій."], "imgs": []}, {"type": "defs", "title": "Західна політика Данила", "badges": [], "items": [{"name": "Угорщина", "paras": ["Після битви під Ярославом настав мир.", "Син **Лев** одружився з донькою Бели IV Констанцією."], "img": null}, {"name": "Австрія", "paras": ["**1252 р.** син **Роман** одружився з Гертрудою Бабенберг — спадкоємицею австрійських герцогів.", "Боротьбу за австрійський престол Романовичі програли."], "img": null}, {"name": "Литва", "paras": ["**1254 р.** Данило уклав мир із литовським князем **Міндовгом**.", "Син **Шварно** одружився з донькою Міндовга."], "img": null}, {"name": "Папа римський", "paras": ["Папа **Інокентій IV** обіцяв корону й хрестовий похід проти Орди.", "За це Данило мав визнати зверхність папи й погодитися на церковну унію."], "img": null}], "note": "Данило шукав на Заході союзників проти Орди. Одружуючи синів, він ріднився з правителями Угорщини, Австрії й Литви."}, {"type": "text", "kicker": "Між Ордою й Заходом", "title": "Коронація Данила (1253)", "badges": ["НМТ: дата"], "paras": ["Залежність від Орди Данило вважав тимчасовою. Папа **Інокентій IV** запропонував йому корону, сподіваючись на церковну унію й спільну боротьбу з монголами.", "**1253 р.** у **Дорогичині** папський посланець **Опізо** коронував Данила. Відтоді Данило — **король Русі** (rex Russiae), а його держава — **Королівство Руське**.", "Церковної унії так і не уклали, а обіцяного хрестового походу не було. Незабаром Данило розірвав стосунки з папою.", "Проте відтоді Європа визнавала його державу королівством, а її правителів — рівними іншим королям."], "imgs": [{"key": "coronation", "cap": "Папські посланці підносять Данилові корону. Гравюра кінця XIX ст., джерело не встановлено"}, {"key": "envoy", "cap": "Данило з матір’ю приймає папського посланця. Ілюстрація з видання «Галицкая Русь» (1905). Суспільне надбання"}]}, {"type": "text", "kicker": "Між Ордою й Заходом", "title": "Лев — знак Романовичів", "badges": [], "paras": ["Лева бачимо на печатках **Лева Даниловича** і **Юрія I**. Пізніше золотий лев, що спинається на скелю, на синьому полі став гербом Руської (Галицької) землі.", "Традиція пов’язує цей герб із Данилом, але прямих свідчень про герб самого Данила немає.", "Сьогодні лев є на гербах Львова й Львівської області, а синій і жовтий кольори цього герба перейшли в нашу національну символіку."], "imgs": [{"key": "coat", "cap": "Сучасна реконструкція герба: золотий лев на синьому полі. Фото: Wikimedia Commons, CC BY-SA 3.0"}, {"key": "lev_seal", "cap": "Лев на печатці Лева Даниловича (прорисовка). Фото: невідомий автор / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Між Ордою й Заходом", "title": "Відкрита боротьба з Ордою (1254 – 1259)", "badges": [], "paras": ["**1254 – 1255 рр.** Данило вигнав ординські загони з **Пониззя** й **Болохівщини** і повернув собі тамтешні міста.", "Ординський полководець **Куремса** кілька разів нападав на волинські міста, зокрема на **Кременець** і **Луцьк**, але взяти їх не зміг.", "**1258 – 1259 рр.** на Русь прийшов **Бурундай** із великим військом. Він змусив Романовичів розібрати укріплення Данилова, Луцька, Кременця, Львова й Володимира та йти з ним у походи на Литву й Польщу. Лише захисники **Холма** не відчинили Бурундаєві воріт, і місто вціліло.", "Звільнитися від Орди Данило не зміг: Захід не допоміг. Данило помер **1264 р.** у Холмі."], "imgs": [{"key": "kremenets", "cap": "Руїни замку на горі Бона в Кременці. Суспільне надбання"}]}, {"type": "map", "title": "Держава Данила Романовича (1238 – 1264)", "steps": [{"key": "danylo1", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**1238 р.** — Дорогичин і відновлення держави; **1239 – 1240 рр.** — Київ під владою Данила.", "**1245 р.** — перемога під Ярославом; **1253 р.** — коронація в Дорогичині.", "Резиденція — **Холм**; під **1256 р.** вперше згадано **Львів**.", "**Утрати:** Київ 1240 р. захопили монголи, а **Пониззя** перейшло під владу Орди. 1259 р. Бурундай змусив розібрати укріплення."], "imgs": []}]}, {"id": "s2", "num": "II", "title": "Нащадки Данила", "sub": "Лев Данилович, Володимир Василькович, Юрій I, Андрій і Лев II, Юрій II Болеслав, 1340 р.", "cover": {"key": "stnich", "cap": ""}, "cards": [{"type": "map", "title": "Поділ держави після смерті Данила (1264)", "steps": [{"key": "lev0", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**Лев** отримав Перемишльську й Белзьку землі зі Львовом.", "**Шварно** — Холм і Галич. 1267 – 1269 рр. він був і великим князем литовським.", "**Мстислав** — Луцьк. Волинь із Володимиром лишилася за братом Данила **Васильком**.", "У 1269 р. помер Шварно, і Лев об’єднав Галичину. Того ж року помер Василько, і Волинь перейшла до його сина **Володимира**."], "imgs": []}, {"type": "text", "kicker": "Нащадки Данила", "title": "Лев Данилович (бл. 1228 – бл. 1301)", "badges": ["НМТ: персоналія"], "paras": ["Лев, син Данила, змалку ходив із батьком у походи. Близько 1251 р. він одружився з угорською королівною **Констанцією**, донькою Бели IV. На його честь назвали **Львів**.", "Після смерті батька **1264 р.** Лев отримав Перемишль, Белз і Львів, а 1269 р., по смерті брата Шварна, став володарем усієї Галичини.", "Лев розбудовував **Львів** і зробив його своєю резиденцією. Він мріяв про краківський престол, а **1292 р.** приєднав **Люблінську землю**.", "Королівського титулу Лев, імовірно, не вживав. За однією з версій, він не хотів дратувати Орду.", "**Утрати:** Польща відвоювала Люблін близько 1302 р., а Литва після сварки з Левом почала зазіхати на північні землі держави."], "imgs": [{"key": "lev_dol", "cap": "Лев Данилович. Портрет роботи Луки Долинського, XVIII ст. Суспільне надбання"}]}, {"type": "text", "kicker": "Нащадки Данила", "title": "Лев Данилович: сусіди й Орда", "badges": ["НМТ: персоналія"], "paras": ["**Литва.** Лев сподівався успадкувати Литву, але князь Войшелк передав її Шварнові. У 1267 р. Лев убив Войшелка у Володимирі й назавжди посварився з литовцями.", "**Орда.** Лев не воював з Ордою, а ходив з ординцями в походи на Литву, Польщу й Угорщину й так здобував землі. Взимку **1287 р.** військо хана **Телебуги** поверталося з Польщі й зупинилося в Галичині та на Волині, і в краї почався голод.", "**Закарпаття.** За однією з версій, у 1280-ті рр. Лев оволодів частиною Закарпаття з Мукачевом. Історики досі про це сперечаються."], "imgs": [{"key": "lev_uzh", "cap": "Портрет князя Лева в Ужгородському замку. Фото: Markverona / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "map", "title": "Здобутки й утрати 1264 – 1340 рр.", "steps": [{"key": "lev1", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**Лев** приєднав до держави **Люблінську землю** (1292), а за однією з версій — і частину **Закарпаття**.", "Ці здобутки були нетривкими: Польща відвоювала Люблін на початку XIV ст.", "У **1320-ті рр.** **Берестейщина й Підляшшя** відійшли до Литви.", "Порівняйте з пунктиром — сучасним кордоном України."], "imgs": []}, {"type": "doc", "title": "Володимир Василькович (1269 – 1288)", "quote": ["Цей же благовірний князь Володимир ростом був високий, плечима широкий, лицем красивий, волосся мав жовте кучеряве, бороду стриг…", "Був же він ловець вправний і хоробрий, кроткий, смиренний, правдивий… книжник великий і філософ, якого не було в усій землі і по ньому не буде."], "source": "Галицько-Волинський літопис, під 1288 р. (переклад-переказ, скорочено)", "comment": ["Син Василька правив **Волинню** й, на відміну від Лева, уникав воєн. Він будував міста й замки, як-от **Кам’янець** із кам’яною вежею, зводив храми, переписував і дарував церквам книги.", "Бездітний Володимир заповів Волинь не Левові, а **Мстиславу Даниловичу**. Із Левом він не ладнав: Левів син Юрій навіть захопив Берестя.", "__Слова з літопису:__ **благовірний** — побожний; **ловець** — мисливець; **кроткий** — лагідний; **книжник** — освічена людина."], "img": {"key": "kamianets", "cap": "Кам’янецька вежа (Білорусь), збудована за Володимира Васильковича. Фото: Wikimedia Commons, CC BY-SA 2.0"}}, {"type": "text", "kicker": "Нащадки Данила", "title": "Юрій I Львович (1301 – 1308)", "badges": ["НМТ: персоналія"], "paras": ["Син Лева й онук Данила після смерті батька знову об’єднав **Галичину** й **Волинь**.", "Як і дід, Юрій називав себе **«королем Русі»**: це видно з напису на його печатці — «Печатка володаря Юрія, короля Русі». Столицею він зробив **Володимир**.", "У **1303 р.** константинопольський патріарх заснував **Галицьку митрополію**; першим митрополитом став Ніфонт. Київський митрополит перед тим переїхав на північ, до Володимира-на-Клязьмі. Власна митрополія давала Галичині й Волині церковну незалежність від північних сусідів.", "**Утрати:** Польща повернула собі **Люблінську землю**, а Закарпаття, якщо Лев ним справді володів, знову опинилося під владою Угорщини."], "imgs": [{"key": "yuri1_seal", "cap": "Печатка Юрія I з написом «S. DOMINI GEORGII REGIS RUSSIE» (прорисовка). Фото: Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "doc", "title": "Андрій і Лев II (1308 – 1323)", "quote": ["Два останні руські князі з того роду, які були для нас неподоланним щитом проти жорстокого племені татар, відійшли з цього світу, і з їхньою смертю нам і нашій землі загрожує велика небезпека від татар."], "source": "Лист польського короля Владислава Локетка до папи Іоанна XXII, 1323 р. (переклад-переказ)", "comment": ["Сини Юрія I правили разом: **Андрій** — переважно на Волині, **Лев II** — у Галичині. Вони називали себе «князями всієї Русі, Галича й Володимира».", "Проти Орди й Литви брати шукали союзу з **Тевтонським орденом** і Польщею. Литва тим часом забрала **Берестейщину й Підляшшя**.", "У **1323 р.** обидва князі загинули, можливо, у війні з ординцями. Рід Романовичів по чоловічій лінії обірвався. Польський король пише папі, що Польща втратила захист від Орди."], "img": null}, {"type": "text", "kicker": "Нащадки Данила", "title": "Юрій II Болеслав (1323/1325 – 1340)", "badges": ["НМТ: персоналія"], "paras": ["Після загибелі останніх Романовичів бояри запросили їхнього родича по матері — мазовецького князя **Болеслава**, сина Тройдена й Марії, доньки Юрія I. Католик Болеслав прийняв православ’я й ім’я Юрій.", "У грамоті **1335 р.** він назвав себе **«князем усієї Малої Русі»** (dux totius Russiae Minoris).", "Щоб обмежити владу бояр, Юрій II наближав до себе іноземців — німців, чехів, поляків — і давав їм посади. Містам він надавав **магдебурзьке право** (Сянок, 1339). Боярам це не подобалося.", "**Утрати:** Литва остаточно закріпилася на **Берестейщині** й **Підляшші**.", "У **1340 р.** бояри отруїли князя у **Володимирі**. З його смертю Галицько-Волинська держава перестала існувати."], "imgs": [{"key": "yuri2_seal", "cap": "Печатка Юрія II Болеслава, 1330-ті рр. Суспільне надбання"}]}, {"type": "map", "title": "Після 1340 р.: боротьба за спадщину", "steps": [{"key": "after1340", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**Волинь** дісталася литовському князю **Любарту Гедиміновичу**.", "У **Галичині** спершу правив боярин **Дмитро Детько**, але **1349 р.** її захопив польський король **Казимир III**.", "Війна за спадщину Романовичів тривала **1340 – 1392 рр.**; **1387 р.** Галичина остаточно ввійшла до складу Польщі. Докладніше — у наступній темі."], "imgs": []}, {"type": "table", "title": "Розпад держави: доля Галичини й Волині (1340 – 1387)", "rows": [["Роки", "Галичина", "Волинь"], ["1340 – 1349", "правили бояри на чолі з **Дмитром Детьком**; формально визнавали зверхність Польщі й Угорщини", "князь **Любарт Гедимінович** (Литва)"], ["1349 – 1352", "**Казимир III** захопив Галичину; війна Польщі з Литвою", "Польща тимчасово захопила частину Волині"], ["1352 – 1370", "у складі **Польщі** (за угодою 1352 р.)", "Любарт утримував Луцьк; за угодою 1366 р. Володимир, Холмщина й Белзщина відійшли до Польщі"], ["1370 – 1387", "Польщею й Угорщиною правив **Людовик Угорський**: Галичиною керував його намісник, з **1378 р.** — угорські урядники", "У 1370 р. Любарт повернув собі Володимир"], ["1387", "королева **Ядвіга** остаточно приєднала Галичину до **Польщі**", "Волинь — під владою Литви (до 1569 р.)"]]}, {"type": "defs", "title": "Чому занепала держава Романовичів", "badges": [], "items": [{"name": "Династія", "paras": ["У **1323 р.** обірвався рід Романовичів, у **1340 р.** загинув Юрій II."], "img": null}, {"name": "Бояри", "paras": ["Як і в 1205 – 1238 рр., бояри боролися за владу й позбувалися неугодних князів."], "img": null}, {"name": "Орда", "paras": ["Землі бідніли від данини й походів з ординцями, а князі нічого не вирішували без огляду на хана."], "img": null}, {"name": "Сусіди", "paras": ["Польща, Угорщина й Литва претендували на спадщину Романовичів."], "img": null}], "note": "**Значення:** понад 140 років після занепаду Києва українські землі мали власну державу. Романовичі продовжили справу Русі, а їхнє Королівство Руське було однією з європейських монархій."}]}, {"id": "s3", "num": "III", "title": "Суспільство й культура", "sub": "Верстви населення, господарство, літопис, пам’ятки з програми НМТ", "cover": {"key": "pant07", "cap": ""}, "cards": [{"type": "table", "title": "Суспільство Галицько-Волинської держави", "rows": [["Хто", "Становище", "Звідки знаємо"], ["Князь (король)", "Глава держави, суддя й воєначальник; Данило і Юрій I мали королівський титул", "літопис, печатки"], ["Бояри", "Великі землевласники; у Галичині — найсильніші на Русі, боролися за владу з князем", "літопис"], ["Духовенство", "Володіло землями, мало великий вплив; з 1303 р. — власна Галицька митрополія", "літопис, грамоти"], ["Міщани", "Ремісники й купці; у містах жили німці, вірмени, євреї, поляки; у XIV ст. — магдебурзьке право", "літопис, грамоти Юрія II"], ["Смерди", "Селяни — більшість населення; частина вільні общинники, частина залежні від землевласників", "«Руська правда», літопис"], ["Холопи", "Невільники: полонені, боржники, діти холопів", "«Руська правда»"]]}, {"type": "defs", "title": "Господарство й торгівля", "badges": [], "items": [{"name": "Земля", "paras": ["Основою господарства було **землеробство**: сіяли жито, пшеницю, овес, ячмінь; розводили худобу."], "img": null}, {"name": "Сіль", "paras": ["Головне багатство — **соляні промисли** Прикарпаття (Коломия, Перемишль, Дрогобич). Галицьку сіль вивозили на всю Русь."], "img": null}, {"name": "Торгівля", "paras": ["Вивозили сіль, віск, мед, хутра, худобу. Ввозили сукно, вино, зброю, прянощі й шовк.", "Центри — **Львів, Володимир, Холм, Галич**."], "img": null}, {"name": "Гроші й суд", "paras": ["Власних монет Романовичі не карбували: розплачувалися срібними **гривнями-зливками**, згодом — чеськими «празькими грошами».", "Судили за **«Руською правдою»**."], "img": null}], "note": "Галицькі купці торгували з Краковом, Торунем, Віднем, Угорщиною, а через Чорне море — з італійськими колоніями в Криму."}, {"type": "defs", "title": "Культура: особливості розвитку", "badges": [], "items": [{"name": "Спадок Русі", "paras": ["Культура Галицько-Волинської держави продовжувала **традиції Київської Русі**: та сама віра, писемна мова, тип храмів.", "Тут писали літопис і переписували книги."], "img": null}, {"name": "Західні впливи", "paras": ["Із сусідніх Польщі, Угорщини й Німеччини прийшов **романський стиль**: різьблені портали, білокам’яні стіни, як у церкві Св. Пантелеймона."], "img": null}, {"name": "Кам’яні фортеці", "paras": ["В інших землях Русі укріплення були дерев’яні, а тут будували **кам’яні замки й вежі**: Холм, Кременець, Кам’янець, Столп’я."], "img": null}, {"name": "Ікони", "paras": ["Іконописці працювали за візантійськими зразками, але додавали місцеві риси. Приклад — **Дорогобузька ікона**."], "img": null}], "note": "Пам’ятки культури, які треба знати для НМТ, — на наступних слайдах."}, {"type": "doc", "title": "Галицько-Волинський літопис", "quote": ["Почнемо ж розповідати про незчисленні раті, і великі труди, і часті війни, і многі крамоли, і часті повстання, і многі заколоти…", "[Половецький хан Сирчан послав співця до брата Отрока, що жив в Обезах:] «Заспівай йому половецьких пісень, а якщо не схоче вертатися — дай йому понюхати зілля, що зветься євшан». Той, понюхавши, заплакав і сказав: «Краще на своїй землі кістьми лягти, ніж на чужій славним бути»."], "source": "Галицько-Волинський літопис, початок (переклад-переказ, скорочено)", "comment": ["Літопис охоплює **1201 – 1292 рр.** і зберігся в складі **Іпатіївського літопису**. Він має дві частини: **галицьку**, складену переважно в Холмі, — про Данила, і **волинську** — про Володимира Васильковича.", "Мова літопису образна: яскраві описи битв, портрети князів, вставні оповіді, як-от про **євшан-зілля**.", "__Слова з літопису:__ **раті** — війни; **крамоли** — змови; **Обези** — Грузія; **євшан** — степовий полин."], "img": {"key": "ipat2", "cap": "Сторінка Іпатіївського списку літопису. Суспільне надбання"}}, {"type": "text", "kicker": "Пам’ятки НМТ", "title": "Успенський собор у Володимирі (1160 р.)", "badges": ["НМТ: пам’ятка"], "paras": ["Собор звів волинський князь **Мстислав Ізяславич** — батько Романа Мстиславича. Це найбільший давній храм Волині й **усипальниця князів**: тут, зокрема, поховали Володимира Васильковича.", "Храм шестистовпний, хрестово-купольний, збудований із **плінфи** — тонкої давньої цегли.", "У XVIII – XIX ст. собор занепав і стояв у руїнах. Таким, як тепер, він став після відбудови **1896 – 1900 рр.** — саме цей **сучасний вигляд** згадано в програмі НМТ.", "**Як упізнати:** світлі стіни, **один великий купол** на високому барабані, напівкруглі завершення фасадів (закомари)."], "imgs": [{"key": "usp", "cap": "Успенський собор, сучасний вигляд. Фото: Viacheslav Galievskyi / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "usp_ruins", "cap": "Руїни до відбудови, XIX ст. Суспільне надбання"}, {"key": "usp_1900", "cap": "Одразу після відбудови, поч. XX ст."}]}, {"type": "monument", "title": "Церква святого Пантелеймона (кінець XII ст.)", "badges": ["НМТ: пам’ятка"], "img": {"key": "pantel", "cap": "с. Шевченкове поблизу Галича. Фото: Raimond Spekking / Wikimedia Commons, CC BY-SA 4.0"}, "paras": ["Церква стоїть у селі **Шевченковому** поблизу Галича. Це **єдиний храм давнього Галича**, що зберігся до наших днів.", "Її збудували з **білого каменю** — місцевого вапняку, а не з цегли, як храми Києва.", "Помітні **романські (західні) впливи**: глибокий різьблений портал з арками, «вкладеними» одна в одну, напівколони на стінах.", "**Як упізнати:** світло-сірий кам’яний храм, **один купол**, великий арковий вхід на західному фасаді."]}, {"type": "monument", "title": "Холмська ікона Богородиці (XII ст.)", "badges": ["НМТ: пам’ятка"], "img": {"key": "kholm_full", "cap": "Холмська ікона Богородиці. Суспільне надбання"}, "paras": ["**Візантійська** ікона типу **«Одигітрія»** — Богородиця-Провідниця.", "Святиня **Холма** — міста, яке заснував Данило Романович. За переказом, ікону шанував сам король.", "У XX ст. ікона потрапила до Луцька; нині її зберігає **Музей волинської ікони**.", "**Як упізнати:** темна ікона в золотаво-коричневих тонах із **великими втратами фарби** — світлими смугами й плямами. Богородиця тримає Немовля, на дошці збереглися золоті накладки."]}, {"type": "monument", "title": "Дорогобузька ікона Богородиці (остання третина XIII ст.)", "badges": ["НМТ: пам’ятка"], "img": {"key": "dorog_icon", "cap": "Дорогобузька ікона Богородиці. Суспільне надбання"}, "paras": ["Ікона походить із **Дорогобужа** на Рівненщині — давнього міста Волинської землі. Це одна з найдавніших ікон, створених на Волині.", "Тип **«Одигітрія»**: Богородиця тримає Христа на лівій руці, а правою вказує на нього — «показує шлях».", "Волинський майстер писав за візантійським зразком, але додав місцеві риси.", "**Як упізнати:** Богородиця з Немовлям, зображена до пояса, теплі червоно-брунатні барви, великі темні очі.", "**Не сплутайте:** **Холмська** — XII ст., візантійська, темна, з великими втратами фарби. **Дорогобузька** — кінець XIII ст., волинська, з Немовлям."]}]}, {"id": "s4", "num": "IV", вич", "1301 – 1308", "об’єднав землі; столиця — Володимир; «король Русі»; митрополія **1303**", "Люблінська земля — до Польщі"], ["Андрій і Лев II", "1308 – 1323", "союз із Тевтонським орденом і Польщею", "Берестейщина й Підляшшя — до Литви"], ["Юрій II Болеслав", "1323/1325 – 1340", "«князь усієї Малої Русі»; іноземці при дворі; магдебурзьке право", "Литва закріпилася на Берестейщині; Юрія отруїли бояри"]]}, {"type": "defs", "title": "Поняття теми", "badges": ["НМТ: поняття"], "items": [{"name": "Ярлик (НМТ)", "paras": ["Ханська грамота на право князювати."], "img": null}, {"name": "Баскак (НМТ)", "paras": ["Ханський намісник, що наглядав за князями й збором данини."], "img": null}, {"name": "Інші поняття", "paras": ["**Золотоординське панування** — залежність руських земель від Орди.", "**Улус** — володіння хана.", "**Боярська олігархія** — влада найбагатших бояр."], "img": null}, {"name": "Церква", "paras": ["**Митрополія** — церковна область на чолі з митрополитом.", "Галицька митрополія — з **1303 р.**"], "img": null}], "note": null}, {"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Плутають", "Як правильно"], ["Коронація — 1253 чи 1254?", "Програма НМТ: **1253 р.**, Дорогичин; корону надіслав папа Інокентій IV"], ["Коронація = підкорення папі?", "Ні: унії не уклали, Данило не став васалом папи; мета — союз проти Орди"], ["Калка і Ярослав", "**1223** — Калка: поразка від монголів; **1245** — Ярослав: перемога над Ростиславом, угорцями й поляками"], ["Ярлик і баскак", "**Ярлик** — документ (грамота); **баскак** — людина (намісник)"], ["«Король Русі» — хто?", "**Данило** (коронований 1253) і **Юрій I** (титул на печатці); Юрій II — «князь усієї Малої Русі»"], ["Галицька митрополія", "**1303 р.**, за Юрія I, а не за Данила"], ["Дві ікони", "**Холмська** — XII ст., візантійська; **Дорогобузька** — остання третина XIII ст., волинська"]]}, {"type": "tl_events", "title": "Стрічка часу: події 1245 – 1340 рр.", "note": "Відстані між подіями однакові для

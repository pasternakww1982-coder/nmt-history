язя на Київ і Київську землю", "розпад єдиної держави, зростання самостійності бояр, втручання у внутрішні справи сусідніх держав", "відновлення державної єдності, намагання створити антимонгольську коаліцію європейських держав", "ослаблення золотоординської залежності, боротьба з Польщею й Литвою за Люблінську та Берестейську землі"], "ok": [0], "expl": "1199 – 1205 рр. — правління Романа Мстиславича: утворення держави й поширення його влади на Київ."}, {"id": "z-1702", "q": "Ім’я якого галицько-волинського князя пропущено в схемі?", "sec": "s2", "g": "", "t": "single", "img": ["q_f531a2c538"], "opts": ["Володимирко", "Ярослав", "Данило", "Юрій"], "ok": [2], "expl": "Сини Романа — Данило й Василько; сини Данила — Лев, Шварно, Мстислав."}, {"id": "z-6645", "q": "Зображену картосхему потрібно використовувати, характеризуючи боротьбу руських князів із", "sec": "s3", "g": "p1-s3:карта походів монголів", "t": "single", "img": ["q_a05be38670"], "opts": ["хозарами", "монголами", "печенігами", "половцями"], "ok": [1], "expl": "На картосхемі — битва на Калці й походи на руські землі: це боротьба з монголами."}, {"id": "z-6978", "q": "На картосхемі позначено Галицько-Волинську державу та князівства, залежні від неї, за правління", "sec": "s1", "g": "p1-s1:карта держави Романа", "t": "single", "img": ["q_20da0a42ba"], "opts": ["Ярослава Осмомисла", "Романа Мстиславовича", "Лева Даниловича", "Юрія ІІ Болеслава"], "ok": [1], "expl": "Держава із залежними Києвом і Переяславом — за Романа Мстиславича."}, {"id": "z-7876", "q": "Утворення князем Романом Мстиславовичем Галицько-Волинської держави відбулося наприкінці", "sec": "s1", "g": "", "t": "single", "opts": ["Х ст", "ХІ ст", "ХІІ ст", "ХІІІ ст"], "ok": [2], "expl": "1199 р. — кінець XII ст."}, {"id": "z-7922", "q": "Установіть послідовність подій, описаних в уривках з історичних джерел.", "sec": "s3", "g": "", "t": "seq", "opts": ["«Прийшли іноплемінники на Руську землю, половці многі. А Ізяслав, і Святослав, і Всеволод вийшли супроти них на р. Альту. І коли настала ніч, рушили вони одні проти одних. …і побігли руські князі, і перемогли половці…»", "«Прибули Святополк (Ізяславич), і Володимир (Всеволодович), і Давид Ігоревич, і Василько Ростиславич, і Давид Святославич, і брат його Олег, і зібралися в (городі) Любечі, щоб уладнати мир…»", "«І говорили (половці) руським князям: «Якщо ви не поможете нам, (то) ми нині порубані були, а ви завтра порубані будете…» І вирішили князі: «Лучче б нам зустріти їх на чужий землі, аніж на своїй»…»", "«У той же час поїхав був Данило в Угри до короля (Бели), бо він іще не чув про прихід татар на Київ. А коли Батий узяв Київ і почув він про Данила, що той в Уграх є, то рушив сам до (города) Володимира…»"], "expl": "Битва з половцями на Альті (1068) → Любецький з’їзд князів (1097) → половці просять допомоги проти татар (1223) → Данило в Угорщині під час облоги Києва (1240)."}, {"id": "z-8250", "q": "На землі яких князівств поширювалася влада князя Данила Романовича напередодні монгольської навали на Русь (1239 р.)?", "sec": "s2", "g": "p1-s2:володіння Данила 1239", "t": "three", "opts": ["Чернігівського", "Переяславського", "Новгород-Сіверського", "Волинського", "Галицького", "Володимиро-Суздальського", "Київського"], "ok": [3, 4, 6], "expl": "Перед навалою Данилові належали Волинь, Галичина й Київ."}, {"id": "z-9206", "q": "У битві на річці Калка (1223 р.) союзниками руських князів були", "sec": "s3", "g": "", "t": "single", "opts": ["хозари", "половці", "монголи", "печеніги"], "ok": [1], "expl": "На Калці руські князі виступили разом із половцями проти монголів."}, {"id": "z-9207", "q": "Що було спільного в правлінні князів Галицько-Волинської держави Романа Мстиславича та Данила Романовича?", "sec": "s2", "g": "", "t": "single", "opts": ["приборкання боярської опозиції", "розбудова Галицької митрополії", "боротьба з Тевтонським орденом", "створення антимонгольської коаліції"], "ok": [0], "expl": "І Роман, і Данило приборкували непокірних галицьких бояр."}, {"id": "z-12593", "q": "Які твердження характеризують діяльність галицько-волинського князя Романа Мстиславовича?", "sec": "s1", "g": "", "t": "three", "opts": ["керував героїчною обороною Києва від військ хана Батия", "проводив активну зовнішню політику", "звільнив галицько-волинські землі від монгольського ярма", "об’єднав галицькі та волинські землі в єдину державу", "поклав край зазіханням німецьких рицарів-хрестоносців на західноукраїнські землі", "був фактичним володарем Київського та Переяславського князівств", "переніс столицю Галицько-Волинської держави до міста Холм"], "ok": [1, 3, 5], "expl": "Роман Мстиславич об’єднав Галичину й Волинь (1199), контролював Київ і Переяслав (з 1201 – 1202 рр.), ходив на половців і втручався в польські справи."}, {"id": "z-15004", "q": "На картосхемі відображено основні напрямки завойовницьких походів", "sec": "s3", "g": "p1-s3:карта походів монголів", "t": "single", "img": ["q_a05be38670"], "opts": ["хозарів", "половців", "печенігів", "монголів"], "ok": [3], "expl": "Стрілки ведуть до Калки й на руські міста в різні роки — це походи монголів (1223, 1239 – 1240)."}, {"id": "z-15526", "q": "Який наслідок для Галицько-Волинського князівства мала загибель князя Романа Мстиславовича?", "sec": "s1", "g": "", "t": "single", "opts": ["зміна системи престолонаслідування", "установлення монгольського панування", "утрата контролю над Червенськими містами", "тимчасова втрата державної єдності земель"], "ok": [3], "expl": "Роман загинув 1205 р., синам Данилові й Василькові було 4 і 2 роки. Бояри, угорці й поляки розірвали державу, і єдність відновилася лише 1238 р."}, {"id": "z-16572", "q": "Утворення в 1199 р. Галицько-Волинської держави стало результатом", "sec": "s1", "g": "p1-s1:1199 – утворення держави (причина)", "t": "single", "opts": ["міжусобної боротьби руських князів", "об’єднання сил князів у боротьбі проти монголів", "виконання одного з рішень Любецького з’їзду князів", "боротьби Польщі та Угорщини за розширення своїх володінь"], "ok": [0], "expl": "Держава постала внаслідок боротьби князів за Галич: волинський князь Роман приєднав його до своїх володінь у 1199 р."}, {"id": "z-17459", "q": "Хто переміг у битві, описаній в уривку з історичного джерела: «Мстислав Мстиславович… повелів Данилові попереду перейти з полками річку Калку й іншим полкам [піти] за ним, а сам після нього перейшов… Мстислав же [Романович] і другий Мстислав [Святославович] сиділи в стані, не знавши [цього], тому що Мстислав [Мстиславович] їм обом [нічого] не сказав – через заздрість, бо велика незгода була між ними…»?", "sec": "s3", "g": "p1-s3:Калка — уривок", "t": "single", "opts": ["хозари", "половці", "монголи", "печеніги"], "ok": [2], "expl": "Уривок описує битву на Калці (1223): руські князі й половці зазнали поразки, переможцями були монголи."}, {"id": "z-18380", "q": "Про яку битву йдеться в уривку з історичного джерела:\n«Мстислав же Романович і другий Мстислав, Святославич, сиділи в [укріпленому таборі], не знаючи [цього], тому що Мстислав Удатний їм обом [нічого] не сказав – через зависть, бо велика незгода була межи ними… І сталася перемога татар над усіма князями руськими, якої ото не бувало ніколи. Татари ж перемогли руських князів за гріхи християн…»?", "sec": "s3", "g": "p1-s3:Калка — уривок", "t": "single", "opts": ["на річці Калці", "під Доростолом", "на річці Ворсклі", "під Оршею"], "ok": [0], "expl": "Мстислав Київський сидів в укріпленому таборі, а Мстислав Удатний не попередив його про бій — це битва на Калці."}, {"id": "z-19400", "q": "У якому князівстві родове боярство наважилося оголосити князем одного з бояр?", "sec": "s1", "g": "", "t": "single", "opts": ["Галицькому", "Волинському", "Переяславському", "Чернігово-Сіверському"], "ok": [0], "expl": "Лише в Галичині бояри наважилися проголосити князем боярина — Володислава Кормильчича (1213)."}, {"id": "z-22203", "q": "Землі яких князівств перебували під владою князя Данила Романовича напередодні монгольської навали (1239 р.)?", "sec": "s2", "g": "p1-s2:володіння Данила 1239", "t": "three", "opts": ["Київського", "Чернігівського", "Переяславського", "Новгород-Сіверського", "Волинського", "Галицького", "Полоцького"], "ok": [0, 4, 5], "expl": "Напередодні навали Данило володів Волинню (разом із Васильком), Галичиною та Києвом (з 1239 р. — через воєводу Дмитра)."}, {"id": "z-22212", "q": "Облогу якого міста монголами описано в уривку з історичного джерела:\n«І поставив Батий пороки під город коло воріт Лядських, і пороки безперестану били день і ніч. Вибили вони стіни, і вийшли городяни на розбиті стіни, і було тут видіти, як ламалися списи і розколювалися щити, [а] стріли затьмарили світ переможеним, і [воєвода] Дмитро поранений був…»?", "sec": "s3", "g": "p1-s3:облога Києва — уривок", "t": "single", "opts": ["Переяслава", "Володимира", "Чернігова", "Києва"], "ok": [3], "expl": "Лядські ворота — у Києві (облога 1240 р.)."}, {"id": "z-24896", "q": "Данило Романович здійснював правління Галицько-Волинською державою протягом", "sec": "s2", "g": "", "t": "single", "opts": ["1019-1054 рр", "1199-1205 рр", "1113-1125 рр", "1238-1264 рр"], "ok": [3], "expl": "Данило Романович правив об’єднаною державою з 1238 р. до смерті в 1264 р."}, {"id": "z-24918", "q": "Установіть послідовність подій, описаних в уривках із літописів.", "sec": "s3", "g": "", "t": "seq", "opts": ["«І пішов Святослав на греків, а ті вийшли проти Русі... І Русь приготувалася до бою, і була велика битва, і переміг Святослав, і побігли греки, і пішов Святослав до Царграда, воюючи і розорюючи міста...»", "«…І сталася жорстока січа, і ледве переміг Ярослав під вечір. Розбіглися печеніги врізнобіч і самі не знали, куди вони бігли. А деякі, тікаючи, потонули...»", "«...Прийшли половці перший раз на Руську землю воювати... Це було перше зло на Руській землі від поганих безбожних ворогів...»", "«…Татари пішли проти Русі й учинили жахливі вбивства в землі Русі, зруйнували міста й фортеці й повбивали людей, обложили Київ, який був столицею Русі, і після довгої облоги взяли його й убили жителів цього міста...»"], "expl": "Святослав іде на греків (971) → Ярослав розбиває печенігів (1036) → перший напад половців (1061) → монгольська навала (1240)."}, {"id": "z-35453", "q": "Встановлення монгольського (ординського) панування над руськими землями знаменувало початок монгольської доби в українській історії, що тривала впродовж", "sec": "s3", "g": "", "t": "single", "opts": ["середини ХІ – другої половини ХІІ ст", "кінця ХІІ – початку ХІІІ ст", "середини ХІІІ – середини XIV ст", "другої половини XIV – першої половини XV ст"], "ok": [2], "expl": "Монгольська доба — від навали (1240) до битви на Синіх Водах (1362), коли Литва витіснила Орду з більшості українських земель."}, {"id": "z-36017", "q": "Якою цифрою позначено князівство, у якому бояри активно втручалися у престолонаслідування князів?", "sec": "s1", "g": "", "t": "single", "img": ["q_2d19353536"], "opts": ["1", "2", "3", "4"], "ok": [2], "expl": "Цифрою 3 позначено Галицьке князівство: його бояри найактивніше втручалися в боротьбу за престол."}, {"id": "z-37990", "q": "На карті грубою лінією позначено межі Галицько-Волинської держави, штрихуванням — залежні від неї князівства. За якого правителя сформувалося таке територіальне становище?", "sec": "s1", "g": "p1-s1:карта держави Романа", "t": "single", "img": ["q_20da0a42ba"], "opts": ["за Ярослава Осмомисла", "за Романа Мстиславовича", "за Лева Даниловича", "за Юрія ІІ Болеслава"], "ok": [1], "expl": "Галицько-Волинська держава з підвладними Києвом і Переяславом — це становище за Романа Мстиславича (1199 – 1205)."}, {"id": "z-38461", "q": "На картосхемі відображено походи на руські землі", "sec": "s3", "g": "p1-s3:карта походів монголів", "t": "single", "img": ["q_a05be38670"], "opts": ["хозарів", "печенігів", "половців", "монголів"], "ok": [3], "expl": "На картосхемі — походи монголів 1223 і 1239 – 1240 рр. (Калка, Переяслав, Чернігів, Київ)."}, {"id": "z-38529", "q": "Про події якого року розповідає уривок із літопису?\n«І прибігло половців багато в Руську землю, і говорили вони руським князям: «Якщо ви не поможете нам – то ми нині порубані були, а ви завтра порубані будете» І була рада всіх князів в Києві, і нарадились вони так: «Лучче б нам зустріти їх на чужій землі, аніж на своїй».", "sec": "s3", "g": "p1-s3:Калка — уривок", "t": "single", "opts": ["1116 р", "1187 р", "1223 р", "1240 р"], "ok": [2], "expl": "Половці просять руських князів про допомогу проти татар — це 1223 р., перед битвою на Калці."}, {"id": "z-38759", "q": "Що було наслідком об’єднання князем Романом Мстиславовичем Галицького й Волинського князівств у єдину державу?", "sec": "s1", "g": "", "t": "single", "opts": ["формування нового центру політичного та економічного життя слов’ян", "відкриття шляху на Русь кочовим ордам Сходу", "вихід Русі на міжнародну арену, початок її дипломатичної діяльності", "розширення рівноправних зв’язків Русі з європейськими державами"], "ok": [0], "expl": "Об’єднання Галичини й Волині створило новий потужний центр політичного й економічного життя на південному заході Русі."}, {"id": "c-7fb48f", "q": "Діяльність князя Ярослава Осмомисла сприяла піднесенню:", "sec": "s1", "g": "", "t": "single", "opts": ["Волинського князівства", "Київського князівства", "Переяславського князівства", "Галицького князівства"], "ok": [3], "expl": "За Ярослава Осмомисла (1153 – 1187) Галицьке князівство досягло найбільшої могутності: його вплив сягав Дунаю."}, {"id": "c-8a41f9", "q": "Яке місто було захоплене і розорене монголами в 1240 р.?", "sec": "s3", "g": "", "t": "single", "opts": ["Чернігів", "Переяслав", "Київ", "Турів"], "ok": [2], "expl": "Київ здобули 6 грудня 1240 р."}, {"id": "c-efd8e1", "q": "Що стало передумовою тимчасової втрати в 1205 р. державної єдності Галицько-Волинського князівства?", "sec": "s2", "g": "", "t": "single", "opts": ["агресія Угорського та Польського королівств", "монгольська навала на землі Південно-Західної Русі", "змова галицьких бояр на чолі з боярином В. Кормильчичем", "загибель князя Романа Мстиславича в битві під Завихостом"], "ok": [3], "expl": "Після загибелі Романа під Завихостом (1205) його сини були малими, і бояри, угорці та поляки поділили державу."}, {"id": "c-d18c12", "q": "Що зумовило втрату князем Данилом Галицьким контролю над Києвом?", "sec": "s3", "g": "", "t": "single", "opts": ["розорення міста князем Андрієм Боголюбським", "монгольська навала і встановлення монгольського панування", "повстання киян і запрошення на княжіння Володимира Мономаха", "підпорядкування міста владі Великого князівства Литовського"], "ok": [1], "expl": "Київ належав Данилові з 1239 р., але в 1240 р. його здобули монголи, і місто опинилося під владою Орди."}, {"id": "c-e5c872", "q": "Що стало останнім центром опору Києва під час штурму міста монголами в 1240 р.?", "sec": "s3", "g": "", "t": "single", "opts": ["Десятинна церква", "Софійський собор", "Золоті ворота", "Києво-Печерська лавра"], "ok": [0], "expl": "Останні оборонці Києва зібралися в Десятинній церкві; під вагою людей вона обвалилася."}, {"id": "c-f29580", "q": "Який князь брав участь у битві з монголами на річці Калці?", "sec": "s3", "g": "p1-s3:Калка — уривок", "t": "single", "opts": ["Роман Мстиславич", "Ігор Святославич", "Данило Романович", "Володимир Глібович"], "ok": [2], "expl": "Данило Романович брав участь у битві на Калці 1223 р.; Роман на той час уже загинув (1205)."}, {"id": "c-7ce2e7", "q": "Унаслідок якої події відбулось об’єднання Галицького і Волинського князівств?", "sec": "s1", "g": "", "t": "single", "opts": ["походу волинського князя Романа Мстиславича на Галич", "походу галицького князя Ярослава Осмомисла на Володимир-Волинський", "битви під Ярославом", "битви на річці Калці"], "ok": [0], "expl": "У 1199 р. волинський князь Роман Мстиславич пішов на Галич і став галицьким князем — так постала Галицько-Волинська держава."}, {"id": "c-5b735b", "q": "Якого противника Данило Галицький так і не зміг подолати?", "sec": "s3", "g": "p1-s3:карта походів монголів", "t": "single", "opts": ["німецькими хрестоносцями", "монголами", "литовцями", "поляками та угорцями"], "ok": [1], "expl": "Данило Романович зазнав поразки від монголів на Калці (1223); хрестоносців, поляків і угорців він перемагав."}, {"id": "c-8cc289", "q": "Яка з названих подій передувала монгольській навалі на південно-західні землі Русі?", "sec": "s2", "g": "", "t": "single", "opts": ["відновлення єдності Галицько-Волинської держави під владою Данила і Василька Романовичів", "перемога Данила Галицького в битві під Ярославом над польськими й угорськими військами", "коронація Данила Галицького в місті Дорогочин", "поїздка Данила Галицького до хана Золотої Орди"], "ok": [0], "expl": "Данило й Василько відновили єдність держави у 1238 р., а монгольська навала на південно-західні землі почалася 1239 – 1240 рр. Решта подій — 1245 і 1253 рр."}, {"id": "c-4fe403", "q": "Утворення Галицько-Волинської держави в 1199 р. відбулося в результаті:", "sec": "s1", "g": "p1-s1:1199 – утворення держави (причина)", "t": "single", "opts": ["боротьби Польщі та Угорщини за розширення своїх володінь", "міжусобної боротьби давньоруських князів", "виконання одного з рішень Любецького з’їзду князів", "об’єднання сил князів у боротьбі проти половців"], "ok": [1], "expl": "Роман Мстиславич здобув Галич після смерті останнього з Ростиславичів — це наслідок боротьби руських князів за столи, а не рішення з’їзду чи тиску сусідів."}, {"id": "c-839196", "q": "На фрагменті картосхеми позначено напрямки походів:", "sec": "s3", "g": "p1-s3:карта походів Батия", "t": "single", "img": ["q_bba68e3c3e"], "opts": ["київського князя Володимира Великого на Волинь і Галичину", "переяславського князя Володимира Мономаха проти половців", "монгольського хана Батия на землі південно-західної Русі", "литовського князя Ольгерда на землі Київської Русі та Польщі"], "ok": [2], "expl": "Стрілки 1239 – 1241 рр. ведуть через Переяслав, Чернігів, Київ, Волинь і Галичину до Польщі й Угорщини — це походи Батия."}, {"id": "c-36cc82", "q": "В уривку з джерела йдеться\n«...Татари пішли проти Русі і вчинили жахливі вбивства в землі Русі, зруйнували міста та фортеці і повбивали людей, обложили Київ, який був столицею Русі, і після тривалої облоги взяли його і вбили жителів цього міста; це місто було великим і дуже багатолюдним, а тепер... ледве чи є тепер там двісті будинків, а людей тих вони тримають у найтяжчому рабстві»", "sec": "s3", "g": "", "t": "single", "opts": ["про наслідки монгольської навали", "про причини монгольської навали", "про передумови монгольської навали", "про мету монгольської навали"], "ok": [0], "expl": "Автор описує зруйновані міста, загиблих і спорожнілий Київ — це наслідки навали."}, {"id": "c-9e0075", "q": "Про яку битву йдеться в уривку з джерела?\n«Була рада всіх князів у місті Києві, і вирішили на раді так: \n“Краще нам зустріти їх на чужій землі, ніж на своїй”. На раді були \nМстислав Романович київський, Мстислав козельський і чернігівський і Мстислав Мстиславич галицький — вони були старійшими князями Руської землі».", "sec": "s3", "g": "p1-s3:Калка — уривок", "t": "single", "opts": ["під Дорогочином", "на річці Калці", "під Ярославом", "на річці Альті"], "ok": [1], "expl": "Рада князів у Києві вирішила йти назустріч татарам у степ — так почався похід, що завершився битвою на Калці (1223)."}, {"id": "c-4365ce", "q": "Про облогу монголами якого міста йдеться в уривку історичного джерела?\n«І поставив Батий пороки під город коло воріт Лядських, і пороки безперестанку били день і ніч. Вибили вони стіни, і вийшли городяни на розбиті стіни, і було тут видіти, як ламалися списи і розколювалися щити, [а] стріли затьмарили світ переможеним, і [воєвода] Дмитро поранений був…»", "sec": "s3", "g": "p1-s3:облога Києва — уривок", "t": "single", "opts": ["Переяслава", "Чернігова", "Києва", "Володимира"], "ok": [2], "expl": "Лядські ворота — у Києві; Батий бив стіни пороками саме біля них (1240)."}, {"id": "c-1296dd", "q": "Ім’я якого історичного діяча пропущене в  уривку з джерела?\n«На ріці Калці татари встріли їх, війська половецькі і руські... ___ поранений був у груди. Але через молодість і одвагу він не чув ран, що були на тілі його... Був бо він сміливий і хоробрий, од голови й до ніг його не було на нім вади... Кріпко вони билися, але інші полки татарські зітнулися з ними, і за гріхи наші руські полки було переможено».", "sec": "s3", "g": "p1-s3:Калка — уривок", "t": "single", "opts": ["Ізяслав Ярославич", "Володимир Мономах", "Роман Мстиславич", "Данило Романович"], "ok": [3], "expl": "На Калці (1223) був поранений молодий Данило Романович, але бою не покинув — літописець хвалить його відвагу."}, {"id": "c-6f3a49", "q": "Які особливості мало суспільно-політичне життя  Галицького князівства в 12 ст.?\n1 Цілковита залежність від Києва, спричинена географічною близькістю.\n2 Більша, порівняно з іншими князівствами, сила та впливовість місцевого боярства, яке часто вступало в боротьбу з князями.\n3 Об’єднання князівства, пов’язане з правлінням Володимирка Володаревича, який був першим одноосібним правителем.\n4 Розквіт князівства за правління Данила Романовича.\n5 Столиця князівства, залишаючись резиденцією митрополитів, була на ті часи й одним з найбільших європейських міст.", "sec": "s1", "g": "", "t": "single", "opts": ["1, 5", "2, 3", "3, 4", "2, 5"], "ok": [1], "expl": "Галичина була віддалена від Києва, мала сильне й багате боярство, яке втручалося у справи князів, і вигідне положення на торговельних шляхах."}, {"id": "c-685a81", "q": "До якого князя звертається автор «Слова о полку Ігоревім»?\n«Високо сидиш ти на своїм золотокованім престолі, підперши гори угорські своїми залізними полками…»", "sec": "s1", "g": "", "t": "single", "opts": ["великого князя київського Володимира Мономаха", "новгород-сіверського князя Ігоря Святославича", "волинського князя Романа Мстиславича", "галицького князя Ярослава Осмомисла"], "ok": [3], "expl": "«Підперши гори угорські своїми залізними полками» — звернення автора «Слова о полку Ігоревім» до галицького князя Ярослава Осмомисла (1153 – 1187)."}, {"id": "c-ca3cde", "q": "Коли відбулися події, про які йдеться в уривку з джерела?\n«У той же рік прийшов Батий до Києва з великою силою, многим-множеством сили своєї, і окружив город. I обступила Київ сила татарська, і був город в облозі великій. І пробував Батий коло города, а вої його облягали город. І не було чути нічого од звуків скрипіння возів його, ревіння безлічі верблюдів його, і од звуків іржання стад коней його, і сповнена була земля Руська ворогами».", "sec": "s3", "g": "p1-s3:облога Києва — уривок", "t": "single", "opts": ["1199 р.", "1223 р.", "1240 р.", "1340 р."], "ok": [2], "expl": "Облога Києва військом Батия — листопад–грудень 1240 р."}, {"id": "c-a62012", "q": "Створення якої пам’ятки збіглося в часі з правлінням Ярослава Осмомисла?", "sec": "s1", "g": "", "t": "single", "opts": ["Реймське Євангеліє", "«Повість минулих літ»", "«Слово о полку Ігоревім»", "Галицько-Волинський літопис"], "ok": [2], "expl": "«Слово о полку Ігоревім» розповідає про похід 1185 р.; Ярослав Осмомисл правив у Галичі 1153 – 1187 рр. і згаданий у творі."}, {"id": "c-1650c1", "q": "Установіть послідовність завоювання монголами південно-західних земель Русі", "sec": "s3", "g": "p1-s3:послідовність навали", "t": "seq", "opts": ["Переяславське князівство", "Чернігівське князівство", "Київське князівство", "Галицько-Волинська держава"], "expl": "Переяслав — березень 1239, Чернігів — жовтень 1239, Київ — грудень 1240, Галичина й Волинь — зима 1240 – 1241 рр."}, {"id": "c-970b4b", "q": "Який чинник сприяв утворенню й зростанню Галицько-Волинської держави?", "sec": "s1", "g": "", "t": "single", "opts": ["віддаленість земель від перехрестя основних торговельних шляхів", "спроби галицької боярської опозиції втручатися в державні справи", "загострення взаємин між князями і посилення князівських усобиць", "менший вплив центральної влади внаслідок віддаленості від Києва"], "ok": [3], "expl": "Віддаленість від Києва послаблювала вплив великого князя, а від степу князівства захищали ліси й гори — це сприяло піднесенню Галичини й Волині."}]}, "2": {"n": 20, "pass": 75, "timer": true, "quota": {"s1": 10, "s2": 7, "s3": 3}, "pool": [{"id": "z-804", "q": "Установіть відповідність між іменами князів та періодами їхнього правління.", "sec": "s2", "g": "", "t": "match", "left": ["Володимир Великий", "Данило Галицький", "Ярослав Мудрий", "Олег"], "opts": ["882–912 рр.", "980–1015 рр.", "1019–1054 рр.", "1113–1125 рр.", "1238–1264 рр."], "ok": [1, 4, 2, 0], "expl": "Олег — 882 – 912; Володимир — 980 – 1015; Ярослав Мудрий — 1019 – 1054; Данило — 1238 – 1264."}, {"id": "z-1585", "q": "У боротьбі з якою державою Папа Римський Інокентій IV обіцяв надати допомогу князеві Данилу Галицькому?", "sec": "s1", "g": "p2-s1:папа — проти кого", "t": "single", "opts": ["Тевтонським орденом", "Золотою Ордою", "Великим князівством Литовським", "Польським королівством"], "ok": [1], "expl": "Папа Іннокентій IV обіцяв Данилові допомогу проти Золотої Орди."}, {"id": "z-1746", "q": "Установіть послідовність подій давньоруської історії XII—XIV ст.", "sec": "s2", "g": "", "t": "seq", "opts": ["Утворення Галицько-Волинського князівства.", "Захоплення Києва монголами.", "Коронація Данила Романовича.", "Створення Галицької митрополії."], "expl": "Утворення держави (1199) → Київ здобуто (1240) → коронація Данила (1253) → Галицька митрополія (1303)."}, {"id": "z-1760", "q": "Галицьку православну митрополію було створено за ініціативи князя", "sec": "s2", "g": "p2-s2:Галицька митрополія", "t": "single", "opts": ["Ярослава Мудрого", "Данила Галицького", "Лева Даниловича", "Юрія І Львовича"], "ok": [3], "expl": "Галицька митрополія — близько 1303 р., за Юрія І Львовича."}, {"id": "z-4943", "q": "Головне завдання зовнішньої політики князя Данила Галицького в другій половині 40—60-х рр. XIII ст. полягало в", "sec": "s1", "g": "p2-s1:створенні коаліції європейських держав д", "t": "single", "opts": ["розширенні території держави за рахунок володінь Угорщини", "здобутті великокнязівського столу в Литві для свого сина Лева", "укладенні союзу з Польщею для відсічі агресії Тевтонського ордену", "створенні коаліції європейських держав для боротьби із Золотою Ордою"], "ok": [3], "expl": "Головне завдання Данила після 1245 р. — союз європейських держав проти Золотої Орди."}, {"id": "z-6980", "q": "На фото зображено", "sec": "s3", "g": "", "t": "single", "img": ["q_67f7812b7c"], "opts": ["ікону Успіння Богородиці маляра О. Горошковича", "Дорогобузьку ікону Богородиці", "Вишгородську ікону Богородиці", "Холмську ікону Богородиці"], "ok": [2], "expl": "Вишгородська ікона: Немовля притулилося щокою до Богородиці («Розчулення»). Її вивезено з Вишгорода у Володимир-на-Клязьмі."}, {"id": "z-7026", "q": "Які держави були головними суперниками в боротьбі за галицько-волинську спадщину в ХІV-ХV ст.?", "sec": "s2", "g": "", "t": "three", "opts": ["Велике князівство Литовське", "Королівство Польща", "Велике князівство Московське", "Золота Орда", "Кримське ханство", "Королівство Угорщина", "Османська імперія"], "ok": [0, 1, 5], "expl": "За галицько-волинську спадщину змагалися Литва (Любарт), Польща (Казимир III) і Угорщина."}, {"id": "z-8204", "q": "Пріоритет у зовнішній політиці князя Данила Романовича Галицького в другій половині 1240-х - 1260-х рр. полягав у", "sec": "s1", "g": "p2-s1:створенні коаліції європейських держав д", "t": "single", "opts": ["здобутті великокнязівського столу в Литві для свого сина Лева", "зміцненні союзу з Польщею для відсічі агресії Тевтонського ордену", "створенні коаліції європейських держав для боротьби із Золотою Ордою", "розширенні території держави за рахунок володінь Угорщини"], "ok": [2], "expl": "Після 1245 р. пріоритетом Данила була антиординська коаліція в Європі."}, {"id": "z-10248", "q": "Прочитайте уривок з історичного джерела та виконайте завдання.\n«З поданого до нас прохання цього короля ми недавно довідалися, що коли… народ русинів за допомогою отрути вбив Болеслава, князя Русі.., тоді король, вражений цим злочином і прагнучи помститися за кривду християнської віри, напав на Руську землю, щоб завоювати цей народ, який і йому самому завдав багато шкоди…» \nУривок документа дає змогу визначити", "sec": "s2", "g": "p2-s2:булла про 1340 р.", "t": "single", "opts": ["перебіг і результат польської агресії в Галичині", "привід і причину загарбання Польщею Галичини", "масштаби та наслідки нападу Польщі на Галичину", "перебіг агресивних дій і реакцію населення Галичини"], "ok": [1], "expl": "Папська булла пояснює: убивство Болеслава (Юрія ІІ) стало приводом, а прагнення Польщі здобути Галичину — причиною походу."}, {"id": "z-10270", "q": "Установіть послідовність подій, наведених в уривках з історичних джерел.", "sec": "s1", "g": "", "t": "seq", "opts": ["«Була рада всіх князів у місті Києві, і вирішили на раді так: “Краще нам зустріти їх на чужій землі, ніж на своїй”. На раді були Мстислав Романович київський, Мстислав козельський і чернігівський і Мстислав Мстиславич галицький – вони були старійшими князями Руської землі…»", "«...Того літа татари взяли Переяславль і єпископа вбили, і людей перебили, а місто спалили і, захопивши багато людей і майна, пішли... Того ж літа взяли татари Чернігів... і місто спалили...»", "«Поставив Батий стінобитні гармати у міста біля Лядських воріт... Знаряддя били безперестанку день і ніч і пробили стіни... Коли [воєвода] Дмитро був поранений, татари ввійшли на стіни і займали їх у той день і в ту ніч... Городяни ж побудували нову стіну біля церкви Богородиці Десятинної... І взято було місто... Дмитра ж татари взяли в полон пораненим і не вбили заради його хоробрості…»", "«...[князь] Михайло [чернігівський] відправився на уклін до Батия, вони заставили його пройти між двома огнями, після вони сказали, щоб він поклонився... Той [князь] відповів, що з охотою поклониться Батию, але не поклониться ідолу, бо християнину це не подобає... Краще вмерти, ніж зробити те, що не подобає...»"], "expl": "Рада князів у Києві (1223, Калка) → взяття Переяслава (1239) → облога Києва (1240) → загибель Михайла Чернігівського в Орді (1246)."}, {"id": "z-12132", "q": "Терміни «ярлик» і «баскак» потрібно використовувати, характеризуючи наслідки походів на Русь", "sec": "s1", "g": "", "t": "single", "opts": ["варягів", "хозарів", "монголів", "печенігів"], "ok": [2], "expl": "Ярлик і баскак — терміни ординського панування, що настало після монгольських походів."}, {"id": "z-12591", "q": "Розташуйте події в хронологічній послідовності.", "sec": "s1", "g": "p1-s3:послідовність навали", "t": "seq", "opts": ["битва русько-половецьких військ з монголами на р. Калка", "розорення монголами Переяслава та Чернігова", "облога та розорення Києва військами хана Батия", "спустошення монгольськими ордами Галицько-Волинської держави"], "expl": "Калка (1223) → Переяслав і Чернігів (1239) → Київ (1240) → Галичина й Волинь (1241)."}, {"id": "z-13841", "q": "Що в історії Галицько-Волинської держави пов’язано з діяльністю Лева Даниловича?", "sec": "s2", "g": "p2-s2:Лев Данилович — три з семи", "t": "three", "opts": ["сприяння переселенню іноземних колоністів", "перенесення столиці своїх володінь до Львова", "створення окремої Галицької митрополії", "визнання зверхності Золотої Орди", "прийняття титулу «короля Русі»", "підтримка католицької церкви", "приєднання до князівства Закарпаття та Люблінської землі"], "ok": [1, 3, 6], "expl": "Лев переніс столицю до Львова, визнавав зверхність Орди й ходив з нею в походи, приєднав Люблінську землю (і, за однією з версій, Закарпаття)."}, {"id": "z-15546", "q": "З’ясуйте, кому з князів належить наведений факт біографії.", "sec": "s2", "g": "", "t": "match", "left": ["Данило Романович", "Лев Данилович", "Юрій I Львович", "Юрій II Болеслав"], "opts": ["приєднав до Галицько-Волинської держави Закарпаття й Люблінську землю", "сприяв зміцненню позиції католицької церкви на українських землях", "здійснив низку успішних походів проти печенігів", "домігся створення окремої Галицької митрополії православної церкви", "зупинив просування на українські землі тевтонських рицарів-хрестоносців"], "ok": [4, 0, 3, 1], "expl": "Данило — хрестоносці під Дорогичином; Лев — Люблін і Закарпаття; Юрій І — Галицька митрополія; Юрій ІІ — католики й іноземці."}, {"id": "z-15549", "q": "Установіть послідовність появи понять і термінів в історії Русі-України (IX–XIII ст.).", "sec": "s1", "g": "", "t": "seq", "opts": ["«полюддя»", "«погости»", "«вотчина»", "«ярлик»"], "expl": "Полюддя (Х ст.) → погости (реформа Ольги) → вотчина (з XI ст.) → ярлик (з 1240-х рр.)."}, {"id": "z-16594", "q": "Установіть послідовність правління князів Галицько-Волинської держави.", "sec": "s2", "g": "", "t": "seq", "opts": ["Роман Мстиславич", "Данило Галицький", "Юрій І Львович", "Юрій II Болеслав"], "expl": "Роман (1199 – 1205) → Данило (1238 – 1264) → Юрій І (1301 – 1308) → Юрій ІІ Болеслав (1325 – 1340)."}, {"id": "z-17460", "q": "Галицьку митрополію православної церкви утворено за ініціативи галицько-волинського князя", "sec": "s2", "g": "p2-s2:Галицька митрополія", "t": "single", "opts": ["Юрія І Львовича", "Лева Даниловича", "Данила Романовича", "Романа Мстиславовича"], "ok": [0], "expl": "Галицьку митрополію утворено близько 1303 р. на прохання Юрія І Львовича."}, {"id": "z-18400", "q": "Увідповідніть подію з її наслідком.", "sec": "s1", "g": "p2-s1:подія — наслідок (відповідність)", "t": "match", "left": ["похід князя Аскольда на Константинополь", "розгром князем Святославом Хозарського каганату", "об’єднання князем Романом Мстиславовичем Галицького та Волинського князівств у єдину державу", "похід на Русь монгольських орд Батия"], "opts": ["руйнування міст, занепад ремесел та торгівлі на Русі", "формування нового центру суспільно-політичного та економічного життя Русі", "відкриття шляху на Русь кочовим ордам Сходу", "вихід Русі на міжнародну арену, початок її дипломатичної діяльності", "розширення рівноправних зв’язків Русі з європейськими державами"], "ok": [3, 2, 1, 0], "expl": "Аскольд — вихід Русі на міжнародну арену; розгром Хозарії — відкрито шлях кочовикам; Роман — новий центр; Батий — руйнування міст."}, {"id": "z-19420", "q": "Установіть відповідність між датою та подією, описаною в уривку джерела.", "sec": "s1", "g": "p2-s1:корона від папи — уривок", "t": "match", "left": ["1223 р.", "1238 р.", "1245 р.", "1253 р."], "opts": ["«Данило вийшов з військом із Холма та на третій день став у Галичі... увійшов у свій город... та прийняв стіл батька, та проголосив перемогу, заткнувши свою хоругву на Німецьких воротах...»", "«У той же час прислав Папа послів достойних, що принесли Данилові вінець, і скіпетр, і корону, які означають королівський сан, кажучи: “Сину! Прийми од нас вінець королівства...”»", "«На річці Калці татари встріли їх, війська половецькі й руські. Мстислав Мстиславич тим часом повелів Данилові попереду перейти з полками річку Калку... Коли зітнулися війська між собою, то Данило виїхав наперед... Ударили вони в полки татарські... Данило поранений був у груди...»", "«І коли побачив Данило, що ляхи кріпко йдуть на Василька.., то рушив на [них]... і розтрощив військо [ляхів], і хоругов [їхніх] роздер навпіл. Побачивши ж це, Ростислав побіг, і повернули угри навтікача...»", "«У той же час поїхав був Данило в Угри до короля (Бели), бо він іще не чув про прихід татар на Київ. А коли Батий узяв Київ і почув він про Данила, що той в Уграх є, то рушив сам до (города) Володимира...»"], "ok": [2, 0, 3, 1], "expl": "Калка — 1223; повернення Галича — 1238; Ярослав — 1245; корона від папи — 1253."}, {"id": "z-20687", "q": "У 1245 році відбулася битва біля", "sec": "s1", "g": "", "t": "single", "opts": ["міста Ярослава", "річки Калки", "міста Орші", "річки Сині Води"], "ok": [0], "expl": "У 1245 р. Данило й Василько перемогли під містом Ярославом на Сяні."}, {"id": "z-22077", "q": "Установіть відповідність між подіями та їхніми наслідками.", "sec": "s1", "g": "p2-s1:подія — наслідок (відповідність)", "t": "match", "left": ["Розгром князем Святославом Хозарського каганату.", "Запровадження християнства як державної релігії Київської Русі.", "Похід на Русь орд хана Батия.", "Об’єднання князем Романом Мстиславовичем Галицького та Волинського князівств в єдину державу."], "opts": ["Руйнування міст, занепад ремесла і торгівлі на Русі.", "Формування нового центру політичного та економічного життя слов’ян.", "Відкриття шляху на Русь кочовим ордам Сходу.", "Вихід Русі на міжнародну арену, початок її дипломатичної діяльності.", "Розширення рівноправних зв’язків Русі з європейськими державами."], "ok": [2, 4, 0, 1], "expl": "Розгром Хозарії відкрив шлях кочовикам; хрещення розширило зв’язки з Візантією; Батий — руйнування міст; Роман — новий центр."}, {"id": "z-22155", "q": "Про які події йдеться в уривку з історичного джерела?\n«…опір полякам завдало лише одне місто, Холм, інші ж міста...не були укріплені і тому були зайняті Казимиром без бою...»", "sec": "s2", "g": "", "t": "single", "opts": ["поділ галицько-волинської спадщини між Польщею та Литвою", "боротьбу Данила Галицького проти польсько-угорської агресії", "утворення Галицько-Волинської держави", "приєднання Галичини до Угорського королівства"], "ok": [0], "expl": "Казимир III займає галицькі міста після смерті Юрія ІІ (1340) — початок боротьби Польщі й Литви за галицько-волинську спадщину."}, {"id": "z-22871", "q": "В уривку з історичного джерела «[Князь Лев] захотів собі частини в землі Польській… Поїхав до Ногая окаянного проклятого. [Просити] допомоги для себе в поході проти Ляхів...» ідеться про союзників галицько-волинського князя –", "sec": "s2", "g": "", "t": "single", "opts": ["хазарів", "монголів", "печенігів", "половців"], "ok": [1], "expl": "Лев Данилович ходив на Польщу разом з ордою Ногая — монголи (татари) були його союзниками."}, {"id": "z-23838", "q": "«Що мені вінець, коли татари лютують!», – так відповів на чергову пропозицію коронуватися посланцям Папи Римського", "sec": "s1", "g": "p2-s1:данило романович", "t": "single", "opts": ["Ярослав Осмомисл", "Роман Мстиславович", "Данило Романович", "Володимир Мономах"], "ok": [2], "expl": "Данило не поспішав коронуватися: корона без реальної допомоги проти татар мала мало сенсу. Прийняв її 1253 р."}, {"id": "z-32141", "q": "Який термін доречно використовувати, характеризуючи залежність руських князівств від Золотої Орди?", "sec": "s1", "g": "p2-s1:ярлик", "t": "single", "opts": ["«ярлик»", "«вотчина»", "«холоп»", "«магдебурзьке право»"], "ok": [0], "expl": "Ярлик — ханська грамота, без якої князь не міг правити: головний знак залежності від Орди."}, {"id": "z-34343", "q": "Пріоритет у зовнішній політиці князя Данила Романовича в другій половині 1240-х – 1260-х рр. полягав у", "sec": "s1", "g": "p2-s1:створенні коаліції європейських держав д", "t": "single", "opts": ["розширенні території держави за рахунок володінь Угорського королівства", "здобутті великокнязівського столу у Великому князівстві Литовському для свого сина Лева", "зміцненні союзу з Королівством Польським для відсічі агресії Тевтонського ордену", "створенні коаліції європейських держав для боротьби із Золотою Ордою"], "ok": [3], "expl": "Від кінця 1240-х рр. Данило шукав союзу з папою, Угорщиною, Польщею, Литвою для боротьби з Ордою."}, {"id": "z-36438", "q": "На якому фото зображено пам’ятку архітектури, що стала усипальницею галицько-волинського князя Романа Мстиславовича?", "sec": "s3", "g": "", "t": "single", "img": ["q_453564f477"], "opts": ["А", "Б", "В", "Г"], "ok": [2], "expl": "Роман Мстиславич похований в Успенському соборі у Володимирі (фото В). А — Спасо-Преображенський собор у Чернігові, Б — Софія Київська, Г — Михайлівський Золотоверхий."}, {"id": "z-36484", "q": "Яка історична подія стала нагодою для карбування зображеної пам’ятної монети?", "sec": "s1", "g": "", "t": "single", "img": ["q_dd44153115"], "opts": ["прихід до влади Ярослава Осмомисла", "коронація Данила Романовича", "об’єднання Галицького й Волинського князівств Романом Мстиславичем", "утворення антиординської коаліції"], "ok": [1], "expl": "Монету «Галицьке королівство» випущено на честь коронації Данила Романовича (1253)."}, {"id": "z-36537", "q": "Позначте назву держави, у боротьбі з якою папа Римський Інокентій IV обіцяв надати допомогу князеві Данилу Галицькому.", "sec": "s1", "g": "p2-s1:папа — проти кого", "t": "single", "opts": ["Тевтонський орден", "Золота Орда", "Велике князівство Литовське", "Польське королівство"], "ok": [1], "expl": "Папа Іннокентій IV обіцяв допомогу проти Золотої Орди."}, {"id": "z-38093", "q": "Упорядкуйте за хронологією військово-політичні заходи Данила Романовича, описані в уривках з історичних джерел.", "sec": "s1", "g": "", "t": "seq", "opts": ["«…Данило сказав: \"Не гожим є держати отчину нашу крижевникам-тамплієрам |рицарям-хрестоносцям|\". І пішли вони на них з великою силою, узяли город |Дорогичин| місяця березня, і старійшину |магістра| їхнього Брауна схопили, і воїнів захопили, і вернулися обидва у Володимир…»", "«Данило тим часом поїхав на |Ростислава Мстиславича|, і схопив його, і зоставив у нім |Києві, тисяцького| Дмитра. І оддав він Київ у руки Дмитрові, |щоб| удержати |город| проти іноплемінних народів, безбожних татар…»", "«Тим часом |хан| Могучий прислав до Данила й Василька посла свого зі словами: \"Дай Галич!\" І |Данило| був у печалі великій, тому що не укріпив він був землі своєї городами. І, порадившись з братом своїм, поїхав він до Батия, кажучи: \"Не дам півотчини своєї, а їду до Батия сам…»", "«У той же час прислав Папа послів достойних, що принесли Данилові вінець, і скіпетр, і корону, які означають королівський сан, кажучи: \"Сину! Прийми од нас вінець королівства… Ти матимеш поміч од Папи\"…»"], "expl": "Дорогичин (1238) → Ярослав (1245) → вимога Могучого (1245) → корона від папи (1253)."}, {"id": "z-38547", "q": "Доберіть до зображення поштової марки (1–4) літописний уривок (А – Д).", "sec": "s1", "g": "", "t": "match", "img": ["q_ba39046cd7"], "left": ["Марка 1", "Марка 2", "Марка 3", "Марка 4"], "opts": ["«…прислав папа послів достойних, що принесли вінець, і скіпетр, і корону, які означають королівський сан, кажучи: «Сину! Прийми од нас вінець королівства»…Але він у той час не прийняв був [вінця], сказавши: «Рать татарська не перестає. Зле вони живуть із нами…То як можу я прийняти вінець без допомоги твоєї?»", "«Коли ж Ізяслав із Всеволодом прийшов до Києва, а Святослав до Чернігова, то люди київські прибігли до Києва і вчинили віче на торговищі, і сказали, пославши [послів] до князя: «Осьо половці розсипались по землі. Дай-но, княже, оружжя і коней, і ми ще поб'ємося з ними». Але Ізяслав цього не послухав.»", "«Літопис руський, з богом починаєм. Отче благослови…Нестора, чорноризця Феодосієвого монастиря Печерського, звідки пішла Руська земля, і хто в ній почав спершу княжити, і як Руська земля постала…»", "«По смерті Святополка Володимир Всеволодович скликав в селі Берестові свою дружину …і на з'їзді ухвалили: Якщо купець, взявши товари або гроші в кредит… піддасться пожежі, або буде пограбований ворогом, то не можна зробити йому будь-яке насильство або продати його в рабство, але необхідно дозволити йому розстрочку платежу на кілька років…»", "«Якщо уб'є вільний муж мужа (княжого мужа), то платити за нього 80 гривень віри (вири)… А якщо княжого під'їздника, або тіуна, або мечника уб'ють, то 40 гривень… А якщо це буде смерд або холоп, то 5 гривень, а за жінку – 5 гривень…»"], "ok": [0, 3, 1, 2], "expl": "Марка 1 — Данило Галицький (корона від папи); 2 — Устав Мономаха; 3 — народне ополчення (повстання 1068 р.); 4 — «Повість минулих літ»."}, {"id": "c-560ddd", "q": "Основне завдання зовнішньої політики Данила Галицького в 40— 60-ті рр. ХІІІ ст. полягало у:", "sec": "s1", "g": "p2-s1:створенні коаліції європейських держав д", "t": "single", "opts": ["зміцненні власного авторитету та отриманні королівської корони", "укладанні союзу з Польщею для відсічі агресії Тевтонського ордену", "створенні коаліції європейських держав для боротьби із Золотою Ордою", "приєднанні Закарпаття та Люблінської землі до своїх володінь"], "ok": [2], "expl": "Після поїздки до Орди Данило шукав союзників у Європі (папа, Угорщина, Польща) для боротьби з Ордою; корона 1253 р. — частина цього задуму."}, {"id": "c-77e2a7", "q": "У боротьбі з ким обіцяв Папа Римський допомогу Данилу Галицькому?\n«У той самий час прислав папа послів достойних, що принесли \nДанилові вінець, і скіпетр, і корону, які означають королівський сан, кажучи: “Сину! Прийми од нас вінець королівства” ...Пізо, посол папський, прийшов, несучи вінець і обіцяючи: “Ти матимеш поміч від Папи”».", "sec": "s1", "g": "p2-s1:папа — проти кого", "t": "single", "opts": ["німецькими хрестоносцями", "монголами", "литовцями", "поляками та угорцями"], "ok": [1], "expl": "Папа Іннокентій IV обіцяв хрестовий похід проти татар (монголів) — допомоги так і не надав."}, {"id": "c-559ee2", "q": "У якому уривку з джерел йдеться про привід до польської агресії  проти Галицько-Волинської держави?", "sec": "s2", "g": "p2-s2:булла про 1340 р.", "t": "single", "opts": ["«...З поданого до нас прохання короля Казимира ІІІ ми недавно довідались, що, коли народ русинів за допомогою отрути вбив Болеслава, князя Русі і родича короля, тоді король, вражений цим злочином і прагнучи помститися за кривду християнської віри, напав своїм військом на Руську землю...»", "«У той самий час прислав Папа послів достойних, що принесли Данилові вінець, і скіпетр, і корону, які означають королівський сан, кажучи: “Сину! Прийми од нас вінець королівства…”»", "«Року 1471. Упокоївся Семен Олелькович. Після його смерті Казимир, король польський, бажаючи припинити існування князівства, не посадив уже там Семенового сина, а посадив воєводу з Литви Мартина Гаштовта...»", "«...Ягайло, великий князь, обіцяє всі свої багатства вжити й витратити на усунення недоліків обох королівств, як Польщі, так і Литви, якщо володарка Угорщини вищезгадану дочку, королеву Польщі, з’єднає з ним шлюбними узами...»"], "ok": [0], "expl": "Казимир III пояснював похід на Галичину вбивством Болеслава-Юрія (1340) — це був привід."}, {"id": "c-b4ee88", "q": "Галицько-Волинську державу частина істориків вважає правонаступницею Київської Русі тому, що...", "sec": "s2", "g": "", "t": "single", "opts": ["вона єдина змогла встояти під монгольською навалою", "успадкувала частину території, форми політичного та суспільно-економічного життя", "берегла герб і символи великокняжої влади київських князів", "забезпечила існування незалежного державного життя у східних слов’ян"], "ok": [1], "expl": "Держава успадкувала частину земель Русі, її політичний устрій і культуру — тому її вважають спадкоємицею Київської держави."}, {"id": "c-4eb12c", "q": "Про якого князя йдеться в уривку з джерела?\n«Сей же король був князем добрим, хоробрим, мудрим, який спорудив городи многі, і церкви поставив, і оздобив їх різноманітними прикрасами, та братолюбством він світився був із братом своїм Васильком\".", "sec": "s1", "g": "p2-s1:данило романович", "t": "single", "opts": ["Роман Мстиславич", "Данило Романович", "Юрій І Львович", "Юрій ІІ Болеслав"], "ok": [1], "expl": "«Король», брат Василька — це Данило Романович, коронований у 1253 р."}, {"id": "c-87bb16", "q": "Установіть відповідність між подіями та іменами князів.", "sec": "s2", "g": "", "t": "match", "left": ["Ініціював Любецький з’їзд князів", "Утворив Галицько-Волинську державу", "Визнав зверхність Золотої Орди", "Заснував Галицьку православну митрополію"], "opts": ["Володимир Мономах", "Ярослав Осмомисл", "Роман Мстиславич", "Данило Романович", "Юрій І Львович"], "ok": [0, 2, 3, 4], "expl": "Любецький з’їзд — Мономах; Галицько-Волинська держава — Роман; визнав зверхність Орди — Данило; Галицька митрополія — Юрій І."}, {"id": "c-e8804e", "q": "Установіть відповідність між битвами та їх результатами (наслідками)", "sec": "s1", "g": "", "t": "match", "left": ["Битва на р. Калці", "Битва під Ярославом", "Битва під Дорогочином", "Битва на р. Альті"], "opts": ["Припинення набігів на Русь печенігів", "Розпад тріумвірату синів Ярослава Мудрого", "Остаточне утвердження влади Данила Галицького", "Зупинення агресії хрестоносців", "Розгром половців і руських князів монголами"], "ok": [4, 2, 3, 1], "expl": "Калка — розгром руських і половецьких військ; Ярослав — утвердження Данила; Дорогичин — зупинено хрестоносців; Альта (1068) — розпад тріумвірату Ярославичів."}, {"id": "c-7cd0f0", "q": "Установіть послідовність подій.", "sec": "s1", "g": "", "t": "seq", "opts": ["Любецький з’їзд князів", "Перша згадка назви «Україна» в писемних джерелах", "Захоплення Києва монголами на чолі з ханом Батиєм", "Коронація Данила Галицького"], "expl": "Любецький з’їзд (1097) → «Україна» в літописі (1187) → Київ здобуто монголами (1240) → коронація Данила (1253)."}, {"id": "c-ee06c9", "q": "Установіть послідовність подій.", "sec": "s1", "g": "", "t": "seq", "opts": ["Битва під Ярославом", "Поїздка Данила Галицького до Золотої Орди", "Коронація Данила Галицького", "Похід Куремси на Волинь (Володимир, Луцьк)"], "expl": "Ярослав (серпень 1245) → поїздка до Батия (кінець 1245) → коронація (1253) → похід Куремси (1254 – 1255)."}, {"id": "c-4fb520", "q": "Які з наведених тверджень характеризують діяльність князя Данила  Галицького?", "sec": "s1", "g": "", "t": "three", "opts": ["разом з іншими руськими князями брав участь у битві з монголами на річці Калці 1223 р.", "приєднав до Галицько-Волинського князівства Закарпаття та Люблінську землю, зробивши державу найбільшою", "здійснив поїздку до Золотої Орди, де добився від хана Батия підтвердження своїх прав на Волинь і Галичину", "у «Слові о полку Ігоревім» про князя згадується, що він «підпер гори Угорські своїми військами» і «зачинив ворота Дунаю»", "успішно чинив опір монгольським загонам темника Куремси, але зазнав поразки в боротьбі з татарським ханом Бурундаєм", "столицею свого князівства зробив місто Львів, куди переніс і княжий двір із Холма", "брав участь у Любецькому з’їзді князів, де ухвал проклинали його. Батий же дуже розгнівався і звелів з великою люттю іти на приступ міста\".", "Опозицію серед галицьких бояр вдалося приборкати. Кадлубек розповідає про жорстоку розправу з галицьким боярством, відгомін чого зафіксований Галицько-Волинським літописом у розповіді про вигнання бояр Кормильчичів. Напевно можна констатувати, що на цей раз Романовi вдалося усунути найбільш активних опозиціонерів i взяти у свої руки правління Галицькою землею", "Найяснішому королю Русі - єпископ Інокентій, слуга слуг Божих. Оскільки ми намірені удостоїти тебе і твоє Королівство як нову ниву [Господню] особливою милістю і благословенням, то охоче відгукнулися на твої прохання і доброзичливо вислухали твої просьби, покладаючись на милість Бога."], "ok": [2], "expl": "У 1199 р. Роман Мстиславич здобув Галич і жорстоко розправився з боярською опозицією — про це пише польський хроніст Кадлубек. Решта уривків — Калка (1223), облога Києва (1240) і лист папи Інокентія IV до Данила (кінець 1240-х рр.)."}, {"id": "f-1kvdGg-42", "q": "Які князівства Київської Русі перебували під контролем Романа Мстиславича напередодні його загибелі?", "sec": "s1", "g": "", "t": "three", "opts": ["Чернігівське", "Київське", "Волинське", "Володимиро-Суздальське", "Новгородське", "Ростовське", "Галицьке"], "ok": [1, 2, 6], "expl": "Роман володів Волинню (з 1170), Галичиною (з 1199) і контролював Київ (з 1201 – 1202). Чернігів тримали Ольговичі, а Володимиро-Суздальська, Новгородська й Ростовська землі лежали далеко на півночі й Романові не належали."}, {"id": "k-a633b8ce-4", "q": "Де загинув Роман Мстиславич у 1205 р.?", "sec": "s1", "g": "", "t": "single", "opts": ["під Дорогичином", "під Ярославом", "під Завихостом", "на річці Калці"], "ok": [2], "expl": "Роман загинув 1205 р. під Завихостом над Віслою — у сутичці з військом польських князів Лешка й Конрада. Дорогичин (1238) і Ярослав (1245) — битви Данила."}, {"id": "k-35105e8d-11", "q": "Роман Мстиславич до 1199 року очолював", "sec": "s1", "g": "", "t": "single", "opts": ["Галицьке князівство", "Волинське князівство", "Переяславське князівство", "Чернігівське князівство"], "ok": [1], "expl": "Роман Мстиславич був волинським князем з 1170 р., а в 1199 р. приєднав Галичину."}, {"id": "k-1eea0100-18", "q": "У 1199 році", "sec": "s1", "g": "", "t": "single", "img": ["q_254b722365"], "opts": ["Ярослав Осмомисл почав князювати в Галицькому князівстві", "Роман Мстиславич об’єднав Галицьке й Волинське князівства", "Данило Романович отримав королівську корону від папи", "монгольські війська здобули й зруйнували Київ"], "ok": [1], "expl": "1199 — Роман Мстиславич об’єднав Галицьке й Волинське князівства. Осмомисл почав княжити 1153 р., корона Данила — 1253, Київ здобуто 1240."}]}, "1-s2": {"n": 4, "pool": [{"id": "f-1ubu7Y-7", "q": "Яка з наведених подій відбулась у 1238 році?", "sec": "s2", "g": "", "t": "single", "opts": ["Отож Роман-князь ревно наслідував [Володимира] в цім і старався погубити іноплемінників. … велика смута постала в землі Руській. Зосталися ж два сини його, один, [Данило], чотирьох літ, а другий, [Василько], двох літ.", "І Данило увійшов у город свій, і прийшов до [церкви] пречистої святої Богородиці, і взяв стіл отця свойого, і на знак побіди поставив на Німецьких воротах хоругов свою…. Бояри ж, прийшовши, упавши до ніг його, [Данила, і] просячи милості, [говорили]: «Завинили ми перед тобою, іншого князя держали».", "У той же час послав Батий [війська] на Чернігів. Обступили вони город великою силою, і Мстислав Глібович, почувши про напад на город іноплемінних, прийшов на них зо всіма воями. Билися вони, переможений був Мстислав, і безліч із воїв його побито було, і взяли вони город, і запалили вогнем. Єпископа [Порфирія] вони зоставили живим і одвели його в Глухів.", "А назавтра прийшли [татари] на них, і була битва межи ними велика. Люди тим часом вибігли і на церкву, і на склепіння церковне з пожитками своїми, [і] од тягаря повалилися з ними стіни церковні. і так укріплення було взяте [татарськими] воями. Дмитра ж вивели [до Батия], пораненого, але вони не вбили його через мужність його."], "ok": [1], "expl": "У 1238 р. Данило повернув собі Галич: «увійшов у город свій… і взяв стіл отця свойого». Інші уривки — смерть Романа (1205), облога Чернігова (1239) і Києва (1240)."}, {"id": "k-a633b8ce-12", "q": "Заснування якого міста описано в уривку з літопису?", "sec": "s2", "g": "", "t": "single", "img": ["q_1629e76e7f"], "opts": ["Кременця", "Холма", "Львова", "Данилова"], "ok": [1], "expl": "Літопис розповідає, як Данило, полюючи, побачив гарне місце на горі й заклав там город — Холм, свою резиденцію."}, {"id": "k-a633b8ce-13", "q": "Яке місто, вперше згадане в літописі під 1256 р., назване на честь сина Данила?", "sec": "s2", "g": "", "t": "single", "opts": ["Белз", "Холм", "Ярослав", "Львів"], "ok": [3], "expl": "Львів названо на честь Лева, сина Данила; уперше він згаданий у літописі під 1256 р."}, {"id": "k-a633b8ce-14", "q": "Що з переліченого — заходи внутрішньої політики Данила?", "sec": "s2", "g": "", "t": "three", "opts": ["перенесення столиці до Києва", "заснування Галицької митрополії", "створення піхоти з міщан і селян", "будівництво нових міст і замків", "опора на міщан і дрібних землевласників", "запровадження магдебурзького права в Сяноку", "запровадження християнства як державної релігії"], "ok": [2, 3, 4], "expl": "Данило будував міста й замки, спирався на міщан і дрібних землевласників і створив піхоту з міщан і селян. Галицьку митрополію утворили за Юрія І, магдебурзьке право Сянок отримав 1339 р. від Юрія ІІ, християнство запровадили ще 988 р., а столицю до Києва Данило не переносив."}]}, "1-s3": {"n": 10, "pool": [{"id": "f-1ubu7Y-20", "q": "Встановіть хронологічну послідовність подій", "sec": "s3", "g": "", "t": "seq", "opts": ["І прибігло половців багато в Руську землю, і говорили вони руським князям: «Якщо ви не поможете нам, — [то] ми нині порубані були, а ви завтра порубані будете». І була рада всіх князів у городі Києві, [і] нарадились вони так: «Лучче б нам зустріти їх на чужій землі, аніж на своїй».", "На ріці Калці татари встріли їх, війська половецькі й руські. Мстислав Мстиславич тим часом повелів Данилові попереду перейти з полками ріку Калку і іншим полкам [піти] з ним, а сам після нього перейшов. Сам же поїхав він у сторожі, і, коли побачив полки татарські, він, приїхавши, сказав: «Оружіться!»", "Коли зітнулися війська між собою, то Данило виїхав наперед, і [воєвода] Семен Олуйович, і [воєвода] Василько Гаврилович. Ударили вони в полки татарські, і Василько був збитий [з коня], а сам Данило поранений був у груди. Але через молодість і одвагу він не чув ран, що були на тілі його.", "І сталася побіда над усіма князями руськими, якої ото не бувало ніколи. Татари ж, перемігши руських князів за гріхи християн, пішли й дійшли до Новгорода Святополчського, а руси, які не знали лукавства їх, виходили назустріч їм із хрестами, і вони побили їх усіх."], "expl": "Спершу половці просять руських князів про допомогу і князі вирішують іти в степ, потім війська зустрічаються на Калці, Данило б’ється попереду і поранений, а наприкінці — розгром руських князів."}, {"id": "f-1Mnk8B-22", "q": "Коли війська зібралися докупи, то Данило виїхав наперед і Семен Олюєвич і Василько Гаврилович, і розійшлися на полки татарські. Василько зразу ж був убитий, а Данило був поранений у руку, але він не чув рани, що була на тілі його, бо був молодий і буйний [нестримний]; і хоч було йому тоді 18 років, але він був сильний у бою. Винищував він татар мужньо [...] В скорому часі половці стали втікати і, втікаючи, потоптали табори руських князів, а руські князі не встигли були ополчитися проти них, і розгубилися війська руські, і була тяжка і жорстока різня, і за гріхи наші руські війська були розбиті [...]\nДо якого періоду історії Київської Русі належать події, наведені в документі?", "sec": "s3", "g": "", "t": "single", "opts": ["виникнення та становлення", "піднесення та розквіту", "політичної роздробленості", "золотоординського панування"], "ok": [2], "expl": "Калка (1223) — ще доба політичної роздробленості Русі: князі діяли нарізно, без єдиного командування. Золотоординське панування настало після навали 1240 р."}, {"id": "f-1Mnk8B-24", "q": "Коли війська зібралися докупи, то Данило виїхав наперед і Семен Олюєвич і Василько Гаврилович, і розійшлися на полки татарські. Василько зразу ж був убитий, а Данило був поранений у руку, але він не чув рани, що була на тілі його, бо був молодий і буйний [нестримний]; і хоч було йому тоді 18 років, але він був сильний у бою. Винищував він татар мужньо [...] В скорому часі половці стали втікати і, втікаючи, потоптали табори руських князів, а руські князі не встигли були ополчитися проти них, і розгубилися війська руські, і була тяжка і жорстока різня, і за гріхи наші руські війська були розбиті [...]\nНаведені в документі події відбулись у", "sec": "s3", "g": "p1-s3:Калка — уривок", "t": "single", "opts": ["1199 році", "1223 році", "1238 році", "1240 році"], "ok": [1], "expl": "Половці втекли й потоптали табори руських князів, Данило поранений — це битва на Калці 1223 р."}, {"id": "f-1kvdGg-22", "q": "В якому році відбулась битва, описана в уривку з історичного джерела: \"Ударили вони в полки татарські, і Василько був збитий [з коня], а сам Данило поранений був у груди. Але через молодість і одвагу він не чув ран, що були на тілі його,- був бо він віком вісімнадцяти літ, був бо він сильний,- і Данило кріпко боровся, побиваючи татар\".", "sec": "s3", "g": "p1-s3:Калка — уривок", "t": "single", "opts": ["1185 р.", "1223 р.", "1238 р.", "1240 р."], "ok": [1], "expl": "Вісімнадцятирічний Данило поранений у груди в бою з татарами — битва на Калці, 1223 р."}, {"id": "f-1qSyFu-17", "q": "Який з наведених років є зайвим в наведеному хронологічному ланцюжку, що відповідає наведеним на карті подіям: 1223 рік - 1239 рік - 1240 рік - 1245 рік", "sec": "s3", "g": "", "t": "single", "img": ["q_f811dac21e"], "opts": ["1223 рік", "1239 рік", "1240 рік", рених монголами руських землях»?", "sec": "s1", "g": "", "t": "single", "opts": ["калга-султан", "муфтій", "бей", "баскак"], "ok": [3], "expl": "Баскак — ординський урядовець, що рахував населення й стежив за збиранням данини."}, {"id": "k-0935b968-49", "q": "У тексті йдеться про події\n\n«Прислав папа [Іннокентій IV] послів достойних, що принесли вінець, і скіпетр, і корону... кажучи: “Сину! Прийми од нас вінець королівства”... Опізо [папський легат] прийшов, несучи вінець...» (Галицько-Волинський літопис)", "sec": "s1", "g": "p2-s1:корона від папи — уривок", "t": "single", "opts": ["1238 року", "1240 року", "1245 року", "1253 року"], "ok": [3], "expl": "Посли папи Іннокентія IV з короною і легат Опізо — це коронування Данила, 1253 р."}, {"id": "k-0935b968-52", "q": "У якому хронологічному проміжку правив князь, про якого йдеться в тексті?\n\n«Сей же король Данило був князем добрим, хоробрим і мудрим, який спорудив городи многі, і церкви поставив, і оздобив їх різноманітними прикрасами, і братолюбством він світився був із братом своїм Васильком. Сей же Данило був другий по Соломоні [мається на увазі мудрістю].» (Галицько-Волинський літопис)", "sec": "s1", "g": "", "t": "single", "opts": ["1153-1187 рр.", "1199-1205 рр.", "1205-1238 рр.", "1238-1264 рр."], "ok": [3], "expl": "Король Данило, брат Василька, правив Галицько-Волинською державою 1238 – 1264 рр."}, {"id": "k-0935b968-53", "q": "Описані в тексті події — це перебіг битви під\n\n«Ростислав же, побачивши, що хоругву його несуть, кинувся навтьоки. Тим часом Василько ударив на центр [війська] ляхів та угрів, і була січа велика. І поміг Бог Данилові й Василькові, і побігли угри й ляхи, і гнали їх вої Данилові та Василькові далеко, і багатьох убили та в полон взяли.» (Галицько-Волинський літопис)", "sec": "s1", "g": "", "t": "single", "opts": ["Дорогичином", "Ярославом", "Доростолом", "Ітилем"], "ok": [1], "expl": "Ростислав Михайлович з угорцями й поляками проти Данила й Василька — битва під Ярославом 1245 р."}, цього домовились про підтримку іншого претендента\". Наслідком описаної в тексті події стало", "sec": "s2", "g": "", "t": "single", "opts": ["зміна правлячої в Галицько-Волинському князівстві династії Романовичів на династію Арпадів", "послаблення Галицько-Волинської держави, посилення її вразливості монголо-татарським нападам", "широке поширення магдебурзького права в містах внаслідок послаблення князівської влади", "втрата територіальної цілісності та зникнення Галицько-Волинської держави"], "ok": [3], "expl": "Після отруєння Юрія ІІ Болеслава (1340) держава втратила єдність: Волинь отримав литовський князь Любарт, Галичину згодом захопила Польща."}, {"id": "k-35105e8d-14", "q": "Яку землю приєднав до держави Лев Данилович у 1292 р.?", "sec": "s2", "g": "", "t": "single", "opts": ["Холмщину й Підляшшя", "Червенські міста", "Люблінську землю", "Київське князівство"], "ok": [2], "expl": "У 1292 р., скориставшись боротьбою в Польщі, Лев Данилович приєднав до держави Люблінську землю. Холмщина й Червенські міста належали Романовичам і раніше, а Київ до держави не входив."}, {"id": "k-35105e8d-16", "q": "Яка з наведених подій НЕ відноситься до князювання Юрія І Львовича?", "sec": "s2", "g": "", "t": "single", "opts": ["заснування Галицької митрополії", "використання королівського титулу", "посилення ролі католицької церкви", "втрата Люблінської землі та Закарпаття"], "ok": [2], "expl": "За Юрія І утворили Галицьку митрополію, він називав себе «королем Русі», а Люблінську землю (і, за однією з версій, частину Закарпаття) тоді було втрачено. Посилення католиків ставили в провину Юрієві ІІ Болеславу."}, {"id": "k-0935b968-54", "q": "Заповніть пропуски в тексті.\n\n«У той час, коли в Угорщині була велика смута [після смерті короля Ласло IV Куна], князь ______, скориставшись цим, зайняв частину ______ з містом Мукачевом. І приєднав її до своїх володінь, розширивши межі Галицької землі.» (сучасний переказ; Закарпаття за Лева — лише за однією з версій)", "sec": "s2", "g": "", "t": "single", "opts": ["Данило Романович, Підляшшя", "Лев Данилович, Закарпаття", "Юрій І Львович, Люблінської землі", "Святослав Ігоревич, Закарпаття"], "ok": [1], "expl": "Скориставшись смутою в Угорщині, частину Закарпаття з Мукачевом зайняв Лев Данилович (за однією з версій)."}, {"id": "k-0935b968-55", "q": "Описані в уривку події відбувалися за князювання\n\n«Прийшли татари на Литву... І пішли з ними князі руські та інші... І пустошили вони землю Литовську, і взяли великий полон, і вернулися до себе.» (Галицько-Волинський літопис)", "sec": "s2", "g": "", "t": "single", "opts": ["Романа Мстиславича", "Ярослава Осмомисла", "Лева І Даниловича", "Свидригайла Ольгердовича"], "ok": [2], "expl": "Після 1259 р. Романовичі мусили ходити з ординцями в походи на сусідів, а в 1270 – 1280-х рр., за Лева Даниловича, такі спільні походи (на Литву, Польщу, Угорщину) стали звичними. Роман і Ярослав Осмомисл жили до монгольської навали, а Свидригайло — у XV ст."}, {"id": "k-0935b968-56", "q": "Кому належала печатка з таким написом?\n\nНа печатці — напис латиною: «Sigillum Domini Georgi Regis Rusie» (печатка господаря Юрія, короля Русі) і «Sigillum Domini Georgi Ducis Ladimerie» (печатка господаря Юрія, князя Володимирії).", "sec": "s2", "g": "p2-s2:печатка Юрія І", "t": "single", "opts": ["Юрію ІІ Болеславу", "Юрію І Львовичу", "Андрію та Леву ІІ Юрійовичам", "Леву І Даниловичу"], "ok": [1], "expl": "Титул «король Русі» на печатці й ім’я Юрій вказують на Юрія І Львовича (1301 – 1308), який першим після Данила вживав королівський титул. Юрій ІІ Болеслав такої печатки не мав, Лев і Андрій з Левом ІІ — інші імена."}, {"id": "k-0935b968-57", "q": "Описані в тексті події відбулися за князювання\n\n«У зв’язку з великими відстанями та труднощами [сполучення з Києвом, що перебував під впливом Орди], святійший патріарх Афанасій I та синод ухвалили рішення про заснування окремої Галицької митрополії.» (сучасний переказ)", "sec": "s2", "g": "p2-s2:Галицька митрополія", "t": "single", "opts": ["Данила Романовича", "Лева Даниловича", "Юрія І Львовича", "Юрія ІІ Болеслава"], "ok": [2], "expl": "Окрему Галицьку митрополію утворили близько 1303 р. за князювання Юрія І Львовича."}, {"id": "k-0935b968-58", "q": "У наведеному тексті йдеться про смерть\n\nРоку 1340 галицькі бояри, обурені на князя за його утиски, зверхність та прихильність до іноземців і чужої віри, змовилися проти нього. У місті Володимирі, після Великодня, вони дали йому випити отруту, від якої він невдовзі й помер. (сучасний переказ)", "sec": "s2", "g": "", "t": "single", "opts": ["останнього галицько-волинського князя з династії Романовичів", "останнього князя цілісної Галицько-Волинської держави", "останнього сина Юрія ІІ Болеслава", "останнього князя Галицько-Волинської держави, обраного з-поміж бояр"], "ok": [1], "expl": "1340 р. бояри отруїли Юрія ІІ Болеслава — останнього князя цілісної Галицько-Волинської держави. Він був мазовецьким князем (Романовичем лише по матері): останні Романовичі — Андрій і Лев ІІ — померли близько 1323 р."}]}}, "tests": {"t1": {"name": "Тест 1 · допуск", "tasks": [{"id": "k-a633b8ce-2", "q": "Яким князівством Роман Мстиславич правив з 1170 р.? Обери номер на мапі", "sec": "s1", "g": "", "t": "single", "img": ["q_3905b983dd"], "n": 1, "opts": ["2", "3", "4", "1"]}, {"id": "k-a633b8ce-6", "q": "Що таке боярська олігархія?", "sec": "s1", "g": "", "t": "single", "n": 2, "opts": ["народні збори вільних міщан", "союз бояр із ханом проти князя", "влада угруповання найбагатших бояр", "рада князя з вищим духовенством"]}, {"id": "k-0935b968-46", "q": "У тексті йдеться про діяльність", "sec": "s1", "g": "p1-s1:Роман — літописна похвала", "t": "single", "n": 3, "src": "«Був бо держитель всієї Руської землі, подолав усі поганські народи, мудрістю розуму додержуючи заповідей Божих... Кинувся був на поганих [половців], як той лев, сердитий же був, як та рись, і губив їх, як той крокодил, і переходив землю їх, як той орел, а хоробрий був, як той тур, бо він ревно наслід

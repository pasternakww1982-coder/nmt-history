<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мирні угоди після Першої світової війни</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.lb-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; will-change: transform; }
.pic { touch-action: pan-x pan-y; }   /* щипок на зображенні не збільшує всю сторінку — відкриває перегляд */
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


.brand { margin: 28px 0 6px; text-align: center; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }

/* «← Усі теми» — повернення на полицю тем спільної оболонки */
.tback { display: inline-block; margin: 14px 0 0; font-weight: 700; font-size: 15px; color: var(--acc2); text-decoration: underline; }

/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }
.tlv .ev { position: relative; padding: 0 0 16px; display: grid; gap: 3px; }
.tlv .ev i { position: absolute; left: -25px; top: 4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--bg); }
.tlv .ev .y { color: var(--acc2); font-weight: 800; font-variant-numeric: tabular-nums; }
.tlv .ev .y.yprog { justify-self: start; background: var(--acc2); color: #161616; border-radius: 8px; padding: 1px 8px; }
.tlv .ev b { font-size: 17px; }
.legend { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.legend span.sw { width: 34px; height: 16px; background: var(--acc2); border-radius: 6px; }
/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }
.gp .tr { position: relative; height: 18px; background: #262626; border-radius: 6px; }
.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }
.part-btn .th img { max-width: 100%; max-height: 100%; }
.part-btn h3 { font-size: 18px; }
.part-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
/* курс: вхід, бліци, тести */
.tback + .who { margin-top: 8px; }
.who { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--panel); border-radius: 12px; padding: 10px 14px; margin: 14px 0 0; font-weight: 700; font-size: 15px; }
.lnk { background: none; border: 0; color: var(--acc2); font: inherit; font-size: 14.5px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }
.login { display: grid; gap: 14px; margin-top: 18px; }
.login label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
.login input { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--panel2); background: var(--bg); color: var(--txt); }
.login input:focus { outline: none; border-color: var(--acc); }
.err { color: var(--bad); font-weight: 700; }
.locked { opacity: .55; }
.shake { animation: shk .4s; } @keyframes shk { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.okc { color: var(--ok); } .badc { color: var(--bad); }
.sync { font-size: 14.5px; color: var(--muted); margin-top: 16px; text-align: center; }
.bz-card .meta { color: var(--muted); font-size: 15px; }
.bz-card .best { background: var(--panel2); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.bz-card .best b { color: var(--acc2); }
.bz-card .btn { margin-top: 4px; }
.bz-in { display: grid; gap: 14px; padding-top: 14px; }
.bz-top { display: flex; align-items: center; gap: 10px; }
.bz-top .cnt { font-weight: 700; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.bz-top .pts { margin-left: auto; background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-weight: 800; color: var(--acc2); font-variant-numeric: tabular-nums; }
.bz-top .x { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; width: 40px; height: 36px; font-size: 17px; cursor: pointer; }
.qtype { font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--acc2); }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.38; }
.pic.qi { border-radius: 12px; overflow: hidden; position: relative; background: #0f0f0f; }
.pic.qi img { width: 100%; height: auto; max-height: 62vh; object-fit: contain; display: block; }
.tiles { display: grid; gap: 10px; }
.tile { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; border: 3px solid transparent; border-radius: 14px; padding: 12px; font: inherit; font-size: 16.5px; font-weight: 600; color: #fff; cursor: pointer; min-height: 58px; }
.tile .l { width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.25); display: grid; place-items: center; font-weight: 800; }
.tile.c0 { background: #b8463a; } .tile.c1 { background: #2f6fa8; } .tile.c2 { background: #b38419; } .tile.c3 { background: #3f8a55; }
.tile.n { background: var(--panel2); }
.tile.sel { border-color: var(--acc2); background: #4a3524; }
.tile[disabled] { cursor: default; }
.tile.dim { opacity: .38; }
.tile.right { border-color: #9ff0b4; opacity: 1; }
.tile.wrong { border-color: #ffb3a6; opacity: 1; }
.tile .ord { width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: #161616; display: grid; place-items: center; font-weight: 800; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile.wi { grid-template-columns: 1fr; padding: 8px; position: relative; align-content: start; }
.tile.wi .l, .tile.wi .ord { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(0,0,0,.65); }
.tile.wi .ord { background: var(--acc); }
.oi { position: relative; display: block; border-radius: 10px; overflow: hidden; background: #0f0f0f; }
.oi img { width: 100%; height: 150px; object-fit: contain; display: block; }
.oi .zoom-hint { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.65); display: grid; place-items: center; font-size: 18px; color: #fff; }
.mlist { background: var(--panel); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-size: 15.5px; }
.mo { display: grid; grid-template-columns: 24px 1fr; gap: 6px; align-items: start; }
.mo .oi img { height: 120px; }
.mrow { display: grid; gap: 6px; }
.ml { font-weight: 600; }
.ml .pic.ri { margin-top: 6px; }
.pic.ri { border-radius: 10px; overflow: hidden; background: #0f0f0f; position: relative; }
.pic.ri img { width: 100%; height: 170px; object-fit: contain; display: block; }
.mbtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mb { background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 10px; height: 44px; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
.mb.on { background: var(--acc); color: #161616; }
.mb.right { border-color: #9ff0b4; }
.mb.wrong { border-color: #ffb3a6; }
.bz-act { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

хоокеанському регіоні."]}, {"h": "Зникли з мапи", "paras": ["Розпалися чотири імперії: **Німецька, Австро-Угорська, Османська й Російська**."]}]}, {"type": "text", "title": "Нові держави в Європі", "badges": [], "paras": ["На уламках імперій постали нові держави: **Польща, Чехо-Словаччина, Королівство сербів, хорватів і словенців** (з 1929 р. — Югославія), **Австрія, Угорщина, Фінляндія, Литва, Латвія, Естонія**.", "Кордони Європи змінилися дуже сильно. Проте їх часто проводили без огляду на те, де живе який народ. У багатьох нових державах опинилися великі національні меншини — це стало джерелом суперечок і конфліктів у майбутньому."]}, {"type": "map", "title": "Європа до і після війни", "steps": [{"label": "1914 р.", "key": "eu1914"}, {"label": "1923 р.", "key": "eu1923"}], "cap": "Порівняйте дві карти: які держави зникли, а які з’явилися? На карті 1923 р. показано також сучасний кордон України."}, {"type": "text", "title": "Економічні втрати", "badges": [], "paras": ["Війна знищила величезну частку національного багатства воюючих країн: **Російська імперія** втратила близько **60 %**, **Австро-Угорщина** — 41 %, **Німеччина** — 33 %, **Франція** — 31 %, **Велика Британія** — 15 %.", "**США** та **Японія**, навпаки, збагатилися. На їхній території не воювали, а їхня промисловість виготовляла зброю й спорядження та продавала їх країнам Антанти. США з боржника перетворилися на найбільшого кредитора Європи."]}, {"type": "text", "title": "Людські втрати", "badges": [], "paras": ["Перша світова війна забрала життя близько **10 млн** військових. Ще мільйони людей стали каліками, загинули мирні жителі."], "imgs": [{"key": "ch_loss", "cap": "Помаранчевим — країни Антанти та її союзники, блакитним — Четверний союз. Дані орієнтовні: у різних джерелах оцінки відрізняються."}]}]}, {"id": "s2", "num": "II", "title": "Плани переможців і Паризька конференція", "sub": "«14 пунктів», «велика трійка», позиції держав", "cover": {"key": "big4", "cap": "«Велика четвірка» в Парижі, 1919 р. Зліва направо: Девід Ллойд Джордж, Вітторіо Орландо, Жорж Клемансо, Вудро Вільсон"}, "cards": [{"type": "text", "title": "Хто вирішував долю повоєнного світу", "badges": [], "paras": ["Умови миру диктували переможці — держави Антанти, насамперед **Велика Британія, Франція й США**.", "Від них залежало, яким буде світ після війни: справедливим чи ні, чи не закладуть нові договори ґрунт для майбутніх конфліктів."], "imgs": [{"key": "big3walk", "cap": "Жорж Клемансо, Вудро Вільсон і Девід Ллойд Джордж у Парижі"}]}, {"type": "carousel", "title": "«Велика трійка»", "badges": [], "items": [{"key": "clem", "name": "Жорж Клемансо", "desc": "Прем’єр-міністр **Франції**. Прагнув якомога сильніше ослабити Німеччину, щоб вона більше ніколи не загрожувала Франції.", "cap": ""}, {"key": "lloyd", "name": "Девід Ллойд Джордж", "desc": "Прем’єр-міністр **Великої Британії**. Хотів забрати в Німеччини колонії й флот, але не руйнувати її зовсім: сильна Німеччина мала врівноважувати Францію на континенті.", "cap": ""}, {"key": "wilson", "name": "Вудро Вільсон", "desc": "Президент **США**. Обстоював «справедливий мир», право народів на самовизначення й створення міжнародної організації для збереження миру.", "cap": ""}], "note": null}, {"type": "text", "title": "«14 пунктів» Вудро Вільсона", "badges": [], "paras": ["**8 січня 1918 р.**, ще до кінця війни, президент США оголосив свою програму миру.", "**Загальні принципи:** відкриті мирні договори замість таємної дипломатії; свобода судноплавства; усунення бар’єрів у торгівлі; скорочення озброєнь; справедливе розв’язання колоніальних питань.", "**Територіальні питання:** звільнити від німецької окупації землі Росії, Бельгії, Румунії, Сербії й Чорногорії; повернути Франції Ельзас і Лотарингію; уточнити кордони Італії за національною ознакою; надати автономію народам Австро-Угорщини та нетурецьким народам Османської імперії; дати Сербії вихід до моря; відновити **Польщу**.", "**Пункт 14:** створити **Лігу Націй** — союз держав, який гарантуватиме мир."], "imgs": [{"key": "wilson14", "cap": "Вудро Вільсон, президент США"}]}, {"type": "text", "title": "Паризька мирна конференція", "badges": [], "paras": ["Працювала з **18 січня 1919 р. до 21 січня 1920 р.** Тут розв’язали головні питання повоєнного облаштування Європи.", "Формально в конференції брали участь десятки держав, але все важливе вирішувала **«Рада трьох»** (США, Велика Британія, Франція), іноді — **«Рада чотирьох»** (разом з Італією) або **«Рада десяти»** (лідери й міністри закордонних справ цих країн і Японії).", "**Переможених на конференцію не запросили.** Їм лише вручили готові умови й вимагали підписати."]}, {"type": "table", "title": "Позиції головних учасників", "rows": [["", "Франція", "Велика Британія", "США"], ["Переможені країни", "Максимально ослабити Німеччину, отримати величезні репарації, забрати колонії", "Забрати колонії й військовий флот, але зберегти Німеччину як противагу Франції", "Укласти договори, які не дадуть переможеним знову стати агресорами"], ["Кордони", "Повернути Ельзас і Лотарингію; провести кордони так, щоб ослабити Німеччину; створити сильні держави у Східній Європі як противагу їй", "Проводити кордони за принципом самовизначення націй", "Проводити кордони за етнічними межами"], ["Безпека", "Розчленувати Німеччину, мати сильну армію, союз із США й Британією, союз держав Східної Європи під своїм контролем", "Зберегти першість на морі й рівновагу сил у Європі, загальне роззброєння", "Створити міжнародну організацію для охорони миру, роззброєння, відмова від таємної дипломатії"]]}, {"type": "defs", "title": "Що казали лідери", "badges": [], "note": "Як ви розумієте слова Ллойд Джорджа про «асигнації» Вільсона і «дзвінку монету» Британії?", "items": [{"name": "Жорж Клемансо", "paras": ["«Тепер треба виграти мир. Це, мабуть, складніше, ніж виграти війну»."]}, {"name": "Девід Ллойд Джордж", "paras": ["«Вільсон повернувся додому з пачкою асигнацій. Я повернувся з кишенею, повною дзвінкої монети у вигляді германських колоній, Месопотамії тощо. Кожному на його смак…»"]}, {"name": "Вудро Вільсон", "paras": ["«Народи, які мали недовіру один до одного, можуть тепер жити як друзі. Ми — брати. У нас спільна мета»."]}]}, {"type": "text", "title": "Що хотів показати автор малюнка?", "badges": [], "paras": ["Розгляньте малюнок уважно. Хто стоїть у центрі? Що в них у руках? Що відбувається навколо них — праворуч, ліворуч, на задньому плані?"], "imgs": [{"key": "cart_modern", "cap": "Ілюстрація до теми «Паризька мирна конференція»"}], "tip": ["**Підказка:** політики-переможці вирішують долю світу з паперами в руках, а довкола — руїни, кладовища загиблих і натовпи людей, кожен із власними вимогами."]}, {"type": "carousel", "title": "Настрої 1919 року", "badges": [], "items": [{"key": "punch", "name": "Британський плакат", "desc": "Організація «Союз Британської імперії» закликала: «Раз німець — назавжди німець!» Плакат нагадує про злочини війни й закликає не купувати німецьких товарів. Ненависть до переможених тиснула на політиків під час переговорів.", "cap": ""}, {"key": "poster", "name": "Обкладинка журналу «Панч», 1919 р.", "desc": "Ангел накриває німецького орла гасильником для свічок із написом «Умови миру союзників». Так британці уявляли мирний договір: він має назавжди «загасити» німецьку загрозу.", "cap": ""}], "note": null}]}]}, {"id": "p2", "num": 2, "title": "Мирні угоди після Першої світової війни", "part": "Частина 2. Версальська система", "sub": "Версальський договір, договори з союзниками Німеччини, Ліга Націй, мандатна система", "cover": {"key": "mirrors", "cap": "Дзеркальна зала Версальського палацу, 28 червня 1919 р."}, "sections": [{"id": "s1", "num": "I", "title": "Версальський мирний договір", "sub": "Втрати Німеччини, обмеження армії, репарації, оцінки", "cover": {"key": "orpen", "cap": "Підписання миру в Дзеркальній залі. Картина Вільяма Орпена, 1919 р."}, "cards": [{"type": "text", "title": "28 червня 1919 р.", "badges": [], "paras": ["Головний договір конференції — з Німеччиною — підписали **28 червня 1919 р.** у Дзеркальній залі **Версальського палацу** під Парижем.", "Місце обрали невипадково: саме тут у 1871 р., після перемоги над Францією, проголосили Німецьку імперію. Тепер Франція брала реванш.", "Дату теж обрали символічно: рівно п’ять років тому, 28 червня 1914 р., у Сараєві вбили ерцгерцога Франца Фердинанда."], "imgs": [{"key": "mirrors", "cap": "Учасники церемонії стоять на стільцях, щоб побачити підписання"}, {"key": "rep_sign", "cap": "Підписання Версальського договору"}]}, {"type": "map", "title": "Що втратила Німеччина", "steps": [{"label": "1914", "key": "de0"}, {"label": "1", "key": "de1"}, {"label": "2", "key": "de2"}, {"label": "3", "key": "de3"}, {"label": "4", "key": "de4"}, {"label": "5", "key": "de5"}, {"label": "6", "key": "de6"}, {"label": "7", "key": "de7"}, {"label": "8", "key": "de8"}, {"label": "Разом", "key": "de10"}], "cap": "Натискайте кнопки по черзі: червона лінія показує, які землі відійшли від Німеччини. «Разом» — усі втрати (червоним), а червона лінія вздовж Рейну — межа демілітаризованої зони."}, {"type": "text", "title": "Територіальні втрати: підсумок", "badges": [], "paras": ["1. **Ельзас і Лотарингія** — Франції.", "2. **Ейпен і Мальмеді** — Бельгії.", "3. Північна частина **Шлезвігу** — Данії (за результатами голосування населення).", "4. **Мемель** (Клайпеда) — під управлінням союзників, у 1923 р. його захопила й приєднала **Литва**.", "5. **Данциг** (Гданськ) — **вільне місто** під наглядом Ліги Націй.", "6. **Познань**, частина **Помор’я** й **Верхньої Сілезії** — **Польщі**. Польща отримала «коридор» до Балтійського моря, який відрізав Східну Пруссію від решти Німеччини.", "7. Невелика частина Сілезії — **Чехо-Словаччині**.", "8. **Саар** — на 15 років під управління **Ліги Націй**, вугільні шахти — Франції.", "**Рейнську область** демілітаризували: Німеччина не мала права тримати там війська й фортеці, а лівий берег Рейну на 15 років зайняли війська союзників."]}, {"type": "text", "title": "Обмеження армії", "badges": [], "paras": ["• армія — не більше **100 тис.** осіб, лише добровольці, загальний військовий обов’язок скасовано;", "• офіцерів — не більше **4 тис.**;", "• **Генеральний штаб** розпущено;", "• заборонено мати військову авіацію, підводні човни, танки й важку артилерію;", "• флот обмежено кількома застарілими кораблями."], "imgs": [{"key": "reichswehr", "cap": "Німецькі солдати"}, {"key": "plane", "cap": "Військова авіація — заборонено"}, {"key": "sub", "cap": "Підводні човни — заборонено"}, {"key": "gun", "cap": "Важка артилерія — заборонено"}]}, {"type": "text", "title": "Репарації", "badges": [], "paras": ["**Репарації** — відшкодування збитків, яке переможена країна сплачує переможцям.", "Договір зобов’язав Німеччину платити, але точну суму визначили згодом. У **1921 р.** її встановили — **132 млрд золотих марок**.", "Найбільші частки мали отримати **Франція (52 %)**, **Велика Британія (22 %)** та **Італія (10 %)**.", "Як сплачували репарації і що з цього вийшло — у частині 3."]}, {"type": "text", "title": "Інші умови договору", "badges": [], "paras": ["• Німеччину визнали **винною у розв’язанні війни**;", "• заборонили її об’єднання з Австрією (**аншлюс**);", "• Німеччина втратила **всі колонії**;", "• до договору включили **Статут Ліги Націй** — міжнародної організації, яка мала берегти мир і безпеку у світі."], "imgs": [{"key": "finishing", "cap": "Карикатура «Останній штрих», 1919 р. Чим, на думку автора, завершилася війна для Німеччини?"}]}, {"type": "defs", "title": "Оцінки Версальського договору", "badges": [], "note": "Фош майже вгадав: від підписання договору (червень 1919 р.) до початку Другої світової війни (вересень 1939 р.) минуло двадцять років і два місяці.", "items": [{"name": "Фердинанд Фош, маршал Франції", "paras": ["«Це не мир — це перемир’я на двадцять років»."], "img": {"key": "foch", "cap": ""}}, {"name": "Джон Мейнард Кейнс, британський економіст", "paras": ["«Я вважаю, що кампанія за те, щоб Німеччина сплатила всі витрати на війну, була одним із найсерйозніших актів політичної глупоти, за які будь-коли відповідали наші державні мужі»."], "img": {"key": "keynes", "cap": ""}}]}]}, {"id": "s2", "num": "II", "title": "Договори з союзниками Німеччини", "sub": "Австрія, Угорщина, Болгарія, Османська імперія", "cover": {"key": "stg_troops", "cap": "Делегація Австрії прибуває до Сен-Жермена, 1919 р."}, "cards": [{"type": "text", "title": "Чотири договори", "badges": [], "paras": ["Після Версальського договору союзники підписали окремі договори з кожною переможеною країною. Їх називали за передмістями Парижа, де відбувалося підписання:", "• **Сен-Жерменський** з Австрією — **10 вересня 1919 р.**;", "• **Нейський** з Болгарією — **27 листопада 1919 р.**;", "• **Тріанонський** з Угорщиною — **4 червня 1920 р.**;", "• **Севрський** з Османською імперією — **10 серпня 1920 р.**", "Разом із Версальським вони склали **Версальську систему** — новий порядок у Європі та на Близькому Сході."], "imgs": [{"key": "stg_doc", "cap": "Текст Сен-Жерменського договору в австрійському віснику законів, 1920 р."}]}, {"type": "text", "title": "Сен-Жерменський договір (Австрія)", "badges": [], "paras": ["• **Чехія, Моравія** й частина **Сілезії** — до Чехо-Словаччини;", "• **Італія** отримала Південний Тіроль, Трієст, Істрію (без міста Фіуме — Рієки);", "• **Королівство сербів, хорватів і словенців** — Боснію й Герцеговину, Далмацію, Словенію;", "• **Румунія** — Буковину; **Галичину** зайняла Польща (її статус остаточно визначили в 1923 р.);", "• входження **Закарпаття** до Чехо-Словаччини визнали Сен-Жерменський і Тріанонський договори;", "• військові обмеження, репарації, **заборона об’єднання з Німеччиною**."], "imgs": [{"key": "austria_map", "cap": "Розпад Австро-Угорщини. Червоними лініями показано нові кордони (німецькомовна карта)"}]}, {"type": "text", "title": "Тріанонський договір (Угорщина)", "badges": [], "paras": ["Угорщина втратила близько двох третин своєї території, а мільйони угорців опинилися за кордоном.", "• **Румунія** отримала Трансильванію й Східний Банат;", "• **Королівство сербів, хорватів і словенців** — Хорватію, Воєводину, Західний Банат;", "• **Словаччина** й **Закарпаття** — у складі Чехо-Словаччини;", "• **Бургенланд**, населений переважно німцями, — Австрії;", "• військові обмеження й репарації."], "imgs": [{"key": "trianon_map", "cap": "Королівство Угорщина до 1920 р. Діаграми показують національний склад населення земель, які воно втратило; червоним — райони, де переважали угорці"}]}, {"type": "text", "title": "Нейський договір (Болгарія)", "badges": [], "paras": ["• **Греції** відійшла **Західна Фракія** — Болгарія втратила вихід до Егейського моря;", "• **Південна Добруджа** залишилася в складі Румунії;", "• **Королівству сербів, хорватів і словенців** — невеликі прикордонні землі (Царіброд, Босілеград, Струмиця);", "• військові обмеження й репарації."], "imgs": [{"key": "neuilly_map", "cap": "Втрати Болгарії за Нейським договором позначено червоним"}]}, {"type": "text", "title": "Севрський договір (Османська імперія)", "badges": [], "paras": ["• імперія відмовлялася від **арабських володінь**, визнавала британський протекторат над **Єгиптом**, французький — над **Марокко** й **Тунісом**, британську анексію **Кіпру**;", "• **Греції** — острови Егейського моря й район **Смірни (Ізміру)**, Італії й Франції — зони впливу в Анатолії;", "• визнавалася незалежність **Вірменії**;", "• **чорноморські протоки** переходили під міжнародний контроль, на території Туреччини залишалися війська Антанти."], "imgs": [{"key": "sevres_map", "cap": "Поділ Османської імперії за Севрським договором (англомовна карта): жовтим — те, що залишалося Туреччині"}], "tip": ["Севрський договір так і не набув чинності: турки під проводом **Мустафи Кемаля** підняли війну за незалежність. У 1923 р. його замінив Лозаннський договір (частина 3)."]}]}, {"id": "s3", "num": "III", "title": "Ліга Націй", "sub": "Статут, будова, слабкі місця, мандатна система", "cover": {"key": "geneva", "cap": "Палац Націй у Женеві — збудований для Ліги Націй"}, "cards": [{"type": "text", "title": "Нова міжнародна організація", "badges": [], "paras": ["**Ліга Націй** — перша в історії міжнародна організація, створена, щоб зберігати мир і розвивати співпрацю між державами.", "Її **Статут** був частиною Версальського та інших мирних договорів. Ліга почала діяти в **1920 р.**, штаб-квартира — у **Женеві** (Швейцарія).", "Задум Ліги полягав у тому, щоб замість таємної дипломатії й політики сили держави відкрито обговорювали спірні питання, а проти агресора діяли спільно — економічними й військовими **санкціями**."], "imgs": [{"key": "league_logo", "cap": "Емблема Ліги Націй"}, {"key": "league_map", "cap": "Держави — члени Ліги Націй у 1920 р. виділено синім"}]}, {"type": "doc", "title": "Зі Статуту Ліги Націй", "quote": ["**Стаття 10.** Члени Ліги зобов’язуються поважати й зберігати проти кожного зовнішнього нападу територіальну цілісність та існуючу політичну незалежність усіх членів Ліги…", "**Стаття 11.** …будь-яка війна або загроза війни, зачіпає вона прямо чи ні будь-кого з членів Ліги, становить інтерес для Ліги в цілому…", "**Стаття 16.** Якщо член Ліги розв’язує війну, то він уважається таким, хто вчинив цей акт проти всіх інших членів Ліги. Останні зобов’язуються негайно розірвати з ним усі торговельні або фінансові відносини…"], "source": "Статут Ліги Націй, 1919 р. (уривки)", "comment": ["Які статті передбачали спільний захист від нападу, а яка — покарання агресора?"]}, {"type": "text", "title": "Будова Ліги Націй", "badges": [], "paras": ["• **Асамблея** — збори представників усіх держав-членів;", "• **Рада Ліги** — чотири постійні члени (Велика Британія, Франція, Італія, Японія) і чотири непостійні, які змінювалися;", "• **Секретаріат** на чолі з Генеральним секретарем;", "• окремі комісії, зокрема **мандатна**.", "Рішення і в Асамблеї, і в Раді мали ухвалюватися **одноголосно**."], "imgs": [{"key": "league_struct", "cap": "Структура Ліги Націй"}]}, {"type": "text", "title": "Чому Ліга виявилася слабкою", "badges": [], "paras": ["• **США**, президент яких запропонував створити Лігу, так і не вступили до неї: сенат не схвалив Версальський договір;", "• спочатку до Ліги не прийняли переможену Німеччину й радянську Росію;", "• рішення вимагали одностайності — а її майже ніколи не було;", "• Ліга не мала власних збройних сил.", "Тож жодного серйозного військового конфлікту 1930-х років Ліга не відвернула й не змогла накласти на агресорів дієві санкції."], "imgs": [{"key": "bridge", "cap": "Британська карикатура «Прогалина в мості», 1919 р. Міст Ліги Націй задумав президент США, але ключового каменя — США — в ньому бракує"}]}, {"type": "text", "title": "Що Ліга таки змогла", "badges": [], "paras": ["• сприяла поліпшенню умов праці: нові стандарти, перехід багатьох країн на **8-годинний** робочий день і 48-годинний тиждень;", "• боролася проти дитячої праці, залишків рабства й работоргівлі;", "• заборонила легальну міжнародну торгівлю наркотиками (передусім опіатами);", "• допомагала біженцям і переміщеним особам. Для людей без громадянства запровадили **«нансенівський паспорт»**, названий на честь полярника Фрітьофа Нансена."], "imgs": [{"key": "nansen", "cap": "«Нансенівський паспорт» — посвідчення особи для біженців"}]}, {"type": "text", "title": "Мандатна система", "badges": [], "paras": ["Колонії Німеччини та арабські землі Османської імперії не повернули переможеним і не зробили незалежними. Ліга Націй передала їх в управління державам-переможницям за **мандатом** — дорученням.", "Залежно від рівня розвитку території поділили на три групи: **А**, **В** і **С**."], "imgs": [{"key": "mand_iraq", "cap": "Договір Великої Британії з Іраком — підмандатною територією групи «А»"}]}, {"type": "table", "title": "Групи мандатів", "rows": [["", "Що це означало", "Приклади"], ["Група «А»", "Території, які могли незабаром стати незалежними за допомоги держави-мандатарія", "Месопотамія (Ірак) — Велика Британія, до 1932 р.; Палестина — Велика Британія, до 1948 р.; Сирія й Ліван — Франція, до середини 1940-х рр."], ["Група «В»", "Території під безпосереднім управлінням держави-мандатарія", "Руанда-Урунді — Бельгія, до 1962 р.; Танганьїка (Танзанія) — Велика Британія, до 1961 р.; Камерун і Того — Велика Британія й Франція"], ["Група «С»", "Території, якими керували як частиною власної держави", "Південно-Західна Африка (Намібія) — Південно-Африканський Союз, до 1990 р.; Нова Гвінея — Австралія, до 1975 р.; Самоа — Нова Зеландія, до 1962 р."]]}, {"type": "carousel", "title": "Ліга Націй очима карикатуристів", "badges": [], "items": [{"key": "stork", "name": "«1919»", "desc": "Лелека з написом «1919» приносить немовля — «Лігу Націй». Чи довго, на думку автора, це «немовля» буде слабким?", "cap": ""}, {"key": "spectators", "name": "«Галерея глядачів»", "desc": "Американська карикатура: Ліга Націй спостерігає за бійкою держав, як глядач. Що автор думав про її можливості?", "cap": ""}], "note": null}]}]}, {"id": "p3", "num": 3, "title": "Мирні угоди після Першої світової війни", "part": "Частина 3. Вашингтонська система й 1920-ті роки", "sub": "Вашингтонська конференція, репараційне питання, конференції в Генуї, Лозанні, Локарно, пакт Бріана — Келлога", "cover": {"key": "washington", "cap": "Вашингтонська конференція, 1921–1922 рр."}, "sections": [{"id": "s1", "num": "I", "title": "Вашингтонська конференція", "sub": "Тихоокеанський регіон, обмеження флотів, Китай", "cover": {"key": "washington", "cap": "Засідання Вашингтонської конференції"}, "cards": [{"type": "text", "title": "Вашингтонська конференція", "badges": [], "paras": ["Відбулася у **Вашингтоні з листопада 1921 р. до лютого 1922 р.**", "**Мета** — обмежити озброєння й розв’язати проблеми Далекого Сходу та Тихоокеанського регіону, які залишила війна.", "Паризька конференція вирішувала долю Європи, а Вашингтонська — Азії й Тихого океану. Тут зіткнулися інтереси США, Великої Британії та Японії, яка за роки війни дуже посилилася."]}, {"type": "text", "title": "Договір «чотирьох»", "badges": [], "paras": ["**США, Велика Британія, Франція, Японія.**", "• на 10 років закріплено володіння цих держав на островах Тихого океану;", "• **припинив дію британсько-японський союз 1902 р.** — цього прагнули США."], "imgs": [{"key": "pacific", "cap": "Тихоокеанський регіон на мапі"}]}, {"type": "text", "title": "Договір «п’яти»", "badges": [], "paras": ["**США, Велика Британія, Японія, Франція, Італія.**", "Головне — обмеження військово-морських флотів. Встановили співвідношення великих бойових кораблів:", "**5 (Велика Британія) : 5 (США) : 3 (Японія) : 1,75 (Франція) : 1,75 (Італія).**", "Обмежили також розміри окремих типів кораблів. Британія вперше погодилася на рівність свого флоту з американським."], "imgs": [{"key": "ship1", "cap": "Лінійний корабель"}, {"key": "ship2", "cap": "Лінкори — головна сила флотів того часу"}]}, {"type": "text", "title": "Договір «дев’яти»", "badges": [], "paras": ["**США, Велика Британія, Японія, Франція, Італія, Бельгія, Нідерланди, Португалія, Китай.**", "• проголошено **суверенітет і територіальну цілісність Китаю**;", "• проголошено принцип **«відкритих дверей» і «рівних можливостей»** — усі держави мали однакове право торгувати з Китаєм;", "• водночас зберігалися нерівноправні угоди та іноземний контроль над китайськими митницями;", "• **Японія** мусила вивести війська з колишніх німецьких володінь у Китаї."], "imgs": [{"key": "china", "cap": "Китай і сусідні країни на мапі"}]}, {"type": "text", "title": "Значення Вашингтонської конференції", "badges": [], "paras": ["• закріпили становище, що склалося в Тихоокеанському регіоні;", "• гонку морських озброєнь на якийсь час зупинили або обмежили;", "• **Японія** залишилася незадоволеною: її загарбницькі плани в регіоні чітко обмежили.", "Рішення Паризької та Вашингтонської конференцій разом утворили **Версальсько-Вашингтонську систему** — міжнародний порядок, що діяв у світі між двома світовими війнами."]}]}, {"id": "s2", "num": "II", "title": "Репараційне питання", "sub": "Скільки мала заплатити Німеччина і що з цього вийшло", "cover": {"key": "rep_train", "cap": "Німецька техніка, передана в рахунок репарацій"}, "cards": [{"type": "defs", "title": "Позиції переможців щодо репарацій", "badges": [], "note": null, "items": [{"name": "Франція — Жорж Клемансо", "paras": ["Німці мають заплатити **за все**: Франція постраждала найбільше, на її землі точилися бої."], "img": {"key": "clem", "cap": ""}}, {"name": "Велика Британія — Девід Ллойд Джордж", "paras": ["Репараційні вимоги **не повинні перевищувати реальних можливостей** Німеччини, інакше вона не зможе платити."], "img": {"key": "lloyd", "cap": ""}}, {"name": "США — Вудро Вільсон", "paras": ["Мир має бути **без каральних репарацій**: помста лише посіє нову ворожнечу."], "img": {"key": "wilson", "cap": ""}}]}, {"type": "text", "title": "Репараційні проєкти", "badges": [], "paras": ["Переможці не могли домовитися, скільки має заплатити Німеччина. Остаточну суму — **132 млрд золотих марок** — встановили лише в 1921 р."], "imgs": [{"key": "ch_rep", "cap": "Суми, які пропонували різні держави, і остаточне рішення"}]}, {"type": "text", "title": "Як ділили репарації", "badges": [], "paras": ["Кожна держава прагнула отримати якомога більшу частку. Остаточно Франція отримала право на 52 %, Велика Британія — на 22 %, Італія — на 10 %; решту поділили між іншими переможцями."], "imgs": [{"key": "ch_share", "cap": "Плани розподілу репарацій і остаточне рішення (у %)"}]}, {"type": "text", "title": "Чим платила Німеччина", "badges": [], "paras": ["• щорічними грошовими внесками (у золотому еквіваленті);", "• корисними копалинами — насамперед вугіллям;", "• технікою, сільськогосподарським обладнанням, кораблями, паровозами тощо."], "imgs": [{"key": "rep_train", "cap": "Техніка, яку відправляють у рахунок репарацій"}]}, {"type": "text", "title": "Проблеми з виплатою (1920–1923)", "badges": [], "paras": ["• ослаблена війною економіка Німеччини не могла платити в повному обсязі — близько **3,5 млрд** золотих марок на рік;", "• у Німеччині почалася **гіперінфляція**: гроші знецінювалися щодня, ціни зростали в мільйони разів;", "• крім того, Німеччина намагалася скористатися суперечностями між Францією, Великою Британією та США й відтягнути виплати."], "imgs": [{"key": "inflation", "cap": "1923 р.: пачки знецінених грошей стали для дітей іграшками"}]}, {"type": "text", "title": "Окупація Рурської області", "badges": [], "paras": ["**4–5 січня 1923 р.** Франція пригрозила Німеччині окупацією Руру за несплату репарацій, а **11 січня** французькі й бельгійські війська зайняли **Рурську область** — там добували більше половини німецького вугілля й виплавляли понад 70 % чавуну й сталі.", "Німецький уряд закликав до **«пасивного опору»**: масові страйки, таємна фінансова підтримка страйкарів, відмова виконувати накази окупантів. Траплялися й саботаж та напади — загинуло понад 200 осіб.", "Окупація не окупилася: промисловість Руру майже зупинилася, а Франція й Бельгія витрачали великі кошти на утримання військ."], "imgs": [{"key": "ruhr_map", "cap": "Окупована Рурська область позначена фіолетовим"}, {"key": "ruhr_poster", "cap": "Німецький плакат: «Ні! Мене ви не змусите!»"}]}, {"type": "text", "title": "План Дауеса (1924 р.)", "badges": [], "paras": ["Глухий кут: Німеччина вже не могла чинити опір (її збитки перевищили 5 млрд марок), але й платити, як раніше, не могла. Франція й Бельгія теж зазнавали збитків.", "Американський фінансист і політик **Чарлз Дауес (Доуз)** запропонував спочатку допомогти Німеччині відродити економіку, щоб вона могла платити:", "• щорічні виплати — **від 1 до 2,5 млрд** марок (замість 3,5 млрд), залежно від стану економіки;", "• Німеччині надали кредит у **800 млн** марок, заохочували іноземні, передусім американські, інвестиції.", "План діяв близько шести років. За цей час Німеччина отримала кредитів набагато більше, ніж сплатила репарацій."], "imgs": [{"key": "dawes", "cap": "Чарлз Дауес"}, {"key": "ch_dawes", "cap": "Німеччина за план Дауеса: сплатила і отримала"}]}, {"type": "text", "title": "План Юнга (1930 р.)", "badges": [], "paras": ["Новий план підготував американський економіст і підприємець **Оуен Юнг (Янг)**.", "• загальну суму репарацій зменшили, щорічні платежі — **0,9–2,4 млрд** марок, трохи менше, ніж за планом Дауеса;", "• останній внесок мав надійти аж у **1988 р.**"], "imgs": [{"key": "young", "cap": "Оуен Юнг"}]}, {"type": "text", "title": "Кінець репараційних платежів", "badges": [], "paras": ["• з **1929 р.** світ охопила найбільша економічна криза в історії — **Велика депресія**;", "• у **1932 р.** провідні держави домовилися припинити міжнародні розрахунки, зокрема й виплату репарацій;", "• у **1933 р.** до влади в Німеччині прийшли нацисти, які взагалі відмовилися платити."], "tip": ["Цікаво: останній платіж за борговими зобов’язаннями, пов’язаними з Версальським договором, Німеччина здійснила **3 жовтня 2010 р.** — через 91 рік після підписання договору."]}, {"type": "text", "title": "Висновки", "badges": [], "paras": ["• з 1919 по 1932 р. Німеччина сплатила лише невелику частину загальної суми — за підрахунками, близько **17 %**;", "• сплативши **22 млрд** марок, вона отримала кредитів на **39 млрд**;", "• економічні статті Версальського договору так і не виконали."]}]}, {"id": "s3", "num": "III", "title": "Конференції та угоди 1920-х років", "sub": "Генуя, Рапалло, Гаага, Лозанна, Локарно, пакт Бріана — Келлога", "cover": {"key": "locarno", "cap": "Учасники Локарнської конференції, 1925 р."}, "cards": [{"type": "text", "title": "Генуезька конференція (1922 р.)", "badges": [], "paras": ["**Мета** — відновити міжнародну торгівлю, налагодити відносини з радянською Росією та колишніми країнами Четверного союзу.", "**Результати**: торгівлю відновлювали, але питання про **борги царського уряду** й **націоналізовані** більшовиками підприємства іноземців так і не розв’язали.", "Несподіваний підсумок — **Рапалльський договір** між Росією та Німеччиною (квітень 1922 р.): сторони відмовилися від взаємних претензій, встановили дипломатичні відносини й почали розвивати торгівлю. Дві держави-«ізгої» Версальської системи зблизилися."], "imgs": [{"key": "genoa", "cap": "Делегати Генуезької конференції"}]}, {"type": "text", "title": "Гаазька конференція (1922 р.)", "badges": [], "paras": ["**Мета**: домовитися з радянською Росією про повернення боргів і націоналізованих підприємств колишнім власникам.", "**Результат**: жодного питання не вирішили, переговори зайшли в глухий кут."]}, {"type": "text", "title": "Лозаннська конференція (1922–1923 рр.)", "badges": [], "paras": ["**Мета** — укласти з Туреччиною новий мирний договір замість Севрського та визначити режим чорноморських проток.", "За **Лозаннським договором** 1923 р.:", "• визнано нові кордони й незалежність **Туреччини**, яка зберегла Анатолію, Ізмір і Східну Фракію;", "• Туреччина **не мала військових обмежень і не платила репарацій**;", "• остаточно відмовилася від колишніх арабських володінь;", "• **протоки** демілітаризували й відкрили для вільного проходу суден, а кількість військових кораблів, які могли пройти до Чорного моря, обмежили."], "tip": ["Порівняйте: Севрський договір туркам нав’язали, а Лозаннський вони вибороли у війні. Туреччина — єдина з переможених країн, яка вже на початку 1920-х років домоглася перегляду свого мирного договору."]}, {"type": "map", "title": "Від Севра до Лозанни", "steps": [{"label": "Севр, 1920", "key": "sevres_en"}, {"label": "Лозанна, 1923", "key": "lausanne_map"}], "cap": "Порівняйте англомовні карти: якою мала стати Туреччина за Севрським договором і якою вона стала за Лозаннським."}, {"type": "text", "title": "Локарнська конференція (1925 р.)", "badges": [], "paras": ["**Мета** — закріпити західні кордони Німеччини.", "**Результати**: Німеччина, Франція й Бельгія визнали непорушність своїх кордонів, гарантами виступили Велика Британія та Італія. Рейнська область залишалася демілітаризованою.", "Східні кордони Німеччини (з Польщею й Чехо-Словаччиною) такої гарантії не отримали.", "Після Локарно, у **1926 р.**, Німеччину прийняли до **Ліги Націй**."], "imgs": [{"key": "locarno", "cap": "Густав Штреземан (Німеччина), Остін Чемберлен (Велика Британія) й Арістід Бріан (Франція) під час переговорів у Локарно"}]}, {"type": "doc", "title": "Пакт Бріана — Келлога (1928 р.)", "quote": ["**Стаття I.** Високі Договірні Сторони урочисто заявляють від імені своїх народів, що вони засуджують використання війни для врегулювання міжнародних суперечок і відмовляються від неї як знаряддя національної політики у своїх взаємних відносинах.", "**Стаття II.** Високі Договірні Сторони визнають, що врегулювання або вирішення всіх суперечок чи конфліктів, які можуть виникнути між ними, хоч би якого характеру чи походження вони були, має завжди здійснюватися тільки мирними засобами."], "source": "Договір про відмову від війни як знаряддя національної політики. Париж, 27 серпня 1928 р. (уривок)", "comment": ["Пакт запропонували міністр закордонних справ Франції **Арістід Бріан** і державний секретар США **Френк Келлог**. Згодом до нього приєдналася більшість держав світу.", "Слабке місце пакту: він не передбачав жодних санкцій проти тих, хто його порушить."], "img": {"key": "kellogg", "cap": "Підписання пакту в Парижі, 27 серпня 1928 р."}}, {"type": "text", "title": "Хто підписав пакт", "badges": [], "paras": ["Пакт Бріана — Келлога став першим міжнародним договором, учасники якого відмовилися від війни як засобу своєї політики. Проте вже в 1930-х роках його порушили Японія, Італія та Німеччина."], "imgs": [{"key": "kellogg_map", "cap": "Темно-зеленим — держави, що першими підписали пакт; світло-зеленим — ті, що приєдналися згодом; блакитним — їхні території; бірюзовим — підмандатні території"}]}, {"type": "text", "title": "Підсумок: Версальсько-Вашингтонська система", "badges": [], "paras": ["Версальський договір, договори з союзниками Німеччини, Статут Ліги Націй const h2 = t => t ? `<h2>${md(t)}</h2>` : '';
/* підпис: опис — звичайним шрифтом, автор і ліцензія — дрібно, щоб не відволікали від зображення */
const CREDIT = /((?:^|[.;,]\s+|\s)(?:Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення)[^:]{0,25}:.*|(?:^|[.;,]\s+)(?:Суспільне надбання|Public domain|Wikimedia Commons|CC BY|CC0).*|\s*\((?:фото|малюнок)[^)]*\)\s*)$/i;

  if (!cap) return '';

  if (!m || m.index === 0 && !/^\s*(Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення|Суспільне|Public|Wikimedia|CC)/i.test(cap)) return md(cap);
  const head = cap.slice(0, m.index).replace(/[.;,\s]+$/, ''), tail = m[0].replace(/^[.;,\s]+/, '');
  return `${head ? md(head) + (/[.!?…»]$/.test(head) ? '' : '.') + ' ' : ''}<span class="cr">${esc(tail)}</span>`;
}

const PERIODS_DEFAULT = null;

  },
};

/* ---------- навігація ---------- */
const P = id => LESSONS.find(l => l.id === id);
function secProgress(L, s) { const seen = store.get(`seen_${L.id}-${s.id}`, []).length; return Math.min(seen, s.cards.length); }
function partProgress(L) { let a = 0, b = 0; L.sections.forEach(s => { a += secProgress(L, s); b += s.cards.length; }); return [a, b]; }

function index() {
  document.title = TITLE;
  const L0 = LESSONS[0];
  /* тема «лише уроки» в спільній оболонці: посилання назад на полицю тем (у повному курсі його додає course.js) */

        <div class="prog-mini"><i style="width:${Math.round(100 * a / b)}%"></i></div></span></button>`; }).join('')}</div>

function partHome(L) {

       <p class="cap">Посилання працює, якщо файли лежать в одній папці.</p>` : '');

let obs = null;
function section(L, s) {
  document.title = `${s.num}. ${s.title} — ${TITLE}`;
  const k = L.sections.indexOf(s), next = L.sections[k + 1], nextPart = LESSONS[LESSONS.indexOf(L) + 1];
  const cards = s.cards.map((c, i) => `<section class="card" data-i="${i}">${(R[c.type] || R.generic)(c, i)}</section>`).join('');
  let end = next ? `<button class="btn" data-go="${L.id}-${next.id}">Далі: розділ ${next.num}. ${esc(next.title)} →</button>`
    : nextPart ? `<button class="btn" data-go="${nextPart.id}">Далі: ${esc(nextPart.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>` : '');
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="${L.id}">← Розділи</button><span class="ttl">${s.num}. ${md(s.title)}</span></div><div class="prog"><i id="pr"></i></div></div>
  <div class="wrap">
    <div class="hero">${fig(s.cover)}</div>
    <div class="sec-head"><div class="kick">Частина ${L.num} · розділ ${s.num}</div><h1>${md(s.title)}</h1><div class="sub">${md(s.sub)}</div></div>
    <div class="cards">${cards}</div>
    <div class="end">${end}<button class="btn ghost" data-go="${L.id}">До розділів</button></div>
  </div>`;
  wireGo();
  s.cards.forEach((c, i) => {
    if (c.type === 'carousel' && c.items.length > 1) {
      const car = document.getElementById('car' + i), dots = document.getElementById('dots' + i).children;
      car.addEventListener('scroll', () => {
        const kk = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 12));
        [...dots].forEach((d, j) => d.classList.toggle('on', j === kk));
      }, { passive: true });
    }
    if (c.type === 'map' && c.steps.length > 1) {
      const st = document.getElementById('st' + i), mp = document.getElementById('mp' + i);
      st.querySelectorAll('button').forEach(b => b.onclick = () => {
        st.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
        mp.innerHTML = fig({ key: c.steps[+b.dataset.i].key, cap: c.cap || '' });
      });
    }
  });
  const key = `seen_${L.id}-${s.id}`, seen = new Set(store.get(key, []));
  if (obs) obs.disconnect();
  obs = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { seen.add(+e.target.dataset.i); store.set(key, [...seen]); } });
  }, { threshold: 0.35 }) : null;
  if (obs) app.querySelectorAll('.card').forEach(el => obs.observe(el));
  window.scrollTo(0, 0);
}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;
}, { passive: false });
lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const pr = document.getElementById('pr'); if (!pr) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  pr.style.width = (max > 0 ? Math.min(100, 100 * scrollY / max) : 100) + '%';
}, { passive: true });


route();
</script>

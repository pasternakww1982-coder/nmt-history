і рівноправність у зовнішніх зносинах.»", "«Виходячи із смертельної небезпеки, яка нависла була над Україною в зв'язку з державним переворотом в СРСР 19 серпня 1991 року, продовжуючи тисячолітню традицію державотворення на Україні, виходячи з права на самовизначення... Верховна Рада Української Радянської Соціалістичної Республіки урочисто проголошує незалежність України та створення самостійної української держави — УКРАЇНИ.»", "«Верховна Рада України від імені Українського народу – громадян України всіх національностей, виражаючи суверенну волю народу, спираючись на багатовікову історію українського державотворення... дбаючи про зміцнення громадянської злагоди на землі України,... усвідомлюючи відповідальність перед Богом, власною совістю, попередніми, нинішнім та прийдешніми поколіннями, ...приймає цю Конституцію – Основний Закон України.»", "«1. Провести з ...грошову реформу в Україні. 2. Ввести в обіг визначену Конституцією та іншими законодавчими актами України національну валюту України, якою є гривня, та її соту частину – копійку.»"], "expl": "Декларація про державний суверенітет — 1990 р.; Акт проголошення незалежності — 1991 р.; Конституція («від імені Українського народу») — 1996 р.; указ про грошову реформу й гривню — 1996 р. (після Конституції, у серпні).", "src": "Власов, Варіант 4, № 51"}, {"id": "cvl6_41", "q": "Хто з названих діячів узяв участь у боротьбі за президентське крісло 1991 р.?\n\n1 В’ячеслав Чорновіл\n2 Петро Шелест\n3 Володимир Щербицький\n4 Ігор Юхновський\n5 Левко Лук’яненко\n6 Леонід Кучма", "sec": "s1", "g": "", "t": "single", "opts": ["1, 2, 6", "2, 3, 5", "3, 4, 6", "1, 4, 5"], "ok": [3], "expl": "На виборах 1 грудня 1991 р. балотувалися шестеро: Л. Кравчук (переміг), В. Чорновіл, Л. Лук’яненко, В. Гриньов, І. Юхновський і Л. Табурянський. П. Шелест і В. Щербицький — керівники УРСР за радянських часів, Л. Кучма став Президентом 1994 р.", "src": "Власов, Варіант 6, № 41"}, {"id": "cvl6_42", "q": "Яка з фотографій стосується періоду утворення незалежної України?", "sec": "s1", "g": "", "t": "single", "img": ["q_589cd6b6e3"], "opts": ["А", "Б", "В", "Г"], "ok": [0], "expl": "На фото А — Леонід Кравчук складає присягу першого Президента України (грудень 1991 р.). На інших — пізніші події: Ю. Тимошенко з А. Меркель, Л. Кучма під час огляду почесної варти, В. Ющенко з В. Януковичем.", "src": "Власов, Варіант 6, № 42"}, {"id": "cvl7_40", "q": "Імена яких історичних діячів пропущено в тексті джерела?\n\n8 грудня 1991 р. ____ підписали «Біловезькі угоди», внаслідок чого фактично припинив існування Радянський Союз. На його місці постала Співдружність незалежних держав (СНД), і саме представники України навідріз відмовилися делегувати новій структурі будь-які державні функції. Для України розпочалася епоха незалежності.\n1 Олександр Лукашенко\n2 Станіслав Шушкевич\n3 Леонід Кравчук\n4 Борис Єльцин\n5 Леонід Кучма\n6 Володимир Путін", "sec": "s1", "g": "", "t": "single", "opts": ["1, 2, 6", "2, 3, 4", "3, 4, 6", "1, 3, 5"], "ok": [1], "expl": "Біловезьку угоду 8 грудня 1991 р. підписали керівники трьох республік-засновниць СРСР: Леонід Кравчук (Україна), Борис Єльцин (Росія) і Станіслав Шушкевич (Білорусь).", "src": "Власов, Варіант 7, № 40"}, {"id": "cvl7_41", "q": "Повноправним членом яких міжнародних організацій та об’єднань є сьогодні Україна?", "sec": "s8", "g": "", "t": "single", "opts": ["Організація Північноатлантичного договору (НАТО)", "Співдружність Незалежних Держав (СНД)", "Європейський Союз (ЄС)", "Організація Об’єднаних Націй (ООН)"], "ok": [3], "expl": "Україна — член ООН з 1945 р. (тоді як УРСР, одна із засновниць). Членство в ЄС і НАТО — мета зовнішньої політики, а Статуту СНД Україна не ратифікувала й 2018 р. припинила участь у її органах.", "src": "Власов, Варіант 7, № 41"}, {"id": "cvl8_55", "q": "Які події відбулися за першої каденції президента Леоніда Кучми?", "sec": "s4", "g": "", "t": "three", "opts": ["ухвалення Верховною Радою Закону «Про Збройні сили України»", "ухвалення Конституції України", "затвердження Верховною Радою державних символів України", "оформлення Української православної церкви Київського патріархату", "прийняття України до Ради Європи", "запровадження національної валюти – гривні", "ухвалення Верховною Радою Акта проголошення незалежності України"], "ok": [1, 4, 5], "expl": "Перша каденція Кучми — 1994 – 1999 рр.: вступ до Ради Європи (1995), Конституція й гривня (1996). Закон про Збройні Сили й Акт незалежності — 1991 р., державні символи — 1992 р., УПЦ КП — 1992 р.", "src": "Власов, Варіант 8, № 55"}, {"id": "ckn1_42", "q": "Який чинник сприяв становленню економіки незалежної України?", "sec": "s3", "g": "", "t": "single", "opts": ["деформація структури економіки, переважання важкої промисловості", "неконкурентноспроможність промислової продукції на світовому ринку", "відсутність завершеного циклу виробництва товарів у більшості галузей", "наявність кваліфікованої та дешевої робочої сили, наукового потенціалу"], "ok": [3], "expl": "Україна мала освічених і порівняно дешевих працівників, наукові інститути й конструкторські бюро — це допомагало економіці. Решта варіантів — проблеми, що гальмували розвиток.", "src": "Коніщева, Тест 1, № 42"}, {"id": "ckn2_41", "q": "У чому полягає історичне значення проведення Всеукраїнського референдуму 1991 р.?", "sec": "s1", "g": "", "t": "single", "opts": ["сприяв визнанню незалежності України більшістю держав світу", "юридично закріпив основні права й обов’язки громадян України", "надав Україні можливість вийти зі складу СРСР мирним шляхом", "визначив основні напрями внутрішньої і зовнішньої політики УРСР"], "ok": [0], "expl": "Референдум 1 грудня 1991 р. показав, що незалежність підтримує переважна більшість громадян. Після нього Україну визнали десятки держав.", "src": "Коніщева, Тест 2, № 41"}, {"id": "ckn2_42", "q": "У якому році Україна вступила до Ради Європи, одержавши можливість брати участь у виробленні спільної правової політики європейських держав?", "sec": "s8", "g": "", "t": "single", "opts": ["1991 р.", "1995 р.", "2000 р.", "2008 р."], "ok": [1], "expl": "Україна стала членом Ради Європи 9 листопада 1995 р. За умовами вступу вона мала ухвалити Конституцію й скасувати смертну кару.", "src": "Коніщева, Тест 2, № 42"}, {"id": "ckn2_48", "q": "Установіть відповідність між змістом та назвами історичних документів", "sec": "s1", "g": "", "t": "match", "opts": ["Акт проголошення незалежності України", "Декларація про державний суверенітет України", "Закон УРСР «Про освіту»", "Закон України «Про громадянство України»", "Конституція України"], "ok": [4, 1, 2, 0], "left": ["«Людина, її життя і здоров’я, честь і гідність, недоторканність і безпека визнаються в Україні найвищою соціальною цінністю. …Утвердження і забезпечення прав і свобод людини є головним обов’язком держави»", "«Верховна Рада Української РСР… проголошує державний сувере\u0002нітет України як верховенство, самостійність, повноту і неподільність влади Республіки в межах її території та незалежність і рівноправність у зовнішніх відно\u0002синах…»", "«Громадяни Української РСР мають право на освіту незалежно від статі, расової, національної приналежності, соціального і майнового стану, роду та характеру занять, світоглядних переконань, віросповідання, здоров’я, місця проживання…»", "«Виходячи зі смертельної небезпеки, яка нависла над Україною в зв’язку з державним переворотом в СРСР, …виходячи з права на самовизначення, …Верховна Рада Україн\u0002ської РСР урочисто проголошує незалежність України…»"], "expl": "Конституція 1996 р. проголошує людину найвищою соціальною цінністю; Декларація 16 липня 1990 р. — суверенітет УРСР; закон «Про освіту» гарантує право на освіту; Акт 24 серпня 1991 р. посилається на небезпеку державного перевороту в СРСР.", "src": "Коніщева, Тест 2, № 48"}, {"id": "ckn3_41", "q": "Із якого документа наведено витяг:\n\n«Людина, її життя і здоров’я, честь і гідність, недоторканність і безпека визнаються в Україні найвищою соціальною цінністю....Утвердження і забезпечення прав і свобод людини є головним обов’язком держави»?", "sec": "s4", "g": "b1-const3", "t": "single", "opts": ["Акт проголошення незалежності України", "Декларація про державний суверенітет України", "Закон України «Про громадянство України»", "Конституція України"], "ok": [3], "expl": "Слова про людину як найвищу соціальну цінність — зі статті 3 Конституції України 1996 р.", "src": "Коніщева, Тест 3, № 41"}, {"id": "ckn4_42", "q": "Які повноваження мав Президент України за Конституцією України 1996 р. (до змін 2004 р.)?", "sec": "s4", "g": "", "t": "single", "opts": ["прийняття законів, внесення змін до Конституції України, визначення засад внутрішньої та зовнішньої політики", "вирішення питань про відповідність Конституції України законів та інших правових актів Верховної Ради", "розроблення та здійснення загальнодержавних програм економічного, соціального й культурного розвитку", "призначення прем’єр-міністра України, членів Кабінету Міністрів і припинення їхніх повноважень"], "ok": [3], "expl": "За Конституцією 1996 р. Президент призначав прем’єр-міністра за згодою Ради й членів уряду; після змін 2004 р. уряд призначає Верховна Рада. Закони ухвалює Рада, відповідність законів Конституції визначає Конституційний Суд, загальнодержавні програми розробляє Кабінет Міністрів.", "src": "Коніщева, Тест 4, № 42"}, {"id": "ckn5_40", "q": "Коли Верховна Рада України ухвалила документ, витяг із якого наведено:\n\n«Людина, її життя і здоров’я, честь і гідність, недоторканність і безпека визнаються в Україні найвищою соціальною\nцінністю. …Утвердження і забезпечення прав і свобод людини є головним обов’язком держави»?", "sec": "s4", "g": "b1-const3", "t": "single", "opts": ["16 липня 1990 р.", "24 серпня 1991 р.", "1 грудня 1991 р.", "28 червня 1996 р."], "ok": [3], "expl": "Це стаття 3 Конституції України, ухваленої 28 червня 1996 р.", "src": "Коніщева, Тест 5, № 40"}, {"id": "ckn6_40", "q": "У чому полягає історичне значення документа, витяг із якого наведено:\n\n«Виходячи зі смертельної небезпеки, яка нависла над Україною в зв’язку з державним переворотом в СРСР…, продовжуючи тисячолітню традицію державотворення в Україні, виходячи з права на самовизначення, передбаченого Статутом ООН та іншими міжнародно-правовими документами, …Верховна Рада Української Радянської Соціалістичної Республіки урочисто проголошує незалежність України…»?", "sec": "s1", "g": "", "t": "single", "opts": ["сприяв визнанню незалежності України більшістю держав світу", "юридично закріпив основні права й обов’язки громадян України", "надав Україні можливість вийти зі складу СРСР мирним шляхом", "визначив основні напрями внутрішньої і зовнішньої політики УРСР"], "ok": [2], "expl": "Це Акт проголошення незалежності 24 серпня 1991 р. Його ухвалила законна Верховна Рада УРСР, тож Україна вийшла з СРСР без війни. Права громадян закріплює Конституція, а визнанню у світі сприяв референдум.", "src": "Коніщева, Тест 6, № 40"}, {"id": "ckn6_41", "q": "Який чинник сприяв державотворчому процесу в Україні в 1991‒1994 рр.?", "sec": "s1", "g": "", "t": "single", "opts": ["незавершеність формування української нації", "мирний шлях здобуття Україною незалежності", "кризовий стан економіки і падіння виробництва", "корупція і хабарництво у вищих ешелонах влади"], "ok": [1], "expl": "Незалежність Україна здобула мирно, без збройного конфлікту, а її підтримали майже всі громадяни й політичні сили. Криза, корупція й незавершеність формування нації державотворенню заважали.", "src": "Коніщева, Тест 6, № 41"}, {"id": "ckn6_42", "q": "Які повноваження має Кабінет Міністрів України відповідно до Конституції України?", "sec": "s4", "g": "", "t": "single", "opts": ["розроблення та здійснення загальнодержавних програм економічного, соціального й культурного розвитку", "призначення прем’єр-міністра України, членів Кабінету Міністрів і припинення їхніх повноважень", "прийняття законів, внесення змін до Конституції України, визначення засад внутрішньої та зовнішньої політики", "вирішення питань про відповідність Конституції України законів та інших правових актів Верховної Ради"], "ok": [0], "expl": "Кабінет Міністрів — вищий орган виконавчої влади: розробляє й виконує загальнодержавні програми розвитку. Закони ухвалює Рада, Конституційний Суд перевіряє закони на відповідність Конституції.", "src": "Коніщева, Тест 6, № 42"}, {"id": "ckn7_42", "q": "Укажіть портрет першого всенародно обраного Президента незалежної України.", "sec": "s1", "g": "", "t": "single", "img": ["q_d96f41c268"], "opts": ["А", "Б", "В", "Г"], "ok": [2], "expl": "Першим всенародно обраним Президентом став Леонід Кравчук (В), 1 грудня 1991 р. На інших портретах — Л. Кучма, В. Ющенко, П. Порошенко.", "src": "Коніщева, Тест 7, № 42"}, {"id": "n01", "q": "Конституцію «Республіки Крим» 1992 р. і посаду президента Криму Верховна Рада України скасувала за президентства", "sec": "s2", "g": "b1-005", "t": "single", "opts": ["Л. Кравчука", "Л. Кучми", "В. Ющенка", "В. Януковича"], "ok": [1], "expl": "17 березня 1995 р., за Президента Леоніда Кучми, Верховна Рада скасувала кримську Конституцію 1992 р. і посаду президента Криму. Конституція України 1996 р. закріпила статус Автономної Республіки Крим як невід’ємної частини України.", "src": "нове (за зразком ЗНО)"}, {"id": "n02", "q": "Згідно з Конституцією України 1996 р. Крим має статус", "sec": "s2", "g": "", "t": "single", "opts": ["Автономної Республіки Крим у складі України", "національної автономії кримських татар", "суверенної республіки, пов’язаної з Україною договором", "області з особливим статусом, як і Севастополь"], "ok": [0], "expl": "Конституція 1996 р. закріпила, що Автономна Республіка Крим — невід’ємна складова частина України. Спеціальний статус Конституція надала містам Києву й Севастополю, а не Криму. Автономія 1991 р. була територіальною (усього півострова), а не національною автономією кримських татар.", "src": "нове (за зразком ЗНО)"}, {"id": "n03", "q": "На Всеукраїнський референдум 16 квітня 2000 р. було винесено питання про", "sec": "s5", "g": "", "t": "single", "opts": ["перехід до парламентсько-президентської республіки", "скорочення кількості народних депутатів з 450 до 300", "надання російській мові статусу другої державної", "вступ України до Організації Північноатлантичного договору"], "ok": [1], "expl": "Л. Кучма виніс на референдум чотири питання, що посилювали владу Президента: право Президента розпустити Раду, обмеження депутатської недоторканності, скорочення депутатів з 450 до 300, двопалатний парламент. Рада ці зміни до Конституції так і не ухвалила.", "src": "нове (за зразком ЗНО)"}, {"id": "n04", "q": "Акції «Україна без Кучми» (грудень 2000 – березень 2001 р.) розпочалися після", "sec": "s5", "g": "", "t": "single", "opts": ["оприлюднення аудіозаписів, пов’язаних зі зникненням Г. Гонгадзе", "фальсифікації результатів виборів Президента України", "ратифікації Верховною Радою Харківських угод з Росією", "вотуму недовіри уряду Віктора Ющенка у Верховній Раді"], "ok": [0], "expl": "У листопаді 2000 р. О. Мороз оприлюднив записи з кабінету Кучми, на яких обговорювали журналіста Георгія Гонгадзе («касетний скандал»). Харківські угоди — 2010 р., відставка уряду Ющенка — квітень 2001 р., уже після акцій.", "src": "нове (за зразком ЗНО)"}, {"id": "n13", "q": "Уряд, який у 2000 р. виплатив заборговані зарплати й пенсії та домігся першого після 1990 р. зростання економіки, очолював", "sec": "s5", "g": "", "t": "single", "opts": ["Віктор Ющенко", "Віктор Янукович", "Леонід Кучма", "Юлія Тимошенко"], "ok": [0], "expl": "Віктор Ющенко очолював уряд з грудня 1999 до квітня 2001 р.; віцепрем’єркою з питань енергетики була Ю. Тимошенко. Л. Кучма тоді був Президентом, а В. Янукович став прем’єр-міністром 2002 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n14", "q": "Співіснування в державі багатьох віросповідань і церков, які мають рівні права, називають", "sec": "s9", "g": "", "t": "single", "opts": ["поліконфесійністю", "екуменізмом", "автокефалією", "плюралізмом"], "ok": [0], "expl": "В Україні діють кілька православних церков, УГКЦ, римо-католики, протестанти, мусульмани, юдеї — це поліконфесійність. Екуменізм — рух за єднання християн, автокефалія — незалежність церкви.", "src": "нове (за зразком ЗНО)"}, {"id": "n15", "q": "Хто з українців 1997 р. здійснив космічний політ на американському кораблі «Колумбія»?", "sec": "s9", "g": "", "t": "single", "opts": ["Леонід Каденюк", "Сергій Корольов", "Олег Антонов", "Микола Амосов"], "ok": [0], "expl": "Леонід Каденюк — перший космонавт незалежної України: у листопаді – грудні 1997 р. він 16 днів працював на борту «Колумбії». С. Корольов — конструктор ракет, О. Антонов — літаків, М. Амосов — кардіохірург.", "src": "нове (за зразком ЗНО)"}]}, "2": {"n": 30, "pass": 75, "timer": true, "quota": {"s1": 2, "s2": 2, "s3": 3, "s4": 2, "s5": 5, "s6": 5, "s7": 2, "s8": 2, "s9": 7}, "pool": [{"id": "z969", "q": "Установіть послідовність подій суспільно-культурного життя, що відображені в цитованих документах.", "sec": "s9", "g": "", "t": "seq", "opts": ["«Зворотною стороною буржуазного націоналізму є безрідний космополітизм, який проявляється в плазуванні та низькопоклонстві перед іноземщиною. Безрідний космополітизм є зброєю в боротьбі проти соціалізму...»", "«Комуністи у своїх виступах піддали критиці новий роман О. Гончара «Собор». Висловлюючи жаль, що зрілий майстер художнього слова як у кривому дзеркалі показав працю, побут, духовний світ металургів і колгоспників Подніпров’я…»", "«...Репресії показали, що в дискусії з українськими «дисидентами» влада не знайшла більш переконливих аргументів, ніж застосування сили, а умови в таборах переконали мене у тім, що простір застосування цієї сили не знає кінця...»", "«Низька технічна оснащеність наукових лабораторій, різке зниження життєвого рівня і соціальна незахищеність призвели до масового виїзду багатьох вчених за кордон, переходу їх до комерційних структур…»"], "expl": "Боротьба з «безрідним космополітизмом» — кінець 1940-х рр.; критика роману О. Гончара «Собор» — 1968 р.; репресії проти дисидентів — 1970-ті рр.; занепад науки через бідність — 1990-ті рр.", "src": "ЗНО 2012 – 2 сесія (№ 56)"}, {"id": "z1123", "q": "Установіть послідовність набуття Україною членства в міжнародних організаціях.", "sec": "s9", "g": "b2-memb-seq", "t": "seq", "opts": ["Співдружність Незалежних Держав", "Нарада (Організація) з безпеки та співробітництва в Європі", "Рада Європи", "Світова організація торгівлі"], "expl": "СНД — грудень 1991 р.; НБСЄ (ОБСЄ) — січень 1992 р.; Рада Європи — 1995 р.; СОТ — 2008 р.", "src": "ЗНО 2010 – 1 сесія (№ 60)"}, {"id": "z1808", "q": "Установіть відповідність між періодами історії України та описаними подіями.", "sec": "s9", "g": "", "t": "match", "opts": ["«...Засідання рекомендує, щоб Українська Радянська Соціалістична Республіка і Білоруська Радянська Соціалістична Республіка були запрошені стати членами — засновниками пропонованої міжнародної організації...»", "«Понад мільйон осіб, винних у порушенні антиалкогольного законодавства, зазнали адміністративних стягнень. У Закарпатті та в Криму знищили виноградники унікальних сортів. Цукор став гостродефіцитним продуктом...»", "«В оголошенні про утворення Української Гельсінської групи її засновники підписалися справжніми прізвищами і навіть вказали свої адреси. Вони мали намір діяти виключно на легальних засадах...»", "«Нарешті ми сіли за стіл переговорів. Єльцин представляв на зустрічі Росію, Фокін — Україну, Шушкевич — Білорусь… На зустрічі було сформульовано принципи майбутньої співдружності…»", "«У рік святкування 300-річчя возз’єднання України з Росією Президія Верховної Ради СРСР прийняла Постанову \"Про передачу Кримської області зі складу РРФСР до складу УРСР\"»."], "ok": [4, 2, 1, 3], "left": ["Відлига (1953–1964 рр.)", "Застій (середина 1960 — початок 1980-х рр.)", "Перебудова (1985–1991 рр.)", "Незалежність (1991 — початок XXI ст.)"], "expl": "Передача Криму УРСР (1954) — доба відлиги; Українська Гельсінська група (1976) — «застій»; антиалкогольна кампанія (1985) — перебудова; Біловезька зустріч (грудень 1991 р.) — незалежність. А — 1945 р., УРСР запрошують до ООН.", "src": "ЗНО 2010 – пробний тест (№ 55)"}, {"id": "z1813", "q": "Установіть послідовність ухвалення цитованих документів.", "sec": "s9", "g": "", "t": "seq", "opts": ["«Виходячи зі смертельної небезпеки, яка нависла над Україною у зв’язку з державним переворотом в СРСР... продовжуючи тисячолітню історію державотворення в Україні... Верховна Рада Української РСР урочисто проголошує незалежність України...»", "«Ми, Республіка Білорусь, Російська Федерація (РСФСР), Україна, як держави-засновники Союзу РСР, що підписали Союзний договір 1922 року... констатуємо, що Союз РСР як суб’єкт міжнародного права і геополітична реальність припиняє своє існування...»", "«...Україна є суверенна і незалежна, демократична, соціальна, правова держава. ...Україна є унітарною державою. ...Людина, її життя і здоров’я, честь і гідність, недоторканність і безпека визнаються в Україні найвищою соціальною цінністю...»", "«...вшановуючи пам’ять мільйонів співвітчизників, які стали жертвами Голодомору 1932–1933 років в Україні та його наслідків... Верховна Рада України приймає цей Закон. Стаття 1. Голодомор 1932–1933 років в Україні є геноцидом Українського народу»."], "expl": "Акт проголошення незалежності — 24 серпня 1991 р.; Біловезька угода — 8 грудня 1991 р.; Конституція — 1996 р.; закон про Голодомор — 2006 р.", "src": "ЗНО 2010 – пробний тест (№ 60)"}, {"id": "z7913", "q": "2014 рік – це рік, коли Україна", "sec": "s6", "g": "", "t": "single", "opts": ["підписала Угоду про асоціацію з Європейським Союзом (ЄС).", "стала членом Ради Європи (РЄ).", "приєдналася до програми НАТО «Партнерство заради миру».", "вступила до Світової організації торгівлі (СОТ)."], "ok": [0], "expl": "Угоду про асоціацію з ЄС Україна підписала 2014 р.: політичну частину — 21 березня, економічну — 27 червня. Рада Європи — 1995 р., «Партнерство заради миру» — 1994 р., СОТ — 2008 р.", "src": "ЗНО 2015 – основна сесія (№ 42)"}, {"id": "z7920", "q": "Установіть відповідність між описаним явищем соціально-економічного життя та періодом історії України, для якого воно було характерним.", "sec": "s9", "g": "b2-socper", "t": "match", "opts": ["«післявоєнна відбудова» (1945 – початок 1950-х рр.)", "«відлига» (1953 – 1964 рр.)", "«застій» (середина 1960-х – початок 1980-х рр.)", "«перебудова» (1985–1991 рр.)", "«незалежність» (1991 р. – початок ХХІ ст.)"], "ok": [1, 4, 3, 2], "left": ["«Основна частина підприємств місцевого значення перейшла з відання союзних міністерств у підпорядкування обласних рад депутатів. Місцеві органи влади одержали широкі права у вирішенні матеріально-фінансових питань…».", "«Економічне протистояння, що виникло внаслідок внесення митною службою Росії усіх українських імпортерів до переліку «ризикованих», призвело до блокади поставок товарів з України до Росії…»", "«Понад мільйон осіб, винних у порушенні антиалкогольного законодавства, зазнали адміністративних стягнень. У Закарпатті та в Криму знищили виноградники унікальних сортів…»", "«Продовольча програма виходить із необхідності скоротити імпорт продовольства з капіталістичних країн, оскільки деякі держави прагнуть перетворити продаж зерна на засіб політичного тиску…»"], "expl": "Раднаргоспи й передача підприємств областям — відлига; «митна війна» з Росією (2013) — незалежність; антиалкогольна кампанія — перебудова; Продовольча програма (1982) — «застій».", "src": "ЗНО 2015 – основна сесія (№ 48)"}, {"id": "z8239", "q": "Зображений рисунок слід використовувати для ілюстрації подій", "sec": "s3", "g": "b2-003", "t": "single", "img": ["q_02e81ae1b4"], "opts": ["Помаранчевої революції.", "культурної революції.", "Революції гідності.", "Революції на граніті."], "ok": [2], "expl": "Людина читає книжку на барикаді з автомобільних шин під прапором із тризубом, іде сніг — образ Майдану зими 2013 – 2014 рр., Революції Гідності.", "src": "ЗНО 2015 – додаткова сесія (№ 42)"}, {"id": "z9194", "q": "Яке фото слід використовувати для ілюстрації подій Революції гідності?", "sec": "s3", "g": "", "t": "single", "oimg": ["q_845958a3ae", "q_21bff0038a", "q_8ba9597b2b", "q_66fa738491"], "opts": ["А", "Б", "В", "Г"], "ok": [2], "expl": "На фото В — прапори Євросоюзу й України: Євромайдан, листопад 2013 р. А — Помаранчева революція 2004 р. (напис «Ющенко»), Б і Г — мітинги 1990 р. (гасла проти КПРС, «239 — ганьба»).", "src": "ЗНО 2016 – пробний тест (№ 23)"}, {"id": "z9388", "q": "«Не зміна облич при владі, а зміна системи, і найголовніше - пошук інструментарію для зміни цієї системи», на думку письменниці та публіциста О. Забужко, стало гаслом", "sec": "s3", "g": "b2-003", "t": "single", "opts": ["«Революції гідності».", "«культурної революції».", "«Помаранчевої революції».", "«революції згори»."], "ok": [0], "expl": "Революція Гідності вимагала не просто змінити керівників, а змінити систему влади: подолати корупцію, свавілля силовиків, забезпечити справедливий суд. Помаранчева революція 2004 р. принесла переважно зміну облич.", "src": "ЗНО 2016 – основна сесія (№ 22)"}, {"id": "z9389", "q": "Характеризуючи події, відображені на карикатурі, доцільно використовувати поняття", "sec": "s4", "g": "b2-004", "t": "single", "img": ["q_164eb93d08"], "opts": ["«депортація».", "«мобілізація».", "«лібералізація».", "«анексія»."], "ok": [3], "expl": "Людина голосує біля скриньки «Крим», оточена озброєними військовими: псевдореферендум 16 березня 2014 р. під дулами російських автоматів. Насильницьке приєднання чужої території — анексія.", "src": "ЗНО 2016 – основна сесія (№ 23)"}, {"id": "z12125", "q": "Розташуйте зображені карикатури за часом їх створення.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_e8747f21b4", "q_ea11f5a9b6", "q_2770443f6a", "q_f4350b4aaa"], "opts": ["Б", "А", "Г", "В"], "expl": "Карикатура на генетику («менделізм-морганізм») — 1948 р.; кукурудза «до самої шиї» — Хрущов (1950 – 1960-ті); талони на цукор — кінець 1980-х рр.; «Влада» й «Бізнес», що зрослися ніжками, — незалежна Україна.", "src": "ЗНО 2017 – основна сесія (№ 28)"}, {"id": "z12557", "q": "Події «Революції гідності» стали каталізатором", "sec": "s6", "g": "", "t": "single", "opts": ["підписання Україною Угоди про асоціацію з Європейським Союзом (ЄС).", "входження України до Світової організації торгівлі (СОТ).", "створення Співдружності Незалежних Держав (СНД).", "обрання України членом Ради Європи (РЄ)."], "ok": [0], "expl": "Майдан почався через відмову Януковича підписати Угоду про асоціацію. Після перемоги Революції Гідності Угоду підписали 2014 р.", "src": "ЗНО 2017 – додаткова сесія (№ 23)"}, {"id": "z12560", "q": "З’ясуйте, якого періоду історії України стосується зміст кожного з наведених уривків.", "sec": "s9", "g": "b2-src", "t": "match", "opts": ["Україна в перші післявоєнні роки (1945 – початок 1950-х рр.)", "Україна в умовах десталінізації (1953–1964 рр.)", "Україна в період загострення кризи радянської системи (1965–1985 рр.)", "розпад Радянського Союзу та відродження незалежності України (1985–1991 рр.)", "Україна в умовах незалежності (1991 р. – початок XXI ст.)"], "ok": [3, 4, 1, 2], "left": ["«Вихід на політичну арену значної кількості нових суспільних формувань змінив сам характер виборів, зробивши основний акцент на їх альтернативності (на 450 мандатів у Верховну Раду УРСР претендувало майже три тисячі кандидатів)…»", "«Стійкість і мужність української армії, підтримка армії з боку українського народу стали основними чинниками, які, поряд із тиском Заходу, змушували Росію йти на «заморожування» агресії...»", "«Враховуючи, що існуючі обмеження в становищі перебуваючих на спецпоселенні виселених кримських татар …у подальшому не є необхідними, Президія Верховної Ради СРСР ухвалює: …звільнити з-під адміністративного нагляду кримських татар…»", "«…У СРСР побудовано розвинене соціалістичне суспільство. На цьому етапі… все повніше розкриваються… переваги соціалістичного способу життя… Це суспільство зрілих соціалістичних суспільних відносин, у якому… склалася нова історична спільність – радянський народ…»"], "expl": "Скасування обмежень для кримських татар на спецпоселенні (1956) — десталінізація; «розвинений соціалізм» (Конституція 1977) — «застій»; альтернативні вибори 1990 р. — перебудова; мужність армії й Мінські угоди — незалежність.", "src": "ЗНО 2017 – додаткова сесія (№ 26)"}, {"id": "z14993", "q": "На карикатурі відображено запити сучасного українського суспільства щодо", "sec": "s6", "g": "", "t": "single", "img": ["q_5afa846daa"], "opts": ["розв’язання проблем забруднення навколишнього середовища.", "подолання кризи фінансової та банківської систем.", "проведення масштабного очищення органів державної влади.", "упровадження новітніх біотехнологій у виробництво."], "ok": [2], "expl": "Плакат «Люстрація вимагає рішучих дій!»: чиновників скидають у смітник. Після Революції Гідності суспільство вимагало очистити владу; 2014 р. ухвалено закон «Про очищення влади».", "src": "ЗНО 2018 – основна сесія (№ 23)"}, {"id": "z15515", "q": "Поява в європейських засобах масової інформації зображеної карикатури зумовлена", "sec": "s6", "g": "", "t": "single", "img": ["q_23c14d0b18"], "opts": ["підписанням Україною Будапештського меморандуму.", "укладанням Україною Угоди про асоціацію з Європейським Союзом.", "вступом України до Організації безпеки та співробітництва в Європі (ОБСЄ).", "приєднанням України до програми НАТО «Партнерство заради миру»."], "ok": [1], "expl": "Україну на карикатурі схопила зубами Росія, а Європа простягає до неї руки. Карикатура з’явилася 2014 р., коли Україна підписала Угоду про асоціацію з ЄС, а Росія напала на неї.", "src": "ЗНО 2018 – додаткова сесія (№ 23)"}, {"id": "z16563", "q": "Увідповідніть подію та рік, коли вона відбулася.", "sec": "s9", "g": "b2-memb", "t": "match", "opts": ["1995 р.", "1996 р.", "2004 р.", "2008 р.", "2014 р."], "ok": [0, 3, 1, 4], "left": ["обрання України членом Ради Європи (РЄ)", "вступ України до Світової організації торгівлі (СОТ)", "запровадження національної грошової одиниці – гривні", "підписання Україною Угоди про асоціацію з Європейським Союзом (ЄС)"], "expl": "Рада Європи — 1995 р.; гривня — 1996 р.; СОТ — 2008 р.; Угода про асоціацію з ЄС — 2014 р.", "src": "ЗНО 2019 – пробний тест (№ 26)"}, {"id": "z16565", "q": "Установіть послідовність подій, зафіксованих на фото.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_95ce0768bd", "q_d9b16c533d", "q_2314e43a6a", "q_f26c13dcd8"], "opts": ["А", "В", "Б", "Г"], "expl": "Ліквідатори в респіраторах біля ЧАЕС — 1986 р.; студентське голодування — 1990 р.; «Україна без Кучми» — 2000 – 2001 рр.; прапори ЄС на Євромайдані — 2013 р.", "src": "ЗНО 2019 – пробний тест (№ 28)"}, {"id": "z17453", "q": "Установіть послідовність подій, зафіксованих на фото.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_736ee14830", "q_0e62d8b87c", "q_d47b4e3b83", "q_c9a1a8781b"], "opts": ["Г", "Б", "А", "В"], "expl": "Мітинг «Алкоголь і соціалізм несумісні» — 1985 – 1986 рр.; «Донбас — за самостійну Україну!» — 1991 р.; помаранчевий мітинг «Ющенко» — 2004 р.; барикади на Майдані — 2014 р.", "src": "ЗНО 2019 – основна сесія (№ 28)"}, {"id": "z18369", "q": "Поява та поширення в сучасному українському суспільстві поняття «кіборги» зумовлено", "sec": "s5", "g": "", "t": "single", "opts": ["протистоянням російській агресії в Криму.", "бойовими діями на Дебальцевському плацдармі.", "обороною на Маріупольському напрямку.", "захистом Донецького аеропорту."], "ok": [3], "expl": "«Кіборгами» назвали захисників Донецького аеропорту, які 242 дні (травень 2014 – січень 2015 р.) тримали оборону в зруйнованих терміналах.", "src": "ЗНО 2019 – додаткова сесія (№ 23)"}, {"id": "z18372", "q": "Увідповідніть період в історії України з поняттями й термінами, які потрібно використовувати для його характеристики.", "sec": "s9", "g": "b2-periods", "t": "match", "opts": ["«культ особи», «лібералізація», «раднаргоспи», «хрущовки»", "«розвинений соціалізм», «тамвидав», «номенклатура», «застій»", "«колабораціонізм», «Східний вал», «план “Барбаросса”», «випалена земля»", "«сепаратизм», «поліконфесійність», «люстрація», «волонтерський рух»", "«холодна війна», «ждановщина», «відбудова», «лисенківщина»"], "ok": [4, 0, 1, 3], "left": ["Україна в перші повоєнні роки (1945 р. – початок 1950-х рр.)", "Україна в умовах десталінізації (1953–1964 рр.)", "Україна в період загострення кризи радянської системи (1965–1985 рр.)", "Україна в умовах незалежності (1991 р. – початок XXI ст.)"], "expl": "Ждановщина й лисенківщина — повоєнні роки; раднаргоспи й «хрущовки» — десталінізація; «розвинений соціалізм» і тамвидав — «застій»; люстрація й волонтерський рух — незалежна Україна. Східний вал і «випалена земля» — Друга світова.", "src": "ЗНО 2019 – додаткова сесія (№ 26)"}, {"id": "z19389", "q": "Проаналізуйте уривок з історичного джерела: «О 10.00 відкрито сесію Верховної Ради України, виступив Олександр Турчинов і заявив: “Більшість виконувачів обов’язків міністрів зникли в невідомому напрямку. Також невідомо, де перебуває президент. Тому єдиним легітимним органом у країні є Верховна Рада. Якщо впродовж декількох годин не буде встановлено місцезнаходження президента, парламент має проголосувати за постанову про відновлення конституційного ладу”». Коли відбулася подія, про яку йдеться в ньому?", "sec": "s3", "g": "b2-007", "t": "single", "opts": ["1999 р.", "2004 р.", "2008 р.", "2014 р."], "ok": [3], "expl": "О. Турчинов став головою Верховної Ради 22 лютого 2014 р., коли В. Янукович утік з Києва. Того дня Рада усунула Януковича з посади й призначила дострокові вибори Президента.", "src": "ЗНО 2020 – пробний тест (№ 23)"}, {"id": "z19391", "q": "Увідповідніть подію з її наслідком.", "sec": "s9", "g": "b2-cons", "t": "match", "opts": ["укладення Мінських угод", "ухвалення Верховною Радою УРСР Акта проголошення незалежності України", "підписання Україною Угоди про асоціацію з Європейським Союзом (ЄС)", "ухвалення Верховною Радою УРСР Декларації про державний суверенітет України", "створення Меджлісу кримськотатарського народу"], "ok": [3, 1, 2, 0], "left": ["перші альтернативні вибори до Верховної Ради УРСР", "спроба державного перевороту в СРСР", "«Революція Гідності»", "російська збройна агресія проти України"], "expl": "Альтернативні вибори 1990 р. → Декларація про суверенітет; заколот ДКНС → Акт незалежності; Революція Гідності → Угода про асоціацію з ЄС; агресія Росії → Мінські угоди.", "src": "ЗНО 2020 – пробний тест (№ 25)"}, {"id": "z20680", "q": "Розташуйте плакати відповідно до послідовності віх в історії України.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_bac4270c34", "q_dd364b80d6", "q_423ea0ddf0", "q_b3ce9db98f"], "opts": ["Г", "А", "В", "Б"], "expl": "Українські січові стрільці — 1914 – 1918 рр.; Карпатська Україна — 1938 – 1939 рр.; плакат «СРСР — тюрма народів» — УПА, 1940-ві рр.; «Кіборги» — 2014 – 2015 рр.", "src": "ЗНО 2020 – основна сесія (№ 28)"}, {"id": "z21322", "q": "Виникнення в суспільному повсякденному лексиконі поняття «Небесна сотня» зумовлено", "sec": "s3", "g": "", "t": "single", "opts": ["подіями «Революції Гідності».", "початком «Революції на граніті».", "проголошенням незалежності України.", "збройною агресією Росії проти України."], "ok": [0], "expl": "«Небесною сотнею» назвали учасників Революції Гідності, які загинули під час протестів, — переважно 18 – 20 лютого 2014 р.", "src": "ЗНО 2020 – додаткова сесія (№ 23)"}, {"id": "z21325", "q": "Увідповідніть описане явище соціально-економічного життя з періодом історії України, для якого воно було характерним.", "sec": "s9", "g": "b2-socper", "t": "match", "opts": ["Україна в перші повоєнні роки (1945 – на початку 1950-х рр.)", "Україна в умовах десталінізації (1953–1964 рр.)", "Україна в період загострення кризи радянської системи (1965–1985 рр.)", "Розпад Радянського Союзу та відродження незалежності України (1985–1991 рр.)", "Україна в умовах незалежності (1991 р. – початок ХХІ ст.)"], "ok": [1, 4, 3, 0], "left": ["«Основна частина підприємств місцевого значення перейшла з підпорядкування союзних міністерств у підпорядкування обласних рад депутатів. Місцеві органи влади одержали широкі права у вирішенні матеріально-фінансових питань…»", "«Економічне протистояння, що виникло внаслідок унесення митною службою Росії всіх українських імпортерів до переліку “ризикованих”, призвело до блокування поставок товарів з України до Росії…»", "«Соціалістичне самоврядування реалізують в умовах широкої гласності участю всього колективу та його громадських організацій у виробленні найважливіших рішень і контролі за виконанням їх, виборності керівників та єдиноначальності в управлінні підприємством…»", "«…Темпи промислового розвитку Західної України були вищими, ніж на Сході УРСР. У роки четвертої п’ятирічки тут споруджено понад 2,5 тис. великих і середніх промислових підприємств…»"], "expl": "Раднаргоспи — відлига; «митна війна» з Росією (2013) — незалежність; самоврядування трудових колективів і гласність — перебудова; відбудова й нові заводи в Західній Україні в четвертій п’ятирічці — повоєнні роки.", "src": "ЗНО 2020 – додаткова сесія (№ 26)"}, {"id": "z22859", "q": "Спеціальна місія якої міжнародної організації здійснює на Донбасі моніторинг і верифікацію виконання Мінських домовленостей?", "sec": "s5", "g": "", "t": "single", "opts": ["Організації Північноатлантичного договору (НАТО)", "Європейського Союзу (ЄС)", "Організації Об’єднаних Націй (ООН)", "Організації з безпеки і співробітництва в Європі (ОБСЄ)"], "ok": [3], "expl": "Спеціальна моніторингова місія ОБСЄ працювала в Україні з березня 2014 р. до 2022 р. і стежила за режимом припинення вогню, передбаченим Мінськими домовленостями.", "src": "ЗНО 2021 – пробний тест (№ 22)"}, {"id": "z22860", "q": "Плакат, зображений на фото, присвячено обороні", "sec": "s5", "g": "", "t": "single", "img": ["q_d1a929b5d0"], "opts": ["міста Іловайська.", "Донецького аеропорту.", "кургану Савур-Могила.", "Дебальцевського плацдарму."], "ok": [1], "expl": "«242 дні незламності» і зруйнована диспетчерська вежа — оборона Донецького аеропорту (2014 – 2015).", "src": "ЗНО 2021 – пробний тест (№ 23)"}, {"id": "z23826", "q": "Проаналізуйте уривок зі спогадів лідера кримських татар, народного депутата України Мустафи Джемілєва: «До речі, \"статистика\", що на \"референдумі\" було 83 % кримчан, із яких 96 % або 98 % висловилися за приєднання до Російської Федерації – абсолютна брехня. Ніколи такої активної участі в голосуванні не було й бути не може, там люди працюють у різних регіонах, а голосувати треба за місцем проживання. Зі 180 тис. кримських татар на \"дільниці\" прийшло тільки 900, до того ж більшість із них наївно думала, що потрібно сказати про своє бажання бути в складі України. І ми маємо секретне донесення ФСБ Криму своєму начальству в Москві. Реальна участь була 34,2 %, і не всі голосували за приєднання до РФ». Події якого року описано в ньому?", "sec": "s4", "g": "b2-007", "t": "single", "opts": ["1991 р.", "1996 р.", "2003 р.", "2014 р."], "ok": [3], "expl": "Ідеться про псевдореферендум у Криму 16 березня 2014 р., який провела Росія після захоплення півострова. Кримські татари його бойкотували.", "src": "ЗНО 2021 – основна сесія (№ 23)"}, {"id": "z24884", "q": "Укажіть фото Президента України, за каденції якого стали можливими зміни, описані в уривку джерела: «Адже за будь-яких умов оформлення візи потребує кількох днів, а з безвізом громадянин України може будь-коли перетинати кордон і в'їжджати до ЄС. Під дією безвізу український турист став почувати себе значно більш вільним, ніж раніше. Він набув можливості вибирати між значно більшою кількістю пропозицій відпочинку й подорожей, ніж за умов візового режиму».", "sec": "s6", "g": "", "t": "single", "oimg": ["q_1d0e84f50b", "q_f57ff52660", "q_8ef19693c6", "q_32e4de0ea5"], "opts": ["А", "Б", "В", "Г"], "ok": [1], "expl": "Безвізовий режим з ЄС діє з 11 червня 2017 р., за Президента Петра Порошенка (Б). На інших фото — В. Ющенко, Л. Кучма, Л. Кравчук.", "src": "ЗНО 2021 – додаткова сесія (№ 23)"}, {"id": "z24889", "q": "Установіть послідовність історичних подій, покладених в основу сюжетів сучасних фільмів, афіші яких зображено на фото.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_0226d0efd2", "q_9e8d98b217", "q_79fd30bb0e", "q_885458f16a"], "opts": ["Б", "В", "А", "Г"], "expl": "«Крути 1918» — 1918 р.; «Хайтарма» — депортація кримських татар 1944 р.; «Заборонений» — Василь Стус (1960 – 1980-ті); «Кіборги» — оборона Донецького аеропорту 2014 – 2015 рр.", "src": "ЗНО 2021 – додаткова сесія (№ 28)"}, {"id": "z26028", "q": "У листопаді 2016 р. Український інститут національної пам’яті та Український дім презентували мультимедійний виставковий проєкт «Відважні: наші герої», що відтворював образи різних поколінь українців ХХ – ХХІ століть через реконструкцію революційної атрибутики та вбрання учасників подій доби Української революції, Холодного Яру, Української повстанської армії, Революції на граніті, Помаранчевої революції, Революції Гідності. На фото зображено один із плакатів цього проєкту. З’ясуйте, яке з наведених тверджень відображає ідею, покладену в основу плаката.", "sec": "s3", "g": "", "t": "single", "img": ["q_d83733e96f"], "opts": ["Революція Гідності початку ХХІ ст., як і війна за збереження державної незалежності України початку ХХ ст., – заслуга лише молодих.", "Незалежність України час від часу окроплюється кров’ю патріотів: на початку ХХ ст. – героїв Крут, на початку ХХІ ст. – героїв Небесної сотні.", "Революція Гідності – не окремий, випадковий протест купки мітингувальників, а продовження столітньої боротьби за свободу й незалежність України.", "Завдячуючи тому, що на початку ХХ ст. перемогла Українська революція, на початку ХХІ ст. увінчалася перемогою й революція Гідності."], "ok": [2], "expl": "Плакат ставить поруч учасників Української революції 1917 – 1921 рр. і Революції Гідності: це одна столітня боротьба за свободу. Твердження, що це заслуга «лише молодих» чи що одна революція «завдячує» перемозі іншої, хибні.", "src": "НМТ 2022 – демоваріант (№ 15)"}, {"id": "z26153", "q": "Установіть відповідність між періодом (1–4) в історії України та поняттями й термінами (А – Д), які потрібно використовувати, характеризуючи його.", "sec": "s9", "g": "b2-periods", "t": "match", "opts": ["«самвидав», «номенклатура», «дефіцит», «правозахисник»", "«новий порядок», «радянізація», «план “Ост”», «депортація»", "«приватизація», «тимчасово окупована територія», «антитерористична операція (АТО)», «європейська інтеграція»", "«“саморозпуск” УГКЦ», «ждановщина», «космополітизм», «лисенківщина»", "«відлига», «політична реабілітація», «раднаргоспи», «шістдесятники»"], "ok": [3, 4, 0, 2], "left": ["Україна в перші повоєнні роки (1945 – початок 1950-х рр.)", "Україна в умовах десталінізації (1953–1964 рр.)", "Україна в період загострення кризи радянської системи (1965–1985 рр.)", "Україна в умовах незалежності (1991 р. – початок ХХІ ст.)"], "expl": "Ждановщина й «саморозпуск» УГКЦ — перші повоєнні роки; відлига й раднаргоспи — десталінізація; самвидав і дефіцит — «застій»; приватизація, АТО й тимчасово окупована територія — незалежна Україна.", "src": "НМТ 2022 – основна сесія (№ 20)"}, {"id": "z26229", "q": "Узгодьте подію з її наслідком.", "sec": "s9", "g": "b2-cons", "t": "match", "opts": ["окупація Автономної Республіки Крим, окремих районів Донецької і Луганської областей", "ухвалення Верховною Радою УРСР Акта проголошення незалежності України", "підписання Україною Угоди про асоціацію з Європейським Союзом (ЄС)", "ухвалення Верховною Радою УРСР Декларації про державний суверенітет України", "створення Меджлісу кримськотатарського народу"], "ok": [3, 1, 2, 0], "left": ["перші альтернативні вибори до Верховної Ради УРСР", "спроба державного перевороту в СРСР", "Революція Гідності", "російська збройна агресія проти України"], "expl": "Альтернативні вибори 1990 р. → Декларація про суверенітет; заколот ДКНС → Акт незалежності; Революція Гідності → Угода про асоціацію з ЄС; агресія Росії → окупація Криму й частини Донбасу.", "src": "НМТ 2023 – демоваріант (№ 24)"}, {"id": "z26925", "q": "Території, позначені на картосхемі, мали до 2022 р. статус", "sec": "s5", "g": "", "t": "single", "img": ["q_366661869d"], "opts": ["територіальної автономії у складі України.", "національної автономії у складі України.", "тимчасово окупованої території.", "вільної економічної зони."], "ok": [2], "expl": "На карті позначено Крим і частини Донецької й Луганської областей, окуповані Росією 2014 р. Закон 2014 р. визначив Крим як тимчасово окуповану територію, а закон 2018 р. — і окуповані райони Донецької та Луганської областей.", "src": "НМТ 2023 – 1 сесія (№ 20)"}, {"id": "z27726", "q": "Яке поняття треба використати, визначаючи головну ідею карикатури?", "sec": "s4", "g": "b2-004", "t": "single", "img": ["q_dd93bdc300"], "opts": ["«геноцид»", "«шовінізм»", "«колоніалізм»", "«анексія»"], "ok": [3], "expl": "З напису «УКРАИНА» знімають літери «КР» і вантажать на причеп вантажівки з російським прапорцем, яка вже везе літери «ЫМ»: разом виходить «КРЫМ». Росія насильно відібрала частину території України — це анексія Криму 2014 р.", "src": "НМТ 2024 – демоваріант (№ 20)"}, {"id": "z27733", "q": "Установіть послідовність подій періоду творення нової України.", "sec": "s9", "g": "", "t": "seq", "opts": ["вступ України до Світової організації торгівлі (СОТ)", "початок Євромайдану", "підписання Україною Угоди про асоціацію з Європейським Союзом (ЄС)", "укладення Мінських домовленостей"], "expl": "СОТ — 2008 р.; Євромайдан — листопад 2013 р.; Угода про асоціацію — 2014 р. (березень і червень); Мінські домовленості — вересень 2014 і лютий 2015 р.", "src": "НМТ 2024 – демоваріант (№ 27)"}, {"id": "z28417", "q": "Пам’ятну монету, зображену на фото, було випущено в", "sec": "s8", "g": "", "t": "single", "img": ["q_6aeaa6b126"], "opts": ["1991 р.", "2010 р.", "2016 р.", "2021 р."], "ok": [3], "expl": "Напис на монеті — «30 років незалежності України». Незалежність проголошено 1991 р., тож монету випущено 2021 р.", "src": "НМТ 2024 – 1 сесія (№ 20)"}, {"id": "z28424", "q": "Установіть послідовність подій, відображених на фото.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_5faef62c56", "q_dee6373950", "q_ff9a58bf5b", "q_3915ef4128"], "opts": ["Б", "А", "Г", "В"], "expl": "«Кучму геть!» — 2001 р.; марш у Москві «Окупація Криму — ганьба Росії!» — березень 2014 р.; Донецький аеропорт — 2014 – 2015 рр.; звільнений Херсон — листопад 2022 р.", "src": "НМТ 2024 – 1 сесія (№ 27)"}, {"id": "z28447", "q": "Розгляньте фото. На фото задокументовано події", "sec": "s3", "g": "b2-003", "t": "single", "img": ["q_99124fd00b"], "opts": ["Революції троянд.", "Революції Гідності.", "Революції на граніті.", "Помаранчевої революції."], "ok": [1], "expl": "На першому фото — прапори ЄС і України на майдані Незалежності (Євромайдан, листопад 2013 р.), на другому — барикади в диму біля пам’ятника засновникам Києва на Майдані (лютий 2014 р.). Це Революція Гідності.", "src": "НМТ 2024 – 2 сесія (№ 20)"}, {"id": "z34330", "q": "Що спричинило події, яким приурочено плакат?", "sec": "s3", "g": "", "t": "single", "img": ["q_e205c9a74b"], "opts": ["спроба влади придушити Євромайдан", "окупація Росією Кримського півострова", "достроковий розпуск Верховної Ради України", "фальсифікація владою президентських виборів"], "ok": [0], "expl": "Плакат «Гідність» із пляшкою-«коктейлем Молотова» — про захист Майдану. Масові протести почалися після того, як 30 листопада 2013 р. «Беркут» жорстоко розігнав студентів: влада спробувала придушити Євромайдан.", "src": "НМТ 2025 – 1 сесія (№ 20)"}, {"id": "z34360", "q": "Визначте подію, що стала наслідком геополітичного вибору України, варіанти якого візуалізує карикатура.", "sec": "s2", "g": "", "t": "single", "img": ["q_776830d854"], "opts": ["початок Революції Гідності", "проголошення незалежності України", "розгортання Революції на граніті", "прийняття Декларації про державний суверенітет України"], "ok": [0], "expl": "Карикатура показує вибір між Європою й Азією (Митним союзом з Росією). Коли 21 листопада 2013 р. уряд Азарова призупинив підготовку до підписання Угоди про асоціацію з ЄС, люди вийшли на Майдан — почалася Революція Гідності.", "src": "НМТ 2025 – 2 сесія (№ 20)"}, {"id": "z34367", "q": "Установіть послідовність суспільно-політичних процесів та явищ, відображених на карикатурах.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_b59842e7d5", "q_e76dfc58bb", "q_bf432626c9", "q_42caf61099"], "opts": ["В", "Г", "А", "Б"], "expl": "«Горезвісні експериментатори» — лисенківщина кінця 1940-х рр.; кукурудза — Хрущов; «З корінням викорчуємо застій!» — перебудова; «Не бачу, не чую, мовчу» (хабарі) — незалежна Україна.", "src": "НМТ 2025 – 2 сесія (№ 27)"}, {"id": "z39178", "q": "Узгодьте подію (1–4) з її проявом (A – Д).", "sec": "s9", "g": "", "t": "match", "opts": ["громадські протести, спричинені відмовою уряду підписати Угоду про асоціацію між Україною та Європейським Союзом", "масове студентське голодування з вимогами демократичних реформ", "національний рух, що еволюціонував від ідей політичної автономії та федерації до усвідомлення власної державної незалежності", "рух громадянської непокори, викликаний масовими фальсифікаціями президентських виборів", "низка взаємопов’язаних історичних подій, у ході яких було ліквідовано монархію, здійснено соціально-економічні та суспільно-політичні реформи"], "ok": [1, 3, 0, 2], "left": ["Революція на граніті", "Помаранчева революція", "Революція Гідності", "Українська революція"], "expl": "Революція на граніті (1990) — голодування студентів; Помаранчева (2004) — протест проти фальсифікацій; Гідності (2013 – 2014) — протест після відмови від Угоди з ЄС; Українська революція (1917 – 1921) — шлях від автономії до незалежності.", "src": "НМТ 2026 – 1 сесія (№ 24)"}, {"id": "z39181", "q": "Установіть послідовність подій, про які йдеться в цитованих джерелах.", "sec": "s9", "g": "b2-src", "t": "seq", "opts": ["«Враховуючи, що існуючі обмеження в становищі перебуваючих на спецпоселенні виселених кримських татар …у подальшому не є необхідними, Президія Верховної Ради СРСР ухвалює: …звільнити з-під адміністративного нагляду кримських татар…»", "«…У СРСР побудовано розвинене соціалістичне суспільство. На цьому етапі… все повніше розкриваються… переваги соціалістичного способу життя… Це суспільство зрілих соціалістичних суспільних відносин, у якому… склалася нова історична спільність – радянський народ…»", "«Вихід на політичну арену значної кількості нових суспільних формувань змінив сам характер виборів, зробивши основний акцент на альтернативності їх (на 450 мандатів у Верховну Раду УРСР претендувало майже три тисячі кандидатів)…»", "«Стійкість і мужність української армії, підтримка армії з боку українського народу стали основними чинниками, які, поряд із тиском Заходу, змушували Росію йти на \"заморожування\" агресії...»"], "expl": "Скасування обмежень для кримських татар — 1956 р.; «розвинений соціалізм» — 1970-ті; альтернативні вибори — 1990 р.; мужність армії й Мінські переговори — 2014 – 2015 рр.", "src": "НМТ 2026 – 1 сесія (№ 27)"}, {"id": "z39184", "q": "Які події російсько-української війни відбулися протягом 2014 року?", "sec": "s5", "g": "", "t": "three", "opts": ["початок Операції об’єднаних сил (ООС)", "створення формату для ведення мирних переговорів – «нормандської четвірки»", "початок Антитерористичної операції (АТО)", "окупація Російською Федерацією Кримського півострова", "надання Томоса про автокефалію Православній Церкві в Україні", "запровадження безвізового режиму в’їзду в країни Європейського Союзу для громадян України", "початок широкомасштабного вторгнення армії Російської Федерації в Україну"], "ok": [1, 2, 3], "expl": "2014 р.: окупація Криму (лютий – березень), початок АТО (квітень), перша зустріч «нормандської четвірки» (червень). ООС — з 2018 р., томос і безвіз — 2017 – 2019 рр., повномасштабне вторгнення — 2022 р.", "src": "НМТ 2026 – 1 сесія (№ 30)"}, {"id": "z39214", "q": "Розгляньте карикатури. Якого року на шпальтах європейських видань уперше з’явилися ці карикатури?", "sec": "s4", "g": "b2-007", "t": "single", "img": ["q_949b4aae1a"], "opts": ["2010 р.", "2012 р.", "2014 р.", "2016 р."], "ok": [2], "expl": "Карикатури про «референдум» у Криму під наглядом російських військових з’явилися в березні 2014 р.: у бюлетені нібито вибір, але обидві відповіді — «Крим російський».", "src": "НМТ 2026 – 2 сесія (№ 20)"}, {"id": "z39244", "q": "Розташуйте плакати за послідовністю відображених на них віх в історії України.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_695fc18728", "q_6fc18415a8", "q_fd655e4b0d", "q_03a6499e64"], "opts": ["Г", "Б", "А", "В"], "expl": "Легіон УСС — 1914 р.; «П’ять колосків» (закон 1932 р.) — Голодомор; «П’ємо воду з рідного Дніпра… Очистимо радянську землю від фашистської нечисті!» — 1943 р.; воїн із дитиною — війна з 2014 р.", "src": "НМТ 2026 – 2 сесія (№ 27)"}, {"id": "z36931", "q": "Доберіть до імені історичного діяча (1–4) цитату (А – Д), що йому належить.", "sec": "s9", "g": "", "t": "match", "opts": ["«Перед польотом кожному запропонували вибрати якусь мелодію для пробудження. А я собі думаю: чом би не гімн України? Таким чином на борту \"Колумбії\" двічі грав наш гімн. Американці, включно з командиром екіпажу Крегелом, ставали струнко. У невагомості це кумедно виглядало – вони висіли десь між підлогою і стелею»", "«Фізичного знищення немає. Є, як і в період першої окупації, у 1783 році, створення умов, які змушують кримських татар залишати свою батьківщину... Приблизно те ж зараз відбувається. Створюються умови, обстановка страху, терору, які змушують людей залишати свою землю»", "«Ми, українці, вже із самої колиски стаємо націоналістами, якщо матері співають нам українські колискові. Тому нас перевиховують у концтаборах. Українець перестає бути націоналістом аж тоді, коли зневажає свою мову, пісню, свої національні традиції, любить усе, крім свого рідного»", "«Використання Церкви у виборчих перегонах – це двосічний меч. Коли Церква піддається спокусі пристати до якогось кандидата, то завжди програє. Якщо церква починає загравати з політикою, це для церкви є фатально. Вона програє. Церква має одну ціль – освячувати. А не пхатися ані в політику, ані в бізнес»", "«Став символом моральної чистоти, людяності й справжнього патріотизму – саме того, що найбільше бракувало радянському кінематографу»"], "ok": [2, 3, 0, 1], "left": ["Володимир Івасюк", "Любомир Гузар", "Леонід Каденюк", "Мустафа Джемілєв"], "expl": "Л. Каденюк узяв у політ «Колумбії» (1997) гімн України; М. Джемілєв порівнює 1783 р. і окупацію 2014 р.; Л. Гузар — про Церкву й вибори; В. Івасюк — про українські колискові.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36937", "q": "Що ілюструє карикатура, на якій відображено події кінця 2013 року в Україні?", "sec": "s3", "g": "", "t": "three", "img": ["q_e2899bc7ab"], "opts": ["бажання уряду України вступити до військового блоку НАТО", "бажання уряду Росії повернути Україну до своєї сфери впливу", "подію, що відклала вступ України до Європейського Союзу", "намір уряду України провести економічні реформи", "подію, що була підтримана більшістю населення України", "бажання уряду України приєднатися до ЄС", "подію, що спричинила масові протести громадян"], "ok": [1, 2, 6], "expl": "Янукович і Путін замуровують двері до ЄС: у листопаді 2013 р. Янукович не підписав Угоду про асоціацію під тиском Росії. Це відсунуло євроінтеграцію й викликало масові протести.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38014", "q": "Упорядкуйте плакати за хронологією зображених подій.", "sec": "s9", "g": "b2-post22", "t": "seq", "oimg": ["q_6f449c89c8", "q_087f47afba", "q_5f8011683f", "q_5708dfd96d"], "opts": ["В", "Г", "А", "Б"], "expl": "Помаранчева революція — 2004 р.; «Герої не вмирають» (Майдан) — 2014 р.; «Кіборги» — 2014 – 2015 рр.; «Перемогли нацизм — переможемо й рашизм!» — 2022 р.", "src": "тренувальне завдання osvita.ua (не з реального тес ться до вулика «Крим». Анексія Криму — 2014 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37538", "q": "Дизайн яких монет свідчить про прагнення українців стати частиною європейської спільноти?", "sec": "s6", "g": "", "t": "three", "oimg": ["q_bb7e92f819", "q_c903b910e6", "q_04ea460070", "q_74f4cf764a", "q_308a04de5b", "q_22e316b27c", "q_1fbffb2b6e"], "opts": ["1", "2", "3", "4", "5", "6", "7"], "ok": [2, 3, 4], "expl": "Монети «Євромайдан» (з прапором ЄС), «Небесна сотня» і «Революція Гідності» нагадують про протест за європейський вибір України. Інші — про захисників, лікарів, 30 років незалежності, Маріуполь.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37632", "q": "Доберіть до історичного поняття (1–4) його визначення (А – Д).", "sec": "s9", "g": "", "t": "match", "opts": ["політична ідеологія та система, що поєднує диктаторський культ, імперіалізм і шовінізм, спрямована на насильницьке розширення влади", "примусове або насильницьке переселення людей чи цілих народів із місць їхнього постійного проживання на підставі політичних або етнічних мотивів", "насильницьке захоплення та приєднання державою частини або всієї території іншої держави в односторонньому порядку", "організоване виведення (вивезення) населення, матеріальних і культурних цінностей із небезпечних зон для їхнього збереження", "примусове безоплатне або оплатне вилучення майна у власників для потреб держави в умовах воєнного чи надзвичайного стану"], "ok": [0, 2, 1, 3], "left": ["рашизм", "анексія", "депортація", "евакуація"], "expl": "Рашизм — ідеологія путінської Росії; анексія — насильницьке приєднання чужої території; депортація — примусове виселення людей; евакуація — організоване вивезення людей і цінностей з небезпечних районів. Д — реквізиція.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37635", "q": "Упорядкуйте зображені плакати за хронологією зображених на них історичних подій.", "sec": "s9", "g": "", "t": "seq", "oimg": ["q_b0c659013e", "q_8936cbccf1", "q_e2e62dd6ab", "q_c9ff420c76"], "opts": ["Б", "А", "В", "Г"], "expl": "Українські січові стрільці — 1914 р.; «Воля народам, воля людині!» — УПА, 1940-ві рр.; «Всі на захист Києва!» — 2022 р. Плакат із рядками Лесі Українки «Невже ти будеш осторонь сидіти…» за ключем ЗНО стоїть другим — після стрілецького.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37896", "q": "Який плакат стосується російсько-української війни?", "sec": "s5", "g": "", "t": "single", "oimg": ["q_c5d92c1647", "q_5529763871", "q_858a05eca5", "q_8d3c12ed9f"], "opts": ["А", "Б", "В", "Г"], "ok": [2], "expl": "Плакат «Схід буде вільним!» — про війну, що почалася 2014 р. Інші плакати — радянські, часів німецько-радянської війни 1941 – 1945 рр.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38007", "q": "Яка назва стінописного твору, присвяченого українським пілотам під час російсько-української війни?", "sec": "s8", "g": "", "t": "single", "img": ["q_09a90c6a11"], "opts": ["Кіборг Донецька", "Привид Києва", "Лють Херсона", "Чорноморець Одеси"], "ok": [1], "expl": "«Привид Києва» — легенда про пілота, який у перші дні повномасштабного вторгнення 2022 р. збивав російські літаки над Києвом. Мурал присвячено всім українським пілотам.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38334", "q": "Поєднайте карикатуру (1–4) з поняттям (А – Д), яке вона символізує.", "sec": "s6", "g": "", "t": "match", "rimg": ["q_f782a5c057", "q_d83b0e21fc", "q_06f87df608", "q_a7a088421c"], "opts": ["гібридна війна", "олігархічна система", "безвізовий режим", "Революція Гідності", "Помаранчева революція"], "ok": [4, 3, 1, 2], "left": ["", "", "", ""], "expl": "Сусіди в помаранчевому й синьо-білому — вибори 2004 р. (Помаранчева революція); Янукович-Пилат, що «вмиває руки», — Революція Гідності; олігархи за грою — олігархічна система; козак біля відчинених дверей ЄС — безвізовий режим.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38546", "q": "Що відображено на марці?", "sec": "s5", "g": "", "t": "single", "img": ["q_4c9983f424"], "opts": ["бої за Бахмут та Авдіївку", "блокаду Маріуполя", "оборону Донецького аеропорту", "бій під Дебальцевим"], "ok": [2], "expl": "На марці — диспетчерська вежа Донецького аеропорту й «кіборги». Оборона аеропорту тривала 242 дні, до січня 2015 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38776", "q": "Автори плаката використали сюжетну лінію ікони", "sec": "s5", "g": "", "t": "single", "img": ["q_4a8006183f"], "opts": ["Покрови Богородиці.", "Успіння Богородиці.", "Вознесіння Діви Марії.", "Богоматері Оранти."], "ok": [0], "expl": "Жінка-воїн розгортає над захисниками рушник, як Богородиця — свій покров. Це сюжет ікони Покрови Богородиці. На Покрову відзначають і День захисників і захисниць України.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "cvl1_42", "q": "Яке з наведених зображень ілюструє президентську виборчу кампанію 2019 р.?", "sec": "s6", "g": "", "t": "single", "img": ["q_a7293759ef"], "opts": ["А", "Б", "В", "Г"], "ok": [1], "expl": "На Б — передвиборчі програми П. Порошенка й В. Зеленського, кандидатів другого туру 2019 р. А — екзит-пол виборів 2014 р., В — білборд В. Януковича, Г — результати першого туру 2004 р.", "src": "Власов, Варіант 1, № 42"}, {"id": "cvl5_42", "q": "Яке з наведених візуальних джерел стосується подій 2022 року?", "sec": "s8", "g": "", "t": "single", "oimg": ["q_2672041421", "q_ac82d9f964", "q_d73d50531f", "q_dc5a63ba71"], "opts": ["А", "Б", "В", "Г"], "ok": [1], "expl": "Херсон звільнили 11 листопада 2022 р. Інші зображення: день пам’яті захисників Донецького аеропорту (події 2014 – 2015 рр.), протест «Обличчя реваншу» (2019), мапа «Європа без віз» (2017).", "src": "Власов, Варіант 5, № 42"}, {"id": "cvl5_48", "q": "Установіть відповідність між плакатами та історичними періодами їх створення", "sec": "s9", "g": "", "t": "match", "img": ["q_0faf2dc5b2"], "opts": ["повоєнна відбудова та розвиток (1946 – початок 1950-х рр.)", "політична та економічна лібералізація суспільства (1953–1964 рр.)", "загострення кризи радянської системи (1965–1985 рр.)", "розпад Радянського Союзу та відродження незалежності України (1985–1991 pp.)", "незалежна Україна"], "ok": [1, 0, 2, 3], "left": ["1", "2", "3", "4"], "expl": "«Дорогу кукурудзі!» — Хрущов (Б); «Радянська возз’єднана українська земля, визволена Червоною армією» — кінець війни й перші повоєнні роки (А); Програма миру XXVI з’їзду КПРС (1981) — «застій» (В); «Гласність!» — перебудова (Г).", "src": "Власов, Варіант 5, № 48"}, {"id": "cvl6_48", "q": "Установіть відповідність між явищами та процесами й періодами, з якими їх пов’язують", "sec": "s9", "g": "", "t": "match", "opts": ["повоєнна відбудова", "«відлига»", "«застій»", "«перебудова»", "незалежна Україна"], "ok": [4, 1, 2, 3], "left": ["Завершення процесу переходу від командно-адміністративної до ринкової економіки, роздержавлення та приватизація підприємств, формування власної фінансово-грошової системи", "Десталінізація, поява «шістдесятництва», яке започаткувало новітнє національне відродження, зародження дисидентського руху", "Зниження основних економічних показників, що призвело до втрати економічних позицій СРСР на міжнародній арені та загострення соціально-економічних проблем усередині держави (уповільнення темпів зростання реальних доходів населення; загострення житлової проблеми; зниження рівня охорони здоров’я, загострення екологічних проблем).", "Втрата контролю комуністичної партії над суспільно-політичним життям, початок формування багатопартійної системи."], "expl": "Перехід до ринку й приватизація — незалежна Україна; шістдесятники й дисиденти — «відлига»; падіння економічних показників — «застій»; втрата КПРС контролю й багатопартійність — «перебудова».", "src": "Власов, Варіант 6, № 48"}, {"id": "ckn2_52", "q": "Установіть послідовність подій зовнішньої політики незалежної України.", "sec": "s9", "g": "b2-memb-seq", "t": "seq", "opts": ["початок членства в Організації Об'єднаних Націй", "обрання України повноправним членом Ради Європи", "вступ України до Світової організації торгівлі (СОТ)", "підписання Угоди про асоціацію з Євросоюзом (ЄС)"], "expl": "Членство в ООН — з 1945 р.; Рада Європи — 1995 р.; СОТ — 2008 р.; Угода про асоціацію з ЄС — 2014 р.", "src": "Коніщева, Тест 2, № 52"}, {"id": "ckn3_42", "q": "Членом якої міжнародної організації стала Україна у 2008 р.?", "sec": "s1", "g": "", "t": "single", "opts": ["Організації Об’єднаних Націй (ООН)", "Ради Європи (РЄ)", "Світової організації торгівлі (СОТ)", "Співдружності Незалежних Держав (СНД)"], "ok": [2], "expl": "Україна стала 152-м членом Світової організації торгівлі 16 травня 2008 р., після 15 років переговорів. Членом ООН вона є з 1945 р., Ради Європи — з 1995 р.", "src": "Коніщева, Тест 3, № 42"}, {"id": "ckn3_56", "q": "Укажіть прізвища державних і політичних діячів, які обиралися Президентами України за часів незалежності", "sec": "s9", "g": "", "t": "three", "opts": ["Л. Кравчук", "Л. Кучма", "Л. Лук’яненко", "Ю. Тимошенко", "В. Ющенко", "В. Чорновіл", "А. Яценюк"], "ok": [0, 1, 4], "expl": "Президенти України: Л. Кравчук (1991), Л. Кучма (1994, 1999), В. Ющенко (2004), В. Янукович (2010), П. Порошенко (2014), В. Зеленський (2019). Ю. Тимошенко й А. Яценюк були прем’єр-міністрами, Л. Лук’яненко й В. Чорновіл — кандидатами 1991 р.", "src": "Коніщева, Тест 3, № 56"}, {"id": "ckn5_47", "q": "Установіть відповідність між подіями зовнішньої політики незалежної України та їх датами.", "sec": "s9", "g": "b2-memb", "t": "match", "opts": ["1991 р.", "1995 р.", "2005 р.", "2008 р.", "2014 р."], "ok": [3, 2, 4, 1], "left": ["вступ України до Світової організації торгівлі (СОТ)", "надання Україні статусу країни з ринковою економікою", "підписання Угоди про асоціацію з Євросоюзом (ЄС)", "обрання України повноправним членом Ради Європи"], "e , "q": "Яка цитата належить Леоніду Кравчуку, першому Президенту незалежної України?", "sec": "s1", "g": "", "t": "single", "opts": ["\"Маємо те, що маємо.\"", "\"Україна – не Росія.\"", "\"Будуймо нову Україну разом!\"", "\"Бандитам – тюрми!\""], "ok": [0], "expl": "«Маємо те, що маємо» — відомий вислів Леоніда Кравчука. «Україна — не Росія» — назва книжки Л. Кучми (2003), «Бандитам — тюрми!» — гасло В. Ющенка 2004 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 1"}, {"id": "calt_19", "q": "Як було сформульовано питання на першому Всеукраїнському референдумі?", "sec": "s1", "g": "m1-ref91", "t": "single", "opts": ["\"Чи згодні Ви зі збереженням СРСР як оновленої федерації?\"", "\"Чи підтверджуєте Ви Акт проголошення незалежності України?\"", "\"Чи підтримуєте Ви вступ України до НАТО?\"", "\"Чи схвалюєте Ви Конституцію України?\""], "ok": [1], "expl": "На референдумі 1 грудня 1991 р. було одне питання: «Чи підтверджуєте Ви Акт проголошення незалежності України?» «Так» відповіли понад 90 % учасників.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 19"}, {"id": "calt_62", "q": "Встановіть хронологічну послідовність подій", "sec": "s1", "g": "", "t": "seq", "opts": ["«ПРОГОЛОШУЄ державний суверенітет України як верховенство, самостійність, повноту і неподільність влади Республіки в межах її території та незалежність і рівноправність у зовнішніх зносинах.»", "\"Постанову “Про розгляд вимог студентів, які проводять голодування в м. Києві ....” прийняли... Голову Ради Міністрів УРСР Віталія Масола відправили у відставку.\"", "\"Проголосити ....Україну незалежною демократичною державою. З моменту проголошення незалежності чинними на території України є тільки її Конституція, закони, постанови Уряду та інші акти законодавства республіки.\"", "\"Стаття 1. Збройні Сили України призначені для збройного захисту незалежності, територіальної цілісності та недоторканності України.\""], "expl": "Декларація про державний суверенітет — 16 липня 1

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Незалежна Україна (1991 – 2022)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.lb-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; will-change: transform; }
.pic { touch-action: pan-x pan-y; }   /* щипок на зображенні не збільшує всю сторінку — відкриває перегляд */
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


.brand { margin: 28px 0 6px; text-align: center; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }

/* «← Усі теми» — повернення на полицю тем спільної оболонки */
.tback { display: inline-block; margin: 14px 0 0; font-weight: 700; font-size: 15px; color: var(--acc2); text-decoration: underline; }

/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }
.tlv .ev { position: relative; padding: 0 0 16px; display: grid; gap: 3px; }
.tlv .ev i { position: absolute; left: -25px; top: 4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--bg); }
.tlv .ev .y { color: var(--acc2); font-weight: 800; font-variant-numeric: tabular-nums; }
.tlv .ev .y.yprog { justify-self: start; background: var(--acc2); color: #161616; border-radius: 8px; padding: 1px 8px; }
.tlv .ev b { font-size: 17px; }
.legend { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.legend span.sw { width: 34px; height: 16px; background: var(--acc2); border-radius: 6px; }
/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }
.gp .tr { position: relative; height: 18px; background: #262626; border-radius: 6px; }
.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }
.part-btn .th img { max-width: 100%; max-height: 100%; }
.part-btn h3 { font-size: 18px; }
.part-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<button id="fsb" class="fsb" hidden aria-label="На весь екран">⤢</button>
<div class="lb" id="lb" role="dialog" aria-label="Перегляд зображення">
  <div class="lb-top"><button id="lbOut" aria-label="Зменшити">−</button><button id="lbIn" aria-label="Збільшити">+</button><button id="lbX" aria-label="Закрити">✕</button></div>
  <div class="lb-view" id="lbv"><img id="lbi" alt=""></div>
  <div class="lb-cap" id="lbc"></div>
</div>
<script>
const LESSONS = [{"id": "p1", "num": 1, "title": "Незалежна Україна (1991 – 2022)", "part": "Частина 1. Становлення незалежної держави", "sub": "1991 – 2004 рр.: державотворення, Крим, криза й реформи, Конституція, Кучма, Помаранчева революція, зовнішня політика, культура", "cover": {"key": "s001_image1", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Становлення України як незалежної держави»", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **6 грудня 1991 р.** — започаткування Збройних Сил України", "• **липень 1994 р.** — обрання Леоніда Кучми Президентом", "• **1995 р.** — вступ України до Ради Європи", "• **28 червня 1996 р.** — ухвалення Конституції України", "• **вересень 1996 р.** — запровадження гривні", "• **жовтень – грудень 2004 р.** — Помаранчева революція, обрання В. Ющенка"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії (портрети)", "light": false}, {"k": "p", "paras": ["• **Леонід Кучма** — Президент України (1994 – 2005)", "• **Віктор Ющенко** — голова НБУ, прем’єр-міністр, Президент (з 2005 р.)", "• **Любомир Гузар** — глава УГКЦ (2001 – 2011)", "• **Леонід Каденюк** — перший космонавт незалежної України", "• для повторення (тема 30): **Леонід Кравчук**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **корупція**", "• **тіньова економіка**", "• **олігарх**", "• **Помаранчева революція**", "• **поліконфесійність**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Зміст теми", "light": false}, {"k": "p", "paras": ["• державотворення; Крим і повернення кримських татар; багатопартійність і Конституція", "• економіка 1991 – 2004 рр., гривня, олігархічна система; демографія й міграції", "• рухи протесту на початку 2000-х; Помаранчева революція", "• місце України у світі; культура й духовне життя"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 31. Матеріал поза програмою позначено сірою позначкою «поза програмою»."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Державотворення (1991 – 1996)", "sub": "Органи влади, армія, ядерне роззброєння, Чорноморський флот, громадянство, кордони й символи", "cover": {"key": "s007_image2", "cap": ""}, "cards": [{"type": "text", "kicker": "Державотворення", "title": "З чого починала незалежна Україна", "badges": [], "paras": ["**Перші завдання.** Створити власні органи влади й визначити, хто за що відповідає. Сформувати армію, прикордонні війська, Службу безпеки. Ухвалити закон про громадянство, затвердити кордони й державні символи. Запровадити власні гроші й домогтися визнання у світі.", "**Що допомагало.** Незалежність здобуто **мирно**, її підтримали 90 % учасників референдуму 1 грудня 1991 р. Україна мала досвід державності 1917 – 1921 рр. і власну Верховну Раду, уряд, міністерства, хоч і радянські. Уже за кілька тижнів незалежність визнали десятки держав.", "**Що заважало.** Україна успадкувала від СРСР глибоку **економічну кризу**. Бракувало фахівців, які вміли б керувати державою й ринковою економікою. Більшість керівників були колишніми партійними функціонерами. Росія тиснула через Крим, Чорноморський флот і ціни на енергоносії."], "imgs": [{"key": "rada_act", "cap": "Дошка з текстом Акта проголошення незалежності України на будинку Верховної Ради. Фото: Vincent de Groot - http://www.videgro.net / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Органи влади", "title": "Верховна Рада і Президент (1991 – 1996)", "badges": [], "paras": ["До 1996 р. діяла **Конституція УРСР 1978 р.**: Верховна Рада вилучила з неї положення про СРСР і КПРС і доповнила її новими статтями.", "**Верховна Рада** — єдиний законодавчий орган, 450 депутатів. Закон ухвалюють щонайменше 226 голосами, зміни до Конституції — 300 голосами (дві третини). Головою Ради в 1991 – 1994 рр. був **Іван Плющ**.", "Посаду **Президента** Верховна Рада запровадила законом 1991 р. Першим Президентом 1 грудня 1991 р. обрали **Леоніда Кравчука**. Повноваження Президента, Ради й уряду були розмежовані нечітко, тому Президент і Рада постійно сперечалися, кому підпорядковується уряд."], "imgs": [{"key": "s008_image3", "cap": "Будинок Верховної Ради України в Києві"}, {"key": "s012_image4", "cap": "Л. Кравчук складає присягу Президента, 5 грудня 1991 р."}]}, {"type": "text", "kicker": "Персоналія", "title": "Леонід Кравчук (1934 – 2022)", "badges": ["повторення"], "paras": ["Леонід Кравчук народився на Рівненщині й багато років працював у партійному апараті. У 1990 р. він очолив **Верховну Раду УРСР**, яка під його головуванням ухвалила Акт проголошення незалежності.", "**1 грудня 1991 р.** українці обрали його **першим Президентом**. За президентства Кравчука Україна створила армію, затвердила державні символи й відмовилася від ядерної зброї.", "Подолати економічну кризу Кравчук не зумів. У 1994 р. він програв дострокові вибори Леонідові Кучмі. Згодом був народним депутатом. Помер у 2022 р."], "imgs": [{"key": "s160_image157", "cap": "Леонід Кравчук у 2010-х рр."}]}, {"type": "text", "kicker": "Органи влади", "title": "Уряд, місцева влада, суди", "badges": [], "paras": ["**Кабінет Міністрів** очолювали **Вітольд Фокін** (до жовтня 1992 р.) і **Леонід Кучма** (жовтень 1992 – вересень 1993). Після відставки Кучми Кравчук сам очолив уряд, а обов’язки прем’єр-міністра виконував **Юхим Звягільський**.", "У 1992 р. Президент призначив своїх **представників** в областях і районах. Поруч із ними діяли виборні ради, і часто було незрозуміло, хто за що відповідає.", "Суди працювали за радянськими кодексами; найвищим був **Верховний Суд**. **Конституційного Суду** ще не було — його створили після ухвалення Конституції 1996 р.", "У вересні 1991 р. Верховна Рада створила на основі КДБ УРСР **Службу безпеки України (СБУ)**."], "imgs": [{"key": "s013_image5", "cap": "Будинок Кабінету Міністрів України"}, {"key": "s014_image6", "cap": "Будинок СБУ в Києві"}]}, {"type": "defs", "title": "Три центри влади (1991 – 1996)", "badges": [], "items": [{"name": "Верховна Рада", "paras": ["Ухвалює закони й бюджет.", "Затверджує прем’єр-міністра, якого пропонує Президент.", "Контролює уряд і може висловити йому недовіру."], "img": null}, {"name": "Кабінет Міністрів", "paras": ["Керує господарством і виконує бюджет.", "Залежить і від Ради, і від Президента.", "У 1991 – 1994 рр. змінилися три керівники уряду."], "img": null}, {"name": "Президент", "paras": ["Глава держави, головнокомандувач.", "Пропонує Раді кандидатуру прем’єр-міністра й керує урядом указами.", "З 1992 р. має своїх представників в областях."], "img": null}], "note": "Закони не визначали чітко, кому підпорядковується уряд: Раді чи Президентові. Тому в 1992 – 1994 рр. Леонід Кравчук і Верховна Рада постійно боролися за право керувати Кабінетом Міністрів, а уряд через це зволікав із реформами. Суперечку розв’язали **Конституційний договір** (1995) і **Конституція** (1996)."}, {"type": "text", "kicker": "Армія", "title": "Збройні Сили України (6 грудня 1991 р.)", "badges": ["НМТ: дата"], "paras": ["**24 серпня 1991 р.**, того ж дня, коли ухвалила Акт проголошення незалежності, Верховна Рада підпорядкувала собі всі військові частини на території України. Першим міністром оборони став генерал **Костянтин Морозов**.", "**6 грудня 1991 р.** Рада ухвалила закони «**Про оборону України**» і «**Про Збройні Сили України**». Цей день відзначають як День Збройних Сил.", "Україна успадкувала одну з найбільших армій у Європі — близько 700 тис. військових. Військовослужбовці складали присягу на вірність Україні. Згодом армію поступово скорочували.", "Тоді ж Верховна Рада ухвалила закони про **Національну гвардію** і **Прикордонні війська** (листопад 1991 р.)."], "imgs": [{"key": "s015_image7", "cap": "Емблема Збройних Сил України"}]}, {"type": "text", "kicker": "Армія", "title": "Ядерне роззброєння (1992 – 1996)", "badges": [], "paras": ["Після розпаду СРСР на території України лишився **третій за розміром ядерний арсенал у світі**: міжконтинентальні ракети, стратегічні бомбардувальники й близько 1900 боєголовок. Керувати ними Україна не могла: коди запуску лишилися в Москві.", "Тактичну ядерну зброю Україна передала Росії ще навесні 1992 р. А **14 січня 1994 р.** президенти США, Росії й України підписали **Тристоронню заяву**: Україна передає боєголовки Росії на знищення, а натомість отримує від Росії паливо для АЕС, а від США — гроші на знищення ракет.", "**16 листопада 1994 р.** Верховна Рада ухвалила закон про приєднання України до **Договору про нерозповсюдження ядерної зброї**. Останні боєголовки Україна передала Росії **1 червня 1996 р.**, а ракетні шахти знищила до 2001 р."], "imgs": [{"key": "trilateral94", "cap": "Кравчук, Клінтон і Єльцин після підписання Тристоронньої заяви, Москва, 14 січня 1994 р. Фото: U.S. government employee, photo from William J. Clinton Presidential Library / Wikimedia Commons, Public domain"}, {"key": "pervomaisk", "cap": "Музей ракетних військ стратегічного призначення під Первомайськом — колишня ракетна база. Фото: Michael / Wikimedia Commons, CC BY 3.0"}]}, {"type": "doc", "title": "Будапештський меморандум (1994)", "quote": ["1. Сполучені Штати Америки, Російська Федерація та Сполучене Королівство Великої Британії і Північної Ірландії підтверджують своє зобов’язання перед Україною… **поважати незалежність і суверенітет та існуючі кордони України**.", "2. …підтверджують їх зобов’язання **утримуватися від загрози силою чи її використання** проти територіальної цілісності чи політичної незалежності України, і що ніяка їхня зброя ніколи не буде використовуватися проти України, крім цілей самооборони…", "3. …підтверджують своє зобов’язання… **утримуватися від економічного тиску**…"], "source": "Меморандум про гарантії безпеки у зв’язку з приєднанням України до Договору про нерозповсюдження ядерної зброї (уривки)", "comment": ["Меморандум підписали в Будапешті Л. Кучма, Б. Клінтон, Б. Єльцин і Дж. Мейджор. Франція й Китай дали Україні подібні гарантії окремими документами.", "Меморандум не зобов’язував держави, які його підписали, воювати за Україну: вони мали тільки звернутися до Ради Безпеки ООН. У 2014 р. Росія порушила його, захопивши Крим.", "__Слова з документа:__ **територіальна цілісність** — недоторканність кордонів держави."], "img": {"key": "s068_image66", "cap": "Підписання меморандуму в Будапешті, 5 грудня 1994 р."}}, {"type": "text", "kicker": "Чорноморський флот", "title": "Поділ Чорноморського флоту (1992 – 1997)", "badges": [], "paras": ["Чорноморський флот СРСР базувався в Криму, головна база — **Севастополь**. На початку 1992 р. Україна почала приводити флот до присяги, але більшість командирів і екіпажів підтримала Москву. Україна й Росія сперечалися за флот, і це могло закінчитися збройними сутичками.", "У **1992 р.** в Ялті й **1993 р.** в Масандрі президенти України й Росії домовлялися про спільне командування й поділ флоту, але цих угод сторони не виконали.", "У **1995 р.** в Сочі президенти домовилися, що український і російський флоти матимуть окремі бази, а кораблі поділять навпіл. Проте Україна продала Росії частину своєї половини.", "За угодами **28 травня 1997 р.** Росія отримала близько **82 %** кораблів, Україна — близько **18 %**. Росія взяла в оренду бази в Севастополі на 20 років, **до 2017 р.**, а орендною платою погашала борг України за газ."], "imgs": [{"key": "s016_image8", "cap": "Б. Єльцин і Л. Кравчук під час переговорів (1992)"}]}, {"type": "text", "kicker": "Чорноморський флот", "title": "Як починалися Військово-Морські Сили України", "badges": ["поза програмою"], "paras": ["**Указ і опір командування.** **5 квітня 1992 р.** Президент Кравчук видав указ про створення **Військово-Морських Сил України** з частини кораблів Чорноморського флоту.", "Командування флоту підтримувало Москву. Воно не дозволяло морякам складати присягу Україні, а тих, хто присягнув, переводило з кораблів на берегові посади.", "У **1993 р.** український прапор підняли на фрегаті «**Гетьман Сагайдачний**», який став флагманом ВМС. Решту кораблів Україна отримала після поділу флоту в 1995 – 1997 рр.", "**Сторожовий корабель СКР-112.** **21 липня 1992 р.** екіпаж сторожового корабля **СКР-112** підняв український прапор, вийшов з бази на озері **Донузлав** у Криму й узяв курс на **Одесу**.", "Командування флоту послало кораблі навздогін, але зупинити СКР-112 вони не змогли. В Одесі екіпаж зустріли як героїв.", "СКР-112 став першим кораблем, який перейшов до складу ВМС України."], "imgs": [{"key": "sahaidachny", "cap": "Фрегат «Гетьман Сагайдачний», флагман ВМС України, у Севастопольській бухті, 2012 р. Фото: George Chernilevsky / Wikimedia Commons, CC BY 4.0"}]}, {"type": "text", "kicker": "Державні атрибути", "title": "Громадянство, кордони, символи", "badges": [], "paras": ["**Закон «Про громадянство України»** (8 жовтня 1991 р.) закріпив «нульовий варіант»: громадянами стали всі, хто на той час постійно жив в Україні й не мав громадянства іншої держави, незалежно від національності й мови.", "Адміністративні межі УРСР стали державним кордоном. Упродовж 1990-х рр. Україна уклала із сусідами договори про кордон. Найдовше не вдавалося оформити кордон із **Росією**: договір про сухопутний кордон підписали лише 2003 р.", "Державні символи Верховна Рада затвердила на початку 1992 р.: **музику Михайла Вербицького до гімну** (січень), **синьо-жовтий прапор** (28 січня), **малий герб — тризуб** (19 лютого). Конституція 1996 р. підтвердила ці символи, а **слова гімну** (перший куплет і приспів вірша Павла Чубинського) затвердили законом 2003 р."], "imgs": [{"key": "s019_image18", "cap": "Малий Державний Герб України — тризуб"}, {"key": "s017_image9", "cap": "Закон «Про громадянство України», 1991 р."}]}]}, {"id": "s2", "num": "II", "title": "Крим, кримські татари й регіональні рухи", "sub": "Повернення кримських татар, «Республіка Крим», Мєшков, автономія у складі України", "cover": {"key": "s023_image21", "cap": ""}, "cards": [{"type": "text", "kicker": "Крим", "title": "Повернення кримських татар", "badges": [], "paras": ["У 1944 р. сталінський режим депортував увесь кримськотатарський народ до Середньої Азії. Повертатися на батьківщину кримські татари змогли лише наприкінці 1980-х рр. Відтоді до Криму щороку приїздили тисячі родин.", "На початку 2000-х рр. у Криму жило близько **250 тис.** кримських татар. Облаштуватися їм було важко: вони не мали житла й роботи, домагалися землі під забудову, частина довго не могла отримати громадянство України.", "Свої інтереси кримські татари захищали через **Курултай** (національний з’їзд) і **Меджліс**, створені 1991 р. Головою Меджлісу був **Мустафа Джемілєв**, колишній політв’язень, з 1998 р. — народний депутат України."], "imgs": [{"key": "dzhemilev", "cap": "Мустафа Джемілєв (сучасне фото). Фото: Malik Mansur (VOA) / Wikimedia Commons, Public domain"}]}, {"type": "map", "title": "", "steps": [{"key": "nu_regions", "label": "Крок 1"}]}, {"type": "text", "kicker": "Крим", "title": "«Республіка Крим» і криза 1992 – 1994 рр.", "badges": [], "paras": ["**20 січня 1991 р.** на референдумі в Кримській області більшість підтримала відновлення **Кримської АРСР** — автономії всього півострова, а не національної автономії кримських татар. Місцеві керівники разом з проросійськими організаціями домагалися ще більшої самостійності.", "У **травні 1992 р.** Верховна Рада Криму ухвалила **Акт про державну самостійність** і **Конституцію «Республіки Крим»**. Верховна Рада України визнала Акт незаконним, і кримський парламент його скасував. Улітку 1992 р. Верховна Рада України законом розмежувала повноваження держави й Криму.", "У травні 1992 р. Верховна Рада Росії оголосила незаконною передачу Криму Україні 1954 р., а 1993 р. назвала Севастополь «російським містом». Рада Безпеки ООН ці рішення не підтримала.", "У **січні 1994 р.** кримчани обрали «**президентом Криму**» **Юрія Мєшкова**, який обіцяв зблизити Крим із Росією. Його прихильники перемогли й на виборах до кримського парламенту."], "imgs": [{"key": "s024_image22", "cap": "Юрій Мєшков, «президент Криму» (1994 – 1995)"}]}, {"type": "text", "kicker": "Крим", "title": "Автономна Республіка Крим у складі України", "badges": [], "paras": ["Незабаром Мєшков і кримський парламент почали боротися між собою за владу. Росія тоді воювала в Чечні й не стала відкрито підтримувати кримських сепаратистів.", "**17 березня 1995 р.** Верховна Рада України скасувала кримську **Конституцію 1992 р.** і посаду **президента Криму**. Мєшков виїхав до Росії.", "Конституція України 1996 р. закріпила статус **Автономної Республіки Крим** як невід’ємної частини України; Севастополь став містом з особливим статусом. У 1998 р. Верховна Рада Криму ухвалила нову конституцію, а Верховна Рада України її затвердила.", "У 1994 – 1999 рр. у Криму працювала **місія ОБСЄ**, яка допомагала розв’язати суперечки мирно."], "imgs": [{"key": "s025_image23", "cap": "Закон України «Про Автономну Республіку Крим», 1995 р."}]}]}, {"id": "s3", "num": "III", "title": "Економіка (1991 – 2004)", "sub": "Купони й гіперінфляція, приватизація й паювання, гривня, тіньова економіка, олігархи, зростання 2000-х", "cover": {"key": "karb_1m", "cap": ""}, "cards": [{"type": "cols", "title": "Стартові умови економіки", "badges": [], "intro": null, "blocks": [{"h": "Що мала Україна", "paras": ["• Освічене населення, кваліфіковані робітники й інженери, сильні наукові школи.", "• Родючі землі, поклади вугілля, залізної та марганцевої руди.", "• Розвинені металургія, машинобудування, ракетобудування, авіабудування.", "• Густа мережа залізниць і доріг, морські порти."]}, {"h": "Що заважало", "paras": ["• Господарство УРСР було частиною загальносоюзного: багато заводів випускали лише деталі для підприємств в інших республіках.", "• Переважали важка промисловість і **військові заводи**, бракувало товарів щоденного вжитку.", "• Заводи споживали дуже багато енергії, а нафту й газ Україна купувала переважно в Росії.", "• Не було ні законів, ні фахівців для ринкової економіки, ні власної банківської системи."]}]}, {"type": "text", "kicker": "Криза", "title": "Купони й гіперінфляція (1992 – 1994)", "badges": [], "paras": ["З **10 січня 1992 р.** поряд із рублем в Україні ходили **купоно-карбованці** («купони») — тимчасові гроші, які випустив Національний банк. З листопада 1992 р. вони стали єдиними законними грошима, а Україна вийшла з рубльової зони.", "Уряд відпустив ціни, але не скоротив витрат і друкував гроші, щоб платити зарплати й підтримувати збиткові підприємства. Ціни стрімко пішли вгору: за **1993 р.** вони зросли більш ніж у **100 разів**. Таке стрімке знецінення грошей називають **гіперінфляцією**.", "Заощадження людей в Ощадбанку знецінилися. З’явилися купюри в мільйон карбованців, а зарплати людям місяцями не виплачували.", "Підприємства розраховувалися **бартером** — обмінювали товар на товар."], "imgs": [{"key": "s026_image24", "cap": "Купоно-карбованці різних років"}, {"key": "s028_image25", "cap": "Купони, які ходили в 1990-х рр."}]}, {"type": "text", "kicker": "Криза", "title": "Спроби реформ і страйки (1992 – 1994)", "badges": [], "paras": ["Восени 1992 р. прем’єр-міністром став директор найбільшого ракетного заводу СРСР **Леонід Кучма**. Рада дала уряду право видавати декрети, які мали силу закону. Кучма пропонував обмежити дотації збитковим підприємствам, швидше приватизувати великі заводи й заощаджувати енергоносії.", "Президент Кравчук і Рада не підтримали цих пропозицій. У вересні 1993 р. Кучма пішов у відставку.", "Улітку **1993 р.** застрайкували шахтарі Донбасу: вони вимагали підвищити зарплати й провести референдум про довіру Президентові й Раді. Щоб вийти з кризи, Президент і Рада домовилися про **дострокові вибори** Верховної Ради (березень 1994 р.) і Президента (червень 1994 р.)."], "imgs": [{"key": "s030_image29", "cap": "Л. Кравчук і прем’єр-міністр Л. Кучма, 1993 р."}]}, {"type": "text", "kicker": "Економіка", "title": "Валовий внутрішній продукт (1990 – 2004)", "badges": [], "paras": ["**ВВП** — вартість усіх товарів і послуг, вироблених у країні за рік. Тут його показано у відсотках до рівня 1990 р. з урахуванням зміни цін.", "До **1999 р.** виробництво падало щороку і скоротилося більш ніж удвічі. Такого падіння не було навіть під час Другої світової війни.", "З **2000 р.** почалося зростання, у 2004 р. — понад 12 % за рік. Проте рівня 1990 р. Україна так і не досягла."], "imgs": [{"key": "chart_1_26", "cap": "Розрахунок за даними Держстату про річний приріст ВВП; округлено."}]}, {"type": "text", "kicker": "Реформи", "title": "Приватизація й паювання землі", "badges": [], "paras": ["Восени 1994 р. Президент Кучма оголосив програму «**Шляхом радикальних економічних реформ**». З 1995 р. почалася **масова приватизація**: кожен громадянин отримав **приватизаційний майновий сертифікат** і міг обміняти його на акції підприємств.", "Більшість людей не знала, що робити з сертифікатами, і продавала їх за безцінь. Великі підприємства опинилися в руках тих, хто мав гроші й зв’язки у владі.", "Землі колгоспів розділили на **паї** — частки, які отримали колгоспники. У грудні 1999 р. Президент указом перетворив колгоспи на приватні господарства. Продавати паї селяни не могли: у 2001 – 2021 рр. діяв мораторій на продаж сільськогосподарської землі."], "imgs": [{"key": "s043_image37", "cap": "Приватизаційний майновий сертифікат"}]}, {"type": "text", "kicker": "Економіка", "title": "Гіперінфляція (1991 – 2000)", "badges": [], "paras": ["**Інфляція** — знецінення грошей, через яке зростають ціни. Стовпці показують, на скільки відсотків подорожчали товари й послуги за рік.", "У **1993 р.** ціни зросли більш ніж у сто разів — на **10 156 %**. Таку інфляцію називають **гіперінфляцією**. Щоб покрити витрати бюджету й дати підприємствам дешеві кредити, Національний банк друкував дедалі більше купоно-карбованців.", "У 1995 – 1996 рр. уряд скоротив витрати, а Національний банк перестав необмежено друкувати гроші. Після запровадження гривні ціни у 1997 р. зросли лише на 10 %."], "imgs": [{"key": "chart_1_28", "cap": "Шкала логарифмічна: кожна поділка більша за попередню в 10 разів. Дані Держстату (грудень до грудня попереднього року)."}]}, {"type": "text", "kicker": "Реформи", "title": "Гривня (вересень 1996 р.)", "badges": ["НМТ: дата"], "paras": ["У 1995 – 1996 рр. уряд і Національний банк стали друкувати менше грошей і скоротили витрати бюджету. Інфляція сповільнилася, хоча зарплати й пенсії ще довго виплачували із запізненням.", "**Грошову реформу** Національний банк провів **2 – 16 вересня 1996 р.**: купоно-карбованці обмінювали на **гривні** за курсом **100 000 крб за 1 грн**. Банкноти гривні надрукували ще 1992 р., але не вводили в обіг, поки ціни стрімко зростали. Реформу готував Національний банк на чолі з **Віктором Ющенком**.", "Курс гривні був стабільним до **світової фінансової кризи 1998 р.** Тоді гривня подешевшала щодо долара майже вдвічі, а економіка почала зростати лише через два роки."], "imgs": [{"key": "s044_image38", "cap": "Гривні зразка 1996 р."}]}, {"type": "text", "kicker": "Олігархія", "title": "Тіньова економіка, корупція, олігархи", "badges": ["НМТ: поняття"], "paras": ["Багато підприємців працювали поза законом, щоб не платити податків: видавали зарплати в конвертах, торгували без документів. Таку діяльність називають **тіньовою економікою**. За оцінками економістів, у 1990-х рр. вона становила **до половини** всієї економіки.", "Чиновники брали хабарі за дозволи, «потрібні» рішення суду, приватизацію за низькою ціною. Таке використання посади для власного збагачення — **корупція**.", "Найбільше підприємці заробляли на торгівлі газом, приватизації заводів і банках. Так з’явилися **олігархи** — дуже багаті підприємці, які впливали на владу й завдяки цьому примножували свої статки: Рінат Ахметов, Віктор Пінчук, Ігор Коломойський, Віктор Медведчук. Колишній прем’єр-міністр **Павло Лазаренко** втік за кордон, і суд США засудив його за відмивання грошей.", "У 2004 р. держава продала «**Криворіжсталь**» за 4,26 млрд грн компанії, пов’язаній з Ахметовим і Пінчуком (зятем Кучми). Інші покупці пропонували більше."], "imgs": [{"key": "s081_image76", "cap": "«Криворіжсталь», найбільший металургійний комбінат України"}]}, {"type": "defs", "title": "Зростання 2000 – 2004 рр.", "badges": [], "items": [{"name": "Що змінилося", "paras": ["З **2000 р.** економіка почала зростати; у 2004 р. приріст ВВП перевищив 12 %.", "Підприємства перейшли від бартеру до розрахунків гривнями.", "Уряд Ющенка виплатив заборговані зарплати й пенсії."], "img": null}, {"name": "За рахунок чого", "paras": ["У світі зріс попит на **сталь**, і металургія давала найбільшу частку експорту.", "Для малого бізнесу з 1998 р. діяла **спрощена система оподаткування** (єдиний податок).", "На селі з’явилися великі агрофірми."], "img": null}, {"name": "Слабкі місця", "paras": ["Зростання спиралося на продаж сировини й металу.", "Найприбутковіші підприємства належали олігархам.", "Корупції й тіньової економіки не поменшало."], "img": null}], "note": null}]}, {"id": "s4", "num": "IV", "title": "Політичне життя і Конституція (1991 – 1999)", "sub": "Партії, виборчі системи, вибори 1994 р., Конституція 1996 р., вибори 1998 – 1999 рр.", "cover": {"key": "s041_image36", "cap": ""}, "cards": [{"type": "text", "kicker": "Багатопартійність", "title": "Нові політичні партії", "badges": [], "paras": ["• **Ліві**: **Соціалістична партія** (1991, Олександр Мороз), **Селянська партія** (1992), **Комуністична партія України**, відновлена 1993 р. (Петро Симоненко), пізніше — Прогресивна соціалістична партія (Наталія Вітренко).", "• **Національні демократи й праві**: **Народний Рух України** — з 1992 р. партія (В’ячеслав Чорновіл), **Українська республіканська партія**, **Конгрес українських націоналістів** (1992, Ярослава Стецько).", "• **Центр**: Народно-демократична партія (1996), «Громада» Павла Лазаренка, СДПУ(о) Віктора Медведчука, Партія зелених.", "Партії були невеликими і часто трималися на одному лідері. У Раді їх представляли переважно депутати, обрані в округах, а не за списками."], "imgs": [{"key": "chornovil", "cap": "В’ячеслав Чорновіл, голова Народного Руху України (1992 – 1999). Фото: М.Яковенко, В.Білецький / Wikimedia Commons, Public domain"}]}, {"type": "defs", "title": "Виборчі системи", "badges": [], "items": [{"name": "Мажоритарна", "paras": ["Виборці голосують **за конкретного кандидата** в окрузі.", "Перемагає той, хто набрав більшість: просту або абсолютну (понад 50 %). Якщо ніхто не набрав абсолютної більшості, проводять другий тур.", "За нею обирали Раду в **1994 р.**"], "img": null}, {"name": "Пропорційна", "paras": ["Виборці голосують **за партійні списки**.", "Партія отримує таку частку місць, яку частку голосів набрала, якщо подолала **прохідний бар’єр**.", "Наприклад, 10 % голосів = 45 депутатів із 450.", "За нею обирали Раду **2006 і 2007 рр.**"], "img": null}, {"name": "Змішана", "paras": ["Половину депутатів (225) обирають **за партійними списками**, половину — в **одномандатних округах**.", "За нею обирали Раду **1998 і 2002 рр.** (бар’єр 4 %), а пізніше — 2012, 2014, 2019 рр."], "img": null}], "note": null}, {"type": "generic", "title": "Вибори до Верховної Ради 1994 р.", "badges": [], "blocks": [{"k": "img", "key": "nu_seats1994", "cap": ""}, {"k": "muted", "paras": ["Склад Ради за підсумками виборів 27 березня – 11 квітня 1994 р. Власна діаграма за даними ЦВК (укр. Вікіпедія)."]}, {"k": "sep"}, {"k": "p", "paras": ["Вибори відбулися **27 березня 1994 р.** за **мажоритарною** системою: щоб перемогти, кандидат мав набрати понад половину голосів, а на вибори мала прийти більш як половина виборців округу.", "Через ці жорсткі умови навесні обрали лише **336** депутатів. У решті округів вибори проводили ще кілька разів, але всіх 450 депутатів так і не обрали.", "Найбільшою фракцією стали **комуністи**. Разом із соціалістами й Селянською партією вони мали в Раді найбільше місць. Головою Ради обрали лідера соціалістів **Олександра Мороза**."], "italic": false}]}, {"type": "text", "kicker": "Вибори", "title": "Вибори Президента 1994 р.: перший тур (26 червня)", "badges": [], "paras": ["Дострокові вибори відбулися **26 червня 1994 р.** Ніхто із семи кандидатів не набрав понад половину голосів, тому **10 липня** відбувся **другий тур** між **Кравчуком** і **Кучмою**.", "Кравчука підтримали насамперед захід і центр країни, Кучму — схід і південь. Кучма обіцяв відновити економічні зв’язки з Росією й надати російській мові статус офіційної.", "**Мороз**, **Лановий** та інші кандидати разом мали близько **7 млн** голосів. У другому турі Кучма отримав на **5,9 млн** голосів більше, ніж у першому, а Кравчук — лише на **2,1 млн**. Отже, більшість цих виборців проголосували за Кучму; за нього закликали голосувати й комуністи."], "imgs": [{"key": "chart_1_36", "cap": "Дані ЦВК (за укр. Вікіпедією). Ще троє кандидатів — В. Бабич, І. Плющ, П. Таланчук — набрали менше ніж по 3 %."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_1994", "label": "Крок 1"}]}, {"type": "text", "kicker": "Персоналія", "title": "Леонід Кучма (нар. 1938)", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Леонід Кучма народився на Чернігівщині, за фахом він інженер-ракетобудівник. У 1986 – 1992 рр. Кучма керував **«Південмашем»** у Дніпропетровську, найбільшим ракетним заводом СРСР.", "У 1992 – 1993 рр. він був **прем’єр-міністром**. У **липні 1994 р.** Кучма переміг Кравчука в другому турі виборів і став **другим Президентом України**; у 1999 р. його обрали вдруге.", "За його президентства ухвалили **Конституцію 1996 р.**, запровадили гривню, а з 2000 р. почалося економічне зростання. Водночас олігархи посилили свій вплив, а влада тиснула на опозицію й журналістів. Після «касетного скандалу» і протестів 2000 – 2001 рр. Кучмі стали довіряти значно менше.", "У зовнішній політиці Кучма намагався співпрацювати і з Заходом, і з Росією («**багатовекторність**»). Після 2005 р. не брав участі у виборах; у 2014 – 2020 рр. представляв Україну в Тристоронній контактній групі щодо Донбасу."], "imgs": [{"key": "kuchma_us", "cap": "Леонід Кучма, другий Президент України. Фото: R. D. Ward / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Конституція", "title": "Конституційний процес (1991 – 1996)", "badges": ["НМТ: дата"], "paras": ["Проєкти нової Конституції готували з 1992 р., але Рада й Президент не могли домовитися, хто матиме більше влади.", "**8 червня 1995 р.** Кучма й Рада уклали **Конституційний договір** — тимчасову угоду про розподіл повноважень на рік.", "Улітку 1996 р. Кучма пригрозив винести свій проєкт Конституції на всеукраїнський референдум. Тоді депутати засідали майже добу без перерви, зокрема всю ніч, і **28 червня 1996 р.** ухвалили **Конституцію України**: «за» проголосували 315 депутатів.", "День ухвалення Конституції став державним святом."], "imgs": [{"key": "s040_image33", "cap": "Текст Конституції з підписами депутатів"}, {"key": "s041_image35", "cap": "Депутати після голосування за Конституцію, 28 червня 1996 р."}]}, {"type": "doc", "title": "Конституція України (28 червня 1996 р.)", "quote": ["**Стаття 1.** Україна є суверенна і незалежна, демократична, соціальна, правова держава.", "**Стаття 5.** Україна є республікою. Носієм суверенітету і єдиним джерелом влади в Україні є народ…", "**Стаття 10.** Державною мовою в Україні є українська мова. Держава забезпечує всебічний розвиток і функціонування української мови в усіх сферах суспільного життя на всій території України.", "**Стаття 20.** …Державний Прапор України — стяг із двох рівновеликих горизонтальних смуг синього і жовтого кольорів."], "source": "Конституція України (уривки)", "comment": ["Україна стала **президентсько-парламентською** республікою: Президент мав широкі повноваження, але прем’єр-міністра затверджувала Рада.", "Президента обирають на 5 років, не більше ніж двічі поспіль. Конституція передбачила створення **Конституційного Суду**.", "__Слова з документа:__ **суверенітет** — повнота влади; **правова держава** — держава, де всі, і влада теж, підкоряються закону."], "img": {"key": "const_cover", "cap": "Оригінал Конституції України. Фото: Верховна Рада України / Wikimedia Commons, Public domain"}}, {"type": "generic", "title": "Вибори 1998 – 1999 рр.", "badges": [], "blocks": [{"k": "img", "key": "nu_seats1998", "cap": ""}, {"k": "muted", "paras": ["Склад Ради після виборів 1998 р. Власна діаграма за даними ЦВК (укр. Вікіпедія)."]}, {"k": "sep"}, {"k": "p", "paras": ["У **березні 1998 р.** відбулися вибори до Ради за **змішаною** системою (бар’єр 4 %). Найбільше місць знову отримали **комуністи**. Головою Ради лише після кількох тижнів голосувань обрали лідера Селянської партії **Олександра Ткаченка**.", "У **березні 1999 р.** в автомобільній аварії загинув **В’ячеслав Чорновіл**, лідер Руху й можливий кандидат у президенти. Обставин аварії досі остаточно не з’ясовано.", "У **листопаді 1999 р.** в другому турі виборів Президента **Кучма** переміг комуніста **Петра Симоненка** (56 % проти 38 %). Багато виборців голосували не так «за Кучму», як проти повернення комуністів."], "italic": false}]}, {"type": "text", "kicker": "Вибори", "title": "Вибори Президента 1999 р.: перший тур (31 жовтня)", "badges": [], "paras": ["Голоси розподілилися між багатьма кандидатами. Четверо опозиційних політиків — **Мороз**, **Марчук**, **Олександр Ткаченко** і мер Черкас **Володимир Олійник** — збиралися висунути одного спільного кандидата, але так і не домовилися.", "Між турами **Марчук** підтримав Кучму, і той призначив його секретарем Ради національної безпеки і оборони.", "Ліві кандидати — Симоненко, Мороз і Вітренко — разом набрали **44,5 %**, але в **другому турі 14 листопада** Симоненко отримав лише **37,8 %**. Кучма набрав **56,3 %**: його підтримали виборці Марчука, Костенка й Удовенка і частина тих, хто спершу голосував за лівих."], "imgs": [{"key": "chart_1_42", "cap": "Дані ЦВК (за укр. Вікіпедією). Решта кандидатів набрали менше ніж по 1 %."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_1999", "label": "Крок 1"}]}]}, {"id": "s5", "num": "V", "title": "Україна на зламі століть (1999 – 2004)", "sub": "Уряд Ющенка, референдум 2000 р., «касетний скандал», «Україна без Кучми», вибори 2002 р.", "cover": {"key": "ubk_feb", "cap": ""}, "cards": [{"type": "text", "kicker": "Уряд Ющенка", "title": "Уряд Віктора Ющенка (1999 – 2001)", "badges": [], "paras": ["У грудні 1999 р. Кучма призначив прем’єр-міністром голову Національного банку **Віктора Ющенка**. Віцепрем’єркою з питань енергетики стала **Юлія Тимошенко**.", "Уряд виплатив **заборговані зарплати й пенсії**, домігся, щоб за газ і електроенергію платили грошима, а не товарами, і скасував частину пільг для фірм, близьких до влади. У 2000 р. економіка вперше після 1990 р. зросла.", "На початку 2000 р. у Раді утворилася більшість, яка підтримувала Президента й уряд. Замість Олександра Ткаченка, представника лівих, ця більшість обрала головою Ради **Івана Плюща**.", "Реформи були невигідні олігархам. **26 квітня 2001 р.** комуністи й фракції, близькі до олігархів, висловили уряду недовіру, і Ющенко пішов в опозицію."], "imgs": [{"key": "s053_image48", "cap": "Віктор Ющенко на початку 2000-х рр."}]}, {"type": "text", "kicker": "Енергетика", "title": "Закриття Чорнобильської АЕС (15 грудня 2000 р.)", "badges": ["поза програмою"], "paras": ["Після аварії 1986 р. на Чорнобильській АЕС і далі працювали три енергоблоки. Другий зупинили після пожежі 1991 р., перший — у 1996 р.", "У 1995 р. Україна підписала з державами «Великої сімки» та Європейським Союзом меморандум: Україна закриває станцію, а ці держави оплачують нові енергоблоки Хмельницької й Рівненської АЕС і на нове укриття над зруйнованим реактором.", "**15 грудня 2000 р.** Президент Кучма дав команду зупинити останній, третій енергоблок. Відтоді Чорнобильська АЕС не виробляє електроенергії.", "Нове укриття над четвертим енергоблоком, велику сталеву арку, будівельники насунули на реактор у 2016 р."], "imgs": [{"key": "chnpp", "cap": "Чорнобильська АЕС: четвертий енергоблок під старим укриттям («саркофагом»). Фото: Tiia Monto / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "Референдум", "title": "Всеукраїнський референдум 16 квітня 2000 р.", "badges": [], "paras": ["Кучма хотів посилити владу Президента над Радою. Він виніс на референдум чотири питання:", "• право Президента **розпустити Раду**, якщо вона за місяць не сформує більшості або за три місяці не ухвалить бюджет;", "• обмеження **депутатської недоторканності**;", "• скорочення кількості депутатів **з 450 до 300**;", "• створення **двопалатного** парламенту.", "Кожне питання підтримали від 80 до 90 % учасників. Проте змінити Конституцію могла лише Верховна Рада, а вона так і не проголосувала за ці зміни."], "imgs": [{"key": "s050_image43", "cap": "Бюлетені всеукраїнського референдуму 2000 р."}]}, {"type": "text", "kicker": "Рухи протесту", "title": "«Касетний скандал» (листопад 2000 р.)", "badges": [], "paras": ["**16 вересня 2000 р.** зник журналіст **Георгій Гонгадзе**, засновник інтернет-видання «**Українська правда**», яке писало про корупцію у владі. Згодом знайшли його тіло.", "**28 листопада 2000 р.** лідер соціалістів **Олександр Мороз** оприлюднив аудіозаписи, які нібито зробив у кабінеті Кучми його охоронець, майор **Микола Мельниченко**. На записах люди з голосами, схожими на голоси Кучми та його наближених, обговорювали, як позбутися журналіста.", "Кучма заперечував свою причетність. У 2008 і 2013 рр. суди винесли вироки міліціонерам, які вбили журналіста, але хто віддав наказ, так і не встановлено."], "imgs": [{"key": "s051_image44", "cap": "Георгій Гонгадзе (1969 – 2000)"}]}, {"type": "text", "kicker": "Рухи протесту", "title": "Акції «Україна без Кучми» (2000 – 2001)", "badges": [], "paras": ["Із грудня 2000 р. в Києві тривали протести під гаслом «**Україна без Кучми**». Їх підтримали соціалісти, частина правих партій, студентські організації; на Майдані стояли намети.", "Протестувальники сподівалися, що до них приєднається прем’єр-міністр Ющенко. Але в лютому 2001 р. він разом із Кучмою і головою Ради Плющем підписав звернення, у якому учасників протесту назвали «**фашистами**».", "**9 березня 2001 р.** біля Адміністрації Президента протестувальники зіткнулися з міліцією; міліція затримала сотні людей, частину з них суд засудив.", "Протестувальники не домоглися відставки Кучми, але показали, що влада втратила довіру. Пізніше багато їхніх учасників стали на бік Ющенка, коли він сам перейшов в опозицію."], "imgs": [{"key": "s052_image46", "cap": "Сутички з міліцією в Києві, 9 березня 2001 р."}]}, {"type": "generic", "title": "Вибори до Верховної Ради 2002 р.", "badges": [], "blocks": [{"k": "img", "key": "nu_seats2002", "cap": ""}, {"k": "muted", "paras": ["Фракції Ради після виборів 2002 р. Власна діаграма за даними укр. Вікіпедії."]}, {"k": "sep"}, {"k": "p", "paras": ["Вибори **31 березня 2002 р.** відбулися за змішаною системою. За партійними списками перемогла опозиційна «**Наша Україна**» **Віктора Ющенка** (23,6 %). Проурядовий блок «**За єдину Україну!**» на чолі з **Володимиром Литвином** отримав лише 11,8 %.", "Проте в одномандатних округах здебільшого перемагали кандидати влади, і чимало «самовисуванців» після виборів приєдналися до проурядової фракції. Так вона стала найбільшою в Раді.", "Головою Ради став **Володимир Литвин**, прем’єр-міністром у листопаді 2002 р. — голова Донецької обласної державної адміністрації **Віктор Янукович**."], "italic": false}]}, {"type": "text", "kicker": "Політика", "title": "Перед виборами 2004 р.", "badges": [], "paras": ["За Конституцією Президент може бути обраний не більш як двічі поспіль. Кучма доводив, що його перший строк почався ще до ухвалення Конституції 1996 р., тож він може балотуватися втретє. У 2003 р. Конституційний Суд з цим погодився, але шансів на перемогу Кучма вже не мав.", "Влада висунула кандидатом прем’єр-міністра **Віктора Януковича**, опозиція — лідера «Нашої України» **Віктора Ющенка**. Ющенка підтримали **Юлія Тимошенко** та її блок.", "Адміністрація Президента розсилала на телеканали «**темники**» — вказівки, що і як показувати. Опозиційних політиків телеканали майже не показували."], "imgs": [{"key": "s055_image51", "cap": "Віктор Ющенко, кандидат опозиції"}, {"key": "s055_image52", "cap": "Віктор Янукович, кандидат влади"}]}]}, {"id": "s6", "num": "VI", "title": "Помаранчева революція (2004)", "sub": "Вибори Президента 2004 р., фальсифікації, протести на Майдані, переголосування", "cover": {"key": "maidan04_morning", "cap": ""}, "cards": [{"type": "text", "kicker": "Вибори 2004", "title": "Кампанія і перший тур (31 жовтня 2004 р.)", "badges": [], "paras": ["Улітку 2004 р. кампанію Януковича підтримували майже всі телеканали, а на чиновників, учителів, працівників держпідприємств тиснули, щоб вони голосували «правильно».", "На початку вересня **Віктора Ющенка отруїли**: лікарі у Відні виявили в його організмі велику дозу **діоксину**. Хто організував отруєння, суд так і не встановив.", "У **першому турі 31 жовтня** Ющенко набрав **39,9 %**, Янукович — **39,3 %**. Результати ЦВК оголосила лише через 10 днів. Соціаліст Мороз, який посів третє місце, підтримав Ющенка."], "imgs": [{"key": "s056_image53", "cap": "Віктор Ющенко до і після отруєння, 2004 р."}]}, {"type": "text", "kicker": "Вибори 2004", "title": "Вибори Президента 2004 р.: перший тур (31 жовтня)", "badges": [], "paras": ["У першому турі Ющенко випередив Януковича менш ніж на **1 %**. Тому було важливо, за кого в другому турі проголосують виборці інших кандидатів.", "**Мороз**, який посів третє місце, закликав голосувати за Ющенка.", "На переголосуванні другого туру **26 грудня** Ющенко отримав **15,1 млн** голосів — на **4 млн** більше, ніж у першому турі. Янукович отримав **12,8 млн** — на **1,8 млн** більше."], "imgs": [{"key": "chart_1_54", "cap": "Дані ЦВК (за укр. Вікіпедією). Решта кандидатів набрали менше ніж по 1 %."}]}, {"type": "text", "kicker": "Помаранчева революція", "title": "Другий тур і початок протестів (21 – 22 листопада)", "badges": [], "paras": ["**21 листопада 2004 р.** відбувся **другий тур**. ЦВК оголосила переможцем **Януковича**: 49,5 % проти 46,6 %. Проте **екзит-пол**, опитування виборців на виході з дільниць, показував перемогу Ющенка.", "Спостерігачі зафіксували масові порушення: «**каруселі**» (тих самих людей возили голосувати з дільниці на дільницю), вкидання бюлетенів, підозріло високу явку на сході: у Донецькій області вона нібито перевищила 96 %.", "Уже **22 листопада** на **Майдан Незалежності** в Києві вийшли сотні тисяч людей з помаранчевими стрічками: помаранчевий був кольором кампанії Ющенка. На Хрещатику протестувальники поставили наметове містечко."], "imgs": [{"key": "maidan04_night", "cap": "Майдан Незалежності, листопад 2004 р. Фото: Toronto_guy / Wikimedia Commons, CC BY 3.0"}]}, {"type": "text", "kicker": "Помаранчева революція", "title": "Майдан і круглі столи (22 листопада – 8 грудня)", "badges": [], "paras": ["Протестувальники блокували будівлі уряду й Адміністрації Президента. Протест був **мирним**; влада так і не застосувала проти учасників силу.", "**27 листопада** Верховна Рада визнала, що результати виборів не відображають волі виборців.", "**28 листопада** у **Сєвєродонецьку** прихильники Януковича провели з’їзд депутатів місцевих рад, на якому закликали створити «автономну республіку» на сході й півдні.", "Для переговорів до Києва приїхали президенти Польщі й Литви, представники ЄС і ОБСЄ. За «**круглим столом**» Кучма, Ющенко і Янукович шукали вихід із кризи.", "**3 грудня 2004 р.** **Верховний Суд** визнав результати другого туру недійсними й призначив **переголосування**."], "imgs": [{"key": "roundtable04", "cap": "«Круглий стіл» за участю міжнародних посередників. Фото: невідомий автор / Wikimedia Commons, GFDL 1.2"}, {"key": "sievierodonetsk04", "cap": "Мітинг на підтримку Сєвєродонецького з’їзду, 28 листопада 2004 р. Фото: LOBAN53 / Wikimedia Commons, Public domain"}]}, {"type": "doc", "title": "Рішення Верховного Суду (3 грудня 2004 р.)", "quote": ["Суд установив, що під час повторного голосування 21 листопада 2004 р. **були порушені засади виборчого права**: списки виборців складено неправильно, голосування за відкріпними посвідченнями й поза дільницями ніхто належно не контролював, а кандидати не мали рівного доступу до засобів масової інформації.", "Через це **неможливо достовірно встановити, як насправді проголосували виборці**.", "Суд вирішив: **визнати дії Центральної виборчої комісії неправомірними й скасувати її постанову** про результати виборів і про обрання Президента; **зобов’язати ЦВК призначити повторне голосування**."], "source": "Рішення Судової палати у цивільних справах Верховного Суду України від 3 грудня 2004 р. (переказ, скорочено)", "comment": ["До суду звернувся довірений представник Віктора Ющенка. Засідання тривали п’ять днів, їх показували по телебаченню в прямому ефірі.", "Виконуючи рішення суду, ЦВК призначила переголосування другого туру на **26 грудня 2004 р.**", "__Слова з документа:__ **повторне голосування** — другий тур виборів; **ЦВК** — Центральна виборча комісія, яка підраховує голоси й оголошує результати."], "img": {"key": "klov", "cap": "Кловський палац у Києві — будинок Верховного Суду. Фото: Haidamac / Wikimedia Commons, CC BY-SA 4.0"}}, {"type": "text", "kicker": "Помаранчева революція", "title": "Компроміс 8 грудня і переголосування", "badges": ["НМТ: дата"], "paras": ["**8 грудня 2004 р.** Рада ухвалила одним пакетом:", "• зміни до виборчого закону, які обмежили голосування вдома й за відкріпними талонами, бо саме так найчастіше фальсифікували голоси;", "• новий склад ЦВК;", "• **зміни до Конституції** (з 2006 р.): Україна ставала **парламентсько-президентською** республікою, уряд формувала коаліція в Раді.", "**26 грудня 2004 р.** під час переголосування переміг **Віктор Ющенко** — **52 %** проти 44,2 %. **23 січня 2005 р.** він склав присягу Президента."], "imgs": [{"key": "s058_image56", "cap": "Наметове містечко на Хрещатику, грудень 2004 р."}, {"key": "tak_stamps", "cap": "Поштові марки «Інавгурація Президента України», 2005 р. Фото: Original uploader was Vizu at ru.wikipedia\n\nLater versions were uploaded by Чобиток Василий at ru.wikipedia. / Wikimedia Commons, Public domain"}]}, {"type": "map", "title": "", "steps": [{"key": "nu_2004", "label": "Крок 1"}]}, {"type": "text", "kicker": "Персоналія", "title": "Віктор Ющенко (нар. 1954)", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Віктор Ющенко народився на Сумщині в родині вчителів, здобув фах економіста й працював у банках. У **1993 – 1999 рр.** він очолював **Національний банк**, який 1996 р. запровадив гривню.", "У **1999 – 2001 рр.** Ющенко був **прем’єр-міністром**: його уряд виплатив заборговані зарплати й пенсії. Після відставки він став лідером опозиції; у 2002 р. його блок «**Наша Україна**» переміг на виборах за партійними списками.", "Під час виборчої кампанії 2004 р. його отруїли діоксином. Після **Помаранчевої революції** Ющенко став **третім Президентом України** (2005 – 2010)."], "imgs": [{"key": "yushch", "cap": "Віктор Ющенко, третій Президент України. Фото: Secretariat of the President of Ukraine / Wikimedia Commons, CC BY 4.0"}]}, {"type": "cols", "title": "Помаранчева революція: підсумки", "badges": ["НМТ: поняття", "НМТ: дата"], "intro": null, "blocks": [{"h": "Що це було", "paras": ["**Помаранчева революція** — масові мирні протести в Україні в **листопаді – грудні 2004 р.** проти фальсифікації виборів Президента. Назва походить від помаранчевого кольору кампанії Віктора Ющенка.", "Протести закінчилися переголосуванням другого туру, у якому переміг Ющенко.", "Символами протесту стали помаранчеві стрічки й гасло «**Разом нас багато — нас не подолати!**». Наметове містечко на Хрещатику простояло до кінця січня 2005 р."]}, {"h": "Що змінила", "paras": ["• Українці вперше масово й мирно захистили свій вибір.", "• Вибори 2006 – 2010 рр. спостерігачі визнавали чесними.", "• З 2006 р. діяла **парламентсько-президентська** модель влади.", "• Тих, хто фальсифікував вибори, майже не покарали; розкол країни на «схід» і «захід» поглибився."]}]}]}, {"id": "s7", "num": "VII", "title": "Суспільство (1991 – 2004)", "sub": "Населення, міграції, рівень життя", "cover": {"key": "s065_image62", "cap": ""}, "cards": [{"type": "text", "kicker": "Населення", "title": "Чисельність населення (1991 – 2005)", "badges": [], "paras": ["Найбільше людей в Україні жило на початку **1993 р.** — понад **52 млн**. Потім населення щороку зменшувалося: помирало більше людей, ніж народжувалося, а багато хто виїжджав за кордон.", "Зменшення населення називають **депопуляцією**.", "За переписом **2001 р.** в Україні жило **48,5 млн** осіб."], "imgs": [{"key": "chart_1_63", "cap": "Чисельність наявного населення на 1 січня, за даними Держстату; округлено."}]}, {"type": "text", "kicker": "Населення", "title": "Перепис 2001 р. і міграції", "badges": [], "paras": ["Перепис **2001 р.** — єдиний за роки незалежності. **Українці** становили **77,8 %** населення, **росіяни** — **17,3 %** (1989 р. — 22,1 %). В Україні також жили білоруси, молдовани, кримські татари, болгари, угорці, румуни, поляки, євреї та інші.", "Українську мову рідною назвали **67,5 %** громадян. Близько двох третин населення жило в містах.", "У 1990-х рр. багато людей **емігрували** назавжди — до Ізраїлю, США, Німеччини, Канади. Ще більше їздило на **заробітки**: до Росії, Польщі, Італії, Португалії, Чехії, Іспанії. Точних даних немає; за оцінками, на початку 2000-х рр. за кордоном працювали **2 – 3 млн** українців."], "imgs": [{"key": "s064_image61", "cap": "Вікова піраміда населення України: чоловіки й жінки за віком (порівняння 1989 і 2020 рр.)"}]}, {"type": "text", "kicker": "Населення", "title": "Народжуваність і смертність (1990 – 2004)", "badges": [], "paras": ["Від **1991 р.** в Україні щороку помирало більше людей, ніж народжувалося. Різниця між числом народжених і померлих — **природний приріст**; в Україні він став від’ємним.", "Найбільше людей померло в **1995 р.** — 792,6 тис. Найменше дітей народилося у **2001 р.** — 376,5 тис., майже вдвічі менше, ніж у 1990 р.", "Демографи пояснюють спад народжуваності й високу смертність бідністю, невпевненістю в майбутньому, погіршенням медичної допомоги, поширенням хвороб і нездоровим способом життя."], "imgs": [{"key": "chart_1_65", "cap": "Дані Держстату, тис. осіб."}]}, {"type": "text", "kicker": "Суспільство", "title": "Як жили люди в 1990-х рр.", "badges": [], "paras": ["**Доходи.** Зарплати й пенсії знецінювалися, їх місяцями **не виплачували**. Підприємства видавали зарплату продукцією — посудом, цукром, тканиною. Чимало людей жили з городу й підсобного господарства.", "**Робота.** Заводи простоювали, людей відправляли у **вимушені відпустки** без оплати. Багато хто став «**човником**»: возив товари з Польщі, Туреччини, Китаю й продавав на ринках. Відкривалися приватні магазини, кіоски, кафе.", "**Суспільство.** Люди різко **поділилися на багатих і бідних**: з’явилися дуже багаті, але більшість зубожіла. Зросла злочинність, поширився рекет, з’явилися злочинні угруповання. З 2000 р. доходи почали зростати, а уряд виплатив заборговані зарплати."], "imgs": [{"key": "maidan92", "cap": "Майдан Незалежності в Києві, 1992 р. Фото: Lankyrider / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "kupon1", "cap": "Купон на 1 карбованець, 1991 р. Купоно-карбованець був тимчасовою грошовою одиницею України (1992 – 1996). Фото: Національний банк України / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Суспільство", "title": "Ринки, «човники» і злочинність (1990-ті рр.)", "badges": ["поза програмою"], "paras": ["Державні магазини стояли напівпорожні, і одяг, взуття, техніку, продукти люди купували на **ринках**. Найбільшими стали «**Сьомий кілометр**» під Одесою, «**Барабашово**» в Харкові, Троєщинський ринок у Києві. Торгували з розкладних столиків, з машин, просто з рук.", "«**Човники**» їздили до Польщі, Туреччини, Китаю з великими картатими сумками: купували там дешевий одяг і техніку, а вдома перепродували. Так заробляли й колишні інженери, учителі, лікарі.", "Злочинні угруповання вимагали в торговців і підприємців гроші «за захист» — це називали **рекетом**. Боротьба за підприємства й ринки часто закінчувалася вбивствами на замовлення. У **1995 р.** під час футбольного матчу на стадіоні «Шахтар» у Донецьку вибухом убили власника клубу **Ахатя Брагіна**, а в **1996 р.** в донецькому аеропорту застрелили народного депутата й підприємця **Євгена Щербаня**."], "imgs": [{"key": "bessarab", "cap": "Бессарабська площа в Києві, 1990-ті рр. Фото: М. Яковенко, В. Білецький / Wikimedia Commons, Public domain"}, {"key": "barabash", "cap": "Вхід на ринок «Барабашово» в Харкові, 2012 р. Фото: UeArtemis / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Суспільство", "title": "Середня зарплата в доларах (1996 – 2004)", "badges": [], "paras": ["Держстат рахує середню зарплату в гривнях. Щоб зарплати різних років можна було порівняти, тут їх перераховано в долари за середнім курсом Національного банку.", "Після фінансової кризи 1998 р. гривня подешевшала: у 1998 р. долар коштував у середньому 2,45 грн, а в 1999 р. — 4,13 грн. Тому в перерахунку зарплата впала: у 2000 р. — до **42 доларів**.", "З 2000 р. економіка зростала. За чотири роки зарплата зросла майже втричі: у 2004 р. — до **111 доларів**."], "imgs": [{"key": "chart_1_68", "cap": "Розрахунок: середньомісячна зарплата (Держстат) ÷ середньорічний курс долара (НБУ); округлено."}]}]}, {"id": "s8", "num": "VIII", "title": "Зовнішня політика (1991 – 2004)", "sub": "Визнання, міжнародні організації, Росія, НАТО і ЄС, кордони й суперечки", "cover": {"key": "clinton_kuchma", "cap": ""}, "cards": [{"type": "text", "kicker": "Зовнішня політика", "title": "Визнання і «багатовекторність»", "badges": [], "paras": ["Першими незалежність України визнали **Польща** й **Канада** (2 грудня 1991 р.), а до кінця 1992 р. — понад 130 держав.", "Україна була **співзасновницею ООН** ще з 1945 р. (як УРСР). У 2000 – 2001 рр. вона вперше як незалежна держава була непостійним членом **Ради Безпеки ООН**. Українські миротворці служили в колишній Югославії, Лівані, Сьєрра-Леоне та інших країнах.", "Кучма називав свою зовнішню політику «**багатовекторною**»: Україна співпрацювала із Заходом і водночас зберігала добрі відносини з Росією. Це допомагало уникати конфліктів, але не давало ні гарантій безпеки, ні членства в союзах."], "imgs": [{"key": "s070_image67", "cap": "Емблема ООН"}]}, {"type": "table", "title": "Україна в міжнародних організаціях", "rows": [["Організація", "Рік", "Що це дало"], ["ОБСЄ (НБСЄ)", "1992", "Участь у системі безпеки Європи; місія ОБСЄ в Криму (1994 – 1999)"], ["МВФ і Світовий банк", "1992", "Кредити в обмін на реформи: скорочення бюджетного дефіциту, приватизацію"], ["НАТО: «Партнерство заради миру»", "1994", "Спільні навчання; 1997 р. — **Хартія про особливе партнерство** з НАТО; 2002 р. Україна заявила, що хоче вступити до НАТО"], ["Рада Європи", "**1995**", "Стандарти прав людини й демократії; Україна скасувала смертну кару (1999 – 2000) — **дата з програми НМТ**"], ["Європейський Союз", "1994 / 1998", "Угоду про партнерство і співробітництво підписано 1994 р., чинна з 1998 р."], ["СНД", "1991", "Україна — засновниця, але не підписала Статут СНД (1993) і не брала участі у військових структурах"]]}, {"type": "text", "kicker": "Зовнішня політика", "title": "Українські миротворці (1992 – 2005)", "badges": ["поза програмою"], "paras": ["**Місії ООН.** З **1992 р.** українські військові служать у миротворчих місіях ООН. Перший батальйон Україна відправила до **Боснії і Герцеговини**, у Сараєво.", "Згодом українські миротворці служили в Косові, Лівані, Сьєрра-Леоне, Ліберії. Україна надавала місіям вертольоти з екіпажами й військових інженерів. У Косові українці входили до спільного батальйону з польськими військовими.", "**Ірак (2003 – 2005).** У **2003 р.** Верховна Рада дозволила відправити українських військових до **Іраку**, де після повалення Саддама Хусейна стояли війська США та їхніх союзників. Так Кучма намагався покращити відносини зі США, які зіпсувалися після «касетного скандалу».", "Близько 1600 українських військових підтримували порядок у провінції **Васіт**. У квітні 2004 р. вони вели бій з повстанцями в місті Ель-Кут.", "В Іраку загинуло 18 українських військових. До кінця **2005 р.** Україна вивела звідти свої війська."], "imgs": [{"key": "unifil_ua", "cap": "Військові 3-го окремого інженерного батальйону ЗС України в місії ООН у Лівані, 2000 р. Фото: Степан Курган / Wikimedia Commons, CC BY 4.0"}]}, {"type": "map", "title": "", "steps": [{"key": "nu_peace", "label": "Крок 1"}]}, {"type": "text", "kicker": "Зовнішня політика", "title": "Відносини з Росією", "badges": [], "paras": ["Найгостріші питання 1990-х рр. — **Крим**, **Чорноморський флот**, борги за **газ**. Росія використовувала ціни на газ, щоб тиснути на Україну.", "**31 травня 1997 р.** Кучма і Єльцин підписали **Договір про дружбу, співробітництво і партнерство** («Великий договір»): держави визнали непорушність кордонів одна одної. Тоді ж уклали угоди про флот.", "У **2003 р.** Україна й Росія підписали договір про сухопутний кордон, але про межі в Азовському морі й Керченській протоці не домовилися.", "**Восени 2003 р.** Росія почала будувати **дамбу** від Таманського півострова до українського острова **Тузла** в Керченській протоці. Україна відправила на острів прикордонників, і Росія зупинила будівництво. Конфлікт показав, що Росія готова претендувати на українські території."], "imgs": [{"key": "s077_image74", "cap": "Острів Тузла в Керченській протоці, супутниковий знімок"}]}, {"type": "map", "title": "", "steps": [{"key": "nu_neighbors", "label": "Крок 1"}]}]}, {"id": "s9", "num": "IX", "title": "Культура і духовне життя (1991 – 2004)", "sub": "Освіта, наука, мистецтво, відбудова пам’яток, церкви", "cover": {"key": "michael_now", "cap": ""}, "cards": [{"type": "defs", "title": "Культура в 1990-х – на початку 2000-х рр.", "badges": [], "items": [{"name": "Свобода і розмаїття", "paras": ["Зникла цензура: виходили раніше заборонені книжки, з’явилися нові течії й жанри.", "Налагодилися зв’язки з **українською діаспорою**.", "Поруч з українськими працювали приватні російськомовні видавництва, телеканали, радіо."], "img": null}, {"name": "Гроші й ринок", "paras": ["Держава мало фінансувала культуру; театри й музеї ледве виживали.", "Культура стала **комерційною**: найбільше глядачів і читачів мали серіали, естрада, бульварні книжки.", "Багато митців виїхали або змінили професію."], "img": null}, {"name": "Мова", "paras": ["Конституція 1996 р. закріпила українську як єдину державну мову.", "Дедалі більше шкіл переходило на українську мову навчання.", "На телебаченні, у пресі й на естраді переважала російська."], "img": null}], "note": null}, {"type": "text", "kicker": "Культура", "title": "Література (1991 – 2004)", "badges": ["поза програмою"], "paras": ["Після скасування цензури вийшла друком проза **Юрія Андруховича**: романи «Рекреації» (1992) і «Московіада» (1993). Тоді ж читачі дізналися про **Оксану Забужко**, яка писала романи, вірші й есе. **Валерій Шевчук** і далі писав історичні романи й повісті.", "Видавництва надрукували й твори, заборонені за радянської влади: поезію Василя Стуса, прозу письменників «Розстріляного відродження».", "**Ліна Костенко** надрукувала історичний роман у віршах «**Берестечко**» (1999) про поразку війська Богдана Хмельницького. У 2004 р. вийшли роман **Марії Матіос** «**Солодка Даруся**» про буковинське село 1940‑х рр. і роман **Сергія Жадана** «Депеш Мод» про харківську молодь початку 1990‑х рр.", "З 1994 р. у Львові щороку відбувається **Форум видавців** — найбільший книжковий ярмарок України."], "imgs": [{"key": "kostenko", "cap": "Ліна Костенко, 2006 р. Фото: keymaster / Wikimedia Commons, GFDL"}, {"key": "zabuzhko", "cap": "Оксана Забужко на «Книжковому Арсеналі», 2021 р. Фото: Олександр Гаврик / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Культура", "title": "Музика і кіно (1991 – 2004)", "badges": ["поза програмою"], "paras": ["**Музика.** Композитори **Мирослав Скорик** і **Євген Станкович** писали опери, балети й симфонії. На фестивалі «**Червона рута**» виступали молоді виконавці, які співали українською. У 1994 р. у Львові з’явився гурт «**Океан Ельзи**». У 2004 р. **Руслана** з піснею «Дикі танці» перемогла на «Євробаченні».", "**Кіно.** Держава майже не фінансувала кіно, тому фільмів знімали мало. Серед них — «Молитва за гетьмана Мазепу» **Юрія Іллєнка** (2002) і «Мамай» **Олеся Саніна** (2003)."], "imgs": [{"key": "opera_kyiv", "cap": "Національна опера України в Києві. Фото: Suicasmo / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "ruslana", "cap": "Руслана (у центрі) отримує Міжнародну жіночу премію за мужність, Вашингтон, 2014 р. Фото: U.S. Department of State / Wikimedia Commons, public domain"}]}, {"type": "text", "kicker": "Культура", "title": "Живопис: Іван Марчук", "badges": ["поза програмою"], "paras": ["**Іван Марчук** народився у 1936 р. на Тернопільщині. За радянської влади його картини не відповідали вимогам «соціалістичного реалізму», тому виставлятися йому майже не дозволяли.", "У 1989 р. Марчук виїхав за кордон, жив в Австралії, Канаді й США, а в 2001 р. повернувся до Києва. Його виставки відбувалися в багатьох країнах світу; у 1997 р. він отримав Шевченківську премію.", "Марчук пише пейзажі, портрети й фантастичні композиції. Свою техніку — тисячі тонких переплетених ліній — він назвав «**пльонтанізмом**», від слова «плести»."], "imgs": [{"key": "marchuk_dnipro", "cap": "Іван Марчук. «Зійшло сонце над Дніпром», 2003 р. Фото: Іван Марчук / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "marchuk_morning", "cap": "Іван Марчук. «Проміння ранкового сонця», 2005 р. Фото: Іван Марчук / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Спорт", "title": "Олімпі

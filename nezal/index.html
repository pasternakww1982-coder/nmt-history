а кримінальну відповідальність за неправдиві відомості в електронних деклараціях. Звернення до суду подали 47 депутатів, переважно з «Опозиційної платформи – За життя».", "Зеленський запропонував Раді припинити повноваження всіх суддів Конституційного Суду, але Рада цього не підтримала. Наприкінці 2020 р. Президент указом відсторонив голову суду Олександра Тупицького. Прихильники Президента вважали, що суд захищав корупціонерів, а критики — що Президент не має права усувати суддів.", "**Санкції проти телеканалів.** **2 лютого 2021 р.** РНБО запровадила санкції проти депутата Тараса Козака, близького до Віктора Медведчука, і його телеканалів «112 Україна», NewsOne і ZIK; канали припинили мовлення. Влада пояснювала, що канали поширювали російську пропаганду. Критики заявляли, що закривати телеканали має суд, а не РНБО."], "imgs": [{"key": "ksu", "cap": "Будинок Конституційного Суду України в Києві. Фото: Dezidor / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "2019 – 2022", "title": "24 лютого 2022 р.: повномасштабне вторгнення", "badges": ["поза програмою"], "paras": ["Восени 2021 р. Росія стягнула до кордонів України понад 100 тис. військових. **24 лютого 2022 р.** вона почала **повномасштабне вторгнення** — з півночі, сходу й півдня.", "Збройні Сили, територіальна оборона й волонтери відстояли Київ, Харків, Миколаїв. Навесні 2022 р. українські війська вигнали окупантів з Київщини, Чернігівщини, Сумщини; а восени звільнили Харківщину й Херсон.", "Мільйони українців стали біженцями й переселенцями. У червні 2022 р. Україна отримала статус **кандидата на вступ до ЄС**."], "imgs": [{"key": "warship_stamp", "cap": "Поштова марка «Русскій воєнний корабль, іди…!», квітень 2022 р. Її присвятили захисникам острова Зміїний, які 24 лютого 2022 р. відмовилися здатися російському крейсеру «Москва». Фото: Укрпошта, художник Борис Грох / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "2022 – 2026", "title": "Після 2022 р.: війна триває", "badges": ["поза програмою"], "paras": ["У **2023 р.** українські війська наступали на півдні, але прорвати оборону росіян не змогли. **6 червня 2023 р.** росіяни підірвали греблю **Каховської ГЕС**: вода затопила десятки сіл і частину Херсона.", "У серпні **2024 р.** Збройні Сили перейшли кордон і зайняли частину Курської області Росії. Найважчі бої точилися на Донеччині — за Бахмут, Авдіївку, Покровськ.", "Росія обстрілює ракетами й дронами українські міста та електростанції. Мільйони українців виїхали за кордон або переселилися в інші області.", "**25 червня 2024 р.** Україна почала **переговори про вступ до ЄС**. До листопада 2026 р. Європейський Союз відкрив чотири з шести розділів («кластерів») цих переговорів."], "imgs": [{"key": "kakhovka", "cap": "Каховська гребля до і після підриву 6 червня 2023 р., супутникові знімки. Фото: Pierre Markuse / Wikimedia Commons, CC BY 2.0"}]}]}, {"id": "s9", "num": "IX", "title": "Узагальнення", "sub": "Влада в 2005 – 2019 рр., поняття, що часто плутають на НМТ, стрічки часу", "cover": {"key": "redcross14", "cap": ""}, "cards": [{"type": "table", "title": "Хто керував державою (2005 – 2019)", "rows": [["Посада", "2005 – 2010", "2010 – 2014", "2014 – 2019"], ["Президент", "**Віктор Ющенко**", "**Віктор Янукович** (утік у лютому 2014 р.)", "Олександр Турчинов (в. о.), **Петро Порошенко** (з 7 червня 2014 р.)"], ["Голова Верховної Ради", "Володимир Литвин, Олександр Мороз, Арсеній Яценюк, Володимир Литвин", "Володимир Литвин, Володимир Рибак", "Олександр Турчинов, Володимир Гройсман, Андрій Парубій"], ["Прем’єр-міністр", "Юлія Тимошенко, Юрій Єхануров, Віктор Янукович, Юлія Тимошенко", "Микола Азаров", "Арсеній Яценюк, Володимир Гройсман"], ["Вибори до Ради", "2006, 2007 (пропорційна)", "2012 (змішана)", "2014 (змішана)"]]}, {"type": "table", "title": "Президенти: головні події і проблеми (2005 – 2022)", "rows": [["Президент", "Головні події", "Проблеми, що лишилися"], ["**Віктор Ющенко** (2005 – 2010)", "Вибори 2006 і 2007 рр. відбулися без масових фальсифікацій. Рада визнала Голодомор геноцидом (2006). Україна вступила до СОТ (2008).", "У «помаранчевій» коаліції стався розкол, уряди часто змінювалися. Двічі виникали газові конфлікти з Росією."], ["**Віктор Янукович** (2010 – 2014)", "Підготовлено текст Угоди про асоціацію з ЄС. Проведено чемпіонат Європи з футболу (2012).", "Президент зосередив владу у своїх руках, лідерів опозиції ув’язнено. Харківські угоди залишили флот Росії в Криму до 2042 р."], ["**Петро Порошенко** (2014 – 2019)", "Підписано Угоду про асоціацію, запроваджено безвізовий режим з ЄС. Зміцнено армію, проведено децентралізацію. ПЦУ отримала томос.", "Мінські домовленості не повернули ні миру, ні окупованих територій. Суди реформовано лише частково."], ["**Володимир Зеленський** (з 2019 р.; події до 24 лютого 2022 р.)", "Скасовано недоторканність депутатів, відкрито ринок землі, запрацювала «Дія», завершено створення громад. Створено Кримську платформу.", "Переговори з Росією не принесли миру. У 2020 р. сталася конституційна криза; суди реформовано лише частково."]]}, {"type": "table", "title": "Поняття теми (1)", "rows": [["Поняття", "Значення"], ["Євромайдан", "Протести, що почалися 21 листопада 2013 р. після рішення уряду зупинити підготовку до Угоди про асоціацію з ЄС."], ["Революція Гідності", "Масові протести листопада 2013 – лютого 2014 р. проти корупції, свавілля силовиків і авторитарної влади, на підтримку європейського вибору."], ["Небесна Сотня", "Загиблі учасники Революції Гідності."], ["Анексія", "Насильницьке приєднання державою території іншої держави."], ["Сепаратизм", "Прагнення відокремити частину території держави."], ["Антитерористична операція (АТО)", "Офіційна назва операції Збройних Сил, Національної гвардії та інших підрозділів проти російських і проросійських збройних формувань на Донбасі (2014 – 2018)."], ["Тимчасово окупована територія", "Землі України, які захопила й контролює Росія: Крим, Севастополь, частина Донецької й Луганської областей (з 2014 р.), інші райони — з 2022 р."]]}, {"type": "table", "title": "Поняття теми (2)", "rows": [["Поняття", "Значення"], ["Кіборг", "Так називали захисників Донецького аеропорту (2014 – 2015)."], ["Волонтерський рух", "Безоплатна добровільна допомога: збір коштів, спорядження для армії, допомога пораненим і переселенцям."], ["Громадянське суспільство", "Незалежні від держави об’єднання громадян, які захищають інтереси людей і контролюють владу."], ["Люстрація", "Заборона високопосадовцям поваленого режиму певний час працювати на державній службі."], ["Безвізовий режим", "Право громадян їздити до інших країн без попереднього оформлення візи; для українців у ЄС — з 11 червня 2017 р."], ["Екуменізм", "Рух за співпрацю й порозуміння між християнами різних церков."]]}, {"type": "cols", "title": "Що часто плутають", "badges": [], "intro": null, "blocks": [{"h": "Дати й події", "paras": ["• **СОТ** — 2008 р.; **Рада Європи** — 1995 р.", "• **Євромайдан** — з 21.11.2013; **Революція Гідності** — з 30.11 – 1.12.2013.", "• **Мінськ-1** — 5.09.2014; **Мінськ-2** — 12.02.2015.", "• **Угода про асоціацію** — 2014 р.; **безвіз** — 2017 р.", "• Порошенко: обраний 25.05, присяга 7.06.2014."]}, {"h": "Люди й поняття", "paras": ["• **Анексія** — приєднання чужої території; **окупація** — військовий контроль над нею.", "• **Кіборги** — захисники Донецького аеропорту.", "• **Екуменізм** — співпраця церков; **поліконфесійність** — у країні багато різних церков.", "• **Томос** отримала ПЦУ (2019), а не УГКЦ."]}]}, {"type": "tl_periods", "title": "Стрічка часу: влада в 2005 – 2019 рр.", "note": "Перша сіра смуга — уряд Ю. Єханурова; перша помаранчева — перший уряд Ю. Тимошенко (2005). Конституція: з 2006 р. — парламентсько-президентська модель, 2010 – 2014 рр. — президентсько-парламентська, з 2014 р. — знову парламентсько-президентська. Шкала часу пропорційна.", "x_from": 2005, "x_to": 2019.6, "ticks": [[2005, "2005"], [2007, "2007"], [2009, "2009"], [2011, "2011"], [2013, "2013"], [2015, "2 const CREDIT = /((?:^|[.;,]\s+|\s)(?:Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення)[^:]{0,25}:.*|(?:^|[.;,]\s+)(?:Суспільне надбання|Public domain|Wikimedia Commons|CC BY|CC0).*|\s*\((?:фото|малюнок)[^)]*\)\s*)$/i;
function capHtml(cap) {
  if (!cap) return '';
  const m = String(cap).match(CREDIT);
  if (!m || m.index === 0 && !/^\s*(Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення|Суспільне|Public|Wikimedia|CC)/i.test(cap)) return md(cap);
  const head = cap.slice(0, m.index).replace(/[.;,\s]+$/, ''), tail = m[0].replace(/^[.;,\s]+/, '');
  return `${head ? md(head) + (/[.!?…»]$/.test(head) ? '' : '.') + ' ' : ''}<span class="cr">${esc(tail)}</span>`;
}

const PERIODS_DEFAULT = null;
const R = {

    if (L.length) {

  table(c) {

      ${r.segs.some(g => g.sub) ? `<div class="sb">${r.segs.filter(g => g.sub).map(g => md(g.sub)).join(' · ')}</div>` : ''}</div>`).join('');

      <div class="scale"><div class="line"></div><div class="marks">${m.map(a => `<div class="m"><i></i><span>${a}</span></div>`).join('')}</div></div>

    return `${chips(c.badges)}${h2(c.title)}<p>${md(c.intro)}</p>${rows}`;

  generic(c) {
    const groups = [[]];
    c.blocks.forEach(b => { if (b.k === 'sep') groups.push([]); else groups[groups.length - 1].push(b); });
    const g = groups.filter(x => x.length);
    const rb = b => b.k === 'h' ? `<h3 class="${b.light ? 'l' : ''}">${md(b.text)}</h3>` : b.k === 'date' ? `<span class="pill">${md(b.text)}</span>`

    }).join('');
    return `${chips(c.badges)}${h2(c.title)}${body}`;
  },
};

/* ---------- навігація ---------- */
const P = id => LESSONS.find(l => l.id === id);
function secProgress(L, s) { const seen = store.get(`seen_${L.id}-${s.id}`, []).length; return Math.min(seen, s.cards.length); }
function partProgress(L) { let a = 0, b = 0; L.sections.forEach(s => { a += secProgress(L, s); b += s.cards.length; }); return [a, b]; }

function index() {
  document.title = TITLE;
  const L0 = LESSONS[0];
  /* тема «лише уроки» в спільній оболонці: посилання назад на полицю тем (у повному курсі його додає course.js) */

function partHome(L) {
  document.title = `${L.part} — ${TITLE}`;
  const i = LESSONS.indexOf(L), next = LESSONS[i + 1];
  const secs = L.sections.map(s => {
    const seen = secProgress(L, s), n = s.cards.length, done = seen >= n;
    return `<button class="sec-btn${done ? ' done' : ''}" data-go="${L.id}-${s.id}"><span class="num">${done ? '✓' : s.num}</span>
      <span><h3>${md(s.title)}</h3><div class="st">${seen ? `Переглянуто <b>${seen} з ${n}</b>` : `${n} карток`}</div>
      <div class="prog-mini"><i style="width:${Math.round(100 * seen / n)}%"></i></div></span></button>`;
  }).join('');
  const nextBtn = next ? `<button class="btn" data-go="${next.id}" style="margin-top:20px">Далі: ${esc(next.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:20px" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>
       <p class="cap">Посилання працює, якщо файли лежать в одній папці.</p>` : '');
  app.innerHTML = `${MODE === 'all' ? `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${L.num}</span></div></div>` : ''}
  <div class="wrap">

    <div class="h2">Розділи</div><div class="sec-list">${secs}</div>
    ${L.program ? `<div class="h2">Що треба знати для НМТ</div><section class="card">${R.generic({ ...L.program, title: '' })}</section>` : ''}
    ${nextBtn}
  </div>`;

let obs = null;
function section(L, s) {
  document.title = `${s.num}. ${s.title} — ${TITLE}`;
  const k = L.sections.indexOf(s), next = L.sections[k + 1], nextPart = LESSONS[LESSONS.indexOf(L) + 1];
  const cards = s.cards.map((c, i) => `<section class="card" data-i="${i}">${(R[c.type] || R.generic)(c, i)}</section>`).join('');
  let end = next ? `<button class="btn" data-go="${L.id}-${next.id}">Далі: розділ ${next.num}. ${esc(next.title)} →</button>`
    : nextPart ? `<button class="btn" data-go="${nextPart.id}">Далі: ${esc(nextPart.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>` : '');
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="${L.id}">← Розділи</button><span class="ttl">${s.num}. ${md(s.title)}</span></div><div class="prog"><i id="pr"></i></div></div>
  <div class="wrap">
    <div class="hero">${fig(s.cover)}</div>
    <div class="sec-head"><div class="kick">Частина ${L.num} · розділ ${s.num}</div><h1>${md(s.title)}</h1><div class="sub">${md(s.sub)}</div></div>
    <div class="cards">${cards}</div>
    <div class="end">${end}<button class="btn ghost" data-go="${L.id}">До розділів</button></div>
  </div>`;
  wireGo();
  s.cards.forEach((c, i) => {
    if (c.type === 'carousel' && c.items.length > 1) {
      const car = document.getElementById('car' + i), dots = document.getElementById('dots' + i).children;
      car.addEventListener('scroll', () => {
        const kk = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 12));
        [...dots].forEach((d, j) => d.classList.toggle('on', j === kk));
      }, { passive: true });
    }
    if (c.type === 'map' && c.steps.length > 1) {
      const st = document.getElementById('st' + i), mp = document.getElementById('mp' + i);
      st.querySelectorAll('button').forEach(b => b.onclick = () => {
        st.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
        mp.innerHTML = fig({ key: c.steps[+b.dataset.i].key, cap: c.cap || '' });
      });
    }
  });
  const key = `seen_${L.id}-${s.id}`, seen = new Set(store.get(key, []));
  if (obs) obs.disconnect();
  obs = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { seen.add(+e.target.dataset.i); store.set(key, [...seen]); } });
  }, { threshold: 0.35 }) : null;
  if (obs) app.querySelectorAll('.card').forEach(el => obs.observe(el));
  window.scrollTo(0, 0);
}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;
}, { passive: false });
lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const pr = document.getElementById('pr'); if (!pr) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  pr.style.width = (max > 0 ? Math.min(100, 100 * scrollY / max) : 100) + '%';
}, { passive: true });
route();
</script>

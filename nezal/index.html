"], "ok": [2], "expl": "1 грудня 1991 р. разом із референдумом відбулися перші вибори Президента України. Закон про Збройні Сили — 6 грудня, Біловезька угода й розпад СРСР — грудень 1991 р., Конституція — 1996 р.", "src": "кахут a0143deb"}]}, "1-s2": {"n": 5, "pool": [{"id": "ke7a7aca2_05", "q": "Яким чином Конституція Криму 1992 року вплинула на статус цього регіону?", "sec": "s2", "g": "", "t": "single", "opts": ["Проголосила Республіку Крим державою, що будує відносини з Україною на договорах", "Затвердила входження Криму до складу Російської Федерації", "Встановила повний контроль центральної влади України над Кримом", "Повністю ліквідувала автономію Криму"], "ok": [0], "expl": "У травні 1992 р. Верховна Рада Криму ухвалила Акт про державну самостійність і Конституцію «Республіки Крим», за якою відносини з Україною мали будуватися на договорах. Верховна Рада України визнала Акт незаконним, а 1995 р. скасувала цю конституцію.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_21", "q": "Який результат мав референдум у Криму в січні 1991 року?", "sec": "s2", "g": "", "t": "single", "opts": ["Повне відокремлення Криму від України", "Підтримка відновлення Кримської АРСР — автономії півострова", "Включення Криму до складу Російської Федерації", "Створення кримськотатарської національної автономії"], "ok": [1], "expl": "20 січня 1991 р. більшість учасників референдуму в Кримській області підтримала відновлення Кримської АРСР — автономії всього півострова, а не національної автономії кримських татар.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_24", "q": "Яке явище у 1991–1994 роках в Україні найкраще характеризується поняттям «сепаратизм»?", "sec": "s2", "g": "", "t": "single", "opts": ["Боротьба республік Радянського Союзу за вихід зі складу СРСР", "Намагання окремих регіонів здобути автономію чи приєднатися до інших держав", "Мирний референдум щодо збереження оновленого Радянського Союзу", "Масові протести проти економічних реформ і падіння рівня життя"], "ok": [1], "expl": "Сепаратизм — прагнення частини держави відокремитися або приєднатися до іншої. У 1992 – 1994 рр. так діяли проросійські сили в Криму; 1994 р. «президентом Криму» обрали Ю. Мєшкова, який обіцяв зблизити півострів із Росією.", "src": "кахут e7a7aca2"}, {"id": "kf212f42b_42", "q": "Якому поняттю відповідає наведене визначення?", "sec": "s2", "g": "", "t": "single", "img": ["q_6c6ff9a874"], "opts": ["автономізм", "сепаратизм", "федералізація", "національно-визвольний рух"], "ok": [1], "expl": "Сепаратизм — рух за відокремлення частини території від держави. В Україні 1990-х рр. його прояви були в Криму.", "src": "кахут f212f42b"}, {"id": "k97f2ad7b_41", "q": "Рух за повернення кримсько-татарського народу на батьківщину очолив", "sec": "s2", "g": "", "t": "single", "opts": ["Мустафа Джемілєв", "Ісмаїл Гаспринський", "Номан Челебіджіхан", "Амет-Хан Султан"], "ok": [0], "expl": "Мустафа Джемілєв, колишній радянський політв’язень, очолив національний рух кримських татар, а 1991 р. — Меджліс.", "src": "кахут 97f2ad7b"}]}, "1-s3": {"n": 10, "pool": [{"id": "calt_05", "q": "Яка основна мета реформи, про яку йдеться в наведеному документі?\n\nПрочитайте уривок з документа: \"...запровадити в обіг.... національну валюту України гривню та її соту частину – копійку. ... Припинити з ...... функціонування українського карбованця як засобу платежу на території України.\"", "sec": "s3", "g": "m1-hryvnia-goal", "t": "single", "opts": ["Необхідність вступу до Світової організації торгівлі", "Виконання вимог Міжнародного валютного фонду", "Збільшення грошової маси для подолання дефіциту", "Впровадження стабільної грошової одиниці"], "ok": [3], "expl": "Купоно-карбованець за кілька років знецінився в тисячі разів. Гривню запровадили 1996 р., коли інфляцію вже приборкали: потрібна була стабільна грошова одиниця, якій довіряли б люди.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 5"}, {"id": "calt_06", "q": "Оберіть хибне твердження", "sec": "s3", "g": "", "t": "single", "opts": ["гривна була основним платіжним засобом часів Київської Русі", "гривня була валютою під час окупації України в роки Другої світової війни", "гривню як національну валюту запроваджено за президентства Леоніда Кучми", "гривня була національною валютою УНР часів Центральної Ради"], "ok": [1], "expl": "Гривня — грошова одиниця Русі, УНР 1918 р. і незалежної України (з 1996 р.). У роки нацистської окупації в Райхскомісаріаті «Україна» ходили окупаційні карбованці, а не гривні.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 6"}, {"id": "calt_07", "q": "За якого Президента України національною валютою були купоно-карбованці?", "sec": "s3", "g": "", "t": "single", "opts": ["Леоніда Кравчука", "Віктора Ющенка", "Віктора Януковича", "Петра Порошенка"], "ok": [0], "expl": "Купоно-карбованці запровадили в січні 1992 р., за Президента Л. Кравчука, і вони ходили до вересня 1996 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 7"}, {"id": "calt_11", "q": "Яке з наведених визначень найкраще пояснює термін \"олігархія\" в українському контексті?", "sec": "s3", "g": "", "t": "single", "opts": ["Форма правління, за якої вся влада в державі належить народові та його представникам.", "Система, за якої політику й економіку контролюють невеликі групи фінансово-промислових кланів.", "Рух за зближення й об’єднання всіх християнських конфесій і церков.", "Процес очищення органів влади від осіб, пов’язаних з попереднім режимом."], "ok": [1], "expl": "Олігархія — влада небагатьох. В Україні так називають систему, за якої найбагатші бізнесмени через своїх депутатів, телеканали й зв’язки впливають на політику.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 11"}, {"id": "calt_17", "q": "Яка подія була характерною для першого терміну президентства Леоніда Кучми?", "sec": "s3", "g": "", "t": "single", "opts": ["Вступ України до СОТ", "Початок \"Помаранчевої революції\"", "Підписання Угоди про асоціацію з ЄС", "Приватизація промисловості"], "ok": [3], "expl": "У першу каденцію Л. Кучми (1994 – 1999) відбулася масова приватизація великих підприємств. СОТ — 2008 р., Помаранчева революція — 2004 р., Угода про асоціацію з ЄС — 2014 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 17"}, {"id": "calt_26", "q": "Яким терміном називають стрімке знецінення купоно-карбованців у 1992 – 1994 рр.?", "sec": "s3", "g": "", "t": "single", "opts": ["лібералізацією цін", "гіперінфляцією", "девальвацією гривні", "грошовою реформою"], "ok": [1], "expl": "Гіперінфляція — надзвичайно швидке зростання цін: 1993 р. ціни зросли більш ніж у 100 разів. Гривня з’явилася лише 1996 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 26"}, {"id": "calt_32", "q": "Що стало основною причиною запровадження купоно-карбованців?", "sec": "s3", "g": "", "t": "single", "opts": ["Необхідність захисту внутрішнього споживчого ринку та виходу з рублевої зони.", "Прагнення швидко подолати гіперінфляцію, що охопила економіку.", "Бажання негайно стимулювати іноземні інвестиції в українську промисловість.", "Виконання вимог Міжнародного валютного фонду для отримання кредитів."], "ok": [0], "expl": "Купони запровадили, щоб захистити український ринок: без них товари масово скуповували за рублі й вивозили до інших республік. 1992 р. Україна вийшла з рублевої зони. Гіперінфляцію купони не зупинили, а посилили.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 32"}, {"id": "calt_51", "q": "Укажіть економічні процеси, характерні для України в 1990-х рр.", "sec": "s3", "g": "", "t": "three", "opts": ["Запровадження національної валюти – гривні", "Націоналізація приватних банків і підприємств", "Проведення ваучерної (масової) приватизації підприємств", "Розпаювання земель колгоспів та радгоспів між селянами", "Досягнення стабільного економічного зростання", "Повна відсутність інфляційних процесів у перші роки", "Повернення до п’ятирічних планів розвитку господарства"], "ok": [0, 2, 3], "expl": "У 1990-х рр. запровадили гривню (1996), провели масову приватизацію за сертифікатами, поділили землі колгоспів на паї. Стабільного зростання не було до 2000 р., а інфляція сягала тисяч відсотків.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 51"}, {"id": "g1y0YA8_45", "q": "Прочитайте уривок статті з “Економічної газети” (1992) і позначте явище, про яке йде мова: “За мінімальну заробітну плату можна купити лише 7 кг м’яса, або 3 кг сиру, або 70 кг картоплі, тоді як півроку тому її було достатньо, щоб купити 18 кг м’яса, або 23 кг сиру, або 255 кг картоплі”.", "sec": "s3", "g": "", "t": "single", "opts": ["грошова емісія", "грошова інфляція", "лібералізація цін", "бюджетний дефіцит"], "ok": [1], "expl": "За пів року на ту саму зарплату можна було купити у 2,5 – 8 разів менше продуктів: гроші знецінювалися — це інфляція. Лібералізація цін (січень 1992 р.) — рішення уряду, а інфляція — його наслідок.", "src": "гугл-форма 1y0YA8P7:45"}, {"id": "m1fQRLr_33", "q": "Перехід економіки України на ринкові рейки призвів до гіперінфляції, яка була приборкана у період президентства", "sec": "s3", "g": "m1-015", "t": "single", "opts": ["Леоніда Кравчука", "Леоніда Кучми", "Віктора Ющенка", "Віктора Януковича"], "ok": [1], "expl": "Гіперінфляцію 1993 – 1994 рр. вдалося приборкати 1995 – 1996 рр., за Президента Л. Кучми, після чого запровадили гривню.", "src": "гугл-форма 1fQRLrgn:33"}, {"id": "ke7a7aca2_07", "q": "Що було однією з причин негативного впливу на економічний стан України у перші роки незалежності?", "sec": "s3", "g": "", "t": "single", "opts": ["Залежність від імпорту енергоресурсів", "Високий рівень розвитку аграрного сектора", "Низька кваліфікація кадрів у промисловості", "Відсутність науково-дослідного потенціалу"], "ok": [0], "expl": "Україна купувала більшість нафти й газу в Росії. Коли ціни на них зросли до світових, підприємства не могли розрахуватися, а економіка поринула в кризу.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_11", "q": "Що поглиблювало економічну кризу в Україні в перші роки незалежності?", "sec": "s3", "g": "", "t": "single", "opts": ["Зменшення попиту на українську продукцію на внутрішньому ринку", "Відсутність чіткої програми економічних реформ", "Надто швидка приватизація великих заводів", "Збільшення кількості приватних підприємств"], "ok": [1], "expl": "У перші роки незалежності уряди не мали послідовної програми реформ: ціни звільнили, а підприємства лишалися державними й неефективними. Масова приватизація почалася лише 1995 р.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_13", "q": "Який з аспектів був позитивним для економіки України на початку незалежності?", "sec": "s3", "g": "", "t": "single", "opts": ["Надмірна залежність від важкої промисловості", "Значний науковий потенціал та кваліфікована робоча сила", "Високий рівень енергозалежності", "Прямі іноземні інвестиції у значній кількості"], "ok": [1], "expl": "Україна мала освічених робітників та інженерів, наукові інститути й конструкторські бюро. Залежність від енергоносіїв і важка промисловість, навпаки, були слабкими місцями.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_16", "q": "Яке завдання мало бути розв'язано у процесі реформування економіки України в перші роки незалежності?", "sec": "s3", "g": "", "t": "single", "opts": ["Ліквідація державного контролю над банківською системою", "Розробка стратегії переходу до ринкової економіки", "Створення нової системи колгоспів та радгоспів в сільському господарстві", "Зменшення залежності від продукції легкої та середньої промисловості"], "ok": [1], "expl": "Головне завдання реформ — перейти від планової економіки до ринкової: звільнити ціни, приватизувати підприємства, створити власну фінансову систему.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_18", "q": "Яка економічна реформа була запропонована прем’єр-міністром Леонідом Кучмою у 1992 році?", "sec": "s3", "g": "", "t": "single", "opts": ["Лібералізація цін на всі товари", "Широка приватизація середньої та важкої промисловості", "Перехід до централізованого планування економіки", "Заборона зовнішніх економічних зв’язків з Росією"], "ok": [1], "expl": "Леонід Кучма, прем’єр-міністр у 1992 – 1993 рр., пропонував швидше приватизувати великі заводи й обмежити дотації збитковим підприємствам. Президент Кравчук і Рада цих пропозицій не підтримали, і у вересні 1993 р. він пішов у відставку.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_20", "q": "Яка проблема супроводжувала перші спроби приватизації в Україні?", "sec": "s3", "g": "", "t": "single", "opts": ["Недостатня зацікавленість інвесторів у купівлі об’єктів", "Передача державних підприємств у приватну власність за заниженими цінами", "Невиконання законів про економічну реформу", "Заборона приватизації об'єктів торгівлі та дрібних підприємств"], "ok": [1], "expl": "Через приватизаційні сертифікати й закриті конкурси підприємства часто діставалися наближеним до влади за безцінь — так з’явилися перші великі статки.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_25", "q": "Яке визначення найкраще характеризує економіку України на початку 1990-х років?", "sec": "s3", "g": "", "t": "single", "opts": ["Повністю інтегрована в ринкову економіку Європи", "Деформована, із сильним ухилом у важку промисловість", "Орієнтована на аграрний сектор із високим експортним потенціалом", "Вільна від будь-якого впливу СРСР"], "ok": [1], "expl": "Економіка УРСР була частиною радянської: переважали важка промисловість і військові заводи, а виробництво товарів для людей відставало.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_26", "q": "Оберіть правильне твердження щодо фінансового становища України у 1991 – 1994 рр.", "sec": "s3", "g": "", "t": "single", "opts": ["Високий рівень іноземних інвестицій та стабільна валюта", "Слабке фінансове законодавство та нестабільна перехідна валюта", "Надмірна залежність від іноземної допомоги та стабільна грошова система", "Повна відмова від радянської банківської системи"], "ok": [1], "expl": "Купоно-карбованець був тимчасовою валютою й знецінювався, закони про фінанси лише складалися, іноземні інвестиції майже не надходили.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_28", "q": "Які проблеми гальмували розвиток економіки України у 1991 – 1994 рр.?", "sec": "s3", "g": "", "t": "three", "opts": ["приплив значних іноземних інвестицій", "залежність від імпорту енергоносіїв", "нестача кваліфікованих робітників і науковців", "переважання важкої та військової промисловості", "надлишок власних нафти й природного газу", "інфляція та знецінення купоно-карбованця", "надто швидка приватизація всіх великих заводів"], "ok": [1, 3, 5], "expl": "Економіку гальмували залежність від чужих енергоносіїв, переважання важкої й військової промисловості та інфляція. Кадрів і науковців Україна мала досить, а приватизація почалася лише з 1995 р.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_29", "q": "Що спричинило різке загострення економічної кризи в Україні у 1993 р.?", "sec": "s3", "g": "", "t": "three", "opts": ["послідовна програма ринкових реформ", "гіперінфляція й знецінення купонів", "швидке зростання малого бізнесу", "зростання тіньової економіки", "запровадження гривні", "вивезення капіталів за кордон", "обмеження видатків"], "ok": [1, 3, 5], "expl": "1993 р. ціни зросли більш ніж у 100 разів: купони стрімко знецінювалися, гроші виводили за кордон, поширювалася тіньова економіка. Гривню запровадили лише 1996 р.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_30", "q": "Що було характерним для сільського господарства України в першій половині 1990-х рр.?", "sec": "s3", "g": "", "t": "three", "opts": ["збереження колгоспів за державних дотацій", "ліквідація всіх колгоспів і радгоспів", "повільне становлення фермерських господарств", "щедра державна підтримка фермерів", "вільний продаж земель сільськогосподарського призначення", "спад виробництва зерна, м’яса й молока", "стрімке зростання врожайності й поголів’я худоби"], "ok": [0, 2, 5], "expl": "Колгоспи й радгоспи зберігалися до 1999 – 2000 рр. і жили з державних дотацій, фермерів було небагато, виробництво продуктів падало. Вільного продажу сільськогосподарської землі не було.", "src": "кахут e7a7aca2"}, {"id": "kde6744cb_06", "q": "Завдяки чому в 1995 році владі України вдалося зупинити гіперінфляцію?", "sec": "s3", "g": "", "t": "single", "opts": ["вливанню в економіку коштів міжнародних кредитів", "запровадженню нової стійкої національної валюти", "початку виходу з кризи й економічному зростанню", "жорсткому обмеженню державних видатків (монетаризм)"], "ok": [3], "expl": "Гіперінфляцію зупинили 1995 р. жорсткою фінансовою політикою: обмежили друк грошей і державні видатки. Гривню запровадили пізніше — 1996 р., а зростання почалося 2000 р.", "src": "кахут de6744cb"}, {"id": "kde6744cb_07", "q": "Що було характерним для приватизації в Україні в другій половині 1990-х – на початку 2000-х рр.?", "sec": "s3", "g": "", "t": "three", "opts": ["видача населенню приватизаційних майнових сертифікатів", "прозорі й відкриті приватизаційні аукціони", "приватизація лише дрібних підприємств і сфери послуг", "широкомасштабна приватизація великих промислових підприємств", "повернення державі незаконно приватизованих заводів", "паювання земель сільськогосподарського призначення", "продаж підприємств виключно іноземним інвесторам"], "ok": [0, 3, 5], "expl": "Наприкінці 1990-х рр. продавали великі заводи, громадяни отримували майнові сертифікати, а землі колгоспів поділили на паї. Конкурси часто були закритими, а повернення заводів державі почалося лише 2005 р.", "src": "кахут de6744cb"}, {"id": "kde6744cb_08", "q": "Наведений на фотографії зразок української національної валюти введено в обіг у", "sec": "s3", "g": "m1-hryvnia-date", "t": "single", "img": ["q_2ed075c34c"], "opts": ["грудні 1991 року", "березні 1994 року", "червні 1996 року", "вересні 1996 року"], "ok": [3], "expl": "Гривню ввели в обіг 2 – 16 вересня 1996 р.: купоно-карбованці обмінювали за курсом 100 000 до 1.", "src": "кахут de6744cb"}, {"id": "kde6744cb_09", "q": "Вкажіть основну мету керівництва України щодо запровадження нової національної валюти - гривні", "sec": "s3", "g": "m1-hryvnia-goal", "t": "single", "opts": ["повернення довіри населення до національної валюти", "реалізація вимог міжнародних кредитних організацій", "створення нової валюти як запоруки успішного економічного зростання", "бажання подолати гіперінфляцію шляхом запровадження нової грошової одиниці"], "ok": [0], "expl": "Гривню запровадили, коли інфляцію вже приборкали, — щоб люди повірили в національну валюту й заощаджували в ній, а не в доларах.", "src": "кахут de6744cb"}, {"id": "kde6744cb_15", "q": "Встановіть хронологічну послідовність подій", "sec": "s3", "g": "", "t": "seq", "opts": ["прийняття Декларації про державний суверенітет України", "прийняття закону \"Про економічну самостійність\" УРСР", "запровадження перехідної валюти - купоно-карбованця", "запровадження національної валюти - гривні"], "expl": "Декларація про суверенітет — липень 1990 р.; закон «Про економічну самостійність УРСР» — серпень 1990 р.; купоно-карбованці — січень 1992 р.; гривня — вересень 1996 р.", "src": "кахут de6744cb"}, {"id": "kf483c43b_06", "q": "«Тіньова» економіка — це сфера економічної активності, спрямованої на", "sec": "s3", "g": "", "t": "single", "opts": ["отримання доходів від забороненої діяльності, ухилення від сплати податків", "перерозподіл національного доходу в інтересах окремих класів", "законодавче закріплення звільнення підприємців від сплати податків", "заохочення суб'єктів господарювання до розвитку виробництва"], "ok": [0], "expl": "Тіньова економіка — діяльність, яку приховують від держави: заборонений бізнес, неоплачені податки, зарплати «в конвертах».", "src": "кахут f483c43b"}, {"id": "kf483c43b_07", "q": "У яких уривках з історичних джерел охарактеризовано окремі аспекти соціально-економічного розвитку України в 1990-х рр.?", "sec": "s3", "g": "", "t": "single", "img": ["q_35a2b2d9a0"], "opts": ["Охарактеризовано в обох уривках.", "Тільки в першому.", "Тільки в другому.", "Не охарактеризовано в жодному з уривків."], "ok": [2], "expl": "Перший уривок — про антиалкогольну кампанію 1985 р. (перебудова), другий — про тіньову економіку й вивезення капіталу в 1990-х рр.", "src": "кахут f483c43b"}, {"id": "kf483c43b_31", "q": "Що з наведеного НЕ було характерною рисою економічного життя України в першій половині 1990-х рр.?", "sec": "s3", "g": "", "t": "single", "opts": ["Україна стала лідером серед держав світу за дефіцитом державного бюджету", "запроваджено лібералізацію цін на більшість товарів", "запроваджено перехідну національну валюту - купоно-карбованці", "приватизовано більшість підприємств, створено промислово-фінансові групи"], "ok": [3], "expl": "Більшість великих підприємств приватизували лише в другій половині 1990-х рр., тоді ж склалися фінансово-промислові групи. На початку 1990-х рр. ходили купоно-карбованці, а дефіцит бюджету був величезним.", "src": "кахут f483c43b"}, {"id": "kf483c43b_37", "q": "Яку з грошових одиниць, наведених на фотографії, було запроваджено в Україні з вересня 1996 року?", "sec": "s3", "g": "m1-hryvnia-date", "t": "single", "img": ["q_68d6916644"], "opts": ["А", "Б", "В", "Г"], "ok": [3], "expl": "Гривню (Г — банкнота в 1 гривню) запровадили у вересні 1996 р. А і Б — гроші доби Української революції 1918 р. (100 гривень УНР і 1000 карбованців), В — купоно-карбованці, які ходили в 1992 – 1996 рр.", "src": "кахут f483c43b"}, {"id": "kf483c43b_40", "q": "Якому поняттю відповідає наведене визначення?", "sec": "s3", "g": "m1-021", "t": "single", "img": ["q_74abcf5a02"], "opts": ["корупція", "тіньова економіка", "ринкова економіка", "планова економіка"], "ok": [1], "expl": "Тіньова економіка — діяльність, прихована від держави й податків: незареєстрований бізнес, зарплати «в конвертах», контрабанда.", "src": "кахут f483c43b"}, {"id": "kf483c43b_41", "q": "Наведене поняття вперше з'явилось в Україні за часів президенства", "sec": "s3", "g": "m1-oligarch", "t": "single", "img": ["q_979207f0b3"], "opts": ["Л.Кравчука", "Л.Кучми", "В.Ющенка", "В.Януковича"], "ok": [1], "expl": "Олігархи — власники великих фінансово-промислових груп, що впливають на політику. Вони з’явилися в Україні в другій половині 1990-х рр., за Президента Л. Кучми, під час великої приватизації.", "src": "кахут f483c43b"}, {"id": "kf212f42b_20", "q": "Якому поняттю відповідає наведене визначення?", "sec": "s3", "g": "", "t": "single", "img": ["q_f365b93e03"], "opts": ["хабарництво", "корупція", "бюрократія", "волюнтаризм"], "ok": [1], "expl": "Корупція — використання посади для власної вигоди: хабарі, «відкати», допомога «своїм». Хабарництво — лише один її вияв.", "src": "кахут f212f42b"}, {"id": "kf212f42b_24", "q": "Для характеристики якого періоду новітньої історії України програма НМТ передбачає поняття «корупція»?", "sec": "s3", "g": "", "t": "single", "opts": ["відлиги", "застою", "перебудови", "незалежності"], "ok": [3], "expl": "Поняття «корупція», «олігарх», «тіньова економіка» програма НМТ подає в темі «Становлення України як незалежної держави».", "src": "кахут f212f42b"}, {"id": "kf212f42b_26", "q": "Наведене зображення можна використати як ілюстрацію поняття", "sec": "s3", "g": "m1-021", "t": "single", "img": ["q_82406b90da"], "opts": ["ринкова економіка", "приватизація", "планова економіка", "тіньова економіка"], "ok": [3], "expl": "На схемі — складники тіньової економіки: зарплати «в конвертах», виведення грошей в офшори, хабарі, незаконні послуги. Усе це приховують від держави, щоб не платити податків.", "src": "кахут f212f42b"}, {"id": "kf212f42b_27", "q": "Якому поняттю відповідає наведене визначення?", "sec": "s3", "g": "m1-oligarch", "t": "single", "img": ["q_3bc8c23876"], "opts": ["Корупціонер", "Бюрократ", "Олігарх", "Президент України"], "ok": [2], "expl": "Олігарх — великий власник, який використовує багатство для впливу на владу: має своїх депутатів, телеканали, добивається вигідних рішень.", "src": "кахут f212f42b"}, {"id": "ka0143deb_86", "q": "Наведена грошова одиниця є актуальною в Україні з", "sec": "s3", "g": "m1-hryvnia-date", "t": "single", "img": ["q_f831128952"], "opts": ["червня 1996 року", "вересня 1996 року", "лютого 1992 року", "літа 1994 року"], "ok": [1], "expl": "Гривня — національна валюта України з вересня 1996 р. До того ходили купоно-карбованці (з 1992 р.).", "src": "кахут a0143deb"}, {"id": "k7c738be8_30", "q": "Яка з наведених подій відбулась в Україні у вересні 1996 року?", "sec": "s3", "g": "m1-hryvnia-date", "t": "single", "opts": ["початок масових акцій \"Україна без Кучми\"", "вихід з рубльової зони, запровадження купоно-карбованців", "запровадження нової національної валюти", "початок економічної кризи, перше різке падіння курсу гривні"], "ok": [2], "expl": "У вересні 1996 р. запровадили гривню. Купоно-карбованці — 1992 р., «Україна без Кучми» — грудень 2000 р., різке падіння гривні — 1998 р.", "src": "кахут 7c738be8"}]}, "1-s4": {"n": 10, "pool": [{"id": "calt_16", "q": "Коли було ухвалено Конституцію незалежної України?", "sec": "s4", "g": "m1-const-date", "t": "single", "opts": ["24 серпня 1991 р.", "1 грудня 1991 р.", "28 червня 1996 р.", "8 грудня 2004 р."], "ok": [2], "expl": "Конституцію України Верховна Рада ухвалила 28 червня 1996 р. 8 грудня 2004 р. до неї внесли зміни (політична реформа).", "src": "Classtime «Незалежна Україна - альтернативний тест», № 16"}, {"id": "calt_49", "q": "Аналізуючи таблицю результатів виборів до Верховної Ради, можна зробити висновок про те, що", "sec": "s4", "g": "", "t": "single", "img": ["q_8d89c3fbec"], "opts": ["Вибори проходили виключно за пропорційною виборчою системою", "Найбільшу підтримку виборців мали партії лівого спрямування", "Найбільшу підтримку виборців мали партії правого спрямування", "Ці вибори відбувались у 2002 році"], "ok": [1], "expl": "У таблиці найбільше мандатів мають комуністи (85); разом із Селянською (18) і Соціалістичною (14) партіями ліві значно випереджають Рух (20) та інші праві партії. Це вибори 1994 р., які відбувалися за мажоритарною системою.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 49"}, {"id": "g1y0YA8_46", "q": "Позначте, яка подія відбулася в той самий рік, коли Верховна Рада прийняла нову Конституцію України:", "sec": "s4", "g": "", "t": "single", "opts": ["надання автономії Криму у складі України", "приєднання України до Договору про нерозповсюдження ядерної зброї", "проведення грошової реформи та впровадження в обіг гривні", "вступ України до Ради Європи"], "ok": [2], "expl": "Конституцію ухвалили в червні, а гривню запровадили у вересні 1996 р. До Договору про нерозповсюдження ядерної зброї Україна приєдналася 1994 р., до Ради Європи вступила 1995 р., а автономію Криму відновлено 1991 р.", "src": "гугл-форма 1y0YA8P7:46"}, {"id": "ke7a7aca2_10", "q": "Вкажіть основну проблему роботи органів виконавчої влади України на початку незалежності", "sec": "s4", "g": "", "t": "single", "opts": ["Конфлікт повноважень між Президентом і Верховною Радою", "Відсутність законодавства щодо центральних органів виконавчої влади", "Низька компетенція працівників Кабінету Міністрів", "Відсутність міжнародного визнання виконавчої влади"], "ok": [0], "expl": "До Конституції 1996 р. повноваження Президента й Верховної Ради чітко не розмежували, тож вони постійно сперечалися про те, хто керує урядом.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_15", "q": "Що стало основною причиною протистояння між Президентом і Верховною Радою у 1991–1994 роках?", "sec": "s4", "g": "", "t": "single", "opts": ["Недостатня підтримка Президента серед населення", "Відсутність чітко визначених повноважень Президента", "Потреба у реформуванні судової системи", "Залежність Верховної Ради від зовнішніх впливів"], "ok": [1], "expl": "Стара Конституція УРСР із поправками не визначала, хто керує урядом і як ухвалювати рішення. Тому Президент і Рада весь час сперечалися за владу. Конфлікт завершила Конституція 1996 р.", "src": "кахут e7a7aca2"}, {"id": "ke7a7aca2_22", утатів). Після прийняття Конституції України Президент скасував свій указ про проведення всеукраїнського референдуму", "На запрошення Януковича Патріарх Кирило, Московський і всієї Русі провів державну молитвенну службу в Києво-Печерській Лаврі. Також були присутні на інавгурації Верховний представник з питань спільної зовнішньої та безпекової політики Кетрін Ештон, радник США з національної безпеки Джонс Джеймс Логан і спікер Державної Думи Російської Федерації Борис Гризлов.", "У результаті переговорів лідери \"четвірки\" прийняли декларацію на підтримку комплексу заходів з виконання угод. Комплекс заходів з виконання угод передбачає \"негайне та всеосяжне припинення вогню в окремих районах Донецької та Луганської областей України і його суворе виконання\" з 00:00 15 лютого за київським часом, відведення важких озброєнь обома сторонами на рівні відстані з метою створення зони безпеки…"], "expl": "Вступ до Ради Європи — листопад 1995 р.; Конституція — червень 1996 р.; інавгурація В. Януковича — лютий 2010 р.; декларація лідерів «четвірки» (Мінськ-2) — лютий 2015 р.", "src": "Classtime «Незалежна Україна - повний тест», № 60"}, {"id": "cfull_62", "q": "Встановіть хронологічну послідовність виборів Президента України", "sec": "s9", "g": "", "t": "seq", "img": ["q_690ee65cd5"], "opts": ["Б", "Г", "А", "В"], "expl": "Кравчук — Чорновіл, 1991 р. (Б); Кучма — Кравчук, 1994 р. (Г); Янукович — Тимошенко, 2010 р. (А); вибори 2014 р. без окупованого Криму (В).", "src": "Classtime «Незалежна Україна - повний тест», № 62"}, {"id": "cfull_63", "q": "Встановіть хронологічну послідовність подій", "sec": "s9", "g": "", "t": "seq", "img": ["q_3f4726ce19"], "opts": ["В", "А", "Б", "Г"], "expl": "Гривня — 1996 р. (В); Помаранчева революція — 2004 р. (А); сутички на вулиці Грушевського під час Революції Гідності — січень 2014 р. (Б); лідери «нормандської четвірки» на переговорах у Мінську — лютий 2015 р. (Г).", "src": "Classtime «Незалежна Україна - повний тест», № 63"}, {"id": "calt_  2010 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 57"}, {"id": "calt_58", "q": "Встановіть відповідність між Президентами України та ключовими подіями/рисами їхнього правління:", "sec": "s9", "g": "", "t": "match", "opts": ["Запровадження гривні, ухвалення Конституції, політика \"багатовекторності\"", "Помаранчева революція, початок переговорів про Угоду про асоціацію з ЄС, \"газові війни\" з РФ.", "Проголошення незалежності, становлення інститутів, гіперінфляція, початок ядерного роззброєння", "АТО/ООС, отримання Томосу про автокефалію ПЦУ, безвізовий режим з країнами ЄС.", "Повномасштабне вторгнення Росії, активна міжнародна діяльність для отримання допомоги."], "ok": [2, 0, 1, 3], "left": ["Леонід Кравчук", "Леонід Кучма", "Віктор Ющенко", "Петро Порошенко"], "expl": "Кравчук — незалежність, гіперінфляція, початок ядерного роззброєння; Кучма — гривня, Конституція, «багатовекторність»; Ющенко — Помаранчева революція, «газові війни»; Порошенко — АТО, томос, безвіз.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 58"}, {"id": "calt_59", "q": "Встановіть відповідність між поняттями та їх визначеннями або прикладами:", "sec": "s9", "g": "", "t": "match", "opts": ["Процес очищення влади, заборона обіймати посади особам, пов'язаним з попереднім режимом.", "Економічна діяльність суб'єктів господарювання, що приховується від державного обліку", "Особа, яка контролює значні фінансові та медійні ресурси і суттєво впливає на політику", "Використання посадовою особою свого службового становища з метою особистого збагачення", "Рух за об'єднання всіх православних церков в єдину помісну церкву."], "ok": [2, 3, 0, 1], "left": ["Олігарх", "Корупція", "Люстрація", "Тіньова економіка"], "expl": "Олігарх — власник великих статків і медіа, що впливає на політику; корупція — використання посади для збагачення; люстрація — очищення влади; тіньова економіка — діяльність, прихована від держави.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 59"}, {"id": "calt_64", "q": "Встановіть хронологічну послідовність подій", "sec": "s9", "g": "", "t": "seq", "opts": ["\"...Верховна Рада України ухвалила Закон України «Про Голодомор 1932—1933 років в Україні», в якому Голодомор визнано геноцидом українського народу.\"", "\"Подовжити перебування Чорноморського флоту Російської Федерації на території України та передати їй в аренду військово-морську базу Севастополь терміном до 2042 року\"", "«Цей Закон засуджує комуністичний та націонал-соціалістичний (нацистський) тоталітарні режими в Україні як злочинні, забороняє публічне заперечення, зокрема через засоби масової інформації, злочинного характеру цих тоталітарних режимів, публічне використання та пропаганду їхньої символіки...»", "\"Встановити, що на період дії правового режиму воєнного стану можуть обмежуватися конституційні права і свободи людини і громадянина, передбачені статтями 30 – 34, 38, 39, 41 – 44, 53 Конституції України.\""], "expl": "Закон про Голодомор — 2006 р.; Харківські угоди (флот до 2042 р.) — 2010 р.; закон про засудження тоталітарних режимів (декомунізація) — 2015 р.; воєнний стан в Україні вперше запровадили в листопаді 2018 р., удруге — 24 лютого 2022 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 64"}, {"id": "calt_65", "q": "Встановіть хронологічну послідовність подій", "sec": "s9", "g": "", "t": "seq", "opts": ["\"Встановити без дозволу уповноваженого представника органу внутрішніх справ для проведення зборів, мітингів, вуличних походів чи демонстрацій намети, конструкції чи споруди, що використовуються як сцена... – тягнуть за собою накладення штрафу... або адміністративний арешт на строк до п’ятнадцяти діб.\"", "\"Ухвалити Рішення Ради національної безпеки і оборони України від 13 квітня 2014 року «Про невідкладні заходи щодо подолання терористичної загрози і збереження територіальної цілісності України та призначити початок проведення Антитерористичної операції».\"", "\"...цим підписаним Патріаршим і Синодальним Томосом ми визнаємо і проголошуємо встановлену, в межах території України, Автокефальну Церкву нашою духовною донькою і закликаємо всі світові Православні Церкви визнавати її як сестру...\"", "\"У зв’язку з військовою агресією Російської Федерації проти України... постановляю: 1. Ввести в Україні воєнний стан із 05 години.....строком на 30 діб.\""], "expl": "«Диктаторські закони» (заборона наметів) — 16 січня 2014 р.; рішення РНБО про початок АТО — 13 квітня 2014 р.; томос — 2019 р.; воєнний стан через повномасштабне вторгнення — 24 лютого 2022 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 65"}, {"id": "calt_66", "q": "Встановіть хронологічну послідовність подій", "sec": "s9", "g": "", "t": "seq", "opts": ["«Відповідно до Конституції Української РСР державною мовою Української Радянської Соціалістичної Республіки є українська мова. Українська РСР забезпечує всебічний розвиток і функціонування української мови в усіх сферах суспільного життя.»", "«Ми, Республіка Білорусь, Російська Федерація (РСФСР), Україна як держави – засновники Союзу РСР, що підписали Союзний договір 1922 року, далі іменовані Високими Договірними Сторонами, констатуємо, що Союз РСР як суб'єкт міжнародного права і геополітична реальність припиняє своє існування.»", "«Україна стала членом Світової організації торгівлі»", "\"Метою очищення влади (люстрації) є недопущення до участі в управлінні державними справами осіб, які своїми рішеннями, діями чи бездіяльністю здійснювали заходи (та/або сприяли їх здійсненню), спрямовані на узурпацію влади Президентом України Віктором Януковичем...\""], "expl": "Закон про мови в УРСР — 1989 р.; Біловезька угода — 1991 р.; вступ до СОТ — 2008 р.; закон про очищення влади (люстрацію) — 2014 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 66"}, {"id": "calt_67", "q": "Встановіть хронологічну послідовність подій", "sec": "s9", "g": "", "t": "seq", "opts": ["«Я, Кравчук Леонід Макарович, волею народу України обраний Президентом України, заступаючи на цей високий пост, урочисто присягаю на вірність Україні. Зобов'язуюсь усіма своїми справами боронити суверенітет і незалежність України, дбати про благо Вітчизни і добробут українського народу, обстоювати права і свободи громадян, додержуватися Конституції України і законів України, виконувати покладені на мене високі обов'язки, вірно служити українському народові.»", "«Стаття 1. Служба безпеки України – державний правоохоронний орган спеціального призначення, який забезпечує державну безпеку України. Стаття 2. Завданнями Служби безпеки України є: захист державного суверенітету, конституційного ладу, територіальної цілісності, економічного, науково-технічного і оборонного потенціалу України, законних інтересів держави та прав громадян від розвідувально-підривної діяльності іноземних спеціальних служб, посягань з боку окремих організацій, груп та осіб...»", "«Кабінет Міністрів України постановляє: 1. Погодитися з пропозицією Національного банку та Ради з фінансової стабільності щодо участі держави в особі Міністерства фінансів у виведенні неплатоспроможного Публічного акціонерного товариства Комерційний банк «ПриватБанк» з ринку за участі держави.»", "«Цей Закон регулює функціонування і застосування української мови як державної в усіх сферах суспільного життя на всій території України... Статус української мови як єдиної державної мови в Україні зумовлений державотворчим самовизначенням української нації.»"], "expl": "Присяга Л. Кравчука — грудень 1991 р.; закон про СБУ — 1992 р.; націоналізація ПриватБанку — грудень 2016 р.; закон про державну мову — 2019 р.", "src": "Classtime «Незалежна Україна - альтернативний тест», № 67"}, {"id": "m17SHCq_28", "q": "Установіть послідовність подій", "sec": "s9", "g": "", "t": "seq", "opts": ["вступ України до Ради Європи", "революція Гідності, повалення авторитарного режиму В. Януковича", "анексія Криму Російською Федерацією", "підписання Україною Угоди про асоціацію з Європейським Союзом (Є овній Раді України. 2. Утворити Міністерство оборони України. 3. Урядові України приступити до створення Збройних Сил України, республіканської гвардії та підрозділу охорони Верховної Ради, Кабінету Міністрів і Національного банку України. Верховна Рада України підпорядковувала собі всі військові формування на території республіки, оскільки", "sec": "", "g": "", "opts": ["була на той час єдиним легітимним вищим органом влади.", "існувала небезпека встановлення військової диктатури.", "існувала необхідність переозброєння військових формувань.", "утвердилася парламентська форма правління."]}, {"id": "z12119", "n": 5, "t": "single", "q": "ПОСТАНОВА ВЕРХОВНОЇ РАДИ УКРАЇНИ Про військові формування на Україні Верховна Рада України постановляє: 1. Підпорядкувати всі військові формування, дислоковані на території республіки, Верховній Раді України. 2. Утворити Міністерство оборони України. 3. Урядові України приступити до створення Збройних Сил України, республіканської гвардії та підрозділу охорони Верховної Ради, Кабінету Міністрів і Національного банку України. Поява цитованого документа зумовлена", "sec": "", "g": "", "opts": ["втіленням політики ядерного роззброєння України.", "ухваленням Конституції України.", "реалізацією курсу на вступ України до НАТО.", "проголошенням незалежності України."]}, {"id": "cfull_05", "n": 6, "t": "single", "q": "Прочитайте фрагмент історичного документа та виконайте завдання\n\n«Із метою сприяння проведенню радикальних ринкових реформ в Україні, забезпечення економіки стабільною національною валютою та відповідно до статей 99 і 102 Конституції України постановляю: 1. Провести… в Україні грошову реформу — уведення в обіг визначеної Конституцією та іншим законодавством України національної валюти України, якою є гривня та її сота частина — копійка. 3. Українські карбованці підлягають обміну на гривні (банкноти та розмінну монету) за курсом 100 000 карбованців на 1 гривню».\nЩо зумовило підписання цитованого документа?", "sec": "", "g": "", "opts": ["необхідність насичення ринку держави додатковою грошовою масою для подолання дефіциту споживчих товарів", "початок проведення в Україні ринкових реформ, початок приватизації", "гіперінфляція та економічна криза, які планувалось подолати шляхом введення в обіг нової національної валюти", "необхідність запровадження в Україні стійкої національної валюти, що користуватиметься довірою населення"]}, {"id": "cfull_06", "n": 7, "t": "single", "q": "Прочитайте фрагмент історичного документа та виконайте завдання\n\n«Із метою сприяння проведенню радикальних ринкових реформ в Україні, забезпечення економіки стабільною національною валютою та відповідно до статей 99 і 102 Конституції України постановляю: 1. Провести… в Україні грошову реформу — уведення в обіг визначеної Конституцією та іншим законодавством України національної валюти України, якою є гривня та її сота частина — копійка. 3. Українські карбованці підлягають обміну на гривні (банкноти та розмінну монету) за курсом 100 000 карбованців на 1 гривню».\nГрошову реформу, про яку йдеться в документі, проведено в", "sec": "", "g": "", "opts": ["червні 1996 року", "травні 1995 року", "вересні 1996 року", "грудні 1991 року"]}, {"id": "cfull_40", "n": 8, "t": "single", "q": "Широкомасштабна приватизація державного сектору української економіки відбулась у період президентства:", "sec": "", "g": "", "opts": ["Л. Кучми", "Л. Кравчука", "В. Ющенка", "В. Януковича"]}, {"id": "cfull_44", "n": 9, "t": "single", "q": "Наведена карикатура ілюструє поняття", "sec": "", "g": "", "img": ["q_abb747f8e6"], "opts": ["люстрація", "тіньова економіка", "ринкові відносини", "корупція"]}, {"id": "g1aZJ6Q_15", "n": 10, "t": "single", "q": "На фото зображено купюри максимального номіналу в 1991 р. і 1995 р. Яке з наведених понять доречно використати для опису процесів, що відбувалися в економіці України в ці роки?", "sec": "", "g": "", "img": ["q_e936664735"], "opts": ["інфляція", "дефіцит", "емісія", "гіперінфляція"]}, {"id": "g1aZJ6Q_21", "n": 11, "t": "single", "q": "Із якою метою в Україні в 1996 р. проведено грошову реформу?", "sec": "", "g": "", "opts": ["урівняти доходи всіх верств суспільства", "повернути довіру населення до національної грошової одиниці", "подолати корупцію у вищих ешелонах влади", "виконати умову міжнародних фінансових організацій"]}, {"id": "g1aZJ6Q_34", "n": 12, "t": "single", "q": "Що давало підстави Президенту України Л. Кучмі в своїй доповіді від 11 жовтня 1994 р. зробити такий висновок про становище в країні? …Суспільство вже давно практично вичерпало ресурс виживання… Вичерпав себе ресурс суспільних очікувань, втрачено віру населення в завтрашній день, у можливість переломити ситуацію на краще. За цих умов альтернативи курсу на суттєве прискорення економічних реформ не існує…", "sec": "", "g": "", "opts": ["глибока економічна й перманентна політична кризи", "прагнення перемогти на дострокових президентських виборах", "могутній страйковий рух, який паралізував усі сфери життя суспільства", "глибока економічна криза"]}, {"id": "z10117", "n": 13, "t": "single", "q": "Цінний папір, зображений на фото, в Україні випускався з метою", "sec": "", "g": "", "img": ["q_217f9f357a"], "opts": ["завершення монополізації господарства.", "прискорення роздержавлення економіки.", "формування вільних економічних зон.", "націоналізації великих підприємств."]}, {"id": "z1021", "n": 14, "t": "single", "q": "«Тіньова» економіка, яка в другій половині 1990-х рр., за оцінками фахівців, «...гальмувала не тільки ринкові реформи, а й вкладання іноземними інвесторами капіталів в Україну», — це сфера вияву економічної активності, спрямованої на", "sec": "", "g": "", "opts": ["отримання доходів від здійснення заборонених видів діяльності або на ухилення від державного контролю та сплати податків.", "перерозподіл національного доходу в інтересах окремих класів, соціальних (найбідніших або найбагатших) верств населення.", "законодавче закріплення повного або часткового звільнення певного виду підприємницької діяльності від сплати податків.", "заохочення суб'єктів господарювання до розвитку виробництва, підвищення його ефективності та економічного зростання."]}, {"id": "z12556", "n": 15, "t": "single", "q": "Що було характерним для соціально-економічного розвитку України наприкінці 1990-х – початку 2000-х рр.?", "sec": "", "g": "", "opts": ["збереження більшості промислових підприємств у державній власності", "утвердження системи олігархічних фінансово-промислових груп", "перетворення малого бізнесу в основного виробника валового внутрішнього продукту", "відновлення командно-адміністративної системи управління економікою"]}, {"id": "z7912", "n": 16, "t": "single", "q": "На якій особливості становлення підприємництва в незалежній Україні акцентує увагу карикатура?", "sec": "", "g": "", "img": ["q_48a4f4481e"], "opts": ["надмірних фізичних навантаженнях на бізнесменів", "значних бюрократичних обмеженнях організації та ведення бізнесу", "стрімкому збільшенні прибутковості бізнесу", "недостатній фаховій підготовці підприємців для ведення бізнесу"]}, {"id": "cfull_17", "n": 17, "t": "single", "q": "Для першої каденції президента Леоніда Кучми було характерним", "sec": "", "g": "", "opts": ["проведення виборів до Верховної Ради України за змішаною (мажоритарною та пропорційною) виборчою системою", "законодавче затвердження концепції будівництва збройних сил та оборони країни", "перетворення України з президентсько-парламентської на парламентсько-президентську республіку", "дострокове припинення повноважень Президента України і Верховної Ради внаслідок політичної кризи"]}, {"id": "cvl4_40", "n": 18, "t": "single", "q": "Коли відбулася подія, про значення якої йдеться в уривку?\n\n«Документ, який визначає найважливіші засади організації суспільства, напрям його подальшого розвитку; є уособленням верховенства права, сутності й спрямованості політики України; є основою правової системи України, нормативно-правовим актом найвищої юридичної сили, основним джерелом національної системи права».", "sec": "", "g": "", "opts": ["1996 р.", "2004 р.", "1990 р.", "1991 р."]}, {"id": "g1ALEMl_20", "n": 19, "t": "single", "q": "Які основні результати виборів до Верховної Ради України в 1994 р.?", "sec": "", "g": "", "opts": ["парламентську більшість сформовано з комуністів - т. зв. група 239", "найбільшого успіху домоглися ліві партії (КПУ, СПУ, СелПУ), які контролювали понад третину мандатів", "найбільшою фракцією парламенту став блок «Наша Україна», отримавши 111 з 447 місць", "в парламенті було утворено коаліцію у складі Партії Регіонів, КПУ та СПУ, головою парламенту було обрано Олександра Мороза"]}, {"id": "g1aZJ6Q_29", "n": 20, "t": "single", "q": "Характерними ознаками розвитку багатопартійності в Україні в 1990-х - 2000-х рр. є: 1. Участь широких верств суспільства в партійній роботі. 2. Географічна зорієнтованість партій. 3. Декларативний характер партійних програмних документів.", "sec": "", "g": "", "opts": ["1, 2, 3", "1, 2", "1, 3", "2, 3"]}, {"id": "z803", "n": 21, "t": "single", "q": "Який фактор відіграв вирішальну роль у проведенні в Україні позачергових президентських виборів 1994 р.?", "sec": "", "g": "", "opts": ["ухвалення нової Конституції незалежної України", "добровільна відставка глави держави", "загострення політичної та економічної кризи", "оголошення імпічменту діючому президенту"]}, {"id": "cfull_51", "n": 22, "t": "single", "q": "Яке твердження правильно описує вибори до Верховної Ради України, результати яких наведено в таблиці?", "sec": "", "g": "", "img": ["q_623165c3bd"], "opts": ["Основна більшість голосів була віддана за політичні сили національно-ліберального напрямку", "Більшість голосів Комуністична партія України отримала в одномандатних виборчих округах", "Вибори відбувались виключно за пропорційною виборчою системою", "Партія, очолювана В’ячеславом Чорноволом, посіла друге місце за кількістю депутатських мандатів"]}, {"id": "g1aZJ6Q_25", "n": 23, "t": "single", "q": "На діаграмі відображено результати другого туру президентських виборів в Україні", "sec": "", "g": "", "img": ["q_e63df61e65"], "opts": ["2004 р.", "1994 р.", "1999 р.", "1991 р."]}, {"id": "g1aZJ6Q_35", "n": 24, "t": "single", "q": "Основою економічного зростання в Україні у 2000 – 2004 рр. були успіхи в галузі", "sec": "", "g": "", "opts": ["легкої промисловості", "чорної металургії", "сільського господарства", "машинобудування"]}, {"id": "cfull_21", "n": 25, "t": "single", "q": "Про причини якої події йдеться в твердженнях?\n\nКриза режиму президента Л. Кучми, його прагнення зберегти владу; масова фальсифікація владою результатів виборів 2004 р. на користь кандидата в президенти, прем’єр-міністра В. Януковича; втручання Росії у внутрішні справи України; боротьба фінансово-промислових груп і регіональних еліт за владу.", "sec": "", "g": "", "opts": ["«Революція на граніті»", "«Помаранчева революція»", "«Революція гідності»", "«Оксамитова революція»"]}, {"id": "cfull_50", "n": 26, "t": "single", "q": "Проаналізуйте уривок з історичного джерела. В якому році відбулась подія, про яку йдеться в ньому?\n\n«Результати національного екзит-полу (проводився консорціумом: КМІС, Центр Разумкова, Фонд «Демократичні ініціативи» методом анонімного анкетування): Віктор Ющенко набрав 54 % голосів, Віктор Янукович — 43 % голосів. 24 листопада ЦВК оголосила результати виборів: Віктор Янукович — 49,46 % голосів, Віктор Ющенко — 46,61 % голосів».", "sec": "", "g": "", "opts": ["1999 р.", "2014 р.", "2004 р.", "2010 р."]}, {"id": "cvl2_42", "n": 27, "t": "single", "q": "Коли відбулися події, про які йдеться в уривку з виступу Голови Верховної Ради України В. Литвина?\n\n«Сьогодні можна скільки завгодно говорити про політичний характер рішень Верховної Ради і Верховного Суду України щодо визнання недійсними результатів другого туру голосування і недовіру Центральній виборчій комісії. Але при цьому не слід забувати, що саме вони відкрили єдиний за даних обставин — правовий і легітимний — вихід, розрядили гранично напружену політичну атмосферу і стали тим проблиском надії, що дав змогу відступити від безодні громадянського конфлікту, зберегти державну незалежність і територіальну цілісність України…»", "sec": "", "g": "", "opts": ["1998 р.", "2006 р.", "2004 р.", "2010 р."]}, {"id": "z1112", "n": 28, "t": "single", "q": "Про яке явище йдеться в цитованому документі? «Найбільшим негативом 1990-х років було «вимивання» активної, продуктивної частини населення — людей молодого та середнього віку — за межі держави. За офіційними даними, Україна втратила близько 3,5 мільйона осіб, третина з яких — кваліфіковані фахівці».", "sec": "", "g": "", "opts": ["соціальну диференціацію", "депопуляцію", "дефіцит робочої сили", "трудову міграцію"]}, {"id": "cfull_49", "n": 29, "t": "single", "q": "Наведений документ описує співпрацю України з\n\n«Україна підтверджує свою рішучість продовжувати військову реформу, зміцнювати демократичний та цивільний контроль над збройними силами та підвищувати їхню оперативно-технічну сумісність зі збройними силами організації та країн-партнерів. Організація підтверджує свою підтримку зусиллям України у цих галузях».", "sec": "", "g": "", "opts": ["Організацією Об’єднаних Націй (ООН)", "Організацією з безпеки та співробітництва в Європі (ОБСЄ)", "Організацією Північноатлантичного договору (НАТО)", "Європейським союзом (ЄС)"]}, {"id": "g1ALEMl_27", "n": 30, "t": "single", "q": "«Російська Федерація, Сполучене Королівство Великої Британії та Північної Ірландії і Сполучені Штати Америки підтверджують Україні їх зобов’язання згідно з принципами Заключного акта Наради з безпеки та співробітництва в Європі (НБСЄ) поважати незалежність і суверенітет та існуючі кордони України.., [а також] підтверджують зобов’язання утримуватися від загрози силою чи її використання проти територіальної цілісності чи політичної незалежності України, що ніяка їхня зброя ніколи не буде використовуватися проти України, крім цілей самооборони або будь-яким іншим чином згідно зі С осійська Федерація, Сполучене Королівство Великої Британії та Північної Ірландії і Сполучені Штати Америки підтверджують Україні їх зобов’язання згідно з принципами Заключного акта Наради з безпеки та співробітництва в Європі (НБСЄ) поважати незалежність і суверенітет та існуючі кордони України.., [а також] підтверджують зобов’язання утримуватися від загрози силою чи її використання проти територіальної цілісності чи політичної незалежності України, що ніяка їхня зброя ніколи не буде використовуватися проти України, крім цілей самооборони або будь-яким іншим чином згідно зі Статутом Організації Об’єднаних Націй…» У якому році одна з країн-підписантів порушила умови, зазначені в цитованому документі?", "sec": "", "g": "", "opts": ["1998 р.", "2014 р.", "1996 р.", "2003 р."]}, {"id": "z22248", "n": 4, "t": "single", "q": "Що є свідченням співпраці незалежної України з Організацією Об’єднаних Націй?", "sec": "", "g": "", "opts": ["участь українських підрозділів у миротворчих операціях", "приєднання до програми «Партнерство заради миру»", "розміщення на своїй території іноземних військових баз", "проголошення без’ядерного статусу держави"]}, {"id": "calt_20", "n": 5, "t": "single", "q": "За результатами парламентських виборів 2006 року було сформовано \"Антикризову коаліцію\". Які політичні сили до неї увійшли?", "sec": "", "g": "", "opts": ["БЮТ, КПУ, Партія регіонів", "\"Наша Україна\", Партія регіонів, Блок Литвина", "Партія регіонів, СПУ, КПУ", "\"Наша Україна\", БЮТ, СПУ"]}, {"id": "calt_14", "n": 6, "t": "single", "q": "Повернення до положень Конституції 2004 року (парламентсько-президентської моделі) відбулося внаслідок:", "sec": "", "g": "", "opts": ["Підписання Харківських угод", "Помаранчевої революції", "Революції Гідності", "\"Касетного скандалу\""]}, {"id": "cfull_04", "n": 7, "t": "single", "q": "Що стало приводом до подій, наведених на фотографії?", "sec": "", "g": "", "img": ["q_35102bfb7d"], "opts": ["масові фальсифікації результатів президентських виборів", "зрив підписання Угоди про асоціацію з Європейським Союзом", "різке посилення корупції, стагнація української економіки", "загострення відносин з Російською Федерацією"]}, {"id": "z10118", "n": 8, "t": "single", "q": "Прочитайте уривок з історичного джерела та виконайте завдання. «Це був протест не лише проти показової спроби принизити й упокорити українське суспільство – демонстративно не підписувати Угоду про асоціацію з ЄС. Це був вибух протесту проти дикого цинізму й аморальності тогочасної влади в Україні». В уривку йдеться про", "sec": "", "g": "", "opts": ["«Революцію гідності».", "«культурну революцію».", "«Революцію на граніті».", "«Помаранчеву революцію»."]}, {"id": "z17448", "n": 9, "t": "single", "q": "Зображення українських поетів у стрит-арт інтерпретації на будівлях Києва з’явилися з метою", "sec": "", "g": "", "img": ["q_75cf79647b"], "opts": ["вшанування незламності, мужності та героїзму захисників Донецького аеропорту.", "опротестування впровадження офіційної двомовності в деяких областях країни.", "пробудження в суспільстві почуття патріотизму в умовах російської агресії.", "підтримання сили духу протестувальників на барикадах часів Революції Гідності."]}, {"id": "cfull_18", "n": 10, "t": "single", "q": "Яка подія відбулася в лютому – березні 2014 року?", "sec": "", "g": "", "opts": ["позачергові вибори Президента України", "початок антитерористичної операції на Донбасі", "підписання в Мінську угоди про припинення вогню на Донбасі", "проведення псевдореферендуму щодо статусу Криму, анексія Криму Росією"]}, {"id": "cfull_37", "n": 11, "t": "single", "q": "Яке з наведених зображень можна використати для ілюстрації поняття \"анексія\"?", "sec": "", "g": "", "img": ["q_0b169458a6"], "opts": ["А", "Б", "В", "Г"]}, {"id": "cfull_08", "n": 12, "t": "single", "q": "Наведену карикатуру можна використати як ілюстрацію подій, що відбулися в", "sec": "", "g": "", "img": ["q_3cb82fe252"], "opts": ["лютому 2015 року", "березні 2014 року", "лютому 2014 року", "січні 2010 року"]}, {"id": "cfull_15", "n": 13, "t": "single", "q": "У якому рядку всі поняття стосуються збройної агресії Росії проти України в 2014-2015 рр.?", "sec": "", "g": "", "opts": ["Дебальцівський плацдарм, люстрація, інфляція, гуманітарні конвої", "Іловайський котел, кіборги, Мінські домовленості, тимчасово окупована територія", "волонтерський рух, нормандська четвірка, корупція, тітушки", "добровольчі батальйони, сепаратизм, поліконфесійність, анексія"]}, {"id": "cfull_24", "n": 14, "t": "single", "q": "Лідери яких країн, окрім України, зустрілися 11 лютого 2015 р. в Мінську (формат «нормандської четвірки»), щоб обговорити план урегулювання конфлікту на сході України?\n\n1. Німеччина\n2. США\n3. Канада\n4. Франція\n5. Велика Британія\n6. Росія", "sec": "", "g": "", "opts": ["1,5,6", "1,3,4", "1,4,6", "2,3,5"]}, {"id": "g1ALEMl_22", "n": 15, "t": "single", "q": "Коли було зроблено наведене фото?", "sec": "", "g": "", "img": ["q_0733c38e8e"], "opts": ["квітень 2014 р.", "травень 2018 р.", "лютий 2014 р.", "листопад 2014 р."]}, {"id": "z13805", "n": 16, "t": "single", "q": "Появу зображеного плаката було зумовлено", "sec": "", "g": "", "img": ["q_2af4d511d8"], "opts": ["створенням Народного руху України за перебудову.", "заснуванням Збройних Сил незалежної України.", "розгортанням російської агресії проти України.", "проголошенням незалежності України в 1991 р."]}, {"id": "calt_23", "n": 17, "t": "single", "q": "Визначте характерні риси політичної ситуації в Україні у 2014 році після Революції Гідності\n\n1. Початок зовнішньої агресії з боку Російської Федерації.\n2. Повне подолання корупції у владних структурах.\n3. Проведення позачергових президентських та парламентських виборів.\n4. Стабілізація економічної ситуації та зростання ВВП.\n5. Повернення до Конституції 1996 року.\n6. Активізація громадянського суспільства та волонтерського руху.", "sec": "", "g": "", "opts": ["1, 2, 4", "1, 3, 6", "2, 4, 5", "3, 5, 6"]}, {"id": "cfull_23", "n": 18, "t": "single", "q": "Що є характерним для політичної ситуації в Україні після перемоги Революції гідності?\n\n1. Формування нової парламентської більшості, зміна вищого керівництва держави.\n2. Зміна конституційної моделі (повернення до Конституції зразка 2010 р.).\n3. Складна економічна ситуація.\n4. Припинення зовнішньої агресії з боку Російської Федерації.\n5. Суспільні очікування радикальних суспільно-політичних та соціально-економічних змін.\n6. Втрата Україною самостійності в зовнішній політиці", "sec": "", "g": "", "opts": ["1,3,5", "2,3,5", "1,3,4", "1,5,6"]}, {"id": "cfull_46", "n": 19, "t": "single", "q": "Який з наведених уривків ілюструє поняття «люстрація»?", "sec": "", "g": "", "opts": ["За оцінкою керівника групи \"Повернись живим\" Віталія Дейнеги, за 2 роки війни (станом на квітень 2016) було зібрано на потреби військових більше мільярда гривень (у тому числі великими організаціями - близько 300 млн).", "На території України офіційно діє понад 22 тисячі релігійних організацій (громад) майже 80-ти напрямків та течій, 97,5 відсотки всіх релігійних організацій - християнського спрямування.", "Головний редактор \"Цензор. Нет\" Ю. Бутусов повідомив, що новий і старий термінал донецького аеропорту та башта укріплення повністю знищені. Того ж дня новий термінал покинули останні українські захисники, таким чином оборона цієї ділянки фронту тривала 242 дні", "Закон вводить заборону на зайняття певних посад протягом 10 років особами, які в період з 25 лютого 2010 року по 22 лютого 2014 року терміном більше 1 року займали певні державні посади. Аналогічна заборона діятиме щодо осіб, які займали зазначені у законі посади менше 1 року"]}, {"id": "cfull_01", "n": 20, "t": "single", "q": "Оберіть цитату з промови, виголошеної особою, що зображена на фото", "sec": "", "g": "", "img": ["q_77eb296a3f"], "opts": ["\"Український народе, як я сказав, будь собою! Не підлещуйся, другим у ласки не заходь, але сам власною працею здобудь своє майбутнє! Будь свідомим того, що ти є українським народом! Якщо ця ідея ввійде у Вас, у духовенство, в мирян та в духовні семінарії - тоді, мої Дорогі, ми витримаємо це все лихо довкола нас. А велика-велика надія - на тих найменших, які підтримують нашу надію, що по нашій смерті ви таки не пропадете. Прийде твоя хвилина, коли ти визволишся і займеш належне місце «в колі народів».", "\"Ми живемо в час, коли в Україні є майже півтора мільйона біженців. Ми вживаємо сьогодні слово \"біженці\", а в сорокові роки минулого століття, під час Другої світової війни, було поширене слово \"скитальці\". Цей термін вказував на людей, що мусили не тільки бігти, тікати, а й скитатися на чужині. Подумаймо, яким є сьогодні життя сучасних скитальців, що мусили з різних причин покинути свої домівки, набуте майно... \"", "“Любі брати і сестри! Коли ви бачите, що відроджується наша Українська Церква, лунає в храмах і в школах наша рідна мова, починається наша рідна освіта, то знайте, що це відроджується душа нашого народу, та душа народня, якої нічим не можна зупинити”.", "\"Під національним кутом зору всі мої дії завжди були логічними і християнськими… Кохаючи Польщу і Поляків, від дитинства більше кохаю Русь і Русинів… В ім'я тої засади, котра Польщу, Русь і Литву вважала від віків за три братні народи. Чому є чимось гіршим кохати русинів більше, ніж поляків, аніж кохати поляків більше як русинів? Чому ж одне є доброчинством, а друге має бути проступком?\""]}, {"id": "cfull_11", "n": 21, "t": "single", "q": "Яке з наведених визначень може слугувати ілюстрацією поняття екуменізм?", "sec": "", "g": "", "opts": ["форма благодійної діяльності, що ґрунтується на принципах законності, гуманності, рівності, добровільності, безоплатності та неприбутковості. Вона не включає діяльність, що здійснюється на основі сімейних, дружніх чи сусідських відносин", "наявність багатьох релігійних течій на території однієї країни, що створюється внаслідок паралельної діяльності як найбільш поширених релігій, так і їхніх відгалужень", "ідеологія та рух за співпрацю та взаєморозуміння між християнами різних конфесій, виступає за посилення впливу релігії й вироблення загальнохристиянської соціальної програми", "статус, що дозволяє вільно перетинати міждержавні кордони без попереднього звернення до посольства для отримання дозволу"]}, {"id": "cfull_13", "n": 22, "t": "single", "q": "У які роки вибори Президента України відбулися за один тур?", "sec": "", "g": "", "opts": ["1991 р., 2014 р.", "1999 р., 2014 р.", "1991 р., 2019 р.", "1994 р., 2010 р."]}, {"id": "cfull_42", "n": 23, "t": "single", "q": "З наведених історичних документів оберіть той, що стосується виборів Президента України, результати яких зображено на картосхемі.", "sec": "", "g": "", "img": ["q_43d901acc8"], "opts": ["У ці дні країна опинилася на межі повномасштабної політичної та економічної кризи, і лише завдяки обережним та конструктивним діям основних політичних гравців, а також міжнародних посередників, змогла швидко вийти з критичного стану. У результаті повторного другого туру голосування, визнаного експертами набагато демократичнішим, ніж два попередніх, нарешті було обрано Президента України", "Ключовими обіцянками було закінчити війну, безвізовий режим з ЄС, підняти зарплати військовим та реформувати армію, провести децентралізацію, реформу міліції, дострокові вибори до Верховної Ради, створити суспільне телебачення, а також продати бізнес, крім \"5 каналу\".", "На запрошення Януковича Патріарх Кирило, Московський і всієї Русі провів державну молитвенну службу в Києво-Печерській Лаврі. Також були присутні на інавгурації Верховний представник з питань спільної зовнішньої та безпекової політики Кетрін Ештон, радник США з національної безпеки Джонс Джеймс Логан і спікер Державної Думи Російської Федерації Борис Гризлов.", "Ці президентські вибори стали першими, що продемонстрували розподіл країни на \"Схід\" і \"Захід\". Можна помітити, що за одного з кандидатів проголосували західні регіони, які згодом будуть підтримувати політиків поукраїнської орієнтації; в східних регіонах більшу підтримку і надалі здобуватимуть проросійські сили."]}, {"id": "g1aZJ6Q_57", "n": 24, "t": "match", "q": "Встановіть відповідність між датами та подіями", "sec": "", "g": "", "left": ["6 грудня 1991 року", "28 червня 1996 року", "1995 рік", "вересень 1996 року"], "opts": ["Після 12 днів Помаранчевої революції напруга, нарешті, спала, політики приступили до обговорення змін у виборчому законі, зміщення центру влади від президента до парламенту й уряду, перегляду складу Центральної виборчої комісії.", "О 9 год 18 хв після 24 годин безперервної роботи Верховна Рада України прийняла і ввела в дію Конституцію України (\"за\" проголосували 315 народних депутатів). Після прийняття Конституції України Президент скасував свій указ про проведення всеукраїнського референдуму", "Відбулась урочиста церемонія вступу України до Ради Європи, в якій взяла участь делегація України на чолі з Прем'єр-міністром України. Того ж числа Генеральний секретар РЄ Д.Таршис та член Європейської Комісії Ганс ван ден Брук підписали Спільну програму Комісії європейських співтовариств та Ради Європи щодо реформування правової системи, місцевого самоврядування та удосконалення системи правозастосування в Україні.", "Верховна Рада ухвалила закони «Про оборону України» і «Про Збройні Сили України», поклавши початок власній армії.", "Заміна виконувалася з розрахунку 100 000 карбованців на 1 гривню. У перший день на нову валюту було переведено ціни, тарифи, банківські вклади, соціальні виплати тощо."]}, {"id": "cfull_69", "n": 25, "t": "match", "q": "Установіть відповідність між стислими характеристиками основних релігійних конфесій сучасної України та їхніми назвами.", "sec": "", "g": "", "left": ["Автокефальна православна церква на території України, Константинопольська церква вважає її єдиною канонічною правонаступницею Київської митрополії. Керується...Патріаршим та Синодальним Томосом, Статутом і рішеннями власних статутних органів.", "Церква, що переб     const ev = c.events.map(([v, l]) => `<div class="evl" style="left:${X(v)}%"></div><div class="evt" style="left:${X(v)}%">${esc(String(l).replace(/ ?до н\.е\.| ?р\.$/g, ''))}</div>`).join('');
    const ax = `<div class="ax">${c.prog.map(([a, b]) => `<div class="pr" style="left:${X(a)}%;width:${X(b) - X(a)}%"></div>`).join('')}
      ${c.ticks.map(([v, l], i) => `<div class="tk${i % 2 ? ' lo' : ''}" style="left:${X(v)}%">${esc(l)}</div>`).join('')}</div>`;
    const pr = c.prog.length ? `<div class="legend"><span class="sw"></span>${c.prog.map(p => esc(p[2])).join(' · ')} — дата з програми НМТ</div>` : '';
    return `<div class="chips"><span class="chip">НМТ: дата</span></div>${h2(c.title)}<div class="gp">${ev}${rows}${ax}</div>${pr}
      ${c.note ? `<div class="muted"><p>${md(c.note)}</p></div>` : ''}`;
  },
  chrono() {
    const m = ['2000 р.<br>до н.е.', '1000 р.<br>до н.е.', '1 р. н.е.<br><b class="a2">Різдво Христове</b>', '1000 р.<br>н.е.', '2000 р.<br>н.е.'];
    return `<h2>Шкала часу</h2><div class="ends"><span>← давніше</span><span>ближче до нас →</span></div>

      <p class="cap">До н.е. рахунок іде назад: 2000 р. до н.е. давніше, ніж 1000 р. до н.е.</p>`;

  periods(c) {

    c.blocks.forEach(b => { if (b.k === 'sep') groups.push([]); else groups[groups.length - 1].push(b); });
    const g = groups.filter(x => x.length);
    const rb = b => b.k === 'h' ? `<h3 class="${b.light ? 'l' : ''}">${md(b.text)}</h3>` : b.k === 'date' ? `<span class="pill">${md(b.text)}</span>`

let obs = null;

      car.addEventListener('scroll', () => {

  }, { threshold: 0.35 }) : null;

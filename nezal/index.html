 закінчити війну.", "У першому турі **31 березня 2019 р.** Зеленський набрав **30,2 %** голосів, Петро Порошенко — 15,9 %. У другому турі **21 квітня** за Зеленського проголосували **73,2 %** виборців; він переміг у всіх областях, крім Львівської.", "**20 травня 2019 р.** Зеленський склав присягу й того ж дня оголосив про розпуск Верховної Ради."], "imgs": [{"key": "s137_image140", "cap": "Результати другого туру виборів Президента 2019 р. за областями"}, {"key": "zelenskyi", "cap": "Володимир Зеленський, 2025 р. Фото: Офіс Президента України / Wikimedia Commons, CC BY 4.0"}]}, {"type": "text", "kicker": "2019 – 2022", "title": "Вибори Президента 2019 р.: перший тур", "badges": ["поза програмою"], "paras": ["У бюлетені було **39** кандидатів — найбільше за всю історію президентських виборів.", "У першому турі за Зеленського проголосували **5,7 млн** виборців, за Порошенка — **3,0 млн**.", "У **другому турі 21 квітня** Зеленський отримав **13,5 млн** голосів, тобто на 7,8 млн більше, ніж у першому, а Порошенко — **4,5 млн**, на 1,5 млн більше. Отже, більшість виборців, які в першому турі голосували за інших кандидатів, у другому підтримали Зеленського."], "imgs": [{"key": "chart_2_79", "cap": "Дані ЦВК. Решта кандидатів набрали менше ніж по 2 %."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_2019", "label": "Крок 1"}]}, {"type": "generic", "title": "Вибори до Верховної Ради 2019 р.", "badges": ["поза програмою"], "blocks": [{"k": "img", "key": "nu_seats2019", "cap": ""}, {"k": "muted", "paras": ["Склад Ради після виборів 2019 р. Власна діаграма за даними ЦВК (укр. Вікіпедія)."]}, {"k": "sep"}, {"k": "p", "paras": ["На позачергових виборах **21 липня 2019 р.** партія «**Слуга народу**» отримала **43,2 %** голосів за списками й перемогла в більшості округів. Вона здобула **254** місця з 450. Уперше за роки незалежності одна партія мала більшість у Раді — **монобільшість**.", "До Ради пройшли також «Опозиційна платформа – За життя», «Батьківщина», «Європейська солідарність» і нова партія «Голос». Більшість депутатів потрапили до Ради вперше.", "Головою Ради став **Дмитро Разумков**, прем’єр-міністром — **Олексій Гончарук** (29 серпня 2019 р.). Закони монобільшість ухвалювала дуже швидко; таку роботу Ради називали «турборежимом».", "**4 березня 2020 р.** Рада ухвалила відставку уряду Гончарука, і прем’єр-міністром став **Денис Шмигаль**."], "italic": false}]}, {"type": "table", "title": "Нові правила: що змінили закони 2019 – 2021 рр.", "rows": [["Закон", "Що змінилося", "Що це означає для громадян"], ["Зміни до Конституції щодо **недоторканності** депутатів (вересень 2019 р., діють з 2020 р.)", "Депутатів можна притягати до кримінальної відповідальності без згоди Ради.", "Народні депутати відповідають перед законом так само, як інші громадяни."], ["Закон про **імпічмент** (вересень 2019 р.)", "Докладно описано, як Рада може усунути Президента з посади.", "Для звинувачення потрібно 300 голосів депутатів, для усунення з посади — 338."], ["**Виборчий кодекс** (грудень 2019 р.)", "Депутатів Ради обирають лише за партійними списками, поділеними на регіональні частини.", "Виборець голосує за партію і може підтримати конкретного кандидата з її списку."], ["Закон про **всеукраїнський референдум** (січень 2021 р.)", "Визначено, як проводять референдум за ініціативою громадян.", "Для цього потрібно зібрати щонайменше 3 млн підписів."], ["Закон про **корінні народи** (липень 2021 р.)", "Корінними народами України визнано кримських татар, караїмів і кримчаків.", "Вони мають право на власні представницькі органи, розвиток своєї мови й освіту."], ["Закон про **олігархів** (вересень 2021 р.)", "Рада національної безпеки і оборони (РНБО) веде реєстр олігархів.", "Олігархам заборонено фінансувати партії й брати участь у великій приватизації."]]}, {"type": "text", "kicker": "2019 – 2022", "title": "Ринок землі і «Дія»", "badges": ["поза програмою"], "paras": ["**Ринок землі.** Від 2001 р. діяв **мораторій** — заборона продавати землі сільськогосподарського призначення. **31 березня 2020 р.** Рада ухвалила закон про ринок землі.", "З **1 липня 2021 р.** громадяни можуть купувати до 100 га землі, а з 2024 р. підприємства — до 10 тис. га. Іноземцям купувати землю заборонено, доки це не дозволить всеукраїнський референдум.", "**«Дія».** У 2019 р. уряд створив Міністерство цифрової трансформації. З лютого 2020 р. працюють застосунок і портал «**Дія**». У смартфоні можна зберігати цифровий паспорт і посвідчення водія, а довідку отримати чи бізнес зареєструвати без візиту до установи."], "imgs": [{"key": "s140_image145", "cap": "Перші місяці ринку землі: середня ціна гектара за областями, станом на листопад 2021 р. (інфографіка «Слово і Діло»)"}, {"key": "s141_image146", "cap": "Застосунок і портал «Дія»"}]}, {"type": "text", "kicker": "2019 – 2022", "title": "Пандемія COVID-19 і «Велике будівництво»", "badges": ["поза програмою"], "paras": ["**Пандемія.** Перший випадок COVID-19 в Україні виявили **3 березня 2020 р.** З 12 березня уряд закрив школи й університети, а згодом метро й більшість магазинів. Учні перейшли на дистанційне навчання.", "З травня 2020 р. діяв «адаптивний карантин»: обмеження залежали від того, скільки людей хворіло в області. Вакцинацію почали **24 лютого 2021 р.** У 2020 р. ВВП скоротився на 3,8 %.", "**«Велике будівництво».** З 2020 р. за цією президентською програмою ремонтували й будували дороги, мости, школи, лікарні, спортивні майданчики. Частину грошей уряд узяв із фонду боротьби з COVID-19; опозиція й частина експертів критикували це рішення."], "imgs": [{"key": "covid_cv", "cap": "Медик у захисному костюмі, Чернівці, 2020 р. Фото: Mstyslav Chernov / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "s142_image147", "cap": "Будівництво дороги за програмою «Велике будівництво»"}]}, {"type": "text", "kicker": "2019 – 2022", "title": "Смертність під час пандемії (2020 – 2022)", "badges": ["поза програмою"], "paras": ["Графік показує, скільки людей помирало щомісяця **від усіх причин** порівняно із середнім рівнем тих самих місяців 2015 – 2019 рр.", "Смертність різко зростала під час трьох хвиль пандемії: восени 2020 р., навесні 2021 р. і восени 2021 р. У **листопаді 2021 р.** померло **87,9 тис.** людей — майже вдвічі більше, ніж зазвичай у листопаді.", "За 2020 – 2021 рр. померло приблизно на **160 тис.** людей більше, ніж зазвичай. Це значно більше за кількість смертей, які офіційно пов’язали з COVID-19: частину хворих не обстежували, а люди з іншими хворобами не завжди вчасно отримували допомогу."], "imgs": [{"key": "chart_2_85", "cap": "Дані Держстату (World Mortality Dataset); за лютий 2022 р. даних немає."}]}, {"type": "cols", "title": "Донбас і Крим: пошуки миру (2019 – 2021)", "badges": ["поза програмою"], "intro": null, "blocks": [{"h": "Переговори й обміни", "paras": ["**7 вересня 2019 р.** Україна й Росія обмінялися полоненими «35 на 35». Додому повернулися 24 моряки, захоплені біля Керченської протоки, і режисер Олег Сенцов.", "Восени 2019 р. сторони відвели війська біля Золотого й Петрівського на Донбасі.", "**9 грудня 2019 р.** у Парижі вперше за три роки зустрілися лідери Франції, Німеччини, України й Росії («нормандська четвірка»). Вони домовилися про перемир’я й обмін полоненими, який відбувся 29 грудня."]}, {"h": "Чого не досягли", "paras": ["З **27 липня 2020 р.** діяло «посилене перемир’я». Обстрілів поменшало, але бої не припинилися.", "Росія вимагала, щоб Україна домовлялася з «ДНР» і «ЛНР» напряму й провела там вибори, ще не відновивши контролю над кордоном. Україна на це не погодилася.", "**23 серпня 2021 р.** у Києві 46 делегацій узяли участь у саміті **Кримської платформи**, яка домагається деокупації Криму. Тим часом Росія стягувала війська до кордонів України."]}]}, {"type": "text", "kicker": "2019 – 2022", "title": "Рішення, які спричинили суперечки", "badges": ["поза програмою"], "paras": ["**Конституційна криза.** **27 жовтня 2020 р.** Конституційний Суд визнав неконституційною частину антикорупційних законів, зокрема кримінальну відповідальність за неправдиві відомості в електронних деклараціях. Звернення до суду подали 47 депутатів, переважно з «Опозиційної платформи – За життя».", "Зеленський запропонував Раді припинити повноваження всіх суддів Конституційного Суду, але Рада цього не підтримала. Наприкінці 2020 р. Президент указом відсторонив голову суду Олександра Тупицького. Прихильники Президента вважали, що суд захищав корупціонерів, а критики — що Президент не має права усувати суддів.", "**Санкції проти телеканалів.** **2 лютого 2021 р.** РНБО запровадила санкції проти депутата Тараса Козака, близького до Віктора Медведчука, і його телеканалів «112 Україна», NewsOne і ZIK; канали припинили мовлення. Влада пояснювала, що канали поширювали російську пропаганду. Критики заявляли, що закривати телеканали має суд, а не РНБО."], "imgs": [{"key": "ksu", "cap": "Будинок Конституційного Суду України в Києві. Фото: Dezidor / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "2019 – 2022", "title": "24 лютого 2022 р.: повномасштабне вторгнення", "badges": ["поза програмою"], "paras": ["Восени 2021 р. Росія стягнула до кордонів України понад 100 тис. військових. **24 лютого 2022 р.** вона почала **повномасштабне вторгнення** — з півночі, сходу й півдня.", "Збройні Сили, територіальна оборона й волонтери відстояли Київ, Харків, Миколаїв. Навесні 2022 р. українські війська вигнали окупантів з Київщини, Чернігівщини, Сумщини; а восени звільнили Харківщину й Херсон.", "Мільйони українців стали біженцями й переселенцями. У червні 2022 р. Україна отримала статус **кандидата на вступ до ЄС**."], "imgs": [{"key": "warship_stamp", "cap": "Поштова марка «Русскій воєнний корабль, іди…!», квітень 2022 р. Її присвятили захисникам острова Зміїний, які 24 лютого 2022 р. відмовилися здатися російському крейсеру «Москва». Фото: Укрпошта, художник Борис Грох / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "2022 – 2026", "title": "Після 2022 р.: війна триває", "badges": ["поза програмою"], "paras": ["У **2023 р.** українські війська наступали на півдні, але прорвати оборону росіян не змогли. **6 червня 2023 р.** росіяни підірвали греблю **Каховської ГЕС**: вода затопила десятки сіл і частину Херсона.", "У серпні **2024 р.** Збройні Сили перейшли кордон і зайняли частину Курської області Росії. Найважчі бої точилися на Донеччині — за Бахмут, Авдіївку, Покровськ.", "Росія обстрілює ракетами й дронами українські міста та електростанції. Мільйони українців виїхали за кордон або переселилися в інші області.", "**25 червня 2024 р.** Україна почала **переговори про вступ до ЄС**. До листопада 2026 р. Європейський Союз відкрив чотири з шести розділів («кластерів») цих переговорів."], "imgs": [{"key": "kakhovka", "cap": "Каховська гребля до і після підриву 6 червня 2023 р., супутникові знімки. Фото: Pierre Markuse / Wikimedia Commons, CC BY 2.0"}]}]}, {"id": "s9", "num": "IX", "title": "Узагальнення", "sub": "Влада в 2005 – 2019 рр., поняття, що часто плутають на НМТ, стрічки часу", "cover": {"key": "redcross14", "cap": ""}, "cards": [{"type": "table", "title": "Хто керував державою (2005 – 2019)", "rows": [["Посада", "2005 – 2010", "2010 – 2014", "2014 – 2019"], ["Президент", "**Віктор Ющенко**", "**Віктор Янукович** (утік у лютому 2014 р.)", "Олександр Турчинов (в. о.), **Петро Порошенко** (з 7 червня 2014 р.)"], ["Голова Верховної Ради", "Володимир Литвин, Олександр Мороз, Арсеній Яценюк, Володимир Литвин", "Володимир Литвин, Володимир Рибак", "Олександр Турчинов, Володимир Гройсман, Андрій Парубій"], ["Прем’єр-міністр", "Юлія Тимошенко, Юрій Єхануров, Віктор Янукович, Юлія Тимошенко", "Микола Азаров", "Арсеній Яценюк, Володимир Гройсман"], ["Вибори до Ради", "2006, 2007 (пропорційна)", "2012 (змішана)", "2014 (змішана)"]]}, {"type": "table", "title": "Президенти: головні події і проблеми (2005 – 2022)", "rows": [["Президент", "Головні події", "Проблеми, що лишилися"], ["**Віктор Ющенко** (2005 – 2010)", "Вибори 2006 і 2007 рр. відбулися без масових фальсифікацій. Рада визнала Голодомор геноцидом (2006). Україна вступила до СОТ (2008).", "У «помаранчевій» коаліції стався розкол, уряди часто змінювалися. Двічі виникали газові конфлікти з Росією."], ["**Віктор Янукович** (2010 – 2014)", "Підготовлено текст Угоди про асоціацію з ЄС. Проведено чемпіонат Європи з футболу (2012).", "Президент зосередив владу у своїх руках, лідерів опозиції ув’язнено. Харківські угоди залишили флот Росії в Криму до 2042 р."], ["**Петро Порошенко** (2014 – 2019)", "Підписано Угоду про асоціацію, запроваджено безвізовий режим з ЄС. Зміцнено армію, проведено децентралізацію. ПЦУ отримала томос.", "Мінські домовленості не повернули ні миру, ні окупованих територій. Суди реформовано лише частково."], ["**Володимир Зеленський** (з 2019 р.; події до 24 лютого 2022 р.)", "Скасовано недоторканність депутатів, відкрито ринок землі, запрацювала «Дія», завершено створення громад. Створено Кримську платформу.", "Переговори з Росією не принесли миру. У 2020 р. сталася конституційна криза; суди реформовано лише частково."]]}, {"type": "table", "title": "Поняття теми (1)", "rows": [["Поняття", "Значення"], ["Євромайдан", "Протести, що почалися 21 листопада 2013 р. після рішення уряду зупинити підготовку до Угоди про асоціацію з ЄС."], ["Революція Гідності", "Масові протести листопада 2013 – лютого 2014 р. проти корупції, свавілля силовиків і авторитарної влади, на підтримку європейського вибору."], ["Небесна Сотня", "Загиблі учасники Революції Гідності."], ["Анексія", "Насильницьке приєднання державою території іншої держави."], ["Сепаратизм", "Прагнення відокремити частину території держави."], ["Антитерористична операція (АТО)", "Офіційна назва операції Збройних Сил, Національної гвардії та інших підрозділів проти російських і проросійських збройних формувань на Донбасі (2014 – 2018)."], ["Тимчасово окупована територія", "Землі України, які захопила й контролює Росія: Крим, Севастополь, частина Донецької й Луганської областей (з 2014 р.), інші райони — з 2022 р."]]}, {"type": "table", "title": "Поняття теми (2)", "rows": [["Поняття", "Значення"], ["Кіборг", "Так називали захисників Донецького аеропорту (2014 – 2015)."], ["Волонтерський рух", "Безоплатна добровільна допомога: збір коштів, спорядження для армії, допомога пораненим і переселенцям."], ["Громадянське суспільство", "Незалежні від держави об’єднання громадян, які захищають інтереси людей і контролюють владу."], ["Люстрація", "Заборона високопосадовцям поваленого режиму певний час працювати на державній службі."], ["Безвізовий режим", "Право громадян їздити до інших країн без попереднього оформлення візи; для українців у ЄС — з 11 червня 2017 р."], ["Екуменізм", "Рух за співпрацю й порозуміння між християнами різних церков."]]}, {"type": "cols", "title": "Що часто плутають", "badges": [], "intro": null, "blocks": [{"h": "Дати й події", "paras": ["• **СОТ** — 2008 р.; **Рада Європи** — 1995 р.", "• **Євромайдан** — з 21.11.2013; **Революція Гідності** — з 30.11 – 1.12.2013.", "• **Мінськ-1** — 5.09.2014; **Мінськ-2** — 12.02.2015.", "• **Угода про асоціацію** — 2014 р.; **безвіз** — 2017 р.", "• Порошенко: обраний 25.05, присяга 7.06.2014."]}, {"h": "Люди й поняття", "paras": ["• **Анексія** — приєднання чужої території; **окупація** — військовий контроль над нею.", "• **Кіборги** — захисники Донецького аеропорту.", "• **Екуменізм** — співпраця церков; **поліконфесійність** — у країні багато різних церков.", "• **Томос** отримала ПЦУ (2019), а не УГКЦ."]}]}, {"type": "tl_periods", "title": "Стрічка часу: влада в 2005 – 2019 рр.", "note": "Перша сіра смуга — уряд Ю. Єханурова; перша помаранчева — перший уряд Ю. Тимошенко (2005). Конституція: з 2006 р. — парламентсько-президентська модель, 2010 – 2014 рр. — президентсько-парламентська, з 2014 р. — знову парламентсько-президентська. Шкала часу пропорційна.", "x_from": 2005, "x_to": 2019.6, "ticks": [[2005, "2005"], [2007, "2007"], [2009, "2009"], [2011, "2011"], [2013, "2013"], [2015, "2 Кучма переміг чинного Президента Леоніда Кравчука.", "src": "ЗНО 2012 – 2 сесія (№ 48)"}, {"id": "z1119", "q": "Установіть відповідність між подіями та датами.", "sec": "s10", "g": "", "t": "match", "opts": ["26 квітня 1986 р.", "16 липня 1990 р.", "24 серпня 1991 р.", "1 грудня 1991 р.", "28 червня 1996 р."], "ok": [2, 1, 3, 4], "left": ["Прийняття Акта проголошення державної незалежності України.", "Схвалення Декларації про державний суверенітет України.", "Всеукраїнський референдум і вибори Президента України.", "Прийняття Конституції України."], "expl": "Декларація про суверенітет — 16 липня 1990 р.; Акт проголошення незалежності — 24 серпня 1991 р.; референдум і вибори Президента — 1 грудня 1991 р.; Конституція — 28 червня 1996 р. 26 квітня 1986 р. — аварія на ЧАЕС.", "src": "ЗНО 2010 – 1 сесія (№ 56)"}, {"id": "z1196", "q": "У яких уривках з історичних джерел охарактеризовано окремі аспекти соціально-економічного розвитку України в 90-х рр. XX ст.? «В Україні кількість торговельних точок, що реалізовували спиртні напої, зменшилася вдвоє. Понад мільйон осіб, винних у порушенні антиалкогольного законодавства, зазнали адміністративних стягнень. У Закарпатті та в Криму знищили виноградники, зокрема унікальних сортів. Поширилося самогоноваріння». «...За експертними оцінками у вітчизняному виробництві частка тіньового сектора фактично зрівнялась з часткою офіційною. Це явище логічно супроводжується зростанням масштабів нелегального вивозу капіталу».", "sec": "s3", "g": "", "t": "single", "opts": ["Охарактеризовано в обох уривках.", "Тільки в першому.", "Тільки в другому.", "Не охарактеризовано в жодному з уривків."], "ok": [2], "expl": "Перший уривок — про антиалкогольну кампанію 1985 р. (доба перебудови). Другий — про тіньову економіку й вивезення капіталу, що поширилися в Україні в 1990-х рр.", "src": "ЗНО 2010 – 2 сесія (№ 49)"}, {"id": "z1741", "q": "Який документ закріплював таке положення: «Україна є суверенна і незалежна, демократична, соціальна, правова держ 247", "q": "Динаміку якого явища соціально-економічного розвитку України першої половини 1990-х рр. відображено в таблиці?", "sec": "s7", "g": "", "t": "single", "img": ["q_5d2f2696c5"], "opts": ["зростання життєвого рівня населення", "формування «середнього класу» в суспільстві", "уповільнення соціальної диференціації", "зростання безробіття"], "ok": [3], "expl": "За 1991 – 1995 рр. кількість зайнятих у господарстві зменшилася з 25 до 21,6 млн, а незайнятих зросла — тобто зростало безробіття.", "src": "ЗНО 2013 – додаткова сесія (№ 41)"}, {"id": "z22302", "q": "За часів перебування на посаді якого Президента України відбувалися події, описані в уривку з історичного джерела: «Бурхливими були часи …знову шукали винних у важкому економічному стані: і Кабмін не такий, і Рада не така, і депутати... Студенти на граніті вимагали реальної незалежності і реформ, страйкуючі шахтарі – проведення референдуму про довіру Президенту й парламенту. І, щоб вгамувати пристрасті, було ухвалено рішення про дострокове припинення повноважень парламенту та Президента України і проведення дострокових виборів…»?", "sec": "s1", "g": "", "t": "single", "opts": ["Л. М. Кравчука", "Л. Д. Кучми", "В. А. Ющенка", "В. Ф. Януковича"], "ok": [0], "expl": "Студентське голодування на граніті — жовтень 1990 р., страйк шахтарів Донбасу — червень 1993 р. Тоді ж Рада призначила дострокові вибори парламенту й Президента на 1994 р. Президентом був Леонід Кравчук.", "src": "ЗНО 2014 – додаткова сесія (№ 41)"}, {"id": "z22303", "q": "Повноправним суб’єктом міжнародних відносин Україна стала,", "sec": "s8", "g": "b1-recog", "t": "single", "opts": ["набувши членство в Раді Європи.", "проголосивши Декларацію про державний суверенітет.", "ухваливши Основні напрями зовнішньої політики.", "здобувши визнання державами світу незалежності країни."], "ok": [3], "expl": "Суб’єктом міжнародних відносин держава стає, коли її визнають інші держави. Після референдуму 1 грудня 1991 р. незалежність України визнали десятки країн. Декларацію 1990 р. ухвалила ще УРСР, Рада Європи — 1995 р.", "src": "ЗНО 2014 – додаткова сесія (№ 42)"}, {"id": "z22317", "q": "Що було характерним для соціально-економічного життя України в першій половині 1990-х рр.?", "sec": "s3", "g": "", "t": "three", "opts": ["інтенсивне зростання воєнно-промислового комплексу", "створення сфери побутових послуг і громадського харчування", "різке соціальне розшарування в суспільстві", "відмова від залучення іноземних кредитів", "стрімке зростання тіньової економіки", "відсутність інфляції", "лібералізація цін"], "ok": [2, 4, 6], "expl": "Після лібералізації цін (січень 1992 р.) почалася гіперінфляція, частина людей збідніла, а частина швидко збагатилася. Тіньова економіка за оцінками дорівнювала офіційній. ВПК занепадав, а кредити МВФ Україна брала.", "src": "ЗНО 2014 – додаткова сесія (№ 56)"}, {"id": "z22858", "q": "Яке явище сучасності України відображено на карикатурі?", "sec": "s3", "g": "", "t": "single", "img": ["q_73514b7de1"], "opts": ["«тінізацію» економічної діяльності", "кризу фінансової та банківської систем", "бюрократизацію апарату державного управління", "корумпованість системи органів державної влади"], "ok": [3], "expl": "Посадовці, які «не бачать, не чують, мовчать», бо в них заклеєно доларами очі, вуха й рот, — це хабарі, тобто корупція в органах влади.", "src": "ЗНО 2021 – пробний тест (№ 21)"}, {"id": "z22865", "q": "Установіть послідовність подій періоду становлення України як незалежної держави.", "sec": "s10", "g": "b1-seq90", "t": "seq", "opts": ["проведення перших альтернативних виборів до Верховної Ради УРСР", "обрання першого Президента України", "утвердження державної символіки України", "ухвалення Конституції України"], "expl": "Вибори до Верховної Ради УРСР — березень 1990 р.; перший Президент — 1 грудня 1991 р.; прапор і тризуб — 1992 р.; Конституція — 1996 р.", "src": "ЗНО 2021 – пробний тест (№ 28)"}, {"id": "z23825", "q": "У газетній статті, зображеній на фото, ідеться про", "sec": "s3", "g": "", "t": "single", "img": ["q_2d3c504111"], "opts": ["девальвацію карбованця.", "введення в обіг купоно-карбованців.", "стрімке зростання цін на товари й послуги.", "запровадження національної грошової одиниці – гривні."], "ok": [3], "expl": "Заголовок статті — «Остання витівка карбованця: з другого вересня ми з “мільйонерів” станемо просто нормальними людьми». Ідеться про грошову реформу 2 – 16 вересня 1996 р. і запровадження гривні.", "src": "ЗНО 2021 – основна сесія (№ 22)"}, {"id": "z24883", "q": "Започаткування системи олігархічних фінансово-промислових груп було характерним для соціально-економічного життя України в період", "sec": "s3", "g": "", "t": "single", "opts": ["десталінізації та лібералізації суспільного життя (1953-1964 рр.).", "загострення кризи радянської системи (1965-1985 рр.).", "відновлення незалежності України (1985-1991 рр.).", "становлення України як незалежної держави (1991-2010 рр.)."], "ok": [3], "expl": "Олігархічні групи — велика власність, поєднана з політичним впливом, — склалися в 1990-х рр. під час приватизації. Це доба становлення незалежної України.", "src": "ЗНО 2021 – додаткова сесія (№ 22)"}, {"id": "z25591", "q": "Конституцію України було ухвалено", "sec": "s4", "g": "b1-008", "t": "single", "opts": ["16 липня 1990 р.", "24 серпня 1991 р.", "28 червня 1996 р.", "29 березня 1998 р."], "ok": [2], "expl": "Конституцію України ухвалила Верховна Рада 28 червня 1996 р.; тепер це День Конституції. 16 липня 1990 р. — Декларація про державний суверенітет, 24 серпня 1991 р. — Акт проголошення незалежності.", "src": "ЗНО 2011 – 2 сесія (№ 48)"}, {"id": "z26027", "q": "Конституцію України було ухвалено", "sec": "s4", "g": "b1-008", "t": "single", "opts": ["16 липня 1990 р.", "24 серпня 1991 р.", "19 липня 1994 р.", "28 червня 1996 р."], "ok": [3], "expl": "Конституцію ухвалили 28 червня 1996 р. після нічного засідання Ради. 19 липня 1994 р. Л. Кучма склав присягу Президента.", "src": "НМТ 2022 – демоваріант (№ 14)"}, {"id": "z26954", "q": "Які проблеми 1990-х рр. відображено на фото?", "sec": "s7", "g": "", "t": "single", "img": ["q_1598d190ee"], "opts": ["політичні", "соціально-економічні", "культурно-освітні", "релігійні"], "ok": [1], "expl": "Гасло «Ми втомилися жити в злиднях!» — про бідність, невиплату зарплат і пенсій, падіння рівня життя в 1990-х рр. Це соціально-економічні проблеми.", "src": "НМТ 2023 – 2 сесія (№ 19)"}, {"id": "z26955", "q": "У якому році Національним банком України випущено монету, зображену на фото?", "sec": "s3", "g": "", "t": "single", "img": ["q_69b0fd63c4"], "opts": ["2001 р.", "2006 р.", "2010 р.", "2012 р."], "ok": [1], "expl": "Напис на монеті: «10 років відродження грошової одиниці України». Гривню запроваджено 1996 р., тож монету випущено 2006 р.", "src": "НМТ 2023 – 2 сесія (№ 20)"}, {"id": "z35474", "q": "Прийняття 28 червня 1996 р. Конституції України було результатом", "sec": "s4", "g": "", "t": "single", "opts": ["загальнонаціонального масового політичного страйку.", "виконання міжнародних зобов’язань України перед ООН.", "волевиявлення народу на загальнодержавному референдумі.", "політичного компромісу між Президентом і Верховною Радою."], "ok": [3], "expl": "Кучма погрожував винести свій проєкт Конституції на референдум. Щоб цього уникнути, Рада після нічного засідання ухвалила компромісний текст 28 червня 1996 р.", "src": "НМТ 2026 – демоваріант (№ 20)"}, {"id": "z35481", "q": "Які поняття й терміни (1–4) потрібно використовувати, характеризуючи історичні періоди (А – Д)?", "sec": "s10", "g": "b1-periods", "t": "match", "opts": ["Україна в роки Другої світової війни (1939–1945 рр.)", "Україна в перші повоєнні роки (1945 – початок 1950-х рр.)", "Україна в умовах десталінізації (1953–1964 рр.)", "Україна в період загострення кризи радянської системи (1965–1985 рр.)", "Україна в умовах незалежності (1991 р. – початок ХХІ ст.)"], "ok": [3, 4, 1, 2], "left": ["«самвидав», «номенклатура», «дефіцит», «правозахисник»", "«приватизація», «тимчасово окупована територія», «антитерористична операція (АТО)», «європейська інтеграція»", "«операція “Вісла”», «ждановщина», «космополітизм», «лисенківщина»", "«відлига», «політична реабілітація», «раднаргоспи», «шістдесятники»"], "expl": "Самвидав і дефіцит — «застій» (1965 – 1985); приватизація й АТО — незалежність; ждановщина й лисенківщина — перші повоєнні роки; відлига й раднаргоспи — десталінізація (1953 – 1964).", "src": "НМТ 2026 – демоваріант (№ 24)"}, {"id": "z35487", "q": "Позначте факти біографії видатного політика, зображеного на фото.", "sec": "s10", "g": "", "t": "three", "img": ["q_26fb98a8df"], "opts": ["обіймав посаду голови Народного руху України", "один із засновників Української Гельсінської спілки", "автор книги «Україно наша Радянська»", "заснував «самвидавний» часопис «Український вісник»", "позбавлений радянського громадянства та висланий за кордон", "обраний у 1991 р. Президентом України", "брав участь у роботі Української робітничо-селянської спілки"], "ok": [0, 1, 3], "expl": "На фото — В’ячеслав Чорновіл: засновник «Українського вісника» (1970), один із засновників Української Гельсінської спілки (1988), голова Народного руху (з 1992 р.). Книжку «Україно наша Радянська» написав П. Шелест, Президентом 1991 р. обрали Л. Кравчука, у робітничо-селянській спілці був Л. Лук’яненко.", "src": "НМТ 2026 – демоваріант (№ 30)"}, {"id": "z39272", "q": "На фото зображено Меморіал пам’яті жертв геноциду кримськотатарського народу. Меморіал складається з трьох стилізованих стел-долонь, що здіймаються до неба в молитві до Всевишнього з проханням про захист, допомогу й справедливість. На кожній стелі-долоні викарбувано герб кримських татар і рік трагічної події в історії народу. Між стелами розташовано чашу з кипарисом, що символізує смуток і скорботу. Про які події в історії кримськотатарського народу покликаний нагадувати Меморіал?", "sec": "s2", "g": "", "t": "three", "img": ["q_a991142240"], "opts": ["підкорення Кримського ханства Російською імперією", "спустошення території півострова внаслідок Кримської війни", "насильницьке виселення владою СРСР кримських татар із Криму", "передання Кримської області до складу Української РСР", "установлення нацистського «нового порядку» в Криму", "насадження осілого способу життя в ході радянізації Криму", "окупацію Кримського півострова військами Російської Федерації"], "ok": [0, 2, 6], "expl": "Три стели з датами нагадують про три трагедії: 1783 р. — Російська імперія приєднала Кримське ханство; 1944 р. — сталінська депортація кримських татар; 2014 р. — окупація Криму Росією.", "src": "НМТ 2026 – 2 сесія (№ 30)"}, {"id": "z36033", "q": "Президентські вибори якого року відображено на карикатурі?", "sec": "s6", "g": "b1-006", "t": "single", "img": ["q_f74f2bf13d"], "opts": ["1990 р.", "2004 р.", "2010 р.", "2013 р."], "ok": [1], "expl": "Родина в помаранчевому запитує сусіда, вбраного в синє: «Сусіде, а за кого ви віддасте голос?» Помаранчевий і синьо-білий — кольори виборчих кампаній В. Ющенка й В. Януковича 2004 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36464", "q": "Розгляньте карикатуру. Які терміни треба використати, характеризуючи явища на початку 1990-х в економіці України, що стали об'єктом сатири карикатуриста?", "sec": "s3", "g": "", "t": "single", "img": ["q_2a81a07fcf"], "opts": ["ринкові відносини, номенклатура", "дефіцит, гіперінфляція", "тіньова економіка, корупція", "бюрократизація, стагнація"], "ok": [1], "expl": "На карикатурі — порожні полиці з табличками «Дякуємо за покупку». На початку 1990-х рр. товарів бракувало (дефіцит), а ціни зростали в тисячі разів на рік (гіперінфляція).", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36465", "q": "Україна утвердилася як повноправний суб’єкт міжнародного права внаслідок", "sec": "s8", "g": "b1-recog", "t": "single", "opts": ["набуття членства в Раді Європи.", "проголошення Декларації про державний суверенітет.", "ухвалення Основних напрямів зовнішньої політики."

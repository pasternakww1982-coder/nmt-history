}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;
}, { passive: false });
lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const pr = document.getElementById('pr'); if (!pr) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  pr.style.width = (max > 0 ? Math.min(100, 100 * scrollY / max) : 100) + '%';
}, { passive: true });

/* Курс: вхід учня, бліци після частин, замки, Тест 1 і Тест 2, відправлення результатів у Google-таблицю.
   Дані: QUIZ ({blitz:{1:{n,pass,quota,pool}}, tests:{t1:{tasks}}}), COURSE_API (адреса Apps Script). */
const API = (typeof COURSE_API === 'string' && COURSE_API) || '';
const LET = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Є'];
const TYPE = { single: 'Одна правильна відповідь', three: 'Три правильні з семи', seq: 'Послідовність', match: 'Відповідність' };
const LBLRE = /^(?:Місцезнаходження |Місце |малюнок )?([А-ЕЄ]|\d)$/;
const isLbl = q => q.opts.every(o => LBLRE.test(o));
const lab = (q, j, k) => isLbl(q) && !(q.t === 'seq' && q.oimg) ? q.opts[j].match(LBLRE)[1] : q.t === 'three' ? k + 1 : LET[k];
/* порядок показу в бліці: мітки — як є (послідовність із мітками — за абеткою), решта — навмання */
function showOrder(q) {
  const idx = [...q.opts.keys()];
  if (!isLbl(q) || (q.t === 'seq' && q.oimg)) return shuffle(idx);
  return q.t === 'seq' ? idx.sort((a, b) => q.opts[a].localeCompare(q.opts[b], 'uk')) : idx;
}
/* відповідність, де рядки — літери із зображення (А–Г): варіанти нумеруємо цифрами, щоб літери рядків і варіантів не плуталися */
const rowLet = q => !!q.left && q.left.every(l => /^[А-Г]$/.test(l));
const MLB = q => rowLet(q) ? ['1', '2', '3', '4', '5'] : LET;
const mrowHead = (q, l, i) => rowLet(q) ? `<b>Зображення ${l}</b>` : `<b>${i + 1}.</b> ${q.rimg ? pic(q.rimg[i], 'ri') : ''}${/^\d$/.test(l) ? '' : md(l)}`;
const mlist = (q, order) => isLbl(q) ? '' : `<div class="mlist">${order.map((j, k) => `<div class="mo"><b class="a2">${MLB(q)[k]}</b> ${optHtml(q, j)}</div>`).join('')}</div>`;
const maxOf = q => q.t === 'single' ? 1 : q.t === 'match' ? 4 : 3;
function grade12(pc) { const t = [25, 33, 41, 49, 56, 63, 70, 77, 84, 91]; let g = 2; t.forEach((v, k) => { if (pc >= v) g = k + 3; }); return g; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (p, m) => m ? Math.round(1000 * p / m) / 10 : 0;
/* кількість частин курсу = кількість бліців; короткі перевірки після розділів — QUIZ.mini['<частина>-<розділ>'] */
const NP = Object.keys(QUIZ.blitz || {}).length || 3;
const PARTS_N = Array.from({ length: NP }, (_, i) => i + 1);
const MINI = QUIZ.mini || {};
const PASS = n => (QUIZ.blitz[n] && QUIZ.blitz[n].pass) || 75;
/* суворий режим (QUIZ.strict з course.json теми, напр. {"pause": 30}; рішення вчителя 24.11.2026 для 11 класу): поки бліц частини не пройдено,
   після кожного питання — лише «правильно / неправильно», без правильної відповіді й пояснення; після невдалої спроби — пауза;
   розбір з відповідями й поясненнями — після проходження. Тест 1: після невдалої спроби — пауза, бали за завданнями — лише після допуску. */
const STRICT = QUIZ.strict || null;
const PAUSE_MS = STRICT ? (STRICT.pause || 30) * 60000 : 0;
const strictB = n => !!STRICT && !U.passed('b' + n);
/* після стількох невдалих спроб поспіль відкривається розбір помилок (рішення вчителя 24.11.2026: слабкий учень не має застрягти) */
const REVIEW_AFTER = STRICT ? (STRICT.review_after || 4) : 0;
const canReview = n => !!STRICT && ((U.passed('b' + n) && !!store.get('breview' + n, null)) || store.get('bfails' + n, 0) >= REVIEW_AFTER);
/* бали спроби за розділами частини — від найслабшого */
function secStats(n, qs, log) {
  const L = LESSONS[n - 1], acc = {};
  log.forEach((r, k) => { const s = qs[k] && qs[k].sec; if (!s) return; const a = acc[s] || (acc[s] = { p: 0, m: 0 }); a.p += r.p; a.m += r.m; });
  const ix = s => L.sections.findIndex(z => z.id === s);
  return Object.entries(acc).map(([s, a]) => { const S = L.sections[ix(s)] || { num: '', title: s }; return { s, num: S.num, title: S.title, p: a.p, m: a.m, pc: pct(a.p, a.m) }; })
    .sort((x, y) => x.pc - y.pc || ix(x.s) - ix(y.s));
}
function secStatsHtml(n, st, title) {
  if (!st || !st.length) return '';
  const L = LESSONS[n - 1], P = PASS(n);
  return `<div class="h2" style="margin:8px 0 0">${title}</div><div class="sec-list">${st.map(x => `<button class="sec-btn sst${x.pc < P ? ' weak' : ''}" data-go="${L.id}-${x.s}">
    <span class="num">${x.num}</span><span><h3>${md(x.title)}</h3><div class="st"><b>${x.pc} %</b> · ${x.p} з ${x.m} б.${x.pc < P ? ' · варто повторити' : ''}</div>
    <div class="sbar"><i style="width:${Math.max(3, Math.min(100, x.pc))}%"></i></div></span></button>`).join('')}</div>`;
}
const Pause = {
  until(k) { return store.get('pause', {})[k] || 0; },
  set(k, t) { const p = store.get('pause', {}); p[k] = t; store.set('pause', p); },
  /* годинник телефона перевели назад — більше за саму паузу не чекаємо */
  left(k) { return STRICT ? Math.min(PAUSE_MS, Math.max(0, this.until(k) - Date.now())) : 0; },
  txt(ms) { return Math.max(1, Math.ceil(ms / 60000)) + ' хв'; },
  clk: null,
  stop() { clearInterval(this.clk); this.clk = null; },
  /* кнопка з відліком (data-pause); коли пауза мине — сторінку перемальовуємо */
  watch(k, redraw) {
    this.stop();
    this.clk = setInterval(() => {
      const el = document.querySelector(`[data-pause="${k}"]`); if (!el) return this.stop();
      const l = this.left(k); if (l <= 0) { this.stop(); redraw(); } else el.querySelector('b').textContent = this.txt(l);
    }, 10000);
  },
};
const pauseBtn = k => `<button class="btn" disabled data-pause="${k}">Наступна спроба — через <b>${Pause.txt(Pause.left(k))}</b></button>`;
/* спільна оболонка кількох тем: один вхід на сторінці оболонки (SHELL_URL), учень — у спільному сховищі hist_*,
   прогрес теми — під власним префіксом; кожен запит до сервера несе позначку теми (TOPIC) */
const SH = (typeof SHELL_URL === 'string' && SHELL_URL) || '';
const TOPIC_ID = (typeof TOPIC === 'string' && TOPIC) || '';
const G_ = {
  get(k, d) { try { const v = localStorage.getItem('hist_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hist_' + k, JSON.stringify(v)); } catch (e) {} },
};
const ukey = u => u ? (u.cls + '|' + u.name).toLowerCase() : '';
if (SH) {   // на телефоні інший учень, ніж той, чий прогрес теми збережено, — прогрес цієї теми стираємо (черга лишається: там свої імена)
  const u = G_.get('user', null), own = store.get('owner', null) ?? ukey(store.get('user', null));
  if (u && own !== ukey(u)) {
    try { Object.keys(localStorage).filter(k => k.startsWith(PFX) && !k.startsWith(PFX + 'seen_') && k !== PFX + 'queue').forEach(k => localStorage.removeItem(k)); } catch (e) {}
    store.set('owner', ukey(u));
  } else if (u && own == null) store.set('owner', ukey(u));
}
const toShell = () => { location.replace(SH); };

/* ---------- учень і прогрес ---------- */
const U = {
  get user() { return SH ? G_.get('user', null) : store.get('user', null); },
  prog() { return store.get('prog', {}); },
  setProg(k, v) { const p = this.prog(); p[k] = v; store.set('prog', p); },
  passed(k) { const r = this.prog()[k]; return !!(r && r.pass); },
};
const unlocked = num => num === 1 || U.passed('b' + (num - 1));
/* QUIZ.tests[id].after = N — тест відкривається після бліцу частини N (Тест 2 — ще й після допуску в Тесті 1); без after — Тест 1 після всіх бліців */
const tAfter = id => (QUIZ.tests[id] && QUIZ.tests[id].after) || 0;
const testOpen = id => (tAfter(id) ? U.passed('b' + tAfter(id)) : id !== 't1' || PARTS_N.every(n => U.passed('b' + n))) && (id === 't1' || U.passed('t1'));
const testLock = id => id === 't1' ? (tAfter(id) ? `після бліцу частини ${tAfter(id)}` : 'після всіх бліців')
  : !U.passed('t1') ? 'після Тесту 1' + (tAfter(id) && !U.passed('b' + tAfter(id)) ? ` і бліцу частини ${tAfter(id)}` : '') : `після бліцу частини ${tAfter(id)}`;

/* ---------- зв’язок із сервером: черга, щоб нічого не губилося без інтернету ---------- */
const Net = {
  async call(body) {
    if (!API) throw new Error('no api');
    const u = U.user; if (u && u.pin && body.pin == null) body = { ...body, pin: u.pin };
    if (TOPIC_ID && body.topic == null) body = { ...body, topic: TOPIC_ID };
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), cache: 'no-store', redirect: 'follow' });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(); if (j.error) throw new Error(j.error); return j;
  },
  send(op, data) {
    const u = U.user; if (!u) return;
    const q = store.get('queue', []);
    q.push({ op, name: u.name, cls: u.cls, pin: u.pin, at: new Date().toISOString(), ...(TOPIC_ID ? { topic: TOPIC_ID } : {}), ...data });
    store.set('queue', q); this.flush();
  },
  busy: false,
  async flush() {
    if (this.busy || !API) return; this.busy = true;
    try {
      let q = store.get('queue', []);
      while (q.length) {
        const item = q[0], res = await this.call(item);
        q = store.get('queue', []); q.shift(); store.set('queue', q);
        if (item.op === 'test') this.onTest(item, res);
      }
    } catch (e) { const it = store.get('queue', [])[0], u = U.user;
      if (e.message === 'pin' && it && u && it.name === u.name && it.cls === u.cls) { this.busy = false; return badPin(); } /* інакше немає зв’язку — спробуємо пізніше */ }
    this.busy = false; paintSync();
  },
  onTest(sent, res) {
    if (STRICT && sent.test === 't1' && !res.pass) Pause.set('t1', (Date.parse(sent.at) || Date.now()) + PAUSE_MS);
    U.setProg(sent.test, { ...res, at: sent.at });
    store.set('draft_' + sent.test, null);
    if (location.hash === '#' + sent.test) route();
  },
};
function paintSync() {
  const el = document.getElementById('sync'); if (!el) return;
  const n = store.get('queue', []).length;
  el.innerHTML = !API ? '' : n ? `⏳ Не надіслано результатів: <b>${n}</b>. Надішлеться, щойно з’явиться інтернет. <button class="lnk" id="syncgo">Надіслати зараз</button>` : '✓ Усі результати надіслано вчителю';
  const b = document.getElementById('syncgo'); if (b) b.onclick = () => Net.flush();
}
window.addEventListener('online', () => Net.flush());
setInterval(() => Net.flush(), 60000);

/* ---------- вхід ---------- */
function login() {
  if (SH) return toShell();
  document.title = 'Вхід — ' + TITLE;
  const L0 = LESSONS[0];
  app.innerHTML = `<div class="wrap">
    <div class="hero"><img src="${im(L0.cover.key).src}" alt=""></div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(TITLE)}</h1>
      <div class="sub">Уроки, короткі перевірки після розділів, бліци після кожної частини й два тести. Результати бачитиме вчитель.</div></div>
    <form class="card login" id="lg">
      <label>Прізвище та ім’я<input id="lgn" autocomplete="name" placeholder="Наприклад: Шевченко Олена" required></label>
      <label>Клас<input id="lgc" placeholder="Наприклад: 10-А" required></label>
      <label>Ваш код (4–8 цифр)<input id="lgp" type="text" inputmode="numeric" pattern="\\d{4,8}" maxlength="8" autocomplete="off" placeholder="Придумайте й запам’ятайте" required></label>
      <div class="err" id="lge" hidden></div>
      <button class="btn">Увійти</button>
      <p class="cap">Пишіть прізвище й ім’я так само, як у журналі. Код ви задаєте під час першого входу; далі він потрібен, щоб увійти з іншого телефона. Якщо забули код — скажіть учителю.</p>
    </form>${brandHtml()}</div>`;
  const u0 = U.user; if (u0) { document.getElementById('lgn').value = u0.name; document.getElementById('lgc').value = u0.cls; }
  document.getElementById('lg').onsubmit = async e => {
    e.preventDefault();
    const name = document.getElementById('lgn').value.trim().replace(/\s+/g, ' ');
    const cls = document.getElementById('lgc').value.trim().toUpperCase().replace(/\s+/g, '').replace(/^(\d+)([А-ЯІЇЄҐ])$/, '$1-$2');
    const er = document.getElementById('lge');
    if (name.split(' ').length < 2) { er.hidden = false; er.textContent = 'Вкажіть прізвище та ім’я.'; return; }
    if (!/^\d{1,2}-?[А-ЯІЇЄҐ]?$/.test(cls)) { er.hidden = false; er.textContent = 'Клас — цифра й літера, наприклад 10-А.'; return; }
    const pin = document.getElementById('lgp').value.trim();
    if (!/^\d{4,8}$/.test(pin)) { er.hidden = false; er.textContent = 'Код — від 4 до 8 цифр.'; return; }
    const btn = e.target.querySelector('.btn'); btn.disabled = true; er.hidden = true;
    try {
      const r = await Net.call({ op: 'login', name, cls, pin });
      const nm = (r && r.name) || name, cl = (r && r.cls) || cls;   // сервер повертає ім’я так, як у списку класу
      store.set('user', { name: nm, cls: cl, pin }); store.set('pulled', true); store.set('needPin', false);
      store.set('queue', store.get('queue', []).map(x => x.name === name && x.cls === cls ? { ...x, name: nm, cls: cl, pin } : x));
      if (r && r.prog) mergeProg(r.prog);
      Net.send('event', { what: 'вхід' });
      route();
    } catch (err) {
      btn.disabled = false; er.hidden = false;
      er.textContent = err.message === 'pin' ? 'Код не збігається з тим, який задано для цього учня. Якщо забули — скажіть учителю.'
        : err.message === 'roster' ? 'Такого учня немає в списку класу. Перевірте клас, прізвище та ім’я (як у журналі) або скажіть учителю.'
        : 'Не вдалося зв’язатися із сервером. Перший вхід потребує інтернету — спробуйте ще раз.';
    }
  };
}
async function pullProg() {
  const u = U.user; if (!u || store.get('pulled', false)) return false;
  try { const r = await Net.call({ op: 'progress', name: u.name, cls: u.cls }); if (r && r.prog) mergeProg(r.prog); store.set('pulled', true); return true; } catch (e) { return false; }
}
/* сервер не прийняв код (його змінили або стерли) — просимо ввійти знову; черга результатів зберігається */
function badPin() { if (SH) { G_.set('needPin', true); return toShell(); } store.set('needPin', true); login(); }
const needLogin = () => !U.user || !U.user.pin || (SH ? G_.get('needPin', false) : store.get('needPin', false));
function mergeProg(sp) {
  const p = U.prog();
  Object.entries(sp).forEach(([k, v]) => { if (!p[k] || (v.pass && !p[k].pass) || (v.pct || 0) > (p[k].pct || 0)) p[k] = v; });
  store.set('prog', p);
}

/* ---------- обгортки сторінок уроків ---------- */
const _index = index, _partHome = partHome, _section = section;
index = function () {
  if (needLogin()) return login();
  _index();
  const u = U.user, cap = app.querySelector('.wrap > p.cap'); if (cap) cap.remove();
  app.querySelectorAll('.part-btn').forEach(b => {
    const n = LESSONS.findIndex(L => L.id === b.dataset.go) + 1, r = U.prog()['b' + n];
    if (!unlocked(n)) { b.classList.add('locked'); b.querySelector('.st').innerHTML = `🔒 Відкриється після бліцу частини ${n - 1}`; }
    b.querySelector('.st').insertAdjacentHTML('beforeend', r ? ` · бліц: <b class="${r.pass ? 'okc' : 'badc'}">${r.pct}%${r.pass ? ' ✓' : ''}</b>` : '');
  });
  app.querySelector('.wrap').insertAdjacentHTML('afterbegin', `${SH ? `<a class="lnk tback" href="${SH}">← Усі теми</a>` : ''}<div class="who">${esc(u.name)} · ${esc(u.cls)} <button class="lnk" id="out">це не я</button></div>`);
  app.querySelector('.wrap').insertAdjacentHTML('beforeend', `<div class="h2">Тести</div><div class="sec-list">${['t1', 't2'].map(testBtn).join('')}</div>
    <div class="sync" id="sync"></div>`);
  const bf = app.querySelector('.wrap > .brand'); if (bf) app.querySelector('.wrap').appendChild(bf);
  document.getElementById('out').onclick = () => {
    Net.flush();
    if (SH) { G_.set('user', null); return toShell(); }
    try { Object.keys(localStorage).filter(k => k.startsWith(PFX) && !k.startsWith(PFX + 'seen_') && k !== PFX + 'queue').forEach(k => localStorage.removeItem(k)); } catch (e) {}
    route();
  };
  wireGo(); wireLocks(); paintSync();
  if (!store.get('pulled', false)) pullProg().then(ok => { if (ok && (location.hash === '' || location.hash === '#home')) index(); });
};
function testBtn(id) {
  const T = QUIZ.tests[id], r = U.prog()[id], open = testOpen(id) && T;
  const st = !T ? 'З’явиться згодом' : !open ? '🔒 Відкриється ' + testLock(id)
    : r && r.pts != null ? `Результат: <b>${r.pts} з ${r.max}</b> · ${r.pct}%${id === 't1' ? (r.pass ? ' · допуск ✓' : ' · допуск не отримано' + (Pause.left('t1') ? ` · наступна спроба через ${Pause.txt(Pause.left('t1'))}` : '')) : `${r.grade ? ` · оцінка ${r.grade}` : ''} · за шкалою НМТ: ${r.scale}`}`
    : store.get('draft_' + id, null) ? 'Розпочато — продовжте' : `${T.tasks.length} завдань у форматі НМТ`;
  return `<button class="sec-btn${open ? '' : ' locked'}${r && r.pass ? ' done' : ''}" ${open ? `data-go="${id}"` : 'data-lock="1"'}><span class="num">${id === 't1' ? '1' : '2'}</span>
    <span><h3>${id === 't1' ? 'Тест 1 · допуск' : 'Тест 2 · контрольний'}</h3><div class="st">${st}</div></span></button>`;
}
function wireLocks() {
  app.querySelectorAll('[data-lock]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 500); });
}
partHome = function (L) {
  if (needLogin()) return login();
  const n = LESSONS.indexOf(L) + 1;
  if (!unlocked(n)) return lockedPart(L, n);
  _partHome(L);
  const r = U.prog()['b' + n], B = QUIZ.blitz[n], dr = Blitz.draft(n), st = strictB(n), pl = st && !dr ? Pause.left('b' + n) : 0;
  const card = `<div class="h2">Бліц частини ${n}</div><section class="card bz-card">
    <div class="meta">${B.n} питань із розділів цієї частини — щоразу інші (≈ ${Math.round(B.n * 0.6)} хв). Щоб відкрити ${n < NP ? 'наступну частину' : 'тести'}, потрібно <b>${PASS(n)} %</b> балів.
      ${st ? `Спроби бліцу не на оцінку. Після кожного питання ви побачите лише, правильно чи ні; правильні відповіді й пояснення — у розборі, коли пройдете бліц.
      Після невдалої спроби — пауза ${STRICT.pause || 30} хв: за цей час перечитайте розділи, де були помилки.` : 'Спроби бліцу не на оцінку: проходьте скільки завгодно разів.'}${B.timer ? ' На кожне питання — обмежений час (40–90 с).' : ''}
      Учитель бачить, скільки часу тривав бліц і скільки разів ви виходили зі сторінки.</div>
    ${r ? `<div class="best">Найкращий результат: <b>${r.pct}%</b> ${r.pass ? '· пройдено ✓' : '· ще не пройдено'}</div>` : ''}
    ${dr ? `<button class="btn" data-go="blitz${n}">Продовжити бліц (питання ${dr.i + 1} з ${dr.ids.length})</button>
      ${st && dr.log && dr.log.length ? `<button class="btn ghost" id="bzend">Завершити цю спробу</button>
      <div class="cap">Питання без відповіді — 0 балів. Якщо спроба буде невдалою, далі — пауза ${STRICT.pause || 30} хв.</div>`
      : '<button class="btn ghost" id="bznew">Почати бліц заново</button>'}`
      : pl ? pauseBtn('b' + n) : `<button class="btn" data-go="blitz${n}">${r ? 'Пройти ще раз' : 'Почати бліц'}</button>`}
    ${canReview(n) ? `<button class="btn ghost" data-go="review${n}">${U.passed('b' + n) ? 'Розбір бліцу' : 'Розбір помилок усіх спроб'}</button>` : ''}</section>
    ${st && !dr ? secStatsHtml(n, store.get('blast' + n, null), 'Остання спроба за розділами') : ''}`;
  const nb = app.querySelector('.wrap > .btn[data-go]');
  if (nb) { nb.insertAdjacentHTML('beforebegin', card); if (!U.passed('b' + n)) nb.remove(); }
  else app.querySelector('.wrap').insertAdjacentHTML('beforeend', card + (U.passed('b' + NP) ? `<button class="btn" data-go="home" style="margin-top:20px">До тестів →</button>` : ''));
  wireGo();
  const bn = document.getElementById('bznew'); if (bn) bn.onclick = () => { Blitz.clearDraft(n); Blitz.start(n); };
  const be = document.getElementById('bzend'); if (be) be.onclick = () => Blitz.abandon(n);
  if (pl) Pause.watch('b' + n, () => route());
};
function lockedPart(L, n) {
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${n}</span></div></div>
  <div class="wrap"><div class="home-head"><h1>🔒 ${esc(L.part)}</h1>
    <div class="sub">Ця частина відкриється, коли ви пройдете бліц частини ${n - 1} (потрібно 75 %).</div></div>
    <button class="btn" data-go="blitz${n - 1}">До бліцу частини ${n - 1}</button></div>`;
  wireGo(); window.scrollTo(0, 0);
}
section = function (L, s) {

  const n = LESSONS.indexOf(L) + 1;
  if (!unlocked(n)) return lockedPart(L, n);
  _section(L, s);
  const sent = store.get('ev', []), k = `${L.id}-${s.id}`;

  if (M) {
    const mr = store.get('mini', {})[`${n}-${s.id}`];
    const mc = `<section class="card bz-card mini-card"><div class="h">Перевірте себе</div>
      <div class="meta">${M.n} ${M.n >= 5 ? 'питань' : 'питання'} за цим розділом (≈ ${Math.max(2, Math.round(M.n * 0.5))} хв). Не на оцінку — просто щоб побачити, що запам’яталося.</div>
      ${mr ? `<div class="best">Останній раз: <b>${mr.p} з ${mr.m}</b></div>` : ''}

/* ---------- бліц ---------- */
function draw(n, B, seenKey) {
  B = B || QUIZ.blitz[n]; seenKey = seenKey || 'bseen' + n;
  const seen = new Set(store.get(seenKey, [])), used = new Set(), out = [];
  const take = list => { for (const q of list) { if (out.length >= B.n) return; if (out.includes(q) || (q.g && used.has(q.g))) continue; out.push(q); if (q.g) used.add(q.g); return true; } };
  const fresh = list => shuffle(list).sort((a, b) => seen.has(a.id) - seen.has(b.id));
  Object.entries(B.quota || {}).forEach(([sec, k]) => { const c = fresh(B.pool.filter(q => q.sec === sec)); for (let i = 0; i < k; i++) if (!take(c)) break; });
  while (out.length < B.n && take(fresh(B.pool))) {}
  const order = Object.keys(B.quota || {});
  out.sort((a, b) => order.indexOf(a.sec) - order.indexOf(b.sec));
  return out;
}
function pic(key, cls) {
  const i = IMGS[key]; if (!i) return '';
  return `<div class="pic ${cls || ''}" data-src="${i.src}" data-cap=""><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""><span class="zoom-hint">⤢</span></div>`;
}
/* зображення-варіант: вибір — дотиком до плитки, збільшення — лише кнопкою ⤢ */
function opic(key) {
  const i = IMGS[key]; if (!i) return '';
  return `<span class="oi"><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""><span class="zoom-hint pic" data-src="${i.src}" data-cap="">⤢</span></span>`;
}
const optHtml = (q, j) => `${q.oimg ? opic(q.oimg[j]) : ''}${isLbl(q) ? '' : `<span>${md(q.opts[j])}</span>`}`;

const Blitz = {
  /* незавершений бліц зберігається на телефоні: світло, тривога — і можна продовжити з того самого питання */
  draft(n) { const d = store.get('bdraft' + n, null); return d && d.ids && d.i < d.ids.length ? d : null; },
  clearDraft(n) { store.set('bdraft' + n, null); },
  save() { if (this.mini) return; store.set('bdraft' + this.n, { ids: this.qs.map(q => q.id), orders: this.qs.map(q => q.order), i: this.i, pts: this.pts, log: this.log,
    dl: this.dl, sec: this.sec, exits: this.exits }); },
  /* час на питання бліцу (с): строк зберігається в чернетці, тож перезавантаження його не скидає */
  lim(q) { return { single: 40, three: 60, match: 90, seq: 90 }[q.t] || 60; },
  timed() { return !this.mini && !!(QUIZ.blitz[this.n] && QUIZ.blitz[this.n].timer); },
  stopClock() { clearInterval(this.clk); this.clk = null; },
  start(n) {
    this.mini = null; this.n = n; this.strict = strictB(n);
    const d = store.get('bdraft' + n, null), pool = QUIZ.blitz[n].pool;
    if (this.strict && !(d && d.ids && d.i < d.ids.length) && Pause.left('b' + n) > 0) return this.paused(n);
    if (d && d.ids && d.ids.every(id => pool.some(q => q.id === id))) {
      this.qs = d.ids.map((id, k) => ({ ...pool.find(q => q.id === id), order: d.orders[k] }));
      this.i = d.i; this.pts = d.pts; this.log = d.log; this.dl = d.dl || null; this.sec = d.sec || 0; this.exits = d.exits || 0;
    } else {
      this.qs = draw(n).map(q => ({ ...q, order: showOrder(q) }));
      this.i = 0; this.pts = 0; this.log = []; this.dl = null; this.sec = 0; this.exits = 0;
      const s = new Set(store.get('bseen' + n, [])); this.qs.forEach(q => s.add(q.id)); store.set('bseen' + n, [...s]);

    this.show();
  },
  /* суворий режим: «Завершити цю спробу» — чернетка з відповідями зараховується як завершена (питання без відповіді — 0 балів),
     щоб невдалу спробу не можна було скинути й почати наново без паузи */

    this.qs = d.ids.map((id, k) => ({ ...pool.find(q => q.id === id), order: d.orders[k] })).filter(q => q.id);
    this.pts = d.pts || 0; this.log = (d.log || []).slice(0, this.qs.length); this.sec = d.sec || 0; this.exits = d.exits || 0;
    for (let k = this.log.length; k < this.qs.length; k++) this.log.push({ id: this.qs[k].id, p: 0, m: maxOf(this.qs[k]), a: null });
    this.max = this.qs.reduce((a, q) => a + maxOf(q), 0); this.i = this.qs.length - 1;

  },
  /* коротка перевірка після розділу: без замка й без оцінки */
  startMini(n, sid) {

    this.i = 0; this.pts = 0; this.log = []; this.dl = null; this.sec = 0; this.exits = 0; this.max = this.qs.reduce((a, q) => a + maxOf(q), 0);

      <button class="x" data-go="${this.back()}" aria-label="Вийти">✕</button></div>`; },
  show() {

        q.left.map((l, i) => `<div class="mrow"><div class="ml">${mrowHead(q, l, i)}</div><div class="mbtns">${q.order.map((j, k) =>
          `<button class="mb" data-i="${i}" data-j="${j}">${MLB(q)[k]}</button>`).join('')}</div></div>`).join('');
    } else {
      tiles = q.order.map((j, k) => `<button class="tile n${q.oimg ? ' wi' : ''}" data-j="${j}"><span class="l">${lab(q, j, k)}</span>${optHtml(q, j)}</button>`).join('');
      if (q.oimg) tiles = `<div class="tgrid">${tiles}</div>`;
    }
    const act = q.t === 'single' ? '' : `<div class="bz-act"><button class="btn ghost" id="bzr">Скинути</button><button class="btn" id="bzok" disabled>Відповісти</button></div>`;
    app.innerHTML = `<div class="wrap bz-in">${this.top()}<div class="qtype">${TYPE[q.t]}${q.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      <div class="qtext">${md(q.q).replace(/\n/g, '<br>')}</div>${(q.img || []).map(k => pic(k, 'qi')).join('')}
      <div class="tiles" id="tl">${tiles}</div>${act}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const tl = document.getElementById('tl');
    tl.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; this.pick(q, +b.dataset.j); });
    tl.querySelectorAll('.mb').forEach(b => b.onclick = () => { this.sel[+b.dataset.i] = +b.dataset.j; this.paintMatch(); });
    if (q.t !== 'single') {
      document.getElementById('bzr').onclick = () => { this.sel = q.t === 'match' ? [null, null, null, null] : []; q.t === 'match' ? this.paintMatch() : this.paintSel(q); };
      document.getElementById('bzok').onclick = () => this.answer(q);

  pick(q, j) {

  },
  paintSel(q) {
    document.querySelectorAll('#tl .tile').forEach(b => {
      const j = +b.dataset.j, k = this.sel.indexOf(j), l = b.querySelector('.l, .ord');
      b.classList.toggle('sel', k >= 0);

  },

  answer(q) {

    const tail = this.strict ? (p < m ? '<div class="ex">Правильну відповідь і пояснення побачите в розборі, коли пройдете бліц.</div>' : '')
      : `${ansLine(q)}${q.expl ? `<div class="ex">${md(q.expl)}</div>` : ''}`;
    document.querySelector('.bz-in').insertAdjacentHTML('beforeend', `<div class="fb ${p === m ? 'good' : p ? 'part' : 'bad'}">
      <div class="h">${this.tout ? '⏱ Час вийшов. ' : ''}${p === m ? 'Правильно!' : p ? 'Частково правильно' : 'Неправильно'} · ${p} з ${m}</div>${tail}</div>

  finishMini() {

    const all = store.get('mini', {}); all[k] = { p: this.pts, m: this.max }; store.set('mini', all);
    Net.send('event', { what: 'перевірка', part: n, sec: L.sections[si].num, title: `${this.pts} з ${this.max}` });
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">Перевірка · розділ ${L.sections[si].num}</span><button class="x" data-go="${this.back()}" aria-label="Закрити" style="margin-left:auto">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${this.pts} з ${this.max}</div>
        <div class="gr">${this.pts === this.max ? 'Чудово! Можна йти далі.' : this.pts >= 0.75 * this.max ? 'Добре! Можна йти далі, а помилку варто запам’ятати.' : 'Перегляньте розділ ще раз — і спробуйте знову.'}</div></div>
      <button class="btn" data-go="${nxt ? `p${n}-${nxt.id}` : (U.passed('b' + n) ? 'p' + n : 'blitz' + n)}">${nxt ? 'До наступного розділу →' : (U.passed('b' + n) ? 'До частини' : 'До бліцу частини ' + n + ' →')}</button>

    const card = ({ key, num, q, r }) => `<section class="card rv" data-k="${key}"><div class="qtype">${num ? `Питання ${num} · ` : ''}${TYPE[q.t]}</div>
      <div class="qtext">${md(q.q).replace(/\n/g, '<br>')}</div>${(q.img || []).map(x => pic(x, 'qi')).join('')}
      <div class="tiles">${tilesHtml(q)}</div><div class="fb ${r.p === r.m ? 'good' : r.p ? 'part' : 'bad'}"><div class="h">${r.a == null ? 'Без відповіді · 0 з ' + r.m : (r.p === r.m ? 'Правильно' : r.p ? 'Частково правильно' : 'Неправильно') + ` · ${r.p} з ${r.m}`}</div>
      ${ansLine(q, r.a)}${q.expl ? `<div class="ex">${md(q.expl)}</div>` : ''}</div></section>`;
    const nf = store.get('bfails' + n, 0);
    app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="p${n}">← Частина ${n}</button><span class="ttl">Розбір бліцу ${n}</span></div></div>
      <div class="wrap"><div class="home-head"><h1>Розбір бліцу частини ${n}</h1><div class="sub">${R ? 'Спершу — помилки спроби, якою ви пройшли бліц, далі — помилки попередніх спроб. З правильними відповідями й поясненнями.'
        : `Після ${nf} невдалих спроб: усі питання, де були помилки, з правильними відповідями й поясненнями. Перегляньте їх і перечитайте ці розділи.`}</div></div>
      ${R ? (bad.length ? `<div class="h2">Помилки цієї спроби (${bad.length})</div>${bad.map(card).join('')}` : '<div class="best">У спробі, якою ви пройшли бліц, помилок немає.</div>') : ''}
      ${old.length ? `<div class="h2">${R ? 'Помилки попередніх спроб' : 'Помилки'} (${old.length})</div>${old.map(card).join('')}` : ''}
      ${good.length ? `<details class="rvok"><summary>Правильні відповіді цієї спроби (${good.length})</summary>${good.map(card).join('')}</details>` : ''}
      <button class="btn" data-go="p${n}" style="margin-top:16px">До частини ${n}</button></div>`;
    cur.concat(old).forEach(({ key, q, r }) => { const el = app.querySelector(`.rv[data-k="${key}"] .tiles`); if (el) markTiles(el, q, r.a || [], false); });
    wireGo(); window.scrollTo(0, 0);
  },
};
/* плитки варіантів питання бліцу (порядок q.order) */
function tilesHtml(q) {
  if (q.t === 'match') return mlist(q, q.order) + q.left.map((l, i) => `<div class="mrow"><div class="ml">${mrowHead(q, l, i)}</div><div class="mbtns">${q.order.map((j, k) =>
    `<button class="mb" data-i="${i}" data-j="${j}">${MLB(q)[k]}</button>`).join('')}</div></div>`).join('');
  const t = q.order.map((j, k) => `<button class="tile n${q.oimg ? ' wi' : ''}" data-j="${j}"><span class="l">${lab(q, j, k)}</span>${optHtml(q, j)}</button>`).join('');
  return q.oimg ? `<div class="tgrid">${t}</div>` : t;
}
/* позначки після відповіді: hide — суворий режим (лише вибране й без правильної відповіді) */
function markTiles(root, q, sel, hide) {
  root.querySelectorAll('.mb').forEach(b => { const i = +b.dataset.i, j = +b.dataset.j; b.disabled = true;
    if (hide) { b.classList.toggle('on', sel[i] === j); return; }
    if (sel[i] === j) b.classList.add('on'); if (q.ok[i] === j) b.classList.add('right'); else if (sel[i] === j) b.classList.add('wrong'); });
  root.querySelectorAll('.tile').forEach(b => { const j = +b.dataset.j; b.disabled = true;
    if (q.t === 'seq') { if (hide) return; const k = sel.indexOf(j), l = b.querySelector('.l, .ord'); if (l && k >= 0) { l.className = 'ord'; l.textContent = k + 1; } return; }
    if (hide) { if (q.t === 'single' && sel.includes(j)) b.classList.add(q.ok.includes(j) ? 'right' : 'wrong'); else if (sel.includes(j)) b.classList.add('sel'); else b.classList.add('dim'); return; }
    if (sel.includes(j)) b.classList.add('sel');
    if (q.ok.includes(j)) b.classList.add('right'); else if (sel.includes(j)) b.classList.add('wrong'); else b.classList.add('dim'); });
}
/* рядок «правильно: …» для відповідності й послідовності (a — відповідь учня, для розбору) */
function ansLine(q, a) {
  const L2 = j => lab(q, j, q.order.indexOf(j));
  if (q.t === 'match') return `<div>Правильно: ${q.left.map((l, i) => rowLet(q) ? `${l} — ${MLB(q)[q.order.indexOf(q.ok[i])]}` : `${i + 1} — ${L2(q.ok[i])}`).join(', ')}</div>`;
  if (q.t === 'seq') return `${a && a.length === 4 ? `<div>Ваш порядок: ${a.map(L2).join(' → ')}</div>` : a ? '<div>Послідовність не завершено.</div>' : ''}<div>Правильний порядок: ${q.opts.map((o, j) => L2(j)).join(' → ')}</div>`;
  return '';
}

/* ---------- тести (без підказок; бали рахує сервер) ---------- */
const Test = {
  /* ліміт часу (хв) — QUIZ.tests[id].minutes; початок — на телефоні (tstart_) і на сервері (op tstart) */
  started() { return store.get('tstart_' + this.id, null); },
  begin() {
    if (this.started()) return;
    store.set('tstart_' + this.id, Date.now()); store.set('texits_' + this.id, 0);
    Net.send('tstart', { test: this.id });
  },
  leftSec() { const m = this.T.minutes; return m ? Math.ceil((this.started() + m * 60000 - Date.now()) / 1000) : null; },
  stopClock() { clearInterval(this.clk); this.clk = null; },
  submit(auto) {
    this.stopClock();
    const answers = this.T.tasks.map(t => this.ans[t.n] == null ? null : this.ans[t.n]);
    const st = this.started(), sec = st ? Math.round((Date.now() - st) / 1000) : null;
    store.set('draft_' + this.id, null); store.set('tstart_' + this.id, null);
    Net.send('test', { test: this.id, answers, sec, exits: store.get('texits_' + this.id, 0), auto: !!auto });
    this.pending(auto);
  },
  open(id) {
    this.id = id; this.T = QUIZ.tests[id];
    if (store.get('queue', []).some(x => x.op === 'test' && x.test === id)) return this.pending();
    const d = store.get('draft_' + id, null), r = U.prog()[id];
    if (d) { this.ans = d; if (this.started() && this.leftSec() !== null && this.leftSec() <= 0) return this.submit(true); return this.render(); }
    if (r && r.pts != null) return this.result(r);
    this.ans = {}; this.render();
  },
  intro() {
    const T = this.T, n = k => T.tasks.filter(t => t.t === k).length;
    return `<div class="card tintro"><h2>${esc(T.name)}</h2><p>${T.tasks.length} завдань, як на НМТ: ${n('single')} — одна правильна відповідь, ${n('match')} — відповідність, ${n('seq')} — послідовність, ${n('three')} — три з семи.
      Бали — за правилами НМТ.${this.id === 't1' ? ' Щоб отримати допуск до Тесту 2, потрібно <b>75 %</b> балів.' : ''}</p>
      ${T.minutes ? `<p><b>На тест — ${T.minutes} хвилин.</b> Час рахується від першого відкриття тесту й іде, навіть коли ви закриваєте сторінку. Коли час мине, відповіді надішлються самі.</p>` : ''}
      <p class="cap">Підказок під час тесту немає. Відповіді зберігаються на телефоні. Учитель бачить, скільки часу тривав тест і скільки разів ви виходили зі сторінки.</p></div>`;
  },
  render() {
    const T = this.T;
    const nav = T.tasks.map((t, k) => `<a href="#" class="nv${this.done(t) ? ' on' : ''}" data-k="${k}">${t.n}</a>`).join('');
    this.begin(); this.stopClock();
    app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Назад</button><span class="ttl">${esc(T.name)}</span>${T.minutes ? '<span class="tm" id="ttm"></span>' : ''}</div></div>
      <div class="wrap">${this.intro()}<div class="tnav stk" id="tnav">${nav}</div>${T.tasks.map((t, k) => this.task(t, k)).join('')}
      <div class="tsend"><div class="cap" id="tleft"></div><button class="btn" id="tsub">Надіслати відповіді</button></div><div class="dlg" id="dlg" hidden></div></div>`;
    wireGo(); window.scrollTo(0, 0);
    document.getElementById('tnav').onclick = e => { const a = e.target.closest('.nv'); if (!a) return; e.preventDefault();
      document.getElementById('tk' + a.dataset.k).scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    T.tasks.forEach((t, k) => this.wire(t, k));
    document.getElementById('tsub').onclick = () => this.confirm();
    this.left();
    if (T.minutes) {
      const tick = () => {
        const s = this.leftSec(), el = document.getElementById('ttm');
        if (!el) return this.stopClock();
        el.textContent = '⏱ ' + Math.floor(Math.max(0, s) / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
        el.classList.toggle('warn', s <= 300);
        if (s <= 0) this.submit(true);
      };
      tick(); this.clk = setInterval(tick, 1000);
    }
  },
  done(t) { const a = this.ans[t.n]; return t.t === 'match' ? !!a && a.every(x => x !== null) : t.t === 'single' ? a != null : !!a && a.length === (t.t === 'three' ? 3 : 4); },
  task(t, k) {
    const a = this.ans[t.n];
    let body;
    if (t.t === 'match') {
      const sel = a || [null, null, null, null];
      body = mlist(t, [...t.opts.keys()]) +
        t.left.map((l, i) => `<div class="mrow"><div class="ml">${mrowHead(t, l, i)}</div><div class="mbtns">${t.opts.map((o, j) =>
          `<button class="mb${sel[i] === j ? ' on' : ''}" data-i="${i}" data-j="${j}">${MLB(t)[j]}</button>`).join('')}</div></div>`).join('');
    } else {
      const sel = t.t === 'single' ? (a == null ? [] : [a]) : (a || []);
      body = t.opts.map((o, j) => { const k2 = sel.indexOf(j);
        return `<button class="tile n${t.oimg ? ' wi' : ''}${k2 >= 0 ? ' sel' : ''}" data-j="${j}"><span class="${t.t === 'seq' && k2 >= 0 ? 'ord' : 'l'}">${t.t === 'seq' && k2 >= 0 ? k2 + 1 : lab(t, j, j)}</span>${optHtml(t, j)}</button>`; }).join('');
      if (t.oimg) body = `<div class="tgrid">${body}</div>`;
      if (t.t !== 'single') body += `<button class="lnk rst" data-r="1">Скинути відповідь</button>`;
    }
    return `<section class="card task" id="tk${k}"><div class="qtype">Завдання ${t.n} · ${TYPE[t.t]}${t.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      ${t.src ? `<div class="quote"><p>${md(t.src)}</p>${t.srccap ? `<div class="src">${esc(t.srccap)}</div>` : ''}</div>` : ''}
      <div class="qtext">${md(t.q).replace(/\n/g, '<br>')}</div>${(t.img || []).map(x => pic(x, 'qi')).join('')}<div class="tiles">${body}</div>${t.cap ? `<div class="cap"><span class="cr">${esc(t.cap)}</span></div>` : ''}</section>`;
  },
  wire(t, k) {
    const el = document.getElementById('tk' + k);
    const re = () => { el.outerHTML = this.task(t, k); this.wire(t, k); store.set('draft_' + this.id, this.ans);
      document.querySelector(`.nv[data-k="${k}"]`).classList.toggle('on', this.done(t)); this.left(); };
    el.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; const j = +b.dataset.j;
      if (t.t === 'single') this.ans[t.n] = j;
      else { const s = this.ans[t.n] || [], i = s.indexOf(j); if (i >= 0) s.splice(i, 1); else if (s.length < (t.t === 'three' ? 3 : 4)) s.push(j); this.ans[t.n] = s; }
      re(); });
    el.querySelectorAll('.mb').forEach(b => b.onclick = () => { const s = this.ans[t.n] || [null, null, null, null]; s[+b.dataset.i] = +b.dataset.j; this.ans[t.n] = s; re(); });
    const r = el.querySelector('.rst'); if (r) r.onclick = () => { delete this.ans[t.n]; re(); };
  },
  left() { const n = this.T.tasks.filter(t => !this.done(t)).length; document.getElementById('tleft').textContent = n ? `Без відповіді: ${n}` : 'Відповіді є на всі завдання.'; },
  confirm() {
    const n = this.T.tasks.filter(t => !this.done(t)).length, d = document.getElementById('dlg');
    d.hidden = false;
    d.innerHTML = `<div class="dlg-in"><h3>Надіслати відповіді?</h3><p>${n ? `Без відповіді залишилося <b>${n}</b> завд. — за них буде 0 балів.` : 'Відповіді є на всі завдання.'} Змінити відповіді після надсилання не можна.</p>
      <button class="btn" id="dy">Надіслати</button><button class="btn ghost" id="dn">Повернутися до тесту</button></div>`;
    document.getElementById('dn').onclick = () => { d.hidden = true; };
    document.getElementById('dy').onclick = () => this.submit(false);
  },
  pending(auto) {
    this.stopClock();
    app.innerHTML = `<div class="wrap bz-in"><div class="res"><div>${esc(this.T.name)}</div><div class="big">⏳</div>${auto ? '<div class="gr">Час вийшов — відповіді надіслано автоматично.</div>' : ''}
      <div class="cap">Відповіді збережено. Результат з’явиться, щойно телефон зв’яжеться з сервером.</div></div>
      <div class="sync" id="sync"></div><button class="btn ghost" data-go="home">На головну</button></div>`;
    wireGo(); paintSync(); Net.flush();
  },
  result(r) {
    const t1 = this.id === 't1';
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">${esc(this.T.name)}</span><button class="x" data-go="home" style="margin-left:auto" aria-label="Закрити">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${r.pts} з ${r.max}</div><div class="cap">${r.pct}% балів</div>${t1 ? '' : `${r.grade ? `<div class="gr">Оцінка: <b>${r.grade}</b> (з 12)</div>` : ''}<div class="gr">За шкалою НМТ (100–200)${r.max !== 54 ? ', орієнтовно' : ''}: <b>${esc(r.scale)}</b></div>`}
      ${t1 ? `<div class="gr ${r.pass ? 'okc' : 'badc'}">${r.pass ? (testOpen('t2') ? 'Допуск отримано — Тест 2 відкрито.' : `Допуск отримано. Тест 2 відкриється ${testLock('t2')}.`) : 'Потрібно 75 %. Повторіть матеріал і пройдіть тест ще раз.'}</div>` : ''}</div>
      ${t1 && STRICT && !r.pass ? '<div class="cap" style="text-align:center">Бали за кожним завданням ви побачите, коли отримаєте допуск.</div>' : ''}
      ${r.per && !(t1 && STRICT && !r.pass) ? `<div class="h2" style="margin:8px 0 0">Бали за завданнями</div><div class="tnav">${r.per.map((p, k) => `<span class="nv ${p === maxOf(this.T.tasks[k]) ? 'on' : p ? 'pt' : 'no'}">${k + 1}<i>${p}</i></span>`).join('')}</div>` : ''}
      ${t1 && !r.pass ? (Pause.left('t1') ? pauseBtn('t1') : `<button class="btn" id="retry">Пройти Тест 1 ще раз</button>`) : ''}
      ${t1 && r.pass && testOpen('t2') ? `<button class="btn" data-go="home">До Тесту 2 →</button>` : `<button class="btn ghost" data-go="home">На головну</button>`}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const rb = document.getElementById('retry'); if (rb) rb.onclick = () => { store.set('draft_' + this.id, {}); store.set('tstart_' + this.id, null); this.ans = {}; this.render(); };
    if (t1 && !r.pass && Pause.left('t1')) Pause.watch('t1', () => this.result(r));
  },
};

/* ---------- маршрути ---------- */
const _route = route;
route = function () {
  Blitz.stopClock(); Test.stopClock(); Pause.stop();     // таймери попередньої сторінки не повинні спрацювати на новій
  const h = location.hash.slice(1);
  if (needLogin() && h) { history.replaceState(null, '', location.pathname); return login(); }
  let m = h.match(/^blitz(\d)$/);
  if (m && QUIZ.blitz[m[1]]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.start(n); }
  m = h.match(/^review(\d)$/);
  if (m && QUIZ.blitz[m[1]]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.review(n); }
  m = h.match(/^mini(\d)-(s\d+)$/);
  if (m && MINI[`${m[1]}-${m[2]}`]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.startMini(n, m[2]); }
  m = h.match(/^(t[12])$/);
  if (m) { if (!QUIZ.tests[m[1]] || !testOpen(m[1])) { location.hash = 'home'; return; } return Test.open(m[1]); }
  return _route();
};
window.removeEventListener('hashchange', _route);
window.addEventListener('hashchange', () => route());
route();
Net.flush();

/* ---------- виходи зі сторінки під час бліцу й тесту (учитель бачить їх у таблиці) ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  const h = location.hash.slice(1);
  if (/^blitz\d$/.test(h) && Blitz.n === +h.slice(5) && !Blitz.mini && store.get('bdraft' + Blitz.n, null)) { Blitz.exits = (Blitz.exits || 0) + 1; Blitz.save(); }
  else if (/^t[12]$/.test(h) && store.get('tstart_' + h, null)) store.set('texits_' + h, store.get('texits_' + h, 0) + 1);
});

</script>

йські перемоги (1994 – 2004)", "badges": ["поза програмою"], "paras": ["У **1994 р.** Україна вперше виступила на Олімпійських іграх окремою командою. На зимових іграх у Ліллегаммері фігуристка **Оксана Баюл** здобула першу золоту медаль незалежної України.", "На літніх іграх **1996 р.** в Атланті українці виграли 23 медалі, з них 9 золотих, і посіли дев’яте місце серед усіх команд. Гімнастка **Лілія Подкопаєва** стала абсолютною чемпіонкою, боксер **Володимир Кличко** переміг у надважкій вазі.", "Плавчиня **Яна Клочкова** здобула по дві золоті медалі в Сіднеї (2000) та Афінах (2004).", "Стрибун із жердиною **Сергій Бубка** шість разів ставав чемпіоном світу. Його рекорд 1994 р., 6 м 14 см, протримався двадцять років."], "imgs": [{"key": "wog94", "cap": "Поштовий блок України до зимових Олімпійських ігор 1994 р. Фото: Post of Ukraine / Wikimedia Commons, Public domain"}, {"key": "atl96", "cap": "Поштовий блок України до Олімпійських ігор 1996 р. в Атланті. Фото: Укрпошта / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Спорт", "title": "Футбол, бокс, шахи (1991 – 2004)", "badges": ["поза програмою"], "paras": ["**Футбол.** Київське «**Динамо**», яке тренував **Валерій Лобановський**, у 1999 р. дійшло до півфіналу Ліги чемпіонів. Нападник цієї команди **Андрій Шевченко** перейшов до італійського «Мілана» і у 2004 р. отримав «Золотий м’яч» — нагороду найкращому футболістові Європи.", "**Бокс.** Брати **Віталій і Володимир Клички** стали чемпіонами світу серед професіоналів у надважкій вазі: Віталій уперше — у 1999 р., Володимир — у 2000 р.", "**Шахи.** У 2002 р. вісімнадцятирічний **Руслан Пономарьов** став чемпіоном світу за версією Міжнародної шахової федерації. У 2004 р. чоловіча збірна України вперше виграла шахову олімпіаду."], "imgs": [{"key": "dynamo_st", "cap": "Стадіон «Динамо» імені Валерія Лобановського в Києві. Фото: SergKh78 / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "klychko", "cap": "Володимир (ліворуч) і Віталій Клички з чемпіонськими поясами, 2012 р. Фото: Vergo / Wikimedia Commons, CC0"}]}, {"type": "text", "kicker": "Освіта", "title": "Освіта", "badges": [], "paras": ["Школи поступово переходили на **українську мову** навчання. З’явилися **ліцеї, гімназії, коледжі**, а також приватні школи й приватні університети.", "У **2000 р.** Міністерство освіти запровадило в школах **12-бальну** систему оцінювання. Почався перехід на **12-річне** навчання, але у 2010 р. Верховна Рада його скасувала.", "Учнів і студентів ставало більше, частина студентів навчалася за **контрактом**. Водночас професійно-технічних училищ меншало.", "У **1991 р.** відновила роботу **Києво-Могилянська академія**, тепер як університет. У школах з’являлися комп’ютери й нові підручники з історії України, написані без радянської цензури."], "imgs": [{"key": "mohyla", "cap": "Старий академічний корпус Києво-Могилянської академії. Фото: Anntinomy / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Персоналія", "title": "Леонід Каденюк (1951 – 2018)", "badges": ["НМТ: персоналія"], "paras": ["Леонід Каденюк народився на Буковині, став військовим льотчиком-випробувачем і з 1976 р. готувався до польотів у загоні радянських космонавтів.", "У **листопаді – грудні 1997 р.** він полетів у космос на американському кораблі «**Колумбія**» (місія STS-87) і став **першим космонавтом незалежної України**. Політ тривав майже 16 діб; Каденюк проводив досліди з вирощування рослин у невагомості.", "У 2002 – 2006 рр. Каденюк був народним депутатом.", "У 1990-х рр. багато вчених покинули науку або виїхали за кордон, але українські підприємства й далі будували ракети («Зеніт», «Дніпро») і літаки «**АН**»."], "imgs": [{"key": "kadeniuk", "cap": "Леонід Каденюк перед польотом, 1997 р. Фото: NASA / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Пам’ятки", "title": "Відбудова зруйнованих святинь", "badges": [], "paras": ["У 1930-х рр. радянська влада висадила в повітря **Михайлівський Золотоверхий собор** (XII ст., перебудований у XVIII ст.), а 1941 р., під час німецької окупації Києва, висадили в повітря **Успенський собор Києво-Печерської лаври**; хто саме це зробив, історики досі сперечаються.", "Обидві святині відбудували за збереженими кресленнями, фото й описами: **Михайлівський собор** — у **1997 – 2000 рр.**, **Успенський собор** — у **1998 – 2000 рр.**", "Відбудовані храми — нові споруди на місці старих, а не оригінали. Деякі мозаїки й фрески Михайлівського собору досі зберігаються в Москві та Санкт-Петербурзі."], "imgs": [{"key": "michael_old", "cap": "Михайлівський Золотоверхий собор до знищення, фото 1914 р. Фото: D. Markov / Wikimedia Commons, Public domain"}, {"key": "uspensky_now", "cap": "Відбудований Успенський собор Лаври. Фото: George Chernilevsky / Wikimedia Commons, Public domain"}]}, {"type": "defs", "title": "Релігійне життя: поліконфесійність", "badges": ["НМТ: поняття"], "items": [{"name": "Відродження", "paras": ["Після десятиліть атеїстичної політики люди знову почали масово ходити до храмів. Громадам повертали храми, будували нові.", "В Україні діяло понад сто конфесій. **Поліконфесійність** — існування в країні багатьох рівноправних релігійних течій і церков."], "img": null}, {"name": "Найбільші церкви", "paras": ["**Православні**: УПЦ (МП), УПЦ КП, УАПЦ.", "**Українська греко-католицька** (УГКЦ) — переважно на заході.", "**Римсько-католицька** — на заході й Правобережжі.", "Протестанти: баптисти, п’ятидесятники, адвентисти."], "img": null}, {"name": "Інші", "paras": ["Мусульмани (передусім кримські татари), юдеї.", "Нові релігійні рухи й секти. У 1993 р. «**Біле братство**» оголосило «кінець світу» й намагалося захопити Софійський собор у Києві."], "img": null}], "note": null}, {"type": "text", "kicker": "Церква", "title": "Розкол православ’я (1990 – 1995)", "badges": [], "paras": ["**Українська автокефальна православна церква** (УАПЦ) відновила діяльність 1990 р.", "**Українська православна церква Московського патріархату** (УПЦ МП) з 1990 р. мала самоврядування, але підпорядковувалася Москві. У 1992 р. її митрополит **Філарет** попросив для неї **автокефалії** (незалежності). Москва відмовила й усунула Філарета з посади (а 1997 р. позбавила сану).", "У **червні 1992 р.** частина УПЦ МП на чолі з Філаретом і частина УАПЦ об’єдналися в **Українську православну церкву Київського патріархату** (УПЦ КП). У 1995 р. її очолив Філарет.", "Три православні церкви ворогували між собою, сперечалися за храми. Вселенський патріарх не визнавав незалежних церков аж до 2018 р. (див. частину 2)."], "imgs": [{"key": "filaret", "cap": "Філарет (Денисенко), патріарх Київський УПЦ КП з 1995 р. Фото: Håkan Henriksson (Narking) / Wikimedia Commons, CC BY 3.0"}]}, {"type": "text", "kicker": "Персоналія", "title": "Любомир Гузар (1933 – 2017)", "badges": ["НМТ: персоналія"], "paras": ["Любомир Гузар народився у Львові. У 1944 р. його родина емігрувала; він виріс і навчався в США, а 1958 р. став священником УГКЦ.", "У **1993 р.** Гузар повернувся в Україну. У **2001 р.** він очолив **Українську греко-католицьку церкву** і став кардиналом. Того ж року він приймав у Києві та Львові Папу Римського **Івана Павла II**.", "За Гузара резиденцію глави УГКЦ перенесли зі Львова до **Києва** (2005), а парафії церкви з’явилися по всій Україні. У 2011 р. він добровільно залишив посаду через похилий вік.", "Гузара поважали люди різних віросповідань: він закликав до порядності, чесності в політиці й примирення. Помер 2017 р."], "imgs": [{"key": "husar", "cap": "Любомир Гузар. Фото: Водник / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "Церква", "title": "Візит Папи Римського (червень 2001 р.)", "badges": [], "paras": ["**23 – 27 червня 2001 р.** Україну відвідав Папа Римський **Іван Павло II**. Він служив меси в Києві та Львові.", "У Львові Папа проголосив блаженними (беатифікував) **28 мучеників УГКЦ**, загиблих за радянської та нацистської влади, серед них — єпископів, священників, черниць.", "Для греко-католиків і римо-католиків України цей візит став великою підтримкою. Московський патріархат виступив проти нього."], "imgs": [{"key": "s155_image155", "cap": "Іван Павло II під час візиту в Україну, 2001 р."}]}]}, {"id": "s10", "num": "X", "title": "Узагальнення", "sub": "Влада в 1991 – 2005 рр., поняття, що часто плутають на НМТ, стрічки часу", "cover": {"key": "s019_image17", "cap": ""}, "cards": [{"type": "table", "title": "Хто керував державою (1991 – 2005)", "rows": [["Посада", "1991 – 1994", "1994 – 1999", "1999 – 2005"], ["Президент", "**Леонід Кравчук**", "**Леонід Кучма**", "**Леонід Кучма** (обраний удруге 1999 р.)"], ["Голова Верховної Ради", "Іван Плющ", "Олександр Мороз (1994 – 1998), Олександр Ткаченко (1998 – 2000)", "Іван Плющ (2000 – 2002), Володимир Литвин (2002 – 2006)"], ["Прем’єр-міністр", "Вітольд Фокін, Леонід Кучма, Юхим Звягільський (в. о.)", "Віталій Масол, Євген Марчук, Павло Лазаренко, Валерій Пустовойтенко", "**Віктор Ющенко** (1999 – 2001), Анатолій Кінах, Віктор Янукович (2002 – 2005)"], ["Вибори до Ради", "—", "1994 (мажоритарна), 1998 (змішана)", "2002 (змішана)"]]}, {"type": "table", "title": "Два президенти: головні події і проблеми", "rows": [["Президент", "Головні події", "Проблеми, що лишилися"], ["**Леонід Кравчук** (1991 – 1994)", "Україна здобула незалежність мирно, її визнав світ. Створено армію, затверджено державні символи, ухвалено закон про громадянство. Почато ядерне роззброєння.", "Уряд не зупинив падіння виробництва й гіперінфляцію. Повноважень Президента й Ради не розмежовано. Нової Конституції не ухвалено."], ["**Леонід Кучма** (1994 – 2005)", "Ухвалено Конституцію (1996), запроваджено гривню. Підписано договір з Росією про кордони (1997), Україна вступила до Ради Європи. З 2000 р. економіка зростала.", "Великі підприємства перейшли до олігархів, корупція поширилася. Влада тиснула на журналістів і опозицію. Влада сфальсифікувала вибори 2004 р., і почалася Помаранчева революція."]]}, {"type": "table", "title": "Поняття теми", "rows": [["Поняття", "Значення"], ["Корупція", "Використання посади для особистого збагачення: хабарі, «відкати», рішення на користь «своїх»."], ["Тіньова економіка", "Господарська діяльність, яку приховують від держави, щоб не платити податків, і якої немає в офіційній статистиці."], ["Олігарх", "Власник великого капіталу, який впливає на владу й за допомогою влади примножує свої статки."], ["Помаранчева революція", "Масові мирні протести в листопаді – грудні 2004 р. проти фальсифікації виборів Президента; завершилися перемогою В. Ющенка в переголосуванні."], ["Поліконфесійність", "Існування в країні багатьох рівноправних релігійних течій і церков."]]}, {"type": "cols", "title": "Що часто плутають", "badges": [], "intro": null, "blocks": [{"h": "Дати й події", "paras": ["**Збройні Сили** Верховна Рада створила законами 6 грудня 1991 р. А 24 серпня 1991 р. вона лише підпорядкувала собі військові частини.", "До програми НАТО «**Партнерство заради миру**» Україна приєдналася 1994 р., до **Ради Європи** вступила 1995 р., а до **СОТ** — аж 2008 р. (про це — у частині 2).", "**Конституцію** ухвалено 28 червня 1996 р., а **гривню** запроваджено у вересні того самого року.", "**Кучму** обрали Президентом у **липні 1994 р.**, а вдруге — у листопаді 1999 р."]}, {"h": "Люди й поняття", "paras": ["**Ющенко** спершу очолював Національний банк, потім був прем’єр-міністром (1999 – 2001) і лише 2005 р. став Президентом.", "**Кучма** був прем’єр-міністром у 1992 – 1993 рр., а Президентом — у 1994 – 2005 рр.", "**Гузар** очолював **УГКЦ**, а не православну церкву. Православну церкву Київського патріархату очолював **Філарет**.", "**Каденюк** полетів у космос на американському шатлі, а не на радянському кораблі.", "**Поліконфесійність** означає, що в країні багато релігій і церков, а не партій."]}]}, {"type": "tl_periods", "title": "Стрічка часу: влада в 1991 – 2005 рр.", "note": "Сірі смуги без підпису: прем’єр-міністри Звягільський (в. о.), Масол, Марчук. Жовта смужка — Конституційний договір (1995 – 1996). Пунктир 2004 — Помаранчева революція. Шкала часу пропорційна.", "x_from": 1991, "x_to": 2005.3, "ticks": [[1991, "1991"], [1993, "1993"], [1995, "1995"], [1997, "1997"], [1999, "1999"], [2001, "2001"], [2003, "2003"], [2005, "2005"]], "events": [[1994.53, "липень 1994"], [1996.49, "28.06.1996"], [2004.85, "2004"]], "prog": [], "rows": [{"name": "Президент", "segs": [{"a": 1991.92, "b": 1994.53, "color": "#e97132", "sub": "Л. Кравчук"}, {"a": 1994.53, "b": 2005.06, "color": "#5b93bd", "sub": "Л. Кучма"}]}, {"name": "Голова Ради", "segs": [{"a": 1991.92, "b": 1994.36, "color": "#9c8b7a", "sub": "І. Плющ"}, {"a": 1994.36, "b": 1998.55, "color": "#e8857c", "sub": "О. Мороз"}, {"a": 1998.55, "b": 2000.08, "color": "#c9824f", "sub": "Ткаченко"}, {"a": 2000.08, "b": 2002.4, "color": "#9c8b7a", "sub": "І. Плющ"}, {"a": 2002.4, "b": 2005.3, "color": "#6ea8c9", "sub": "В. Литвин"}]}, {"name": "Прем’єр-міністр", "segs": [{"a": 1991.0, "b": 1992.8, "color": "#9c8b7a", "sub": "Фокін"}, {"a": 1992.8, "b": 1993.72, "color": "#5b93bd", "sub": "Кучма"}, {"a": 1993.72, "b": 1994.5, "color": "#a6a6a6", "sub": ""}, {"a": 1994.5, "b": 1995.25, "color": "#a6a6a6", "sub": ""}, {"a": 1995.45, "b": 1996.4, "color": "#a6a6a6", "sub": ""}, {"a": 1996.4, "b": 1997.55, "color": "#c9824f", "sub": "Лазаренко"}, {"a": 1997.55, "b": 1999.97, "color": "#a6a6a6", "sub": "Пустовойтенко"}, {"a": 1999.97, "b": 2001.32, "color": "#e97132", "sub": "Ющенко"}, {"a": 2001.35, "b": 2002.88, "color": "#a6a6a6", "sub": "Кінах"}, {"a": 2002.88, "b": 2005.0, "color": "#6ea8c9", "sub": "Янукович"}]}, {"name": "Документи", "segs": [{"a": 1995.44, "b": 1996.49, "color": "#d9b26f", "sub": ""}, {"a": 1996.49, "b": 2005.3, "color": "#e07f36", "sub": "Конституція 1996 р."}]}]}, {"type": "tl_events", "title": "Стрічка часу: події 1991 – 2004 рр.", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "8.10.1991", "name": "Громадянство", "desc": "«нульовий варіант»", "color": "#e97132", "prog": false}, {"year": "6.12.1991", "name": "Збройні Сили", "desc": "закони про оборону й армію", "color": "#e97132", "prog": true}, {"year": "1992", "name": "Купони, символи", "desc": "прапор, герб, гімн", "color": "#a9dda0", "prog": false}, {"year": "липень 1994", "name": "Вибори", "desc": "Л. Кучма — Президент", "color": "#5b93bd", "prog": true}, {"year": "1995", "name": "Рада Європи", "desc": "вступ України", "color": "#6ea8c9", "prog": true}, {"year": "28.06.1996", "name": "Конституція", "desc": "України", "color": "#e97132", "prog": true}, {"year": "вересень 1996", "name": "Гривня", "desc": "грошова реформа", "color": "#a9dda0", "prog": true}, {"year": "2000 – 2001", "name": "Протести", "desc": "«Україна без Кучми»", "color": "#e05a47", "prog": false}, {"year": "жовтень – грудень 2004", "name": "Помаранчева", "desc": "революція", "color": "#5b93bd", "prog": true}]}]}]}, {"id": "p2", "num": 2, "title": "Незалежна Україна (1991 – 2022)", "part": "Частина 2. Творення нової України", "sub": "2005 – 2022 рр.: Ющенко, Янукович, Революція Гідності, війна з Росією, реформи, Зеленський, 24 лютого 2022 р.", "cover": {"key": "nebesna_sotnia", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Творення нової України»", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **2008 р.** — вступ України до Світової організації торгівлі", "• **січень 2010 р.** — обрання Віктора Януковича Президентом", "• **листопад 2013 – лютий 2014 р.** — Революція Гідності", "• **червень 2014 р.** — обрання Петра Порошенка Президентом", "• **2014 р.** — підписання Угоди про асоціацію з ЄС", "• **вересень 2014 р., лютий 2015 р.** — Мінські домовленості"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналія (портрет)", "light": false}, {"k": "p", "paras": ["• **Петро Порошенко** — Президент України (2014 – 2019)", "• для повторення (тема 31): **Віктор Ющенко**, **Леонід Кучма**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **Євромайдан, Революція Гідності, Небесна Сотня**", "• **анексія, сепаратизм, антитерористична операція (АТО), тимчасово окупована територія, кіборг**", "• **волонтерський рух, громадянське суспільство, люстрація, безвізовий режим, екуменізм**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Зміст теми", "light": false}, {"k": "p", "paras": ["• суспільно-політичне життя 2005 – 2013 рр.; авторитарний режим В. Януковича", "• Революція Гідності; окупація Криму; російсько-українська війна", "• добровольчі батальйони й волонтери; реакція світу; спроби мирного врегулювання", "• економіка; євроінтеграція; культура й духовне життя"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 32. Розділ про події після 2019 р. — поза програмою."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Україна у 2005 – 2010 рр.", "sub": "Уряд Тимошенко, розкол «помаранчевих», газові війни, політичні кризи, СОТ, світова криза", "cover": {"key": "s079_image75", "cap": ""}, "cards": [{"type": "text", "kicker": "2005 рік", "title": "Уряд Юлії Тимошенко (лютий – вересень 2005 р.)", "badges": [], "paras": ["Прем’єр-міністром Ющенко призначив **Юлію Тимошенко**. Уряд підвищив пенсії, зарплати працівникам бюджетних установ і допомогу при народженні дитини, скасував пільги для вільних економічних зон, почав боротися з контрабандою.", "Тимошенко обіцяла переглянути результати нечесної приватизації. Але держава повторно продала лише «**Криворіжсталь**»: у жовтні 2005 р. її купила компанія Mittal Steel за **24,2 млрд грн** — у шість разів дорожче, ніж у 2004 р.", "Навесні 2005 р. різко подорожчали м’ясо, цукор, бензин. Уряд намагався стримувати ціни наказами й перевірками, і це посилило суперечки в команді Ющенка."], "imgs": [{"key": "s081_image76", "cap": "«Криворіжсталь»: найуспішніша приватизація в історії України (кадр телесюжету 2005 р.)"}]}, {"type": "text", "kicker": "2005 рік", "title": "Розкол «помаранчевих» (вересень 2005 р.)", "badges": [], "paras": ["Улітку 2005 р. Тимошенко й секретар Ради національної безпеки й оборони **Петро Порошенко** звинувачували одне одного в корупції. **8 вересня 2005 р.** Ющенко звільнив уряд Тимошенко.", "Щоб Рада затвердила новим прем’єр-міністром **Юрія Єханурова**, Ющенко підписав **Меморандум порозуміння** з опозицією на чолі з Януковичем. Президент пообіцяв не переслідувати тих, хто фальсифікував вибори 2004 р.", "Багато виборців сприйняли меморандум як зраду ідеалів Майдану. Довіра до Ющенка почала падати."], "imgs": [{"key": "s087_image80", "cap": "Президент Віктор Ющенко звертається до громадян"}]}, {"type": "text", "kicker": "Газові війни", "title": "Перша «газова війна» (січень 2006 р.)", "badges": [], "paras": ["Наприкінці 2005 р. «Газпром» зажадав підвищити ціну газу для України майже вп’ятеро — з 50 до 230 доларів за тисячу кубометрів. **1 січня 2006 р.** Росія зменшила постачання газу.", "**4 січня** сторони домовилися: Україна купуватиме газ за 95 доларів через посередника — компанію «**РосУкрЕнерго**», справжні власники якої тоді були невідомі.", "Відтоді Росія тиснула на Україну, користуючись її залежністю від російського газу."], "imgs": [{"key": "s083_image77", "cap": "Газовий лічильник — символ «газових війн»"}]}, {"type": "generic", "title": "Вибори 2006 р. і «антикризова коаліція»", "badges": [], "blocks": [{"k": "img", "key": "nu_seats2006", "cap": ""}, {"k": "muted", "paras": ["Склад Ради після виборів 2006 р. Власна діаграма за даними ЦВК (укр. Вікіпедія)."]}, {"k": "sep"}, {"k": "p", "paras": ["З **1 січня 2006 р.** набула чинності **політична реформа**: відтоді уряд формувала **коаліція** депутатських фракцій у Раді. Вибори **26 березня 2006 р.** вперше відбулися за **пропорційною** системою (бар’єр 3 %).", "Перемогла **Партія регіонів**. «Помаранчеві» — Блок Юлії Тимошенко (БЮТ), «Наша Україна» і соціалісти — мали більшість, але не домовилися, хто очолить Раду. Тоді лідер соціалістів **Олександр Мороз** об’єднався з Партією регіонів і комуністами та став головою Ради.", "Так виникла «**антикризова коаліція**», а прем’єр-міністром у серпні 2006 р. став **Віктор Янукович**."], "italic": false}]}, {"type": "defs", "title": "Розпуск Ради (2007)", "badges": [], "items": [{"name": "Закон про Голодомор", "paras": ["**28 листопада 2006 р.** Рада за наполяганням Ющенка ухвалила закон, який визнав **Голодомор 1932 – 1933 рр. геноцидом** українського народу."], "img": null}, {"name": "Переходи депутатів", "paras": ["Узимку 2007 р. депутати від БЮТ і «Нашої України» почали переходити до коаліції Януковича.", "Коаліція наближалася до **300** голосів — стільки потрібно, щоб змінювати Конституцію."], "img": null}, {"name": "Розпуск", "paras": ["**2 квітня 2007 р.** Ющенко указом розпустив Раду. Партія регіонів вважала указ незаконним.", "Депутати від БЮТ і «Нашої України» склали мандати, і Рада втратила повноваження: у ній лишилося менше ніж 300 депутатів.", "Президент, прем’єр-міністр і голова Ради домовилися провести позачергові вибори **30 вересня 2007 р.**"], "img": null}], "note": null}, {"type": "generic", "title": "Вибори 2007 р. і уряд Тимошенко", "badges": [], "blocks": [{"k": "img", "key": "nu_seats2007", "cap": ""}, {"k": "muted", "paras": ["Склад Ради після виборів 2007 р. Власна діаграма за даними ЦВК (укр. Вікіпедія)."]}, {"k": "sep"}, {"k": "p", "paras": ["На виборах **30 вересня 2007 р.** за пропорційною системою Партія регіонів знову отримала найбільше голосів, але БЮТ і «Наша Україна – Народна самооборона» разом здобули **228** місць.", "Головою Ради став **Арсеній Яценюк**, прем’єр-міністром — **Юлія Тимошенко**. Коаліція мала перевагу лише у два голоси.", "У грудні 2008 р. до коаліції приєднався **Блок Литвина**, і **Володимир Литвин** став головою Ради. Соціалісти Мороза до Ради не потрапили."], "italic": false}]}, {"type": "text", "kicker": "Економіка", "title": "Вступ до Світової організації торгівлі (2008)", "badges": ["НМТ: дата"], "paras": ["**16 травня 2008 р.** Україна стала членом **Світової організації торгівлі (СОТ)**. Заявку на вступ до Генеральної угоди з тарифів і торгівлі (**ГАТТ**), з якої в 1995 р. постала СОТ, Україна подала ще в 1993 р.; переговори тривали майже 15 років. У 2005 – 2006 рр. ЄС і США визнали Україну країною з ринковою економікою.", "Члени СОТ не можуть обмежувати торгівлю між собою високими митами. Українським виробникам стало легше продавати метал, зерно, олію на світових ринках.", "Водночас іноземні товари стали конкурувати з українськими на внутрішньому ринку.", "У квітні 2008 р. на саміті в Бухаресті НАТО не надало Україні **Плану дій щодо членства**, але заявило, що Україна стане членом Альянсу."], "imgs": [{"key": "s090_image82", "cap": "Емблема Світової організації торгівлі"}]}, {"type": "defs", "title": "Світова фінансова криза 2008 р.", "badges": ["поза програмою"], "items": [{"name": "Іпотека в США", "paras": ["На початку 2000-х рр. американські банки охоче видавали **іпотечні кредити** навіть людям з малими доходами. Ціни на будинки росли, і здавалося, що ризику немає.", "Банки перепродували ці борги один одному у вигляді цінних паперів."], "img": null}, {"name": "Крах банків", "paras": ["У 2006 – 2007 рр. ціни на житло почали падати, мільйони позичальників перестали сплачувати кредити. Банки, які купили їхні борги, зазнали величезних збитків.", "**15 вересня 2008 р.** збанкрутував великий інвестиційний банк **Lehman Brothers**. Банки в усьому світі перестали позичати гроші один одному."], "img": null}, {"name": "Удар по Україні", "paras": ["Без кредитів підприємства скорочували виробництво, тож у світі різко впав попит на **метал** — найважливіший товар українського експорту.", "Українські банки самі брали кредити за кордоном і понад половину позик видавали **в доларах**. Коли іноземні гроші перестали надходити, криза охопила й Україну."], "img": null}], "note": null}, {"type": "text", "kicker": "Економіка", "title": "Криза в Україні (2008 – 2009)", "badges": ["поза програмою"], "paras": ["Восени 2008 р. **гривня знецінилася**: долар коштував уже не 5, а 8 гривень. Той, хто взяв кредит у доларах, мусив віддавати банкам у півтора раза більше гривень, і багато хто не зміг платити.", "Вкладники почали масово забирати депозити. Національний банк заборонив достроково знімати депозити й позичав банкам гроші, а кілька банків держава викупила. Україна отримала кредит **Міжнародного валютного фонду** на 16,4 млрд доларів.", "Заводи скорочували виробництво, зросло безробіття. У **2009 р.** ВВП зменшився на **15,1 %**. Це було одне з найбільших падінь у Європі."], "imgs": [{"key": "chart_2_14", "cap": "Приріст реального ВВП до попереднього року, % (Держстат)."}]}, {"type": "text", "kicker": "Газові війни", "title": "Друга «газова війна» (січень 2009 р.)", "badges": [], "paras": ["Наприкінці 2008 р. Україна й Росія не домовилися про ціну газу на 2009 р. **1 січня 2009 р.** Росія припинила постачання газу для України, а **7 січня** — і транзит до Європи. Посеред зими без газу залишилися Болгарія, Словаччина та інші країни.", "**19 січня 2009 р.** прем’єр-міністри Тимошенко й Путін домовилися про ціну, а «Нафтогаз» і «Газпром» підписали контракти на 10 років. Від посередника «РосУкрЕнерго» сторони відмовилися, але ціна зросла, а Україна мала платити штраф, якщо купувала менше газу, ніж передбачав контракт («**бери або плати**»).", "У 2011 р. суд визнав Тимошенко винною в перевищенні повноважень під час укладення цих контрактів (див. розділ II)."], "imgs": [{"key": "s094_image98", "cap": "Юлія Тимошенко і Володимир Путін після підписання газових угод, 2009 р."}]}]}, {"id": "s2", "num": "II", "title": "Режим Віктора Януковича (2010 – 2013)", "sub": "Вибори 2010 р., Харківські угоди, Податковий майдан, політичні в’язні, мовний закон, вибори 2012 р.", "cover": {"key": "s097_image101", "cap": ""}, "cards": [{"type": "text", "kicker": "Вибори 2010", "title": "Вибори Президента 2010 р.: перший тур (17 січня)", "badges": [], "paras": ["Чинний Президент **Віктор Ющенко** набрав лише **5,5 %** голосів і посів п’яте місце. До другого туру вийшли **Віктор Янукович** і прем’єр-міністерка **Юлія Тимошенко**.", "**Сергій Тігіпко**, який став третім (13 %), у другому турі не підтримав ні Януковича, ні Тимошенко. Ющенко закликав голосувати «проти всіх».", "У **другому турі 7 лютого** Тимошенко отримала на **5,4 млн** голосів більше, ніж у першому, а Янукович — на **3,8 млн**. Проте Тимошенко цього не вистачило: Янукович переміг із результатом **48,95 %** проти **45,47 %**. «Проти всіх» проголосували 4,4 % виборців."], "imgs": [{"key": "chart_2_17", "cap": "Дані ЦВК. Решта кандидатів набрали менше ніж по 1,5 %."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_2010", "label": "Крок 1"}]}, {"type": "text", "kicker": "Режим Януковича", "title": "Влада в руках Президента (2010)", "badges": ["НМТ: дата"], "paras": ["У другому турі **7 лютого 2010 р.** **Віктор Янукович** переміг **Юлію Тимошенко** з перевагою 3,5 %. Спостерігачі визнали вибори загалом чесними.", "У березні 2010 р. Рада змінила правила й дозволила окремим депутатам вступати до коаліції. Так Партія регіонів, комуністи, Блок Литвина й депутати, які перейшли з опозиції, утворили більшість. Прем’єр-міністром став **Микола Азаров**.", "**30 вересня 2010 р.** **Конституційний Суд** скасував політичну реформу 2004 р. Україна знову стала **президентсько-парламентською** республікою, а Янукович отримав більше влади, ніж Ющенко."], "imgs": [{"key": "s096_image99", "cap": "Віктор Янукович і Юлія Тимошенко, кандидати другого туру 2010 р."}]}, {"type": "text", "kicker": "Режим Януковича", "title": "Харківські угоди (квітень 2010 р.)", "badges": [], "paras": ["**21 квітня 2010 р.** Янукович і президент Росії **Дмитро Медведєв** підписали в Харкові угоди: Чорноморський флот Росії міг залишатися в Севастополі ще на 25 років — **до 2042 р.**", "Натомість Росія знижувала ціну газу — щонайбільше на 100 доларів за тисячу кубометрів.", "**27 квітня** Рада ратифікувала угоди. Під час голосування опозиційні депутати кидали в президію яйця й димові шашки.", "Опозиція вважала, що угоди порушують Конституцію: вона забороняє розміщувати іноземні військові бази в Україні, крім тимчасових."], "imgs": [{"key": "s106_image106", "cap": "Уряд Миколи Азарова в сесійній залі Верховної Ради"}]}, {"type": "text", "kicker": "Режим Януковича", "title": "Податковий майдан (листопад 2010 р.)", "badges": [], "paras": ["Восени 2010 р. уряд підготував новий **Податковий кодекс**. Він обмежував спрощену систему оподаткування для дрібних підприємців і давав податківцям більше прав для перевірок.", "У листопаді на Майдан Незалежності вийшли тисячі підприємців з усієї України; вони поставили намети. Протест назвали «**Податковим майданом**».", "Янукович наклав на кодекс вето, і Рада ухвалила його в зміненому вигляді. **3 грудня** наметове містечко розібрали працівники комунальних служб під охороною міліції."], "imgs": [{"key": "s098_image102", "cap": "Наметове містечко «Податкового майдану», листопад 2010 р."}]}, {"type": "text", "kicker": "Режим Януковича", "title": "Політичні в’язні", "badges": [], "paras": ["Наприкінці 2010 р. Служба безпеки затримала колишнього міністра внутрішніх справ **Юрія Луценка**; у 2012 р. суд призначив йому 4 роки позбавлення волі.", "У серпні 2011 р. суд узяв під варту просто в залі засідань **Юлію Тимошенко**, лідерку опозиції. У жовтні 2011 р. той самий суд ув’язнив її на 7 років за газові контракти 2009 р.", "ЄС і США вважали ці вироки **політичним переслідуванням**: влада усувала головних суперників Януковича. У 2013 р. Європейський суд з прав людини визнав арешт Тимошенко незаконним.", "Тимошенко вийшла на волю **22 лютого 2014 р.**, після перемоги Революції Гідності."], "imgs": [{"key": "s099_image103", "cap": "Юлія Тимошенко під час суду, 2011 р."}]}, {"type": "text", "kicker": "Режим Януковича", "title": "Мовний закон і Мовний майдан (2012)", "badges": [], "paras": ["**3 липня 2012 р.** Рада ухвалила закон «**Про засади державної мовної політики**» (автори — депутати Ківалов і Колесніченко). Депутати голосували з порушеннями регламенту.", "Закон дозволяв надавати мові статус **регіональної**, якщо нею розмовляли понад 10 % жителів області чи міста. Так у багатьох регіонах російська мова отримала офіційний статус поряд з українською.", "Люди протестували проти закону біля Українського дому в Києві, у Львові та інших містах («**Мовний майдан**»). Міліція розганяла протестувальників.", "У 2018 р. Конституційний Суд визнав закон неконституційним."], "imgs": [{"key": "s100_image104", "cap": "Протест проти мовного закону: «Де закінчується українська мова, там закінчується Україна»"}]}, {"type": "generic", "title": "Вибори до Верховної Ради 2012 р.", "badges": [], "blocks": [{"k": "img", "key": "nu_seats2012", "cap": ""}, {"k": "muted", "paras": ["Склад Ради після виборів 2012 р. Власна діаграма за даними ЦВК (укр. Вікіпедія)."]}, {"k": "sep"}, {"k": "p", "paras": ["Щоб не програти вибори, правляча коаліція повернула **змішану** систему: половину депутатів знову обирали в округах, решту — за списками (бар’єр 5 %).", "За партійними списками Партія регіонів отримала 30 %, а три опозиційні партії — «**Батьківщина**», **УДАР** Віталія Кличка і «**Свобода**» Олега Тягнибока — разом майже 50 %.", "Але в округах перемогли переважно кандидати від влади та «самовисуванці», які потім підтримали Партію регіонів. Партія регіонів із союзниками знову мала більшість у Раді."], "italic": false}]}, {"type": "text", "kicker": "Режим Януковича", "title": "Причини невдоволення до 2013 р.", "badges": [], "paras": ["**Влада.** Президент підпорядкував собі уряд, суди, прокуратуру, Конституційний Суд. Лідерів опозиції ув’язнили. Податкова служба й міліція тиснули на бізнес і журналістів.", "**«Сім’я».** Найприбутковіші підприємства переходили до людей з оточення сина Президента; цю групу називали «**Сім’єю**». Президент жив у величезній резиденції **Межигір’я** під Києвом. Хабарництво поширилося в усіх органах влади.", "**Економіка й Росія.** Економіка майже не зростала, держава позичала гроші за кордоном. Улітку 2013 р. Росія почала **торговельну війну**: її митники затримували на кордоні українські товари, щоб змусити Україну відмовитися від угоди з ЄС."], "imgs": [{"key": "mezhyhirya", "cap": "Будинок «Хонка» в Межигір’ї, резиденції В. Януковича під Києвом. Знімок зроблено 23 лютого 2014 р., коли після втечі Президента туди прийшли тисячі людей. Фото: Aleksandr Andreiko / Wikimedia Commons, CC BY-SA 2.0"}]}, {"type": "text", "kicker": "Культура", "title": "Культура й історична пам’ять (2005 – 2013)", "badges": [], "paras": ["У 2006 р. уряд створив **Український інститут національної пам’яті**. **28 листопада 2006 р.** Верховна Рада законом визнала **Голодомор 1932 – 1933 рр. геноцидом українського народу**. У 2008 р. в Києві відкрили Меморіал жертв Голодомору.", "У колишньому військовому арсеналі біля Лаври держава створила музейний комплекс «**Мистецький арсенал**». З 2011 р. там щороку відбувається книжковий ярмарок «Книжковий арсенал».", "Найбільше читачів мали романи **Василя Шкляра** «Чорний Ворон» (2009), **Ліни Костенко** «Записки українського самашедшого» (2010), **Сергія Жадана** «Ворошиловград» (2010).", "У 2005 р. Київ приймав пісенний конкурс «Євробачення». У 2012 р. Україна разом з Польщею провела чемпіонат Європи з футболу. Того ж року на Олімпійських іграх у Лондоні боксер **Олександр Усик** здобув золоту медаль."], "imgs": [{"key": "holod_mus", "cap": "Меморіал жертв Голодомору в Києві. Фото: Woycicki / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "arsenal", "cap": "«Мистецький арсенал» у Києві. Фото: Гатерас / Wikimedia Commons, CC BY-SA 4.0"}]}]}, {"id": "s3", "num": "III", "title": "Революція Гідності (листопад 2013 – лютий 2014)", "sub": "Євромайдан, «диктаторські закони», бої на Грушевського й Інститутській, Небесна Сотня", "cover": {"key": "s108_image108", "cap": ""}, "cards": [{"type": "text", "kicker": "Євромайдан", "title": "Привід: відмова від Угоди про асоціацію", "badges": ["НМТ: поняття", "НМТ: дата"], "paras": ["Україна кілька років готувала **Угоду про асоціацію з ЄС** — про політичну співпрацю і вільну торгівлю. Україна та ЄС мали підписати її на саміті у **Вільнюсі 28 – 29 листопада 2013 р.**", "Але **21 листопада 2013 р.** уряд Азарова раптово зупинив підготовку до підписання. Росія перед тим обіцяла кредит і дешевий газ та погрожувала закрити свій ринок.", "Того ж вечора журналіст **Мустафа Найєм** закликав у фейсбуці прийти на Майдан. Так почався «**Євромайдан**» — мирні протести на підтримку європейського вибору. Найактивнішими були студенти."], "imgs": [{"key": "s107_image107", "cap": "Мітинг на підтримку євроінтеграції, Київ, листопад 2013 р."}]}, {"type": "text", "kicker": "Революція Гідності", "title": "Від Євромайдану до Революції Гідності", "badges": ["НМТ: поняття"], "paras": ["У ніч на **30 листопада** спецпідрозділ міліції «Беркут» жорстоко розігнав студентів на Майдані. Частина з них сховалася в Михайлівському соборі.", "**1 грудня** на вулиці Києва вийшли сотні тисяч людей. Люди виступали вже не тільки за зближення з Європою, а й проти свавілля влади. Тому події від цього дня називають **Революцією Гідності**.", "**8 грудня** відбувся «Марш мільйона», а на Бессарабській площі протестувальники повалили пам’ятник Леніну. **11 грудня** силовики вночі намагалися витіснити людей з Майдану, але кияни прийшли на допомогу, і штурм не вдався.", "**17 грудня** Янукович у Москві домовився з Путіним про кредит на 15 млрд доларів і знижку на газ."], "imgs": [{"key": "s109_image109", "cap": "Ніч на 11 грудня 2013 р.: протестувальники в касках тримають оборону"}]}, {"type": "text", "kicker": "Революція Гідності", "title": "«Диктаторські закони» і бої на Грушевського", "badges": [], "paras": ["**16 січня 2014 р.** депутати від Партії регіонів і комуністи без обговорення, підняттям рук, ухвалили закони, які обмежували право на мирні зібрання й запроваджували покарання за протести. Їх назвали «**диктаторськими**».", "**19 січня** на **вулиці Грушевського** почалися сутички протестувальників з «Беркутом» і внутрішніми військами. **22 січня** загинули перші протестувальники — **Сергій Нігоян** і **Михайло Жизневський**.", "Протестувальники вимагали відставки уряду, повернення до Конституції 2004 р. і дострокових виборів. У західних і центральних областях вони зайняли будівлі обласних адміністрацій."], "imgs": [{"key": "s111_image111", "cap": "Вулиця Грушевського, січень 2014 р."}]}, {"type": "text", "kicker": "Революція Гідності", "title": "Поступки влади (кінець січня – лютий 2014 р.)", "badges": [], "paras": ["**28 січня** Азаров пішов у відставку, а Рада скасувала більшість «диктаторських законів».", "Почалися переговори про повернення до **Конституції 2004 р.** Рада ухвалила закон про амністію затриманим протестувальникам за умови, що вони залишать адміністративні будівлі.", "**16 лютого** протестувальники залишили Київську міську адміністрацію й будівлі в областях.", "Здавалося, конфлікт затихає. Але **18 лютого** Партія регіонів відмовилася розглядати зміни до Конституції."], "imgs": [{"key": "s112_image112", "cap": "Протестувальники й силовики на вулиці Грушевського, січень 2014 р."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_maidan", "label": "Крок 1"}]}, {"type": "text", "kicker": "Революція Гідності", "title": "Кривавий лютий (18 – 20 лютого 2014 р.)", "badges": ["НМТ: поняття"], "paras": ["**18 лютого** тисячі людей рушили до Верховної Ради. Біля Маріїнського парку почалися бої протестувальників з «Беркутом» і найманими провладними молодиками («**тітушками**»). Того ж вечора силовики пішли на штурм Майдану; згорів **Будинок профспілок**, де був штаб протесту.", "Протестувальники втримали Майдан. **20 лютого** протестувальники пішли вгору вулицею **Інститутською**, і **снайпери** почали стріляти в них. Того дня загинуло близько **50** людей.", "Загиблих учасників Революції Гідності називають **Небесною Сотнею**. Держава надала звання Героя України понад ста загиблим."], "imgs": [{"key": "s113_image113", "cap": "Майдан у ніч на 19 лютого 2014 р."}, {"key": "s114_image114", "cap": "Протестувальники виносять поранених, вулиця Інститутська, 20 лютого 2014 р."}]}, {"type": "text", "kicker": "Революція Гідності", "title": "Перемога Революції (21 – 27 лютого 2014 р.)", "badges": [], "paras": ["**21 лютого** Янукович і лідери опозиції за посередництва міністрів закордонних справ Німеччини й Польщі підписали угоду про врегулювання кризи. Рада відновила **Конституцію 2004 р.**", "Але того ж вечора Янукович утік з Києва — спершу до Харкова й Донецька, потім до Криму, а звідти за допомогою російських військових — до **Росії**.", "**22 лютого** Верховна Рада 328 голосами постановила, що Янукович **самоусунувся** від виконання обов’язків, і призначила вибори Президента на **25 травня**. Головою Ради й виконувачем обов’язків Президента став **Олександр Турчинов**. Тимошенко вийшла з ув’язнення.", "**27 лютого** Рада призначила прем’єр-міністром **Арсенія Яценюка**."], "imgs": [{"key": "s115_image116", "cap": "Янукович залишає резиденцію, лютий 2014 р. (кадр відеоспостереження)"}, {"key": "s116_image117", "cap": "Олександр Турчинов, голова Верховної Ради"}]}, {"type": "doc", "title": "Постанова Верховної Ради (22 лютого 2014 р.)", "quote": ["Враховуючи, що Президент України В. Янукович **самоусунувся від виконання конституційних повноважень**, що загрожує керованості держави, територіальній цілісності і суверенітету України, масовому порушенню прав і свобод громадян, виходячи з обставин крайньої необхідності, виражаючи суверенну волю Українського народу, Верховна Рада України постановляє:", "1. Встановити, що Президент України В. Янукович **у неконституційний спосіб самоусунувся від здійснення конституційних повноважень** та є таким, що не виконує свої обов’язки.", "2. …призначити **позачергові вибори Президента України на 25 травня 2014 року**."], "source": "Постанова Верховної Ради України № 757-VII від 22 лютого 2014 р. (скорочено)", "comment": ["За постанову проголосували **328** депутатів із 450, серед них і частина фракції Партії регіонів.", "Конституція не описує, що робити, коли Президент залишає посаду й тікає. Тому Рада послалася на «обставини крайньої необхідності». Росія цього рішення не визнала.", "__Слова з документа:__ **самоусунувся** — сам перестав виконувати обов’язки; **суверенна воля народу** — право народу самому вирішувати, хто керує державою."], "img": null}, {"type": "text", "kicker": "Поняття", "title": "Євромайдан, Революція Гідності, Небесна Сотня", "badges": ["НМТ: поняття"], "paras": ["**Євромайдан** — протести, що почалися **21 листопада 2013 р.** після рішення уряду зупинити підготовку до підписання Угоди про асоціацію з ЄС.", "**Революція Гідності** — масові протести **листопада 2013 – лютого 2014 р.** проти корупції, свавілля силовиків і авторитарної влади Януковича та на підтримку європейського вибору України.", "**Небесна Сотня** — загиблі учасники Революції Гідності.", "**Наслідки.** Режим Януковича впав, а сам Янукович утік до Росії.", "Україна знову стала **парламентсько-президентською** республікою.", "Новий уряд підписав **Угоду про асоціацію з ЄС**.", "Росія скористалася зміною влади і почала **агресію проти України** — окупувала Крим."], "imgs": [{"key": "odesa_caric", "cap": "Виставка робіт одеських митців про Євромайдан, Одеса, 9 лютого 2014 р.: плакати й карикатури на В. Януковича. Фото: Yuriy Kvach / Wikimedia Commons, CC BY-SA 3.0"}]}]}, {"id": "s4", "num": "IV", "title": "Окупація Криму (лютий – березень 2014)", "sub": "Захоплення півострова, псевдореферендум, анексія, реакція світу", "cover": {"key": "s118_image120", "cap": ""}, "cards": [{"type": "text", "kicker": "Окупація Криму", "title": "Як Росія захопила Крим", "badges": [], "paras": ["За українським законом, збройна агресія Росії почалася **20 лютого 2014 р.**", "**26 лютого** у Сімферополі кримські татари й українці зібралися на мітинг на підтримку єдності України; їм протистояли проросійські активісти.", "У ніч на **27 лютого** російські спецпризначенці без розпізнавальних знаків («**зелені чоловічки**») захопили будівлі Верховної Ради й уряду Криму. Під їхнім наглядом депутати призначили «прем’єром» проросійського політика **Сергія Аксьонова** й оголосили референдум.", "Російські війська блокували українські військові частини й аеродроми. **1 березня** Рада Федерації Росії дозволила Путіну використати армію в Україні."], "imgs": [{"key": "s118_image119", "cap": "Проросійський мітинг у Севастополі, лютий 2014 р."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_crimea2014", "label": "Крок 1"}]}, {"type": "text", "kicker": "Окупація Криму", "title": "«Референдум» і анексія (березень 2014 р.)", "badges": ["НМТ: поняття"], "paras": ["**16 березня 2014 р.** окупаційна влада під контролем російських військ провела «**референдум**». Українське законодавство й міжнародне право не допускали такого голосування. Окупанти оголосили, що 96,8 % учасників нібито підтримали приєднання до Росії; незалежних спостерігачів не було.", "**18 березня** Путін підписав «договір» про включення Криму до складу Росії. **24 березня** Україна вивела з Криму свої війська, щоб уникнути кровопролиття.", "**Анексія** — насильницьке приєднання однією державою території іншої. Закон України від 15 квітня 2014 р. визнав Крим і Севастополь **тимчасово окупованою територією**."], "imgs": [{"key": "s121_image123", "cap": "Путін і окупаційні «керівники» Криму підписують «договір», 18 березня 2014 р."}]}, {"type": "doc", "title": "Резолюція ГА ООН 68/262 (27 березня 2014 р.)", "quote": ["Генеральна Асамблея… **підтверджує свою відданість суверенітету, політичній незалежності, єдності й територіальній цілісності України** в її міжнародно визнаних кордонах;", "…наголошує, що **референдум**, проведений в Автономній Республіці Крим і місті Севастополі 16 березня 2014 р., **не маючи законної сили, не може бути підставою для будь-якої зміни статусу** Автономної Республіки Крим або міста Севастополя;", "закликає всі держави, міжнародні організації… **не визнавати будь-яку зміну статусу** Автономної Республіки Крим і міста Севастополя на підставі цього референдуму…"], "source": "Резолюція ГА ООН 68/262 (переклад-переказ, скорочено)", "comment": ["Резолюцію підтримали **100** держав, проти проголосували 11, утрималися 58.", "Рада Безпеки ООН подібного рішення ухвалити не змогла: Росія наклала вето.", "__Слова з документа:__ **територіальна цілісність** — недоторканність кордонів; **статус** — правове становище території."], "img": {"key": "s122_image124", "cap": "Голосування за резолюцію: зелений — «за», червоний — «проти», жовтий — утрималися"}}, {"type": "text", "kicker": "Окупація Криму", "title": "Крим під окупацією (з 2014 р.)", "badges": [], "paras": ["**Кримські татари.** Меджліс кримськотатарського народу закликав бойкотувати «референдум». Росія заборонила в’їзд до Криму лідерам кримських татар **Мустафі Джемілєву** і **Рефату Чубарову**.", "**26 квітня 2016 р.** окупаційний «суд» оголосив **Меджліс** «екстремістською організацією» і заборонив його. Окупаційна влада проводить обшуки в домівках кримських татар, активістів ув’язнює; кілька людей зникли безвісти.", "У листопаді 2015 р. Верховна Рада України визнала депортацію 1944 р. **геноцидом кримськотатарського народу**.", "**Життя під окупацією.** Жителів Криму окупаційна влада змушувала брати російські паспорти: без них людина не могла працювати, лікуватися, володіти землею.", "Українські школи, церковні громади й засоби масової інформації окупанти закрили або витіснили з півострова. Режисера **Олега Сенцова** російський суд 2015 р. засудив до 20 років ув’язнення; він вийшов на волю під час обміну у вересні 2019 р.", "Росія призиває кримчан до своєї армії, хоча міжнародне право це забороняє. Десятки тисяч людей переїхали з Криму на материкову Україну."], "imgs": [{"key": "crimtatar_rally", "cap": "Мітинг пам’яті жертв депортації кримських татар у Києві, 18 травня 2014 р. Фото: kaktuse / Wikimedia Commons, CC BY-SA 3.0"}, {"key": "sentsov", "cap": "Олег Сенцов отримує Премію Сахарова в Європейському парламенті, Страсбург, 2019 р. Фото: European Parliament / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "defs", "title": "Реакція світу на агресію Росії", "badges": [], "items": [{"name": "Санкції", "paras": ["З березня 2014 р. США, ЄС, Канада, Японія та інші держави запровадили **санкції** проти Росії: заборонили в’їзд причетним до агресії й заморозили їхні рахунки, обмежили торгівлю зброєю, кредитування й продаж технологій."], "img": null}, {"name": "Ізоляція", "paras": ["Провідні держави виключили Росію з «Великої вісімки» (G8 знову стала G7).", "Парламентська асамблея Ради Європи позбавила російську делегацію права голосу."], "img": null}, {"name": "Посередники", "paras": ["У березні 2014 р. Організація з безпеки і співробітництва в Європі (**ОБСЄ**) відправила в Україну спостережну місію.", "Лідери Німеччини, Франції, України й Росії почали переговори в «**нормандському форматі**» (червень 2014 р.)."], "img": null}], "note": null}]}, {"id": "s5", "num": "V", "title": "Війна на Донбасі (2014 – 2015)", "sub": "АТО, добровольці й волонтери, Іловайськ, Донецький аеропорт, Дебальцеве, Мінські домовленості", "cover": {"key": "dap_ruins", "cap": ""}, "cards": [{"type": "text", "kicker": "Війна на Донбасі", "title": "Початок війни (квітень – травень 2014 р.)", "badges": ["НМТ: поняття"], "paras": ["У березні 2014 р. в Донецьку, Луганську, Харкові, Одесі та інших містах сходу й півдня відбулися проросійські мітинги; до них долучалися приїжджі з Росії.", "**12 квітня** озброєний загін **Ігоря Гіркіна**, колишнього офіцера російських спецслужб, захопив **Слов’янськ**. Бойовики захоплювали адміністрації й відділки міліції в містах Донбасу. **14 квітня** Україна почала **антитерористичну операцію (АТО)**.", "**2 травня** в Одесі сутички між прихильниками єдності України і проросійськими активістами закінчилися пожежею в Будинку профспілок; загинули 48 людей.", "**11 травня** бойовики провели псевдореферендуми про «незалежність» так званих «**ДНР**» і «**ЛНР**»."], "imgs": [{"key": "s124_image126", "cap": "Проросійський мітинг у Донецьку, березень 2014 р."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_war1", "label": "Крок 1"}]}, {"type": "text", "kicker": "Політика", "title": "Позачергові вибори Президента (25 травня 2014 р.)", "badges": [], "paras": ["Після втечі Януковича Верховна Рада призначила позачергові вибори на **25 травня 2014 р.** **Петро Порошенко** набрав **54,7 %** голосів і переміг уже в **першому турі**. Так само в першому турі у 1991 р. переміг Леонід Кравчук.", "Порошенко переміг у всіх областях, де відбулося голосування. В окупованому Криму вибори не проводили, а в більшій частині Донецької і Луганської областей голосування зірвали бойовики.", "Друге місце посіла **Юлія Тимошенко**, яку звільнили з ув’язнення в лютому 2014 р., після перемоги Революції Гідності."], "imgs": [{"key": "chart_2_47", "cap": "Дані ЦВК. Решта кандидатів набрали менше ніж по 2 %."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_2014", "label": "Крок 1"}]}, {"type": "text", "kicker": "Персоналія", "title": "Петро Порошенко (нар. 1965)", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Петро Порошенко народився на Одещині. Він підприємець, заснував кондитерську корпорацію «**Рошен**». З 1998 р. — народний депутат, з 2001 р. — соратник Ющенка, секретар Ради національної безпеки й оборони (2005), міністр закордонних справ (2009 – 2010) і міністр економіки (2012).", "Порошенко підтримав Революцію Гідності. **25 травня 2014 р.** він переміг на виборах у першому турі (54,7 %), **7 червня 2014 р.** склав присягу як **п’ятий Президент України**.", "За його президентства Україна підписала **Угоду про асоціацію з ЄС**, домоглася **безвізового режиму** з ЄС і **томосу** для православної церкви, відбудувала армію. Мінські домовленості не принесли миру. У 2019 р. Порошенко програв вибори."], "imgs": [{"key": "s165_image162", "cap": "Петро Порошенко, п’ятий Президент України"}]}, {"type": "text", "kicker": "Війна на Донбасі", "title": "Наступ сил АТО (червень – липень 2014 р.)", "badges": [], "paras": ["Армія була слабкою після років скорочень. Її підтримали **добровольчі батальйони** — «Айдар», «Азов», «Донбас», «Дніпро-1» та інші; згодом вони ввійшли до Національної гвардії, Збройних Сил і Міністерства внутрішніх справ.", "Сили АТО звільнили **Маріуполь** (13 червня), **Слов’янськ і Краматорськ** (5 липня), **Сєвєродонецьк**, **Лисичанськ**, **Дебальцеве** (липень). Бойовики лишалися в Донецьку й Луганську.", "Росія постачала бойовикам зброю й техніку, а російська артилерія зі своєї території обстрілювала українські війська.", "**17 липня 2014 р.** над Донбасом російський зенітний комплекс «Бук» збив пасажирський «**Боїнг**» рейсу **MH17**: загинули 298 людей. Це встановило міжнародне розслідування."], "imgs": [{"key": "s127_image134", "cap": "Карта бойових дій, квітень – липень 2014 р. (атласна карта з авторської презентації)"}]}, {"type": "map", "title": "", "steps": [{"key": "nu_war2", "label": "Крок 1"}]}, {"type": "text", "kicker": "Суспільство", "title": "Добровольці й волонтери", "badges": ["НМТ: поняття"], "paras": ["**Добровольці.** Тисячі людей пішли на фронт добровольцями. **Добровольчі батальйони** воювали поряд з армією, згодом увійшли до її складу або до Національної гвардії.", "**Волонтери.** **Волонтерський рух** — безоплатна допомога, яку люди надають з власної волі. Волонтери збирали гроші, купували бронежилети, ліки, тепловізори, дрони, лагодили техніку, рятували поранених. Виникли фонди «Повернись живим», «Крила Фенікса» та інші.", "**Громадянське суспільство.** **Громадянське суспільство** — об’єднання громадян, незалежні від держави, які захищають інтереси людей. Після Майдану й з початком війни воно стало значно сильнішим."], "imgs": [{"key": "volunteers", "cap": "Волонтери з Кривого Рогу передають посилки військовим, січень 2015 р. Фото: Viktor Kovalenko / Wikimedia Commons, CC BY-SA 2.0"}]}, {"type": "text", "kicker": "Війна на Донбасі", "title": "Добровольчі батальйони (2014 – 2015)", "badges": ["поза програмою"], "paras": ["Навесні 2014 р. армія, яку роками скорочували, мала обмаль боєздатних частин. Тоді Міністерство внутрішніх справ і Міністерство оборони почали створювати **добровольчі батальйони**. До них ішли учасники Майдану, ветерани, мешканці сходу, які не хотіли жити під владою бойовиків.", "**«Айдар»** — батальйон територіальної оборони, який воював на Луганщині, біля Щастя. **«Донбас»** — батальйон особливого призначення Міністерства внутрішніх справ, згодом — Національної гвардії; його бійці воювали під Іловайськом. Батальйони міліції особливого призначення з’явилися і в областях, наприклад **«Київщина»**.", "Спорядження й техніку для багатьох батальйонів купували волонтери. У 2014 – 2015 рр. добровольчі батальйони ввійшли до складу Збройних Сил, Національної гвардії і поліції."], "imgs": [{"key": "aidar_car", "cap": "Автомобіль батальйону «Айдар», який волонтери привезли з Польщі й переобладнали в Києві, 2014 р. Фото: kaktuse / Wikimedia Commons, CC BY-SA 3.0"}, {"key": "donbas_emb", "cap": "Емблема батальйону «Донбас». Фото: MrPenguin20 / Wikimedia Commons, Public domain"}, {"key": "kyivsh_chev", "cap": "Шеврон батальйону «Київщина». Фото: Христина Миротворець / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Війна на Донбасі", "title": "Іловайськ і Мінськ-1 (серпень – вересень 2014 р.)", "badges": ["НМТ: дата"], "paras": ["У серпні 2014 р. сили АТО майже оточили Донецьк і Луганськ. **24 серпня** кордон України перетнули **регулярні війська Росії**.", "Під **Іловайськом** українські підрозділи потрапили в оточення. Росіяни обіцяли випустити їх «зеленим коридором», але **29 серпня** розстріляли колони; загинули сотні військових. Війська Росії й бойовики захопили **Новоазовськ** і підійшли до Маріуполя.", "**5 вересня 2014 р.** у Мінську **Тристороння контактна група** (Україна, Росія, ОБСЄ) і представники бойовиків підписали **протокол** про припинення вогню — перші **Мінські домовленості**."], "imgs": [{"key": "s129_image136", "cap": "Лінія розмежування за Мінським меморандумом, вересень 2014 р. (карта з авторської презентації, англ.)"}]}, {"type": "map", "title": "", "steps": [{"key": "nu_war3", "label": "Крок 1"}]}, {"type": "text", "kicker": "Війна на Донбасі", "title": "Донецький аеропорт і Дебальцеве (2014 – 2015)", "badges": ["НМТ: поняття"], "paras": ["З **26 травня 2014 р.** до **22 січня 2015 р.** українські військові **242 дні** обороняли **Донецький аеропорт**. Захисників аеропорту прозвали «**кіборгами**»: вороги дивувалися, як ті витримують постійні обстріли й штурми.", "У січні – лютому 2015 р. бойовики й російські війська почали новий наступ. Від ракетних обстрілів гинули мирні люди у **Волновасі**, **Маріуполі**, **Краматорську**.", "Українські війська опинилися в напівоточенні під **Дебальцевим** і **18 лютого 2015 р.** відступили з міста."], "imgs": [{"key": "s131_image138", "cap": "Карта бойових дій, січень 2015 р. (атласна карта з авторської презентації)"}, {"key": "dap_flag", "cap": "Зруйнований новий термінал Донецького аеропорту, квітень 2015 р. Фото: teteria sonnna from Obukhiv, Ukraine / Wikimedia Commons, CC BY 2.0"}]}, {"type": "doc", "title": "Мінські домовленості (2014 – 2015)", "quote": ["Протокол 5 вересня 2014 р.: **забезпечити негайне двостороннє припинення вогню**; забезпечити моніторинг і верифікацію з боку **ОБСЄ**; …провести децентралізацію влади… ухвалити закон «Про тимчасовий порядок місцевого самоврядування в окремих районах Донецької і Луганської областей»; **забезпечити постійно діючий моніторинг українсько-російського державного кордону**…", "Комплекс заходів 12 лютого 2015 р.: **відвести все важке озброєння** на рівні відстані… для створення зони безпеки; провести **місцеві вибори**… відновити **повний контроль над державним кордоном** з боку уряду України… після місцевих виборів."], "source": "Мінський протокол і Комплекс заходів (переклад-переказ, скорочено)", "comment": ["Другі домовленості (**Мінськ-2**) підтвердили лідери «нормандської четвірки» — Порошенко, Путін, Меркель і Олланд.", "Сторони розуміли їх по-різному: Україна вимагала спершу контролю над кордоном, Росія — «особливого статусу» для захоплених районів. Мир так і не настав, але масштабні бої припинилися, почалася **позиційна війна**.", "__Слова з документа:__ **верифікація** — перевірка; **децентралізація** — передача частини влади місцевим громадам."], "img": {"key": "s132_image139", "cap": "Лідери Білорусі, Росії, Німеччини, Франції й України в Мінську, 11 – 12 лютого 2015 р."}}, {"type": "map", "title": "", "steps": [{"key": "nu_war4", "label": "Крок 1"}]}, {"type": "defs", "title": "Наслідки війни 2014 – 2015 рр.", "badges": ["НМТ: поняття"], "items": [{"name": "Території", "paras": ["Росія окупувала Крим і частину Донецької й Луганської областей — близько **7 %** території України.", "Закон України називає їх **тимчасово окупованими територіями**."], "img": null}, {"name": "Люди", "paras": ["До 2022 р. у війні загинуло понад **14 тис.** людей, серед них понад 3 тис. мирних жителів.", "Понад **1,5 млн** людей стали переселенцями — **внутрішньо переміщеними особами**."], "img": null}, {"name": "Поняття", "paras": ["**Сепаратизм** — прагнення відокремити частину території держави. На Донбасі загони «сепаратистів» організувала й підтримувала Росія.", "**АТО** (2014 – 2018) — так офіційно називали оборону Донбасу; з 2018 р. — **Операція об’єднаних сил**."], "img": null}], "note": null}]}, {"id": "s6", "num": "VI", "title": "Україна у 2014 – 2019 рр.", "sub": "Вибори 2014 р., Угода про асоціацію, безвіз, реформи, економіка", "cover": {"key": "bezviz", "cap": ""}, "cards": [{"type": "generic", "title": "Вибори до Верховної Ради 2014 р.", "badges": [], "blocks": [{"k": "img", "key": "nu_seats2014", "cap": ""}, {"k": "muted", "paras": ["Склад Ради після виборів 2014 р. Власна діаграма за даними ЦВК (укр. Вікіпедія)."]}, {"k": "sep"}, {"k": "p", "paras": ["Позачергові вибори відбулися **26 жовтня 2014 р.** за змішаною системою (бар’єр 5 %). В окупованому Криму й на окупованій частині Донбасу вибори не відбулися, тому 27 місць лишилися порожніми.", "Комуністична партія вперше за роки незалежності не потрапила до Ради.", "Коаліцію «**Європейська Україна**» утворили Блок Петра Порошенка, «Народний фронт», «Самопоміч», Радикальна партія і «Батьківщина». Прем’єр-міністром знову став **Арсеній Яценюк**, головою Ради — **Володимир Гройсман**. У 2016 р. Гройсман очолив уряд, а Раду — **Андрій Парубій**."], "italic": false}]}, {"type": "doc", "title": "Угода про асоціацію з ЄС (2014)", "quote": ["…визнаючи, що Україна як європейська країна поділяє спільну з державами – членами ЄС історію і спільні цінності…", "**Стаття 1.** Цілями цієї асоціації є: сприяння політичній асоціації та економічній інтеграції між Сторонами… поступове зближення України з ЄС у сфері зовнішньої політики й політики безпеки… **створення поглибленої та всеохоплюючої зони вільної торгівлі**…"], "source": "Угода про асоціацію (переклад-переказ, скорочено)", "comment": ["Політичну частину Угоди від України підписав прем’єр-міністр А. Яценюк **21 березня 2014 р.**, економічну — Президент П. Порошенко **27 червня 2014 р.** **16 вересня 2014 р.** Верховна Рада і Європарламент ратифікували її одночасно.", "Зона вільної торгівлі діє з 2016 р., повністю Угода набула чинності **1 вересня 2017 р.** Україна зобов’язалася наближати свої закони до європейських.", "__Слова з документа:__ **асоціація** — тісне об’єднання, співпраця; **ратифікувати** — затвердити міжнародний договір."], "img": null}, {"type": "text", "kicker": "Євроінтеграція", "title": "Безвізовий режим з ЄС (2017)", "badges": ["НМТ: поняття"], "paras": ["**Умови.** Щоб отримати безвізовий режим, Україна запровадила **біометричні паспорти**, ухвалила антикорупційні й антидискримінаційні закони, посилила охорону кордону.", "**Рішення.** **17 травня 2017 р.** у Страсбурзі ЄС підписав рішення про безвізовий режим для України. Він діє з **11 червня 2017 р.**", "**Що це означає.** **Безвізовий режим** дозволяє громадянам їздити до інших країн без попереднього оформлення візи. Українці з біометричним паспортом можуть перебувати в країнах Шенгенської зони до 90 днів протягом півроку."], "imgs": [{"key": "bio_passport", "cap": "Сторінка даних біометричного паспорта громадянина України (зразок). Фото: Poligrafkombinat 'Ukraina' / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Євроінтеграція", "title": "Експорт товарів: Росія і ЄС (2013 – 2021)", "badges": [], "paras": ["До 2014 р. Росія була найбільшим покупцем українських товарів: у 2013 р. на неї припадала майже чверть експорту.", "Після окупації Криму й початку війни Росія закривала свій ринок для українських товарів, а Україна запровадила обмеження у відповідь. Водночас у 2014 р. ЄС скасував мита на більшість українських товарів, а у 2016 р. запрацювала зона вільної торгівлі.", "У 2021 р. до країн ЄС ішло майже **40 %** українського експорту, до Росії — **5 %**. Серед окремих країн найбільшим торговельним партнером України став **Китай**."], "imgs": [{"key": "chart_2_64", "cap": "Частка в загальному експорті товарів. Дані Держстату; 2015, 2017 і 2021 рр. для Росії — розрахунок за обсягами експорту."}]}, {"type": "text", "kicker": "Війна на морі", "title": "Напад біля Керченської протоки (25 листопада 2018 р.)", "badges": ["поза програмою"], "paras": ["У травні 2018 р. Росія відкрила міст через Керченську протоку до окупованого Криму. Відтоді російські прикордонники затримували судна, які йшли до українських портів Маріуполя й Бердянська.", "**25 листопада 2018 р.** катери «Бердянськ» і «Нікополь» та буксир «Яни Капу» йшли з Одеси до Маріуполя. Біля протоки російські кораблі обстріляли їх і захопили, **24 моряки** потрапили в полон. Цього разу Росія напала відкрито, під власним прапором.", "Наступного дня Верховна Рада на пропозицію Президента вперше запровадила **воєнний стан** — на 30 діб у десяти областях.", "У травні 2019 р. Міжнародний трибунал ООН з морського права зобов’язав Росію звільнити моряків і кораблі. Моряки повернулися додому у вересні 2019 р. під час обміну полоненими."], "imgs": [{"key": "gyurza", "cap": "Малі броньовані артилерійські катери ВМС України на випробуваннях. Фото: Ministry of Defense of Ukraine / Wikimedia Commons, CC BY-SA 2.0"}]}, {"type": "defs", "title": "Реформи 2014 – 2019 рр.", "badges": ["НМТ: поняття"], "items": [{"name": "Влада і громади", "paras": ["**Децентралізація** (з 2015 р.): села й міста об’єднувалися в громади, які отримали більше прав і частку податків.", "**Люстрація** (закон 2014 р.): з державної служби звільняли посадовців, які обіймали високі посади за Януковича."], "img": null}, {"name": "Боротьба з корупцією", "paras": ["Держава створила **Національне антикорупційне бюро (НАБУ)**, Спеціалізовану антикорупційну прокуратуру, **Вищий антикорупційний суд** (2019).", "Чиновники подають **електронні декларації** про статки.", "Державні закупівлі відбуваються через систему **Prozorro**."], "img": null}, {"name": "Інші реформи", "paras": ["У 2015 р. міліцію замінила **Національна поліція**.", "Реформа медицини: держава платить лікарні за кожного пацієнта.", "З 2018 р. діє програма «**Нова українська школа**».", "**Декомунізація** (закони 2015 р.): міста й вулиці перейменували, пам’ятники радянським діячам прибрали."], "img": null}], "note": null}, {"type": "text", "kicker": "Реформи", "title": "Об’єднання громад (2015 – 2020)", "badges": ["НМТ: поняття"], "paras": ["**Децентралізація** — передача частини повноважень і грошей від центральної влади органам місцевого самоврядування.", "З 2015 р. села, селища й міста добровільно об’єднувалися в **територіальні громади**. Громада отримувала частину податків і сама вирішувала, на що їх витратити: на дороги, школи чи амбулаторії.", "У **2020 р.** уряд затвердив громади на всій території, підконтрольній Україні, — їх стало **1469**. Замість 490 районів Рада утворила **136** більших. **25 жовтня 2020 р.** громади обрали своїх голів і депутатів."], "imgs": [{"key": "chart_2_67", "cap": "Дані Міністерства розвитку громад і територій на кінець року; 2019 р. не показано. Для 2020 р. — громади на всій території, підконтрольній Україні."}]}, {"type": "text", "kicker": "Політика пам’яті", "title": "Декомунізація (2015)", "badges": ["поза програмою"], "paras": ["**Чотири закони.** **9 квітня 2015 р.** Верховна Рада ухвалила чотири закони, які називають «декомунізаційними».", "Перший засудив комуністичний і нацистський тоталітарні режими й заборонив їхню символіку. Другий відкрив архіви радянських каральних органів.", "Третій визнав борцями за незалежність України учасників визвольних рухів XX ст., зокрема вояків армії УНР і УПА. Четвертий замінив назву «Велика Вітчизняна війна» на «Друга світова війна».", "**Що змінилося.** Міста, села й вулиці, названі на честь радянських діячів, отримали нові або історичні назви. Загалом перейменовано близько тисячі населених пунктів.", "У 2016 р. **Дніпропетровськ** став **Дніпром**, а **Кіровоград** — **Кропивницьким**.", "Місцева влада прибрала пам’ятники Леніну та іншим радянським керівникам. Пам’ятник Леніну в Києві протестувальники повалили ще 8 грудня 2013 р."], "imgs": [{"key": "leninopad", "cap": "Порожній постамент пам’ятника Леніну у Великих Сорочинцях із написом «Тут був Вовчик». Фото: Mykola Swarnyk / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "Мова й культура", "title": "Українська мова й культура (2014 – 2019)", "badges": [], "paras": ["Рада запровадила **квоти**: на радіо — щонайменше третина пісень українською (2016), на телебаченні — три чверті передач державною мовою (2017).", "**25 квітня 2019 р.** Рада ухвалила закон «**Про забезпечення функціонування української мови як державної**».", "Держава почала підтримувати українське кіно й книговидання: з’явилися Український інститут книги (2016), Український культурний фонд (2017).", "У 2016 р. **Джамала** перемогла на «Євробаченні» з піснею «**1944**» — про депортацію кримських татар."], "imgs": [{"key": "jamala", "cap": "Джамала з кришталевим мікрофоном переможниці «Євробачення-2016». Фото: Albin Olsson / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Економіка", "title": "ВВП України (1990 – 2021)", "badges": [], "paras": ["Війна й втрата Криму та частини Донбасу завдали економіці великої шкоди: у 2014 – 2015 рр. ВВП скоротився на 16 %, гривня знецінилася втричі.", "Національний банк закрив майже сто ненадійних банків; у 2016 р. держава **націоналізувала ПриватБанк** Ігоря Коломойського.", "Україна перестала купувати газ у Росії, головним торговельним партнером став **ЄС**. З 2016 р. економіка почала потроху зростати."], "imgs": [{"key": "chart_2_70", "cap": "Розрахунок за даними Держстату про річний приріст ВВП; округлено."}]}]}, {"id": "s7", "num": "VII", "title": "Церква й духовне життя", "sub": "УГКЦ, екуменізм, Православна церква України й томос", "cover": {"key": "tomos", "cap": ""}, "cards": [{"type": "text", "kicker": "Церква", "title": "Православна церква України і томос (2018 – 2019)", "badges": [], "paras": ["Після 2014 р. багатьох вірян Української православної церкви Московського патріархату обурило те, що Московський патріархат благословляв війну. Україна звернулася до **Вселенського патріарха** з проханням визнати незалежну українську церкву.", "У жовтні 2018 р. Вселенський патріархат скасував акт 1686 р., яким Київську митрополію передали Москві. **15 грудня 2018 р.** **Об’єднавчий собор** у Софійському соборі створив **Православну церкву України (ПЦУ)** — до неї ввійшли Київський патріархат, Автокефальна церква й частина єпископів Московського патріархату. Собор обрав предстоятелем митрополита **Епіфанія**.", "**6 січня 2019 р.** у Стамбулі Вселенський патріарх Варфоломій вручив ПЦУ **томос** — грамоту про **автокефалію** (незалежність)."], "imgs": [{"key": "epiphanius", "cap": "Митрополит Київський і всієї України Епіфаній. Фото: The Presidential Administration of Ukraine. / Wikimedia Commons, CC BY 4.0"}]}, {"type": "text", "kicker": "Економіка", "title": "Середня зарплата в доларах (2005 – 2021)", "badges": [], "paras": ["До світової кризи зарплати швидко зростали: за 2005 – 2008 рр. вони в доларах збільшилися більш ніж удвічі.", "Криза 2008 – 2009 рр., а потім початок війни у 2014 р. знецінили гривню. У 2015 р. долар коштував у середньому 21,8 грн замість 8 грн у 2013 р., і зарплата в перерахунку впала більш ніж удвічі — до **192 доларів**.", "Рівень 2013 р. зарплата перевищила лише у 2020 р. У 2021 р. вона становила **514 доларів**."], "imgs": [{"key": "chart_2_73", "cap": "Розрахунок: середньомісячна зарплата (Держстат) ÷ середньорічний курс долара (НБУ); з 2014 р. — без окупованих територій."}]}, {"type": "text", "kicker": "Населення", "title": "Народжуваність і смертність (2005 – 2021)", "badges": [], "paras": ["У 2006 – 2012 рр. дітей народжувалося більше, ніж на початку 2000-х рр. Цьому сприяли зростання доходів і державна допомога при народженні дитини, яку з 2005 р. значно підвищили.", "Від **2014 р.** дані подано без окупованих територій. Через війну, виїзд людей за кордон і падіння доходів народжуваність знову зменшувалася: у 2021 р. народилося лише **272 тис.** дітей.", "Під час пандемії COVID-19 смертність зросла: у 2021 р. померло **714 тис.** людей — найбільше з 2008 р."], "imgs": [{"key": "chart_2_74", "cap": "Дані Держстату (2020 – 2021 рр. — попередні), тис. осіб; з 2014 р. — без окупованих територій."}]}, {"type": "text", "kicker": "Церква", "title": "Екуменізм", "badges": ["НМТ: поняття"], "paras": ["**Екуменізм** — рух за співпрацю й порозуміння між християнами різних церков.", "В Україні з 1996 р. діє **Всеукраїнська рада церков і релігійних організацій**. До неї входять православні, греко- й римо-католики, протестанти, а також юдейські й мусульманські організації. Члени ради разом висловлюються з важливих для суспільства питань.", "Під час Революції Гідності священники різних церков разом молилися на Майдані, а церкви ставали прихистком для протестувальників.", "**УГКЦ** з 2011 р. очолює Верховний архієпископ **Святослав (Шевчук)**; у 2013 р. в Києві освятили її **Патріарший собор Воскресіння Христового**."], "imgs": [{"key": "s156_image156", "cap": "Спільна молитва священників різних церков"}]}, {"type": "defs", "title": "Освіта після 2005 р.", "badges": [], "items": [{"name": "Вступ до вишів", "paras": ["З **2008 р.** до вишів вступають за результатами **ЗНО**, а з 2022 р. — **НМТ**.", "Тести готує незалежний **Український центр оцінювання якості освіти** (з 2006 р.)."], "img": null}, {"name": "Школа", "paras": ["У 2017 р. Рада ухвалила новий закон «**Про освіту**».", "З 2018 р. перші класи вчаться за програмою «**Нова українська школа**»: менше заучування, більше вмінь і практики."], "img": null}, {"name": "Вища освіта", "paras": ["Україна долучилася до **Болонського процесу** (2005): виші запровадили бакалаврат і магістратуру, як у Європі.", "Студенти можуть частину навчання пройти в європейських університетах."], "img": null}], "note": null}]}, {"id": "s8", "num": "VIII", "title": "Поза програмою: після 2019 р.", "sub": "Вибори 2019 р., реформи, пандемія, повномасштабне вторгнення Росії, переговори про вступ до ЄС", "cover": {"key": "s139_image144", "cap": ""}, "cards": [{"type": "text", "kicker": "2019 – 2022", "title": "Вибори Президента 2019 р.", "badges": ["поза програмою"], "paras": ["**Володимир Зеленський** народився 1978 р. у Кривому Розі, за освітою юрист. Відомим він став як актор і продюсер студії «Квартал 95». У телесеріалі «Слуга народу» (з 2015 р.) він зіграв учителя історії, якого несподівано обирають Президентом.", "Про участь у виборах Зеленський оголосив у ніч на 1 січня 2019 р. Кампанію він вів передусім у соціальних мережах і на концертах. Він обіцяв боротися з корупцією, скасувати недоторканність депутатів і закінчити війну.", "У першому турі **31 березня 2019 р.** Зеленський набрав **30,2 %** голосів, Петро Порошенко — 15,9 %. У другому турі **21 квітня** за Зеленського проголосували **73,2 %** виборців; він переміг у всіх областях, крім Львівської.", "**20 травня 2019 р.** Зеленський склав присягу й того ж дня оголосив про розпуск Верховної Ради."], "imgs": [{"key": "s137_image140", "cap": "Результати другого туру виборів Президента 2019 р. за областями"}, {"key": "zelenskyi", "cap": "Володимир Зеленський, 2025 р. Фото: Офіс Президента України / Wikimedia Commons, CC BY 4.0"}]}, {"type": "text", "kicker": "2019 – 2022", "title": "Вибори Президента 2019 р.: перший тур", "badges": ["поза програмою"], "paras": ["У бюлетені було **39** кандидатів — найбільше за всю історію президентських виборів.", "У першому турі за Зеленського проголосували **5,7 млн** виборців, за Порошенка — **3,0 млн**.", "У **другому турі 21 квітня** Зеленський отримав **13,5 млн** голосів, тобто на 7,8 млн більше, ніж у першому, а Порошенко — **4,5 млн**, на 1,5 млн більше. Отже, більшість виборців, які в першому турі голосували за інших кандидатів, у другому підтримали Зеленського."], "imgs": [{"key": "chart_2_79", "cap": "Дані ЦВК. Решта кандидатів набрали менше ніж по 2 %."}]}, {"type": "map", "title": "", "steps": [{"key": "nu_2019", "label": "Крок 1"}]}, {"type": "generic", "title": "Вибори до Верховної Ради 2019 р.", "badges": ["поза програмою"], "blocks": [{"k": "img", "key": "nu_seats2019", "cap": ""}, {"k": "muted", "paras": ["Склад Ради після виборів 2019 р. Власна діаграма за даними ЦВК (укр. Вікіпедія)."]}, {"k": "sep"}, {"k": "p", "paras": ["На позачергових виборах **21 липня 2019 р.** партія «**Слуга народу**» отримала **43,2 %** голосів за списками й перемогла в більшості округів. Вона здобула **254** місця з 450. Уперше за роки незалежності одна партія мала більшість у Раді — **монобільшість**.", "До Ради пройшли також «Опозиційна платформа – За життя», «Батьківщина», «Європейська солідарність» і нова партія «Голос». Більшість депутатів потрапили до Ради вперше.", "Головою Ради став **Дмитро Разумков**, прем’єр-міністром — **Олексій Гончарук** (29 серпня 2019 р.). Закони монобільшість ухвалювала дуже швидко; таку роботу Ради називали «турборежимом».", "**4 березня 2020 р.** Рада ухвалила відставку уряду Гончарука, і прем’єр-міністром став **Денис Шмигаль**."], "italic": false}]}, {"type": "table", "title": "Нові правила: що змінили закони 2019 – 2021 рр.", "rows": [["Закон", "Що змінилося", "Що це означає для громадян"], ["Зміни до Конституції щодо **недоторканності** депутатів (вересень 2019 р., діють з 2020 р.)", "Депутатів можна притягати до кримінальної відповідальності без згоди Ради.", "Народні депутати відповідають перед законом так само, як інші громадяни."], ["Закон про **імпічмент** (вересень 2019 р.)", "Докладно описано, як Рада може усунути Президента з посади.", "Для звинувачення потрібно 300 голосів депутатів, для усунення з посади — 338."], ["**Виборчий кодекс** (грудень 2019 р.)", "Депутатів Ради обирають лише за партійними списками, поділеними на регіональні частини.", "Виборець голосує за партію і може підтримати конкретного кандидата з її списку."], ["Закон про **всеукраїнський референдум** (січень 2021 р.)", "Визначено, як проводять референдум за ініціативою громадян.", "Для цього потрібно зібрати щонайменше 3 млн підписів."], ["Закон про **корінні народи** (липень 2021 р.)", "Корінними народами України визнано кримських татар, караїмів і кримчаків.", "Вони мають право на власні представницькі органи, розвиток своєї мови й освіту."], ["Закон про **олігархів** (вересень 2021 р.)", "Рада національної безпеки і оборони (РНБО) веде реєстр олігархів.", "Олігархам заборонено фінансувати партії й брати участь у великій приватизації."]]}, {"type": "text", "kicker": "2019 – 2022", "title": "Ринок землі і «Дія»", "badges": ["поза програмою"], "paras": ["**Ринок землі.** Від 2001 р. діяв **мораторій** — заборона продавати землі сільськогосподарського призначення. **31 березня 2020 р.** Рада ухвалила закон про ринок землі.", "З **1 липня 2021 р.** громадяни можуть купувати до 100 га землі, а з 2024 р. підприємства — до 10 тис. га. Іноземцям купувати землю заборонено, доки це не дозволить всеукраїнський референдум.", "**«Дія».** У 2019 р. уряд створив Міністерство цифрової трансформації. З лютого 2020 р. працюють застосунок і портал «**Дія**». У смартфоні можна зберігати цифровий паспорт і посвідчення водія, а довідку отримати чи бізнес зареєструвати без візиту до установи."], "imgs": [{"key": "s140_image145", "cap": "Перші місяці ринку землі: середня ціна гектара за областями, станом на листопад 2021 р. (інфографіка «Слово і Діло»)"}, {"key": "s141_image146", "cap": "Застосунок і портал «Дія»"}]}, {"type": "text", "kicker": "2019 – 2022", "title": "Пандемія COVID-19 і «Велике будівництво»", "badges": ["поза програмою"], "paras": ["**Пандемія.** Перший випадок COVID-19 в Україні виявили **3 березня 2020 р.** З 12 березня уряд закрив школи й університети, а згодом метро й більшість магазинів. Учні перейшли на дистанційне навчання.", "З травня 2020 р. діяв «адаптивний карантин»: обмеження залежали від того, скільки людей хворіло в області. Вакцинацію почали **24 лютого 2021 р.** У 2020 р. ВВП скоротився на 3,8 %.", "**«Велике будівництво».** З 2020 р. за цією президентською програмою ремонтували й будували дороги, мости, школи, лікарні, спортивні майданчики. Частину грошей уряд узяв із фонду боротьби з COVID-19; опозиція й частина експертів критикували це рішення."], "imgs": [{"key": "covid_cv", "cap": "Медик у захисному костюмі, Чернівці, 2020 р. Фото: Mstyslav Chernov / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "s142_image147", "cap": "Будівництво дороги за програмою «Велике будівництво»"}]}, {"type": "text", "kicker": "2019 – 2022", "title": "Смертність під час пандемії (2020 – 2022)", "badges": ["поза програмою"], "paras": ["Графік показує, скільки людей помирало щомісяця **від усіх причин** порівняно із середнім рівнем тих самих місяців 2015 – 2019 рр.", "Смертність різко зростала під час трьох хвиль пандемії: восени 2020 р., навесні 2021 р. і восени 2021 р. У **листопаді 2021 р.** померло **87,9 тис.** людей — майже вдвічі більше, ніж зазвичай у листопаді.", "За 2020 – 2021 рр. померло приблизно на **160 тис.** людей більше, ніж зазвичай. Це значно більше за кількість смертей, які офіційно пов’язали з COVID-19: частину хворих не обстежували, а люди з іншими хворобами не завжди вчасно отримували допомогу."], "imgs": [{"key": "chart_2_85", "cap": "Дані Держстату (World Mortality Dataset); за лютий 2022 р. даних немає."}]}, {"type": "cols", "title": "Донбас і Крим: пошуки миру (2019 – 2021)", "badges": ["поза програмою"], "intro": null, "blocks": [{"h": "Переговори й обміни", "paras": ["**7 вересня 2019 р.** Україна й Росія обмінялися полоненими «35 на 35». Додому повернулися 24 моряки, захоплені біля Керченської протоки, і режисер Олег Сенцов.", "Восени 2019 р. сторони відвели війська біля Золотого й Петрівського на Донбасі.", "**9 грудня 2019 р.** у Парижі вперше за три роки зустрілися лідери Франції, Німеччини, України й Росії («нормандська четвірка»). Вони домовилися про перемир’я й обмін полоненими, який відбувся 29 грудня."]}, {"h": "Чого не досягли", "paras": ["З **27 липня 2020 р.** діяло «посилене перемир’я». Обстрілів поменшало, але бої не припинилися.", "Росія вимагала, щоб Україна домовлялася з «ДНР» і «ЛНР» напряму й провела там вибори, ще не відновивши контролю над кордоном. Україна на це не погодилася.", "**23 серпня 2021 р.** у Києві 46 делегацій узяли участь у саміті **Кримської платформи**, яка домагається деокупації Криму. Тим часом Росія стягувала війська до кордонів України."]}]}, {"type": "text", "kicker": "2019 – 2022", "title": "Рішення, які спричинили суперечки", "badges": ["поза програмою"], "paras": ["**Конституційна криза.** **27 жовтня 2020 р.** Конституційний Суд визнав неконституційною частину антикорупційних законів, зокрем

дей. Зона відчуження існує й нині.", "src": "за зразком ЗНО"}, {"id": "b06", "q": "Установіть відповідність між наслідком Чорнобильської катастрофи (1–4) та його видом (А – Д).", "sec": "s2", "g": "", "t": "match", "opts": ["політичний", "соціальний", "екологічний", "економічний", "культурний"], "ok": [2, 0, 3, 1], "left": ["радіоактивне забруднення ґрунтів, річок і лісів", "підрив довіри до комуністичного керівництва СРСР і УРСР", "величезні витрати на ліквідацію наслідків аварії", "погіршення здоров’я людей, які жили на забруднених територіях"], "expl": "Забруднення природи — екологічний наслідок; недовіра до влади, що замовчувала аварію, — політичний; витрати — економічний; хвороби — соціальний.", "src": "нове"}, {"id": "b07", "q": "Закон «Про кооперацію в СРСР» (1988 р.) дозволив", "sec": "s3", "g": "", "t": "single", "opts": ["продавати й купувати сільськогосподарську землю", "створювати кооперативи, що самі встановлювали ціни", "створювати політичні партії поза КПРС", "приватизувати великі промислові підприємства"], "ok": [1], "expl": "Кооперативи 1988 – 1989 рр. стали першим легальним приватним бізнесом. Вони продавали товари за вільними цінами.", "src": "за зразком ЗНО"}, {"id": "b08", "q": "Госпрозрахунок, який закон 1987 р. запроваджував на державних підприємствах, — це метод господарювання, за якого", "sec": "s3", "g": "", "t": "single", "opts": ["підприємство повністю фінансує міністерство", "підприємство покриває свої витрати власними доходами", "підприємство переходить у власність приватної особи", "товари продають лише за талонами й картками"], "ok": [1], "expl": "За госпрозрахунку завод мав сам заробляти й витрачати гроші. Але держава й далі диктувала, що виробляти, і встановлювала ціни, тож реформа не вдалася.", "src": "нове"}, {"id": "b09", "q": "Що було характерним для економічних реформ 1987 – 1989 рр.?", "sec": "s3", "g": "", "t": "three", "opts": ["переведення державних підприємств на госпрозрахунок", "дозвіл створювати кооперативи", "дозвіл брати в оренду землю й техніку", "приватизація великих промислових підприємств", "запровадження національної валюти УРСР", "ліквідація колгоспів і радгоспів", "відмова держави від установлення цін"], "ok": [0, 1, 2], "expl": "Реформи 1987 – 1989 рр. дозволили госпрозрахунок, кооперативи й оренду, але зберегли державну власність, план і державні ціни.", "src": "нове"}, {"id": "b10", "q": "Установіть відповідність між поняттям (1–4) та його визначенням (А – Д).", "sec": "s4", "g": "", "t": "match", "opts": ["курс реформ М. Горбачова 1985 – 1991 рр.: демократизація, елементи ринку, поліпшення відносин із Заходом", "політика відкритості: послаблення цензури, право критикувати владу, доступ до прихованої раніше інформації", "політична система, у якій діють кілька партій із рівними шансами здобути місця в парламенті", "існування в суспільстві різних поглядів і позицій, які люди вільно висловлюють через свої організації", "передача державної власності в приватні руки"], "ok": [1, 3, 2, 0], "left": ["гласність", "плюралізм", "багатопартійність", "перебудова"], "expl": "Усі чотири поняття — з програми НМТ до цієї теми. Д — визначення приватизації.", "src": "нове"}, {"id": "b11", "q": "Скасування в березні 1990 р. статті 6 Конституції СРСР про «керівну і спрямовуючу» роль КПРС відкрило шлях до", "sec": "s4", "g": "", "t": "single", "opts": ["гласності", "багатопартійності", "антиалкогольної кампанії", "госпрозрахунку"], "ok": [1], "expl": "Поки Конституція закріплювала владу однієї партії, інших партій не могло бути. Після скасування статті 6 почали реєструвати нові партії.", "src": "за зразком ЗНО"}, {"id": "b12", "q": "Повернення читачам заборонених творів, публікація документів про репресії, критика влади в пресі — прояви політики", "sec": "s4", "g": "", "t": "single", "opts": ["«прискорення»", "гласності", "лібералізації цін", "госпрозрахунку"], "ok": [1], "expl": "Гласність — послаблення цензури й право говорити правду. Саме вона дала змогу відкрито обговорювати «білі плями» історії.", "src": "нове"}, {"id": "b13", "q": "Масовий страйк шахтарів Донбасу розпочався в", "sec": "s5", "g": "strike89", "t": "single", "opts": ["квітні 1986 р.", "липні 1989 р.", "жовтні 1990 р.", "серпні 1991 р."], "ok": [1], "expl": "У липні 1989 р. застрайкували шахтарі Кузбасу, а слідом — Донбасу. Вони вимагали мила, ковбаси, кращих умов праці й справжньої самостійності шахт.", "src": "за зразком ЗНО 2016"}, {"id": "b14", "q": "Картки споживача з купонами, без яких у державній крамниці УРСР не можна було купити товар, запровадили", "sec": "s5", "g": "", "t": "single", "opts": ["1985 р.", "у листопаді 1990 р.", "у грудні 1991 р.", "1996 р."], "ok": [1], "expl": "Купони видавали разом із зарплатою з листопада 1990 р.: так влада намагалася захистити республіканський ринок від скупників з інших республік.", "src": "нове"}, {"id": "b15", "q": "Павловська реформа 1991 р. передбачала", "sec": "s5", "g": "", "t": "single", "opts": ["запровадження національної валюти — гривні", "обмін купюр 50 і 100 крб і підвищення цін", "продаж землі в приватну власність громадян", "скасування талонів і карток на всі товари"], "ok": [1], "expl": "У січні 1991 р. уряд В. Павлова за три дні обміняв великі купюри (не більше 1000 крб на людину), у квітні — підвищив ціни. Люди втратили заощадження.", "src": "нове"}, {"id": "b16", "q": "Установіть послідовність подій.", "sec": "s6", "g": "", "t": "seq", "opts": ["ухвалення закону «Про державне підприємство (об’єднання)»", "ухвалення закону «Про кооперацію в СРСР»", "масовий страйк шахтарів Донбасу", "обмін 50- і 100-карбованцевих купюр (павловська реформа)"], "expl": "1987 → 1988 → липень 1989 → січень 1991.", "src": "нове"}, {"id": "b17", "q": "Які явища характерні для доби перебудови (1985 – 1991)?", "sec": "s6", "g": "", "t": "three", "opts": ["гласність і послаблення цензури", "створення кооперативів", "масові страйки шахтарів", "створення раднаргоспів", "кампанія з вирощування кукурудзи", "боротьба з «безрідним космополітизмом»", "поява самвидавного журналу «Український вісник»"], "ok": [0, 1, 2], "expl": "Раднаргоспи й кукурудза — доба Хрущова, «безрідний космополітизм» — повоєнні роки, «Український вісник» уперше вийшов 1970 р.", "src": "нове"}]}, "2": {"n": 20, "pass": 75, "timer": true, "quota": {"s1": 3, "s2": 3, "s3": 3, "s4": 4, "s5": 4, "s6": 3}, "pool": [{"id": "z6677", "q": "У який період розгорнувся процес, відображений в уривку з документа: \"...Рада Міністрів УРСР зобов’язала виконкоми місцевих Рад народних депутатів Кримської області вжити додаткових заходів для своєчасного надання в установленому порядку кримським татарам, які повертаються, земельних ділянок для будівництва житлових будинків...\"?", "sec": "s4", "g": "", "t": "single", "opts": ["\"відбудови\"", "\"відлиги\"", "\"застою\"", "\"перебудови\""], "ok": [3], "expl": "Масове повернення кримських татар почалося 1989 р., коли Верховна Рада СРСР визнала депортацію незаконною, — у роки перебудови.", "src": "ЗНО 2014 – основна сесія (№ 40)"}, {"id": "z6694", "q": "Укажіть факти біографії видатного політика, зображеного на фото.", "sec": "s1", "g": "", "t": "three", "img": ["q_9991b66365"], "opts": ["Обіймав посаду голови Народного Руху України", "Один із засновників Української Гельсінської спілки", "Автор книги «Україно наша Радянська»", "Заснував «самвидавський» часопис «Український вісник»", "Позбавлений радянського громадянства та був висланий за кордон", "Обраний Президентом України в 1991 р.", "Брав участь у роботі Української робітничо-селянської спілки"], "ok": [0, 1, 3], "expl": "На фото — В’ячеслав Чорновіл: голова Народного Руху (1), один із засновників УГС (2), видавець «Українського вісника» (4). Книжку «Україно наша Радянська» написав П. Шелест, кандидатом-переможцем 1991 р. був Л. Кравчук.", "src": "ЗНО 2014 – основна сесія (№ 56)"}, {"id": "z9199", "q": "Установіть послідовність подій періоду розпаду Радянського Союзу та відродження незалежності України.", "sec": "s6", "g": "seq4", "t": "seq", "opts": ["вибух на Чорнобильській АЕС", "створення Народного руху України за перебудову", "перші альтернативні вибори до Верховної Ради УРСР", "ухвалення Декларації про державний суверенітет України"], "expl": "Чорнобиль (1986) → Рух (1989) → вибори (березень 1990) → Декларація про суверенітет (липень 1990).", "src": "ЗНО 2016 – пробний тест (№ 28)"}, {"id": "z10235", "q": "Коли Акт проголошення незалежності України здобув загальнонародне схвалення?", "sec": "s5", "g": "", "t": "single", "opts": ["24 серпня 1991 р.", "1 грудня 1991 р.", "6 грудня 1991р.", "12 лютого 1992 р."], "ok": [1], "expl": "На Всеукраїнському референдумі 1 грудня 1991 р. Акт проголошення незалежності підтримали понад 90 % учасників.", "src": "ЗНО 2017 – пробний тест (№ 22)"}, {"id": "z12117", "q": "Прочитайте уривок з історичного джерела та виконайте завдання.\n«Уранці 19 серпня командуючий сухопутними військами СРСР генерал В. Варенников, прибувши з групою військових до кабінету Голови Верховної Ради УРСР, в ультимативній формі заявив Л. Кравчуку: «Влада перейшла до ДКНС, який врятує країну. Рекомендую Вам зайняти правильну позицію. Змінити свій особистий курс і курс Верховної Ради...»\nОписана подія відбулася на завершальному етапі періоду", "sec": "s4", "g": "varen", "t": "single", "opts": ["«відбудови».", "«відлиги».", "«застою».", "«перебудови»."], "ok": [3], "expl": "19 серпня 1991 р. — спроба державного перевороту в Москві (ДКНС), завершальний етап перебудови.", "src": "ЗНО 2017 – основна сесія (№ 20)"}, {"id": "z15518", "q": "Установіть відповідність між назвою документа та роком його ухвалення.", "sec": "s6", "g": "", "t": "match", "opts": ["1988 р.", "1989 р.", "1990 р.", "1991 р.", "1992 р."], "ok": [2, 1, 4, 3], "left": ["Декларація про державний суверенітет України", "Програма Народного Руху України за перебудову", "Постанова Верховної Ради України «Про Державний прапор України»", "Закон Української РСР «Про відновлення Кримської Автономної Радянської Соціалістичної Республіки»"], "expl": "Програма Руху — 1989, Декларація — 1990, закон про відновлення Кримської АРСР — 1991, постанова про Державний прапор — 1992.", "src": "ЗНО 2018 – додаткова сесія (№ 26)"}, {"id": "z17446", "q": "Прочитайте уривок історичного документа та виконайте завдання до нього.\n«...Сам факт проведення з’їзду – серйозна поразка [компартійного] апарату.\nТривалий час Україна була республікою «застою» й, нарешті, вона сказала своє вагоме слово. Було враховано помилки інших республік, і ми прийшли до з’їзду без катаклізмів... З’їзд став силою, що консолідувала людей різних поколінь, політичних поглядів, багатьох організацій».\nЩо стало результатом описаної події?", "sec": "s1", "g": "ruh_z", "t": "single", "opts": ["відновлення діяльності Української Гельсінської групи", "відкриття клубу творчої молоді «Супутник»", "створення Народного руху України за перебудову", "легалізація Української робітничо-селянської спілки"], "ok": [2], "expl": "Ідеться про установчий з’їзд Народного руху України за перебудову (8 – 10 вересня 1989 р.).", "src": "ЗНО 2019 – основна сесія (№ 21)"}, {"id": "z17447", "q": "Прочитайте уривок історичного документа та виконайте завдання до нього.\n«...Сам факт проведення з’їзду – серйозна поразка [компартійного] апарату.\nТривалий час Україна була республікою «застою» й, нарешті, вона сказала своє вагоме слово. Було враховано помилки інших республік, і ми прийшли до з’їзду без катаклізмів... З’їзд став силою, що консолідувала людей різних поколінь, політичних поглядів, багатьох організацій».\nПодія, описана в джерелі,", "sec": "s1", "g": "", "t": "single", "opts": ["засвідчила факт розпаду Радянського Союзу.", "сприяла початку люстрації корумпованої влади.", "започаткувала процес розроблення нової Конституції.", "була складовою процесу формування багатопартійності."], "ok": [3], "expl": "Рух став першою масовою організацією, незалежною від КПРС. З нього виросли політичні партії, тож з’їзд — крок до багатопартійності.", "src": "ЗНО 2019 – основна сесія (№ 22)"}, {"id": "z20674", "q": "Ігор Юхновський згадував про події серпня 1991 р.: «Референдум був найважливішим з усього. Щоправда, проти нього виступали навіть деякі члени Народної ради. Але я наполягав: референдум є обов’язковим».\nНа Референдум було винесено питання", "sec": "s5", "g": "refq", "t": "single", "opts": ["надання Криму автономії в складі УРСР.", "всенародного ухвалення Конституції України.", "підтвердження Акта проголошення незалежності України.", "ухвалення тексту Декларації про державний суверенітет України."], "ok": [2], "expl": "На референдум 1 грудня 1991 р. винесли питання: «Чи підтверджуєте Ви Акт проголошення незалежності України?»", "src": "ЗНО 2020 – основна сесія (№ 22)"}, {"id": "z21320", "q": "Оприлюднення 30 серпня 1991 р. Указу Президії Верховної Ради України «Про заборону діяльності Компартії України» зумовлено", "sec": "s4", "g": "", "t": "single", "opts": ["підтримкою КПУ сил, які виступали за збереження СРСР.", "діями КПУ з організації та підтримки сепаратистських рухів.", "негативною реакцією КПУ на процеси «перебудови» в республіці.", "вимогою міжнародної спільноти засудити комуністичну ідеологію."], "ok": [0], "expl": "Керівництво Компартії України не засудило заколот ДКНС і виступало за збереження СРСР, тому діяльність КПУ заборонили.", "src": "ЗНО 2020 – додаткова сесія (№ 21)"}, {"id": "z22133", "q": "Якому діячеві належать такі факти біографії:\n«У 1985 р. повернувся до Львова, де відновив правозахисну діяльність, видання «Українського вісника». Навесні 1990 р. обраний головою Львівської обласної ради народних депутатів. На перших виборах Президента України у 1991 р. посів друге місце, здобувши підтримку 23,27% виборців. У грудні 1992 р. став головою Народного Руху України»?", "sec": "s1", "g": "", "t": "single", "opts": ["Л. Лук’яненку", "В. Чорноволу", "М. Руденку", "С. Хмарі"], "ok": [1], "expl": "В’ячеслав Чорновіл відновив «Український вісник» (1987), очолив Львівську облраду (1990), на виборах Президента 1991 р. посів друге місце (23,27 %), згодом очолив Народний Рух.", "src": "ЗНО 2011 – додаткова сесія (№ 47)"}, {"id": "z22194", "q": "У грудні 1991 р. Президентом України обрано", "sec": "s5", "g": "", "t": "single", "opts": ["В. Щербицького.", "В. Чорновола.", "Л. Кравчука.", "Л. Кучму."], "ok": [2], "expl": "1 грудня 1991 р. першим Президентом України обрано Леоніда Кравчука.", "src": "ЗНО 2012 – додаткова сесія (№ 48)"}, {"id": "z23829", "q": "Увідповідніть дату з подією.", "sec": "s6", "g": "", "t": "match", "opts": ["ухвалення Верховною Радою України Конституції України", "заснування Збройних Сил України", "ухвалення Верховною Радою УРСР Акта проголошення незалежності України", "проведення Всеукраїнського референдуму на підтвердження Акта проголошення незалежності України", "ухвалення Верховною Радою УРСР Декларації про державний суверенітет УРСР"], "ok": [4, 2, 3, 1], "left": ["16 липня 1990 р.", "24 серпня 1991 р.", "1 грудня 1991 р.", "6 грудня 1991 р."], "expl": "16.07.1990 — Декларація про суверенітет; 24.08.1991 — Акт; 1.12.1991 — референдум; 6.12.1991 — закон про Збройні Сили.", "src": "ЗНО 2021 – основна сесія (№ 26)"}, {"id": "z24880", "q": "Проаналізуйте фрагмент історичного документа й виконайте завдання\n«Виходячи зі смертельної небезпеки, яка нависла була над Україною... продовжуючи тисячолітню традицію державотворення в Україні... Верховна Рада Української Радянської Соціалістичної Республіки урочисто проголошує незалежність України й створення самостійної української держави – України... Віднині на території України мають чинність винятково Конституція і закони України...»\nЦитований документ ухвалено", "sec": "s4", "g": "akt_q", "t": "single", "opts": ["16 липня 1990 р.", "24 серпня 1991 р.", "1 грудня 1991 р.", "28 червня 1996 р."], "ok": [1], "expl": "Це Акт проголошення незалежності України, ухвалений Верховною Радою 24 серпня 1991 р.", "src": "ЗНО 2021 – додаткова сесія (№ 19)"}, {"id": "z24881", "q": "Проаналізуйте фрагмент історичного документа й виконайте зав opts": ["відновлення діяльності Української Гельсінської групи", "легалізація Української робітничо-селянської спілки", "відкриття клубу творчої молоді «Супутник»", "створення Народного руху України за перебудову"]}, {"id": "1.22", "n": 3, "t": "single", "q": "Коли в Українській РСР започатковано політику, на ідеологічній складовій якої акцентує увагу зображена карикатура?", "sec": "", "g": "", "img": ["q_890218b7aa"], "opts": ["квітень 1985 р.", "вересень 1989 р.", "березень 1990 р.", "липень 1991 р."]}, {"id": "1.15", "n": 4, "t": "single", "q": "Політикою гласності, започаткованою партійно-радянським керівництвом СРСР у період «перебудови», передбачалось", "sec": "", "g": "", "opts": ["пом’якшення цензури, можливість говорити правду, критикувати органи влади, отримувати об’єктивну інформацію.", "впровадження нової політичної системи на основі панування закону, дотримання прав людини.", "скорочення бюрократичного апарату, зміцнення місцевого самоврядування та децентралізація влади.", "поступовий перехід влади на всіх рівнях від партійного апарату до рад народних депутатів."]}, {"id": "1.36", "n": 5, "t": "single", "q": "Яку позицію займало партійне керівництво УРСР на чолі з В. Щербицьким щодо реформаторського курсу М. Горбачова впродовж 1985-1987 рр.?", "sec": "", "g": "", "opts": ["Категорична відмова від підтримки курсу «перебудови», ініціювання заходів, спрямованих на усунення М. Горбачова від влади.", "Засудження курсу «перебудови» та розроблення власної концепції реформування УРСР на засадах ринкової економіки.", "Підтримка та активне впровадження в республіці партійного курсу на демократизацію суспільного життя.", "Офіційна підтримка курсу «перебудови» та фактичне блокування реформаторських кроків союзного партійного керівництва."]}, {"id": "N11", "n": 6, "t": "single", "q": "Після виборів 1990 р. В. Чорновіл очолив", "sec": "", "g": "", "opts": ["Раду Міністрів УРСР.", "Народну Раду — опозицію у Верховній Раді УРСР.", "Львівську обласну раду.", "Верховну Раду УРСР."]}, {"id": "N12", "n": 7, "t": "single", "q": "Прочитайте уривок із закону та виконайте завдання. «Соціалістичне самоврядування реалізується в умовах широкої гласності шляхом участі всього колективу та його громадських організацій у виробленні найважливіших рішень і контролі за їх виконанням, виборності керівників та єдиноначальності в управлінні підприємством…» Наведені положення запроваджено", "sec": "", "g": "", "opts": ["Законом СРСР «Про державне підприємство (об’єднання)» 1987 р.", "Законом СРСР «Про кооперацію в СРСР» 1988 р.", "Законом УРСР «Про економічну самостійність Української РСР» 1990 р.", "постановою ЦК КПРС і Ради Міністрів СРСР про господарську реформу 1965 р."]}, {"id": "1.13", "n": 8, "t": "single", "q": "Прочитайте уривок з історичного джерела та виконайте завдання. «У зараженому радіацією Чорнобилі влаштовували «показушні» весілля, фальшиві гулянки, паради. У дні всенародної жалоби було влаштовано першотравневу демонстрацію на Хрещатику в Києві, де оголені діти, нічого не підозрюючи, танцювали перед трибунами, потішаючи тих, котрі знали – зобов’язані були знати! – весь трагізм ситуації, що склалася...». Зазначені вище заходи проводилися партійно-радянським керівництвом з метою", "sec": "", "g": "", "opts": ["приховати факт вибуху ядерного реактора та реальні масштаби й наслідки техногенної катастрофи.", "продемонструвати світові єдність Комуністичної партії України та народу в умовах надзвичайної ситуації.", "переконати радянське суспільство в безпечності використання атомної енергії в мирних цілях.", "засвідчити непохитність радянської традиції святкування Міжнародного дня солідарності трудящих за будь-яких обставин."]}, {"id": "N9", "n": 9, "t": "single", "q": "Чорнобильська катастрофа та замовчування її наслідків владою стали поштовхом до", "sec": "", "g": "", "opts": ["виникнення екологічного руху, створення асоціації «Зелений світ».", "ухвалення Декларації про державний суверенітет України.", "відмови СРСР від розвитку атомної енергетики.", "відставки М. Горбачова з посади генерального секретаря ЦК КПРС."]}, {"id": "2.7", "n": 10, "t": "single", "q": "Яка з фотографій відображає події доби «перебудови»?", "sec": "", "g": "", "img": ["q_bd6d42b03d"], "opts": ["А", "Б", "В", "Г"]}, {"id": "1.34", "n": 11, "t": "single", "q": "У якому уривку з історичних джерел охарактеризовано окремі аспекти соціально-економічного розвитку України в період «перебудови»?", "sec": "", "g": "", "opts": ["«За оцінками експертів у вітчизняному виробництві частка тіньового сектора фактично зрівнялась з часткою офіційною. Це явище супроводжувалося зростанням обсягів нелегального вивозу капіталу...»", "«В Україні… понад мільйон осіб, винних у порушенні антиалкогольного законодавства, зазнали адміністративних стягнень. У Закарпатті та в Криму знищили виноградники унікальних сортів...»", "«Продукція соціалістичної індустрії України зросла вдвоє. Почали діяти нові підприємства (Запорізький комбінат, Новокраматорський машинобудівний завод, Криворізький металургійний завод)…»", "«Характерним для цього періоду було суттєве зниження плану заготівель зерна, підвищення у 1,5-2 рази цін на сільськогосподарську продукцію, збільшення капіталовкладень у сільське господарство...»"]}, {"id": "N7", "n": 12, "t": "single", "q": "Яка церква наприкінці 1980-х рр. відновила легальну діяльність, яку було заборонено 1946 р. після Львівського церковного собору?", "sec": "", "g": "", "opts": ["Українська автокефальна православна церква", "Українська православна церква Київського патріархату", "Римсько-католицька церква", "Українська греко-католицька церква"]}, {"id": "1.12", "n": 13, "t": "single", "q": "У якому році розповсюджувалася зображена агітаційна листівка?", "sec": "", "g": "", "img": ["q_b7213d62eb"], "opts": ["1985 р.", "1989 р.", "1990 р.", "1991 р."]}, {"id": "1.7", "n": 14, "t": "single", "q": "Розгляньте фото історичних джерел і виконайте завдання. Наведені джерела доречно використовувати, створюючи презентацію на тему:", "sec": "", "g": "", "img": ["q_a65cb89ab8"], "opts": ["«Повернення історичної пам’яті народу України».", "«Формування багатопартійної системи в Україні».", "«Активізація дисидентського руху в Україні».", "«Початок державотворчих процесів в Україні»."]}, {"id": "1.39", "n": 15, "t": "single", "q": "Важливим кроком до об’єднання національно-демократичних сил наприкінці 1980-х років було", "sec": "", "g": "", "opts": ["проведення акції «Українська хвиля» – утворення «живого ланцюга» від Львова до Києва.", "проведення перших альтернативних виборів до Верховної Ради УРСР.", "формування всеукраїнської організації – Народного руху України за перебудову.", "падіння авторитету Комуністичної партії України в суспільстві."]}, {"id": "N4", "n": 16, "t": "single", "q": "Український культурологічний клуб, Товариство Лева, товариство «Меморіал», що виникли в Україні у 1987–1989 рр., належали до", "sec": "", "g": "", "opts": ["неформальних організацій.", "дисидентських груп.", "незалежних профспілок.", "політичних партій."]}, {"id": "N10", "n": 17, "t": "single", "q": "Головою Товариства української мови імені Т. Шевченка, створеного 1989 р., став", "sec": "", "g": "", "opts": ["Л. Лук’яненко.", "В. Чорновіл.", "Д. Павличко.", "І. Драч."]}, {"id": "1.33", "n": 18, "t": "single", "q": "Вибори до Верховної Ради УРСР, «...які вперше за радянських часів були альтернативними (на 450 мандатів у Верховну Раду УРСР претендувало майже 3 тис. кандидатів)», відбулися в", "sec": "", "g": "", "opts": ["квітні 1985 р.", "вересні 1989 р.", "березні 1990 р.", "грудні 1991 р."]}, {"id": "1.10", "n": 19, "t": "single", "q": "Як називалась парламентська опозиція у Верховній Раді УРСР (Верховній Раді України 1-го скликання, 1990-1994 рр.)?", "sec": "", "g": "", "opts": ["Народна Рада", "«Група 239»", "Українська Гельсінська група", "Народний рух України"]}, {"id": "1.21", "n": 20, "t": "single", "q": "Зображена карикатура акцентує увагу на суперечливих наслідках реалізації", "sec": "", "g": "", "img": ["q_498b316dc7"], "opts": ["політики «перебудови» М. Горбачова.", "«надпрограм» М. Хрущова.", "економічної реформи О. Косигіна.", "продовольчої програми Л. Брежнєва."]}, {"id": "1.14", "n": 21, "t": "single", "q": "24 серпня 1991 р. Верховна Рада УРСР ухвалила", "sec": "", "g": "", "opts": ["Угоду про створення Співдружності Незалежних Держав.", "Акт проголошення незалежності України.", "Декларацію про державний суверенітет України.", "Закон «Про економічну самостійність Української РСР»."]}, {"id": "1.30", "n": 22, "t": "single", "q": "«Українська РСР самостійно визначає свій економічний статус і закріплює його в законах. ...Українська РСР має право на свою частку в загальносоюзному багатстві. ...Відносини Української РСР з іншими радянськими республіками будуються на основі договорів, укладених на принципах рівноправності, взаємоповаги і невтручання у внутрішні справи...». Наведені положення документа декларують право України на", "sec": "", "g": "", "opts": ["плюралізм.", "суверенітет.", "гласність.", "незалежність."]}, {"id": "1.25", "n": 23, "t": "single", "q": "ПОСТАНОВА ВЕРХОВНОЇ РАДИ УКРАЇНИ «Про військові формування на Україні». Верховна Рада України постановляє: 1. Підпорядкувати всі військові формування, дислоковані на території республіки, Верховній Раді України. 2. Утворити Міністерство оборони України. 3. Урядові України приступити до створення Збройних Сил України, республіканської гвардії та підрозділу охорони Верховної Ради, Кабінету Міністрів і Національного банку України. Верховна Рада України підпорядковувала собі всі військові формування на території республіки, оскільки", "sec": "", "g": "", "opts": ["існувала необхідність переозброєння військових формувань", "існувала небезпека встановлення військової диктатури.", "утвердилася парламентська форма правління.", "була на той час єдиним легітимним вищим органом влади."]}, {"id": "1.29", "n": 24, "t": "single", "q": "Які наслідки для України мав заколот ГКЧП (ДКНС) у Москві?", "sec": "", "g": "", "opts": ["підписання УРСР нового союзного договору", "проголошення незалежності України", "усунення В. Щербицького від влади в УРСР", "негайний вихід КПУ зі складу КПРС"]}, {"id": "N6", "n": 25, "t": "single", "q": "Під час референдуму 17 березня 1991 р. громадяни УРСР, крім загальносоюзного питання, відповідали на республіканське питання про", "sec": "", "g": "", "opts": ["надання Кримській області статусу автономної республіки у складі УРСР.", "запровадження в Україні посади Президента, якого обирають усенародно.", "підтвердження Акта проголошення незалежності України, ухваленого Верховною Радою.", "перебування України в Союзі радянських суверенних держав на засадах Декларації про суверенітет."]}, {"id": "N13", "n": 26, "t": "single", "q": "Прочитайте уривок із документа та виконайте завдання. «...Рада Міністрів УРСР зобов’язала виконкоми місцевих Рад народних депутатів Кримської області вжити додаткових заходів для своєчасного надання в установленому порядку кримським татарам, які повертаються, земельних ділянок для будівництва житлових будинків...» Масове повернення кримських татар, про яке йдеться в документі, стало можливим після", "sec": "", "g": "", "opts": ["відновлення Кримської АРСР у складі УРСР за підсумками референдуму (1991 р.).", "засудження «культу особи» Й. Сталіна на ХХ з’їзді КПРС (1956 р.).", "проголошення незалежності України Верховною Радою УРСР (1991 р.).", "визнання Верховною Радою СРСР депортації народів незаконною і злочинною (1989 р.)."]}, {"id": "1.40", "n": 27, "t": "single", "q": "У якому році в СРСР, завдяки активності церкви та віруючих, відбулося святкування тисячоліття хрещення Русі?", "sec": "", "g": "", "opts": ["1980 р.", "1985 р.", "1988 р.", "1990 р."]}, {"id": "2.6", "n": 28, "t": "single", "q": "Яка з фотографій засвідчує громадсько-політичну активність в Україні за доби «перебудови»?", "sec": "", "g": "", "img": ["q_a36ffe3471"], "opts": ["А", "Б", "В", "Г"]}, {"id": "1.53", "n": 29, "t": "match", "q": "Установіть відповідність між уривком із джерела (1–4) та періодом в історії України (А – Д), коли його створено.", "sec": "", "g": "", "opts": ["радянська модернізація України (1928-1938 рр.)", "повоєнна відбудова та розвиток (1946 – початок 1950-х рр.)", "політична та економічна лібералізація суспільства (1953-1964 рр.)", "загострення кризи радянської системи (1965-1985 рр.)", "розпад Радянського Союзу та відродження незалежності України (1985-1991 рр.)"], "left": ["«Хто оволодіє кукурудзою, той доб'ється піднесення у тваринництві. Той, хто займе щодо цієї культури консервативну позицію, буде викинутий життям із сідла...»", "«Зворотний бік буржуазного націоналізму – безрідний космополітизм, який проявляється в плазуванні перед буржуазною культурою і в низькопоклонстві перед іноземщиною...»", "«Прискорення, гласність, «очищення» соціалізму від негативних нашарувань минулого. Ось головні завдання. Так вимагає час, іншої альтернативи для нас немає...»", "«Основою партійного підходу до розв'язання економічних проблем розвиненого соціалізму є незмінна вимога – все в ім'я людини, все для блага людини...»"]}, {"id": "2.37", "n": 30, "t": "match", "q": "Установіть відповідність між плакатом (1–4) та періодом в історії України (А – Д).", "sec": "", "g": "", "img": ["q_33a1ac80a0"], "opts": ["радянська модернізація України (1928-1938 рр.)", "повоєнна відбудова та розвиток (1946 – початок 1950-х рр.)", "політична та економічна лібералізація суспільства (1953-1964 рр.)", "загострення кризи радянської системи (1965-1985 рр.)", "розпад Радянського Союзу та відродження незалежності України (1985-1991 рр.)"], "left": ["Плакат 1", "Плакат 2", "Плакат 3", "Плакат 4"]}, {"id": "2.36", "n": 31, "t": "match", "q": "Установіть відповідність між визначенням (1–4) і терміном (А – Д).", "sec": "", "g": "", "opts": ["плюралізм", "політична криза", "госпрозрахунок", "суверенітет", "декларація"], "left": ["принцип суспільно-політичного та соціального розвитку, що базується на існуванні декількох чи багатьох незалежних начал політичних знань і розуміння буття", "повна незалежність держави від інших держав в її внутрішній і зовнішній політиці", "тимчасове призупинення або припинення функціонування окремих елементів або інститутів політичної системи", "метод господарювання, що поєднує централізоване керівництво з певною господарською самостійністю підприємств"]}, {"id": "Ma", "n": 32, "t": "match", "q": "Установіть відповідність між діячем (1–4) та фактом його біографії (А – Д).", "sec": "", "g": "", "opts": ["перший голова Народного руху України за перебудову", "голова Ради Міністрів УРСР, відставки якого вимагали учасники студентського голодування восени 1990 р.", "голова Верховної Ради УРСР, за головування якого ухвалено Акт проголошення незалежності України", "голова Української Гельсінської спілки, автор тексту Акта проголошення незалежності України", "голова Верховної Ради УРСР у червні–липні 1990 р., який залишив посаду, перейшовши на роботу до Москви"], "left": ["Л. Кравчук", "І. Драч", "Л. Лук’яненко", "В. Масол"]}, {"id": "2.30", "n": 33, "t": "seq", "q": "Установіть послідовність подій.", "sec": "", "g": "", "opts": ["початок перебудови", "спроба державного перевороту в СРСР (ДКНС)", "обрання М. Горбачова генеральним секретарем ЦК КПРС", "катастрофа на Чорнобильській АЕС"]}, {"id": "2.29", "n": 34, "t": "seq", "q": "Установіть послідовність подій, про які йдеться в уривках джерел.", "sec": "", "g": "", "opts": ["Українська РСР як суверенна національна держава розвивається в існуючих кордонах на основі здійснення українською нацією свого невід'ємного права на самовизначення. Українська РСР здійснює захист і охорону національної державності українського народу.", "Необхідність прискорення соціально-економічного розвитку насамперед визначається нашими внутрішніми потребами. <…> Не можна не бачити, що від початку 70-х рр. стали відчуватися певні труднощі в економічному розвитку.", "...Із метою забезпечення умов розслідування справи та стабілізації суспільно-політичної ситуації...Президія Верховної Ради України постановляє: 1. Припинити діяльність Компартії України до остаточного розслідування обставин, пов'язаних із державним переворотом", "Потім із зони реактора протягом декількох днів витікав сильний струмінь газоподібних та летких речовин. <...> Перші два тижні особливу небезпеку становлять ізотоп йоду-131 (уміст 10-15 %), що легко потрапляє в організм людини з їжею (особливо з молоком)"]}, {"id": "2.33", "n": 35, "t": "seq", "q": "Розгляньте зображення документів і фото. Установіть послідовність подій, з якими вони пов’язані.", "sec": "", "g": "", "img": ["q_1583e5206b"], "opts": ["Зображення А", "Зображення Б", "Зображення В", "Зображення Г"]}, {"id": "1.47", "n": 36, "t": "seq", "q": "Установіть послідовність епох, відображених на радянських пропагандистських плакатах.", "sec": "", "g": "", "img": ["q_05553cf6b8"], "opts": ["Зображення А", "Зображення Б", "Зображення В", "Зображення Г"]}, {"id": "2.25", "n": 37, "t": "three", "q": "Які події відбулися в 1985–1991 рр.?", "sec": "", "g": "", "opts": ["Передача Кримської області до складу УРСР", "Усунення В. Щербицького від влади", "Створення Української Гельсінської спілки", "Схвалення нової Конституції УРСР", "Господарська реформа під керівництвом О. Косигіна", "Арешт і ув’язнення поета В. Стуса", "Прийняття Закону про мови в УРСР"]}, {"id": "Tc", "n": 38, "t": "three", "q": "Які події відбулися в Україні в грудні 1991 р.?", "sec": "", "g": "", "opts": ["обрання Л. Кравчука Президентом України", "створення Співдружності Незалежних Держав", "запровадження гривні як національної валюти", "ухвалення Декларації про державний суверенітет України", "ухвалення Акта проголошення незалежності України", "ухвалення першої Конституції незалежної України", "Всеукраїнський референдум на підтвердження незалежності"]}, {"id": "2.26", "n": 39, "t": "three", "q": "Позначте причини загострення економічної кризи у 1989-1990 рр.", "sec": "", "g": "", "opts": ["зношеність основних фондів у промисловості", "зберігання значної частки ручної праці у промисловості", "значне переважання виробництва товарів народного споживання", "ліквідація колгоспно-радгоспної системи", "руйнування економічних зв’язків між республіками", "безкоштовне постачання промислової продукції до братських соціалістичних країн", "швидке зростання продуктивності праці в сільському господарстві"]}, {"id": "1.45", "n": 40, "t": "three", "q": "Які судження щодо зображеного плаката є правильними?", "sec": "", "g": "", "img": ["q_9eb439195c"], "opts": ["Плакат має сатиричний характер.", "Плакат акцентує увагу на вадах системи оплати праці та заохочення працівників культури.", "Плакат пропагує здобутки та переваги радянського способу життя.", "Плакат створено в роки «перебудови».", "На плакаті художніми засобами відображено дефіцит товарів широкого вжитку.", "Плакат присвячено здобуткам у мистецькому житті.", "Плакат стимулює почуття патріотизму, гордості за країну."]}], "pass_pct": 75, "minutes": 60}, "t2": {"name": "Тест 2 · контрольний", "tasks": [{"id": "N15", "n": 1, "t": "single", "q": "Що стало одним із наслідків аварії на Чорнобильській АЕС 1986 р.?", "sec": "", "g": "", "opts": ["відселення мешканців 30-кілометрової зони, зокрема міста Прип’ять", "зупинення всіх атомних електростанцій України", "негайне оприлюднення радянським керівництвом повних даних про масштаби аварії", "евакуація населення Києва на кілька місяців"]}, {"id": "1.3", "n": 2, "t": "single", "q": "«…Багато зараз незвичного в нашій країні: скажімо, багатомандатні округи з виборів до Рад; спільні з іноземними фірмами підприємства; самофінансування заводів та фабрик, радгоспів і колгоспів; зняття обмежень з підсобних господарств, ...розширення кооперативної діяльності; заохочення індивідуальної трудової діяльності в дрібному виробництві й торгівлі…». Зазначені в документі зміни названо «незвичними», оскільки вони", "sec": "", "g": "", "opts": ["утверджували однопартійну систему.", "створювали ілюзію економічного процвітання.", "були запроваджені як тимчасові.", "йшли в розріз з комуністичною теорією."]}, {"id": "1.4", "n": 3, "t": "single", "q": "«…Багато зараз незвичного в нашій країні: скажімо, багатомандатні округи з виборів до Рад; спільні з іноземними фірмами підприємства; самофінансування заводів та фабрик, радгоспів і колгоспів; зняття обмежень з підсобних господарств, ...розширення кооперативної діяльності; заохочення індивідуальної трудової діяльності в дрібному виробництві й торгівлі…». Заходи, указані в документі, упроваджували з метою", "sec": "", "g": "", "opts": ["формування потужного державного сектора економіки.", "відновлення адміністративних методів управління.", "подолання кризових явищ у радянській економіці.", "утвердження екстенсивних методів господарювання."]}, {"id": "N8", "n": 4, "t": "single", "q": "Хто у вересні 1989 р. змінив В. Щербицького на посаді першого секретаря ЦК Компартії України?", "sec": "", "g": "", "opts": ["Л. Кравчук", "С. Гуренко", "В. Івашко", "В. Масол"]}, {"id": "N14", "n": 5, "t": "single", "q": "Релігійне життя в Україні наприкінці 1980-х рр. характеризувалося", "sec": "", "g": "", "opts": ["забороною діяльності всіх релігійних громад, крім Російської православної церкви.", "ліквідацією Української автокефальної православної церкви за рішенням союзної влади.", "виходом із підпілля греко-католицької церкви та відродженням автокефальної православної церкви.", "об’єднанням усіх християнських церков України в єдину державну церкву під контролем влади."]}, {"id": "1.23", "n": 6, "t": "single", "q": "Загальноукраїнський страйк як форму соціально-політичного протесту в Українській РСР влітку 1989 р. започаткували", "sec": "", "g": "", "opts": ["шахтарі.", "металурги.", "учителі.", "лікарі."]}, {"id": "1.38", "n": 7, "t": "single", "q": "У яких уривках з історичних джерел охарактеризовано окремі аспекти соціально-економічного розвитку України в 90-х рр. XX ст.? 1. «В Україні кількість торговельних точок, що реалізовували спиртні напої, зменшилася вдвоє. Понад мільйон осіб, винних у порушенні антиалкогольного законодавства, зазнали адміністративних стягнень. У Закарпатті та в Криму знищили виноградники, зокрема унікальних сортів. Поширилося самогоноваріння». 2. «...За експертними оцінками у вітчизняному виробництві частка тіньового сектора фактично зрівнялась з часткою офіційною. Це явище логічно супроводжується зростанням масштабів нелегального вивозу капіталу».", "sec": "", "g": "", "opts": ["Охарактеризовано в обох уривках.", "Тільки в першому.", "Тільки в другому.", "Не охарактеризовано в жодному з уривків."]}, {"id": "1.28", "n": 8, "t": "single", "q": "Зображений на фото документ, що видавався місцевими радами в Україні, свідчить про", "sec": "", "g": "", "img": ["q_7e68201697"], "opts": ["розквіт епохи «застою».", "провал політики «перебудови».", "запровадження політики «гласності».", "занепад «самвидаву»."]}, {"id": "1.19", "n": 9, "t": "single", "q": "Яку тенденцію суспільного життя України початку 1990-х рр. відображає карикатура? Підпис: \"План реєстрації нових партій у цьому місяці перевиконано! Зайдіть у наступному...\" Журнал «Перець». 1990 р.", "sec": "", "g": "", "img": ["q_7de477826e"], "opts": ["Формування багатопартійної системи.", "Відсутність політичної культури.", "Політична консолідація суспільства.", "Зростання відповідальності різних соціальних груп."]}, {"id": "1.44", "n": 10, "t": "single", "q": "«...Сам факт проведення з’їзду – серйозна поразка [компартійного] апарату. Тривалий час Україна була республікою «застою» й, нарешті, вона сказала своє вагоме слово. Було враховано помилки інших республік, і ми прийшли до з’їзду без катаклізмів... З’їзд став силою, що консолідувала людей різних поколінь, політичних поглядів, багатьох організацій». Подія, описана в джерелі,", "sec": "", "g": "", "opts": ["започаткувала процес розроблення нової Конституції.", "була складовою процесу формування багатопартійності.", "засвідчила факт розпаду Радянського Союзу.", "сприяла початку люстрації корумпованої влади."]}, {"id": "N2", "n": 11, "t": "single", "q": "Першим головою Народного руху України за перебудову на його установчому з’їзді було обрано", "sec": "", "g": "", "opts": ["Д. Павличка.", "В. Чорновола.", "Л. Лук’яненка.", "І. Драча."]}, {"id": "N1", "n": 12, "t": "single", "q": "Хто очолив Українську Гельсінську спілку (1988 р.)?", "sec": "", "g": "", "opts": ["В. Івашко", "Л. Лук’яненко", "І. Драч", "Л. Кравчук"]}, {"id": "N3", "n": 13, "t": "single", "q": "Закон «Про мови в Українській РСР», ухвалений у жовтні 1989 р.,", "sec": "", "g": "", "opts": ["надав українській мові статусу державної.", "заборонив використання мов національних меншин в офіційних установах.", "запровадив дві державні мови — українську та російську.", "скасував вивчення російської мови в школах республіки."]}, {"id": "1.17", "n": 14, "t": "single", "q": "В економічній сфері у період «перебудови» партійно-державне керівництво УРСР здійснило", "sec": "", "g": "", "opts": ["обмеження господарської самостійності промислових підприємств.", "ліквідацію галузевої системи управління народним господарством", "освоєння цілинних земель Казахстану, Сибіру, Північного Кавказу.", "запровадження орендних і кооперативних форм господарювання."]}, {"id": "1.9", "n": 15, "t": "single", "q": "Акція Народного руху України «Українська хвиля» (1990 р.) – утворення «живого ланцюга» від Львова до Києва – присвячувалася", "sec": "", "g": "", "opts": ["підтримці головних політичних вимог, висунутих учасниками шахтарського страйку.", "відзначенню річниці проголошення Директорією УНР Універсалу про возз’єднання УНР та ЗУНР.", "проведенню перших альтернативних виборів до Верховної Ради УРСР.", "прийняттю Верховною Радою УРСР Декларації про державний суверенітет України."]}, {"id": "1.8", "n": 16, "t": "single", "q": "Прочитайте уривок із резолюції одного з мітингів українських студентів і виконайте завдання. «Ми, студенти київських вузів, які зібралися до наметового містечка на підтримку голодуючих студентів.., вважаємо необхідним прийняття вимог голодуючих, а саме: 1. Відставка Голови Ради Міністрів В. Масола. 2. Націоналізація майна КПРС та ВЛКСМ на території України. 3. Прийняття рішення про службу юнаків у війську тільки в межах України…». У документі відображено вимоги протестувальників під час", "sec": "", "g": "", "opts": ["«Революції гідності».", "«Революції на граніті».", "«культурної революції».", "«Помаранчевої революції»."]}, {"id": "1.43", "n": 17, "t": "single", "q": "Яка територія Української РСР у лютому 1991 р. отримала статус автономії?", "sec": "", "g": "", "opts": ["Крим", "Закарпаття", "Буковина", "Донбас"]}, {"id": "1.16", "n": 18, "t": "single", "q": "16 липня 1990 р. Верховна Рада УРСР ухвалила", "sec": "", "g": "", "opts": ["Закон «Про економічну самостійність Української РСР».", "Декларацію про державний суверенітет України.", "Акт проголошення незалежності України.", "Угоду про створення Співдружності Незалежних Держав."]}, {"id": "1.20", "n": 19, "t": "single", "q": "Витяг з якого документа подано нижче? «Українська РСР забезпечує верховенство Конституції та законів Республіки на своїй території. Українська РСР самостійно визначає свій економічний статус і закріплює його в законах... Українська РСР має право на власні Збройні Сили…»", "sec": "", "g": "", "opts": ["Декларація про державний суверенітет України", "Акт проголошення незалежності України", "Декларація прав національностей України", "Закон «Про економічну самостійність Української РСР»"]}, {"id": "1.35", "n": 20, "t": "single", "q": "Верховна Рада УРСР ухвалила Закон «Про економічну самостійність Української РСР» з метою", "sec": "", "g": "", "opts": ["впровадження в Україні основних засад політики «перебудови».", "подолання наслідків державного перевороту 19-24 серпня 1991 р.", "реалізації рішень Всесоюзного референдуму 17 березня 1991 р.", "втілення положень Декларації про державний суверенітет України."]}, {"id": "N16", "n": 21, "t": "single", "q": "Прочитайте уривок з історичного джерела та виконайте завдання. «Уранці 19 серпня командуючий сухопутними військами СРСР генерал В. Варенников, прибувши з групою військових до кабінету Голови Верховної Ради УРСР, в ультимативній формі заявив Л. Кравчуку: «Влада перейшла до ДКНС, який врятує країну. Рекомендую Вам зайняти правильну позицію. Змінити свій особистий курс і курс Верховної Ради...» Якою була позиція Л. Кравчука в перші дні описаних подій?", "sec": "", "g": "", "opts": ["підтримка ДКНС і запровадження надзвичайного стану на території УРСР", "негайне засудження заколоту та заклик до загального політичного страйку", "відставка з посади Голови Верховної Ради УРСР на знак протесту", "вичікувальна: не підтримав ДКНС відкрито, але й не засудив його, закликавши до спокою"]}, {"id": "1.26", "n": 22, "t": "single", "q": "ПОСТАНОВА ВЕРХОВНОЇ РАДИ УКРАЇНИ «Про військові формування на Україні». Верховна Рада України постановляє: 1. Підпорядкувати всі військові формування, дислоковані на території республіки, Верховній Раді України. 2. Утворити Міністерство оборони України. 3. Урядові України приступити до створення Збройних Сил України, республіканської гвардії та підрозділу охорони Верховної Ради, Кабінету Міністрів і Національного банку України. Поява цитованого документа зумовлена", "sec": "", "g": "", "opts": ["ухваленням Конституції України.", "реалізацією курсу на вступ України до НАТО.", "втіленням політики ядерного роззброєння України.", "проголошенням незалежності України."]}, {"id": "1.27", "n": 23, "t": "single", "q": "ПОСТАНОВА ВЕРХОВНОЇ РАДИ УКРАЇНИ «Про військові формування на Україні». Верховна Рада України постановляє: 1. Підпорядкувати всі військові формування, дислоковані на території республіки, Верховній Раді України. 2. Утворити Міністерство оборони України. 3. Урядові України приступити до створення Збройних Сил України, республіканської гвардії та підрозділу охорони Верховної Ради, Кабінету Міністрів і Національного банку України. Ухвалення цитованого документа свідчить про початок в Україні процесів", "sec": "", "g": "", "opts": ["люстрації.", "декомунізації.", "державотворення.", "мілітаризації."]}, {"id": "1.41", "n": 24, "t": "single", "q": "Які обставини спричинили появу цитованої нижче постанови? «Розглянувши висновки Тимчасової комісії Президії Верховної Ради України по перевірці діяльності... посадових осіб органів влади, управління, громадських об’єднань... Президія Верховної Ради України постановляє: 1. Відповідно до частини другої статті 7 та керуючись пунктом 6 статті 106 Конституції України, заборонити діяльність Компартії України».", "sec": "", "g": "", "opts": ["бойкот і саботаж Компартією України другого туру виборів до Верховної Ради України у березні 1990 р.", "підтримка керівництвом Компартії України спроби державного перевороту 19-21 серпня 1991 р. та сприяння його здійсненню в Україні", "засудження вищим партійним керівництвом республіки Акта проголошення незалежності України 24 серпня 1991 р.", "блокування місцевими партійними органами республіки підготовки до всеукраїнського референдуму 1 грудня 1991 р."]}, {"id": "2.9", "n": 25, "t": "single", "q": "Яке питання було винесено на Всеукраїнський референдум 1 грудня 1991 р.?", "sec": "", "g": "", "opts": ["«Чи підтверджуєте Ви Угоду про створення Співдружності Незалежних Держав?»", "«Чи вважаєте Ви необхідним заборонити Комуністичну партію Радянського Союзу?»", "«Чи підтверджуєте Ви Акт проголошення незалежності України?»", "«Чи вважаєте Ви необхідним збереження СРСР як оновленої федерації рівноправних суверенних республік?»"]}, {"id": "1.32", "n": 26, "t": "single", "q": "Яка подія дала поштовх процесу міжнародного визнання України як незалежної держави?", "sec": "", "g": "", "opts": ["утворення Співдружності Незалежних Держав", "проведення Всеукраїнського референдуму", "прийняття Декларації про державний суверенітет України", "схвалення Акта проголошення незалежності України"]}, {"id": "1.5", "n": 27, "t": "single", "q": "В уривку джерела: «Кравчук привіз нам з Біловезької Пущі, якщо вдуматися, відпускну грамоту від Росії. Документ, підписаний ним,.. відмінив, у широкому історичному сенсі, усе, що колись прив'язувало Україну до Росії. Ці акти хоч і давно належали минулому, але зберігали для когось символічне значення» надано оцінку", "sec": "", "g": "", "opts": ["укладенню Договору про дружбу, співробітництво й партнерство між Україною та Росією.", "вступу України до Організації Об'єднаних Націй.", "підписанню Будапештського меморандуму.", "припиненню існування Радянського Союзу."]}, {"id": "N5", "n": 28, "t": "single", "q": "Хто з кандидатів на виборах Президента України 1 грудня 1991 р. посів друге місце, здобувши понад 23 % голосів?", "sec": "", "g": "", "opts": ["В. Чорновіл", "І. Юхновський", "В. Гриньов", "Л. Лук’яненко"]}, {"id": "2.35", "n": 29, "t": "match", "q": "Установіть відповідність між датою (1–4) та уривком джерела (А – Д), що описує подію цього часу.", "sec": "", "g": "", "opts": ["У Народному Русі об'єдналися люди різних політичних переконань – від ліберальних комуністів до тих, хто сповідував ідеї інтегрального націоналізму. Але домінували в організації настрої національної демократії.", "На пленумі ЦК КПРС проголосив курс на перебудову радянського суспільства, прискорення соціально-економічного розвитку і розширення гласності в СРСР. Складовими цього курсу мали стати: науково-технічний прогрес; технічне переозброєння машинобудування; активізація «людського фактору».", "Напередодні виборів було утворено Демократичний блок, який об’єднав усі опозиційні сили. Його основу становив Народний рух України за перебудову та різні неформальні організації. На 450 парламентських місць претендувало 3 тис. кандидатів.", "Студенти ж зазначили, що боротьба тільки починається, однак обіцянку виконали і припинили голодування. Доній та Іващишин виступили по телебаченню, де зазначили, що «Голодування припиняється. Перемога». Було звільнено корпуси КДУ, політехнічного інституту, розібрано наметове містечко біля Верховної Ради.", "В п. І Декларації УРСР подана як «суверенна національна держава», хоч за чинною в той час конституцією вона була союзною республікою з обмеженим суверенітетом. Зокрема, вона не мала власних збройних сил, не мала дипломатичних стосунків з країнами поза радянським блоком"], "left": ["Вересень 1989 року", "Жовтень 1990 року", "Квітень 1985 року", "Березень 1990 року"]}, {"id": "1.52", "n": 30, "t": "match", "q": "Установіть відповідність між періодом в історії України (1–4) та подією (А – Д).", "sec": "", "g": "", "opts": ["«саморозпуск» Української греко-католицької церкви (УГКЦ)", "утворення Народного комісаріату закордонних справ УРСР", "входження Кримської області до складу УРСР", "прийняття останньої Конституції УРСР", "проведення альтернативних виборів до Верховної Ради УРСР"], "left": ["повоєнна відбудова та розвиток (1946 – початок 1950-х рр.)", "політична та економічна лібералізація суспільства (1953-1964 рр.)", "загострення кризи радянської системи (1965-1985 рр.)", "розпад СРСР та відродження незалежності України (1985-1991 рр.)"]}, {"id": "2.38", "n": 31, "t": "match", "q": "Установіть відповідність між поняттям (1–4) та його визначенням (А – Д).", "sec": "", "g": "", "opts": ["верховенство держави на своїй території і незалежність у міжнародних відносинах, при цьому верховенство держави означає дію в межах її території тільки однієї публічної влади, яка визначає повноваження усіх державних органів і посадових осіб, а також підлеглість цій владі всього населення території.", "господарська діяльність, яка розвивається поза державним обліком та контролем, а тому не відображається в офіційній статистиці. Підприємства не перерозподіляють власних доходів до бюджетів та державних цільових фондів, вони не сплачують податків, збільшуючи власні прибутки.", "загальна назва сукупності політичних і економічних реформ, що проводилися в СРСР, складовими якої були політика гласності та демократизація суспільного життя, введення елементів ринкових відносин, відмова від надмірної критики так званого капіталістичного ладу, значне поліпшення відносин з країнами Заходу", "добровільна неприбуткова соціально спрямована діяльність, що здійснюється шляхом надання безоплатних робіт та послуг; форма благодійної діяльності, що ґрунтується на принципах законності, гуманності, рівності, добровільності, безоплатності та неприбутковості.", "характеристика політичної системи суспільства, за якої соціальні групи мають можливість висловлювати власні позиції через своїх представників у політичних і громадських організаціях, передбачає різні позиції, погляди, що відображають розмаїтість інтересів у суспільстві"], "left": ["Перебудова", "Плюралізм", "Суверенітет", "Тіньова економіка"]}, {"id": "Mb", "n": 32, "t": "match", "q": "Установіть відповідність між громадською організацією (1–4) та її характеристикою (А – Д).", "sec": "", "g": "", "opts": ["екологічна асоціація, що постала як відповідь на замовчування наслідків Чорнобильської катастрофи", "перша масова опозиційна організація, утворена на основі правозахисної групи 1976 р., що проголосила метою відновлення державності України", "товариство, що збирало відомості про жертв політичних репресій і домагалося вшанування їхньої пам’яті", "громадська організація, створена для захисту й розвитку української мови", "парламентська опозиція у Верховній Раді УРСР, сформована після виборів 1990 р."], "left": ["«Зелений світ»", "Товариство української мови імені Т. Шевченка", "«Меморіал»", "Українська Гельсінська спілка"]}, {"id": "2.34", "n": 33, "t": "seq", "q": "Установіть послідовність подій, про які йдеться в уривках джерел.", "sec": "", "g": "", "opts": ["Висувати кандидатів у депутати отримали право не тільки трудові колективи підприємств і установ, а навіть їх підрозділи та громадські організації за місцем їх реєстрації. В той же час, членів виборчих комісій, як і раніше, фактично підбирали парткоми підприємств та установ, а списки виборців складали райвиконкоми.", "Здійснювані спеціалістами з допомогою контрольної апаратури вимірювання свідчать про те, що реактор перебуває в заглушеному стані. Розгорнуто роботи по очистці забруднених ділянок прилеглої місцевості, до їх виконання залучено спеціалізовані підрозділи, оснащені необхідною сучасною технікою та ефективними засобами.", "Необхідність прискорення соціально-економічного розвитку насамперед визначається нашими внутрішніми потребами. <…> Не можна не бачити, що від початку 70-х рр. стали відчуватися певні труднощі в економічному розвитку. Головна причина <…> полягає в тому, що не була належною мірою врахована докорінна зміна економічної ситуації і не було виявлено необхідної наполегливості в перебудові структурної політики, форм і методів управління", "Українська РСР як суверенна національна держава розвивається в існуючих кордонах на основі здійснення українською нацією свого невід'ємного права на самовизначення. Українська РСР здійснює захист і охорону національної державності українського народу."]}, {"id": "1.48", "n": 34, "t": "seq", "q": "Установіть послідовність появи понять в історії УРСР.", "sec": "", "g": "", "opts": ["«розвинений соціалізм»", "«політична реабілітація»", "«гласність»", "«відбудова»"]}, {"id": "1.49", "n": 35, "t": "seq", "q": "Установіть послідовність створення документів, уривки з яких наведено.", "sec": "", "g": "", "opts": ["«Сприяти ознайомленню широких кіл української громадськості з Декларацією прав людини. Домагатися, щоб цей міжнародний правовий документ став основним у відносинах поміж особою і державою...»", "«У книзі, яка має назву “Україно наша Радянська”, непомірно багато місця відводиться минулому України, її дожовтневій історії, водночас слабо показуються такі епохальні події, як перемога Великого Жовтня, боротьба за побудову соціалізму...»", "«Соціалістичне самоврядування реалізується в умовах широкої гласності шляхом участі всього колективу та його громадських організацій у виробленні найважливіших рішень і контролі за їх виконанням, виборності керівників та єдиноначальності в управлінні підприємством...»", "«Ми, партія УРСС, є партія інтернаціоналістів. Боротьбу за самостійну Україну ми розвиватимемо разом із громадянами інших національностей, які населяють Україну...»"]}, {"id": "1.51", "n": 36, "t": "seq", "q": "Установіть послідовність ухвалення цитованих документів.", "sec": "", "g": "", "opts": ["«Метою нашого [представників Ради у справах греко-католицької церкви при Раді Міністрів СРСР] відрядження було з’ясування можливостей... ліквідації уніатської церкви Закарпаття та ставлення до цього партійних і радянських органів Закарпаття...»", "«Комуністи у своїх виступах піддали принциповій критиці новий роман О. Гончара «Собор». Висловлюючи жаль... що зрілий майстер художнього слова... як у кривому дзеркалі, показав працю, побут, духовний світ металургів і колгоспників Подніпров’я...»", "«Ми, керівники Республіки Бєларусь, РРФСР, України... констатуючи, що недалекоглядна політика центру призвела до глибокої економічної і політичної кризи... заявляємо про утворення Співдружності Незалежних Держав...»", "«У СРСР побудовано розвинене соціалістичне суспільство... зрілих соціалістичних суспільних відносин, у якому на основі... фактичної рівності всіх націй і народностей... склалася нова історична спільнота людей – радянський народ»."]}, {"id": "Ta", "n": 37, "t": "three", "q": "Що було характерним для економіки УРСР наприкінці 1980-х — 1991 р.?", "sec": "", "g": "", "opts": ["масова приватизація великих промислових підприємств", "насичення споживчого ринку товарами вітчизняного виробництва", "стабільне зростання реальних доходів населення", "зростання цін та знецінення грошей", "запровадження національної валюти — гривні", "наростання дефіциту товарів, запровадження талонів і «карток покупця»", "падіння обсягів промислового й сільськогосподарського виробництва"]}, {"id": "Tb", "n": 38, "t": "three", "q": "Що було характерним для політики «гласності»?", "sec": "", "g": "", "opts": ["скасування однопартійної системи вже 1985 р., /* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}

fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;
}, { passive: false });
lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {

  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}

/* Курс: вхід учня, бліци після частин, замки, Тест 1 і Тест 2, відправлення результатів у Google-таблицю.
   Дані: QUIZ ({blitz:{1:{n,pass,quota,pool}}, tests:{t1:{tasks}}}), COURSE_API (адреса Apps Script). */
const API = (typeof COURSE_API === 'string' && COURSE_API) || '';
const LET = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Є'];
const TYPE = { single: 'Одна правильна відповідь', three: 'Три правильні з семи', seq: 'Послідовність', match: 'Відповідність' };
const LBLRE = /^(?:Місцезнаходження |Місце |малюнок )?([А-ЕЄ]|\d)$/;
const isLbl = q => q.opts.every(o => LBLRE.test(o));
const lab = (q, j, k) => isLbl(q) && !(q.t === 'seq' && q.oimg) ? q.opts[j].match(LBLRE)[1] : q.t === 'three' ? k + 1 : LET[k];
/* порядок показу в бліці: мітки — як є (послідовність із мітками — за абеткою), решта — навмання */
function showOrder(q) {
  const idx = [...q.opts.keys()];
  if (!isLbl(q) || (q.t === 'seq' && q.oimg)) return shuffle(idx);
  return q.t === 'seq' ? idx.sort((a, b) => q.opts[a].localeCompare(q.opts[b], 'uk')) : idx;
}
const mlist = (q, order) => isLbl(q) ? '' : `<div class="mlist">${order.map((j, k) => `<div class="mo"><b class="a2">${LET[k]}</b> ${optHtml(q, j)}</div>`).join('')}</div>`;
const maxOf = q => q.t === 'single' ? 1 : q.t === 'match' ? 4 : 3;
function grade12(pc) { const t = [25, 33, 41, 49, 56, 63, 70, 77, 84, 91]; let g = 2; t.forEach((v, k) => { if (pc >= v) g = k + 3; }); return g; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (p, m) => m ? Math.round(1000 * p / m) / 10 : 0;
/* кількість частин курсу = кількість бліців; короткі перевірки після розділів — QUIZ.mini['<частина>-<розділ>'] */
const NP = Object.keys(QUIZ.blitz || {}).length || 3;
const PARTS_N = Array.from({ length: NP }, (_, i) => i + 1);
const MINI = QUIZ.mini || {};
const PASS = n => (QUIZ.blitz[n] && QUIZ.blitz[n].pass) || 75;
/* спільна оболонка кількох тем: один вхід на сторінці оболонки (SHELL_URL), учень — у спільному сховищі hist_*,
   прогрес теми — під власним префіксом; кожен запит до сервера несе позначку теми (TOPIC) */
const SH = (typeof SHELL_URL === 'string' && SHELL_URL) || '';
const TOPIC_ID = (typeof TOPIC === 'string' && TOPIC) || '';
const G_ = {
  get(k, d) { try { const v = localStorage.getItem('hist_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hist_' + k, JSON.stringify(v)); } catch (e) {} },
};
const ukey = u => u ? (u.cls + '|' + u.name).toLowerCase() : '';
if (SH) {   // на телефоні інший учень, ніж той, чий прогрес теми збережено, — прогрес цієї теми стираємо (черга лишається: там свої імена)
  const u = G_.get('user', null), own = store.get('owner', null) ?? ukey(store.get('user', null));
  if (u && own !== ukey(u)) {
    try { Object.keys(localStorage).filter(k => k.startsWith(PFX) && !k.startsWith(PFX + 'seen_') && k !== PFX + 'queue').forEach(k => localStorage.removeItem(k)); } catch (e) {}
    store.set('owner', ukey(u));
  } else if (u && own == null) store.set('owner', ukey(u));
}
const toShell = () => { location.replace(SH); };

/* ---------- учень і прогрес ---------- */
const U = {
  get user() { return SH ? G_.get('user', null) : store.get('user', null); },
  prog() { return store.get('prog', {}); },
  setProg(k, v) { const p = this.prog(); p[k] = v; store.set('prog', p); },
  passed(k) { const r = this.prog()[k]; return !!(r && r.pass); },
};
const unlocked = num => num === 1 || U.passed('b' + (num - 1));
const testOpen = id => id === 't1' ? PARTS_N.every(n => U.passed('b' + n)) : U.passed('t1');

/* ---------- зв’язок із сервером: черга, щоб нічого не губилося без інтернету ---------- */
const Net = {
  async call(body) {
    if (!API) throw new Error('no api');
    const u = U.user; if (u && u.pin && body.pin == null) body = { ...body, pin: u.pin };
    if (TOPIC_ID && body.topic == null) body = { ...body, topic: TOPIC_ID };
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), cache: 'no-store', redirect: 'follow' });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(); if (j.error) throw new Error(j.error); return j;
  },
  send(op, data) {
    const u = U.user; if (!u) return;
    const q = store.get('queue', []);
    q.push({ op, name: u.name, cls: u.cls, pin: u.pin, at: new Date().toISOString(), ...(TOPIC_ID ? { topic: TOPIC_ID } : {}), ...data });
    store.set('queue', q); this.flush();
  },
  busy: false,
  async flush() {
    if (this.busy || !API) return; this.busy = true;
    try {
      let q = store.get('queue', []);
      while (q.length) {
        const item = q[0], res = await this.call(item);
        q = store.get('queue', []); q.shift(); store.set('queue', q);
        if (item.op === 'test') this.onTest(item, res);
      }
    } catch (e) { const it = store.get('queue', [])[0], u = U.user;
      if (e.message === 'pin' && it && u && it.name === u.name && it.cls === u.cls) { this.busy = false; return badPin(); } /* інакше немає зв’язку — спробуємо пізніше */ }
    this.busy = false; paintSync();
  },
  onTest(sent, res) {
    U.setProg(sent.test, { ...res, at: sent.at });
    store.set('draft_' + sent.test, null);
    if (location.hash === '#' + sent.test) route();
  },
};
function paintSync() {
  const el = document.getElementById('sync'); if (!el) return;
  const n = store.get('queue', []).length;
  el.innerHTML = !API ? '' : n ? `⏳ Не надіслано результатів: <b>${n}</b>. Надішлеться, щойно з’явиться інтернет. <button class="lnk" id="syncgo">Надіслати зараз</button>` : '✓ Усі результати надіслано вчителю';
  const b = document.getElementById('syncgo'); if (b) b.onclick = () => Net.flush();
}
window.addEventListener('online', () => Net.flush());
setInterval(() => Net.flush(), 60000);

function draw(n, B, seenKey) {

  const seen = new Set(store.get(seenKey, [])), used = new Set(), out = [];
  const take = list => { for (const q of list) { if (out.length >= B.n) return; if (out.includes(q) || (q.g && used.has(q.g))) continue; out.push(q); if (q.g) used.add(q.g); return true; } };
  const fresh = list => shuffle(list).sort((a, b) => seen.has(a.id) - seen.has(b.id));
  Object.entries(B.quota || {}).forEach(([sec, k]) => { const c = fresh(B.pool.filter(q => q.sec === sec)); for (let i = 0; i < k; i++) if (!take(c)) break; });
  while (out.length < B.n && take(fresh(B.pool))) {}
  const order = Object.keys(B.quota || {});
  out.sort((a, b) => order.indexOf(a.sec) - order.indexOf(b.sec));
  return out;
}

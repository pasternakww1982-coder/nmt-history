<script>
const LESSONS = [{"id": "p1", "num": 1, "title": "Відновлення незалежності України (1985 – 1991)", "part": "Частина 1. Перебудова: реформи, Чорнобиль, криза", "sub": "Курс Горбачова, Чорнобильська катастрофа, економічні реформи, гласність, страйки й криза", "cover": {"key": "s001_image1", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Відновлення незалежності України»", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **квітень 1985 р.** — початок «перебудови»", "• **26 квітня 1986 р.** — катастрофа на Чорнобильській АЕС", "• решта дат теми (1989 – 1991) — у частині 2"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **«перебудова», «гласність», «плюралізм»**", "• **«ринкові відносини»**, **«багатопартійність»**", "• у частині 2: **«український національно-демократичний рух», «суверенітет», «незалежність», «референдум», «президент»**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналія", "light": false}, {"k": "p", "paras": ["• **Леонід Кравчук** — у частині 2 (портрет треба впізнавати)", "• для розуміння теми: **Михайло Горбачов** (у програмі НМТ окремо не названий)"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Уміння", "light": false}, {"k": "p", "paras": ["• пояснювати зміст і напрями політики перебудови", "• визначати причини поглиблення економічної кризи й падіння життєвого рівня", "• працювати з джерелами: документи, плакати, карикатури"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 30 «Відновлення незалежності України»."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Курс на «прискорення» (1985 – 1986)", "sub": "Новий генсек, гасла про науково-технічний прогрес, антиалкогольна кампанія", "cover": {"key": "s008_image4", "cap": ""}, "cards": [{"type": "text", "kicker": "Курс на «прискорення»", "title": "Михайло Горбачов і початок перебудови", "badges": ["НМТ: дата", "НМТ: поняття"], "paras": ["У 1982 – 1985 рр. один за одним померли три генеральні секретарі ЦК КПРС: **Брежнєв**, **Андропов** і **Черненко**. Андропов пробув при владі 15 місяців, Черненко — 13: через хворобу обидва майже не керували країною.", "У березні 1985 р. пленум ЦК КПРС обрав генеральним секретарем 54-річного **Михайла Горбачова** — наймолодшого члена Політбюро. Партійні керівники сподівалися, що він керуватиме довго.", "На **квітневому пленумі ЦК КПРС 1985 р.** Горбачов визнав, що економіка СРСР відстає від західної, і проголосив курс на «прискорення». **Перебудовою** згодом назвали всі зміни 1985 – 1991 рр.: гласність, демократизацію, перші кроки до ринкової економіки. У зовнішній політиці Горбачов проголосив **«нове політичне мислення»** — курс на завершення «холодної війни».", "Горбачов не збирався руйнувати радянську систему. Він хотів її оновити, зберігши владу КПРС і планову економіку."], "imgs": [{"key": "gorb87", "cap": "Михайло Горбачов, 1987 р. Фото: невідомий автор / Wikimedia Commons, Public domain"}, {"key": "stamp_perestr", "cap": "Поштова марка СРСР, 1988 р.: «Перебудова — продовження справи Жовтня. Прискорення, демократизація, гласність». Фото: Пошта СРСР / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Курс на «прискорення»", "title": "«Прискорення» (1985 – 1986)", "badges": [], "paras": ["Гасло «прискорення» означало: швидко оновити машинобудування, впровадити здобутки **науково-технічної революції** й підвищити продуктивність праці. Грошей на це державі бракувало, тому більшість планів уряд не виконав.", "Навесні 1986 р. уряд вирішив запровадити **«держприймання»** — додаткову державну перевірку якості на заводах. З 1 січня 1987 р. його ввели на 1500 підприємствах. Державні приймальники відхиляли неякісну продукцію, заводи через це не виконували план, а якість товарів майже не покращилася.", "Того ж 1986 р. влада почала боротися з **«нетрудовими доходами»** і водночас ухвалила закон **«Про індивідуальну трудову діяльність»**: тепер людина могла легально шити, лагодити взуття чи підвозити пасажирів за гроші.", "Горбачов замінив більшість керівників доби «застою» своїми прихильниками. В Україні ж **Володимир Щербицький** керував КПУ аж до вересня 1989 р. (про це — у частині 2)."], "imgs": [{"key": "s011_image10", "cap": "Карикатура на держприймання: «Брак! Не підпишу!» "}, {"key": "s017_image19", "cap": "«Крокодил», 1987 р.: «Покарати діда за нетрудові доходи чи заохотити за індивідуальну трудову діяльність?» "}]}, {"type": "text", "kicker": "Курс на «прискорення»", "title": "Антиалкогольна кампанія (з травня 1985 р.)", "badges": [], "paras": ["У травні 1985 р. ЦК КПРС ухвалив постанову **«Про заходи щодо подолання пияцтва й алкоголізму»**.", "Держава вдвічі скоротила виробництво спиртного, підвищила на нього ціни й дозволила продавати його лише кілька годин на день. Влада вимагала проводити весілля й банкети без алкоголю. У **Криму, на Закарпатті й Одещині** вирубали тисячі гектарів виноградників, зокрема рідкісних сортів.", "У перші роки кампанії люди рідше помирали від отруєнь і нещасних випадків, поменшало злочинів, зросла народжуваність. Але біля магазинів стояли величезні черги, люди масово гнали **самогон**, і тому із продажу зник цукор.", "Державний бюджет недоотримав мільярди карбованців: продаж горілки був одним з головних джерел його доходів."], "imgs": [{"key": "s009_image5", "cap": "Плакат «Викорінимо в зародку!» "}]}, {"type": "carousel", "title": "Антиалкогольна кампанія: джерела доби", "badges": [], "note": "Державний продаж спиртного в РРФСР упав з 10,5 л на людину (1984) до 3,9 л (1987). Насправді люди пили не настільки менше, бо замість горілки купували самогон. З 1988 р. уряд поступово скасовував обмеження, і продаж знову зріс.", "items": [{"key": "stamp_sober", "name": "", "desc": "Поштова марка СРСР «Тверезість — норма життя», 1985 р. Фото: Пошта СРСР / Wikimedia Commons, Public domain", "cap": ""}, {"key": "s010_image8", "name": "", "desc": "Черга до винного магазину, 1985 р. ", "cap": ""}, {"key": "s010_image9", "name": "", "desc": "Державний продаж алкоголю, літрів на душу населення (РРФСР, 1984 – 1991). ", "cap": ""}]}]}, {"id": "s2", "num": "II", "title": "Чорнобильська катастрофа (1986)", "sub": "Найбільша аварія в історії ядерної енергетики — і мовчання влади", "cover": {"key": "pripyat", "cap": ""}, "cards": [{"type": "text", "kicker": "Чорнобиль", "title": "26 квітня 1986 р.: вибух на ЧАЕС", "badges": ["НМТ: дата"], "paras": ["У ніч на **26 квітня 1986 р.** (о 1:23) під час випробувань на **4-му енергоблоці Чорнобильської АЕС** стався вибух, що зруйнував реактор. Почалася пожежа, і в повітря потрапили радіоактивні речовини.", "Вибух спричинили вади конструкції реактора РБМК і порушення правил під час випробування.", "Двоє працівників станції загинули в ніч аварії, ще одна людина померла від серцевого нападу. За кілька місяців від гострої променевої хвороби померли **28** пожежників і працівників станції. Офіційно загиблими від аварії вважають **31** людину.", "Мешканців Прип’яті вивезли лише **27 квітня**, через півтори доби. Про аварію влада повідомила ще пізніше, а **1 травня** в Києві, як завжди, провела святкову демонстрацію."], "imgs": [{"key": "chnpp86", "cap": "Зруйнований 4-й енергоблок, 1986 р. Фото: IAEA Imagebank / Wikimedia Commons, CC BY-SA 2.0"}]}, {"type": "doc", "title": "Про недоліки на будівництві ЧАЕС знали заздалегідь", "quote": ["«Під час будівництва Чорнобильської АЕС трапляються порушення технічних норм. У стінах фундаменту блока „В“ після зняття опалубки виявлено порожнини: бетон погано ущільнили.", "У фундаментну плиту блока „А“ замість арматури зі сталі марки А-III поклали слабшу, марки А-II, а креслення виправили підчистками.", "Інспектори неодноразово виявляли неякісне зварювання арматури. Будівельний майданчик не обгороджено й не охороняється, тому з нього крадуть матеріали»."], "source": "Записка начальника управління КДБ по Київській області першому секретареві обкому КПУ, 2 квітня 1973 р. (архів СБУ). Переклад-переказ, скорочено", "comment": ["Станцію будували з 1970 р., перший енергоблок запрацював 1977 р. КДБ стежив за будовою й доповідав про недоліки партійному керівництву області.", "За документами КДБ, лише в 1983 – 1985 рр. на станції сталося 5 аварій і 63 відмови основного обладнання. Ці відомості були таємними, і люди про них не знали.", "__Слова з документа:__ **опалубка** — тимчасова форма, у яку заливають бетон; **арматура** — сталеві стрижні, що надають бетону міцності; **обком** — обласний комітет партії."], "img": null}, {"type": "doc", "title": "Як влада повідомила про аварію", "quote": ["«Від Ради Міністрів СРСР. На Чорнобильській атомній електростанції сталася аварія. Пошкоджено один з атомних реакторів. Вживаються заходи з ліквідації наслідків аварії. Потерпілим надається допомога. Створено урядову комісію».", "__Повідомлення ТАРС, 28 квітня 1986 р. (повний текст)__", "«Добрий вечір, товариші! Всі ви знаєте, що недавно нас спіткала біда — аварія на Чорнобильській атомній електростанції… Вперше ми реально зіткнулися з такою грізною силою, якою є ядерна енергія, що вийшла з-під контролю».", "__Звернення М. Горбачова по телебаченню, 14 травня 1986 р.__"], "source": "Переклад-переказ, скорочено", "comment": ["Це повідомлення з п’яти речень диктор прочитав увечері 28 квітня — майже через три доби після вибуху. Приховувати аварію далі було неможливо: того ранку підвищену радіацію виявили на атомній станції у Швеції.", "Горбачов звернувся до людей лише через 18 днів після аварії. Гласність Горбачов проголосив ще в лютому 1986 р., але про аварію влада людям не розповіла.", "__Слова доби:__ **ТАРС** — Телеграфне агентство Радянського Союзу, через яке влада подавала офіційні новини; **ліквідація наслідків** — усунення шкоди, якої завдала аварія."], "img": null}, {"type": "map", "title": "Куди потрапила радіація", "steps": [{"key": "pb_chornobyl", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["У 1986 р. з **30-кілометрової зони** довкола станції влада вивезла близько **116 тис.** людей, із них понад 90 тис. — з України.", "У перші дні вітер дув на **північ і північний захід**, тому найбільше постраждали Полісся й південь Білорусі. Пізніше радіоактивний пил випав на **Гомельщину** в Білорусі й **Брянщину** в Росії.", "В Україні сильно забруднені північ **Київщини**, **Житомирщини** (Народичі, Коростень) і **Рівненщини** (Рокитне).", "У перші дні вітер дув у бік від Києва, потім повернув на південь. Найвищий рівень радіації в місті прилади показали вранці 1 травня, між 10-ю і 12-ю годинами."], "imgs": []}, {"type": "map", "title": "Карта-джерело: забруднення цезієм-137", "steps": [{"key": "s013_image12", "label": ""}], "cap": "Карта ЦРУ США, 1996 р.; векторизація — Sting, український переклад — UAWeBeR (Wikimedia Commons, CC BY-SA 2.5). "}, {"type": "text", "title": "", "badges": [], "paras": ["Цю карту видали 1996 р. Вона показує, скільки **цезію-137** осіло в ґрунті. Цезій-137 — головна причина тривалого забруднення після аварії: його кількість зменшується вдвічі лише за **30 років**, тому забруднення зберігається десятиліттями.", "Що темніший колір, то сильніше забруднення. Червоні ділянки (понад 40 Кі/км²) на карті названо **закритими зонами**. На рожевих ділянках рівень радіації й продукти харчування перевіряли постійно або періодично — залежно від того, наскільки сильне забруднення.", "На карті дві великі плями. Перша — довкола станції, на Поліссі України й Білорусі. Друга — за 150 – 250 км на північний схід, на **Гомельщині, Могильовщині й Брянщині**: туди хмару віднесло вітром, і там радіоактивний пил випав із дощем.", "__Слова з карти:__ **кюрі (Кі)** — одиниця радіоактивності; **Кі/км²** — скільки радіоактивної речовини випало на квадратний кілометр землі; **неназвана зона** — слабке забруднення (1 – 5 Кі/км²)."], "imgs": []}, {"type": "carousel", "title": "Ліквідація наслідків аварії", "badges": [], "note": "У 1986 – 1990 рр. наслідки аварії ліквідовували близько **600 тис.** людей з усього СРСР, із них 240 тис. — за перші два роки. **30 листопада 1986 р.** зруйнований реактор закрили бетонним саркофагом **«Укриття»**, який будували 206 днів.", "items": [{"key": "iaea_heli", "name": "", "desc": "Екіпаж вертольота Мі-8 перед вильотом до ЧАЕС, 1986 р. Фото: IAEA Imagebank / Wikimedia Commons, CC BY-SA 2.0", "cap": ""}, {"key": "s014_image14", "name": "", "desc": "Ліквідатори аварії. ", "cap": ""}, {"key": "iaea_decon", "name": "", "desc": "Резервіст під час дезактивації, 1986 р. Фото: IAEA Imagebank / Wikimedia Commons, CC BY-SA 2.0", "cap": ""}, {"key": "s014_image16", "name": "", "desc": "Будівництво саркофага «Укриття» над 4-м енергоблоком, 1986 р. ", "cap": ""}]}, {"type": "defs", "title": "Наслідки Чорнобильської катастрофи", "badges": [], "items": [{"name": "Для природи", "paras": ["Радіоактивні речовини забруднили північ **Київщини, Житомирщини й Рівненщини**, південь і схід Білорусі, частину Брянщини в Росії.", "Навколо ЧАЕС і досі є **зона відчуження**, де не можна жити."], "img": null}, {"name": "Для людей", "paras": ["Держава переселила сотні тисяч людей з рідних сіл і міст.", "Люди частіше хворіли; особливо зросла кількість випадків раку щитоподібної залози в дітей."], "img": null}, {"name": "Для економіки", "paras": ["Ліквідація наслідків коштувала **мільярди карбованців**.", "Через ці витрати дефіцит бюджету СРСР зріс."], "img": null}, {"name": "Для суспільства", "paras": ["Люди дізналися, що влада приховувала правду, і перестали вірити КПРС.", "Наприкінці 1987 р. виникла екологічна асоціація **«Зелений світ»**; 1990 р. на її основі створили Партію зелених України."], "img": null}], "note": "Після Чорнобиля вимога «знати правду» стала політичною. Перший масовий мітинг у Києві, **13 листопада 1988 р.**, його організатори скликали на захист довкілля."}]}, {"id": "s3", "num": "III", "title": "Економічні реформи (1987 – 1989)", "sub": "Самостійність підприємств, кооперативи, оренда — і чому вони не врятували економіку", "cover": {"key": "varenka", "cap": ""}, "cards": [{"type": "text", "kicker": "Економічні реформи", "title": "Чому знадобилися глибші реформи", "badges": [], "paras": ["Значну частину грошей СРСР заробляв, продаючи за кордон **нафту й газ**. На ці гроші купували зерно, техніку, одяг.", "У **1986 р.** світові ціни на нафту впали майже **вдвічі**. Нафти СРСР продавав не менше, ніж раніше, а заробляв на ній набагато менше.", "Водночас бюджет недоотримував доходів від продажу горілки й витрачав мільярди на ліквідацію наслідків Чорнобиля. **Дефіцит державного бюджету** різко зріс: витрати дедалі більше перевищували доходи.", "Керівництво СРСР зрозуміло, що «прискорення» не допомогло і треба **міняти саму економіку**."], "imgs": [{"key": "chart_1_19", "cap": "Середньорічна ціна нафти Brent, дол. за барель (за даними BP, округлено)."}]}, {"type": "text", "kicker": "Економічні реформи", "title": "Закон «Про державне підприємство (об’єднання)» (1987)", "badges": [], "paras": ["У **червні 1987 р.** пленум ЦК КПРС схвалив «докорінну перебудову управління економікою», а Верховна Рада СРСР ухвалила закон **«Про державне підприємство (об’єднання)»**. Закон набув чинності 1 січня 1988 р.", "Закон переводив заводи на **госпрозрахунок**: завод мав сам заробляти й витрачати гроші та встановлювати зарплату, а працівники обирали директора. Але держава, як і раніше, диктувала, що виробляти («**держзамовлення**»), і встановлювала ціни.", "Тому директори підвищували зарплати швидше, ніж зростало виробництво. В УРСР 1987 р. на 1 % зростання продуктивності праці припадало 0,5 % зростання зарплати, а 1989 р. — уже 2,2 %. Грошей у людей ставало більше, а товарів у магазинах не додавалося."], "imgs": [{"key": "s018_image20", "cap": "Обкладинка видання закону (українською мовою). "}]}, {"type": "text", "kicker": "Економічні реформи", "title": "Кооперативи й оренда (1987 – 1989)", "badges": ["НМТ: поняття"], "paras": ["**Кооператив** — об’єднання людей, які спільно, на пайових засадах, ведуть господарство. Закон **«Про кооперацію в СРСР»** (1988) дозволив відкривати кафе, ательє, майстерні, невеликі виробництва.", "Кооперативи трохи зменшили дефіцит, але їхні товари й послуги коштували дорого. Чимало кооперативів директори державних заводів використовували, щоб перевести безготівкові гроші підприємства в готівку.", "Уряд дозволив створювати **спільні підприємства з іноземним капіталом** і брати державні підприємства в **оренду**.", "Селянам дозволили брати землю **в оренду на строк до 50 років**. Охочих було мало: за десятиліття колгоспного ладу селяни відвикли господарювати самостійно, а держава не давала орендарям техніки й кредитів. До 1991 р. орендарі обробляли лише близько **1 %** сільськогосподарських земель."], "imgs": [{"key": "s020_image21", "cap": "Кооператив «Набат». "}, {"key": "s020_image22", "cap": "Двері московського кооперативу: «Ми не працюємо лише з 0 до 9 год. Решту часу розв’язуємо ваші проблеми». "}]}, {"type": "defs", "title": "Чому реформи 1987 – 1989 рр. не вдалися", "badges": [], "items": [{"name": "Половинчастість", "paras": ["Уряд поєднав елементи ринку з плановою економікою.", "Держава й далі визначала ціни та замовлення."], "img": null}, {"name": "Гроші без товарів", "paras": ["Зарплати зростали, а виробництво — ні.", "Люди не мали на що витратити гроші: був **товарний дефіцит**, а потрібні речі діставали «по блату»."], "img": null}, {"name": "Опір", "paras": ["Партійна й господарська номенклатура не хотіла втрачати владу.", "Приватного підприємця багато хто вважав «спекулянтом»: десятиліттями держава карала приватну торгівлю як злочин."], "img": null}, {"name": "Дефіцит", "paras": ["Товари з державних магазинів потрапляли до кооперативів і на чорний ринок, де коштували дорожче.", "У самих магазинах товарів бракувало."], "img": null}], "note": "__Слова доби:__ **госпрозрахунок** — завод сам покриває витрати зі своїх доходів; **держзамовлення** — продукція, яку завод мусив віддати державі за державною ціною; **блат** — знайомства, через які діставали дефіцитні речі."}]}, {"id": "s4", "num": "IV", "title": "Гласність і демократизація (1986 – 1990)", "sub": "Правда про минуле, звільнення політв’язнів, нова виборча система", "cover": {"key": "s004_image3", "cap": ""}, "cards": [{"type": "text", "kicker": "Гласність", "title": "Гласність: що змінилося", "badges": ["НМТ: поняття"], "paras": ["**Гласність** — політика відкритості: менше цензури, більше можливостей дізнатися правду. З 1986 р. партійне керівництво дозволило газетам писати про корупцію, дефіцит, Чорнобиль, війну в Афганістані.", "Журнали й видавництва почали друкувати заборонені раніше твори: **Винниченка, Хвильового, Стуса**, «Собаче серце» Булгакова, книжки емігрантів. Історики й журналісти писали про **«білі плями» історії**: репресії, ОУН і УПА, замовчувані події Другої світової війни.", "У грудні 1987 р. Щербицький уперше публічно визнав, що 1932 – 1933 рр. в Україні був **голод**. У січні 1990 р. ЦК КПУ ухвалив про нього окрему постанову, і почали друкувати архівні документи.", "У **1987 – 1988 рр.** влада звільнила більшість політв’язнів, зокрема **Левка Лук’яненка** (1988). Закон СРСР «Про пресу» (червень 1990 р.) заборонив цензуру."], "imgs": [{"key": "s022_image24", "cap": "Стенд «Розширювати гласність». "}]}, {"type": "carousel", "title": "«Меморіал»: правда про репресії", "badges": [], "note": "Товариство **«Меморіал»** створили в Москві, щоб збирати відомості про жертв репресій. Українське товариство «Меморіал» створили в березні **1989 р.**: воно розшукувало місця масових поховань (як-от **Биківня** під Києвом), збирало свідчення, досліджувало Голодомор.", "items": [{"key": "s033_image35", "name": "", "desc": "Демонстрація «Меморіалу», Москва: «Ні — сталінізму!» ", "cap": ""}, {"key": "s033_image34", "name": "", "desc": "Посвідчення члена всесоюзного «Меморіалу» з підписом А. Сахарова. ", "cap": ""}, {"key": "s033_image36", "name": "", "desc": "Стаття «\"Меморіал\" — у діалозі з минулим і сучасним», 1988 – 1989 рр. ", "cap": ""}]}, {"type": "text", "kicker": "Демократизація", "title": "Нова виборча система (1989 – 1990)", "badges": [], "paras": ["У **1988 р.** XIX конференція КПРС схвалила реформу політичної системи: влада мала перейти від партії до рад.", "У **березні 1989 р.** народних депутатів СРСР уперше обирали здебільшого з кількох кандидатів, хоча майже в кожному четвертому окрузі кандидат усе ж був один. Повністю вільними ці вибори не були: третину місць (750 з 2250) наперед віддали КПРС, профспілкам та іншим «громадським організаціям».", "Засідання **З’їзду народних депутатів СРСР** (травень – червень 1989 р.) транслювали наживо. Мільйони людей уперше чули, як із трибуни критикують владу.", "У **березні 1990 р.** З’їзд народних депутатів змінив **6-ту статтю** Конституції СРСР: прибрав із неї положення про «керівну і спрямовуючу» роль КПРС. Тоді ж він обрав Горбачова **Президентом СРСР** — першим і останнім."], "imgs": [{"key": "congress89", "cap": "I З’їзд народних депутатів СРСР, Москва, 1989 р. У президії — Михайло Горбачов. Фото: Sergey Subbotin / Сергей Субботин / Wikimedia Commons, CC BY-SA 3.0"}, {"key": "s028_image30", "cap": "Будинок культури з плакатом про вибори 26 березня 1989 р. (РРФСР)."}]}, {"type": "defs", "title": "Плюралізм і багатопартійність", "badges": ["НМТ: поняття"], "items": [{"name": "Плюралізм", "paras": ["Можливість мати й вільно висловлювати **різні погляди**.", "Наприкінці 1980-х у газетах, на мітингах і в «неформальних» клубах відкрито сперечалися про минуле й майбутнє країни."], "img": null}, {"name": "Перша опозиція", "paras": ["Улітку 1989 р. на З’їзді народних депутатів виникла **Міжрегіональна депутатська група** (А. Сахаров, Б. Єльцин) — перша легальна опозиція в радянському парламенті."], "img": null}, {"name": "Багатопартійність", "paras": ["Кілька партій **на рівних умовах змагаються за владу** на виборах.", "Після зміни 6-ї статті (березень 1990 р.) й ухвалення закону «Про громадські об’єднання» (жовтень 1990 р.) партії могли діяти легально."], "img": null}, {"name": "В Україні", "paras": ["Перші партії — Українська республіканська партія, Демократична партія України та інші — з’явилися 1990 р.", "Про них — у частині 2."], "img": null}], "note": "Гласність і плюралізм — не одне й те саме: **гласність** — це відкритість влади й свобода інформації, а **плюралізм** — розмаїття поглядів і право їх висловлювати."}]}, {"id": "s5", "num": "V", "title": "Криза економіки й страйки (1989 – 1991)", "sub": "Шахтарські страйки, ринкові програми, талони й купони, павловська реформа", "cover": {"key": "s040_image48", "cap": ""}, "cards": [{"type": "text", "kicker": "Криза", "title": "Шахтарські страйки 1989 р.", "badges": [], "paras": ["**15 липня 1989 р.** застрайкувала шахта «Ясинуватська-Глибока» в Макіївці, а за тиждень — **173 з 225 шахт Донбасу** і 20 шахт Західної України. Першими, 10 – 11 липня, застрайкували шахтарі **Кузбасу** в Росії. В Україні страйкувало від 220 тис. до пів мільйона шахтарів (оцінки різняться).", "Шахтарі страйкували через небезпечну працю, низьку зарплату, погане житло й брак продуктів. Серед вимог було навіть забезпечити кожного шахтаря **милом**.", "Наприкінці липня Горбачов пообіцяв виконати вимоги, і шахтарі повернулися до роботи. 3 серпня 1989 р. уряд СРСР ухвалив постанову про шахти.", "Але шахтарі не розпустили **страйкові комітети**, а зробили їх постійними — так з’явився незалежний робітничий рух."], "imgs": [{"key": "s029_image31", "cap": "Страйк шахтарів, 1989 р. "}]}, {"type": "cols", "title": "Економіка на межі (1989 – 1990)", "badges": ["НМТ: поняття"], "intro": null, "blocks": [{"h": "Що сталося з економікою", "paras": ["У **1989 р.** зростання економіки зупинилося, а **1990 р.** в УРСР почався спад: суспільний продукт зменшився на 2,4 %, національний дохід — на 3,6 %.", "Грошові доходи людей за 1990 р. зросли на **15,7 %**, але в магазинах був **дефіцит** більшості товарів.", "Республіки почали захищати власні ринки: ухвалювали закони про **економічну самостійність** (в УРСР — **3 серпня 1990 р.**) і забороняли вивозити товари. Підприємства різних республік дедалі рідше постачали продукцію одне одному."]}, {"h": "Як переходити до ринку?", "paras": ["**Ринкові відносини** — економіка, у якій ціни, виробництво й обмін залежать від попиту й пропозиції, а не від державного плану; є приватна власність і конкуренція.", "У 1990 р. союзне керівництво й економісти сперечалися, як до них переходити. Уряд Миколи **Рижкова** пропонував іти поступово, під контролем держави, а економісти Станіслав Шаталін і Григорій Явлінський — швидко, за програмою **«500 днів»**.", "Горбачов не підтримав до кінця жодної з них, і уряд не виконав ні одну програму."]}]}, {"type": "carousel", "title": "Талони й купони", "badges": [], "note": "Дефіцитні товари продавали за **талонами**. З **листопада 1990 р.** в УРСР запровадили **картки споживача з купонами**: у державній крамниці треба було заплатити і карбованцями, і купонами. Так влада УРСР захищала свій ринок від покупців з інших республік.", "items": [{"key": "kartka75", "name": "", "desc": "Картка споживача на 75 карбованців з купонами, УРСР, 1990 р. Фото: User:Sopilkazkyïva / Wikimedia Commons, Public domain", "cap": ""}, {"key": "sugar91", "name": "", "desc": "«Запрошення» на купівлю цукру, Київ, травень і серпень 1991 р. Фото: невідомий автор / Wikimedia Commons, Public domain", "cap": ""}, {"key": "s025_image26", "name": "", "desc": "Картка талонів на горілку (Москва).", "cap": ""}]}, {"type": "text", "kicker": "Криза", "title": "Павловська реформа 1991 р.", "badges": [], "paras": ["У січні 1991 р. уряд СРСР на чолі з **Валентином Павловим** вирішив зменшити кількість готівки, яку мали люди.", "**23 – 25 січня** уряд дозволив обміняти купюри номіналом **50 і 100 карбованців** зразка 1961 р. на нові — лише три дні й не більше **1000 карбованців** на людину. Якщо людина мала більше таких купюр, вона мусила пояснити спеціальній комісії, звідки ці гроші. З рахунку в ощадній касі вкладник міг зняти не більше **500 карбованців** на місяць.", "**2 квітня 1991 р.** уряд підвищив державні ціни на більшість товарів у середньому **в 2 – 3 рази**. Зарплати зростали повільніше, ніж ціни.", "Багато людей не встигли обміняти купюри й утратили ці гроші. Вклади в ощадних касах держава заморозила, а згодом вони знецінилися через інфляцію. Після цього люди ще менше довіряли союзній владі."], "imgs": [{"key": "s026_image28", "cap": "Черга до ощадного банку під час обміну грошей, січень 1991 р. "}, {"key": "s026_image29", "cap": "Оголошення: «З 23.01.91 приймання грошей купюрами 50 і 100 рублів припинено». "}]}, {"type": "text", "kicker": "Криза", "title": "Політичні страйки (1990 – 1991)", "badges": [], "paras": ["**11 липня 1990 р.** шахтарі вперше застрайкували з політичними вимогами: ліквідувати парткоми на шахтах і націоналізувати майно КПРС. Того дня не працювало близько 100 шахт.", "Навесні 1991 р., після обміну грошей і підвищення цін, шахтарі Донбасу знову застрайкували. У **березні – квітні 1991 р.** страйкарі вимагали відставки Президента СРСР і союзного уряду, **націоналізації майна КПРС** і надання **Декларації про державний суверенітет** (16 липня 1990 р., частина 2) сили конституційного закону.", "Шахтарі все частіше діяли разом із **Народним Рухом України** — найбільшою опозиційною організацією, створеною у вересні 1989 р. (частина 2). Проти КПРС виступили робітники, яких вона називала своєю опорою."], "imgs": [{"key": "don_miners", "cap": "Шахтарсько-рухівський мітинг біля Донецького обкому КПУ, 1990 р. Фото: М.Яковенко, В.Білецький / Wikimedia Commons, Public domain"}]}, {"type": "defs", "title": "УРСР у 1991 р.: криза в усіх сферах", "badges": [], "items": [{"name": "Виробництво", "paras": ["Виробництво скорочувалося майже в усіх галузях.", "Підприємства різних республік переставали постачати одне одному деталі й сировину."], "img": null}, {"name": "Гроші й ціни", "paras": ["Доходів бюджету не вистачало, тому держава друкувала нові гроші.", "2 квітня ціни зросли в 2 – 3 рази, і заощадження людей знецінилися."], "img": null}, {"name": "Повсякдення", "paras": ["У магазинах бракувало товарів. Люди стояли в чергах і купували за талонами й купонами.", "Рівень життя швидко знижувався."], "img": null}, {"name": "Авторитет КПУ", "paras": ["Люди пам’ятали брехню про Чорнобиль, бачили пільги номенклатури й читали про злочини сталінського режиму.", "Члени КПУ масово виходили з партії."], "img": null}], "note": "Люди втратили заощадження й не могли купити найпотрібнішого, тому перестали довіряти союзній владі. Через це економічна криза стала однією з причин розпаду СРСР."}]}, {"id": "s6", "num": "VI", "title": "Узагальнення", "sub": "Етапи перебудови · що часто плутають на НМТ · стрічка часу", "cover": {"key": "pavlov_notes", "cap": ""}, "cards": [{"type": "table", "title": "Етапи перебудови", "rows": [["Етап", "Що робили", "Чим закінчилося"], ["I. 1985 – 1986", "Курс на «прискорення», держприймання, антиалкогольна кампанія, заміна кадрів", "На реформи бракувало грошей; до цього додалися Чорнобиль і падіння цін на нафту"], ["II. 1987 – 1989", "Госпрозрахунок, кооперативи, оренда; гласність, вибори 1989 р.", "Зарплати росли швидше за виробництво; дефіцит, страйки"], ["III. 1990 – 1991", "Зміна 6-ї статті, Президент СРСР, програми переходу до ринку, павловська реформа", "Глибока криза, суверенітет республік, розпад СРСР"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "Гасла", "paras": ["**Прискорення** — гасло квітня 1985 р.", "**Перебудова** — загальна назва всіх реформ 1985 – 1991 рр."], "img": null}, {"name": "Поняття", "paras": ["**Гласність** — відкритість, свобода інформації.", "**Плюралізм** — розмаїття поглядів, у політиці — багатопартійність."], "img": null}, {"name": "Вибори", "paras": ["**1989** — вибори народних депутатів **СРСР**.", "**Березень 1990** — **перші альтернативні вибори до Верховної Ради УРСР** (дата з програми НМТ; частина 2)."], "img": null}, {"name": "Талони й купони", "paras": ["**Талони** — документи, що давали право купити дефіцитний товар.", "**Купони** (з листопада 1990 р.) — «гроші» для покупок в УРСР разом з карбованцями."], "img": null}], "note": null}, {"type": "tl_events", "title": "Стрічка часу: економіка й суспільство (1986 – 1991)", "note": "Відстані між подіями однакові для наочності. Програмні дати частини — на стрічці на початку.", "items": [{"year": "листопад 1986", "name": "Закон про ІТД", "desc": "індивідуальна трудова діяльність", "color": "#9cc6de", "prog": false}, {"year": "1.01.1987", "name": "Держприймання", "desc": "на 1500 заводах", "color": "#a6a6a6", "prog": false}, {"year": "березень 1989", "name": "Вибори в СРСР", "desc": "народні депутати", "color": "#b48ae0", "prog": false}, {"year": "11.07.1990", "name": "Політичний страйк", "desc": "шахтарі проти парткомів", "color": "#e97132", "prog": false}, {"year": "3.08.1990", "name": "Економічна самостійність", "desc": "закон УРСР", "color": "#9cc6de", "prog": false}, {"year": "листопад 1990", "name": "Купони в УРСР", "desc": "картки споживача", "color": "#a6a6a6", "prog": false}, {"year": "23 – 25.01.1991", "name": "Обмін грошей", "desc": "павловська реформа", "color": "#a6a6a6", "prog": false}, {"year": "2.04.1991", "name": "Ціни", "desc": "зросли в 2 – 3 рази", "color": "#e05a47", "prog": false}]}]}]}, {"id": "p2", "num": 2, "title": "Відновлення незалежності України (1985 – 1991)", "part": "Частина 2. Від Руху до незалежності", "sub": "Національно-демократичний рух, вибори 1990 р., суверенітет, Акт 24 серпня, референдум і перший Президент", "cover": {"key": "sof_maidan", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Відновлення незалежності України»", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **вересень 1989** — створено Народний Рух", "• **березень 1990** — перші альтернативні вибори до ВР УРСР", "• **16.07.1990** — Декларація про суверенітет", "• **жовтень 1990** — «революція на граніті»", "• **24.08.1991** — Акт проголошення незалежності", "• **1.12.1991** — референдум і вибори Президента"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **«український національно-демократичний рух»**", "• **«багатопартійність», «суверенітет», «незалежність»**", "• **«референдум», «президент»**", "• повторити з частини 1: **«перебудова», «гласність», «плюралізм», «ринкові відносини»**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналія (портрет)", "light": false}, {"k": "p", "paras": ["• **Леонід Кравчук** — голова Верховної Ради УРСР (з 1990 р.), перший Президент України", "• для повторення (теми 28 – 29): **Левко Лук’яненко, В’ячеслав Чорновіл, Мустафа Джемілєв**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Зміст теми", "light": false}, {"k": "p", "paras": ["• зміни в керівництві УРСР; формування багатопартійності", "• створення АРК; Меджліс кримськотатарського народу (червень 1991 р.)", "• спроба перевороту в серпні 1991 р.; розпад СРСР і його наслідки; міжнародне визнання", "• культура, духовне відродження"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 30. Дата 6 грудня 1991 р. (Збройні Сили України) — уже з теми 31."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Національне пробудження (1987 – 1989)", "sub": "Неформальні організації, Народний Рух України, культурне й церковне відродження", "cover": {"key": "s035_image41", "cap": ""}, "cards": [{"type": "text", "kicker": "Пробудження", "title": "Неформальні громадські організації (1987 – 1989)", "badges": [], "paras": ["У роки гласності люди почали створювати громадські організації, незалежні від КПРС; їхніх членів називали «**неформалами**». Спершу вони займалися культурою, історією й екологією, згодом — політикою.", "• **Український культурологічний клуб** (Київ, 1987) і **Товариство Лева** (Львів, 1987) — їхні учасники вивчали заборонені сторінки історії, відроджували народні традиції, захищали пам’ятки.", "• **«Зелений світ»** (з кінця 1987 р.; див. частину 1) — об’єднав екологів, які вимагали правди про Чорнобиль.", "• **Українська Гельсінська спілка** (липень 1988) — наступниця Української Гельсінської групи; її очолив **Левко Лук’яненко**. УГС вимагала справжнього суверенітету України. У 1990 р. на її основі виникла **Українська республіканська партія**, яка домагалася незалежності України.", "• **Товариство української мови ім. Т. Шевченка** (лютий 1989, голова — **Дмитро Павличко**), **«Меморіал»** (березень 1989).", "• Молодь: **Спілка незалежної української молоді**, **Українська студентська спілка**, **«Студентське братство»** (1989)."], "imgs": [{"key": "s032_image32", "cap": "Газета УГС «Центральна Рада». "}]}, {"type": "defs", "title": "Від дисидентів до політиків", "badges": [], "items": [{"name": "В’ячеслав Чорновіл", "paras": ["Журналіст і дисидент, багато років відбув у таборах (персоналія теми 29).", "У 1987 р. відновив видання журналу «**Український вісник**», 1988 р. став одним із засновників **УГС**. У 1990 р. очолив Львівську обласну раду, 1991 р. був кандидатом у президенти."], "img": {"key": "chorn_trib", "cap": "В. Чорновіл, 1990-ті рр. Фото: М.Яковенко, В.Білецький / Wikimedia Commons, Public domain"}}, {"name": "Левко Лук’яненко", "paras": ["Один із засновників **Української Гельсінської групи** (1976), понад 25 років провів у в’язницях і таборах (персоналія теми 28).", "Очолював **УГС** (з 1988 р.) й **Українську республіканську партію** (з 1990 р.). Написав проєкт **Акта проголошення незалежності**."], "img": {"key": "lukyan", "cap": "Л. Лук’яненко. Фото: Yakudza / Wikimedia Commons, CC BY-SA 3.0"}}, {"name": "Іван Драч", "paras": ["Поет-шістдесятник.", "Перший голова **Народного Руху України** (1989 – 1992), народний депутат ВР УРСР з 1990 р."], "img": {"key": "drach", "cap": "І. Драч, 2017 р. Фото: Melnikov v n / Wikimedia Commons, CC BY-SA 4.0"}}], "note": null}, {"type": "text", "kicker": "Пробудження", "title": "Народний Рух України за перебудову (вересень 1989 р.)", "badges": ["НМТ: дата"], "paras": ["Ініціативна група зі створення Руху виникла в листопаді 1988 р. у **Спілці письменників України**. Проєкт програми Руху надрукувала «Літературна Україна» **16 лютого 1989 р.**", "Керівництво КПУ на чолі з Щербицьким перешкоджало створенню Руху, проте його осередки виникали по всій Україні. **8 – 10 вересня 1989 р.** у Києві відбувся **установчий з’їзд**. На той час у Русі було близько **280 тис.** членів.", "Першим головою делегати обрали **Івана Драча**. До Руху ввійшли люди з різними поглядами. Письменники Драч, Павличко і Яворівський хотіли, щоб Україна мала більше прав в оновленому СРСР. Колишні політв’язні Чорновіл і Лук’яненко домагалися незалежності.", "Спершу Рух вимагав демократизації та **суверенітету** України у складі СРСР. У жовтні 1990 р. він вилучив із назви слова «за перебудову» й проголосив метою **незалежність**."], "imgs": [{"key": "s034_image38", "cap": "Проєкт програми Руху в пресі. "}, {"key": "s035_image40", "cap": "Конференція Руху: «Перебудова сьогодні переросла в загальнонародний Рух». "}]}, {"type": "text", "kicker": "Пробудження", "title": "Культурне відродження (1989 – 1990)", "badges": [], "paras": ["**28 жовтня 1989 р.** Верховна Рада УРСР ухвалила закон **«Про мови в Українській РСР»**: українська стала **державною мовою**.", "У вересні 1989 р. у Чернівцях відбувся перший фестиваль сучасної української пісні **«Червона рута»**.", "**19 листопада 1989 р.** в Києві перепоховали **Василя Стуса, Юрія Литвина й Олексу Тихого**, загиблих у таборах. Труни вулицями Києва супроводжували десятки тисяч людей.", "У серпні 1990 р. на Запоріжжі святкували **500-ліття українського козацтва** — сотні тисяч людей приїхали на Хортицю.", "Видавництва знову друкували твори Грушевського, Винниченка, Хвильового. На мітинги люди приходили із **синьо-жовтими прапорами**; 24 липня 1990 р. такий прапор підняли біля Київської міськради."], "imgs": [{"key": "koz500a", "cap": "Хода до 500-ліття козацтва, Запоріжжя, 1990 р. Фото: М.Яковенко, В.Білецький / Wikimedia Commons, Public domain"}, {"key": "flag1990", "cap": "Синьо-жовтий прапор уперше піднімають біля Київської міськради, Хрещатик, 24 липня 1990 р. Фото: невідомий автор / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "Пробудження", "title": "Духовне відродження", "badges": [], "paras": ["У **1988 р.** влада дозволила Російській православній церкві урочисто відзначити **1000-ліття хрещення Русі**. Після цього держава почала повертати віруючим храми й реєструвати їхні громади.", "**Українська автокефальна православна церква**: 1989 р. у Львові перша парафія вийшла з підпорядкування Московському патріархату; у 1990 р. собор проголосив патріархат, патріархом став **Мстислав (Скрипник)**.", "**Українська греко-католицька церква**, заборонена 1946 р., вийшла з підпілля: наприкінці **1989 р.** влада дозволила реєструвати її громади, 1991 р. до Львова повернувся кардинал **Мирослав-Іван Любачівський**.", "У 1990 р. Російська православна церква надала своїм парафіям в Україні автономію — так з’явилася **Українська православна церква (Московського патріархату)**.", "Відроджувалися громади протестантів, мусульман (після повернення кримських татар), юдеїв."], "imgs": [{"key": "s045_image54", "cap": "Патріарх Мстислав (Скрипник). "}]}]}, {"id": "s2", "num": "II", "title": "«Живий ланцюг» і вибори 1990 р.", "sub": "Наймасовіша акція Руху й перші альтернативні вибори до Верховної Ради УРСР", "cover": {"key": "chain_kalush", "cap": ""}, "cards": [{"type": "map", "title": "«Живий ланцюг» 21 січня 1990 р.", "steps": [{"key": "pb_chain", "label": "Крок 1"}]}, {"type": "carousel", "title": "21 січня 1990 р.: «Україна — соборна!»", "badges": [], "note": "Свою наймасовішу акцію Рух приурочив до **71-ї річниці Акта злуки** УНР і ЗУНР. Ланцюг завдовжки близько 700 км простягся від **Івано-Франківська** через **Стрий, Львів, Тернопіль, Рівне й Житомир** до **Києва**.", "items": [{"key": "s036_image42", "name": "", "desc": "Учасники ланцюга. ", "cap": ""}, {"key": "s036_image43", "name": "", "desc": "Схема Львівсько-Тернопільської ланки: Львів — Золочів — Зборів — Тернопіль. ", "cap": ""}, {"key": "s036_image45", "name": "", "desc": "Плакат: «22 січня 1919 р. — Акт з’єднання. 17 вересня 1939 р. — політична авантюра!» ", "cap": ""}]}, {"type": "text", "kicker": "Вибори 1990 р.", "title": "Перші альтернативні вибори (березень 1990 р.)", "badges": ["НМТ: дата"], "paras": ["**4 березня 1990 р.** (повторне голосування — у березні – квітні) обирали **Верховну Раду УРСР** і **місцеві ради**. Уперше вибори до Верховної Ради УРСР були альтернативними: на 450 мандатів претендувало майже 3 тис. кандидатів.", "Опозицію представляв **Демократичний блок** (Рух, УГС, «Меморіал», Товариство української мови та ін.). У **Львівській, Івано-Франківській, Тернопільській** обласних радах і в **Київській міській раді** більшість здобули кандидати Демократичного блоку. Головою Львівської обласної ради став **В’ячеслав Чорновіл**.", "У Верховній Раді більшість мала комуністична **«Група 239»** (лідер **Олександр Мороз**). Їй протистояла опозиційна **«Народна рада»** (близько 125 депутатів, лідер **Ігор Юхновський**).", "Головою Верховної Ради 4 червня обрали першого секретаря ЦК КПУ **Володимира Івашка**, а після його переходу на роботу до Москви — **Леоніда Кравчука** (23 липня 1990 р.)."], "imgs": [{"key": "pb_seats", "cap": "Верховна Рада УРСР, 1990 р. Власна діаграма за даними Укрінформу й Енциклопедії України; склад груп змінювався («Народна рада» — від 115 до 133 депутатів)."}]}]}, {"id": "s3", "num": "III", "title": "Суверенітет і «революція на граніті» (1990)", "sub": "Декларація про державний суверенітет, студентське голодування, зміни в керівництві, багатопартійність", "cover": {"key": "posters2", "cap": ""}, "cards": [{"type": "doc", "title": "Декларація про державний суверенітет України (16 липня 1990 р.)", "quote": ["Верховна Рада Української РСР, виражаючи волю народу України, прагнучи створити демократичне суспільство… проголошує державний суверенітет України як **верховенство, самостійність, повноту і неподільність влади Республіки** в межах її території та **незалежність і рівноправність у зовнішніх відносинах**.", "Громадяни Республіки всіх національностей становлять народ України.", "Українська РСР урочисто проголошує про свій намір стати в майбутньому **постійно нейтральною державою**, яка не бере участі у військових блоках і додержується трьох неядерних принципів: не приймати, не виробляти і не набувати ядерної зброї."], "source": "Декларація про державний суверенітет України, 16 липня 1990 р. (уривки)", "comment": ["Декларацію підтримали й комуністи з «Групи 239», хоча перед тим пропонували її пом’якшити. За Декларацію проголосували **355** депутатів, проти — 4.", "Декларація ще не означала виходу України з СРСР. Через рік і місяць на неї послався Акт проголошення незалежності.", "__Слова з документа:__ **суверенітет** — верховенство й повнота влади держави на своїй території; **нейтральна держава** не вступає у військові союзи."], "img": {"key": "s039_image47", "cap": "Примірник Декларації з підписами депутатів. "}}, {"type": "defs", "title": "Що проголошувала Декларація", "badges": ["НМТ: поняття"], "items": [{"name": "Влада", "paras": ["**Поділ влади** на законодавчу, виконавчу й судову.", "Закони УРСР — вищі за союзні на її території."], "img": null}, {"name": "Економіка", "paras": ["Земля, надра, ліси — **власність народу України**.", "Право на власний банк і гроші. Відповідно до Декларації **3 серпня 1990 р.** Верховна Рада ухвалила закон «Про економічну самостійність УРСР» (частина 1)."], "img": null}, {"name": "Громадяни", "paras": ["**Громадянство УРСР**.", "Рівні права громадян усіх національностей."], "img": null}, {"name": "Оборона і світ", "paras": ["Право на **власні збройні сили**.", "Намір бути **нейтральною** й без’ядерною державою."], "img": null}], "note": "**Суверенітет** 1990 р. — повнота влади республіки, яка ще лишалася в складі СРСР. **Незалежність** 1991 р. — вихід із СРСР і власна держава, повністю самостійна у внутрішніх і зовнішніх справах."}, {"type": "text", "kicker": "«Революція на граніті»", "title": "«Революція на граніті» (2 – 17 жовтня 1990 р.)", "badges": ["НМТ: дата"], "paras": ["Студенти **Української студентської спілки** (Київ) і **«Студентського братства»** (Львів) оголосили голодування в наметах на площі Жовтневої революції (нині — **Майдан Незалежності**). Серед лідерів — **Олесь Доній** і **Маркіян Іващишин**.", "Голодувальників підтримали тисячі студентів, які страйкували у вишах, і багато киян.", "Студенти вимагали: відставки голови уряду **Віталія Масола**; нових виборів до Верховної Ради 1991 р. на багатопартійній основі; **націоналізації майна КПРС і комсомолу** в Україні; відмови від нового Союзного договору; служби юнаків з України лише в Україні.", "17 жовтня Верховна Рада частково задовольнила вимоги, а 23 жовтня Масол подав у відставку. Уперше політичний протест змусив голову уряду УРСР піти у відставку."], "imgs": [{"key": "demands", "cap": "«Наші вимоги» студентів-голодувальників. Фото: Учасники голодування / Wikimedia Commons, Public domain"}]}, {"type": "carousel", "title": "Голодування на граніті: фото й плакати", "badges": [], "note": "Через 14 і 23 роки той самий майдан став центром **Помаранчевої революції** (2004) і **Революції Гідності** (2013 – 2014).", "items": [{"key": "s042_image51", "name": "", "desc": "Учасник голодування. ", "cap": ""}, {"key": "s042_image52", "name": "", "desc": "Наметове містечко на площі. ", "cap": ""}, {"key": "granit_poster", "name": "", "desc": "Плакат голодувальників. Фото: Учасники голодування / Wikimedia Commons, Public domain", "cap": ""}, {"key": "gan239", "name": "", "desc": "Плакат «239 — ганьба» (проти комуністичної більшості). Фото: Учасники голодування / Wikimedia Commons, Public domain", "cap": ""}]}, {"type": "text", "kicker": "Зміни в керівництві", "title": "Зміни в політичному керівництві УРСР (1989 – 1990)", "badges": [], "paras": ["• **Володимир Щербицький**, що керував КПУ з 1972 р., пішов у відставку у **вересні 1989 р.** За його керівництва в Україні посилилася русифікація, а дисидентів переслідували. Перебудову він гальмував, тому УРСР тоді називали **«заповідником застою»**.", "• Першим секретарем ЦК КПУ став **Володимир Івашко** (1989 – 1990), у червні 1990 р. — ще й головою Верховної Ради. У липні 1990 р. Івашко переїхав до Москви, бо його обрали заступником генерального секретаря ЦК КПРС.", "• КПУ очолив **Станіслав Гуренко** (1990 – 1991), а Верховну Раду — **Леонід Кравчук** (з липня 1990 р.).", "• Після «революції на граніті» голову уряду **Віталія Масола** змінив **Вітольд Фокін** (листопад 1990 р.).", "Головні рішення тепер ухвалювала Верховна Рада, а не ЦК КПУ."], "imgs": [{"key": "ivashko", "cap": "Володимир Івашко. Фото: Верховна Рада України / Wikimedia Commons, Attribution"}]}, {"type": "defs", "title": "Народження багатопартійності (1990 – 1991)", "badges": ["НМТ: поняття"], "items": [{"name": "Як почалося", "paras": ["**Багатопартійність** — кілька партій на рівних умовах змагаються за владу на виборах.", "Березень 1990 р. — КПРС утратила монополію на владу (6-та стаття Конституції СРСР); **24 жовтня 1990 р.** — Верховна Рада так само змінила Конституцію УРСР."], "img": null}, {"name": "Ліві", "paras": ["Виступали за збереження СРСР і соціалізм.", "**Комуністична партія України** (1990 р. — близько 3 млн членів).", "Після заборони КПУ (серпень 1991 р.) О. Мороз створив **Соціалістичну партію** (жовтень 1991 р.)."], "img": null}, {"name": "Центр і ліберали", "paras": ["Виступали за суверенітет, згодом за незалежність і ринкову економіку.", "**Партія демократичного відродження України**, **Партія зелених**, соціал-демократи."], "img": null}, {"name": "Націонал-демократи", "paras": ["Вимагали негайної **незалежності**.", "**УРП** (Л. Лук’яненко), **Демократична партія України** (Ю. Бадзьо; серед засновників — І. Драч, Д. Павличко), християнські демократи."], "img": null}], "note": "Першою зареєстрували **Українську республіканську партію** (її заснували у квітні 1990 р. на основі УГС). Нові партії були малими порівняно з КПУ, а їхні програми мало відрізнялися."}, {"type": "defs", "title": "Український національно-демократичний рух", "badges": ["НМТ: поняття"], "items": [{"name": "Що це", "paras": ["Узагальнена назва всіх громадських і політичних сил, які в роки перебудови боролися за **демократію**, права України, а згодом — за **незалежність**."], "img": null}, {"name": "Хто", "paras": ["Колишні **дисиденти**, письменники й науковці, студенти, екологи, частина робітників (шахтарі).", "Головна сила — **Народний Рух України**."], "img": null}, {"name": "Як діяли", "paras": ["Мітинги й ходи, «живий ланцюг», голодування, вибори, преса.", "Діяли **мирно, без насильства**."], "img": null}, {"name": "Як змінювалися цілі", "paras": ["1987 – 1989: культура, мова, правда про історію.", "1990: **суверенітет**, перші вибори.", "Жовтень 1990: Рух проголошує метою **незалежність**."], "img": null}], "note": "Національно-демократичний рух продовжив справу дисидентів. Його лідерами стали колишні політв’язні Чорновіл, Лук’яненко, брати Горині. Українська Гельсінська група 1988 р. перетворилася на **УГС**, а 1990 р. — на **УРП**."}]}, {"id": "s4", "num": "IV", "title": "1991: від референдуму до незалежності", "sub": "Крим, березневий референдум, путч у Москві, Акт проголошення незалежності", "cover": {"key": "tank_msk", "cap": ""}, "cards": [{"type": "text", "kicker": "1991", "title": "Кримська автономія і Меджліс кримськотатарського народу", "badges": ["НМТ: поняття"], "paras": ["У листопаді 1989 р. Верховна Рада СРСР визнала незаконною депортацію народів. Кримські татари масово поверталися на батьківщину.", "**Референдум** — голосування всіх громадян щодо важливого питання. **20 січня 1991 р.** у Кримській області **93 %** учасників проголосували за відтворення Кримської АРСР «як суб’єкта Союзу РСР», тобто окремо від України. **12 лютого 1991 р.** Верховна Рада УРСР відновила автономію, але **в складі УРСР**.", "У 1992 р. Верховна Рада Криму перейменувала автономію на Республіку Крим; назву **«Автономна Республіка Крим»** закріпила Конституція України 1996 р.", "**26 – 30 червня 1991 р.** у Сімферополі зібрався **ІІ Курултай** — з’їзд кримськотатарського народу. Він утворив **Меджліс** (орган, що представляє народ між Курултаями), затвердив прапор і гімн. Головою Меджлісу обрали **Мустафу Джемілєва**."], "imgs": [{"key": "dzhem", "cap": "Мустафа Джемілєв (фото 2014 р.). Фото: Malik Mansur (VOA) / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "1991", "title": "Березневий референдум 1991 р.", "badges": [], "paras": ["З ініціативи Горбачова **17 березня 1991 р.** відбувся всесоюзний референдум: «Чи вважаєте ви необхідним збереження СРСР як **оновленої федерації** рівноправних суверенних республік…?»", "Автори поєднали в одному питанні збереження Союзу, рівноправність республік і права людини, тому виборцеві було важко відповісти «ні». В УРСР «так» відповіли **70,2 %** учасників.", "Верховна Рада УРСР додала своє питання: «Чи згодні Ви з тим, що Україна має бути у складі Союзу радянських суверенних держав на засадах **Декларації про державний суверенітет України**?» «Так» відповіли **80,2 %** учасників.", "У **Львівській, Івано-Франківській і Тернопільській** областях обласні ради додали третє питання — про **незалежність** України. Її підтримали **88 %** учасників.", "Керівники республік мали підписати новий Союзний договір **20 серпня 1991 р.** Але 27 червня Верховна Рада УРСР відклала його розгляд до вересня: депутати вважали, що договір не відповідає Декларації про суверенітет."], "imgs": [{"key": "s048_image57", "cap": "Бюлетень всесоюзного референдуму 17 березня 1991 р. "}]}, {"type": "text", "kicker": "1991", "title": "Спроба державного перевороту (19 – 21 серпня 1991 р.)", "badges": [], "paras": ["Щоб зірвати підписання Союзного договору, керівники КДБ, армії, МВС і уряду утворили **Державний комітет з надзвичайного стану (ДКНС)**. Горбачова, який відпочивав у **Форосі** в Криму, змовники ізолювали.", "ДКНС заборонив мітинги й страйки, запровадив цензуру, увів до Москви танки. Опір очолив президент Росії **Борис Єльцин**: москвичі збудували барикади біля «Білого дому» (будинку Верховної Ради РРФСР), а наказу штурмувати його військові не виконали. **21 серпня** путч провалився.", "19 серпня до кабінету Кравчука прибув генерал **Валентин Варенников** і вимагав запровадити в Україні надзвичайний стан. Кравчук відповів, що без законних підстав цього не зробить, і закликав до спокою, але путчистів одразу не засудив.", "Рух, «Народна рада» й Львівська обласна рада виступили **проти перевороту**."], "imgs": [{"key": "s052_image62", "cap": "Борис Єльцин на танку біля «Білого дому». "}, {"key": "s051_image59", "cap": "Прес-конференція ДКНС. "}]}, {"type": "doc", "title": "Акт проголошення незалежності України", "quote": ["Виходячи із смертельної небезпеки, яка нависла була над Україною в зв’язку з державним переворотом в СРСР 19 серпня 1991 року,", "— продовжуючи тисячолітню традицію державотворення в Україні,", "— виходячи з права на самовизначення, передбаченого Статутом ООН та іншими міжнародно-правовими документами,", "— здійснюючи Декларацію про державний суверенітет України,", "Верховна Рада Української Радянської Соціалістичної Республіки урочисто **проголошує незалежність України** та створення самостійної української держави — **України**.", "Територія України є неподільною і недоторканною. Віднині на території України мають чинність виключно Конституція і закони України."], "source": "Акт проголошення незалежності України, 24 серпня 1991 р. (без останнього речення «Цей акт набирає чинності з моменту його схвалення»)", "comment": ["Верховна Рада зібралася 24 серпня, через три дні після провалу путчу. Текст Акта підготувала група депутатів на чолі з **Левком Лук’яненком**.", "Акт підтримала й більшість комуністів: їхню партію звинувачували в підтримці ДКНС, а 23 серпня Єльцин зупинив діяльність компартії в Росії. За Акт проголосували **346** депутатів, проти — 1, утрималися 3.", "__Слова з документа:__ **державотворення** — створення власної держави; **Статут ООН** визнає право народів на самовизначення."], "img": {"key": "akt", "cap": "Акт проголошення незалежності з підписом Л. Кравчука. Фото: Верховна Рада УРСР / Wikimedia Commons, Public domain"}}, {"type": "carousel", "title": "24 серпня 1991 р. у Верховній Раді", "badges": [], "note": "Того ж дня Верховна Рада підпорядкувала собі всі військові частини в Україні й призначила на **1 грудня 1991 р.** референдум, на якому громадяни мали підтвердити Акт.", "items": [{"key": "pb_vote", "name": "", "desc": "Підсумки голосування за Акт, як їх показало табло у Верховній Раді (власна схема).", "cap": ""}, {"key": "s054_image64", "name": "", "desc": "Рукопис проєкту Акта (зошит Л. Лук’яненка).", "cap": ""}, {"key": "postanova24", "name": "", "desc": "Постанова Верховної Ради УРСР про проголошення незалежності України, 24 серпня 1991 р. Фото: Верховна Рада УРСР / Wikimedia Commons, Public domain", "cap": ""}]}, {"type": "defs", "title": "Перші кроки незалежної держави (серпень – листопад 1991 р.)", "badges": [], "items": [{"name": "Компартія", "paras": ["Президія Верховної Ради **26 серпня** зупинила діяльність КПУ, а **30 серпня** заборонила її за підтримку ДКНС."], "img": null}, {"name": "Символи", "paras": ["**4 вересня** над будинком Верховної Ради підняли **синьо-жовтий прапор**."], "img": null}, {"name": "Закони", "paras": ["**12 вересня** — закон «Про правонаступництво України».", "**8 жовтня** — закон «Про громадянство України»."], "img": null}, {"name": "Влада", "paras": ["Посаду Президента запровадили ще **5 липня 1991 р.**, але до виборів 1 грудня всю владу мала **Верховна Рада**."], "img": null}], "note": null}]}, {"id": "s5", "num": "V", "title": "1 грудня 1991 р. і розпад СРСР", "sub": "Всеукраїнський референдум, перший Президент, Біловезькі угоди, міжнародне визнання", "cover": {"key": "s057_image68", "cap": ""}, "cards": [{"type": "text", "kicker": "1 грудня 1991 р.", "title": "Всеукраїнський референдум 1 грудня 1991 р.", "badges": ["НМТ: дата", "НМТ: поняття"], "paras": ["Питання було одне: **«Чи підтверджуєте Ви Акт проголошення незалежності України?»**", "У голосуванні взяли участь **84,18 %** виборців (31,9 млн). «Так» відповіли **90,32 %** учасників. Більшість «за» була **в усіх регіонах**, навіть у Криму (54,2 %) і Севастополі (57,1 %).", "Відтепер незалежність спиралася на рішення **всього народу**, а не лише парламенту. Багато держав чекали результатів референдуму: визнавати Україну вони почали вже наступного дня, 2 грудня."], "imgs": [{"key": "ref_vid", "cap": "Офіційні відомості про результати референдуму. Фото: ЦДАВО України / Wikimedia Commons, Public domain"}, {"key": "s055_image65", "cap": "Листівка «Вирішуймо!»: заклик відповісти «Так». "}]}, {"type": "map", "title": "Референдум 1 грудня 1991 р.: результати за областями", "steps": [{"key": "pb_referendum", "label": "Крок 1"}]}, {"type": "generic", "title": "Перші вибори Президента України", "badges": ["НМТ: поняття"], "blocks": [{"k": "p", "paras": ["**Президент** — глава держави, якого обирає народ. Перші вибори відбулися **в один день із референдумом**. Кравчук переміг у першому турі; Чорновіл — у трьох галицьких областях.", "__Скорочення:__ УРП — Українська республіканська партія; ПДВУ — Партія демократичного відродження України."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "s058_image70", "cap": ""}, {"k": "muted", "paras": ["Результати виборів по областях: синім — Кравчук, помаранчевим — Чорновіл."]}]}, {"type": "text", "kicker": "1 грудня 1991 р.", "title": "Леонід Кравчук — перший Президент України", "badges": ["НМТ: персоналія"], "paras": ["Леонід Кравчук народився **1934 р.** у селі Великий Житин на Рівненщині, що тоді належала Польщі. Вивчав економіку й зробив кар’єру в Компартії України: завідував її ідеологічним відділом, а 1989 р. став **секретарем ЦК КПУ з ідеології**. Від імені ЦК він вів на телебаченні дискусії з лідерами Руху — тоді він став відомим усій Україні.", "**23 липня 1990 р.** Кравчука обрали **головою Верховної Ради УРСР**. На цій посаді він підтримав курс на суверенітет і головував на засіданні **24 серпня 1991 р.**, на якому проголосили незалежність.", "**1 грудня 1991 р.** громадяни України обрали його **першим Президентом України**. Через тиждень він підписав **Біловезькі угоди**, у яких ішлося, що СРСР припиняє існування. Коли Кравчук був Президентом, Україна створила власні Збройні Сили, а Верховна Рада затвердила державні символи: прапор, герб і гімн.", "Через економічну кризу Кравчук погодився на дострокові вибори й **1994 р.** програв їх **Леонідові Кучмі**. Помер у 2022 р."], "imgs": [{"key": "kravchuk", "cap": "Леонід Кравчук, 1990 р. Фото: Верховна Рада України / Wikimedia Commons, Attribution"}]}, {"type": "text", "kicker": "Розпад СРСР", "title": "Республіки проголошують незалежність (1990 – 1991)", "badges": [], "paras": ["Першою незалежність проголосила **Литва** (11 березня 1990 р.). У Вільнюсі **13 січня 1991 р.** радянські війська штурмували телевежу; під час штурму загинули 14 людей. У квітні 1991 р. незалежність проголосила **Грузія**.", "Під час путчу й за кілька тижнів після нього незалежність проголосили майже всі республіки: Естонія й Латвія, **Україна** (24 серпня), Білорусь, Молдова, Азербайджан, республіки Середньої Азії.", "Наприкінці серпня Верховна Рада СРСР зупинила діяльність КПРС, а союзні органи влади втратили вплив на республіки. Останньою незалежність проголосив Казахстан (16 грудня).", "Вирішальним став **український референдум 1 грудня**: через тиждень лідери Росії, України й Білорусі констатували, що СРСР більше не існує."], "imgs": [{"key": "vilnius", "cap": "Вільнюс, 13 січня 1991 р.: беззбройний литовець перед радянським танком. Фото: Andrius Petrulevičius (Литовський центральний державний архів) / Wikimedia Commons, CC BY 4.0"}]}, {"type": "text", "kicker": "Розпад СРСР", "title": "Біловезькі угоди й кінець СРСР", "badges": [], "paras": ["**8 грудня 1991 р.** у Віскулях (Біловезька пуща, Білорусь) зустрілися **Борис Єльцин** (Росія), **Леонід Кравчук** (Україна) і **Станіслав Шушкевич** (Білорусь).", "Вони констатували, що **СРСР припиняє існування** як суб’єкт міжнародного права, і створили **Співдружність Незалежних Держав (СНД)**. Керівництво України вважало СНД способом «цивілізованого розлучення», а не новим союзом.", "10 грудня Верховна Рада України ратифікувала угоду, але із застереженнями. **21 грудня** в Алма-Аті до СНД приєдналися ще 8 республік.", "**25 грудня 1991 р.** Михайло Горбачов склав повноваження Президента СРСР. Наступного дня СРСР офіційно припинив існування."], "imgs": [{"key": "belov", "cap": "Підписання угоди про створення СНД, 8 грудня 1991 р. Фото: U. Ivanov / Ю. Иванов / Wikimedia Commons, CC BY-SA 3.0"}, {"key": "s059_image71", "cap": "Л. Кравчук, С. Шушкевич і Б. Єльцин. "}]}, {"type": "map", "title": "Розпад СРСР: республіки проголошують незалежність", "steps": [{"key": "pb_ussr", "label": "Крок 1"}]}, {"type": "text", "kicker": "Розпад СРСР", "title": "Міжнародне визнання України", "badges": [], "paras": ["Першою незалежність України визнала **Польща** — **2 грудня 1991 р.**, того ж дня — **Канада**. 3 грудня Україну визнала **Угорщина**.", "За грудень 1991 р. незалежність України визнали кілька десятків держав, зокрема **США** (25 грудня); до кінця січня 1992 р. — понад 90.", "Українська РСР була членом **ООН** ще з 1945 р., і це членство незалежна Україна зберегла.", "Нова держава відразу почала створювати власну армію: **6 грудня 1991 р.** Верховна Рада ухвалила закон «Про Збройні Сили України» (тема 31)."], "imgs": [{"key": "kravchuk92", "cap": "Л. Кравчук у Європейській комісії, 1992 р. Фото: European Commission / Wikimedia Commons, CC BY 4.0"}]}]}, {"id": "s6", "num": "VI", "title": "Підсумки теми", "sub": "Чому розпався СРСР, наслідки й значення незалежності, поняття, дати, керівники", "cover": {"key": "koz500b", "cap": ""}, "cards": [{"type": "defs", "title": "Чому розпався СРСР", "badges": [], "items": [{"name": "Економіка", "paras": ["Планова економіка не впоралася з падінням цін на нафту, дефіцитом та інфляцією.", "Реформи, що поєднували план і ринок, кризи не спинили (частина 1)."], "img": null}, {"name": "Гласність", "paras": ["Коли люди дізналися правду про репресії, Голодомор і Чорнобиль, вони перестали вірити КПРС."], "img": null}, {"name": "Національні рухи", "paras": ["Республіки від Балтії до Кавказу домагалися спершу суверенітету, потім незалежності."], "img": null}, {"name": "Путч і референдум", "paras": ["Після провалу путчу Верховна Рада СРСР зупинила діяльність КПРС, а союзні органи втратили вплив на республіки.", "Через тиждень після українського референдуму, 8 грудня, Єльцин, Кравчук і Шушкевич констатували, що СРСР припиняє існування."], "img": null}], "note": null}, {"type": "defs", "title": "Наслідки розпаду СРСР для України", "badges": [], "items": [{"name": "Держава", "paras": ["Власні кордони, громадянство, армія (з **6 грудня 1991 р.**).", "Купони стали тимчасовими грішми; гривню запровадили 1996 р. (тема 31)."], "img": null}, {"name": "Економіка", "paras": ["Українські заводи втратили постачальників і покупців в інших республіках.", "У перші роки незалежності Україна пережила глибоку економічну кризу й інфляцію."], "img": null}, {"name": "Ядерна зброя", "paras": ["На території України лишився один із найбільших у світі ядерних арсеналів.", "Україна мала вирішити, що робити з цією зброєю."], "img": null}, {"name": "Флот і Крим", "paras": ["Почалися суперечки з Росією за Чорноморський флот і Севастополь."], "img": null}, {"name": "СНД", "paras": ["Україна — засновниця СНД, але не вступила до її ві ання)» 1987 р. — доба перебудови.", "src": "ЗНО 2018 – основна сесія (№ 19)"}, {"id": "z18365", "q": "Прочитайте уривок історичного документа та виконайте завдання до нього.\n«…Багато зараз незвичного в нашій країні: скажімо, багатомандатні округи з виборів до Рад; спільні з іноземними фірмами підприємства; самофінансування заводів та фабрик, радгоспів і колгоспів; зняття обмежень з підсобних господарств, ...розширення кооперативної діяльності; заохочення індивідуальної трудової діяльності в дрібному виробництві й торгівлі…»\nВ уривку документа відображено зрушення в політичному та соціально-економічному розвитку Української РСР в період", "sec": "s3", "g": "", "t": "single", "opts": ["«відбудови».", "«відлиги».", "«застою».", "«перебудови»."], "ok": [3], "expl": "Спільні підприємства з іноземцями, кооперативи, самофінансування заводів, альтернативні вибори — нововведення другої половини 1980-х рр., тобто перебудови.", "src": "ЗНО 2019 – додаткова сесія (№ 19)"}, {"id": "z18366", "q": "Прочитайте уривок історичного документа та виконайте завдання до нього.\n«…Багато зараз незвичного в нашій країні: скажімо, багатомандатні округи з виборів до Рад; спільні з іноземними фірмами підприємства; самофінансування заводів та фабрик, радгоспів і колгоспів; зняття обмежень з підсобних господарств, ...розширення кооперативної діяльності; заохочення індивідуальної трудової діяльності в дрібному виробництві й торгівлі…»\nЗазначені в документі зміни названо «незвичними», оскільки вони", "sec": "s3", "g": "nezv", "t": "single", "opts": ["йшли в розріз з комуністичною теорією.", "утверджували однопартійну систему.", "створювали ілюзію економічного процвітання.", "були запроваджені як тимчасові."], "ok": [0], "expl": "Кооперативи, індивідуальна трудова діяльність, самофінансування підприємств — елементи ринку. Комуністична теорія їх заперечувала, тому вони здавалися «незвичними».", "src": "ЗНО 2019 – додаткова сесія (№ 20)"}, {"id": "z18367", "q": "Прочитайте уривок історичного документа та виконайте завдання до нього.\n«…Багато зараз незвичного в нашій країні: скажімо, багатомандатні округи з виборів до Рад; спільні з іноземними фірмами підприємства; самофінансування заводів та фабрик, радгоспів і колгоспів; зняття обмежень з підсобних господарств, ...розширення кооперативної діяльності; заохочення індивідуальної трудової діяльності в дрібному виробництві й торгівлі…»\nЗаходи, указані в документі, упроваджували з метою", "sec": "s3", "g": "", "t": "single", "opts": ["подолання кризових явищ у радянській економіці.", "формування потужного державного сектора економіки.", "відновлення адміністративних методів управління.", "утвердження екстенсивних методів господарювання."], "ok": [0], "expl": "Реформи 1987 – 1989 рр. мали вивести економіку з кризи: «прискорення» не допомогло, і влада дозволила окремі ринкові механізми.", "src": "ЗНО 2019 – додаткова сесія (№ 21)"}, {"id": "z19388", "q": "Протест шахтарів УРСР 1989 р.", "sec": "s5", "g": "strike89", "t": "single", "opts": ["примусив владу до люстрування.", "переріс у загальноукраїнський страйк.", "став приводом до «революції на граніті».", "започаткував відродження дисидентського руху."], "ok": [1], "expl": "Страйк, що почався в Донбасі в липні 1989 р., підтримали шахтарі інших регіонів — він став загальноукраїнським.", "src": "ЗНО 2020 – пробний тест (№ 22)"}, {"id": "z20673", "q": "Процеси «перебудови» в СРСР привели в Україні до", "sec": "s4", "g": "", "t": "single", "opts": ["появи дисидентського руху серед інтелігенції.", "остаточного подолання економічних проблем.", "стрімкого зростання життєвого рівня населення.", "зростання національної самосвідомості українців."], "ok": [3], "expl": "Гласність і демократизація дали змогу говорити про історію, мову й права України. Зросла національна самосвідомість, з’явилися Рух та інші організації.", "src": "ЗНО 2020 – основна сесія (№ 21)"}, {"id": "z20682", "q": "Розгляньте поштову марку.\nЯкі судження щодо неї є правильними?", "sec": "s1", "g": "", "t": "three", "img": ["q_666bdd832b"], "opts": ["Марка має викривальний, сатиричний характер.", "Марка відображає трудовий ентузіазм працівників.", "Марка присвячена здобуткам у культурному житті.", "Марка пропагує переваги здорового способу життя.", "Марку створено для підтримки однієї з кампаній «перебудови».", "Марка мала стимулювати патріотичні почуття, гордість за країну.", "Марка акцентує увагу на існуванні в суспільстві проблеми алкоголізму."], "ok": [3, 4, 6], "expl": "Марка 1985 р. «Тверезість — норма життя» підтримувала антиалкогольну кампанію, розпочату в травні 1985 р. Вона пропагує здоровий спосіб життя й нагадує про проблему пияцтва.", "src": "ЗНО 2020 – основна сесія (№ 30)"}, {"id": "z21319", "q": "Карикатура, зображена на фото, акцентує увагу на ключовій проблемі", "sec": "s6", "g": "pnei", "t": "single", "img": ["q_174c8b8ea0"], "opts": ["упровадження однієї з «надпрограм» М. Хрущова.", "здійснення економічних «реформ О. Косигіна».", "виконання Продовольчої програми Л. Брежнєва.", "реалізації політики «перебудови» М. Горбачова."], "ok": [3], "expl": "Гасло «З корінням викорчуємо застій!» — з доби перебудови: нове керівництво обіцяло подолати «застій». Карикатура показує, що «корені» лишилися, — реформи йшли важко.", "src": "ЗНО 2020 – додаткова сесія (№ 20)"}, {"id": "z22074", "q": "Вибух на четвертому енергоблоці Чорнобильської АЕС стався в", "sec": "s2", "g": "", "t": "single", "opts": ["березні 1985 р.", "квітні 1986 р.", "травні 1987 р.", "червні 1988 р."], "ok": [1], "expl": "Вибух на четвертому енергоблоці ЧАЕС стався вночі 26 квітня 1986 р.", "src": "ЗНО 2010 – додаткова сесія (№ 48)"}, {"id": "z22246", "q": "Що зумовило перехід партійно-радянського керівництва СРСР до політики «перебудови»?", "sec": "s1", "g": "", "t": "single", "opts": ["розпад світової соціалістичної системи", "уповільнення темпів економічного зростання", "вимоги міжнародних фінансових організацій", "масові виступи населення проти влади"], "ok": [1], "expl": "Наприкінці 1970-х – на початку 1980-х рр. економіка СРСР майже перестала зростати («застій»). Тому нове керівництво у 1985 р. проголосило курс на «прискорення».", "src": "ЗНО 2013 – додаткова сесія (№ 40)"}, {"id": "z22301", "q": "Пам’ятником, зображеним на фото, увічнено події, що відбувалися в", "sec": "s2", "g": "mon86", "t": "single", "img": ["q_c38149f19f"], "opts": ["1983 р.", "1986 р.", "1988 р.", "1991 р."], "ok": [1], "expl": "Пам’ятник «Тим, хто врятував світ» стоїть біля Чорнобильської АЕС і вшановує ліквідаторів аварії 26 квітня 1986 р.", "src": "ЗНО 2014 – додаткова сесія (№ 40)"}, {"id": "z23824", "q": "Проаналізуйте уривок з історичного джерела: «Соціалістичне самоврядування реалізується в умовах широкої гласності шляхом участі всього колективу та його громадських організацій у виробленні найважливіших рішень і контролі за їх виконанням, виборності керівників та єдиноначальності в керуванні підприємством...».\nЙого доречно використати для характеристики суспільного життя України доби", "sec": "s3", "g": "samovr", "t": "single", "opts": ["«відлиги».", "«застою».", "«перебудови».", "«незалежності»."], "ok": [2], "expl": "Самоврядування трудових колективів і вибори директорів запровадив закон «Про державне підприємство (об’єднання)» 1987 р. — доба перебудови.", "src": "ЗНО 2021 – основна сесія (№ 21)"}, {"id": "z26026", "q": "У якому з уривків надано оцінку політичному курсу «перебудови»?", "sec": "s6", "g": "otsinka", "t": "single", "opts": ["«Він, підвищивши рівень життя населення західноєвропейських країн, зміцнив політичну стабільність у регіоні та створив абсолютно нову, небачену досі, атмосферу співробітництва, взаємодопомоги та підтримки у відносинах між Західною Європою і Сполученими Штатами…»", "«Проголошення цього курсу – важлива віха в історії. Він змінив життя сотень мільйонів громадян Радянського Союзу і країн Східної Європи. Найважливішим його надбанням стало знищення тоталітаризму, який упродовж 74 років сковував радянське суспільство…»", "«Цей курс виявився лише спробою відійти від жорсткої тоталітарної системи з її жахіттями кривавого терору, однак лібералізація та відносна демократизація в жодному разі не зачіпала основ політичного устрою Радянського Союзу та підвалин його суспільного буття…»", "«Він ствердив виключне право СРСР в умовах, коли виникає загроза справі соціалізму в країнах Східної Європи, загроза безпеці соціалістичної співдружності в цілому, на втручання у внутрішні справи країн, включно з використанням військової сили…»"], "ok": [1], "expl": "Про знищення тоталітаризму, який «74 роки» (1917 – 1991) сковував радянське суспільство, пишуть, оцінюючи саме перебудову. «Відлига» не зачепила основ ладу (В), «план Маршалла» (А), «доктрина Брежнєва» (Г).", "src": "НМТ 2022 – демоваріант (№ 13)"}, {"id": "z26224", "q": "Що зумовило появу наведеного на фото оголошення?", "sec": "s2", "g": "", "t": "single", "img": ["q_10f3534bfd"], "opts": ["ліквідація наслідків аварії на Чорнобильській АЕС", "студентські протести під час Революції на граніті", "масові заворушення в Києві часів Революції Гідності", "проведення антитерористичної операції на сході України"], "ok": [0], "expl": "Оголошення («Опромінення в будівлі в 10 разів менше, ніж на відкритій території!») з’явилося в зоні аварії: ліквідаторам радили відпочивати в приміщенні.", "src": "НМТ 2023 – демоваріант (№ 19)"}, {"id": "z26953", "q": "У якому уривку оцінено політичний курс перебудови?", "sec": "s6", "g": "otsinka", "t": "single", "opts": ["«Він, підвищивши рівень життя населення західноєвропейських країн, зміцнив політичну стабільність у регіоні та створив абсолютно нову, небачену досі, атмосферу співробітництва, взаємодопомоги й підтримки у відносинах між Західною Європою і Сполученими Штатами…»", "«Проголошення цього курсу – важлива віха в історії. Він змінив життя сотень мільйонів громадян Радянського Союзу й країн Східної Європи. Найважливішим його надбанням стало знищення тоталітаризму, який упродовж 74 років сковував радянське суспільство…»", "«Цей курс виявився лише спробою відійти від жорсткої тоталітарної системи з її жахіттями кривавого терору, однак… лібералізація в жодному разі не зачіпала основ політичного устрою Радянського Союзу та підвалин його суспільного буття…»", "«Він ствердив виключне право СРСР в умовах, коли виникає загроза справі соціалізму в країнах Східної Європи, загроза безпеці соціалістичної співдружності в цілому, на втручання у внутрішні справи країн, уключно з використанням військової сили…»"], "ok": [1], "expl": "Про знищення тоталітаризму, який «74 роки» (1917 – 1991) сковував радянське суспільство, пишуть, оцінюючи саме перебудову. «Відлига» не зачепила основ ладу (В), «план Маршалла» (А), «доктрина Брежнєва» (Г).", "src": "НМТ 2023 – 2 сесія (№ 18)"}, {"id": "z27725", "q": "Прочитайте фрагмент історичного документа про зрушення в політичному та соціально-економічному розвитку Української РСР у період «перебудови».\n«…Багато зараз незвичного в нашій країні: скажімо, багатомандатні округи з виборів до Рад; спільні з іноземними фірмами підприємства; самофінансування заводів та фабрик, радгоспів і колгоспів; зняття обмежень з підсобних господарств, ...розширення кооперативної діяльності; заохочення індивідуальної трудової діяльності в дрібному виробництві й торгівлі…»\nЗазначені в документі зміни названо «незвичними», оскільки вони", "sec": "s3", "g": "nezv", "t": "single", "opts": ["йшли в розріз із комуністичною теорією.", "утверджували однопартійну систему.", "створювали ілюзію економічного процвітання.", "були запроваджені як тимчасові."], "ok": [0], "expl": "Кооперативи, індивідуальна трудова діяльність, самофінансування підприємств — елементи ринку. Комуністична теорія їх заперечувала, тому вони здавалися «незвичними».", "src": "НМТ 2024 – демоваріант (№ 19)"}, {"id": "z28445", "q": "На карикатурі відображено", "sec": "s6", "g": "pnei", "t": "single", "img": ["q_174c8b8ea0"], "opts": ["проблеми реалізації курсу на перебудову.", "головний здобуток перебудови.", "успішність

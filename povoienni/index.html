бованого колишнього підпільника. Шість років він провів у слідчих в’язницях Києва й Москви без суду. У **1960 р.** його звільнили, він закінчив Київський університет і працював в архіві та Інституті історії. Помер у Києві 2007 р."], "imgs": [{"key": "s068_image85", "cap": "Василь Кук, 1940-ві рр."}]}]}, {"id": "s4", "num": "IV", "title": "Ідеологічні кампанії (1946 – 1953)", "sub": "Ждановщина, боротьба з «буржуазним націоналізмом» і «космополітизмом», лисенківщина", "cover": {"key": "s054_image57", "cap": ""}, "cards": [{"type": "text", "kicker": "Ждановщина", "title": "Ждановщина: що це і чому вона почалася", "badges": ["НМТ: поняття"], "paras": ["**Ждановщина** — кампанія радянської влади в 1946 – початку 1950-х рр., яка мала відновити повний ідеологічний контроль над наукою, літературою й мистецтвом. Назва походить від прізвища секретаря ЦК ВКП(б) **Андрія Жданова**, який очолив кампанію.", "Під час війни влада трохи послабила контроль: дозволяла писати про любов до рідного краю, згадувати національних героїв. Мільйони солдатів побачили Європу й порівнювали тамтешнє життя з радянським. Почалася **холодна війна**, і Сталін вирішив ізолювати суспільство від Заходу.", "У **серпні 1946 р.** ЦК ВКП(б) засудив ленінградські журнали «Звезда» й «Ленинград» за твори Анни Ахматової й Михайла Зощенка. Після цього партійне керівництво республік почало такі самі кампанії."], "imgs": [{"key": "zhdanov", "cap": "Андрій Жданов (1896 – 1948). Фото: Unknown, dedicated to Bettmann Archive / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Ждановщина", "title": "Ждановщина в Україні", "badges": ["НМТ: поняття"], "paras": ["У 1946 – 1947 рр. ЦК КП(б)У ухвалив кілька постанов про «ідеологічні помилки» театрів, журналів, Інституту історії України. Письменників, учених, митців звинувачували в **«українському буржуазному націоналізмі»** — так влада називала будь-який твір про українську історію й культуру, де не згадано «дружби з великим російським народом».", "У **1947 р.** критикували **Максима Рильського**, **Юрія Яновського**, історика **Миколу Петровського**, у **1951 р.** — вірш **Володимира Сосюри** «Любіть Україну» й оперу **Костянтина Данькевича** «Богдан Хмельницький». Композитора **Бориса Лятошинського** звинуватили у «формалізмі» за Другу симфонію.", "У **1947 р.**, коли КП(б)У тимчасово очолив Лазар Каганович, кампанія стала особливо жорсткою."], "imgs": [{"key": "kaganovich", "cap": "Лазар Каганович — перший секретар ЦК КП(б)У в березні – грудні 1947 р. Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "doc", "title": "Постанови ЦК КП(б)У (1946 – 1947 рр.)", "quote": ["**Про репертуар театрів (12 жовтня 1946 р.):** «…Драматурги, театральні критики повинні приділити особливу увагу вихованню трудящих мас українського народу в дусі непохитної дружби радянських народів, **любові до великого російського народу** і ненависті до всіх ворогів радянського ладу, в тому числі до найлютіших ворогів українського народу — українсько-німецьких націоналістів».", "**Про Інститут історії України (29 серпня 1947 р.):** «…Основна помилка авторів робіт з історії України полягає в тому, що вони замість того, щоб розглядати історію України в тісному зв’язку з історією російського, білоруського та інших народів Радянського Союзу, ідуть шляхом українських націоналістів… **починаючи і слідуючи в цьому питанні курсу Грушевського „Історія України-Руси“**»."], "source": "Постанови ЦК КП(б)У (уривки; друга — переклад з російської)", "comment": ["Партія прямо вказувала, про що писати драматургам і як писати історикам: історію України дозволяли подавати лише як частину спільної історії з Росією.", "Посилання на Грушевського було звинуваченням: його погляд на українців як на окремий народ зі своєю історією влада вважала націоналістичним.", "__Слова з документа:__ **репертуар** — перелік вистав театру."], "img": null}, {"type": "text", "kicker": "Космополітизм", "title": "Боротьба з «космополітизмом» (1949 – 1953)", "badges": ["НМТ: поняття"], "paras": ["**Що означало це слово.** **Космополітизм** — світогляд людини, яка вважає себе громадянином світу й ставить загальнолюдські цінності вище національних. Радянська пропаганда тлумачила його як «низькопоклонство перед Заходом» і зневагу до Батьківщини. «Космополітів» називали «безрідними» й «безпаспортними бродягами».", "**Кого й як переслідували.** Кампанія розгорнулася на початку **1949 р.** зі статей у газеті «Правда» про «антипатріотичну групу театральних критиків». Під приводом боротьби з космополітизмом влада переслідувала насамперед **євреїв**: їх звільняли з роботи, закривали єврейські театри, газети, видавництва.", "У 1952 р. за вироком суду розстріляли діячів Єврейського антифашистського комітету, серед них — київського поета **Давида Гофштейна**. У **січні 1953 р.** групу кремлівських лікарів, переважно євреїв, звинуватили у вбивстві радянських керівників («**справа лікарів**»). Справу закрили лише після смерті Сталіна."], "imgs": [{"key": "cosmo_brodiaha", "cap": "К. Єлісеєв. «Безпаспортний бродяга», журнал «Крокодил», 1949 р.: «космополіт» з валізою в наліпках з іменами західних письменників"}, {"key": "cosmo_chaika", "cap": "Борис Єфимов. «Космополіти-пігмеї намагалися підстрелити мхатівську чайку», 1949 р.: карикатура на театральних критиків"}]}, {"type": "text", "kicker": "Лисенківщина", "title": "Лисенківщина: агроном проти генетиків", "badges": ["НМТ: поняття"], "paras": ["**Лисенківщина** — ідеологічна кампанія в біології, яка призвела до заборони **генетики** в СРСР і репресій проти вчених-генетиків. Назва походить від прізвища агронома **Трохима Лисенка**, уродженця Полтавщини.", "У 1930-ті рр. Лисенко працював в **Одесі**, у Селекційно-генетичному інституті. Він обіцяв за два-три роки вивести нові сорти й різко підвищити врожайність, тоді як генетики казали, що на це потрібно років десять. Після голоду й колективізації влада хотіла швидких результатів, і Сталін підтримав Лисенка.", "Головного опонента Лисенка, генетика **Миколу Вавилова**, заарештували 1940 р.; він помер у в’язниці 1943 р. На сесії **Всесоюзної академії сільськогосподарських наук (ВАСГНІЛ)** у **серпні 1948 р.** Лисенко оголосив, що його доповідь схвалив ЦК партії. Після цього влада заборонила генетику як «буржуазну» науку."], "imgs": [{"key": "s052_image52", "cap": "Трохим Лисенко (1898 – 1976)"}, {"key": "lysenko_stalin", "cap": "Лисенко виступає в Кремлі в присутності Сталіна, 1935 р. (газетне фото)"}]}, {"type": "table", "title": "Генетика і «мічурінська біологія» Лисенка", "rows": [["Питання", "Класична генетика", "Лисенко"], ["Що передає ознаки нащадкам", "**гени**, розташовані в хромосомах (хромосомна теорія Томаса Моргана)", "генів немає; спадковість — властивість «усього живого тіла», кожної його частинки"], ["Чи успадковуються ознаки, набуті за життя", "**ні**: зміни тіла не змінюють генів у статевих клітинах (Август Вейсман)", "**так**: умови життя «розхитують» спадковість, і рослину можна «перевиховати»"], ["Як ознаки розподіляються в потомстві", "за **законами Менделя**, у числових співвідношеннях (3 : 1 тощо)", "закони Менделя — «горохові закони», статистика в біології зайва"], ["Звідки беруться нові види й сорти", "мутації, схрещування й **добір** упродовж багатьох поколінь", "один вид «породжує» інший стрибком: з пшениці виростає жито, з вівса — вівсюг"], ["Як перевіряють висновки", "досліди з контрольними групами й підрахунками, які можна повторити", "анкети з колгоспів і окремі вдалі приклади; невдачі пояснював «шкідництвом»"]]}, {"type": "text", "kicker": "Лисенківщина", "title": "Що обіцяв Лисенко і що вийшло", "badges": [], "paras": ["**Яровизація.** Лисенко пропонував витримувати намочене насіння озимої пшениці на холоді, а навесні сіяти. Саме явище існує: багатьом рослинам потрібен холод, щоб зацвісти. Але обіцяного приросту врожаю яровизація не дала, а набутих так властивостей нащадки не успадковували.", "**Гніздові посадки.** Лисенко заперечував конкуренцію всередині виду й радив садити дуби «гніздами», щоб слабші деревця «жертвували собою» заради сильніших. Більшість лісосмуг, посаджених «гніздами», загинула.", "**Чому генетиків висміювали.** Вони досліджували спадковість на мушках-дрозофілах, які швидко розмножуються. Пропаганда називала генетиків «мухолюбами» й «вейсманістами-менделістами-морганістами» — за прізвищами Вейсмана, Менделя й Моргана.", "Поки в СРСР генетику забороняли, у **1953 р.** Вотсон і Крік описали будову ДНК. Радянська генетика почала відновлюватися лише після 1964 р."], "imgs": [{"key": "s054_image58", "cap": "«Мушина метушня»: карикатура на генетиків із радянського журналу, 1948 – 1949 рр."}]}, {"type": "cols", "title": "Лисенківщина в Україні", "badges": ["поза програмою"], "intro": null, "blocks": [{"h": "Після серпневої сесії 1948 р.", "paras": ["В університетах та інститутах УРСР влада закрила кафедри й лабораторії генетики. Викладачів, які не визнали «мічурінської біології», звільняли. Зі шкільних і вишівських програм вилучили закони Менделя й хромосомну теорію.", "Учені мусили публічно каятися. Хто відмовлявся, втрачав роботу й можливість друкуватися."]}, {"h": "Хто постраждав", "paras": ["**Сергій Гершензон**, київський генетик, ще 1939 р. показав, що ДНК може спричиняти мутації. Після 1948 р. його відділ генетики закрили, і він багато років не міг продовжувати ці досліди.", "**Іван Шмальгаузен**, зоолог родом з Києва, один з авторів сучасної теорії еволюції, на сесії 1948 р. став головною мішенню критики й утратив усі посади.", "Ботаніка й генетика **Миколу Гришка** усунули від керівництва Інститутом ботаніки."]}]}, {"type": "cols", "title": "Наслідки ідеологічних кампаній", "badges": [], "intro": null, "blocks": [{"h": "Для науки й культури", "paras": ["Розвиток науки й мистецтва загальмувався: цілі галузі, як-от генетику, оголосили «буржуазними».", "Радянська культура опинилася в ізоляції від світової.", "Митці писали «на замовлення», вільної творчої критики не лишилося.", "Учені мусили публічно «визнавати помилки» й хвалити Лисенка, щоб зберегти роботу."]}, {"h": "Для людей", "paras": ["Частину інтелігенції заарештували, багатьох звільнили з роботи, а їхні твори заборонили друкувати.", "Посилилися русифікація й російський шовінізм: українську історію й культуру дозволяли показувати лише як частину «спільної» з Росією.", "Страх перед звинуваченням у «націоналізмі» змушував митців і вчених уникати тем з української історії."]}]}]}, {"id": "s5", "num": "V", "title": "Освіта і наука", "sub": "Відбудова шкіл і вишів, Академія наук; Олександр Богомолець, Володимир Філатов, Сергій Лебедєв", "cover": {"key": "s050_image50", "cap": ""}, "cards": [{"type": "text", "kicker": "Освіта", "title": "Школи й виші після війни", "badges": [], "paras": ["Війна зруйнувала тисячі шкіл. Діти навчалися у випадкових приміщеннях **у дві-три зміни**, бракувало підручників, зошитів, учителів. Багато підлітків не повернулися до школи, бо мусили працювати.", "З **1949 р.** в СРСР обов’язковою стала **семирічна освіта**. З евакуації повернулися університети й інститути, відкривали нові виші.", "Водночас посилювався ідеологічний контроль, а кількість шкіл з українською мовою навчання в містах поступово зменшувалася."], "imgs": [{"key": "s049_image49", "cap": "Медаль «За відмінні успіхи в навчанні» й посібник «На допомогу вихователю» (рос.), 1940-ві рр."}]}, {"type": "text", "kicker": "Наука", "title": "Академія наук УРСР після війни", "badges": [], "paras": ["Коли Київ звільнили, з евакуації (з Уфи) повернулися **Академія наук УРСР** і науково-дослідні інститути. Почали відновлювати зруйновані лабораторії й бібліотеки.", "Президентом Академії до **1946 р.** був **Олександр Богомолець**, після його смерті — біохімік **Олександр Палладін** (1946 – 1962).", "Учені працювали під ідеологічним тиском: від лисенківщини постраждали біологи, від ждановщини — історики й філологи. Проте саме в ці роки група Сергія Лебедєва створила в Києві першу в континентальній Європі електронно-обчислювальну машину, а одеські офтальмологи на чолі з **Володимиром Філатовим** стали відомими у світі."], "imgs": [{"key": "s069_image86", "cap": "Олександр Богомолець (1881 – 1946)"}]}, {"type": "text", "kicker": "Персоналія", "title": "Олександр Богомолець (1881 – 1946)", "badges": ["НМТ: персоналія"], "paras": ["Олександр Богомолець — **патофізіолог**, засновник української наукової школи патологічної фізіології, автор одного з перших підручників з цієї науки. Займався також ендокринологією й **геронтологією** — наукою про старіння.", "У **1930 – 1946 рр.** він був **президентом Академії наук УРСР**, організував низку науково-дослідних інститутів.", "Богомолець створив **антиретикулярну цитотоксичну сироватку (АЦС)**, яка прискорювала загоєння ран і переломів. Під час Другої світової війни її широко застосовували у військових госпіталях."], "imgs": [{"key": "bogomolets_old", "cap": "Олександр Богомолець — президент Академії наук УРСР (1930 – 1946). Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Персоналія", "title": "Володимир Філатов (1875 – 1956)", "badges": ["НМТ: персоналія"], "paras": ["Володимир Філатов — **офтальмолог** (лікар, який лікує хвороби очей), хірург і винахідник, академік. Майже все життя працював в **Одесі**.", "Він навчився пересаджувати **рогівку ока** від померлих людей і так повертав зір сліпим. Запропонував новий спосіб вимірювати тиск усередині ока, метод **тканинної терапії** й так званий «філатовський стебель» для пластичних операцій.", "У **1936 р.** Філатов заснував в Одесі **Інститут очних хвороб і тканинної терапії**, який тепер названо його ім’ям. За життя він і його учні провели десятки тисяч операцій."], "imgs": [{"key": "filatov", "cap": "Володимир Філатов. Фото: невідомий автор / Wikimedia Commons, Public domain"}, {"key": "s071_image88", "cap": "Філатов оглядає пацієнта, 1940-ві рр."}]}, {"type": "text", "kicker": "Персоналія", "title": "Сергій Лебедєв (1902 – 1974)", "badges": ["НМТ: персоналія"], "paras": ["Сергій Лебедєв — учений у галузі електротехніки й обчислювальної техніки. З 1946 р. працював в Інституті електротехніки Академії наук УРСР у Києві.", "У лабораторії в **Феофанії** під Києвом група Лебедєва створила **МЕОМ — Малу електронну лічильну машину**. Вона запрацювала в **1950 р.** і стала **першою електронно-обчислювальною машиною в континентальній Європі**. Машина займала цілу кімнату й мала тисячі електронних ламп.", "Згодом Лебедєв переїхав до Москви, де його група створила швидкодійні ЕОМ серії БЕСМ."], "imgs": [{"key": "s070_image87", "cap": "Сергій Лебедєв і його співробітники біля МЕОМ, Київ, початок 1950-х рр."}]}]}, {"id": "s6", "num": "VI", "title": "Література і мистецтво", "sub": "Соціалістичний реалізм; Рильський, Сосюра, Тичина, Малишко; Тетяна Яблонська «Хліб»; Катерина Білокур; Ніл Хасевич", "cover": {"key": "s058_image70", "cap": ""}, "cards": [{"type": "cols", "title": "Література в повоєнні роки", "badges": [], "intro": null, "blocks": [{"h": "Правила для письменників", "paras": ["Письменники мали писати за правилами **соціалістичного реалізму**: показувати героїчну працю, мудрість партії й «дружбу з великим російським народом».", "За «правильні» твори давали Сталінські премії, за «помилки» критикували на зборах, звільняли з роботи, а декого арештовували."]}, {"h": "Два покоління поетів", "paras": ["Поети, які починали в 1920-ті рр., зокрема **Павло Тичина, Максим Рильський, Володимир Сосюра**, після репресій 1930-х рр. писали обережно, а в повоєнні роки їх знову критикували. Найвідомішою стала кампанія проти вірша Сосюри **«Любіть Україну»** (1951).", "Молодше покоління, зокрема **Андрій Малишко**, писало переважно про війну, відбудову й «щасливе радянське життя»."]}]}, {"type": "text", "kicker": "Персоналія", "title": "Максим Рильський (1895 – 1964)", "badges": ["НМТ: персоналія"], "paras": ["Максим Рильський — поет, перекладач, літературознавець. У **1920-ті рр.** належав до групи **неокласиків**, які орієнтувалися на античну й європейську класику.", "У **1931 р.** його заарештували, а після звільнення він почав писати в дусі соціалістичного реалізму. Під час війни написав поему «Мандрівка в молодість» і відомий вірш «Слово про рідну матір».", "У **1947 р.** Рильського звинуватили в «українському буржуазному націоналізмі» і змусили публічно каятися. Попри це, він лишався одним з найавторитетніших поетів; перекладав українською Пушкіна й Міцкевича, зокрема поему «Пан Тадеуш»."], "imgs": [{"key": "s073_image90", "cap": "Максим Рильський"}]}, {"type": "text", "kicker": "Персоналія", "title": "Володимир Сосюра (1898 – 1965)", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Володимир Сосюра народився на Донеччині. У **1918 – 1919 рр.** воював в армії УНР, потім перейшов до Червоної армії. У 1920-ті рр. був членом літературних об’єднань «Плуг», «Гарт», ВАПЛІТЕ.", "У **1944 р.** написав вірш **«Любіть Україну»** — заклик любити рідну землю, мову, народ. Спочатку вірш хвалили й перекладали.", "Але **2 липня 1951 р.** газета «Правда» звинуватила поета в «буржуазному націоналізмі», бо у вірші, на думку газети, немає ні радянської України, ні «дружби народів». Сосюру змусили каятися, вірш вилучили з видань. Друкувати вірш знову дозволили лише після смерті Сталіна."], "imgs": [{"key": "s055_image61", "cap": "Володимир Сосюра"}]}, {"type": "doc", "title": "Малишко про «Любіть Україну» (1951 р.)", "quote": ["Коли партія розгорнула соціалістичний наступ проти куркулів, буржуазних націоналістів, В. Сосюра знову виявив ідеологічні хитання… не зрозумів ролі ленінсько-сталінської дружби народів і виступив з рядом **занепадницьких безідейних віршів, а то і прямо ворожих, як-от вірш «Любіть Україну»**.", "**Хто забуває про дружбу народів чи обходить її мовчанкою у своїй творчості, той робить величезний злочин проти справи будівництва комунізму.**"], "source": "А. Малишко про «Любіть Україну» В. Сосюри (1951 р.)", "comment": ["Сосюру засуджували не лише партійні чиновники, а й колеги-поети. Після статті «Правди» письменники мусили публічно висловитися проти вірша; хто мовчав, сам ризикував потрапити під звинувачення.", "Малишко дорікає Сосюрі не за те, що у вірші є, а за те, чого в ньому немає, — за мовчання про «дружбу народів».", "__Слова з документа:__ **занепадницький** — сповнений смутку й зневіри, не «оптимістичний»; **безідейний** — без комуністичних ідей."], "img": {"key": "s055_image59", "cap": "Андрій Малишко"}}, {"type": "text", "kicker": "Персоналія", "title": "Павло Тичина (1891 – 1967)", "badges": ["НМТ: персоналія"], "paras": ["Павло Тичина — поет, перекладач, публіцист. Славу йому принесла рання збірка **«Сонячні кларнети»** (1918); стиль цих віршів критики назвали **«кларнетизмом»**.", "У 1920-ті рр. він був членом «Гарту» й ВАПЛІТЕ, поділяв погляди Миколи Хвильового. Коли почалися репресії проти письменників, Тичина вирішив беззастережно служити владі.", "У листопаді **1933 р.**, у розпал Голодомору, газета «Правда» надрукувала його вірш **«Партія веде»**. Відтоді Тичина писав переважно на славу партії й Сталіна. За збірку «Чуття єдиної родини» він отримав Сталінську премію (1941)."], "imgs": [{"key": "s075_image92", "cap": "Павло Тичина"}]}, {"type": "text", "kicker": "Персоналія", "title": "Тичина і радянська влада", "badges": ["НМТ: персоналія"], "paras": ["Тичина не лише писав «потрібні» вірші, а й обіймав високі посади. Він був академіком, директором Інституту літератури, у **1943 – 1948 рр.** — **міністром освіти УРСР**, у 1953 – 1959 рр. — головою Верховної Ради УРСР. У **1944 р.** вступив до комуністичної партії.", "Разом з Миколою Бажаном він написав слова **Державного гімну УРСР** (1949): «Живи, Україно, радянська державо…». У тексті гімну — подяка російському народові й Сталіну.", "Сучасники й дослідники оцінювали цей вибір по-різному. Василь Стус у праці «Феномен доби» писав, що геніальний поет заплатив за безпеку власним талантом. Інші наголошували, що Тичина служив владі свідомо й до кінця життя; у 1967 р. він отримав звання Героя Соціалістичної Праці.", "Водночас він знав близько двадцяти мов і багато перекладав, а як міністр опікувався відбудовою шкіл."], "imgs": [{"key": "tychyna", "cap": "Павло Тичина, 1920-ті рр. Фото: журнал «Красная летопись» / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Персоналія", "title": "Андрій Малишко (1912 – 1970)", "badges": ["НМТ: персоналія"], "paras": ["Андрій Малишко — поет, перекладач, літературний критик. Народився на Київщині, під час війни був фронтовим кореспондентом.", "У повоєнні роки писав про війну, відбудову й мир і отримав дві **Сталінські премії**. На відміну від старших поетів, гучних конфліктів з владою не мав і брав участь в офіційних кампаніях: у 1951 р. публічно засудив вірш Сосюри «Любіть Україну».", "Найвідоміші його пізніші твори — тексти пісень «**Пісня про рушник**» (музика П. Майбороди) і «Ми підем, де трави похилі», які співають досі."], "imgs": [{"key": "s072_image89", "cap": "Андрій Малишко"}]}, {"type": "monument", "title": "Тетяна Яблонська «Хліб» (1949)", "badges": [], "img": {"key": "s057_image65", "cap": "Тетяна Яблонська. «Хліб», 1949 р. Державна Третьяковська галерея, Москва"}, "paras": ["На картині — жінки на колгоспному току після жнив: вони насипають зерно в мішки, віють, відпочивають. Яскраве сонце, жовте зерно й усмішки жінок роблять картину святковою.", "**Тетяна Яблонська** (1917 – 2005) написала «Хліб» у **1949 р.** у колгоспі села Летава на Хмельниччині. Картина відповідає вимогам **соціалістичного реалізму**: героїчна праця, щасливе колгоспне життя. У **1950 р.** художниця отримала за неї Сталінську премію.", "Картина не показує повоєнних злиднів і голоду 1946 – 1947 рр., але залишається однією з найвідоміших українських картин повоєнних років."]}, {"type": "text", "kicker": "Мистецтво", "title": "Катерина Білокур (1900 – 1961)", "badges": ["поза програмою"], "paras": ["Катерина Білокур — майстриня **народного декоративного живопису**, самоучка з села Богданівка на Полтавщині. Батьки не дозволяли їй учитися малювати, і вона все життя навчалася сама.", "Вона малювала квіти, колоски, сільські краєвиди й ретельно виписувала кожну пелюстку. У повоєнні роки її роботи показували на виставках у Києві й Москві, а в **1956 р.** вона отримала звання народної художниці УРСР.", "Білокур — **персоналія програми НМТ** з наступної теми (доба «відлиги»), де треба знати її картину «Хата в Богданівці» (1955)."], "imgs": [{"key": "bilokur", "cap": "Катерина Білокур за мольбертом, 1954 р. Фото: Я. Паволоцький / Wikimedia Commons, CC BY 4.0"}, {"key": "s058_image71", "cap": "Натюрморт (півонії й кавун)"}, {"key": "s058_image69", "cap": "Квіти біля тину"}]}, {"type": "text", "kicker": "Мистецтво", "title": "Ніл Хасевич (1905 – 1952) — художник УПА", "badges": ["поза програмою"], "paras": ["Ніл Хасевич — графік з Волині, випускник Варшавської академії мистецтв. Ще в дитинстві він утратив ногу, але став відомим майстром **дереворитів** і екслібрисів.", "У 1940-ві рр. Хасевич працював у підпіллі ОУН: оформлював листівки, видання, відзнаки УПА, створював гравюри про боротьбу повстанців. Його дереворити переправляли за кордон, і там вийшли альбоми «Волинь у боротьбі» та «Графіка в бункерах УПА».", "**4 березня 1952 р.** у селі Сухівці на Рівненщині Хасевич загинув під час облави МДБ на криївку."], "imgs": [{"key": "s059_image73", "cap": "Ніл Хасевич. «Громадою обух сталіть та добре вигостріть сокиру» (дереворит, 1940-ві рр.)"}, {"key": "s059_image74", "cap": "Дереворит до річниці державності"}, {"key": "s059_image72", "cap": "Дереворит про повстанців"}]}]}, {"id": "s7", "num": "VII", "title": "Узагальнення", "sub": "Персоналії й поняття теми, що часто плутають на НМТ, стрічка часу всієї теми", "cover": null, "cards": [{"type": "table", "title": "Персоналії теми", "rows": [["Хто", "Чим відомий"], ["Йосип Сліпий", "глава УГКЦ з 1944 р.; 18 років у радянських таборах; з 1963 р. у Римі, кардинал"], ["Василь Кук", "останній головний командир УПА (1950 – 1954); заарештований 1954 р."], ["Олександр Богомолець", "патофізіолог, президент АН УРСР (1930 – 1946); сироватка АЦС"], ["Володимир Філатов", "офтальмолог; пересадка рогівки, тканинна терапія; інститут в Одесі"], ["Сергій Лебедєв", "творець МЕОМ — першої ЕОМ у континентальній Європі (1950)"], ["Максим Рильський", "поет-неокласик, перекладач; критика 1947 р. за «націоналізм»"], ["Володимир Сосюра", "вірш «Любіть Україну»; цькування 1951 р."], ["Павло Тичина", "«Сонячні кларнети», «Партія веде»; міністр освіти УРСР (1943 – 1948)"], ["Андрій Малишко", "поет, лауреат Сталінських премій; «Пісня про рушник»"]]}, {"type": "table", "title": "Поняття теми", "rows": [["Поняття", "Значення"], ["Відбудова", "відновлення господарства, зруйнованого війною; в УРСР — четверта п’ятирічка (1946 – 1950)"], ["Холодна війна", "протистояння СРСР і його союзників із США та їхніми союзниками (з середини 1940-х до 1991 р.)"], ["Операція «Вісла»", "виселення польською владою українців з Лемківщини, Надсяння, Холмщини й Підляшшя на захід і північ Польщі (квітень – липень 1947 р.)"], ["Операція «Захід»", "депортація радянською владою родин учасників ОУН і УПА із західних областей УРСР до Сибіру й Казахстану (жовтень 1947 р.)"], ["Ждановщина", "кампанія 1946 – початку 1950-х рр. за повний ідеологічний контроль над наукою й культурою"], ["Лисенківщина", "кампанія в біології, заборона генетики після сесії ВАСГНІЛ 1948 р."], ["Космополітизм", "у радянському тлумаченні — «низькопоклонство перед Заходом»; кампанія 1949 – 1953 рр., спрямована насамперед проти євреїв"]]}, {"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Подія", "Що треба пам’ятати", "З чим плутають"], ["Ліквідація УГКЦ (березень 1946)", "Львівський «собор» скасував Берестейську унію 1596 р.", "на Закарпатті греко-католицьку церкву ліквідували пізніше — 1949 р."], ["Операція «Захід» (жовтень 1947)", "радянська депортація із західних областей УРСР", "операція «Вісла» (квітень – липень 1947) — польська, в межах Польщі"], ["«Любіть Україну»", "вірш Володимира Сосюри; ць const QUIZ = {"blitz": {"1": {"n": 30, "pass": 75, "timer": true, "quota": {"s1": 4, "s2": 5, "s3": 4, "s4": 5, "s5": 4, "s6": 4, "s7": 4}, "pool": [{"id": "z8895", "q": "У якому році Українська РСР стала членом Організації Об’єднаних Націй?", "sec": "s3", "g": "oon_rik", "t": "single", "opts": ["1944 р.", "1945 р.", "1949 р.", "1954 р."], "ok": [1], "expl": "У квітні 1945 р. УРСР запросили на конференцію в Сан-Франциско, а в червні 1945 р. делегація УРСР підписала Статут ООН — УРСР стала однією з держав-засновниць.", "src": "ЗНО 2009 – основна сесія (№ 48)"}, {"id": "z8956", "q": "Хронологічні рамки якого явища історії України є зайвими в цьому логічному ланцюжку: 1921–1923 рр., 1932–1933 рр., 1941–1945 рр., 1946–1947 рр.?", "sec": "s5", "g": "holod_lanc", "t": "single", "opts": ["1921–1923 рр.", "1932–1933 рр.", "1941–1945 рр.", "1946–1947 рр."], "ok": [2], "expl": "1921 – 1923, 1932 – 1933 і 1946 – 1947 рр. — це три голоди в радянській Україні. Зайве тут 1941 – 1945 рр. — роки німецько-радянської війни.", "src": "ЗНО 2008 – основна сесія (№ 39)"}, {"id": "z10110", "q": "Прочитайте уривок з історичного джерела та виконайте завдання.\n«Це важке, але необхідне рішення, яке забезпечить переселеному населенню спокійне життя в нових оселях, підготовлених урядом на інших теренах Речі Посполитої. Ті, хто не підпорядкується наказу й залишиться в околицях, охоплених акцією переселення, будуть трактовані як бандити УПА...»\nВ уривку йдеться про", "sec": "s2", "g": "lystivka", "t": "single", "opts": ["поширення осадництва.", "реалізацію операції «Вісла».", "проведення акції пацифікації.", "впровадження «Кресового» закону."], "ok": [1], "expl": "Це листівка польської влади 1947 р.: українців виселяли «на інші терени Речі Посполитої», а тих, хто опирався, оголошували бандитами УПА. Так проходила операція «Вісла».", "src": "ЗНО 2016 – додаткова сесія (№ 15)"}, {"id": "z13796", "q": "Прочитайте фрагмент історичного документа та виконайте завдання 14–16.\n«…До Центрального табору праці в Явожно, розташованого на території філіалу колишнього концентраційного табору в Освенцимі, …потрапляли особи, «підозрювані у зв’язках з УПА». …основну частину в’язнів становили українські селяни, які потрапили до табору через так звану «колективну відповідальність».\nЗа цей період через концентраційний табір пройшло 3 936 українських в’язнів, з них 823 жінки та кілька дітей. Більш ніж 160 в’язнів унаслідок тортур і самогубств загинули».\nНаповнення табору в’язнями відбувалося внаслідок", "sec": "s2", "g": "yavozhno", "t": "single", "opts": ["реалізації операції «Вісла».", "проведення акції «пацифікації».", "прийняття «Кресового» закону.", "здійснення політики «осадництва»."], "ok": [0], "expl": "До табору Явожно в 1947 р. відправляли українців, яких під час операції «Вісла» підозрювали у зв’язках з УПА. Пацифікація й осадництво — політика Польщі міжвоєнних років.", "src": "ЗНО 2018 – пробний тест (№ 14)"}, {"id": "z13797", "q": "Прочитайте фрагмент історичного документа та виконайте завдання 14–16.\n«…До Центрального табору праці в Явожно, розташованого на території філіалу колишнього концентраційного табору в Освенцимі, …потрапляли особи, «підозрювані у зв’язках з УПА». …основну частину в’язнів становили українські селяни, які потрапили до табору через так звану «колективну відповідальність».\nЗа цей період через концентраційний табір пройшло 3 936 українських в’язнів, з них 823 жінки та кілька дітей. Більш ніж 160 в’язнів унаслідок тортур і самогубств загинули».\nУ якому році відбувалися події, описані в уривку з історичного джерела?", "sec": "s2", "g": "yavozhno", "t": "single", "opts": ["1944 р.", "1947 р.", "1953 р.", "1959 р."], "ok": [1], "expl": "Українців, запідозрених у зв’язках з УПА, почали відправляти до Явожна під час операції «Вісла» — у 1947 р.", "src": "ЗНО 2018 – пробний тест (№ 15)"}, {"id": "z13798", "q": "Прочитайте фрагмент історичного документа та виконайте завдання 14–16.\n«…До Центрального табору праці в Явожно, розташованого на території філіалу колишнього концентраційного табору в Освенцимі, …потрапляли особи, «підозрювані у зв’язках з УПА». …основну частину в’язнів становили українські селяни, які потрапили до табору через так звану «колективну відповідальність».\nЗа цей період через концентраційний табір пройшло 3 936 українських в’язнів, з них 823 жінки та кілька дітей. Більш ніж 160 в’язнів унаслідок тортур і самогубств загинули».\nФункціонування «табору праці» було складовою процесу", "sec": "s2", "g": "yavozhno", "t": "single", "opts": ["анексії.", "депортації.", "мобілізації.", "лібералізації."], "ok": [1], "expl": "Табір Явожно був частиною операції «Вісла» — примусового виселення українців, тобто депортації. Анексія — це загарбання території, мобілізація — заклик до армії.", "src": "ЗНО 2018 – пробний тест (№ 16)"}, {"id": "z16551", "q": "Кореспондент газети «Saturday Evening Post», відвідавши в 1945 р. Україну, написав: «Те, що дехто намагається зобразити як російську славу, було, насамперед, українською війною. Жодна європейська країна не постраждала більше від глибоких ран, нанесених своїм містам, своїй промисловості, сільському господарству, людській силі».\nОписаний у документі стан України став офіційною підставою для", "sec": "s3", "g": "oon_pidstava", "t": "single", "opts": ["участі представників УРСР у створенні ООН.", "включення Західної України до складу УРСР.", "надання республіці допомоги за «планом Маршалла».", "обрання України членом Наради з безпеки та співробітництва в Європі."], "ok": [0], "expl": "Величезні втрати України у війні Москва використала як аргумент, щоб УРСР стала окремою державою-засновницею ООН. Допомоги за планом Маршалла СРСР не прийняв.", "src": "ЗНО 2019 – пробний тест (№ 14)"}, {"id": "z18360", "q": "У якому році оприлюднено звернення:\n«…Уряд УРСР впевнений у тому, що Україна, яка відіграла помітну роль у розгромі ворога, з її великими людськими силами й матеріальними ресурсами буде спроможна внести великий вклад у справу зміцнення миру й підтримання загальної безпеки... повідомляє про своє бажання приєднатися до загальної Організації Безпеки як одна з держав-засновниць, а також узяти участь у Конференції Об’єднаних Націй у Сан-Франциско»?", "sec": "s3", "g": "oon_zvern", "t": "single", "opts": ["1939 р.", "1940 р.", "1945 р.", "1954 р."], "ok": [2], "expl": "Звернення стосується конференції в Сан-Франциско, на якій створювали ООН, — це 1945 р. Тоді УРСР і стала державою-засновницею організації.", "src": "ЗНО 2019 – додаткова сесія (№ 14)"}, {"id": "z18361", "q": "Прочитайте уривок з історичного джерела про голод 1946–1947 рр. і виконайте завдання.\n«...Посуха, особливо в червні–липні, до всіх нещасть додала ще й свої. Урожай зернових вийшов доісторичний.., тобто один центнер посіяли, а зібрали три центнери в найліпшому разі. Та ще який тоді був обробіток ґрунту? Сяк-так, аби вкинути зерно в землю. Поля обробляли переважно кіньми-клячами, коровами, заступами, сапами, а збирали косами та жіночими руками...»\nУривок дає змогу визначити", "sec": "s5", "g": "holod_posukha", "t": "single", "opts": ["наслідки голоду.", "причини голоду.", "масштаби голоду.", "результати голоду."], "ok": [1], "expl": "Уривок пояснює, чому почався голод: посуха й мізерний урожай, поля обробляли коровами й заступами. Про кількість жертв чи про те, що було після голоду, в уривку не сказано.", "src": "ЗНО 2019 – додаткова сесія (№ 15)"}, {"id": "z23833", "q": "Що було характерним для розвитку сільського господарства УРСР в період перших повоєнних років?", "sec": "s4", "g": "silhosp3", "t": "three", "opts": ["запровадження орендних відносин на селі", "колективізація в західних областях України", "створення владою масового штучного голоду", "суттєве збільшення розмірів присадибних ділянок колгоспників", "упровадження системи закупівель сільськогосподарської продукції", "відновлення репресивної політики щодо селянства", "насичення колгоспів різноманітною сільськогосподарською технікою"], "ok": [1, 2, 5], "expl": "У західних областях проводили колективізацію, а влада знову посилила тиск на селян: непосильні хлібозаготівлі, покарання за «колоски». Голод 1946 – 1947 рр. дослідники пов’язують не лише з посухою, а й з політикою держави. Оренди, техніки й більших присадибних ділянок не було.", "src": "ЗНО 2021 – основна сесія (№ 30)"}, {"id": "z26023", "q": "Здійснення «операції “Вісла”» та «операції “Захід”» відбулося", "sec": "s2", "g": "visla_zakhid_rik", "t": "single", "opts": ["1939 р.", "1944 р.", "1947 р.", "1951 р."], "ok": [2], "expl": "Обидві операції відбулися 1947 р.: «Вісла» — у квітні – липні (польська влада), «Захід» — у жовтні (радянська влада).", "src": "НМТ 2022 – демоваріант (№ 10)"}, {"id": "z26143", "q": "Низькі темпи розвитку легкої промисловості та сфери послуг в Україні в період післявоєнної відбудови спричинені", "sec": "s4", "g": "lehka", "t": "single", "opts": ["зруйнуванням усіх підприємств легкої промисловості.", "скасуванням карток на продовольчі та промислові товари.", "пріоритетним фінансуванням важкої промисловості.", "відсутністю попиту населення на товари та послуги."], "ok": [2], "expl": "Найбільше грошей у четвертій п’ятирічці діставала важка промисловість — вугілля, метал, електроенергія. На легку промисловість і житло коштів лишалося мало, тому в крамницях бракувало товарів.", "src": "НМТ 2022 – основна сесія (№ 10)"}, {"id": "z26951", "q": "«15 червня 1947 р. село було оточене військом. Чотири години на підготовку – і в дорогу. Куди? За що? Благали, просили – нічого не допомагало. Вивезли…», – так житель Холмщини Яків Самощук коротко згадує про операцію", "sec": "s2", "g": "visla_spohad", "t": "single", "opts": ["«Вісла».", "«Захід».", "«Хвиля».", "«Ост»."], "ok": [0], "expl": "Холмщина лишилася в складі Польщі, і в 1947 р. її українців виселила польська армія під час операції «Вісла». «Захід» — радянська депортація із західних областей УРСР.", "src": "НМТ 2023 – 2 сесія (№ 16)"}, {"id": "z26965", "q": "Що було характерним для розвитку сільського господарства УРСР у перші повоєнні роки?", "sec": "s4", "g": "silhosp3", "t": "three", "opts": ["запровадження орендних відносин на селі", "колективізація в західних областях України", "створення владою чергового масового штучного голоду", "суттєве збільшення розмірів присадибних ділянок колгоспників", "упровадження системи закупівель сільськогосподарської продукції", "відновлення репресивної політики щодо селянства", "насичення колгоспів різноманітною сільськогосподарською технікою"], "ok": [1, 2, 5], "expl": "У західних областях проводили колективізацію, а влада знову посилила тиск на селян: непосильні хлібозаготівлі, покарання за «колоски». Голод 1946 – 1947 рр. дослідники пов’язують не лише з посухою, а й з політикою держави. Оренди, техніки й більших присадибних ділянок не було.", "src": "НМТ 2023 – 2 сесія (№ 30)"}, {"id": "z39172", "q": "Які чинники найбільше вплинули на відображену на картосхемі динаміку чисельності населення регіонів УРСР у 1939–1959 рр.?", "sec": "s4", "g": "demogr_map", "t": "single", "img": ["q_76cdea29ef"], "opts": ["розбудова індустріальних центрів", "збройна й підпільна боротьба УПА й ОУН", "адміністративно-територіальні зміни", "депортація й обмін населенням із Польщею"], "ok": [0], "expl": "Населення зростало там, де відбудовували й розбудовували шахти й заводи, — у Донбасі, Придніпров’ї, на півдні. Туди їхали працювати люди з сіл.", "src": "НМТ 2026 – 1 сесія (№ 18)"}, {"id": "z39218", "q": "Узгодьте назву інституції (1–4) з ухваленим нею рішенням (А – Д).", "sec": "s7", "g": "inst_match", "t": "match", "opts": ["проголошення Акта відновлення Української Держави", "ліквідація Української греко-католицької церкви", "проголошення радянської влади на приєднаних територіях", "депортація українського населення Лемківщини, Холмщини, Надсяння й Підляшшя", "«возз’єднання» Закарпаття з Українською РСР"], "ok": [3, 2, 1, 0], "left": ["Політбюро Центрального комітету Польської робітничої партії (1947 р.)", "Народні Збори Західної України (1939 р.)", "Львівський собор (1946 р.)", "Українські Національні Збори (1941 р.)"], "expl": "Політбюро польських комуністів у 1947 р. ухвалило операцію «Вісла»; Народні Збори 1939 р. проголосили радянську владу на західноукраїнських землях; Львівський «собор» 1946 р. ліквідував УГКЦ; Українські Національні Збори 30 червня 1941 р. проголосили Акт відновлення Української Держави.", "src": "НМТ 2026 – 2 сесія (№ 23)"}, {"id": "z36924", "q": "Проаналізуйте картосхему й визначте головну причину відображених на ній демографічних змін.", "sec": "s4", "g": "demogr_map", "t": "single", "img": ["q_0beb1631e2"], "opts": ["наслідки політики нацистського окупаційного режиму", "пріоритетний розвиток важкої промисловості в період післявоєнної відбудови", "значне територіальне розширення Української РСР у зазначений період", "наслідки проведення примусових операцій «Захід» та «Вісла»"], "ok": [1], "expl": "Населення найшвидше зростало в промислових областях сходу й півдня, куди держава спрямовувала кошти й робочу силу для відбудови важкої промисловості.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37417", "q": "Якій державі УРСР передала частину своєї території внаслідок міждержавного обміну 1951 року?", "sec": "s1", "g": "obmin1951", "t": "single", "opts": ["Угорщині", "Румунії", "Польщі", "Чехословаччині"], "ok": [2], "expl": "За договором 1951 р. СРСР і Польща обмінялися прикордонними ділянками: УРСР віддала Польщі Устрики Долішні з околицями, а отримала землі біля Белза й Кристинополя.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z22851", "q": "Проаналізуйте фрагмент історичного документа й виконайте завдання.\n«Українці Закарпаття! Цей рік уписується в історію закарпатської землі як ще одна чорна дата. Замість згаданої свободи цей рік приніс тільки зміну окупантів – ... прийшли московсько-більшовицькі пригноблювачі, які своєю окупаційною практикою залишили далеко позаду своїх попередників. Захопленням Закарпаття Червона Москва завершила, в основному, насильницьке об’єднання всіх українських земель, надівши своє ярмо на шию всьому українському народу»\n«Захоплення Закарпаття Червоною Москвою» відбулося в результаті", "sec": "s1", "g": "zakarp_1944", "t": "single", "opts": ["здійснення Акта Злуки.", "подій «золотого вересня».", "підписання Мюнхенської угоди.", "наступальних дій радянської армії."], "ok": [3], "expl": "Восени 1944 р. Закарпаття зайняла Червона армія, після чого з’їзд народних комітетів у Мукачеві ухвалив маніфест про «возз’єднання» з УРСР. Автор листівки називає це «зміною окупантів».", "src": "ЗНО 2021 – пробний тест (№ 14)"}, {"id": "z22068", "q": "Рік набуття Українською РСР членства в ООН в історії України пов’язаний із", "sec": "s3", "g": "oon_zakarp", "t": "single", "opts": ["проведенням операції «Вісла».", "включенням до її складу Закарпаття.", "скасуванням карткової системи розподілу продуктів.", "розгортанням кампанії боротьби з «безрідним космополітизмом»."], "ok": [1], "expl": "Обидві події припадають на 1945 р.: УРСР стала співзасновницею ООН, а за договором з Чехословаччиною до неї відійшло Закарпаття. Операція «Вісла» відбулася 1947 р., а кампанія проти «космополітів» почалася 1949 р.", "src": "ЗНО 2010 – додаткова сесія (№ 42)"}, {"id": "z38084", "q": "Кореспондент газети «Saturday Evening Post», відвідавши 1945 р. Україну, написав: «Те, що дехто намагається зобразити як російську славу, було насамперед українською війною. Жодна європейська країна не постраждала більше від глибоких ран, нанесених своїм містам, своїй промисловості, сільському господарству, людській силі».\nОписаний у документі стан України став офіційною підставою для", "sec": "s3", "g": "oon_pidstava", "t": "single", "opts": ["залучення представників УРСР до участі у створенні ООН.", "включення всієї території Західної України до складу УРСР.", "надання республіці економічної допомоги за планом Маршалла.", "обрання України членом Наради з безпеки та співробітництва в Європі."], "ok": [0], "expl": "Вели ве (за зразком ЗНО)"}, {"id": "n131", "q": "Хто, крім місцевих жителів, працював на відбудові шахт, заводів і міст УРСР?", "sec": "s4", "g": "robsyla", "t": "single", "opts": ["добровольці з країн Західної Європи", "інженери, найняті коштом плану Маршалла", "фахівці, запрошені з США й Великої Британії", "військовополонені німці й в’язні ГУЛАГу"], "ok": [3], "expl": "Людей бракувало, тож на будовах працювали військовополонені німці й в’язні ГУЛАГу. Іноземних фахівців не запрошували, а допомоги за планом Маршалла СРСР не прийняв.", "src": "нове (за зразком ЗНО)"}, {"id": "n132", "q": "Яким був результат відбудови промисловості УРСР до 1950 р.?", "sec": "s4", "g": "vidbud_rez", "t": "single", "opts": ["промисловість перевищила довоєнний рівень, але на старому обладнанні", "УРСР перейшла на випуск товарів переважно для потреб населення", "легка промисловість уперше випередила важку за обсягом виробництва", "сільське господарство вдвічі перевищило довоєнний рівень виробництва"], "ok": [0], "expl": "У 1950 р. промисловість УРСР виробляла на 15 % більше, ніж до війни, але відбудовували старі заводи з довоєнними технологіями. Легка промисловість і сільське господарство довоєнного рівня не досягли.", "src": "нове (за зразком ЗНО)"}, {"id": "n133", "q": "Як держава поповнювала робочу силу на шахтах і заводах у роки відбудови?", "sec": "s4", "g": "fzn", "t": "single", "opts": ["удвічі підвищувала зарплату всім, хто переїздив до Донбасу", "посилала молодь зі шкіл ФЗН і набирала селян за оргнабором", "запрошувала робітників з-за кордону за трудовими контрактами", "дозволила колгоспникам вільно виходити з колгоспів"], "ok": [1], "expl": "Молодь навчали в школах фабрично-заводського навчання (ФЗН) і посилали на шахти й заводи, а в селах набирали працівників за організованим набором (оргнабором).", "src": "нове (за зразком ЗНО)"}, {"id": "n141", "q": "Що передбачав указ 1947 р. про охорону державного майна?", "sec": "s5", "g": "ukaz1947", "t": "single", "opts": ["дозвіл колгоспникам брати насіннєве зерно на харчі", "скасування обов’язкових поставок для голодуючих колгоспів", "роки ув’язнення навіть за жменю колосків з поля", "видачу селянам продовольчих карток на час голоду"], "ok": [2], "expl": "Указ, виданий улітку 1947 р., дозволяв ув’язнювати на роки навіть за жменю колосків. Так карали голодних людей, які намагалися взяти бодай щось із колгоспного поля.", "src": "нове (за зразком ЗНО)"}, {"id": "n142", "q": "Що робило радянське керівництво із зерном під час голоду 1946 – 1947 рр.?", "sec": "s5", "g": "export_zerna", "t": "single", "opts": ["зменшило план хлібозаготівель для УРСР у кілька разів", "закуповувало зерно в США й Канаді для голодуючих", "роздавало державні запаси всім колгоспникам безплатно", "вивозило сотні тисяч тонн до країн Східної Європи"], "ok": [3], "expl": "Попри голод, СРСР вивозив зерно за кордон, щоб підтримати комуністичні режими Східної Європи, а план хлібозаготівель для УРСР не зменшив. Допомога голодуючим надійшла лише навесні 1947 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n143", "q": "Коли голод 1946 – 1947 рр. в УРСР досяг найбільших масштабів?", "sec": "s5", "g": "holod_pik", "t": "single", "opts": ["узимку й навесні 1947 р., до нового врожаю", "узимку 1945 – 1946 рр., ще до посухи", "улітку 1946 р., одразу після посухи", "восени 1947 р., після нового врожаю"], "ok": [0], "expl": "Голод почався восени 1946 р., а найтяжче було взимку й навесні 1947 р.: люди їли лободу й кору, траплялося людоїдство.", "src": "нове (за зразком ЗНО)"}, {"id": "n151", "q": "Як обмінювали готівку під час грошової реформи 1947 р.?", "sec": "s6", "g": "reforma_obmin", "t": "single", "opts": ["2 старі карбованці на 1 новий", "10 старих карбованців на 1 новий", "готівку не обмінювали, лише вклади", "1 старий карбованець на 1 новий"], "ok": [1], "expl": "Готівку обміняли 10 : 1, тобто за 10 старих карбованців давали 1 новий. Вклади в ощадкасах до 3 тис. крб обміняли 1 : 1, тож ті, хто тримав гроші вдома, втратили більше.", "src": "нове (за зразком ЗНО)"}, {"id": "n152", "q": "Хто найбільше втратив від грошової реформи 1947 р.?", "sec": "s6", "g": "reforma_vtraty", "t": "single", "opts": ["робітники, які мали вклади в ощадкасі до 3 тис. крб", "робітники, які отримали зарплату вже новими грошима", "селяни, які тримали виручку з базару вдома готівкою", "пенсіонери, які отримували пенсію щомісяця"], "ok": [2], "expl": "Готівку міняли 10 : 1, а невеликі вклади в ощадкасах — 1 : 1. Тому найбільше втратили селяни, які тримали виручку з базару вдома, і всі, хто мав заощадження готівкою.", "src": "нове (за зразком ЗНО)"}, {"id": "n153", "q": "Де городяни в перші повоєнні роки могли купити продукти понад мізерні карткові норми?", "sec": "s6", "g": "bazar", "t": "single", "opts": ["у державних крамницях за пільговими цінами для фронтовиків", "у кооперативних магазинах за цінами, нижчими за державні", "лише за кордоном, бо приватна торгівля була заборонена", "на базарах і в комерційних магазинах за значно вищими цінами"], "ok": [3], "expl": "Карткові норми були мізерні, тож усе інше люди купували на базарах або в комерційних магазинах, де ціни були в кілька разів вищими.", "src": "нове (за зразком ЗНО)"}, {"id": "n154", "q": "Чим становище селян у перші повоєнні роки відрізнялося від становища городян?", "sec": "s6", "g": "selo_kartky", "t": "single", "opts": ["селяни не отримували продовольчих карток і державних пайків", "селяни платили значно менші податки, ніж робітники міст", "селянам видавали картки за вищими нормами, ніж городянам", "селян звільнили від обов’язкових поставок державі"], "ok": [0], "expl": "Картки й державні пайки отримували лише городяни; селяни мусили жити з того, що лишалося після хлібозаготівель, і з власного городу.", "src": "нове (за зразком ЗНО)"}, {"id": "n155", "q": "Як держава намагалася допомогти дітям, які втратили батьків під час війни?", "sec": "s6", "g": "syroty", "t": "single", "opts": ["відправляла всіх сиріт із семи років до шкіл ФЗН", "відкривала дитячі будинки, хоча місць у них не вистачало", "передавала дітей на виховання до сімей у країнах Заходу", "виплачувала кожній дитині пенсію, більшу за зарплату"], "ok": [1], "expl": "Сиріт після війни були десятки тисяч. Держава відкривала для них дитячі будинки, але місць не вистачало.", "src": "нове (за зразком ЗНО)"}, {"id": "n156", "q": "Що зробила держава восени 1946 р., коли почався голод?", "sec": "s6", "g": "tsiny1946", "t": "single", "opts": ["відкрила безплатні державні їдальні в усіх голодуючих селах", "дозволила колгоспникам залишати собі весь урожай", "підняла ціни на хліб за картками й скоротила число отримувачів", "знизила ціни на хліб і видала картки всім селянам"], "ok": [2], "expl": "Восени 1946 р. держава підняла ціни на хліб за картками й зменшила кількість людей, які мали право на картки. Селяни карток узагалі не отримували.", "src": "нове (за зразком ЗНО)"}, {"id": "n105", "q": "Які землі, населені українцями, після Другої світової війни лишилися в складі Чехословаччини?", "sec": "s1", "g": "priashiv", "t": "single", "opts": ["Холмщина", "Надсяння", "Пряшівщина", "Північна Буковина"], "ok": [2], "expl": "Пряшівщина — землі українців у Словаччині — лишилася поза УРСР, у Чехословаччині. Холмщина й Надсяння відійшли до Польщі, а Північну Буковину СРСР забрав у Румунії.", "src": "нове (за зразком ЗНО)"}, {"id": "n106", "q": "Яка зміна кордону УРСР відбулася 1948 р.?", "sec": "s1", "g": "zmiinyi", "t": "single", "opts": ["до Польщі відійшов Перемишль", "до складу УРСР увійшло Закарпаття", "СРСР і Польща обмінялися ділянками", "Румунія передала СРСР острів Зміїний"], "ok": [3], "expl": "1948 р. за окремим протоколом Румунія передала СРСР острів Зміїний, і він увійшов до Ізмаїльської області УРСР. Закарпаття й Перемишль — договори 1945 р., обмін ділянками з Польщею — 1951 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n113", "q": "Коли польська влада провела операцію «Вісла»?", "sec": "s2", "g": "visla_misiatsi", "t": "single", "opts": ["у квітні – липні 1947 р.", "у лютому 1951 р.", "у жовтні 1947 р.", "у 1944 – 1946 рр."], "ok": [0], "expl": "Операція «Вісла» тривала з 28 квітня до 31 липня 1947 р. Обмін населенням з Польщею — 1944 – 1946 рр., операція «Захід» — жовтень 1947 р., обмін ділянками — 1951 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n123", "q": "Що дозволила союзним республікам Верховна Рада СРСР 1 лютого 1944 р.?", "sec": "s3", "g": "nkzs1944", "t": "single", "opts": ["встановлювати власні митні кордони", "мати наркомати закордонних справ і оборони", "запровадити власну валюту й національний банк", "виходити зі складу СРСР без згоди Москви"], "ok": [1], "expl": "1 лютого 1944 р. союзним республікам дозволили мати власні наркомати закордонних справ і оборони. Так у Москви з’явилася підстава вимагати для УРСР окремого місця в майбутній ООН.", "src": "нове (за зразком ЗНО)"}, {"id": "n124", "q": "Чому незалежній Україні 1991 р. не довелося вступати до ООН?", "sec": "s3", "g": "oon_1991", "t": "single", "opts": ["вона успадкувала місце СРСР у Раді Безпеки", "її прийняли до ООН ще 1954 р., разом з Кримом", "вона вже була державою-засновницею ООН", "ООН автоматично приймала всі колишні республіки СРСР"], "ok": [2], "expl": "УРСР у 1945 р. стала однією з 51 держави-засновниці ООН, тож незалежна Україна вже мала там своє місце. Місце СРСР у Раді Безпеки успадкувала Росія.", "src": "нове (за зразком ЗНО)"}, {"id": "n161", "q": "Установіть послідовність подій.", "sec": "s7", "g": "seq_kordony", "t": "seq", "opts": ["підписання договору між СРСР і Польщею про кордон", "початок масового голоду в УРСР", "проведення грошової реформи в СРСР", "передання Румунією острова Зміїний Радянському Союзу"], "expl": "Договір з Польщею про кордон — 16 серпня 1945 р.; масовий голод — 1946 – 1947 рр.; грошова реформа — грудень 1947 р.; острів Зміїний Румунія передала 1948 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n162", "q": "Яке з переселень охопило найбільше людей?", "sec": "s7", "g": "pereselennia_masshtab", "t": "single", "opts": ["переселення після обміну ділянками з Польщею (1951)", "депортація кримських татар (1944)", "операція «Вісла» на південному сході Польщі (1947)", "обмін населенням між УРСР і Польщею (1944 – 1946)"], "ok": [3], "expl": "За угодою 1944 р. між УРСР і Польщею переселили майже 1,3 млн українців і поляків. Під час «Вісли» виселили близько 140 тис. українців, після обміну ділянками 1951 р. — понад 32 тис., кримських татар депортували близько 190 тис.", "src": "нове (за зразком ЗНО)"}]}, "2": {"n": 30, "pass": 75, "timer": true, "quota": {"s1": 5, "s2": 4, "s3": 5, "s4": 8, "s5": 4, "s6": 4}, "pool": [{"id": "z1735", "q": "Із якою метою в Україні наприкінці 1940 — початку 1950-х рр. розгорнуто кампанії боротьби проти «космополітизму» та «низькопоклонства перед Заходом»?", "sec": "s4", "g": "kosmo_meta", "t": "single", "opts": ["Звеличення ролі української інтелігенції в розбудові соціалізму.", "Мобілізація суспільства на здійснення відбудови народного господарства.", "Відновлення тотального політико-ідеологічного контролю за суспільством.", "Переконання суспільства в перевагах соціалізму над капіталізмом."], "ok": [2], "expl": "Після війни Сталін вирішив ізолювати суспільство від Заходу й повернути повний ідеологічний контроль. Боротьба з «низькопоклонством» і «космополітизмом» була частиною цього.", "src": "ЗНО 2011 – пробний тест (№ 42)"}, {"id": "z6673", "q": "У якому році відбулася подія, відображена в уривку з історичного джерела: «У теперішній ситуації, коли завдяки героїчним подвигам і славній перемозі Радянського Союзу всі українські землі з’єдналися разом... собор постановляє скасувати постанови Берестейського Собору 1596 р., ліквідувати унію... і повернутися до нашої батьківської святої православної віри і Руської Православної Церкви...» ?", "sec": "s2", "g": "sobor_rik", "t": "single", "opts": ["1939 р.", "1944 р.", "1946 р.", "1949 р."], "ok": [2], "expl": "Це постанова Львівського «собору» 8 – 10 березня 1946 р., який скасував Берестейську унію й приєднав УГКЦ до Російської православної церкви.", "src": "ЗНО 2014 – основна сесія (№ 36)"}, {"id": "z8999", "q": "Укажіть період розвитку українського суспільства, характерними рисами якого була боротьба влади з проявами “українського буржуазного націоналізму”, з “космополітизмом” та “низькопоклонством перед Заходом”.", "sec": "s4", "g": "kamp_period", "t": "single", "opts": ["кінець 1930-х – початок 1940-х рр.", "друга половина 1940-х – початок 1950-х рр.", "друга половина 1950-х – початок 1960-х рр.", "кінець 1960-х – перша половина 1970-х рр."], "ok": [1], "expl": "Боротьба з «українським буржуазним націоналізмом» (ждановщина) і з «космополітизмом» припадає на другу половину 1940-х – початок 1950-х рр., останні роки Сталіна.", "src": "ЗНО 2007 – основна сесія (№ 24)"}, {"id": "z9184", "q": "Укажіть уривок з історичного джерела, де відображено проблему радянської дійсності кінця 1940-х – початку 1950-х рр., на якій фокусує увагу карикатура?\nНаписи на карикатурі: «“Невдахи-експериментатори”, “Вейсманізм”, “Морганізм”, “Менделізм”».", "sec": "s4", "g": "lysenko_doc", "t": "single", "img": ["q_60b0768d4e"], "opts": ["«Не завжди, коли ми показуємо визначного діяча минулого, святкуємо його ювілеї, наголошується на зв’язку минулого з дійсністю, вказується на роль партії і тов. Й. Сталіна…»", "«Редакція “Вітчизни” не поставила в центрі своєї уваги висвітлення в журналі провідних тем сучасності – перемоги радянського народу у Великій Вітчизняній війні, героїчної боротьби радянських людей за виконання сталінської п’ятирічки…»", "«На Україні завдання наукової розробки історії українського народу покладено на Інститут історії України АН УРСР. Проте... Інститут не розробив науково витриманої, марксистсько-ленінської історії України...»", "«Особи, які відстоюють принципи формальної генетики, неспроможні зрозуміти вказівки Леніна про те, що “пізнання людини не є... пряма лінія, а крива лінія, що безмежно наближується до ряду кіл, до спіралі”...»"], "ok": [3], "expl": "На карикатурі висміяно генетиків — «вейсманістів-менделістів-морганістів». Це лисенківщина, тому підходить уривок про «формальну генетику».", "src": "ЗНО 2016 – пробний тест (№ 13)"}, {"id": "z9396", "q": "Колективізація в Західній Україні в другій половині 1940-х - 1950-х рр. проводилася з метою", "sec": "s1", "g": "kolekt_meta3", "t": "three", "opts": ["уніфікації системи господарювання на всій території УРСР.", "зламу приватновласницької психології місцевого населення.", "реалізації угоди з обміну населенням між УРСР і Польщею.", "приховування наслідків Голодомору 1932-1933 рр.", "підготовки масової депортації українців до Сибіру.", "виконання умов для отримання допомоги за «планом Маршалла».", "утвердження соціальної структури радянського суспільства."], "ok": [0, 1, 6], "expl": "Колективізація мала зробити господарство західних областей таким самим, як в усьому СРСР, відучити селян від господарювання на власній землі й перетворити їх на колгоспників, як у решті радянського суспільства. План Маршалла й обмін населенням з нею не пов’язані.", "src": "ЗНО 2016 – основна сесія (№ 30)"}, {"id": "z10227", "q": "Колективізацію сільського господарства в 1940-ві – 1950-ті рр. було здійснено в", "sec": "s1", "g": "kolekt_zah", "t": "single", "opts": ["Західній Україні.", "Східній Україні.", "Південній Україні.", "Центральній Україні."], "ok": [0], "expl": "На сході, півдні й у центрі УРСР колгоспи створили ще в 1930-ті рр. У західних областях колективізацію провели в 1944 – 1950 рр.", "src": "ЗНО 2017 – пробний тест (№ 14)"}, {"id": "z15509", "q": "Уривок з історичного джерела «Особи, які відстоюють принципи формальної генетики, неспроможні зрозуміти геніальної вказівки Леніна про те, що “пізнання людини не є... пряма лінія, а крива лінія, що безмежно наближується до ряду кіл, до спіралі”...» доцільно використовувати, характеризуючи явище", "sec": "s4", "g": "lysenko_doc", "t": "single", "opts": ["«лисенківщини».", "«боротьби з космополітизмом».", "«волобуєвщини».", "«боротьби з буржуазним націоналізмом»."], "ok": [0], "expl": "Уривок нападає на «формальну генетику» — це лисенківщина, кампанія, після якої в СРСР заборонили генетику (1948).", "src": "ЗНО 2018 – додаткова сесія (№ 17)"}, {"id": "z21315", "q": "Що стримувало «радянізацію» Західної України в другій половині 1940-х – на початку 1950-х рр.?", "sec": "s1", "g": "radyan_opir", "t": "single", "opts": ["повоєнний голод", "ліквідація УГКЦ", "збройна боротьба ОУН, УПА", "суцільна неграмотність населення"], "ok": [2], "expl": "Радянізацію гальмувала збройна боротьба ОУН і УПА: повстанці зривали колективізацію, хлібозаготівлі, вибори. УГКЦ влада якраз ліквідувала, щоб прискорити радянізацію.", "src": "ЗНО 2020 – додаткова сесія (№ 16)"}, {"id": "z21324", "q": "Поєднайте ім’я історичної постаті з фактом її біографії.", "sec": "s3", "g": "pers_match", "t": "match", "opts": ["здійняв прапор Перемоги над Рейхстагом", "керував урядом відновленої 30 червня 1941 р. Української Держави", "тричі удостоєний звання Героя Радянського Союзу", "обраний митрополитом Української греко-католицької церкви", "командував Українською повстанською армією"], "ok": [3, 4, 1, 0], "left": ["Йосип Сліпий", "Роман Шухевич", "Ярослав Стецько", "Олексій Берест"], "expl": "Йосипа Сліпого Андрей Шептицький обрав своїм наступником на чолі УГКЦ; Роман Шухевич командував УПА; Ярослав Стецько очолив уряд, створений після Акта 30 червня 1941 р.; Олексій Берест разом з іншими встановив прапор над Рейхстагом.", "src": "ЗНО 2020 – додаткова сесія (№ 25)"}, {"id": "z22069", "q": "У яких цитованих документах відображено особливості культурно-ідеологічних процесів в Україні в період післявоєнної відбудови (1945 – початок 1950-х рр.)?\n1. «…Незважаючи на своє тринадцятилітнє існування, Інститут історії України не розробив і не видав… марксистсько-ленінської історії України. Працівники Інституту запозичили в істориків Антоновича, Грушевського положення, що… призвело до відродження буржуазно-націоналістичних настанов у питаннях історії України…»\n2. «…багато хто з наших письменників жалкують, що вони й досі не створили художніх творів про такого справжнього героя українського народу, як Трохим Лисенко. …Ми показали б у своїх творах значення мічурінської школи і цим самим зробили б велику справу для нашої партії...»", "sec": "s4", "g": "doc_ist_lys", "t": "single", "opts": ["Відображено в обох уривках.", "Тільки в першому.", "Тільки в другому.", "Не відображено в жодному з уривків."], "ok": [0], "expl": "Перший уривок — критика Інституту історії за «буржуазний націоналізм» (ждановщина), другий — вихваляння Лисенка (лисенківщина). Обидва — про повоєнні роки.", "src": "ЗНО 2010 – додаткова сесія (№ 43)"}, {"id": "z22129", "q": "Який із цитованих документів потрібно використовувати, характеризуючи суспільно-політичне життя в Україні в період післявоєнної відбудови (1945 – початок 1950-х рр.)?", "sec": "s4", "g": "doc_bn", "t": "single", "opts": ["«Розпочалася робота з ліквідації неписьменності, посилюється пропагандистська робота серед населення. Використовуючи друковане слово, наша більшовицька партія формує свідомість радянської людини»", "«Зворотною стороною буржуазного націоналізму є безрідний космополітизм, який проявляється в плазуванні та низькопоклонстві перед іноземщиною. Безрідний космополітизм є зброєю в боротьбі проти соціалізму»", "«Опір набув великого поширення. Зброя, що залишилася з воєнних часів, стала умовою для розгортання селянської партизанської війни. Партизанські загони швидко розгорталися в лісостеповій зоні суцільної колективізації»", "«Провести широку роз’яснювальну роботу серед широких верств населення стосовно доцільності ліквідації так званої «Української автокефальної православної церкви» як осередку відвертої петлюрівщини...»"], "ok": [1], "expl": "Слова про «безрідний космополітизм» і «низькопоклонство перед іноземщиною» — це кампанія 1949 – 1953 рр. Решта уривків — про 1920 – 1930-ті рр.", "src": "ЗНО 2011 – додаткова сесія (№ 43)"}, {"id": "z22188", "q": "Що було характерним для культурного життя УРСР в 1946–1953 рр.?", "sec": "s4", "g": "kult_46_53", "t": "single", "opts": ["створення творчих літературно-мистецьких об’єднань, угрупувань", "відродження традицій українізації 1920-х рр.", "проведення кампанії проти «низькопоклонства перед Заходом»", "послаблення партійного контролю"], "ok": [2], "expl": "У 1946 – 1953 рр. влада боролася з «низькопоклонством перед Заходом» і посилювала контроль. Літературні угруповання й українізація — 1920-ті рр.", "src": "ЗНО 2012 – додаткова сесія (№ 42)"}, {"id": "z22242", "q": "У якому уривку з історичного джерела ілюструється прояв «лисенківщини»?", "sec": "s4", "g": "lysenko_doc", "t": "single", "opts": ["«Коли ми показуємо визначного діяча минулого, святкуємо ювілеї, пов’язані з його іменем, завжди необхідно наголошувати на зв’язку минулого з дійсністю, вказувати на роль партії і тов. Сталіна...»", "«Редакція «Вітчизни» не поставила в центрі своєї уваги висвітлення в журналі провідних тем сучасності і насамперед – перемоги радянського народу у Великій Вітчизняній війні і героїчної боротьби радянських людей за виконання сталінської п’ятирічки…»", "«На Україні завдання наукової розробки історії українського народу покладено на Інститут історії України Академії наук УРСР. Проте... Інститут не розробив і не видав науково витриманої, марксистсько-ленінської історії України...»", "«Особи, які відстоюють принципи формальної генетики, неспроможні зрозуміти геніальної вказівки Леніна про те, що «пізнання людини не є... пряма лінія, а крива лінія, що безмежно наближується до ряду кіл, до спіралі...»"], "ok": [3], "expl": "Лисенківщина — кампанія проти генетики, тож її ілюструє уривок про «формальну генетику». Решта уривків — про ждановщину: критику журналів та Інституту історії.", "src": "ЗНО 2013 – додаткова сесія (№ 36)"}, {"id": "z22852", "q": "Колективізацію сільського господарства в 1940 – 1950-ті рр. здійснено в", "sec": "s1", "g": "kolekt_zah", "t": "single", "opts": ["Східній Україні.", "Західній Україні.", "Південній Україні.", "Центральній Україні."], "ok": [1], "expl": "На сході, півдні й у центрі УРСР колгоспи створили ще в 1930-ті рр. У західних областях колективізацію провели в 1944 – 1950 рр.", "src": "ЗНО 2021 – пробний тест (№ 15)"}, {"id": "z22853", "q": "Що було характерним для внутрішньополітичного життя Української РСР наприкінці 1940 – на початку 1950-х рр.?", "sec": "s4", "g": "vnutr_pol", "t": "single", "opts": ["розвінчання «культу особи»", "пропагування концепції «розвиненого соціалізму»", "упровадження практики реабілітації незаконно засуджених осіб", "розгортання кампанії боротьби з «безрідним космополітизмом»"], "ok": [3], "expl": "Кампанія проти «безрідних космополітів» тривала в 1949 – 1953 рр. Культ особи розвінчали 1956 р., «розвинений соціалізм» — гасло 1970-х рр.", "src": "ЗНО 2021 – пробний тест (№ 16)"}, {"id": "z22867", "q": "З якою метою радянська влада ліквідувала Українську греко-католицьку церкву (УГКЦ)?", "sec": "s2", "g": "ugkc_meta", "t": "three", "opts": ["відкрити шлях до об’єднання всіх християнських конфесій", "позбутися впливу Ватикану на населення Західної України", "підірвати духовну опóру руху спротиву процесам радянізації", "реалізувати давню мрію українського народу про об’єднання УГКЦ й Російської православної церкви", "привласнити матеріальні цінності УГКЦ", "здійснити перший крок до ліквідації інституту церкви", "реалізувати проголошене владою гасло: «Один народ, одна держава, одна віра»"], "ok": [1, 2, 4], "expl": "УГКЦ підпорядковувалася Папі Римському, підтримувала український рух і, на думку влади, УПА. Ліквідувавши її, влада хотіла відірвати галичан від Ватикану, послабити опір і забрати церковне майно.", "src": "ЗНО 2021 – пробний тест (№ 30)"}, {"id": "z23818", "q": "Що в УРСР стало одним із наслідків проведення партійно-радянським керівництвом СРСР кампанії, названої «ждановщиною»?", "sec": "s4", "g": "zhdan_nasl", "t": "single", "opts": ["припинення збройної боротьби УПА, ОУН", "гальмування розвитку науки, літератури й мистецтва в республіці", "початок вимушеної масової еміграції українських митців", "організаційне оформлення українського дисидентського руху"], "ok": [1], "expl": "Ждановщина накладала на науку, літературу й мистецтво жорсткий ідеологічний контроль: твори забороняли, авторів змушували каятися. Це гальмувало розвиток культури.", "src": "ЗНО 2021 – основна сесія (№ 15)"}, {"id": "z24876", "q": "Операція «Захід» 1947 року передбачала", "sec": "s3", "g": "zakhid_meta", "t": "single", "opts": ["заселення Волині польськими осадниками для «полонізації» краю.", "депортацію частини населення західних областей України до східних регіонів СРСР.", "«етнічну чистку» польською владою українців на території Закерзоння.", "мобілізацію польовими військкоматами українців на теренах, із яких вигнано німецьких загарбників."], "ok": [1], "expl": "Під час операції «Захід» у жовтні 1947 р. радянська влада вивезла із західних областей до Сибіру й Казахстану родини повстанців і тих, хто їм допомагав. Етнічну чистку на Закерзонні провела польська влада («Вісла»).", "src": "ЗНО 2021 – додаткова сесія (№ 15)"}, {"id": "z28414", "q": "«Чистки» української творчої інтелігенції в другій половині 1940-х – на початку 1950-х рр. були зумовлені реалізацією заходів", "sec": "s4", "g": "chystky", "t": "single", "opts": ["«ждановщини».", "культурної революції.", "«розстріляного відродження».", "лікнепу."], "ok": [0], "expl": "«Чистки» митців і вчених за «ідейні помилки» — це ждановщина (1946 – початок 1950-х рр.). «Розстріляне відродження» — 1930-ті рр.", "src": "НМТ 2024 – 1 сесія (№ 17)"}, {"id": "z28443", "q": "На території, виділеній на картосхемі червоним кольором, у 1947 р. радянськими каральними органами було проведено операцію", "sec": "s3", "g": "zakhid_map", "t": "single", "img": ["q_75ed7fee55"], "opts": ["«Захід».", "«Вісла».", "«Хвиля».", "«Кордон»."], "ok": [0], "expl": "Червоним позначено західні області УРСР, звідки в жовтні 1947 р. радянська влада депортувала родини повстанців, — це операція «Захід». «Вісла» відбувалася на території Польщі.", "src": "НМТ 2024 – 2 сесія (№ 16)"}, {"id": "z39183", "q": "Визначте складники політики радянізації західних областей України.", "sec": "s1", "g": "radyan_skl3", "t": "three", "opts": ["ліквідація церковного землеволодіння", "заохочення приватної торгівлі", "колективізація селянських господарств", "викуп державою поміщицьких земель", "націоналізація промислових підприємств", "створення раднаргоспів", "запровадження Продовольчої програми"], "ok": [0, 2, 4], "expl": "Радянізація — це націоналізація підприємств, колективізація селянських господарств, ліквідація церковного землеволодіння. Раднаргоспи з’явилися 1957 р., Продовольча програма — 1982 р.", "src": "НМТ 2026 – 1 сесія (№ 29)"}, {"id": "z37254", "q": "Що в УРСР стало одним із наслідків проведення партійно-радянським керівництвом СРСР ідеологічної кампанії, названої «ждановщиною»?", "sec": "s4", "g": "zhdan_nasl", "t": "single", "opts": ["припинення збройної боротьби УПА, ОУН", "гальмування розвитку науки, літератури й мистецтва в республіці", "початок вимушеної масової еміграції українських митців", "організаційне оформлення українського дисидентського руху"], "ok": [1], "expl": "Ждановщина накладала на науку, літературу й мистецтво жорсткий ідеологічний контроль: твори забороняли, авторів змушували каятися. Це гальмувало розвиток культури.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38005", "q": "Що в УРСР стало одним із наслідків проведення партійно-радянським керівництвом СРСР кампанії, названої «ждановщиною»?", "sec": "s4", "g": "zhdan_nasl", "t": "single", "opts": ["припинення збройної боротьби УПА, ОУН", "гальмування розвитку науки, літератури й мистецтва в республіці", "початок вимушеної масової еміграції українських митців", "організаційне оформлення українського дисидентського руху"], "ok": [1], "expl": "Ждановщина накладала на науку, літературу й мистецтво жорсткий ідеологічний контроль: твори забороняли, авторів змушували каятися. Це гальмувало розвиток культури.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38016", "q": "Радянська влада ліквідувала Українську греко-католицьку церкву (УГКЦ), щоб", "sec": "s2", "g": "ugkc_meta", "t": "three", "opts": ["відкрити шлях до об’єднання всіх християнських конфесій.", "позбутися впливу Ватикану на населення Західної України.", "підірвати духовну опóру руху спротиву процесам радянізації.", "зреалізувати давню мрію українського народу про об’єднання УГКЦ й Російської православної церкви.", "привласнити матеріальні цінності УГКЦ.", "здійснити перший крок до ліквідації інституту церкви.", "зреалізувати проголошене владою гасло «Один народ, одна держава, одна віра»."], "ok": [1, 2, 4], "expl": "УГКЦ підпорядковувалася Папі Римському, підтримувала український рух і, на думку влади, УПА. Ліквідувавши її, влада хотіла відірвати галичан від Ватикану, послабити опір і забрати церковне майно.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z26964", "q": "Укажіть країни, із арміями та збройними формуваннями яких Українська повстанська армія (УПА) вела боротьбу в 1943–1947 рр.", "sec": "s3", "g": "upa_vorohy", "t": "three", "opts": ["Німеччина", "Польща", "Радянський Союз", "Чехословаччина", "Румунія", "Велика Британія", "Югославія"], "ok": [0, 1, 2], "expl": "УПА воювала з німецькими окупантами, з радянськими військами й НКВС-МДБ, а на Закерзонні — з польськими військами й підпіллям.", "src": "НМТ 2023 – 2 сесія (№ 29)"}, {"id": "z19381", "q": "Однією з подій українського визвольного руху 1944–1950-х рр. є", "sec": "s3", "g": "ugvr", "t": "single", "opts": ["виникнення «Поліської Січі».", "утворення Української повстанської армії (УПА).", "утворення Української головної визвольної ради (УГВР).", "проголошення Акта відновлення Української Держави."], "ok": [2], "expl": "Українську головну визвольну раду (УГВР) повстанці створили в липні 1944 р. як підпільний верховний орган визвольного руху. «Поліську Січ» і УПА утворили раніше, у роки війни, а Акт відновлення Української Держави проголосили 30 червня 1941 р.", "src": "ЗНО 2020 – пробний тест (№ 15)"}, {"id": "ct_K6.36", "q": "Під якою назвою відома політика керівництва СРСР щодо Західної України в повоєнні роки, спрямована на утвердження «соціалістичних принципів» в економічному, політичному й духовному житті?", "sec": "s1", "g": "radyan_term", "t": "single", "opts": ["асиміляція", "демократизація", "лібералізація", "радянізація"], "ok": [3], "expl": "Запровадження в західних областях колгоспів, державної власності, партійного контролю й радянської ідеології називають радянізацією.", "src": "Коніщева/Тест 6 № 36"}, {"id": "ct_K3.35", "q": "Якому діячеві належить наведена характеристика?", "sec": "s3", "g": "shukhevych", "t": "single", "opts": ["С. Бандера", "Є. Коновалець", "А. Мельник", "Р. Шухевич"], "ok": [3], "expl": "Роман Шухевич був членом ОУН, одним з організаторів Карпатської Січі, а згодом — головнокомандувачем УПА. Загинув 1950 р. біля Львова.", "src": "Коніщева/Тест 3 № 35"}, {"id": "ct_K1.36", "q": "З якою метою сталінське керівництво проводило політику, що отримала назву «ждановщина»,  наприкінці 1940-х — на початку 1950-х рр.?", "sec": "s4", "g": "zhdan_meta", "t": "single", "opts": ["зміцнення тотального контролю держави над суспільством", "розширення прав союзних республік у культурному житті", "заохочення митців до пошуку нових стилів і напрямів", "залучення радянських митців до розвитку світової культури"], "ok": [0], "expl": "Ждановщина мала відновити повний контроль держави над наукою, літературою й мистецтвом, який під час війни трохи послабили.", "src": "Коніщева/Тест 1 № 36"}, {"id": "ct_V4.35", "q": "Які поняття стосуються особливостей розвитку культури та науки УРСР у післявоєнні роки?", "sec": "s4", "g": "kamp_poniattia", "t": "single", "opts": ["1, 2, 4", "2, 4, 5", "3, 5, 6", "1, 3, 6"], "ok": [0], "expl": "Ждановщина, боротьба з космополітизмом і лисенківщина — кампанії 1946 – 1953 рр. «Розстріляне відродження» й українізація — 1920 – 1930-ті рр., лібералізація — відлига.", "src": "Власов/Варіант 4 № 35"}, {"id": "n201", "q": "З якою метою влада будувала в західних областях нафтопереробні заводи, деревообробні комбінати, газопровід Дашава — Київ?", "sec": "s1", "g": "industr_zah", "t": "single", "opts": ["щоб підготувати край до вступу в Раду економічної взаємодопомоги", "щоб передати ці підприємства в оренду місцевим кооперативам", "щоб забезпечити товарами переселенців з Польщі за планом Маршалла", "щоб використати природні багатства краю для господарства СРСР"], "ok": [3], "expl": "Влада хотіла вписати західні області в загальносоюзне господарство й скористатися їхньою нафтою, газом, вугіллям і лісом. Нові заводи мали також перетворити селян на робітників.", "src": "нове (за зразком ЗНО)"}, {"id": "n202", "q": "Звідки влада переважно присилала вчителів до сільських шкіл західних областей у 1944 – 1950 рр.?", "sec": "s1", "g": "vchyteli", "t": "single", "opts": ["зі східних і центральних областей УРСР", "з Польщі, за угодою про обмін населенням", "з випускників духовних семінарій УГКЦ", "з-за кордону, з української діаспори"], "ok": [0], "expl": "Місцевих учителів, лояльних до влади, бракувало, тож до сільських шкіл західних областей прислали майже 44 тис. учителів зі сходу й центру України.", "src": "нове (за зразком ЗНО)"}, {"id": "n211", "q": "Де радянська влада ліквідувала греко-католицьку церкву в 1949 р.?", "sec": "s2", "g": "ugkc_zakarp", "t": "single", "opts": ["на Буковині", "на Закарпатті", "у Галичині", "на Волині"], "ok": [1], "expl": "У Галичині УГКЦ ліквідували Львівським «собором» у березні 1946 р., а на Закарпатті — пізніше, у 1949 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n212", "q": "Як діяла УГКЦ після її ліквідації радянською владою і до 1989 р.?", "sec": "s2", "g": "ugkc_pidpillia", "t": "single", "opts": ["відкрито, бо після смерті Сталіна її знову дозволили", "легально, як окрема єпархія Російської православної церкви", "у підпіллі: священники таємно правили службу для вірних", "лише в еміграції, бо в УРСР не лишилося жодного вірного"], "ok": [2], "expl": "Частина священників і вірних не підкорилася, тож УГКЦ до 1989 р. існувала в підпіллі.", "src": "нове (за зразком ЗНО)"}, {"id": "n213", "q": "Що чекало священників УГКЦ, які відмовлялися переходити до православ’я?", "sec": "s2", "g": "ugkc_represii", "t": "single", "opts": ["призначення на парафії в східних областях УРСР", "переведення на службу до Ватикану за згодою влади", "дозвіл служити, але без права на проповіді", "арешти органами держбезпеки, ув’язнення й заслання"], "ok": [3], "expl": "Священників, які не хотіли переходити до Російської православної церкви, арештовували органи держбезпеки, засуджували до таборів і заслання.", "src": "нове (за зразком ЗНО)"}, {"id": "n221", "q": "Навіщо МДБ створювало спецгрупи, переодягнені у форму УПА?", "sec": "s3", "g": "spetsgrupy", "t": "single", "opts": ["щоб грабунками й убивствами підірвати довіру до УПА", "щоб допомагати переселенцям з Польщі облаштуватися", "щоб вести переговори з керівництвом ОУН про амністію", "щоб охороняти колгоспи від нападів кримінальних банд"], "ok": [0], "expl": "Переодягнені у форму УПА спецгрупи МДБ грабували й убивали селян, щоб люди вважали це злочинами повстанців і перестали їм допомагати.", "src": "нове (за зразком ЗНО)"}, {"id": "n222", "q": "Чому наприкінці 1940-х рр. УПА перейшла від великих загонів до дій невеликими групами й підпілля?", "sec": "s3", "g": "upa_1949", "t": "single", "opts": ["більшість повстанців скористалася амністією й склала зброю ще 1945 р.", "колективізація, депортації й операція «Вісла» позбавили її підтримки й баз", "керівництво ОУН уклало з радянською владою угоду про перемир’я", "СРСР і Польща дозволили повстанцям виїхати на Захід"], "ok": [1], "expl": "«Вісла» позбавила УПА баз у Польщі, а колективізація й депортації — підтримки в селах. Повстанцям бракувало харчів і поповнення, тож 1949 р. Шухевич наказав розформувати загони й перейти до підпілля.", "src": "нове (за зразком ЗНО)"}, {"id": "n231", "q": "Яка освіта стала обов’язковою в СРСР з 1949 р.?", "sec": "s5", "g": "semyrichka", "t": "single", "opts": ["середня спеціальна", "початкова", "семирічна", "десятирічна"], "ok": [2], "expl": "З 1949 р. в СРСР обов’язковою стала семирічна освіта.", "src": "нове (за зразком ЗНО)"}, {"id": "n232", "q": "Що було характерним для шкіл УРСР у перші повоєнні роки?", "sec": "s5", "g": "shkoly", "t": "single", "opts": ["обов’язкова десятирічна освіта для всіх дітей республіки", "безплатні підручники й гарячі обіди для кожного учня", "навчання лише російською мовою в усіх школах міст і сіл", "навчання у дві-три зміни через брак приміщень і вчителів"], "ok": [3], "expl": "Війна зруйнувала тисячі шкіл, тож діти навчалися у випадкових приміщеннях у дві-три зміни, бракувало підручників, зошитів і вчителів.", "src": "нове (за зразком ЗНО)"}, {"id": "n233", "q": "Як змінювалася мова навчання в міських школах УРСР у повоєнні роки?", "sec": "s5", "g": "mova", "t": "single", "opts": ["шкіл з українською мовою навчання поступово меншало", "у школах запровадили обов’язкове вивчення польської мови", "усі міські школи перевели на українську мову навчання", "навчання українською дозволили лише в західних областях"], "ok": [0], "expl": "Ідеологічний контроль посилювався, а шкіл з українською мовою навчання в містах ставало дедалі менше.", "src": "нове (за зразком ЗНО)"}, {"id": "n234", "q": "Що найбільше заважало роботі вчених УРСР наприкінці 1940-х – на початку 1950-х рр.?", "sec": "s5", "g": "nauka_tysk", "t": "single", "opts": ["масовий виїзд учених за кордон за планом Маршалла", "ідеологічний тиск: звинувачення в «ідейних помилках» і чистки", "заборона друкувати наукові праці російською мовою", "брак коштів, бо гроші йшли переважно на легку промисловість"], "ok": [1], "expl": "Учені працювали під ідеологічним тиском: за «помилки» звільняли й цькували. Від лисенківщини

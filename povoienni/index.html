осмополітизм** — світогляд людини, яка вважає себе громадянином світу й ставить загальнолюдські цінності вище національних. Радянська пропаганда тлумачила його як «низькопоклонство перед Заходом» і зневагу до Батьківщини. «Космополітів» називали «безрідними» й «безпаспортними бродягами».", "**Кого й як переслідували.** Кампанія розгорнулася на початку **1949 р.** зі статей у газеті «Правда» про «антипатріотичну групу театральних критиків». Під приводом боротьби з космополітизмом влада переслідувала насамперед **євреїв**: їх звільняли з роботи, закривали єврейські театри, газети, видавництва.", "У 1952 р. за вироком суду розстріляли діячів Єврейського антифашистського комітету, серед них — київського поета **Давида Гофштейна**. У **січні 1953 р.** групу кремлівських лікарів, переважно євреїв, звинуватили у вбивстві радянських керівників («**справа лікарів**»). Справу закрили лише після смерті Сталіна."], "imgs": [{"key": "cosmo_brodiaha", "cap": "К. Єлісеєв. «Безпаспортний бродяга», журнал «Крокодил», 1949 р.: «космополіт» з валізою в наліпках з іменами західних письменників"}, {"key": "cosmo_chaika", "cap": "Борис Єфимов. «Космополіти-пігмеї намагалися підстрелити мхатівську чайку», 1949 р.: карикатура на театральних критиків"}]}, {"type": "text", "kicker": "Лисенківщина", "title": "Лисенківщина: агроном проти генетиків", "badges": ["НМТ: поняття"], "paras": ["**Лисенківщина** — ідеологічна кампанія в біології, яка призвела до заборони **генетики** в СРСР і репресій проти вчених-генетиків. Назва походить від прізвища агронома **Трохима Лисенка**, уродженця Полтавщини.", "У 1930-ті рр. Лисенко працював в **Одесі**, у Селекційно-генетичному інституті. Він обіцяв за два-три роки вивести нові сорти й різко підвищити врожайність, тоді як генетики казали, що на це потрібно років десять. Після голоду й колективізації влада хотіла швидких результатів, і Сталін підтримав Лисенка.", "Головного опонента Лисенка, генетика **Миколу Вавилова**, заарештували 1940 р.; він помер у в’язниці 1943 р. На сесії **Всесоюзної академії сільськогосподарських наук (ВАСГНІЛ)** у **серпні 1948 р.** Лисенко оголосив, що його доповідь схвалив ЦК партії. Після цього влада заборонила генетику як «буржуазну» науку."], "imgs": [{"key": "s052_image52", "cap": "Трохим Лисенко (1898 – 1976)"}, {"key": "lysenko_stalin", "cap": "Лисенко виступає в Кремлі в присутності Сталіна, 1935 р. (газетне фото)"}]}, {"type": "table", "title": "Генетика і «мічурінська біологія» Лисенка", "rows": [["Питання", "Класична генетика", "Лисенко"], ["Що передає ознаки нащадкам", "**гени**, розташовані в хромосомах (хромосомна теорія Томаса Моргана)", "генів немає; спадковість — властивість «усього живого тіла», кожної його частинки"], ["Чи успадковуються ознаки, набуті за життя", "**ні**: зміни тіла не змінюють генів у статевих клітинах (Август Вейсман)", "**так**: умови життя «розхитують» спадковість, і рослину можна «перевиховати»"], ["Як ознаки розподіляються в потомстві", "за **законами Менделя**, у числових співвідношеннях (3 : 1 тощо)", "закони Менделя — «горохові закони», статистика в біології зайва"], ["Звідки беруться нові види й сорти", "мутації, схрещування й **добір** упродовж багатьох поколінь", "один вид «породжує» інший стрибком: з пшениці виростає жито, з вівса — вівсюг"], ["Як перевіряють висновки", "досліди з контрольними групами й підрахунками, які можна повторити", "анкети з колгоспів і окремі вдалі приклади; невдачі пояснював «шкідництвом»"]]}, {"type": "text", "kicker": "Лисенківщина", "title": "Що обіцяв Лисенко і що вийшло", "badges": [], "paras": ["**Яровизація.** Лисенко пропонував витримувати намочене насіння озимої пшениці на холоді, а навесні сіяти. Саме явище існує: багатьом рослинам потрібен холод, щоб зацвісти. Але обіцяного приросту врожаю яровизація не дала, а набутих так властивостей нащадки не успадковували.", "**Гніздові посадки.** Лисенко заперечував конкуренцію всередині виду й радив садити дуби «гніздами», щоб слабші деревця «жертвували собою» заради сильніших. Більшість лісосмуг, посаджених «гніздами», загинула.", "**Чому генетиків висміювали.** Вони досліджували спадковість на мушках-дрозофілах, які швидко розмножуються. Пропаганда називала генетиків «мухолюбами» й «вейсманістами-менделістами-морганістами» — за прізвищами Вейсмана, Менделя й Моргана.", "Поки в СРСР генетику забороняли, у **1953 р.** Вотсон і Крік описали будову ДНК. Радянська генетика почала відновлюватися лише після 1964 р."], "imgs": [{"key": "s054_image58", "cap": "«Мушина метушня»: карикатура на генетиків із радянського журналу, 1948 – 1949 рр."}]}, {"type": "cols", "title": "Лисенківщина в Україні", "badges": ["поза програмою"], "intro": null, "blocks": [{"h": "Після серпневої сесії 1948 р.", "paras": ["В університетах та інститутах УРСР влада закрила кафедри й лабораторії генетики. Викладачів, які не визнали «мічурінської біології», звільняли. Зі шкільних і вишівських програм вилучили закони Менделя й хромосомну теорію.", "Учені мусили публічно каятися. Хто відмовлявся, втрачав роботу й можливість друкуватися."]}, {"h": "Хто постраждав", "paras": ["**Сергій Гершензон**, київський генетик, ще 1939 р. показав, що ДНК може спричиняти мутації. Після 1948 р. його відділ генетики закрили, і він багато років не міг продовжувати ці досліди.", "**Іван Шмальгаузен**, зоолог родом з Києва, один з авторів сучасної теорії еволюції, на сесії 1948 р. став головною мішенню критики й утратив усі посади.", "Ботаніка й генетика **Миколу Гришка** усунули від керівництва Інститутом ботаніки."]}]}, {"type": "cols", "title": "Наслідки ідеологічних кампаній", "badges": [], "intro": null, "blocks": [{"h": "Для науки й культури", "paras": ["Розвиток науки й мистецтва загальмувався: цілі галузі, як-от генетику, оголосили «буржуазними».", "Радянська культура опинилася в ізоляції від світової.", "Митці писали «на замовлення», вільної творчої критики не лишилося.", "Учені мусили публічно «визнавати помилки» й хвалити Лисенка, щоб зберегти роботу."]}, {"h": "Для людей", "paras": ["Частину інтелігенції заарештували, багатьох звільнили з роботи, а їхні твори заборонили друкувати.", "Посилилися русифікація й російський шовінізм: українську історію й культуру дозволяли показувати лише як частину «спільної» з Росією.", "Страх перед звинуваченням у «націоналізмі» змушував митців і вчених уникати тем з української історії."]}]}]}, {"id": "s5", "num": "V", "title": "Освіта і наука", "sub": "Відбудова шкіл і вишів, Академія наук; Олександр Богомолець, Володимир Філатов, Сергій Лебедєв", "cover": {"key": "s050_image50", "cap": ""}, "cards": [{"type": "text", "kicker": "Освіта", "title": "Школи й виші після війни", "badges": [], "paras": ["Війна зруйнувала тисячі шкіл. Діти навчалися у випадкових приміщеннях **у дві-три зміни**, бракувало підручників, зошитів, учителів. Багато підлітків не повернулися до школи, бо мусили працювати.", "З **1949 р.** в СРСР обов’язковою стала **семирічна освіта**. З евакуації повернулися університети й інститути, відкривали нові виші.", "Водночас посилювався ідеологічний контроль, а кількість шкіл з українською мовою навчання в містах поступово зменшувалася."], "imgs": [{"key": "s049_image49", "cap": "Медаль «За відмінні успіхи в навчанні» й посібник «На допомогу вихователю» (рос.), 1940-ві рр."}]}, {"type": "text", "kicker": "Наука", "title": "Академія наук УРСР після війни", "badges": [], "paras": ["Коли Київ звільнили, з евакуації (з Уфи) повернулися **Академія наук УРСР** і науково-дослідні інститути. Почали відновлювати зруйновані лабораторії й бібліотеки.", "Президентом Академії до **1946 р.** був **Олександр Богомолець**, після його смерті — біохімік **Олександр Палладін** (1946 – 1962).", "Учені працювали під ідеологічним тиском: від лисенківщини постраждали біологи, від ждановщини — історики й філологи. Проте саме в ці роки група Сергія Лебедєва створила в Києві першу в континентальній Європі електронно-обчислювальну машину, а одеські офтальмологи на чолі з **Володимиром Філатовим** стали відомими у світі."], "imgs": [{"key": "s069_image86", "cap": "Олександр Богомолець (1881 – 1946)"}]}, {"type": "text", "kicker": "Персоналія", "title": "Олександр Богомолець (1881 – 1946)", "badges": ["НМТ: персоналія"], "paras": ["Олександр Богомолець — **патофізіолог**, засновник української наукової школи патологічної фізіології, автор одного з перших підручників з цієї науки. Займався також ендокринологією й **геронтологією** — наукою про старіння.", "У **1930 – 1946 рр.** він був **президентом Академії наук УРСР**, організував низку науково-дослідних інститутів.", "Богомолець створив **антиретикулярну цитотоксичну сироватку (АЦС)**, яка прискорювала загоєння ран і переломів. Під час Другої світової війни її широко застосовували у військових госпіталях."], "imgs": [{"key": "bogomolets_old", "cap": "Олександр Богомолець — президент Академії наук УРСР (1930 – 1946). Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Персоналія", "title": "Володимир Філатов (1875 – 1956)", "badges": ["НМТ: персоналія"], "paras": ["Володимир Філатов — **офтальмолог** (лікар, який лікує хвороби очей), хірург і винахідник, академік. Майже все життя працював в **Одесі**.", "Він навчився пересаджувати **рогівку ока** від померлих людей і так повертав зір сліпим. Запропонував новий спосіб вимірювати тиск усередині ока, метод **тканинної терапії** й так званий «філатовський стебель» для пластичних операцій.", "У **1936 р.** Філатов заснував в Одесі **Інститут очних хвороб і тканинної терапії**, який тепер названо його ім’ям. За життя він і його учні провели десятки тисяч операцій."], "imgs": [{"key": "filatov", "cap": "Володимир Філатов. Фото: невідомий автор / Wikimedia Commons, Public domain"}, {"key": "s071_image88", "cap": "Філатов оглядає пацієнта, 1940-ві рр."}]}, {"type": "text", "kicker": "Персоналія", "title": "Сергій Лебедєв (1902 – 1974)", "badges": ["НМТ: персоналія"], "paras": ["Сергій Лебедєв — учений у галузі електротехніки й обчислювальної техніки. З 1946 р. працював в Інституті електротехніки Академії наук УРСР у Києві.", "У лабораторії в **Феофанії** під Києвом група Лебедєва створила **МЕОМ — Малу електронну лічильну машину**. Вона запрацювала в **1950 р.** і стала **першою електронно-обчислювальною машиною в континентальній Європі**. Машина займала цілу кімнату й мала тисячі електронних ламп.", "Згодом Лебедєв переїхав до Москви, де його група створила швидкодійні ЕОМ серії БЕСМ."], "imgs": [{"key": "s070_image87", "cap": "Сергій Лебедєв і його співробітники біля МЕОМ, Київ, початок 1950-х рр."}]}]}, {"id": "s6", "num": "VI", "title": "Література і мистецтво", "sub": "Соціалістичний реалізм; Рильський, Сосюра, Тичина, Малишко; Тетяна Яблонська «Хліб»; Катерина Білокур; Ніл Хасевич", "cover": {"key": "s058_image70", "cap": ""}, "cards": [{"type": "cols", "title": "Література в повоєнні роки", "badges": [], "intro": null, "blocks": [{"h": "Правила для письменників", "paras": ["Письменники мали писати за правилами **соціалістичного реалізму**: показувати героїчну працю, мудрість партії й «дружбу з великим російським народом».", "За «правильні» твори давали Сталінські премії, за «помилки» критикували на зборах, звільняли з роботи, а декого арештовували."]}, {"h": "Два покоління поетів", "paras": ["Поети, які починали в 1920-ті рр., зокрема **Павло Тичина, Максим Рильський, Володимир Сосюра**, після репресій 1930-х рр. писали обережно, а в повоєнні роки їх знову критикували. Найвідомішою стала кампанія проти вірша Сосюри **«Любіть Україну»** (1951).", "Молодше покоління, зокрема **Андрій Малишко**, писало переважно про війну, відбудову й «щасливе радянське життя»."]}]}, {"type": "text", "kicker": "Персоналія", "title": "Максим Рильський (1895 – 1964)", "badges": ["НМТ: персоналія"], "paras": ["Максим Рильський — поет, перекладач, літературознавець. У **1920-ті рр.** належав до групи **неокласиків**, які орієнтувалися на античну й європейську класику.", "У **1931 р.** його заарештували, а після звільнення він почав писати в дусі соціалістичного реалізму. Під час війни написав поему «Мандрівка в молодість» і відомий вірш «Слово про рідну матір».", "У **1947 р.** Рильського звинуватили в «українському буржуазному націоналізмі» і змусили публічно каятися. Попри це, він лишався одним з найавторитетніших поетів; перекладав українською Пушкіна й Міцкевича, зокрема поему «Пан Тадеуш»."], "imgs": [{"key": "s073_image90", "cap": "Максим Рильський"}]}, {"type": "text", "kicker": "Персоналія", "title": "Володимир Сосюра (1898 – 1965)", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Володимир Сосюра народився на Донеччині. У **1918 – 1919 рр.** воював в армії УНР, потім перейшов до Червоної армії. У 1920-ті рр. був членом літературних об’єднань «Плуг», «Гарт», ВАПЛІТЕ.", "У **1944 р.** написав вірш **«Любіть Україну»** — заклик любити рідну землю, мову, народ. Спочатку вірш хвалили й перекладали.", "Але **2 липня 1951 р.** газета «Правда» звинуватила поета в «буржуазному націоналізмі», бо у вірші, на думку газети, немає ні радянської України, ні «дружби народів». Сосюру змусили каятися, вірш вилучили з видань. Друкувати вірш знову дозволили лише після смерті Сталіна."], "imgs": [{"key": "s055_image61", "cap": "Володимир Сосюра"}]}, {"type": "doc", "title": "Малишко про «Любіть Україну» (1951 р.)", "quote": ["Коли партія розгорнула соціалістичний наступ проти куркулів, буржуазних націоналістів, В. Сосюра знову виявив ідеологічні хитання… не зрозумів ролі ленінсько-сталінської дружби народів і виступив з рядом **занепадницьких безідейних віршів, а то і прямо ворожих, як-от вірш «Любіть Україну»**.", "**Хто забуває про дружбу народів чи обходить її мовчанкою у своїй творчості, той робить величезний злочин проти справи будівництва комунізму.**"], "source": "А. Малишко про «Любіть Україну» В. Сосюри (1951 р.)", "comment": ["Сосюру засуджували не лише партійні чиновники, а й колеги-поети. Після статті «Правди» письменники мусили публічно висловитися проти вірша; хто мовчав, сам ризикував потрапити під звинувачення.", "Малишко дорікає Сосюрі не за те, що у вірші є, а за те, чого в ньому немає, — за мовчання про «дружбу народів».", "__Слова з документа:__ **занепадницький** — сповнений смутку й зневіри, не «оптимістичний»; **безідейний** — без комуністичних ідей."], "img": {"key": "s055_image59", "cap": "Андрій Малишко"}}, {"type": "text", "kicker": "Персоналія", "title": "Павло Тичина (1891 – 1967)", "badges": ["НМТ: персоналія"], "paras": ["Павло Тичина — поет, перекладач, публіцист. Славу йому принесла рання збірка **«Сонячні кларнети»** (1918); стиль цих віршів критики назвали **«кларнетизмом»**.", "У 1920-ті рр. він був членом «Гарту» й ВАПЛІТЕ, поділяв погляди Миколи Хвильового. Коли почалися репресії проти письменників, Тичина вирішив беззастережно служити владі.", "У листопаді **1933 р.**, у розпал Голодомору, газета «Правда» надрукувала його вірш **«Партія веде»**. Відтоді Тичина писав переважно на славу партії й Сталіна. За збірку «Чуття єдиної родини» він отримав Сталінську премію (1941)."], "imgs": [{"key": "s075_image92", "cap": "Павло Тичина"}]}, {"type": "text", "kicker": "Персоналія", "title": "Тичина і радянська влада", "badges": ["НМТ: персоналія"], "paras": ["Тичина не лише писав «потрібні» вірші, а й обіймав високі посади. Він був академіком, директором Інституту літератури, у **1943 – 1948 рр.** — **міністром освіти УРСР**, у 1953 – 1959 рр. — головою Верховної Ради УРСР. У **1944 р.** вступив до комуністичної партії.", "Разом з Миколою Бажаном він написав слова **Державного гімну УРСР** (1949): «Живи, Україно, радянська державо…». У тексті гімну — подяка російському народові й Сталіну.", "Сучасники й дослідники оцінювали цей вибір по-різному. Василь Стус у праці «Феномен доби» писав, що геніальний поет заплатив за безпеку власним талантом. Інші наголошували, що Тичина служив владі свідомо й до кінця життя; у 1967 р. він отримав звання Героя Соціалістичної Праці.", "Водночас він знав близько двадцяти мов і багато перекладав, а як міністр опікувався відбудовою шкіл."], "imgs": [{"key": "tychyna", "cap": "Павло Тичина, 1920-ті рр. Фото: журнал «Красная летопись» / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Персоналія", "title": "Андрій Малишко (1912 – 1970)", "badges": ["НМТ: персоналія"], "paras": ["Андрій Малишко — поет, перекладач, літературний критик. Народився на Київщині, під час війни був фронтовим кореспондентом.", "У повоєнні роки писав про війну, відбудову й мир і отримав дві **Сталінські премії**. На відміну від старших поетів, гучних конфліктів з владою не мав і брав участь в офіційних кампаніях: у 1951 р. публічно засудив вірш Сосюри «Любіть Україну».", "Найвідоміші його пізніші твори — тексти пісень «**Пісня про рушник**» (музика П. Майбороди) і «Ми підем, де трави похилі», які співають досі."], "imgs": [{"key": "s072_image89", "cap": "Андрій Малишко"}]}, {"type": "monument", "title": "Тетяна Яблонська «Хліб» (1949)", "badges": [], "img": {"key": "s057_image65", "cap": "Тетяна Яблонська. «Хліб», 1949 р. Державна Третьяковська галерея, Москва"}, "paras": ["На картині — жінки на колгоспному току після жнив: вони насипають зерно в мішки, віють, відпочивають. Яскраве сонце, жовте зерно й усмішки жінок роблять картину святковою.", "**Тетяна Яблонська** (1917 – 2005) написала «Хліб» у **1949 р.** у колгоспі села Летава на Хмельниччині. Картина відповідає вимогам **соціалістичного реалізму**: героїчна праця, щасливе колгоспне життя. У **1950 р.** художниця отримала за неї Сталінську премію.", "Картина не показує повоєнних злиднів і голоду 1946 – 1947 рр., але залишається однією з найвідоміших українських картин повоєнних років."]}, {"type": "text", "kicker": "Мистецтво", "title": "Катерина Білокур (1900 – 1961)", "badges": ["поза програмою"], "paras": ["Катерина Білокур — майстриня **народного декоративного живопису**, самоучка з села Богданівка на Полтавщині. Батьки не дозволяли їй учитися малювати, і вона все життя навчалася сама.", "Вона малювала квіти, колоски, сільські краєвиди й ретельно виписувала кожну пелюстку. У повоєнні роки її роботи показували на виставках у Києві й Москві, а в **1956 р.** вона отримала звання народної художниці УРСР.", "Білокур — **персоналія програми НМТ** з наступної теми (доба «відлиги»), де треба знати її картину «Хата в Богданівці» (1955)."], "imgs": [{"key": "bilokur", "cap": "Катерина Білокур за мольбертом, 1954 р. Фото: Я. Паволоцький / Wikimedia Commons, CC BY 4.0"}, {"key": "s058_image71", "cap": "Натюрморт (півонії й кавун)"}, {"key": "s058_image69", "cap": "Квіти біля тину"}]}, {"type": "text", "kicker": "Мистецтво", "title": "Ніл Хасевич (1905 – 1952) — художник УПА", "badges": ["поза програмою"], "paras": ["Ніл Хасевич — графік з Волині, випускник Варшавської академії мистецтв. Ще в дитинстві він утратив ногу, але став відомим майстром **дереворитів** і екслібрисів.", "У 1940-ві рр. Хасевич працював у підпіллі ОУН: оформлював листівки, видання, відзнаки УПА, створював гравюри про боротьбу повстанців. Його дереворити переправляли за кордон, і там вийшли альбоми «Волинь у боротьбі» та «Графіка в бункерах УПА».", "**4 березня 1952 р.** у селі Сухівці на Рівненщині Хасевич загинув під час облави МДБ на криївку."], "imgs": [{"key": "s059_image73", "cap": "Ніл Хасевич. «Громадою обух сталіть та добре вигостріть сокиру» (дереворит, 1940-ві рр.)"}, {"key": "s059_image74", "cap": "Дереворит до річниці державності"}, {"key": "s059_image72", "cap": "Дереворит про повстанців"}]}]}, {"id": "s7", "num": "VII", "title": "Узагальнення", "sub": "Персоналії й поняття теми, що часто плутають на НМТ, стрічка часу всієї теми", "cover": null, "cards": [{"type": "table", "title": "Персоналії теми", "rows": [["Хто", "Чим відомий"], ["Йосип Сліпий", "глава УГКЦ з 1944 р.; 18 років у радянських таборах; з 1963 р. у Римі, кардинал"], ["Василь Кук", "останній головний командир УПА (1950 – 1954); заарештований 1954 р."], ["Олександр Богомолець", "патофізіолог, президент АН УРСР (1930 – 1946); сироватка АЦС"], ["Володимир Філатов", "офтальмолог; пересадка рогівки, тканинна терапія; інститут в Одесі"], ["Сергій Лебедєв", "творець МЕОМ — першої ЕОМ у континентальній Європі (1950)"], ["Максим Рильський", "поет-неокласик, перекладач; критика 1947 р. за «націоналізм»"], ["Володимир Сосюра", "вірш «Любіть Україну»; цькування 1951 р."], ["Павло Тичина", "«Сонячні кларнети», «Партія веде»; міністр освіти УРСР (1943 – 1948)"], ["Андрій Малишко", "поет, лауреат Сталінських премій; «Пісня про рушник»"]]}, {"type": "table", "title": "Поняття теми", "rows": [["Поняття", "Значення"], ["Відбудова", "відновлення господарства, зруйнованого війною; в УРСР — четверта п’ятирічка (1946 – 1950)"], ["Холодна війна", "протистояння СРСР і його союзників із США та їхніми союзниками (з середини 1940-х до 1991 р.)"], ["Операція «Вісла»", "виселення польською владою українців з Лемківщини, Надсяння, Холмщини й Підляшшя на захід і північ Польщі (квітень – липень 1947 р.)"], ["Операція «Захід»", "депортація радянською владою родин учасників ОУН і УПА із західних областей УРСР до Сибіру й Казахстану (жовтень 1947 р.)"], ["Ждановщина", "кампанія 1946 – початку 1950-х рр. за повний ідеологічний контроль над наукою й культурою"], ["Лисенківщина", "кампанія в біології, заборона генетики після сесії ВАСГНІЛ 1948 р."], ["Космополітизм", "у радянському тлумаченні — «низькопоклонство перед Заходом»; кампанія 1949 – 1953 рр., спрямована насамперед проти євреїв"]]}, {"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Подія", "Що треба пам’ятати", "З чим плутають"], ["Ліквідація УГКЦ (березень 1946)", "Львівський «собор» скасував Берестейську унію 1596 р.", "на Закарпатті греко-католицьку церкву ліквідували пізніше — 1949 р."], ["Операція «Захід» (жовтень 1947)", "радянська депортація із західних областей УРСР", "операція «Вісла» (квітень – липень 1947) — польська, в межах Польщі"], ["«Любіть Україну»", "вірш Володимира Сосюри; цькування 1951 р.", "«Слово про рідну матір» — вірш Макси   },
  map(c, id) {
    const st = c.steps;
    const btns = st.length > 1 ? `<div class="steps" id="st${id}" style="grid-template-columns:repeat(${st.length},1fr)">${st.map((x, i) =>
      `<button class="${i === 0 ? 'on' : ''}" data-i="${i}">${esc(x.label)}</button>`).join('')}</div>` : '';
    return `<div class="chips"><span class="chip">Карта</span></div>${h2(c.title)}${btns}<div id="mp${id}">${fig({ key: st[0].key, cap: c.cap || '' })}</div>
      <div class="rot">Натисніть на карту, щоб збільшити. Зручніше дивитися, повернувши телефон горизонтально.</div>`;
  },
  monument(c) { return `${chips(c.badges)}${h2(c.title)}${fig(c.img)}${paras(c.paras)}`; },
  doc(c) {
    return `<div class="chips"><span class="chip doc">Документ</span></div>${h2(c.title)}
      <div class="quote">${c.quote.map(q => `<p>${md(q)}</p>`).join('')}<div class="src">${esc(c.source)}</div></div>
      ${c.img ? fig(c.img) : ''}<div class="sub">${paras(c.comment)}</div>`;
  },
  cols(c) {
    return `${chips(c.badges)}${h2(c.title)}${c.intro ? `<p>${md(c.intro)}</p>` : ''}${c.blocks.map(b => `<div class="sub"><h3>${md(b.h)}</h3>${paras(b.paras)}</div>`).join('')}`;
  },
  table(c) {
    const head = c.rows[0];
    return `${h2(c.title)}${c.rows.slice(1).map(r => `<div class="trow"><h3>${md(r[0])}</h3>${r.slice(1).map((v, j) =>
      `<div class="kv"><span>${esc(head[j + 1])}</span><div>${md(v)}</div></div>`).join('')}</div>`).join('')}`;
  },
  tl_events(c) {
    return `<div class="chips"><span class="chip">НМТ: дата</span></div>${h2(c.title)}<div class="tlv">${c.items.map(e => `<div class="ev"><i style="background:${e.color}"></i>
      <span class="y${e.prog ? ' yprog' : ''}">${esc(e.year)}</span><b>${md(e.name)}</b><span>${md(e.desc)}</span></div>`).join('')}</div>
      <div class="legend"><span class="sw"></span>дата з програми НМТ</div>${c.note ? `<div class="muted"><p>${md(c.note)}</p></div>` : ''}`;
  },
  tl_periods(c) {
    const X = v => (100 * (v - c.x_from) / (c.x_to - c.x_from));
    const rows = c.rows.map(r => `<div class="row"><div class="nm">${md(r.name)}</div><div class="tr">${r.segs.map(g =>
      `<div class="sg" style="left:${X(g.a)}%;width:${Math.max(1.2, X(g.b) - X(g.a))}%;background:${g.color}"></div>`).join('')}</div>
      ${r.segs.some(g => g.sub) ? `<div class="sb">${r.segs.filter(g => g.sub).map(g => md(g.sub)).join(' · ')}</div>` : ''}</div>`).join('');
    const ev = c.events.map(([v, l]) => `<div class="evl" style="left:${X(v)}%"></div><div class="evt" style="left:${X(v)}%">${esc(String(l).replace(/ ?до н\.е\.| ?р\.$/g, ''))}</div>`).join('');
    const ax = `<div class="ax">${c.prog.map(([a, b]) => `<div class="pr" style="left:${X(a)}%;width:${X(b) - X(a)}%"></div>`).join('')}
      ${c.ticks.map(([v, l], i) => `<div class="tk${i % 2 ? ' lo' : ''}" style="left:${X(v)}%">${esc(l)}</div>`).join('')}</div>`;
    const pr = c.prog.length ? `<div class="legend"><span class="sw"></span>${c.prog.map(p => esc(p[2])).join(' · ')} — дата з програми НМТ</div>` : '';
    return `<div class="chips"><span class="chip">НМТ: дата</span></div>${h2(c.title)}<div class="gp">${ev}${rows}${ax}</div>${pr}
      ${c.note ? `<div class="muted"><p>${md(c.note)}</p></div>` : ''}`;
  },
  chrono() {
    const m = ['2000 р.<br>до н.е.', '1000 р.<br>до н.е.', '1 р. н.е.<br><b class="a2">Різдво Христове</b>', '1000 р.<br>н.е.', '2000 р.<br>н.е.'];
    return `<h2>Шкала часу</h2><div class="ends"><span>← давніше</span><span>ближче до нас →</span></div>
      <div class="scale"><div class="line"></div><div class="marks">${m.map(a => `<div class="m"><i></i><span>${a}</span></div>`).join('')}</div></div>
      <p class="cap">До н.е. рахунок іде назад: 2000 р. до н.е. давніше, ніж 1000 р. до н.е.</p>`;
  },
  periods(c) {
    const rows = c.rows.map((p, i) => `${i === 0 ? '<div class="pgroup">Кам’яний вік</div>' : i === 3 ? '<div class="pgroup">Доба металів</div>' : ''}
      <div class="per"><div class="c" style="background:${p[5]}"></div><div><h3>${p[0]}</h3>${p[1] ? `<div class="s">${p[1]}</div>` : ''}
       <div class="d">${p[2]}</div><div class="r"><span>Знаряддя:</span> ${p[3]}</div><div class="r"><span>Нове:</span> ${p[4]}</div></div></div>`).join('');
    return `${chips(c.badges)}${h2(c.title)}<p>${md(c.intro)}</p>${rows}`;
  },
  generic(c) {
    const groups = [[]];
    c.blocks.forEach(b => { if (b.k === 'sep') groups.push([]); else groups[groups.length - 1].push(b); });
    const g = groups.filter(x => x.length);
    const rb = b => b.k === 'h' ? `<h3 class="${b.light ? 'l' : ''}">${md(b.text)}</h3>` : b.k === 'date' ? `<span class="pill">${md(b.text)}</span>`
      : b.k === 'img' ? fig(b) : b.k === 'muted' ? `<div class="muted">${(b.paras || []).map(p => `<p>${md(p)}</p>`).join('')}</div>` : paras(b.paras);
    const body = g.map(x => {
      const asPanel = g.length > 1 && x.some(b => b.k === 'h' || b.k === 'date');
      return asPanel ? `<div class="sub">${x.map(rb).join('')}</div>` : x.map(rb).join('');
    }).join('');
    return `${chips(c.badges)}${h2(c.title)}${body}`;
  },
};

/* ---------- навігація ---------- */
const P = id => LESSONS.find(l => l.id === id);
function secProgress(L, s) { const seen = store.get(`seen_${L.id}-${s.id}`, []).length; return Math.min(seen, s.cards.length); }
function partProgress(L) { let a = 0, b = 0; L.sections.forEach(s => { a += secProgress(L, s); b += s.cards.length; }); return [a, b]; }

function index() {
  document.title = TITLE;
  const L0 = LESSONS[0];
  /* тема «лише уроки» в спільній оболонці: посилання назад на полицю тем (у повному курсі його додає course.js) */
  const back = typeof SHELL_URL === 'string' && SHELL_URL && typeof LESSONS_ONLY !== 'undefined' && LESSONS_ONLY ? SHELL_URL : '';
  app.innerHTML = `<div class="wrap">${back ? `<a class="lnk tback" href="${back}">← Усі теми</a>` : ''}
    <div class="hero"><img src="${im(L0.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L0.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(TITLE)}</h1>
      <div class="sub">Мобільна версія презентацій: ${PARTS_WORD}, кожна поділена на короткі розділи.</div></div>
    <div class="h2">Частини</div><div class="sec-list">${LESSONS.map(L => {
      const [a, b] = partProgress(L);
      return `<button class="part-btn" data-go="${L.id}"><span class="th"><img src="${im(L.cover.key).src}" alt=""></span>
        <span><h3>${esc(L.part)}</h3><div class="st">${a ? `Переглянуто ${a} з ${b} карток` : `${L.sections.length} розділів`}</div>
        <div class="prog-mini"><i style="width:${Math.round(100 * a / b)}%"></i></div></span></button>`; }).join('')}</div>
    <p class="cap" style="margin-top:18px">Прогрес зберігається лише на цьому пристрої.${back ? ' Бліци й тести з цієї теми з’являться згодом.' : ''}</p>${brandHtml()}</div>`;
  wireGo(); window.scrollTo(0, 0);
}

function partHome(L) {
  document.title = `${L.part} — ${TITLE}`;
  const i = LESSONS.indexOf(L), next = LESSONS[i + 1];
  const secs = L.sections.map(s => {
    const seen = secProgress(L, s), n = s.cards.length, done = seen >= n;
    return `<button class="sec-btn${done ? ' done' : ''}" data-go="${L.id}-${s.id}"><span class="num">${done ? '✓' : s.num}</span>
      <span><h3>${md(s.title)}</h3><div class="st">${seen ? `Переглянуто <b>${seen} з ${n}</b>` : `${n} карток`}</div>
      <div class="prog-mini"><i style="width:${Math.round(100 * seen / n)}%"></i></div></span></button>`;
  }).join('');
  const nextBtn = next ? `<button class="btn" data-go="${next.id}" style="margin-top:20px">Далі: ${esc(next.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:20px" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>
       <p class="cap">Посилання працює, якщо файли лежать в одній папці.</p>` : '');
  app.innerHTML = `${MODE === 'all' ? `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${L.num}</span></div></div>` : ''}
  <div class="wrap">
    <div class="hero"><img src="${im(L.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(L.title)}</h1>
      <div class="part">${esc(L.part)}</div><div class="sub">${esc(L.sub)}</div></div>
    <div class="h2">Розділи</div><div class="sec-list">${secs}</div>
    ${L.program ? `<div class="h2">Що треба знати для НМТ</div><section class="card">${R.generic({ ...L.program, title: '' })}</section>` : ''}
    ${nextBtn}
  </div>`;
  wireGo(); window.scrollTo(0, 0);
}

let obs = null;
function section(L, s) {
  document.title = `${s.num}. ${s.title} — ${TITLE}`;
  const k = L.sections.indexOf(s), next = L.sections[k + 1], nextPart = LESSONS[LESSONS.indexOf(L) + 1];
  const cards = s.cards.map((c, i) => `<section class="card" data-i="${i}">${(R[c.type] || R.generic)(c, i)}</section>`).join('');
  let end = next ? `<button class="btn" data-go="${L.id}-${next.id}">Далі: розділ ${next.num}. ${esc(next.title)} →</button>`
    : nextPart ? `<button class="btn" data-go="${nextPart.id}">Далі: ${esc(nextPart.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>` : '');
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="${L.id}">← Розділи</button><span class="ttl">${s.num}. ${md(s.title)}</span></div><div class="prog"><i id="pr"></i></div></div>
  <div class="wrap">
    ${s.cover && s.cover.key ? `<div class="hero">${fig(s.cover)}</div>` : ''}
    <div class="sec-head"><div class="kick">Частина ${L.num} · розділ ${s.num}</div><h1>${md(s.title)}</h1><div class="sub">${md(s.sub)}</div></div>
    <div class="cards">${cards}</div>
    <div class="end">${end}<button class="btn ghost" data-go="${L.id}">До розділів</button></div>
  </div>`;
  wireGo();
  s.cards.forEach((c, i) => {
    if (c.type === 'carousel' && c.items.length > 1) {
      const car = document.getElementById('car' + i), dots = document.getElementById('dots' + i).children;
      car.addEventListener('scroll', () => {
        const kk = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 12));
        [...dots].forEach((d, j) => d.classList.toggle('on', j === kk));
      }, { passive: true });
    }
    if (c.type === 'map' && c.steps.length > 1) {
      const st = document.getElementById('st' + i), mp = document.getElementById('mp' + i);
      st.querySelectorAll('button').forEach(b => b.onclick = () => {
        st.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
        mp.innerHTML = fig({ key: c.steps[+b.dataset.i].key, cap: c.cap || '' });
      });
    }
  });
  const key = `seen_${L.id}-${s.id}`, seen = new Set(store.get(key, []));
  if (obs) obs.disconnect();
  obs = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { seen.add(+e.target.dataset.i); store.set(key, [...seen]); } });
  }, { threshold: 0.35 }) : null;
  if (obs) app.querySelectorAll('.card').forEach(el => obs.observe(el));
  window.scrollTo(0, 0);
}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;
}, { passive: false });
lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const pr = document.getElementById('pr'); if (!pr) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  pr.style.width = (max > 0 ? Math.min(100, 100 * scrollY / max) : 100) + '%';
}, { passive: true });
route();
</script>
</body>
</html>

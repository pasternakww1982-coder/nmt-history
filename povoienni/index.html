<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Україна в перші повоєнні роки (1945 – 1953)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.lb-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; will-change: transform; }
.pic { touch-action: pan-x pan-y; }   /* щипок на зображенні не збільшує всю сторінку — відкриває перегляд */
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


.brand { margin: 28px 0 6px; text-align: center; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }

/* «← Усі теми» — повернення на полицю тем спільної оболонки */
.tback { display: inline-block; margin: 14px 0 0; font-weight: 700; font-size: 15px; color: var(--acc2); text-decoration: underline; }

/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }
.tlv .ev { position: relative; padding: 0 0 16px; display: grid; gap: 3px; }
.tlv .ev i { position: absolute; left: -25px; top: 4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--bg); }
.tlv .ev .y { color: var(--acc2); font-weight: 800; font-variant-numeric: tabular-nums; }
.tlv .ev .y.yprog { justify-self: start; background: var(--acc2); color: #161616; border-radius: 8px; padding: 1px 8px; }
.tlv .ev b { font-size: 17px; }
.legend { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.legend span.sw { width: 34px; height: 16px; background: var(--acc2); border-radius: 6px; }
/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }
.gp .tr { position: relative; height: 18px; background: #262626; border-radius: 6px; }
.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }
.part-btn .th img { max-width: 100%; max-height: 100%; }
.part-btn h3 { font-size: 18px; }
.part-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<button id="fsb" class="fsb" hidden aria-label="На весь екран">⤢</button>
<div class="lb" id="lb" role="dialog" aria-label="Перегляд зображення">
  <div class="lb-top"><button id="lbOut" aria-label="Зменшити">−</button><button id="lbIn" aria-label="Збільшити">+</button><button id="lbX" aria-label="Закрити">✕</button></div>
  <div class="lb-view" id="lbv"><img id="lbi" alt=""></div>
  <div class="lb-cap" id="lbc"></div>
</div>
<script>
const LESSONS = [{"id": "p1", "num": 1, "title": "Україна в перші повоєнні роки (1945 – 1953)", "part": "Частина 1. Кордони, відбудова, голод", "sub": "Нові кордони УРСР, операція «Вісла», УРСР в ООН, відбудова, голод 1946 – 1947 рр., повсякденне життя", "cover": {"key": "kreshch43", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Україна в перші повоєнні роки»", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **1945 р.** — входження Закарпаття до складу УРСР", "• **квітень 1945 р.** — УРСР стала співзасновницею ООН", "• **березень 1946 р.** — ліквідація УГКЦ (ч. 2)", "• **1946 – 1947 рр.** — масовий голод", "• **квітень – липень 1947 р.** — операція «Вісла»", "• **жовтень 1947 р.** — операція «Захід» (ч. 2)", "• **1951 р.** — встановлення західного кордону УРСР"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії (ч. 2)", "light": false}, {"k": "p", "paras": ["• Олександр Богомолець, Сергій Лебедєв, Володимир Філатов", "• Андрій Малишко, Максим Рильський, Володимир Сосюра, Павло Тичина", "• Василь Кук, **Йосип Сліпий** (портрет)"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **відбудова**, **холодна війна**, **операція «Вісла»** — у ч. 1", "• операція «Захід», ждановщина, лисенківщина, космополітизм — у ч. 2"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Карта й пам’ятка", "light": false}, {"k": "p", "paras": ["• **картосхема:** зміни в адміністративно-територіальному устрої України", "• пам’ятка: картина Тетяни Яблонської «Хліб» (1949) — у ч. 2"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 27. Матеріал поза програмою має сіру позначку «поза програмою»."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Нові кордони УРСР (1944 – 1951)", "sub": "Польща, Чехословаччина, Румунія: договори, обмін населенням, остаточний кордон 1951 р.", "cover": {"key": "yalta", "cap": ""}, "cards": [{"type": "tl_events", "title": "Стрічка часу: Україна в 1944 – 1951 рр.", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "вересень 1944", "name": "Угода з Польщею", "desc": "про обмін населенням", "color": "#e05a47", "prog": false}, {"year": "квітень 1945", "name": "УРСР в ООН", "desc": "співзасновниця", "color": "#5b93bd", "prog": true}, {"year": "червень 1945", "name": "Закарпаття", "desc": "договір з Чехословаччиною", "color": "#6ea8c9", "prog": true}, {"year": "серпень 1945", "name": "Кордон з Польщею", "desc": "договір у Москві", "color": "#6ea8c9", "prog": false}, {"year": "1946 – 1950", "name": "Четверта п’ятирічка", "desc": "«п’ятирічка відбудови»", "color": "#a9dda0", "prog": false}, {"year": "1946 – 1947", "name": "Голод", "desc": "посуха і хлібозаготівлі", "color": "#d9607e", "prog": true}, {"year": "лютий 1947", "name": "Паризькі договори", "desc": "кордон з Румунією", "color": "#6ea8c9", "prog": false}, {"year": "квітень – липень 1947", "name": "Операція «Вісла»", "desc": "виселення українців у межах Польщі", "color": "#e05a47", "prog": true}, {"year": "грудень 1947", "name": "Грошова реформа", "desc": "скасування карток", "color": "#a9dda0", "prog": false}, {"year": "1951", "name": "Обмін ділянками", "desc": "західний кордон УРСР", "color": "#6ea8c9", "prog": true}]}, {"type": "cols", "title": "Хто вирішував, де пройде кордон", "badges": ["НМТ: карта"], "intro": null, "blocks": [{"h": "Домовленості великих держав", "paras": ["У 1939 – 1940 рр. СРСР приєднав Західну Україну, Північну Буковину й Південну Бессарабію. Після війни Москва хотіла, щоб ці кордони визнали інші держави.", "Східний кордон Польщі обговорювали лідери **СРСР, США й Великої Британії** в Тегерані (1943), Ялті й Потсдамі (1945). Вони погодилися, що кордон пройде приблизно по **«лінії Керзона»**, яку ще 1919 р. запропонували країни Антанти.", "Західні союзники не хотіли сваритися зі Сталіним, поки тривала війна з Німеччиною та Японією. Тому вони погодилися, що землі, приєднані до СРСР у 1939 – 1940 рр., лишаються радянськими. Польща натомість отримала частину німецьких земель на заході й півночі."]}, {"h": "Договори СРСР із сусідами", "paras": ["Свої нові кордони Радянський Союз закріпив окремими договорами з **Польщею** (1945, 1951), **Чехословаччиною** (1945) і **Румунією** (1947).", "Уряд УРСР у цих переговорах участі не брав: договори про кордони України підписували від імені всього СРСР.", "Остаточно західний кордон УРСР визначив радянсько-польський договір **1951 р.** Саме ці кордони з невеликими змінами успадкувала незалежна Україна."]}]}, {"type": "text", "kicker": "Кордони", "title": "Кордон з Польщею (1944 – 1945)", "badges": ["НМТ: карта"], "paras": ["У липні 1944 р. СРСР таємно домовився з підконтрольним йому **Польським комітетом національного визволення**, що Холмщина, Підляшшя, Надсяння й Лемківщина відійдуть до Польщі. Українців на цих землях жило кілька сотень тисяч.", "**9 вересня 1944 р.** уряд УРСР і польський комітет підписали угоду про **обмін населенням**: українці з Польщі переїжджали до УРСР, поляки з УРСР — до Польщі.", "**16 серпня 1945 р.** у Москві СРСР і Польща підписали договір про кордон. Кордон проліг переважно по «лінії Керзона», але з відступами на користь Польщі: їй, зокрема, дістався **Перемишль**."], "imgs": [{"key": "s013_image13", "cap": "Виселення жителів українського села, друга половина 1940-х рр. (фото з польських архівів)"}]}, {"type": "text", "kicker": "Кордони", "title": "Обмін населенням між УРСР і Польщею (1944 – 1946)", "badges": [], "paras": ["За угодою переселення мало бути **добровільним**. Насправді більшість українців не хотіла залишати свої села й переїжджати до СРСР, бо вже знала про тамтешні колгоспи й репресії.", "Тоді польська влада почала виселяти людей силою. Солдати оточували села, давали на збори кілька годин, а тих, хто опирався, били й арештовували. Українців з Польщі до УРСР переселили **майже 490 тис.**, поляків з УРСР до Польщі — **майже 790 тис.**", "Переселенців розселяли по всій УРСР: частину — у західних областях, у хатах, звідки виїхали поляки, частину — на півдні й сході, у зруйнованих війною селах. Українська повстанська армія (УПА) захищала українські села від виселення, тому переселення не обходилося без збройних сутичок."], "imgs": [{"key": "s013_image14", "cap": "Польські солдати під час виселення жителів українського села (фото з польських архівів)"}]}, {"type": "map", "title": "Кордони УРСР: договір з Польщею (1945 р.)", "steps": [{"key": "pv_borders1", "label": "Крок 1"}]}, {"type": "text", "kicker": "Кордони", "title": "Закарпаття у складі УРСР (1944 – 1946)", "badges": ["НМТ: дата"], "paras": ["До війни Закарпаття (Підкарпатська Русь) входило до **Чехословаччини**, у 1939 – 1944 рр. його окупувала **Угорщина**. Восени 1944 р. край зайняла Червона армія. Уряд Чехословаччини розраховував повернути Закарпаття собі, але Сталін вирішив приєднати край до УРСР.", "**26 листопада 1944 р.** у Мукачеві зібрався **з’їзд народних комітетів**. Делегатів добирали комуністи й радянські військові. З’їзд ухвалив маніфест про «возз’єднання Закарпатської України з Радянською Україною».", "**29 червня 1945 р.** СРСР і Чехословаччина підписали договір, за яким Закарпаття відходило до УРСР. **22 січня 1946 р.** Президія Верховної Ради СРСР утворила **Закарпатську область** з центром в Ужгороді."], "imgs": [{"key": "uzh1945", "cap": "Вулиця Ужгорода, 1945 р. Фото: Georgy Ugrinovich / Wikimedia Commons, Public domain"}]}, {"type": "doc", "title": "Договір про Закарпаття (1945 р.)", "quote": ["Закарпатська Україна (що носить, згідно з Чехословацькою Конституцією, назву Підкарпатська Русь), яка на підставі Договору від 10-го вересня 1919 року, укладеного в Сен-Жермен ан Ле, увійшла як автономна одиниця в межі Чехословацької Республіки, **возз’єднується, згідно з бажанням, проявленим населенням Закарпатської України**, і на підставі дружньої угоди обох Високих Договірних Сторін, **з своєю споконвічною батьківщиною — Україною** і включається до складу Української Радянської Соціалістичної Республіки."], "source": "Договір СРСР і Чехословаччини про Закарпатську Україну, ст. 1", "comment": ["Договір підписали в Москві міністри закордонних справ СРСР і Чехословаччини. Чехословаччина фактично не мала вибору: у краї вже стояла Червона армія і діяла нова радянська влада.", "Під «бажанням населення» договір має на увазі рішення з’їзду в Мукачеві. Вільного голосування серед жителів Закарпаття не було.", "__Слова з документа:__ **Сен-Жермен ан Ле** — місто під Парижем, де 1919 р. уклали мирний договір з Австрією; **Високі Договірні Сторони** — держави, що підписали договір."], "img": null}, {"type": "map", "title": "Кордони УРСР: приєднання Закарпаття (1945 р.)", "steps": [{"key": "pv_borders1", "label": "1945 р.: Польща"}, {"key": "pv_borders2", "label": "1945 р.: Закарпаття"}]}, {"type": "text", "kicker": "Кордони", "title": "Кордон з Румунією (1940 – 1948)", "badges": ["НМТ: карта"], "paras": ["Північну Буковину, Хотинщину й Південну Бессарабію СРСР забрав у Румунії ще **в червні 1940 р.** Тоді ж ці землі ввійшли до УРСР як Чернівецька й Аккерманська (згодом Ізмаїльська) області. У 1941 – 1944 рр. їх знову захопила Румунія, союзниця Німеччини.", "Після війни Румунія опинилася в радянській сфері впливу й цих земель назад не отримала. **10 лютого 1947 р.** у Парижі держави-переможниці підписали з Румунією **мирний договір**, який закріпив радянсько-румунський кордон 1940 р.", "У **1948 р.** за окремим протоколом Румунія передала СРСР ще й **острів Зміїний** у Чорному морі. Острів увійшов до Ізмаїльської області УРСР."], "imgs": [{"key": "zmiinyi", "cap": "Острів Зміїний, 2022 р. Фото: State Border Guard Service of Ukraine / Wikimedia Commons, CC BY 4.0"}]}, {"type": "map", "title": "Кордони УРСР: договір з Румунією (1947 р.)", "steps": [{"key": "pv_borders2", "label": "1945 р.: Закарпаття"}, {"key": "pv_borders3", "label": "1947 р.: Румунія"}]}, {"type": "map", "title": "Обмін ділянками з Польщею (1951 р.)", "steps": [{"key": "pv_ex1951", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**15 лютого 1951 р.** СРСР і Польща підписали договір про обмін ділянками території — **по 480 км²** кожна. Це була остання зміна західного кордону УРСР.", "До УРСР відійшли землі біля **Белза, Угнева й Кристинополя** (нині Червоноград) з покладами вугілля. Згодом тут збудували шахти Львівсько-Волинського басейну. Польща отримала частину Дрогобицької області з містечком **Устрики Долішні**.", "Влада СРСР і Польщі примусово переселила жителів обох ділянок. З бойківських сіл довкола Устриків радянська влада вивезла понад **32 тис.** українців на південь і схід УРСР."], "imgs": []}, {"type": "map", "title": "Кордони УРСР: обмін ділянками (1951 р.)", "steps": [{"key": "pv_borders3", "label": "1947 р.: Румунія"}, {"key": "pv_borders4", "label": "1951 р.: обмін ділянками"}]}, {"type": "table", "title": "Як змінилися кордони УРСР після війни", "rows": [["Сусід", "Що відійшло до УРСР", "Що лишилося за кордоном", "Документ"], ["Польща", "Західна Україна (Галичина, Волинь); 1951 р. — землі біля Белза", "Холмщина, Підляшшя, Надсяння, Лемківщина; 1951 р. — Устрицький район", "договір 16 серпня 1945 р.; договір про обмін ділянками 15 лютого 1951 р."], ["Чехословаччина", "Закарпаття (Закарпатська область з 22 січня 1946 р.)", "Пряшівщина — землі українців у Словаччині", "договір 29 червня 1945 р."], ["Румунія", "Північна Буковина, Хотинщина, Південна Бессарабія; 1948 р. — о. Зміїний", "Південна Буковина, Мармарощина за Тисою", "Паризький мирний договір 10 лютого 1947 р.; протокол 1948 р."]]}]}, {"id": "s2", "num": "II", "title": "Операція «Вісла» (1947)", "sub": "Виселення українців з Лемківщини, Надсяння, Холмщини й Підляшшя на західні та північні землі Польщі", "cover": {"key": "s013_image16", "cap": ""}, "cards": [{"type": "text", "kicker": "Операція «Вісла»", "title": "Чому польська влада провела операцію", "badges": ["НМТ: поняття"], "paras": ["Попри виселення 1944 – 1946 рр., у Польщі лишалося близько **150 тис. українців**. На південному сході країни діяли загони УПА, які боролися проти виселення й нападали на польські військові частини.", "**28 березня 1947 р.** у сутичці з УПА загинув заступник міністра оборони Польщі генерал **Кароль Сверчевський**. Комуністична влада використала його смерть як привід: уже наступного дня керівництво країни ухвалило рішення виселити всіх українців з південно-східних земель.", "Влада мала кілька цілей: позбавити УПА підтримки місцевого населення, остаточно полонізувати ці землі й зробити Польщу державою однієї нації. Польське керівництво погодило операцію з Москвою."], "imgs": [{"key": "s013_image15", "cap": "Затримані під час операції «Вісла», 1947 р. (фото з польських архівів)"}]}, {"type": "map", "title": "Операція «Вісла» (1947)", "steps": [{"key": "pv_vistula", "label": "Крок 1"}]}, {"type": "text", "kicker": "Операція «Вісла»", "title": "Хід операції (28 квітня – 31 липня 1947 р.)", "badges": ["НМТ: дата", "НМТ: поняття"], "paras": ["Операцію провела спеціальна оперативна група Війська Польського **«Вісла»** — близько 20 тис. військових. Вони оточували село, давали людям кілька годин на збори й під конвоєм везли на станції. Там родини перевіряли й вантажили у товарні вагони.", "Усього виселили **близько 140 тис.** українців. Їх розпорошували по колишніх німецьких землях на заході й півночі Польщі так, щоб в одному селі українців було **не більше 10 %**. Повертатися додому влада їм заборонила.", "Тих, кого підозрювали у зв’язках з УПА, відправляли до концтабору **Явожно**. Там утримували кілька тисяч українців, зокрема жінок і священиків, і багато з них загинуло.", "У **1990 р.** Сенат Польщі засудив операцію «Вісла»."], "imgs": [{"key": "wisla_plaque", "cap": "Табличка на вокзалі в Сяноку: звідси в 1947 р. вивезли 47 562 українців. Фото: Lowdown / Wikimedia Commons, CC BY-SA 3.0"}, {"key": "jaworzno", "cap": "Пам’ятник жертвам табору в Явожні (Польща). Фото: Beemwej / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "doc", "title": "Спогади виселеної: Гонятин на Холмщині", "quote": ["17-го червня злощасного 1947 до нас приїхало польське військо. І наказали, щоб у кілька годин усі були спаковані й покинули село… Ніхто не знав куди і на зустріч якій долі. Батько усе робив мовчки…", "Наш збірний пункт був у гміні Довгобичів. Звідти нас забрали возами та військовими автами до залізничної станції Вербковичі. Біля цієї станції було десь півморга загородженого дротом поля. І туди нас скидали. **Плач стояв над полем під небеса**…", "Після кількох важких та довгих днів побуту під голим небом нас почали вантажити до товарних брудних вагонів. **Наше невеличке село поділено на два воєводства — Ольштинське і Щецинське**… Бо чоловіків у середньому віці майже не було. Ними були забиті тюрми Любліна і Ряшева, Явожно…"], "source": "Спогади Євгенії Іваник із с. Гонятин (скорочено)", "comment": ["Розповідь показує, як відбувалося виселення: кілька годин на збори, збірний пункт, кілька днів просто неба, товарні вагони.", "Сусідів з одного села свідомо розселяли в різних воєводствах, щоб українці не трималися разом і швидше ополячилися.", "__Слова з документа:__ **гміна** — найменша адміністративна одиниця в Польщі; **морг** — давня міра площі, близько 0,56 га; **Ряшів** — українська назва міста Жешув."], "img": null}, {"type": "doc", "title": "Спогади виселеної: Ляхава в Надсянні", "quote": ["Ляхаву виселяли першу на всю околицю. Завезли нас на польське село Ліщавка, де тримали цілий тиждень під сторожею війська… А поляки мали час арештувати підозрілих, між іншим і мене.", "У паперах вписали нам співпрацю з УПА, щоб знали ті, що нас везуть, що з нами далі робити… Вранці 2 травня заладували нас у худоб’ячі вагони…", "По моїм селі Ляхаві залишився тільки спомин. Минуло кілька літ від виселення й **поляки засадили на наших полях ліс**, щоб не залишилося ні сліду від «бандеровскей століци». Наші люди їздять до свого села-лісу й шукають старих стежок та каменів по рідних хатах."], "source": "Спогади Йосифи Зарічної-Жарких із с. Ляхава (скорочено)", "comment": ["Позначка «співпраця з УПА» в документах означала для родини суворіший нагляд на новому місці або табір.", "У спорожнілих селах польська влада розбирала хати, а поля засаджувала лісом. Так зникли сотні сіл Лемківщини й Надсяння.", "__Слова з документа:__ **«бандеровска століца»** (польськ.) — «бандерівська столиця», так польська влада називала село, яке підтримувало УПА."], "img": null}]}, {"id": "s3", "num": "III", "title": "УРСР на міжнародній арені", "sub": "Наркомат закордонних справ, співзасновниця ООН, Паризька мирна конференція", "cover": {"key": "un_stamp86", "cap": ""}, "cards": [{"type": "text", "kicker": "Міжнародна арена", "title": "Навіщо Москві знадобилася «зовнішня політика» УРСР", "badges": [], "paras": ["**1 лютого 1944 р.** Верховна Рада СРСР дозволила союзним республікам мати власні наркомати закордонних справ і оборони. Невдовзі в УРСР з’явився **Наркомат закордонних справ**. З 1944 р. його очолював **Дмитро Мануїльський**.", "Сталін мав на це дві причини. По-перше, СРСР хотів отримати в майбутній Організації Об’єднаних Націй **більше голосів**: спочатку радянська делегація вимагала місць для всіх 16 республік. По-друге, приєднання західноукраїнських земель зручно було подавати як «возз’єднання українського народу» в межах держави, яка має власний уряд і міністерство закордонних справ.", "На **Ялтинській конференції (лютий 1945 р.)** США й Велика Британія погодилися прийняти до ООН, крім СРСР, ще дві республіки — **УРСР і Білоруську РСР**."], "imgs": [{"key": "s003_image2", "cap": "Делегації на Ялтинській конференції, лютий 1945 р."}]}, {"type": "text", "kicker": "Міжнародна арена", "title": "УРСР — співзасновниця ООН (1945 р.)", "badges": ["НМТ: дата"], "paras": ["**25 квітня 1945 р.** у Сан-Франциско (США) відкрилася конференція, яка мала створити ООН. **30 квітня** вона запросила делегації УРСР і БРСР. Делегацію УРСР очолював **Дмитро Мануїльський**.", "**26 червня 1945 р.** Мануїльський підписав **Статут ООН**. Так УРСР стала **державою-засновницею** ООН; усього їх була **51**. УРСР ратифікувала Статут 22 серпня 1945 р.", "У **1948 – 1949 рр.** УРСР була непостійним членом **Ради Безпеки ООН**. Її представники завжди голосували так само, як делегація СРСР.", "Членство в ООН знадобилося й через десятиліття. У 1991 р. незалежній Україні не довелося вступати до ООН наново: вона вже була державою-засновницею організації."], "imgs": [{"key": "s015_image17", "cap": "Делегація УРСР на засіданні ООН (табличка «UKRAINE»), друга половина 1940-х рр."}, {"key": "un_stamp45", "cap": "Поштова марка США до відкриття конференції в Сан-Франциско 25 квітня 1945 р. Фото: Bureau of Engraving and Printing. / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Міжнародна арена", "title": "Мирні конференції і межі самостійності УРСР", "badges": [], "paras": ["Делегація УРСР брала участь у **Паризькій мирній конференції** (липень – жовтень 1946 р.). **10 лютого 1947 р.** УРСР разом з іншими державами-переможцями підписала мирні договори з **Італією, Румунією, Угорщиною, Болгарією та Фінляндією**.", "У **1948 р.** делегація УРСР працювала на **Дунайській конференції** в Белграді, яка визначила правила судноплавства на Дунаї.", "Проте власної зовнішньої політики УРСР не мала. Вона не встановила дипломатичних відносин з жодною державою й не мала посольств. Договори про кордони УРСР укладав уряд СРСР, а делегація УРСР в ООН виконувала вказівки Москви."], "imgs": [{"key": "manuilsky", "cap": "Дмитро Мануїльський — нарком (з 1946 р. міністр) закордонних справ УРСР у 1944 – 1952 рр. Фото: Sweeper tamonten / Wikimedia Commons, Public domain"}]}]}, {"id": "s4", "num": "IV", "title": "Відбудова (1945 – 1950)", "sub": "Збитки від війни, четверта п’ятирічка, хто й як відбудовував, результати", "cover": {"key": "s022_image21", "cap": ""}, "cards": [{"type": "text", "kicker": "Відбудова", "title": "З чого починали: збитки від війни", "badges": ["НМТ: поняття"], "paras": ["На Україну припало **42 % матеріальних збитків** усього СРСР — близько **285 млрд крб**. Війна зруйнувала в УРСР **714 міст і селищ** і понад **28 тис. сіл**. Мільйони людей жили в землянках.", "У **1945 р.** промисловість УРСР виробляла лише **26 %** того, що до війни. Шахти Донбасу були затоплені, ДніпроГЕС і більшість великих заводів — зруйновані.", "Бракувало людей: мільйони загинули, частину окупанти вивезли до Німеччини, багато хто ще служив в армії. На підприємствах і в колгоспах працювали переважно жінки, підлітки й люди похилого віку."], "imgs": [{"key": "s026_image28c", "cap": "Селянська родина на згарищі своєї хати, 1943 – 1944 рр. (ЦДКФФА України ім. Г. С. Пшеничного, експозиційне фото)"}]}, {"type": "text", "kicker": "Відбудова", "title": "Збитки й гроші на відбудову", "badges": [], "paras": ["На Україну припала майже половина всіх матеріальних збитків СРСР, а отримала вона **менше п’ятої частини** коштів, які держава вклала у відбудову.", "Більшу частину грошей Москва спрямовувала на Урал, Сибір і в Середню Азію, куди під час війни евакуювали заводи. Більшість евакуйованих підприємств назад до УРСР не повернули.", "Тому Україну відбудовували насамперед важкою працею її жителів."], "imgs": [{"key": "chart_1_30", "cap": "Дані: навчальні посібники з історії України; збитки — у цінах 1941 р."}]}, {"type": "text", "kicker": "Відбудова", "title": "Четверта п’ятирічка (1946 – 1950)", "badges": ["НМТ: поняття"], "paras": ["У **березні 1946 р.** Верховна Рада СРСР ухвалила закон про четвертий п’ятирічний план, у **серпні 1946 р.** Верховна Рада УРСР — свій план відбудови. До 1950 р. промисловість УРСР мала перевищити довоєнний рівень.", "Господарством керували так само, як у 1930-ті: план надходив із Москви, а найбільше коштів діставала **важка промисловість** — вугілля, метал, електроенергія, машини. На легку промисловість і житло грошей лишалося мало.", "Допомоги за **планом Маршалла** (американської програми відбудови Європи) СРСР не прийняв і заборонив брати її країнам Східної Європи. Почалася **холодна війна** — протистояння СРСР і його союзників зі США та їхніми союзниками. Частину обладнання для заводів СРСР вивіз із Німеччини як **репарації**."], "imgs": [{"key": "s021_image20", "cap": "Віктор Корецький. «Відновимо!», плакат, 1947 р."}, {"key": "marshall", "cap": "Плакат плану Маршалла: «За будь-якої погоди ми досягнемо добробуту лише разом», 1950 р."}, {"key": "s021_image19", "cap": "«Дамо країні більше вугілля!», плакат кінця 1940-х рр."}]}, {"type": "text", "kicker": "Відбудова", "title": "Хто відбудовував", "badges": [], "paras": ["Людей бракувало, тому держава залучала до роботи всіх, кого могла. Молодь посилали до **шкіл фабрично-заводського навчання (ФЗН)**, а звідти — на шахти й заводи. Працівників набирали в селах за **організованим набором (оргнабором)**.", "На будовах працювали **військовополонені** німці й **в’язні ГУЛАГу**. Серед в’язнів дедалі більше було українців, звинувачених у співпраці з окупантами або в зв’язках з ОУН і УПА.", "Жителі міст після роботи й у вихідні безплатно розбирали завали, як-от кияни на Хрещатику. Робочий день формально тривав 8 годин, але понаднормова праця була звичною, а за запізнення можна було потрапити під суд."], "imgs": [{"key": "s022_image23", "cap": "Кияни розбирають завали на Хрещатику, 1944 – 1945 рр."}, {"key": "s022_image24", "cap": "Відбудова центру Києва, друга половина 1940-х рр."}]}, {"type": "text", "kicker": "Відбудова", "title": "ДніпроГЕС: зруйнувати й відбудувати", "badges": [], "paras": ["ДніпроГЕС у Запоріжжі, найбільша електростанція Європи 1930-х рр., двічі зазнавала руйнування: у серпні 1941 р. греблю підірвали радянські війська під час відступу, у 1943 р. — німецькі.", "Відбудову почали одразу після звільнення Запоріжжя. У **1947 р.** станція знову дала струм, а повністю її відбудували у **1950 р.**", "Електроенергія ДніпроГЕС знадобилася насамперед для відновлення металургійних заводів Запоріжжя, зокрема **«Запоріжсталі»**, яка знову запрацювала в 1947 р."], "imgs": [{"key": "rian604045", "cap": "Зруйнований ДніпроГЕС, 1943 р. Фото: Макс Альперт / РІА Новини, CC BY-SA 3.0"}, {"key": "dneproges47", "cap": "ДніпроГЕС після відбудови. Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "carousel", "title": "Київ: від руїн до нового Хрещатика", "badges": [], "note": "Хрещатик забудували наново за проєктом архітекторів О. Власова, А. Добровольського й інших. Вулицю розширили й забудували монументальними будинками в стилі сталінського ампіру. Будівництво тривало до середини 1950-х рр.", "items": [{"key": "s023_image25", "name": "", "desc": "Будинок універмагу (ЦУМ) серед руїн Хрещатика, 1944 р.", "cap": ""}, {"key": "s023_image26", "name": "", "desc": "Хрещатик після розбирання завалів, середина 1940-х рр.", "cap": ""}]}, {"type": "text", "kicker": "Відбудова", "title": "Результати відбудови (% від рівня 1940 р.)", "badges": [], "paras": ["У промисловості план виконали: у **1950 р.** УРСР виробляла на **15 %** більше, ніж до війни. Відбудували Донбас, ДніпроГЕС, «Запоріжсталь», «Азовсталь», заводи Харкова й Києва.", "Відбудовували **старі** заводи, а не будували сучасні: обладнання й технології лишилися здебільшого довоєнними. Найшвидше розвивалися важка промисловість і військові заводи.", "Легка промисловість (одяг, взуття, посуд) і сільське господарство довоєнного рівня не досягли. У крамницях і далі бракувало найпотрібніших товарів."], "imgs": [{"key": "chart_1_35", "cap": "Дані: підручники й посібники з історії України; за різними підрахунками показники трохи відрізняються."}]}]}, {"id": "s5", "num": "V", "title": "Голод 1946 – 1947 рр.", "sub": "Причини, перебіг, жертви; документи: скарга колгоспників, доповідь райкому, спогади Хрущова", "cover": {"key": "s028_image29", "cap": ""}, "cards": [{"type": "text", "kicker": "Голод", "title": "Чому почався голод", "badges": ["НМТ: дата"], "paras": ["**Посуха.** Літо 1946 р. було надзвичайно посушливим, особливо на півдні України й у Молдавії. Зерна зібрали в кілька разів менше, ніж планували.", "**Хлібозаготівлі.** Держава не зменшила плану хлібозаготівель. Колгоспи віддавали майже все, навіть насіннєве зерно, а колгоспникам за трудодні лишалися крихти.", "**Вивезення зерна.** СРСР і далі вивозив зерно за кордон, щоб підтримати комуністичні режими: у 1946 – 1947 рр. сотні тисяч тонн відправили до Румунії, Чехословаччини, Польщі.", "**Стан села після війни.** У колгоспах бракувало людей, коней, тракторів і пального. Державних пайків селяни, на відміну від городян, не отримували."], "imgs": [{"key": "s021_image18", "cap": "«Відновимо наші села, зруйновані німецько-фашистськими загарбниками!», плакат, 1945 р."}]}, {"type": "text", "kicker": "Голод", "title": "Як ширився голод", "badges": ["НМТ: дата"], "paras": ["Восени 1946 р. в селах почався голод. Керівник УРСР **Микита Хрущов** просив Сталіна зменшити план хлібозаготівель і дати Україні продовольчу допомогу. Сталін звинуватив його в «м’якотілості».", "У **березні 1947 р.** першим секретарем ЦК КП(б)У замість Хрущова призначили **Лазаря Кагановича**; Хрущов лишився головою уряду. Каганович вимагав виконати план хлібозаготівель попри голод. Указ про охорону державного майна, виданий улітку **1947 р.**, дозволяв карати роками ув’язнення навіть за жменю колосків.", "Найтяжче було взимку й навесні **1947 р.**: люди їли лободу, кору, падаль, у селах траплялося людоїдство. Тисячі людей їхали по хліб до **західних областей**, де колгоспів ще майже не було. Державна допомога (насіннєві й продовольчі позики) надійшла лише навесні 1947 р.", "Кількість жертв дослідники оцінюють по-різному: **від кількох сотень тисяч до понад 1 млн осіб**."], "imgs": [{"key": "kaganovich", "cap": "Лазар Каганович, перший секретар ЦК КП(б)У в березні – грудні 1947 р. (фото 1930-х рр.) Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "map", "title": "Голод 1946 – 1947 рр. за даними МВС УРСР", "steps": [{"key": "pv_famine", "label": "Крок 1"}]}, {"type": "doc", "title": "Скарга колгоспників (червень 1946 р.)", "quote": ["Микита Сергійович, батьку наш, захиснику, тяжко нам, обірвані ми всі, голі й босі, брудні й голодні, на людей не схожі, гірше худоби живемо, ніколи нам не було так тяжко, як у цей час, **люди наші з голоду мруть, діти від недоїдання та хвороб стають каліками**. Харчуємося ми лободою, лозою, а у кого є гроші, то їдуть у місто і купляють хліб у комерційних магазинах, але і за хлібом іти далеко 140 — 160 км… Із колгоспу ми нічого не отримуємо і немає надії, бо все вигоріло, а ярові дуже слабі і як виконаємо план, то все подохнемо…", "Багато колгоспників збираються виїжджати на Кавказ і у Середню Азію… **Люди всі змінилися — худі, чорні, злі**, говорять, що нині правди немає, але правда повинна бути…"], "source": "Скарга колгоспників с. Попелюхи Вінницької обл. М. Хрущову", "comment": ["Колгоспники писали Хрущову ще в червні 1946 р., задовго до найтяжчих місяців. Вінниччина, як видно з карти, належала до областей, де голод був найтяжчим.", "__Слова з документа:__ **комерційні магазини** — державні крамниці, де без карток продавали продукти за дуже високими цінами; **ярові** — культури, які сіють навесні (ячмінь, овес); **план** — обов’язкова здача зерна державі."], "img": null}, {"type": "doc", "title": "Доповідь райкому партії (січень 1947 р.)", "quote": ["У результаті посухи 1946 року 10 колгоспів нашого району отримали середній урожай зернових по 1,8 ц., 8 колгоспів — по 2,4 ц. з гектару, а решта колгоспів — по 4,3 ц. […] Отриманий на трудодні хліб (**150 г. на трудодень**, що становило лише 15 % від належної норми) колгоспники спожили в процесі роботи. Овочів і картоплі, як у колгоспах, так і у колгоспників немає. **У 12 колгоспах** надзвичайно напружене становище, **немає жодного кілограма продовольства**…", "Перевірка на місцях райвиконкомом і райкомом партії показала, що **понад 460 сімей** в колгоспах району зовсім не мають хліба та інших продуктів харчування. Це в основному **сім’ї загинувших на фронті воїнів**, багатодітні сім’ї та сім’ї інвалідів Вітчизняної війни…"], "source": "Великобілозерський райком КП(б)У — Запорізькому обкому", "comment": ["Це службовий документ: місцеві партійні керівники доповідали обкому, що люди в районі голодують, а район не має чим їм допомогти.", "Слово «голод» у таких документах майже не вживали: писали «напружене продовольче становище», «виснаження», «дистрофія».", "__Слова з документа:__ **ц** — центнер, 100 кг; **трудодень** — одиниця обліку праці в колгоспі, за яку наприкінці року видавали зерно чи гроші."], "img": null}, {"type": "doc", "title": "Спогади Микити Хрущова про 1946 – 1947 рр.", "quote": ["1946 р. був дуже засушливим, сільське господарство дуже постраждало […] Я думав, якщо відверто доповісти все Сталіну та довести правдивість слів цифрами, то він повірить. […] Я надіслав документ Сталіну. […] **Сталін прислав мені грубу, образливу телеграму**, де говорилося, що я сумнівна людина: пишу записки, в яких доказую, що Україна не може виконати держзаготівель.", "Я розумів трагедію, яка нависла не тільки особисто над моєю персоною, а й над українським народом, над республікою: **голод став неминучим** і скоро розпочався […] Почали надходити сигнали, що люди помирають. В окремих місцях почалося людожерство […]"], "source": "М. Хрущов. Спогади (переклад з російської, скорочено)", "comment": ["Хрущов писав ці спогади в 1960-х рр., уже на пенсії, і подавав себе захисником українців. Проте саме він як керівник УРСР у 1946 р. організовував хлібозаготівлі.", "Інші документи підтверджують, що Хрущов просив у Москви допомоги, а Сталін відмовляв.", "__Слова з документа:__ **держзаготівлі** — обов’язкова здача сільськогосподарської продукції державі."], "img": null}]}, {"id": "s6", "num": "VI", "title": "Повсякденне життя", "sub": "Житло й харчування, грошова реформа і скасування карток 1947 р.", "cover": {"key": "rub10_1947", "cap": ""}, "cards": [{"type": "text", "kicker": "Повсякдення", "title": "Як жили люди після війни", "badges": [], "paras": ["**Житло й побут.** Найгостріше бракувало **житла**. У містах родини тіснилися в комунальних квартирах і бараках, у селах — у землянках і напівзруйнованих хатах. Квартиру в місті чекали роками.", "Чоловіки довго ходили у військовій формі, бо іншого одягу не мали. Багато фронтовиків повернулися інвалідами. Сиріт після війни було десятки тисяч; держава відкривала для них дитячі будинки, але місць не вистачало.", "**Харчування й товари.** Продукти й промислові товари видавали за **картками**, які запровадили 1941 р. Норми були мізерними, а селяни карток узагалі не отримували.", "Усе інше люди купували на базарах або в **комерційних магазинах**, де ціни були в кілька разів вищими. Восени 1946 р., коли почався голод, держава підняла ціни на хліб за картками й зменшила кількість людей, які мали право на картки."], "imgs": [{"key": "cards40", "cap": "Продовольчі картки й лімітні книжки 1940-х рр. (Музей грошей, суспільне надбання)"}]}, {"type": "doc", "title": "Повоєнне село очима історика", "quote": ["П’ятирічним планом на 1946 — 1950 рр. передбачалося спорудити на кошти колгоспників та селян за допомогою державного кредиту **1,2 млн будинків**. Проте… було зведено лише… **54,6 % від державного плану**. На 1 березня 1949 р. **в землянках проживало більше 50 тис.**, а на чужій житловій площі — 48 тис. сімей колгоспників.", "Нестача будівельних матеріалів, кваліфікованої робочої сили змушувала людей споруджувати примітивне житло… нові будинки колгоспників здебільшого являють собою чотиристінну хату з великою піччю в кутку. **Стіни більшості хат сплетені з хмизу… обмазані глиною з двох боків. Дахи солом’яні, долівка глиняна.** Вікна, як правило, маленькі…"], "source": "Історик І. Рибак про повоєнне село (скорочено)", "comment": ["Навіть через п’ять років після війни десятки тисяч селянських родин жили в землянках.", "Нові хати будували самі селяни з того, що було під рукою, бо цегли, дерева й скла держава майже не виділяла.", "__Слова з тексту:__ **хмиз** — тонке гілля; **долівка** — підлога в хаті."], "img": null}, {"type": "table", "title": "Грошова реформа і скасування карток (грудень 1947 р.)", "rows": [["Що змінилося", "Як саме"], ["Картки", "держава скасувала картки на продукти й промислові товари, а замість карткових і комерційних цін запровадила єдині державні ціни: хліб і крупи подешевшали, більшість інших товарів лишилася дорогою"], ["Готівка", "старі гроші обміняли на нові **10 : 1** — за 10 старих карбованців давали 1 новий"], ["Вклади в ощадкасах", "до 3 тис. крб — **1 : 1**; від 3 до 10 тис. — **3 : 2**; понад 10 тис. — **2 : 1**"], ["Облігації державних позик", "обміняли на нові, здебільшого **3 : 1**"], ["Хто втратив найбільше", "селяни, які тримали виручку з базару вдома, і всі, хто мав заощадження готівкою"]]}, {"type": "doc", "title": "Два погляди на повоєнні роки", "quote": ["**З вражень американського туриста:** «…продовольчі магазини… ми бачили розкішні продукти Радянського Союзу: великі банки з ікрою, гори ковбас, сири, риба і навіть дичина… На вулицях майже не чути сміху, не видно посмішок… Більшість чоловіків носили військову форму, хоча вони вже не служили в армії. **Форма була єдиним одягом, який вони мали**».", "**З журналу «Радянська жінка» (1946 р., № 5):** «Поради господаркам: як краще прати білизну. Насамперед готують розчин. На відро теплої води кладуть 1/2 склянки соди… Білизну треба кип’ятити 1 годину. Після цього її слід добре полоскати…»"], "source": "Уривки з посібника для старшої школи (скорочено)", "comment": ["Турист бачив вітрини комерційних магазинів у великих містах: продукти там були, але більшість людей не мала на них грошей.", "Порада журналу показує, як жили господині: без пральних машин і без пральних порошків, з содою й відром на плиті.", "__Слова з документа:__ **дичина** — м’ясо диких тварин і птахів."], "img": {"key": "rub1_1947", "cap": "Один карбованець зразка 1947 р. Фото: USSR Государственное Казначейство / Scanned and processed by Vizu / Wikimedia Commons, Public domain"}}]}, {"id": "s7", "num": "VII", "title": "Узагальнення", "sub": "Примусові переселення в цифрах, що часто плутають на НМТ, стрічка часу", "cover": null, "cards": [{"type": "text", "kicker": "Узагальнення", "title": "Примусові переселення 1944 – 1951 рр. (тис. осіб)", "badges": [], "paras": ["Нові кордони супроводжувалися переселенням людей. За угодою 1944 р. між УРСР і Польщею переселили майже **1,3 млн** українців і поляків.", "Тих українців, які лишилися в Польщі, польська влада в **1947 р.** розселила на заході й півночі країни (операція «Вісла»).", "Останнє переселення відбулося **1951 р.**, після обміну ділянками.", "На діаграмі немає радянських депортацій із західних областей УРСР — про них ідеться в частині 2."], "imgs": [{"key": "chart_1_48", "cap": "Дані: Т. Пронь, Ю. Сорока та ін.; операція «Вісла» й 1951 р. — округлено."}]}, {"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Подія", "Що треба пам’ятати", "З чим плутають"], ["Операція «Вісла» (1947)", "провела **польська влада**; українців з Польщі розселили на заході й півночі Польщі", "операція «Захід» (1947) — радянська депортація із західних областей УРСР до Сибіру й Казахстану"], ["Обмін населенням (1944 – 1946)", "за угодою УРСР і Польщі; українців переселяли до УРСР", "операція «Вісла», коли українців переселяли в межах Польщі"], ["Закарпаття (1945)", "договір СРСР і Чехословаччини 29 червня 1945 р.", "Закарпатську область утворили пізніше — 22 січня 1946 р."], ["Західний кордон УРСР (1951)", "обмін ділянками з Польщею 15 лютого 1951 р.", "договір про кордон з Польщею 16 серпня 1945 р."], ["УРСР в ООН (1945)", "співзасновниця; у квітні 1945 р. запрошена на конференцію в Сан-Франциско", "УРСР не мала посольств і власної зовнішньої політики"]]}, {"type": "tl_events", "title": "Стрічка часу: дати частини 1", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "9.09.1944", "name": "Угода з Польщею", "desc": "обмін населенням", "color": "#e05a47", "prog": false}, {"year": "квітень 1945", "name": "УРСР в ООН", "desc": "співзасновниця", "color": "#5b93bd", "prog": true}, {"year": "29.06.1945", "name": "Закарпаття", "desc": "у складі УРСР", "color": "#6ea8c9", "prog": true}, {"year": "16.08.1945", "name": "Договір з Польщею", "desc": "про кордон", "color": "#6ea8c9", "prog": false}, {"year": "1946 – 1947", "name": "Масовий голод", "desc": "посуха, хлібозаготівлі", "color": "#d9607e", "prog": true}, {"year": "10.02.1947", "name": "Паризький договір", "desc": "кордон з Румунією", "color": "#6ea8c9", "prog": false}, {"year": "квітень – липень 1947", "name": "Операція «Вісла»", "desc": "польська влада", "color": "#e05a47", "prog": true}, {"year": "грудень 1947", "name": "Грошова реформа", "desc": "скасування карток", "color": "#a9dda0", "prog": false}, {"year": "1950", "name": "Відбудову завершено", "desc": "промисловість — 115 %", "color": "#a9dda0", "prog": false}, {"year": "1951", "name": "Західний кордон", "desc": "обмін ділянками", "color": "#6ea8c9", "prog": true}]}]}]}, {"id": "p2", "num": 2, "title": "Україна в перші повоєнні роки (1945 – 1953)", "part": "Частина 2. Західна Україна, ідеологія і культура", "sub": "Радянізація західних областей, ліквідація УГКЦ, визвольний рух і операція «Захід», ждановщина й лисенківщина, наука, література, мистецтво", "cover": {"key": "yura", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Україна в перші повоєнні роки»", "badges": [], "blocks": [{"k": "h", "text": "Дати частини 2", "light": false}, {"k": "p", "paras": ["• **березень 1946 р.** — ліквідація УГКЦ", "• **жовтень 1947 р.** — операція «Захід»", "• повторення (ч. 1): **1945 р.** — Закарпаття у складі УРСР; **квітень 1945 р.** — УРСР в ООН; **1946 – 1947 рр.** — голод; **квітень – липень 1947 р.** — «Вісла»; **1951 р.** — західний кордон УРСР"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії", "light": false}, {"k": "p", "paras": ["• **Йосип Сліпий** (портрет), **Василь Кук**", "• **Олександр Богомолець**, **Сергій Лебедєв**, **Володимир Філатов**", "• **Андрій Малишко**, **Максим Рильський**, **Володимир Сосюра**, **Павло Тичина**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **операція «Захід»**, **ждановщина**, **лисенківщина**, **космополітизм**", "• повторення: відбудова, холодна війна, операція «Вісла»"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятка й уміння", "light": false}, {"k": "p", "paras": ["• пам’ятка: картина **Тетяни Яблонської «Хліб»** (1949)", "• особливості й наслідки радянізації західних областей; причини ліквідації УГКЦ; ідеологічні кампанії"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 27. Матеріал поза програмою має сіру позначку «поза програмою»."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Радянізація західних областей", "sub": "Колективізація, індустріалізація, «культурна революція» (1944 – початок 1950-х рр.)", "cover": {"key": "s035_image37", "cap": ""}, "cards": [{"type": "tl_events", "title": "Стрічка часу: частина 2", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "квітень 1945", "name": "Арешт єпископів УГКЦ", "desc": "зокрема Йосипа Сліпого", "color": "#b48ae0", "prog": false}, {"year": "березень 1946", "name": "Львівський «собор»", "desc": "ліквідація УГКЦ", "color": "#b48ae0", "prog": true}, {"year": "серпень 1946", "name": "Постанова ЦК ВКП(б)", "desc": "початок ждановщини", "color": "#5b93bd", "prog": false}, {"year": "жовтень 1947", "name": "Операція «Захід»", "desc": "депортація із західних областей", "color": "#e05a47", "prog": true}, {"year": "серпень 1948", "name": "Сесія ВАСГНІЛ", "desc": "початок лисенківщини", "color": "#5b93bd", "prog": false}, {"year": "1949", "name": "Ліквідація УГКЦ", "desc": "на Закарпатті", "color": "#b48ae0", "prog": false}, {"year": "1949 – 1950", "name": "Колективізація", "desc": "західних областей завершена", "color": "#d88b3e", "prog": false}, {"year": "5 березня 1950", "name": "Загибель", "desc": "Романа Шухевича", "color": "#e05a47", "prog": false}, {"year": "1951", "name": "«Любіть Україну»", "desc": "цькування В. Сосюри", "color": "#5b93bd", "prog": false}, {"year": "травень 1954", "name": "Арешт", "desc": "Василя Кука", "color": "#e05a47", "prog": false}]}, {"type": "text", "kicker": "Радянізація", "title": "Що таке радянізація і чому вона «друга»", "badges": [], "paras": ["**Радянізація** — запровадження в західних областях радянських порядків: колгоспів, державної власності, партійного контролю, радянської освіти й ідеології.", "Уперше радянська влада взялася за це в **1939 – 1941 рр.**, після приєднання Західної України, але її плани перервала німецько-радянська війна. Коли в **1944 р.** Червона армія повернулася, влада продовжила те, чого не встигла зробити до війни.", "Друга радянізація мала свої особливості. Відбудову, колективізацію й індустріалізацію влада проводила тут **одночасно**, тобто за кілька років робила те, на що в східних областях УРСР пішло двадцять років. Місцевих спеціалістів, лояльних до влади, майже не було. Багато людей сприймали нову владу як окупацію, і в краї тривала **збройна боротьба УПА**."], "imgs": [{"key": "s041_image43", "cap": "Першотравнева демонстрація в Ужгороді, 1946 р. (Державний архів Закарпатської області)"}]}, {"type": "cols", "title": "Колективізація західних областей (1944 – 1950)", "badges": [], "intro": null, "blocks": [{"h": "Мета й методи", "paras": ["Влада хотіла зробити сільське господарство таким самим, як в інших областях СРСР, поставити селян під контроль і позбавити УПА підтримки села.", "Спочатку селян умовляли, але до колгоспів ішли одиниці: наприкінці 1945 р. в західних областях було лише **145 колгоспів**.", "Тоді влада підвищила **податки** й норми обов’язкових поставок для одноосібників. За постановою Ради Міністрів УРСР від 23 серпня 1947 р. заможні господарства платили надбавки до податку від 50 до 100 %. Тих, хто опирався, оголошували «куркулями» й депортували."]}, {"h": "Хід і результати", "paras": ["Найшвидше влада створювала колгоспи в **1948 – 1950 рр.**, коли тривали масові депортації. Багато селян вступали до колгоспу, щоб не платити непосильних податків і не потрапити до списків на виселення.", "До **1950 р.** влада майже завершила колективізацію західних областей.", "Техніку колгоспам давали **машинно-тракторні станції (МТС)**, через які держава й контролювала село."]}]}, {"type": "text", "kicker": "Радянізація", "title": "Індустріалізація західних областей", "badges": [], "paras": ["Влада хотіла зробити західні області частиною загальносоюзного господарства й скористатися їхніми природними багатствами: нафтою, газом, вугіллям, лісом. Нові заводи мали також змінити склад населення: селяни ставали робітниками.", "На Прикарпатті, де видобували нафту, збудували нафтопереробні заводи, а біля лісорозробок — деревообробні комбінати. У **1948 р.** запрацював **газопровід Дашава — Київ**. З’явилися нові галузі — машинобудування, приладобудування, електротехніка. У **1945 р.** у Львові заснували **автобусний завод**.", "Промисловість західних областей зростала найшвидше в УРСР, але мала ті самі вади, що й уся радянська: переважала важка промисловість, обладнання було зношене, сировину везли на переробку в інші регіони. Інженерів і кваліфікованих робітників привозили зі сходу України й з Росії."], "imgs": [{"key": "s038_image39", "cap": "ЛАЗ-695 — перший серійний автобус Львівського автобусного заводу (випускали з 1956 р.)"}]}, {"type": "text", "kicker": "Радянізація", "title": "«Культурна революція» в західних областях", "badges": [], "paras": ["Влада хотіла виховати людей комуністами, відданими СРСР, і водночас послабити український національний рух.", "Запроваджували **обов’язкову освіту**, відкривали школи й курси для неписьменних. Лише в сільські школи західних областей у 1944 – 1950 рр. влада прислала майже **44 тис. учителів** зі сходу й центру України.", "Освіта ставала ідеологічною: у школах і вишах вивчали марксизм-ленінізм, з бібліотек вилучали «націоналістичну» літературу. У вишах, зокрема у Львівському університеті, дедалі більше предметів викладали **російською мовою**.", "Місцеву інтелігенцію, яка не підтримувала нову владу, арештовували й висилали."], "imgs": [{"key": "slipyj_rector", "cap": "Ректор Львівської богословської академії Йосип Сліпий з викладачами й студентами, 1930-ті рр. Академію закрили після приходу радянської влади. Фото: Kosar Antony / Wikimedia Commons, Public domain"}]}]}, {"id": "s2", "num": "II", "title": "Ліквідація УГКЦ (1945 – 1949)", "sub": "Арешт єпископів, Львівський «собор» 1946 р., підпільна церква; Йосип Сліпий", "cover": {"key": "s040_image42", "cap": ""}, "cards": [{"type": "text", "kicker": "УГКЦ", "title": "Навіщо влада знищувала УГКЦ", "badges": [], "paras": ["УГКЦ була найбільшою церквою Галичини, її вірними були кілька мільйонів людей. Церква підпорядковувалася **Папі Римському**, тобто мала центр поза межами СРСР.", "Священники УГКЦ десятиліттями підтримували українську освіту, кооперацію, товариства. Влада вважала церкву опорою «буржуазного націоналізму» й звинувачувала її в підтримці УПА.", "Ліквідуючи УГКЦ, влада хотіла **відірвати галичан від Риму й Заходу**, позбавити національний рух підтримки й підпорядкувати вірних **Російській православній церкві**, яку контролювали радянські органи."], "imgs": [{"key": "s039_image40", "cap": "Герб Української греко-католицької церкви (сучасний)"}]}, {"type": "text", "kicker": "УГКЦ", "title": "Як ліквідовували УГКЦ", "badges": ["НМТ: дата"], "paras": ["**Арешти й «ініціативна група» (1945).** **11 квітня 1945 р.** НКДБ заарештував митрополита **Йосипа Сліпого** та всіх єпископів УГКЦ. Їх засудили до багаторічного ув’язнення в таборах. Влада створила «**ініціативну групу**» на чолі зі священником **Гавриїлом Костельником**, яка закликала священників перейти до православ’я. Тих, хто відмовлявся, арештовували органи держбезпеки.", "**Львівський «собор» (1946).** **8 – 10 березня 1946 р.** у соборі святого Юра у Львові зібралися 216 священників і 19 мирян. Жодного єпископа УГКЦ серед них не було, а двох учасників напередодні в Києві ієрархи Російської православної церкви висвятили на єпископів. «Собор» скасував **Берестейську унію 1596 р.** і приєднав УГКЦ до Російської православної церкви.", "**Підпілля.** У **1949 р.** влада так само ліквідувала греко-католицьку церкву на **Закарпатті**. Частина священників і вірних не підкорилася, і УГКЦ до **1989 р.** діяла в **підпіллі**."], "imgs": [{"key": "kostelnyk", "cap": "Гавриїл Костельник (1886 – 1948). Фото: невідомий автор / Wikimedia Commons, Public domain"}, {"key": "sobor_docs", "cap": "Запрошення й мандат учасника «собору» 1946 р. (музейна експозиція). Фото: користувач Водник / Wikimedia Commons, Public domain"}]}, {"type": "doc", "title": "Виступ Микити Хрущова (16 липня 1945 р.)", "quote": ["Удар, який ми нанесли Сліпому, виявився дуже вдалим. **Необхідно підтримати ініціативну групу по переходу до православ’я**, підтримати священиків, які переходять від уніатства до православної віри.", "Якась кількість уніатів необхідна для того, щоб мати свою агентуру.", "Нам вигідно, щоб уніати перейшли в православну віру. **Це політика, щоб відірвати від Риму і прилучити до православної церкви.**"], "source": "Виступ М. Хрущова на нараді секретарів обкомів партії, начальників НКВС і НКДБ", "comment": ["Хрущов виступав перед партійними керівниками й начальниками держбезпеки західних областей. Слова «удар, який ми нанесли Сліпому» стосуються арешту митрополита у квітні 1945 р.", "Документ показує, що «добровільний» перехід до православ’я влада готувала заздалегідь, а його мета була політичною.", "__Слова з документа:__ **уніати** — так називали греко-католиків; **агентура** — таємні інформатори органів держбезпеки."], "img": null}, {"type": "text", "kicker": "Персоналія", "title": "Йосип Сліпий (1892 – 1984)", "badges": ["НМТ: персоналія", "портрет"], "paras": ["Йосип Сліпий народився на Тернопільщині. Він здобув богословську освіту у Львові, Інсбруку й Римі, з **1925 р.** очолював Львівську духовну семінарію, а потім **Богословську академію**.", "Митрополит **Андрей Шептицький** обрав Сліпого своїм наступником, і коли в **1944 р.** Шептицький помер, Сліпий очолив **УГКЦ**. **11 квітня 1945 р.** його заарештували й звинуватили в «співпраці з окупантами». Сліпий відмовився перейти до православ’я і провів у радянських таборах і на засланні **18 років**.", "У **1963 р.** на прохання Папи Івана XXIII і президента США Джона Кеннеді його звільнили й вислали до Рима. Там він заснував Український католицький університет і збудував собор Святої Софії, у **1965 р.** став кардиналом. Помер у Римі в 1984 р., у **1992 р.** його перепоховали в соборі святого Юра у Львові."], "imgs": [{"key": "slipyj", "cap": "Йосип Сліпий, 1960-ті – 1970-ті рр. Фото: Pkravchenko / Wikimedia Commons, CC BY-SA 3.0"}]}]}, {"id": "s3", "num": "III", "title": "Визвольний рух у 1944 – 1950-х рр.", "sub": "ОУН, УПА, УГВР; методи боротьби; операція «Захід»; Роман Шухевич і Василь Кук", "cover": {"key": "s043_image45", "cap": ""}, "cards": [{"type": "text", "kicker": "Визвольний рух", "title": "Хто боровся проти радянської влади", "badges": ["поза програмою"], "paras": ["Після повернення Червоної армії в західних областях і далі діяли **Організація українських націоналістів (ОУН)** і **Українська повстанська армія (УПА)**. Їх очолював **Роман Шухевич**.", "У липні 1944 р. повстанці створили **Українську головну визвольну раду (УГВР)** — підпільний верховний орган, який мав об’єднати всіх, хто боровся за незалежну Україну. Частина її членів працювала за кордоном і повідомляла урядам та пресі західних країн про боротьбу в Україні.", "Повстанці домагалися **незалежної Української держави**. У 1944 – 1946 рр. УПА воювала великими загонами — куренями й сотнями, мала тисячі бійців і підтримку багатьох сіл."], "imgs": [{"key": "shukhevych", "cap": "Роман Шухевич — головний командир УПА в 1943 – 1950 рр. Фото: невідомий автор / Wikimedia Commons, Public domain"}, {"key": "upa_kolomyia", "cap": "Повстанці ОУН і УПА, Коломийщина, 1940-ві рр. Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Визвольний рух", "title": "Як боролися повстанці і як з ними боролася влада", "badges": [], "paras": ["**Повстанці.** Нападали на радянських чиновників, військових і міліцію.", "Карали тих, хто співпрацював з владою.", "Зривали колективізацію, хлібозаготівлі, вибори й мобілізацію, поширювали листівки.", "**Влада.** Оточувала військами цілі райони й прочісувала ліси (**«велика блокада»** 1946 р.).", "Створювала з місцевих жителів **винищувальні батальйони** («стрибків»), вербувала агентуру.", "Оголошувала **амністії** тим, хто складе зброю.", "Масово **депортувала** родини повстанців і тих, хто їм допомагав.", "Використовувала **спецгрупи МДБ**, переодягнені у форму УПА: вони грабували й убивали селян, щоб підірвати довіру до повстанців."], "imgs": [{"key": "s042_image44", "cap": "Вояки УПА, друга половина 1940-х рр."}]}, {"type": "doc", "title": "Як діяли спецгрупи МДБ", "quote": ["Спостерігаючи за спецгрупою, я бачив, що піша група дуже малорухома… тому я порадився з командирами групи і вирішив дістати коней і вози… Ми пішли без прикриття в село Яблунів Станіславської області, уночі ми ввійшли до села і запитали голову сільради, чи є у нього в селі коні і вози, залишені будь-яким куренем.", "Той нам відповів, що у нього в селі є 15 коней і 8 возів, залишених куренем «Сталь»… Цих коней і вози ми забрали, **голові сільради видали розписку, що коні і вози забрані куренем «Швидкого»** і станичного села… він став з нами сваритися за коней, кажучи, що він на нас поскаржиться «Різуну»… ми забрали з собою, **вбили його і кинули до колодязя**."], "source": "Із показань учасника спецгрупи МДБ (скорочено)", "comment": ["Співробітники спецгрупи видавали себе за повстанців. Розписка від імені «куреня Швидкого» мала посварити селян з УПА, а вбивство станичного селяни мали приписати повстанцям.", "Про злочини спецгруп знали й у радянських органах: у 1949 р. їх визнав у доповідній записці прокурор, який розслідував такі справи.", "__Слова з документа:__ **курінь** — підрозділ УПА з кількох сотень; **станичний** — місцевий керівник підпілля ОУН у селі."], "img": null}, {"type": "cols", "title": "Операція «Захід» (21 – 22 жовтня 1947 р.)", "badges": ["НМТ: дата", "НМТ: поняття"], "intro": null, "blocks": [{"h": "Рішення й хід операції", "paras": ["Депортації в західних областях почалися ще в 1944 р. **10 вересня 1947 р.** Рада Міністрів СРСР ухвалила виселити до віддалених районів СРСР родини «оунівців» і повстанців, заарештованих або вбитих у боях.", "Операцію провели одночасно в усіх західних областях. О **2-й годині ночі 21 жовтня 1947 р.** війська й співробітники МДБ оточили села, людям дали кілька годин на збори. За кілька днів вивезли **понад 77 тис. осіб**."]}, {"h": "Куди й навіщо", "paras": ["Ешелони йшли до **Казахстану, Сибіру й на Урал**. Людей відправляли на шахти, лісозаготівлі, будови, вони жили на спецпоселенні під наглядом.", "Загалом у **1944 – 1952 рр.** із західних областей депортували понад **200 тис. осіб**. Депортації мали залякати населення й позбавити УПА підтримки."]}]}, {"type": "map", "title": "Операція «Захід» (жовтень 1947 р.)", "steps": [{"key": "pv_zakhid", "label": "Крок 1"}]}, {"type": "text", "kicker": "Операція «Захід»", "title": "Депортації із західних областей УРСР (тис. осіб)", "badges": [], "paras": ["У **1944 – 1946 рр.** влада вивозила родини повстанців окремими партіями: за три роки — майже 37 тис. осіб.", "Операція **«Захід»** стала наймасовішою депортацією із західних областей: за кілька днів жовтня 1947 р. вивезли вдвічі більше людей, ніж за три попередні роки.", "Після неї депортації тривали до **1952 р.** Відтоді вивозили також «куркулів» — селян, які не хотіли вступати до колгоспів.", "Усього в 1944 – 1952 рр. із західних областей депортували понад **200 тис. осіб**."], "imgs": [{"key": "chart_2_21", "cap": "Дані: А. Когут (за документами архіву СБУ): 1944 – 1946 — 36 609 осіб, усього — 205 938; «Захід» — 77 291."}]}, {"type": "text", "kicker": "Визвольний рух", "title": "Останні роки збройної боротьби", "badges": [], "paras": ["**1946 – 1949.** Відтоді УПА діяла **невеликими групами** й підпільними боївками. Операція «Вісла» позбавила її баз у Польщі, а колективізація й депортації — підтримки в селах: повстанцям дедалі більше бракувало харчів і поповнення.", "Керівництво ОУН розраховувало на нову світову війну між СРСР і Заходом і шукало зв’язків із західними розвідками. У **1949 р.** Шухевич наказав розформувати загони УПА й перейти до підпілля.", "**1950 – 1954.** **5 березня 1950 р.** Роман Шухевич загинув у бою з військами МДБ у селі **Білогорща** біля Львова. Його наступником став **Василь Кук**. Після арешту Кука в **1954 р.** організований опір фактично припинився, хоча окремі повстанці переховувалися ще роками."], "imgs": [{"key": "upa_hrehit", "cap": "Повстанці УПА на горі Ґрегіт у Карпатах, 1940-ві рр. Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Персоналія", "title": "Василь Кук (1913 – 2007)", "badges": ["НМТ: персоналія"], "paras": ["Василь Кук народився в селі **Красне** на Львівщині в селянській родині. Ще юнаком вступив до **ОУН**, кілька разів сидів у польських в’язницях.", "Під час війни керував підпіллям ОУН на сході й півдні України, у 1944 р. командував повстанцями в одному з найбільших боїв УПА під **Гурбами** на Рівненщині. З **1947 р.** був заступником Романа Шухевича, а після його загибелі в **1950 р.** став **головним командиром УПА** і провідником ОУН в Україні.", "**23 травня 1954 р.** співробітники КДБ схопили Кука за допомогою завербованого колишнього підпільника. Шість років він провів у слідчих в’язницях Києва й Москви без суду. У **1960 р.** його звільнили, він закінчив Київський університет і працював в архіві та Інституті історії. Помер у Києві 2007 р."], "imgs": [{"key": "s068_image85", "cap": "Василь Кук, 1940-ві рр."}]}]}, {"id": "s4", "num": "IV", "title": "Ідеологічні кампанії (1946 – 1953)", "sub": "Ждановщина, боротьба з «буржуазним націоналізмом» і «космополітизмом», лисенківщина", "cover": {"key": "s054_image57", "cap": ""}, "cards": [{"type": "text", "kicker": "Ждановщина", "title": "Ждановщина: що це і чому вона почалася", "badges": ["НМТ: поняття"], "paras": ["**Ждановщина** — кампанія радянської влади в 1946 – початку 1950-х рр., яка мала відновити повний ідеологічний контроль над наукою, літературою й мистецтвом. Назва походить від прізвища секретаря ЦК ВКП(б) **Андрія Жданова**, який очолив кампанію.", "Під час війни влада трохи послабила контроль: дозволяла писати про любов до рідного краю, згадувати національних героїв. Мільйони солдатів побачили Європу й порівнювали тамтешнє життя з радянським. Почалася **холодна війна**, і Сталін вирішив ізолювати суспільство від Заходу.", "У **серпні 1946 р.** ЦК ВКП(б) засудив ленінградські журнали «Звезда» й «Ленинград» за твори Анни Ахматової й Михайла Зощенка. Після цього партійне керівництво республік почало такі самі кампанії."], "imgs": [{"key": "zhdanov", "cap": "Андрій Жданов (1896 – 1948). Фото: Unknown, dedicated to Bettmann Archive / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Ждановщина", "title": "Ждановщина в Україні", "badges": ["НМТ: поняття"], "paras": ["У 1946 – 1947 рр. ЦК КП(б)У ухвалив кілька постанов про «ідеологічні помилки» театрів, журналів, Інституту історії України. Письменників, учених, митців звинувачували в **«українському буржуазному націоналізмі»** — так влада називала будь-який твір про українську історію й культуру, де не згадано «дружби з великим російським народом».", "У **1947 р.** критикували **Максима Рильського**, **Юрія Яновського**, історика **Миколу Петровського**, у **1951 р.** — вірш **Володимира Сосюри** «Любіть Україну» й оперу **Костянтина Данькевича** «Богдан Хмельницький». Композитора **Бориса Лятошинського** звинуватили у «формалізмі» за Другу симфонію.", "У **1947 р.**, коли КП(б)У тимчасово очолив Лазар Каганович, кампанія стала особливо жорсткою."], "imgs": [{"key": "kaganovich", "cap": "Лазар Каганович — перший секретар ЦК КП(б)У в березні – грудні 1947 р. Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "doc", "title": "Постанови ЦК КП(б)У (1946 – 1947 рр.)", "quote": ["**Про репертуар театрів (12 жовтня 1946 р.):** «…Драматурги, театральні критики повинні приділити особливу увагу вихованню трудящих мас українського народу в дусі непохитної дружби радянських народів, **любові до великого російського народу** і ненависті до всіх ворогів радянського ладу, в тому числі до найлютіших ворогів українського народу — українсько-німецьких націоналістів».", "**Про Інститут історії України (29 серпня 1947 р.):** «…Основна помилка авторів робіт з історії України полягає в тому, що вони замість того, щоб розглядати історію України в тісному зв’язку з історією російського, білоруського та інших народів Радянського Союзу, ідуть шляхом українських націоналістів… **починаючи і слідуючи в цьому питанні курсу Грушевського „Історія України-Руси“**»."], "source": "Постанови ЦК КП(б)У (уривки; друга — переклад з російської)", "comment": ["Партія прямо вказувала, про що писати драматургам і як писати історикам: історію України дозволяли подавати лише як частину спільної історії з Росією.", "Посилання на Грушевського було звинуваченням: його погляд на українців як на окремий народ зі своєю історією влада вважала націоналістичним.", "__Слова з документа:__ **репертуар** — перелік вистав театру."], "img": null}, {"type": "text", "kicker": "Космополітизм", "title": "Боротьба з «космополітизмом» (1949 – 1953)", "badges": ["НМТ: поняття"], "paras": ["**Що означало це слово.** **К

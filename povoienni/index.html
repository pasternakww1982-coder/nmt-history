ія веде» Павло Тичина надрукував у листопаді 1933 р., у розпал Голодомору. Відтоді він писав переважно на славу партії й Сталіна.", "src": "нове (за зразком ЗНО)"}, {"id": "n245", "q": "Чого вимагав від митців метод соціалістичного реалізму?", "sec": "s6", "g": "socrealizm", "t": "single", "opts": ["зображувати світ через особисті переживання, символи й натяки", "наслідувати давньоруські ікони й народний декоративний розпис", "відмовитися від сюжету й творити абстрактні композиції", "показувати радянське життя героїчним і щасливим, славити партію"], "ok": [3], "expl": "Соціалістичний реалізм вимагав показувати героїчну працю й щасливе радянське життя під проводом партії, а злиднів і репресій не помічати.", "src": "нове (за зразком ЗНО)"}, {"id": "n246", "q": "Хто з поетів у 1918 – 1919 рр. воював в армії УНР, а згодом став відомим радянським поетом?", "sec": "s6", "g": "sosiura_unr", "t": "single", "opts": ["Володимир Сосюра", "Максим Рильський", "Андрій Малишко", "Павло Тичина"], "ok": [0], "expl": "Володимир Сосюра в 1918 – 1919 рр. воював в армії УНР, потім перейшов до Червоної армії, а в 1920-ті рр. належав до «Плугу», «Гарту» й ВАПЛІТЕ.", "src": "нове (за зразком ЗНО)"}, {"id": "n247", "q": "Які теми влада вимагала висвітлювати в літературі й мистецтві повоєнних років?", "sec": "s6", "g": "lit_temy", "t": "single", "opts": ["правду про Голодомор і репресії 1930-х рр. в Україні", "перемогу у війні під проводом партії й працю на відбудові", "історію УНР і героїв визвольних змагань 1917 – 1921 рр.", "життя й успіхи українських емігрантів у країнах Заходу"], "ok": [1], "expl": "Влада вимагала писати про перемогу у війні й відбудову «під проводом партії і тов. Сталіна». За твори про українську історію без «дружби з російським народом» звинувачували в націоналізмі.", "src": "нове (за зразком ЗНО)"}, {"id": "n214", "q": "Скільки єпископів УГКЦ узяли участь у Львівському «соборі» 1946 р.?", "sec": "s2", "g": "sobor_lehit", "t": "single", "opts": ["жодного", "лише митро  учителя (№ 325)"}, {"id": "m2s7_5", "q": "Встановіть хронологічну послідовність подій", "sec": "s7", "g": "", "t": "seq", "opts": ["завершення звільнення території України від нацистів", "завершення Другої світової війни", "ліквідація УГКЦ на території Східної Галичини", "здійснення операції «Вісла»"], "expl": "Вигнання окупантів з України завершилося 1944 р., Друга світова — 1945 р., УГКЦ у Галичині ліквідували 1946 р., «Вісла» — 1947 р.", "src": "кахут учителя (№ 133)"}, {"id": "m2s7_6", "q": "Що спільного в операцій «Вісла» і «Захід»?", "sec": "s7", "g": "", "t": "single", "opts": ["обидві стосувалися лише польського населення", "обидві відбулися на території західних областей УРСР", "обидві — примусові виселення українців 1947 р.", "обидві провела польська влада з дозволу Москви"], "ok": [2], "expl": "Обидві операції 1947 р. — примусові виселення українців, щоб позбавити УПА підтримки. Але «Віслу» провела польська влада в Польщі, а «Захід» — радянська в західних областях УРСР.", "src": "нове (власне)"}, {"id": "m2s7_7", "q": "Яка подія відбулася 1949 р.?", "sec": "s7", "g": "", "t": "single", "opts": ["загибель головного командира УПА Романа Шухевича", "Львівський «собор», що скасував Берестейську унію", "ліквідація греко-католицької церкви на Закарпатті", "операція «Захід» у західних областях УРСР"], "ok": [2], "expl": "Львівський «собор» — 1946 р., «Захід» — 1947 р., загибель Шухевича — 1950 р. На Закарпатті греко-католицьку церкву ліквідували 1949 р.", "src": "нове (власне)"}, {"id": "m2s7_8", "q": "Коли помер Йосип Сталін?", "sec": "s7", "g": "", "t": "single", "opts": ["у березні 1953 р.", "у лютому 1956 р.", "у березні 1950 р.", "у травні 1945 р."], "ok": [0], "expl": "Сталін помер у березні 1953 р. Після цього закрили «справу лікарів» і почалася відлига.", "src": "нове (власне)"}]}}, "tests": {"t1": {"name": "Тест 1 · допуск", "tasks": [{"id": "T1.1", "n": 1, "t": "single", "q": "Про яку міжнародну організацію йдеться в цитованому документі? «Засідання рекомендує, щоб Українська Радянська Соціалістична Республіка і Білоруська Радянська Соціалістична Республіка були запрошені стати членами-засновниками пропонованої Міжнародної Організації…»", "sec": "", "g": "", "opts": ["Лігу Націй", "Організацію Варшавського Договору", "Організацію Об’єднаних Націй", "Раду Економічної Взаємодопомоги"]}, {"id": "T1.2", "n": 2, "t": "single", "q": "Хто очолював урядові делегації Української РСР на Сан-Франциській (1945 р.), Паризькій (1946-1947 рр.) та Дунайській (1948 р.) міжнародних конференціях?", "sec": "", "g": "", "opts": ["Д. Мануїльський", "М. Підгорний", "Л. Каганович", "М. Хрущов"]}, {"id": "T1.3", "n": 3, "t": "single", "q": "На картосхемі заштриховано територію, що увійшла до складу УРСР на підставі договору між СРСР та", "sec": "", "g": "", "img": ["q_8a7fb0edc3"], "opts": ["Угорщиною.", "Чехословаччиною.", "Румунією.", "Польщею."]}, {"id": "T1.4", "n": 4, "t": "single", "q": "Що стало причиною явища в історії СРСР та УРСР, відображеного в уривку з історичного джерела: «…у нас фактично відсутні вартісні відношення, а ціни не грають ролі. Головне - централізований розподіл...»?", "sec": "", "g": "", "opts": ["зовнішньополітична ізоляція", "споживацькі настрої в суспільстві", "політико-ідеологічна криза", "командно-адміністративна система"]}, {"id": "T1.5", "n": 5, "t": "single", "q": "Чи відображено в уривках з історичних джерел особливості економічного розвитку УРСР у період післявоєнної відбудови (1945 - початок 1950-х рр.)? 1. «...Характерним для цього періоду було суттєве зниження плану закупівель зерна, підвищення у 1,5 - 2 рази цін на сільськогосподарську продукцію, збільшення капіталовкладень у сільське господарство». 2. «...Темпи промислового розвитку Західної України були вищими, ніж на сході УРСР. У роки четвертої п’ятирічки тут споруджено понад 2,5 тис. великих і середніх промислових підприємств».", "sec": "", "g": "", "opts": ["Відображено в обох уривках.", "Тільки в першому.", "Тільки в другому.", "Не відображено в жодному з уривків."]}, {"id": "T1.6", "n": 6, "t": "single", "q": "Укажіть перелік ключових термінів і понять, які використовуються для характеристики процесу радянізації західних областей України після Другої світової війни:", "sec": "", "g": "", "opts": ["раднаргоспи, колективізація, депортація, прискорення, політична реабілітація;", "індустріалізація, колективізація, «культурна революція», депортація, репресії;", "індустріалізація, кооперація, волюнтаризм, «культурна революція», депортація;", "операція «Вісла», розкуркулювання, мобілізація, голодомор, «саморозпуск» УГКЦ."]}, {"id": "T1.7", "n": 7, "t": "single", "q": "Суть політики радянізації західних областей України в період післявоєнної відбудови (1945 - початок 1950-х років) полягала в", "sec": "", "g": "", "opts": ["переселенні українців західних областей до центральних і східних областей УРСР.", "репресіях проти священиків Української греко-католицької церкви.", "уніфікації всіх сфер життя відповідно до норм, утверджених у СРСР.", "придушенні збройної боротьби підпілля ОУН і загонів УПА."]}, {"id": "T1.8", "n": 8, "t": "single", "q": "Уривок з історичного джерела «Улітку 1946 р. потік сільського населення з центральних і південних областей у західні області України не зменшився. У червні органами транспортної міліції УРСР було знято тільки з товарних поїздів 62 400 осіб, а за дві останні декади липня - 97 633 особи…» доречно використовувати, характеризуючи", "sec": "", "g": "", "opts": ["розгортання «радянізації» на Західній Україні.", "масштаби повоєнного голоду.", "проведення операції «Вісла».", "придушення збройного опору УПА."]}, {"id": "T1.9", "n": 9, "t": "single", "q": "На фото зображено", "sec": "", "g": "", "img": ["q_7edbd70806"], "opts": ["ініціатора створення Української автокефальної православної церкви", "фундатора Української православної церкви Київського патріархату", "митрополита Української греко-католицької церкви", "активного учасника неканонічного Львівського церковного собору ливий у радянській культурі конфлікт - це конфлікт доброго й найліпшого». Незабаром вона перетворилась на культурну настанову, за якої усі радянські митці, письменники та інтелігенція в своїй творчості мали притримуватись основної лінії Партії.", "Газети таврували «безрідних космополітів» — літературних і театральних критиків, композиторів, учених, здебільшого євреїв за походженням, — за «низькопоклонство перед Заходом» і «зневагу до всього вітчизняного»; їх виключали зі спілок і звільняли з роботи.", "Якщо б виявилось, що атомна зброя - це щось дешеве…, ми напевно скотились би назад в період варварства… Однак, це надзвичайно дорога зброя, виготовити яку важче, ніж озброїти цілу сучасну армію і вона буде перебувати тільки в руках кількох розвинутих держав. Скоріше за все, це ознаменує відносну стабільність ціною нескінченного «миру без миру»."], "left": ["Лисенківщина", "Холодна війна", "Ждановщина", "Операція «Вісла»"]}, {"id": "T2.23", "n": 23, "t": "match", "q": "Встановіть відповідність між поняттями та візуальними джерелами", "sec": "", "g": "", "img": ["q_57caf2801a"], "opts": ["новий порядок", "план «Барбаросса»", "операція «Вісла»", "холодна війна", "світова війна"], "left": ["А", "Б", "В", "Г"]}, {"id": "T2.24", "n": 24, "t": "match", "q": "Встановіть відповідність", "sec": "", "g": "", "img": ["q_25c135377c"], "opts": ["Олександр Богомолець", "Максим Рильський", "Павло Тичина", "Володимир Філатов", "Сергій Лебедєв"], "left": ["А", "Б", "В", "Г"]}, {"id": "T2.25", "n": 25, "t": "seq", "q": "Встановіть хронологічну послідовність подій", "sec": "", "g": "", "opts": ["початок останнього голоду в УРСР", "«саморозпуск» Української греко-католицької церкви", "проведення операції «Вісла»", "входження Закарпаття до складу УРСР"]}, {"id": "T2.26", "n": 26, "t": "seq", "q": "Установіть послідовність подій.", "sec": "", "g": "", "opts": ["початок кампанії проти «безрідних космополітів»", "обмін ділянками територій між СРСР і Польщею", "УРСР стала однією із засновниць const SHELL_URL = "../kurs11/";
const TOPIC = "povoienni";
/* Мобільний урок: рендер карток, навігація, прогрес, перегляд зображень.
   Дані: LESSONS (масив частин), IMGS (ключ → {src,w,h}), MODE ('all' | 'one'), NEXT_FILE (для окремого файлу). */
const TITLE = typeof COURSE_TITLE === 'string' ? COURSE_TITLE : 'Стародавня історія України';
const PFX = typeof STORE_PREFIX === 'string' ? STORE_PREFIX : 'mob_';
const PARTS_WORD = typeof COURSE_PARTS_WORD === 'string' ? COURSE_PARTS_WORD : 'три частини';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} }
};
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const BRAND = typeof COURSE_BRAND === 'string' ? COURSE_BRAND : '';
const brandHtml = () => BRAND ? `<p class="brand">${esc(BRAND)}</p>` : '';
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b class="a">$1</b>').replace(/__([^_].*?)__/g, '<b class="a2">$1</b>');
const paras = ps => `<div class="txt">${(ps || []).map(p => `<p>${md(p)}</p>`).join('')}</div>`;

function im(key) { return IMGS[key]; }
function fig(ref, boxed) {
  if (!ref || !im(ref.key)) return '';
  const i = im(ref.key), cap = ref.cap || '';
  return `<figure class="fig"><div class="pic${boxed ? ' boxed' : ''}" data-src="${i.src}" data-cap="${esc(cap)}">
    <img src="${i.src}" width="${i.w}" height="${i.h}" alt="${esc(cap)}" loading="lazy"><span class="zoom-hint">⤢</span></div>
    ${cap ? `<figcaption class="cap">${capHtml(cap)}</figcaption>` : ''}</figure>`;
}
function chips(b) {
  if (!b || !b.length) return '';
  return `<div class="chips">${b.map(x => `<span class="chip${/поза програмою/i.test(x) ? ' off' : /документ/i.test(x) ? ' doc' : ''}">${esc(x)}</span>`).join('')}</div>`;
}
const h2 = t => t ? `<h2>${md(t)}</h2>` : '';
/* підпис: опис — звичайним шрифтом, автор і ліцензія — дрібно, щоб не відволікали від зображення */
const CREDIT = /((?:^|[.;,]\s+|\s)(?:Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення)[^:]{0,25}:.*|(?:^|[.;,]\s+)(?:Суспільне надбання|Public domain|Wikimedia Commons|CC BY|CC0).*|\s*\((?:фото|малюнок)[^)]*\)\s*)$/i;
function capHtml(cap) {
  if (!cap) return '';
  const m = String(cap).match(CREDIT);
  if (!m || m.index === 0 && !/^\s*(Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення|Суспільне|Public|Wikimedia|CC)/i.test(cap)) return md(cap);
  const head = cap.slice(0, m.index).replace(/[.;,\s]+$/, ''), tail = m[0].replace(/^[.;,\s]+/, '');
  return `${head ? md(head) + (/[.!?…»]$/.test(head) ? '' : '.') + ' ' : ''}<span class="cr">${esc(tail)}</span>`;
}

const PERIODS_DEFAULT = null;
const R = {
  text(c) {
    let imgs = '';
    const L = c.imgs || [];
    if (L.length) {
      imgs = fig(L[0]);
      if (L.length === 2) imgs += fig(L[1]);
      if (L.length > 2) imgs += `<div class="grid2">${L.slice(1).map(i => fig(i, true)).join('')}</div>`;
    }
    const tip = c.tip ? `<div class="tip">${/Порада/.test(c.tip[0]) ? '' : '<span class="lbl">Порада для НМТ</span>'}${c.tip.map(t => `<p>${md(t)}</p>`).join('')}</div>` : '';
    const sc = c.scheme ? `<div class="scheme"><div class="h">${esc(c.scheme.h)}</div><div class="muted">${esc(c.scheme.top)}</div>
      <div class="two"><div><b>${esc(c.scheme.left[0])}</b>${esc(c.scheme.left[1])}</div><div><b>${esc(c.scheme.right[0])}</b>${esc(c.scheme.right[1])}</div></div>
      <div class="muted">${esc(c.scheme.note)}</div></div>` : '';
    return `${chips(c.badges)}${h2(c.title)}${paras(c.paras)}${sc}${tip}${imgs}`;
  },
  carousel(c, id) {
    const its = c.items.map((it, i) => `<div class="it">${fig({ key: it.key, cap: '' }, true)}
      ${it.name ? `<h3>${esc(it.name)}</h3>` : ''}<p>${md(it.desc)}</p>${it.cap ? `<div class="cap">${capHtml(it.cap)}</div>` : ''}</div>`).join('');
    return `${chips(c.badges)}${h2(c.title)}<div class="car" id="car${id}">${its}</div>
      ${c.items.length > 1 ? `<div class="dots" id="dots${id}">${c.items.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><div class="swipe">гортайте вбік →</div>` : ''}
      ${c.note ? `<div class="tip"><p>${md(c.note)}</p></div>` : ''}${c.credits ? `<div class="cap"><span class="cr">Фото: ${esc(c.credits)}</span></div>` : ''}`;
  },
  defs(c) {
    return `${chips(c.badges)}${h2(c.title)}<div class="defs">${c.items.map(it => `<div class="def"><h3>${md(it.name)}</h3>${paras(it.paras)}${it.img ? fig(it.img) : ''}</div>`).join('')}</div>
      ${c.note ? `<div class="tip"><p>${md(c.note)}</p></div>` : ''}`;
  },
  map(c, id) {
    const st = c.steps;
    const btns = st.length > 1 ? `<div class="steps" id="st${id}" style="grid-template-columns:repeat(${st.length},1fr)">${st.map((x, i) =>
      `<button class="${i === 0 ? 'on' : ''}" data-i="${i}">${esc(x.label)}</button>`).join('')}</div>` : '';
    return `<div class="chips"><span class="chip">Карта</span></div>${h2(c.title)}${btns}<div id="mp${id}">${fig({ key: st[0].key, cap: c.cap || '' })}</div>
      <div class="rot">Натисніть на карту, щоб збільшити. Зручніше дивитися, повернувши телефон горизонтально.</div>`;
  },
  monument(c) { return `${chips(c.badges)}${h2(c.title)}${fig(c.img)}${paras(c.paras)}`; },
  doc(c) {
    return `<div class="chips"><span class="chip doc">Документ</span></div>${h2(c.title)}
      <div class="quote">${c.quote.map(q => `<p>${md(q)}</p>`).join('')}<div class="src">${esc(c.source)}</div></div>
      ${c.img ? fig(c.img) : ''}<div class="sub">${paras(c.comment)}</div>`;
  },
  cols(c) {
    return `${chips(c.badges)}${h2(c.title)}${c.intro ? `<p>${md(c.intro)}</p>` : ''}${c.blocks.map(b => `<div class="sub"><h3>${md(b.h)}</h3>${paras(b.paras)}</div>`).join('')}`;
  },
  table(c) {
    const head = c.rows[0];
    return `${h2(c.title)}${c.rows.slice(1).map(r => `<div class="trow"><h3>${md(r[0])}</h3>${r.slice(1).map((v, j) =>
      `<div class="kv"><span>${esc(head[j + 1])}</span><div>${md(v)}</div></div>`).join('')}</div>`).join('')}`;
  },
  tl_events(c) {
    return `<div class="chips"><span class="chip">НМТ: дата</span></div>${h2(c.title)}<div class="tlv">${c.items.map(e => `<div class="ev"><i style="background:${e.color}"></i>
      <span class="y${e.prog ? ' yprog' : ''}">${esc(e.year)}</span><b>${md(e.name)}</b><span>${md(e.desc)}</span></div>`).join('')}</div>
      <div class="legend"><span class="sw"></span>дата з програми НМТ</div>${c.note ? `<div class="muted"><p>${md(c.note)}</p></div>` : ''}`;
  },
  tl_periods(c) {
    const X = v => (100 * (v - c.x_from) / (c.x_to - c.x_from));
    const rows = c.rows.map(r => `<div class="row"><div class="nm">${md(r.name)}</div><div class="tr">${r.segs.map(g =>
      `<div class="sg" style="left:${X(g.a)}%;width:${Math.max(1.2, X(g.b) - X(g.a))}%;background:${g.color}"></div>`).join('')}</div>
      ${r.segs.some(g => g.sub) ? `<div class="sb">${r.segs.filter(g => g.sub).map(g => md(g.sub)).join(' · ')}</div>` : ''}</div>`).join('');
    const ev = c.events.map(([v, l]) => `<div class="evl" style="left:${X(v)}%"></div><div class="evt" style="left:${X(v)}%">${esc(String(l).replace(/ ?до н\.е\.| ?р\.$/g, ''))}</div>`).join('');
    const ax = `<div class="ax">${c.prog.map(([a, b]) => `<div class="pr" style="left:${X(a)}%;width:${X(b) - X(a)}%"></div>`).join('')}
      ${c.ticks.map(([v, l], i) => `<div class="tk${i % 2 ? ' lo' : ''}" style="left:${X(v)}%">${esc(l)}</div>`).join('')}</div>`;
    const pr = c.prog.length ? `<div class="legend"><span class="sw"></span>${c.prog.map(p => esc(p[2])).join(' · ')} — дата з програми НМТ</div>` : '';
    return `<div class="chips"><span class="chip">НМТ: дата</span></div>${h2(c.title)}<div class="gp">${ev}${rows}${ax}</div>${pr}
      ${c.note ? `<div class="muted"><p>${md(c.note)}</p></div>` : ''}`;
  },
  chrono() {
    const m = ['2000 р.<br>до н.е.', '1000 р.<br>до н.е.', '1 р. н.е.<br><b class="a2">Різдво Христове</b>', '1000 р.<br>н.е.', '2000 р.<br>н.е.'];
    return `<h2>Шкала часу</h2><div class="ends"><span>← давніше</span><span>ближче до нас →</span></div>
      <div class="scale"><div class="line"></div><div class="marks">${m.map(a => `<div class="m"><i></i><span>${a}</span></div>`).join('')}</div></div>
      <p class="cap">До н.е. рахунок іде назад: 2000 р. до н.е. давніше, ніж 1000 р. до н.е.</p>`;
  },
  periods(c) {
    const rows = c.rows.map((p, i) => `${i === 0 ? '<div class="pgroup">Кам’яний вік</div>' : i === 3 ? '<div class="pgroup">Доба металів</div>' : ''}
      <div class="per"><div class="c" style="background:${p[5]}"></div><div><h3>${p[0]}</h3>${p[1] ? `<div class="s">${p[1]}</div>` : ''}
       <div class="d">${p[2]}</div><div class="r"><span>Знаряддя:</span> ${p[3]}</div><div class="r"><span>Нове:</span> ${p[4]}</div></div></div>`).join('');
    return `${chips(c.badges)}${h2(c.title)}<p>${md(c.intro)}</p>${rows}`;
  },
  generic(c) {
    const groups = [[]];
    c.blocks.forEach(b => { if (b.k === 'sep') groups.push([]); else groups[groups.length - 1].push(b); });
    const g = groups.filter(x => x.length);
    const rb = b => b.k === 'h' ? `<h3 class="${b.light ? 'l' : ''}">${md(b.text)}</h3>` : b.k === 'date' ? `<span class="pill">${md(b.text)}</span>`
      : b.k === 'img' ? fig(b) : b.k === 'muted' ? `<div class="muted">${(b.paras || []).map(p => `<p>${md(p)}</p>`).join('')}</div>` : paras(b.paras);
    const body = g.map(x => {
      const asPanel = g.length > 1 && x.some(b => b.k === 'h' || b.k === 'date');
      return asPanel ? `<div class="sub">${x.map(rb).join('')}</div>` : x.map(rb).join('');
    }).join('');
    return `${chips(c.badges)}${h2(c.title)}${body}`;
  },
};

/* ---------- навігація ---------- */
const P = id => LESSONS.find(l => l.id === id);
function secProgress(L, s) { const seen = store.get(`seen_${L.id}-${s.id}`, []).length; return Math.min(seen, s.cards.length); }
function partProgress(L) { let a = 0, b = 0; L.sections.forEach(s => { a += secProgress(L, s); b += s.cards.length; }); return [a, b]; }

function index() {
  document.title = TITLE;
  const L0 = LESSONS[0];
  /* тема «лише уроки» в спільній оболонці: посилання назад на полицю тем (у повному курсі його додає course.js) */
  const back = typeof SHELL_URL === 'string' && SHELL_URL && typeof LESSONS_ONLY !== 'undefined' && LESSONS_ONLY ? SHELL_URL : '';
  app.innerHTML = `<div class="wrap">${back ? `<a class="lnk tback" href="${back}">← Усі теми</a>` : ''}
    <div class="hero"><img src="${im(L0.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L0.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(TITLE)}</h1>
      <div class="sub">Мобільна версія презентацій: ${PARTS_WORD}, кожна поділена на короткі розділи.</div></div>
    <div class="h2">Частини</div><div class="sec-list">${LESSONS.map(L => {
      const [a, b] = partProgress(L);
      return `<button class="part-btn" data-go="${L.id}"><span class="th"><img src="${im(L.cover.key).src}" alt=""></span>
        <span><h3>${esc(L.part)}</h3><div class="st">${a ? `Переглянуто ${a} з ${b} карток` : `${L.sections.length} розділів`}</div>
        <div class="prog-mini"><i style="width:${Math.round(100 * a / b)}%"></i></div></span></button>`; }).join('')}</div>
    <p class="cap" style="margin-top:18px">Прогрес зберігається лише на цьому пристрої.${back ? ' Бліци й тести з цієї теми з’являться згодом.' : ''}</p>${brandHtml()}</div>`;
  wireGo(); window.scrollTo(0, 0);
}

function partHome(L) {
  document.title = `${L.part} — ${TITLE}`;
  const i = LESSONS.indexOf(L), next = LESSONS[i + 1];
  const secs = L.sections.map(s => {
    const seen = secProgress(L, s), n = s.cards.length, done = seen >= n;
    return `<button class="sec-btn${done ? ' done' : ''}" data-go="${L.id}-${s.id}"><span class="num">${done ? '✓' : s.num}</span>
      <span><h3>${md(s.title)}</h3><div class="st">${seen ? `Переглянуто <b>${seen} з ${n}</b>` : `${n} карток`}</div>
      <div class="prog-mini"><i style="width:${Math.round(100 * seen / n)}%"></i></div></span></button>`;
  }).join('');
  const nextBtn = next ? `<button class="btn" data-go="${next.id}" style="margin-top:20px">Далі: ${esc(next.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:20px" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>
       <p class="cap">Посилання працює, якщо файли лежать в одній папці.</p>` : '');
  app.innerHTML = `${MODE === 'all' ? `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${L.num}</span></div></div>` : ''}
  <div class="wrap">
    <div class="hero"><img src="${im(L.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(L.title)}</h1>
      <div class="part">${esc(L.part)}</div><div class="sub">${esc(L.sub)}</div></div>
    <div class="h2">Розділи</div><div class="sec-list">${secs}</div>
    ${L.program ? `<div class="h2">Що треба знати для НМТ</div><section class="card">${R.generic({ ...L.program, title: '' })}</section>` : ''}
    ${nextBtn}
  </div>`;
  wireGo(); window.scrollTo(0, 0);
}

let obs = null;
function section(L, s) {
  document.title = `${s.num}. ${s.title} — ${TITLE}`;
  const k = L.sections.indexOf(s), next = L.sections[k + 1], nextPart = LESSONS[LESSONS.indexOf(L) + 1];
  const cards = s.cards.map((c, i) => `<section class="card" data-i="${i}">${(R[c.type] || R.generic)(c, i)}</section>`).join('');
  let end = next ? `<button class="btn" data-go="${L.id}-${next.id}">Далі: розділ ${next.num}. ${esc(next.title)} →</button>`
    : nextPart ? `<button class="btn" data-go="${nextPart.id}">Далі: ${esc(nextPart.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>` : '');
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="${L.id}">← Розділи</button><span class="ttl">${s.num}. ${md(s.title)}</span></div><div class="prog"><i id="pr"></i></div></div>
  <div class="wrap">
    ${s.cover && s.cover.key ? `<div class="hero">${fig(s.cover)}</div>` : ''}
    <div class="sec-head"><div class="kick">Частина ${L.num} · розділ ${s.num}</div><h1>${md(s.title)}</h1><div class="sub">${md(s.sub)}</div></div>
    <div class="cards">${cards}</div>
    <div class="end">${end}<button class="btn ghost" data-go="${L.id}">До розділів</button></div>
  </div>`;
  wireGo();
  s.cards.forEach((c, i) => {
    if (c.type === 'carousel' && c.items.length > 1) {
      const car = document.getElementById('car' + i), dots = document.getElementById('dots' + i).children;
      car.addEventListener('scroll', () => {
        const kk = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 12));
        [...dots].forEach((d, j) => d.classList.toggle('on', j === kk));
      }, { passive: true });
    }
    if (c.type === 'map' && c.steps.length > 1) {
      const st = document.getElementById('st' + i), mp = document.getElementById('mp' + i);
      st.querySelectorAll('button').forEach(b => b.onclick = () => {
        st.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
        mp.innerHTML = fig({ key: c.steps[+b.dataset.i].key, cap: c.cap || '' });
      });
    }
  });
  const key = `seen_${L.id}-${s.id}`, seen = new Set(store.get(key, []));
  if (obs) obs.disconnect();
  obs = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { seen.add(+e.target.dataset.i); store.set(key, [...seen]); } });
  }, { threshold: 0.35 }) : null;
  if (obs) app.querySelectorAll('.card').forEach(el => obs.observe(el));
  window.scrollTo(0, 0);
}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {

}
function zoomAt(ns, px, py) {

}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {

/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */

const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };

lbv.addEventListener('touchstart', e => {
  e.preventDefault();

    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };

/* Курс: вхід учня, бліци після частин, замки, Тест 1 і Тест 2, відправлення результатів у Google-таблицю.
   Дані: QUIZ ({blitz:{1:{n,pass,quota,pool}}, tests:{t1:{tasks}}}), COURSE_API (адреса Apps Script). */
const API = (typeof COURSE_API === 'string' && COURSE_API) || '';
const LET = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Є'];
const TYPE = { single: 'Одна правильна відповідь', three: 'Три правильні з семи', seq: 'Послідовність', match: 'Відповідність' };
const LBLRE = /^(?:Місцезнаходження |Місце |малюнок )?([А-ЕЄ]|\d)$/;
const isLbl = q => q.opts.every(o => LBLRE.test(o));
const lab = (q, j, k) => isLbl(q) && !(q.t === 'seq' && q.oimg) ? q.opts[j].match(LBLRE)[1] : q.t === 'three' ? k + 1 : LET[k];
/* порядок показу в бліці: мітки — як є (послідовність із мітками — за абеткою), решта — навмання */
function showOrder(q) {
  const idx = [...q.opts.keys()];
  if (!isLbl(q) || (q.t === 'seq' && q.oimg)) return shuffle(idx);
  return q.t === 'seq' ? idx.sort((a, b) => q.opts[a].localeCompare(q.opts[b], 'uk')) : idx;

/* відповідність, де рядки — літери із зображення (А–Г): варіанти нумеруємо цифрами, щоб літери рядків і варіантів не плуталися */
const rowLet = q => !!q.left && q.left.every(l => /^[А-Г]$/.test(l));
const MLB = q => rowLet(q) ? ['1', '2', '3', '4', '5'] : LET;
const mrowHead = (q, l, i) => rowLet(q) ? `<b>Зображення ${l}</b>` : `<b>${i + 1}.</b> ${q.rimg ? pic(q.rimg[i], 'ri') : ''}${/^\d$/.test(l) ? '' : md(l)}`;
const mlist = (q, order) => isLbl(q) ? '' : `<div class="mlist">${order.map((j, k) => `<div class="mo"><b class="a2">${MLB(q)[k]}</b> ${optHtml(q, j)}</div>`).join('')}</div>`;
const maxOf = q => q.t === 'single' ? 1 : q.t === 'match' ? 4 : 3;
function grade12(pc) { const t = [25, 33, 41, 49, 56, 63, 70, 77, 84, 91]; let g = 2; t.forEach((v, k) => { if (pc >= v) g = k + 3; }); return g; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* кількість частин курсу = кількість бліців; короткі перевірки після розділів — QUIZ.mini['<частина>-<розділ>'] */
const NP = Object.keys(QUIZ.blitz || {}).length || 3;
const PARTS_N = Array.from({ length: NP }, (_, i) => i + 1);

const PASS = n => (QUIZ.blitz[n] && QUIZ.blitz[n].pass) || 75;
/* спільна оболонка кількох тем: один вхід на сторінці оболонки (SHELL_URL), учень — у спільному сховищі hist_*,
   прогрес теми — під власним префіксом; кожен запит до сервера несе позначку теми (TOPIC) */
const SH = (typeof SHELL_URL === 'string' && SHELL_URL) || '';
const TOPIC_ID = (typeof TOPIC === 'string' && TOPIC) || '';
const G_ = {

  set(k, v) { try { localStorage.setItem('hist_' + k, JSON.stringify(v)); } catch (e) {} },

const ukey = u => u ? (u.cls + '|' + u.name).toLowerCase() : '';
if (SH) {   // на телефоні інший учень, ніж той, чий прогрес теми збережено, — прогрес цієї теми стираємо (черга лишається: там свої імена)
  const u = G_.get('user', null), own = store.get('owner', null) ?? ukey(store.get('user', null));

const U = {

/* QUIZ.tests[id].after = N — тест відкривається після бліцу частини N (Тест 2 — ще й після допуску в Тесті 1); без after — Тест 1 після всіх бліців */

/* ---------- зв’язок із сервером: черга, щоб нічого не губилося без інтернету ---------- */
const Net = {
  async call(body) {
    if (!API) throw new Error('no api');
    const u = U.user; if (u && u.pin && body.pin == null) body = { ...body, pin: u.pin };
    if (TOPIC_ID && body.topic == null) body = { ...body, topic: TOPIC_ID };
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), cache: 'no-store', redirect: 'follow' });

  },
  send(op, data) {
    const u = U.user; if (!u) return;
    const q = store.get('queue', []);

  busy: false,
  async flush() {

    this.busy = false; paintSync();

  onTest(sent, res) {

function lockedPart(L, n) {

section = function (L, s) {

    if (end) end.outerHTML = b; else app.querySelector('.end').insertAdjacentHTML('afterbegin', b);

/* ---------- бліц ---------- */
function draw(n, B, seenKey) {
  B = B || QUIZ.blitz[n]; seenKey = seenKey || 'bseen' + n;
  const seen = new Set(store.get(seenKey, [])), used = new Set(), out = [];
  const take = list => { for (const q of list) { if (out.length >= B.n) return; if (out.includes(q) || (q.g && used.has(q.g))) continue; out.push(q); if (q.g) used.add(q.g); return true; } };
  const fresh = list => shuffle(list).sort((a, b) => seen.has(a.id) - seen.has(b.id));
  Object.entries(B.quota || {}).forEach(([sec, k]) => { const c = fresh(B.pool.filter(q => q.sec === sec)); for (let i = 0; i < k; i++) if (!take(c)) break; });
  while (out.length < B.n && take(fresh(B.pool))) {}
  const order = Object.keys(B.quota || {});
  out.sort((a, b) => order.indexOf(a.sec) - order.indexOf(b.sec));
  return out;
}
function pic(key, cls) {
  const i = IMGS[key]; if (!i) return '';
  return `<div class="pic ${cls || ''}" data-src="${i.src}" data-cap=""><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""><span class="zoom-hint">⤢</span></div>`;
}
/* зображення-варіант: вибір — дотиком до плитки, збільшення — лише кнопкою ⤢ */
function opic(key) {
  const i = IMGS[key]; if (!i) return '';
  return `<span class="oi"><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""><span class="zoom-hint pic" data-src="${i.src}" data-cap="">⤢</span></span>`;
}
const optHtml = (q, j) => `${q.oimg ? opic(q.oimg[j]) : ''}${isLbl(q) ? '' : `<span>${md(q.opts[j])}</span>`}`;

const Blitz = {
  /* незавершений бліц зберігається на телефоні: світло, тривога — і можна продовжити з того самого питання */
  draft(n) { const d = store.get('bdraft' + n, null); return d && d.ids && d.i < d.ids.length ? d : null; },
  clearDraft(n) { store.set('bdraft' + n, null); },
  save() { if (this.mini) return; store.set('bdraft' + this.n, { ids: this.qs.map(q => q.id), orders: this.qs.map(q => q.order), i: this.i, pts: this.pts, log: this.log,
    dl: this.dl, sec: this.sec, exits: this.exits }); },
  /* час на питання бліцу (с): строк зберігається в чернетці, тож перезавантаження його не скидає */
  lim(q) { return { single: 40, three: 60, match: 90, seq: 90 }[q.t] || 60; },
  timed() { return !this.mini && !!(QUIZ.blitz[this.n] && QUIZ.blitz[this.n].timer); },
  stopClock() { clearInterval(this.clk); this.clk = null; },
  start(n) {
    this.mini = null; this.n = n;
    const d = store.get('bdraft' + n, null), pool = QUIZ.blitz[n].pool;
    if (d && d.ids && d.ids.every(id => pool.some(q => q.id === id))) {
      this.qs = d.ids.map((id, k) => ({ ...pool.find(q => q.id === id), order: d.orders[k] }));
      this.i = d.i; this.pts = d.pts; this.log = d.log; this.dl = d.dl || null; this.sec = d.sec || 0; this.exits = d.exits || 0;
    } else {
      this.qs = draw(n).map(q => ({ ...q, order: showOrder(q) }));
      this.i = 0; this.pts = 0; this.log = []; this.dl = null; this.sec = 0; this.exits = 0;
      const s = new Set(store.get('bseen' + n, [])); this.qs.forEach(q => s.add(q.id)); store.set('bseen' + n, [...s]);
      this.save();
    }
    this.max = this.qs.reduce((a, q) => a + maxOf(q), 0);
    if (this.i >= this.qs.length) return this.finish();     // відповіли на все, але результат не встигли переглянути
    this.show();
  },
  /* коротка перевірка після розділу: без замка й без оцінки */
  startMini(n, sid) {
    const k = `${n}-${sid}`, M = MINI[k]; this.mini = { n, sid, k }; this.n = n;
    this.qs = draw(n, M, 'mseen' + k).map(q => ({ ...q, order: showOrder(q) }));
    const s = new Set(store.get('mseen' + k, [])); this.qs.forEach(q => s.add(q.id)); store.set('mseen' + k, [...s]);
    this.i = 0; this.pts = 0; this.log = []; this.dl = null; this.sec = 0; this.exits = 0; this.max = this.qs.reduce((a, q) => a + maxOf(q), 0);
    this.show();
  },
  back() { return this.mini ? `p${this.n}-${this.mini.sid}` : `p${this.n}`; },
  top() { return `<div class="bz-top"><span class="cnt">${this.mini ? 'Перевірка' : 'Бліц ' + this.n} · питання ${this.i + 1} з ${this.qs.length}</span>${this.timed() ? '<span class="tm" id="bzt"></span>' : ''}<span class="pts">${this.pts} б.</span>
      <button class="x" data-go="${this.back()}" aria-label="Вийти">✕</button></div>`; },
  show() {
    const q = this.qs[this.i]; this.sel = q.t === 'match' ? [null, null, null, null] : []; this.tout = false; this.stopClock();
    this.shown = Date.now();
    let tiles;
    if (q.t === 'match') {
      tiles = mlist(q, q.order) +
        q.left.map((l, i) => `<div class="mrow"><div class="ml">${mrowHead(q, l, i)}</div><div class="mbtns">${q.order.map((j, k) =>
          `<button class="mb" data-i="${i}" data-j="${j}">${MLB(q)[k]}</button>`).join('')}</div></div>`).join('');
    } else {
      tiles = q.order.map((j, k) => `<button class="tile n${q.oimg ? ' wi' : ''}" data-j="${j}"><span class="l">${lab(q, j, k)}</span>${optHtml(q, j)}</button>`).join('');
      if (q.oimg) tiles = `<div class="tgrid">${tiles}</div>`;
    }
    const act = q.t === 'single' ? '' : `<div class="bz-act"><button class="btn ghost" id="bzr">Скинути</button><button class="btn" id="bzok" disabled>Відповісти</button></div>`;
    app.innerHTML = `<div class="wrap bz-in">${this.top()}<div class="qtype">${TYPE[q.t]}${q.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      <div class="qtext">${md(q.q).replace(/\n/g, '<br>')}</div>${(q.img || []).map(k => pic(k, 'qi')).join('')}
      <div class="tiles" id="tl">${tiles}</div>${act}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const tl = document.getElementById('tl');
    tl.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; this.pick(q, +b.dataset.j); });
    tl.querySelectorAll('.mb').forEach(b => b.onclick = () => { this.sel[+b.dataset.i] = +b.dataset.j; this.paintMatch(); });
    if (q.t !== 'single') {
      document.getElementById('bzr').onclick = () => { this.sel = q.t === 'match' ? [null, null, null, null] : []; q.t === 'match' ? this.paintMatch() : this.paintSel(q); };
      document.getElementById('bzok').onclick = () => this.answer(q);
    }
    if (this.timed()) {
      if (!this.dl) { this.dl = Date.now() + this.lim(q) * 1000; this.save(); }
      const tick = () => {
        const left = Math.ceil((this.dl - Date.now()) / 1000), el = document.getElementById('bzt');
        if (el) { el.textContent = '⏱ ' + Math.max(0, left); el.classList.toggle('warn', left <= 10); }
        if (left <= 0) { this.stopClock(); this.tout = true; this.answer(q); }
      };
      tick(); if (!this.tout) this.clk = setInterval(tick, 500);
    }
  },
  pick(q, j) {
    if (q.t === 'single') { this.sel = [j]; return this.answer(q); }
    const k = this.sel.indexOf(j);
    if (k >= 0) this.sel.splice(k, 1); else if (this.sel.length < (q.t === 'three' ? 3 : 4)) this.sel.push(j);
    this.paintSel(q);
  },
  paintSel(q) {
    document.querySelectorAll('#tl .tile').forEach(b => {
      const j = +b.dataset.j, k = this.sel.indexOf(j), l = b.querySelector('.l, .ord');
      b.classList.toggle('sel', k >= 0);
      if (q.t === 'seq') { l.className = k >= 0 ? 'ord' : 'l'; l.textContent = k >= 0 ? k + 1 : lab(q, j, q.order.indexOf(j)); }
    });
    document.getElementById('bzok').disabled = this.sel.length !== (q.t === 'three' ? 3 : 4);
  },
  paintMatch() {
    document.querySelectorAll('#tl .mb').forEach(b => b.classList.toggle('on', this.sel[+b.dataset.i] === +b.dataset.j));
    document.getElementById('bzok').disabled = this.sel.some(x => x === null);
  },
  answer(q) {
    this.stopClock(); this.dl = null;
    this.sec = (this.sec || 0) + Math.min((Date.now() - (this.shown || Date.now())) / 1000, this.timed() ? this.lim(q) + 5 : 600);
    if (q.t === 'seq' && this.sel.length < 4) this.sel = [];   // незавершена послідовність — 0 балів
    let p = 0; const m = maxOf(q);

    else if (q.t === 'match') p = this.sel.filter((j, i) => j === q.ok[i]).length;
    else if (!this.sel.length) p = 0;
    else if (this.sel.every((j, k) => j === k)) p = 3; else if (this.sel[0] === 0 && this.sel[3] === 3) p = 2; else if (this.sel[0] === 0 || this.sel[3] === 3) p = 1;

      if (q.ok[i] === j) b.classList.add('right'); else if (this.sel[i] === j) b.classList.add('wrong'); });
    document.querySelectorAll('#tl .tile').forEach(b => { const j = +b.dataset.j; b.disabled = true; if (q.t === 'seq') return;
      if (q.ok.includes(j)) b.classList.add('right'); else if (this.sel.includes(j)) b.classList.add('wrong'); else b.classList.add('dim'); });
    const act = document.querySelector('.bz-act'); if (act) act.remove();
    const L2 = j => lab(q, j, q.order.indexOf(j));
    const extra = q.t === 'match' ? `<div>Правильно: ${q.left.map((l, i) => rowLet(q) ? `${l} — ${MLB(q)[q.order.indexOf(q.ok[i])]}` : `${i + 1} — ${L2(q.ok[i])}`).join(', ')}</div>`
      : q.t === 'seq' ? `<div>Правильний порядок: ${q.opts.map((o, j) => L2(j)).join(' → ')}</div>` : '';
    const last = this.i === this.qs.length - 1;
    document.querySelector('.bz-top .pts').textContent = this.pts + ' б.';
    document.querySelector('.bz-in').insertAdjacentHTML('beforeend', `<div class="fb ${p === m ? 'good' : p ? 'part' : 'bad'}">
      <div class="h">${this.tout ? '⏱ Час вийшов. ' : ''}${p === m ? 'Правильно!' : p ? 'Частково правильно' : 'Неправильно'} · ${p} з ${m}</div>${extra}${q.expl ? `<div class="ex">${md(q.expl)}</div>` : ''}</div>
      <button class="btn" id="bzn">${last ? 'Результат' : 'Далі →'}</button>`);
    if (!this.mini) { this.i++; this.save(); this.i--; }
    const nx = document.getElementById('bzn'); nx.onclick = () => { if (last) this.finish(); else { this.i++; this.show(); } };
    nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },
  finishMini() {
    const { n, sid, k } = this.mini, L = LESSONS[n - 1], si = L.sections.findIndex(x => x.id === sid), nxt = L.sections[si + 1];
    const all = store.get('mini', {}); all[k] = { p: this.pts, m: this.max }; store.set('mini', all);
    Net.send('event', { what: 'перевірка', part: n, sec: L.sections[si].num, title: `${this.pts} з ${this.max}` });
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">Перевірка · розділ ${L.sections[si].num}</span><button class="x" data-go="${this.back()}" aria-label="Закрити" style="margin-left:auto">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${this.pts} з ${this.max}</div>
        <div class="gr">${this.pts === this.max ? 'Чудово! Можна йти далі.' : this.pts >= 0.75 * this.max ? 'Добре! Можна йти далі, а помилку варто запам’ятати.' : 'Перегляньте розділ ще раз — і спробуйте знову.'}</div></div>
      <button class="btn" data-go="${nxt ? `p${n}-${nxt.id}` : (U.passed('b' + n) ? 'p' + n : 'blitz' + n)}">${nxt ? 'До наступного розділу →' : (U.passed('b' + n) ? 'До частини' : 'До бліцу частини ' + n + ' →')}</button>
      <button class="btn ghost" data-go="p${n}-${sid}">Повторити розділ</button>
      <button class="btn ghost" id="again">Перевірити ще раз</button></div>`;
    wireGo(); window.scrollTo(0, 0);

  },
  finish() {

    U.setProg('b' + n, { pct: Math.max(pc, prev.pct), pass: pass || !!prev.pass });

      return `<button class="sec-btn" data-go="${L.id}-${s}"><span class="num">${S.num}</span><span><h3>${md(S.title)}</h3><div class="st">помилок: ${c}</div></span></button>`; }).join('');
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">Бліц частини ${n}</span><button class="x" data-go="p${n}" aria-label="Закрити" style="margin-left:auto">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${pc}%</div><div class="cap">${this.pts} з ${this.max} балів</div>
        <div class="gr ${pass ? 'okc' : 'badc'}">${pass ? (n < NP ? `Пройдено! Частину ${n + 1} відкрито.` : 'Пройдено! Тест 1 відкрито, якщо всі бліци пройдено.') : `Потрібно ${PASS(n)} %. Повторіть розділи нижче і спробуйте ще раз.`}</div></div>
      ${pass ? `<button class="btn" data-go="${n < NP ? 'p' + (n + 1) : 'home'}">${n < NP ? `До частини ${n + 1} →` : 'До тестів →'}</button>` : ''}
      <button class="btn ${pass ? 'ghost' : ''}" id="again">Пройти бліц ще раз</button>
      ${weak ? `<div class="h2" style="margin:8px 0 0">Варто повторити</div><div class="sec-list">${weak}</div>` : ''}
      <div class="sync" id="sync"></div></div>`;
    wireGo(); paintSync(); window.scrollTo(0, 0);
    document.getElementById('again').onclick = () => { this.clearDraft(n); this.start(n); };
  },
};

/* ---------- тести (без підказок; бали рахує сервер) ---------- */
const Test = {
  /* ліміт часу (хв) — QUIZ.tests[id].minutes; початок — на телефоні (tstart_) і на сервері (op tstart) */
  started() { return store.get('tstart_' + this.id, null); },
  begin() {
    if (this.started()) return;
    store.set('tstart_' + this.id, Date.now()); store.set('texits_' + this.id, 0);
    Net.send('tstart', { test: this.id });
  },
  leftSec() { const m = this.T.minutes; return m ? Math.ceil((this.started() + m * 60000 - Date.now()) / 1000) : null; },
  stopClock() { clearInterval(this.clk); this.clk = null; },
  submit(auto) {
    this.stopClock();
    const answers = this.T.tasks.map(t => this.ans[t.n] == null ? null : this.ans[t.n]);
    const st = this.started(), sec = st ? Math.round((Date.now() - st) / 1000) : null;
    store.set('draft_' + this.id, null); store.set('tstart_' + this.id, null);
    Net.send('test', { test: this.id, answers, sec, exits: store.get('texits_' + this.id, 0), auto: !!auto });
    this.pending(auto);
  },
  open(id) {
    this.id = id; this.T = QUIZ.tests[id];
    if (store.get('queue', []).some(x => x.op === 'test' && x.test === id)) return this.pending();
    const d = store.get('draft_' + id, null), r = U.prog()[id];
    if (d) { this.ans = d; if (this.started() && this.leftSec() !== null && this.leftSec() <= 0) return this.submit(true); return this.render(); }
    if (r && r.pts != null) return this.result(r);
    this.ans = {}; this.render();
  },
  intro() {
    const T = this.T, n = k => T.tasks.filter(t => t.t === k).length;
    return `<div class="card tintro"><h2>${esc(T.name)}</h2><p>${T.tasks.length} завдань, як на НМТ: ${n('single')} — одна правильна відповідь, ${n('match')} — відповідність, ${n('seq')} — послідовність, ${n('three')} — три з семи.
      Бали — за правилами НМТ.${this.id === 't1' ? ' Щоб отримати допуск до Тесту 2, потрібно <b>75 %</b> балів.' : ''}</p>
      ${T.minutes ? `<p><b>На тест — ${T.minutes} хвилин.</b> Час рахується від першого відкриття тесту й іде, навіть коли ви закриваєте сторінку. Коли час мине, відповіді надішлються самі.</p>` : ''}
      <p class="cap">Підказок під час тесту немає. Відповіді зберігаються на телефоні. Учитель бачить, скільки часу тривав тест і скільки разів ви виходили зі сторінки.</p></div>`;
  },
  render() {
    const T = this.T;
    const nav = T.tasks.map((t, k) => `<a href="#" class="nv${this.done(t) ? ' on' : ''}" data-k="${k}">${t.n}</a>`).join('');
    this.begin(); this.stopClock();
    app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Назад</button><span class="ttl">${esc(T.name)}</span>${T.minutes ? '<span class="tm" id="ttm"></span>' : ''}</div></div>
      <div class="wrap">${this.intro()}<div class="tnav stk" id="tnav">${nav}</div>${T.tasks.map((t, k) => this.task(t, k)).join('')}
      <div class="tsend"><div class="cap" id="tleft"></div><button class="btn" id="tsub">Надіслати відповіді</button></div><div class="dlg" id="dlg" hidden></div></div>`;
    wireGo(); window.scrollTo(0, 0);
    document.getElementById('tnav').onclick = e => { const a = e.target.closest('.nv'); if (!a) return; e.preventDefault();
      document.getElementById('tk' + a.dataset.k).scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    T.tasks.forEach((t, k) => this.wire(t, k));
    document.getElementById('tsub').onclick = () => this.confirm();
    this.left();
    if (T.minutes) {
      const tick = () => {
        const s = this.leftSec(), el = document.getElementById('ttm');
        if (!el) return this.stopClock();
        el.textContent = '⏱ ' + Math.floor(Math.max(0, s) / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
        el.classList.toggle('warn', s <= 300);
        if (s <= 0) this.submit(true);
      };
      tick(); this.clk = setInterval(tick, 1000);
    }
  },
  done(t) { const a = this.ans[t.n]; return t.t === 'match' ? !!a && a.every(x => x !== null) : t.t === 'single' ? a != null : !!a && a.length === (t.t === 'three' ? 3 : 4); },
  task(t, k) {
    const a = this.ans[t.n];
    let body;
    if (t.t === 'match') {
      const sel = a || [null, null, null, null];
      body = mlist(t, [...t.opts.keys()]) +
        t.left.map((l, i) => `<div class="mrow"><div class="ml">${mrowHead(t, l, i)}</div><div class="mbtns">${t.opts.map((o, j) =>
          `<button class="mb${sel[i] === j ? ' on' : ''}" data-i="${i}" data-j="${j}">${MLB(t)[j]}</button>`).join('')}</div></div>`).join('');
    } else {
      const sel = t.t === 'single' ? (a == null ? [] : [a]) : (a || []);
      body = t.opts.map((o, j) => { const k2 = sel.indexOf(j);
        return `<button class="tile n${t.oimg ? ' wi' : ''}${k2 >= 0 ? ' sel' : ''}" data-j="${j}"><span class="${t.t === 'seq' && k2 >= 0 ? 'ord' : 'l'}">${t.t === 'seq' && k2 >= 0 ? k2 + 1 : lab(t, j, j)}</span>${optHtml(t, j)}</button>`; }).join('');
      if (t.oimg) body = `<div class="tgrid">${body}</div>`;
      if (t.t !== 'single') body += `<button class="lnk rst" data-r="1">Скинути відповідь</button>`;
    }
    return `<section class="card task" id="tk${k}"><div class="qtype">Завдання ${t.n} · ${TYPE[t.t]}${t.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      ${t.src ? `<div class="quote"><p>${md(t.src)}</p>${t.srccap ? `<div class="src">${esc(t.srccap)}</div>` : ''}</div>` : ''}
      <div class="qtext">${md(t.q).replace(/\n/g, '<br>')}</div>${(t.img || []).map(x => pic(x, 'qi')).join('')}<div class="tiles">${body}</div>${t.cap ? `<div class="cap"><span class="cr">${esc(t.cap)}</span></div>` : ''}</section>`;
  },
  wire(t, k) {
    const el = document.getElementById('tk' + k);
    const re = () => { el.outerHTML = this.task(t, k); this.wire(t, k); store.set('draft_' + this.id, this.ans);
      document.querySelector(`.nv[data-k="${k}"]`).classList.toggle('on', this.done(t)); this.left(); };
    el.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; const j = +b.dataset.j;
      if (t.t === 'single') this.ans[t.n] = j;
      else { const s = this.ans[t.n] || [], i = s.indexOf(j); if (i >= 0) s.splice(i, 1); else if (s.length < (t.t === 'three' ? 3 : 4)) s.push(j); this.ans[t.n] = s; }
      re(); });
    el.querySelectorAll('.mb').forEach(b => b.onclick = () => { const s = this.ans[t.n] || [null, null, null, null]; s[+b.dataset.i] = +b.dataset.j; this.ans[t.n] = s; re(); });
    const r = el.querySelector('.rst'); if (r) r.onclick = () => { delete this.ans[t.n]; re(); };
  },
  left() { const n = this.T.tasks.filter(t => !this.done(t)).length; document.getElementById('tleft').textContent = n ? `Без відповіді: ${n}` : 'Відповіді є на всі завдання.'; },
  confirm() {
    const n = this.T.tasks.filter(t => !this.done(t)).length, d = document.getElementById('dlg');
    d.hidden = false;
    d.innerHTML = `<div class="dlg-in"><h3>Надіслати відповіді?</h3><p>${n ? `Без відповіді залишилося <b>${n}</b> завд. — за них буде 0 балів.` : 'Відповіді є на всі завдання.'} Змінити відповіді після надсилання не можна.</p>
      <button class="btn" id="dy">Надіслати</button><button class="btn ghost" id="dn">Повернутися до тесту</button></div>`;
    document.getElementById('dn').onclick = () => { d.hidden = true; };
    document.getElementById('dy').onclick = () => this.submit(false);
  },
  pending(auto) {
    this.stopClock();
    app.innerHTML = `<div class="wrap bz-in"><div class="res"><div>${esc(this.T.name)}</div><div class="big">⏳</div>${auto ? '<div class="gr">Час вийшов — відповіді надіслано автоматично.</div>' : ''}
      <div class="cap">Відповіді збережено. Результат з’явиться, щойно телефон зв’яжеться з сервером.</div></div>
      <div class="sync" id="sync"></div><button class="btn ghost" data-go="home">На головну</button></div>`;
    wireGo(); paintSync(); Net.flush();
  },
  result(r) {
    const t1 = this.id === 't1';
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">${esc(this.T.name)}</span><button class="x" data-go="home" style="margin-left:auto" aria-label="Закрити">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${r.pts} з ${r.max}</div><div class="cap">${r.pct}% балів</div>${t1 ? '' : `${r.grade ? `<div class="gr">Оцінка: <b>${r.grade}</b> (з 12)</div>` : ''}<div class="gr">За шкалою НМТ (100–200)${r.max !== 54 ? ', орієнтовно' : ''}: <b>${esc(r.scale)}</b></div>`}
      ${t1 ? `<div class="gr ${r.pass ? 'okc' : 'badc'}">${r.pass ? (testOpen('t2') ? 'Допуск отримано — Тест 2 відкрито.' : `Допуск отримано. Тест 2 відкриється ${testLock('t2')}.`) : 'Потрібно 75 %. Повторіть матеріал і пройдіть тест ще раз.'}</div>` : ''}</div>
      ${r.per ? `<div class="h2" style="margin:8px 0 0">Бали за завданнями</div><div class="tnav">${r.per.map((p, k) => `<span class="nv ${p === maxOf(this.T.tasks[k]) ? 'on' : p ? 'pt' : 'no'}">${k + 1}<i>${p}</i></span>`).join('')}</div>` : ''}
      ${t1 && !r.pass ? `<button class="btn" id="retry">Пройти Тест 1 ще раз</button>` : ''}
      ${t1 && r.pass && testOpen('t2') ? `<button class="btn" data-go="home">До Тесту 2 →</button>` : `<button class="btn ghost" data-go="home">На головну</button>`}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const rb = document.getElementById('retry'); if (rb) rb.onclick = () => { store.set('draft_' + this.id, {}); store.set('tstart_' + this.id, null); this.ans = {}; this.render(); };
  },
};

/* ---------- маршрути ---------- */
const _route = route;
route = function () {
  Blitz.stopClock(); Test.stopClock();     // таймери попередньої сторінки не повинні спрацювати на новій
  const h = location.hash.slice(1);
  if (needLogin() && h) { history.replaceState(null, '', location.pathname); return login(); }
  let m = h.match(/^blitz(\d)$/);
  if (m && QUIZ.blitz[m[1]]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.start(n); }
  m = h.match(/^mini(\d)-(s\d+)$/);
  if (m && MINI[`${m[1]}-${m[2]}`]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.startMini(n, m[2]); }
  m = h.match(/^(t[12])$/);
  if (m) { if (!QUIZ.tests[m[1]] || !testOpen(m[1])) { location.hash = 'home'; return; } return Test.open(m[1]); }
  return _route();
};
window.removeEventListener('hashchange', _route);
window.addEventListener('hashchange', () => route());
route();
Net.flush();

/* ---------- виходи зі сторінки під час бліцу й тесту (учитель бачить їх у таблиці) ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  const h = location.hash.slice(1);
  if (/^blitz\d$/.test(h) && Blitz.n === +h.slice(5) && !Blitz.mini && store.get('bdraft' + Blitz.n, null)) { Blitz.exits = (Blitz.exits || 0) + 1; Blitz.save(); }
  else if (/^t[12]$/.test(h) && store.get('tstart_' + h, null)) store.set('texits_' + h, store.get('texits_' + h, 0) + 1);
});

</script>

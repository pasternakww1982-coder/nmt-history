о героїня звертається як до живих істот — так, як робили це предки-язичники.", "__Слова зі «Слова»:__ **забороло** — верх міської стіни; **лада** — коханий, чоловік; **вої** — воїни; **прилелій** — принеси на хвилях."], "img": null}]}, {"id": "s3", "num": "III", "title": "Архітектура другої половини XI – XIII ст.", "sub": "Успенський, Михайлівський Золотоверхий собори, П’ятницька церква", "cover": {"key": "usp_ruin", "cap": ""}, "cards": [{"type": "monument", "title": "Успенський собор Києво-Печерської лаври", "badges": [], "img": {"key": "uspensky", "cap": "Успенський собор. Фото: George Chernilevsky / Wikimedia Commons, Public domain"}, "paras": ["Це головний храм **Києво-Печерського монастиря**. Зводили його в **1073 – 1078 рр.** коштом князя **Святослава Ярославича**, освятили 1089 р.", "За монастирським переказом, будувати й прикрашати собор приїхали майстри з Константинополя; у них учився іконописець **Аліпій**.", "Наприкінці XVII – у XVIII ст. собор перебудували в стилі **українського бароко**.", "**1941 р.**, під час німецької окупації Києва, собор висадили в повітря. Відбудували його **1998 – 2000 рр.**", "__Як упізнати на НМТ:__ білий бароковий собор із золотими банями й багато прикрашеним фронтоном."]}, {"type": "monument", "title": "Михайлівський Золотоверхий собор", "badges": [], "img": {"key": "mykhail2", "cap": "Михайлівський Золотоверхий собор. Фото: Ivan Sedlovskyi / Wikimedia Commons, CC BY-SA 4.0"}, "paras": ["Собор збудував у **1108 – 1113 рр.** князь **Святополк II Ізяславич** на честь архангела Михаїла, свого небесного покровителя.", "Його баню першою в Києві вкрили позолотою — тому собор прозвали **Золотоверхим**.", "Усередині були **мозаїки й фрески**. Частину їх — мозаїки «Євхаристія» та «Дмитрій Солунський» — зняли зі стін перед руйнуванням храму.", "У XVIII ст. собор перебудували в стилі **українського бароко**. **1937 р.** радянська влада його знищила; відбудовано собор **1997 – 1999 рр.**", "__Як упізнати на НМТ:__ блакитні стіни, золоті бані."]}, {"type": "carousel", "title": "Знищені й відбудовані", "badges": [], "note": "Обидва собори відбудовано за обмірами й фотографіями XIX – XX ст. Частину мозаїк і фресок Михайлівського собору в 1930-х рр. вивезли до Москви й Ленінграда; не всі з них повернуто.", "items": [{"key": "usp_ruin2", "name": "", "desc": "Руїни Успенського собору до відбудови. Фото: khrul / Wikimedia Commons, CC BY 3.0", "cap": ""}, {"key": "myk_ruin", "name": "", "desc": "Підрив Михайлівського собору, 1937 р.", "cap": ""}, {"key": "myk_mosaic", "name": "", "desc": "Мозаїка «Євхаристія» з Михайлівського собору (початок XII ст.), нині в Софійському соборі. Фото: Rasal Hague / Wikimedia Commons, CC BY-SA 4.0", "cap": ""}]}, {"type": "monument", "title": "П’ятницька церква в Чернігові", "badges": [], "img": {"key": "pyatn", "cap": "П’ятницька церква. Фото: Dmytro Petishkin / Wikimedia Commons, CC BY 4.0"}, "paras": ["Церкву звели наприкінці **XII – на початку XIII ст.** на чернігівському торзі. Будівничим вважають **Петра Милонега**, а замовником міг бути князь **Ігор Святославич**.", "Церква невелика за площею, але **висока й струнка**: одна баня, а під нею — арки, що сходинками підіймаються вгору.", "У XVII ст. церкву перебудували в бароковому стилі. **1943 р.** її зруйнували під час бомбардування.", "Після війни архітектор **П. Барановський** відновив церкву такою, якою вона була за княжих часів (роботи закінчено 1962 р.).", "__Як упізнати на НМТ:__ невеличка цегляна церква з однією банею, «сходинки» арок угорі."]}]}, {"id": "s4", "num": "IV", "title": "Іконопис", "sub": "Аліпій Печерський, Вишгородська й Свенська ікони", "cover": {"key": "alipiy_ic", "cap": ""}, "cards": [{"type": "defs", "title": "Аліпій Печерський — перший відомий іконописець", "badges": ["НМТ: персоналія"], "items": [{"name": "Хто він", "paras": ["Чернець **Києво-Печерського монастиря**. Жив у другій половині XI – на початку XII ст., помер близько **1114 р.**"], "img": null}, {"name": "Як навчився", "paras": ["Хлопцем його віддали в науку до **грецьких майстрів**, які оздоблювали Успенський собор.", "Згодом сам писав ікони й підновлював старі."], "img": null}, {"name": "Що приписують", "paras": ["Участь у мозаїках **Михайлівського Золотоверхого собору**.", "Ікону «Велика Панагія» (Ярославська Оранта).", "Первісний образ Свенської ікони.", "Жодної роботи Аліпія достеменно не встановлено."], "img": null}, {"name": "Звідки знаємо", "paras": ["Із **«Києво-Печерського патерика»**.", "Аліпій — **перший іконописець Русі**, чиє ім’я дійшло до нас. Церква шанує його як святого."], "img": null}], "note": "Зображень Аліпія, зроблених за його життя, немає: усі відомі зображення пізніші."}, {"type": "monument", "title": "Вишгородська ікона Богородиці", "badges": ["НМТ: пам’ятка"], "img": {"key": "vyshg", "cap": "Вишгородська (Володимирська) ікона. Фото: Michel Bakni / Wikimedia Commons, Public domain"}, "paras": ["Ікону написали в Константинополі в **першій третині XII ст.** Близько 1131 р. її привезли на Русь і поставили в жіночому монастирі у **Вишгороді** під Києвом.", "**1155 р.** князь **Андрій Боголюбський**, ідучи з Вишгорода на північ, потай забрав ікону до Володимира-на-Клязьмі. Тому в Росії її називають Володимирською.", "Нині ікона в Москві, у храмі при Третьяковській галереї.", "Богородиця притуляється щокою до щоки Дитяти — такий тип ікон називають «Замилуванням» (Елеуса).", "**Ікона** — зображення Христа, Богородиці, святих і подій зі Святого Письма, виконане живописом, мозаїкою чи рельєфом.", "__Як упізнати на НМТ:__ Марія схиляє голову до Ісуса, той обіймає матір за шию."]}, {"type": "monument", "title": "Свенська ікона Богородиці з Антонієм і Феодосієм Печерськими", "badges": ["НМТ: пам’ятка"], "img": {"key": "svenska", "cap": "Свенська (Печерська) ікона, Третьяковська галерея. Фото: невідомий автор / Wikimedia Commons, Public domain"}, "paras": ["Богородиця з Дитям сидить на троні. Обабіч стоять **Антоній** і **Феодосій Печерські**, засновники Печерського монастиря, із сувоями в руках.", "Ікона повторює давній образ із **Києво-Печерського монастиря**, який переказ приписує **Аліпієві**. Це найдавніше зображення Антонія й Феодосія.", "Назва походить від Свенського монастиря під Брянськом, куди ікону, за переказом, принесли з Києва **1288 р.**", "Нині ікона зберігається в Третьяковській галереї в Москві.", "__Як упізнати на НМТ:__ Богородиця на троні, обабіч — двоє ченців у темному чернечому одязі."]}]}, {"id": "s5", "num": "V", "title": "Підсумки всієї теми", "sub": "Поняття, дати, персоналії, пам’ятки, древо Рюриковичів, велика стрічка часу", "cover": {"key": "trident", "cap": ""}, "cards": [{"type": "generic", "title": "Обов’язкові поняття (1)", "badges": ["НМТ: поняття"], "blocks": [{"k": "p", "paras": ["**Племінний союз** — об’єднання кількох племен, яке за певних умов ставало зародком держави.", "**Князь** — голова держави або окремого політичного об’єднання у слов’ян.", "**Полюддя** — збирання данини: щорічний об’їзд князем і дружиною підвладних земель.", "**Язичництво** — система уявлень про світ, традиційна релігія певного народу; віра в багатьох богів.", "**Християнство** — світова релігія, основа якої — віра в Ісуса Христа як Бога й Спасителя.", "**Шлюбна дипломатія** — встановлення династичних зв’язків між правлячими родами різних держав."], "italic": false}, {"k": "sep"}, {"k": "p", "paras": ["**Роздробленість** — розпад єдиної держави на окремі незалежні державні утворення.", "**Віче** — народні збори, на яких вирішували важливі громадські й державні справи.", "**Вотчинне землеволодіння** — спадкова земельна власність, яку можна продати, подарувати, передати дітям.", "**Умовне землеволодіння** — земля, надана за службу у війську чи при дворі, на час служби.", "**Боярин** — представник правлячого стану, знать: радник князя, воєвода, намісник."], "italic": false}]}, {"type": "generic", "title": "Обов’язкові поняття (2)", "badges": ["НМТ: поняття"], "blocks": [{"k": "p", "paras": ["**Смерд** — особисто вільний селянин-общинник із власним господарством; платив данину.", "**Ізгой** — людина, що випала зі своєї соціальної групи; особисто вільна.", "**Закуп** — тимчасово залежний селянин, що відпрацьовував позику («купу»).", "**Рядович** — працював у господарстві землевласника за договором («рядом»).", "**Холоп** — повністю залежна людина: її можна було продати, подарувати, передати у спадок.", "**Ікона** — зображення Христа, Богородиці, святих і подій Святого Письма (живопис, мозаїка, рельєф)."], "italic": false}, {"k": "sep"}, {"k": "p", "paras": ["**Мозаїка** — зображення з окремих щільно припасованих шматочків кольорового скла (смальти) чи каменю.", "**Фреска** — живопис фарбами по вологій штукатурці.", "**Книжкова мініатюра** — невеличкий кольоровий малюнок у старовинному рукописі чи книзі.", "**Билини** — народні епічні пісні про подвиги богатирів, що передавалися з уст в уста.", "**Літопис** — історичний твір, у якому події викладено за роками, у хронологічному порядку."], "italic": false}]}, {"type": "table", "title": "Обов’язкові дати теми", "rows": [["Дата", "Подія", "Частина"], ["860 р.", "похід Аскольда на Константинополь; перший договір Русі з Візантією", "1"], ["882 р.", "об’єднання північних і південних руських земель Олегом", "1"], ["907, 911 рр.", "походи Олега на Константинополь; договір 911 р.", "1"], ["941, 944 рр.", "походи Ігоря на Константинополь; договір 944 р.", "1"], ["988 р.", "запровадження християнства як державної релігії", "2"], ["1019 – 1054 рр.", "князювання Ярослава Мудрого в Києві", "2"], ["1036 р.", "розгром печенігів Ярославом Мудрим", "2"], ["1097 р.", "Любецький з’їзд князів", "3"], ["1113 р.", "укладення «Повісті минулих літ»; початок князювання Володимира Мономаха в Києві", "3, 4"], ["1187 р.", "перша писемна згадка назви «Україна»; створення «Слова о полку Ігоревім»", "3, 4"]]}, {"type": "table", "title": "Обов’язкові персоналії теми", "rows": [["Персоналія", "Чим відомий", "Персоналія", "Чим відомий"], ["Аскольд", "похід 860 р., перший догові   },
  chrono() {
    const m = ['2000 р.<br>до н.е.', '1000 р.<br>до н.е.', '1 р. н.е.<br><b class="a2">Різдво Христове</b>', '1000 р.<br>н.е.', '2000 р.<br>н.е.'];
    return `<h2>Шкала часу</h2><div class="ends"><span>← давніше</span><span>ближче до нас →</span></div>
      <div class="scale"><div class="line"></div><div class="marks">${m.map(a => `<div class="m"><i></i><span>${a}</span></div>`).join('')}</div></div>
      <p class="cap">До н.е. рахунок іде назад: 2000 р. до н.е. давніше, ніж 1000 р. до н.е.</p>`;
  },
  periods(c) {
    const rows = c.rows.map((p, i) => `${i === 0 ? '<div class="pgroup">Кам’яний вік</div>' : i === 3 ? '<div class="pgroup">Доба металів</div>' : ''}
      <div class="per"><div class="c" style="background:${p[5]}"></div><div><h3>${p[0]}</h3>${p[1] ? `<div class="s">${p[1]}</div>` : ''}
       <div class="d">${p[2]}</div><div class="r"><span>Знаряддя:</span> ${p[3]}</div><div class="r"><span>Нове:</span> ${p[4]}</div></div></div>`).join('');
    return `${chips(c.badges)}${h2(c.title)}<p>${md(c.intro)}</p>${rows}`;
  },
  generic(c) {
    const groups = [[]];
    c.blocks.forEach(b => { if (b.k === 'sep') groups.push([]); else groups[groups.length - 1].push(b); });
    const g = groups.filter(x => x.length);
    const rb = b => b.k === 'h' ? `<h3 class="${b.light ? 'l' : ''}">${md(b.text)}</h3>` : b.k === 'date' ? `<span class="pill">${md(b.text)}</span>`
      : b.k === 'img' ? fig(b) : b.k === 'muted' ? `<div class="muted">${(b.paras || []).map(p => `<p>${md(p)}</p>`).join('')}</div>` : paras(b.paras);
    const body = g.map(x => {
      const asPanel = g.length > 1 && x.some(b => b.k === 'h' || b.k === 'date');
      return asPanel ? `<div class="sub">${x.map(rb).join('')}</div>` : x.map(rb).join('');
    }).join('');
    return `${chips(c.badges)}${h2(c.title)}${body}`;
  },
};

/* ---------- навігація ---------- */
const P = id => LESSONS.find(l => l.id === id);
function secProgress(L, s) { const seen = store.get(`seen_${L.id}-${s.id}`, []).length; return Math.min(seen, s.cards.length); }
function partProgress(L) { let a = 0, b = 0; L.sections.forEach(s => { a += secProgress(L, s); b += s.cards.length; }); return [a, b]; }

function index() {
  document.title = TITLE;
  const L0 = LESSONS[0];
  app.innerHTML = `<div class="wrap">
    <div class="hero"><img src="${im(L0.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L0.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(TITLE)}</h1>
      <div class="sub">Мобільна версія презентацій: ${PARTS_WORD}, кожна поділена на короткі розділи.</div></div>
    <div class="h2">Частини</div><div class="sec-list">${LESSONS.map(L => {
      const [a, b] = partProgress(L);
      return `<button class="part-btn" data-go="${L.id}"><span class="th"><img src="${im(L.cover.key).src}" alt=""></span>
        <span><h3>${esc(L.part)}</h3><div class="st">${a ? `Переглянуто ${a} з ${b} карток` : `${L.sections.length} розділів`}</div>
        <div class="prog-mini"><i style="width:${Math.round(100 * a / b)}%"></i></div></span></button>`; }).join('')}</div>
    <p class="cap" style="margin-top:18px">Прогрес зберігається лише на цьому пристрої.</p></div>`;
  wireGo(); window.scrollTo(0, 0);
}

function partHome(L) {
  document.title = `${L.part} — ${TITLE}`;
  const i = LESSONS.indexOf(L), next = LESSONS[i + 1];
  const secs = L.sections.map(s => {
    const seen = secProgress(L, s), n = s.cards.length, done = seen >= n;
    return `<button class="sec-btn${done ? ' done' : ''}" data-go="${L.id}-${s.id}"><span class="num">${done ? '✓' : s.num}</span>
      <span><h3>${md(s.title)}</h3><div class="st">${seen ? `Переглянуто <b>${seen} з ${n}</b>` : `${n} карток`}</div>
      <div class="prog-mini"><i style="width:${Math.round(100 * seen / n)}%"></i></div></span></button>`;
  }).join('');
  const nextBtn = next ? `<button class="btn" data-go="${next.id}" style="margin-top:20px">Далі: ${esc(next.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:20px" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>
       <p class="cap">Посилання працює, якщо файли лежать в одній папці.</p>` : '');
  app.innerHTML = `${MODE === 'all' ? `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${L.num}</span></div></div>` : ''}
  <div class="wrap">
    <div class="hero"><img src="${im(L.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(L.title)}</h1>
      <div class="part">${esc(L.part)}</div><div class="sub">${esc(L.sub)}</div></div>
    <div class="h2">Розділи</div><div class="sec-list">${secs}</div>
    ${L.program ? `<div class="h2">Що треба знати для НМТ</div><section class="card">${R.generic({ ...L.program, title: '' })}</section>` : ''}
    ${nextBtn}
  </div>`;
  wireGo(); window.scrollTo(0, 0);
}

let obs = null;
function section(L, s) {
  document.title = `${s.num}. ${s.title} — ${TITLE}`;
  const k = L.sections.indexOf(s), next = L.sections[k + 1], nextPart = LESSONS[LESSONS.indexOf(L) + 1];
  const cards = s.cards.map((c, i) => `<section class="card" data-i="${i}">${(R[c.type] || R.generic)(c, i)}</section>`).join('');
  let end = next ? `<button class="btn" data-go="${L.id}-${next.id}">Далі: розділ ${next.num}. ${esc(next.title)} →</button>`
    : nextPart ? `<button class="btn" data-go="${nextPart.id}">Далі: ${esc(nextPart.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>` : '');
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="${L.id}">← Розділи</button><span class="ttl">${s.num}. ${md(s.title)}</span></div><div class="prog"><i id="pr"></i></div></div>
  <div class="wrap">
    <div class="hero">${fig(s.cover)}</div>
    <div class="sec-head"><div class="kick">Частина ${L.num} · розділ ${s.num}</div><h1>${md(s.title)}</h1><div class="sub">${md(s.sub)}</div></div>
    <div class="cards">${cards}</div>
    <div class="end">${end}<button class="btn ghost" data-go="${L.id}">До розділів</button></div>
  </div>`;
  wireGo();
  s.cards.forEach((c, i) => {
    if (c.type === 'carousel' && c.items.length > 1) {
      const car = document.getElementById('car' + i), dots = document.getElementById('dots' + i).children;
      car.addEventListener('scroll', () => {
        const kk = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 12));
        [...dots].forEach((d, j) => d.classList.toggle('on', j === kk));
      }, { passive: true });
    }
    if (c.type === 'map' && c.steps.length > 1) {
      const st = document.getElementById('st' + i), mp = document.getElementById('mp' + i);
      st.querySelectorAll('button').forEach(b => b.onclick = () => {
        st.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
        mp.innerHTML = fig({ key: c.steps[+b.dataset.i].key, cap: c.cap || '' });
      });
    }
  });
  const key = `seen_${L.id}-${s.id}`, seen = new Set(store.get(key, []));
  if (obs) obs.disconnect();
  obs = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { seen.add(+e.target.dataset.i); store.set(key, [...seen]); } });
  }, { threshold: 0.35 }) : null;
  if (obs) app.querySelectorAll('.card').forEach(el => obs.observe(el));
  window.scrollTo(0, 0);
}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
let zoom = 1;
function setZoom(z) {
  zoom = Math.max(1, Math.min(5, z));
  if (zoom === 1) { lbv.classList.remove('z'); lbi.style.width = ''; }
  else { lbv.classList.add('z'); lbi.style.width = (lbv.clientWidth * zoom) + 'px'; }
}
app.addEventListener('click', e => {
  const p = e.target.closest('.pic'); if (!p) return;
  lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open'); setZoom(1);
  if (!FS.off) FS.enter();
});
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(zoom * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(zoom / 1.6);
lbi.addEventListener('dblclick', () => setZoom(zoom > 1 ? 1 : 2.5));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
let pinch = null;
lbv.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), z: zoom }; }, { passive: true });
lbv.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); setZoom(pinch.z * d / pinch.d); } }, { passive: true });
lbv.addEventListener('touchend', () => { pinch = null; });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const pr = document.getElementById('pr'); if (!pr) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  pr.style.width = (max > 0 ? Math.min(100, 100 * scrollY / max) : 100) + '%';
}, { passive: true });
route();
</script>
</body>
</html>

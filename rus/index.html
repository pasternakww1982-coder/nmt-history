<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Русь-Україна (Київська держава)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; overflow: auto; display: grid; place-items: center; -webkit-overflow-scrolling: touch; }
.lb-view img { max-width: 100%; max-height: 100%; }
.lb-view.z { place-items: start; }
.lb-view.z img { max-width: none; max-height: none; }
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }
.tlv .ev { position: relative; padding: 0 0 16px; display: grid; gap: 3px; }
.tlv .ev i { position: absolute; left: -25px; top: 4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--bg); }
.tlv .ev .y { color: var(--acc2); font-weight: 800; font-variant-numeric: tabular-nums; }
.tlv .ev .y.yprog { justify-self: start; background: var(--acc2); color: #161616; border-radius: 8px; padding: 1px 8px; }
.tlv .ev b { font-size: 17px; }
.legend { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.legend span.sw { width: 34px; height: 16px; background: var(--acc2); border-radius: 6px; }
/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }
.gp .tr { position: relative; height: 18px; background: #262626; border-radius: 6px; }
.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }
.part-btn .th img { max-width: 100%; max-height: 100%; }
.part-btn h3 { font-size: 18px; }
.part-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<button id="fsb" class="fsb" hidden aria-label="На весь екран">⤢</button>
<div class="lb" id="lb" role="dialog" aria-label="Перегляд зображення">
  <div class="lb-top"><button id="lbOut" aria-label="Зменшити">−</button><button id="lbIn" aria-label="Збільшити">+</button><button id="lbX" aria-label="Закрити">✕</button></div>
  <div class="lb-view" id="lbv"><img id="lbi" alt=""></div>
  <div class="lb-cap" id="lbc"></div>
</div>
<script>
const LESSONS = [{"id": "p1", "num": 1, "title": "Русь-Україна (Київська держава)", "part": "Частина 1. Від союзів племен до перших князів", "sub": "Східні слов’яни, утворення Русі, Аскольд, Олег, Ігор, Ольга, Святослав", "cover": {"key": "title_kyi", "cap": "Аскольд і Дір відпрошуються в Рюрика й рушають Дніпром до Царгорода. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **860 р.** — похід Аскольда на Константинополь, перший відомий договір Русі з Візантією", "• **882 р.** — об’єднання північних і південних руських земель Олегом", "• **907, 911, 941, 944 рр.** — походи князів на Константинополь"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії й поняття", "light": false}, {"k": "p", "paras": ["• **Аскольд, Олег, Ігор, Ольга, Святослав**", "• **племінний союз, князь, полюддя, язичництво**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Картосхеми", "light": false}, {"k": "p", "paras": ["• територія східнослов’янських **союзів племен** у VIII – IX ст.", "• шлях **«із варягів у греки»**", "• **походи князів на Константинополь**, **походи Святослава**", "• межі Русі-України **за Олега**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Знати й пояснювати", "light": false}, {"k": "p", "paras": ["• **назва «Русь»**, **Руська земля**", "• як утворилася Русь-Україна (Київська держава)", "• внутрішня й зовнішня політика перших київських князів"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України, тема 3 «Русь-Україна (Київська держава)». Решта дат і персоналій теми — у частинах 2–4."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Східні слов’яни у VIII – IX ст.", "sub": "Союзи племен, їхня віра, сусіди й передумови появи держави", "cover": {"key": "ivanov", "cap": ""}, "cards": [{"type": "cols", "title": "Від Великого розселення до союзів племен", "badges": [], "intro": null, "blocks": [{"h": "Де й як жили", "paras": ["Після **Великого розселення** (V – VII ст.) слов’яни поділилися на три гілки. **Східні слов’яни** зайняли простір від Карпат до верхньої Волги й від Ладозького озера до степу.", "У VIII – IX ст. вони жили **союзами племен**. Нестор називає їх: поляни, деревляни, сіверяни, волиняни, білі хорвати, уличі, тиверці, а північніше — дреговичі, радимичі, кривичі, словени, в’ятичі.", "Кожен союз мав свою землю й головне місто: поляни — Київ, деревляни — Іскоростень, сіверяни — Чернігів."]}, {"h": "Хто ними правив", "paras": ["**Племінний союз** — об’єднання кількох племен, яке за певних умов ставало зародком держави.", "На чолі союзу стояв **князь**. Спершу князем називали воєначальника, якого обирали на час війни. Згодом князі зберегли владу й у мирний час і почали передавати її синам.", "Князя оточувала **дружина** — воїни, які не працювали на землі, а жили з воєнної здобичі та данини. Найважливіші справи, однак, і далі вирішувало **віче** — збори вільних чоловіків."]}]}, {"type": "map", "steps": [{"key": "p1_tribes_ua", "label": "Крок 1"}]}, {"type": "table", "title": "Союзи племен на землях України", "rows": [["Союз племен", "Де жили", "Головні міста"], ["Поляни", "Середнє Подніпров’я: правий берег Дніпра між Ірпенем і Россю", "**Київ**, Вишгород"], ["Деревляни", "Полісся між Тетеревом і Прип’яттю, на захід до Случі", "**Іскоростень** (Коростень), Вручий (Овруч)"], ["Сіверяни", "Лівобережжя: басейни Десни, Сейму й Сули", "**Чернігів**, Новгород-Сіверський, Любеч"], ["Волиняни (дуліби, бужани)", "Західний Буг, верхня Прип’ять, Волинь", "Волинь, **Червен**"], ["Білі хорвати", "Прикарпаття, верхній Дністер, Закарпаття", "**Перемишль**, Пліснеськ"], ["Уличі", "Спершу нижнє Подніпров’я, згодом між Південним Бугом і Дністром", "Пересічень (де саме — дискусійно)"], ["Тиверці", "Між Дністром і Прутом аж до Дунаю та Чорного моря", "назв міст літопис не зберіг"]]}, {"type": "doc", "title": "Літопис про заснування Києва", "quote": ["Поляни жили окремо й володіли кожен своїм родом. І було троє братів: один на ім’я Кий, другий — Щек, а третій — Хорив, а сестра їхня — Либідь.", "Сидів Кий на горі, де тепер узвіз Боричів, Щек — на горі, яку нині звуть Щекавицею, а Хорив — на третій горі, що від нього прозвалася Хоревицею. І збудували вони город на честь старшого брата й назвали його Київ.", "Дехто, не знаючи, каже, що Кий був перевізником. Та якби він був перевізником, то не ходив би до Царгорода. А Кий княжив у своєму роді й ходив до царя, і великої шани, кажуть, зазнав від нього."], "source": "Повість минулих літ. Початок XII ст. (переклад-переказ, скорочено)", "comment": ["Перед нами легенда про початок Києва — головного міста полян. Археологи підтверджують, що укріплене поселення на Старокиївській горі існувало вже в V – VI ст.", "Нестор сперечається з тими, хто вважав Кия перевізником через Дніпро. Доказ у нього один: перевізника імператор не приймав би з шаною. Отже, Кий був **князем**.", "__Слова з літопису:__ **узвіз Боричів** — спуск із гори до Дніпра; **Царгород** — Константинополь; **цар** — візантійський імператор."], "img": {"key": "kyi_mon", "cap": "Пам’ятний знак засновникам Києва (1982). Фото: Половко Сергей Николаевич / Wikimedia Commons, CC BY-SA 4.0"}}, {"type": "map", "title": "Східні слов’яни та їхні сусіди", "steps": [{"key": "p1_tribes_all", "label": "Крок 1"}]}, {"type": "generic", "title": "", "badges": [], "blocks": [{"k": "date", "text": "Південний схід"}, {"k": "p", "paras": ["За Доном лежав **Хозарський каганат**. Полянам, сіверянам, радимичам і в’ятичам доводилося платити йому данину."], "italic": false}, {"k": "date", "text": "Степ"}, {"k": "p", "paras": ["Степом кочували **угри**. Наприкінці IX ст. їх витіснили **печеніги**."], "italic": false}, {"k": "date", "text": "Південь"}, {"k": "p", "paras": ["За морем — **Візантія**; їй належав і **Херсонес** у Криму. На Дунаї — **Болгарія**."], "italic": false}, {"k": "date", "text": "Північ"}, {"k": "p", "paras": ["Із-за Балтики припливали **варяги** (скандинави). Поруч жили **балти** й **фіно-угри**: чудь, весь, меря."], "italic": false}, {"k": "date", "text": "Захід"}, {"k": "p", "paras": ["**Західні слов’яни**: у IX ст. — Велика Моравія, згодом Чехія й Польща."], "italic": false}]}, {"type": "text", "kicker": "Східні слов’яни", "title": "У що вірили: язичництво", "badges": ["НМТ: поняття"], "paras": ["**Язичництво** — давня віра в багатьох богів, що уособлювали сили природи. Східні слов’яни трималися її до кінця X ст.", "Найбільше шанували **Перуна**, бога грому й блискавки: його вважали покровителем князя та дружини. **Велес (Волос)** опікувався худобою й достатком, **Дажбог** давав сонце й урожай, **Стрибог** володів вітрами, **Мокоша** берегла жіночі ремесла.", "Богам ставили ідолів на капищах і приносили жертви. Вірили також у духів — домовиків, русалок, лісовиків — і шанували померлих предків.", "Віра була й державною справою. Укладаючи договори з Візантією, руси клялися Перуном і Волосом та клали перед ідолом зброю. Проте вже за Ігоря в Києві жили й християни: 944 р. вони присягали в церкві святого Іллі."], "imgs": [{"key": "zbruch", "cap": "Збруцький ідол (IX – X ст.). Знайдений 1848 р. в річці Збруч на Тернопільщині, зберігається в Археологічному музеї Кракова. Суспільне надбання"}]}, {"type": "text", "kicker": "Східні слов’яни", "title": "Чому з’явилася держава", "badges": [], "paras": ["Держава не виникає за чиїмось наказом. У східних слов’ян вона складалася кілька століть. Головних причин її появи було три.", "**Господарство.** Плугом із залізним наральником селяни вирощували більше зерна, ніж потребувала родина. З’явився надлишок, який можна продати, відібрати або зібрати як данину. Ремісники почали працювати на продаж, купці возили товар усе далі, а біля торгів виникали **міста**.", "**Нерівність.** Родову общину змінила **сусідська**: землю обробляли окремі сім’ї, і одні багатіли швидше за інших. Князі, старійшини й дружинники перетворилися на знать, яка мала силу й хотіла втримати владу за собою.", "**Небезпека й вигода.** Поодинці племена не могли ні відбитися від кочовиків, ні позбутися **хозарської данини**. А той, хто об’єднав би землі вздовж Дніпра, контролював би торговий шлях до Візантії."], "imgs": [{"key": "fol8rb", "cap": "Хозари беруть данину з полян, сіверян і в’ятичів. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}]}, {"id": "s2", "num": "II", "title": "Утворення Русі-України", "sub": "Шлях «із варягів у греки», Аскольд, Олег у Києві, назва «Русь»", "cover": {"key": "roerich", "cap": ""}, "cards": [{"type": "map", "title": "Шлях «із варягів у греки»", "steps": [{"key": "p1_route", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["Щоб зрозуміти, чому держава постала саме довкола Києва, погляньмо на головну торгову дорогу Східної Європи. Вона вела зі **Скандинавії** до **Візантії**.", "З Балтики купці пливли Невою, Ладозьким озером і Волховом до **Новгорода**, далі — Ловаттю. Між Ловаттю й Дніпром човни тягли суходолом, **волоками**.", "Дніпром спускалися повз Смоленськ, Любеч і **Київ** до моря, а тоді вздовж берега — до **Константинополя**.", "Найнебезпечнішими були **дніпровські пороги**: човни розвантажували й перетягували берегом, а в степу чатували кочовики.", "На цьому шляху було два сильні міста: Новгород на півночі й Київ на півдні. Князь, який заволодів би обома містами, контролював би весь шлях."], "imgs": []}, {"type": "doc", "title": "Покликання варягів (862 р.)", "quote": ["Вигнали [чудь, словени й кривичі] варягів за море, і не дали їм данини, і почали самі собою володіти. Та не було між ними правди, і встав рід на рід, і почали воювати самі з собою.", "І сказали вони: «Пошукаймо собі князя, який би володів нами й судив по праву». І пішли за море до варягів, до русі, і сказали: «Земля наша велика й щедра, а порядку в ній немає. Ідіть-но княжити й володіти нами».", "І зголосилися три брати з родами своїми. Старший, Рюрик, сів у Ладозі, другий, Синеус, — на Білоозері, а третій, Трувор, — в Ізборську."], "source": "Повість минулих літ, під 862 р. (переклад-переказ, скорочено)", "comment": ["Це північна, новгородська легенда: дія відбувається в Ладозі, Ізборську, на Білоозері, а Києва легенда не згадує. В іншому списку літопису Рюрик сідає одразу в Новгороді.", "Від **Рюрика** виводили свій рід усі пізніші князі Русі — **Рюриковичі**. Тому літописцеві було важливо показати, що Рюрик не захопив владу силою, а його запросили самі племена.", "__Слова з літопису:__ **правда** — тут: лад і справедливий суд; **володіти** — правити; **за море** — за Балтійське море, до Скандинавії."], "img": {"key": "fol8ra", "cap": "Варяги беруть данину з чуді, словен, мері й кривичів. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}}, {"type": "text", "kicker": "Утворення Русі", "title": "Аскольд — перший відомий київський князь", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Що відбувалося тим часом на півдні? За літописом, у середині IX ст. в Києві княжили **Аскольд і Дір**. Нестор зарахував їх до бояр Рюрика. Проте багато істориків, серед них М. Грушевський, вважають Аскольда нащадком місцевого роду **Києвичів**.", "**860 р.** руси на човнах з’явилися під мурами Константинополя. Про напад писали самі візантійці, а літопис називає ватажками Аскольда й Діра. Тож Аскольд — перший київський князь, чий похід підтверджують іноземні джерела.", "Після походу Русь і Візантія уклали **перший відомий договір** (його текст не зберігся). Візантійці згадують також, що частина русів охрестилася, — це так зване **«Аскольдове хрещення»**.", "**882 р.** з півночі прийшов Олег і вбив Аскольда."], "imgs": [{"key": "askold_grave", "cap": "Церква Святого Миколая на Аскольдовій могилі в Києві — там, де, за переказом, поховали князя. Фото: Haidamac / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "doc", "title": "Літопис про Аскольда й Діра", "quote": ["І було в нього [Рюрика] два мужі, Аскольд і Дір, не його племені, а бояри. І відпросилися вони [в Рюрика піти] до Цесарограда з родом своїм, і рушили обидва по Дніпру.", "Ідучи мимо, узріли вони на горі городок і запитали, кажучи: «Чий се город?» А вони, [тамтешні жителі], сказали: «Було троє братів, Кий, Щек [і] Хорив, які зробили город сей і згинули. А ми сидимо в городі їхньому і платимо данину хозарам».", "Аскольд, отож, і Дір зостались удвох у городі цьому, і зібрали багато варягів, і почали володіти Полянською землею. А Рюрик княжив у Новгороді."], "source": "Повість минулих літ, під 862 р. (переклад Л. Махновця)", "comment": ["Так «Повість минулих літ» пояснює, звідки в Києві взялися Аскольд і Дір. Літописець писав через два з половиною століття після подій і пов’язав їх із Рюриком; чи були вони справді варягами, історики сперечаються.", "Кияни самі кажуть прибульцям, що **платять данину хозарам**. Поки в місті не було сильного князя, воно залежало від каганату.", "__Слова з літопису:__ **мужі, бояри** — знатні дружинники; **Цесароград** — Константинополь; **городок** — невелике укріплене поселення."], "img": {"key": "sternberg", "cap": "В. Штернберг. Аскольдова могила (1837). Суспільне надбання"}}, {"type": "doc", "title": "Патріарх Фотій про напад русів 860 р.", "quote": ["Народ незнаний, народ, якого й до лічби не брали, народ, що жив далеко від нас, — несподівано, як морська хвиля, ринув на наші межі й, як польовий вепр, пожер усіх, хто жив на цій землі, як траву.", "Що це? Звідки впала на нас ця громовиця з далеких північних країв? Місто наше ледве не стало здобиччю списа."], "source": "Фотій, патріарх Константинопольський. Гомілія на навалу русів, 860 р. (переклад-переказ, скорочено)", "comment": ["Фотій бачив облогу на власні очі: поки руси грабували околиці, він молився з городянами за порятунок столиці.", "Завдяки візантійцям ми знаємо точну дату нападу — **18 червня 860 р.** У «Повісті минулих літ» похід помилково віднесено до 866 р. На НМТ правильна відповідь — 860 р.", "Руси вдало вибрали час: імператор Михайло III саме повів військо проти арабів, і столиця лишилася майже без захисту. **Гомілія** — проповідь, виголошена в храмі."], "img": null}, {"type": "doc", "title": "Олег захоплює Київ (882 р.)", "quote": ["І прибули [Олег та Ігор] до гір київських, і довідався Олег, що [тут] Аскольд і Дір удвох княжать. І сховав він воїв у човнах, а інших позаду зоставив, і сам прийшов [на берег Дніпра], несучи Ігоря малого.", "І послав він [посла] до Аскольда й Діра сказати: «Ми — купці єсмо, ідемо в Греки од Олега і од Ігоря-княжича. Прийдіть-но оба до рідні своєї, до нас». Аскольд же й Дір прийшли.", "І вискочили всі інші [вої] з човнів, і мовив Олег Аскольдові й Дірові: «Ви оба не є ні князі, ні роду княжого. А я єсмь роду княжого. — І [тут] винесли Ігоря. — А се — син Рюриків». І вбили вони Аскольда й Діра."], "source": "Повість минулих літ, під 882 р. (переклад Л. Махновця)", "comment": ["По смерті Рюрика владу на півночі перебрав його родич Олег, опікун малого Ігоря. **882 р.** Олег вирушив Дніпром на південь. Літопис розповідає, як він захопив Київ.", "Олег виправдовує вбивство тим, що Аскольд і Дір «не княжого роду». Право правити, на думку літописця, дає **походження**, а не сила чи заслуги.", "Далі в літописі: «І сів Олег, княжачи, в Києві, і мовив: „Хай буде се мати городам руським“». Відтоді північними й південними землями правив один князь.", "__Слова з літопису:__ **вої** — воїни; **в Греки** — до Візантії; **княжич** — син князя; **рідня** — тут: земляки."], "img": null}, {"type": "text", "kicker": "Утворення Русі", "title": "Назва «Русь» і Руська земля", "badges": ["НМТ: поняття"], "paras": ["Державу, що постала після 882 р., стали звати **Руссю**. Звідки взялося це слово, історики сперечаються досі.", "__Північна версія.__ Від фінського «руотсі» — так фіни називали шведів; слово могло означати «веслярі». Тоді руссю спершу звали варязьких дружинників, а вже потім — усіх підданих князя.", "__Південна версія.__ Від річки **Рось**, притоки Дніпра, або від народу «рос», який жив у Середньому Подніпров’ї.", "Хоч би звідки походила назва, у IX – X ст. Руссю називали державу з центром у Києві, а її людей — **русами, русинами**.", "**Руська земля** у вузькому значенні — це Київщина, Чернігівщина й Переяславщина, центральна частина держави. У широкому — усі землі під владою київських князів."], "imgs": [{"key": "varyagi", "cap": "В. Васнецов. Варяги (1909). Суспільне надбання"}]}, {"type": "cols", "title": "Хто створив державу: дві теорії", "badges": [], "intro": "Тепер, коли ми знаємо і про Рюрика, і про Аскольда, можна розібратися в давній суперечці істориків. Сучасні історики сходяться на тому, що Русь постала з розвитку самих східних слов’ян, а варяги цей процес прискорили: дали династію й частину дружини.", "blocks": [{"h": "Норманська теорія", "paras": ["У XVIII ст. німецькі вчені **Г.-З. Байєр** і **Г.-Ф. Міллер** прочитали легенду про Рюрика буквально: державу слов’янам дали **варяги**.", "На користь цієї теорії свідчать скандинавські імена князів і послів (Олег, Ігор, Карл, Фарлоф).", "Але легенду записано через 250 років після подій. До того ж державу неможливо принести ззовні: вона виникає там, де для неї вже склалися умови."]}, {"h": "Антинорманська теорія", "paras": ["Її прихильники, зокрема **М. Грушевський**, доводили: держава виросла з **місцевих** союзів племен, насамперед із полянського князівства в Києві.", "Князі в полян були й до варягів, а Київ — не скандинавське місто. Варяги служили найманцями й торгували, а за два-три покоління перейняли мову й звичаї слов’ян.", "Проте варяги на Русі справді були: про це свідчать скандинавські імена в договорах і поховання під Києвом та Черніговом."]}]}]}, {"id": "s3", "num": "III", "title": "Перші князі: Олег та Ігор", "sub": "Об’єднання земель, походи на Константинополь, договори з Візантією, полюддя", "cover": {"key": "bruni_oleg", "cap": ""}, "cards": [{"type": "text", "kicker": "Олег та Ігор", "title": "Князь Олег (882 – 912)", "badges": ["НМТ: персоналія", "НМТ: поняття"], "paras": ["Олег не залишився на півночі, бо найбільші прибутки давала торгівля з Візантією, а шлях до неї вів Дніпром. Захопивши **882 р.** Київ, він зробив його столицею. Так **північні й південні руські землі об’єдналися** під владою одного князя.", "Потім Олег почав підкоряти сусідні союзи племен. Він підкорив **деревлян**, а **сіверянам** і **радимичам** звелів платити данину не хозарам, а йому. Князь із дружиною збирали її самі, об’їжджаючи землі взимку. Такий збір данини називали **полюддям**.", "Зміцнівши, Олег пішов на Візантію (**907 р.**) і домігся вигідного договору (**911 р.**).", "Помер він **912 р.** Літопис називає князя **Віщим**, тобто тим, хто знає наперед. Легенда каже, що волхв напророкував йому смерть від власного коня, і пророцтво збулося: Олега вжалила змія, яка виповзла з кінського черепа."], "imgs": [{"key": "vasn_oleg", "cap": "В. Васнецов. Ілюстрація до «Пісні про віщого Олега» О. Пушкіна (1899): волхв пророкує князеві смерть від коня. Суспільне надбання"}]}, {"type": "map", "title": "Русь за князювання Олега", "steps": [{"key": "p1_oleg", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["Помаранчевим показано землі, з яких Олег брав данину. Літопис називає **словен, кривичів, полян, деревлян, сіверян і радимичів**; до держави належали й полочани та дреговичі, а на північному сході — фіно-угорські **весь і меря**.", "Єдиного управління ще не було. Підкорені племена зберігали власних князів і лише платили Києву хутром, медом і воском.", "Жовта стрілка — **полюддя**. Його маршрут відомий з опису середини X ст., тобто вже з часів Ігоря.", "**898 р.** повз Київ пройшли **угри**: зі степів вони переселялися за Карпати, на Дунай.", "Поза владою Олега лишилися в’ятичі, що й далі платили хозарам, уличі й тиверці, з якими він воював, а також волиняни й білі хорвати."], "imgs": []}, {"type": "doc", "title": "Похід Олега на Царгород (907 р.)", "quote": ["І прибув він до Цесарограда, а греки замкнули Суд (затоку) і город заперли. І вийшов Олег на берег, і повелів воям виволокти кораблі на берег. І попустошив він довкола города, і вчинив убивство багатьох греків.", "І повелів Олег воям своїм колеса зробити і поставити кораблі на колеса. А коли настав попутний вітер, напнули вони паруси, [рушили] з поля, і пішов [Олег] до города.", "Побачивши ж [це], греки убоялися і сказали, виславши [послів] до Олега: «Не погубляй город. Ми згоджуємось на данину, як ти ото хочеш»."], "source": "Повість минулих літ, під 907 р. (переклад Л. Махновця)", "comment": ["Похід скінчився миром: греки сплатили данину, а руські купці дістали право **торгувати в Константинополі без мита**.", "Візантійські автори про події 907 р. мовчать, тому частина істориків вважає розповідь легендою. Натомість **договір 911 р.**, який закріпив ці умови, — справжній документ.", "__Слова з літопису:__ **Суд** — затока Золотий Ріг, вхід до якої греки перекривали ланцюгом; **вої** — воїни; **убоялися** — злякалися."], "img": {"key": "oleg_ships", "cap": "Олег під Царгородом: кораблі на колесах. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}}, {"type": "doc", "title": "Договір Русі з Візантією 911 р.", "quote": ["Ми від роду руського — Карл, Інегелд, Фарлоф, Веремуд… — послані від Олега, великого князя руського, і від усіх, хто під рукою його, щоб утвердити любов між християнами й Руссю.", "Якщо русин уб’є християнина або християнин русина, хай помре там, де вчинив убивство. Якщо хтось украде щось у купця, хай поверне втроє.", "Якщо русин служить у візантійського царя й помре, не розпорядившись майном, хай його майно віддадуть родичам на Русі."], "source": "Повість минулих літ, під 912 р. Текст договору 911 р. (переклад-переказ, скорочено)", "comment": ["Це найдавніший договір Русі, текст якого дійшов до нас. Він визначає, як торгувати, як судити за вбивство й крадіжку, що робити з полоненими й майном померлих.", "Посли мають **скандинавські імена**: це дружинна знать на службі в київського князя. А сам договір згадує «закон руський» — звичаєве право, за яким жила Русь.", "Візантійська імперія уклала з Руссю письмову угоду, як з іншими державами, — отже, визнавала Русь державою.", "__Слова з договору:__ **християни** — так тут названо візантійців; **русин** — людина з Русі; **цар** — візантійський імператор."], "img": null}, {"type": "text", "kicker": "Олег та Ігор", "title": "Князь Ігор (912 – 945)", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Ігор, син Рюрика, став київським князем після смерті Олега. Підкорені племена одразу спробували вийти з-під його влади. **Деревляни** відмовилися платити; Ігор знову підкорив їх і наклав більшу данину, ніж брав Олег. **Уличів** після тривалої облоги їхнього міста Пересічна підкорив воєвода **Свенельд**.", "**915 р.** біля Русі вперше з’явилися **печеніги**. Того разу Ігор уклав із ними мир, але відтоді степові кочовики півтора століття постійно загрожували Русі.", "За Ігоря руси двічі ходили морем на **Каспій** (913 і 943 рр.) — по здобич у багаті прикаспійські міста.", "Як і Олег, Ігор шукав здобичі й торгових вигод у Візантії. Похід **941 р.** закінчився розгромом: візантійці спалили руський флот «грецьким вогнем». **944 р.** князь зібрав нове військо, і візантійці воліли відкупитися, проте новий договір був для Русі гіршим за Олегів.", "Загинув Ігор **945 р.** в Деревлянській землі, коли вдруге прийшов по данину."], "imgs": [{"key": "igor945", "cap": "Ігор бере данину з деревлян (945 р.). Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}, {"type": "doc", "title": "941 р.: «грецький вогонь»", "quote": ["І порадилися руси, і вийшли, оружившись, проти греків, і битва межи ними обома була люта, [і] заледве одоліли греки. Руси ж повернулися до дружини своєї під вечір і на ніч, сівши в човни, утекли.", "Але Феофан, [сановник Романа], зустрів їх у човнах з вогнем і став пускати вогонь трубами на човни руські, і було видно страшне диво. Руси ж, бачивши полум’я, кидались у воду морську [і] намагалися [подалі] відбрести. І таким чином рештки [їх] вернулися до себе."], "source": "Повість минулих літ, під 941 р. (переклад Л. Махновця)", "comment": ["«Грецький вогонь» — запальна суміш, найпевніше на основі нафти. Її викидали з мідних труб, і вона горіла навіть на воді. Склад суміші візантійці тримали в таємниці.", "Такої поразки на морі руси ще не знали. Та вже за три роки Ігор знову повів військо на Візантію.", "__Імена:__ **Роман** — імператор Роман I Лакапін; **Феофан** — сановник, якому він доручив флот."], "img": {"key": "greekfire", "cap": "Візантійський корабель спалює ворожий флот «грецьким вогнем». Мадридський Скилиця (XII ст.). Суспільне надбання"}}, {"type": "doc", "title": "944 р.: мир без битви", "quote": ["Ігор же, дійшовши [до] Дунаю, скликав дружину, і став радитися, і повідав їм річ цесареву. Сказала тоді дружина Ігорева: «Да якщо так говорить цесар, то чого нам більше од сього хотіти — не бившись, узяти золото, і сéребро, і паволоки?", "Бо хто відає, хто подолає — чи ми, чи вони? Чи з морем хто в згоді? Се ж не по землі ми ходимо, а по глибині морській, і спільна смерть усім».", "І послухав їх Ігор, і повелів печенігам пустошити Болгарську землю. А сам, узявши в греків золото і паволоки на всіх воїв, він вернувся назад і прийшов до Києва, до себе."], "source": "Повість минулих літ, під 944 р. (переклад Л. Махновця)", "comment": ["Імператор запропонував викуп, і дружина радить князеві погодитися. Ігор слухається: без згоди дружини князь тоді не воював і не мирився.", "За **договором 944 р.** руські купці втратили право безмитної торгівлі. Русь пообіцяла не чіпати **Херсонес** у Криму й давати Візантії воїнів на допомогу.", "__Слова з літопису:__ **цесар** — імператор; **паволоки** — дорогі шовкові тканини; **річ** — тут: слова, пропозиція."], "img": null}, {"type": "map", "steps": [{"key": "p1_tsar0", "label": "Основа"}, {"key": "p1_tsar1", "label": "860"}, {"key": "p1_tsar2", "label": "907"}, {"key": "p1_tsar3", "label": "941, 944"}, {"key": "p1_tsar4", "label": "Каспій"}]}, {"type": "doc", "title": "Костянтин Багрянородний про полюддя й пороги", "quote": ["Зимовий і суворий спосіб життя цих русів такий. Коли настає листопад, їхні архонти разом з усіма русами виходять із Києва й вирушають у полюддя — до деревлян, дреговичів, кривичів, сіверян та інших слов’ян, що платять русам данину.", "Годуючись там усю зиму, вони в квітні, коли скресне лід на Дніпрі, повертаються до Києва. Тоді лагодять човни, споряджаються й ідуть до Візантії.", "Біля порогів руси висаджують людей на берег, а човни штовхають жердинами. Біля четвертого порога вивантажують усе, а людей у кайданах ведуть суходолом, стережучи від печенігів."], "source": "Костянтин VII Багрянородний. Про управління імперією, гл. 9. Сер. X ст. (переклад-переказ, скорочено)", "comment": ["Пише візантійський імператор, сучасник Ігоря й Ольги. Це найдавніший докладний опис **полюддя**: князь із дружиною цілу зиму живуть коштом підвладних земель і збирають із них данину.", "Зібране — хутро, мед, віск, невільників — навесні везли Дніпром продавати до Константинополя. Отже, данина була водночас і товаром для торгівлі з Візантією.", "Розміру данини ніхто не визначав. Чим це загрожувало, показує наступний документ.", "__Слова з джерела:__ **архонти** — так візантієць називає князя та його знать; **люди в кайданах** — невільники, яких везли на продаж."], "img": null}, {"type": "doc", "title": "Загибель Ігоря (945 р.)", "quote": ["Сказала дружина Ігореві: «Отроки Свенельдові вирядилися оружжям і одежею, а ми — голі. Піди-но, княже, з нами по данину, хай і ти добудеш, і ми». І послухав їх Ігор, пішов у Деревляни по данину. І добув він до попередньої данини, і чинив їм насильство він і мужі його.", "Та коли він повертався назад, він роздумав [і] сказав дружині своїй: «Ідіте ви з даниною додому, а я вернусь і походжу іще». І відпустив він дружину свою додому, а з невеликою дружиною вернувся, жадаючи більше майна.", "Коли ж почули древляни, що він знов іде, порадилися древляни з князем своїм Малом і сказали: «Якщо внадиться вовк до овець, то виносить по одній все стадо, якщо не уб’ють його. Так і сей: якщо не вб’ємо його, то він усіх нас погубить». І древляни, вийшовши з города Іскоростеня, вбили Ігоря."], "source": "Повість минулих літ, під 945 р. (переклад Л. Махновця, скорочено)", "comment": ["Ігор уже зібрав данину й рушив додому, але повернувся, щоб зібрати її вдруге. Звичай такого не дозволяв, і деревляни повстали.", "У деревлян був **власний князь Мал**. Підкорена земля зберігала власну владу й мала досить сили, щоб виступити проти київського князя.", "Як після цього змінила збір данини вдова Ігоря, Ольга, розповідає наступний розділ.", "__Слова з літопису:__ **отроки** — молодші дружинники; **Свенельд** — воєвода, що мав власну дружину; **вирядилися** — добре вдяглися й озброїлися."], "img": null}]}, {"id": "s4", "num": "IV", "title": "Княгиня Ольга", "sub": "Помста деревлянам, податкова реформа, хрещення в Константинополі", "cover": {"key": "nest_olga", "cap": ""}, "cards": [{"type": "text", "kicker": "Княгиня Ольга", "title": "Княгиня Ольга (945 – бл. 964)", "badges": ["НМТ: персоналія"], "paras": ["Коли деревляни вбили Ігоря, його син **Святослав** був ще малим, тож державою стала правити вдова. Звідки Ольга родом, достеменно невідомо; літопис каже, що її привели Ігореві з Пскова.", "Почала вона з помсти: **946 р.** здобула й спалила деревлянський **Іскоростень**. Але княгиня розуміла, чому деревляни повстали: під час полюддя данину брали без міри. Тому вона впорядкувала збір данини.", "Із сусідами Ольга воліла домовлятися, а не воювати. Вона їздила до Константинополя й там **охрестилася** з ім’ям Олена (957 р., за іншою версією — 946 р.). **959 р.** відправила послів до німецького короля Оттона I; єпископ **Адальберт**, якого надіслав Оттон, невдовзі мусив залишити Київ.", "Син Ольги Святослав і княжі дружинники лишилися язичниками: усю Русь охрестить уже онук Ольги, Володимир. Церква шанує княгиню як **святу рівноапостольну**."], "imgs": [{"key": "olga_mon", "cap": "Пам’ятник княгині Ользі на Михайлівській площі в Києві. Фото: Віктор Полянко / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "doc", "title": "Помста Ольги: як згорів Іскоростень", "quote": ["Ольга ж… стояла з військом біля города ціле літо й не могла його взяти. Тоді послала вона до города сказати: «Нащо хочете висидіти? Дайте мені від кожного двору по три голуби й по три горобці. Я вже помстилася за мужа свого й не хочу накладати на вас тяжкої данини».", "Деревляни ж раді були й дали їй птахів. Ольга ж роздала воїнам — кому голуба, кому горобця — і звеліла прив’язати до кожного труту. А коли смеркло, звеліла пустити птахів.", "Голуби й горобці полетіли до своїх гнізд, і загорілися голубники, кліті, повітки й обороги. І не було двору, де б не горіло."], "source": "Повість минулих літ, під 946 р. (переклад-переказ, скорочено)", "comment": ["Розповідь про птахів — мандрівний сюжет: подібне оповідають і скандинавські саги. Але за легендою стоїть справжня подія: **946 р.** Ольга спалила Іскоростень, і це підтверджують розкопки.", "Після цього Деревлянська земля втратила свого князя й остаточно підкорилася Києву.", "__Слова з літопису:__ **трут** — гніт, що довго тліє; **кліті, повітки, обороги** — комори, навіси й накриття для сіна."], "img": {"key": "olga_rev2", "cap": "Помста Ольги деревлянам: чотири мініатюри. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}}, {"type": "defs", "title": "Податкова реформа Ольги", "badges": [], "items": [{"name": "Чому", "paras": ["Смерть Ігоря показала: коли данину збирають без правил, підвладні землі повстають.", "Ользі треба було, щоб підвладні землі знали наперед, скільки й кому вони винні."], "img": null}, {"name": "Устави й уроки", "paras": ["Княгиня об’їхала свої володіння й визначила **устави й уроки** — сталий розмір данини з кожної землі.", "Відтепер ні князь, ні дружина не могли брати більше, ніж визначено."], "img": null}, {"name": "Погости", "paras": ["Данину тепер звозили до **погостів**, де сиділи княжі люди. Об’їжджати землі з військом уже не було потреби.", "Ольга визначила й князівські **ловища** та **становища** — мисливські угіддя й місця зупинок."], "img": null}, {"name": "Що змінилося", "paras": ["Про нові повстання через данину літопис більше не згадує.", "На погостах постійно сиділи люди князя. Раніше князь із дружиною з’являвся в цих землях лише раз на рік, під час полюддя."], "img": null}], "note": "«І ходила Ольга по Деревлянській землі… встановлюючи устави й уроки. І є становища її й ловища… І рушила Ольга до Новгорода й встановила по Мсті погости й данини» (Повість минулих літ, під 947 р., переказ)."}, {"type": "doc", "title": "Ольга в Константинополі", "quote": ["Пішла Ольга в Греки й прийшла до Цесарограда. А був тоді цесар Костянтин, син Лева. І прийшла до нього Ольга. Побачивши, що вона дуже гарна на вроду й розумна, цесар подивувався її розумові.", "Вона ж, зрозумівши це, сказала: «Я язичниця. Якщо хочеш мене хрестити, то охрести мене сам». І охрестив її цесар із патріархом, і наречена вона була в хрещенні Оленою.", "І благословив її патріарх, і пішла вона з миром у свою землю, і прийшла до Києва."], "source": "Повість минулих літ, під 955 р. (переклад-переказ, скорочено)", "comment": ["Про цю подорож розповів і сам **Костянтин Багрянородний**: у книзі про придворні церемонії він описав два прийоми «архонтиси Русі Ельги» в палаці.", "Далі літопис оповідає, ніби імператор посватався до Ольги, а вона його перехитрила. Це вже легенда — Костянтин був одружений.", "__Слова з літопису:__ **в Греки** — до Візантії; **цесар Костянтин, син Лева** — імператор Костянтин VII Багрянородний."], "img": {"key": "olga_skyl", "cap": "Імператор приймає Ольгу. Мадридський Скилиця (XII ст.). Фото: John Skylitzes / Wikimedia Commons, CC BY-SA 4.0"}}]}, {"id": "s5", "num": "V", "title": "Князь Святослав", "sub": "Походи на схід і на Дунай, війна з Візантією, загибель на порогах", "cover": {"key": "lansere", "cap": ""}, "cards": [{"type": "text", "kicker": "Князь Святослав", "title": "Святослав Ігорович (бл. 964 – 972)", "badges": ["НМТ: персоналія"], "paras": ["Сина Ігоря й Ольги виховували дружинники, і він змалку звик до війська. Державними справами Святослав цікавився мало: поки він воював, державою й далі правила мати. Хреститися Святослав відмовився: казав, що з нього сміятимуться дружинники.", "Майже все князювання він провів у походах. Йому потрібні були **торгові шляхи** — Волга, Дон, Дунай — і данина з тих, хто на них жив.", "Спершу Святослав рушив **на схід** (964 – 966 рр.): підкорив в’ятичів і розгромив Хозарський каганат. Потім двічі ходив **на Дунай** (968 і 969 – 971 рр.), де зрештою зіткнувся з Візантією й мусив відступити.", "Додому він не дійшов: **972 р.** на дніпровських порогах його вбили печеніги."], "imgs": [{"key": "vyat_tribute", "cap": "В’ятичі приносять данину Святославу. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}, {"type": "doc", "title": "Яким був Святослав: літопис і візантієць", "quote": ["Коли Святослав виріс і змужнів, став він воїв збирати багатьох і хоробрих. І легко ходив у походах, як пардус. Возів за собою не возив, ні котла, ні м’яса не варив, а, тонко нарізавши конину, на вугіллі пік і їв. Не мав він шатра, а стелив пітник (повстину з-під сідла), а сідло клав у голови. І посилав до інших земель, кажучи: «Хочу на вас іти». (Повість минулих літ)", "Був він помірного зросту, з густими бровами, блакитними очима, кирпатий, безбородий, з густими довгими вусами. Голова зовсім гола, лише з одного боку звисало пасмо волосся — ознака знатного роду. В одному вусі — золота сережка з двома перлинами й рубіном. Одяг білий, нічим не кращий за одяг інших, тільки чистіший. (Лев Диякон)"], "source": "Повість минулих літ, під 964 р.; Лев Диякон. Історія, кн. IX, кінець X ст. (переклад-переказ, скорочено)", "comment": ["Князя описують два автори: руський літописець і візантієць. **Лев Диякон** — візантійський історик; він розповідає, яким побачили Святослава греки 971 р. на березі Дунаю.", "Слова «Хочу на вас іти» означають, що князь попереджав ворога про напад. Звідси відомий вислів «Іду на ви».", "__Слова з джерел:__ **пардус** — гепард або барс; **вої** — воїни."], "img": {"key": "lebedev_sv", "cap": "К. Лебедєв. Зустріч Святослава з імператором Іоанном Цимісхієм (бл. 1880): художник спирався на опис Лева Диякона. Суспільне надбання"}}, {"type": "text", "kicker": "Князь Святослав", "title": "Східний похід (964 – 966)", "badges": [], "paras": ["Почав Святослав із **в’ятичів** на Оці — останнього східнослов’янського союзу, що досі платив данину хозарам. Остаточно він підкорив їх 966 р., повертаючись додому.", "Далі він розбив **Волзьку Булгарію** й Волгою спустився до центру **Хозарського каганату**. Літопис оповідає коротко: «Хозари вийшли супроти нього з каганом, князем своїм. І сталася битва, і одолів Святослав хозар, і город їхній Білу Вежу взяв. І ясів переміг, і касогів».", "Руси зруйнували столицю каганату **Ітиль** у гирлі Волги, пройшли Північним Кавказом, де перемогли **ясів** і **касогів**, і вийшли до **Тмутаракані** на березі Керченської протоки. Дорогою додому взяли фортецю **Саркел** (Білу Вежу) на Дону.", "Каганат, що колись збирав данину з полян і сіверян, після цього розгрому занепав. Проте раніше він стримував кочовиків зі сходу. Тепер у степу запанували **печеніги**, і вже вони стали головною загрозою для Русі."], "imgs": [{"key": "sv_khaz", "cap": "Битва Святослава з хозарами. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}, {"type": "map", "steps": [{"key": "p1_svyat0", "label": "До походу"}, {"key": "p1_svyat1", "label": "Східний похід"}]}, {"type": "text", "kicker": "Князь Святослав", "title": "Перший похід на Дунай і облога Києва (968)", "badges": [], "paras": ["Візантія ворогувала з Болгарією й вирішила використати проти неї військо русів: імператор Никифор Фока заплатив Святославові золотом, щоб той напав на болгар із півночі.", "**968 р.** Святослав Дніпром і морем дістався Дунаю, розбив болгарське військо, узяв, за літописом, 80 міст і осів у **Переяславці**.", "Поки князь воював, **печеніги облягли Київ**, де лишалися Ольга з онуками. Місто ледве втрималося. Святослав поспіхом повернувся й відігнав кочовиків у степ, а кияни дорікнули йому: чужої землі шукаєш, а свою покинув.", "Лишатися він однак не хотів: «Хочу жити в Переяславці на Дунаї — там середина землі моєї». Коли 969 р. померла Ольга, Святослав посадив синів намісниками — **Ярополка** в Києві, **Олега** в Деревлянській землі, **Володимира** в Новгороді — і знову рушив на Дунай."], "imgs": [{"key": "sv_arrival", "cap": "Святослав повертається до Києва, обложеного печенігами (968). Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}, {"type": "map", "steps": [{"key": "p1_svyat1", "label": "Східний похід"}, {"key": "p1_svyat2", "label": "Дунай, 968"}]}, {"type": "text", "kicker": "Князь Святослав", "title": "Війна з Візантією (969 – 971)", "badges": [], "paras": ["Удруге Святослав ішов на Дунай уже не як союзник імперії. Візантії не потрібен був сильний сусід на місці слабкої Болгарії, і недавні союзники стали ворогами.", "**970 р.** руси разом із болгарами, уграми й печенігами перейшли Балканські гори, але під **Аркадіополем**, недалеко від Константинополя, зазнали невдачі й відступили.", "Навесні **971 р.** новий імператор Іоанн Цимісхій сам повів військо в Болгарію, здобув її столицю Преслав і замкнув Святослава в **Доростолі** на Дунаї.", "Облога тривала три місяці. Руси раз у раз виходили битися під мури, але прорватися не змогли. Харчі закінчувалися, а візантійські кораблі з «грецьким вогнем» перекрили Дунай."], "imgs": [{"key": "skyl170v", "cap": "Битва русів із візантійцями. Мадридський Скилиця (XII ст.). Суспільне надбання"}]}, {"type": "doc", "title": "«Мертві сорому не мають»", "quote": ["Уже нам нікуди дітись, а волею і неволею [доведеться] стати насупроти. Тож не осоромимо землі Руської, а ляжемо кістьми тут, бо ж мертвий сорому не зазнає. Якщо ж побіжимо ми, — то сором нам.", "Тож не втечемо, а станемо кріпко, а я перед вами піду. Якщо моя голова ляже, — тоді [самі] подумайте про себе. І сказали вої: «Де голова твоя ляже, там і наші голови ми зложимо»."], "source": "Повість минулих літ, під 971 р. (переклад Л. Махновця)", "comment": ["З такими словами, за літописом, Святослав звернувся до воїнів перед битвою з візантійцями, коли ворогів було вдесятеро більше. Звідси крилатий вислів «Мертві сорому не мають».", "Князь обіцяє йти **попереду**, а дружина відповідає клятвою померти разом із ним. Для дружинника ганьба втечі була гіршою за смерть.", "__Слова з літопису:__ **волею і неволею** — хоч-не-хоч; **ляжемо кістьми** — загинемо в бою; **кріпко** — твердо."], "img": null}, {"type": "doc", "title": "Доростол: Святослав радиться з дружиною", "quote": ["Святослав же прийняв дари і став радитися з дружиною своєю, говорячи так: «Якщо ми не вчинимо миру з цесарем, а довідається цесар, що нас мало є, то, прийшовши, обступлять вони нас у городі.", "А Руська земля далеко є, і печеніги з нами вороги, — то хто нам поможе? Учинимо ж мир із цесарем, бо він же згодився нам на данину, — і сього хай буде досить нам».", "І до вподоби була річ ся дружині, і послали вони ліпших мужів до цесаря."], "source": "Повість минулих літ, під 971 р. (переклад Л. Махновця)", "comment": ["Той самий князь, що закликав лягти кістьми, тепер тверезо зважує сили: війська мало, до Русі далеко, печеніги ворожі.", "Миритися чи ні, він вирішує не сам, а **з дружиною**: вона для князя і військо, і рада. Так само 944 р. чинив його батько Ігор.", "__Слова з літопису:__ **цесар** — імператор Іоанн Цимісхій; **ліпші мужі** — старші дружинники; **річ** — тут: промова."], "img": null}, {"type": "doc", "title": "Договір Святослава з Візантією 971 р.", "quote": ["Я, Святослав, князь руський, як клявся, так і стверджую договором цим клятву свою: хочу мати мир і любов досконалу з кожним великим царем грецьким до кінця віку.", "І ніколи не помишлятиму на країну вашу, і не збиратиму воїв, і не наводитиму іншого народу на країну вашу — ні на ту, що під владою грецькою, ні на Корсунську країну, ні на Болгарську.", "А якщо хтось інший помишлятиме на країну вашу, то я буду противником йому і битимуся з ним."], "source": "Повість минулих літ, під 971 р. (переклад-переказ, скорочено)", "comment": ["Мир уклали в липні 971 р. під Доростолом. Святослав **відмовився від Болгарії** й пообіцяв не зазіхати на **Херсонес** (Корсунь) у Криму.", "Натомість візантійці випустили його військо, дали хліба на дорогу й підтвердили давні торгові угоди. Тоді ж князь і зустрівся з імператором на березі Дунаю.", "__Слова з договору:__ **Корсунська країна** — Херсонес і його околиці в Криму; **помишляти** — замірятися, мати ворожий намір."], "img": {"key": "sv2", "cap": "Зустріч Святослава з Іоанном Цимісхієм на Дунаї. Мадридський Скилиця (XII ст.). Суспільне надбання"}}, {"type": "text", "kicker": "Князь Святослав", "title": "Загибель на порогах (972)", "badges": [], "paras": ["Восени 971 р. рештки війська попливли додому. На дніпровських порогах на них уже чекали печеніги хана **Курі**: їм, за літописом, дали знати, що князь повертається з багатою здобиччю й малою дружиною.", "Воєвода Свенельд радив обійти пороги кіньми, степом. Святослав не послухав і лишився зимувати в гирлі Дніпра, на Білобережжі. Зима видалася голодною.", "Навесні **972 р.** князь таки рушив через пороги й загинув у бою. Літопис розповідає, що Куря звелів окувати його череп і зробити з нього чашу.", "Свенельд дістався Києва, де вже княжив Ярополк. Між синами Святослава невдовзі спалахне війна — про неї в частині 2."], "imgs": [{"key": "sv_porogy", "cap": "Загибель Святослава на порогах. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}, {"key": "skyl173", "cap": "Печеніги вбивають Святослава. Мадридський Скилиця (XII ст.). Суспільне надбання"}]}, {"type": "map", "steps": [{"key": "p1_svyat2", "label": "Дунай, 968"}, {"key": "p1_svyat3", "label": "Війна з Візантією"}]}, {"type": "defs", "title": "Підсумки князювання Святослава", "badges": [], "items": [{"name": "Що здобув", "paras": ["Підкорив **в’ятичів** — останній союз, який платив хозарам.", "Розгромив **Хозарський каганат**, давнього суперника на сході.", "Розбив **Волзьку Булгарію**, ясів і касогів."], "img": null}, {"name": "Що втратив", "paras": ["Мусив залишити **Дунайську Болгарію**.", "Пообіцяв не зазіхати на **Херсонес** у Криму.", "Загинув сам і погубив більшу частину дружини."], "img": null}, {"name": "Що лишив по собі", "paras": ["У степу замість хозар запанували **печеніги**.", "Поки князь воював далеко, Київ ледве не взяли кочовики.", "Троє синів сиділи в різних землях — і невдовзі **почали воювати між собою** (частина 2)."], "img": null}], "note": null}]}, {"id": "s6", "num": "VI", "title": "Держава перших князів. Підсумки", "sub": "Як було влаштовано Русь, таблиця князів, древо, стрічки часу", "cover": {"key": "perun", "cap": ""}, "cards": [{"type": "defs", "title": "Як було влаштовано Русь за перших князів", "badges": [], "items": [{"name": "Князь", "paras": ["Насамперед **воєначальник**. Він водив дружину в походи, збирав данину, судив і укладав договори з іншими державами."], "img": null}, {"name": "Дружина", "paras": ["Воїни й водночас радники: без них князь не починав війни й не укладав миру. **Старша дружина** — знать, **молодша** — рядові воїни."], "img": null}, {"name": "Віче", "paras": ["Збори вільних чоловіків у місті. За перших князів літопис згадує про нього рідко: усе вирішували князь і дружина."], "img": null}, {"name": "Данина", "paras": ["Головний прибуток князя. Спершу її збирали **полюддям**, після реформи Ольги — за **уставами й уроками** на **погостах**."], "img": null}], "note": "Русь за перших князів історики називають **дружинною** державою: князь правив разом із дружиною, а підкорені землі утримував силою й збирав із них данину. Власних князів ці землі втратять за Володимира (частина 2)."}, {"type": "table", "title": "Перші київські князі", "rows": [["Князь", "Роки", "Усередині держави", "Зовнішня політика", "Втрати й невдачі"], ["Аскольд", "сер. IX ст. – 882", "князь у Києві; «Аскольдове хрещення»", "**860** — похід на Константинополь, перший договір", "убитий Олегом"], ["Олег", "882 – 912", "**882** — об’єднав північ і південь; Київ — столиця; полюддя", "**907** — похід, **911** — договір", "—"], ["Ігор", "912 – 945", "приборкав деревлян і уличів", "**941** — поразка, **944** — договір; Каспій", "договір 944 р. гірший; убитий деревлянами"], ["Ольга", "945 – бл. 964", "помста деревлянам; **устави, уроки, погости**", "хрещення в Константинополі; посольство до Оттона I", "місія Адальберта невдала"], ["Святослав", "бл. 964 – 972", "посадив синів намісниками", "964 – 966 — схід; 968 – 971 — Балкани", "втратив Болгарію, пообіцяв не чіпати Херсонес; загинув"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "860 чи 866?", "paras": ["Похід Аскольда — **860 р.** (за візантійцями).", "У «Повісті минулих літ» помилково — 866 р."], "img": null}, {"name": "Чиї походи", "paras": ["**907, 911** — Олег.", "**941, 944** — Ігор.", "**860** — Аскольд."], "img": null}, {"name": "862 і 882", "paras": ["**862** — покликання Рюрика на північ (легенда).", "**882** — Олег об’єднав північ і південь."], "img": null}, {"name": "Данина", "paras": ["**Полюддя** — об’їзд князем земель (Олег, Ігор).", "**Уроки й погости** — реформа Ольги."], "img": null}, {"name": "Кочовики", "paras": ["Святослав розгромив **хозар**, а загинув від **печенігів** (972).", "Половці з’являться пізніше — у середині XI ст."], "img": null}], "note": null}, {"type": "defs", "title": "Перші Рюриковичі", "badges": [], "items": [{"name": "Рюрик (пом. 879, Новгород)", "paras": ["Син: **Ігор** (912 – 945)."], "img": null}, {"name": "Ігор (912 – 945)", "paras": ["Син: **Святослав** (бл. 964 – 972)."], "img": null}, {"name": "Святослав (бл. 964 – 972)", "paras": ["Сини: Ярополк (Київ, 972 – 980); Олег (Деревлянська земля); Володимир (Новгород; Київ 980 – 1015)."], "img": null}], "note": "Ольга — дружина Ігоря. Олег — родич Рюрика (за літописом), правив замість малого Ігоря. Аскольд і Дір до Рюриковичів не належали. Володимир — частина 2. Жирним виділено персоналії з програми НМТ."}, {"type": "tl_events", "title": "Стрічка часу (1): утворення Русі", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "860", "name": "Аскольд", "desc": "похід на Константинополь, перший договір", "color": "#7fd06a", "prog": true}, {"year": "862", "name": "Рюрик", "desc": "покликання варягів (легенда)", "color": "#a6a6a6", "prog": false}, {"year": "882", "name": "Олег", "desc": "об’єднав північні й південні землі", "color": "#7fd06a", "prog": true}, {"year": "898", "name": "Угри", "desc": "пройшли повз Київ", "color": "#d9607e", "prog": false}, {"year": "907", "name": "Олег", "desc": "похід на Царгород", "color": "#7fd06a", "prog": true}, {"year": "911", "name": "Олег", "desc": "договір з Візантією", "color": "#7fd06a", "prog": true}, {"year": "915", "name": "Печеніги", "desc": "уперше біля Русі", "color": "#e05a47", "prog": false}, {"year": "941", "name": "Ігор", "desc": "поразка від «грецького вогню»", "color": "#7fd06a", "prog": true}, {"year": "944", "name": "Ігор", "desc": "похід і договір", "color": "#7fd06a", "prog": true}]}, {"type": "tl_events", "title": "Стрічка часу (2): Ольга й Святослав", "note": "Дати цієї стрічки не входять до обов’язкових у програмі НМТ, але допомагають встановити послідовність подій.", "items": [{"year": "945", "name": "Ігор", "desc": "загинув у деревлян", "color": "#7fd06a", "prog": false}, {"year": "946", "name": "Ольга", "desc": "спалила Іскоростень", "color": "#8ccf84", "prog": false}, {"year": "957", "name": "Ольга", "desc": "хрещення в Константинополі", "color": "#8ccf84", "prog": false}, {"year": "964 – 966", "name": "Святослав", "desc": "похід на хозар", "color": "#e97132", "prog": false}, {"year": "968", "name": "Святослав", "desc": "на Дунаї; печеніги під Києвом", "color": "#e97132", "prog": false}, {"year": "969 – 971", "name": "Святослав", "desc": "війна з Візантією, Доростол", "color": "#e97132", "prog": false}, {"year": "972", "name": "Святослав", "desc": "загинув на порогах", "color": "#e97132", "prog": false}]}]}]}, {"id": "p2", "num": 2, "title": "Русь-Україна (Київська держава)", "part": "Частина 2. Доба розквіту", "sub": "Володимир Великий і Ярослав Мудрий, хрещення Русі, суспільство, господарство, культура", "cover": {"key": "rc_bapt", "cap": "Хрещення Володимира. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **988 р.** — запровадження християнства як державної релігії", "• **1019 – 1054 рр.** — князювання Ярослава Мудрого в Києві", "• **1036 р.** — розгром печенігів князем Ярославом Мудрим"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії", "light": false}, {"k": "p", "paras": ["• **Володимир Великий, Ярослав Мудрий, Мстислав Володимирович, митрополит Іларіон**", "• Картосхема: межі Русі-України **за Ярослава Мудрого**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **християнство, шлюбна дипломатія, віче**", "• **вотчинне й умовне землеволодіння**", "• **боярин, смерд, ізгой, закуп, рядович, холоп**", "• **ікона, мозаїка, фреска, билина**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятки й джерела", "light": false}, {"k": "p", "paras": ["• **Софійський собор** у Києві, мозаїки **Оранта** і **Христос Вседержитель**", "• **Спасо-Преображенський собор** у Чернігові (1036)", "• **«Руська правда»**, «Слово про закон і благодать»"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ, тема 3. «Мстислав Володимирович» — так звали двох князів: брата Ярослава (ця частина) і сина Мономаха Мстислава Великого (частина 3). Вивчаємо обох."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Володимир Великий", "sub": "Як син Святослава здобув Київ, чим зміцнив державу й з ким воював", "cover": {"key": "next2b", "cap": ""}, "cards": [{"type": "defs", "title": "Боротьба синів Святослава (972 – 980)", "badges": [], "items": [{"name": "Ярополк", "paras": ["Старший син, сидів у **Києві**.", "977 р. пішов війною на брата Олега.", "980 р. Володимир обложив його в Родні й викликав на переговори. Щойно Ярополк увійшов у двері, його закололи двоє варягів."], "img": null}, {"name": "Олег", "paras": ["Середній син, княжив у **Деревлянській землі**.", "977 р. його військо тікало від Ярополка до Вручого. На мосту перед брамою зчинилася тиснява, князя зіштовхнули в рів, і він загинув."], "img": null}, {"name": "Володимир", "paras": ["Наймолодший, сидів у **Новгороді**.", "Почувши про смерть Олега, утік за море й повернувся з найманцями-варягами.", "Дорогою до Києва здобув Полоцьк, а **980 р.** лишився єдиним князем Русі."], "img": null}], "note": "Боротьба синів Святослава — перша міжусобиця на Русі, тобто війна князів-родичів за владу. Після смерті Володимира вона повториться."}, {"type": "text", "kicker": "Володимир Великий", "title": "Володимир Святославич (980 – 1015)", "badges": ["НМТ: персоналія"], "paras": ["Володимир був сином Святослава й **Малуші**, ключниці княгині Ольги. Через таке походження полоцька князівна Рогнеда відмовилася вийти за нього заміж: назвала «сином рабині».", "Київ він здобув **980 р.** і правив 35 років. За цей час Києву підкорилися **всі східнослов’янські землі**, а держава змінилася: у містах замість племінних князів сіли сини Володимира, замість віри в багатьох богів князь запровадив **християнство**.", "Володимир першим на Русі карбував власні монети — **златники** й **срібники**. На них зображено князя на престолі та його родовий знак, **тризуб**. Сьогодні тризуб — герб України.", "Билини звуть його **Красним Сонечком**, історики — **Великим**, а Церква шанує як **святого рівноапостольного**."], "imgs": [{"key": "zlatnik", "cap": "Златник Володимира."}, {"key": "srebr", "cap": "Срібник Володимира з тризубом."}]}, {"type": "map", "title": "Як Володимир збирав землі", "steps": [{"key": "p2_rus0", "label": "980 р."}, {"key": "p2_rus1", "label": "За Володимира"}]}, {"type": "text", "title": "", "badges": [], "paras": ["Після міжусобиці землі довкола Києва довелося збирати заново. __Клацніть — і на карті з’являться землі, які приєднав Володимир.__", "**981 р.** він пішов на захід, підкорив **волинян** і зайняв **Червенські міста**, на які претендувала Польща. **992 р.** приєднав землю **білих хорватів** у Прикарпатті.", "**В’ятичі** й **радимичі** перестали платити Києву данину, тому Володимир підкорив їх удруге (981 – 982 і 984 рр.).", "Ходив на ятвягів (983) і Волзьку Булгарію (985), а **988 р.** здобув візантійський **Херсонес** (Корсунь) у Криму.", "Найнебезпечнішим лишався південь: звідти нападали печеніги."], "imgs": []}, {"type": "defs", "title": "Як Володимир зміцнив державу", "badges": [], "items": [{"name": "Сини-намісники", "paras": ["Місцеві князі не раз виходили з-під влади Києва, тому Володимир їх усунув.", "У головних містах посадив **своїх синів**: Вишеслава — у Новгороді, Ізяслава — у Полоцьку, Святополка — у Турові, Ярослава — у Ростові, Мстислава — у Тмутаракані."], "img": null}, {"name": "Оборона", "paras": ["На південному кордоні звів **лінії фортець** уздовж Десни, Остра, Трубежу, Сули й Стугни.", "Воїнів для них привів із північних земель."], "img": null}, {"name": "Віра", "paras": ["**980 р.** спробував об’єднати країну довкола старих богів: поставив у Києві шість ідолів на чолі з **Перуном**.", "Старі боги не згуртували племен, тож **988 р.** князь запровадив **християнство**."], "img": null}, {"name": "Монети й закон", "paras": ["Карбував **златники й срібники**: власна монета — ознака самостійної держави.", "Видав **Церковний устав** і віддав Церкві десяту частину своїх доходів — десятину."], "img": null}], "note": null}, {"type": "map", "steps": [{"key": "p2_forts0", "label": "Крок 1"}]}, {"type": "doc", "title": "Як Володимир будував оборону", "quote": ["І сказав Володимир: «Се недобре, що мало городів довкола Києва». І почав він ставити городи по Десні, і по Острі, і по Трубежу, і по Сулі, і по Стугні.", "І почав набирати мужів найкращих від словен, і від кривичів, і від чуді, і від в’ятичів, і ними населив городи. Бо була війна з печенігами, і воював він з ними, і перемагав їх."], "source": "Повість минулих літ, під 988 р. (переклад-переказ, скорочено)", "comment": ["Печеніги діставалися Києва за день-два. Тому Володимир оточив столицю кількома лініями фортець уздовж річок, що впадають у Дніпро.", "Воїнів узяв здалеку, з півночі: відтепер кордон боронила вся держава, а не самі кияни. Між фортецями тяглися земляні **Змієві вали**; за переказом, їх виорав Кирило Кожум’яка, запрягши в плуг змія.", "__Слова з літопису:__ **городи** — фортеці; **мужі найкращі** — добірні воїни; **чудь** — фіно-угорський народ на півночі."], "img": {"key": "valy", "cap": "Змієві вали на Переяславщині. Фото: Maxim Bielushkin / Wikimedia Commons, CC BY-SA 3.0"}}, {"type": "defs", "title": "Зовнішня політика Володимира", "badges": [], "items": [{"name": "Захід", "paras": ["**981 р.** відібрав у Польщі Червенські міста, **992 р.** приєднав білих хорватів.", "Згодом помирився з польським князем Болеславом і одружив сина Святополка з його донькою."], "img": null}, {"name": "Схід", "paras": ["**985 р.** ходив на Волзьку Булгарію й уклав мир «навіки»: доки камінь не почне плавати, а хміль — тонути."], "img": null}, {"name": "Південь", "paras": ["Тут Русь воювала постійно: печеніги нападали майже щороку.", "Про ті часи розповідають легенди — про юнака-кожум’яку, що здолав печенізького силача (992), і про хитрість обложених білгородців (997)."], "img": null}, {"name": "Візантія", "paras": ["Допоміг імператорові Василію II військом проти заколотників.", "За це зажадав віддати за нього сестру імператора **Анну**. Шлюб відбувся після походу на Херсонес (**988**)."], "img": null}], "note": "**Шлюбна дипломатія** — союзи між державами, скріплені шлюбами правителів та їхніх дітей. Одружившись із сестрою імператора, Володимир став рівнею наймогутнішим володарям Європи. Як це сталося — у наступному розділі."}]}, {"id": "s2", "num": "II", "title": "Хрещення Русі-України", "sub": "988 р.: чому Володимир обрав християнство і що це змінило", "cover": {"key": "v_bapt", "cap": ""}, "cards": [{"type": "defs", "title": "Чому Володимир прийняв християнство", "badges": ["НМТ: поняття"], "items": [{"name": "Єдність", "paras": ["Поляни, сіверяни, словени шанували різних місцевих богів-покровителів і мали різні звичаї. Спільна віра мала об’єднати їх в **один народ**."], "img": null}, {"name": "Влада князя", "paras": ["Церква навчала, що влада князя — від Бога. Отже, коритися йому мав кожен."], "img": null}, {"name": "Сусіди", "paras": ["**Візантія**, Болгарія, Чехія, Польща вже були християнськими. З язичником там неохоче укладали союзи й не віддавали за нього доньок."], "img": null}, {"name": "Культура", "paras": ["Із вірою приходили **письмо** й книги, кам’яні храми, живопис — усе, чим славилася Візантія."], "img": null}], "note": "**Християнство** — одна зі світових релігій, основою якої є віра в Ісуса Христа як Бога й Спасителя. Русь прийняла його за візантійським (східним) обрядом."}, {"type": "doc", "title": "«Вибір віри»: легенда з літопису", "quote": ["Прийшли болгари віри магометової й сказали: «Обрізуйтеся, свинини не їжте й вина не пийте». Сказав Володимир: «Русі єсть веселіє пити. Не можемо без того бути».", "Прийшли німці від Папи. Відповів їм Володимир: «Ідіть звідки прийшли, бо отці наші цього не прийняли». Прийшли хозарські юдеї. Спитав Володимир: «А де ваша земля?» — «Розгнівався Бог на отців наших і розсіяв нас». — «То як же ви інших учите, а самі відкинуті Богом?»", "Повернулися ж посли, що ходили до греків, і сказали: «Не знали ми, на небі ми чи на землі, бо нема на землі такого видовища й краси такої»."], "source": "Повість минулих літ, під 986 – 987 рр. (переклад-переказ, скорочено)", "comment": ["Розповідь про «вибір віри» склали пізніше, і вона більше схожа на притчу, ніж на звіт про події. Насправді Володимир мав вагомі причини обрати віру Візантії: Русь здавна з нею торгувала, там охрестилася Ольга.", "Проте в легенді є й правда: князь справді вибирав, бо кожна віра означала ще й союз із певною державою.", "__Слова з літопису:__ **болгари віри магометової** — волзькі булгари, мусульмани; **німці від Папи** — посланці Римської церкви; **греки** — візантійці."], "img": null}, {"type": "doc", "title": "Похід на Корсунь і шлюб з Анною (988)", "quote": ["Пішов Володимир з військом на Корсунь, город грецький, і заперлися корсуняни в городі. І стояв Володимир на тому боці міста в гавані… І послав Володимир до цесарів Василія й Костянтина сказати: «Ось узяв я ваш город славний. Чув я, що маєте сестру дівицю. Якщо не віддасте її за мене, то вчиню вашій столиці те саме, що й Корсуню».", "І відповіли цесарі: «Не годиться християнам віддавати жінок за поганих. Якщо охрестишся, то й її дістанеш». І послали цесарі сестру свою Анну."], "source": "Повість минулих літ, під 988 р. (переклад-переказ, скорочено)", "comment": ["Імператор Василій II попросив у Володимира війська й пообіцяв за це сестру. Військо князь надіслав, а імператор зволікав зі шлюбом. Тоді він обложив візантійський Херсонес.", "Після шлюбу Володимир повернув місто як «віно» — викуп за наречену. Де він охрестився — у Херсонесі, Києві чи Василеві, — історики сперечаються.", "__Слова з літопису:__ **Корсунь** — руська назва Херсонеса; **цесарі** — імператори-співправителі Василій і Костянтин; **погані** — язичники."], "img": {"key": "rc_korsun", "cap": "Володимир облягає Корсунь. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}}, {"type": "doc", "title": "Хрещення киян (988)", "quote": ["Коли ж прийшов [Володимир до Києва], повелів поскидати ідолів — одних порубати, а інших спалити. Перуна ж повелів прив’язати коневі до хвоста й волочити з гори… і вкинути в Дніпро.", "Потім розіслав Володимир по всьому городу, кажучи: «Якщо не прийде хто завтра на ріку — багатий, чи бідний, чи старець, чи раб, — той противником мені буде».", "І зійшлися люди без числа, і ввійшли у воду — стояли одні по шию, інші по груди, малі біля берега… А попи, стоячи, молитви творили."], "source": "Повість минулих літ, під 988 р. (переклад-переказ, скорочено)", "comment": ["Киян хрестили в Дніпрі (за іншою версією — в його притоці Почайні). Ідолів, яких сам Володимир поставив за вісім років до того, скинули й знищили.", "Слова «противником мені буде» показують, що нову віру запроваджували **наказом князя**. Кияни не чинили опору, а новгородців хрестили силою.", "__Слова з літопису:__ **старець** — тут: жебрак; **попи** — священики; **Перун** — головний із язичницьких богів."], "img": {"key": "lebedev_bapt", "cap": "К. Лебедєв. Хрещення киян (бл. 1880). Суспільне надбання"}}, {"type": "text", "kicker": "Хрещення Русі", "title": "Десятинна церква — перший кам’яний храм", "badges": [], "paras": ["Одразу після хрещення Володимир звів у Києві церкву Богородиці. Її будували **візантійські майстри** в **989 – 996 рр.**", "На її утримання князь віддав **десяту частину** своїх доходів — звідси назва **Десятинна**.", "Храм прикрашали мозаїки, фрески, мармур. Тут поховали Володимира й Анну.", "**1240 р.**, під час монгольського штурму Києва, Десятинна обвалилася. Нині на її місці — відкриті фундаменти."], "imgs": [{"key": "rc_tithe", "cap": "Будівництво Десятинної церкви. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}, {"type": "defs", "title": "Наслідки запровадження християнства", "badges": [], "items": [{"name": "Держава", "paras

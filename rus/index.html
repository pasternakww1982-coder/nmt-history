і монастир став головним **центром книжності** на Русі: тут вели літописи, писали житія святих та ікони.", "Антоній помер **1073 р.** Його вважають **засновником чернецтва** на Русі."], "imgs": [{"key": "antfeod", "cap": "Антоній і Феодосій Печерські перед Богородицею. Ікона XVIII ст. Фото: unknown monk / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Література", "title": "Літописи", "badges": ["НМТ: поняття"], "paras": ["**Літопис** — історичний твір, у якому розповідь ведуть **за роками**: події й факти викладено в хронологічному порядку. Кожен запис починався словами «В літо…», тобто «У рік…», — звідси й назва.", "Вели літописи ченці й священики в монастирях і при княжих дворах. Новий літописець переписував працю попередників і додавав те, що сталося за його часу.", "Найдавніші літописи дійшли до нас лише в пізніших копіях — **списках**: **Лаврентіївському** (1377), **Іпатіївському** (близько 1425) і **Радзивіллівському** (кінець XV ст.), у якому понад 600 мініатюр.", "Найважливіші літописи Русі-України — **«Повість минулих літ»**, **Київський літопис** (XII ст.) і **Галицько-Волинський літопис** (XIII ст.)."], "imgs": [{"key": "lavra_view", "cap": "Києво-Печерська лавра — тут писали літописи. Фото: Ввласенко / Wikimedia Commons, CC BY 4.0"}]}, {"type": "text", "kicker": "Література", "title": "«Повість минулих літ» (1113)", "badges": ["НМТ: дата"], "paras": ["**«Повість минулих літ»** — найдавніший літопис Русі, що зберігся. Його близько **1113 р.** уклав у Києво-Печерському монастирі чернець **Нестор**.", "Назва походить від перших слів літопису: «Це повісті минулих літ — звідки пішла Руська земля, хто в Києві почав першим княжити і як Руська земля постала».", "Нестор починає від розселення слов’ян і доводить розповідь до початку XII ст. Він користувався давнішими літописами, текстами договорів із Візантією, переказами й житіями.", "Потім літопис двічі переробляли: **1116 р.** це зробив ігумен Видубицького монастиря **Сильвестр** на замовлення Мономаха, **1118 р.** з’явилася ще одна редакція."], "imgs": [{"key": "hyp104", "cap": "Сторінка Іпатіївського списку (XV ст.): у таких пізніших копіях «Повість» і дійшла до нас. Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Література", "title": "Нестор Літописець", "badges": ["НМТ: персоналія"], "paras": ["Про Нестора відомо небагато. До **Києво-Печерського монастиря** він прийшов сімнадцятирічним, у 1070-х рр., і прожив там усе життя.", "Спершу Нестор написав два житія: князів **Бориса й Гліба** та ігумена **Феодосія Печерського**.", "Головна його праця — **«Повість минулих літ»**, укладена близько **1113 р.** Через неї Нестора називають Літописцем.", "Помер він на початку XII ст.; похований у Ближніх печерах лаври. Церква шанує його як святого.", "Скульптуру «Нестор-літописець» створив **1890 р.** Марко Антокольський: чернець сидить над рукописом із пером у руці."], "imgs": [{"key": "nestor_st", "cap": "М. Антокольський. Нестор-літописець (1890)."}]}, {"type": "doc", "title": "«Києво-Печерський патерик»", "quote": ["Був у тому ж монастирі Печерському чернець на ім’я Аліпій. Віддали його батьки ще юним навчатися іконописання… Навчився ж він іконописної хитрощі вельми гарно.", "Якщо ж хто приносив йому ікони старі, він оновлював їх. І ніколи не сидів без діла…", "Сказав про нього ігумен: «Якщо хтось замовить ікону й не заплатить, Аліпій не вимагає. А як заплатить — третину віддає на ікони, третину жебракам, третину на свої потреби»."], "source": "«Києво-Печерський патерик», слово про Аліпія, XIII ст. (переклад-переказ, скорочено)", "comment": ["**Патерик** — збірка оповідей про ченців одного монастиря. Києво-Печерський патерик уклали в **XIII ст.** з листів єпископа Симона та ченця Полікарпа.", "Тільки з нього ми знаємо про іконописця **Аліпія**, лікаря **Агапіта** й князя **Святошу**, який зрікся влади й став ченцем.", "__Слова з патерика:__ **іконописна хитрість** — мистецтво писати ікони; **оновлював** — підновлював потемнілі ікони."], "img": {"key": "pateryk", "cap": "Києво-Печерський патерик, видання друкарні лаври 1661 р. Фото: невідомий автор / Wikimedia Commons, Public domain"}}, {"type": "text", "kicker": "Література", "title": "«Слово о полку Ігоревім»", "badges": [], "paras": ["**«Слово о полку Ігоревім»** — поема про похід новгород-сіверського князя **Ігоря Святославича** на половців **1185 р.** Половці розгромили військо Ігоря, а сам князь потрапив у полон.", "Хто її написав, невідомо. Найпевніше, це був дружинник або придворний співець, сучасник подій. У програмі НМТ твір датовано **1187 р.**", "Поразку Ігоря автор пояснює тим, що князі діють нарізно. Він звертається до наймогутніших із них — Всеволода Велике Гніздо, Ярослава Осмомисла, Романа Мстиславича — і **закликає їх об’єднатися** проти половців.", "Найвідоміше місце поеми — **плач Ярославни**, дружини Ігоря, на міській стіні Путивля.", "Єдиний рукопис знайшов наприкінці XVIII ст. збирач старожитностей О. Мусін-Пушкін. **1800 р.** поему надрукували, а 1812 р. рукопис згорів під час пожежі Москви."], "imgs": [{"key": "slovo1800", "cap": "Перше видання «Слова» (Москва, 1800). Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "doc", "title": "«Слово о полку Ігоревім»: плач Ярославни", "quote": ["На Дунаї Ярославнин голос чути: зозулею незнаною рано кує. «Полечу, — каже, — зозулею по Дунаю, умочу рукав шовковий у Каялі-ріці, утру князю криваві його рани на могутньому тілі».", "Ярославна рано плаче в Путивлі на заборолі, примовляючи: «О Вітре-Вітрило! Чому, пане, так сильно вієш? Нащо мчиш ханські стріли на своїх легеньких крилах на воїв моєї лади?»", "«О Дніпре Славутичу! Ти пробив кам’яні гори крізь землю Половецьку. Прилелій же, пане, мою ладу до мене, щоб я не слала до нього сліз на море рано»."], "source": "«Слово о полку Ігоревім», кінець XII ст. (переклад-переказ)", "comment": ["Ярославна — дружина Ігоря, донька Ярослава Осмомисла. Вона ще не знає, чи живий чоловік, і просить **Вітер**, **Дніпро** й **Сонце** повернути його.", "Поему написав християнин, але до сил природи його героїня звертається як до живих істот — так, як робили це предки-язичники.", "__Слова зі «Слова»:__ **забороло** — верх міської стіни; **лада** — коханий, чоловік; **вої** — воїни; **прилелій** — принеси на хвилях."], "img": null}]}, {"id": "s3", "num": "III", "title": "Архітектура другої половини XI – XIII ст.", "sub": "Успенський, Михайлівський Золотоверхий собори, П’ятницька церква", "cover": {"key": "usp_ruin", "cap": ""}, "cards": [{"type": "monument", "title": "Успенський собор Києво-Печерської лаври", "badges": [], "img": {"key": "uspensky", "cap": "Успенський собор. Фото: George Chernilevsky / Wikimedia Commons, Public domain"}, "paras": ["Це головний храм **Києво-Печерського монастиря**. Зводили його в **1073 – 1078 рр.** коштом князя **Святослава Ярославича**, освятили 1089 р.", "За монастирським переказом, будувати й прикрашати собор приїхали майстри з Константинополя; у них учився іконописець **Аліпій**.", "Наприкінці XVII – у XVIII ст. собор перебудували в стилі **українського бароко**.", "**1941 р.**, під час німецької окупації Києва, собор висадили в повітря. Відбудували його **1998 – 2000 рр.**", "__Як упізнати на НМТ:__ білий бароковий собор із золотими банями й багато прикрашеним фронтоном."]}, {"type": "monument", "title": "Михайлівський Золотоверхий собор", "badges": [], "img": {"key": "mykhail2", "cap": "Михайлівський Золотоверхий собор. Фото: Ivan Sedlovskyi / Wikimedia Commons, CC BY-SA 4.0"}, "paras": ["Собор збудував у **1108 – 1113 рр.** князь **Святополк II Ізяславич** на честь архангела Михаїла, свого небесного покровителя.", "Його баню першою в Києві вкрили позолотою — тому собор прозвали **Золотоверхим**.", "Усередині були **мозаїки й фрески**. Частину їх — мозаїки «Євхаристія» та «Дмитрій Солунський» — зняли зі стін перед руйнуванням храму.", "У XVIII ст. собор перебудували в стилі **українського бароко**. **1937 р.** радянська влада його знищила; відбудовано собор **1997 – 1999 рр.**", "__Як упізнати на НМТ:__ блакитні стіни, золоті бані."]}, {"type": "carousel", "title": "Знищені й відбудовані", "badges": [], "note": "Обидва собори відбудовано за обмірами й фотографіями XIX – XX ст. Частину мозаїк і фресок Михайлівського собору в 1930-х рр. вивезли до Москви й Ленінграда; не всі з них повернуто.", "items": [{"key": "usp_ruin2", "name": "", "desc": "Руїни Успенського собору до відбудови. Фото: khrul / Wikimedia Commons, CC BY 3.0", "cap": ""}, {"key": "myk_ruin", "name": "", "desc": "Підрив Михайлівського собору, 1937 р.", "cap": ""}, {"key": "myk_mosaic", "name": "", "desc": "Мозаїка «Євхаристія» з Михайлівського собору (початок XII ст.), нині в Софійському соборі. Фото: Rasal Hague / Wikimedia Commons, CC BY-SA 4.0", "cap": ""}]}, {"type": "monument", "title": "П’ятницька церква в Чернігові", "badges": [], "img": {"key": "pyatn", "cap": "П’ятницька церква. Фото: Dmytro Petishkin / Wikimedia Commons, CC BY 4.0"}, "paras": ["Церкву звели наприкінці **XII – на початку XIII ст.** на чернігівському торзі. Будівничим вважають **Петра Милонега**, а замовником міг бути князь **Ігор Святославич**.", "Церква невелика за площею, але **висока й струнка**: одна баня, а під нею — арки, що сходинками підіймаються вгору.", "У XVII ст. церкву перебудували в бароковому стилі. **1943 р.** її зруйнували під час бомбардування.", "Після війни архітектор **П. Барановський** відновив церкву такою, якою вона була за княжих часів (роботи закінчено 1962 р.).", "__Як упізнати на НМТ:__ невеличка цегляна церква з однією банею, «сходинки» арок угорі."]}]}, {"id": "s4", "num": "IV", "title": "Іконопис", "sub": "Аліпій Печерський, Вишгородська й Свенська ікони", "cover": {"key": "alipiy_ic", "cap": ""}, "cards": [{"type": "defs", "title": "Аліпій Печерський — перший відомий іконописець", "badges": ["НМТ: персоналія"], "items": [{"name": "Хто він", "paras": ["Чернець **Києво-Печерського монастиря**. Жив у другій половині XI – на початку XII ст., помер близько **1114 р.**"], "img": null}, {"name": "Як навчився", "paras": ["Хлопцем його віддали в науку до **грецьких майстрів**, які оздоблювали Успенський собор.", "Згодом сам писав ікони й підновлював старі."], "img": null}, {"name": "Що приписують", "paras": ["Участь у мозаїках **Михайлівського Золотоверхого собору**.", "Ікону «Велика Панагія» (Ярославська Оранта).", "Первісний образ Свенської ікони.", "Жодної роботи Аліпія достеменно не встановлено."], "img": null}, {"name": "Звідки знаємо", "paras": ["Із **«Києво-Печерського патерика»**.", "Аліпій — **перший іконописець Русі**, чиє ім’я дійшло до нас. Церква шанує його як святого."], "img": null}], "note": "Зображень Аліпія, зроблених за його життя, немає: усі відомі зображення пізніші."}, {"type": "monument", "title": "Вишгородська ікона Богородиці", "badges": ["НМТ: пам’ятка"], "img": {"key": "vyshg", "cap": "Вишгородська (Володимирська) ікона. Фото: Michel Bakni / Wikimedia Commons, Public domain"}, "paras": ["Ікону написали в Константинополі в **першій третині XII ст.** Близько 1131 р. її привезли на Русь і поставили в жіночому монастирі у **Вишгороді** під Києвом.", "**1155 р.** князь **Андрій Боголюбський**, ідучи з Вишгорода на північ, потай забрав ікону до Володимира-на-Клязьмі. Тому в Росії її називають Володимирською.", "Нині ікона в Москві, у храмі при Третьяковській галереї.", "Богородиця притуляється щокою до щоки Дитяти — такий тип ікон називають «Замилуванням» (Елеуса).", "**Ікона** — зображення Христа, Богородиці, святих і подій зі Святого Письма, виконане живописом, мозаїкою чи рельєфом.", "__Як упізнати на НМТ:__ Марія схиляє голову до Ісуса, той обіймає матір за шию."]}, {"type": "monument", "title": "Свенська ікона Богородиці з Антонієм і Феодосієм Печерськими", "badges": ["НМТ: пам’ятка"], "img": {"key": "svenska", "cap": "Свенська (Печерська) ікона, Третьяковська галерея. Фото: невідомий автор / Wikimedia Commons, Public domain"}, "paras": ["Богородиця з Дитям сидить на троні. Обабіч стоять **Антоній** і **Феодосій Печерські**, засновники Печерського монастиря, із сувоями в руках.", "Ікона повторює давній образ із **Києво-Печерського монастиря**, який переказ приписує **Аліпієві**. Це найдавніше зображення Антонія й Феодосія.", "Назва походить від Свенського монастиря під Брянськом, куди ікону, за переказом, принесли з Києва **1288 р.**", "Нині ікона зберігається в Третьяковській галереї в Москві.", "__Як упізнати на НМТ:__ Богородиця на троні, обабіч — двоє ченців у темному чернечому одязі."]}]}, {"id": "s5", "num": "V", "title": "Підсумки всієї теми", "sub": "Поняття, дати, персоналії, пам’ятки, древо Рюриковичів, велика стрічка часу", "cover": {"key": "trident", "cap": ""}, "cards": [{"type": "generic", "title": "Обов’язкові поняття (1)", "badges": ["НМТ: поняття"], "blocks": [{"k": "p", "paras": ["**Племінний союз** — об’єднання кількох племен, яке за певних умов ставало зародком держави.", "**Князь** — голова держави або окремого політичного об’єднання у слов’ян.", "**Полюддя** — збирання данини: щорічний об’їзд князем і дружиною підвладних земель.", "**Язичництво** — система уявлень про світ, традиційна релігія певного народу; віра в багатьох богів.", "**Християнство** — світова релігія, основа якої — віра в Ісуса Христа як Бога й Спасителя.", "**Шлюбна дипломатія** — встановлення династичних зв’язків між правлячими родами різних держав."], "italic": false}, {"k": "sep"}, {"k": "p", "paras": ["**Роздробленість** — розпад єдиної держави на окремі незалежні державні утворення.", "**Віче** — народні збори, на яких вирішували важливі громадські й державні справи.", "**Вотчинне землеволодіння** — спадкова земельна власність, яку можна продати, подарувати, передати дітям.", "**Умовне землеволодіння** — земля, надана за службу у війську чи при дворі, на час служби.", "**Боярин** — представник правлячого стану, знать: радник князя, воєвода, намісник."], "italic": false}]}, {"type": "generic", "title": "Обов’язкові поняття (2)", "badges" Володимирович"], "ok": [0]}, {"id": "z1-047", "q": "У яких уривках з історичних джерел йдеться про великого князя київського Святослава Ігоревича?", "sec": "s5", "g": "sv-excerpts", "t": "three", "opts": ["«…на другий день посилає до імператора просити миру за такою умовою: [русичі] повинні віддати [візантійцям] Доростол.., [візантійці] повинні дозволити привозити до себе хліб…»", "«Більше вже не хочу мститися – хочу тільки взяти з вас невелику данину. Дайте мені від кожного двору по три голуби і по три горобці...»", "«Хозари вийшли супроти нього з каганом, князем своїм. І зступилися війська битися, і сталася битва межи ними, і одолів він хозар і город їхній столицю Ітіль, і город Білу Вежу взяв...»", "«Зібрав він воїнів і прийшов до Києва, і вчинив мир із братом своїм Мстиславом. І розділили вони по Дніпру Руську землю: собі узяв сю сторону, а Мстислав – ту…»", "«Тепер поручаю я, – замість себе, – стіл свій, Київ, найстаршому синові… Ізяславу, …нехай він вам буде замість мене… А Святославу даю Чернігів, а Всеволоду – Переяслав…»", "«Прийшов [князь] у Переяславець. І послав до греків послів, говорячи: “Хочу йти на вас”… І пішов до Царграда, розоряючи міста. І дали йому данину… І повернувся він в Переяславець…»", "«Виступив тоді він із города, приготував до бою дружину. Зійшлися вони на місці, де ото нині свята Софія стоїть, митрополія руська. І сталася січа люта, і ледве одолів він печенігів під вечір...»"], "ok": [0, 2, 5]}, {"id": "z1-048", "q": "У яких уривках з історичних джерел ідеться про великого князя київського Святослава Ігоревича?", "sec": "s5", "g": "sv-excerpts", "t": "three", "opts": ["«...на другий день посилає до імператора просити миру за такою умовою: [русичі] повинні віддати [візантійцям] Доростол.., [візантійці] повинні дозволити привозити до себе хліб...»", "«І поставив він кумири на пагорбі, поза двором теремним: Перуна дерев’яного, - а голова його була срібна, а вус - золотий, - і Хорса, і Дажбога, і Стрибога, і Сімаргла...»", "«Хозари вийшли ся війська битися, і сталася битва межи ними, і одолів він хозарів і город їхній столицю Ітіль, і город Білу Вежу взяв. І ясів він переміг, і касогів, і прийшов до Києва.»\nЩо стало наслідком описаної події?", "sec": "s5", "g": "khaz-cons", "t": "single", "opts": ["розширення кордонів Русі внаслідок приєднання червенських міст", "виникнення на південних кордонах Русі печенізької загрози", "завершення Балканських походів київського князя", "підписання військово-політичного союзу Києва з Візантією"], "ok": [1]}, {"id": "z1-057", "q": "Що стало одним із наслідків подій, описаних літописцем?\n«Рушив Святослав на Хозар. Почувши ж про це, хозари вийшли насупроти з князем своїм, каганом [Іосифом]. І зступилися війська битися, і сталася битва межи ними, і одолів Святослав хозар і город їхній, столицю Ітіль, і город Білу Вежу взяв...»", "sec": "s5", "g": "khaz-cons", "t": "single", "opts": ["Завершення формування державної території Київської Русі", "Розширення рівноправних зв’язків Русі з європейськими державами", "Налагодження взаємовигідних стосунків Русі з Візантійською імперією", "Відкриття шляху на Русь кочовим народам Сходу, насамперед печенігам"], "ok": [3]}, {"id": "z1-058", "q": "Залежність східнослов’янських племен від київських князів у період становлення Київської держави (Русі-України) проявлялася", "sec": "s6", "g": "zd-dep", "t": "single", "opts": ["у зборі натуральної данини", "у стягуванні грошового податку", "у сплаті церковної десятини", "у відробітку на користь князя"], "ok": [0]}, {"id": "z1-059", "q": "Установіть послідовність подій, описаних в уривках з «Повісті минулих літ».", "sec": "s6", "g": "", "t": "seq", "opts": ["«Ходив Олег проти сіверян, і переміг сіверян, і наклав на них данину легку, і не дозволив їм данину давати хозарам, і сказав: “Я ворог їм, і вам нема чого [данину їм платити]”…»", "«І деревляни кажуть їй: “Нас земля послала Деревлянська, щоби таке сказати: \"Мужа твого вбили, бо твій муж як вовк нас обкрадав і грабував, а наші князі добрі, бо збагатили Деревлянську землю\"”...»", "«Іде Святослав на Дунай воювати болгар. І в битві переміг Святослав болгар, і взяв городів вісімдесят по Дунаю. І сів княжити тут у Переяславці, беручи данину з греків...»", "«…а сам повернувся в Київ. І коли прийшов, повелів скинути всіх кумирів: одних порубати, а інших попалити. Перуна ж повелів прив’язати коневі до хвоста й волочити з гори Боричевим узвозом на Ручай…»"]}, {"id": "z1-060", "q": "З’ясуйте, який уривок з історичного джерела відображає суть кожного з понять.", "sec": "s6", "g": "concept-excerpts", "t": "match", "opts": ["«Поляни, що жили осібно, …були роду слов’янського і називалися полянами, а деревляни теж [пішли] від слов’ян і називалися древлянами. Радимичі ж і в’ятичі [походять] од ляхів…»", "«У ці ж часи видав Ярослав сестру свою [Добронігу-Марію] за Казимира [князя лядського]. І дав Казимир за неї людей вісімсот, яких полонив був Болеслав…»", "«…І поставив він кумири на пагорбі, поза двором теремним: Перуна дерев’яного… і Хорса, і Дажбога, і Стрибога, і Сімаргла, і Макош. І приносили їм люди жертви. Називали їх богами…»", "«…Якщо хто візьме чужого коня, чи зброю, чи одяг, а знайдеться у своєму миру [общині], то взяти хазяїнові своє, а три гривні – за образу…»", "«І приспіла осінь, і став він замишляти [похід] на древлян, прагнувши добути більшу данину…»"], "ok": [4, 2, 1, 0], "left": ["«полюддя»", "«язичництво»", "«шлюбна дипломатія»", "«племінний союз»"]}, {"id": "z1-061", "q": "Установіть відповідність між подією, описаною в уривку з історичного джерела, та іменем великого князя київського, причетного до неї.", "sec": "s6", "g": "princes-exc", "t": "match", "opts": ["Ігор Рюрикович", "Святослав Ігоревич", "Володимир Великий", "Ярослав Мудрий", "Володимир Мономах"], "ok": [1, 3, 0, 2], "left": ["«Прийшов він у Переяславець. І послав до греків послів, говорячи: “Хочу йти на вас”… І пішов до Царгорода, розорюючи міста. І дали греки йому данину…»", "«Зібрав він воїнів і прийшов до Києва, і вчинив мир із братом своїм Мстиславом. І розділили вони по Дніпру Руську землю: собі узяв сю сторону, а Мстислав – ту...»", "«І пішов він на греків, спустошуючи землі їхні. … Греки зустріли їх у човнах з вогнем і стали пускати вогонь трубами на човни руські… І через се не подолали руси їх…»", "«І поставив він кумирів на пагорбі, поза двором княжим: Перуна дерев’яного, – а голова його була срібна, а вус – золотий, – і Хорса, і Дажбога, і Стрибога, і Сімаргла...»"]}, {"id": "z1-062", "q": "Установіть відповідність між іменем великого князя київського та його історичною роллю.", "sec": "s6", "g": "", "t": "match", "opts": ["розгромив Хозарський каганат", "запровадив перший постійний податок – десятину", "об’єднав північні та південні руські землі", "організував проведення Любецького з’їзду князів", "уклав перший кодифікований звід руських законів"], "ok": [2, 0, 1, 4], "left": ["Олег", "Святослав", "Володимир Великий", "Ярослав Мудрий"]}, {"id": "z1-063", "q": "Установіть відповідність між подією, описаною в уривку з історичного джерела, та іменем князя, який був до неї причетний.", "sec": "s6", "g": "princes-exc", "t": "match", "opts": ["Олег", "Ігор", "Святослав", "Володимир Великий", "Ярослав Мудрий"], "ok": [0, 1, 2, 3], "left": ["«...І мовив... Аскольдові та Дірові: “Ви оба не є князі. Ні роду княжого. Я є роду княжого.” - “А се - син Рюриків...”»", "«Із города Іскоростеня вийшли проти нього древляни й убили [його] і дружину його, бо було їх мало...»", "«Сказав... матері своїй і боярам своїм: “Не любо мені в Києві жити, хочу жити в Переяславці на Дунаї”...»", "«...віддав Корсунь грекам як викуп за царицю, а сам повернувся в Київ...»"]}, {"id": "z1-064", "q": "Установіть відповідність між іменем князя (княгині) Київської Русі та історичною подією.", "sec": "s6", "g": "", "t": "match", "opts": ["запровадження християнства як державної релігії", "загибель руського флоту від «грецького вогню»", "розгром Хозарського каганату", "організація погостів та запровадження системи уро  в момент Його крайнього знемагання...", "Разом з тим розпис головного храму держави повинен був показати велич Русі, її міжнародне визнання, роль київського князівського дому в політичному житті Європи. Тому в Софії значне місце відведено світським композиціям. На трьох стінах центрального нефу, напроти головного вівтаря, було написано княжий сімейний портрет засновника собору. Портрет традиційно пов’язують з родиною Ярослава Мудрого.", "Саме таким чином було зумовлено виникнення саме такого виду живопису, що стає невід’ємним елементом художнього оформлення майже кожного літературного твору, також рукописи часто прикрашалися кінцівками й візерунками на полях. Їм властиві надзвичайна вишуканість, яскраве орнаментальне оздоблення навколо фігур та велика кількість позолоти, що наближає це мистецтво до ювелірного.", "Смальта виготовлена зі скла, забарвленого в різні кольори додаванням солей і окисів металів. Зображення виконані безпосередньо на стіні шляхом вдавлювання у вогку штукатурку кубиків смальти, розміри яких у середньому близько 1 см. У наборі облич часто зустрічаються дрібніші кубики — близько 0,25 см."], "ok": [0, 3, 1, 2], "left": ["літопис", "мініатюра", "ікона", "фреска"]}, {"id": "f2-101", "q": "Установіть хронологічну послідовність подій, описаних в уривках.", "sec": "s6", "g": "", "t": "seq", "opts": ["А якщо ти хочеш мене охрестити, то охрести мене сам. Якщо ні — то я не охрещуся«. І охрестив її цесар з патріархом [Полієвктом]. Просвітившись же, радувалась вона душею і тілом. І поучив її патріарх про віру [християнську], і мовив їй: »Благословенна ти єси в руських князях, бо возлюбила ти світло, а тьму облишила. Благословлятимуть тебе сини руськії навіть в останньому поколінні нащадків твоїх\".", "А коли приспіла весна, пішов він у пороги. Прийшов у пороги, і напав на нього Куря, князь печенізький. І вбили вони його, і взяли голову його, і з черепа його зробили чашу, — окувавши череп його золотом і пили з нього. Свенельд же прийшов у Київ до Ярополка.", "І ввійшов він у город, і дружина його. І послав він [послів] до цесаря Василія і Костянтина, говорячи так: «Осе город ваш славний я взяв. Та чую ось я, що сестру ви маєте, дівчину. Тож якщо її не оддасте за мене, то вчиню вашому городу [те], що й сьому вчинив».", "Потім же, коли він жив у законі християнському, надумав він спорудити камінну церкву святої Богородиці, і, пославши [послів], привів майстрів із Греків, [і] почав зводити. А коли скінчив споруджувати, прикрасив він її іконами, і поручив її Анастасові-корсунянину, і попів корсунських приставив служити в ній. Він дав сюди все, що взяв був у Корсуні, — ікони, і начиння церковне, і хрести [...]"]}, {"id": "f2-105", "q": "Установіть хронологічну послідовність подій", "sec": "s6", "g": "", "t": "seq", "opts": ["похід Аскольда на Константинополь", "похід Олега на Константинополь", "запровадження християнства як державної релігії", "розгром печенігів під Києвом"]}, {"id": "c2-013", "q": "Коли відбулися події, про які йдеться в уривку з джерела?\n«І став княжити Володимир у Києві один. І поставив він кумири на пагорбі, поза двором теремним: Перуна дерев’яного, і Хорса, і Дажбога, і Стрибога, і Сімаргла, і Мокош. І приносили їм люди жертви, називаючи їх богами…»", "sec": "s1", "g": "vol-pagan", "t": "single", "opts": ["у другій половині IX ст.", "у першій половині X ст.", "у другій половині X ст.", "у другій половині XI ст."], "ok": [2]}, {"id": "c2-014", "q": "Яка з пам’яток є златником князя Володимира Святославича?", "sec": "s1", "g": "zlatnyk", "t": "single", "img": ["q_cee99ea2da"], "opts": ["А", "Б", "В", "Г"], "ok": [1]}, {"id": "c2-015", "q": "Які заходи стосуються князювання Володимира Великого?", "sec": "s1", "g": "p-vol", "t": "three", "opts": ["створення перших шкіл", "боротьба з хозарами", "запровадження християнства", "розвиток книгодрукування", "перший похід на Візантію", "карбування златників і срібників", "укладення «Руської правди»"], "ok": [0, 2, 5]}, {"id": "c2-016", "q": "У яких твердженнях ідеться про князя Володимира Святославича?", "sec": "s1", "g": "p-vol", "t": "three", "opts": ["Сприяв обранню першого митрополита з русичів — Іларіона", "Запровадив на Русі християнство як державну релігію", "Був першим християнином серед відомих нині київських князів", "На прохання візантійського імператора почав воєнні дії в Болгарії", "Будував земляні вали й фортеці на південному кордоні Русі", "Першим почав карбувати руські монети із золота й срібла", "Уклав першу писану збірку законів — «Руську правду»"], "ok": [1, 4, 5]}, {"id": "c2-017", "q": "Про яку подію йдеться в уривку з джерела?\n«Вийшов (князь) зі священиками цесарициними і корсунськими на Дніпро. І зійшлося людей без ліку, і влізли вони у воду, і стояли — ті до шиї, а другі — до грудей. Діти ж не відходили од берега, а інші немовлят держали…»", "sec": "s2", "g": "988", "t": "single", "opts": ["похід князя Володимира на Херсонес (Корсунь) у Криму", "хрещення Володимира й одруження з візантійською царівною Анною", "хрещення киян князем Володимиром", "прийняття християнства князем Аскольдом"], "ok": [2]}, {"id": "c2-018", "q": "У яких твердженнях ідеться про князя Ярослава Мудрого?", "sec": "s3", "g": "p-yar", "t": "three", "opts": ["Княжив у Києві 30 років; за легендою, загинув від свого коня", "Одружував своїх дітей з європейськими володарями", "Уклав перший збірник законів — «Руську правду»", "Збудував у Києві Десятинну церкву", "Сприяв появі нових і розквіту старих міст, розбудові столиці", "Щоб продовжити війну на Балканах, посадив синів намісниками в землях Русі", "Розгромив Хозарський каганат"], "ok": [1, 2, 4]}, {"id": "c2-019", "q": "На картосхемі позначено межі Русі", "sec": "s3", "g": "yar-terr", "t": "single", "img": ["q_ddc365190d"], "opts": ["на початку князювання Олега", "наприкінці князювання Святослава Ігоровича", "на початку князювання Володимира Святославича", "наприкінці князювання Ярослава Мудрого"], "ok": [3]}, {"id": "c2-020", "q": "Які поняття й терміни стосуються господарського  город – Поділ, і Гору, і монастирі, і Софію, і Десятинну Богородицю. І не було помилування нікому й нізвідки… І взяли вони майна без рахунку, і церкви оголили від ікон, і книг, і риз, і дзвони познімали…»", "«…Розкажем / Про Ігоря, що вигартував розум / Неміряною силою своєю / І вигострив відвагою, як меч. / Повідаєм, як, сповнившись завзяття / І болю за страждальну рідну землю, / Одчайний князь полки свої хоробрі / На землю Половецькую водив…»", "«Осмомисле Ярославе! Високо сидиш ти на своїм золотокованім престолі, підперши Гори Угорські своїми залізними полками, заступивши королеві дорогу, зачинивши ворота Дунаю…»"]}, {"id": "z3-178", "q": "Яке удільне князівство у XII–XIII ст. політично цілком залежало від Києва?", "sec": "s5", "g": "pereyasl", "t": "single", "opts": ["Галицьке", "Новгород-Сіверське", "Чернігівське", "Переяславське"], "ok": [3]}, {"id": "z3-179", "q": "Під яким роком літописець записав такі рядки:\n«У тім же поході розболівся Володимир Глібович недугою тяжкою... І принесли його в город його Переяславль ...і тут преставився він ...і плакали по ньому всі переяславці. ...був же він князь доблесний у бою, і мужністю відзначався… За ним же Україна багато потужила»?", "sec": "s5", "g": "1187-ukr", "t": "single", "opts": ["1054 р.", "1187 р.", "1205 р.", "1264 р."], "ok": [1]}, {"id": "z3-180", "q": "Яке удільне князівство повністю політично залежало від Київського князівства в період політичної роздробленості у XII–XIII ст.?", "sec": "s5", "g": "pereyasl", "t": "single", "opts": ["Чернігівське", "Переяславське", "Галицьке", "Волинське"], "ok": [1]}, {"id": "z3-181", "q": "Установіть послідовність появи понять і термінів в історії Русі-України (IX–XIII ст.).", "sec": "s6", "g": "z15549", "t": "seq", "opts": ["«полюддя»", "«погости»", "«вотчина»", "«ярлик»"]}, {"id": "z3-182", "q": "Упорядкуйте за хронологією події, описані в цитатах.", "sec": "s6", "g": "", "t": "seq", "opts": ["«І спорудив він церкву святої Софії в Києві. І прикрасив її іконами многоцінними…»", "«Тепер же заповідаю стіл свій у Києві старшому синові моєму, братові вашому Ізяславу, його слухайте, як слухали мене. А Святославу – Чернігів, а Всеволоду – Переяслав…»", "«Прибули Святополк Ізяславич, і Володимир Всеволодович, і Давид Ігорович, і Василько Ростиславич, і Давид Святославич, і брат його Олег і зібралися в городі Любечі, щоб уладнати мир.»", "«Ранком в 17-й день кияни зібрали раду і послали до Володимира Мономаха з проханням: \"їди, князю, на стіл батьківський і дідівський…\"»"]}, {"id": "z3-183", "q": "Поєднайте подію (1–4), описану в уривку, з роком (А – Д), у якому вона відбулася.", "sec": "s6", "g": "", "t": "match", "opts": ["972 р.", "988 р.", "1054 р.", "1097 р.", "1113 р."], "ok": [3, 2, 4, 1], "left": ["«Прибули Святополк Ізяславич, і Володимир Всеволодович, і Давид Ігорович, і Василько Ростиславич, і Давид Святославич, і брат його Олег і зібралися в городі Любечі, щоб уладнати мир.»", "«Тепер же заповідаю стіл свій у Києві старшому синові моєму, братові вашому Ізяславу, його слухайте, як слухали мене. А Святославу – Чернігів, а Всеволоду – Переяслав…»", "«Ранком в 17-й день кияни зібрали раду і послали до Володимира Мономаха з проханням: \"їди, князю, на стіл батьківський і дідівський…\"»", "«Володимир віддав Корсунь грекам як віно за царицю, а сам повернувся в Київ. І коли прийшов, повелів звергнути всіх кумирів: одних порубати, а других попалити. Перуна ж повелів прив'язати коневі до хвоста і волочити з гори Боричевим узвозом на Ручай. І, притягнувши, вкинули його в Дніпро…»"]}, {"id": "z3-184", "q": "Поєднайте подію, описану в уривку з історичного джерела (1–4) з її наслідком (А – Д).", "sec": "s6", "g": "", "t": "match", "opts": ["поразка руських князів у битві на річці Калці", "уходження українських земель до складу Великого князівства Литовського", "виникнення на південних кордонах Русі печенізької загрози", "установлення залежності руських князівств від Золотої Орди", "розширення кордонів Русі за рахунок приєднання Червенських міст"], "ok": [0, 1, 3, 2], "left": ["«І прибігло половців багато в Руську землю, і говорили вони руським князям: \"Якщо ви не поможете нам, то ми нині порубані будемо, а ви завтра порубані будете\". І була рада всіх князів у Києві, і порадилися вони так: \"Лучче б нам зустріти їх на чужій землі, аніж на своїй...\"»", "«У це літо Ольгерд переміг трьох царків татарських з ордами їхніми: Котлубаха, Казчея, Дмитра; і з того часу з Поділля вигнав владу татарську...»", "«У той же рік прийшов Батий до Києва з великою силою, множеством сили своєї, і оточив город. І обступила сила татарська, і був город в облозі великій. І пробував Батий коло міста, а вої його облягали город...»", "«Хозари вийшли супроти нього з каганом своїм. І зступилися війська битися, і сталася битва межи ними, і одолів він хозарів і город їхній столицю Ітіль, і город Білу Вежу взяв. І ясів він переміг, і касогів, і прийшов до Києва...»"]}, {"id": "n3-007", "q": "Прочитайте уривок з літопису.\n«Прийшли половці на Руську землю, і князі вийшли проти них на Альту, і побігли руські князі... Люди ж київські, прибігши до Києва, скликали віче на торговищі й послали до князя, кажучи: “Дай, княже, зброю й коні, і ми ще будемо битися з ними”. Та князь цього не послухав… і втік до Польщі» (скорочено).\nПро які події йдеться?", "sec": "s1", "g": "1068", "t": "single", "opts": ["повстання киян 1068 р. після поразки князів від половців", "Любецький з’їзд князів 1097 р. перед походами на половців", "повстання киян 1113 р. і запрошення на київський стіл Мономаха", "битва на Альті 1019 р. між Ярославом і Святополком"], "ok": [0], "expl": "1068 р. Ярославичі програли половцям на Альті. Кияни на вічі вимагали зброї, щоб боронитися, а коли Ізяслав відмовив, повстали; князь утік до Польщі."}, {"id": "n3-008", "q": "Унаслідок ухвалення «Правди Ярославичів»", "sec": "s1", "g": "pravda-yar", "t": "single", "opts": ["скасували кровну помсту", "Київ закріпили за нащадками Ізяслава", "обмежили відсотки за позиками", "уперше встановили розміри данини"], "ok": [0], "expl": "Ярослав лише обмежив кровну помсту, а його сини в «Правді Ярославичів» скасували її, замінивши грошовою пенею. Відсотки обмежив «Устав» Мономаха, розміри данини — Ольга."}, {"id": "n3-009", "q": "Хто з Ярославичів останнім посів київський стіл і княжив до 1093 р.?", "sec": "s1", "g": "yaroslavychi", "t": "single", "opts": ["Ізяслав", "Святослав", "Всеволод", "Володимир Мономах"], "ok": [2], "expl": "Наймолодший із трьох братів, Всеволод, сів у Києві 1078 р. після загибелі Ізяслава й княжив до смерті 1093 р. Мономах — його син; київським князем він став лише 1113 р."}, {"id": "n3-010", "q": "За заповітом Ярослава Мудрого його син Святослав отримав", "sec": "s1", "g": "zapovit", "t": "single", "opts": ["Київ", "Чернігів", "Переяслав", "Новгород"], "ok": [1], "expl": "Київ Ярослав заповів найстаршому — Ізяславу, Чернігів — Святославу, Переяслав — Всеволоду."}, {"id": "n3-011", "q": "Що характерно для доби правління Ярославичів (1054 – 1093 рр.)?", "sec": "s1", "g": "", "t": "three", "opts": ["спільне правління трьох старших синів Ярослава Мудрого", "ухвалення «Правди Ярославичів»", "скликання Любецького з’їзду князів", "розгром печенігів під стінами Києва", "повстання киян і втеча Ізяслава до Польщі", "перша писемна згадка назви «Україна»", "запрошення киянами на княжіння Володимира Мономаха"], "ok": [0, 1, 4], "expl": "Ярославичі правили разом (тріумвірат), ухвалили «Правду Ярославичів»; 1068 р. кияни повстали й Ізяслав утік. Любецький з’їзд — 1097 р., розгром печенігів — 1036 р., «Україна» — 1187 р., Мономаха запросили 1113 р."}, {"id": "n3-012", "q": "«Устав Володимира Мономаха», ухвалений після повстання киян 1113 р.,", "sec": "s3", "g": "mon-ustav", "t": "single", "opts": ["остаточно скасував кровну помсту", "обмежив відсотки за позиками", "закріпив за князями їхні отчини", "установив розміри данини з громад"], "ok": [1], "expl": "Повсталі 1113 р. громили двори лихварів. Мономах «Уставом» обмежив відсотки за позиками /* ---------- повноекранний режим ---------- */
const FS = {

  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {

    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }

}

});

}

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;

lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

function route() {

/* Курс: вхід учня, бліци після частин, замки, Тест 1 і Тест 2, відправлення результатів у Google-таблицю.
   Дані: QUIZ ({blitz:{1:{n,pass,quota,pool}}, tests:{t1:{tasks}}}), COURSE_API (адреса Apps Script). */
const API = (typeof COURSE_API === 'string' && COURSE_API) || '';
const LET = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Є'];
const TYPE = { single: 'Одна правильна відповідь', three: 'Три правильні з семи', seq: 'Послідовність', match: 'Відповідність' };
const LBLRE = /^(?:Місцезнаходження |Місце |малюнок )?([А-ЕЄ]|\d)$/;
const isLbl = q => q.opts.every(o => LBLRE.test(o));
const lab = (q, j, k) => isLbl(q) && !(q.t === 'seq' && q.oimg) ? q.opts[j].match(LBLRE)[1] : q.t === 'three' ? k + 1 : LET[k];
/* порядок показу в бліці: мітки — як є (послідовність із мітками — за абеткою), решта — навмання */
function showOrder(q) {
  const idx = [...q.opts.keys()];
  if (!isLbl(q) || (q.t === 'seq' && q.oimg)) return shuffle(idx);
  return q.t === 'seq' ? idx.sort((a, b) => q.opts[a].localeCompare(q.opts[b], 'uk')) : idx;
}
const mlist = (q, order) => isLbl(q) ? '' : `<div class="mlist">${order.map((j, k) => `<div class="mo"><b class="a2">${LET[k]}</b> ${optHtml(q, j)}</div>`).join('')}</div>`;
const maxOf = q => q.t === 'single' ? 1 : q.t === 'match' ? 4 : 3;
function grade12(pc) { const t = [25, 33, 41, 49, 56, 63, 70, 77, 84, 91]; let g = 2; t.forEach((v, k) => { if (pc >= v) g = k + 3; }); return g; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (p, m) => m ? Math.round(1000 * p / m) / 10 : 0;
/* кількість частин курсу = кількість бліців; короткі перевірки після розділів — QUIZ.mini['<частина>-<розділ>'] */
const NP = Object.keys(QUIZ.blitz || {}).length || 3;
const PARTS_N = Array.from({ length: NP }, (_, i) => i + 1);
const MINI = QUIZ.mini || {};
const PASS = n => (QUIZ.blitz[n] && QUIZ.blitz[n].pass) || 75;
/* спільна оболонка кількох тем: один вхід на сторінці оболонки (SHELL_URL), учень — у спільному сховищі hist_*,
   прогрес теми — під власним префіксом; кожен запит до сервера несе позначку теми (TOPIC) */
const SH = (typeof SHELL_URL === 'string' && SHELL_URL) || '';
const TOPIC_ID = (typeof TOPIC === 'string' && TOPIC) || '';
const G_ = {
  get(k, d) { try { const v = localStorage.getItem('hist_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hist_' + k, JSON.stringify(v)); } catch (e) {} },
};

if (SH) {   // на телефоні інший учень, ніж той, чий прогрес теми збережено, — прогрес цієї теми стираємо (черга лишається: там свої імена)
  const u = G_.get('user', null), own = store.get('owner', null) ?? ukey(store.get('user', null));
  if (u && own !== ukey(u)) {
    try { Object.keys(localStorage).filter(k => k.startsWith(PFX) && !k.startsWith(PFX + 'seen_') && k !== PFX + 'queue').forEach(k => localStorage.removeItem(k)); } catch (e) {}
    store.set('owner', ukey(u));
  } else if (u && own == null) store.set('owner', ukey(u));
}
const toShell = () => { location.replace(SH); };

/* ---------- учень і прогрес ---------- */
const U = {
  get user() { return SH ? G_.get('user', null) : store.get('user', null); },
  prog() { return store.get('prog', {}); },
  setProg(k, v) { const p = this.prog(); p[k] = v; store.set('prog', p); },
  passed(k) { const r = this.prog()[k]; return !!(r && r.pass); },
};

/* ---------- зв’язок із сервером: черга, щоб нічого не губилося без інтернету ---------- */
const Net = {
  async call(body) {

    if (TOPIC_ID && body.topic == null) body = { ...body, topic: TOPIC_ID };

    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(); if (j.error) throw new Error(j.error); return j;
  },
  send(op, data) {
    const u = U.user; if (!u) return;
    const q = store.get('queue', []);

/* ---------- бліц ---------- */
function draw(n, B, seenKey) {
  B = B || QUIZ.blitz[n]; seenKey = seenKey || 'bseen' + n;
  const seen = new Set(store.get(seenKey, [])), used = new Set(), out = [];
  const take = list => { for (const q of list) { if (out.length >= B.n) return; if (out.includes(q) || (q.g && used.has(q.g))) continue; out.push(q); if (q.g) used.add(q.g); return true; } };
  const fresh = list => shuffle(list).sort((a, b) => seen.has(a.id) - seen.has(b.id));
  Object.entries(B.quota || {}).forEach(([sec, k]) => { const c = fresh(B.pool.filter(q => q.sec === sec)); for (let i = 0; i < k; i++) if (!take(c)) break; });
  while (out.length < B.n && take(fresh(B.pool))) {}
  const order = Object.keys(B.quota || {});
  out.sort((a, b) => order.indexOf(a.sec) - order.indexOf(b.sec));
  return out;
}
function pic(key, cls) {

const Blitz = {
  /* незавершений бліц зберігається на телефоні: світло, тривога — і можна продовжити з того самого питання */
  draft(n) { const d = store.get('bdraft' + n, null); return d && d.ids && d.i < d.ids.length ? d : null; },
  clearDraft(n) { store.set('bdraft' + n, null); },
  save() { if (this.mini) return; store.set('bdraft' + this.n, { ids: this.qs.map(q => q.id), orders: this.qs.map(q => q.order), i: this.i, pts: this.pts, log: this.log,
    dl: this.dl, sec: this.sec, exits: this.exits }); },
  /* час на питання бліцу (с): строк зберігається в чернетці, тож перезавантаження його не скидає */

    document.querySelectorAll('#tl .tile').forEach(b => {
      const j = +b.dataset.j, k = this.sel.indexOf(j), l = b.querySelector('.l, .ord');
      b.classList.toggle('sel', k >= 0);
      if (q.t === 'seq') { l.className = k >= 0 ? 'ord' : 'l'; l.textContent = k >= 0 ? k + 1 : lab(q, j, q.order.indexOf(j)); }
    });
    document.getElementById('bzok').disabled = this.sel.length !== (q.t === 'three' ? 3 : 4);
  },
  paintMatch() {
    document.querySelectorAll('#tl .mb').forEach(b => b.classList.toggle('on', this.sel[+b.dataset.i] === +b.dataset.j));
    document.getElementById('bzok').disabled = this.sel.some(x => x === null);
  },
  answer(q) {
    this.stopClock(); this.dl = null;
    this.sec = (this.sec || 0) + Math.min((Date.now() - (this.shown || Date.now())) / 1000, this.timed() ? this.lim(q) + 5 : 600);
    if (q.t === 'seq' && this.sel.length < 4) this.sel = [];   // незавершена послідовність — 0 балів
    let p = 0; const m = maxOf(q);
    if (q.t === 'single') p = this.sel[0] === q.ok[0] ? 1 : 0;
    else if (q.t === 'three') p = this.sel.filter(j => q.ok.includes(j)).length;
    else if (q.t === 'match') p = this.sel.filter((j, i) => j === q.ok[i]).length;
    else if (!this.sel.length) p = 0;
    else if (this.sel.every((j, k) => j === k)) p = 3; else if (this.sel[0] === 0 && this.sel[3] === 3) p = 2; else if (this.sel[0] === 0 || this.sel[3] === 3) p = 1;
    this.pts += p; this.log.push({ id: q.id, p, m });
    document.querySelectorAll('#tl .mb').forEach(b => { const i = +b.dataset.i, j = +b.dataset.j; b.disabled = true;
      if (q.ok[i] === j) b.classList.add('right'); else if (this.sel[i] === j) b.classList.add('wrong'); });
    document.querySelectorAll('#tl .tile').forEach(b => { const j = +b.dataset.j; b.disabled = true; if (q.t === 'seq') return;
      if (q.ok.includes(j)) b.classList.add('right'); else if (this.sel.includes(j)) b.classList.add('wrong'); else b.classList.add('dim'); });
    const act = document.querySelector('.bz-act'); if (act) act.remove();
    const L2 = j => lab(q, j, q.order.indexOf(j));
    const extra = q.t === 'match' ? `<div>Правильно: ${q.left.map((l, i) => `${i + 1} — ${L2(q.ok[i])}`).join(', ')}</div>`
      : q.t === 'seq' ? `<div>Правильний порядок: ${q.opts.map((o, j) => L2(j)).join(' → ')}</div>` : '';
    const last = this.i === this.qs.length - 1;
    document.querySelector('.bz-top .pts').textContent = this.pts + ' б.';
    document.querySelector('.bz-in').insertAdjacentHTML('beforeend', `<div class="fb ${p === m ? 'good' : p ? 'part' : 'bad'}">
      <div class="h">${this.tout ? '⏱ Час вийшов. ' : ''}${p === m ? 'Правильно!' : p ? 'Частково правильно' : 'Неправильно'} · ${p} з ${m}</div>${extra}${q.expl ? `<div class="ex">${md(q.expl)}</div>` : ''}</div>
      <button class="btn" id="bzn">${last ? 'Результат' : 'Далі →'}</button>`);
    if (!this.mini) { this.i++; this.save(); this.i--; }
    const nx = document.getElementById('bzn'); nx.onclick = () => { if (last) this.finish(); else { this.i++; this.show(); } };
    nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },
  finishMini() {
    const { n, sid, k } = this.mini, L = LESSONS[n - 1], si = L.sections.findIndex(x => x.id === sid), nxt = L.sections[si + 1];
    const all = store.get('mini', {}); all[k] = { p: this.pts, m: this.max }; store.set('mini', all);
    Net.send('event', { what: 'перевірка', part: n, sec: L.sections[si].num, title: `${this.pts} з ${this.max}` });
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">Перевірка · розділ ${L.sections[si].num}</span><button class="x" data-go="${this.back()}" aria-label="Закрити" style="margin-left:auto">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${this.pts} з ${this.max}</div>
        <div class="gr">${this.pts === this.max ? 'Чудово! Можна йти далі.' : this.pts >= 0.75 * this.max ? 'Добре! Можна йти далі, а помилку варто запам’ятати.' : 'Перегляньте розділ ще раз — і спробуйте знову.'}</div></div>
      <button class="btn" data-go="${nxt ? `p${n}-${nxt.id}` : (U.passed('b' + n) ? 'p' + n : 'blitz' + n)}">${nxt ? 'До наступного розділу →' : (U.passed('b' + n) ? 'До частини' : 'До бліцу частини ' + n + ' →')}</button>
      <button class="btn ghost" data-go="p${n}-${sid}">Повторити розділ</button>
      <button class="btn ghost" id="again">Перевірити ще раз</button></div>`;
    wireGo(); window.scrollTo(0, 0);
    document.getElementById('again').onclick = () => this.startMini(n, sid);
  },
  finish() {
    if (this.mini) return this.finishMini();
    this.clearDraft(this.n);
    const n = this.n, pc = pct(this.pts, this.max), pass = pc >= PASS(n), prev = U.prog()['b' + n] || { pct: 0, pass: false };
    U.setProg('b' + n, { pct: Math.max(pc, prev.pct), pass: pass || !!prev.pass });
    const tries = store.get('btries' + n, 0) + 1; store.set('btries' + n, tries);
    Net.send('blitz', { part: n, attempt: tries, pts: this.pts, max: this.max, pct: pc, pass, qs: this.log, sec: Math.round(this.sec || 0), exits: this.exits || 0 });
    const errs = {}; this.log.forEach((r, k) => { if (r.p < r.m) { const s = this.qs[k].sec; errs[s] = (errs[s] || 0) + 1; } });
    const L = LESSONS[n - 1], weak = Object.entries(errs).sort((a, b) => b[1] - a[1]).map(([s, c]) => { const S = L.sections.find(x => x.id === s);
      return `<button class="sec-btn" data-go="${L.id}-${s}"><span class="num">${S.num}</span><span><h3>${md(S.title)}</h3><div class="st">помилок: ${c}</div></span></button>`; }).join('');
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">Бліц частини ${n}</span><button class="x" data-go="p${n}" aria-label="Закрити" style="margin-left:auto">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${pc}%</div><div class="cap">${this.pts} з ${this.max} балів</div>
        <div class="gr ${pass ? 'okc' : 'badc'}">${pass ? (n < NP ? `Пройдено! Частину ${n + 1} відкрито.` : 'Пройдено! Тест 1 відкрито, якщо всі бліци пройдено.') : `Потрібно ${PASS(n)} %. Повторіть розділи нижче і спробуйте ще раз.`}</div></div>
      ${pass ? `<button class="btn" data-go="${n < NP ? 'p' + (n + 1) : 'home'}">${n < NP ? `До частини ${n + 1} →` : 'До тестів →'}</button>` : ''}
      <button class="btn ${pass ? 'ghost' : ''}" id="again">Пройти бліц ще раз</button>
      ${weak ? `<div class="h2" style="margin:8px 0 0">Варто повторити</div><div class="sec-list">${weak}</div>` : ''}
      <div class="sync" id="sync"></div></div>`;
    wireGo(); paintSync(); window.scrollTo(0, 0);
    document.getElementById('again').onclick = () => { this.clearDraft(n); this.start(n); };
  },
};

/* ---------- тести (без підказок; бали рахує сервер) ---------- */
const Test = {
  /* ліміт часу (хв) — QUIZ.tests[id].minutes; початок — на телефоні (tstart_) і на сервері (op tstart) */
  started() { return store.get('tstart_' + this.id, null); },
  begin() {
    if (this.started()) return;
    store.set('tstart_' + this.id, Date.now()); store.set('texits_' + this.id, 0);
    Net.send('tstart', { test: this.id });
  },
  leftSec() { const m = this.T.minutes; return m ? Math.ceil((this.started() + m * 60000 - Date.now()) / 1000) : null; },
  stopClock() { clearInterval(this.clk); this.clk = null; },
  submit(auto) {
    this.stopClock();
    const answers = this.T.tasks.map(t => this.ans[t.n] == null ? null : this.ans[t.n]);
    const st = this.started(), sec = st ? Math.round((Date.now() - st) / 1000) : null;
    store.set('draft_' + this.id, null); store.set('tstart_' + this.id, null);
    Net.send('test', { test: this.id, answers, sec, exits: store.get('texits_' + this.id, 0), auto: !!auto });
    this.pending(auto);
  },
  open(id) {
    this.id = id; this.T = QUIZ.tests[id];
    if (store.get('queue', []).some(x => x.op === 'test' && x.test === id)) return this.pending();
    const d = store.get('draft_' + id, null), r = U.prog()[id];
    if (d) { this.ans = d; if (this.started() && this.leftSec() !== null && this.leftSec() <= 0) return this.submit(true); return this.render(); }
    if (r && r.pts != null) return this.result(r);
    this.ans = {}; this.render();
  },
  intro() {
    const T = this.T, n = k => T.tasks.filter(t => t.t === k).length;
    return `<div class="card tintro"><h2>${esc(T.name)}</h2><p>${T.tasks.length} завдань, як на НМТ: ${n('single')} — одна правильна відповідь, ${n('match')} — відповідність, ${n('seq')} — послідовність, ${n('three')} — три з семи.
      Бали — за правилами НМТ.${this.id === 't1' ? ' Щоб отримати допуск до Тесту 2, потрібно <b>75 %</b> балів.' : ''}</p>
      ${T.minutes ? `<p><b>На тест — ${T.minutes} хвилин.</b> Час рахується від першого відкриття тесту й іде, навіть коли ви закриваєте сторінку. Коли час мине, відповіді надішлються самі.</p>` : ''}
      <p class="cap">Підказок під час тесту немає. Відповіді зберігаються на телефоні. Учитель бачить, скільки часу тривав тест і скільки разів ви виходили зі сторінки.</p></div>`;
  },
  render() {
    const T = this.T;
    const nav = T.tasks.map((t, k) => `<a href="#" class="nv${this.done(t) ? ' on' : ''}" data-k="${k}">${t.n}</a>`).join('');
    this.begin(); this.stopClock();
    app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Назад</button><span class="ttl">${esc(T.name)}</span>${T.minutes ? '<span class="tm" id="ttm"></span>' : ''}</div></div>
      <div class="wrap">${this.intro()}<div class="tnav stk" id="tnav">${nav}</div>${T.tasks.map((t, k) => this.task(t, k)).join('')}
      <div class="tsend"><div class="cap" id="tleft"></div><button class="btn" id="tsub">Надіслати відповіді</button></div><div class="dlg" id="dlg" hidden></div></div>`;
    wireGo(); window.scrollTo(0, 0);
    document.getElementById('tnav').onclick = e => { const a = e.target.closest('.nv'); if (!a) return; e.preventDefault();
      document.getElementById('tk' + a.dataset.k).scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    T.tasks.forEach((t, k) => this.wire(t, k));
    document.getElementById('tsub').onclick = () => this.confirm();
    this.left();
    if (T.minutes) {
      const tick = () => {
        const s = this.leftSec(), el = document.getElementById('ttm');
        if (!el) return this.stopClock();
        el.textContent = '⏱ ' + Math.floor(Math.max(0, s) / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
        el.classList.toggle('warn', s <= 300);
        if (s <= 0) this.submit(true);
      };
      tick(); this.clk = setInterval(tick, 1000);
    }
  },
  done(t) { const a = this.ans[t.n]; return t.t === 'match' ? !!a && a.every(x => x !== null) : t.t === 'single' ? a != null : !!a && a.length === (t.t === 'three' ? 3 : 4); },
  task(t, k) {
    const a = this.ans[t.n];
    let body;
    if (t.t === 'match') {
      const sel = a || [null, null, null, null];
      body = mlist(t, [...t.opts.keys()]) +
        t.left.map((l, i) => `<div class="mrow"><div class="ml"><b>${i + 1}.</b> ${t.rimg ? pic(t.rimg[i], 'ri') : ''}${/^\d$/.test(l) ? '' : md(l)}</div><div class="mbtns">${t.opts.map((o, j) =>
          `<button class="mb${sel[i] === j ? ' on' : ''}" data-i="${i}" data-j="${j}">${LET[j]}</button>`).join('')}</div></div>`).join('');
    } else {
      const sel = t.t === 'single' ? (a == null ? [] : [a]) : (a || []);
      body = t.opts.map((o, j) => { const k2 = sel.indexOf(j);
        return `<button class="tile n${t.oimg ? ' wi' : ''}${k2 >= 0 ? ' sel' : ''}" data-j="${j}"><span class="${t.t === 'seq' && k2 >= 0 ? 'ord' : 'l'}">${t.t === 'seq' && k2 >= 0 ? k2 + 1 : lab(t, j, j)}</span>${optHtml(t, j)}</button>`; }).join('');
      if (t.oimg) body = `<div class="tgrid">${body}</div>`;
      if (t.t !== 'single') body += `<button class="lnk rst" data-r="1">Скинути відповідь</button>`;
    }
    return `<section class="card task" id="tk${k}"><div class="qtype">Завдання ${t.n} · ${TYPE[t.t]}${t.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      ${t.src ? `<div class="quote"><p>${md(t.src)}</p>${t.srccap ? `<div class="src">${esc(t.srccap)}</div>` : ''}</div>` : ''}
      <div class="qtext">${md(t.q).replace(/\n/g, '<br>')}</div>${(t.img || []).map(x => pic(x, 'qi')).join('')}<div class="tiles">${body}</div>${t.cap ? `<div class="cap"><span class="cr">${esc(t.cap)}</span></div>` : ''}</section>`;
  },
  wire(t, k) {
    const el = document.getElementById('tk' + k);
    const re = () => { el.outerHTML = this.task(t, k); this.wire(t, k); store.set('draft_' + this.id, this.ans);
      document.querySelector(`.nv[data-k="${k}"]`).classList.toggle('on', this.done(t)); this.left(); };
    el.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; const j = +b.dataset.j;
      if (t.t === 'single') this.ans[t.n] = j;
      else { const s = this.ans[t.n] || [], i = s.indexOf(j); if (i >= 0) s.splice(i, 1); else if (s.length < (t.t === 'three' ? 3 : 4)) s.push(j); this.ans[t.n] = s; }
      re(); });
    el.querySelectorAll('.mb').forEach(b => b.onclick = () => { const s = this.ans[t.n] || [null, null, null, null]; s[+b.dataset.i] = +b.dataset.j; this.ans[t.n] = s; re(); });
    const r = el.querySelector('.rst'); if (r) r.onclick = () => { delete this.ans[t.n]; re(); };
  },
  left() { const n = this.T.tasks.filter(t => !this.done(t)).length; document.getElementById('tleft').textContent = n ? `Без відповіді: ${n}` : 'Відповіді є на всі завдання.'; },
  confirm() {
    const n = this.T.tasks.filter(t => !this.done(t)).length, d = document.getElementById('dlg');
    d.hidden = false;
    d.innerHTML = `<div class="dlg-in"><h3>Надіслати відповіді?</h3><p>${n ? `Без відповіді залишилося <b>${n}</b> завд. — за них буде 0 балів.` : 'Відповіді є на всі завдання.'} Змінити відповіді після надсилання не можна.</p>
      <button class="btn" id="dy">Надіслати</button><button class="btn ghost" id="dn">Повернутися до тесту</button></div>`;
    document.getElementById('dn').onclick = () => { d.hidden = true; };
    document.getElementById('dy').onclick = () => this.submit(false);
  },
  pending(auto) {
    this.stopClock();
    app.innerHTML = `<div class="wrap bz-in"><div class="res"><div>${esc(this.T.name)}</div><div class="big">⏳</div>${auto ? '<div class="gr">Час вийшов — відповіді надіслано автоматично.</div>' : ''}
      <div class="cap">Відповіді збережено. Результат з’явиться, щойно телефон зв’яжеться з сервером.</div></div>
      <div class="sync" id="sync"></div><button class="btn ghost" data-go="home">На головну</button></div>`;
    wireGo(); paintSync(); Net.flush();
  },
  result(r) {
    const t1 = this.id === 't1';
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">${esc(this.T.name)}</span><button class="x" data-go="home" style="margin-left:auto" aria-label="Закрити">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${r.pts} з ${r.max}</div><div class="cap">${r.pct}% балів</div>${t1 ? '' : `${r.grade ? `<div class="gr">Оцінка: <b>${r.grade}</b> (з 12)</div>` : ''}<div class="gr">За шкалою НМТ (100–200)${r.max !== 54 ? ', орієнтовно' : ''}: <b>${esc(r.scale)}</b></div>`}
      ${t1 ? `<div class="gr ${r.pass ? 'okc' : 'badc'}">${r.pass ? 'Допуск отримано — Тест 2 відкрито.' : 'Потрібно 75 %. Повторіть матеріал і пройдіть тест ще раз.'}</div>` : ''}</div>
      ${r.per ? `<div class="h2" style="margin:8px 0 0">Бали за завданнями</div><div class="tnav">${r.per.map((p, k) => `<span class="nv ${p === maxOf(this.T.tasks[k]) ? 'on' : p ? 'pt' : 'no'}">${k + 1}<i>${p}</i></span>`).join('')}</div>` : ''}
      ${t1 && !r.pass ? `<button class="btn" id="retry">Пройти Тест 1 ще раз</button>` : ''}
      ${t1 && r.pass ? `<button class="btn" data-go="home">До Тесту 2 →</button>` : `<button class="btn ghost" data-go="home">На головну</button>`}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const rb = document.getElementById('retry'); if (rb) rb.onclick = () => { store.set('draft_' + this.id, {}); store.set('tstart_' + this.id, null); this.ans = {}; this.render(); };
  },
};

/* ---------- маршрути ---------- */
const _route = route;
route = function () {
  Blitz.stopClock(); Test.stopClock();     // таймери попередньої сторінки не повинні спрацювати на новій
  const h = location.hash.slice(1);
  if (needLogin() && h) { history.replaceState(null, '', location.pathname); return login(); }
  let m = h.match(/^blitz(\d)$/);
  if (m && QUIZ.blitz[m[1]]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.start(n); }
  m = h.match(/^mini(\d)-(s\d+)$/);
  if (m && MINI[`${m[1]}-${m[2]}`]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.startMini(n, m[2]); }
  m = h.match(/^(t[12])$/);
  if (m) { if (!QUIZ.tests[m[1]] || !testOpen(m[1])) { location.hash = 'home'; return; } return Test.open(m[1]); }
  return _route();
};
window.removeEventListener('hashchange', _route);
window.addEventListener('hashchange', () => route());
route();
Net.flush();

/* ---------- виходи зі сторінки під час бліцу й тесту (учитель бачить їх у таблиці) ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  const h = location.hash.slice(1);
  if (/^blitz\d$/.test(h) && Blitz.n === +h.slice(5) && !Blitz.mini && store.get('bdraft' + Blitz.n, null)) { Blitz.exits = (Blitz.exits || 0) + 1; Blitz.save(); }
  else if (/^t[12]$/.test(h) && store.get('tstart_' + h, null)) store.set('texits_' + h, store.get('texits_' + h, 0) + 1);
});

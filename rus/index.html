ро юнака-кожум’яку, що здолав печенізького силача (992), і про хитрість обложених білгородців (997)."], "img": null}, {"name": "Візантія", "paras": ["Допоміг імператорові Василію II військом проти заколотників.", "За це зажадав віддати за нього сестру імператора **Анну**. Шлюб відбувся після походу на Херсонес (**988**)."], "img": null}], "note": "**Шлюбна дипломатія** — союзи між державами, скріплені шлюбами правителів та їхніх дітей. Одружившись із сестрою імператора, Володимир став рівнею наймогутнішим володарям Європи. Як це сталося — у наступному розділі."}]}, {"id": "s2", "num": "II", "title": "Хрещення Русі-України", "sub": "988 р.: чому Володимир обрав християнство і що це змінило", "cover": {"key": "v_bapt", "cap": ""}, "cards": [{"type": "defs", "title": "Чому Володимир прийняв християнство", "badges": ["НМТ: поняття"], "items": [{"name": "Єдність", "paras": ["Поляни, сіверяни, словени шанували різних місцевих богів-покровителів і мали різні звичаї. Спільна віра мала об’єднати їх в **один народ**."], "img": null}, {"name": "Влада князя", "paras": ["Церква навчала, що влада князя — від Бога. Отже, коритися йому мав кожен."], "img": null}, {"name": "Сусіди", "paras": ["**Візантія**, Болгарія, Чехія, Польща вже були християнськими. З язичником там неохоче укладали союзи й не віддавали за нього доньок."], "img": null}, {"name": "Культура", "paras": ["Із вірою приходили **письмо** й книги, кам’яні храми, живопис — усе, чим славилася Візантія."], "img": null}], "note": "**Християнство** — одна зі світових релігій, основою якої є віра в Ісуса Христа як Бога й Спасителя. Русь прийняла його за візантійським (східним) обрядом."}, {"type": "doc", "title": "«Вибір віри»: легенда з літопису", "quote": ["Прийшли болгари віри магометової й сказали: «Обрізуйтеся, свинини не їжте й вина не пийте». Сказав Володимир: «Русі єсть веселіє пити. Не можемо без того бути».", "Прийшли німці від Папи. Відповів їм Володимир: «Ідіть звідки прийшли, бо отці наші цього не прийняли». Прийшли хозарські юдеї. Спитав Володимир: «А де ваша земля?» — «Розгнівався Бог на отців наших і розсіяв нас». — «То як же ви інших учите, а самі відкинуті Богом?»", "Повернулися ж посли, що ходили до греків, і сказали: «Не знали ми, на небі ми чи на землі, бо нема на землі такого видовища й краси такої»."], "source": "Повість минулих літ, під 986 – 987 рр. (переклад-переказ, скорочено)", "comment": ["Розповідь про «вибір віри» склали пізніше, і вона більше схожа на притчу, ніж на звіт про події. Насправді Володимир мав вагомі причини обрати віру Візантії: Русь здавна з нею торгувала, там охрестилася Ольга.", "Проте в легенді є й правда: князь справді вибирав, бо кожна віра означала ще й союз із певною державою.", "__Слова з літопису:__ **болгари віри магометової** — волзькі булгари, мусульмани; **німці від Папи** — посланці Римської церкви; **греки** — візантійці."], "img": null}, {"type": "doc", "title": "Похід на Корсунь і шлюб з Анною (988)", "quote": ["Пішов Володимир з військом на Корсунь, город грецький, і заперлися корсуняни в городі. І стояв Володимир на тому боці міста в гавані… І послав Володимир до цесарів Василія й Костянтина сказати: «Ось узяв я ваш город славний. Чув я, що маєте сестру дівицю. Якщо не віддасте її за мене, то вчиню вашій столиці те саме, що й Корсуню».", "І відповіли цесарі: «Не годиться християнам віддавати жінок за поганих. Якщо охрестишся, то й її дістанеш». І послали цесарі сестру свою Анну."], "source": "Повість минулих літ, під 988 р. (переклад-переказ, скорочено)", "comment": ["Імператор Василій II попросив у Володимира війська й пообіцяв за це сестру. Військо князь надіслав, а імператор зволікав зі шлюбом. Тоді він обложив візантійський Херсонес.", "Після шлюбу Володимир повернув місто як «віно» — викуп за наречену. Де він охрестився — у Херсонесі, Києві чи Василеві, — історики сперечаються.", "__Слова з літопису:__ **Корсунь** — руська назва Херсонеса; **цесарі** — імператори-співправителі Василій і Костянтин; **погані** — язичники."], "img": {"key": "rc_korsun", "cap": "Володимир облягає Корсунь. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}}, {"type": "doc", "title": "Хрещення киян (988)", "quote": ["Коли ж прийшов [Володимир до Києва], повелів поскидати ідолів — одних порубати, а інших спалити. Перуна ж повелів прив’язати коневі до хвоста й волочити з гори… і вкинути в Дніпро.", "Потім розіслав Володимир по всьому городу, кажучи: «Якщо не прийде хто завтра на ріку — багатий, чи бідний, чи старець, чи раб, — той противником мені буде».", "І зійшлися люди без числа, і ввійшли у воду — стояли одні по шию, інші по груди, малі біля берега… А попи, стоячи, молитви творили."], "source": "Повість минулих літ, під 988 р. (переклад-переказ, скорочено)", "comment": ["Киян хрестили в Дніпрі (за іншою версією — в його притоці Почайні). Ідолів, яких сам Володимир поставив за вісім років до того, скинули й знищили.", "Слова «противником мені буде» показують, що нову віру запроваджували **наказом князя**. Кияни не чинили опору, а новгородців хрестили силою.", "__Слова з літопису:__ **старець** — тут: жебрак; **попи** — священики; **Перун** — головний із язичницьких богів."], "img": {"key": "lebedev_bapt", "cap": "К. Лебедєв. Хрещення киян (бл. 1880). Суспільне надбання"}}, {"type": "text", "kicker": "Хрещення Русі", "title": "Десятинна церква — перший кам’яний храм", "badges": [], "paras": ["Одразу після хрещення Володимир звів у Києві церкву Богородиці. Її будували **візантійські майстри** в **989 – 996 рр.**", "На її утримання князь віддав **десяту частину** своїх доходів — звідси назва **Десятинна**.", "Храм прикрашали мозаїки, фрески, мармур. Тут поховали Володимира й Анну.", "**1240 р.**, під час монгольського штурму Києва, Десятинна обвалилася. Нині на її місці — відкриті фундаменти."], "imgs": [{"key": "rc_tithe", "cap": "Будівництво Десятинної церкви. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}, {"type": "defs", "title": "Наслідки запровадження християнства", "badges": [], "items": [{"name": "Держава", "paras": ["Спільна віра об’єднала землі, які доти тримала разом лише сила князя.", "Церква підтримувала князя й навчала коритися владі."], "img": null}, {"name": "Місце в Європі", "paras": ["Русь увійшла до кола християнських держав.", "Київські князі відтепер родичалися з королями та імператорами."], "img": null}, {"name": "Культура", "paras": ["Поширилося **письмо** (кирилиця), з’явилися школи й книги.", "Почали будувати з каменю; з’явилися **ікони, мозаїки, фрески**."], "img": null}, {"name": "Життя людей", "paras": ["Церква засуджувала кровну помсту, багатоженство, людські жертви.", "Старі звичаї зникли не одразу: ще довго трималося **двовір’я** — люди поєднували християнство з язичницькими обрядами."], "img": null}], "note": "**988 р.** — запровадження християнства як державної релігії."}]}, {"id": "s3", "num": "III", "title": "Ярослав Мудрий", "sub": "Боротьба за владу, «Руська правда», розквіт Києва й «тесть Європи»", "cover": {"key": "yar_ger", "cap": ""}, "cards": [{"type": "text", "kicker": "Ярослав Мудрий", "title": "Боротьба синів Володимира (1015 – 1019)", "badges": ["НМТ: дата"], "paras": ["**1015 р.** Володимир помер саме тоді, коли збирався в похід на сина Ярослава: той, сидячи в Новгороді, відмовився платити Києву данину. Столицю захопив старший із братів — **Святополк**.", "Невдовзі один за одним загинули троє молодших братів: **Борис**, **Гліб** і **Святослав**. Літопис покладає вину на Святополка й називає його **Окаянним**. Скандинавська сага натякає, що до смерті Бориса причетний найманець Ярослава, тож певності тут немає.", "**1016 р.** Ярослав із новгородцями й варягами розбив Святополка під **Любечем** і сів у Києві. За два роки Святополк повернувся з тестем, польським князем **Болеславом Хоробрим**, і переміг на Бузі. Болеслав тоді забрав собі **Червенські міста**.", "**1019 р.** в битві на річці **Альті** Ярослав переміг остаточно. Відтоді й рахують роки його князювання в Києві."], "imgs": [{"key": "borisgleb", "cap": "Святі Борис і Гліб. Ікона середини XIV ст. Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "map", "title": "Ярослав проти Святополка на карті", "steps": [{"key": "p2_fight0", "label": "1015 р."}, {"key": "p2_fight1", "label": "1015 – 1019"}]}, {"type": "text", "title": "", "badges": [], "paras": ["① **1016 р., Любеч.** Ярослав приводить військо з Новгорода й розбиває Святополка.", "② **1018 р., Буг.** Святополк повертається з польським військом Болеслава Хороброго. Ярослав тікає до Новгорода, а Червенські міста відходять до Польщі.", "③ **1019 р., Альта.** Ярослав перемагає остаточно. Святополк гине, тікаючи на захід."], "imgs": []}, {"type": "text", "kicker": "Ярослав Мудрий", "title": "Мстислав Володимирович — суперник і співправитель", "badges": ["НМТ: персоналія"], "paras": ["Ще один син Володимира, **Мстислав**, княжив у далекій **Тмутаракані** на березі Керченської протоки. Його прозвали **Хоробрим**: **1022 р.** він сам вийшов на поєдинок із касозьким князем Редедею й переміг.", "**1024 р.** Мстислав прийшов на Русь і розбив Ярослава під **Лиственом** біля Чернігова. Але Києва не взяв, а запропонував братові мир.", "**1026 р.** вони поділили державу по **Дніпру**: Ярославові дістався правий берег із Києвом, Мстиславові — лівий із **Черніговом**. Десять років брати правили у злагоді й разом відвоювали в Польщі **Червенські міста** (1030 – 1031).", "У Чернігові Мстислав почав будувати **Спасо-Преображенський собор**. **1036 р.** він помер, не лишивши сина, і Ярослав став правити всією Руссю."], "imgs": [{"key": "rededya", "cap": "Мстислав перемагає Редедю. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}, {"type": "map", "title": "Ярослав і Мстислав на карті", "steps": [{"key": "p2_fight1", "label": "1015 – 1019"}, {"key": "p2_fight2", "label": "1024 – 1036"}]}, {"type": "text", "title": "", "badges": [], "paras": ["④ **1024 р., Листвен.** Мстислав приходить із Тмутаракані й перемагає Ярослава.", "**1026 р.** брати ділять Русь по Дніпру. Літопис передає слова Мстислава: «Сиди ти на столі своєму в Києві, бо ти старший брат, а мені хай буде ся сторона».", "**1036 р.** Мстислав помирає без спадкоємця, і Ярослав стає, за висловом літописця, «самовладцем Руської землі»."], "imgs": []}, {"type": "text", "kicker": "Ярослав Мудрий", "title": "Ярослав Мудрий (1019 – 1054)", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Ярослав був сином Володимира й полоцької князівни Рогнеди. Замолоду княжив у Ростові, потім у Новгороді, звідки й почав боротьбу за Київ.", "У Києві він правив **1019 – 1054 рр.**, а єдиним володарем Русі став **1036 р.**, по смерті Мстислава. Того ж року Ярослав розгромив під Києвом **печенігів** — так, що відтоді вони Русі вже не загрожували.", "Державу він зміцнював не лише війнами: дав їй писаний закон — **«Руську правду»**, розбудував Київ, відкривав школи, збирав книги, а союзи з сусідами скріплював шлюбами своїх дітей.", "За любов до книжок, які він, за літописом, «читав часто вночі і вдень», нащадки прозвали його **Мудрим**."], "imgs": [{"key": "yar_mon", "cap": "Пам’ятник Ярославу Мудрому біля Золотих воріт у Києві."}]}, {"type": "doc", "title": "1036 р.: розгром печенігів під Києвом", "quote": ["Коли Ярослав був у Новгороді, прийшла йому вість, що печеніги облягли Київ. Ярослав зібрав воїв багатьох — варягів і словен — і прийшов до Києва, і ввійшов у город свій.", "А печенігів було без числа. Ярослав вийшов із города й виставив військо: варягів посередині, на правому крилі — киян, а на лівому — новгородців. І стали перед городом.", "Печеніги рушили, і зступилися на місці, де нині стоїть Свята Софія… І була січа люта, і ледве під вечір одолів Ярослав. І побігли печеніги врозтіч, і не знали, куди бігти."], "source": "Повість минулих літ, під 1036 р. (переклад-переказ, скорочено)", "comment": ["Печеніги скористалися тим, що князь був у Новгороді. Це їхній останній великий напад на Київ: після поразки вони відійшли до Дунаю, а в степу з’явилися торки, згодом — половці.", "Літописець каже, що на місці битви Ярослав заклав **Софійський собор**. За іншою версією, собор почав будувати ще Володимир, близько 1011 р.", "__Слова з літопису:__ **вої** — воїни; **словени** — тут: новгородці; **січа** — битва; **зступилися** — зійшлися в бою."], "img": null}, {"type": "map", "title": "", "steps": [{"key": "p2_forts0", "label": "Лінії Володимира"}, {"key": "p2_forts1", "label": "Лінія Ярослава"}]}, {"type": "doc", "title": "«Руська правда»: Правда Ярослава", "quote": ["Якщо вб’є муж мужа, то мстити братові за брата, або синові за батька, або батькові за сина, або братовому синові, або сестриному. Якщо не буде кому мстити, то 40 гривень за вбитого.", "Якщо прийде хто побитий до крові або в синцях, то не шукати йому свідка. Якщо не може помститися, то взяти йому за образу 3 гривні, а лікареві — плату.", "Якщо вдарить хто кого палицею, або жердиною, або кулаком, або чашею, або рогом, або тупим боком меча — 12 гривень. Якщо меч оголить, а не вдарить, — то гривня."], "source": "«Руська правда», Коротка редакція (Правда Ярослава), уривки (переклад-переказ)", "comment": ["«Руська правда» — перший писаний збірник законів Русі. Найдавнішу його частину уклали за Ярослава, а далі доповнювали його сини й Володимир Мономах.", "Закон іще дозволяє **кровну помсту**, але тільки найближчим родичам. Якщо мстити нікому, убивця платить 40 гривень — згодом такий штраф назвуть **вірою**. Сини Ярослава помсту скасують зовсім.", "__Слова з закону:__ **муж** — вільний чоловік; **гривня** — злиток срібла, міра вартості; **не шукати свідка** — досить самих слідів побиття."], "img": null}, {"type": "defs", "title": "Внутрішня політика Ярослава", "badges": [], "items": [{"name": "Закон", "paras": ["Уклав **«Руську правду»**.", "Суд відтепер спирався на записані правила, а за більшість провин карали штрафом."], "img": null}, {"name": "Київ", "paras": ["**1037 р.** розширив столицю: «місто Ярослава» оточили нові вали з **Золотими воротами**, а всередині звели **Софійський собор**."], "img": null}, {"name": "Освіта", "paras": ["Зібрав писців, які **перекладали з грецької й переписували книги**.", "При Софії заклав бібліотеку, у Новгороді — школу на 300 дітей."], "img": null}, {"name": "Церква", "paras": ["**1051 р.** собор єпископів обрав митрополитом **Іларіона** — уперше русина й без згоди Константинополя.", "Тоді ж чернець Антоній заснував Печерський монастир."], "img": null}], "note": null}, {"type": "map", "title": "Русь-Україна за Ярослава Мудрого", "steps": [{"key": "p2_rus2", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["Такою була Русь за Ярослава. Її межі показано на картосхемі з програми НМТ.", "На заході він разом із Мстиславом повернув **Червенські міста** (1030 – 1031), які забрала Польща, і ходив на ятвягів, литву й мазовшан.", "На півночі **1030 р.** ходив на чудь, приєднав її землю на захід від Чудського озера й заснував там місто **Юр’їв** (нині Тарту в Естонії) — за своїм християнським ім’ям Юрій.", "На півдні **1032 р.** почав ставити фортеці на **Росі**, а **1036 р.** розгромив печенігів.", "**1043 р.** послав сина Володимира морем на Константинополь. Це останній похід Русі на Візантію, і він не вдався: флот розкидала буря."], "imgs": []}, {"type": "defs", "title": "«Тесть Європи»: шлюбна дипломатія Ярослава", "badges": [], "items": [{"name": "**Ярослав**", "paras": ["дружина Інгігерда (Ірина) — донька короля Швеції"], "img": null}, {"name": "Ізяслав", "paras": ["∞ Гертруда, сестра польського князя Казимира I"], "img": null}, {"name": "Святослав", "paras": ["∞ Ода, німецька графиня"], "img": null}, {"name": "Всеволод", "paras": ["∞ візантійська царівна з роду Мономахів"], "img": null}, {"name": "Анна", "paras": ["∞ Генріх I, король Франції"], "img": null}, {"name": "Єлизавета", "paras": ["∞ Гаральд, король Норвегії"], "img": null}, {"name": "Анастасія", "paras": ["∞ Андрій I, король Угорщини"], "img": {"key": "anna_senlis", "cap": "Пам’ятник Анні Ярославні в Санлісі (Франція). Фото: P.poschadel / Wikimedia Commons, CC BY-SA 2.0 fr"}}], "note": "Сестра Ярослава Марія-Доброньога — дружина польського князя Казимира I. Прізвисько «тесть Європи» вигадали історики пізніше. Жирним виділено персоналії з програми НМТ."}, {"type": "text", "kicker": "Ярослав Мудрий", "title": "Що Ярослав лишив по собі", "badges": [], "paras": ["Сильну державу: печенігів розбито, Червенські міста повернуто, на кордонах спокій.", "**Писаний закон**, власного митрополита, школи й книгозбірні. Київ розбудували так, що чужинці порівнювали його з Константинополем.", "Родинні зв’язки з правителями Франції, Норвегії, Угорщини, Польщі, Візантії.", "Однієї проблеми Ярослав не розв’язав: як передавати владу, щоб сини не воювали між собою, як воював він сам. До чого це призвело, розповідає частина 3.", "Помер Ярослав **1054 р.** Його поховали в Софійському соборі, у мармуровому саркофазі."], "imgs": [{"key": "sarc", "cap": "Саркофаг Ярослава Мудрого в Софійському соборі. Фото: Stas-Adolf / Wikimedia Commons, CC BY-SA 4.0"}]}]}, {"id": "s4", "num": "IV", "title": "Суспільство й господарство", "sub": "Хто правив, хто працював, що вирощували, виробляли й чим торгували", "cover": {"key": "kyiv_diorama", "cap": ""}, "cards": [{"type": "defs", "title": "Як було влаштовано владу", "badges": ["НМТ: поняття"], "items": [{"name": "Великий князь", "paras": ["Сидів у **Києві**. У його руках були військо, суд, закони, податки й відносини з іншими державами."], "img": null}, {"name": "Удільні князі", "paras": ["Сини й родичі великого князя, яких він посилав правити в інші землі. Їм допомагали посадники й тисяцькі."], "img": null}, {"name": "Боярська рада", "paras": ["**Бояри**, старша дружина й вище духовенство. З ними князь радився перед кожним важливим рішенням."], "img": null}, {"name": "Віче", "paras": ["**Віче** — народні збори в містах, на яких вирішували важливі громадські й державні справи.", "Бувало, що віче запрошувало князя правити або виганяло його."], "img": null}], "note": "Устрій Русі за Володимира і Ярослава історики називають **ранньофеодальною монархією**: державою править князь, але спирається він на знать."}, {"type": "table", "title": "Хто є хто в Русі-Україні: обов’язкові поняття", "rows": [["Група", "Поняття", "Що означає"], ["Панівні", "**Боярин**", "знать: радник князя, воєвода чи намісник; мав вотчини"], ["Панівні", "Князі, дружинники, духовенство", "правили, воювали, служили в Церкві"], ["Вільні", "**Смерд**", "особисто вільний селянин: мав господарство й землю, платив данину й виконував повинності"], ["Вільні", "**Ізгой**", "людина, що втратила місце у своїй групі: викуплений холоп, неписьменний син священика, князь без уділу"], ["Вільні", "Міщани", "ремісники й купці"], ["Залежні", "**Закуп**", "узяв позику («купу») й відпрацьовував її в господарстві землевласника"], ["Залежні", "**Рядович**", "працював у землевласника за договором — «рядом»"], ["Невільні", "**Холоп**", "повністю залежна людина: її можна було продати, подарувати, передати у спадок"], ["Земля", "**Вотчинне землеволодіння**", "земля у спадковій власності: її можна продати, подарувати, передати дітям"], ["Земля", "**Умовне землеволодіння**", "земля, надана за службу князеві й лише на час служби"]]}, {"type": "text", "kicker": "Господарство", "title": "Землеробство й промисли", "badges": [], "paras": ["Основа господарства — **орне землеробство**. Орали **ралом** і **плугом** із залізним лемешем. Землю обробляли за системою **двопілля** або **трипілля**: частину поля щороку лишали відпочивати. На лісистій півночі ще випалювали ліс під поле.", "Сіяли **жито, пшеницю, ячмінь, овес, просо**, вирощували горох, льон, коноплі.", "Тримали корів, свиней, овець, коней — переважно біля двору.", "**Промисли**: полювання на хутрового звіра, **бортництво** (мед і віск диких бджіл), рибальство. Хутро, мед і віск — головні товари на продаж."], "imgs": [{"key": "furs", "cap": "Шкурки куниці («куни») використовували і як гроші."}]}, {"type": "carousel", "title": "Ремесла: ковалі й ювеліри", "badges": [], "note": "На Русі було понад 60 ремісничих спеціальностей. Найважливіша — **ковальство** (знаряддя, зброя). Ювеліри працювали в техніках **зерні** (дрібні кульки), **скані** (дротяне мереживо), **черні** й **перегородчастої емалі**.", "items": [{"key": "kolt1", "name": "", "desc": "Колт із перегородчастою емаллю", "cap": ""}, {"key": "kolt2", "name": "", "desc": "Срібний колт, техніка зерні", "cap": ""}, {"key": "earrings", "name": "", "desc": "Сережки, техніка зерні", "cap": ""}, {"key": "klad", "name": "", "desc": "Скарб прикрас із Києва. Фото: shakko / Wikimedia Commons, CC BY-SA 3.0", "cap": ""}, {"key": "weapons", "name": "", "desc": "Ковальство: меч, шолом, кольчуга", "cap": ""}]}, {"type": "map", "title": "Торгівля", "steps": [{"key": "p2_trade", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**«Із варягів у греки»**, або Грецький шлях, вів Дніпром і морем до Константинополя.", "**Соляний** шлях з’єднував Київ із Галичем: із Прикарпаття возили сіль. Звідти інші шляхи вели на Краків, Прагу й Регенсбург.", "**Залозний** шлях вів степом до Азовського моря, Тмутаракані й Кавказу.", "Продавали хутро, мед, віск, зброю, невільників. Купували шовк, вино, прянощі, коштовності."], "imgs": []}, {"type": "carousel", "title": "Гроші Русі-України", "badges": [], "note": "Спершу платили арабськими **дирхемами** й візантійськими монетами. Володимир карбував **златники й срібники**, але їх було мало. Основною мірою вартості стала **гривня** — злиток срібла. За «Руською правдою», 1 гривня = 20 ногат = 25 кун = 50 резан.", "items": [{"key": "hryvnia", "name": "", "desc": "Київська срібна гривня — злиток вагою близько 160 г. Фото: Ruban2013 / Wikimedia Commons, CC BY-SA 3.0", "cap": ""}, {"key": "hryvnias", "name": "", "desc": "Гривні — злитки срібла; у різних землях вони мали різну форму.", "cap": ""}, {"key": "srebr1016b", "name": "", "desc": "Срібник Ярослава Мудрого (новгородський), освітлено. Фото: Тюканов Григорий / Wikimedia Commons, CC BY-SA 3.0", "cap": ""}]}]}, {"id": "s5", "num": "V", "title": "Культура першої половини XI ст.", "sub": "Писемність, освіта, билини, Київ Ярослава, Софія, мозаїки й фрески", "cover": {"key": "golden", "cap": ""}, "cards": [{"type": "text", "kicker": "Культура", "title": "Писемність і освіта", "badges": [], "paras": ["Письмо на Русі знали й до хрещення: договори з Візантією X ст. мали й слов’янський текст. Але поширилася писемність лише **після 988 р.**", "Абетку для слов’ян — **глаголицю** — створили близько 863 р. візантійські місіонери **Кирило й Мефодій**. Згодом їхні учні в Болгарії уклали **кирилицю** на основі грецького письма. Саме кирилицею писали на Русі.", "Володимир велів брати дітей знатних людей «на учення книжне». Ярослав відкрив школу в Новгороді, зібрав писців і заснував бібліотеку при Софійському соборі.", "На стінах Софії збереглися тисячі **графіті** — видряпаних написів. Лишали їх і князі, і священики, і звичайні парафіяни."], "imgs": [{"key": "fol14ra", "cap": "Переклад книг слов’янською (розповідь про Кирила й Мефодія). Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}]}, {"type": "doc", "title": "Як навчали дітей за Володимира", "quote": ["І почав він ставити по городах церкви, і попів [настановляти], і людей на хрещення приводити по всіх городах і селах.", "І, пославши [мужів своїх], став він у знатних людей дітей забирати і оддавати їх на учення книжне. А матері ж дітей своїх оплакували, бо іще не укріпилися вони були вірою і, як померлого, вони оплакували."], "source": "Повість минулих літ, під 988 р. (переклад Л. Махновця)", "comment": ["Церкві потрібні були священики, а князеві — грамотні люди. Тому Володимир наказав забирати дітей знаті «на учення книжне». Це перша школа на Русі, про яку ми знаємо.", "Матері плакали за дітьми, як за померлими: навчання за книгами було новим і лякало людей.", "__Слова з літопису:__ **учення книжне** — навчання грамоти за церковними книгами; **попи** — священики; **не укріпилися вірою** — ще не звикли до християнства."], "img": null}, {"type": "text", "kicker": "Культура", "title": "Митрополит Іларіон і «Слово про закон і благодать»", "badges": ["НМТ: персоналія"], "paras": ["Іларіон був священиком у князівському селі Берестове й книжником, близьким до Ярослава.", "**1051 р.** собор руських єпископів обрав його **митрополитом Київським** — першим **русином** на цій посаді. Згоди Константинополя князь і єпископи не питали.", "Між 1037 і 1050 рр. Іларіон написав **«Слово про закон і благодать»** — урочисту промову-проповідь.", "Він доводить, що Русь, прийнявши християнство, стала **рівною** іншим християнським народам, і прославляє Володимира як «нового Костянтина».", "«Не в худій бо й невідомій землі володарювали [предки Володимира], а в Руській, про яку знають і чують у всіх кінцях землі» (переклад-переказ)."], "imgs": [{"key": "ilarion_rc", "cap": "Ярослав поставляє Іларіона митрополитом. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}, {"key": "slovo_ms", "cap": "Список «Слова» XV ст. Фото: Лапоть / Wikimedia Commons, CC0"}]}, {"type": "text", "kicker": "Культура", "title": "Билини", "badges": ["НМТ: поняття"], "paras": ["**Билини** — народні епічні пісні, які розповідали про подвиги богатирів і передавалися з уст в уста.", "Найвідоміший цикл билин — **київський**. У ньому діють «ласкавий князь Володимир Красне Сонечко» й богатирі **Ілля Муромець**, **Добриня Микитич**, **Олешко Попович**. Вони боронять Русь від Змія Горинича, Солов’я-Розбійника, кочовиків.", "Добриня мав реального прототипа — дядька Володимира, воєводу Добриню.", "Записали билини фольклористи у XVIII – XIX ст., переважно на півночі Росії, куди вони потрапили з Русі. В Україні збереглися перекази про ті самі часи — про **Кирила Кожум’яку**, що переміг змія, і про **Змієві вали**."], "imgs": [{"key": "bogatyri", "cap": "В. Васнецов. Богатирі (1898). Суспільне надбання"}]}, {"type": "text", "kicker": "Культура", "title": "Київ — «суперник Константинополя»", "badges": [], "paras": ["Київ складався з кількох частин. На Старокиївській горі було **місто Володимира** з Десятинною церквою й князівськими палацами.", "**1037 р.** Ярослав заклав **місто Ярослава** — у кілька разів більше. Його оточили валами з трьома брамами.", "Головна брама — **Золоті ворота** з надбрамною церквою Благовіщення. Від них збереглися руїни, які з 1982 р. накрито павільйоном.", "Внизу, біля Дніпра, — **Поділ**: квартали ремісників і купців, торгова площа.", "Німецький хроніст Адам Бременський назвав Київ «суперником Константинополя, окрасою Греції»."], "imgs": [{"key": "kyiv_plan", "cap": "Київ у XI – XIII ст. (план з атласу)."}, {"key": "gg_ruins", "cap": "Руїни Золотих воріт (фото XIX ст.)."}]}, {"type": "monument", "title": "Софійський собор у Києві", "badges": [], "img": {"key": "sophia", "cap": "Софійський собор, вигляд із півдня. Фото: Galvm / Wikimedia Commons, CC BY-SA 4.0"}, "paras": ["Головний храм Русі. За літописом, його заклав **Ярослав Мудрий 1037 р.**; за іншою версією, будову почав ще Володимир **1011 р.**, а Ярослав завершив. У програмі НМТ — **перша половина XI ст.**", "Спершу мав **13 бань** — на честь Христа й апостолів. Усередині — **мозаїки** й **фрески**.", "Тут була кафедра митрополита, відбувалися урочисті церемонії, працювала бібліотека. У соборі поховано Ярослава.", "Наприкінці XVII – на початку XVIII ст. собор перебудували в стилі **українського бароко** — таким його бачимо нині.", "__Як упізнати на НМТ:__ біла будівля з багатьма зеленими банями й золотою центральною."]}, {"type": "carousel", "title": "Софійський собор: яким він був і став", "badges": [], "note": "У XI ст. собор мав відкриті галереї, а стіни не тинькували, тому було видно ряди каменю й цегли-плінфи на рожевому розчині. Фрески у вежах зображують світські сцени: іподром, полювання, музик і скоморохів.", "items": [{"key": "sophia_model", "name": "", "desc": "Модель собору XI ст. (реконструкція). Фото: Voevoda / Wikimedia Commons, CC BY 2.5", "cap": ""}, {"key": "sof_fresco", "name": "", "desc": "Фреска у вежі: прийом при імператорському дворі (за однією з версій — Ольга в Константинополі). Суспільне надбання", "cap": ""}, {"key": "frescoes", "name": "", "desc": "Фреска: доньки Ярослава (частина групового портрета родини).", "cap": ""}]}, {"type": "carousel", "title": "Мозаїки Софії: Оранта і Христос Вседержитель", "badges": [], "note": "**Мозаїка** — зображення з окремих щільно припасованих шматочків кольорового скла (смальти) чи камінців. **Фреска** — живопис фарбами по вологій штукатурці. **Ікона** — зображення Христа, Богородиці, святих і подій зі Святого Письма, виконане живописом, мозаїкою чи рельєфом.", "items": [{"key": "oranta", "name": "", "desc": "**Богоматір Оранта** («Нерушима стіна») у вівтарі. Фото: невідомий автор / Wikimedia Commons, Public domain", "cap": ""}, {"key": "pantocrator2", "name": "", "desc": "**Христос Вседержитель** (Пантократор) у центральному куполі, довкола — архангели. Фото: Vi Ko / Wikimedia Commons, CC BY-SA 4.0", "cap": ""}]}, {"type": "monument", "title": "Спасо-Преображенський собор у Чернігові", "badges": [], "img": {"key": "spas", "cap": "Спасо-Преображенський собор. Фото: Nomad0212 / Wikimedia Commons, CC BY-SA 4.0"}, "paras": ["Заклав князь **Мстислав Володимирович** близько 1031 – 1035 рр. У програмі НМТ — **1036 р.**: того року Мстислав помер, і його поховали в соборі.", "Один із **найдавніших** кам’яних храмів Русі, що дійшли до нас.", "П’ятибанний храм із двома круглими вежами обабіч західного фасаду. Північна вежа — давня, сходова; південну добудували пізніше. Гострі шпилі на вежах — з перебудови кінця XVIII ст.", "__Як упізнати на НМТ:__ білий храм із п’ятьма банями й двома круглими вежами з гострими шпилями."]}]}, {"id": "s6", "num": "VI", "title": "Підсумки", "sub": "Порівняння князів, що плутають на НМТ, стрічка часу", "cover": {"key": "vol_mon", "cap": ""}, "cards": [{"type": "table", "title": "Володимир Великий і Ярослав Мудрий", "rows": [["", "Володимир Великий (980 – 1015)", "Ярослав Мудрий (1019 – 1054)"], ["Як прийшов до влади", "переміг брата Ярополка (980)", "переміг Святополка (1016, 1019); до 1036 ділив Русь із Мстиславом"], ["Управління", "сини-намісники замість князів племен", "єдиновладдя з 1036 р.; сини-намісники"], ["Закон", "Церковний устав (десятина)", "**«Руська правда»**"], ["Віра й Церква", "**988 р.** — хрещення; Десятинна церква", "1051 — митрополит-русин Іларіон; Печерський монастир"], ["Оборона", "фортеці по Десні, Сулі, Стугні та ін.; Змієві вали", "**1036 р.** — розгром печенігів; фортеці на Росі"], ["Зовнішня політика", "981 — Червенські міста; 988 — Корсунь, шлюб з Анною", "1018 — втрачено Червенські міста, 1031 — повернуто; 1030 — Юр’їв; 1043 — похід на Візантію"], ["Культура", "перші школи; златники й срібники", "Софійський собор, Золоті ворота, бібліотека"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "1036 — три події", "paras": ["Розгром **печенігів** під Києвом.", "Смерть **Мстислава** — Ярослав стає єдиним правителем Русі.", "У програмі ця дата — і для Спаського собору."], "img": null}, {"name": "Два Мстислави", "paras": ["**Мстислав Володимирович** — брат Ярослава, Чернігів, Листвен.", "**Мстислав Великий** — син Мономаха (частина 3)."], "img": null}, {"name": "Мозаїки Софії", "paras": ["**Оранта** — Богородиця з піднятими руками, у вівтарі.", "**Вседержитель** — Христос із книгою, у куполі."], "img": null}, {"name": "Хто що збудував", "paras": ["Володимир — **Десятинну церкву**.", "Ярослав — **Софію** і **Золоті ворота**.", "Мстислав — **Спаський собор** у Чернігові."], "img": null}], "note": null}, {"type": "tl_events", "title": "Стрічка часу: доба розквіту", "note": "1019 – 1054 — князювання Ярослава Мудрого (дата з програми). Відстані між подіями однакові для наочності.", "items": [{"year": "980", "name": "Володимир", "desc": "князь у Києві; язичницька реформа", "color": "#8ccf84", "prog": false}, {"year": "981", "name": "Червенські міста", "desc": "приєднано до Русі", "color": "#8ccf84", "prog": false}, {"year": "988", "name": "Хрещення", "desc": "християнство — державна релігія", "color": "#8ccf84", "prog": true}, {"year": "1015", "name": "Смерть Володимира", "desc": "боротьба за владу; 1018 — втрата Червенських міст", "color": "#a6a6a6", "prog": false}, {"year": "1019", "name": "Ярослав", "desc": "перемога на Альті", "color": "#7fd06a", "prog": true}, {"year": "1024", "name": "Листвен", "desc": "поділ Русі по Дніпру (1026)", "color": "#a6a6a6", "prog": false}, {"year": "1036", "name": "Печеніги", "desc": "розгромлені під Києвом", "color": "#7fd06a", "prog": true}, {"year": "1037", "name": "Місто Ярослава", "desc": "Золоті ворота, Софія", "color": "#7fd06a", "prog": false}, {"year": "1051", "name": "Іларіон", "desc": "митрополит-русин", "color": "#7fd06a", "prog": false}, {"year": "1054", "name": "Смерть Ярослава", "desc": "кінець доби розквіту", "color": "#7fd06a", "prog": true}]}]}]}, {"id": "p3", "num": 3, "title": "Русь-Україна (Київська держава)", "part": "Частина 3. Від Ярославичів до роздробленості", "sub": "Ярославичі, половці, Любецький з’їзд, Мономах і Мстислав, князівства", "cover": {"key": "pol_battle2", "cap": "Руські дружини б’ються з половцями. Радзивіллівський літопис"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **1097 р.** — Любецький з’їзд князів", "• **1113 р.** — укладення «Повісті минулих літ»; початок правління Володимира Мономаха в Києві", "• **1187 р.** — перша писемна згадка назви «Україна»"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії", "light": false}, {"k": "p", "paras": ["• **Ізяслав, Святослав і Всеволод Ярославичі**", "• **Володимир Мономах**, **Мстислав Великий** (Володимирович)", "• **Ярослав Осмомисл**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття й картосхема", "light": false}, {"k": "p", "paras": ["• **роздробленість**; повторити: **віче**, **вотчинне** й **умовне землеволодіння**", "• князівства XII ст.: **Київське, Чернігівське, Переяславське, Галицьке, Волинське**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Знати й пояснювати", "light": false}, {"k": "p", "paras": ["• причини й наслідки **роздробленості**", "• значення **Любецького з’їзду**", "• боротьба з **половцями**", "• особливості розвитку українських князівств"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ, тема 3. «Повість минулих літ», «Слово о полку Ігоревім» і пам’ятки культури цього часу — у частині 4."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Ярославичі", "sub": "«Заповіт» Ярослава, тріумвірат, Правда Ярославичів і прихід половців", "cover": {"key": "mono_sword", "cap": ""}, "cards": [{"type": "doc", "title": "«Заповіт» Ярослава Мудрого (1054)", "quote": ["Ось я покидаю світ цей, сини мої. Майте любов між собою, бо ви брати від одного батька й однієї матері. Якщо житимете в любові між собою, Бог буде з вами… А якщо будете ненавидіти один одного, сварячись, то й самі загинете, і погубите землю отців і дідів своїх.", "Тож хай сидить на престолі моєму в Києві старший син мій і брат ваш Ізяслав. Його слухайте, як мене слухали. А Святославу даю Чернігів, а Всеволоду — Переяслав, а Ігорю — Володимир, а В’ячеславу — Смоленськ.", "І так поділив між ними городи, заповівши їм не переступати межі братньої."], "source": "Повість минулих літ, під 1054 р. (переклад-переказ, скорочено)", "comment": ["Ярослав сам здобував Київ у війні з братами й не хотів, щоб так само воювали його сини. Тому він заздалегідь розділив між ними землі й наказав слухатися старшого — **Ізяслава**.", "Так на Русі склався порядок, за яким великим князем стає **старший у роді**, а молодші переходять на кращі столи, коли ті звільняються.", "Але кого вважати старшим у наступному поколінні — дядька чи сина старшого брата? Цього заповіт не пояснював, і згодом через це почалися війни.", "__Слова з літопису:__ **престол (стіл)** — княжа влада в місті; **городи** — тут: міста із землями довкола; **переступати межу братню** — зазіхати на володіння брата."], "img": null}, {"type": "map", "title": "Як поділили Русь у 1054 р.", "steps": [{"key": "p3_udily", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**Ізяслав**, як старший, дістав **Київ**, а з ним Турів і Новгород.", "**Святослав** сів у **Чернігові**; йому належали також Муром і далека Тмутаракань.", "**Всеволод** отримав **Переяслав** і Ростово-Суздальську землю.", "Молодшим дісталося менше: **В’ячеславу** — Смоленськ, **Ігорю** — Володимир. Обидва невдовзі померли, а їхніх синів дядьки залишили без земель. Таких князів називали **ізгоями**.", "Полоцьком правив **Всеслав**, правнук Володимира Великого."], "imgs": []}, {"type": "text", "kicker": "Ярославичі", "title": "Половці — нові господарі степу", "badges": [], "paras": ["Щойно Ярославичі поділили землі, у степу з’явився новий ворог. **Половці** — тюркський народ, що сам себе називав кипчаками, — у середині XI ст. витіснили з причорноморських степів печенігів і торків.", "Половці були кочовими скотарями, а чимало багатства здобували війною. Кожну **орду** вів свій хан; у літописах згадано Боняка, Шарукана, Тугоркана, Кончака.", "На Русь половці вперше напали **1061 р.** Відтоді набіги повторювалися майже щороку: кочовики палили села, забирали людей у полон і відганяли худобу.", "Проте руські князі не лише воювали з половцями: вони **наймали** їх проти власних родичів і **одружувалися** з доньками ханів.", "Про половців нагадують кам’яні статуї — **«половецькі баби»**: кочовики ставили їх на курганах."], "imgs": [{"key": "pol_baby", "cap": "Половецькі кам’яні статуї в музеї в Пологах. Фото: Nataliya Shestakova / Wikimedia Commons, CC BY 4.0"}]}, {"type": "defs", "title": "Тріумвірат Ярославичів (1054 – 1073)", "badges": ["НМТ: персоналія"], "items": [{"name": "Що це", "paras": ["Майже двадцять років по смерті батька три старші брати правили спільно: **Ізяслав** у Києві, **Святослав** у Чернігові, **Всеволод** у Переяславі. Історики назвали це **тріумвіратом**."], "img": null}, {"name": "Що зробили разом", "paras": ["**1060 р.** розбили кочовиків-**торків**.", "**1067 р.** перемогли й ув’язнили Всеслава Полоцького.", "Близько **1072 р.** доповнили закони батька — уклали **Правду Ярославичів**."], "img": null}, {"name": "Перша поразка", "paras": ["**1068 р.** на річці **Альті** братів розбили **половці**.", "У Києві через це вибухнуло повстання, і Ізяслав утік до Польщі."], "img": null}, {"name": "Розпад", "paras": ["**1073 р.** Святослав і Всеволод самі вигнали старшого брата з Києва.", "Заповіт Ярослава порушили його ж сини."], "img": null}], "note": null}, {"type": "text", "kicker": "Ярославичі", "title": "Ізяслав Ярославич", "badges": ["НМТ: персоналія"], "paras": ["Старший син Ярослава князював у Києві **тричі**: 1054 – 1068, 1069 – 1073 і 1077 – 1078 рр. Двічі його виганяли.", "Уперше це сталося **1068 р.** Після поразки на Альті кияни зібралися на віче й просили зброї, щоб знову битися з половцями. Ізяслав відмовив. Тоді люди повстали, звільнили з в’язниці **Всеслава Полоцького** й проголосили його князем. Наступного року Ізяслав повернувся з польським військом і розправився з повсталими.", "Удруге, **1073 р.**, його вигнали рідні брати. Ізяслав шукав допомоги в польського князя, німецького імператора й навіть у **Папи Римського**, але повернувся лише по смерті Святослава.", "Загинув він **1078 р.** в битві на **Нежатиній Ниві**: проти нього й Всеволода виступили племінники-ізгої з половцями."], "imgs": [{"key": "izyas_death", "cap": "Загибель Ізяслава на Нежатиній Ниві (гравюра XIX ст.)."}]}, {"type": "doc", "title": "Повстання киян 1068 р.", "quote": ["Коли ж Ізяслав із Всеволодом прибігли до Києва, а Святослав — до Чернігова, кияни, що прибігли до Києва, вчинили віче на торговищі й послали до князя, кажучи:", "«Ось половці розсипалися по землі. Дай же, княже, оружжя й коней, і ще поб’ємося з ними». Ізяслав же цього не послухав.", "І почали люди говорити на воєводу Коснячка; і пішли з віча на гору, і прийшли на двір Коснячків, і, не знайшовши його, стали біля двору Брячиславового… І вивели Всеслава з поруба, і поставили його посеред двору княжого. А двір княжий розграбували."], "source": "Повість минулих літ, під 1068 р. (переклад-переказ, скорочено)", "comment": ["Київське **віче** тут діє як самостійна сила: вимагає від князя зброї, а діставши відмову, скидає його й садить на стіл іншого.", "Всеслава Полоцького Ярославичі за рік до того схопили, хоча присягнули не чинити йому зла, і тримали в Києві під вартою. Повсталі зробили його князем, але за сім місяців він сам утік із міста.", "__Слова з літопису:__ **торговище** — торгова площа на Подолі; **гора** — верхнє місто, де жили князь і бояри; **поруб** — в’язниця-зруб без дверей; **Коснячко** — київський воєвода."], "img": null}, {"type": "doc", "title": "Правда Ярославичів (бл. 1072)", "quote": ["Після Ярослава зібралися сини його: Ізяслав, Святослав, Всеволод і воєводи їхні — Коснячко, Переніг, Никифор — і відмінили кровну помсту, а встановили за вбивство кунами відкупатися. А все інше судити, як Ярослав судив. Так сини його встановили.", "Якщо вб’ють огнищанина навмисне, то вбивці платити за нього 80 гривень, а людям не платити. А за княжого тіуна — 80 гривень.", "А за смерда й холопа — 5 гривень."], "source": "«Руська правда» (Правда Ярославичів), переклад-переказ, скорочено", "comment": ["Ярослав лише обмежив кровну помсту, а його сини **скасували її зовсім**. За вбивство відтепер платили штраф — **віру**.", "Розмір штрафу залежав від того, кого вбито. За княжого управителя — 80 гривень, за селянина чи холопа — 5. Закон насамперед оберігав людей князя та його майно.", "__Слова з закону:__ **куни** — гроші; **огнищанин** — управитель княжого господарства; **тіун** — княжий урядник; **смерд** — вільний селянин; **холоп** — невільник."], "img": null}, {"type": "text", "kicker": "Ярославичі", "title": "Святослав Ярославич (1073 – 1076)", "badges": ["НМТ: персоналія", "НМТ: пам’ятка"], "paras": ["Другий із трьох братів майже двадцять років княжив у **Чернігові**. Йому належали також Муром і Тмутаракань.", "**1068 р.**, уже після поразки на Альті, він із малою дружиною розбив половців під Сновськом — це перша перемога Русі над ними.", "**1073 р.** Святослав умовив Всеволода виступити проти Ізяслава й сам сів у Києві. Це було пряме порушення батькового заповіту.", "Правив він лише три роки. За цей час для нього переписали **«Ізборник» 1073 р.**, а в Печерському монастирі заклали **Успенський собор** (про них — у частині 4).", "Святослав помер **1076 р.** Від його сина Олега походять **Ольговичі** — чернігівські князі XII – XIII ст."], "imgs": [{"key": "izb_family", "cap": "Мініатюра «Родина князя Святослава Ярославича» з «Ізборника» 1073 р.: князь із книгою, княгиня й сини."}]}, {"type": "text", "kicker": "Ярославичі", "title": "Всеволод Ярославич (1078 – 1093)", "badges": ["НМТ: персоналія"], "paras": ["Всеволод був наймолодшим із трьох братів. Замолоду княжив у **Переяславі** й одружився з візантійською царівною з роду **Мономахів**; їхнього сина Володимира прозвали Мономахом.", "У Києві Всеволод сів **1078 р.**, після загибелі Ізяслава, і правив п’ятнадцять років. Його знали як людину освічену: за словами сина, він, «удома сидячи, знав п’ять мов».", "Князювання Всеволода було неспокійним. Зі степу нападали **половці**, а **князі-ізгої** раз у раз приводили їх на Русь, вимагаючи собі земель. Воював із ними здебільшого його син Володимир Мономах.", "Літописець дорікає старому князеві, що той слухав молодих радників, а його урядники чинили несправедливий суд.", "Всеволод помер **1093 р.** Мономах міг лишитися в Києві, але поступився старшому в роді — Святополкові Ізяславичу."], "imgs": [{"key": "vsev_eng", "cap": "Всеволод Ярославич (гравюра XIX ст.)."}]}]}, {"id": "s2", "num": "II", "title": "Любецький з’їзд і боротьба з половцями", "sub": "Святополк II, рішення 1097 р. і спільні походи в степ", "cover": {"key": "pol_battle1", "cap": ""}, "cards": [{"type": "text", "kicker": "Любеч і половці", "title": "Святополк II Ізяславич (1093 – 1113)", "badges": [], "paras": ["Святополк був сином Ізяслава й найстаршим серед онуків Ярослава. Щойно сівши в Києві, він ув’язнив половецьких послів і проти порад бояр повів на кочовиків замале військо. **1093 р.** половці розбили руське військо на **Стугні**; у річці потонув брат Мономаха Ростислав.", "Тим часом **Олег Святославич** із половцями відвойовував батьківський Чернігів. Щоб припинити ці війни, князі **1097 р.** з’їхалися в **Любечі**.", "Сам Святополк угоду невдовзі порушив: дозволив схопити й осліпити князя Василька Теребовльського.", "Пізніше він разом із Мономахом водив дружини в степ (1103, 1111). Кияни були невдоволені Святополком: за його правління розбагатіли **лихварі**, а сіль продавали дуже дорого. Після його смерті **1113 р.** кияни повстали."], "imgs": [{"key": "vasyl_talk", "cap": "Давид Волинський радиться з Володарем Перемишльським. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання, Фото: Радзивиловская летопись / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "doc", "title": "Любецький з’їзд князів (1097)", "quote": ["Прийшли Святополк, і Володимир, і Давид Ігоревич, і Василько Ростиславич, і Давид Святославич, і брат його Олег, і зібралися в Любечі на влаштування миру. І говорили один одному:", "«Нащо губимо Руську землю, самі на себе котору маючи? А половці землю нашу розносять і раді, що між нами війна. Віднині з’єднаймося в одне серце і стережімо Руської землі.", "Хай кожен держить отчину свою: Святополк — Київ, Ізяславову; Володимир — Всеволодову; Давид, Олег і Ярослав — Святославову…» І на тім цілували хрест."], "source": "Повість минулих літ, під 1097 р. (переклад-переказ, скорочено)", "comment": ["Онуки Ярослава зібралися в **Любечі** над Дніпром, щоб зупинити усобиці й разом стати проти половців.", "Головне рішення — **«кожен хай держить отчину свою»**: землі батька переходять до його синів. Уділи перетворилися на **спадкові володіння — вотчини**, а старшинство в роді втратило колишнє значення.", "Рішення з’їзду на якийсь час зупинило війни, але водночас закріпило поділ Русі на окремі князівства.", "__Слова з літопису:__ **котора** — чвара, ворожнеча; **отчина** — володіння батька; **цілувати хрест** — присягати."], "img": null}, {"type": "defs", "title": "Що вирішили в Любечі — і що з цього вийшло", "badges": ["НМТ: дата"], "items": [{"name": "Про що домовилися", "paras": ["Кожен князь володіє землею свого батька — **отчиною**.", "Усобиць не починати.", "Проти **половців** виступати разом."], "img": null}, {"name": "Що сталося одразу", "paras": ["Того ж **1097 р.** Давид Ігоревич за згодою Святополка схопив і **осліпив** теребовльського князя **Василька**.", "Війна спалахнула знову."], "img": null}, {"name": "Витичів, 1100", "paras": ["На новому з’їзді князі покарали Давида: відібрали в нього Володимир.", "Після цього князі почали спільні походи проти половців."], "img": null}, {"name": "Що змінилося", "paras": ["Князі вперше вирішували спільні справи **на з’їзді**, а не війною.", "Проте кожна гілка роду відтепер дбала насамперед про свою **вотчину**."], "img": null}], "note": null}, {"type": "doc", "title": "Засліплення Василька Теребовльського (1097)", "quote": ["І ввійшов Василько до Києва… А Давид з’явився до Святополка, кажучи: «Ось убив брата твого Ярополка, а нині й на тебе мислить, і на мене, і зговорився з Володимиром».", "І взяли Василька в кайдани, і повезли до Білгорода… І вийняли ножем око йому, а потім і друге.", "Володимир же, почувши, що схоплено Василька й засліплено, жахнувся, і заплакав, і сказав: «Не бувало такого в Руській землі ні за дідів наших, ні за отців наших»."], "source": "Повість минулих літ, під 1097 р. (переклад-переказ, скорочено)", "comment": ["Засліплення сталося лише за кілька тижнів після Любецького з’їзду. Волинський князь Давид Ігоревич боявся, що сусід Василько відбере в нього землі, і переконав Святополка, ніби Василько готує змову.", "Досі князі в усобицях гинули в бою, але полонених родичів не калічили. Тому Мономах і каже, що такого на Русі ще не бувало. Він повів князів на Святополка, і того врятувало лише заступництво киян.", "__Слова з літопису:__ **мислити на когось** — замишляти зле; **брат** — тут: родич-князь; **Ярополк** — брат Святополка, убитий 1086 р."], "img": {"key": "vasyl_blind", "cap": "Засліплення Василька. Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання"}}, {"type": "doc", "title": "Долобський з’їзд: Мономах переконує князів (1103)", "quote": ["І почала дружина Святополкова казати: «Не годиться навесні йти в похід, бо погубимо смердів і ниви їхні».", "І сказав Володимир: «Дивно мені, дружино, що коней жалієте, якими орють. А чому того не зважите, що почне смерд орати, і, приїхавши, половчин ударить його стрілою, і кобилу його забере, і, в село його приїхавши, візьме жону його, і діти його, і все майно?", "Коня жалієте, а самого чому не жалієте?» І не змогла відповісти дружина Святополкова."], "source": "Повість минулих літ, під 1103 р. (переклад-переказ, скорочено)", "comment": ["Князі радилися біля Долобського озера під Києвом. Мономах пропонував ударити на половців **навесні**: після зими степові коні слабкі, і кочовики не встигнуть відійти.", "Дружинники Святополка заперечували: похід забере в селян коней саме під час оранки. Мономах відповів, що половецький напад зашкодить смердові більше, ніж похід.", "Того ж **1103 р.** руське військо вперше розбило половців у їхньому степу — на річці **Сутінь**.", "__Слова з літопису:__ **смерд** — вільний селянин; **дружина** — тут: бояри-радники князя; **половчин** — половець."], "img": null}, {"type": "map", "title": "Боротьба з половцями на карті", "steps": [{"key": "p3_pol0", "label": "Поразки"}, {"key": "p3_pol1", "label": "Походи в степ"}]}, {"type": "text", "title": "", "badges": [], "paras": ["**Спершу Русь програвала.** 1068 р. — поразка на Альті, 1093 р. — на Стугні. 1078 р. на Нежатину Ниву половців привели самі князі-ізгої.", "**1103 р.** — перший спільний похід: Дніпром до порогів і далі степом, перемога на **Сутені**.", "**1107 р.** під **Лубнами** на Сулі розбито ханів Боняка й Шарукана.", "**1111 р.** — похід до Сіверського Дінця. Князі взяли половецькі містечка Шарукань і Сугров і перемогли на річці **Сальниці**. Попереду війська йшли священики з хрестами."], "imgs": []}]}, {"id": "s3", "num": "III", "title": "Володимир Мономах і Мстислав Великий", "sub": "1113 – 1132: останні роки єдності Русі", "cover": {"key": "nestor_ant", "cap": ""}, "cards": [{"type": "doc", "title": "Повстання в Києві 1113 р.", "quote": ["А назавтра, в сімнадцятий день, кияни вчинили раду [і] послали [послів] до Володимира [Всеволодовича в Переяславль], говорячи: «Піди, княже, на стіл отчий і дідній». Це почувши, Володимир вельми тужив, але не пішов, горюючи за братом.", "Кияни тим часом розграбували двір Путяти [Вишатича], тисяцького, і пішли на жидів, і розграбували їх. І послали знову кияни [послів] до Володимира, говорячи: «Піди, княже, до Києва. Бо якщо ти не підеш, то знай, що багато зла підніметься… далі й підуть на ятрівку твою, і на бояр, і на монастирі».", "Отож, це почувши, Володимир пішов у Київ."], "source": "Повість минулих літ (Іпатіївський список), під 1113 р. (переклад Л. Махновця)", "comment": ["Щойно помер Святополк, кияни розгромили двори його тисяцького та лихварів. Лихварі брали за позики такі високі відсотки, що боржники ставали закупами або й холопами.", "Бояри злякалися, що повсталі нападуть і на них, і покликали Мономаха. За любецьким правилом «кожен держить отчину свою» Київ мав лишитися за синами Святополка, тому Мономах спершу відмовився.", "__Слова з літопису:__ **стіл отчий і дідній** — київський престол його батька й діда; **тисяцький** — воєвода міського ополчення; **жиди** — так літопис називає євреїв, тут ідеться про лихварів; **ятрівка** — братова дружина, тут: удова Святополка."], "img": null}, {"type": "text", "kicker": "Мономах і Мстислав", "title": "Володимир Мономах (1113 – 1125)", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Володимир був сином Всеволода Ярославича й візантійської царівни з роду Мономахів. Княжив у Чернігові, а від 1094 р. — у прикордонному **Переяславі**, де прославився походами на половців.", "**1113 р.** повсталі кияни покликали його на великокнязівський стіл. Спершу Мономах усунув причину повстання: видав **Устав**, який обмежив відсотки за позиками й заборонив обертати закупів на холопів.", "Потім Мономах підкорив собі інших князів: проти непокірних посилав військо, а в найважливіших містах посадив своїх синів. Під владою його родини опинилося близько трьох чвертей Русі — держава знову стала **єдиною**.", "Мономах був одружений із **Гітою**, донькою англійського короля Гарольда II. Для синів він написав **«Повчання»**. **1113 р.**, коли Мономах став київським князем, у Києві закінчили **«Повість минулих літ»**."], "imgs": [{"key": "mono_hostage", "cap": "Мономах віддає сина Святослава заручником половецькому хану Китану (1095). Радзивіллівський літопис (кінець XV ст., пізня копія). Суспільне надбання, Фото: Радзивилловская летопись / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "doc", "title": "«Повчання дітям» Володимира Мономаха", "quote": ["Усього походів було вісімдесят і три великих, а решти й не пригадаю менших… Що належало робити отрокові моєму, те сам я робив — на війні й на ловах, вночі й удень, у спеку й у стужу, не даючи собі спочинку.", "Убогих не забувайте, але, наскільки можете, годуйте… Ані правого, ані винного не вбивайте й не повелівайте вбити його.", "Що вмієте доброго, того не забувайте, а чого не вмієте, того вчіться — як батько мій, удома сидячи, знав п’ять мов. У цьому бо честь від інших країн."], "source": "«Повчання» Володимира Мономаха, поч. XII ст. (переклад-переказ, скорочено)", "comment": ["Мономах писав «Повчання» вже старим, підсумовуючи життя. Це водночас спогади й настанова синам: як правити, воювати й поводитися з людьми.", "Князь, на його думку, має все робити сам, не покладаючись на слуг, захищати слабких, не карати на смерть і постійно вчитися. Твір зберігся в єдиному списку — у Лаврентіївському літописі 1377 р.", "__Слова з «Повчання»:__ **отрок** — молодший дружинник, слуга; **лови** — полювання; **убогі** — бідні."], "img": null}, {"type": "defs", "title": "Мстислав Великий (1125 – 1132)", "badges": ["НМТ: персоналія"], "items": [{"name": "Хто він", "paras": ["Старший син Мономаха й Гіти. Майже тридцять років (з перервою) княжив у **Новгороді**.", "Київ дістав **1125 р.** за волею батька, і ніхто з князів цього не заперечив."], "img": null}, {"name": "Як правив", "paras": ["Тримав князів у покорі, як і батько.", "Полоцькі князі відмовилися йти з ним на половців — **1129 р.** він відібрав у них землю, а самих вислав до Візантії.", "Ходив на литву й чудь."], "img": null}, {"name": "Половці", "paras": ["За літописом, загнав половців «за Дон, за Волгу й за Яїк»."], "img": null}, {"name": "Після нього", "paras": ["Помер **1132 р.**", "Невдовзі після його смерті літописець записав: «Роздерлася вся земля Руська». Відтоді Русь складалася з окремих **князівств**."], "img": null}], "note": "Не плутайте: **Мстислав Великий** (син Мономаха, Київ 1125 – 1132) і **Мстислав Хоробрий** (брат Ярослава Мудрого, Чернігів, Листвен 1024)."}, {"type": "defs", "title": "Мономах і Мстислав: останні роки єдності", "badges": [], "items": [{"name": "Сильний Київ", "paras": ["Востаннє вся Русь корилася одному князеві.", "Хто не слухався — втрачав землю."], "img": null}, {"name": "Мономаховичі", "paras": ["Сини й онуки Мономаха сиділи в Новгороді, Смоленську, Переяславі, на Волині, у Ростові й Суздалі."], "img": null}, {"name": "Степ", "paras": ["Половців відігнали за Дон.", "Кілька десятиліть великих набігів не було."], "img": null}, {"name": "Чому ненадовго", "paras": ["Рішення Любеча ніхто не скасовував: кожна гілка роду берегла свою вотчину.", "Єдність трималася на силі двох князів і зникла після їхньої смерті."], "img": null}], "note": null}]}, {"id": "s4", "num": "IV", "title": "Роздробленість Русі-України", "sub": "Причини, устрій і наслідки, князівства на українських землях", "cover": {"key": "princes", "cap": ""}, "cards": [{"type": "defs", "title": "Причини роздробленості", "badges": ["НМТ: поняття"], "items": [{"name": "Господарство", "paras": ["Кожна земля сама забезпечувала себе всім потрібним і мало залежала від Києва.", "У кожній землі зміцніли свої **міста** й розрослися **боярські вотчини**.", "Шлях «із варягів у греки» занепав, і Київ утратив частину доходів."], "img": null}, {"name": "Влада", "paras": ["Країна була завелика, щоб керувати нею з одного міста.", "Точного порядку успадкування столу так і не склалося.", "У Любечі князі самі закріпили землі за окремими гілками роду."], "img": null}, {"name": "Бояри й міста", "paras": ["Місцеві **бояри** хотіли мати князя поруч — такого, що залежав би від них, а не від Києва."], "img": null}, {"name": "Степ", "paras": ["Напади **половців** розоряли південні землі.", "Князі самі наводили кочовиків один на одного."], "img": null}], "note": "**Роздробленість** — розпад єдиної держави на окремі незалежні державні утворення. Роздробленість пережили також Німеччина, Франція, Польща — це загальноєвропейське явище."}, {"type": "defs", "title": "Як було влаштовано Русь у добу роздробленості", "badges": [], "items": [{"name": "Князівства", "paras": ["У XII ст. їх було близько **15**, у XIII ст. — уже близько 50.", "Кожне мало свого князя, столицю й військо."], "img": null}, {"name": "Київ", "paras": ["Лишався **старшим столом**; тут жив митрополит.", "Князь, що здобував Київ, вважався першим серед рівних."], "img": null}, {"name": "З’їзди", "paras": ["Спільні справи князі вирішували **на з’їздах**, як у Любечі чи Витичеві."], "img": null}, {"name": "Віче й бояри", "paras": ["Вплив **віча** й бояр зріс: вони могли запросити князя або вигнати його."], "img": null}], "note": "Історики називають такий устрій **федеративною монархією**, а владу групи найсильніших князів над Руською землею — **колективним сюзеренітетом**."}, {"type": "cols", "title": "Наслідки роздробленості", "badges": [], "intro": "Роздробленість не означала кінця Русі. Князівства мали спільну віру, мову, закон і династію, але єдиної влади над ними вже не було.", "blocks": [{"h": "Що втратили", "paras": ["• Князі воювали між собою, а від цих війн потерпали міста й села.", "• Спільної оборони не стало: кожен боронив лише свою землю. Тому під час монгольської навали князівства боронилися поодинці.", "• **Київ** занепав: 1169 і 1203 рр. його грабували самі руські князі.", "• В усобицях князі кликали на допомогу половців."]}, {"h": "Що здобули", "paras": ["• Зросли **столиці князівств**: Чернігів, Галич, Володимир, Переяслав.", "• У кожному князівстві будували храми, вели літописи, відкривали школи.", "• Ремесло й торгівля розвивалися в багатьох містах, а не в одному Києві.", "• Галицьке й Волинське князівства згодом стали основою нової держави."]}]}, {"type": "map", "title": "Князівства на українських землях (XII ст.)", "steps": [{"key": "p3_princ0", "label": "Князівства"}, {"key": "p3_princ1", "label": "Похід Ігоря, 1185"}]}, {"type": "text", "title": "", "badges": [], "paras": ["На українських землях постало **п’ять князівств**: Київське, Чернігівське, Переяславське, Волинське й Галицьке. Їхні межі показано на картосхемі з програми НМТ.", "На півночі з ними межували Турово-Пінське й Смоленське князівства, на півдні й сході лежав половецький степ.", "__Клацніть__ — і побачите похід новгород-сіверського князя **Ігоря Святославича** на половців **1185 р.**"], "imgs": []}]}, {"id": "s5", "num": "V", "title": "Українські князівства", "sub": "Київське, Чернігівське, Переяславське, Волинське й Галицьке", "cover": {"key": "pantel", "cap": ""}, "cards": [{"type": "text", "kicker": "Князівства", "title": "Київське князівство", "badges": [], "paras": ["Київ і далі вважався **першим містом** Русі: тут жив митрополит, сюди сходилися торгові шляхи. Саме тому князі так запекло воювали за нього.", "Власної династії Київське князівство не мало. Стіл відбирали один в одного **Мономаховичі** й чернігівські **Ольговичі**; за сто років князі змінилися тут понад сорок разів.", "**1169 р.** Київ узяло й пограбувало військо володимиро-суздальського князя **Андрія Боголюбського**, онука Мономаха. Сам Андрій у Києві не лишився, а посадив тут брата: київський стіл перестав бути головною метою князів.", "**1203 р.** місто розорили вдруге — цього разу Рюрик Ростиславич з Ольговичами й половцями.", "Попри це Київ відбудовувався: тут зводили храми й вели **Київський літопис**."], "imgs": [{"key": "kyiv1169", "cap": "Пограбування Києва 1169 р. Радзивіллівський літопис"}]}, {"type": "doc", "title": "Погром Києва 1169 р.", "quote": ["І грабували вони два дні увесь город — Поділля, і Гору, і монастирі, і Софію, і Десятинну Богородицю. І не було помилування нікому і нізвідки: церкви горіли, християн убивали, а других в’язали, жінок вели в полон, силоміць розлучаючи із мужами їхніми. Діти ридали, дивлячись на матерів своїх.", "І взяли вони майна без ліку, і церкви оголили від ікон, і книг, і риз, і дзвони познімали… і всі святині були забрані. Запалений був навіть монастир Печерський…", "І був у Києві серед усіх людей стогін, і туга, і скорбота невтишима, і сльози безперестанні."], "source": "Київський літопис, під 1171 р. (події 1169 р.), переклад Л. Махновця", "comment": ["Нападали не кочовики, а **руські князі** — одинадцять князів, яких послав Андрій Боголюбський. Раніше князі, здобуваючи Київ, не грабували його: місто було для них спільною святинею.", "Після 1169 р. найсильніший із князів уже не прагнув сам сидіти в Києві. Місто лишилося багатим, але перестало бути центром влади.", "__Слова з літопису:__ **Поділля** — Поділ, нижнє місто; **Гора** — верхнє місто; **Десятинна Богородиця** — Десятинна церква; **ризи** — церковне вбрання."], "img": null}, {"type": "text", "kicker": "Князівства", "title": "Чернігівське князівство", "badges": [], "paras": ["Чернігівське князівство простягалося від Дніпра до Оки й було одним із найбільших на Русі. Правили тут **Ольговичі** — нащадки Олега Святославича.", "Усередині воно ділилося на уділи. Другим за значенням містом був **Новгород-Сіверський**; свої князі сиділи також у Путивлі, Курську, Трубчевську.", "Ольговичі постійно змагалися за **Київ**. Із половцями вони то воювали, то родичалися.", "**1185 р.** новгород-сіверський князь **Ігор Святославич** сам, без інших князів, пішов у степ і зазнав поразки на річці **Каялі**. Про цей похід розповідає **«Слово о полку Ігоревім»**.", "У Чернігові збереглися храми того часу — **Борисоглібський собор** і **П’ятницька церква** (частина 4)."], "imgs": [{"key": "igor_vasn", "cap": "В. Васнецов. Після побоїща Ігоря Святославича з половцями (1880). Суспільне надбання"}]}, {"type": "text", "kicker": "Князівства", "title": "Переяславське князівство", "badges": ["НМТ: дата"], "paras": ["Найменше з князівств лежало на самому кордоні зі степом. Воно постійно **оборонялося від половців**: уздовж Сули стояла лінія фортець.", "Власної династії Переяслав не мав. Тут княжили молодші **Мономаховичі**, які сподівалися згодом перейти до Києва.", "Переяслав був центром єпархії. Наприкінці XI ст. єпископ Єфрем звів тут великий Михайлівський собор і кам’яні укріплення.", "Під **1187 р.** Київський літопис, розповідаючи про смерть переяславського князя **Володимира Глібовича**, уперше вжив назву **«Україна»**.", "**1239 р.** Переяслав зруйнували монголи."], "imgs": [{"key": "ukr1187", "cap": "Слово «оукраина» в Іпатіївському списку: під 1187 р. (вгорі) і 1189 р. Суспільне надбання"}]}, {"type": "doc", "title": "1187 р.: перша згадка назви «Україна»", "quote": ["Того ж року ходив Володимир Глібович на половців… І розболівся він, і помер. І плакали по ньому всі переяславці.", "Бо любив він дружину, і золота не збирав, майна не жалів, а давав дружині. Був же він князь доблесний і сильний у бою, і мужністю кріпкою відзначався, і всякими доброчесностями [був] сповнений.", "За ним же Україна багато потужила."], "source": "Київський літопис, під 1187 р. (переклад Л. Махновця)", "comment": ["Це запис про смерть молодого переяславського князя. Він занедужав у поході на половців і помер дорогою додому.", "Словом **«Україна»** літописець називає землю, яка за ним тужила, — Переяславщину, а можливо, і ширше: південні землі Русі. Це **перша писемна згадка** назви; дата **1187 р.** є в програмі НМТ.", "__Слова з літопису:__ **дружина** — княже військо; **доблесний** — хоробрий; **кріпкий** — сильний, стійкий."], "img": null}, {"type": "defs", "title": "Волинське князівство", "badges": [], "items": [{"name": "Земля", "paras": ["Князівство лежало від Західного Бугу до Горині. Головні міста — **Володимир**, Луцьк, Берестя, Дорогичин.", "Через Волинь везли товари до Польщі й Німеччини."], "img": null}, {"name": "Князі", "paras": ["Із середини XII ст. тут закріпилися нащадки **Ізяслава Мстиславича**, онука Мономаха.", "Уже в 1150-х рр. Волинь перестала коритися Києву."], "img": null}, {"name": "Чим вирізнялася", "paras": ["Князі тут були сильніші за бояр — на відміну від сусідньої Галичини.", "Волинь мала тісні зв’язки з Польщею й Угорщиною."], "img": null}, {"name": "Роман Мстиславич", "paras": ["Княжив на Волині з **1170 р.**", "**1199 р.** об’єднав Волинь із Галичиною. Про цю державу — наступна тема."], "img": null}], "note": null}, {"type": "text", "kicker": "Князівства", "title": "Галицьке князівство. Ярослав Осмомисл", "badges": ["НМТ: персоналія"], "paras": ["Галицька земля лежала вздовж Дністра й Сяну. Правили тут **Ростиславичі** — нащадки Володимира, старшого сина Ярослава Мудрого. Князь **Володимирко** об’єднав їхні уділи й **1141 р.** переніс столицю до **Галича**.", "Галичина багатіла завдяки **солі**, яку добували в Прикарпатті, і торгівлі на Дністрі й Дунаї.", "Найбільшої сили князівство досягло за сина Володимирка — **Ярослава Осмомисла** (**1153 – 1187**). Його володіння сягали гирла Дунаю, а з Угорщиною й Польщею він жив у мирі. Прізвисько пояснюють як «восьмиразово мудрий» або «той, хто знав вісім мов».", "Проте приборкати **бояр** Осмомисл не зміг. **1173 р.** вони спалили його кохану Настаску, а самого князя змусили повернутися до дружини."], "imgs": [{"key": "osmo_leb", "cap": "Галицькі бояри розправляються з Настаскою (1173). Гравюра XIX ст."}]}, {"type": "doc", "title": "«Слово о полку Ігоревім» про Ярослава Осмомисла", "quote": ["Галицький Осмомисле Ярославе! Високо сидиш ти на своєму золотокованому престолі.", "Підпер ти Угорські гори своїми залізними полками, заступивши королеві дорогу, зачинивши Дунаю ворота, кидаючи вагу через хмари, суди рядячи до Дунаю.", "Грози твої по землях течуть, відчиняєш Києву ворота, стріляєш з отцівського золотого престолу салтанів за землями."], "source": "«Слово о полку Ігоревім», кінець XII ст. (переклад-переказ)", "comment": ["Автор «Слова» по черзі звертається до наймогутніших князів і кличе їх помститися за Ігоря. Про Осмомисла він говорить із найбільшою пошаною.", "З цих рядків видно, чим був сильний галицький князь: його полки стерегли карпатські перевали від угорців, він контролював торгівлю Дунаєм, а його слово важило й у Києві.", "__Слова зі «Слова»:__ **Угорські гори** — Карпати; **король** — угорський король; **суди рядити** — правити, чинити суд; **салтани** — султани, володарі мусульманського Сходу."], "img": null}, {"type": "table", "title": "Порівняння князівств на українських землях", "rows": [["Князівство", "Столиця", "Династія", "Особливості"], ["Київське", "Київ", "різні: Мономаховичі, Ольговичі", "номінальна столиця Русі; боротьба за стіл; погроми 1169, 1203"], ["Чернігівське", "Чернігів", "Ольговичі", "одне з найбільших; уділи (Новгород-Сіверський); похід Ігоря 1185"], ["Переяславське", "Переяслав", "власної не мало (Мономаховичі)", "форпост проти половців; **1187** — «Україна»"], ["Волинське", "Володимир", "Ізяславичі (Мономаховичі)", "сильна княжа влада; Роман Мстиславич (з 1170)"], ["Галицьке", "Галич (з 1141)", "Ростиславичі", "сіль; сильні бояри; **Ярослав Осмомисл** (1153 – 1187)"]]}]}, {"id": "s6", "num": "VI", "title": "Підсумки", "sub": "Князі, що плутають на НМТ, древо нащадків Ярослава, стрічки часу", "cover": {"key": "hyp104", "cap": ""}, "cards": [{"type": "table", "title": "Київські князі від Ярославичів до Мстислава", "rows": [["Князь", "Роки в Києві", "Головне", "Невдачі й втрати"], ["Ізяслав Ярославич", "1054 – 1078 (з перервами)", "тріумвірат; 1060 — торки; Правда Ярославичів", "1068 — Альта, повстання киян; двічі вигнаний; загинув 1078"], ["Святослав Ярославич", "1073 – 1076", "«Ізборник» 1073 р.; почато Успенський собор", "захопив Київ у брата"], ["Всеволод Ярославич", "1078 – 1093", "знав п’ять мов; опора на сина Мономаха", "міжусобиці з ізгоями, набіги половців"], ["Святополк II", "1093 – 1113", "**1097** — Любеч; 1103, 1111 — походи в степ", "1093 — Стугна; засліплення Василька; лихварство"], ["Володимир Мономах", "**1113** – 1125", "Устав; «Повчання»; єдність Русі; «Повість минулих літ» (1113)", "жорстко карав непокірних"], ["Мстислав Великий", "1125 – 1132", "приборкав Полоцьк; половці за Доном", "після смерті — роздробленість"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "1113 — двічі", "paras": ["**«Повість минулих літ»** — уклав Нестор.", "**Мономах** — київський князь.", "Тоді ж — повстання в Києві."], "img": null}, {"name": "Любеч і Витичів", "paras": ["**1097** — Любеч: «кожен держить отчину свою».", "**1100** — Витичів: покарали Давида."], "img": null}, {"name": "Три Мстислави", "paras": ["Мстислав **Хоробрий** — брат Ярослава.", "Мстислав **Великий** — син Мономаха.", "Роман **Мстиславич** — волинський князь."], "img": null}, {"name": "Хто з ким", "paras": ["**Ізяслав, Святослав, Всеволод** — сини Ярослава.", "**Мономах** — син Всеволода.", "**Осмомисл** — Галич, не Київ."], "img": null}], "note": null}, {"type": "defs", "title": "Нащадки Ярослава Мудрого", "badges": [], "items": [{"name": "Ярослав Мудрий (1019 – 1054)", "paras": ["Сини: Володимир (Новгород, пом. 1052); **Ізяслав** (Київ 1054 – 1078); **Святослав** (Київ 1073 – 1076); **Всеволод** (Київ 1078 – 1093)."], "img": null}, {"name": "Володимир (Новгород, пом. 1052)", "paras": ["Син: Ростислав (Тмутаракань)."], "img": null}, {"name": "Ізяслав (Київ 1054 – 1078)", "paras": ["Син: Святополк II (Київ 1093 – 1113)."], "img": null}, {"name": "Святослав (Київ 1073 – 1076)", "paras": ["Син: Олег «Гориславич» (Чернігів → Ольговичі)."], "img": null}, {"name": "Всеволод (Київ 1078 – 1093)", "paras": ["Син: **Володимир Мономах** (Київ 1113 – 1125)."], "img": null}, {"name": "Ростислав (Тмутаракань)", "paras": ["Нащадок через кілька поколінь: **Ярослав Осмомисл** (Галич 1153 – 1187)."], "img": null}, {"name": "Олег «Гориславич» (Чернігів → Ольговичі)", "paras": ["Нащадок через кілька поколінь: Ігор Святославич (Новгород-Сіверський)."], "img": null}, {"name": "Володимир Мономах (Київ 1113 – 1125)", "paras": ["Син: **Мстислав Великий** (Київ 1125 – 1132)."], "img": null}], "note": "Пунктир — через покоління: Осмомисл — праправнук Володимира Ярославича (Ростислав → Володар → Володимирко → Ярослав); Ігор — онук Олега. Від Мономаха походять волинські й суздальські князі. Жирним виділено персоналії з програми НМТ."}, {"type": "tl_events", "title": "Стрічка часу: від Ярославичів до роздробленості", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "1054", "name": "Смерть Ярослава", "desc": "тріумвірат синів", "color": "#7fd06a", "prog": false}, {"year": "1068", "name": "Альта", "desc": "поразка від половців; повстання в Києві", "color": "#e05a47", "prog": false}, {"year": "1072", "name": "Правда Ярославичів", "desc": "скасовано кровну помсту", "color": "#7fd06a", "prog": false}, {"year": "1097", "name": "Любецький з’їзд", "desc": "«кожен держить отчину свою»", "color": "#8ccf84", "prog": true}, {"year": "1111", "name": "Сальниця", "desc": "похід у степ", "color": "#8ccf84", "prog": false}, {"year": "1113", "name": "Мономах", "desc": "«Повість минулих літ»; повстання в Києві", "color": "#8ccf84", "prog": true}, {"year": "1132", "name": "Смерть Мстислава", "desc": "початок роздробленості", "color": "#a6a6a6", "prog": false}, {"year": "1169", "name": "Погром Києва", "desc": "Андрій Боголюбський", "color": "#a6a6a6", "prog": false}, {"year": "1185", "name": "Похід Ігоря", "desc": "поразка на Каялі", "color": "#c2b280", "prog": false}, {"year": "1187", "name": "«Україна»", "desc": "перша писемна згадка", "color": "#c2b280", "prog": true}]}, {"type": "tl_periods", "title": "Стрічка часу: князювання в Києві", "note": "**1068** — повстання в Києві · **1097** — Любеч · **1132** — смерть Мстислава, початок роздробленості. Ізяслав княжив у Києві тричі.", "x_from": 1050, "x_to": 1140, "ticks": [[1050, "1050"], [1070, "1070"], [1090, "1090"], [1110, "1110"], [1130, "1130"]], "events": [[1068, "1068"], [1097, "1097"], [1132, "1132"]], "prog": [[1097, 1097.6, "1097"], [1113, 1113.6, "1113"]], "rows": [{"name": "Ізяслав", "segs": [{"a": 1054, "b": 1068, "color": "#9c8b7a", "sub": ""}, {"a": 1069, "b": 1073, "color": "#9c8b7a", "sub": ""}, {"a": 1077, "b": 1078, "color": "#9c8b7a", "sub": ""}]}, {"name": "Святослав", "segs": [{"a": 1073, "b": 1076, "color": "#c2b280", "sub": ""}]}, {"name": "Всеволод", "segs": [{"a": 1078, "b": 1093, "color": "#cb934c", "sub": "Всеволод"}]}, {"name": "Святополк II", "segs": [{"a": 1093, "b": 1113, "color": "#a8906f", "sub": "Святополк II"}]}, {"name": "Мономах", "segs": [{"a": 1113, "b": 1125, "color": "#e97132", "sub": "Мономах"}]}, {"name": "Мстислав Великий", "segs": [{"a": 1125, "b": 1132, "color": "#e97132", "sub": ""}]}]}]}]}, {"id": "p4", "num": 4, "title": "Русь-Україна (Київська держава)", "part": "Частина 4. Культура й підсумки теми", "sub": "Книжність, літописи, храми, ікони. Підсумки всієї теми", "cover": {"key": "lavr_codex", "cap": "Сторінка Лаврентіївського списку літопису (1377). Фото: невідомий автор / Wikimedia Commons, Public domain"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Дати й персоналії", "light": false}, {"k": "p", "paras": ["• **1113 р.** — укладення «Повісті минулих літ»", "• **1187 р.** — створення «Слова о полку Ігоревім» (за програмою)", "• **Антоній Печерський, Аліпій, Нестор**; повторити **Іларіона**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **літопис, книжкова мініатюра, ікона**", "• повторити: **мозаїка, фреска, билина**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятки (упізнавати)", "light": false}, {"k": "p", "paras": ["• **Успенський собор** Києво-Печерської лаври", "• **Михайлівський Золотоверхий собор**", "• **П’ятницька церква** в Чернігові", "• ікони: **Вишгородська**, **Свенська**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Книжкові мініатюри", "light": false}, {"k": "p", "paras": ["• **«Євангеліст Лука»** з Остромирового Євангелія (1056 – 1057)", "• **«Родина князя Святослава Ярославича»** з «Ізборника» (1073)", "• Пам’ятки першої половини XI ст. — у частині 2"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ, тема 3. Знати дати створення пам’яток не обов’язково, але вони допомагають розташувати їх у часі."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Книжність і освіта", "sub": "Школи, бібліотеки, берестяні грамоти, рукописні книги й мініатюри", "cover": {"key": "ostr_open", "cap": ""}, "cards": [{"type": "defs", "title": "Освіта в Русі-Україні XI – XIII ст.", "badges": [], "items": [{"name": "Школи", "paras": ["При **церквах і монастирях** дітей навчали читати, писати, рахувати й співати.", "1086 р. сестра Мономаха **Янка** відкрила в Києві, при Андріївському монастирі, школу для дівчат."], "img": null}, {"name": "Бібліотеки", "paras": ["Найбільші книгозбірні були при **Софійському соборі** й у **Печерському монастирі**.", "Книги переписували від руки в **скрипторіях** — майстернях при храмах і монастирях."], "img": null}, {"name": "Хто вмів писати", "paras": ["Писати вміли не лише князі й духовенство: **берестяні грамоти** писали купці, ремісники, жінки, діти.", "На стінах храмів лишилися тисячі **графіті** — видряпаних написів."], "img": null}, {"name": "Книга", "paras": ["Писали на **пергаменті** — тонко вичиненій телячій шкірі. Тому книги були дуже дорогими.", "Сторінки прикрашали **мініатюрами** й **заставками**."], "img": null}], "note": null}, {"type": "carousel", "title": "Як писали в Русі", "badges": [], "note": "**Берестяні грамоти** — листи й записки на корі берези, видряпані гострим писалом. Найбільше їх знайдено в Новгороді, але трапляються вони й у Звенигороді Галицькому, Смоленську, Пскові. Вони доводять, що грамотних людей у Русі було чимало.", "items": [{"key": "beresta", "name": "", "desc": "Берестяна грамота з Новгорода (XII ст.). Фото: невідомий автор / Wikimedia Commons, Public domain", "cap": ""}, {"key": "graffiti", "name": "", "desc": "Графіті на стіні Софійського собору.", "cap": ""}, {"key": "school_min", "name": "", "desc": "Писець за роботою (мініатюра).", "cap": ""}]}, {"type": "monument", "title": "Остромирове Євангеліє (1056 – 1057)", "badges": ["НМТ: пам’ятка"], "img": {"key": "ostr_luke", "cap": "Мініатюра «Євангеліст Лука». Фото: невідомий автор / Wikimedia Commons, Public domain"}, "paras": ["Це **найдавніша** точно датована рукописна книга Русі, що збереглася.", "Диякон **Григорій** переписав її за сім місяців, у 1056 – 1057 рр., для новгородського посадника **Остромира**.", "У книзі три **мініатюри** — євангелісти Іоанн, Лука й Марко — та яскраві заставки й великі літери-ініціали.", "Книга зберігається в Російській національній бібліотеці в Санкт-Петербурзі.", "**Книжкова мініатюра** — невеличкий кольоровий малюнок у старовинному рукописі чи книзі.", "__Як упізнати на НМТ:__ євангеліст за столиком пише книгу, угорі — телець (символ Луки) із сувоєм."]}, {"type": "text", "kicker": "Книжність", "title": "«Ізборник Святослава» 1073 р.", "badges": ["НМТ: пам’ятка"], "paras": ["**«Ізборник»** — збірка уривків із творів візантійських авторів про віру, мораль, граматику, природу. Її можна назвати енциклопедією того часу.", "Слов’янською її переклали в Болгарії для царя Симеона. У Києві **1073 р.** дяк **Іоанн** переписав книгу для князя **Святослава Ярославича**.", "На одній із мініатюр зображено самого князя з дружиною та п’ятьма синами — **«Родина князя Святослава»**. Це найдавніший груповий портрет у книжковій мініатюрі Русі.", "**1076 р.** з’явився ще один «Ізборник» — збірка повчань; для кого його переписали, достеменно невідомо.", "__Як упізнати на НМТ:__ князь у шапці з хутряною облямівкою тримає книгу, поруч — княгиня й сини в ряд."], "imgs": [{"key": "izb_family", "cap": "Мініатюра «Родина князя Святослава Ярославича»."}, {"key": "izb_open", "cap": "«Ізборник» 1073 р., розворот."}]}]}, {"id": "s2", "num": "II", "title": "Література й літописання", "sub": "Печерський монастир, літописи, Нестор, патерик, «Слово о полку Ігоревім»", "cover": {"key": "antoniy_ic", "cap": ""}, "cards": [{"type": "text", "kicker": "Література", "title": "Антоній Печерський і Києво-Печерський монастир", "badges": ["НМТ: персоналія"], "paras": ["Антоній народився в Любечі на Чернігівщині. Молодим він пішов на гору **Афон** у Греції й там став ченцем.", "Повернувшись на Русь, оселився над Дніпром у печері, яку раніше викопав для молитви Іларіон. До нього почали приходити учні, і близько **1051 р.** виник **Києво-Печерський монастир**.", "Сам Антоній ігуменом не став і до кінця життя лишався відлюдником. Монастир очолив Варлаам, а потім **Феодосій**: він переселив ченців із печер у наземні будівлі й запровадив суворий Студитський устав.", "Невдовз

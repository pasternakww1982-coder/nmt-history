<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стародавня історія України</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; overflow: auto; display: grid; place-items: center; -webkit-overflow-scrolling: touch; }
.lb-view img { max-width: 100%; max-height: 100%; }
.lb-view.z { place-items: start; }
.lb-view.z img { max-width: none; max-height: none; }
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }
.tlv .ev { position: relative; padding: 0 0 16px; display: grid; gap: 3px; }
.tlv .ev i { position: absolute; left: -25px; top: 4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--bg); }
.tlv .ev .y { color: var(--acc2); font-weight: 800; font-variant-numeric: tabular-nums; }
.tlv .ev .y.yprog { justify-self: start; background: var(--acc2); color: #161616; border-radius: 8px; padding: 1px 8px; }
.tlv .ev b { font-size: 17px; }
.legend { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.legend span.sw { width: 34px; height: 16px; background: var(--acc2); border-radius: 6px; }
/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }
.gp .tr { position: relative; height: 18px; background: #262626; border-radius: 6px; }
.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }
.part-btn .th img { max-width: 100%; max-height: 100%; }
.part-btn h3 { font-size: 18px; }
.part-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
/* курс: вхід, бліци, тести */
.who { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--panel); border-radius: 12px; padding: 10px 14px; margin: 14px 0 0; font-weight: 700; font-size: 15px; }
.lnk { background: none; border: 0; color: var(--acc2); font: inherit; font-size: 14.5px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }
.login { display: grid; gap: 14px; margin-top: 18px; }
.login label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
.login input { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--panel2); background: var(--bg); color: var(--txt); }
.login input:focus { outline: none; border-color: var(--acc); }
.err { color: var(--bad); font-weight: 700; }
.locked { opacity: .55; }
.shake { animation: shk .4s; } @keyframes shk { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.okc { color: var(--ok); } .badc { color: var(--bad); }
.sync { font-size: 14.5px; color: var(--muted); margin-top: 16px; text-align: center; }
.bz-card .meta { color: var(--muted); font-size: 15px; }
.bz-card .best { background: var(--panel2); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.bz-card .best b { color: var(--acc2); }
.bz-card .btn { margin-top: 4px; }
.bz-in { display: grid; gap: 14px; padding-top: 14px; }
.bz-top { display: flex; align-items: center; gap: 10px; }
.bz-top .cnt { font-weight: 700; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.bz-top .pts { margin-left: auto; background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-weight: 800; color: var(--acc2); font-variant-numeric: tabular-nums; }
.bz-top .x { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; width: 40px; height: 36px; font-size: 17px; cursor: pointer; }
.qtype { font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--acc2); }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.38; }
.pic.qi { border-radius: 12px; overflow: hidden; position: relative; background: #0f0f0f; }
.pic.qi img { width: 100%; height: auto; max-height: 62vh; object-fit: contain; display: block; }
.tiles { display: grid; gap: 10px; }
.tile { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; border: 3px solid transparent; border-radius: 14px; padding: 12px; font: inherit; font-size: 16.5px; font-weight: 600; color: #fff; cursor: pointer; min-height: 58px; }
.tile .l { width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.25); display: grid; place-items: center; font-weight: 800; }
.tile.c0 { background: #b8463a; } .tile.c1 { background: #2f6fa8; } .tile.c2 { background: #b38419; } .tile.c3 { background: #3f8a55; }
.tile.n { background: var(--panel2); }
.tile.sel { border-color: var(--acc2); background: #4a3524; }
.tile[disabled] { cursor: default; }
.tile.dim { opacity: .38; }
.tile.right { border-color: #9ff0b4; opacity: 1; }
.tile.wrong { border-color: #ffb3a6; opacity: 1; }
.tile .ord { width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: #161616; display: grid; place-items: center; font-weight: 800; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile.wi { grid-template-columns: 1fr; padding: 8px; position: relative; align-content: start; }
.tile.wi .l, .tile.wi .ord { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(0,0,0,.65); }
.tile.wi .ord { background: var(--acc); }
.oi { position: relative; display: block; border-radius: 10px; overflow: hidden; background: #0f0f0f; }
.oi img { width: 100%; height: 150px; object-fit: contain; display: block; }
.oi .zoom-hint { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.65); display: grid; place-items: center; font-size: 18px; color: #fff; }
.mlist { background: var(--panel); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-size: 15.5px; }
.mo { display: grid; grid-template-columns: 24px 1fr; gap: 6px; align-items: start; }
.mo .oi img { height: 120px; }
.mrow { display: grid; gap: 6px; }
.ml { font-weight: 600; }
.ml .pic.ri { margin-top: 6px; }
.pic.ri { border-radius: 10px; overflow: hidden; background: #0f0f0f; position: relative; }
.pic.ri img { width: 100%; height: 170px; object-fit: contain; display: block; }
.mbtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mb { background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 10px; height: 44px; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
.mb.on { background: var(--acc); color: #161616; }
.mb.right { border-color: #9ff0b4; }
.mb.wrong { border-color: #ffb3a6; }
.bz-act { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.fb { border-radius: 14px; padding: 14px; display: grid; gap: 6px; }
.fb.good { background: #1f3a27; } .fb.bad { background: #3a231e; } .fb.part { background: #3a311c; }
.fb .h { font-weight: 800; font-size: 18px; }
.res { text-align: center; display: grid; gap: 6px; background: var(--panel); border-radius: 18px; padding: 22px 16px; }
.res .big { font-size: 46px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; line-height: 1.1; }
.res .gr { font-size: 18px; font-weight: 800; }

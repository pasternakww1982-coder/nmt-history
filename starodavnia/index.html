<script>
const LESSONS = [{"id": "p1", "num": 1, "title": "Стародавня історія України", "part": "Частина 1. Кам’яний вік і доба металів", "sub": "Від перших людей на наших землях до раннього залізного віку", "cover": {"key": "mezhyrich", "cap": "Житло з кісток мамонта (реконструкція). Фото: Momotarou2012 / Wikimedia Commons, CC BY-SA 3.0"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• палеоліт, мезоліт, неоліт, енеоліт, бронзовий вік, ранній залізний вік", "• привласнювальне й відтворювальне господарство", "• неолітична революція, археологічна культура", "• __Вступ:__ історія, хронологія, історичне джерело, археологія, цивілізація"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Дата", "light": false}, {"k": "p", "paras": ["• **IV – середина III тис. до н.е.** — розселення племен трипільської та середньостогівської культур"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятки (упізнавати)", "light": false}, {"k": "p", "paras": ["• браслет з **Мізинської** стоянки", "• орнаментована кераміка **трипільської** культури"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Картосхема", "light": false}, {"k": "p", "paras": ["• стоянки **Королеве, Киїк-Коба, Кирилівська, Межиріч, Мізин**", "• території трипільської та середньостогівської культур"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Уміти: визначати риси археологічних періодів, розташовувати їх у хронологічній послідовності, характеризувати види джерел."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Як ми дізнаємося про давнину", "sub": "Історичні джерела, археологія і як читати дати «до нашої ери»", "cover": {"key": "scyth_excav", "cap": ""}, "cards": [{"type": "generic", "title": "Історичні джерела", "badges": ["НМТ: поняття"], "blocks": [{"k": "p", "paras": ["**Історичне джерело** — усе, що створили люди в минулому і що допомагає нам дізнатися, як вони жили. Історики поділяють джерела на кілька видів."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "kammohyla", "cap": "Кам’яна Могила біля Мелітополя — тут збереглися давні наскельні зображення. Фото: Воробйова Алла / Wikimedia Commons, CC BY-SA 4.0"}, {"k": "h", "text": "Речові", "light": false}, {"k": "p", "paras": ["Знаряддя, посуд, прикраси, рештки жител. Для стародавньої історії — майже єдине джерело."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "ipatiev", "cap": "Сторінка Іпатіївського літопису (Хлєбниковський список). Суспільне надбання"}, {"k": "h", "text": "Писемні", "light": false}, {"k": "p", "paras": ["Літописи, грамоти, листи, закони. Перші письмові згадки про наші землі — у грецьких авторів I тис. до н.е."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "veresai", "cap": "Кобзар Остап Вересай, бл. 1880 р. Суспільне надбання"}, {"k": "h", "text": "Усні", "light": false}, {"k": "p", "paras": ["Перекази, легенди, пісні, думи — те, що передавали з уст в уста."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "sophia", "cap": "Інтер’єр Софійського собору в Києві: мозаїки й фрески. Фото: Tim Adams / Wikimedia Commons, CC BY 3.0"}, {"k": "h", "text": "Візуальні", "light": false}, {"k": "p", "paras": ["Малюнки, фрески, мозаїки, згодом — фото й кінохроніка."], "italic": false}]}, {"type": "text", "title": "Хронологія: як читати дати", "badges": ["НМТ: поняття"], "paras": ["**Хронологія** — допоміжна історична дисципліна, яка визначає, коли відбулися події, і розташовує їх у часі.", "Ми рахуємо роки від Різдва Христового. Усе, що було раніше, — **до нашої ери (до н.е.)**, пізніше — **нашої ери (н.е.)**."]}, {"type": "chrono"}, {"type": "text", "title": "Століття й тисячоліття", "paras": ["До н.е. рахунок іде **назад**: III тис. до н.е. — давніше, ніж II тис. до н.е., а 513 р. до н.е. — давніше, ніж 480 р. до н.е.", "Століття = 100 років, тисячоліття = 1000 років. Наприклад, IV тис. до н.е. — це 4000–3001 рр. до н.е., а «середина III тис.» — приблизно 2500 р. до н.е.", "Один із поширених варіантів періодизації історії України: **стародавня**, **середньовічна** (княжа доба), **литовсько-польська**, **козацька**, **нова** й **новітня** історія."], "tip": ["__Порада для НМТ:__ коли порівнюєте дві дати «до н.е.», більше число означає давнішу подію.", "Нульового року немає: після 1 р. до н.е. одразу настає 1 р. н.е."]}, {"type": "text", "kicker": "Вступ", "title": "Археологія — головне джерело знань про давнину", "badges": ["НМТ: поняття"], "paras": ["Писемних джерел про найдавніше минуле наших земель немає: люди тоді ще не вміли писати. Тому головні свідки тієї доби — **речові (археологічні) джерела**.", "**Археологія** — наука, що вивчає минуле людства за речовими пам’ятками: знаряддями праці, посудом, прикрасами, рештками жител і поховань.", "Археолог працює як слідчий: за розташуванням знахідок у землі, за їхнім матеріалом і формою він визначає, коли жили люди, чим займалися й у що вірили."], "imgs": [{"key": "excav", "cap": "Розкопки на Полтавщині. Фото: Badiamand / Wikimedia Commons, CC BY 4.0"}]}, {"type": "carousel", "title": "Як працюють археологи", "badges": [], "note": null, "items": [{"key": "s03_11", "name": "", "desc": "1. Розкопки: шар за шаром знімають ґрунт", "cap": ""}, {"key": "s03_12", "name": "", "desc": "2. Розчистка: знахідки звільняють від землі, фотографують і замальовують", "cap": ""}, {"key": "s03_14", "name": "", "desc": "3. Опис: кожну знахідку заносять до польового щоденника", "cap": ""}, {"key": "s03_13", "name": "", "desc": "4. Наукова обробка й публікація: креслення знахідок", "cap": ""}]}, {"type": "defs", "title": "Види археологічних пам’яток: де жили", "badges": [], "items": [{"name": "Стоянка", "paras": ["Тимчасове місце перебування мисливців і збирачів палеоліту та мезоліту. Люди зупинялися тут на сезон або кілька років, а потім ішли далі."], "img": {"key": "s05_1026", "cap": "Макет розкопок Кирилівської стоянки в Києві (кін. XIX ст.), Національний музей історії України"}}, {"name": "Поселення", "paras": ["Місце, де люди жили постійно або довго: з житлами, господарськими ямами, іноді з укріпленнями. Поселення з’являються, коли люди переходять до землеробства."], "img": {"key": "s06_6", "cap": "Так сьогодні виглядає місце давнього поселення (фото автора презентації)"}}], "note": null}, {"type": "defs", "title": "Види археологічних пам’яток: поховання й укріплення", "badges": [], "items": [{"name": "Могильник", "paras": ["Група давніх поховань — давнє кладовище. Речі, покладені в могилу, розповідають про вірування й багатство людей."], "img": {"key": "s08_19465", "cap": "Розкопане поховання; цифрами позначено знахідки"}}, {"name": "Курган", "paras": ["Поховання, над яким насипали земляний (рідше кам’яний) пагорб. Кургани й досі видно в українському степу."], "img": {"key": "kurhan_paint", "cap": "Л. Вичулковський «Курган в Україні», 1894. Фото: Silar / Wikimedia Commons, CC BY-SA 4.0"}}, {"name": "Давні укріплення", "paras": ["Вали, рови, стіни, якими люди захищали свої поселення від ворогів."], "img": {"key": "zmiievi", "cap": "Змієві вали біля с. Іваньковичі на Київщині. Фото: Kiyanka / Wikimedia Commons, CC BY-SA 4.0"}}], "note": null}, {"type": "text", "kicker": "Вступ", "title": "Від решток у землі до реконструкції", "badges": [], "paras": ["Від давнього житла зазвичай лишаються тільки заглиблення в ґрунті, рештки печі та обгорілі шматки глини.", "Археологи ретельно вимірюють усе знайдене, складають план поселення, порівнюють його з іншими пам’ятками. Іноді на допомогу приходить геомагнітна зйомка: прилад «бачить» залишки будівель під землею без розкопок.", "На основі цих даних художники й архітектори створюють **реконструкції** — малюнки, макети чи навіть відтворені будинки в натуральну величину."], "imgs": [{"key": "s11_9", "cap": "Розкопане житло: видно котлован і рештки печі"}, {"key": "s12_4", "cap": "Геомагнітний план трипільського поселення Майданецьке"}, {"key": "maid_house_c", "cap": "Реконструкція великого будинку з Майданецького. Фото: Kenny Arne Lang Antonsen / Wikimedia Commons, CC BY-SA 4.0"}]}]}, {"id": "s2", "num": "II", "title": "Кам’яний вік", "sub": "Палеоліт і мезоліт: перші люди на наших землях, мисливці на мамонтів, винайдення лука", "cover": {"key": "mammoth", "cap": ""}, "cards": [{"type": "periods", "title": "Археологічна періодизація", "badges": ["НМТ: поняття"], "intro": "Періоди названо за тим, **з якого матеріалу** люди робили знаряддя. Межі приблизні: у підручниках вони трохи різняться.", "rows": [["Палеоліт", "давній кам’яний вік", "бл. 1 млн – 10 тис. р. до н.е.", "камінь, кістка, дерево", "вогонь, житла з кісток мамонта", "#9c8b7a"], ["Мезоліт", "середній кам’яний вік", "X – VII тис. до н.е.", "мікроліти", "лук і стріли, собака, човни", "#c09659"], ["Неоліт", "новий кам’яний вік", "VII – V тис. до н.е.", "шліфований і свердлений камінь", "землеробство, скотарство, кераміка", "#cb934c"], ["Енеоліт", "мідно-кам’яний вік", "IV – середина III тис. до н.е.", "мідь і камінь", "рало, трипільці, середньостогівці", "#d88b3e"], ["Бронзовий вік", "", "середина III – початок I тис. до н.е.", "бронза", "колесо, вози, приручення коня, нерівність", "#e07f36"], ["Ранній залізний вік", "", "з початку I тис. до н.е.", "залізо", "ремесло, торгівля, кочовики", "#e97132"]]}, {"type": "text", "kicker": "Кам’яний вік", "title": "Ранній палеоліт (бл. 1 млн – 150 тис. р. до н.е.)", "badges": ["НМТ: карта"], "paras": ["Перші люди прийшли на територію України **приблизно 1 млн років тому** — найімовірніше, з Передньої Азії через Кавказ або Балкани.", "Це були **архантропи** — люди прямоходячі (у деяких підручниках — «людина вміла»). Вони жили невеликими групами — **первісним стадом**, збирали рослини, полювали, користувалися грубими знаряддями: **ручним рубилом**, чопером, загостреною палицею.", "Вогонь уже знали, але добувати його ще не вміли — підтримували той, що лишився від блискавки чи пожежі.", "Найдавніша відома стоянка в Україні — **Королеве** на Закарпатті."], "imgs": [{"key": "erectus", "cap": "Людина прямоходяча (реконструкція). Фото: Werner Ustorf / Wikimedia Commons, CC BY-SA 2.0"}, {"key": "biface", "cap": "Ручне рубило із Сент-Ашеля (Франція): оббите з обох боків. Фото: Didier Descouens / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "map", "steps": [{"key": "paleo1", "label": "Крок 1"}]}, {"type": "text", "kicker": "Кам’яний вік", "title": "Середній палеоліт (150 – 40 тис. р. до н.е.)", "badges": ["НМТ: карта"], "paras": ["Клімат різко похолоднішав: з півночі насувався льодовик. Вижити допомагали печери, одяг зі шкур і вогонь.", "У цей час на наших землях жили **неандертальці**. Вони вже вміли самі добувати вогонь, виготовляли досконаліші знаряддя — **гострокінечники** й **скребла**, — полювали гуртом на великих тварин.", "Неандертальці вперше почали ховати померлих — отже, у них з’явилися уявлення про потойбічне життя.", "Відома стоянка — печера **Киїк-Коба** в Криму, де знайдено поховання неандертальця."], "imgs": [{"key": "neander", "cap": "Неандерталець (реконструкція). Фото: Werner Ustorf / Wikimedia Commons, CC BY-SA 2.0"}, {"key": "kiikkoba", "cap": "Печера Киїк-Коба в Криму. Фото: Тедди беар / Wikimedia Commons, CC BY-SA 3.0"}, {"key": "s16_7", "cap": "Гострокінечник — знаряддя неандертальців"}]}, {"type": "map", "steps": [{"key": "paleo2", "label": "Крок 1"}]}, {"type": "text", "kicker": "Кам’яний вік", "title": "Пізній палеоліт (40 – 10 тис. р. до н.е.)", "badges": ["НМТ: карта"], "paras": ["З’являється людина сучасного типу — **кроманьйонець** (Homo sapiens, «людина розумна»).", "Люди об’єднуються в **родові общини** (кілька десятків осіб): родичі живуть і працюють разом, спорідненість ведуть по матері — тому це **материнський рід**.", "Головне заняття — полювання на мамонтів, бізонів, північних оленів. Із кісток і бивнів мамонта будували житла, різали прикраси й фігурки.", "Відомі стоянки: **Мізин** (Чернігівщина), **Межиріч** (Черкащина), **Кирилівська** (у Києві)."], "imgs": [{"key": "sapiens", "cap": "Кроманьйонець (реконструкція). Фото: Daniela Hitzemann / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "s18_5", "cap": "Житло з кісток мамонта з Межиріча (реконструкція в музеї)"}]}, {"type": "map", "steps": [{"key": "paleo3", "label": "Крок 1"}]}, {"type": "generic", "title": "Браслет з Мізинської стоянки", "badges": ["НМТ: пам’ятка"], "blocks": [{"k": "img", "key": "s19_14", "cap": "Браслет з бивня мамонта, Мізинська стоянка (пізній палеоліт)"}, {"k": "sep"}, {"k": "p", "paras": ["Браслет знайшли на **Мізинській стоянці** на Чернігівщині. Йому близько **20 тисяч років** — це пізній палеоліт.", "Його вирізали з тонкої пластини **бивня мамонта** і вкрили візерунком з ламаних ліній — **меандром**. Це один із найдавніших відомих у світі меандрових орнаментів.", "__Як упізнати на НМТ:__ вигнута пластина кольору слонової кістки, густо вкрита «лабіринтом» із зигзагів і ромбів."], "italic": false}]}, {"type": "carousel", "title": "Знаряддя раннього й середнього палеоліту", "badges": [], "note": null, "credits": "чопер — J.-M. Benito Álvarez, CC BY-SA 2.5; скребла — Gary Todd, CC0 (Wikimedia Commons); рубило — з авторської презентації", "items": [{"key": "chopper", "name": "Чопер", "desc": "Ранній палеоліт. Гальку оббивали з одного боку — виходив гострий край. Ним рубали, розбивали кістки.", "cap": ""}, {"key": "s14_7", "name": "Ручне рубило", "desc": "Ранній палеоліт. Камінь оббивали з обох боків. Рубилом різали, рубали, копали — це «універсальний ніж».", "cap": ""}, {"key": "scrapers", "name": "Скребла й гострокінечники", "desc": "Середній палеоліт. Скреблом чистили шкури, гострокінечником різали й кололи; його кріпили й до списа.", "cap": ""}]}, {"type": "carousel", "title": "Знаряддя пізнього палеоліту", "badges": [], "note": "Що змінюється: знарядь стає більше, вони дрібніші й точніші. З’являються вироби з кістки й рогу, а головне — знаряддя для виготовлення інших знарядь.", "credits": "різець і голки — Didier Descouens, CC BY-SA 4.0; списокидалка — Музей національної археології (Франція), суспільне надбання (Wikimedia Commons)", "items": [{"key": "burin", "name": "Різець", "desc": "Кремінна пластина з міцним гострим кутом. Різцем обробляли кістку, ріг і бивень мамонта.", "cap": ""}, {"key": "needle", "name": "Кістяні голки", "desc": "Мають вушко, як сучасні. Ними шили одяг зі шкур — без нього в льодовикову добу не вижити.", "cap": ""}, {"key": "thrower", "name": "Списокидалка", "desc": "Дощечка-важіль, що подовжувала кидок списа. Цю вирізали з рогу й прикрасили фігуркою мамонта.", "cap": ""}]}, {"type": "text", "kicker": "Кам’яний вік", "title": "Мезоліт (X – VII тис. до н.е.)", "badges": [], "paras": ["Льодовик відступив, клімат потеплішав. Мамонти вимерли, тож люди почали полювати на менших і швидших тварин — оленів, кабанів, птахів — і більше рибалити.", "Для такого полювання винайшли **лук і стріли**. Поширилися **мікроліти** — дрібні кремінні пластинки, які вставляли в дерев’яну чи кістяну основу.", "Люди **приручили собаку**, почали робити **човни й плоти**.", "Громади поступово розросталися: кілька родів, що мали спільну мову й територію, утворювали **плем’я**."], "imgs": [{"key": "gather2", "cap": "Рибалки мезоліту з плотом (діорама музею). Фото: Dosseman / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "s20_7", "cap": "Наскельний малюнок мисливця з луком"}]}, {"type": "carousel", "title": "Знаряддя мезоліту", "badges": [], "note": null, "credits": "мікроліти — West Yorkshire AAS, CC BY-SA 4.0; наконечники й гарпуни (Урал) — «Лапоть», CC0; наконечники зі Стар-Карр (Англія) — Jonathan Cardy, CC BY-SA 3.0 (Wikimedia Commons)", "items": [{"key": "microliths", "name": "Мікроліти", "desc": "Кремінні пластинки завдовжки 1–3 см. Їх вставляли рядком у дерев’яну чи кістяну основу — виходив ніж, серп або наконечник.", "cap": ""}, {"key": "harp2", "name": "Наконечники стріл і гарпуни", "desc": "Вирізані з кістки. Стріла з лука летіла далі й точніше за спис — можна було вполювати птаха чи швидкого звіра.", "cap": ""}, {"key": "starcarr", "name": "Зазубрені наконечники", "desc": "Зубці не давали вістрю вислизнути зі здобичі. Такими списами й гарпунами били рибу та звіра.", "cap": ""}]}, {"type": "map", "steps": [{"key": "paleo4", "label": "Крок 1"}]}]}, {"id": "s3", "num": "III", "title": "Від привласнення до відтворення", "sub": "Як люди перейшли від мисливства й збиральництва до землеробства і скотарства", "cover": {"key": "gather", "cap": ""}, "cards": [{"type": "text", "kicker": "Господарство", "title": "Привласнювальне господарство", "badges": ["НМТ: поняття"], "paras": ["**Привласнювальне господарство** — форма господарювання, за якої людина бере все потрібне для життя **в природі в готовому вигляді**.", "До нього належать **збиральництво** (плоди, коріння, ягоди, гриби), **мисливство** й **рибальство**.", "Люди цілком залежали від природи: коли звір ішов геть або риби ставало мало, доводилося шукати нові місця. Тому постійного житла вони не мали.", "Привласнювальне господарство панувало весь палеоліт і мезоліт."], "imgs": [{"key": "s22_1028", "cap": "Полювання на мамонта (гравюра)"}, {"key": "s22_6", "cap": "Рибалки кам’яного віку (малюнок)"}]}, {"type": "text", "kicker": "Господарство", "title": "Відтворювальне господарство", "badges": ["НМТ: поняття"], "paras": ["**Відтворювальне (продуктивне) господарство** — форма господарювання, за якої людина **сама виробляє** все необхідне для життя.", "Його основа — **землеробство** (вирощування рослин) і **скотарство** (розведення свійських тварин). До них згодом додається **ремесло**.", "Людина перестала залежати лише від того, що дасть природа: зерно можна зберегти до весни, а худоба — це «живий запас» м’яса й молока.", "Щоб доглядати поле, треба жити поруч із ним. Так люди переходять до **осілого способу життя**."], "imgs": [{"key": "s23_2054", "cap": "Землеробство (малюнок)"}, {"key": "s23_2058", "cap": "Кочове скотарство в степу (сучасне фото)"}]}, {"type": "text", "kicker": "Господарство", "title": "Неоліт (VII – V тис. до н.е.) і неолітична революція", "badges": ["НМТ: поняття"], "paras": ["У неоліті сталися зміни, які називають **неолітичною революцією** — це **перехід від привласнювального до відтворювального господарства**.", "Що змінилося:", "• люди приручили більшість свійських тварин — биків, свиней, кіз, овець — і почали вирощувати пшеницю, ячмінь, просо; землю обробляли мотикою;", "• перейшли до **осілого** життя, з’явилися постійні поселення;", "• навчилися **шліфувати, свердлити й пиляти** камінь, ліпити й випалювати глиняний посуд (**кераміку**), прясти й ткати;", "• населення почало швидко зростати."], "imgs": [{"key": "s27_13", "cap": "Життя неолітичного поселення (художня реконструкція)"}, {"key": "s27_9", "cap": "Неолітичні знахідки: посуд, наконечники, прикраси"}, {"key": "s27_5", "cap": "Прядіння й ткацтво (сучасна реконструкція)"}]}, {"type": "carousel", "title": "Знаряддя неоліту: нова обробка каменю", "badges": [], "note": null, "credits": "шліфована сокира — Birmingham Museums Trust, CC BY-SA 2.0; мотика й тесло (Гданськ) — Pleple2000, CC BY 3.0 (Wikimedia Commons); свердлена сокира — з авторської презентації", "items": [{"key": "axeh", "name": "Шліфована сокира", "desc": "Камінь не лише оббивали, а й шліфували піском. Гладке лезо краще рубало дерево — для хат і човнів.", "cap": ""}, {"key": "s27_7", "name": "Свердлена сокира", "desc": "Отвір свердлили порожнистою кісткою з піском. У нього вставляли руків’я — сокира трималася міцно.", "cap": ""}, {"key": "hoe", "name": "Мотика й тесло", "desc": "Кам’яною мотикою (вгорі) розпушували землю під посів. Тесло з рогу (внизу) — для обробки дерева.", "cap": ""}]}, {"type": "carousel", "title": "Знаряддя неоліту: врожай і тканина", "badges": [], "note": "Знахідки з різних країн, але в неоліті України знаряддя були такі самі за формою й призначенням.", "credits": "зернотерка (Корея), прясла й грузила (Китай) — Gary Todd, CC0 (Wikimedia Commons); серп — з авторської презентації", "items": [{"key": "s27_11", "name": "Серп", "desc": "У вигнуту основу з рогу чи дерева вставляли гострі кремінні пластинки. Серпом жали колосся.", "cap": ""}, {"key": "quern", "name": "Зернотерка", "desc": "Зерно насипали на плаский камінь і розтирали меншим каменем на борошно.", "cap": ""}, {"key": "whorl", "name": "Прясла й грузила", "desc": "Прясло — тягарець на веретено, щоб крутилося рівно, коли прядуть нитку. Грузила — для рибальських сіток.", "cap": ""}]}, {"type": "defs", "title": "Форми землеробства", "badges": ["поза програмою"], "items": [{"name": "Перелогове", "paras": ["Одне поле засівають кілька років поспіль, поки воно родить.", "Коли земля виснажиться, переходять на нове."], "img": null}, {"name": "Підсічно-вогневе", "paras": ["Вирубують і спалюють ділянку лісу, кілька років сіють на удобреному попелом полі.", "Потім вирубують нову ділянку."], "img": null}, {"name": "Двопільне", "paras": ["Землю ділять на дві частини й обробляють їх по черзі через рік.", "Земля відпочиває, але половина її щороку не дає врожаю."], "img": null}, {"name": "Трипільне", "paras": ["Три ділянки: дві засівають, третя відпочиває; щороку їх міняють.", "Без урожаю лишається лише третина землі — це вигідніше."], "img": null}], "note": "Що менше землі простоює, то більше людей вона годує. Перелог і підсіка потребують багато вільної землі, тому поширені там, де людей мало."}, {"type": "defs", "title": "Форми скотарства", "badges": ["поза програмою"], "items": [{"name": "Кочове", "paras": ["Скотарі весь час переходять зі стадами з місця на місце.", "Зупиняються, доки худоба не з’їсть траву."], "img": null}, {"name": "Напівкочове", "paras": ["Навесні виганяють худобу в степ, восени повертаються на зимівник.", "На зимівнику постійно живе частина людей."], "img": null}, {"name": "Відгінне", "paras": ["Худобу сезонно переганяють із зимових пасовищ на літні й назад.", "Досі поширене в українських Карпатах (полонини)."], "img": null}, {"name": "Присадибне", "paras": ["Кілька корів, свиней, курей біля хати — для м’яса й молока.", "Звичне й для сучасного українського села."], "img": null}], "note": "Форму скотарства підказує природа: у степу худобу переганяють за травою, в горах — на полонини, а в лісостепу тримають біля дому."}]}, {"id": "s4", "num": "IV", "title": "Доба металів", "sub": "Енеоліт, трипільська й середньостогівська культури, бронзовий і ранній залізний вік", "cover": {"key": "tryp_vessels2", "cap": ""}, "cards": [{"type": "text", "title": "Енеоліт (IV – середина III тис. до н.е.)", "badges": ["НМТ: поняття"], "paras": ["**Енеоліт** (мідно-кам’яний вік) — перехідна доба від каменю до металу. Люди освоюють перший метал — **мідь**, але мідні знаряддя ще рідкісні, тож переважають кам’яні.", "Землероби переходять від мотики до **рала**, у яке запрягають биків. Урожаї зростають.", "Відбувається **перший великий суспільний поділ праці**: одні племена зосереджуються на землеробстві, інші — на скотарстві.", "У лісостепу України живуть землероби **трипільської культури**, у степу — скотарі **середньостогівської**."], "scheme": {"h": "Перший суспільний поділ праці", "top": "Давні громади: і сіють, і пасуть", "left": ["Землероби", "лісостеп, трипільці"], "right": ["Скотарі", "степ, середньостогівці"], "note": "Вони обмінюються: зерно — на худобу, шкури, шерсть."}}, {"type": "carousel", "title": "Знаряддя енеоліту", "badges": [], "note": null, "credits": "сокири-молоти (Румунія) — Cristian Chirita, CC BY-SA 3.0; мідна сокира (Чехія) — Zde, CC BY-SA 4.0; сокира Етці — Bullenwächter, CC BY 3.0; рало — Wolfgang Sauber, CC BY-SA 3.0 (Wikimedia Commons)", "items": [{"key": "cuaxe2", "name": "Мідні сокири-молоти", "desc": "Знайдені на поселеннях культури Кукутень–Трипілля. Мідь м’яка, тому такі речі були рідкісні й дорогі.", "cap": ""}, {"key": "cuaxe", "name": "Мідна сокира", "desc": "Пласке лезо без отвору: його вставляли в розщеплене дерев’яне руків’я й прив’язували.", "cap": ""}, {"key": "otzi", "name": "Сокира з руків’ям", "desc": "Так кріпили мідне лезо. Реконструкція сокири «крижаної людини» Етці (бл. 3300 р. до н.е.).", "cap": ""}, {"key": "ard1", "name": "Рало", "desc": "Дерев’яний гак, який тягли бики. Рало не перевертало землю, а лише проводило борозну (реконструкція).", "cap": ""}]}, {"type": "generic", "title": "Археологічна культура", "badges": ["НМТ: поняття"], "blocks": [{"k": "p", "paras": ["**Археологічна культура** — сукупність археологічних пам’яток однієї доби, що поширені на певній території й мають спільні риси: схожий посуд, житла, знаряддя, поховальний обряд."], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Звідки назва?", "light": false}, {"k": "p", "paras": ["Культуру зазвичай називають за місцем, де її пам’ятки знайшли вперше. Трипільська — за селом **Трипілля** на Київщині, де їх досліджував **Вікентій Хвойка** наприкінці XIX ст. Середньостогівська — за урочищем **Середній Стіг** на Дніпрі (нині в межах Запоріжжя)."], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Чому «культура», а не «народ»?", "light": false}, {"k": "p", "paras": ["Археологи бачать речі, але не чують мови. Тому вони не можуть точно сказати, як називали себе ці люди і якою мовою говорили. Отже, археологічна культура — це спільнота за знахідками, а не народ."], "italic": false}]}, {"type": "map", "steps": [{"key": "eneo_tryp", "label": "Трипільська"}, {"key": "eneo_both", "label": "Обидві культури"}]}, {"type": "text", "kicker": "Доба металів", "title": "Трипільська культура (IV – середина III тис. до н.е.)", "badges": ["НМТ: дата"], "paras": ["Трипільці жили в **лісостепу** від Дніпра до Карпат. Головне заняття — **орне землеробство**, другорядне — скотарство.", "Вони будували великі, часом двоповерхові глинобитні будинки й **поселення-гіганти (протоміста)**: у Майданецькому, Тальянках, Небелівці жили тисячі людей.", "Трипільці робили чудовий **розписний посуд**, глиняні жіночі фігурки — це пов’язують із **культом родючості**. Спорідненість, імовірно, вели по матері.", "Цікава загадка: раз на кілька десятиліть трипільці спалювали свої поселення й будували нові поруч."], "imgs": [{"key": "maid_site_c", "cap": "Поселення-гігант Майданецьке (реконструкція). Фото: Kenny Arne Lang Antonsen / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "tryp_interior", "cap": "Інтер’єр трипільського будинку (реконструкція). Фото: Cristian Chirita / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "map", "steps": [{"key": "eneo_tryp", "label": "Крок 1"}]}, {"type": "carousel", "title": "Орнаментована кераміка трипільської культури", "badges": ["НМТ: пам’ятка"], "note": "__Як упізнати на НМТ:__ посуд розписаний **спіралями**, хвилями, колами — чорною, білою й червоною фарбою; є миски, глеки й незвичні «біноклеподібні» посудини.", "items": [{"key": "tryp_vessels1", "name": "", "desc": "Трипільський посуд з Поділля. Фото: Silar / Wikimedia Commons, CC BY-SA 4.0", "cap": ""}, {"key": "tryp_jars", "name": "", "desc": "Розписні глеки, Новий музей, Берлін. Фото: Ismoon / Wikimedia Commons, CC BY-SA 4.0", "cap": ""}, {"key": "s33_9", "name": "", "desc": "Миски й посуд з розписом", "cap": ""}]}, {"type": "carousel", "title": "Трипільці в знахідках", "badges": [], "note": null, "items": [{"key": "s33_11", "name": "", "desc": "Глиняні жіночі фігурки — культ родючості", "cap": ""}, {"key": "sushkivka", "name": "", "desc": "«Мадонна з дитям» із Сушківки. Фото: Volodymyr D-k / Wikimedia Commons, CC BY-SA 4.0", "cap": ""}, {"key": "s33_13", "name": "", "desc": "Глиняна модель житла", "cap": ""}, {"key": "s33_7", "name": "", "desc": "Фігурка бика", "cap": ""}, {"key": "s33_15", "name": "", "desc": "Скарб мідних прикрас і уламків посуду", "cap": ""}, {"key": "tryp_figs", "name": "", "desc": "Фігурки, Нац. музей історії Молдови. Фото: Cristian Chirita / Wikimedia Commons, CC BY-SA 3.0", "cap": ""}]}, {"type": "generic", "title": "Середньостогівська культура (IV – середина III тис. до н.е.)", "badges": ["НМТ: дата", "НМТ: карта"], "blocks": [{"k": "p", "paras": ["Носії середньостогівської культури жили в **степу** між Дніпром і Доном. Головне заняття — **скотарство**: розводили биків, овець і коней.", "На поселенні **Деріївка** (Кіровоградщина) знайдено багато кісток коней — це **найдавніші сліди використання коня** на наших землях. Чи були ці коні вже свійськими, вчені сперечаються. У тестах ЗНО/НМТ приручення коня відносять до **доби бронзи**.", "Скотарі були рухливішими за трипільців: жили в менших поселеннях, ховали померлих у ґрунтових могилах, іноді під невеликими насипами.", "Саме зі степовими скотарями багато вчених пов’язують походження й розселення **індоєвропейців**."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "horse", "cap": "Череп коня з Деріївки, Нац. музей історії України. Фото: O.Mustafin / Wikimedia Commons, CC0"}, {"k": "h", "text": "Сусіди, але різні", "light": false}, {"k": "p", "paras": ["• **Трипільці** — лісостеп, землероби, великі поселення.", "• **Середньостогівці** — степ, скотарі, невеликі рухливі громади.", "• Обидві культури існували одночасно й обмінювалися між собою."], "italic": false}]}, {"type": "map", "steps": [{"key": "eneo_stog", "label": "Крок 1"}]}, {"type": "text", "kicker": "Доба металів", "title": "Бронзовий вік (середина III – початок I тис. до н.е.)", "badges": [], "paras": ["Люди навчилися виплавляти **бронзу** — сплав міді й олова. Це перший сплав, який створила людина; він міцніший за мідь.", "Мідь і олово трапляються рідко, тому між племенами пожвавлюється **обмін**.", "Остаточно розходяться землеробство (у лісостепу) і пастуше скотарство (у степу). Винайдено **колесо** — з’являються вози. Людина **приручила коня**.", "Виникає **майнова нерівність**: одні родини багатшають, інші ні. Замість великого роду головною стає **парна сім’я**, а провідна роль переходить до чоловіків (**патріархат**)."], "imgs": [{"key": "s37_15", "cap": "Суцільне дерев’яне колесо воза"}, {"key": "s37_7", "cap": "Розкопки кам’яної конструкції під курганом"}]}, {"type": "carousel", "title": "Знаряддя бронзового віку", "badges": [], "note": null, "credits": "кельти (Румунія) — Codrin.B, CC BY-SA 3.0; ливарна форма (Гонконг) — Gary Todd, CC0; меч (Прага) — Zde, CC BY-SA 4.0 (Wikimedia Commons); скарб — з авторської презентації", "items": [{"key": "s37_11", "name": "Скарб бронзових виробів", "desc": "Серпи, наконечники списів, сокири, прикраси. Бронзу переплавляли, тому зламану річ не викидали.", "cap": ""}, {"key": "celts", "name": "Кельти", "desc": "Бронзові сокири з порожнистою втулкою: у неї вставляли колінчасте дерев’яне руків’я.", "cap": ""}, {"key": "mould", "name": "Ливарна форма", "desc": "Кам’яна форма з двох половинок. У неї заливали розплавлену бронзу — так робили багато однакових сокир.", "cap": ""}, {"key": "bsword", "name": "Бронзовий меч", "desc": "Перша зброя лише для бою. З’являються воїни й вожді.", "cap": ""}]}, {"type": "map", "title": "Індоєвропейці", "cap": "Карта з англомовного атласу; написи перекладено українською. До індоєвропейців належать і предки слов’ян.", "steps": [{"key": "ie_ua", "label": ""}]}, {"type": "text", "kicker": "Доба металів", "title": "Ранній залізний вік (з початку I тис. до н.е.)", "badges": [], "paras": ["Люди навчилися видобувати **залізо** з болотної руди. Його плавили в невеликих глиняних **сиродутних горнах**.", "Залізні сокири, серпи, мечі виявилися міцнішими й дешевшими за бронзові. Продуктивність праці різко зросла: людина виробляла більше, ніж споживала сама.", "Відбувся **другий суспільний поділ праці** — **ремесло** відокремилося від землеробства й скотарства. З’явилося виробництво речей на обмін і продаж, торгівля вийшла за межі одного племені.", "Майнова нерівність поглиблюється — це шлях до появи перших держав. На наших землях у цю добу з’являються **кочовики** (кіммерійці, скіфи) — про них у частині 2."], "imgs": [{"key": "bloom2", "cap": "Макет сиродутного горна (часи Русі), Рибінський музей. Фото: Nikolay Omonov / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "daggers", "cap": "Залізні кинджали степових кочовиків VIII–V ст. до н.е. Фото: Ktrinko, VoidWanderer, O. Nabrovenkov / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "carousel", "title": "Знаряддя раннього залізного віку", "badges": [], "note": null, "credits": "знаряддя (Рибінський музей) — «Лапоть», CC0; серп і ніж (Корея) — Gary Todd, CC BY-SA 4.0; сокира (Уельс) — Rept0n1x, CC BY-SA 3.0; акінак (Польща) — Silar, CC BY-SA 4.0 (Wikimedia Commons)", "items": [{"key": "irontools_c", "name": "Залізні серп і ножі", "desc": "Залізні речі стали буденними: руда є майже всюди, тож їх міг мати кожен господар.", "cap": ""}, {"key": "isickle", "name": "Серп і ніж", "desc": "Залізний серп гостріший і міцніший за кремінний чи бронзовий — жати ним легше.", "cap": ""}, {"key": "iaxe", "name": "Залізна сокира", "desc": "Нею розчищали ліс під поле. Із залізним наральником і сокирою орної землі стало значно більше.", "cap": ""}, {"key": "akinak", "name": "Акінак", "desc": "Короткий залізний меч скіфів — степових кочовиків (про них у частині 2).", "cap": ""}]}, {"type": "generic", "title": "Як змінювалося об’єднання людей", "badges": ["поза програмою"], "blocks": [{"k": "muted", "paras": ["Чим складнішим ставало господарство, тим більшими й краще організованими ставали людські спільноти."]}, {"k": "h", "text": "Первісне стадо", "light": false}, {"k": "date", "text": "ранній і середній палеоліт"}, {"k": "p", "paras": ["невелика група людей, що разом добуває їжу й захищається"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Родова община", "light": false}, {"k": "date", "text": "пізній палеоліт, мезоліт"}, {"k": "p", "paras": ["родичі (кілька десятків осіб), спільне майно й спільна праця"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Плем’я", "light": false}, {"k": "date", "text": "мезоліт, неоліт"}, {"k": "p", "paras": ["кілька родів (100–1000 осіб): спільна територія, мова, звичаї; вождь і рада старійшин"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Союз племен", "light": false}, {"k": "date", "text": "енеоліт – ранній залізний вік"}, {"k": "p", "paras": ["кілька племен об’єднуються для війни чи захисту"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Держава", "light": false}, {"k": "date", "text": "з раннього залізного віку"}, {"k": "p", "paras": ["чіткі кордони, влада, люди, які тільки керують"], "italic": false}]}]}, {"id": "s5", "num": "V", "title": "Узагальнення", "sub": "Таблиця періодів, типові помилки, поняття й стрічка часу", "cover": {"key": "s37_9", "cap": ""}, "cards": [{"type": "table", "title": "Періоди в одній таблиці", "rows": [["Період", "Дати", "Людина / спільнота", "Господарство", "Що нового", "Пам’ятки"], ["Ранній палеоліт", "1 млн – 150 тис. р. до н.е.", "архантроп; первісне стадо", "збиральництво, мисливство", "ручне рубило, вогонь", "Королеве"], ["Середній палеоліт", "150 – 40 тис. р. до н.е.", "неандерталець", "мисливство, збиральництво", "добування вогню, перші поховання", "Киїк-Коба"], ["Пізній палеоліт", "40 – 10 тис. р. до н.е.", "кроманьйонець; родова община", "полювання на мамонтів", "житла з кісток, мистецтво", "Мізин, Межиріч, Кирилівська"], ["Мезоліт", "X – VII тис. до н.е.", "родова община, плем’я", "мисливство, рибальство", "лук і стріли, мікроліти, собака, човни", "—"], ["Неоліт", "VII – V тис. до н.е.", "плем’я", "землеробство, скотарство", "неолітична революція, кераміка, осілість", "—"], ["Енеоліт", "IV – сер. III тис. до н.е.", "союзи племен", "орне землеробство, скотарство", "мідь, рало, 1-й поділ праці", "Трипілля, Середній Стіг"], ["Бронзовий вік", "сер. III – поч. I тис. до н.е.", "парна сім’я, патріархат", "землеробство, пастуше скотарство", "бронза, колесо, нерівність", "—"], ["Ранній залізний вік", "з поч. I тис. до н.е.", "союзи племен, перші держави", "+ ремесло, торгівля", "залізо, 2-й поділ праці", "кочовики (ч. 2)"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "Стоянки й періоди", "paras": ["**Королеве** — ранній палеоліт (Закарпаття).", "**Киїк-Коба** — середній палеоліт (Крим).", "**Мізин, Межиріч, Кирилівська** — пізній палеоліт."], "img": null}, {"name": "Два типи господарства", "paras": ["**Привласнювальне** — бере готове: мисливство, збиральництво, рибальство.", "**Відтворювальне** — виробляє саме: землеробство, скотарство.", "Перехід між ними — **неолітична революція**."], "img": null}, {"name": "Трипілля і Середній Стіг", "paras": ["Обидві — **енеоліт**, IV – сер. III тис. до н.е.", "**Трипільці** — лісостеп, землероби, розписний посуд.", "**Середньостогівці** — степ, скотарі, найдавніші сліди використання коня."], "img": null}, {"name": "Поділи праці", "paras": ["**Перший** (енеоліт – бронза): скотарство відокремилося від землеробства.", "**Другий** (ранній залізний вік): ремесло відокремилося від сільського господарства."], "img": null}], "note": null}, {"type": "generic", "title": "Обов’язкові поняття", "badges": ["НМТ: поняття"], "blocks": [{"k": "p", "paras": ["**Палеоліт** — давній кам’яний вік, найдавніший період історії людства, коли люди робили знаряддя з каменю, кістки й дерева.", "**Мезоліт** — середній кам’яний вік; поширюються мікроліти, з’являються лук і стріли, човни.", "**Неоліт** — новий кам’яний вік; люди переходять до землеробства й скотарства.", "**Енеоліт** — мідно-кам’яний вік: з’являються перші мідні знаряддя поряд із кам’яними.", "**Бронзовий вік** — період, коли знаряддя й зброю робили з бронзи — сплаву міді й олова."], "italic": false}, {"k": "sep"}, {"k": "p", "paras": ["**Ранній залізний вік** — період масового поширення залізних знарядь і зброї.", "**Привласнювальне господарство** — людина бере в природі готове: збиральництво, мисливство, рибальство.", "**Відтворювальне господарство** — людина сама виробляє потрібне: землеробство, скотарство, ремесло.", "**Неолітична революція** — перехід від привласнювального до відтворювального господарства.", "**Археологічна культура** — пам’ятки однієї доби на певній території, що мають спільні риси."], "italic": false}]}, {"type": "tl_events", "title": "Стрічка часу: від перших людей до заліза", "note": "Відстані між періодами однакові для наочності: насправді палеоліт триває в сотні разів довше, ніж усі інші періоди разом.", "items": [{"year": "бл. 1 млн р. тому", "name": "Ранній палеоліт", "desc": "поява людей, Королеве", "color": "#9c8b7a", "prog": false}, {"year": "150 тис. р. тому", "name": "Середній палеоліт", "desc": "неандертальці, Киїк-Коба", "color": "#a8906f", "prog": false}, {"year": "40 тис. р. тому", "name": "Пізній палеоліт", "desc": "кроманьйонці, Мізин, Межиріч", "color": "#b59465", "prog": false}, {"year": "X тис. до н.е.", "name": "Мезоліт", "desc": "лук і стріли", "color": "#c09659", "prog": false}, {"year": "VII тис. до н.е.", "name": "Неоліт", "desc": "неолітична революція", "color": "#cb934c", "prog": false}, {"year": "IV – сер. III тис. до н.е.", "name": "Енеоліт", "desc": "трипільська й середньостогівська культури", "color": "#d88b3e", "prog": true}, {"year": "сер. III тис. до н.е.", "name": "Бронзовий вік", "desc": "бронза, колесо, приручення коня", "color": "#e07f36", "prog": false}, {"year": "поч. I тис. до н.е.", "name": "Ранній залізний вік", "desc": "залізо, кочовики", "color": "#e97132", "prog": false}]}]}]}, {"id": "p2", "num": 2, "title": "Стародавня історія України", "part": "Частина 2. Кочовики й античні міста", "sub": "Кіммерійці, скіфи, сармати, грецькі колонії, готи й гуни", "cover": {"key": "kuloba", "cap": "Золота посудина з кургану Куль-Оба, IV ст. до н.е. Фото: Joanbanjo / Wikimedia Commons, CC BY-SA 3.0"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Поняття і дата", "light": false}, {"k": "p", "paras": ["• **кочовик**, **курган**, **колонізація**", "• **VIII – VI ст. до н.е.** — Велика грецька колонізація"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятки (упізнавати)", "light": false}, {"k": "p", "paras": ["• золотий **гребінь** із кургану Солоха", "• золота **пектораль** із кургану Товста Могила", "• **Херсонес Таврійський**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Картосхема", "light": false}, {"k": "p", "paras": ["• території **кіммерійців** і **скіфів**", "• міста-колонії **Тіра, Ольвія, Херсонес, Пантікапей**", "• **Боспорське царство**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пояснювати й визначати", "light": false}, {"k": "p", "paras": ["• причини й наслідки занепаду Великої Скіфії", "• особливості грецької колонізації Причорномор’я", "• значення колонізації і Великого переселення народів"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Характеризувати: суспільне, господарське й духовне життя кіммерійців, скіфів, сарматів і мешканців міст-колоній."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Кочовики степу", "sub": "Хто такі кочовики, що таке курган і перші знані на наших землях кочовики — кіммерійці", "cover": {"key": "steppe_k", "cap": ""}, "cards": [{"type": "text", "kicker": "Кочовики степу", "title": "Хто такі кочовики", "badges": ["НМТ: поняття"], "paras": ["**Кочовик** — людина з народу, який не має постійного житла й разом із худобою переходить з місця на місце.", "Степ годує худобу, але трава швидко витоптується. Тому скотарі кочують від пасовища до пасовища: взимку тримаються південніше, влітку йдуть на північ.", "Житлом кочовикам слугували повстяні кибитки на возах і шатра. Їли вони м’ясо, пили молоко й кумис, одяг шили зі шкур і повсті.", "Кочовики змалку сиділи в сідлі й стріляли з лука. Тому їхні загони були швидкими й небезпечними для сусідів."], "imgs": [{"key": "s41_7", "cap": "Кочовики зі стадами в горах Центральної Азії (сучасне фото)"}, {"key": "s41_5", "cap": "Стійбище кочовиків, XIX ст."}]}, {"type": "map", "steps": [{"key": "p2_steppe", "label": "Крок 1"}]}, {"type": "text", "kicker": "Кочовики степу", "title": "Курган — пагорб над могилою", "badges": ["НМТ: поняття"], "paras": ["**Курган** — земляний або кам’яний насип над похованням. Його видно здалеку, і саме за курганами археологи знаходять давні поховання.", "Кургани насипали ще в енеоліті, але найбільші, до 20 метрів заввишки, залишили скіфи. Під ними ховали царів і знать разом зі зброєю, кіньми й золотими прикрасами.", "Багато курганів пограбували ще в давнину. Тому кожен вцілілий царський курган для археолога — велика удача.", "В українському степу збереглися тисячі курганів. Частину з них розорюють, тож археологи поспішають їх дослідити."], "imgs": [{"key": "s50_4", "cap": "Курган у степу"}, {"key": "s50_5", "cap": "Розкопки кургану: видно рів довкола насипу"}]}, {"type": "text", "kicker": "Кочовики степу", "title": "Кіммерійці (IX – VII ст. до н.е.)", "badges": ["НМТ: карта"], "paras": ["**Кіммерійці** — перший народ на території України, згаданий у писемних джерелах: про них пише Гомер в «Одіссеї», а також ассирійські літописи.", "Це були **іраномовні кочовики**, які прийшли зі сходу. Вони одними з перших на наших землях почали робити **залізні** мечі й наконечники.", "Кіммерійці об’єднувалися в союзи племен на чолі з вождями. Їхні кінні загони ходили через Кавказ у **Малу Азію**, грабували Фрігію й Лідію.", "У **VII ст. до н.е.** зі сходу прийшли скіфи. Частина кіммерійців відступила, решта змішалася з новими господарями степу."], "imgs": [{"key": "s43_5", "cap": "Кіммерійські воїни (сучасна реконструкція)"}, {"key": "s43_4", "cap": "Кіммерійські вершники-лучники (прорисовка давньогрецького зображення)"}]}, {"type": "map", "steps": [{"key": "p2_cimmer1", "label": "Крок 1"}, {"key": "p2_cimmer2", "label": "Крок 2"}]}, {"type": "map", "steps": [{"key": "p2_camp_cimmer", "label": "Крок 1"}]}]}, {"id": "s2", "num": "II", "title": "Скіфи", "sub": "Велика Скіфія, похід Дарія, царські кургани, золото «звіриного стилю» і занепад скіфської держави", "cover": {"key": "bilsk_caul", "cap": ""}, "cards": [{"type": "text", "kicker": "Скіфи", "title": "Скіфи (VII – III ст. до н.е.)", "badges": ["НМТ: карта"], "paras": ["**Скіфи** — іраномовні кочовики, що прийшли з глибин Азії й витіснили кіммерійців. Найдокладніше про них розповів грецький історик **Геродот**, який у V ст. до н.е. побував в Ольвії.", "Скіфи себе називали **сколотами**. Геродот розрізняв **царських скіфів** і **скіфів-кочовиків**, а також землеробські племена лісостепу — **скіфів-орачів** і **скіфів-землеробів**. Останні, найімовірніше, були місцевим населенням під владою скіфів.", "Землі між Дунаєм і Доном, де панували скіфи, називають **Великою Скіфією**. Вона перебувала на шляху до держави: мала царів, військо, данників."], "imgs": [{"key": "s46_4", "cap": "Скіфські воїни (сучасна реконструкція)"}, {"key": "herod", "cap": "Геродот (бл. 484 – 425 рр. до н.е.), римська копія погруддя. Фото: Livioandronico2013 / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "map", "steps": [{"key": "p2_scythia1", "label": "Крок 1"}]}, {"type": "defs", "title": "Як жили скіфи: суспільство й господарство", "badges": [], "items": [{"name": "Влада", "paras": ["На чолі — **цар**, влада переходила в його роді. Царю підкорялися вожді племен і знать.", "Царські скіфи вважали інших скіфів підвладними собі."], "img": null}, {"name": "Нерівність", "paras": ["Знать мала великі стада, золото й рабів. Більшість — рядові скотарі й воїни.", "Різку **майнову нерівність** видно з поховань: в одних курганах — золото, в інших — кілька горщиків."], "img": null}, {"name": "Господарство", "paras": ["Кочові скіфи розводили коней, овець, велику рогату худобу.", "Землеробські племена лісостепу вирощували пшеницю й просо — частину зерна продавали грекам."], "img": null}, {"name": "Військо й торгівля", "paras": ["Кожен чоловік — воїн-вершник з луком, акінаком і списом.", "Скіфи торгували з грецькими містами: віддавали зерно, худобу, рабів, отримували вино, олію, посуд, прикраси."], "img": null}], "note": null}, {"type": "text", "kicker": "Скіфи", "title": "Вірування скіфів", "badges": [], "paras": ["Геродот називає скіфських богів: **Табіті** — богиня вогню й домашнього вогнища, **Папай** — батько богів, **Апі** — богиня землі. Храмів скіфи не будували.", "Найбільше шанували бога війни: йому ставили залізний меч-**акінак** на високій купі хмизу і приносили жертви.", "Скіфи вірили в потойбічне життя. Тому царя ховали з кіньми, слугами, зброєю, золотом і посудом — усім, що знадобиться «на тому світі».", "Свій родовід скіфи вели від **Таргітая**. За легендою, з неба впали золоті плуг з ярмом, сокира й чаша, і взяти їх зміг лише наймолодший син — від нього пішли царські скіфи."], "imgs": [{"key": "kuloba_dr", "cap": "Скіфи на золотій посудині з кургану Куль-Оба, IV ст. до н.е. (прорисовка, XIX ст.). Саму посудину — на титульному слайді"}]}, {"type": "doc", "title": "Геродот про скіфів", "quote": ["Скіфи не будують ні міст, ні укріплень. Свої оселі вони возять із собою на возах. Усі вони — кінні лучники, живуть не з орання землі, а зі скотарства.", "Як же їх можна здолати? Їх неможливо ні наздогнати, ні застати там, де вони були, якщо вони самі того не захочуть.", "Найбільше вони шанують Гестію, а за нею Зевса й Землю… По-скіфськи Гестія зветься Табіті, Зевс — Папай, Земля — Апі."], "source": "Геродот. Історія, кн. IV, 46, 59 (переклад-переказ із давньогрецької)", "comment": ["__Про що документ:__ Геродот пояснює, чому скіфів так важко перемогти: вони не прив’язані до міст, а їхнє військо — рухливі вершники.", "__Зверніть увагу:__ Геродот називає скіфських богів грецькими іменами, а потім дає скіфські.", "__Питання:__ які риси кочового способу життя згадано в уривку?"], "img": null}, {"type": "text", "kicker": "Скіфи", "title": "Похід перського царя Дарія (513 р. до н.е.)", "badges": [], "paras": ["Перський цар **Дарій I** правив найбільшою державою свого часу. Близько **513 р. до н.е.** він переправився через Дунай і рушив на скіфів.", "Скіфські царі не стали чекати удару. Вони відводили людей і худобу вглиб країни, засипали криниці, випалювали траву. Перси йшли пустим степом і не могли змусити скіфів до бою.", "Дійшовши до землі будинів, Дарій спалив місто **Гелон**. Перське військо виснажувалося, а скіфська кіннота нападала на загони, що шукали їжу.", "Зрештою Дарій покинув хворих і поранених і відступив за Дунай. Скіфи прославилися як народ, якого не здолав навіть «цар царів»."], "imgs": [{"key": "darius", "cap": "Дарій I на рельєфі в Персеполі. Фото: Derfash Kaviani (درفش کاویانی) / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "map", "steps": [{"key": "p2_scythia2", "label": "Крок 1"}]}, {"type": "map", "steps": [{"key": "p2_camp_scyth", "label": "Крок 1"}]}, {"type": "doc", "title": "Загадкові дарунки скіфів", "quote": ["Скіфські царі послали до Дарія вісника з дарунками: птахом, мишею, жабою і п’ятьма стрілами. Посланець нічого не пояснив і поїхав назад.", "Дарій вирішив, що скіфи здаються: миша живе в землі, жаба — у воді, птах схожий на коня, а стріли означають, що скіфи віддають свою силу.", "Та перс Гобрій пояснив інакше: «Якщо ви, перси, не полетите, як птахи, у небо, не сховаєтеся, як миші, у землю, не стрибнете, як жаби, в озера — то не повернетеся назад, уражені цими стрілами»."], "source": "Геродот. Історія, кн. IV, 131–132 (переклад-переказ із давньогрецької)", "comment": ["__Про що документ:__ скіфи погрожують персам, не вступаючи з ними в переговори.", "__Що з цього вийшло:__ Дарій невдовзі відступив за Дунай.", "__Питання:__ чиє тлумачення дарунків справдилося — Дарія чи Гобрія? Чому?"], "img": null}, {"type": "map", "steps": [{"key": "p2_scythia3", "label": "Крок 1"}]}, {"type": "text", "kicker": "Скіфи", "title": "Царські кургани", "badges": ["НМТ: пам’ятки"], "paras": ["Найбагатші скіфські кургани зосереджені на Дніпрі біля Нікополя, Покрова й Кам’янки-Дніпровської. Тут, імовірно, був священний край, де ховали царів, — **Герри**, про які пише Геродот.", "**Товста Могила** — курган біля Покрова. У **1971 р.** археолог **Борис Мозолевський** знайшов тут золоту пектораль.", "**Солоха** — курган поблизу Великої Знам’янки. У **1913 р.** **Микола Веселовський** знайшов тут золотий гребінь.", "**Чортомлик** біля Нікополя і **Куль-Оба** біля Керчі теж дали світові шедеври золотарства."], "imgs": [{"key": "scyth_excav", "cap": "Розкопки скіфського кургану в Покрові (колишній Орджонікідзе), 2005 р. Фото: Nataliya Shestakova / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "monument", "title": "Золота пектораль із кургану Товста Могила", "badges": [], "img": {"key": "s51_4", "cap": "Пектораль, IV ст. до н.е. Музей історичних коштовностей України, Київ"}, "paras": ["Нагрудна прикраса скіфського царя, **IV ст. до н.е.** Її знайшов **Борис Мозолевський** у **1971 р.** в кургані **Товста Могила** біля Покрова на Дніпропетровщині.", "Понад кілограм золота, **три яруси**:", "• верхній — побут: двоє скіфів шиють сорочку з овчини, юнаки доять овець;", "• середній — квіти й птахи;", "• нижній — грифони нападають на коней.", "__Як упізнати на НМТ:__ золотий півмісяць із трьох смуг, заповнених дрібними фігурками."]}, {"type": "monument", "title": "Золотий гребінь із кургану Солоха", "badges": [], "img": {"key": "s51_5", "cap": "Гребінь, кінець V – початок IV ст. до н.е. Ермітаж, Санкт-Петербург"}, "paras": ["Гребінь знайшов археолог **Микола Веселовський** у **1913 р.** у кургані **Солоха** на Запоріжжі. Він датується **кінцем V – початком IV ст. до н.е.**", "Над зубцями — скульптурна сцена бою: **три скіфські воїни**, вершник і піший б’ються з пішим супротивником. Під ними лежать **п’ять левів**.", "На воїнах можна розгледіти одяг, шоломи, щити, мечі. Тому гребінь — ще й «фотографія» скіфського воїна.", "__Як упізнати на НМТ:__ золотий гребінь, у верхній частині — бій трьох воїнів, один із них на коні."]}, {"type": "carousel", "title": "Звіриний стиль у мистецтві скіфів і сарматів", "badges": [], "note": "**Звіриний стиль** — прикраси, зброя й посуд із зображеннями тварин: оленів, левів, грифонів, хижих птахів. Звірі ніби оберігали власника й показували його силу.", "items": [{"key": "deer", "name": "", "desc": "Золотий олень з кургану біля Костромської, VII ст. до н.е. Фото: Joanbanjo / Wikimedia Commons, CC BY-SA 3.0", "cap": ""}, {"key": "s52_13", "name": "", "desc": "Золотий кабан", "cap": ""}, {"key": "s52_11", "name": "", "desc": "Посуд і прикраси зі звірами", "cap": ""}]}, {"type": "cols", "title": "Чому занепала Велика Скіфія", "badges": [], "intro": "Програма НМТ вимагає знати і причини, і наслідки занепаду Великої Скіфії.", "blocks": [{"h": "Причини", "paras": ["• **339 р. до н.е.** — поразка від македонського царя **Філіппа II**; у битві загинув 90-річний скіфський цар **Атей**.", "• З III ст. до н.е. зі сходу тиснуть **сармати** й захоплюють степ.", "• На заході скіфам загрожують фракійці й кельти.", "• Посухи виснажили пасовища (на думку частини дослідників).", "• Без сильного царя влада розпалася між вождями."]}, {"h": "Наслідки", "paras": ["• Велика Скіфія розпалася.", "• Скіфи відступили в **Крим** і **пониззя Дніпра**. Там постала **Мала Скіфія** (III ст. до н.е. – III ст. н.е.) зі столицею **Неаполь Скіфський**.", "• Господарями степу стали **сармати**.", "• Скіфи дедалі більше переходили до осілого життя і землеробства."]}]}]}, {"id": "s3", "num": "III", "title": "Сармати і Мала Скіфія", "sub": "Нові господарі степу, жінки-воїтельки і скіфське царство в Криму", "cover": {"key": "neapol2", "cap": ""}, "cards": [{"type": "text", "kicker": "Сармати", "title": "Сармати (III ст. до н.е. – III ст. н.е.)", "badges": [], "paras": ["**Сармати** — іраномовні кочовики, родичі скіфів. Вони жили за Доном, а в **III ст. до н.е.** рушили на захід і захопили причорноморські степи.", "Великі племена сарматів: **роксолани, язиги, аорси, сіраки**, згодом **алани**. Головна сила — важкоозброєна кіннота: вершники в лускатих обладунках із довгими списами й мечами.", "У сарматів жінки нерідко воювали нарівні з чоловіками: їх ховали зі зброєю. Звідси грецькі легенди про амазонок.", "Сармати нападали на дунайські провінції **Римської імперії**, торгували з грецькими містами. У III ст. н.е. їх підкорили **готи**, а згодом частина пішла на захід із гунами."], "imgs": [{"key": "s54_4", "cap": "Сарматські вершники в обладунках на колоні Траяна, Рим, II ст."}, {"key": "diadem", "cap": "Сарматська діадема, I ст. н.е. Фото: Colonel Lobo / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "map", "steps": [{"key": "p2_sarmat", "label": "Крок 1"}]}, {"type": "map", "steps": [{"key": "p2_camp_sarmat", "label": "Крок 1"}]}, {"type": "text", "kicker": "Сармати", "title": "Мала Скіфія (III ст. до н.е. – III ст. н.е.)", "badges": [], "paras": ["Під натиском сарматів скіфи відійшли в **степовий Крим** і **пониззя Дніпра**. Тут постала **Мала Скіфія**.", "Столиця — **Неаполь Скіфський** на околиці сучасного Сімферополя. Це вже справжнє місто з кам’яними мурами й будинками: скіфи переходили до осілого життя.", "Найвідоміший цар — **Скілур** (II ст. до н.е.). Скіфи воювали з **Херсонесом** за землі в Криму. Херсонес покликав на допомогу Понтійське царство, і його полководець **Діофант** розбив скіфів.", "Остаточно Малу Скіфію знищили **готи** в **III ст. н.е.**"], "imgs": [{"key": "neapol", "cap": "Розкопки Неаполя Скіфського, Сімферополь. Фото: Siverec / Wikimedia Commons, CC BY-SA 4.0"}]}]}, {"id": "s4", "num": "IV", "title": "Античні міста Причорномор’я", "sub": "Велика грецька колонізація, Тіра, Ольвія, Херсонес, Пантікапей і Боспорське царство", "cover": {"key": "tyras2", "cap": ""}, "cards": [{"type": "text", "kicker": "Античні міста", "title": "Колонізація", "badges": ["НМТ: поняття", "НМТ: дата"], "paras": ["**Колонізація** — заселення нових земель переселенцями з іншої країни. Буває мирною, коли люди займають вільні землі, і загарбницькою, коли чужу землю захоплюють силою.", "**Велика грецька колонізація** — переселення греків у **VIII – VI ст. до н.е.** на узбережжя Середземного й Чорного морів.", "Місто, з якого вирушали переселенці, греки називали **метрополією** («місто-мати»), а нове місто — **колонією**. На північне узбережжя Чорного моря найбільше переселенців прибуло з **Мілета** в Малій Азії."], "imgs": [{"key": "s57_1028", "cap": "Грецький корабель — трієра (сучасна копія)"}]}, {"type": "map", "steps": [{"key": "p2_greek", "label": "Крок 1"}]}, {"type": "defs", "title": "Чому греки вирушали за море", "badges": [], "items": [{"name": "Тіснота", "paras": ["У гірській Греції мало родючої землі.", "Населення зростало, і молодь шукала нових ділянок."], "img": null}, {"name": "Торгівля", "paras": ["Купці шукали нові ринки й товари.", "З Причорномор’я везли зерно, рибу, шкури, рабів."], "img": null}, {"name": "Сировина", "paras": ["Потрібні були метали, ліс, сіль.", "Біля своїх колоній греки їх і добували, і купували."], "img": null}, {"name": "Боротьба в містах", "paras": ["Ті, хто програв у суперечках за владу, мусили виїжджати.", "Для них колонія — новий початок."], "img": null}], "note": "Греки були вправними мореплавцями. Тому вони й могли заселити узбережжя далеко від дому."}, {"type": "defs", "title": "Особливості колонізації Північного Причорномор’я", "badges": [], "items": [{"name": "Здебільшого мирна", "paras": ["Греки селилися на узбережжі, яке кочовикам було не дуже потрібне.", "Зі скіфами вони частіше торгували, ніж воювали."], "img": null}, {"name": "Зерно й торгівля", "paras": ["Колоністи обробляли землю довкола міст і вирощували зерно на продаж.", "Міста стали посередниками між Грецією і степом."], "img": null}, {"name": "Незалежні міста", "paras": ["Колонія не підкорялася метрополії.", "Кожне місто мало свої закони, владу, монету — це був **поліс**, місто-держава."], "img": null}, {"name": "Переважно з Мілета", "paras": ["Ольвію, Тіру, Пантікапей заснували мілетці.", "Херсонес — вихідці з Гераклеї Понтійської."], "img": null}], "note": null}, {"type": "map", "steps": [{"key": "p2_colonies1", "label": "Крок 1"}]}, {"type": "generic", "title": "Чотири міста, які треба знати для НМТ", "badges": ["НМТ: карта"], "blocks": [{"k": "img", "key": "tyras1", "cap": "Руїни Тіри. Фото: Minami Himemiya / Wikimedia Commons, CC BY-SA 2.5"}, {"k": "h", "text": "Тіра", "light": false}, {"k": "p", "paras": ["VI ст. до н.е., мілетці.", "Дністровський лиман — нині **Білгород-Дністровський**. Руїни поруч із середньовічною фортецею."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "olbia_v", "cap": "Заповідник «Ольвія». Фото: Igor Niko / Wikimedia Commons, CC BY-SA 3.0"}, {"k": "h", "text": "Ольвія", "light": false}, {"k": "p", "paras": ["Бл. середини VI ст. до н.е., мілетці.", "Бузький лиман біля с. **Парутине**. «Ольвія» по-грецьки — «щаслива»."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "chers_bas", "cap": "Херсонес. Фото: Viktoriia Rogovenko / Wikimedia Commons, CC BY-SA 4.0"}, {"k": "h", "text": "Херсонес", "light": false}, {"k": "p", "paras": ["422/421 р. до н.е., вихідці з Гераклеї Понтійської.", "Нині в межах **Севастополя**."], "italic": false}, {"k": "sep"}, {"k": "img", "key": "pantik", "cap": "Гора Мітридат. Фото: Derevyagin Igor / Wikimedia Commons, CC BY-SA 3.0"}, {"k": "h", "text": "Пантікапей", "light": false}, {"k": "p", "paras": ["Кінець VII – початок VI ст. до н.е., мілетці.", "Нині **Керч**. Столиця **Боспорського царства**."], "italic": false}]}, {"type": "monument", "title": "Херсонес Таврійський", "badges": [], "img": {"key": "chers_big", "cap": "Руїни Херсонеса: так звана базиліка 1935 р. Фото: Віталій Попков / Wikimedia Commons, CC BY-SA 4.0"}, "paras": ["**Херсонес** заснували в **422/421 р. до н.е.** вихідці з **Гераклеї Понтійської** на південному заході Криму. Нині руїни — у межах Севастополя.", "Місто проіснувало майже **2000 років**: пережило скіфів, готів і гунів, у Середньовіччі стало візантійським Херсоном (Корсунем). Тут, за літописом, хрестився князь Володимир.", "Збереглися мури, вулиці, античний театр, будинки, храми. З **2013 р.** Херсонес — пам’ятка Світової спадщини ЮНЕСКО.", "__Як упізнати на НМТ:__ білі колони на тлі моря. Це базиліка VI ст., тобто вже візантійської доби, але саме вона — «обличчя» Херсонеса."]}, {"type": "doc", "title": "Херсонеська присяга", "quote": ["Присягаюся Зевсом, Землею, Сонцем, Дівою, богами й богинями олімпійськими…", "Я буду однодумний щодо спасіння й свободи міста й громадян і не зраджу ні Херсонеса, ні Керкінітиди, ні Прекрасної Гавані, ні інших укріплень… ні еллінові, ні варварові…", "Я не порушу демократії і не дозволю нікому її порушити… Я буду служити народові й радити йому найкраще й найсправедливіше для міста й громадян."], "source": "Присяга громадян Херсонеса, напис на мармуровій плиті, початок III ст. до н.е. (переклад-переказ, скорочено)", "comment": ["__Про що документ:__ кожен юнак, стаючи громадянином, присягав захищати місто, його землі й владу народу.", "__Зверніть увагу:__ Херсонес — **демократичний поліс**, «Прекрасна Гавань» (Калос Лімен) і Керкінітида — його володіння в Криму.", "__Питання:__ від кого громадяни присягали захищати своє місто?"], "img": null}, {"type": "text", "kicker": "Античні міста", "title": "Боспорське царство (бл. 480 р. до н.е. – IV ст. н.е.)", "badges": ["НМТ: карта"], "paras": ["Близько **480 р. до н.е.** грецькі міста по обидва береги Керченської протоки (греки називали її Кіммерійським Боспором) об’єдналися в **Боспорське царство**. Столиця — **Пантікапей**.", "На відміну від інших міст-полісів, Боспор був **монархією**: владу передавали в роді правителів. Найдовше правили **Спартокіди**.", "Цар володів містами Феодосія, Німфей, Фанагорія, Горгіппія, Танаїс і підкорив місцеві племена. Боспор продавав до Афін величезні обсяги зерна.", "Згодом царство залежало від Понту й від Риму. Його ослабили готи, а в IV ст. н.е. — гуни."], "imgs": [{"key": "s61_2050", "cap": "Руїни Пантікапея на горі Мітридат, Керч"}]}, {"type": "map", "steps": [{"key": "p2_colonies2", "label": "Крок 1"}]}, {"type": "defs", "title": "Як було влаштоване життя в полісі", "badges": [], "items": [{"name": "Громадяни", "paras": ["Повноправні — лише чоловіки-громадяни.", "Вони збиралися на **народні збори**, обирали посадовців і раду."], "img": null}, {"name": "Інші мешканці", "paras": ["Жінки, приїжджі та їхні діти не мали політичних прав.", "Найнижче — **раби**: їх купували в степу або брали в полон."], "img": null}, {"name": "Влада", "paras": ["Більшість полісів — республіки: Ольвія, Херсонес.", "Боспор — **монархія** зі спадковою владою царя."], "img": null}, {"name": "Місто", "paras": ["Мури, агора (площа), храми, театр, гімнасій.", "Кам’яні будинки з внутрішнім двориком і водогони."], "img": null}], "note": null}, {"type": "text", "kicker": "Античні міста", "title": "Господарство міст-колоній", "badges": [], "paras": ["__Сільське господарство.__ Головна галузь — вирощування **зерна** на продаж. Розводили виноград і сади, худобу тримали біля садиби.", "__Промисли.__ Ловили й солили рибу, добували сіль.", "__Ремесла.__ Гончарі робили посуд і амфори, ковалі — знаряддя й зброю, ювеліри — золоті прикраси. Робили скло, будували кам’яні будинки й храми.", "__Торгівля.__ До Греції везли зерно, рибу, худобу, шкури, рабів. Назад — вино, оливкову олію, тканини, розписний посуд. Зі скіфами міняли товари, у самих містах користувалися грошима."], "imgs": [{"key": "s64_5", "cap": "Амфори — посуд для вина, олії й зерна"}, {"key": "coins", "cap": "Ольвійські монети-«дельфінки». Фото: Krigore / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "s66_5", "cap": "Зважування товарів (розпис грецької вази)"}]}, {"type": "carousel", "title": "Культура міст-колоній", "badges": [], "note": "Греки принесли в Причорномор’я театр, школу, писемність, монети й культ своїх богів: Аполлона, Деметри, Діоніса. Дуже шанували Ахілла — покровителя моряків.", "items": [{"key": "s64_7", "name": "", "desc": "Розписний посуд", "cap": ""}, {"key": "s62_3074", "name": "", "desc": "Грецька чаша з розписом", "cap": ""}, {"key": "s64_5122", "name": "", "desc": "Золоті браслети з самоцвітами", "cap": ""}, {"key": "s64_11", "name": "", "desc": "Скляні флакони", "cap": ""}]}, {"type": "defs", "title": "Що дала колонізація нашим землям", "badges": [], "items": [{"name": "Перші міста", "paras": ["На узбережжі з’явилися перші справжні міста з мурами, вулицями, водогоном."], "img": null}, {"name": "Торгівля", "paras": ["Скіфи й інші племена втягнулися в торгівлю з Грецією.", "Почали ходити монети."], "img": null}, {"name": "Знання й ремесла", "paras": ["Місцеві племена переймали гончарний круг, кам’яне будівництво, нові культури рослин."], "img": null}, {"name": "Писемні джерела", "paras": ["Від греків — перші описи наших земель: Геродот, Страбон, написи на каменях."], "img": null}], "note": "Пізніше через Херсонес на наші землі приходило християнство."}, {"type": "generic", "title": "Чому зникли античні міста", "badges": [], "blocks": [{"k": "date", "text": "I – II ст. н.е."}, {"k": "h", "text": "Під владою Риму", "light": true}, {"k": "p", "paras": ["Боспор, Херсонес, Тіра, Ольвія залежать від Римської імперії, у містах — римські гарнізони."], "italic": false}, {"k": "sep"}, {"k": "date", "text": "III ст. н.е."}, {"k": "h", "text": "Удари готів", "light": true}, {"k": "p", "paras": ["Германські племена готів спустошують узбережжя. Ольвія й Тіра занепадають."], "italic": false}, {"k": "sep"}, {"k": "date", "text": "кінець IV ст."}, {"k": "h", "text": "Навала гунів", "light": true}, {"k": "p", "paras": ["Гуни добивають більшість міст. Античне життя на узбережжі завмирає."], "italic": false}, {"k": "sep"}, {"k": "date", "text": "далі"}, {"k": "h", "text": "Вистояв Херсонес", "light": true}, {"k": "p", "paras": ["Міцні мури й підтримка Візантії зберегли місто аж до XV ст."], "italic": false}]}]}, {"id": "s5", "num": "V", "title": "Готи, гуни і Велике переселення народів", "sub": "Германці з півночі, кочовики зі сходу і кінець античного світу на наших землях", "cover": {"key": "hun_caul", "cap": ""}, "cards": [{"type": "text", "kicker": "Велике переселення народів", "title": "Готи на наших землях (II – IV ст.)", "badges": [], "paras": ["**Готи** — германські племена з узбережжя Балтики. Наприкінці **II ст.** вони рушили з пониззя Вісли на південний схід і дійшли до Чорного моря.", "На відміну від кочовиків, готи були **осілими**: жили в селах, орали землю, розводили худобу. Вони підкорили сарматів, знищили Малу Скіфію, грабували античні міста, воювали з Римом.", "Готи розділилися на **остготів** (між Дністром і Доном) і **вестготів** (між Дністром і Дунаєм). У IV ст. король остготів **Германаріх** підкорив багато сусідніх народів, зокрема частину слов’ян.", "На наших землях тоді поширилася **черняхівська культура**: у її селах разом жили готи, сармати, нащадки скіфів, даки і слов’яни."], "imgs": [{"key": "s69_6146", "cap": "Германська фібула у вигляді орла (застібка для плаща)"}, {"key": "chern", "cap": "Посуд черняхівської культури. Фото: Silar / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "map", "steps": [{"key": "p2_goths1", "label": "Крок 1"}]}, {"type": "map", "steps": [{"key": "p2_camp_goths", "label": "Крок 1"}]}, {"type": "text", "kicker": "Велике переселення народів", "title": "Гуни (кінець IV – V ст.)", "badges": [], "paras": ["**Гуни** — кочовики з Центральної Азії. Якою мовою вони говорили, точно не відомо; найчастіше їх вважають тюрками.", "Близько **375 р.** гуни перейшли Дон, розбили аланів і остготів. Германаріх загинув, частина готів підкорилася гунам, вестготи втекли за Дунай до римлян.", "Гуни осіли в Паннонії (нинішня Угорщина) і звідти ходили походами на Рим. Найвідоміший їхній вождь — **Аттіла** (434–453). У **451 р.** римляни й вестготи зупинили його на Каталаунських полях.", "Після смерті Аттіли держава гунів швидко розпалася."], "imgs": [{"key": "s71_8196", "cap": "Гуни в поході (сучасна ілюстрація)"}]}, {"type": "map", "steps": [{"key": "p2_goths2", "label": "Крок 1"}]}, {"type": "map", "steps": [{"key": "p2_camp_huns", "label": "Крок 1"}]}, {"type": "defs", "title": "Велике переселення народів (IV – VII ст.)", "badges": [], "items": [{"name": "Що це", "paras": ["Масові переселення племен Європи й Азії. Поштовх дала навала **гунів** у 375 р."], "img": null}, {"name": "Для Європи", "paras": ["Германці захопили землі Риму. У **476 р.** впала Західна Римська імперія.", "Склалася нова етнічна карта Європи."], "img": null}, {"name": "Для наших земель", "paras": ["Загинули майже всі античні міста, крім Херсонеса.", "Зникла черняхівська культура, закінчилося панування іраномовних кочовиків."], "img": null}, {"name": "Що далі", "paras": ["Слов’яни включилися в рух і почали розселятися на великих просторах — про це в частині 3."], "img": null}], "note": "Програма НМТ вимагає пояснювати значення Великого переселення народів для українських земель."}, {"type": "map", "steps": [{"key": "p3_migration", "label": "Крок 1"}]}]}, {"id": "s6", "num": "VI", "title": "Узагальнення", "sub": "Таблиці народів і міст, типові помилки, поняття й стрічка часу", "cover": {"key": "hu_deer", "cap": ""}, "cards": [{"type": "table", "title": "Народи степу в одній таблиці", "rows": [["Народ", "Коли", "Походження, мова", "Спосіб життя", "Що запам’ятати", "Що з ними сталося"], ["Кіммерійці", "IX – VII ст. до н.е.", "іраномовні, зі сходу", "кочові скотарі", "перші в писемних джерелах (Гомер); залізо", "витіснені скіфами"], ["Скіфи", "VII – III ст. до н.е.", "іраномовні, з Азії", "кочовики + підвладні землероби", "Велика Скіфія, Дарій 513 р., кургани, пектораль", "Мала Скіфія до III ст. н.е."], ["Сармати", "III ст. до н.е. – III ст. н.е.", "іраномовні, з-за Дону", "кочовики, важка кіннота", "роксолани, язиги, аорси, сіраки; жінки-воїни", "підкорені готами, частина — з гунами"], ["Готи", "II – IV ст.", "германці, з Балтики", "осілі землероби", "остготи й вестготи, Германаріх, черняхівська культура", "розбиті гунами 375 р."], ["Гуни", "кінець IV – V ст.", "кочовики з Центр. Азії", "кочовики", "поштовх Великому переселенню народів, Аттіла", "держава розпалася після 453 р."]]}, {"type": "table", "title": "Міста-колонії в одній таблиці", "rows": [["Місто", "Де (нині)", "Коли засноване", "Хто заснував", "Що запам’ятати"], ["Тіра", "Білгород-Дністровський, Дністровський лиман", "VI ст. до н.е.", "мілетці", "руїни біля середньовічної фортеці"], ["Ольвія", "с. Парутине, Бузький лиман", "бл. середини VI ст. до н.е.", "мілетці", "«щаслива»; монети-«дельфінки»; тут бував Геродот"], ["Херсонес", "Севастополь", "422/421 р. до н.е.", "вихідці з Гераклеї Понтійської", "демократія, Херсонеська присяга; вистояв до XV ст.; ЮНЕСКО"], ["Пантікапей", "Керч", "кінець VII – поч. VI ст. до н.е.", "мілетці", "столиця Боспорського царства (бл. 480 р. до н.е.)"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "Пектораль чи гребінь", "paras": ["**Пектораль** — Товста Могила, 1971, Б. Мозолевський.", "**Гребінь** — Солоха, 1913, М. Веселовський."], "img": null}, {"name": "Міста й сучасні назви", "paras": ["**Херсонес** — Севастополь, а не Херсон!", "**Пантікапей** — Керч, **Тіра** — Білгород-Дністровський, **Ольвія** — біля Парутиного."], "img": null}, {"name": "Велика і Мала Скіфія", "paras": ["**Велика**: VII – III ст. до н.е., степ від Дунаю до Дону.", "**Мала**: III ст. до н.е. – III ст. н.е., Крим і пониззя Дніпра, столиця Неаполь Скіфський."], "img": null}, {"name": "Хто перший", "paras": ["**Кіммерійці** — перші в писемних джерелах (Гомер).", "Найдокладніший опис скіфів — у **Геродота** (V ст. до н.е.)."], "img": null}], "note": null}, {"type": "generic", "title": "Поняття", "badges": ["НМТ: поняття"], "blocks": [{"k": "h", "text": "Програма НМТ", "light": false}, {"k": "p", "paras": ["**Кочовик** — людина з народу, що не має постійного житла й переходить з місця на місце разом із худобою.", "**Курган** — земляний або кам’яний насип над похованням.", "**Колонізація** — заселення нових земель переселенцями з іншої країни.", "**Велика грецька колонізація** — переселення греків на узбережжя Середземного й Чорного морів у VIII – VI ст. до н.е."], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Корисно знати", "light": true}, {"k": "p", "paras": ["__Метрополія__ — місто, з якого вирушили переселенці.", "__Поліс__ — місто-держава з власними законами й владою.", "__Велика Скіфія__ — об’єднання скіфських племен у степах між Дунаєм і Доном.", "__Звіриний стиль__ — мистецтво із зображеннями тварин.", "__Вели

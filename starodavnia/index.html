], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Характеризувати: суспільне, господарське й духовне життя давніх слов’ян."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Звідки походять слов’яни", "sub": "Венеди, анти й склавини: що кажуть писемні джерела й археологія", "cover": {"key": "penk", "cap": ""}, "cards": [{"type": "generic", "title": "Як історики шукають предків слов’ян", "badges": [], "blocks": [{"k": "p", "paras": ["**Етногенез** — походження народу. Звідки взялися слов’яни, науковці досі сперечаються. Відповідь складають із двох видів джерел:"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Писемні джерела", "light": false}, {"k": "p", "paras": ["Римські, грецькі, готські й візантійські автори називають сусідів імперії. Слов’ян вони згадують під іменами **венедів**, **антів** і **склавинів**.", "Але самі слов’яни тоді ще не писали, тож ми бачимо їх лише очима чужинців."], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Археологія", "light": false}, {"k": "p", "paras": ["Археологи простежують, як змінюються поселення, житла, посуд і поховання.", "Так вони з’єднують ланцюжок археологічних культур, що, ймовірно, належали предкам слов’ян."], "italic": false}, {"k": "sep"}, {"k": "h", "text": "венеди", "light": true}, {"k": "p", "paras": ["I–II ст.", "зарубинецька к."], "italic": false}, {"k": "sep"}, {"k": "h", "text": "їхні нащадки", "light": true}, {"k": "p", "paras": ["III–V ст.", "київська к."], "italic": false}, {"k": "sep"}, {"k": "h", "text": "анти", "light": true}, {"k": "p", "paras": ["V–VII ст.", "пеньківська к."], "italic": false}, {"k": "sep"}, {"k": "h", "text": "склавини", "light": true}, {"k": "p", "paras": ["V–VII ст.", "празька к."], "italic": false}, {"k": "sep"}, {"k": "date", "text": "Велике розселення"}, {"k": "p", "paras": ["друга пол. V–VII ст.", "три гілки слов’ян"]}]}, {"type": "text", "kicker": "Етногенез слов’ян", "title": "Венеди (I – II ст. н.е.)", "badges": ["НМТ: поняття"], "paras": ["**Венеди** — перша писемна згадка про предків слов’ян. Про них писали римляни **Пліній Старший** і **Тацит** (I ст.), а також грецький географ **Птолемей** (II ст.).", "За їхніми словами, венеди жили на схід від Вісли. Птолемей називав їх «найбільшим народом» Сарматії.", "Археологи пов’язують венедів передусім із **зарубинецькою культурою** (II ст. до н.е. – II ст. н.е.) на Середньому Дніпрі й Прип’яті. Її назвали за селом Зарубинці над Дніпром (нині Черкащина).", "Зарубинці жили в невеликих селищах над річками, орали землю, розводили худобу, самі виплавляли залізо."], "imgs": [{"key": "zar_dw", "cap": "Житла зарубинецької культури (макет-реконструкція). Фото: O.Mustafin / Wikimedia Commons, CC0"}, {"key": "zar_ker", "cap": "Посуд зарубинецької культури. Суспільне надбання"}]}, {"type": "map", "steps": [{"key": "p3_venedi", "label": "Крок 1"}]}, {"type": "doc", "title": "Тацит про венедів", "quote": ["Чи віднести певкінів, венедів і феннів до германців чи до сарматів, я не знаю…", "Венеди перейняли багато що з сарматських звичаїв: заради грабунку вони нишпорять лісами й горами між певкінами й феннами.", "Однак їх слід радше віднести до германців, бо вони будують собі хати, носять щити й люблять ходити пішки та швидко. Цим вони зовсім не схожі на сарматів, які живуть на возі й на коні."], "source": "Тацит. Германія, 46. Кінець I ст. н.е. (переклад-переказ, скорочено)", "comment": ["__Про що документ:__ Тацит не знав, до кого зарахувати венедів, і порівнює їх із сусідами.", "__Зверніть увагу:__ головна відмінність від сарматів — венеди **осілі**: будують житла й воюють пішки.", "__Питання:__ за якими ознаками Тацит відрізняє венедів від кочовиків?"], "img": null}, {"type": "text", "kicker": "Етногенез слов’ян", "title": "Анти й склавини (V – VII ст.)", "badges": [], "paras": ["У VI ст. про слов’ян багато пишуть **візантійці** — **Прокопій Кесарійський**, імператор **Маврикій** — і готський історик **Йордан**. Вони називають два великі об’єднання: **антів** і **склавинів**.", "За Йорданом, **склавини** жили від Дунаю до Дністра й на північ до Вісли, а **анти** — між Дністром і Дніпром. Археологи пов’язують склавинів із **празькою** культурою, антів — із **пеньківською**.", "Анти й склавини мали одну мову й звичаї. Вони часто ходили походами за Дунай, грабували Візантію, а згодом почали там селитися.", "Найраніша згадка про антів — у Йордана, в розповіді про події кінця **IV ст.**: готи вбили антського князя **Божа** з синами й старійшинами. Це перше відоме ім’я слов’янського правителя."], "imgs": [{"key": "slavhoard", "cap": "Срібні фігурки з Мартинівського скарбу (Черкащина), VI – VII ст., Британський музей. Фото: Völkerwanderer / Wikimedia Commons, CC0"}]}, {"type": "map", "steps": [{"key": "p3_antes", "label": "Крок 1"}]}, {"type": "doc", "title": "Прокопій Кесарійський про антів і склавинів", "quote": ["Ці племена, склавини й анти, не управляються однією людиною, а здавна живуть у народоправстві. Тому щастя й нещастя в житті вважаються в них спільною справою.", "Вони вважають, що лише один бог, творець блискавки, є володарем усього, і приносять йому в жертву биків та іншу худобу.", "Живуть вони в убогих хатинах, далеко одна від одної, і часто міняють місце житла. У бій ідуть пішими, тримаючи невеликі щити й дротики."], "source": "Прокопій Кесарійський. Війна з готами, кн. VII, 14. VI ст. (переклад-переказ, скорочено)", "comment": ["__Про що документ:__ візантійський історик описує суспільство, вірування й побут слов’ян.", "__Зверніть увагу:__ «народоправство» — важливі справи вирішували на зборах (вічі), а не один правитель. «Творець блискавки» — найімовірніше, **Перун**.", "__Питання:__ які риси суспільного й духовного життя слов’ян згадано в уривку?"], "img": null}]}, {"id": "s2", "num": "II", "title": "Велике розселення слов’ян", "sub": "Друга половина V – VII ст.: як слов’яни заселили пів Європи і що з цього вийшло", "cover": {"key": "sl_dorf", "cap": ""}, "cards": [{"type": "text", "kicker": "Велике розселення слов’ян", "title": "Чому слов’яни рушили з місця", "badges": ["НМТ: дата"], "paras": ["**Велике розселення слов’ян** — переселення слов’янських племен у **другій половині V – VII ст.** на величезні простори Центральної, Східної та Південно-Східної Європи.", "Його підготувало **Велике переселення народів**. Германці пішли на захід у межі Римської імперії, після гунів спорожніли землі в Подунав’ї. Слов’яни зайняли ці вільні простори.", "Слов’ян ставало більше, а підсічне землеробство виснажувало землю. Тому громади шукали нові поля.", "Ще одна принада — багаті землі **Візантії**: сюди вели походи за здобиччю, а згодом слов’яни почали тут осідати."], "imgs": [{"key": "modra1", "cap": "Реконструкція слов’янського селища IX ст. Музей просто неба в Модрі, Чехія. Фото: Pudelek / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "map", "steps": [{"key": "p3_settle1", "label": "Крок 1"}, {"key": "p3_settle2", "label": "Крок 2"}]}, {"type": "defs", "title": "Три гілки слов’ян", "badges": [], "items": [{"name": "Західні", "paras": ["Розселилися на захід, до Одри, Ельби й Балтійського моря.", "Нащадки: **поляки, чехи, словаки**, лужицькі серби."], "img": null}, {"name": "Південні", "paras": ["Перейшли Дунай і заселили Балкани аж до Греції.", "Нащадки: **болгари, серби, хорвати, словенці**, македонці, чорногорці, боснійці."], "img": null}, {"name": "Східні", "paras": ["Розселилися на північ і схід — до озера Ільмень, верхньої Волги й Оки.", "Нащадки: **українці, білоруси, росіяни**."], "img": null}], "note": "Усі слов’янські народи — родичі: їхні мови й досі близькі. Тому українець багато що зрозуміє польською, словацькою чи білоруською без перекладача."}, {"type": "cols", "title": "Наслідки й значення Великого розселення", "badges": [], "intro": "Програма НМТ вимагає пояснювати наслідки й значення Великого розселення слов’ян.", "blocks": [{"h": "Для Європи", "paras": ["• Слов’яни стали одними з найчисленніших народів Європи.", "• Склалися **три гілки** слов’ян — західна, південна й східна.", "• Слов’яни заселили Балкани й змінили етнічну карту Візантії.", "• Візантія мусила рахуватися з новим сильним сусідом."]}, {"h": "Для українських земель", "paras": ["• Слов’яни остаточно стали основним населенням наших земель.", "• Утворилися **союзи племен** східних слов’ян: поляни, деревляни, сіверяни, волиняни, уличі, тиверці, білі хорвати.", "• Племінні центри перетворювалися на міста — **Київ** серед них.", "• Почалося складання **українського народу**, а з часом — держави Русь."]}]}]}, {"id": "s3", "num": "III", "title": "Як жили давні слов’яни", "sub": "Суспільство, господарство, житло й вірування", "cover": {"key": "modra2", "cap": ""}, "cards": [{"type": "defs", "title": "Суспільство", "badges": [], "items": [{"name": "Община", "paras": ["Основа життя — **сусідська (територіальна) община**: родини жили поруч і разом користувалися землею, лісом, пасовищами."], "img": null}, {"name": "Плем’я і союз", "paras": ["Кілька общин — плем’я. Племена об’єднувалися в **союзи племен** на чолі з **князями**."], "img": null}, {"name": "Віче", "paras": ["Важливі справи вирішували на **вічі** — зборах вільних чоловіків. Прокопій назвав це «народоправством»."], "img": null}, {"name": "Нерівність", "paras": ["Поступово виділяються князі, старійшини й **дружина** — воїни князя. Майнова нерівність зростає."], "img": null}], "note": "Слов’яни ще не мали держави, але їхні союзи племен уже були на шляху до неї."}, {"type": "text", "kicker": "Як жили давні слов’яни", "title": "Господарство й ремесла", "badges": [], "paras": ["__Землеробство.__ Основне заняття. У лісах — **підсічно-вогневе**, у лісостепу — **орне** (рало, згодом плуг із залізним наральником). Сіяли пшеницю, жито, ячмінь, просо, льон.", "__Скотарство.__ Тримали корів, свиней, овець, коней — переважно біля дому.", "__Промисли.__ Полювання, рибальство, **бортництво** — збирання меду диких бджіл.", "__Ремесла.__ Найрозвиненіше — **чорна металургія** й ковальство: залізо виплавляли з болотної руди. Ліпили посуд, згодом на гончарному крузі. Ювеліри робили прикраси зі срібла й бронзи."], "imgs": [{"key": "prague", "cap": "Посуд празької культури, VI – VII ст. Фото: Zde / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "s81_11272", "cap": "Посуд давніх слов’ян"}, {"key": "penk_fib", "cap": "Пальчаста фібула пеньківської культури. Фото: Макси-Макт / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Як жили давні слов’яни", "title": "Поселення й житла", "badges": [], "paras": ["Слов’яни селилися **над річками й озерами**: тут була вода, риба, родючі заплави.", "Типове житло — **напівземлянка**: яма завглибшки до метра, над нею зруб і двосхилий дах. У кутку — піч-кам’янка. В одному селищі зазвичай 10–20 таких хат.", "Для захисту будували **городища** — укріплені поселення з валом, ровом і частоколом. Відоме городище VI–VII ст. — **Зимне** на Волині.", "Згодом у центрах союзів племен виростали міста — **Київ**, Чернігів, Іскоростень."], "imgs": [{"key": "modra_pec", "cap": "Піч у напівземлянці (реконструкція, Модра, Чехія). Фото: Mercy / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "Як жили давні слов’яни", "title": "Вірування давніх слов’ян", "badges": [], "paras": ["Слов’яни були **язичниками**: обожнювали сили природи й поклонялися багатьом богам.", "**Перун** — бог грому й блискавки, покровитель князя й дружини. **Дажбог** — бог сонця й світла. **Сварог** — бог неба й вогню. **Велес** — покровитель худоби й багатства. **Мокоша** — богиня родючості й жіночої праці. **Стрибог** — бог вітрів.", "Богам ставили дерев’яні й кам’яні **ідоли** на **капищах**, приносили жертви. Обряди вели волхви.", "Слов’яни вірили в духів-охоронців дому й природи: домовика, лісовика, русалок. Шанували предків."], "imgs": [{"key": "s73_9218", "cap": "Язичницький обряд (сучасна художня реконструкція)"}]}, {"type": "monument", "title": "Збруцький ідол", "badges": [], "img": {"key": "zbruch_o98", "cap": "Збруцький ідол. Археологічний музей, Краків. Фото: Silar / Wikimedia Commons, CC BY-SA 3.0"}, "paras": ["Кам’яна статуя **заввишки понад 2,5 м**. Її знайшли в **1848 р.** у річці **Збруч** біля Гусятина на Тернопільщині. Нині вона в Археологічному музеї в Кракові.", "Ідол чотиригранний, на кожній грані — **три яруси**:", "• вгорі — **небо**: чотири божества під однією шапкою;", "• посередині — **земля**: люди;", "• внизу — **підземний світ**: божество, що тримає землю.", "Найчастіше датують **IX – X ст.**, але час створення дискусійний.", "__Як упізнати на НМТ:__ високий кам’яний стовп, угорі обличчя під круглою шапкою."]}, {"type": "carousel", "title": "Мистецтво давніх слов’ян", "badges": [], "note": "Прикраси з Мартинівського скарбу (Черкащина) та інших скарбів VI – VII ст. приписують антам. Срібні фігурки чоловіків у сорочках із вишитою вставкою вважають найдавнішим зображенням слов’янського одягу.", "items": [{"key": "s81_11266", "name": "", "desc": "Срібні фігурки лева й людини, Мартинівський скарб, VI – VII ст.", "cap": ""}, {"key": "s81_11268", "name": "", "desc": "Пальчаста фібула (застібка для одягу)", "cap": ""}, {"key": "s81_11270", "name": "", "desc": "Прикраси й нагрудний набір", "cap": ""}]}, {"type": "defs", "title": "Як змінювалися релігійні погляди людей", "badges": ["поза програмою"], "items": [{"name": "Первісні вірування", "paras": ["Кам’яний вік. **Анімізм** — віра в душі й духів. **Тотемізм** — віра в споріднення роду з твариною. **Фетишизм** — поклоніння предметам-оберегам. **Магія**, **шаманізм**."], "img": null}, {"name": "Політеїзм", "paras": ["Віра в багатьох богів, кожен «відповідає» за свою сферу. Поширився з землеробством і першими державами. У давніх слов’ян — **язичництво**."], "img": null}, {"name": "Національні релігії", "paras": ["Поширені переважно серед одного народу: **юдаїзм**, **індуїзм**, **синтоїзм**, **конфуціанство** (часто вважають радше вченням)."], "img": null}, {"name": "Світові релігії", "paras": ["Відкриті для всіх народів: **буддизм** (найдавніша), **християнство**, **іслам** (наймолодша)."], "img": null}], "note": null}]}, {"id": "s4", "num": "IV", "title": "Підсумки всієї теми", "sub": "Обов’язкові поняття, дати й пам’ятки, велика стрічка часу", "cover": {"key": "zbruch_pd", "cap": ""}, "cards": [{"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "Хто й коли", "paras": ["**Венеди** — I–II ст., римські автори (Пліній, Тацит, Птолемей).", "**Анти й склавини** — V–VII ст., візантійці й Йордан."], "img": null}, {"name": "Анти чи склавини", "paras": ["**Анти** — між Дністром і Дніпром.", "**Склавини** — від Дунаю до Дністра й Вісли."], "img": null}, {"name": "Не переплутайте", "paras": ["**Велике переселення народів** — IV–VII ст., поштовх дали гуни.", "**Велике розселення слов’ян** — друга пол. V – VII ст."], "img": null}, {"name": "Три гілки", "paras": ["Українці, білоруси, росіяни — **східні**.", "Поляки, чехи, словаки — **західні**. Болгари, серби, хорвати — **південні**."], "img": null}], "note": null}, {"type": "generic", "title": "Обов’язкові поняття всієї теми", "badges": ["НМТ: поняття"], "blocks": [{"k": "p", "paras": ["**Палеоліт** — давній кам’яний вік, найдавніший період історії людства.", "**Мезоліт** — середній кам’яний вік: мікроліти, лук і стріли, човни.", "**Неоліт** — новий кам’яний вік: перехід до землеробства й скотарства.", "**Неолітична революція** — перехід від привласнювального до відтворювального господарства.", "**Привласнювальне господарство** — людина бере в природі готове: збиральництво, мисливство, рибальство.", "**Відтворювальне господарство** — людина сама виробляє потрібне: землеробство, скотарство, ремесло.", "**Археологічна культура** — пам’ятки однієї доби на певній території зі спільними рисами."], "italic": false}, {"k": "sep"}, {"k": "p", "paras": ["**Енеоліт** — мідно-кам’яний вік: перші мідні знаряддя поряд із кам’яними.", "**Бронзовий вік** — знаряддя й зброю роблять із бронзи, сплаву міді й олова.", "**Ранній залізний вік** — масове поширення залізних знарядь і зброї.", "**Кочовик** — люди le", "q": "Територію поширення археологічної культури, про яку йдеться в уривку, позначено на картосхемі цифрою", "sec": "", "g": "", "src": "«…Поселення займало сотні гектарів: глиняні будинки стояли кількома колами довкола вільного майдану. Серед знахідок — посуд, розписаний чорною, червоною й білою фарбами, глиняні жіночі статуетки, зернотерки, мідні шила й рибальські гачки…»", "srccap": "З опису археологічних розкопок. Переказ.", "img": ["q_c8f0c5fbec"], "cap": "Картосхема. Межі територій схематичні.", "opts": ["1", "2", "3", "4"]}, {"id": "ix-9", "n": 9, "t": "single", "q": "Бронзові знаряддя, подібні до зображених на малюнку, поширилися в добу, коли", "sec": "", "g": "", "img": ["q_ff46c32e26"], "cap": "1 — малюнок знахідки: The Portable Antiquities Scheme, CC BY-SA 2.0; 2 — малюнок за фото Derby Museums Trust, CC BY-SA 4.0 (Wikimedia Commons).", "opts": ["люди вперше почали обробляти мідь.", "на узбережжі виникли міста-колонії.", "люди вперше перейшли до землеробства.", "у степах з’явилися кочовики-скотарі."]}, {"id": "ix-10", "n": 10, "t": "single", "q": "Народ, про який ідеться в уривку,", "sec": "", "g": "", "src": "«…Там кіммерійських мужів і місто, і край їхній, оповиті вічно туманом і хмарами; ніколи на них не дивиться ясне сонце своїм промінням…»", "srccap": "Гомер, «Одіссея» (VIII ст. до н. е.). Переклад, скорочено.", "opts": ["витіснив скіфів до Криму й пониззя Дніпра в III ст. до н. е.", "розгромив державу готів у IV ст. н. е. й рушив на захід.", "панував у степах Північного Причорномор’я до приходу скіфів.", "заснував на узбережжі Чорного моря Ольвію та Херсонес."]}, {"id": "ix-11", "n": 11, "t": "single", "q": "Велика грецька колонізація Північного Причорномор’я відбувалася в", "sec": "", "g": "", "opts": ["IV–III тис. до н. е.", "III–IV ст. н. е.", "V–VII ст. н. е.", "VIII–VI ст. до н. е."]}, {"id": "ix-12", "n": 12, "t": "single", "q": "Місто, руїни якого зображено на фото,", "sec": "", "g": "", "img": ["q_5cbbae7003"], "cap": "Фото: Maxim Gavrilyuk, Wikimedia Commons, CC BY-SA 4.0", "opts": ["заснували грецькі колоністи на південно-західному узбережжі Криму.", "було столицею Скіфії Малої, де правили пізні скіфські царі.", "збудували готи як фортецю під час Великого переселення народів.", "було резиденцією перського намісника в Північному Причорномор’ї."]}, {"id": "ix-13", "n": 13, "t": "single", "q": "Головним товаром, який античні міста Північного Причорномор’я вивозили до Греції, було", "sec": "", "g": "", "opts": ["вино.", "оливкова олія.", "зерно.", "мармур."]}, {"id": "ix-14", "n": 14, "t": "single", "q": "Античні міста-колонії Північного Причорномор’я були полісами. Це означає, що", "sec": "", "g": "", "opts": ["усі міста підпорядковувалися одному спільному царю й платили йому данину.", "містами керували намісники, яких призначали з Афін на певний строк.", "влада в містах належала жерцям храмів Аполлона, покровителя колоністів.", "кожне місто мало власні закони, народні збори й виборних посадовців."]}, {"id": "ix-15", "n": 15, "t": "single", "q": "Зображену на фото пам’ятку знайдено під час розкопок", "sec": "", "g": "", "img": ["q_7c13fe33e0"], "cap": "Фото: Wikimedia Commons, суспільне надбання", "opts": ["городища — укріпленого поселення на пагорбі.", "кургану — земляного насипу над похованням знаті.", "стоянки — тимчасового табору мисливців.", "протоміста — великого поселення землеробів."]}, {"id": "ix-16", "n": 16, "t": "single", "q": "Однією з причин занепаду Великої Скіфії в III ст. до н. е. був наступ", "sec": "", "g": "", "opts": ["гунів, що прийшли з Азії.", "війська перського царя Дарія I.", "готів із берегів Балтики.", "сарматів зі сходу, з-за Дону."]}, {"id": "ix-17", "n": 17, "t": "single", "q": "Початок Великого переселення народів у Північному Причорномор’ї пов’язаний із", "sec": "", "g": "", "opts": ["вторгненням гунів, які розгромили державу готів.", "походом перського царя Дарія I на скіфські степи.", "витісненням скіфів сарматами до Криму й пониззя Дніпра.", "заснуванням грецьких /* підпис: опис — звичайним шрифтом, автор і ліцензія — дрібно, щоб не відволікали від зображення */
const CREDIT = /((?:^|[.;,]\s+|\s)(?:Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення)[^:]{0,25}:.*|(?:^|[.;,]\s+)(?:Суспільне надбання|Public domain|Wikimedia Commons|CC BY|CC0).*|\s*\((?:фото|малюнок)[^)]*\)\s*)$/i;

  if (!m || m.index === 0 && !/^\s*(Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення|Суспільне|Public|Wikimedia|CC)/i.test(cap)) return md(cap);

/* Курс: вхід учня, бліци після частин, замки, Тест 1 і Тест 2, відправлення результатів у Google-таблицю.

/* ---------- зв’язок із сервером: черга, щоб нічого не губилося без інтернету ---------- */
const Net = {
  async call(body) {
    if (!API) throw new Error('no api');
    const u = U.user; if (u && u.pin && body.pin == null) body = { ...body, pin: u.pin };
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), cache: 'no-store', redirect: 'follow' });
    if (!r.ok) throw new Error('http ' + r.status);

  },
  send(op, data) {

    const q = store.get('queue', []);

    store.set('queue', q); this.flush();

  busy: false,
  async flush() {

  const nb = app.querySelector('.wrap > .btn[data-go]');
  if (nb) { nb.insertAdjacentHTML('beforebegin', card); if (!U.passed('b' + n)) nb.remove(); }
  else app.querySelector('.wrap').insertAdjacentHTML('beforeend', card + (U.passed('b3') ? `<button class="btn" data-go="home" style="margin-top:20px">До тестів →</button>` : ''));
  wireGo();
};
function lockedPart(L, n) {
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${n}</span></div></div>
  <div class="wrap"><div class="home-head"><h1>🔒 ${esc(L.part)}</h1>
    <div class="sub">Ця частина відкриється, коли ви пройдете бліц частини ${n - 1} (потрібно 75 %).</div></div>
    <button class="btn" data-go="blitz${n - 1}">До бліцу частини ${n - 1}</button></div>`;
  wireGo(); window.scrollTo(0, 0);
}
section = function (L, s) {
  if (needLogin()) return login();
  const n = LESSONS.indexOf(L) + 1;
  if (!unlocked(n)) return lockedPart(L, n);
  _section(L, s);
  const sent = store.get('ev', []), k = `${L.id}-${s.id}`;
  if (!sent.includes(k)) { sent.push(k); store.set('ev', sent); Net.send('event', { what: 'розділ', part: n, sec: s.num, title: s.title }); }
  if (L.sections[L.sections.length - 1] === s && !U.passed('b' + n)) {
    const end = app.querySelector('.end > .btn:not(.ghost)');
    const b = `<button class="btn" data-go="blitz${n}">Далі: бліц частини ${n} →</button>`;
    if (end) end.outerHTML = b; else app.querySelector('.end').insertAdjacentHTML('afterbegin', b);
    wireGo();
  }
};

/* ---------- бліц ---------- */
function draw(n) {
  const B = QUIZ.blitz[n], seen = new Set(store.get('bseen' + n, [])), used = new Set(), out = [];
  const take = list => { for (const q of list) { if (out.length >= B.n) return; if (out.includes(q) || (q.g && used.has(q.g))) continue; out.push(q); if (q.g) used.add(q.g); return true; } };
  const fresh = list => shuffle(list).sort((a, b) => seen.has(a.id) - seen.has(b.id));
  Object.entries(B.quota).forEach(([sec, k]) => { const c = fresh(B.pool.filter(q => q.sec === sec)); for (let i = 0; i < k; i++) if (!take(c)) break; });
  while (out.length < B.n && take(fresh(B.pool))) {}
  const order = Object.keys(B.quota);
  out.sort((a, b) => order.indexOf(a.sec) - order.indexOf(b.sec));
  return out;
}
function pic(key, cls) {
  const i = IMGS[key]; if (!i) return '';
  return `<div class="pic ${cls || ''}" data-src="${i.src}" data-cap=""><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""><span class="zoom-hint">⤢</span></div>`;
}
/* зображення-варіант: вибір — дотиком до плитки, збільшення — лише кнопкою ⤢ */
function opic(key) {
  const i = IMGS[key]; if (!i) return '';
  return `<span class="oi"><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""><span class="zoom-hint pic" data-src="${i.src}" data-cap="">⤢</span></span>`;
}
const optHtml = (q, j) => `${q.oimg ? opic(q.oimg[j]) : ''}${isLbl(q) ? '' : `<span>${md(q.opts[j])}</span>`}`;

const Blitz = {
  start(n) {
    this.n = n; this.qs = draw(n).map(q => ({ ...q, order: showOrder(q) }));
    this.i = 0; this.pts = 0; this.max = this.qs.reduce((a, q) => a + maxOf(q), 0); this.log = [];
    const s = new Set(store.get('bseen' + n, [])); this.qs.forEach(q => s.add(q.id)); store.set('bseen' + n, [...s]);
    this.show();
  },
  top() { return `<div class="bz-top"><span class="cnt">Бліц ${this.n} · питання ${this.i + 1} з ${this.qs.length}</span><span class="pts">${this.pts} б.</span>
      <button class="x" data-go="p${this.n}" aria-label="Вийти з бліцу">✕</button></div>`; },
  show() {
    const q = this.qs[this.i]; this.sel = q.t === 'match' ? [null, null, null, null] : [];
    let tiles;
    if (q.t === 'match') {
      tiles = mlist(q, q.order) +
        q.left.map((l, i) => `<div class="mrow"><div class="ml"><b>${i + 1}.</b> ${q.rimg ? pic(q.rimg[i], 'ri') : ''}${/^\d$/.test(l) ? '' : md(l)}</div><div class="mbtns">${q.order.map((j, k) =>
          `<button class="mb" data-i="${i}" data-j="${j}">${LET[k]}</button>`).join('')}</div></div>`).join('');
    } else {
      tiles = q.order.map((j, k) => `<button class="tile ${q.t === 'single' && !q.oimg ? 'c' + k : 'n'}${q.oimg ? ' wi' : ''}" data-j="${j}"><span class="l">${lab(q, j, k)}</span>${optHtml(q, j)}</button>`).join('');
      if (q.oimg) tiles = `<div class="tgrid">${tiles}</div>`;
    }
    const act = q.t === 'single' ? '' : `<div class="bz-act"><button class="btn ghost" id="bzr">Скинути</button><button class="btn" id="bzok" disabled>Відповісти</button></div>`;
    app.innerHTML = `<div class="wrap bz-in">${this.top()}<div class="qtype">${TYPE[q.t]}${q.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      <div class="qtext">${md(q.q).replace(/\n/g, '<br>')}</div>${(q.img || []).map(k => pic(k, 'qi')).join('')}
      <div class="tiles" id="tl">${tiles}</div>${act}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const tl = document.getElementById('tl');
    tl.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; this.pick(q, +b.dataset.j); });
    tl.querySelectorAll('.mb').forEach(b => b.onclick = () => { this.sel[+b.dataset.i] = +b.dataset.j; this.paintMatch(); });
    if (q.t !== 'single') {
      document.getElementById('bzr').onclick = () => { this.sel = q.t === 'match' ? [null, null, null, null] : []; q.t === 'match' ? this.paintMatch() : this.paintSel(q); };
      document.getElementById('bzok').onclick = () => this.answer(q);
    }
  },
  pick(q, j) {
    if (q.t === 'single') { this.sel = [j]; return this.answer(q); }
    const k = this.sel.indexOf(j);
    if (k >= 0) this.sel.splice(k, 1); else if (this.sel.length < (q.t === 'three' ? 3 : 4)) this.sel.push(j);
    this.paintSel(q);
  },
  paintSel(q) {
    document.querySelectorAll('#tl .tile').forEach(b => {
      const j = +b.dataset.j, k = this.sel.indexOf(j), l = b.querySelector('.l, .ord');
      b.classList.toggle('sel', k >= 0);
      if (q.t === 'seq') { l.className = k >= 0 ? 'ord' : 'l'; l.textContent = k >= 0 ? k + 1 : lab(q, j, q.order.indexOf(j)); }
    });
    document.getElementById('bzok').disabled = this.sel.length !== (q.t === 'three' ? 3 : 4);
  },
  paintMatch() {
    document.querySelectorAll('#tl .mb').forEach(b => b.classList.toggle('on', this.sel[+b.dataset.i] === +b.dataset.j));
    document.getElementById('bzok').disabled = this.sel.some(x => x === null);
  },
  answer(q) {
    let p = 0; const m = maxOf(q);
    if (q.t === 'single') p = this.sel[0] === q.ok[0] ? 1 : 0;
    else if (q.t === 'three') p = this.sel.filter(j => q.ok.includes(j)).length;
    else if (q.t === 'match') p = this.sel.filter((j, i) => j === q.ok[i]).length;
    else if (this.sel.every((j, k) => j === k)) p = 3; else if (this.sel[0] === 0 && this.sel[3] === 3) p = 2; else if (this.sel[0] === 0 || this.sel[3] === 3) p = 1;
    this.pts += p; this.log.push({ id: q.id, p, m });
    document.querySelectorAll('#tl .mb').forEach(b => { const i = +b.dataset.i, j = +b.dataset.j; b.disabled = true;
      if (q.ok[i] === j) b.classList.add('right'); else if (this.sel[i] === j) b.classList.add('wrong'); });
    document.querySelectorAll('#tl .tile').forEach(b => { const j = +b.dataset.j; b.disabled = true; if (q.t === 'seq') return;
      if (q.ok.includes(j)) b.classList.add('right'); else if (this.sel.includes(j)) b.classList.add('wrong'); else b.classList.add('dim'); });
    const act = document.querySelector('.bz-act'); if (act) act.remove();
    const L2 = j => lab(q, j, q.order.indexOf(j));
    const extra = q.t === 'match' ? `<div>Правильно: ${q.left.map((l, i) => `${i + 1} — ${L2(q.ok[i])}`).join(', ')}</div>`
      : q.t === 'seq' ? `<div>Правильний порядок: ${q.opts.map((o, j) => L2(j)).join(' → ')}</div>` : '';
    const last = this.i === this.qs.length - 1;
    document.querySelector('.bz-top .pts').textContent = this.pts + ' б.';
    document.querySelector('.bz-in').insertAdjacentHTML('beforeend', `<div class="fb ${p === m ? 'good' : p ? 'part' : 'bad'}">
      <div class="h">${p === m ? 'Правильно!' : p ? 'Частково правильно' : 'Неправильно'} · ${p} з ${m}</div>${extra}</div>
      <button class="btn" id="bzn">${last ? 'Результат' : 'Далі →'}</button>`);
    const nx = document.getElementById('bzn'); nx.onclick = () => { if (last) this.finish(); else { this.i++; this.show(); } };
    nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },
  finish() {
    const n = this.n, pc = pct(this.pts, this.max), pass = pc >= 75, prev = U.prog()['b' + n] || { pct: 0, pass: false };
    U.setProg('b' + n, { pct: Math.max(pc, prev.pct), pass: pass || !!prev.pass });
    const tries = store.get('btries' + n, 0) + 1; store.set('btries' + n, tries);
    Net.send('blitz', { part: n, attempt: tries, pts: this.pts, max: this.max, pct: pc, pass, qs: this.log });
    const errs = {}; this.log.forEach((r, k) => { if (r.p < r.m) { const s = this.qs[k].sec; errs[s] = (errs[s] || 0) + 1; } });
    const L = LESSONS[n - 1], weak = Object.entries(errs).sort((a, b) => b[1] - a[1]).map(([s, c]) => { const S = L.sections.find(x => x.id === s);
      return `<button class="sec-btn" data-go="${L.id}-${s}"><span class="num">${S.num}</span><span><h3>${md(S.title)}</h3><div class="st">помилок: ${c}</div></span></button>`; }).join('');
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">Бліц частини ${n}</span><button class="x" data-go="p${n}" aria-label="Закрити" style="margin-left:auto">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${pc}%</div><div class="cap">${this.pts} з ${this.max} балів</div>
        <div class="gr ${pass ? 'okc' : 'badc'}">${pass ? (n < 3 ? `Пройдено! Частину ${n + 1} відкрито.` : 'Пройдено! Тест 1 відкрито, якщо всі бліци пройдено.') : 'Потрібно 75 %. Повторіть розділи нижче і спробуйте ще раз.'}</div></div>
      ${pass ? `<button class="btn" data-go="${n < 3 ? 'p' + (n + 1) : 'home'}">${n < 3 ? `До частини ${n + 1} →` : 'До тестів →'}</button>` : ''}
      <button class="btn ${pass ? 'ghost' : ''}" id="again">Пройти бліц ще раз</button>
      ${weak ? `<div class="h2" style="margin:8px 0 0">Варто повторити</div><div class="sec-list">${weak}</div>` : ''}
      <div class="sync" id="sync"></div></div>`;
    wireGo(); paintSync(); window.scrollTo(0, 0);
    document.getElementById('again').onclick = () => this.start(n);
  },
};

/* ---------- тести (без підказок; бали рахує сервер) ---------- */
const Test = {
  open(id) {
    this.id = id; this.T = QUIZ.tests[id];
    if (store.get('queue', []).some(x => x.op === 'test' && x.test === id)) return this.pending();
    const d = store.get('draft_' + id, null), r = U.prog()[id];
    if (d) { this.ans = d; return this.render(); }
    if (r && r.pts != null) return this.result(r);
    this.ans = {}; this.render();
  },
  intro() {
    const T = this.T, n = k => T.tasks.filter(t => t.t === k).length;
    return `<div class="card tintro"><h2>${esc(T.name)}</h2><p>${T.tasks.length} завдань, як на НМТ: ${n('single')} — одна правильна відповідь, ${n('match')} — відповідність, ${n('seq')} — послідовність, ${n('three')} — три з семи.
      Бали — за правилами НМТ.${this.id === 't1' ? ' Щоб отримати допуск до Тесту 2, потрібно <b>75 %</b> балів.' : ''}</p>
      <p class="cap">Підказок під час тесту немає. Відповіді зберігаються на телефоні, тож тест можна продовжити пізніше. Надсилайте, коли відповісте на все.</p></div>`;
  },
  render() {
    const T = this.T;
    const nav = T.tasks.map((t, k) => `<a href="#" class="nv${this.done(t) ? ' on' : ''}" data-k="${k}">${t.n}</a>`).join('');
    app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Назад</button><span class="ttl">${esc(T.name)}</span></div></div>
      <div class="wrap">${this.intro()}<div class="tnav stk" id="tnav">${nav}</div>${T.tasks.map((t, k) => this.task(t, k)).join('')}
      <div class="tsend"><div class="cap" id="tleft"></div><button class="btn" id="tsub">Надіслати відповіді</button></div><div class="dlg" id="dlg" hidden></div></div>`;
    wireGo(); window.scrollTo(0, 0);
    document.getElementById('tnav').onclick = e => { const a = e.target.closest('.nv'); if (!a) return; e.preventDefault();
      document.getElementById('tk' + a.dataset.k).scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    T.tasks.forEach((t, k) => this.wire(t, k));
    document.getElementById('tsub').onclick = () => this.confirm();
    this.left();
  },
  done(t) { const a = this.ans[t.n]; return t.t === 'match' ? !!a && a.every(x => x !== null) : t.t === 'single' ? a != null : !!a && a.length === (t.t === 'three' ? 3 : 4); },
  task(t, k) {
    const a = this.ans[t.n];
    let body;
    if (t.t === 'match') {
      const sel = a || [null, null, null, null];
      body = mlist(t, [...t.opts.keys()]) +
        t.left.map((l, i) => `<div class="mrow"><div class="ml"><b>${i + 1}.</b> ${t.rimg ? pic(t.rimg[i], 'ri') : ''}${/^\d$/.test(l) ? '' : md(l)}</div><div class="mbtns">${t.opts.map((o, j) =>
          `<button class="mb${sel[i] === j ? ' on' : ''}" data-i="${i}" data-j="${j}">${LET[j]}</button>`).join('')}</div></div>`).join('');
    } else {
      const sel = t.t === 'single' ? (a == null ? [] : [a]) : (a || []);
      body = t.opts.map((o, j) => { const k2 = sel.indexOf(j);
        return `<button class="tile n${t.oimg ? ' wi' : ''}${k2 >= 0 ? ' sel' : ''}" data-j="${j}"><span class="${t.t === 'seq' && k2 >= 0 ? 'ord' : 'l'}">${t.t === 'seq' && k2 >= 0 ? k2 + 1 : lab(t, j, j)}</span>${optHtml(t, j)}</button>`; }).join('');
      if (t.oimg) body = `<div class="tgrid">${body}</div>`;
      if (t.t !== 'single') body += `<button class="lnk rst" data-r="1">Скинути відповідь</button>`;
    }
    return `<section class="card task" id="tk${k}"><div class="qtype">Завдання ${t.n} · ${TYPE[t.t]}${t.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      ${t.src ? `<div class="quote"><p>${md(t.src)}</p>${t.srccap ? `<div class="src">${esc(t.srccap)}</div>` : ''}</div>` : ''}
      <div class="qtext">${md(t.q).replace(/\n/g, '<br>')}</div>${(t.img || []).map(x => pic(x, 'qi')).join('')}<div class="tiles">${body}</div>${t.cap ? `<div class="cap"><span class="cr">${esc(t.cap)}</span></div>` : ''}</section>`;
  },
  wire(t, k) {
    const el = document.getElementById('tk' + k);
    const re = () => { el.outerHTML = this.task(t, k); this.wire(t, k); store.set('draft_' + this.id, this.ans);
      document.querySelector(`.nv[data-k="${k}"]`).classList.toggle('on', this.done(t)); this.left(); };
    el.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; const j = +b.dataset.j;
      if (t.t === 'single') this.ans[t.n] = j;
      else { const s = this.ans[t.n] || [], i = s.indexOf(j); if (i >= 0) s.splice(i, 1); else if (s.length < (t.t === 'three' ? 3 : 4)) s.push(j); this.ans[t.n] = s; }
      re(); });
    el.querySelectorAll('.mb').forEach(b => b.onclick = () => { const s = this.ans[t.n] || [null, null, null, null]; s[+b.dataset.i] = +b.dataset.j; this.ans[t.n] = s; re(); });
    const r = el.querySelector('.rst'); if (r) r.onclick = () => { delete this.ans[t.n]; re(); };
  },
  left() { const n = this.T.tasks.filter(t => !this.done(t)).length; document.getElementById('tleft').textContent = n ? `Без відповіді: ${n}` : 'Відповіді є на всі завдання.'; },
  confirm() {
    const n = this.T.tasks.filter(t => !this.done(t)).length, d = document.getElementById('dlg');
    d.hidden = false;
    d.innerHTML = `<div class="dlg-in"><h3>Надіслати відповіді?</h3><p>${n ? `Без відповіді залишилося <b>${n}</b> завд. — за них буде 0 балів.` : 'Відповіді є на всі завдання.'} Змінити відповіді після надсилання не можна.</p>
      <button class="btn" id="dy">Надіслати</button><button class="btn ghost" id="dn">Повернутися до тесту</button></div>`;
    document.getElementById('dn').onclick = () => { d.hidden = true; };
    document.getElementById('dy').onclick = () => {
      const answers = this.T.tasks.map(t => this.ans[t.n] == null ? null : this.ans[t.n]);
      store.set('draft_' + this.id, null);
      Net.send('test', { test: this.id, answers });
      this.pending();
    };
  },
  pending() {
    app.innerHTML = `<div class="wrap bz-in"><div class="res"><div>${esc(this.T.name)}</div><div class="big">⏳</div>
      <div class="cap">Відповіді збережено. Результат з’явиться, щойно телефон зв’яжеться з сервером.</div></div>
      <div class="sync" id="sync"></div><button class="btn ghost" data-go="home">На головну</button></div>`;
    wireGo(); paintSync(); Net.flush();
  },
  result(r) {
    const t1 = this.id === 't1';
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">${esc(this.T.name)}</span><button class="x" data-go="home" style="margin-left:auto" aria-label="Закрити">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${r.pts} з ${r.max}</div><div class="cap">${r.pct}% балів</div>${t1 ? '' : `<div class="gr">За шкалою НМТ (100–200): <b>${esc(r.scale)}</b></div>`}
      ${t1 ? `<div class="gr ${r.pass ? 'okc' : 'badc'}">${r.pass ? 'Допуск отримано — Тест 2 відкрито.' : 'Потрібно 75 %. Повторіть матеріал і пройдіть тест ще раз.'}</div>` : ''}</div>
      ${r.per ? `<div class="h2" style="margin:8px 0 0">Бали за завданнями</div><div class="tnav">${r.per.map((p, k) => `<span class="nv ${p === maxOf(this.T.tasks[k]) ? 'on' : p ? 'pt' : 'no'}">${k + 1}<i>${p}</i></span>`).join('')}</div>` : ''}
      ${t1 && !r.pass ? `<button class="btn" id="retry">Пройти Тест 1 ще раз</button>` : ''}
      ${t1 && r.pass ? `<button class="btn" data-go="home">До Тесту 2 →</button>` : `<button class="btn ghost" data-go="home">На головну</button>`}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const rb = document.getElementById('retry'); if (rb) rb.onclick = () => { store.set('draft_' + this.id, {}); this.ans = {}; this.render(); };
  },
};

/* ---------- маршрути ---------- */
const _route = route;
route = function () {
  const h = location.hash.slice(1);
  if (needLogin() && h) { history.replaceState(null, '', location.pathname); return login(); }
  let m = h.match(/^blitz([123])$/);
  if (m) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.start(n); }
  m = h.match(/^(t[12])$/);
  if (m) { if (!QUIZ.tests[m[1]] || !testOpen(m[1])) { location.hash = 'home'; return; } return Test.open(m[1]); }
  return _route();
};
window.removeEventListener('hashchange', _route);
window.addEventListener('hashchange', () => route());
route();
Net.flush();

</script>

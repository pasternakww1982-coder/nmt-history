": "s2", "g": "p2_ostrstate", "t": "single", "opts": ["Велике князівство Литовське.", "Річ Посполита.", "Русь-Україна.", "Велике князівство Московське."], "ok": [0], "expl": "Острозький очолював військо Великого князівства Литовського. Річ Посполита постала в 1569 р., уже після його смерті (1530)."}, {"id": "z23839", "q": "Князь Костянтин Іванович Острозький уславився як полководець часів", "sec": "s2", "g": "p2_ostrstate", "t": "single", "opts": ["Руси-України (Київської держави).", "Речі Посполитої.", "Галицько-Волинської держави.", "Великого князівства Литовського."], "ok": [3], "expl": "Острозький (бл. 1460 – 1530) був великим гетьманом литовським. Річ Посполита постала лише в 1569 р."}, {"id": "k049", "q": "Яку з наведених земель Велике князівство Литовське втратило на початку XVI ст.?", "sec": "s2", "g": "p2_chern", "t": "single", "opts": ["Берестейщину й Підляшшя", "Київщину", "Волинь із Луцьком", "Чернігово-Сіверщину"], "ok": [3], "expl": "Сіверські князі перейшли на бік Москви, і за перемир’ям 1503 р. Литва втратила Чернігово-Сіверщину — майже третину своєї території."}, {"id": "f169", "q": "У результаті московсько-литовських війн кінця XV – початку XVI ст.", "sec": "s2", "g": "p2_chern", "t": "single", "opts": ["ліквідовано Київське і Волинське удільні князівства у складі Литви", "Велике князівство Литовське і Польське королівство уклали Кревську унію", "чернігово-сіверські землі увійшли до складу Московської держави", "православне населення Литви перейшло в підпорядкування московському митрополитові"], "ok": [2], "expl": "За перемир’ям 1503 р. Литва визнала за Москвою Чернігів, Новгород-Сіверський і Стародуб. Перемога під Оршею (1514) їх не повернула: Чернігово-Сіверщина лишалася московською до 1618 р."}, {"id": "np2_vedrosha", "q": "У битві на якій річці 1500 р. московське військо розбило литовське й узяло в полон князя Костянтина Острозького?", "sec": "s2", "g": "p2_vedrosha", "t": "single", "opts": ["на Ведроші", "на Ворсклі", "на Синіх Водах", "на Дніпрі під Оршею"], "ok": [0], "expl": "14 липня 1500 р. на Ведроші литовське військо зазнало поразки, а Острозький потрапив у полон. Сім років він провів у неволі й лише в 1507 р. утік до Литви."}, {"id": "np2_smol", "q": "Яке місто захопило московське військо напередодні битви під Оршею?", "sec": "s2", "g": "p2_smol", "t": "single", "opts": ["Смоленськ", "Київ", "Вільно", "Чернігів"], "ok": [0], "expl": "Улітку 1514 р. Москва захопила Смоленськ. Острозький під Оршею зупинив її наступ, але Смоленськ лишився за Москвою."}, {"id": "np2_orshacons", "q": "Що стало наслідком перемоги війська Костянтина Острозького під Оршею?", "sec": "s2", "g": "p2_orshacons", "t": "single", "opts": ["Острозький зупинив наступ Москви вглиб Литви", "Литва приєднала Псков і Новгород", "Москва відмовилася від усіх руських земель", "Литва й Москва уклали вічний мир"], "ok": [0], "expl": "Орша — найбільша перемога литовсько-польського війська у війнах з Москвою, але кордону вона не змінила, а війна тривала до 1522 р."}, {"id": "k026", "q": "У середині XIV ст. Закарпаття входило до складу", "sec": "s3", "g": "p2_zakarp", "t": "single", "opts": ["Великого князівства Литовського", "Великого князівства Московського", "королівства Угорщина", "королівства Польща"], "ok": [2], "expl": "Закарпаття угорські королі поступово захопили ще в XI – XIII ст. і поділили на комітати. У складі Угорщини край перебував і в XIV – XVI ст."}, {"id": "k052", "q": "Яка з наведених українських земель у середині – другій половині XIV ст. була спірною між Польщею та Угорщиною?", "sec": "s3", "g": "p2_galhun", "t": "single", "opts": ["Волинь", "Поділля", "Галичина", "Закарпаття"], "ok": [2], "expl": "Угорські королі вважали Галичину своєю. Після смерті Казимира III (1370) нею правили угорські намісники, аж поки в 1387 р. Ядвіга не приєднала її до Польщі."}, {"id": "k055", "q": "Яке поняття доречно використовувати щодо становища Закарпаття з XIV до початку XX ст.?", "sec": "s3", "g": "p2_madyar", "t": "single", "opts": ["полонізація", "онімечення", "румунізація", "мадяризація"], "ok": [3], "expl": "Мадяризація — поширення угорської мови й звичаїв серед неугорського населення. Закарпаттям століттями правили угорські пани, тож русинів-українців утискали саме угорці (мадяри)."}, {"id": "ctM.39", "q": "До якого воєводства Польського королівства в середині XV ст. входила Галицька земля?", "sec": "s3", "g": "p2_ruske", "t": "single", "opts": ["Руського", "Брацлавського", "Київського", "Чернігівського"], "ok": [0], "expl": "У 1434 р. на землях Галичини утворили Руське воєводство з центром у Львові. Київське воєводство постало в Литві лише в 1471 р., Брацлавське — ще пізніше, Чернігівське — у XVII ст."}, {"id": "z8979", "q": "Укажіть державу, у складі якої до середини XVI ст. перебували Берестейщина, Підляшшя й Брацлавщина.", "sec": "s3", "g": "p2_vkllands", "t": "single", "opts": ["Велике князівство Литовське", "Угорське королівство", "Польське королівство", "Молдавське князівство"], "ok": [0], "expl": "До Люблінської унії 1569 р. Берестейщина, Підляшшя й Брацлавщина належали Литві, а Галичина, Холмщина й Белзчина — Польщі."}, {"id": "np2_mukach", "q": "Хто з князів наприкінці XIV ст., утративши свій уділ, отримав від угорського короля Мукачево з навколишніми землями?", "sec": "s3", "g": "p2_mukach", "t": "single", "opts": ["Федір Коріатович", "Семен Олелькович", "Василь Шемячич", "Дмитро-Корибут"], "ok": [0], "expl": "Подільського князя Федора Коріатовича вигнав Вітовт. Федір утік до Угорщини й у 1396 р. отримав Мукачево; за переказом, він заснував Миколаївський монастир на Чернечій горі."}, {"id": "np2_suchava", "q": "Столицею Молдавського князівства в 1388 – 1565 рр. було місто", "sec": "s3", "g": "p2_suchava", "t": "single", "opts": ["Сучава", "Хотин", "Кам’янець", "Мукачево"], "ok": [0], "expl": "Молдавське князівство постало в 1359 р., а його столицею тривалий час була Сучава. Хотин — молдавська фортеця на Дністрі, Кам’янець належав Польщі, Мукачево — Угорщині."}, {"id": "z9209", "q": "Кримське ханство утворилося в", "sec": "s4", "g": "p2_crdate", "t": "single", "opts": ["XIII ст.", "XIV ст.", "XV ст.", "XVI ст."], "ok": [2], "expl": "Кримське ханство постало в 40-х рр. XV ст., коли Хаджі-Герей за підтримки Литви став ханом у Криму. Дата з програми НМТ."}, {"id": "k120_", "q": "Кримське ханство утворилося в", "sec": "s4", "g": "p2_crdate", "t": "single", "opts": ["1240-х рр.", "1340-х рр.", "1440-х рр.", "1470-х рр."], "ok": [2], "expl": "Хаджі-Герей став ханом у 1440-х рр. — так постало Кримське ханство. 1240-ві — монгольська навала, у 1470-х рр. ханство вже стало залежним від Османів."}, {"id": "k057", "q": "Кримське ханство утворилося на землях, що входили до складу", "sec": "s4", "g": "p2_horde", "t": "single", "opts": ["Візантійської імперії", "Османської імперії", "Галицько-Волинської держави", "Золотої Орди"], "ok": [3], "expl": "Крим був улусом Золотої Орди. Коли Орда розпадалася, кримська знать покликала Хаджі-Герея, і ханство відокремилося від неї."}, {"id": "f168", "q": "Кримське ханство утворилося в результаті розпаду", "sec": "s4", "g": "p2_horde", "t": "single", "opts": ["Київської Русі", "Великого князівства Литовського", "Османської імперії", "Золотої Орди"], "ok": [3], "expl": "У XV ст. Золота Орда розпадалася на окремі ханства. Кримське відокремилося в 1440-х рр., а сама Орда остаточно розпалася на початку XVI ст."}, {"id": "k058_", "q": "До якого періоду історії Кримського ханства належать події, описані в уривку? «Згадавши Хаджі Ґерая, сина Гіяс ад-Діна, що перебував тоді чи то в Литві, чи то в Румелі [на Балканах], вони відправили до нього послів з числа найповажніших людей. Посли передали йому запрошення від імені кримських беїв та народу: „Прийди до нас і стань нашим ханом, посядь трон Юрту [Кримського улусу]“».", "sec": "s4", "g": "p2_hajidoc", "t": "single", "opts": ["утворення ханства", "визнання зверхності Османів", "найбільшого розквіту", "занепаду й ліквідації"], "ok": [0], "expl": "Кримські беї покликали Хаджі-Герея, який виріс у Литві, і він став першим ханом. Це 1440-ві рр. — утворення Кримського ханства."}, {"id": "k059_", "q": "Коли відбулися події, описані в уривку? «Султан Мехмед Хан, виявивши повагу до ханського роду, надав Менґлі Ґераю допомогу і затвердив його ханом усього Кримського Юрту. Після цього Менґлі Ґерай Хан повернувся і зійшов на престол батька свого в Криму. Відтоді і надалі хани Криму правили під захистом і зверхністю Високої Держави [Османської імперії]».", "sec": "s4", "g": "p2_vassal", "t": "single", "opts": ["1440 р.", "1478 р.", "1489 р.", "1514 р."], "ok": [1], "expl": "У 1475 р. османи полонили Менглі-Герея в Кафі, а в 1478 р. султан повернув його на престол як свого васала. Відтоді султан затверджував кримських ханів."}, {"id": "k121_", "q": "Кримське ханство визнало васальну залежність від Османської імперії в", "sec": "s4", "g": "p2_vassal", "t": "single", "opts": ["1440 р.", "1475 р.", "1478 р.", "1489 р."], "ok": [2], "expl": "1478 р. — дата з програми НМТ. У 1475 р. османи лише захопили Кафу й Мангуп і полонили хана Менглі-Герея; васалом султана він став у 1478 р."}, {"id": "ctM.37", "q": "Наприкінці XV ст. Кримське ханство потрапило у васальну залежність від", "sec": "s4", "g": "p2_vassal", "t": "single", "opts": ["Османської імперії", "Речі Посполитої", "Великого князівства Литовського", "австрійських Габсбургів"], "ok": [0], "expl": "З 1478 р. кримські хани були васалами османського султана: він затверджував ханів, а хан посилав військо в османські походи."}, {"id": "k063_", "q": "До 1475 р. міста Кафа, Судак, Чембало й Керч на узбережжі Криму належали", "sec": "s4", "g": "p2_genoa", "t": "single", "opts": ["князівству Феодоро", "республіці Генуя", "республіці Венеція", "Османській імперії"], "ok": [1], "expl": "На південному березі Криму були генуезькі колонії. У 1475 р. їх, а також Мангуп — столицю князівства Феодоро, — захопили османи."}, {"id": "k060_", "q": "Як називався з’їзд кримської знаті, що вирішував найважливіші питання держави?", "sec": "s4", "g": "p2_kurultai", "t": "single", "opts": ["курултай", "диван", "сейм", "віче"], "ok": [0], "expl": "Найважливіші питання в Кримському ханстві вирішував курултай — з’їзд знаті. Диван — постійна рада при хані, сейм — польські збори шляхти, віче — збори жителів руських міст."}, {"id": "ctM.36", "q": "Столицею Кримського ханства з 1532 р. було місто", "sec": "s4", "g": "p2_capital", "t": "single", "opts": ["Бахчисарай", "Кафа", "Перекоп", "Очаків"], "ok": [0], "expl": "Спершу столицею ханства був Кирк-Ор, а з 1532 р. — Бахчисарай. Кафа належала османам, Перекоп охороняв вхід на півострів, Очаків — фортеця в пониззі Дніпра."}, {"id": "ctM.49", "q": "Яка династія правила в Кримському ханстві?", "sec": "s4", "g": "p2_dyn", "t": "single", "opts": ["Османи", "Гераї", "Ногаї", "Сельджуки"], "ok": [1], "expl": "Засновник ханства Хаджі-Герей започаткував династію Гераїв (Гіреїв), яка правила Кримом до 1783 р. Османи правили Османською імперією."}, {"id": "np2_1482", "q": "Який кримський хан у 1482 р. напав на Київ, спалив місто й пограбував Софійський собор?", "sec": "s4", "g": "p2_kyiv1482", "t": "single", "opts": ["Менглі-Герей", "Хаджі-Герей", "Девлет-Герей", "Іслам-Герей"], "ok": [0], "expl": "Менглі-Герей, син Хаджі-Герея й союзник московського князя Івана III, у 1482 р. спалив Київ. Золоті чашу й дискос із Софійського собору він надіслав Іванові III."}, {"id": "z23840", "q": "Яким роком датовано першу згадку про українських козаків у писемних джерелах?", "sec": "s5", "g": "p2_cossdate", "t": "single", "opts": ["1385 р.", "1478 р.", "1489 р.", "1514 р."], "ok": [2], "expl": "Під 1489 р. польський хроніст Мартин Бєльський згадав козаків, описуючи похід королевича Яна Ольбрахта проти татар на Поділлі. Дата з програми НМТ."}, {"id": "k122_", "q": "Перша згадка про українських козаків у писемних джерелах припадає на", "sec": "s5", "g": "p2_cossdate", "t": "single", "opts": ["1478 р.", "1489 р.", "1503 р.", "1514 р."], "ok": [1], "expl": "1489 р. — перша згадка про козаків. 1478 р. — Крим став васалом Османів, 1503 р. — Литва втратила Чернігово-Сіверщину, 1514 р. — Орша."}, {"id": "ctM.5", "q": "До якого періоду належать перші письмові згадки про українських козаків?", "sec": "s5", "g": "p2_cossdate", "t": "single", "opts": ["початку XV ст.", "кінця XV ст.", "початку XVI ст.", "кінця XVI ст."], "ok": [1], "expl": "Перші згадки — 1489 і 1492 рр., тобто кінець XV ст. Козацтво виникло на прикордонні Київщини й Брацлавщини."}, {"id": "k006_", "q": "Яке поняття тюркського походження спершу означало вільну людину, вояка, не підвладного жодній державі?", "sec": "s5", "g": "p2_kozak", "t": "single", "opts": ["магістрат", "шляхтич", "козак", "цех"], "ok": [2], "expl": "Слово «козак» тюркського походження: спершу так називали татарських степових вояків, а згодом — вільних людей на українському прикордонні. Магістрат, шляхтич і цех — поняття міського й станового життя."}, {"id": "ctM.33", "q": "Яка верства українського суспільства сформувалася внаслідок освоєння Дикого поля?", "sec": "s5", "g": "p2_kozak", "t": "single", "opts": ["козацтво", "міщанство", "селянство", "шляхта"], "ok": [0], "expl": "У степ ішли селяни, міщани, шляхтичі — усі, хто шукав волі чи здобичі. На прикордонні з них і сформувалося козацтво."}, {"id": "k062_", "q": "Що було основною причиною появи Дикого поля наприкінці XV – у першій половині XVI ст.?", "sec": "s5", "g": "p2_dyke", "t": "single", "opts": ["постійні війни Литви з Великим князівством Московським", "масові втечі селян від панщини й кріпосного права", "переселення значної частини населення до Польщі", "спустошливі набіги кримських татар"], "ok": [3], "expl": "Кримські загони майже щороку нападали на південну Київщину й Брацлавщину й забирали людей у ясир. Ці землі спорожніли, і на південь від укріплених міст простягався безлюдний степ."}, {"id": "ctM.21", "q": "Що спричинило знелюднення в XV – XVI ст. значних територій України й утворення Дикого поля?", "sec": "s5", "g": "p2_dyke", "t": "single", "opts": ["входження українських земель до складу Великого князівства Литовського", "татарсько-турецькі напади", "польська експансія на українські землі", "розширення кордонів Московської держави"], "ok": [1], "expl": "Через постійні татарські набіги спорожніли південна Київщина й Брацлавщина: людей убивали або забирали в ясир, решта тікала на північ."}, {"id": "f020", "q": "Яке твердження характеризує наслідки татарських набігів на українські землі в XVI ст.?", "sec": "s5", "g": "p2_dyke", "t": "single", "opts": ["зростання кількості міст з магдебурзьким правом для оборони від набігів", "розширення Дикого поля внаслідок знелюднення прикордонних земель", "економічний занепад через припинення торгівлі шляхом «з варягів у греки»", "потрапляння українських удільних князівств у залежність від Кримського ханства"], "ok": [1], "expl": "Набіги знелюднювали прикордоння, і Дике поле ширилося на північ. Магдебурзьке право з набігами не пов’язане, а удільних князівств у XVI ст. уже не було."}, {"id": "ctM.17", "q": "Чим уславилися прикордонні старости Предслав Лянцкоронський і Остафій Дашкевич?", "sec": "s5", "g": "p2_magnates", "t": "single", "opts": ["створенням перших фільварків на українських землях", "виступом проти Берестейської церковної унії", "заснуванням братських шкіл у Львові й Києві", "походами разом із козаками проти татар і турків"], "ok": [3], "expl": "Перші великі походи козаків на татарські й турецькі фортеці очолювали прикордонні старости — Остафій Дашкевич і Предслав Лянцкоронський."}, {"id": "np2_uhod", "q": "Як називали міщан і селян, що щовесни йшли озброєними гуртами на промисли в пониззя Дніпра?", "sec": "s5", "g": "p2_uhod", "t": "single", "opts": ["уходники", "чумаки", "реєстровці", "ясирники"], "ok": [0], "expl": "Уходники йшли «в уходи» — на рибні, звірині й бджолярські промисли в степ, а восени поверталися з рибою, хутром і медом. Саме серед них з’являлися перші козаки."}, {"id": "k038", "q": "Установіть послідовність битв.", "sec": "s6", "g": "p2_seqbattles", "t": "seq", "opts": ["битва на річці Сині Води", "битва на річці Ворскла", "Грюнвальдська битва", "битва під Оршею"], "expl": "Сині Води — 1362 р., Ворскла — 1399 р., Грюнвальд — 1410 р., Орша — 1514 р."}, {"id": "k117_", "q": "Установіть послідовність подій.", "sec": "s6", "g": "p2_seqcrimea", "t": "seq", "opts": ["утворення Кримського ханства", "визнання Кримським ханством васальної залежності від Османської імперії", "перша згадка про українських козаків у писемних джерелах", "битва біля міста Орша"], "expl": "Кримське ханство — 1440-ві рр., васалітет від Османів — 1478 р., перша згадка про козаків — 1489 р., Орша — 1514 р."}, {"id": "z19423", "q": "Установіть послідовність битв XIV – XVII ст.", "sec": "s6", "g": "p2_seqlong", "t": "seq", "opts": ["біля річки Сині Води", "біля міста Орша", "біля міста Пилявці", "біля міста Конотоп"], "expl": "Сині Води — 1362 р., Орша — 1514 р., Пилявці — 1648 р. (Національно-визвольна війна), Конотоп — 1659 р. (гетьманство Івана Виговського)."}, {"id": "np2_match", "q": "Установіть відповідність між датами та подіями.", "sec": "s6", "g": "p2_matchdates", "t": "match", "left": ["40-ві рр. XV ст.", "1471 р.", "1489 р.", "1514 р."], "opts": ["утворення Кримського ханства", "ліквідація Київського удільного князівства", "перша згадка про українських козаків у писемних джерелах", "битва біля міста Орша", "визнання Кримським ханством залежності від Османської імперії"], "ok": [0, 1, 2, 3], "expl": "Кримське ханство — 1440-ві рр., ліквідація Київського князівства — 1471 р., перша згадка про козаків — 1489 р., Орша — 1514 р. Залежність Криму від Османів — 1478 р."}]}, "3": {"n": 30, "pass": 75, "timer": true, "quota": {"s1": 4, "s2": 10, "s3": 7, "s4": 9}, "pool": [{"id": "np3_stan", "q": "Як називали групу населення з однаковими правами й обов’язками, закріпленими законом або звичаєм, належність до якої передавалася в спадок?", "sec": "s1", "g": "p3_stan", "t": "single", "opts": ["стан", "цех", "громада", "магістрат"], "ok": [0], "expl": "Суспільство поділялося на стани: князі й пани, шляхта, духовенство, міщани, селяни. Народжений у стані, як правило, у ньому й лишався."}, {"id": "np3_magn", "q": "Як називали найбагатших шляхтичів, що мали величезні маєтки й великий вплив?", "sec": "s1", "g": "p3_magn", "t": "single", "opts": ["магнатами", "зем’янами", "панцирними слугами", "патриціями"], "ok": [0], "expl": "Магнати — верхівка шляхти: князі Острозькі, Вишневецькі, Збаразькі та інші. Зем’яни й панцирні слуги — дрібні землевласники, патриції — міська верхівка."}, {"id": "np3_shl", "q": "Що мусив робити шляхтич в обмін на свої права й спадкову землю?", "sec": "s1", "g": "p3_shl", "t": "single", "opts": ["власним коштом служити у війську", "сплачувати чинш власникові землі", "відробляти панщину на королівських землях", "вступати до цеху й платити внески"], "ok": [0], "expl": "Шляхтич володів землею, міг обіймати посади й брати участь у сеймиках, але мусив за власний кошт іти на війну. Чинш і панщина — повинності селян."}, {"id": "np3_patr", "q": "Як називали міську верхівку — багатих купців, лихварів, власників кам’яниць, які керували містом?", "sec": "s1", "g": "p3_patr", "t": "single", "opts": ["патриціат", "бюргерство", "плебс", "шляхта"], "ok": [0], "expl": "Міщани поділялися на патриціат (верхівка, що керувала містом), бюргерство (купці середнього достатку й майстри) і плебс (наймити, підмайстри, біднота)."}, {"id": "np3_pokh", "q": "Як називали селян, які могли піти від пана, розрахувавшись із ним?", "sec": "s1", "g": "p3_pokh", "t": "single", "opts": ["похожими", "непохожими", "тяглими", "данниками"], "ok": [0], "expl": "Похожі селяни мали право переходу до іншого пана, непохожі були прикріплені до землі. Тяглі працювали на панському полі зі своєю худобою, данники платили данину."}, {"id": "k072", "q": "Поява та поширення в XV – XVI ст. фільваркового господарства на українських землях були зумовлені", "sec": "s2", "g": "p3_filv", "t": "single", "opts": ["прагненням польської шляхти приборкати українське селянство", "потребою у створенні оборонної лінії проти нападів татар", "зростанням попиту на сільськогосподарську продукцію в країнах Європи", "успіхами в поширенні нових сільськогосподарських культур"], "ok": [2], "expl": "У XVI ст. хліб у Західній Європі дорожчав, і пани заводили фільварки, щоб вирощувати зерно на продаж. Його везли до Гданська, а звідти морем до Нідерландів та Англії."}, {"id": "ctM.25", "q": "Що спонукало панів у XV – XVI ст. заводити фільварки?", "sec": "s2", "g": "p3_filv", "t": "single", "opts": ["прагнення польської шляхти приборкати українське селянство й козацтво", "зростання попиту на зерно в країнах Західної Європи", "потреба в оборонній лінії проти нападів татар", "успіхи в поширенні нових сільськогосподарських культур"], "ok": [1], "expl": "Фільварок — велике панське господарство, де зерно вирощували на продаж. Продавати хліб у Західну Європу стало вигідно, тож пани брали дедалі більше землі під власну ріллю."}, {"id": "ctM.15", "q": "Фільварок — це форма господарювання", "sec": "s2", "g": "p3_filvowner", "t": "single", "opts": ["шляхти", "селян", "міщан", "козаків"], "ok": [0], "expl": "Фільварками володіли пани й шляхта, а працювати там змушували селян. Тому разом із фільварками поширювалися панщина й кріпацтво."}, {"id": "z1586", "q": "Форма земельної відробіткової ренти, що передбачала обов’язкову працю залежного селянина власним реманентом у господарстві землевласника, називається", "sec": "s2", "g": "p3_pansh", "t": "single", "opts": ["вотчина.", "панщина.", "фільварок.", "оброк."], "ok": [1], "expl": "Панщина — обов’язкова праця селянина зі своїм реманентом на панському полі. Спершу так працювали тяглі селяни, а з поширенням фільварків панщина зростала."}, {"id": "ctM.44", "q": "Про яку повинність селян свідчить уривок з історичного джерела: «…а до роботи приступати підданим, як сонце сходить, а зійти [з роботи], як заходить [сонце], а відпочинку тим, що з худобою роблять, перед обідом — година, у полудень — година, надвечір — година…»?", "sec": "s2", "g": "p3_pansh", "t": "single", "opts": ["оброк", "панщина", "десятина", "полюддя"], "ok": [1], "expl": "Селяни зі своєю худобою працюють на пана від сходу до заходу сонця — це панщина. Оброк платили грошима чи продуктами, десятину — церкві, полюддя збирали князі Русі."}, {"id": "z1703", "q": "Який процес був притаманний соціально-економічному розвиткові українських земель у другій половині XIV – XVI ст.?", "sec": "s2", "g": "p3_zakrip", "t": "single", "opts": ["Закріпачення селян і поширення панщини.", "Занепад фільваркового господарства.", "Формування ринку вільнонайманої праці.", "Початок промислового перевороту."], "ok": [0], "expl": "Шляхта потребувала робочих рук на фільварках, тож обмежувала перехід селян і збільшувала панщину. У Польщі це закріпив Петрковський статут 1496 р."}, {"id": "z19401", "q": "Мешканці міст з магдебурзьким правом", "sec": "s2", "g": "p3_magwhat", "t": "single", "opts": ["відробляли панщину й платили оброк.", "користувалися перевагами самоврядування.", "брали участь у виборах короля Речі Посполитої.", "мали бути прихожанами лише православної церкви."], "ok": [1], "expl": "Міщани обирали власні органи влади й суд і звільнялися з-під влади місцевих урядників. Проте у Львові повноправними міщанами довго були лише католики."}, {"id": "z10133", "q": "Поява та використання на українських землях у повсякденному житті слів «магістрат», «рада», «лава» пов’язані з", "sec": "s2", "g": "p3_magwhat", "t": "single", "opts": ["виникненням козацтва.", "запровадженням кріпосного права.", "утвердженням магдебурзького права.", "розповсюдженням реформаційних рухів."], "ok": [2], "expl": "У містах з магдебурзьким правом магістрат складався з ради, яку очолював бурмистр, і лави — міського суду на чолі з війтом."}, {"id": "z7879", "q": "Про що йдеться в уривку з історичного джерела? «Рада також має запобігати сваркам у місті, боронити від кривд сиріт і вдів… кожен раз, коли виникатиме потреба… радитись про добробут громади… і запобігати шкодам, залагоджувати і розсуджувати всілякі спори… пильнувати обману в мірах і вагах під час продажу товару».", "sec": "s2", "g": "p3_magdoc", "t": "single", "opts": ["функції шляхетських сеймиків", "повноваження Генеральної ради на Січі", "діяльність з’їзду князів", "зміст магдебурзького права"], "ok": [3], "expl": "Міська рада стежить за порядком, торгівлею й захищає міщан — це самоврядування міста за магдебурзьким правом."}, {"id": "k065_", "q": "Про що свідчила поява в українському місті споруди, подібної до зображеної на фото?", "sec": "s2", "g": "p3_ratusha", "t": "single", "img": ["q_ca0d294401"], "opts": ["надання місту магдебурзького права", "належність міста великому магнатові", "відсутність у місті ремісничих цехів", "наявність у місті резиденції короля"], "ok": [0], "expl": "На фото — ратуша в Кам’янці-Подільському, будинок міського самоврядування. Ратуші будували міста, що мали магдебурзьке право: тут засідали рада й лава."}, {"id": "np3_syanok", "q": "Яке місто першим на українських землях отримало магдебурзьке право (1339)?", "sec": "s2", "g": "p3_magfirst", "t": "single", "opts": ["Сянок", "Львів", "Київ", "Луцьк"], "ok": [0], "expl": "Першим було галицьке місто Сянок (1339), далі Львів (1356), Кам’янець (1374), Луцьк (1432). Київ отримав магдебурзьке право аж у 1494 р."}, {"id": "np3_magseq", "q": "Установіть послідовність надання магдебурзького права містам.", "sec": "s2", "g": "p3_magfirst", "t": "seq", "opts": ["Сянок", "Львів", "Луцьк", "Київ"], "expl": "Сянок — 1339 р., Львів — 1356 р., Луцьк — 1432 р., Київ — 1494 р."}, {"id": "ctM.29", "q": "Магдебурзьке право почало поширюватися на українських землях у", "sec": "s2", "g": "p3_magfirst", "t": "single", "opts": ["XIII ст.", "XIV ст.", "XV ст.", "XVI ст."], "ok": [1], "expl": "Перші міста з магдебурзьким правом з’явилися в XIV ст.: Сянок (1339), Львів (1356), Кам’янець (1374)."}, {"id": "z8858", "q": "Орган самоврядування на чолі з бурмистром у містах, що користувалися магдебурзьким правом, називався", "sec": "s2", "g": "p3_rada", "t": "single", "opts": ["віче.", "лава.", "рада.", "сейм."], "ok": [2], "expl": "Рада, яку очолював бурмистр, відала господарством і порядком у місті; її членів — радців — обирали з багатих міщан."}, {"id": "k069_", "q": "Яке поняття має таке визначення: «об’єднання ремісників однієї спеціальності, які проживали в містах у добу Середньовіччя»?", "sec": "s2", "g": "p3_cech", "t": "single", "opts": ["фабрика", "цех", "гільдія", "мануфактура"], "ok": [1], "expl": "Свої цехи мали ковалі, шевці, кравці, пекарі, золотарі. Гільдії об’єднували купців, а фабрики й мануфактури — підприємства пізніших часів."}, {"id": "ctM.41", "q": "Середньовічні цехи — це", "sec": "s2", "g": "p3_cech", "t": "single", "opts": ["установи, де існував поділ праці й використовувалася наймана робоча сила", "приміщення, у яких ремісники однієї спеціальності виготовляли товар", "підприємства, що виробляли продукцію для потреб війська", "об’єднання ремісників однієї чи кількох споріднених спеціальностей"], "ok": [3], "expl": "Цех — об’єднання ремісників зі своїм статутом. Він стежив за якістю виробів і цінами, а повноправними членами були майстри."}, {"id": "ctM.18", "q": "У якому столітті на українських землях почала поширюватися цехова організація ремесла?", "sec": "s2", "g": "p3_cechcent", "t": "single", "opts": ["XII ст.", "XIII ст.", "XIV ст.", "XV ст."], "ok": [2], "expl": "Цехи з’явилися в XIV ст. разом із магдебурзьким правом: першими — у Львові й інших галицьких містах."}, {"id": "np3_partach", "q": "Як називали ремісників, що працювали поза цехом?", "sec": "s2", "g": "p3_partach", "t": "single", "opts": ["партачі", "підмайстри", "цехмістри", "лавники"], "ok": [0], "expl": "Цехи боролися з партачами, бо ті збивали ціни. Підмайстри працювали в цехових майстрів, цехмістер очолював цех, лавники були суддями міської лави."}, {"id": "k066_", "q": "Як називалися великі торги, що відбувалися в місті кілька разів на рік і куди з’їжджалися купці з різних країн?", "sec": "s2", "g": "p3_yarm", "t": "single", "opts": ["цех", "магістрат", "фільварок", "ярмарок"], "ok": [3], "expl": "Міста отримували право проводити ярмарки. Звідси вивозили зерно, волів, віск, мед, хутра, а завозили сукно, вино, прянощі, зброю."}, {"id": "f099", "q": "Установіть відповідність між визначеннями та поняттями.", "sec": "s2", "g": "p3_f099", "t": "match", "left": ["примусова неоплачувана праця залежних селян у господарстві землевласника", "об’єднання ремісників однієї чи суміжних спеціальностей для захисту своїх інтересів", "натуральна чи грошова плата залежних селян землевласникові за користування землею", "велике панське господарство, яке виробляло зерно на продаж"], "opts": ["оброк", "панщина", "фільварок", "цех", "ярмарок"], "ok": [1, 3, 0, 2], "expl": "Панщина — праця на пана, цех — об’єднання ремісників, оброк (у джерелах — данина, чинш) — плата пану, фільварок — панське господарство, що вирощувало зерно на продаж."}, {"id": "k116", "q": "Книжка «Прогностична оцінка поточного 1483 року» належить авторству", "sec": "s3", "g": "p3_drohob", "t": "single", "opts": ["Юрія Дрогобича", "Івана Федорова", "Іларіона Київського", "Антонія Печерського"], "ok": [0], "expl": "Книжку Юрія Дрогобича видали в Римі в 1483 р. Це перша відома друкована книжка автора-українця."}, {"id": "ctM.16", "q": "У другій половині XV – першій половині XVI ст. вихідці з українських земель здобували вищу освіту в", "sec": "s3", "g": "p3_univ", "t": "single", "opts": ["європейських університетах", "єзуїтських колегіумах", "навчальних закладах Візантії", "Острозькій та Києво-Могилянській академіях"], "ok": [0], "expl": "Вищих шкіл на українських землях тоді не було, тож молодь їхала вчитися до Кракова, Праги, Болоньї, Падуї. Острозька академія постала в 1576 р., Києво-Могилянська — у XVII ст."}, {"id": "np3_fiol", "q": "Хто в Кракові надрукував перші кириличні книжки — «Октоїх» і «Часослов»?", "sec": "s3", "g": "p3_fiol", "t": "single", "opts": ["Швайпольт Фіоль", "Франциск Скорина", "Іван Федоров", "Юрій Дрогобич"], "ok": [0], "expl": "Швайпольт Фіоль надрукував у Кракові чотири церковні книжки. Краківський єпископ звинуватив його в єресі, і друкувати кирилицею він більше не міг."}, {"id": "np3_skar", "q": "Хто з книжників видав у Празі «Біблію руську»?", "sec": "s3", "g": "p3_skar", "t": "single", "opts": ["Франциск Скорина", "Швайпольт Фіоль", "Іван Федоров", "Юрій Дрогобич"], "ok": [0], "expl": "Франциск Скорина з Полоцька видав «Біблію руську» в Празі, а згодом у Вільні — «Апостол» і «Малу подорожну книжку». Іван Федоров друкував у Львові з 1574 р."}, {"id": "np3_psalt", "q": "Київський Псалтир, який переписав диякон Спиридон, створено в", "sec": "s3", "g": "p3_psalt", "t": "single", "opts": ["XII ст.", "XIII ст.", "XIV ст.", "XVI ст."], "ok": [2], "expl": "Київський Псалтир переписано в 1397 р., тобто наприкінці XIV ст. Це найвідоміша рукописна книга з мініатюрами тієї доби."}, {"id": "np3_dumy", "q": "Як називалися твори про татарську неволю, втечу з полону й козацькі подвиги, що їх співали кобзарі?", "sec": "s3", "g": "p3_dumy", "t": "single", "opts": ["думи", "колядки", "веснянки", "житія"], "ok": [0], "expl": "Думи й історичні пісні з’явилися в XV – XVI ст. Серед найдавніших — думи про неволю: «Плач невольника», «Маруся Богуславка». Колядки й веснянки — обрядові пісні, житія — розповіді про святих."}, {"id": "np3_metrop", "q": "Що сталося в 1458 р. з православною митрополією?", "sec": "s3", "g": "p3_metrop", "t": "single", "opts": ["для земель Литви й Польщі постала окрема Київська митрополія", "митрополію перенесли з Києва до Львова", "православну митрополію ліквідували за умовами Кревської унії", "митрополитів відтоді призначав московський князь"], "ok": [0], "expl": "Великі князі литовські не хотіли, щоб православними їхньої держави керував митрополит із Москви. У 1458 р. митрополія поділилася, і для земель Литви й Польщі постала окрема Київська митрополія."}, {"id": "np3_cultseq", "q": "Установіть по /* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {

    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';

}
fsb.addEventListener('click', e => {

});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);

}

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };

}, { passive: false });
lbv.addEventListener('touchmove', e => {

    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();

lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;

lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);

}

/* Курс: вхід учня, бліци після частин, замки, Тест 1 і Тест 2, відправлення результатів у Google-таблицю.
   Дані: QUIZ ({blitz:{1:{n,pass,quota,pool}}, tests:{t1:{tasks}}}), COURSE_API (адреса Apps Script). */
const API = (typeof COURSE_API === 'string' && COURSE_API) || '';
const LET = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Є'];
const TYPE = { single: 'Одна правильна відповідь', three: 'Три правильні з семи', seq: 'Послідовність', match: 'Відповідність' };
const LBLRE = /^(?:Місцезнаходження |Місце |малюнок )?([А-ЕЄ]|\d)$/;
const isLbl = q => q.opts.every(o => LBLRE.test(o));
const lab = (q, j, k) => isLbl(q) && !(q.t === 'seq' && q.oimg) ? q.opts[j].match(LBLRE)[1] : q.t === 'three' ? k + 1 : LET[k];
/* порядок показу в бліці: мітки — як є (послідовність із мітками — за абеткою), решта — навмання */
function showOrder(q) {
  const idx = [...q.opts.keys()];
  if (!isLbl(q) || (q.t === 'seq' && q.oimg)) return shuffle(idx);
  return q.t === 'seq' ? idx.sort((a, b) => q.opts[a].localeCompare(q.opts[b], 'uk')) : idx;
}
/* відповідність, де рядки — літери із зображення (А–Г): варіанти нумеруємо цифрами, щоб літери рядків і варіантів не плуталися */
const rowLet = q => !!q.left && q.left.every(l => /^[А-Г]$/.test(l));
const MLB = q => rowLet(q) ? ['1', '2', '3', '4', '5'] : LET;
const mrowHead = (q, l, i) => rowLet(q) ? `<b>Зображення ${l}</b>` : `<b>${i + 1}.</b> ${q.rimg ? pic(q.rimg[i], 'ri') : ''}${/^\d$/.test(l) ? '' : md(l)}`;
const mlist = (q, order) => isLbl(q) ? '' : `<div class="mlist">${order.map((j, k) => `<div class="mo"><b class="a2">${MLB(q)[k]}</b> ${optHtml(q, j)}</div>`).join('')}</div>`;
const maxOf = q => q.t === 'single' ? 1 : q.t === 'match' ? 4 : 3;
function grade12(pc) { const t = [25, 33, 41, 49, 56, 63, 70, 77, 84, 91]; let g = 2; t.forEach((v, k) => { if (pc >= v) g = k + 3; }); return g; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (p, m) => m ? Math.round(1000 * p / m) / 10 : 0;
/* кількість частин курсу = кількість бліців; короткі перевірки після розділів — QUIZ.mini['<частина>-<розділ>'] */

/* спільна оболонка кількох тем: один вхід на сторінці оболонки (SHELL_URL), учень — у спільному сховищі hist_*,

const SH = (typeof SHELL_URL === 'string' && SHELL_URL) || '';
const TOPIC_ID = (typeof TOPIC === 'string' && TOPIC) || '';
const G_ = {
  get(k, d) { try { const v = localStorage.getItem('hist_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },

/* ---------- учень і прогрес ---------- */

const unlocked = num => num === 1 || U.passed('b' + (num - 1));
/* QUIZ.tests[id].after = N — тест відкривається після бліцу частини N (Тест 2 — ще й після допуску в Тесті 1); без after — Тест 1 після всіх бліців */

const testLock = id => id === 't1' ? (tAfter(id) ? `після бліцу частини ${tAfter(id)}` : 'після всіх бліців')
  : !U.passed('t1') ? 'після Тесту 1' + (tAfter(id) && !U.passed('b' + tAfter(id)) ? ` і бліцу частини ${tAfter(id)}` : '') : `після бліцу частини ${tAfter(id)}`;

/* ---------- зв’язок із сервером: черга, щоб нічого не губилося без інтернету ---------- */
const Net = {
  async call(body) {
    if (!API) throw new Error('no api');
    const u = U.user; if (u && u.pin && body.pin == null) body = { ...body, pin: u.pin };
    if (TOPIC_ID && body.topic == null) body = { ...body, topic: TOPIC_ID };
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), cache: 'no-store', redirect: 'follow' });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(); if (j.error) throw new Error(j.error); return j;
  },
  send(op, data) {
    const u = U.user; if (!u) return;
    const q = store.get('queue', []);
    q.push({ op, name: u.name, cls: u.cls, pin: u.pin, at: new Date().toISOString(), ...(TOPIC_ID ? { topic: TOPIC_ID } : {}), ...data });
    store.set('queue', q); this.flush();
  },
  busy: false,
  async flush() {
    if (this.busy || !API) return; this.busy = true;
    try {
      let q = store.get('queue', []);
      while (q.length) {
        const item = q[0], res = await this.call(item);
        q = store.get('queue', []); q.shift(); store.set('queue', q);
        if (item.op === 'test') this.onTest(item, res);
      }
    } catch (e) { const it = store.get('queue', [])[0], u = U.user;
      if (e.message === 'pin' && it && u && it.name === u.name && it.cls === u.cls) { this.busy = false; return badPin(); } /* інакше немає зв’язку — спробуємо пізніше */ }
    this.busy = false; paintSync();
  },
  onTest(sent, res) {
    U.setProg(sent.test, { ...res, at: sent.at });
    store.set('draft_' + sent.test, null);
    if (location.hash === '#' + sent.test) route();
  },
};
function paintSync() {
  const el = document.getElementById('sync'); if (!el) return;
  const n = store.get('queue', []).length;
  el.innerHTML = !API ? '' : n ? `⏳ Не надіслано результатів: <b>${n}</b>. Надішлеться, щойно з’явиться інтернет. <button class="lnk" id="syncgo">Надіслати зараз</button>` : '✓ Усі результати надіслано вчителю';
  const b = document.getElementById('syncgo'); if (b) b.onclick = () => Net.flush();
}

function mergeProg(sp) {

  store.set('prog', p);
}

/* ---------- бліц ---------- */
function draw(n, B, seenKey) {
  B = B || QUIZ.blitz[n]; seenKey = seenKey || 'bseen' + n;
  const seen = new Set(store.get(seenKey, [])), used = new Set(), out = [];
  const take = list => { for (const q of list) { if (out.length >= B.n) return; if (out.includes(q) || (q.g && used.has(q.g))) continue; out.push(q); if (q.g) used.add(q.g); return true; } };
  const fresh = list => shuffle(list).sort((a, b) => seen.has(a.id) - seen.has(b.id));
  Object.entries(B.quota || {}).forEach(([sec, k]) => { const c = fresh(B.pool.filter(q => q.sec === sec)); for (let i = 0; i < k; i++) if (!take(c)) break; });
  while (out.length < B.n && take(fresh(B.pool))) {}
  const order = Object.keys(B.quota || {});
  out.sort((a, b) => order.indexOf(a.sec) - order.indexOf(b.sec));
  return out;
}
function pic(key, cls) {
  const i = IMGS[key]; if (!i) return '';
  return `<div class="pic ${cls || ''}" data-src="${i.src}" data-cap=""><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""><span class="zoom-hint">⤢</span></div>`;
}
/* зображення-варіант: вибір — дотиком до плитки, збільшення — лише кнопкою ⤢ */
function opic(key) {
  const i = IMGS[key]; if (!i) return '';
  return `<span class="oi"><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""><span class="zoom-hint pic" data-src="${i.src}" data-cap="">⤢</span></span>`;
}
const optHtml = (q, j) => `${q.oimg ? opic(q.oimg[j]) : ''}${isLbl(q) ? '' : `<span>${md(q.opts[j])}</span>`}`;

const Blitz = {
  /* незавершений бліц зберігається на телефоні: світло, тривога — і можна продовжити з того самого питання */
  draft(n) { const d = store.get('bdraft' + n, null); return d && d.ids && d.i < d.ids.length ? d : null; },
  clearDraft(n) { store.set('bdraft' + n, null); },
  save() { if (this.mini) return; store.set('bdraft' + this.n, { ids: this.qs.map(q => q.id), orders: this.qs.map(q => q.order), i: this.i, pts: this.pts, log: this.log,
    dl: this.dl, sec: this.sec, exits: this.exits }); },
  /* час на питання бліцу (с): строк зберігається в чернетці, тож перезавантаження його не скидає */
  lim(q) { return { single: 40, three: 60, match: 90, seq: 90 }[q.t] || 60; },
  timed() { return !this.mini && !!(QUIZ.blitz[this.n] && QUIZ.blitz[this.n].timer); },
  stopClock() { clearInterval(this.clk); this.clk = null; },
  start(n) {
    this.mini = null; this.n = n;
    const d = store.get('bdraft' + n, null), pool = QUIZ.blitz[n].pool;
    if (d && d.ids && d.ids.every(id => pool.some(q => q.id === id))) {
      this.qs = d.ids.map((id, k) => ({ ...pool.find(q => q.id === id), order: d.orders[k] }));
      this.i = d.i; this.pts = d.pts; this.log = d.log; this.dl = d.dl || null; this.sec = d.sec || 0; this.exits = d.exits || 0;
    } else {
      this.qs = draw(n).map(q => ({ ...q, order: showOrder(q) }));
      this.i = 0; this.pts = 0; this.log = []; this.dl = null; this.sec = 0; this.exits = 0;
      const s = new Set(store.get('bseen' + n, [])); this.qs.forEach(q => s.add(q.id)); store.set('bseen' + n, [...s]);
      this.save();
    }
    this.max = this.qs.reduce((a, q) => a + maxOf(q), 0);
    if (this.i >= this.qs.length) return this.finish();     // відповіли на все, але результат не встигли переглянути
    this.show();
  },
  /* коротка перевірка після розділу: без замка й без оцінки */
  startMini(n, sid) {
    const k = `${n}-${sid}`, M = MINI[k]; this.mini = { n, sid, k }; this.n = n;
    this.qs = draw(n, M, 'mseen' + k).map(q => ({ ...q, order: showOrder(q) }));
    const s = new Set(store.get('mseen' + k, [])); this.qs.forEach(q => s.add(q.id)); store.set('mseen' + k, [...s]);
    this.i = 0; this.pts = 0; this.log = []; this.dl = null; this.sec = 0; this.exits = 0; this.max = this.qs.reduce((a, q) => a + maxOf(q), 0);
    this.show();
  },
  back() { return this.mini ? `p${this.n}-${this.mini.sid}` : `p${this.n}`; },
  top() { return `<div class="bz-top"><span class="cnt">${this.mini ? 'Перевірка' : 'Бліц ' + this.n} · питання ${this.i + 1} з ${this.qs.length}</span>${this.timed() ? '<span class="tm" id="bzt"></span>' : ''}<span class="pts">${this.pts} б.</span>
      <button class="x" data-go="${this.back()}" aria-label="Вийти">✕</button></div>`; },
  show() {
    const q = this.qs[this.i]; this.sel = q.t === 'match' ? [null, null, null, null] : []; this.tout = false; this.stopClock();
    this.shown = Date.now();
    let tiles;
    if (q.t === 'match') {
      tiles = mlist(q, q.order) +
        q.left.map((l, i) => `<div class="mrow"><div class="ml">${mrowHead(q, l, i)}</div><div class="mbtns">${q.order.map((j, k) =>
          `<button class="mb" data-i="${i}" data-j="${j}">${MLB(q)[k]}</button>`).join('')}</div></div>`).join('');
    } else {
      tiles = q.order.map((j, k) => `<button class="tile n${q.oimg ? ' wi' : ''}" data-j="${j}"><span class="l">${lab(q, j, k)}</span>${optHtml(q, j)}</button>`).join('');
      if (q.oimg) tiles = `<div class="tgrid">${tiles}</div>`;
    }
    const act = q.t === 'single' ? '' : `<div class="bz-act"><button class="btn ghost" id="bzr">Скинути</button><button class="btn" id="bzok" disabled>Відповісти</button></div>`;
    app.innerHTML = `<div class="wrap bz-in">${this.top()}<div class="qtype">${TYPE[q.t]}${q.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      <div class="qtext">${md(q.q).replace(/\n/g, '<br>')}</div>${(q.img || []).map(k => pic(k, 'qi')).join('')}
      <div class="tiles" id="tl">${tiles}</div>${act}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const tl = document.getElementById('tl');
    tl.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; this.pick(q, +b.dataset.j); });
    tl.querySelectorAll('.mb').forEach(b => b.onclick = () => { this.sel[+b.dataset.i] = +b.dataset.j; this.paintMatch(); });
    if (q.t !== 'single') {
      document.getElementById('bzr').onclick = () => { this.sel = q.t === 'match' ? [null, null, null, null] : []; q.t === 'match' ? this.paintMatch() : this.paintSel(q); };
      document.getElementById('bzok').onclick = () => this.answer(q);
    }
    if (this.timed()) {
      if (!this.dl) { this.dl = Date.now() + this.lim(q) * 1000; this.save(); }
      const tick = () => {
        const left = Math.ceil((this.dl - Date.now()) / 1000), el = document.getElementById('bzt');
        if (el) { el.textContent = '⏱ ' + Math.max(0, left); el.classList.toggle('warn', left <= 10); }
        if (left <= 0) { this.stopClock(); this.tout = true; this.answer(q); }
      };
      tick(); if (!this.tout) this.clk = setInterval(tick, 500);
    }
  },
  pick(q, j) {
    if (q.t === 'single') { this.sel = [j]; return this.answer(q); }
    const k = this.sel.indexOf(j);
    if (k >= 0) this.sel.splice(k, 1); else if (this.sel.length < (q.t === 'three' ? 3 : 4)) this.sel.push(j);
    this.paintSel(q);
  },
  paintSel(q) {
    document.querySelectorAll('#tl .tile').forEach(b => {
      const j = +b.dataset.j, k = this.sel.indexOf(j), l = b.querySelector('.l, .ord');
      b.classList.toggle('sel', k >= 0);
      if (q.t === 'seq') { l.className = k >= 0 ? 'ord' : 'l'; l.textContent = k >= 0 ? k + 1 : lab(q, j, q.order.indexOf(j)); }
    });
    document.getElementById('bzok').disabled = this.sel.length !== (q.t === 'three' ? 3 : 4);
  },
  paintMatch() {
    document.querySelectorAll('#tl .mb').forEach(b => b.classList.toggle('on', this.sel[+b.dataset.i] === +b.dataset.j));
    document.getElementById('bzok').disabled = this.sel.some(x => x === null);
  },
  answer(q) {
    this.stopClock(); this.dl = null;
    this.sec = (this.sec || 0) + Math.min((Date.now() - (this.shown || Date.now())) / 1000, this.timed() ? this.lim(q) + 5 : 600);
    if (q.t === 'seq' && this.sel.length < 4) this.sel = [];   // незавершена послідовність — 0 балів
    let p = 0; const m = maxOf(q);
    if (q.t === 'single') p = this.sel[0] === q.ok[0] ? 1 : 0;
    else if (q.t === 'three') p = this.sel.filter(j => q.ok.includes(j)).length;
    else if (q.t === 'match') p = this.sel.filter((j, i) => j === q.ok[i]).length;
    else if (!this.sel.length) p = 0;
    else if (this.sel.every((j, k) => j === k)) p = 3; else if (this.sel[0] === 0 && this.sel[3] === 3) p = 2; else if (this.sel[0] === 0 || this.sel[3] === 3) p = 1;
    this.pts += p; this.log.push({ id: q.id, p, m });
    document.querySelectorAll('#tl .mb').forEach(b => { const i = +b.dataset.i, j = +b.dataset.j; b.disabled = true;
      if (q.ok[i] === j) b.classList.add('right'); else if (this.sel[i] === j) b.classList.add('wrong'); });
    document.querySelectorAll('#tl .tile').forEach(b => { const j = +b.dataset.j; b.disabled = true; if (q.t === 'seq') return;
      if (q.ok.includes(j)) b.classList.add('right'); else if (this.sel.includes(j)) b.classList.add('wrong'); else b.classList.add('dim'); });
    const act = document.querySelector('.bz-act'); if (act) act.remove();
    const L2 = j => lab(q, j, q.order.indexOf(j));
    const extra = q.t === 'match' ? `<div>Правильно: ${q.left.map((l, i) => rowLet(q) ? `${l} — ${MLB(q)[q.order.indexOf(q.ok[i])]}` : `${i + 1} — ${L2(q.ok[i])}`).join(', ')}</div>`
      : q.t === 'seq' ? `<div>Правильний порядок: ${q.opts.map((o, j) => L2(j)).join(' → ')}</div>` : '';
    const last = this.i === this.qs.length - 1;
    document.querySelector('.bz-top .pts').textContent = this.pts + ' б.';
    document.querySelector('.bz-in').insertAdjacentHTML('beforeend', `<div class="fb ${p === m ? 'good' : p ? 'part' : 'bad'}">
      <div class="h">${this.tout ? '⏱ Час вийшов. ' : ''}${p === m ? 'Правильно!' : p ? 'Частково правильно' : 'Неправильно'} · ${p} з ${m}</div>${extra}${q.expl ? `<div class="ex">${md(q.expl)}</div>` : ''}</div>
      <button class="btn" id="bzn">${last ? 'Результат' : 'Далі →'}</button>`);
    if (!this.mini) { this.i++; this.save(); this.i--; }
    const nx = document.getElementById('bzn'); nx.onclick = () => { if (last) this.finish(); else { this.i++; this.show(); } };
    nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },
  finishMini() {
    const { n, sid, k } = this.mini, L = LESSONS[n - 1], si = L.sections.findIndex(x => x.id === sid), nxt = L.sections[si + 1];
    const all = store.get('mini', {}); all[k] = { p: this.pts, m: this.max }; store.set('mini', all);
    Net.send('event', { what: 'перевірка', part: n, sec: L.sections[si].num, title: `${this.pts} з ${this.max}` });
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">Перевірка · розділ ${L.sections[si].num}</span><button class="x" data-go="${this.back()}" aria-label="Закрити" style="margin-left:auto">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${this.pts} з ${this.max}</div>
        <div class="gr">${this.pts === this.max ? 'Чудово! Можна йти далі.' : this.pts >= 0.75 * this.max ? 'Добре! Можна йти далі, а помилку варто запам’ятати.' : 'Перегляньте розділ ще раз — і спробуйте знову.'}</div></div>
      <button class="btn" data-go="${nxt ? `p${n}-${nxt.id}` : (U.passed('b' + n) ? 'p' + n : 'blitz' + n)}">${nxt ? 'До наступного розділу →' : (U.passed('b' + n) ? 'До частини' : 'До бліцу частини ' + n + ' →')}</button>
      <button class="btn ghost" data-go="p${n}-${sid}">Повторити розділ</button>
      <button class="btn ghost" id="again">Перевірити ще раз</button></div>`;
    wireGo(); window.scrollTo(0, 0);
    document.getElementById('again').onclick = () => this.startMini(n, sid);
  },
  finish() {
    if (this.mini) return this.finishMini();
    this.clearDraft(this.n);
    const n = this.n, pc = pct(this.pts, this.max), pass = pc >= PASS(n), prev = U.prog()['b' + n] || { pct: 0, pass: false };
    U.setProg('b' + n, { pct: Math.max(pc, prev.pct), pass: pass || !!prev.pass });
    const tries = store.get('btries' + n, 0) + 1; store.set('btries' + n, tries);
    Net.send('blitz', { part: n, attempt: tries, pts: this.pts, max: this.max, pct: pc, pass, qs: this.log, sec: Math.round(this.sec || 0), exits: this.exits || 0 });
    const errs = {}; this.log.forEach((r, k) => { if (r.p < r.m) { const s = this.qs[k].sec; errs[s] = (errs[s] || 0) + 1; } });
    const L = LESSONS[n - 1], weak = Object.entries(errs).sort((a, b) => b[1] - a[1]).map(([s, c]) => { const S = L.sections.find(x => x.id === s);
      return `<button class="sec-btn" data-go="${L.id}-${s}"><span class="num">${S.num}</span><span><h3>${md(S.title)}</h3><div class="st">помилок: ${c}</div></span></button>`; }).join('');
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">Бліц частини ${n}</span><button class="x" data-go="p${n}" aria-label="Закрити" style="margin-left:auto">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${pc}%</div><div class="cap">${this.pts} з ${this.max} балів</div>
        <div class="gr ${pass ? 'okc' : 'badc'}">${pass ? (n < NP ? `Пройдено! Частину ${n + 1} відкрито.` : 'Пройдено! Тест 1 відкрито, якщо всі бліци пройдено.') : `Потрібно ${PASS(n)} %. Повторіть розділи нижче і спробуйте ще раз.`}</div></div>
      ${pass ? `<button class="btn" data-go="${n < NP ? 'p' + (n + 1) : 'home'}">${n < NP ? `До частини ${n + 1} →` : 'До тестів →'}</button>` : ''}
      <button class="btn ${pass ? 'ghost' : ''}" id="again">Пройти бліц ще раз</button>
      ${weak ? `<div class="h2" style="margin:8px 0 0">Варто повторити</div><div class="sec-list">${weak}</div>` : ''}
      <div class="sync" id="sync"></div></div>`;
    wireGo(); paintSync(); window.scrollTo(0, 0);
    document.getElementById('again').onclick = () => { this.clearDraft(n); this.start(n); };
  },
};

/* ---------- тести (без підказок; бали рахує сервер) ---------- */
const Test = {
  /* ліміт часу (хв) — QUIZ.tests[id].minutes; початок — на телефоні (tstart_) і на сервері (op tstart) */
  started() { return store.get('tstart_' + this.id, null); },
  begin() {
    if (this.started()) return;
    store.set('tstart_' + this.id, Date.now()); store.set('texits_' + this.id, 0);
    Net.send('tstart', { test: this.id });
  },
  leftSec() { const m = this.T.minutes; return m ? Math.ceil((this.started() + m * 60000 - Date.now()) / 1000) : null; },
  stopClock() { clearInterval(this.clk); this.clk = null; },
  submit(auto) {
    this.stopClock();
    const answers = this.T.tasks.map(t => this.ans[t.n] == null ? null : this.ans[t.n]);
    const st = this.started(), sec = st ? Math.round((Date.now() - st) / 1000) : null;
    store.set('draft_' + this.id, null); store.set('tstart_' + this.id, null);
    Net.send('test', { test: this.id, answers, sec, exits: store.get('texits_' + this.id, 0), auto: !!auto });
    this.pending(auto);
  },
  open(id) {
    this.id = id; this.T = QUIZ.tests[id];
    if (store.get('queue', []).some(x => x.op === 'test' && x.test === id)) return this.pending();
    const d = store.get('draft_' + id, null), r = U.prog()[id];
    if (d) { this.ans = d; if (this.started() && this.leftSec() !== null && this.leftSec() <= 0) return this.submit(true); return this.render(); }
    if (r && r.pts != null) return this.result(r);
    this.ans = {}; this.render();
  },
  intro() {
    const T = this.T, n = k => T.tasks.filter(t => t.t === k).length;
    return `<div class="card tintro"><h2>${esc(T.name)}</h2><p>${T.tasks.length} завдань, як на НМТ: ${n('single')} — одна правильна відповідь, ${n('match')} — відповідність, ${n('seq')} — послідовність, ${n('three')} — три з семи.
      Бали — за правилами НМТ.${this.id === 't1' ? ' Щоб отримати допуск до Тесту 2, потрібно <b>75 %</b> балів.' : ''}</p>
      ${T.minutes ? `<p><b>На тест — ${T.minutes} хвилин.</b> Час рахується від першого відкриття тесту й іде, навіть коли ви закриваєте сторінку. Коли час мине, відповіді надішлються самі.</p>` : ''}
      <p class="cap">Підказок під час тесту немає. Відповіді зберігаються на телефоні. Учитель бачить, скільки часу тривав тест і скільки разів ви виходили зі сторінки.</p></div>`;
  },
  render() {
    const T = this.T;
    const nav = T.tasks.map((t, k) => `<a href="#" class="nv${this.done(t) ? ' on' : ''}" data-k="${k}">${t.n}</a>`).join('');
    this.begin(); this.stopClock();
    app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Назад</button><span class="ttl">${esc(T.name)}</span>${T.minutes ? '<span class="tm" id="ttm"></span>' : ''}</div></div>
      <div class="wrap">${this.intro()}<div class="tnav stk" id="tnav">${nav}</div>${T.tasks.map((t, k) => this.task(t, k)).join('')}
      <div class="tsend"><div class="cap" id="tleft"></div><button class="btn" id="tsub">Надіслати відповіді</button></div><div class="dlg" id="dlg" hidden></div></div>`;
    wireGo(); window.scrollTo(0, 0);
    document.getElementById('tnav').onclick = e => { const a = e.target.closest('.nv'); if (!a) return; e.preventDefault();
      document.getElementById('tk' + a.dataset.k).scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    T.tasks.forEach((t, k) => this.wire(t, k));
    document.getElementById('tsub').onclick = () => this.confirm();
    this.left();
    if (T.minutes) {
      const tick = () => {
        const s = this.leftSec(), el = document.getElementById('ttm');
        if (!el) return this.stopClock();
        el.textContent = '⏱ ' + Math.floor(Math.max(0, s) / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
        el.classList.toggle('warn', s <= 300);
        if (s <= 0) this.submit(true);
      };
      tick(); this.clk = setInterval(tick, 1000);
    }
  },
  done(t) { const a = this.ans[t.n]; return t.t === 'match' ? !!a && a.every(x => x !== null) : t.t === 'single' ? a != null : !!a && a.length === (t.t === 'three' ? 3 : 4); },
  task(t, k) {
    const a = this.ans[t.n];
    let body;
    if (t.t === 'match') {
      const sel = a || [null, null, null, null];
      body = mlist(t, [...t.opts.keys()]) +
        t.left.map((l, i) => `<div class="mrow"><div class="ml">${mrowHead(t, l, i)}</div><div class="mbtns">${t.opts.map((o, j) =>
          `<button class="mb${sel[i] === j ? ' on' : ''}" data-i="${i}" data-j="${j}">${MLB(t)[j]}</button>`).join('')}</div></div>`).join('');
    } else {
      const sel = t.t === 'single' ? (a == null ? [] : [a]) : (a || []);
      body = t.opts.map((o, j) => { const k2 = sel.indexOf(j);
        return `<button class="tile n${t.oimg ? ' wi' : ''}${k2 >= 0 ? ' sel' : ''}" data-j="${j}"><span class="${t.t === 'seq' && k2 >= 0 ? 'ord' : 'l'}">${t.t === 'seq' && k2 >= 0 ? k2 + 1 : lab(t, j, j)}</span>${optHtml(t, j)}</button>`; }).join('');
      if (t.oimg) body = `<div class="tgrid">${body}</div>`;
      if (t.t !== 'single') body += `<button class="lnk rst" data-r="1">Скинути відповідь</button>`;
    }
    return `<section class="card task" id="tk${k}"><div class="qtype">Завдання ${t.n} · ${TYPE[t.t]}${t.t === 'seq' ? ' · натискайте в правильному порядку' : ''}</div>
      ${t.src ? `<div class="quote"><p>${md(t.src)}</p>${t.srccap ? `<div class="src">${esc(t.srccap)}</div>` : ''}</div>` : ''}
      <div class="qtext">${md(t.q).replace(/\n/g, '<br>')}</div>${(t.img || []).map(x => pic(x, 'qi')).join('')}<div class="tiles">${body}</div>${t.cap ? `<div class="cap"><span class="cr">${esc(t.cap)}</span></div>` : ''}</section>`;
  },
  wire(t, k) {
    const el = document.getElementById('tk' + k);
    const re = () => { el.outerHTML = this.task(t, k); this.wire(t, k); store.set('draft_' + this.id, this.ans);
      document.querySelector(`.nv[data-k="${k}"]`).classList.toggle('on', this.done(t)); this.left(); };
    el.querySelectorAll('.tile').forEach(b => b.onclick = e => { if (e.target.closest('.pic')) return; const j = +b.dataset.j;
      if (t.t === 'single') this.ans[t.n] = j;
      else { const s = this.ans[t.n] || [], i = s.indexOf(j); if (i >= 0) s.splice(i, 1); else if (s.length < (t.t === 'three' ? 3 : 4)) s.push(j); this.ans[t.n] = s; }
      re(); });
    el.querySelectorAll('.mb').forEach(b => b.onclick = () => { const s = this.ans[t.n] || [null, null, null, null]; s[+b.dataset.i] = +b.dataset.j; this.ans[t.n] = s; re(); });
    const r = el.querySelector('.rst'); if (r) r.onclick = () => { delete this.ans[t.n]; re(); };
  },
  left() { const n = this.T.tasks.filter(t => !this.done(t)).length; document.getElementById('tleft').textContent = n ? `Без відповіді: ${n}` : 'Відповіді є на всі завдання.'; },
  confirm() {
    const n = this.T.tasks.filter(t => !this.done(t)).length, d = document.getElementById('dlg');
    d.hidden = false;
    d.innerHTML = `<div class="dlg-in"><h3>Надіслати відповіді?</h3><p>${n ? `Без відповіді залишилося <b>${n}</b> завд. — за них буде 0 балів.` : 'Відповіді є на всі завдання.'} Змінити відповіді після надсилання не можна.</p>
      <button class="btn" id="dy">Надіслати</button><button class="btn ghost" id="dn">Повернутися до тесту</button></div>`;
    document.getElementById('dn').onclick = () => { d.hidden = true; };
    document.getElementById('dy').onclick = () => this.submit(false);
  },
  pending(auto) {
    this.stopClock();
    app.innerHTML = `<div class="wrap bz-in"><div class="res"><div>${esc(this.T.name)}</div><div class="big">⏳</div>${auto ? '<div class="gr">Час вийшов — відповіді надіслано автоматично.</div>' : ''}
      <div class="cap">Відповіді збережено. Результат з’явиться, щойно телефон зв’яжеться з сервером.</div></div>
      <div class="sync" id="sync"></div><button class="btn ghost" data-go="home">На головну</button></div>`;
    wireGo(); paintSync(); Net.flush();
  },
  result(r) {
    const t1 = this.id === 't1';
    app.innerHTML = `<div class="wrap bz-in"><div class="bz-top"><span class="cnt">${esc(this.T.name)}</span><button class="x" data-go="home" style="margin-left:auto" aria-label="Закрити">✕</button></div>
      <div class="res"><div>Ваш результат</div><div class="big">${r.pts} з ${r.max}</div><div class="cap">${r.pct}% балів</div>${t1 ? '' : `${r.grade ? `<div class="gr">Оцінка: <b>${r.grade}</b> (з 12)</div>` : ''}<div class="gr">За шкалою НМТ (100–200)${r.max !== 54 ? ', орієнтовно' : ''}: <b>${esc(r.scale)}</b></div>`}
      ${t1 ? `<div class="gr ${r.pass ? 'okc' : 'badc'}">${r.pass ? (testOpen('t2') ? 'Допуск отримано — Тест 2 відкрито.' : `Допуск отримано. Тест 2 відкриється ${testLock('t2')}.`) : 'Потрібно 75 %. Повторіть матеріал і пройдіть тест ще раз.'}</div>` : ''}</div>
      ${r.per ? `<div class="h2" style="margin:8px 0 0">Бали за завданнями</div><div class="tnav">${r.per.map((p, k) => `<span class="nv ${p === maxOf(this.T.tasks[k]) ? 'on' : p ? 'pt' : 'no'}">${k + 1}<i>${p}</i></span>`).join('')}</div>` : ''}
      ${t1 && !r.pass ? `<button class="btn" id="retry">Пройти Тест 1 ще раз</button>` : ''}
      ${t1 && r.pass && testOpen('t2') ? `<button class="btn" data-go="home">До Тесту 2 →</button>` : `<button class="btn ghost" data-go="home">На головну</button>`}</div>`;
    wireGo(); window.scrollTo(0, 0);
    const rb = document.getElementById('retry'); if (rb) rb.onclick = () => { store.set('draft_' + this.id, {}); store.set('tstart_' + this.id, null); this.ans = {}; this.render(); };
  },
};

/* ---------- маршрути ---------- */
const _route = route;
route = function () {
  Blitz.stopClock(); Test.stopClock();     // таймери попередньої сторінки не повинні спрацювати на новій
  const h = location.hash.slice(1);
  if (needLogin() && h) { history.replaceState(null, '', location.pathname); return login(); }
  let m = h.match(/^blitz(\d)$/);
  if (m && QUIZ.blitz[m[1]]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.start(n); }
  m = h.match(/^mini(\d)-(s\d+)$/);
  if (m && MINI[`${m[1]}-${m[2]}`]) { const n = +m[1]; if (!unlocked(n)) return lockedPart(LESSONS[n - 1], n); return Blitz.startMini(n, m[2]); }
  m = h.match(/^(t[12])$/);
  if (m) { if (!QUIZ.tests[m[1]] || !testOpen(m[1])) { location.hash = 'home'; return; } return Test.open(m[1]); }
  return _route();
};
window.removeEventListener('hashchange', _route);
window.addEventListener('hashchange', () => route());
route();
Net.flush();

/* ---------- виходи зі сторінки під час бліцу й тесту (учитель бачить їх у таблиці) ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  const h = location.hash.slice(1);
  if (/^blitz\d$/.test(h) && Blitz.n === +h.slice(5) && !Blitz.mini && store.get('bdraft' + Blitz.n, null)) { Blitz.exits = (Blitz.exits || 0) + 1; Blitz.save(); }
  else if (/^t[12]$/.test(h) && store.get('tstart_' + h, null)) store.set('texits_' + h, store.get('texits_' + h, 0) + 1);
});

</script>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Руські удільні князівства у складі іноземних держав</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.lb-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; will-change: transform; }
.pic { touch-action: pan-x pan-y; }   /* щипок на зображенні не збільшує всю сторінку — відкриває перегляд */
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


.brand { margin: 28px 0 6px; text-align: center; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }

/* «← Усі теми» — повернення на полицю тем спільної оболонки */
.tback { display: inline-block; margin: 14px 0 0; font-weight: 700; font-size: 15px; color: var(--acc2); text-decoration: underline; }

/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }
.tlv .ev { position: relative; padding: 0 0 16px; display: grid; gap: 3px; }
.tlv .ev i { position: absolute; left: -25px; top: 4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--bg); }
.tlv .ev .y { color: var(--acc2); font-weight: 800; font-variant-numeric: tabular-nums; }
.tlv .ev .y.yprog { justify-self: start; background: var(--acc2); color: #161616; border-radius: 8px; padding: 1px 8px; }
.tlv .ev b { font-size: 17px; }
.legend { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.legend span.sw { width: 34px; height: 16px; background: var(--acc2); border-radius: 6px; }
/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }
.gp .tr { position: relative; height: 18px; background: #262626; border-radius: 6px; }
.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }
.part-btn .th img { max-width: 100%; max-height: 100%; }
.part-btn h3 { font-size: 18px; }
.part-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<button id="fsb" class="fsb" hidden aria-label="На весь екран">⤢</button>
<div class="lb" id="lb" role="dialog" aria-label="Перегляд зображення">
  <div class="lb-top"><button id="lbOut" aria-label="Зменшити">−</button><button id="lbIn" aria-label="Збільшити">+</button><button id="lbX" aria-label="Закрити">✕</button></div>
  <div class="lb-view" id="lbv"><img id="lbi" alt=""></div>
  <div class="lb-cap" id="lbc"></div>
</div>
<script>
const LESSONS = [{"id": "p1", "num": 1, "title": "Руські удільні князівства у складі іноземних держав", "part": "Частина 1. Литва й Польща в боротьбі за руські землі", "sub": "Від 1340 р. до 1430-х: спадщина Романовичів, Ольгерд і Сині Води, Кревська унія, Вітовт, Велике князівство Руське", "cover": {"key": "kreva", "cap": "Руїни Кревського замку (Білорусь). Тут 1382 р. загинув Кейстут, а 1385 р. Ягайло підписав Кревський акт. Фото: Aschroet / Wikimedia Commons, CC0"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **1362 р.** — битва біля р. Сині Води", "• **1385 р.** — укладення Кревської унії"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії", "light": false}, {"k": "p", "paras": ["• **Ольгерд** (Альгірдас)", "• **Вітовт** (Вітаутас)", "• **Свидригайло**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Картосхема", "light": false}, {"k": "p", "paras": ["• **Українські землі у складі різних держав** — тут їхній поділ між Литвою й Польщею; Угорщина, Молдавія, Москва й Крим — у частині 2"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Знати й пояснювати", "light": false}, {"k": "p", "paras": ["• становище руських земель у складі Великого князівства Литовського **до і після Кревської унії**", "• **причини й наслідки** Кревської унії", "• як постало **Велике князівство Руське Свидригайла**"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 5. Дати 40-ві рр. XV ст., 1478, 1489, 1514 рр., персоналії Хаджі-Герей, К. І. Острозький і Ю. Дрогобич, поняття й пам’ятки культури — у частинах 2 і 3."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Спадщина Романовичів", "sub": "Як постала Литва, українські землі на 1340 р., війна за Галичину й Волинь (1340 – 1392)", "cover": {"key": "yuri2_seal", "cap": ""}, "cards": [{"type": "text", "kicker": "Спадщина Романовичів", "title": "Як постало Велике князівство Литовське", "badges": ["поза програмою"], "paras": ["Литовські племена жили над Німаном і Вілією. У середині XIII ст. їх об’єднав князь **Міндовг**, а Новогрудок і сусідні руські землі стали ядром нової держави.", "Найбільше її розширив князь **Гедимін** (1316 – 1341). Під його владу перейшли **Полоцьк, Вітебськ, Мінськ, Пінськ** і **Берестя**. Столицею Гедимін зробив **Вільно**.", "Князівство швидко росло на схід і на південь, бо після монгольської навали руські землі були розрізнені й слабкі. Литва давала їм захист від Орди й мало втручалася в місцеве життя.", "Гедимін посадив своїх синів у руських містах: **Коріата** — у Новогрудку, **Ольгерда** — у Вітебську, а **Любарта** одружив із волинською княжною. Від Гедиміна пішла династія **Гедиміновичів**."], "imgs": [{"key": "gedimin", "cap": "Гедимін. Уявний портрет із «Хроніки Європейської Сарматії» О. Гваньїні (1578), пізніший відбиток. Суспільне надбання"}]}, {"type": "doc", "title": "Гедимін — «король литовців і багатьох русинів»", "quote": ["Гедимін, з Божої ласки король литовців і багатьох русинів, князь і володар Земгалії, — усім християнам по всьому світу.", "Ми відкриваємо наші землі, князівства й володіння кожному, хто прийде: рицарям і зброєносцям, купцям і лікарям, ковалям, теслям, шевцям, мірошникам і всім іншим ремісникам.", "Кожен житиме за своїм звичаєм, а купці їздитимуть нашою землею вільно, без мита й перешкод."], "source": "Листи Гедиміна до ганзейських міст, 1323 р. (переклад-переказ з латини, скорочено)", "comment": ["У 1323 р. Гедимін розіслав листи до німецьких міст і кликав до себе майстрів і купців. Того ж року він уперше назвав Вільно своєю столицею.", "Титул «король литовців і **багатьох русинів**» показує, що руські землі вже тоді становили велику частину держави.", "__Слова з джерела:__ **Земгалія** — область на півночі, у сучасній Латвії; **зброєносець** — юнак, що служив рицареві; **мито** — плата за провезення товару."], "img": null}, {"type": "map", "title": "Як росло Велике князівство Литовське", "steps": [{"key": "map_gdl0", "label": "До 1263 р."}, {"key": "map_gdl1", "label": "До 1341 р."}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["Перший крок: **литовські землі Міндовга** (до 1263 р.) разом із Новогрудком.", "До **1341 р.** до неї ввійшли білоруські князівства — **Полоцьке, Вітебське, Мінське, Пінське**, а також **Берестейщина** з **Підляшшям**. Дві останні — це вже українські землі.", "Як держава росла за Ольгерда й Вітовта, покаже карта наприкінці розповіді про Вітовта."]}, {"type": "map", "title": "Українські землі на 1340 р.", "steps": [{"key": "map_m1340", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["У квітні **1340 р.** бояри отруїли у Володимирі **Юрія II Болеслава**. Чоловіча лінія Романовичів урвалася ще в 1323 р., а Юрій II — їхній родич по матері — дітей не мав. Держава лишилася без законного спадкоємця.", "Північні землі — **Берестейщина й Підляшшя** — уже належали Литві. **Закарпаттям** володіла Угорщина.", "**Київська, Чернігово-Сіверська й Переяславська** землі, а також **Поділля** платили данину **Золотій Орді**: тут правили місцеві князі або ординські намісники.", "На спадщину претендували **Польща**, **Угорщина** й **Литва**, а Галичиною фактично правили бояри. Хто забере Галичину й Волинь, вирішувала війна, що тривала **понад пів століття**."]}, {"type": "text", "kicker": "Спадщина Романовичів", "title": "Хто боровся за Галичину й Волинь", "badges": [], "paras": ["**Велике князівство Литовське.** Волинські бояри покликали на князювання **Любарта Гедиміновича**, одруженого з волинською княжною. Він спирався на Волинь із **Луцьком** і **Володимиром**.", "**Королівство Польське.** Король **Казимир III** стверджував, що Юрій II заповів державу йому. Король хотів забрати Галичину з **Львовом** — багатий край, через який ішли торгові шляхи до Чорного моря.", "**Угорщина.** Угорські королі вважали Галичину своєю ще з часів боротьби за спадщину Романа Мстиславича. Казимир домовився з ними: якщо він помре без сина, Галичина перейде до Угорщини.", "**Галицькі бояри.** Галичиною в 1340 – 1349 рр. фактично правив боярин **Дмитро Детько**. Він визнавав зверхність Любарта й шукав підтримки то в Орди, то в Угорщини."], "imgs": [{"key": "casimir", "cap": "Казимир III Великий, король Польщі (1333 – 1370). Ян Матейко, «Портрети польських королів і князів» (1890-ті). Суспільне надбання"}]}, {"type": "map", "title": "Війна за галицько-волинську спадщину (1340 – 1392)", "steps": [{"key": "map_war0", "label": "1340 – 1349"}, {"key": "map_war1", "label": "1349 – 1366"}, {"key": "map_war2", "label": "До 1392 р."}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["У **1340 р.** Казимир III захопив Львів і вивіз скарбницю, але втримати місто не зміг.", "У **1349 р.** Казимир захопив **Галичину**, а згодом і частину Волині. За угодою **1366 р.** Польща отримала **Холмщину, Белзчину й Володимир**, а Любарт зберіг **Луцьку землю**.", "Після смерті Казимира (1370) Любарт відвоював Володимир. Галичиною правили угорські намісники, аж поки в **1387 р.** королева **Ядвіга** не приєднала її до Польщі остаточно.", "Війна скінчилася в **1392 р.**: Галичина відійшла до Польщі, Волинь — до Литви. **Західне Поділля** з Кам’янцем ще довго лишалося спірним."]}]}, {"id": "s2", "num": "II", "title": "Ольгерд і Сині Води", "sub": "Ольгерд, битва на Синіх Водах 1362 р., руські землі у Великому князівстві Литовському", "cover": {"key": "p1_synivody", "cap": ""}, "cards": [{"type": "text", "kicker": "Ольгерд і Сині Води", "title": "Ольгерд (Альгірдас) — великий князь литовський (1345 – 1377)", "badges": ["НМТ: персоналія"], "paras": ["Ольгерд, син Гедиміна, став великим князем у **1345 р.** Державою він правив разом із братом **Кейстутом**: Ольгерд воював на сході й півдні, Кейстут обороняв захід від Тевтонського ордену.", "Обидві дружини Ольгерда були руськими православними княжнами: **Марія Вітебська** й **Уляна Тверська**. Сини від першого шлюбу — Андрій, Дмитро, Володимир — були православними й отримали руські князівства.", "Ольгерд приєднав **Брянщину, Чернігово-Сіверщину, Київщину, Переяславщину й Поділля**. Тричі (1368, 1370, 1372) він ходив на **Москву**, бо її князі теж збирали руські землі під свою владу.", "Наприкінці правління Ольгерда Велике князівство Литовське стало **найбільшою державою Європи**; майже дев’ять десятих його земель були руськими."], "imgs": [{"key": "olgerd", "cap": "Ольгерд. Уявний портрет із «Хроніки Європейської Сарматії» О. Гваньїні (1578). Суспільне надбання"}]}, {"type": "map", "title": "Сині Води (1362): похід Ольгерда", "steps": [{"key": "map_olgerd0", "label": "Перед 1362 р."}, {"key": "map_olgerd1", "label": "Після Синіх Вод"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["З **1359 р.** **Золоту Орду** охопила «велика зам’ятня»: за двадцять років на троні змінилося понад двадцять ханів.", "Ще в **1356 р.** Ольгерд приєднав **Брянськ** і посадив там сина **Дмитра**. Тепер він скористався слабкістю Орди й рушив на південь.", "Далі на півдні лежало **Поділля**: ним правили три татарські князі-брати, а данину збирали їхні **отамани й баскаки**.", "— і побачите наслідки походу.__ Восени **1362 р.** військо Ольгерда розбило татар на річці **Сині Води** (ймовірно, Синюха, притока Південного Бугу). Київщина й Поділля перейшли під владу Литви. У **1360 – 1370-х рр.** до Литви поступово перейшла й **Чернігово-Сіверщина**."]}, {"type": "doc", "title": "Сині Води в літописах", "quote": ["__Рогозький літописець:__ Того ж року [6871, тобто 1362 або 1363] Ольгерд Синю Воду й Білобережжя повоював.", "__Хроніка Биховця:__ …пішов у поле з військом своїм і побив на Синій Воді татар, трьох братів: Хачебея, Кутлубугу й Дмитра. А ті три брати були отчичами й дідичами Подільської землі, а від них правили отамани, а приїжджаючи, баскаки брали з Поділля данину."], "source": "Рогозький літописець (XV ст.); Хроніка Биховця (XVI ст.) — переклад-переказ, скорочено", "comment": ["Перший уривок — коротка звістка з літописного зводу XV ст. Другий записали литовські книжники значно пізніше; від них ми знаємо імена ординських князів.", "Обидва джерела короткі й не збігаються в подробицях, тому про рік (1362 чи 1363) і місце битви історики досі сперечаються.", "__Слова з літопису:__ **повоювати** — пройти війною, підкорити; **Білобережжя** — пониззя Дніпра; **отчичі й дідичі** — спадкові володарі; **баскак** — ординський збирач данини."], "img": {"key": "stamp_sv", "cap": "Поштова марка Литви до 650-річчя битви на Синіх Водах (2012). Суспільне надбання"}}, {"type": "cols", "title": "Наслідки битви на Синіх Водах", "badges": ["НМТ: дата"], "intro": "Битва на Синіх Водах — одна з перших великих перемог над Ордою на руських землях.", "blocks": [{"h": "Для руських земель", "paras": ["• **Київщина й Поділля** звільнилися від прямої влади Орди.", "• У **Києві** Ольгерд посадив свого сина **Володимира**, а на **Поділлі** — небожів **Коріатовичів**.", "• Ординці ще кілька десятиліть брали з Поділля частину данини, але правили тут уже литовські князі."]}, {"h": "Для Литви й Орди", "paras": ["• Велике князівство Литовське дійшло до **степу**.", "• Під владою Орди залишилися **степи Причорномор’я** й **Крим**.", "• Литва стала головним суперником **Москви** в боротьбі за руські землі."]}]}, {"type": "text", "kicker": "Ольгерд і Сині Води", "title": "Руські землі у складі Литви: «старини не рушимо»", "badges": [], "paras": ["Гедиміновичі, що стали князями в руських містах, приймали **православ’я**, говорили руською мовою й радилися з місцевими боярами. Тому руська знать сприймала литовських князів як своїх.", "У руських землях збереглися **удільні князівства**: Київське, Волинське, Чернігово-Сіверське, Подільське. Змінилася лише династія: замість Рюриковичів правили Гедиміновичі.", "Суди тривалий час спиралися на **«Руську правду»**. **Руська мова** стала мовою державної канцелярії: нею писали грамоти й закони.", "Велике князівство не ламало місцевих порядків. Цю політику описують висловом **«Старини не рушимо, новини не вводимо»**. Через це, а ще тому, що руськими були більшість земель і населення, історики називають цю державу **Литовсько-Руською**."], "imgs": [{"key": "koriat_seal", "cap": "Печатка Олександра Коріатовича, подільського князя, 1375 р. (прорис XIX ст.). Суспільне надбання"}]}]}, {"id": "s3", "num": "III", "title": "Кревська унія (1385)", "sub": "Ягайло, причини унії, Кревський акт, зміни після 1386 р., опір Вітовта", "cover": {"key": "p1_monument", "cap": ""}, "cards": [{"type": "text", "kicker": "Кревська унія", "title": "Ягайло і боротьба за литовський престол", "badges": [], "paras": ["Після смерті Ольгерда (**1377**) великим князем став його син від Уляни Тверської — **Ягайло**. Старші сини Ольгерда, від першого шлюбу, з цим не змирилися: Андрій Полоцький і Дмитро Брянський перейшли на бік **Москви**.", "Проти Ягайла виступив і його дядько **Кейстут**. У **1381 р.** він захопив Вільно. Наступного року Ягайло відвоював столицю, а Кейстута ув’язнив у **Кревському замку**, де той і загинув.", "Син Кейстута **Вітовт** утік із Крева в одязі служниці своєї дружини й попросив допомоги в **Тевтонського ордену**.", "Ягайлові загрожували водночас Орден, Москва й власна родина. Він шукав сильного союзника."], "imgs": [{"key": "jogaila_g", "cap": "Ягайло. Уявний портрет із «Хроніки Європейської Сарматії» О. Гваньїні (1578). Суспільне надбання"}]}, {"type": "cols", "title": "Чому Литва й Польща пішли на союз", "badges": [], "intro": "Обидві сторони мали спільного ворога й потребували одна одної.", "blocks": [{"h": "Чого хотів Ягайло", "paras": ["• Разом із Польщею протистояти **Тевтонському ордену**, який роками нападав на Литву під гаслом хрещення поган.", "• Здобути **польську корону** й посилити владу над братами.", "• Охрестити Литву самому, щоб Орден утратив привід для походів."]}, {"h": "Чого хотіла польська знать", "paras": ["• Знайти чоловіка юній королеві **Ядвізі**: після смерті її батька Людовика (1382) Польща мала королеву, але не мала правителя-воїна.", "• Отримати союзника проти **Ордену**.", "• Повернути **Галичину**, якою тоді правили угорці, і приєднати багаті землі Литви."]}]}, {"type": "doc", "title": "Кревський акт (14 серпня 1385 р.)", "quote": ["Великий князь Ягайло обіцяє… разом з усіма своїми братами, ще не хрещеними, з родичами, панами й усіма людьми його землі прийняти католицьку віру святої римської церкви.", "Обіцяє повернути Королівству Польському землі, що були від нього відірвані й захоплені будь-ким.", "Обіцяє також навіки приєднати свої землі литовські й руські до Корони Королівства Польського."], "source": "Кревський акт, грамота Ягайла (переклад-переказ з латини, скорочено)", "comment": ["Ягайло підписав акт у **Кревському замку**. Він обіцяв також звільнити польських полонених і заплатити 200 тисяч флоринів австрійському принцові, з яким раніше заручили Ядвігу.", "Латинське слово **applicare** — «приєднати» — історики тлумачать по-різному: одні бачать у ньому включення Литви до Польщі, інші — лише союз двох держав під владою одного монарха.", "__Слова з джерела:__ **Корона** — Польське королівство як держава; **флорин** — золота монета."], "img": {"key": "p1_kreva_act", "cap": "Кревський акт"}}, {"type": "map", "title": "Кревська унія на карті", "steps": [{"key": "map_kreva", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["**14 серпня 1385 р.** у Креві Ягайло підписав угоду з польськими послами.", "У **лютому – березні 1386 р.** у Кракові Ягайло охрестився під іменем **Владислав**, одружився з **Ядвігою** й коронувався як **Владислав II Ягайло**.", "У **1387 р.** Ядвіга з польським військом забрала в угорців **Галичину**.", "Так Литва й Польща отримали спільного монарха — постала **польсько-литовська унія**. Спільним ворогом обох держав був **Тевтонський орден**: у **1410 р.** їхнє військо розбило його під **Грюнвальдом**."]}, {"type": "text", "kicker": "Кревська унія", "title": "Що змінилося після унії", "badges": [], "paras": ["У **1387 р.** Ягайло охрестив литовців у католицьку віру. Того ж року він видав привілей **литовським боярам-католикам**: вони отримали права на свої землі й звільнилися від частини повинностей.", "Православні руські князі й бояри таких прав не отримали. Відтоді православні мали **менше прав, ніж католики**.", "У Вільні постало **католицьке єпископство**, по містах будували костели. Волинь і Київщина залишилися у складі Литви, а Галичина — у складі Польщі.", "Повного об’єднання держав не сталося: литовська й руська знать не хотіла втрачати владу."], "imgs": [{"key": "chrzest", "cap": "Ян Матейко. «Хрещення Литви 1387 р.» (1889). Суспільне надбання"}]}, {"type": "text", "kicker": "Кревська унія", "title": "Вітовт проти унії (1389 – 1392)", "badges": [], "paras": ["Литовська знать боялася, що Литва стане польською провінцією. Невдоволених очолив **Вітовт**, якого литовські й руські бояри поважали більше, ніж Ягайла.", "Вітовт удруге звернувся по допомогу до **Тевтонського ордену** й воював з намісниками Ягайла. Жоден із суперників не міг перемогти.", "У **1392 р.** Ягайло й Вітовт уклали **Островську угоду**. Вітовт став правителем Литви, хоча формально визнавав старшинство Ягайла.", "Велике князівство Литовське зберегло власного князя й лишилося окремою державою."], "imgs": [{"key": "p1_vytautas", "cap": "Вітовт. Портрет XVII ст."}]}]}, {"id": "s4", "num": "IV", "title": "Вітовт (1392 – 1430)", "sub": "Ліквідація уділів, похід на Орду й Ворскла 1399 р., унії 1401 і 1413 рр., Луцький з’їзд", "cover": {"key": "p1_vyt_grunwald", "cap": ""}, "cards": [{"type": "text", "kicker": "Вітовт", "title": "Вітовт (Вітаутас) — великий князь литовський (1392 – 1430)", "badges": ["НМТ: персоналія"], "paras": ["Вітовт, син Кейстута, народився близько **1350 р.** Він утратив батька, утік із Кревського замку, роками воював з Ягайлом, а в **1392 р.** став правителем Литви.", "Вітовт не хотів ділити владу з удільними князями. Він забрав у них руські князівства й поставив там **намісників**, відданих лише йому.", "Князь хотів підпорядкувати собі Золоту Орду, але в **1399 р.** зазнав поразки на **Ворсклі**. Після цього він уклав угоди з Польщею й разом з нею в **1410 р.** розбив Тевтонський орден під **Грюнвальдом**.", "Під кінець життя Вітовт правив державою від Балтійського до Чорного моря. Помер він у **1430 р.** у Троках."], "imgs": [{"key": "vytautas_g", "cap": "Вітовт. Уявний портрет із «Хроніки Європейської Сарматії» О. Гваньїні (1578). Суспільне надбання"}, {"key": "vyt_seal", "cap": "Печатка Вітовта. Суспільне надбання"}]}, {"type": "defs", "title": "Як Вітовт ліквідував удільні князівства (1393 – 1395)", "badges": [], "items": [{"name": "Чернігово-Сіверщина", "paras": ["Новгород-Сіверського князя **Дмитра-Корибута** Вітовт позбавив уділу в **1393 р.**"], "img": null}, {"name": "Поділля", "paras": ["У **1393 – 1394 рр.** Вітовт рушив на **Федора Коріатовича** й узяв подільські замки.", "Федір утік до Угорщини, де згодом отримав **Мукачево**."], "img": null}, {"name": "Київщина", "paras": ["У **1394 – 1395 рр.** Вітовт забрав Київ у **Володимира Ольгердовича**, а натомість дав йому Копиль.", "Києвом відтоді правили намісники Вітовта."], "img": null}, {"name": "Волинь", "paras": ["Син Любарта **Федір** утратив Волинь ще в 1380-х рр.", "З 1390-х рр. Волинню правив сам Вітовт і часто жив у **Луцьку**."], "img": null}], "note": "Замість удільних князів руськими землями відтоді правили **намісники** великого князя. Місцеві князі втратили владу й були цим невдоволені."}, {"type": "map", "title": "Ворскла (1399): передумови", "steps": [{"key": "map_vorskla_pre", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["Вітовт хотів, щоб Ордою правив залежний від нього хан. Він прийняв у себе вигнаного **Тохтамиша** й пообіцяв повернути йому владу.", "У **1397 – 1398 рр.** литовське військо ходило в степ і до Криму. Велике князівство вийшло до **Чорного моря** між Дністром і Дніпром.", "Улітку **1399 р.** Вітовт рушив проти хана **Темір-Кутлуга** й еміра **Едигея**. Із ним ішли руські князі, Тохтамиш із татарами, польські й тевтонські лицарі."]}, {"type": "map", "title": "Битва на Ворсклі (12 серпня 1399 р.): схема-реконструкція", "steps": [{"key": "map_vorskla", "label": "Крок 1"}]}, {"type": "text", "kicker": "Вітовт", "title": "Наслідки битви на Ворсклі", "badges": ["поза програмою"], "paras": ["Битва **12 серпня 1399 р.** скінчилася розгромом війська Вітовта. Загинули десятки князів, серед них сини Ольгерда **Андрій Полоцький** і **Дмитро Брянський**.", "Едигей пройшов з військом до **Києва**, узяв з міста викуп і спустошив землі аж до **Луцька**.", "Вітовт мусив відмовитися від планів підкорити Орду. Сил на суперництво з Ягайлом у нього вже не було, тож він пішов на угоду.", "У **1401 р.** Вітовт і Ягайло уклали **Віленсько-Радомську унію**: Вітовт довічно правив Литвою, а після його смерті Литва мала повернутися до Ягайла й польської Корони."], "imgs": [{"key": "vorskla_lic", "cap": "Битва на Ворсклі. Мініатюра Лицевого літописного зводу (XVI ст.) — пізня ілюстрація. Суспільне надбання"}]}, {"type": "text", "kicker": "Вітовт", "title": "Грюнвальдська битва (15 липня 1410 р.)", "badges": ["поза програмою"], "paras": ["Литва й Польща об’єдналися насамперед проти **Тевтонського ордену**. Велика війна з ним почалася в 1409 р.", "Під **Грюнвальдом** польсько-литовське військо Ягайла й Вітовта розгромило лицарів. Загинув великий магістр **Ульріх фон Юнгінген**.", "Серед литовських полків були руські хоругви: **київська, луцька, володимирська, кременецька, новгород-сіверська, стародубська**, а також **смоленські** полки, що не відступили під натиском лицарів. На польському боці билися хоругви **Львова, Галича й Перемишля**.", "Після цієї поразки Орден уже не мав колишньої сили."], "imgs": [{"key": "grunwald_mp", "cap": "Ян Матейко. «Битва під Грюнвальдом» (1878). Національний музей у Варшаві. Суспільне надбання"}]}, {"type": "doc", "title": "Городельська унія (2 жовтня 1413 р.)", "quote": ["Землі Литви, що вже раніше були приєднані до нашого Королівства Польського, ми знову приєднуємо…", "Литовські пани й шляхтичі, що приймають ці привілеї, мають бути католиками й послушними святій римській церкві, а не схизматиками чи іншими невірними.", "На посади й у раду великого князя мають обиратися тільки католики."], "source": "Городельський привілей (переклад-переказ з латини, скорочено)", "comment": ["Після перемоги під Грюнвальдом Ягайло й Вітовт уклали нову угоду в **Городлі** над Бугом. Литва зберігала **власного великого князя** й після смерті Вітовта.", "47 литовських родів-католиків отримали польські **герби** й ті самі права, що й польська шляхта. У Вільні й Троках запровадили посади **воєвод** і **каштелянів**.", "Православних руських князів і бояр **не допускали до вищих посад**. Руська знать була цим невдоволена й шукала князя, який зрівняв би її в правах із католиками.", "__Слова з джерела:__ **схизматики** — так католики називали православних."], "img": {"key": "horodlo", "cap": "Городельський акт із печатками литовських родів. Суспільне надбання"}}, {"type": "text", "kicker": "Вітовт", "title": "Луцький з’їзд монархів (1429)", "badges": ["поза програмою"], "paras": ["Узимку **1429 р.** до **Луцька** на запрошення Вітовта з’їхалися правителі Європи: король Угорщини й Німеччини **Сигізмунд Люксембурзький** (згодом імператор), Ягайло, посли папи, Візантії й Тевтонського ордену.", "Монархи обговорювали оборону від **Османської імперії** й справи Литви. Сигізмунд запропонував Вітовтові **королівську корону**.", "Польська знать злякалася, що Литва стане окремим королівством. Коли в **1430 р.** посли везли корону, поляки перехопили їх на кордоні.", "Вітовт помер **27 жовтня 1430 р.**, так і не ставши королем. Невдовзі почалася боротьба за його спадщину."], "imgs": [{"key": "lutsk1429", "cap": "Ю. Мацкевічюс. «Вітовт приймає монархів у Луцьку». Суспільне надбання"}]}, {"type": "map", "title": "Велике князівство Литовське за Вітовта", "steps": [{"key": "map_gdl2", "label": "До 1377 р."}, {"key": "map_gdl3", "label": "До 1430 р."}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["Спершу на карті — держава Ольгерда (до 1377 р.); світлим обідком обведено землі, які приєднав він.", "У **1395 – 1404 рр.** Вітовт підкорив **Смоленськ**.", "Після походів у степ Литва вийшла до **Чорного моря** між Дністром і Дніпром. Тут стояла фортеця **Хаджибей** — на місці сучасної Одеси.", "Литва за Вітовта простягалася «від моря до моря»."]}]}, {"id": "s5", "num": "V", "title": "Свидригайло й Велике князівство Руське", "sub": "Боротьба за престол 1430 – 1435 рр., Вількомир, привілеї православній знаті", "cover": {"key": "sigism_seal", "cap": ""}, "cards": [{"type": "text", "kicker": "Свидригайло", "title": "Свидригайло Ольгердович", "badges": ["НМТ: персоналія"], "paras": ["Свидригайло — наймолодший син Ольгерда й Уляни Тверської. За Вітовта він кілька разів повставав, тікав до Москви й до Ордену, а в **1409 – 1418 рр.** сидів ув’язнений у **Кременці**.", "Звільнили його волинські князі на чолі з **Дашком Острозьким**. Відтоді руська православна знать бачила у Свидригайлі свого захисника.", "Після смерті Вітовта (**1430**) литовські й руські пани обрали Свидригайла великим князем, не чекаючи згоди польських панів.", "Свидригайло правив Литвою в **1430 – 1432 рр.**, а в **1432 – 1435 рр.** очолював **Велике князівство Руське**. Він помер у **1452 р.** в Луцьку."], "imgs": [{"key": "svydr", "cap": "Свидригайло. Уявний портрет із «Хроніки Європейської Сарматії» О. Гваньїні (1578). Суспільне надбання"}]}, {"type": "cols", "title": "Чому руська знать підтримала Свидригайла", "badges": [], "intro": "Боротьба за престол після смерті Вітовта була водночас боротьбою за рівні права православної знаті.", "blocks": [{"h": "Причини", "paras": ["• Після **Городельської унії** православні не могли посідати вищих посад.", "• Вітовт відібрав у руських князів уділи й посадив намісників.", "• Свидригайло, хоч і був хрещений у католицтво, спирався на православних князів і обіцяв їм рівні права."]}, {"h": "Як відповіли противники Свидригайла", "paras": ["• У **1432 р.** литовські пани поставили великим князем **Сигізмунда Кейстутовича**, брата Вітовта.", "• Щоб привернути руську знать на свій бік, Ягайло й Сигізмунд видали привілеї **1432 і 1434 рр.**: православні отримали **ті самі права на землю й суд**, що й католики.", "• Вищі посади, як і раніше, обіймали лише католики."]}]}, {"type": "map", "title": "Велике князівство Руське (1432 – 1435)", "steps": [{"key": "map_rus1432", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["У **1430 р.** польські шляхтичі захопили **Західне Поділля** з Кам’янцем. У **1431 р.** Ягайло обложив **Луцьк**, але взяти замок не зміг.", "Після перевороту **1432 р.** держава розкололася: Литва визнала Сигізмунда, а руські землі — **Київщина, Волинь, Чернігово-Сіверщина, Полоччина, Вітебщина, Смоленщина** — залишилися вірними Свидригайлові. Так постало **Велике князівство Руське**."]}, {"type": "text", "kicker": "Свидригайло", "title": "Чим скінчилася боротьба", "badges": [], "paras": ["Під **Вількомиром** **1 вересня 1435 р.** Свидригайло разом із лицарями **Лівонського ордену** програв Сигізмундові, якого підтримали поляки. Десятки руських князів загинули або потрапили в полон.", "Свидригайло ще кілька років тримався на **Київщині** й **Волині**, але Велике князівство Руське розпалося.", "У **1440 р.** змовники вбили Сигізмунда. Свидригайло повернувся на **Волинь** і княжив там до смерті (1452).", "Руська знать не здобула окремої держави, але привілеї 1432 – 1434 рр. зрівняли її в правах на землю з литовською. Про відновлення Київського й Волинського князівств — у частині 2."], "imgs": [{"key": "svydr_seals", "cap": "Печатки Свидригайла 1431 і 1451 рр. (прорис). Фото: Олег Однороженко / Wikimedia Commons, CC BY-SA 4.0"}]}]}, {"id": "s6", "num": "VI", "title": "Підсумки частини 1", "sub": "Династія Гедиміновичів, руські землі до і після Кревської унії, унії, що часто плутають на НМТ, стрічки часу", "cover": {"key": "p1_grunwald", "cap": ""}, "cards": [{"type": "defs", "title": "Гедиміновичі: хто правив руськими землями", "badges": [], "items": [{"name": "Гедимін (1316 – 1341)", "paras": ["Сини: Коріат (Новогрудок); Любарт (Волинь 1340 – бл. 1384); **Ольгерд** (1345 – 1377); Кейстут (1381 – 1382)."], "img": null}, {"name": "Коріат (Новогрудок)", "paras": ["Син: Коріатовичі (Поділля 1362 – 1394)."], "img": null}, {"name": "Ольгерд (1345 – 1377)", "paras": ["Сини: Володимир (Київ 1362 – 1394); Ягайло (1377 – 1392); **Свидригайло** (1430 – 1432)."], "img": null}, {"name": "Кейстут (1381 – 1382)", "paras": ["Сини: **Вітовт** (1392 – 1430); Сигізмунд (1432 – 1440)."], "img": null}, {"name": "Володимир (Київ 1362 – 1394)", "paras": ["Син: Олелько (Київ 1440 – 1454)."], "img": null}], "note": "Роки — час правління великим князем (або в зазначеній землі). Ягайло з 1386 р. — король Польщі. Олелько — засновник роду Олельковичів (частина 2). Жирним виділено персоналії з програми НМТ."}, {"type": "table", "title": "Руські землі у складі Литви: до і після Кревської унії", "rows": [["", "До 1385 р.", "Після 1385 р."], ["Влада на місцях", "Удільні князі-Гедиміновичі", "Вітовт ліквідує уділи, призначає намісників"], ["Віра", "Православ’я — віра більшості, зокрема руської знаті", "Католицтво стає державною вірою; православних не допускають до вищих посад (з 1413 р.)"], ["Права знаті", "Руські й литовські бояри рівні", "Пільги лише боярам-католикам (1387, 1413); у 1432 – 1434 рр. права на землю й суд отримали й православні, вищі посади — далі лише католики"], ["Зв’язок із сусідами", "Литва — окрема держава", "Унія з Польщею, посилення польського впливу"], ["Мова й право", "Руська мова канцелярії, «Руська правда»", "Руська мова й місцеві звичаї зберігаються"]]}, {"type": "table", "title": "Унії Литви й Польщі", "rows": [["Унія", "Хто й де уклав", "Головне"], ["Кревська, 1385", "Ягайло й польські посли, Крево", "Ягайло обіцяв охрестити Литву й «приєднати» її до Польщі; у 1386 р. став королем Польщі"], ["Віленсько-Радомська, 1401", "Ягайло й Вітовт, Вільно й Радом", "Вітовт — довічний правитель Литви; після його смерті Литва переходить до Ягайла"], ["Городельська, 1413", "Ягайло й Вітовт, Городло", "Литва зберігає власного великого князя; права шляхти лише для католиків"], ["Люблінська, 1569", "сейм у Любліні (тема 6)", "Утворення Речі Посполитої"]]}, {"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Плутають", "Як правильно"], ["Сині Води, Ворскла, Грюнвальд", "**1362** — перемога Ольгерда над Ордою; **1399** — поразка Вітовта від Орди; **1410** — перемога над Тевтонським орденом"], ["Ольгерд і Вітовт", "**Ольгерд** приєднав Київщину й Поділля; **Вітовт** ліквідував удільні князівства"], ["Ягайло й Владислав II", "Це одна людина: литовське ім’я та ім’я, отримане під час хрещення в 1386 р."], ["Велике князівство Руське й Королівство Руське", "**Велике князівство Руське** — Свидригайло, 1432 – 1435; **Королівство Руське** — Галицько-Волинська держава"], ["Свидригайло й Сигізмунд Кейстутович", "**Свидригайло** — син Ольгерда, його підтримала руська знать; **Сигізмунд Кейстутович** — брат Вітовта, його підтримала Польща"], ["Галичина й Волинь після 1392 р.", "Галичина — у складі **Польщі**; Волинь — у складі **Литви**"]]}, {"type": "tl_events", "title": "Стрічка часу: події 1340 – 1435 рр.", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "1340", "name": "Смерть Юрія II", "desc": "початок війни за спадщину", "color": "#a6a6a6", "prog": false}, {"year": "1349", "name": "Казимир III", "desc": "Галичина — Польщі", "color": "#e05a47", "prog": false}, {"year": "1362", "name": "Сині Води", "desc": "Київщина й Поділля — Литві", "color": "#8ccf84", "prog": true}, {"year": "1385", "name": "Кревська унія", "desc": "Ягайло обіцяв охрестити Литву", "color": "#e97132", "prog": true}, {"year": "1392", "name": "Островська угода", "desc": "Вітовт править Литвою", "color": "#8ccf84", "prog": false}, {"year": "1399", "name": "Ворскла", "desc": "поразка Вітовта від Орди", "color": "#e05a47", "prog": false}, {"year": "1413", "name": "Городельська унія", "desc": "права лише католикам", "color": "#e97132", "prog": false}, {"year": "1432", "name": "Велике князівство Руське", "desc": "Свидригайло", "color": "#c2b280", "prog": false}, {"year": "1435", "name": "Вількомир", "desc": "поразка Свидригайла", "color": "#e05a47", "prog": false}]}, {"type": "tl_periods", "title": "Стрічка часу: хто правив Литвою, Волинню й Галичиною", "note": "Литва: до **1341** — Гедимін, **1341 – 1345** — Явнут, **1430 – 1432** — Свидригайло. На Волині Свидригайло княжив з перервою наприкінці 1430-х. Відстані — у масштабі.", "x_from": 1338, "x_to": 1455, "ticks": [[1340, "1340"], [1360, "1360"], [1380, "1380"], [1400, "1400"], [1420, "1420"], [1440, "1440"]], "events": [[1362, "1362"], [1385, "1385"], [1399, "1399"], [1435, "1435"]], "prog": [[1361.4, 1362.6, "1362"], [1384.4, 1385.6, "1385"]], "rows": [{"name": "Литва", "segs": [{"a": 1338, "b": 1341, "color": "#a9dda0", "sub": ""}, {"a": 1345, "b": 1377, "color": "#8ccf84", "sub": "Ольгерд"}, {"a": 1377, "b": 1392, "color": "#62b87a", "sub": "Ягайло"}, {"a": 1392, "b": 1430, "color": "#7fd06a", "sub": "Вітовт"}, {"a": 1430, "b": 1432, "color": "#c2b280", "sub": ""}, {"a": 1432, "b": 1440, "color": "#5fb8a8", "sub": "Сигізмунд"}]}, {"name": "Волинь", "segs": [{"a": 1340, "b": 1386, "color": "#8ccf84", "sub": "Любарт і його син"}, {"a": 1386, "b": 1430, "color": "#7fd06a", "sub": "намісники"}, {"a": 1430, "b": 1452, "color": "#c2b280", "sub": "Свидригайло"}]}, {"name": "Галичина", "segs": [{"a": 1340, "b": 1349, "color": "#a6a6a6", "sub": "бояри"}, {"a": 1349, "b": 1370, "color": "#e05a47", "sub": "Казимир III"}, {"a": 1370, "b": 1387, "color": "#b48ae0", "sub": "угорці"}, {"a": 1387, "b": 1455, "color": "#e05a47", "sub": "Польща"}]}]}]}]}, {"id": "p2", "num": 2, "title": "Руські удільні князівства у складі іноземних держав", "part": "Частина 2. Від уділів до воєводств. Сусідні держави й степ", "sub": "1440 – 1520-ті рр.: Олельковичі, Москва й Орша, землі у складі сусідніх держав; Кримське ханство; козацтво", "cover": {"key": "orsha", "cap": "Невідомий художник з кола Лукаса Кранаха Старшого. «Битва під Оршею» (бл. 1520 – 1530). Національний музей у Варшаві. Суспільне надбання"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **40-ві рр. XV ст.** — утворення Кримського ханства", "• **1478 р.** — визнання Кримським ханством васальної залежності від Османської імперії", "• **1489 р.** — перша згадка про українських козаків", "• **1514 р.** — битва біля м. Орша"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії", "light": false}, {"k": "p", "paras": ["• **Хаджі-Герей**", "• **Костянтин Іванович Острозький**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття й картосхема", "light": false}, {"k": "p", "paras": ["• **«Дике поле»**, **«козак»**", "• картосхема: **українські землі у складі різних держав**; **територія Кримського ханства**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Знати й пояснювати", "light": false}, {"k": "p", "paras": ["• ліквідацію **Волинського й Київського** удільних князівств", "• становище українських земель у складі **сусідніх держав** (уміти їх **порівнювати**)", "• **причини виникнення козацтва**"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 5. Поняття «шляхтич», «магдебурзьке право», «магістрат», «цех», персоналія Юрій Дрогобич і пам’ятки культури — у частині 3."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Від уділів до воєводств", "sub": "Олельковичі в Києві, ліквідація Волинського (1452) й Київського (1471) князівств", "cover": {"key": "olelk", "cap": ""}, "cards": [{"type": "text", "kicker": "Від уділів до воєводств", "title": "Казимир відновлює удільні князівства (1440)", "badges": [], "paras": ["У **1440 р.** змовники вбили великого князя Сигізмунда Кейстутовича. Литовські пани посадили на престол 12-річного **Казимира**, сина Ягайла. У **1447 р.** він став ще й королем Польщі.", "Після поразки Свидригайла (1435) руська знать лишилася без своїх князів і втратила вплив. Щоб примирити її з новою владою, Казимир відновив **два удільні князівства**.", "**Олелько (Олександр) Володимирович**, онук Ольгерда, отримав **Київ**, а старий **Свидригайло** — **Волинь**.", "Руська знать знову мала своїх князів у **Києві** й **Луцьку**, із власним двором і військом."], "imgs": [{"key": "casimir4", "cap": "Казимир Ягеллончик — великий князь литовський (з 1440) і король Польщі (з 1447). Ян Матейко, «Портрети польських королів і князів». Суспільне надбання"}]}, {"type": "text", "kicker": "Від уділів до воєводств", "title": "Олельковичі в Києві", "badges": [], "paras": ["Олелько Володимирович (1440 – 1454) і його син **Семен Олелькович** (1455 – 1470) правили Києвом як удільні князі майже тридцять років. Для Києва це був спокійний час: князь жив у місті, тримав двір і військо.", "Семен Олелькович у **1470 р.** відбудував **Успенський собор Києво-Печерського монастиря**, зруйнований під час монгольської навали.", "Частина знаті Великого князівства Литовського хотіла обрати Семена великим князем. Тому Казимир побоювався сильних Олельковичів.", "Коли Семен помер (**1470**), король не віддав Київ його братові **Михайлові**, а призначив воєводою литовського пана-католика **Мартина Гаштольда**. Кияни спершу відмовилися його приймати, бо він не був ні князем, ні православним."], "imgs": [{"key": "lavra", "cap": "Успенський собор Києво-Печерської лаври. Нинішня будівля відновлена в 1998 – 2000 рр. Фото: George Chernilevsky, суспільне надбання"}]}, {"type": "map", "title": "Ліквідація удільних князівств (1452, 1471)", "steps": [{"key": "map_udily0", "label": "1440 – 1471"}, {"key": "map_udily1", "label": "Після 1471 р."}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["Спершу на карті — останні удільні князівства: **Київське** (Олельковичі) і **Волинське** (Свидригайло).", "Свидригайло помер у **1452 р.**, і Казимир нового князя на Волинь не призначив: Волинню відтоді керували старости.", "У **1471 р.** Казимир ліквідував і **Київське князівство**: воно стало **Київським воєводством**.", "Галичина й Західне Поділля з 1434 р. були польськими воєводствами."]}, {"type": "cols", "title": "Що змінилося після ліквідації князівств", "badges": ["поняття"], "intro": "**Воєводство** — адміністративна одиниця у Великому князівстві Литовському й Польщі, на чолі якої стояв воєвода.", "blocks": [{"h": "Удільне князівство", "paras": ["• Князівством правив **князь** із династії Гедиміновичів, часто православний.", "• Князь мав двір і власне військо, сам судив своїх людей.", "• Руська знать гуртувалася довкола князя й могла впливати на владу."]}, {"h": "Воєводство", "paras": ["• **Воєводу** призначав великий князь; київськими воєводами були переважно католики.", "• Воєвода командував місцевим військом і чинив суд.", "• Руська знать більше не мала власного князя ні в Києві, ні в Луцьку."]}]}]}, {"id": "s2", "num": "II", "title": "Москва, Литва й Острозький", "sub": "Московсько-литовські війни, змова 1481 р., Ведроша 1500, Орша 1514", "cover": {"key": "ostroz_tomb", "cap": ""}, "cards": [{"type": "text", "kicker": "Москва й Литва", "title": "Москва проти Литви", "badges": [], "paras": ["Наприкінці XV ст. **Велике князівство Московське** підпорядкувало собі Новгород, Твер та інші землі Північно-Східної Русі. Іван III назвав себе **«государем усієї Русі»** й оголосив руські землі Литви своєю «отчиною».", "Першими до Москви разом зі своїми землями почали переходити **верховські князі** — з верхів’їв Оки.", "У **1500 р.** на бік Москви перейшли сіверські князі **Семен Можайський** і **Василь Шемячич**. Литва програла війну **1500 – 1503 рр.** і за перемир’ям втратила **Чернігово-Сіверщину** — майже третину своєї території.", "Син Івана III **Василь III** продовжив ці війни: Литва й Москва воювали ще в **1507 – 1508** і **1512 – 1522 рр.**"], "imgs": [{"key": "vasili3", "cap": "Василь III, великий князь московський (1505 – 1533). Гравюра А. Теве (1584). Суспільне надбання"}]}, {"type": "defs", "title": "Змова 1481 р. і повстання Глинського (1508)", "badges": ["поза програмою"], "items": [{"name": "Змова 1481 р.", "paras": ["Князі **Михайло Олелькович** (брат Семена), **Федір Бєльський** та **Іван Гольшанський** задумали усунути Казимира.", "Змову викрили. Олельковича й Гольшанського стратили у Вільні, Бєльський утік до Москви."], "img": null}, {"name": "Повстання Глинського", "paras": ["**Михайло Глинський** мав великий вплив при дворі великого князя Олександра. Коли Олександр помер (1506), Глинський цей вплив утратив.", "У **1508 р.** Глинський повстав, облягав Слуцьк і Мінськ, просив допомоги в Москви. Руська знать його не підтримала, і він утік до Москви."], "img": null}, {"name": "Що це означало", "paras": ["Частина православних князів була невдоволена своїм становищем у Литві й шукала підтримки в Москви.", "Москва використовувала це у війнах проти Литви."], "img": null}], "note": null}, {"type": "text", "kicker": "Москва й Литва", "title": "Костянтин Іванович Острозький (бл. 1460 – 1530)", "badges": ["НМТ: персоналія"], "paras": ["Князь Костянтин Острозький походив із волинського православного роду. У **1497 р.** великий князь Олександр призначив його **великим гетьманом литовським** — головнокомандувачем війська.", "У **1500 р.** після поразки на Ведроші Острозький потрапив у московський полон. Сім років він провів у неволі, а в **1507 р.** утік до Литви.", "Найвідоміша його перемога — **під Оршею (1514)**. Острозький не раз перемагав і татар: у **1512 р.** під **Лопушним** на Волині він розбив кримський загін і визволив тисячі полонених.", "Князь опікувався православною церквою: будував храми у Вільні й Острозі, допомагав Києво-Печерському монастирю. У **1522 р.** він став **троцьким воєводою**, хоча православним цієї посади не давали. Князь помер у **1530 р.**, його поховали в Києво-Печерському монастирі."], "imgs": [{"key": "ostroz_1579", "cap": "Костянтин Іванович Острозький. Портрет XVI ст. (копія). Суспільне надбання"}]}, {"type": "map", "title": "Московсько-литовські війни (1500 – 1522)", "steps": [{"key": "map_moscow0", "label": "1500 – 1503"}, {"key": "map_moscow1", "label": "1512 – 1522"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["**14 липня 1500 р.** на річці **Ведроші** московське військо розбило литовське й узяло в полон гетьмана **Костянтина Острозького**.", "За перемир’ям **1503 р.** Литва втратила Чернігів, Новгород-Сіверський, Стародуб, Брянськ.", "У **1514 р.** московське військо захопило **Смоленськ** і рушило вглиб Литви.", "**8 вересня 1514 р.** під **Оршею** на Дніпрі литовсько-польське військо Острозького розгромило московське, хоч і було меншим."]}, {"type": "map", "title": "Битва під Оршею (8 вересня 1514 р.): схема-реконструкція", "steps": [{"key": "map_orsha", "label": "Крок 1"}]}, {"type": "doc", "title": "Як прославили перемогу під Оршею", "quote": ["…А гетьманові його, вдатному князю Костянтину Івановичу Острозькому, дай Боже здоров’я й щастя надалі ще краще, ніж нині: побив силу велику московську.", "Щоб так побивав він і сильну рать татарську, проливаючи кров їхню бусурманську."], "source": "Похвала князю К. Острозькому за перемогу під Оршею. Волинський короткий літопис (XVI ст.), фрагмент; переклад-переказ", "comment": ["Похвалу невдовзі після битви склав невідомий книжник; згодом її внесли до Волинського короткого літопису. Автор прославляє короля Сигізмунда I й гетьмана Острозького та бажає їм нових перемог — уже над татарами.", "__Слова з джерела:__ **гетьманові його** — гетьманові короля Сигізмунда I; **вдатний** — щасливий, удачливий; **рать** — військо; **бусурманська** — мусульманська."], "img": {"key": "orsha_r", "cap": "«Битва під Оршею», фрагмент: литовсько-руська кіннота. Суспільне надбання"}}, {"type": "cols", "title": "Наслідки битви під Оршею", "badges": ["НМТ: дата"], "intro": "Орша — найбільша перемога литовсько-польського війська в московсько-литовських війнах, але кордону вона не змінила.", "blocks": [{"h": "Що дала перемога", "paras": ["• Острозький зупинив наступ Москви на Вільно.", "• Острозький став героєм Литви й Польщі.", "• Король Сигізмунд I розіслав по Європі листи про перемогу й показував послам полонених бояр."]}, {"h": "Чого не вдалося досягти", "paras": ["• **Смоленськ** лишився за Москвою.", "• Литва не повернула **Чернігово-Сіверщину**.", "• Війна тривала до перемир’я **1522 р.**"]}]}]}, {"id": "s3", "num": "III", "title": "Українські землі у складі інших держав", "sub": "Польща, Угорщина, Молдавія, Велике князівство Московське; карта близько 1520 р.", "cover": {"key": "akkerman", "cap": ""}, "cards": [{"type": "text", "kicker": "Інші держави", "title": "Українські землі у складі Польщі", "badges": [], "paras": ["Галичина остаточно ввійшла до Польщі в **1387 р.** У **1434 р.** тут утворили **Руське воєводство** з центром у **Львові**, а на Західному Поділлі — **Подільське воєводство** з центром у **Кам’янці**. Белзька земля стала **Белзьким воєводством** у **1462 р.**", "З 1434 р. тут діяло **польське право**. Місцева шляхта отримала ті самі права, що й польська, а мовою судів і канцелярії стала **латина**.", "Королі підтримували **католицьку церкву**: кафедру католицького архієпископа перенесли з Галича до **Львова** (1412). Православна Галицька митрополія на початку XV ст. перестала діяти, і лише в **1539 р.** у Львові відновили православну єпископську кафедру."], "imgs": [{"key": "lviv_cath", "cap": "Латинський собор у Львові (будували 1360 – 1480-ті рр.). Фото: Alex fand / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Інші держави", "title": "Закарпаття у складі Угорщини", "badges": [], "paras": ["Закарпаття ще в XI – XIII ст. поступово захопили угорські королі. Край поділили на **комітати**: Ужанський, Березький, Угочанський, Марамороський.", "Наприкінці XIV ст. сюди прийшов подільський князь **Федір Коріатович**, вигнаний Вітовтом. У **1396 р.** він отримав від угорського короля **Мукачево** з навколишніми землями.", "За переказом, Федір заснував біля Мукачева **Миколаївський монастир** на Чернечій горі. Згодом це був найважливіший православний монастир краю.", "Більшість населення становили **русини-українці**. Землею володіли угорські пани, мовою управління була латина."], "imgs": [{"key": "mukach_mon", "cap": "Миколаївський монастир на Чернечій горі біля Мукачева (1938 р.). Фото: Misko3 / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Інші держави", "title": "Буковина у складі Молдавського князівства", "badges": [], "paras": ["**Молдавське князівство** постало в **1359 р.** До нього ввійшли й північні землі між Дністром і Карпатами — **Буковина**. Назву «Буковина» вперше згадано в грамоті 1392 р.", "Столицею князівства тривалий час була **Сучава** (1388 – 1565). На Буковині стояли фортеці **Хотин** і **Цецин**.", "Більшість населення північної Буковини становили українці. Мовою церкви й канцелярії була **церковнослов’янська**, а владу мали молдавські бояри.", "З середини XV ст. Молдавія платила данину **Османській імперії**, а в **1538 р.** остаточно стала її васалом."], "imgs": [{"key": "suceava", "cap": "Фортеця в Сучаві — столиці Молдавського князівства. Фото: Pudelek / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "defs", "title": "Чернігово-Сіверщина у складі Великого князівства Московського", "badges": [], "items": [{"name": "Перемир’я 1503 р.", "paras": ["Литва визнала за Москвою землі князів, що перейшли на її бік: Чернігів, Новгород-Сіверський, Стародуб."], "img": null}, {"name": "Кінець уділів", "paras": ["Московський князь поступово позбавив місцевих князів влади. У **1523 р.** Шемячича ув’язнили в Москві, де він і помер.", "Краєм стали керувати московські воєводи."], "img": null}, {"name": "До 1618 р.", "paras": ["Чернігово-Сіверщина лишалася у складі Великого князівства (з 1547 р. — царства) Московського до **1618 р.**", "За Деулінським перемир’ям вона відійшла до Речі Посполитої."], "img": null}], "note": null}, {"type": "map", "title": "Українські землі у складі різних держав, близько 1520 р.", "steps": [{"key": "map_lands1520", "label": "Крок 1"}]}]}, {"id": "s4", "num": "IV", "title": "Кримське ханство", "sub": "Хаджі-Герей, утворення ханства, 1475 і 1478 рр., устрій, набіги", "cover": {"key": "mangup", "cap": ""}, "cards": [{"type": "text", "kicker": "Кримське ханство", "title": "Хаджі-Герей і утворення Кримського ханства", "badges": ["НМТ: персоналія", "НМТ: дата"], "paras": ["Хаджі-Герей (бл. 1397 – 1466) походив з роду Чингісхана. Він виріс у **Великому князівстві Литовському**, куди його родина втекла під час міжусобиць в Орді.", "Хаджі-Герей боровся за Крим, спираючись на підтримку великого князя литовського **Казимира**, і в **1440-х рр.** став ханом. Так постало **Кримське ханство** — незалежна від Золотої Орди держава.", "Хан тримався союзу з Литвою проти **Великої Орди** — найсильнішого уламка Золотої Орди. За Хаджі-Герея кримці не нападали на литовські землі.", "Хаджі-Герей заснував династію **Гераїв (Гіреїв)**, що правила Кримом до **1783 р.** Над його могилою в Салачику біля Бахчисарая син **Менглі-Герей** у 1501 р. збудував мавзолей."], "imgs": [{"key": "p1_mausoleum", "cap": "Мавзолей Хаджі-Герея в Салачику (1501)"}]}, {"type": "text", "kicker": "Кримське ханство", "title": "Васал Османської імперії (1478)", "badges": ["НМТ: дата"], "paras": ["У **1475 р.** османське військо захопило генуезьку Кафу. Там османи полонили хана **Менглі-Герея**, сина Хаджі-Герея, і вивезли до Стамбула.", "У **1478 р.** султан повернув його на кримський престол як свого **васала**. Відтоді султан затверджував ханів (згодом і сам призначав), а хан посилав військо в османські походи.", "Ханство зберегло власне військо, двір і монету, вело переговори з сусідами.", "Під захистом Османської імперії Крим зміцнів, а набіги на українські землі почастішали."], "imgs": [{"key": "mengli", "cap": "Менглі-Герей. Османська мініатюра з «Гюнернаме» (XVI ст.). Суспільне надбання"}]}, {"type": "map", "title": "Територія Кримського ханства", "steps": [{"key": "map_crimea0", "label": "До 1475 р."}, {"key": "map_crimea1", "label": "1475 – 1492"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["Ханство охоплювало **Кримський півострів** і степи на північ від **Перекопу**. Столицею був **Кирк-Ор**, з 1532 р. — **Бахчисарай**.", "На південному узбережжі були **генуезькі колонії** (Кафа, Судак, Чембало, Керч) і князівство **Феодоро** зі столицею в Мангупі.", "У **1475 р.** османи захопили генуезькі міста й **Мангуп**, а в **1484 р.** — **Кілію** й **Білгород**.", "Хан **Менглі-Герей** збудував у пониззі Дніпра фортецю **Очаків** (1492)."]}, {"type": "defs", "title": "Устрій і господарство Кримського ханства", "badges": ["поза програмою"], "items": [{"name": "Хан і Гераї", "paras": ["На чолі ханства стояв **хан** з династії Гераїв.", "Спадкоємцем хана був **калга-султан**."], "img": null}, {"name": "Знать і рада", "paras": ["**Беї** знатних родів (Ширин, Барин, Аргин, Кипчак) мали власні володіння й військо.", "Раду при хані називали **диваном**, а найважливіші питання вирішував **курултай** — з’їзд знаті."], "img": null}, {"name": "Віра й суд", "paras": ["Державною релігією був **іслам**.", "Духовенство очолював **муфтій**, судили за шаріатом."], "img": null}, {"name": "Господарство", "paras": ["У степу татари кочували зі стадами, а в передгір’ях розводили сади й виноградники.", "У містах розвивалися ремесла й торгівля; велику частку прибутків давав **продаж полонених**."], "img": null}], "note": null}, {"type": "text", "kicker": "Кримське ханство", "title": "Набіги й ясир", "badges": [], "paras": ["З кінця XV ст. кримські загони майже щороку нападали на українські землі. Полонених — **ясир** — продавали на невільничих ринках **Кафи** й інших міст Османської імперії.", "У **1482 р.** хан **Менглі-Герей**, союзник московського князя Івана III, напав на **Київ**: спалив місто й замок, пограбував Софійський собор і Печерський монастир. Золоті чашу й дискос із Софії хан надіслав у дарунок Іванові III.", "Через постійні набіги спорожніли південна Київщина й Брацлавщина. Південніше від уцілілих поселень простягався безлюдний степ.", "Щоб захистити край, литовська влада відбудовувала й укріплювала замки в Києві, Черкасах, Каневі, Брацлаві та Вінниці."], "imgs": [{"key": "p1_yasyr", "cap": "Татари женуть полонених. Гравюра XVI ст."}]}, {"type": "doc", "title": "Михалон Литвин про ясир (1550)", "quote": ["Безперестанку везуть кораблі з Тавриди полонених до Азії, Африки й Європи…", "Один міняйло, що сидів біля єдиних воріт до Тавриди, бачачи, як безупинно гонять туди наших полонених, спитав нас: чи лишилися ще люди в наших краях, чи вже ні, і звідки їх береться стільки?"], "source": "Михалон Литвин, «Про звичаї татар, литовців і москвитян» (1550), переклад-переказ з латини, скорочено", "comment": ["Автор — литовський урядовець, що бував у Криму з посольством. Свій твір він адресував королеві Сигізмунду II Августу.", "Михалон хотів переконати короля, що з татарськими набігами треба боротися, а не відкуповуватися від хана подарунками.", "__Слова з джерела:__ **Таврида** — Крим; **єдині ворота** — Перекоп, через який проходили всі шляхи на півострів; **міняйло** — той, хто обмінює гроші."], "img": null}, {"type": "map", "title": "Шляхи татарських набігів", "steps": [{"key": "map_raids", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["Татарські загони йшли степовими вододілами, щоб не переправлятися через великі ріки.", "**Чорний шлях** ішов вододілом між Дніпром і Південним Бугом на Волинь і Галичину, **Кучманський** — між Дністром і Південним Бугом на Поділля, **Муравський** — вододілом між Дніпром і Доном до Великого князівства Московського.", "У **1482 р.** Менглі-Герей пройшов степом до самого Києва.", "Між ханством і заселеними землями лежало **Дике поле** — про нього в наступному розділі."]}]}, {"id": "s5", "num": "V", "title": "Дике поле й поява козацтва", "sub": "Уходники, перші згадки про козаків, причини виникнення козацтва", "cover": {"key": "brandt", "cap": ""}, "cards": [{"type": "defs", "title": "Дике поле", "badges": ["НМТ: поняття"], "items": [{"name": "Де лежало", "paras": ["Дике поле починалося одразу на південь від укріплених міст Київщини й Брацлавщини й сягало Криму.", "Жодна держава цих степів не контролювала."], "img": null}, {"name": "Багатства степу", "paras": ["Тут були родючі землі й пасовища.", "У ріках було багато риби, у степу — звіра й диких бджіл (мед і віск); добували й сіль."], "img": null}, {"name": "Уходники", "paras": ["Щовесни міщани Києва, Черкас, Канева й селяни йшли «в уходи» — на промисли в пониззя Дніпра.", "Уходники ходили озброєними гуртами й восени поверталися з рибою, хутром, медом."], "img": null}], "note": "**Дике поле** — історична назва незаселених степів між Дністром і Доном, де постійно ходили татарські загони."}, {"type": "text", "kicker": "Козацтво", "title": "Хто такі козаки", "badges": ["НМТ: поняття", "НМТ: дата"], "paras": ["Слово **«козак»** тюркського походження. Воно означало вільну людину, вояка, не підвладного жодній державі. Спершу так називали татарських степових вояків.", "Уперше українських козаків згадано в писемних джерелах під **1489 р.**: польський хроніст Мартин Бєльський написав про них, описуючи похід королевича **Яна Ольбрахта** проти татар на Поділлі.", "Козаками ставали селяни й міщани, шляхтичі й навіть служителі церкви — усі, хто шукав волі чи здобичі або хотів боронити край від татар.", "Козаки жили з промислів, а в походах нападали на татарські й турецькі фортеці. Перші великі походи очолювали прикордонні старости — **Остафій Дашкевич** і **Предслав Лянцкоронський**."], "imgs": [{"key": "brandt2", "cap": "Юзеф Брандт. «Козак біля переправи» (кінець XIX ст.) — уявлення художника. Фото: Józef Brandt / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "doc", "title": "Скарга кримського хана (1492)", "quote": ["Кияни й черкасці, прийшовши Дніпром, під Тягинею розбили наш корабель…"], "source": "Листування хана Менглі-Герея з великим князем Олександром, 1492 р. (переказ за науковими виданнями)", "comment": ["Хан скаржився, що його людей пограбували біля **Тягині** (на Дніпрі, біля сучасної Тягинки; за іншою версією — на Дністрі).", "Олександр відповів, що накаже шукати тих **козаків** серед своїх «українних людей» і покарати. Це одна з перших звісток про українських козаків.", "Литовська влада мусила карати козаків, бо уклала з ханом мир. Але прикордонні старости часто самі водили козаків на татар.", "__Слова з джерела:__ **черкасці** — жителі Черкас; **українні люди** — жителі прикордоння на півдні Великого князівства."], "img": null}, {"type": "defs", "title": "Причини виникнення козацтва", "badges": [], "items": [{"name": "Татарська загроза", "paras": ["Набіги змушували людей на прикордонні вчитися воювати й гуртуватися для оборони."], "img": null}, {"name": "Утиски й кріпацтво", "paras": ["Панщина зростала, селян прикріплювали до землі (докладніше — у частині 3), тож люди тікали на волю, у степ."], "img": null}, {"name": "Багатства степу", "paras": ["Заради риби, звіра, меду й родючої землі люди йшли в степ."], "img": null}, {"name": "Слабка влада", "paras": ["Литва й Польща не могли ні заселити, ні захистити степове прикордоння, тож люди боронилися самі."], "img": null}], "note": "Козацтво виникло наприкінці XV ст. на прикордонні Київщини й Брацлавщини. Про Запорозьку Січ і реєстрове козацтво — у темі 6."}]}, {"id": "s6", "num": "VI", "title": "Підсумки частини 2", "sub": "Порівняльна таблиця; що часто плутають на НМТ; стрічка часу", "cover": {"key": "p1_ostroz", "cap": ""}, "cards": [{"type": "table", "title": "Українські землі у складі різних держав: порівняння", "rows": [["Держава", "Які землі", "Як управляли", "Віра й мова"], ["Велике князівство Литовське", "Київщина, Волинь, Брацлавщина, Берестейщина, Підляшшя", "Воєводства й староства; вищі посади обіймали католики", "Православ’я; руська мова канцелярії"], ["Королівство Польське", "Галичина, Холмщина, Белзчина, Західне Поділля", "Воєводства, польське право (з 1434 р.)", "Підтримка католицтва; латина"], ["Угорське королівство", "Закарпаття", "Комітати, влада угорських панів", "Православ’я русинів; латина"], ["Молдавське князівство", "Буковина", "Молдавські бояри; князівство — васал Османів", "Православ’я; церковнослов’янська"], ["Велике князівство Московське", "Чернігово-Сіверщина (з 1503 р.)", "Московські воєводи; уділи ліквідовано", "Православ’я"], ["Кримське ханство", "Крим, степи Причорномор’я", "Хан — васал султана (з 1478 р.)", "Іслам"], ["Османська імперія", "Південний берег Криму, Кілія, Білгород", "Намісники султана", "Іслам"]]}, {"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Плутають", "Як правильно"], ["1452 і 1471", "**1452** — ліквідовано Волинське князівство; **1471** — Київське князівство стало воєводством"], ["Ведроша й Орша", "**Ведроша, 1500** — поразка, Острозький у полоні; **Орша, 1514** — перемога Острозького"], ["1475 і 1478", "**1475** — османи захопили Кафу й Мангуп; **1478** — Кримське ханство визнало залежність від Османів"], ["Хаджі-Герей і Менглі-Герей", "**Хаджі-Герей** — засновник ханства (1440-ві); **Менглі-Герей** — його син, васал Османів, спалив Київ у 1482 р."], ["Два Острозькі", "**Костянтин Іванович** — гетьман, Орша (тема 5); **Василь-Костянтин Костянтинович** — його син, меценат (тема 6)"], ["Кримське ханство й Золота Орда", "Ханство відокремилося від Орди в 1440-х рр.; Золота Орда остаточно розпалася на початку XVI ст."]]}, {"type": "tl_events", "title": "Стрічка часу: події 1440 – 1514 рр.", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "1440", "name": "Київське князівство", "desc": "відновлено для Олелька", "color": "#8ccf84", "prog": false}, {"year": "1440-ві", "name": "Кримське ханство", "desc": "Хаджі-Герей", "color": "#e05a47", "prog": true}, {"year": "1452", "name": "Волинь", "desc": "кінець удільного князівства", "color": "#8ccf84", "prog": false}, {"year": "1471", "name": "Київ", "desc": "князівство → воєводство", "color": "#8ccf84", "prog": false}, {"year": "1475", "name": "Османи в Криму", "desc": "Кафа, Мангуп", "color": "#d9607e", "prog": false}, {"year": "1478", "name": "Васалітет", "desc": "хан — васал султана", "color": "#e05a47", "prog": true}, {"year": "1482", "name": "Набіг на Київ", "desc": "Менглі-Герей", "color": "#e05a47", "prog": false}, {"year": "1489", "name": "Перша згадка", "desc": "про козаків", "color": "#e97132", "prog": true}, {"year": "1503", "name": "Перемир’я", "desc": "Чернігово-Сіверщина — Москві", "color": "#a6a6a6", "prog": false}, {"year": "1514", "name": "Орша", "desc": "перемога Острозького", "color": "#8ccf84", "prog": true}]}]}]}, {"id": "p3", "num": 3, "title": "Руські удільні князівства у складі іноземних держав", "part": "Частина 3. Суспільство, господарство й культура", "sub": "Стани, фільварки, міста й магдебурзьке право, цехи, церква й освіта, Юрій Дрогобич, книгодрукування, пам’ятки; підсумки всієї теми", "cover": {"key": "lviv1618", "cap": "Львів. Гравюра з атласу Г. Брауна й Ф. Гогенберга «Міста світу» (1618)"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **«шляхтич»**, **«магдебурзьке право»**, **«магістрат»**, **«цех»**", "• «Дике поле» й «козак» — у частині 2"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналія", "light": false}, {"k": "p", "paras": ["• **Юрій Дрогобич**", "• Решта персоналій теми — у частин

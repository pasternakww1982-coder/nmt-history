стрічка часу", "cover": {"key": "p1_ostroz", "cap": ""}, "cards": [{"type": "table", "title": "Українські землі у складі різних держав: порівняння", "rows": [["Держава", "Які землі", "Як управляли", "Віра й мова"], ["Велике князівство Литовське", "Київщина, Волинь, Брацлавщина, Берестейщина, Підляшшя", "Воєводства й староства; вищі посади обіймали католики", "Православ’я; руська мова канцелярії"], ["Королівство Польське", "Галичина, Холмщина, Белзчина, Західне Поділля", "Воєводства, польське право (з 1434 р.)", "Підтримка католицтва; латина"], ["Угорське королівство", "Закарпаття", "Комітати, влада угорських панів", "Православ’я русинів; латина"], ["Молдавське князівство", "Буковина", "Молдавські бояри; князівство — васал Османів", "Православ’я; церковнослов’янська"], ["Велике князівство Московське", "Чернігово-Сіверщина (з 1503 р.)", "Московські воєводи; уділи ліквідовано", "Православ’я"], ["Кримське ханство", "Крим, степи Причорномор’я", "Хан — васал султана (з 1478 р.)", "Іслам"], ["Османська імперія", "Південний берег Криму, Кілія, Білгород", "Намісники султана", "Іслам"]]}, {"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Плутають", "Як правильно"], ["1452 і 1471", "**1452** — ліквідовано Волинське князівство; **1471** — Київське князівство стало воєводством"], ["Ведроша й Орша", "**Ведроша, 1500** — поразка, Острозький у полоні; **Орша, 1514** — перемога Острозького"], ["1475 і 1478", "**1475** — османи захопили Кафу й Мангуп; **1478** — Кримське ханство визнало залежність від Османів"], ["Хаджі-Герей і Менглі-Герей", "**Хаджі-Герей** — засновник ханства (1440-ві); **Менглі-Герей** — його син, васал Османів, спалив Київ у 1482 р."], ["Два Острозькі", "**Костянтин Іванович** — гетьман, Орша (тема 5); **Василь-Костянтин Костянтинович** — його син, меценат (тема 6)"], ["Кримське ханство й Золота Орда", "Ханство відокремилося від Орди в 1440-х рр.; Золота Орда остаточно розпалася на початку XVI ст."]]}, {"type": "tl_events", "title": "Стрічка часу: події 1440 – 1514 рр.", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "1440", "name": "Київське князівство", "desc": "відновлено для Олелька", "color": "#8ccf84", "prog": false}, {"year": "1440-ві", "name": "Кримське ханство", "desc": "Хаджі-Герей", "color": "#e05a47", "prog": true}, {"year": "1452", "name": "Волинь", "desc": "кінець удільного князівства", "color": "#8ccf84", "prog": false}, {"year": "1471", "name": "Київ", "desc": "князівство → воєводство", "color": "#8ccf84", "prog": false}, {"year": "1475", "name": "Османи в Криму", "desc": "Кафа, Мангуп", "color": "#d9607e", "prog": false}, {"year": "1478", "name": "Васалітет", "desc": "хан — васал султана", "color": "#e05a47", "prog": true}, {"year": "1482", "name": "Набіг на Київ", "desc": "Менглі-Герей", "color": "#e05a47", "prog": false}, {"year": "1489", "name": "Перша згадка", "desc": "про козаків", "color": "#e97132", "prog": true}, {"year": "1503", "name": "Перемир’я", "desc": "Чернігово-Сіверщина — Москві", "color": "#a6a6a6", "prog": false}, {"year": "1514", "name": "Орша", "desc": "перемога Острозького", "color": "#8ccf84", "prog": true}]}]}]}, {"id": "p3", "num": 3, "title": "Руські удільні князівства у складі іноземних держав", "part": "Частина 3. Суспільство, господарство й культура", "sub": "Стани, фільварки, міста й магдебурзьке право, цехи, церква й освіта, Юрій Дрогобич, книгодрукування, пам’ятки; підсумки всієї теми", "cover": {"key": "lviv1618", "cap": "Львів. Гравюра з атласу Г. Брауна й Ф. Гогенберга «Міста світу» (1618)"}, "program": {"type": "generic", "title": "Програма НМТ до цієї частини", "badges": [], "blocks": [{"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **«шляхтич»**, **«магдебурзьке право»**, **«магістрат»**, **«цех»**", "• «Дике поле» й «козак» — у частині 2"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналія", "light": false}, {"k": "p", "paras": ["• **Юрій Дрогобич**", "• Решта персоналій теми — у частинах 1 і 2; усі разом — у підсумках"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятки (13)", "light": false}, {"k": "p", "paras": ["• Вірменський собор у Львові · костел у Дрогобичі · Верхній замок у Луцьку · Кам’янець-Подільська й Хотинська фортеці · Сутківці · Паланок · Судак · Бахчисарай · ікони зі Станилі й Підгородців · церква в Потеличі · «Успіння» О. Горошковича"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Знати й пояснювати", "light": false}, {"k": "p", "paras": ["• **соціально-економічний розвиток** земель, **становище верств**", "• **досягнення в культурі**", "• діяльність **Юрія Дрогобича**"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 5. Матеріал про Литовські статути 1566 і 1588 рр. та остаточне закріпачення селян належить до теми 6 — він позначений сірим бейджем «тема 6»."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Суспільство: стани", "sub": "Князі, пани й шляхта, духовенство, міщани, селяни", "cover": {"key": "estates", "cap": ""}, "cards": [{"type": "text", "kicker": "Суспільство", "title": "Як було влаштоване суспільство", "badges": [], "paras": ["**Стан** — група населення з однаковими правами й обов’язками, закріпленими законом або звичаєм. Належність до стану передавалася в спадок.", "Найвище стояли **князі й пани**, нижче — дрібні землевласники: **зем’яни, бояри, панцирні слуги**.", "Окремим станом було **духовенство** — православне й католицьке.", "Особисто вільними були **міщани**. Найчисленнішим і найбезправнішим станом залишалися **селяни**."], "imgs": [{"key": "reeve", "cap": "Наглядач підганяє селян на панському полі. Англійська мініатюра XIV ст. (Псалтир королеви Марії)"}]}, {"type": "defs", "title": "Привілейовані стани", "badges": [], "items": [{"name": "Князі", "paras": ["Нащадки Рюриковичів і Гедиміновичів: Острозькі, Вишневецькі, Збаразькі.", "Мали великі спадкові маєтки, власне військо, суд над своїми людьми.", "Обіймали найвищі посади — гетьманів, воєвод."], "img": null}, {"name": "Пани", "paras": ["Заможні роди, що не мали князівського титулу.", "Мали спадкові маєтки, обіймали посади старост і каштелянів."], "img": null}, {"name": "Зем’яни, бояри", "paras": ["Отримували землю за військову службу.", "Служили великому князеві, а часто — князям і панам, від яких залежали."], "img": null}, {"name": "Духовенство", "paras": ["**Вище** духовенство — митрополит і єпископи, **нижче** — парафіяльні священики.", "Мали землі, звільнялися від повинностей. Кандидатів на церковні посади затверджував король, великий князь або власник маєтку."], "img": null}], "note": null}, {"type": "text", "kicker": "Суспільство", "title": "Шляхта", "badges": ["НМТ: поняття", "тема 6"], "paras": ["Протягом XV – XVI ст. князі, пани й дрібні землевласники злилися в один привілейований стан — **шляхту**.", "Найбагатших шляхтичів, що мали величезні маєтки й вплив, називали **магнатами**.", "Права шляхти закріпили **Литовські статути** — зводи законів Великого князівства Литовського. Перший статут **1529 р.** гарантував шляхті право на землю й особисту свободу. Другий (**1566**) і третій (**1588**) статути зрівняли в правах магнатів і дрібну шляхту.", "**Шляхтич** мав спадкову землю й міг обіймати державні посади. Він брав участь у **сеймиках** — місцевих з’їздах шляхти, де обирали послів до **сейму**, що ухвалював закони. За це шляхтич мусив власним коштом служити у **війську**."], "imgs": [{"key": "statut1529", "cap": "Сторінка Першого Литовського статуту (список 1531 р.) з гербом Погоня. Суспільне надбання"}]}, {"type": "defs", "title": "Міщани", "badges": [], "items": [{"name": "Патриціат", "paras": ["Міська верхівка: багаті купці, лихварі, власники кам’яниць.", "Саме патриції керували містом."], "img": null}, {"name": "Бюргерство", "paras": ["Середні верстви: купці середнього достатку, майстри-ремісники.", "Здебільшого мали власні будинки."], "img": null}, {"name": "Плебс", "paras": ["Наймити, підмайстри, міська біднота.", "Власних будинків не мали, і до керування містом їх не допускали."], "img": null}], "note": "Міщани були **особисто вільними**, а багато міст згодом здобули **самоврядування** (про нього — у розділі II). Міщани платили податки й відбували повинності на користь короля чи власника міста."}, {"type": "defs", "title": "Селяни", "badges": [], "items": [{"name": "Похожі й непохожі", "paras": ["Селяни різнилися правом переходу: **похожі** могли піти від пана, розрахувавшись із ним, а **непохожі** були прикріплені до землі."], "img": null}, {"name": "Слуги", "paras": ["Особисто вільні, служили пану: були управителями, охоронцями, гінцями.", "За службу могли отримати землю."], "img": null}, {"name": "Данники", "paras": ["Платили пану **данину**: грошима (**чинш**) або продуктами."], "img": null}, {"name": "Тяглі", "paras": ["Працювали на панському полі зі своєю худобою — **тяглом**.", "Згодом ця повинність отримала назву **панщина**."], "img": null}], "note": "**Кріпосне право** — порядок, за якого селянин прикріплений до землі пана й не може її залишити. **Панщина** — обов’язкова праця селянина зі своїм реманентом у господарстві пана."}]}, {"id": "s2", "num": "II", "title": "Господарство й міста", "sub": "Фільварки й закріпачення, міста, магдебурзьке право, магістрат, цехи, торгівля", "cover": {"key": "mag_col", "cap": ""}, "cards": [{"type": "text", "kicker": "Господарство", "title": "Фільварок", "badges": ["тема 6"], "paras": ["Більшість людей жила із землеробства. З кінця XV ст. пани дедалі більше землі брали під власну ріллю.", "Так виникали **фільварки** — великі панські господарства, де зерно вирощували **на продаж**.", "У XVI ст. хліб у Західній Європі дорожчав, тож продавати зерно стало вигідно. Його везли до **Гданська**, а звідти морем до Нідерландів та Англії.", "Працювати на фільварку пани змушували селян. Тому разом із фільварками поширювалися **панщина** й **кріпацтво**."], "imgs": [{"key": "granary", "cap": "Зерносховища в Гданську: звідси зерно везли морем до Західної Європи. Фото: Andrzej Otrębski / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "map", "title": "Як працював фільварок", "steps": [{"key": "map_filv0", "label": "Крок 1"}, {"key": "map_filv1", "label": "Крок 2"}, {"key": "map_filv2", "label": "Крок 3"}]}, {"type": "doc", "title": "Як селян прикріплювали до землі", "quote": ["З одного села протягом року може піти лише один кмет…", "З кожної селянської родини тільки одному синові дозволено йти до міста вчитися ремесла або до школи; інші мусять лишатися на землі."], "source": "Петрковський статут польського сейму 1496 р. (переклад-переказ, скорочено)", "comment": ["Польська шляхта потребувала робочих рук на фільварках, тож сейм обмежив перехід селян. Ці постанови діяли й у Галичині та на Західному Поділлі.", "У Великому князівстві Литовському селян закріпачили пізніше — за **Уставою на волоки** (1557) і **Третім Литовським статутом** (1588). Про це йдеться в темі 6.", "__Слова з джерела:__ **кмет** — селянин, що мав наділ."], "img": null}, {"type": "text", "kicker": "Господарство", "title": "Міста", "badges": [], "paras": ["Найбільшими містами були **Львів, Київ, Кам’янець-Подільський, Луцьк, Володимир**. Більшість міст лишалися невеликими: кілька тисяч жителів.", "Міста належали королю (великому князеві), магнатам або церкві, тож були **королівськими (великокнязівськими)**, **приватними** й **церковними**.", "У містах жили українці, поляки, німці, вірмени, євреї. Кожна громада мала свої храми, а нерідко й окремий суд.", "Щоб звільнитися від свавілля старост і панів, міщани домагалися **магдебурзького права**."], "imgs": [{"key": "kam_ratusha2", "cap": "Ратуша в Кам’янці-Подільському — будинок міського самоврядування. Фото: Aschroet / Wikimedia Commons, CC0"}]}, {"type": "map", "title": "Що таке магдебурзьке право", "steps": [{"key": "map_magdeburg", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["**Магдебурзьке право** — право міста на самоврядування. Воно виникло в німецькому Магдебурзі. Міщани обирали власні органи влади й суд і звільнялися з-під влади місцевих урядників.", "На українських землях першим його отримав **Сянок** (1339), далі **Львів** (1356), **Кам’янець** (1374), **Луцьк** (1432), **Київ** (1494).", "Згодом королі й магнати надавали магдебурзьке право й невеликим містам."]}, {"type": "doc", "title": "Львів отримує магдебурзьке право (1356)", "quote": ["Ми, Казимир, з Божої ласки король Польщі й Русі… бажаючи, щоб наше місто Львів процвітало, переводимо його з руського й будь-якого іншого права, що досі там діяло, на право німецьке, магдебурзьке.", "Війт міста судитиме міщан за цим правом, а воєводи, каштеляни й інші урядники не мають права їх судити."], "source": "Грамота короля Казимира III місту Львову, 17 червня 1356 р. (переклад-переказ з латини, скорочено)", "comment": ["Грамота звільнила львів’ян з-під влади королівських урядників: відтоді міщан судив власний міський суд.", "Проте повноправними міщанами у Львові довго були лише католики. Православні українці домагалися рівних прав аж до кінця XVI ст.", "__Слова з джерела:__ **війт** — голова міського суду; **каштелян** — урядник, що відав замком."], "img": null}, {"type": "defs", "title": "Магістрат — орган міського самоврядування", "badges": ["НМТ: поняття"], "items": [{"name": "Рада", "paras": ["Відала господарством і порядком у місті.", "Раду очолював **бурмистр**; її членів — **радців** — обирали з багатих міщан."], "img": null}, {"name": "Лава", "paras": ["Міський суд у кримінальних справах.", "Лаву очолював **війт**; суддів називали **лавниками**."], "img": null}, {"name": "Хто обирав", "paras": ["Право голосу мали заможні міщани — власники будинків, купці, цехові майстри.", "Бідноту до виборів не допускали."], "img": null}, {"name": "Обмеження", "paras": ["У деяких містах самоврядування поширювалося лише на католиків.", "Королівські старости й власники міст часто втручалися в справи магістрату."], "img": null}], "note": "У містах з магдебурзьким правом **магістрат** складався з двох частин — **ради** й **лави**."}, {"type": "defs", "title": "Цехи", "badges": ["НМТ: поняття"], "items": [{"name": "Які були цехи", "paras": ["Свої цехи мали ковалі, шевці, кравці, пекарі, різники, золотарі.", "У великих містах було кілька десятків цехів."], "img": null}, {"name": "Що робив цех", "paras": ["Стежив за якістю виробів і цінами, розв’язував суперечки, збирав податки.", "Обороняв свою ділянку міських мурів."], "img": null}, {"name": "Хто в цеху", "paras": ["Повноправними членами були **майстри**, а очолював цех **цехмістер**.", "У майстрів працювали **підмайстри** й навчалися **учні**."], "img": null}, {"name": "Поза цехом", "paras": ["Ремісників, що працювали поза цехом, називали **партачами**.", "У деяких містах православних до цехів не приймали."], "img": null}], "note": "**Цех** — об’єднання ремісників однієї або кількох споріднених професій, яке діяло за власним статутом."}, {"type": "defs", "title": "Торгівля", "badges": [], "items": [{"name": "Ярмарки", "paras": ["Міста отримували право проводити **ярмарки** — великі торги кілька разів на рік.", "На ярмарки з’їжджалися купці з різних країн."], "img": null}, {"name": "Вивозили", "paras": ["**Зерно**, **волів**, віск, мед, хутра, шкіри, поташ, деревину."], "img": null}, {"name": "Завозили", "paras": ["Сукно, тканини, вино, прянощі, зброю, металеві вироби."], "img": null}, {"name": "Торгові шляхи", "paras": ["Через **Львів** ішли шляхи з Польщі й Німеччини до Молдавії та Криму.", "Значну частину торгівлі вели **вірменські** купці."], "img": null}], "note": "Багато міст мали **право складу**: проїжджі купці мусили виставити свій товар на продаж у місті."}]}, {"id": "s3", "num": "III", "title": "Церква, освіта й культура", "sub": "Церковне життя, освіта, Юрій Дрогобич, книгодрукування, література, мистецтво", "cover": {"key": "psalter", "cap": ""}, "cards": [{"type": "defs", "title": "Церковне життя", "badges": [], "items": [{"name": "Православні Галичини", "paras": ["**Галицька митрополія**, заснована 1303 р. за Юрія I, на початку XV ст. перестала існувати.", "Свого єпископа у Львові православні Галичини отримали лише у **1539 р.**"], "img": null}, {"name": "Київська митрополія", "paras": ["Великі князі литовські не хотіли, щоб православними їхньої держави керував митрополит із Москви.", "У **1458 р.** митрополія поділилася: для земель Литви й Польщі постала окрема **Київська митрополія**."], "img": null}, {"name": "Католицька церква", "paras": ["Королі й великі князі підтримували католицтво: засновували єпископства, будували костели.", "Католицький архієпископ мав кафедру у **Львові**."], "img": null}, {"name": "Вірменська церква", "paras": ["У Львові з XIV ст. діяла вірменська єпархія. Її собор (1363) — пам’ятка з програми НМТ."], "img": null}], "note": null}, {"type": "text", "kicker": "Культура", "title": "Освіта", "badges": [], "paras": ["Грамоти навчали **дяки** при церквах і монастирях. Учні вивчали абетку, читали Часослов і Псалтир.", "Заможні родини наймали домашніх учителів.", "Вищих шкіл на українських землях не було, тож молодь їхала вчитися за кордон — до **Краківського університету** (заснований 1364 р.), а також до Праги, Болоньї, Падуї.", "У XV – першій половині XVI ст. в Кракові навчалися сотні студентів з руських земель. У списках їх записували «з Русі» (de Russia)."], "imgs": [{"key": "coll_maius", "cap": "Колегіум Маюс Краківського університету (XV ст.). Фото: Chris Olszewski / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Культура", "title": "Юрій Дрогобич (бл. 1450 – 1494)", "badges": ["НМТ: персоналія"], "paras": ["Юрій Котермак народився в **Дрогобичі** в сім’ї ремісника-солевара. Навчався в **Краківському університеті**, а потім у **Болонському** (Італія), де здобув ступені доктора філософії й медицини.", "У **1481 – 1482 рр.** він був **ректором** університету медицини й вільних мистецтв у Болоньї. Студенти обрали його, хоча він був чужинцем.", "У **1483 р.** у Римі вийшла його книжка **«Прогностична оцінка поточного 1483 року»** з астрономічними розрахунками. Це перша відома друкована книжка автора-українця.", "В останні роки життя Дрогобич викладав медицину в Кракові. Свої праці він підписував «Георгій Дрогобич з Русі»."], "imgs": [{"key": "drohobych_p", "cap": "Юрій Дрогобич. Пізніший уявний портрет. Суспільне надбання"}, {"key": "drohobych_bol", "cap": "Меморіальна дошка Юрію Дрогобичу в Болонському університеті. Фото: Patafisik / Wikimedia Commons, CC0"}]}, {"type": "text", "kicker": "Культура", "title": "Книгодрукування", "badges": [], "paras": ["Першими кириличними друкованими книжками були видання **Швайпольта Фіоля**. У **1491 р.** в **Кракові** він надрукував «Октоїх», «Часослов», «Тріодь пісну» й «Тріодь цвітну» церковнослов’янською мовою.", "Краківський єпископ звинуватив Фіоля в єресі. Після суду друкувати кириличні книжки він уже не міг.", "**Франциск Скорина** з Полоцька видав у **Празі** (1517 – 1519) «Біблію руську», а у **Вільні** (1522 – 1525) — «Апостол» і «Малу подорожну книжку».", "На українських землях друкарство з’явилося пізніше: у **1574 р.** у Львові Іван Федоров надрукував «Апостол» (тема 6)."], "imgs": [{"key": "fiol", "cap": "Октоїх Швайпольта Фіоля (Краків, 1491). Суспільне надбання"}, {"key": "skaryna", "cap": "Франциск Скорина. Гравюра з «Біблії руської» (Прага, 1517). Суспільне надбання"}]}, {"type": "text", "kicker": "Культура", "title": "Література й літописання", "badges": [], "paras": ["Книжники переписували церковні книги й прикрашали їх мініатюрами. Найвідоміша з таких книг — **Київський Псалтир 1397 р.**, який переписав диякон **Спиридон**.", "У Великому князівстві Литовському складали **литовсько-руські літописи**. У них ідеться про литовських князів, але мова літописів — руська.", "Закони й грамоти писали **руською (староукраїнською й старобілоруською) мовою**: нею укладено й Литовські статути.", "Освічені люди читали й перекладні твори: житія святих, повісті про Олександра Македонського й Троянську війну."], "imgs": [{"key": "psalter2", "cap": "Мініатюра Київського Псалтиря 1397 р. Суспільне надбання"}]}, {"type": "text", "kicker": "Культура", "title": "Усна творчість", "badges": [], "paras": ["Народ складав **обрядові пісні**: колядки, щедрівки, веснянки (гаївки), весільні пісні.", "У XV – XVI ст. з’явилися **думи** й **історичні пісні**. Їх співали кобзарі, граючи на кобзі чи бандурі. Головні теми — татарський і турецький полон, втеча з неволі, подвиги козаків.", "Думи записали значно пізніше, але найдавніші з них розповідають про події XV – XVI ст. Серед них — думи про неволю: «Плач невольника», «Маруся Богуславка»."], "imgs": [{"key": "kobzars", "cap": "Кобзарі й лірники. Фото кінця XIX – початку XX ст."}]}, {"type": "defs", "title": "Архітектура", "badges": [], "items": [{"name": "Замки й фортеці", "paras": ["Через постійні війни й татарські набіги князі й королі зводили замки з каменю й цегли: у **Луцьку, Кам’янці, Хотині, Мукачеві, Меджибожі, Острозі**."], "img": null}, {"name": "Храми-фортеці", "paras": ["На Поділлі й Волині деякі церкви будували з товстими мурами й бійницями, щоб у них можна було оборонятися.", "Найвідоміша — **Покровська церква в Сутківцях** (1476)."], "img": null}, {"name": "Готика", "paras": ["У Галичині й на Західному Поділлі з’явилися готичні костели: **Латинський собор у Львові**, **костел у Дрогобичі**."], "img": null}, {"name": "Дерев’яні храми", "paras": ["Дерев’яні церкви стояли майже в кожному селі.", "Одна з найдавніших — **церква Святого Духа в Потеличі** (1502)."], "img": null}], "note": null}, {"type": "text", "kicker": "Культура", "title": "Іконопис і малярство", "badges": [], "paras": ["У Галичині склалася своя **школа іконопису**. Найдавніші збережені ікони написано в XIV ст., серед них **«Юрій Змієборець» зі Станилі**.", "Руські майстри розписували й католицькі храми. Король Ягайло запросив їх прикрасити **каплицю Святої Трійці в Любліні** (1418) — фрески у візантійському стилі вкривають стіни й склепіння.", "Ікони писали на дерев’яних дошках темперою. Майстри здебільшого лишалися безіменними.", "Одна з перших підписаних і датованих ікон — **«Успіння Богородиці»** (1547) майстра **Олексія Горошковича**."], "imgs": [{"key": "lublin", "cap": "Розписи руських майстрів у каплиці Святої Трійці в Любліні (1418). Фото: Artinpl / Wikimedia Commons, CC0"}]}]}, {"id": "s4", "num": "IV", "title": "Пам’ятки культури з програми НМТ", "sub": "13 пам’яток: замки й фортеці, храми, ікони", "cover": null, "cards": [{"type": "defs", "title": "Пам’ятки культури з програми НМТ", "badges": ["НМТ: пам’ятки"], "note": "Далі — картка кожної пам’ятки: фото й коротка розповідь.", "items": [{"name": "Замки й фортеці", "paras": ["Верхній замок у Луцьку · Кам’янець-Подільська фортеця · Хотинська фортеця · замок Паланок у Мукачеві · Генуезька фортеця в Судаку · Бахчисарайський історико-культурний заповідник"], "img": null}, {"name": "Храми", "paras": ["Вірменський собор у Львові · костел святого Варфоломія в Дрогобичі · Покровська церква-фортеця в Сутківцях · церква Зішестя Святого Духа в Потеличі"], "img": null}, {"name": "Ікони", "paras": ["«Юрій Змієборець» зі Станилі · Богородиця з пророками з Підгородців · «Успіння Богородиці» Олексія Горошковича"], "img": null}]}, {"type": "monument", "title": "Верхній замок у Луцьку (друга пол. XIV – XV ст.)", "badges": [], "img": {"key": "m_lutsk", "cap": "Верхній замок (замок Любарта)"}, "paras": ["Мурований замок почали зводити за князя **Любарта**, тому його називають **замком Любарта**.", "Замок має три вежі: **В’їзну**, **Стирову** й **Владичу**.", "У **1429 р.** тут відбувся з’їзд європейських монархів, а в **1431 р.** замок витримав облогу польського війська."]}, {"type": "monument", "title": "Кам’янець-Подільська фортеця (XIV – XVI ст.)", "badges": [], "img": {"key": "m_kamianets", "cap": "Кам’янець-Подільська фортеця"}, "paras": ["Фортеця стоїть на скелі над каньйоном річки **Смотрич** і захищає вхід до Старого міста.", "Мурований замок будували **Коріатовичі**; поляки, що володіли містом з 1430-х рр., добудовували вежі.", "Фортеця витримала чимало облог. Лише у **1672 р.** її здобуло османське військо."]}, {"type": "monument", "title": "Хотинська фортеця (XIII – XVI ст.)", "badges": [], "img": {"key": "m_khotyn", "cap": "Хотинська фортеця над Дністром"}, "paras": ["Перші укріплення над **Дністром** звели ще за часів Галицько-Волинської держави.", "Нинішню кам’яну фортецю збудували й розширили **молдавські** господарі в XV – XVI ст.", "У **1621 р.** під Хотином польсько-козацьке військо зупинило османів (тема 7)."]}, {"type": "monument", "title": "Замок Паланок у Мукачеві (XIV – XVII ст.)", "badges": [], "img": {"key": "m_palanok", "cap": "Замок Паланок на горі над Мукачевом"}, "paras": ["Замок стоїть на згаслому вулкані над Мукачевом.", "Князь **Федір Коріатович**, що отримав Мукачево в **1396 р.**, розбудував і укріпив замок.", "У XVII ст. Паланок належав князям Ракоці й став однією з найміцніших фортець Угорщини."]}, {"type": "monument", "title": "Генуезька фортеця в Судаку (XIV – XV ст.)", "badges": [], "img": {"key": "m_sudak", "cap": "Генуезька фортеця в Судаку"}, "paras": ["Фортецю на горі над морем збудували **генуезці**, коли Судак (Солдайя) став їхньою колонією.", "Фортеця має два пояси мурів з баштами, а на вершині — замок консула.", "У **1475 р.** фортецю захопили **османи**."]}, {"type": "monument", "title": "Бахчисарайський історично-культурний заповідник (XVI – XVIII ст.)", "badges": [], "img": {"key": "m_bakh", "cap": "Ханський палац у Бахчисараї"}, "paras": ["Головна пам’ятка — **Ханський палац**, резиденція кримських ханів з **1532 р.** У 1736 р. палац спалило російське військо, згодом хани його відбудували.", "До заповідника належать мечеті, мавзолеї ханів, давнє місто-фортеця **Чуфут-Кале** (Кирк-Ор).", "Палац — найвідоміша пам’ятка кримськотатарської архітектури."]}, {"type": "monument", "title": "Вірменський собор у Львові (1363)", "badges": [], "img": {"key": "armenian2", "cap": "Вірменський собор, вигляд із подвір’я. Фото: Wereskowa / Wikimedia Commons, CC BY-SA 4.0"}, "paras": ["Собор збудувала у **1363 – 1370 рр.** вірменська громада Львова. Тут була кафедра вірменського єпископа.", "Архітектор **Дорінг** поєднав вірменську традицію (купол на високому барабані) з прийомами місцевих будівничих.", "Пізніше собор кілька разів перебудовували. На подвір’ї збереглися давні надгробки й дзвіниця."]}, {"type": "monument", "title": "Костел святого Варфоломія в Дрогобичі (1392 – XV ст.)", "badges": [], "img": {"key": "m_drohobych", "cap": "Костел святого Варфоломія й дзвіниця"}, "paras": ["Будувати костел почали після **1392 р.**, коли король Ягайло заснував у Дрогобичі католицьку парафію. Основні роботи завершили в XV ст.", "Це **готичний** костел: високі стрілчасті вікна, стрімкий дах, контрфорси.", "Дзвіниця поруч була оборонною вежею міських укріплень."]}, {"type": "monument", "title": "Покровська церква-фортеця в Сутківцях (1476)", "badges": [], "img": {"key": "m_sutkivtsi", "cap": "Покровська церква в Сутківцях на Хмельниччині"}, "paras": ["Церкву збудували на **Поділлі**, де часто проходили татарські загони.", "Церква має товсті мури з **бійницями**, вузькі вікна й масивні контрфорси: у ній можна було сховатися від нападу.", "Храмів, що водночас були фортецями, збереглося небагато, і Сутківці — найвідоміший із них."]}, {"type": "monument", "title": "Церква Зішестя Святого Духа в с. Потелич (1502)", "badges": [], "img": {"key": "m_potelych", "cap": "Церква Святого Духа в Потеличі"}, "paras": ["Це одна з найдавніших **дерев’яних церков** України: її збудували у **1502 р.**", "Усередині збереглися розписи XVII ст.", "У **2013 р.** ЮНЕСКО внесла церкву до Списку всесвітньої спадщини разом з іншими дерев’яними церквами Карпатського регіону."]}, {"type": "monument", "title": "Ікона «Юрій Змієборець» із с. Станиля (XIV ст.)", "badges": [], "img": {"key": "m_stanylia", "cap": "Ікона зі Станилі. Національний музей у Львові"}, "paras": ["Ікона походить із церкви в селі **Станиля** поблизу Дрогобича. Це одна з найдавніших ікон галицької школи.", "Святий Юрій на **чорному коні** вбиває змія; червоний плащ розвівається за плечима.", "Ікона зберігається в **Національному музеї у Львові**."]}, {"type": "monument", "title": "Ікона Богородиці з пророками з с. Підгородці", "badges": [], "img": {"key": "m_pidhor", "cap": "Ікона з Підгородців. Національний музей у Львові"}, "paras": ["Ікона походить із села **Підгородці** на Львівщині.", "У центрі — **Богородиця з Дитям** (Одигітрія), на полях — **пророки** Старого Заповіту з сувоями, на яких записано їхні пророцтва про Христа.", "Ікону написали галицькі майстри за візантійською традицією. Час її створення дослідники визначають по-різному."]}, {"type": "monument", "title": "Ікона Олексія Горошковича «Успіння Богородиці» (1547)", "badges": [], "img": {"key": "m_horosh", "cap": "Ікона «Успіння Богородиці» Олексія Горошковича (1547). Національний музей у Львові"}, "paras": ["Ікона походить із церкви в селі **Смільник** (нині Польща).", "Майстер **Олексій Горошкович** підписав і датував свій твір **1547 р.**: напис видно в нижньому лівому куті ікони. Це одна з перших підписаних і датованих українських ікон.", "На іконі зображено **Успіння** — смерть Богородиці в оточенні апостолів. Над ложем стоїть Христос із її душею на руках, а вгорі ангели на хмарах несуть апостолів.", "Ікона зберігається в **Національному музеї у Львові**."]}]}, {"id": "s5", "num": "V", "title": "Підсумки всієї теми", "sub": "Дати, персоналії, поняття, пам’ятки, що часто плутають, велика стрічка часу", "cover": {"key": "medzh", "cap": ""}, "cards": [{"type": "table", "title": "Дати теми 5", "rows": [["Дата", "Подія"], ["1362 р.", "Битва біля р. Сині Води: Ольгерд розбив ординців; Київщина й Поділля перейшли до Литви"], ["1385 р.", "Кревська унія: Ягайло обіцяв охрестити Литву в католицтво й приєднати її землі до Польщі"], ["40-ві рр. XV ст.", "Утворення Кримського ханства (Хаджі-Герей)"], ["1478 р.", "Кримське ок", "Мукачево", "XIV – XVII ст."], ["Генуезька фортеця", "Судак", "XIV – XV ст."], ["Бахчисарайський заповідник", "Бахчисарай", "XVI – XVIII ст."], ["Вірменський собор", "Львів", "1363"], ["Костел святого Варфоломія", "Дрогобич", "1392 – XV ст."], ["Покровська церква-фортеця", "Сутківці (Хмельниччина)", "1476"], ["Церква Зішестя Святого Духа", "Потелич (Львівщина)", "1502"], ["Ікона «Юрій Змієборець»", "Станиля (біля Дрогобича)", "XIV ст."], ["Ікона Богородиці з пророками", "Підгородці (Львівщина)", "дата дискусійна"], ["«Успіння Богородиці» О. Горошковича", "Смільник (нині Польща)", "1547"]]}, {"type": "table", "title": "Що часто плутають на НМТ", "rows": [["Плутають", "Як правильно"], ["Кревська й Люблінська унії", "**Кревська (1385)** — Ягайло обіцяв охрестити Литву й приєднати її до Польщі; **Люблінська (1569)** — утворення Речі Посполитої (тема 6)"], ["1452 і 1471", "**1452** — ліквідовано Волинське князівство; **1471** — Київське князівство стало воєводством"], ["Хаджі-Герей і Менглі-Герей", "**Хаджі-Герей** — засновник ханства; **Менглі-Герей** — його син, васал султана з 1478 р."], ["Магістрат, рада, лава", "**Магістрат** = рада (бурмистр, управління) + лава (війт, суд)"], ["Магдебурзьке право: Сянок і Київ", "**Сянок** отримав його першим на українських землях (**1339**); **Київ** — аж у **1494 р.**"], ["Фіоль, Скорина, Федоров", "**Фіоль** — Краків, 1491; **Скорина** — Прага, 1517; **Федоров** — Львів, 1574 (тема 6)"], ["Шляхта й магнати", "**Шляхта** — увесь привілейований стан; **магнати** — найбагатші шляхтичі"], ["Сутківці й Потелич", "**Сутківці** — мурована церква-фортеця (1476); **Потелич** — дерев’яна церква (1502)"]]}, {"type": "tl_periods", "title": "Стрічка часу: українські землі у складі різних держав (1340 – 1569)", "note": "**1569 р.** — Люблінська унія: утворення Речі Посполитої (тема 6). Відстані між роками — у масштабі.", "x_from": 1335, "x_to": 1575, "ticks": [[1350, "1350"], [1400, "1400"], [1450, "1450"], [1500, "1500"], [1550, "1550"]  "Яка з наведених земель після війни за галицько-волинську спадщину опинилася у складі Польщі?", "sec": "s1", "g": "p1_galicia", "t": "single", "opts": ["Київщина", "Волинь", "Чернігівщина", "Галичина"], "ok": [3], "expl": "Галичину Казимир III захопив у 1349 р., а остаточно її приєднала до Польщі королева Ядвіга в 1387 р. Волинь залишилася в складі Литви."}, {"id": "ctM.9", "q": "Яка з українських земель увійшла до складу Польського королівства найраніше?", "sec": "s1", "g": "p1_galicia", "t": "single", "opts": ["Галичина", "Західне Поділля", "Волинь", "Правобережжя"], "ok": [0], "expl": "Першою до Польщі потрапила Галичина: Казимир III захопив її в 1349 р. Західне Поділля польська шляхта захопила лише в 1430 р., а Волинь лишалася в складі Литви."}, {"id": "k089_", "q": "Що було основною причиною швидкого зростання Великого князівства Литовського з середини XIII ст.?", "sec": "s1", "g": "p1_reason", "t": "single", "opts": ["союзи з Тевтонським орденом і Королівством Польським", "успішні війни Литви з Угорським королівством", "послаблення руських князівств унаслідок монгольської навали", "тривалий союз із Галицько-Волинською державою"], "ok": [2], "expl": "Після монгольської навали руські землі були розрізнені й слабкі. Литва давала їм захист від Орди й мало втручалася в місцеве життя, тому князівство швидко росло на схід і південь."}, {"id": "ctM.1", "q": "Який зовнішній чинник відіграв вирішальну роль у приєднанні земель колишньої Русі до Великого князівства Литовського?", "sec": "s1", "g": "p1_reason", "t": "single", "opts": ["монгольська навала й ординське панування", "наступ німецьких хрестоносців на Прибалтику", "династична унія Литви з Польщею", "утворення Московської держави"], "ok": [0], "expl": "Навала й ординське панування послабили руські князівства, і Литва поширила на них свою владу. Унію з Польщею уклали лише в 1385 р., а єдина Московська держава постала наприкінці XV ст."}, {"id": "z686", "q": "Про який регіон ідеться в уривку з історичного джерела: ого джерела? «…і відтоді з Поділля вигнано владу татарську. Цей [князь] інші руські землі під свою владу взяв, і Київ з-під Федора-князя, ставленика хана, взято і посадив в ньому Володимира, сина свого, і почав над ними володіти…»", "sec": "s2", "g": "p1_doc6870", "t": "single", "opts": ["битви на річці Сині Води", "укладення Кревської унії", "битви під Грюнвальдом", "укладення Городельської унії"], "ok": [0], "expl": "Після перемоги на Синіх Водах Ольгерд забрав Київ у ставленика хана Федора й посадив там сина Володимира, а з Поділля вигнав ординців."}, {"id": "z7878", "q": "Коли відбулася битва, наслідком якої стала подія, описана в уривку з історичного джерела: «…великий князь литовський… прилучив до своєї держави подільську землю та вигнав звідти татар…»?", "sec": "s2", "g": "p1_podil", "t": "single", "opts": ["1362 р.", "1385 р.", "1449 р.", "1471 р."], "ok": [0], "expl": "Поділля Ольгерд приєднав після перемоги над ординцями на Синіх Водах у 1362 р. Правити там він поставив своїх небожів — князів Коріатовичів."}, {"id": "z984", "q": "Включення в XIV ст. земель Південно-Західної Русі до складу Великого князівства Литовського було результатом боротьби з", "sec": "s2", "g": "p1_horde", "t": "single", "opts": ["Великим князівством Московським.", "Польським королівством.", "Тевтонським орденом.", "Золотою Ордою."], "ok": [3], "expl": "Київщина, Поділля й Переяславщина до 1362 р. платили данину Золотій Орді. Литва забрала їх в Орди: вирішальною стала битва на Синіх Водах."}, {"id": "z1040", "q": "Входження українських земель у XIV ст. до складу Великого князівства Литовського стало результатом", "sec": "s2", "g": "p1_horde", "t": "single", "opts": ["укладення польсько-литовської Кревської унії.", "боротьби литовських князів із монгольськими ханами.", "перемог Литовської держави у війнах із Московським князівством.", "укладення династичного союзу з останнім галицько-волинським князем."], "ok": [1], "expl": "Руські землі Литва відвоювала в Золотої Орди, скориставшись її «великою зам’ятнею». Кревську унію (1385) уклали вже тоді, коли ці землі належали Литві."}, {"id": "z22214", "q": "Прикладом боротьби Великого князівства Литовського із Золотою Ордою за спадщину Київської Русі є битва", "sec": "s2", "g": "p1_battle", "t": "single", "opts": ["на річці Сині Води.", "під Дорогочином.", "на річці Калка.", "під Ярославом."], "ok": [0], "expl": "На Синіх Водах (1362) литовське військо Ольгерда розбило ординців і відкрило Литві шлях до Києва й Поділля. Калка, Дорогочин і Ярослав — битви XIII ст., до приходу Литви."}, {"id": "z825", "q": "У результаті якої битви Велике князівство Литовське закріпило за собою Поділля, Київщину, Чернігово-Сіверщину?", "sec": "s2", "g": "p1_battle", "t": "single", "opts": ["Битви на Синіх Водах", "Битви на р. Ворскла", "Вількомирської битви", "Грюнвальдської битви"], "ok": [0], "expl": "Перемога Ольгерда на Синіх Водах у 1362 р. забезпечила Литві Київщину й Поділля, а згодом і Чернігово-Сіверщину. На Ворсклі Вітовт програв Орді, під Грюнвальдом воювали з Тевтонським орденом, під Вількомиром — Свидригайло із Сигізмундом."}, {"id": "z37598c", "q": "Яка подія відіграла вирішальну роль у переході до складу Великого князівства Литовського земель, позначених на картосхемі штрихуванням?", "sec": "s2", "g": "p1_battle", "t": "single", "img": ["q_cd326ba2f2"], "opts": ["битва на Синіх Водах", "утворення Кримського ханства", "завершення московсько-литовських війн", "заснування першої Запорозької Січі"], "ok": [0], "expl": "Заштриховано Київщину, Поділля, Чернігово-Сіверщину й Волинь — руські землі, що ввійшли до Литви в XIV ст. Волинь перейшла до Литви ще в 1340 р. (Любарт), а Київ і Поділля — після перемоги на Синіх Водах (1362)."}, {"id": "k030_", "q": "Укажіть факти з біографії Ольгерда Гедиміновича.", "sec": "s2", "g": "p1_olgfacts", "t": "three", "opts": ["розбив ординців у битві на Синіх Водах", "уклав Кревську унію з Польщею", "посадив у Києві свого сина Володимира", "загинув у битві на річці Ворскла", "тричі ходив походами на Москву", "очолив Велике князівство Руське", "ліквідував Київське удільне князівство"], "ok": [0, 2, 4], "expl": "Ольгерд переміг на Синіх Водах (1362), посадив у Києві сина Володимира й тричі ходив на Москву (1368, 1370, 1372). Кревську унію уклав його син Ягайло, Велике князівство Руське очолив Свидригайло, а на Ворсклі воював Вітовт."}, {"id": "k029_", "q": "Яка династія з XIV ст. правила у Великому князівстві Литовському?", "sec": "s2", "g": "p1_dyn", "t": "single", "opts": ["Рюриковичі", "Гедиміновичі", "Романовичі", "П’ясти"], "ok": [1], "expl": "Від Гедиміна пішла династія Гедиміновичів: до неї належали Ольгерд, Ягайло, Вітовт і Свидригайло. Рюриковичі правили на Русі, Романовичі — у Галицько-Волинській державі, П’ясти — у Польщі."}, {"id": "k003", "q": "Кревську унію було укладено в", "sec": "s3", "g": "p1_kdate", "t": "single", "opts": ["1385 р.", "1401 р.", "1413 р.", "1569 р."], "ok": [0], "expl": "Кревська унія — 1385 р., дата з програми НМТ. 1401 р. — Віленсько-Радомська унія, 1413 р. — Городельська, 1569 р. — Люблінська."}, {"id": "z4946", "q": "Кревську унію між Польським королівством і Великим князівством Литовським укладено", "sec": "s3", "g": "p1_kdate", "t": "single", "opts": ["1362 р.", "1370 р.", "1385 р.", "1392 р."], "ok": [2], "expl": "14 серпня 1385 р. Ягайло підписав угоду з польськими послами в Кревському замку. 1362 р. — Сині Води, 1392 р. — Островська угода Ягайла з Вітовтом."}, {"id": "k014_", "q": "Хто після укладення Кревської унії став водночас великим князем литовським і королем Польщі?", "sec": "s3", "g": "p1_king", "t": "single", "opts": ["Гедимін", "Ольгерд Гедимінович", "Ягайло Ольгердович", "Свидригайло Ольгердович"], "ok": [2], "expl": "Ягайло в 1386 р. охрестився під іменем Владислав, одружився з Ядвігою й коронувався як Владислав II. Так Литва й Польща отримали спільного монарха."}, {"id": "k033_", "q": "Яке поняття має таке визначення: «союз двох або кількох держав (чи церков), укладений на певних умовах, — зі спільним правителем, спільними установами або підпорядкуванням однієї з них»? З цим поняттям пов’язана подія кінця XIV ст. у відносинах Литви й Польщі.", "sec": "s3", "g": "p1_term", "t": "single", "opts": ["унія", "васалітет", "уділ", "протекторат"], "ok": [0], "expl": "Унія — союз держав (або церков) на певних умовах. У 1385 р. Литва й Польща уклали Кревську унію й отримали спільного монарха."}, {"id": "k035_", "q": "Що стало одним із наслідків укладення Кревської унії?", "sec": "s3", "g": "p1_kconseq", "t": "single", "opts": ["звільнення Київщини й Поділля від влади Золотої Орди", "боротьба литовської знаті на чолі з Вітовтом за окремішність Литви", "створення польсько-литовської держави — Речі Посполитої", "перемога над Московським царством у Лівонській війні"], "ok": [1], "expl": "Литовська знать боялася, що Литва стане польською провінцією, і в 1389 – 1392 рр. її очолив Вітовт. Річ Посполиту створила Люблінська унія 1569 р., а Київщину від Орди звільнив Ольгерд ще в 1362 р."}, {"id": "f123", "q": "Укладення Кревської унії призвело до", "sec": "s3", "g": "p1_kconseq", "t": "single", "opts": ["появи фільваркової системи землеволодіння на території Великого князівства Литовського", "боротьби литовської знаті на чолі з Вітовтом за збереження незалежності Великого князівства Литовського", "активізації татарських нападів на територію Київщини, Брацлавщини та Чернігівщини", "збройної боротьби з Великим князівством Московським"], "ok": [1], "expl": "Після унії частина литовських і руських бояр стала на бік Вітовта, який домагався окремішності Литви. Островська угода 1392 р. зробила його правителем Литви."}, {"id": "ctM.32", "q": "Унаслідок укладення Кревської унії", "sec": "s3", "g": "p1_kconseq", "t": "single", "opts": ["відбулося об’єднання Литви й Польщі в єдину державу Річ Посполиту", "відбувся розкол у православній церкві й утворилася греко-католицька церква", "загострилася внутрішньополітична боротьба у Великому князівстві Литовському", "українським землям вдалося позбутися монгольського панування"], "ok": [2], "expl": "Унія загострила боротьбу в Литві: Вітовт і частина знаті воювали з Ягайлом за окремішність Литви. Річ Посполита постала 1569 р., а греко-католицька церква — після Берестейської унії 1596 р."}, {"id": "k034_", "q": "Уривок з якого документа наведено? «Бажаючи віри католицької святої римської Церкви прийняти… обіцяє і гарантує власним коштом і старанням своїм повернути Королівству Польському всі землі, якими б іменами вони не називались, ким би не були зайняті та відірвані… Нарешті, згаданий князь Ягайло обіцяє також землі свої литовські та руські на вічні часи до Корони Королівства Польського приєднати».", "sec": "s3", "g": "p1_kdoc", "t": "single", "opts": ["Кревської унії", "Городельської унії", "Люблінської унії", "Берестейської унії"], "ok": [0], "expl": "Це Кревський акт 1385 р.: Ягайло обіцяв охреститися разом із Литвою, повернути Польщі втрачені землі й «приєднати» Литву до Польської Корони."}, {"id": "ctM.46", "q": "Про яку подію йдеться в уривку з джерела? «…Ягайло, великий князь, обіцяє всі свої багатства вжити й витратити на усунення недоліків обох королівств, як Польщі, так і Литви, якщо володарка Угорщини вищезгадану дочку, королеву Польщі, з’єднає з ним шлюбними узами… Нарешті, згаданий князь Ягайло обіцяє свої литовські й руські землі навік приєднати до королівства Польського».", "sec": "s3", "g": "p1_kdoc", "t": "single", "opts": ["Кревську унію", "Віленську унію", "Люблінську унію", "Берестейську унію"], "ok": [0], "expl": "Шлюб Ягайла з польською королевою Ядвігою й обіцянка приєднати литовські й руські землі до Польщі — умови Кревської унії 1385 р."}, {"id": "z8924", "q": "У якій угоді були зазначені умови, наведені в уривку з історичного джерела? «…государ Ягайло, великий князь, з усіма своїми ще нехрещеними братами, ближніми, …що проживають на його землях, жагуче бажає й просить прийняти їх у католицьку віру святої римської церкви… Нарешті, князь Ягайло обіцяє свої литовські й руські землі навік приєднати до королівства Польського».", "sec": "s3", "g": "p1_kdoc", "t": "single", "opts": ["Кревській унії", "Городельській унії", "Люблінській унії", "Берестейській унії"], "ok": [0], "expl": "Хрещення Литви в католицтво й обіцянка «приєднати» її землі до Польщі — головні умови Кревської унії, яку Ягайло підписав у 1385 р."}, {"id": "z36616", "q": "Які держави стали на шлях об’єднання завдяки документу, уривок з якого наведено? «…господар Ягайло, великий князь, з усіма своїми ще нехрещеними братами <…> жагуче бажає і просить прийняти їх у католицьку віру святої римської церкви».", "sec": "s3", "g": "p1_kdoc", "t": "single", "opts": ["Королівство Польське та Велике князівство Московське", "Велике князівство Литовське та Велике князівство Московське", "Велике князівство Литовське та Королівство Польське", "Велике князівство Литовське та Лівонський орден"], "ok": [2], "expl": "Це уривок із Кревського акта 1385 р. Після нього Литва й Польща отримали спільного монарха — Ягайла."}, {"id": "z22872", "q": "У якому році відбулася подія, описана в уривку з історичного джерела: «…государ Ягайло, великий князь, з усіма своїми ще не хрещеними братами, ближніми, …жагуче бажає і просить прийняти їх у католицьку віру святої Римської церкви… обіцяє свої литовські й руські землі навік приєднати до королівства Польського…»?", "sec": "s3", "g": "p1_kdocyear", "t": "single", "opts": ["1385 р.", "1413 р.", "1569 р.", "1596 р."], "ok": [0], "expl": "Уривок — із Кревського акта, який Ягайло підписав 14 серпня 1385 р. 1413 р. — Городельська унія, 1569 р. — Люблінська, 1596 р. — Берестейська церковна унія."}, {"id": "ctM.51", "q": "У якому році було укладено угоду, уривок з якої наведено? «…вельмишановна пані, прийми князя Ягайла за сина та віддай йому в дружини свою дочку Ядвігу, королеву Польщі… государ Ягайло, з усіма своїми ще не хрещеними братами, ближніми, що проживають на його землях, просить прийняти їх у католицьку віру… обіцяє свої литовські і руські землі навік приєднати до королівства Польського».", "sec": "s3", "g": "p1_kdocyear", "t": "single", "opts": ["1362 р.", "1370 р.", "1385 р.", "1392 р."], "ok": [2], "expl": "Шлюб Ягайла з Ядвігою й хрещення Литви — умови Кревської унії 1385 р. 1362 р. — Сині Води, 1370 р. — смерть Казимира III, 1392 р. — Островська угода."}, {"id": "k077_", "q": "Коли було укладено угоду, з якої взято уривок? «Обіцяє також [великий князь Ягайло] свої литовські і руські землі навік приєднати (лат. applicare; історики тлумачать це слово по-різному) до Корони Польської».", "sec": "s3", "g": "p1_kdocyear", "t": "single", "opts": ["1362 р.", "1385 р.", "1401 р.", "1413 р."], "ok": [1], "expl": "Слово «applicare» — з Кревського акта 1385 р. Історики сперечаються, чи означало воно включення Литви до Польщі, чи лише союз двох держав під владою одного монарха."}, {"id": "z17461", "q": "Подія, описана в уривку з історичного джерела «Магнати та шляхта змусили юну королеву в державних інтересах Польщі відмовитися від нареченого з австрійського дому й вийти заміж за литовського князя Ягайла...», свідчить про реалізацію однієї з умов", "sec": "s3", "g": "p1_jadwiga", "t": "single", "opts": ["Кревської унії.", "Люблінської унії.", "Берестейської унії.", "Городельської унії."], "ok": [0], "expl": "Шлюб Ядвіги з Ягайлом (1386) передбачала Кревська унія. Ягайло навіть обіцяв заплатити 200 тисяч флоринів австрійському принцові, з яким раніше заручили Ядвігу."}, {"id": "z9402", "q": "Коли відбулася подія, наслідки якої описано в уривку з історичного джерела: «Магнати і шляхта змусили юну королеву [Ядвігу] в державних інтересах Польщі відмовитися від нареченого з австрійського дому і вийти заміж за литовського князя Ягайла...»?", "sec": "s3", "g": "p1_jadwiga", "t": "single", "opts": ["1385 р.", "1413 р.", "1569 р.", "1596 р."], "ok": [0], "expl": "Шлюб Ядвіги з Ягайлом — наслідок Кревської унії 1385 р. Весілля й коронація Ягайла відбулися в Кракові на початку 1386 р."}, {"id": "f108", "q": "Що стало наслідком події, описаної в уривку з історичного джерела: «Магнати і шляхта змусили юну королеву [Ядвігу] в державних інтересах Польщі відмовитися від нареченого з австрійського дому і вийти заміж за литовського князя Ягайла...»?", "sec": "s3", "g": "p1_jadwiga", "t": "single", "opts": ["ліквідація Київського удільного князівства", "боротьба між Свидригайлом та Сигізмундом за великокнязівський престол", "утворення Речі Посполитої", "посилення політичного й культурного впливу Польщі на Литву"], "ok": [3], "expl": "Після шлюбу Ягайла з Ядвігою в Литві поширилися католицтво, польські порядки й привілеї для католицької знаті — почався польський вплив на Литву. Річ Посполита постала лише в 1569 р."}, {"id": "k016_", "q": "Установіть послідовність подій з життя Вітовта.", "sec": "s4", "g": "p1_vseq", "t": "seq", "opts": ["початок боротьби Вітовта проти унії з Польщею", "поразка війська Вітовта від хана Темір-Кутлуга", "перемога польсько-литовсько-руського війська під Грюнвальдом", "з’їзд монархів, на якому Вітовтові запропонували корону"], "expl": "Боротьба проти унії — 1389 – 1392 рр., Ворскла — 1399 р., Грюнвальд — 1410 р., з’їзд монархів у Луцьку — 1429 р."}, {"id": "k036_", "q": "Укажіть факти з біографії Вітовта Кейстутовича.", "sec": "s4", "g": "p1_vfacts", "t": "three", "opts": ["здобув владу після тривалої боротьби з Ягайлом", "розбив ординців у битві на річці Сині Води", "відібрав у руських князів удільні князівства", "очолив Велике князівство Руське після 1432 р.", "уклав із Ягайлом Віленсько-Радомську унію", "уклав Кревську унію з Польським королівством", "втратив Чернігово-Сіверщину на користь Москви"], "ok": [0, 2, 4], "expl": "Вітовт роками воював з Ягайлом і став правителем Литви в 1392 р., відібрав у руських князів уділи, а в 1401 р. уклав із Ягайлом Віленсько-Радомську унію. Сині Води — Ольгерд, Велике князівство Руське — Свидригайло, Кревська унія — Ягайло."}, {"id": "k037r", "q": "У якому місті Вітовт приймав з’їзд європейських монархів, на якому йому запропонували королівську корону?", "sec": "s4", "g": "p1_lutsk", "t": "single", "opts": ["у Луцьку", "у Вільні", "у Кракові", "у Києві"], "ok": [0], "expl": "На з’їзд у Луцьку приїхали Сигізмунд Люксембурзький, Ягайло, посли папи, Візантії й Тевтонського ордену. Сигізмунд запропонував Вітовтові корону, але польська знать перехопила послів, які її везли, і Вітовт помер, так і не ставши королем."}, {"id": "k041", "q": "Польсько-литовсько-руське військо зупинило просування хрестоносців на схід унаслідок битви під", "sec": "s4", "g": "p1_grunstop", "t": "single", "opts": ["Вількомиром", "Оршею", "Грюнвальдом", "Дорогочином"], "ok": [2], "expl": "15 липня 1410 р. під Грюнвальдом військо Ягайла й Вітовта розгромило Тевтонський орден; загинув великий магістр. Після цієї поразки Орден уже не мав колишньої сили."}, {"id": "f082", "q": "Які наслідки мала битва об’єднаного війська поляків, литовців, українців і білорусів із рицарями Тевтонського ордену під Грюнвальдом?", "sec": "s4", "g": "p1_grunstop", "t": "single", "opts": ["подальше просування Тевтонського ордену на слов’янський Схід", "приєднання українських земель до Польсько-Литовської держави", "підрив військової могутності Тевтонського ордену та його занепад", "завершення литовсько-польського панування на українських землях"], "ok": [2], "expl": "Під Грюнвальдом (1410) Орден утратив цвіт свого лицарства й великого магістра. Від цієї поразки він уже не оговтався, і його наступ на Литву й Польщу припинився."}, {"id": "k042_", "q": "Про результат якої битви йдеться в уривку? «І так, з Божою поміччю та заступництвом Його Пресвятої Матері Діви Марії і святих покровителів, вороги були повністю розбиті й обернені до втечі хоробрими військами короля Владислава та Вітовта. І переслідували їх немилосердно на просторі кількох миль, вбиваючи та беручи в полон… І в тій битві було взято п’ятдесят одну ворожу хоругву, серед яких була велика хоругва великого магістра Пруссії та хоругва всього Ордену».", "sec": "s4", "g": "p1_grunstop", "t": "single", "opts": ["під Ярославом", "під Дорогочином", "під Грюнвальдом", "під Вількомиром"], "ok": [2], "expl": "Король Владислав (Ягайло), Вітовт і хоругва великого магістра Ордену — ознаки Грюнвальдської битви 1410 р., де польсько-литовське військо розгромило Тевтонський орден."}, {"id": "k080_", "q": "Яку назву пропущено в уривку? «Князь Вітовт зібрав велике військо — литовських і руських князів з їхніми полками, польських і німецьких лицарів — і пішов проти татарського хана Темір-Кутлуга на річку ______. Він прагнув посадити на золотоординський престол свого союзника Тохтамиша».", "sec": "s4", "g": "p1_vorskla", "t": "single", "opts": ["Сині Води", "Альту", "Калку", "Ворсклу"], "ok": [3], "expl": "Улітку 1399 р. Вітовт рушив на хана Темір-Кутлуга, щоб повернути владу в Орді Тохтамишеві. 12 серпня 1399 р. на Ворсклі його військо зазнало розгрому."}, {"id": "k044_", "q": "Укажіть умови Городельської унії 1413 р.", "sec": "s4", "g": "p1_horodlo3", "t": "three", "opts": ["Литва зберігала окремого великого князя", "хрещення всієї Литви в католицьку віру", "відмова Литви від Белзької та Холмської земель", "запровадження в Литві посад воєвод і каштелянів", "об’єднання Литви й Польщі в одну державу", "рівні права польської шляхти й бояр-католиків Литви", "допуск православної знаті до вищих посад"], "ok": [0, 3, 5], "expl": "Городельська унія зберегла Литві окремого великого князя, запровадила там посади воєвод і каштелянів і дала 47 родам литовських бояр-католиків польські герби й права. Православних до вищих посад не допускали; хрещення Литви — умова Кревської унії."}, {"id": "k078_", "q": "Зміст якої угоди найкраще відображає уривок? «Постановлено, що тільки пани і бояри-шляхта землі Литовської, католицької віри, що прийняли герби польські, можуть користуватися усіма правами і привілеями, якими користується шляхта Корони Польської».", "sec": "s4", "g": "p1_horodlo3", "t": "single", "opts": ["Кревської унії", "Віленсько-Радомської унії", "Городельської унії", "Люблінської унії"], "ok": [2], "expl": "Городельська унія 1413 р. дала литовським боярам-католикам польські герби й ті самі права, що й польській шляхті. Православна знать таких прав не отримала."}, {"id": "np1_ostrov", "q": "Як називається угода 1392 р., за якою Вітовт став правителем Литви?", "sec": "s4", "g": "p1_ostrov", "t": "single", "opts": ["Островська угода", "Кревська унія", "Городельська унія", "Віленсько-Радомська унія"], "ok": [0], "expl": "Після трьох років війни Ягайло й Вітовт уклали Островську угоду (1392): Вітовт став правителем Литви, хоча формально визнавав старшинство Ягайла."}, {"id": "np1_namisn", "q": "Після 1393 – 1395 рр. руські князі втратили уділи на Чернігово-Сіверщині, Поділлі й Київщині. Хто відтоді правив цими землями?", "sec": "s4", "g": "p1_namisn", "t": "single", "opts": ["намісники великого князя", "ординські баскаки й отамани", "угорські королівські воєводи", "віче й виборні тисяцькі"], "ok": [0], "expl": "Вітовт не хотів ділити владу з удільними князями: Дмитра-Корибута, Федора Коріатовича й Володимира Ольгердовича позбавили уділів, а руськими землями стали правити намісники, віддані лише великому князеві."}, {"id": "k046_", "q": "Яку землю в 1430 р., одразу після смерті Вітовта, захопили польські шляхтичі?", "sec": "s5", "g": "p1_podil1430", "t": "single", "opts": ["Західне Поділля з Кам’янцем", "Волинь із Луцьким замком", "Київщину з містом Києвом", "Чернігово-Сіверщину з Черніговом"], "ok": [0], "expl": "У 1430 р. польська шляхта захопила Західне Поділля з Кам’янцем. Наступного року Ягайло обложив Луцьк, але взяти замок не зміг, і Волинь лишилася за Свидригайлом."}, {"id": "k083_", "q": "Які імена пропущено в уривку? «Після смерті великого князя Вітовта [1430 р.] литовські та руські пани обрали великим князем ______, брата короля ______. Він вів самостійну політику й спирався на православну руську знать, яка прагнула рівних прав з католиками. Це обурило польську корону й частину литовських панів-католиків, і спалахнула війна».", "sec": "s5", "g": "p1_elect", "t": "single", "opts": ["Кейстута, Ольгерда", "Свидригайла, Ягайла", "Сигізмунда, Ягайла", "Свидригайла, Вітовта"], "ok": [1], "expl": "У 1430 р. великим князем обрали Свидригайла — наймолодшого сина Ольгерда й рідного брата короля Владислава II Ягайла. Сигізмунд Кейстутович — брат Вітовта; його поставили великим князем у 1432 р."}, {"id": "np1_vilkpol", "q": "Хто підтримав Сигізмунда Кейстутовича в битві під Вількомиром (1435)?", "sec": "s5", "g": "p1_vilkpol", "t": "single", "opts": ["Польське королівство", "Лівонський орден", "Велике князівство Московське", "Кримське ханство"], "ok": [0], "expl": "Сигізмунда, якого поставили великим князем литовські пани, підтримали поляки. На боці його суперника воювали лицарі Лівонського ордену."}, {"id": "np1_priv", "q": "Що отримала православна руська знать за привілеями 1432 і 1434 рр., які видали Ягайло й Сигізмунд Кейстутович?", "sec": "s5", "g": "p1_priv", "t": "single", "opts": ["ті самі права на землю й суд, що й католики", "право обіймати посади воєвод і засідати в раді великого князя", "окрему державу — Велике князівство Руське", "звільнення від військової служби великому князеві"], "ok": [0], "expl": "Щоб відвернути руську знать від Свидригайла, Ягайло й Сигізмунд зрівняли православних із католиками в правах на землю й суд. Вищі посади, як і раніше, обіймали лише католики."}, {"id": "np1_vkr", "q": "Які руські землі після перевороту 1432 р. залишилися вірними Свидригайлові й утворили Велике князівство Руське?", "sec": "s5", "g": "p1_vkrlands", "t": "single", "opts": ["Київщина, Волинь, Чернігово-Сіверщина", "Галичина, Холмщина, Белзчина", "Закарпаття й Північна Буковина", "Жемайтія, Вільно й Троки"], "ok": [0], "expl": "Литва визнала Сигізмунда Кейстутовича, а Київщина, Волинь, Чернігово-Сіверщина, Полоччина, Вітебщина й Смоленщина лишилися за Свидригайлом. Галичина й Холмщина належали Польщі, Закарпаття — Угорщині."}]}, "2": {"n": 30, "pass": 75, "timer": true, "quota": {"s1": 4, "s2": 6, "s3": 6,

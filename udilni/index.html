ах 1 і 2; усі разом — у підсумках"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятки (13)", "light": false}, {"k": "p", "paras": ["• Вірменський собор у Львові · костел у Дрогобичі · Верхній замок у Луцьку · Кам’янець-Подільська й Хотинська фортеці · Сутківці · Паланок · Судак · Бахчисарай · ікони зі Станилі й Підгородців · церква в Потеличі · «Успіння» О. Горошковича"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Знати й пояснювати", "light": false}, {"k": "p", "paras": ["• **соціально-економічний розвиток** земель, **становище верств**", "• **досягнення в культурі**", "• діяльність **Юрія Дрогобича**"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 5. Матеріал про Литовські статути 1566 і 1588 рр. та остаточне закріпачення селян належить до теми 6 — він позначений сірим бейджем «тема 6»."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Суспільство: стани", "sub": "Князі, пани й шляхта, духовенство, міщани, селяни", "cover": {"key": "estates", "cap": ""}, "cards": [{"type": "text", "kicker": "Суспільство", "title": "Як було влаштоване суспільство", "badges": [], "paras": ["**Стан** — група населення з однаковими правами й обов’язками, закріпленими законом або звичаєм. Належність до стану передавалася в спадок.", "Найвище стояли **князі й пани**, нижче — дрібні землевласники: **зем’яни, бояри, панцирні слуги**.", "Окремим станом було **духовенство** — православне й католицьке.", "Особисто вільними були **міщани**. Найчисленнішим і найбезправнішим станом залишалися **селяни**."], "imgs": [{"key": "reeve", "cap": "Наглядач підганяє селян на панському полі. Англійська мініатюра XIV ст. (Псалтир королеви Марії)"}]}, {"type": "defs", "title": "Привілейовані стани", "badges": [], "items": [{"name": "Князі", "paras": ["Нащадки Рюриковичів і Гедиміновичів: Острозькі, Вишневецькі, Збаразькі.", "Мали великі спадкові маєтки, власне військо, суд над своїми людьми.", "Обіймали найвищі посади — гетьманів, воєвод."], "img": null}, {"name": "Пани", "paras": ["Заможні роди, що не мали князівського титулу.", "Мали спадкові маєтки, обіймали посади старост і каштелянів."], "img": null}, {"name": "Зем’яни, бояри", "paras": ["Отримували землю за військову службу.", "Служили великому князеві, а часто — князям і панам, від яких залежали."], "img": null}, {"name": "Духовенство", "paras": ["**Вище** духовенство — митрополит і єпископи, **нижче** — парафіяльні священики.", "Мали землі, звільнялися від повинностей. Кандидатів на церковні посади затверджував король, великий князь або власник маєтку."], "img": null}], "note": null}, {"type": "text", "kicker": "Суспільство", "title": "Шляхта", "badges": ["НМТ: поняття", "тема 6"], "paras": ["Протягом XV – XVI ст. князі, пани й дрібні землевласники злилися в один привілейований стан — **шляхту**.", "Найбагатших шляхтичів, що мали величезні маєтки й вплив, називали **магнатами**.", "Права шляхти закріпили **Литовські статути** — зводи законів Великого князівства Литовського. Перший статут **1529 р.** гарантував шляхті право на землю й особисту свободу. Другий (**1566**) і третій (**1588**) статути зрівняли в правах магнатів і дрібну шляхту.", "**Шляхтич** мав спадкову землю й міг обіймати державні посади. Він брав участь у **сеймиках** — місцевих з’їздах шляхти, де обирали послів до **сейму**, що ухвалював закони. За це шляхтич мусив власним коштом служити у **війську**."], "imgs": [{"key": "statut1529", "cap": "Сторінка Першого Литовського статуту (список 1531 р.) з гербом Погоня. Суспільне надбання"}]}, {"type": "defs", "title": "Міщани", "badges": [], "items": [{"name": "Патриціат", "paras": ["Міська верхівка: багаті купці, лихварі, власники кам’яниць.", "Саме патриції керували містом."], "img": null}, {"name": "Бюргерство", "paras": ["Середні верстви: купці середнього достатку, майстри-ремісники.", "Здебільшого мали власні будинки."], "img": null}, {"name": "Плебс", "paras": ["Наймити, підмайстри, міська біднота.", "Власних будинків не мали, і до керування містом їх не допускали."], "img": null}], "note": "Міщани були **особисто вільними**, а багато міст згодом здобули **самоврядування** (про нього — у розділі II). Міщани платили податки й відбували повинності на користь короля чи власника міста."}, {"type": "defs", "title": "Селяни", "badges": [], "items": [{"name": "Похожі й непохожі", "paras": ["Селяни різнилися правом переходу: **похожі** могли піти від пана, розрахувавшись із ним, а **непохожі** були прикріплені до землі."], "img": null}, {"name": "Слуги", "paras": ["Особисто вільні, служили пану: були управителями, охоронцями, гінцями.", "За службу могли отримати землю."], "img": null}, {"name": "Данники", "paras": ["Платили пану **данину**: грошима (**чинш**) або продуктами."], "img": null}, {"name": "Тяглі", "paras": ["Працювали на панському полі зі своєю худобою — **тяглом**.", "Згодом ця повинність отримала назву **панщина**."], "img": null}], "note": "**Кріпосне право** — порядок, за якого селянин прикріплений до землі пана й не може її залишити. **Панщина** — обов’язкова праця селянина зі своїм реманентом у господарстві пана."}]}, {"id": "s2", "num": "II", "title": "Господарство й міста", "sub": "Фільварки й закріпачення, міста, магдебурзьке право, магістрат, цехи, торгівля", "cover": {"key": "mag_col", "cap": ""}, "cards": [{"type": "text", "kicker": "Господарство", "title": "Фільварок", "badges": ["тема 6"], "paras": ["Більшість людей жила із землеробства. З кінця XV ст. пани дедалі більше землі брали під власну ріллю.", "Так виникали **фільварки** — великі панські господарства, де зерно вирощували **на продаж**.", "У XVI ст. хліб у Західній Європі дорожчав, тож продавати зерно стало вигідно. Його везли до **Гданська**, а звідти морем до Нідерландів та Англії.", "Працювати на фільварку пани змушували селян. Тому разом із фільварками поширювалися **панщина** й **кріпацтво**."], "imgs": [{"key": "granary", "cap": "Зерносховища в Гданську: звідси зерно везли морем до Західної Європи. Фото: Andrzej Otrębski / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "map", "title": "Як працював фільварок", "steps": [{"key": "map_filv0", "label": "Крок 1"}, {"key": "map_filv1", "label": "Крок 2"}, {"key": "map_filv2", "label": "Крок 3"}]}, {"type": "doc", "title": "Як селян прикріплювали до землі", "quote": ["З одного села протягом року може піти лише один кмет…", "З кожної селянської родини тільки одному синові дозволено йти до міста вчитися ремесла або до школи; інші мусять лишатися на землі."], "source": "Петрковський статут польського сейму 1496 р. (переклад-переказ, скорочено)", "comment": ["Польська шляхта потребувала робочих рук на фільварках, тож сейм обмежив перехід селян. Ці постанови діяли й у Галичині та на Західному Поділлі.", "У Великому князівстві Литовському селян закріпачили пізніше — за **Уставою на волоки** (1557) і **Третім Литовським статутом** (1588). Про це йдеться в темі 6.", "__Слова з джерела:__ **кмет** — селянин, що мав наділ."], "img": null}, {"type": "text", "kicker": "Господарство", "title": "Міста", "badges": [], "paras": ["Найбільшими містами були **Львів, Київ, Кам’янець-Подільський, Луцьк, Володимир**. Більшість міст лишалися невеликими: кілька тисяч жителів.", "Міста належали королю (великому князеві), магнатам або церкві, тож були **королівськими (великокнязівськими)**, **приватними** й **церковними**.", "У містах жили українці, поляки, німці, вірмени, євреї. Кожна громада мала свої храми, а нерідко й окремий суд.", "Щоб звільнитися від свавілля старост і панів, міщани домагалися **магдебурзького права**."], "imgs": [{"key": "kam_ratusha2", "cap": "Ратуша в Кам’янці-Подільському — будинок міського самоврядування. Фото: Aschroet / Wikimedia Commons, CC0"}]}, {"type": "map", "title": "Що таке магдебурзьке право", "steps": [{"key": "map_magdeburg", "label": "Крок 1"}]}, {"type": "text", "title": "", "badges": [], "imgs": [], "paras": ["**Магдебурзьке право** — право міста на самоврядування. Воно виникло в німецькому Магдебурзі. Міщани обирали власні органи влади й суд і звільнялися з-під влади місцевих урядників.", "На українських землях першим його отримав **Сянок** (1339), далі **Львів** (1356), **Кам’янець** (1374), **Луцьк** (1432), **Київ** (1494).", "Згодом королі й магнати надавали магдебурзьке право й невеликим містам."]}, {"type": "doc", "title": "Львів отримує магдебурзьке право (1356)", "quote": ["Ми, Казимир, з Божої ласки король Польщі й Русі… бажаючи, щоб наше місто Львів процвітало, переводимо його з руського й будь-якого іншого права, що досі там діяло, на право німецьке, магдебурзьке.", "Війт міста судитиме міщан за цим правом, а воєводи, каштеляни й інші урядники не мають права їх судити."], "source": "Грамота короля Казимира III місту Львову, 17 червня 1356 р. (переклад-переказ з латини, скорочено)", "comment": ["Грамота звільнила львів’ян з-під влади королівських урядників: відтоді міщан судив власний міський суд.", "Проте повноправними міщанами у Львові довго були лише католики. Православні українці домагалися рівних прав аж до кінця XVI ст.", "__Слова з джерела:__ **війт** — голова міського суду; **каштелян** — урядник, що відав замком."], "img": null}, {"type": "defs", "title": "Магістрат — орган міського самоврядування", "badges": ["НМТ: поняття"], "items": [{"name": "Рада", "paras": ["Відала господарством і порядком у місті.", "Раду очолював **бурмистр**; її членів — **радців** — обирали з багатих міщан."], "img": null}, {"name": "Лава", "paras": ["Міський суд у кримінальних справах.", "Лаву очолював **війт**; суддів називали **лавниками**."], "img": null}, {"name": "Хто обирав", "paras": ["Право голосу мали заможні міщани — власники будинків, купці, цехові майстри.", "Бідноту до виборів не допускали."], "img": null}, {"name": "Обмеження", "paras": ["У деяких містах самоврядування поширювалося лише на католиків.", "Королівські старости й власники міст часто втручалися в справи магістрату."], "img": null}], "note": "У містах з магдебурзьким правом **магістрат** складався з двох частин — **ради** й **лави**."}, {"type": "defs", "title": "Цехи", "badges": ["НМТ: поняття"], "items": [{"name": "Які були цехи", "paras": ["Свої цехи мали ковалі, шевці, кравці, пекарі, різники, золотарі.", "У великих містах було кілька десятків цехів."], "img": null}, {"name": "Що робив цех", "paras": ["Стежив за якістю виробів і цінами, розв’язував суперечки, збирав податки.", "Обороняв свою ділянку міських мурів."], "img": null}, {"name": "Хто в цеху", "paras": ["Повноправними членами були **майстри**, а очолював цех **цехмістер**.", "У майстрів працювали **підмайстри** й навчалися **учні**."], "img": null}, {"name": "Поза цехом", "paras": ["Ремісників, що працювали поза цехом, називали **партачами**.", "У деяких містах православних до цехів не приймали."], "img": null}], "note": "**Цех** — об’єднання ремісників однієї або кількох споріднених професій, яке діяло за власним статутом."}, {"type": "defs", "title": "Торгівля", "badges": [], "items": [{"name": "Ярмарки", "paras": ["Міста отримували право проводити **ярмарки** — великі торги кілька разів на рік.", "На ярмарки з’їжджалися купці з різних країн."], "img": null}, {"name": "Вивозили", "paras": ["**Зерно**, **волів**, віск, мед, хутра, шкіри, поташ, деревину."], "img": null}, {"name": "Завозили", "paras": ["Сукно, тканини, вино, прянощі, зброю, металеві вироби."], "img": null}, {"name": "Торгові шляхи", "paras": ["Через **Львів** ішли шляхи з Польщі й Німеччини до Молдавії та Криму.", "Значну частину торгівлі вели **вірменські** купці."], "img": null}], "note": "Багато міст мали **право складу**: проїжджі купці мусили виставити свій товар на продаж у місті."}]}, {"id": "s3", "num": "III", "title": "Церква, освіта й культура", "sub": "Церковне життя, освіта, Юрій Дрогобич, книгодрукування, література, мистецтво", "cover": {"key": "psalter", "cap": ""}, "cards": [{"type": "defs", "title": "Церковне життя", "badges": [], "items": [{"name": "Православні Галичини", "paras": ["**Галицька митрополія**, заснована 1303 р. за Юрія I, на початку XV ст. перестала існувати.", "Свого єпископа у Львові православні Галичини отримали лише у **1539 р.**"], "img": null}, {"name": "Київська митрополія", "paras": ["Великі князі литовські не хотіли, щоб православними їхньої держави керував митрополит із Москви.", "У **1458 р.** митрополія поділилася: для земель Литви й Польщі постала окрема **Київська митрополія**."], "img": null}, {"name": "Католицька церква", "paras": ["Королі й великі князі підтримували католицтво: засновували єпископства, будували костели.", "Католицький архієпископ мав кафедру у **Львові**."], "img": null}, {"name": "Вірменська церква", "paras": ["У Львові з XIV ст. діяла вірменська єпархія. Її собор (1363) — пам’ятка з програми НМТ."], "img": null}], "note": null}, {"type": "text", "kicker": "Культура", "title": "Освіта", "badges": [], "paras": ["Грамоти навчали **дяки** при церквах і монастирях. Учні вивчали абетку, читали Часослов і Псалтир.", "Заможні родини наймали домашніх учителів.", "Вищих шкіл на українських землях не було, тож молодь їхала вчитися за кордон — до **Краківського університету** (заснований 1364 р.), а також до Праги, Болоньї, Падуї.", "У XV – першій половині XVI ст. в Кракові навчалися сотні студентів з руських земель. У списках їх записували «з Русі» (de Russia)."], "imgs": [{"key": "coll_maius", "cap": "Колегіум Маюс Краківського університету (XV ст.). Фото: Chris Olszewski / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Культура", "title": "Юрій Дрогобич (бл. 1450 – 1494)", "badges": ["НМТ: персоналія"], "paras": ["Юрій Котермак народився в **Дрогобичі** в сім’ї ремісника-солевара. Навчався в **Краківському університеті**, а потім у **Болонському** (Італія), де здобув ступені доктора філософії й медицини.", "У **1481 – 1482 рр.** він був **ректором** університету медицини й вільних мистецтв у Болоньї. Студенти обрали його, хоча він був чужинцем.", "У **1483 р.** у Римі вийшла його книжка **«Прогностична оцінка поточного 1483 року»** з астрономічними розрахунками. Це перша відома друкована книжка автора-українця.", "В останні роки життя Дрогобич викладав медицину в Кракові. Свої праці він підписував «Георгій Дрогобич з Русі»."], "imgs": [{"key": "drohobych_p", "cap": "Юрій Дрогобич. Пізніший уявний портрет. Суспільне надбання"}, {"key": "drohobych_bol", "cap": "Меморіальна дошка Юрію Дрогобичу в Болонському університеті. Фото: Patafisik / Wikimedia Commons, CC0"}]}, {"type": "text", "kicker": "Культура", "title": "Книгодрукування", "badges": [], "paras": ["Першими кириличними друкованими книжками були видання **Швайпольта Фіоля**. У **1491 р.** в **Кракові** він надрукував «Октоїх», «Часослов», «Тріодь пісну» й «Тріодь цвітну» церковнослов’янською мовою.", "Краківський єпископ звинуватив Фіоля в єресі. Після суду друкувати кириличні книжки він уже не міг.", "**Франциск Скорина** з Полоцька видав у **Празі** (1517 – 1519) «Біблію руську», а у **Вільні** (1522 – 1525) — «Апостол» і «Малу подорожну книжку».", "На українських землях друкарство з’явилося пізніше: у **1574 р.** у Львові Іван Федоров надрукував «Апостол» (тема 6)."], "imgs": [{"key": "fiol", "cap": "Октоїх Швайпольта Фіоля (Краків, 1491). Суспільне надбання"}, {"key": "skaryna", "cap": "Франциск Скорина. Гравюра з «Біблії руської» (Прага, 1517). Суспільне надбання"}]}, {"type": "text", "kicker": "Культура", "title": "Література й літописання", "badges": [], "paras": ["Книжники переписували церковні книги й прикрашали їх мініатюрами. Найвідоміша з таких книг — **Київський Псалтир 1397 р.**, який переписав диякон **Спиридон**.", "У Великому князівстві Литовському складали **литовсько-руські літописи**. У них ідеться про литовських князів, але мова літописів — руська.", "Закони й грамоти писали **руською (староукраїнською й старобілоруською) мовою**: нею укладено й Литовські статути.", "Освічені люди читали й перекладні твори: житія святих, повісті про Олександра Македонського й Троянську війну."], "imgs": [{"key": "psalter2", "cap": "Мініатюра Київського Псалтиря 1397 р. Суспільне надбання"}]}, {"type": "text", "kicker": "Культура", "title": "Усна творчість", "badges": [], "paras": ["Народ складав **обрядові пісні**: колядки, щедрівки, веснянки (гаївки), весільні пісні.", "У XV – XVI ст. з’явилися **думи** й **історичні пісні**. Їх співали кобзарі, граючи на кобзі чи бандурі. Головні теми — татарський і турецький полон, втеча з неволі, подвиги козаків.", "Думи записали значно пізніше, але найдавніші з них розповідають про події XV – XVI ст. Серед них — думи про неволю: «Плач невольника», «Маруся Богуславка»."], "imgs": [{"key": "kobzars", "cap": "Кобзарі й лірники. Фото кінця XIX – початку XX ст."}]}, {"type": "defs", "title": "Архітектура", "badges": [], "items": [{"name": "Замки й фортеці", "paras": ["Через постійні війни й татарські набіги князі й королі зводили замки з каменю й цегли: у **Луцьку, Кам’янці, Хотині, Мукачеві, Меджибожі, Острозі**."], "img": null}, {"name": "Храми-фортеці", "paras": ["На Поділлі й Волині деякі церкви будували з товстими мурами й бійницями, щоб у них можна було оборонятися.", "Найвідоміша — **Покровська церква в Сутківцях** (1476)."], "img": null}, {"name": "Готика", "paras": ["У Галичині й на Західному Поділлі з’явилися готичні костели: **Латинський собор у Львові**, **костел у Дрогобичі**."], "img": null}, {"name": "Дерев’яні храми", "paras": ["Дерев’яні церкви стояли майже в кожному селі.", "Одна з найдавніших — **церква Святого Духа в Потеличі** (1502)."], "img": null}], "note": null}, {"type": "text", "kicker": "Культура", "title": "Іконопис і малярство", "badges": [], "paras": ["У Галичині склалася своя **школа іконопису**. Найдавніші збережені ікони написано в XIV ст., серед них **«Юрій Змієборець» зі Станилі**.", "Руські майстри розписували й католицькі храми. Король Ягайло запросив їх прикрасити **каплицю Святої Трійці в Любліні** (1418) — фрески у візантійському стилі вкривають стіни й склепіння.", "Ікони писали на дерев’яних дошках темперою. Майстри здебільшого лишалися безіменними.", "Одна з перших підписаних і датованих ікон — **«Успіння Богородиці»** (1547) майстра **Олексія Горошковича**."], "imgs": [{"key": "lublin", "cap": "Розписи руських майстрів у каплиці Святої Трійці в Любліні (1418). Фото: Artinpl / Wikimedia Commons, CC0"}]}]}, {"id": "s4", "num": "IV", "title": "Пам’ятки культури з програми НМТ", "sub": "13 пам’яток: замки й фортеці, храми, ікони", "cover": null, "cards": [{"type": "defs", "title": "Пам’ятки культури з програми НМТ", "badges": ["НМТ: пам’ятки"], "note": "Далі — картка кожної пам’ятки: фото й коротка розповідь.", "items": [{"name": "Замки й фортеці", "paras": ["Верхній замок у Луцьку · Кам’янець-Подільська фортеця · Хотинська фортеця · замок Паланок у Мукачеві · Генуезька фортеця в Судаку · Бахчисарайський історико-культурний заповідник"], "img": null}, {"name": "Храми", "paras": ["Вірменський собор у Львові · костел святого Варфоломія в Дрогобичі · Покровська церква-фортеця в Сутківцях · церква Зішестя Святого Духа в Потеличі"], "img": null}, {"name": "Ікони", "paras": ["«Юрій Змієборець» зі Станилі · Богородиця з пророками з Підгородців · «Успіння Богородиці» Олексія Горошковича"], "img": null}]}, {"type": "monument", "title": "Верхній замок у Луцьку (друга пол. XIV – XV ст.)", "badges": [], "img": {"key": "m_lutsk", "cap": "Верхній замок (замок Любарта)"}, "paras": ["Мурований замок почали зводити за князя **Любарта**, тому його називають **замком Любарта**.", "Замок має три вежі: **В’їзну**, **Стирову** й **Владичу**.", "У **1429 р.** тут відбувся з’їзд європейських монархів, а в **1431 р.** замок витримав облогу польського війська."]}, {"type": "monument", "title": "Кам’янець-Подільська фортеця (XIV – XVI ст.)", "badges": [], "img": {"key": "m_kamianets", "cap": "Кам’янець-Подільська фортеця"}, "paras": ["Фортеця стоїть на скелі над каньйоном річки **Смотрич** і захищає вхід до Старого міста.", "Мурований замок будували **Коріатовичі**; поляки, що володіли містом з 1430-х рр., добудовували вежі.", "Фортеця витримала чимало облог. Лише у **1672 р.** її здобуло османське військо."]}, {"type": "monument", "title": "Хотинська фортеця (XIII – XVI ст.)", "badges": [], "img": {"key": "m_khotyn", "cap": "Хотинська фортеця над Дністром"}, "paras": ["Перші укріплення над **Дністром** звели ще за часів Галицько-Волинської держави.", "Нинішню кам’яну фортецю збудували й розширили **молдавські** господарі в XV – XVI ст.", "У **1621 р.** під Хотином польсько-козацьке військо зупинило османів (тема 7)."]}, {"type": "monument", "title": "Замок Паланок у Мукачеві (XIV – XVII ст.)", "badges": [], "img": {"key": "m_palanok", "cap": "Замок Паланок на горі над Мукачевом"}, "paras": ["Замок стоїть на згаслому вулкані над Мукачевом.", "Князь **Федір Коріатович**, що отримав Мукачево в **1396 р.**, розбудував і укріпив замок.", "У XVII ст. Паланок належав князям Ракоці й став однією з найміцніших фортець Угорщини."]}, {"type": "monument", "title": "Генуезька фортеця в Судаку (XIV – XV ст.)", "badges": [], "img": {"key": "m_sudak", "cap": "Генуезька фортеця в Судаку"}, "paras": ["Фортецю на горі над морем збудували **генуезці**, коли Судак (Солдайя) став їхньою колонією.", "Фортеця має два пояси мурів з баштами, а на вершині — замок консула.", "У **1475 р.** фортецю захопили **османи**."]}, {"type": "monument", "title": "Бахчисарайський історично-культурний заповідник (XVI – XVIII ст.)", "badges": [], "img": {"key": "m_bakh", "cap": "Ханський палац у Бахчисараї"}, "paras": ["Головна пам’ятка — **Ханський палац**, резиденція кримських ханів з **1532 р.** У 1736 р. палац спалило російське військо, згодом хани його відбудували.", "До заповідника належать мечеті, мавзолеї ханів, давнє місто-фортеця **Чуфут-Кале** (Кирк-Ор).", "Палац — найвідоміша пам’ятка кримськотатарської архітектури."]}, {"type": "monument", "title": "Вірменський собор у Львові (1363)", "badges": [], "img": {"key": "armenian2", "cap": "Вірменський собор, вигляд із подвір’я. Фото: Wereskowa / Wikimedia Commons, CC BY-SA 4.0"}, "paras": ["Собор збудувала у **1363 – 1370 рр.** вірменська громада Львова. Тут була кафедра вірменського єпископа.", "Архітектор **Дорінг** поєднав вірменську традицію (купол на високому барабані) з прийомами місцевих будівничих.", "Пізніше собор кілька разів перебудовували. На подвір’ї збереглися давні надгробки й дзвіниця."]}, {"type": "monument", "title": "Костел святого Варфоломія в Дрогобичі (1392 – XV ст.)", "badges": [], "img": {"key": "m_drohobych", "cap": "Костел святого Варфоломія й дзвіниця"}, "paras": ["Будувати костел почали після **1392 р.**, коли король Ягайло заснував у Дрогобичі католицьку парафію. Основні роботи завершили в XV ст.", "Це **готичний** костел: високі стрілчасті вікна, стрімкий дах, контрфорси.", "Дзвіниця поруч була оборонною вежею міських укріплень."]}, {"type": "monument", "title": "Покровська церква-фортеця в Сутківцях (1476)", "badges": [], "img": {"key": "m_sutkivtsi", "cap": "Покровська церква в Сутківцях на Хмельниччині"}, "paras": ["Церкву збудували на **Поділлі**, де часто проходили татарські загони.", "Церква має товсті мури з **бійницями**, вузькі вікна й масивні контрфорси: у ній можна було сховатися від нападу.", "Храмів, що водночас були фортецями, збереглося небагато, і Сутківці — найвідоміший із них."]}, {"type": "monument", "title": "Церква Зішестя Святого Духа в с. Потелич (1502)", "badges": [], "img": {"key": "m_potelych", "cap": "Церква Святого Духа в Потеличі"}, "paras": ["Це одна з найдавніших **дерев’яних церков** України: її збудували у **1502 р.**", "Усередині збереглися розписи XVII ст.", "У **2013 р.** ЮНЕСКО внесла церкву до Списку всесвітньої спадщини разом з іншими дерев’яними церквами Карпатського регіону."]}, {"type": "monument", "title": "Ікона «Юрій Змієборець» із с. Станиля (XIV ст.)", "badges": [], "img": {"key": "m_stanylia", "cap": "Ікона зі Станилі. Національний музей у Львові"}, "paras": ["Ікона походить із церкви в селі **Станиля** поблизу Дрогобича. Це одна з найдавніших ікон галицької школи.", "Святий Юрій на **чорному коні** вбиває змія; червоний плащ розвівається за плечима.", "Ікона зберігається в **Національному музеї у Львові**."]}, {"type": "monument", "title": "Ікона Богородиці з пророками з с. Підгородці", "badges": [], "img": {"key": "m_pidhor", "cap": "Ікона з Підгородців. Національний музей у Львові"}, "paras": ["Ікона походить із села **Підгородці** на Львівщині.", "У центрі — **Богородиця з Дитям** (Одигітрія), на полях — **пророки** Старого Заповіту з сувоями, на яких записано їхні пророцтва про Христа.", "Ікону написали галицькі майстри за візантійською традицією. Час її створення дослідники визначають по-різному."]}, {"type": "monument", "title": "Ікона Олексія Горошковича «Успіння Богородиці» (1547)", "badges": [], "img": {"key": "m_horosh", "cap": "Ікона «Успіння Богородиці» Олексія Горошковича (1547). Національний музей у Львові"}, "paras": ["Ікона походить із церкви в селі **Смільник** (нині Польща).", "Майстер **Олексій Горошкович** підписав і датував свій твір **1547 р.**: напис видно в нижньому лівому куті ікони. Це одна з перших підписаних і датованих українських ікон.", "На іконі зображено **Успіння** — смерть Богородиці в оточенні апостолів. Над ложем стоїть Христос із її душею на руках, а вгорі ангели на хмарах несуть апостолів.", "Ікона зберігається в **Національному музеї у Львові**."]}]}, {"id": "s5", "num": "V", "title": "Підсумки всієї теми", "sub": "Дати, персоналії, поняття, пам’ятки, що часто плутають, велика стрічка часу", "cover": {"key": "medzh", "cap": ""}, "cards": [{"type": "table", "title": "Дати теми 5", "rows": [["Дата", "Подія"], ["1362 р.", "Битва біля р. Сині Води: Ольгерд розбив ординців; Київщина й Поділля перейшли до Литви"], ["1385 р.", "Кревська унія: Ягайло обіцяв охрестити Литву в католицтво й приєднати її землі до Польщі"], ["40-ві рр. XV ст.", "Утворення Кримського ханства (Хаджі-Герей)"], ["1478 р.", "Кримське ханство визнало васальну залежність від Османської імперії"], ["1489 р.", "Перша згадка про українських козаків у писемних джерелах"], ["1514 р.", "Битва біля Орші: військо К. І. Острозького розбило московське"]]}, {"type": "table", "title": "Персоналії теми 5", "rows": [["Персоналія", "Чим відомий"], ["Ольгерд", "Великий князь литовський (1345 – 1377): приєднав Київщину, Поділля, Чернігово-Сіверщину; переміг ординців на Синіх Водах"], ["Вітовт", "Великий князь литовський (1392 – 1430): ліквідував удільні князівства, зазнав поразки на Ворсклі (1399), переміг під Грюнвальдом (1410)"], ["Свидригайло", "Очолив Велике князівство Руське (1432 – 1435), спирався на руську знать; програв битву під Вількомиром (1435)"], ["Хаджі-Герей", "Засновник Кримського ханства й династії Гераїв"], ["Костянтин Іванович Острозький", "Великий гетьман литовський: переміг під Оршею (1514), опікувався православною церквою"], ["Юрій Дрогобич", "Учений, ректор університету в Болоньї; видав першу відому друковану книжку автора-українця (1483)"]]}, {"type": "table", "title": "Поняття теми 5", "rows": [["Поняття", "Значення"], ["Шляхтич", "Член привілейованого стану: мав спадкову землю, брав участь у сеймиках, мусив служити у війську"], ["Магдебурзьке право", "Право міста на самоврядування й власний суд, без втручання урядників"], ["Магістрат", "Орган міського самоврядування: рада (бурмистр) і лава (війт)"], ["Цех", "Об’єднання ремісників однієї або кількох споріднених професій, яке діяло за власним статутом"], ["Дике поле", "Незаселені степи між Дністром і Доном, де постійно ходили татарські загони"], ["Козак", "Вільна людина, вояк на степовому прикордонні; козаків уперше згадано під 1489 р."]]}, {"type": "table", "title": "Пам’ятки теми 5: де й коли", "rows": [["Пам’ятка", "Де", "Коли"], ["Верхній замок (замок Любарта)", "Луцьк", "друга пол. XIV – XV ст."], ["Кам’янець-Подільська фортеця", "Кам’янець-Подільський", "XIV – XVI ст."], ["Хотинська фортеця", "Хотин", "XIII – XVI ст."], ["Замок Па   },
  tl_periods(c) {
    const X = v => (100 * (v - c.x_from) / (c.x_to - c.x_from));
    const rows = c.rows.map(r => `<div class="row"><div class="nm">${md(r.name)}</div><div class="tr">${r.segs.map(g =>
      `<div class="sg" style="left:${X(g.a)}%;width:${Math.max(1.2, X(g.b) - X(g.a))}%;background:${g.color}"></div>`).join('')}</div>
      ${r.segs.some(g => g.sub) ? `<div class="sb">${r.segs.filter(g => g.sub).map(g => md(g.sub)).join(' · ')}</div>` : ''}</div>`).join('');
    const ev = c.events.map(([v, l]) => `<div class="evl" style="left:${X(v)}%"></div><div class="evt" style="left:${X(v)}%">${esc(String(l).replace(/ ?до н\.е\.| ?р\.$/g, ''))}</div>`).join('');
    const ax = `<div class="ax">${c.prog.map(([a, b]) => `<div class="pr" style="left:${X(a)}%;width:${X(b) - X(a)}%"></div>`).join('')}
      ${c.ticks.map(([v, l], i) => `<div class="tk${i % 2 ? ' lo' : ''}" style="left:${X(v)}%">${esc(l)}</div>`).join('')}</div>`;
    const pr = c.prog.length ? `<div class="legend"><span class="sw"></span>${c.prog.map(p => esc(p[2])).join(' · ')} — дата з програми НМТ</div>` : '';
    return `<div class="chips"><span class="chip">НМТ: дата</span></div>${h2(c.title)}<div class="gp">${ev}${rows}${ax}</div>${pr}
      ${c.note ? `<div class="muted"><p>${md(c.note)}</p></div>` : ''}`;
  },
  chrono() {
    const m = ['2000 р.<br>до н.е.', '1000 р.<br>до н.е.', '1 р. н.е.<br><b class="a2">Різдво Христове</b>', '1000 р.<br>н.е.', '2000 р.<br>н.е.'];
    return `<h2>Шкала часу</h2><div class="ends"><span>← давніше</span><span>ближче до нас →</span></div>
      <div class="scale"><div class="line"></div><div class="marks">${m.map(a => `<div class="m"><i></i><span>${a}</span></div>`).join('')}</div></div>
      <p class="cap">До н.е. рахунок іде назад: 2000 р. до н.е. давніше, ніж 1000 р. до н.е.</p>`;
  },
  periods(c) {
    const rows = c.rows.map((p, i) => `${i === 0 ? '<div class="pgroup">Кам’яний вік</div>' : i === 3 ? '<div class="pgroup">Доба металів</div>' : ''}
      <div class="per"><div class="c" style="background:${p[5]}"></div><div><h3>${p[0]}</h3>${p[1] ? `<div class="s">${p[1]}</div>` : ''}
       <div class="d">${p[2]}</div><div class="r"><span>Знаряддя:</span> ${p[3]}</div><div class="r"><span>Нове:</span> ${p[4]}</div></div></div>`).join('');
    return `${chips(c.badges)}${h2(c.title)}<p>${md(c.intro)}</p>${rows}`;
  },
  generic(c) {
    const groups = [[]];
    c.blocks.forEach(b => { if (b.k === 'sep') groups.push([]); else groups[groups.length - 1].push(b); });
    const g = groups.filter(x => x.length);
    const rb = b => b.k === 'h' ? `<h3 class="${b.light ? 'l' : ''}">${md(b.text)}</h3>` : b.k === 'date' ? `<span class="pill">${md(b.text)}</span>`
      : b.k === 'img' ? fig(b) : b.k === 'muted' ? `<div class="muted">${(b.paras || []).map(p => `<p>${md(p)}</p>`).join('')}</div>` : paras(b.paras);
    const body = g.map(x => {
      const asPanel = g.length > 1 && x.some(b => b.k === 'h' || b.k === 'date');
      return asPanel ? `<div class="sub">${x.map(rb).join('')}</div>` : x.map(rb).join('');
    }).join('');
    return `${chips(c.badges)}${h2(c.title)}${body}`;
  },
};

/* ---------- навігація ---------- */
const P = id => LESSONS.find(l => l.id === id);
function secProgress(L, s) { const seen = store.get(`seen_${L.id}-${s.id}`, []).length; return Math.min(seen, s.cards.length); }
function partProgress(L) { let a = 0, b = 0; L.sections.forEach(s => { a += secProgress(L, s); b += s.cards.length; }); return [a, b]; }

function index() {
  document.title = TITLE;
  const L0 = LESSONS[0];
  /* тема «лише уроки» в спільній оболонці: посилання назад на полицю тем (у повному курсі його додає course.js) */
  const back = typeof SHELL_URL === 'string' && SHELL_URL && typeof LESSONS_ONLY !== 'undefined' && LESSONS_ONLY ? SHELL_URL : '';
  app.innerHTML = `<div class="wrap">${back ? `<a class="lnk tback" href="${back}">← Усі теми</a>` : ''}
    <div class="hero"><img src="${im(L0.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L0.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(TITLE)}</h1>
      <div class="sub">Мобільна версія презентацій: ${PARTS_WORD}, кожна поділена на короткі розділи.</div></div>
    <div class="h2">Частини</div><div class="sec-list">${LESSONS.map(L => {
      const [a, b] = partProgress(L);
      return `<button class="part-btn" data-go="${L.id}"><span class="th"><img src="${im(L.cover.key).src}" alt=""></span>
        <span><h3>${esc(L.part)}</h3><div class="st">${a ? `Переглянуто ${a} з ${b} карток` : `${L.sections.length} розділів`}</div>
        <div class="prog-mini"><i style="width:${Math.round(100 * a / b)}%"></i></div></span></button>`; }).join('')}</div>
    <p class="cap" style="margin-top:18px">Прогрес зберігається лише на цьому пристрої.${back ? ' Бліци й тести з цієї теми з’являться згодом.' : ''}</p>${brandHtml()}</div>`;
  wireGo(); window.scrollTo(0, 0);
}

function partHome(L) {
  document.title = `${L.part} — ${TITLE}`;
  const i = LESSONS.indexOf(L), next = LESSONS[i + 1];
  const secs = L.sections.map(s => {
    const seen = secProgress(L, s), n = s.cards.length, done = seen >= n;
    return `<button class="sec-btn${done ? ' done' : ''}" data-go="${L.id}-${s.id}"><span class="num">${done ? '✓' : s.num}</span>
      <span><h3>${md(s.title)}</h3><div class="st">${seen ? `Переглянуто <b>${seen} з ${n}</b>` : `${n} карток`}</div>
      <div class="prog-mini"><i style="width:${Math.round(100 * seen / n)}%"></i></div></span></button>`;
  }).join('');
  const nextBtn = next ? `<button class="btn" data-go="${next.id}" style="margin-top:20px">Далі: ${esc(next.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:20px" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>
       <p class="cap">Посилання працює, якщо файли лежать в одній папці.</p>` : '');
  app.innerHTML = `${MODE === 'all' ? `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${L.num}</span></div></div>` : ''}
  <div class="wrap">
    <div class="hero"><img src="${im(L.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(L.title)}</h1>
      <div class="part">${esc(L.part)}</div><div class="sub">${esc(L.sub)}</div></div>
    <div class="h2">Розділи</div><div class="sec-list">${secs}</div>
    ${L.program ? `<div class="h2">Що треба знати для НМТ</div><section class="card">${R.generic({ ...L.program, title: '' })}</section>` : ''}
    ${nextBtn}
  </div>`;
  wireGo(); window.scrollTo(0, 0);
}

let obs = null;
function section(L, s) {
  document.title = `${s.num}. ${s.title} — ${TITLE}`;
  const k = L.sections.indexOf(s), next = L.sections[k + 1], nextPart = LESSONS[LESSONS.indexOf(L) + 1];
  const cards = s.cards.map((c, i) => `<section class="card" data-i="${i}">${(R[c.type] || R.generic)(c, i)}</section>`).join('');
  let end = next ? `<button class="btn" data-go="${L.id}-${next.id}">Далі: розділ ${next.num}. ${esc(next.title)} →</button>`
    : nextPart ? `<button class="btn" data-go="${nextPart.id}">Далі: ${esc(nextPart.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>` : '');
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="${L.id}">← Розділи</button><span class="ttl">${s.num}. ${md(s.title)}</span></div><div class="prog"><i id="pr"></i></div></div>
  <div class="wrap">
    ${s.cover && s.cover.key ? `<div class="hero">${fig(s.cover)}</div>` : ''}
    <div class="sec-head"><div class="kick">Частина ${L.num} · розділ ${s.num}</div><h1>${md(s.title)}</h1><div class="sub">${md(s.sub)}</div></div>
    <div class="cards">${cards}</div>
    <div class="end">${end}<button class="btn ghost" data-go="${L.id}">До розділів</button></div>
  </div>`;
  wireGo();
  s.cards.forEach((c, i) => {
    if (c.type === 'carousel' && c.items.length > 1) {
      const car = document.getElementById('car' + i), dots = document.getElementById('dots' + i).children;
      car.addEventListener('scroll', () => {
        const kk = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 12));
        [...dots].forEach((d, j) => d.classList.toggle('on', j === kk));
      }, { passive: true });
    }
    if (c.type === 'map' && c.steps.length > 1) {
      const st = document.getElementById('st' + i), mp = document.getElementById('mp' + i);
      st.querySelectorAll('button').forEach(b => b.onclick = () => {
        st.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
        mp.innerHTML = fig({ key: c.steps[+b.dataset.i].key, cap: c.cap || '' });
      });
    }
  });
  const key = `seen_${L.id}-${s.id}`, seen = new Set(store.get(key, []));
  if (obs) obs.disconnect();
  obs = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { seen.add(+e.target.dataset.i); store.set(key, [...seen]); } });
  }, { threshold: 0.35 }) : null;
  if (obs) app.querySelectorAll('.card').forEach(el => obs.observe(el));
  window.scrollTo(0, 0);
}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;
}, { passive: false });
lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const pr = document.getElementById('pr'); if (!pr) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  pr.style.width = (max > 0 ? Math.min(100, 100 * scrollY / max) : 100) + '%';
}, { passive: true });
route();
</script>
</body>
</html>

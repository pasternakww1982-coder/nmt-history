<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Україна в умовах десталінізації (1953 – 1964)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* єдина темна тема, як у презентаціях: вугільне тло, помаранчевий акцент */
  --bg: #161616;
  --panel: #232323;
  --panel2: #2e2e2e;
  --acc: #e97132;
  --acc2: #f5a25d;
  --txt: #f2f2f2;
  --muted: #a8a39e;
  --ok: #5fb878;
  --bad: #e0604a;
  --font: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  /* макет: одна колонка до 560 px, вертикальна стрічка карток */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
b.a { color: var(--acc); font-weight: 700; }
b.a2 { color: var(--acc2); font-weight: 700; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
img { max-width: 100%; display: block; }

/* ---------- верхня панель ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.bar .back { background: var(--panel2); color: var(--acc2); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.bar .ttl { font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 4px; background: #2a2a2a; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .15s; }

/* ---------- головна ---------- */
.hero { margin: 0 -16px; background: #0f0f0f; }
.hero img { width: 100%; height: auto; }
.hero-cap, .cap { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.hero-cap { padding: 6px 16px 0; }
.kick { color: var(--acc); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.home-head { padding: 20px 0 8px; display: grid; gap: 8px; }
.home-head h1 { font-size: 32px; font-weight: 800; }
.home-head .part { color: var(--acc2); font-weight: 700; font-size: 19px; }
.home-head .sub { color: var(--muted); }
.proto { margin: 14px 0 4px; padding: 10px 14px; border: 1px dashed #4a4a4a; border-radius: 12px; color: var(--muted); font-size: 14px; }
.h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; }
.sec-list { display: grid; gap: 12px; }
.sec-btn { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 14px; cursor: pointer; }
.sec-btn .num { width: 56px; height: 56px; border-radius: 14px; background: var(--panel2); color: var(--acc); font-size: 22px; font-weight: 800; display: grid; place-items: center; }
.sec-btn.done .num { background: var(--acc); color: #161616; }
.sec-btn h3 { font-size: 18px; font-weight: 700; }
.sec-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sec-btn .st b { color: var(--acc2); }
.sec-btn.soon { opacity: .45; cursor: default; }
.prog-mini { height: 4px; background: #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.prog-mini i { display: block; height: 100%; background: var(--acc); }
.prg { display: grid; gap: 10px; }
.prg .box { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.prg h3 { color: var(--acc); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.prg ul { margin: 0; padding-left: 18px; font-size: 15.5px; }

/* ---------- розділ ---------- */
.sec-head { padding: 18px 0 6px; display: grid; gap: 8px; }
.sec-head h1 { font-size: 28px; font-weight: 800; }
.sec-head .sub { color: var(--muted); }
.cards { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border-radius: 18px; padding: 18px 16px; display: grid; gap: 12px; }
.card h2 { font-size: 22px; font-weight: 800; }
.card .date { color: var(--acc2); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.card .txt { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--acc); color: #161616; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.tip { background: var(--panel2); border-left: 4px solid var(--acc2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.tip .lbl { color: var(--acc2); font-weight: 700; font-size: 14px; }
.fig { margin: 0; display: grid; gap: 6px; }
.fig .pic { background: #0f0f0f; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; display: grid; place-items: center; }
.fig .pic img { width: auto; height: auto; max-width: 100%; max-height: 62vh; }
.fig .pic.boxed { height: 180px; }
.fig .pic.boxed img { width: auto; height: auto; max-width: 100%; max-height: 100%; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карусель */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .it { flex: 0 0 84%; scroll-snap-align: center; background: var(--panel2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.car .it .pic { height: 210px; }
.car .it h3 { font-size: 18px; font-weight: 700; color: var(--acc2); }
.car .it .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #161616; font-size: 14px; font-weight: 800; margin-right: 6px; }
.car .it p { font-size: 15.5px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #4a4a4a; }
.dots i.on { background: var(--acc); }
.swipe { color: var(--muted); font-size: 13.5px; text-align: center; }

/* визначення */
.defs { display: grid; gap: 14px; }
.def { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.def:first-child { border-top: 0; padding-top: 0; }
.def h3 { font-size: 19px; color: var(--acc2); }

/* хронологія */
.scale { position: relative; padding: 34px 4px 8px; }
.scale .line { position: absolute; left: 4px; right: 4px; top: 48px; height: 3px; background: var(--txt); border-radius: 2px; }
.scale .marks { position: relative; display: flex; justify-content: space-between; }
.scale .m { display: grid; justify-items: center; gap: 6px; width: 20%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.scale .m i { width: 13px; height: 13px; border-radius: 50%; background: var(--acc); margin-top: 8px; }
.scale .m .up { position: absolute; top: 0; color: var(--acc2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.scale .m { position: relative; }

/* періоди */
.pgroup { color: var(--acc2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.per { display: grid; grid-template-columns: 8px 1fr; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 12px 12px 12px 0; overflow: hidden; }
.per .c { border-radius: 0 6px 6px 0; }
.per h3 { font-size: 18px; }
.per .s { color: var(--muted); font-size: 14px; }
.per .d { color: var(--acc2); font-weight: 700; font-size: 15px; margin: 4px 0; }
.per .r { font-size: 15px; }
.per .r span { color: var(--muted); }

/* карта */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { background: var(--panel2); color: var(--txt); border: 0; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
.steps button.on { background: var(--acc); color: #161616; }
.rot { color: var(--muted); font-size: 13.5px; }

/* пам'ятка */
.mon .pic { cursor: zoom-in; }
.how { background: var(--acc); color: #161616; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.how .lbl { font-weight: 800; display: block; font-size: 14px; }

/* самоперевірка */
.quiz h2 { display: flex; gap: 10px; align-items: center; }
.qq { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid #333; }
.qq:first-of-type { border-top: 0; padding-top: 0; }
.qq .q { font-weight: 700; }
.qq .qn { color: var(--acc2); margin-right: 4px; }
.opt { text-align: left; width: 100%; background: var(--panel2); color: var(--txt); border: 2px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 16px; cursor: pointer; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: #203826; }
.opt.wrong { border-color: var(--bad); background: #3a221d; }
.why { font-size: 15px; color: #ddd; background: #1b1b1b; border-radius: 10px; padding: 10px 12px; }
.score { background: var(--panel2); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 8px; }
.score .big { font-size: 28px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); color: #161616; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--acc2); }
.end { display: grid; gap: 10px; margin-top: 20px; }

/* перегляд зображення */
.lb { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-top { display: flex; gap: 8px; padding: 10px; justify-content: flex-end; }
.lb-top button { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; min-width: 44px; height: 40px; font-size: 18px; font-weight: 700; cursor: pointer; }
.lb-view { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.lb-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; will-change: transform; }
.pic { touch-action: pan-x pan-y; }   /* щипок на зображенні не збільшує всю сторінку — відкриває перегляд */
.lb-cap { color: #ccc; font-size: 13.5px; padding: 8px 14px 14px; }


.brand { margin: 28px 0 6px; text-align: center; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }

/* «← Усі теми» — повернення на полицю тем спільної оболонки */
.tback { display: inline-block; margin: 14px 0 0; font-weight: 700; font-size: 15px; color: var(--acc2); text-decoration: underline; }

/* ---------- нові типи карток ---------- */
.chip.off { background: #5a5a5a; color: #f2f2f2; }
.chip.doc { background: var(--acc2); }
.sub { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.sub h3 { font-size: 18px; color: var(--acc); }
.sub h3.l { color: var(--acc2); }
.pill { justify-self: start; background: var(--acc2); color: #161616; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.muted { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.quote { background: var(--panel2); border-left: 4px solid var(--acc); border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-style: italic; font-size: 17.5px; }
.quote .src { font-style: normal; color: var(--acc2); font-size: 14px; }
.scheme { background: var(--panel2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: center; }
.scheme .h { color: var(--acc); font-weight: 800; }
.scheme .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scheme .two div { background: var(--acc); color: #161616; border-radius: 12px; padding: 10px; font-size: 14px; }
.scheme .two b { display: block; font-size: 17px; }
.trow { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.trow h3 { color: var(--acc2); font-size: 18px; }
.trow .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px; font-size: 15.5px; }
.trow .kv span { color: var(--muted); }
/* стрічка подій */
.tlv { display: grid; gap: 0; position: relative; padding-left: 26px; }
.tlv::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; background: var(--txt); border-radius: 2px; }
.tlv .ev { position: relative; padding: 0 0 16px; display: grid; gap: 3px; }
.tlv .ev i { position: absolute; left: -25px; top: 4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--bg); }
.tlv .ev .y { color: var(--acc2); font-weight: 800; font-variant-numeric: tabular-nums; }
.tlv .ev .y.yprog { justify-self: start; background: var(--acc2); color: #161616; border-radius: 8px; padding: 1px 8px; }
.tlv .ev b { font-size: 17px; }
.legend { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.legend span.sw { width: 34px; height: 16px; background: var(--acc2); border-radius: 6px; }
/* стрічка періодів */
.gp { position: relative; display: grid; gap: 10px; padding-top: 26px; }
.gp .row { display: grid; gap: 3px; position: relative; z-index: 1; }
.gp .nm { font-weight: 700; font-size: 15px; }
.gp .tr { position: relative; height: 18px; background: #262626; border-radius: 6px; }
.gp .sg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gp .sb { font-size: 13px; color: var(--muted); }
.gp .evl { position: absolute; top: 18px; bottom: 34px; border-left: 2px dashed var(--acc2); z-index: 0; pointer-events: none; }
.gp .evt { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--acc2); white-space: nowrap; }
.gp .ax { position: relative; height: 34px; border-top: 3px solid var(--txt); margin-top: 4px; }
.gp .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.gp .tk.lo { padding-top: 17px; }
.gp .pr { position: absolute; top: -6px; height: 9px; background: var(--acc2); border-radius: 4px; }
.prg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.part-btn { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); color: var(--txt); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; }
.part-btn .th { width: 96px; height: 96px; border-radius: 12px; background: #0f0f0f; display: grid; place-items: center; overflow: hidden; }
.part-btn .th img { max-width: 100%; max-height: 100%; }
.part-btn h3 { font-size: 18px; }
.part-btn .st { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ends { display: flex; justify-content: space-between; color: var(--acc2); font-weight: 700; font-size: 14px; }
.scale { padding-top: 6px; }
.scale .line { top: 19px; }
.scale .m b { font-size: 11.5px; }

.gp .nm, .gp .sb { justify-self: start; background: var(--panel); padding-right: 6px; position: relative; z-index: 1; }
.gp .tr { z-index: 1; }

.fsb { position: fixed; right: 12px; bottom: 14px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(46,46,46,.92); color: var(--acc2); font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.fsb[hidden] { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<button id="fsb" class="fsb" hidden aria-label="На весь екран">⤢</button>
<div class="lb" id="lb" role="dialog" aria-label="Перегляд зображення">
  <div class="lb-top"><button id="lbOut" aria-label="Зменшити">−</button><button id="lbIn" aria-label="Збільшити">+</button><button id="lbX" aria-label="Закрити">✕</button></div>
  <div class="lb-view" id="lbv"><img id="lbi" alt=""></div>
  <div class="lb-cap" id="lbc"></div>
</div>
<script>
const LESSONS = [{"id": "p1", "num": 1, "title": "Україна в умовах десталінізації (1953 – 1964)", "part": "Частина 1. Десталінізація і реформи", "sub": "Боротьба за владу після Сталіна, повстання в таборах, Крим у складі УРСР, XX з’їзд, раднаргоспи, цілина, хрущовки, усунення Хрущова", "cover": {"key": "s001_image1", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Україна в умовах десталінізації»", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **1953 – 1954 рр.** — повстання політичних в’язнів у сталінських концтаборах, ліквідація ГУТАБу", "• **лютий 1954 р.** — входження Кримської області до складу УРСР", "• **1956 р.** — XX з’їзд КПРС, засудження культу особи", "• **1959 р.** — Українська робітничо-селянська спілка; клуб «Сучасник» у Києві (частина 2)"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **«десталінізація», «культ особи», «лібералізація», «політична реабілітація», «відлига», «раднаргосп»**", "• у частині 2: **«шістдесятники», «дисиденти»**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії й пам’ятка — у частині 2", "light": false}, {"k": "p", "paras": ["• портрети треба впізнавати: **Л. Лук’яненко, В. Стус, В. Симоненко**", "• також: І. Світличний, А. Горська, Л. Костенко, Є. Сверстюк, Л. Танюк, С. Корольов, К. Білокур", "• картина К. Білокур **«Хата в Богданівці»** (1955)"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Картосхема й уміння", "light": false}, {"k": "p", "paras": ["• **зміни в адміністративно-територіальному устрої України**", "• пояснювати причини й наслідки входження Криму до складу УРСР", "• характеризувати десталінізацію й реформи управління економікою"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 28 «Україна в умовах десталінізації»."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Після Сталіна: боротьба за владу (1953 – 1957)", "sub": "Смерть «вождя», «колективне керівництво», перемога Хрущова, нові керівники УРСР", "cover": {"key": "stalin_funeral", "cap": ""}, "cards": [{"type": "tl_events", "title": "Стрічка часу: десталінізація і реформи (1953 – 1964)", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "5.03.1953", "name": "Смерть Сталіна", "desc": "«колективне керівництво»", "color": "#a6a6a6", "prog": false}, {"year": "1953 – 1954", "name": "Повстання в таборах", "desc": "Норильськ, Воркута, Кенгір", "color": "#e05a47", "prog": true}, {"year": "19.02.1954", "name": "Крим — до складу УРСР", "desc": "указ Президії ВР СРСР", "color": "#e97132", "prog": true}, {"year": "лютий 1956", "name": "XX з’їзд КПРС", "desc": "доповідь про культ особи", "color": "#e97132", "prog": true}, {"year": "1957", "name": "Раднаргоспи", "desc": "управління промисловістю за регіонами", "color": "#9cc6de", "prog": false}, {"year": "жовтень 1961", "name": "XXII з’їзд КПРС", "desc": "тіло Сталіна винесли з Мавзолею", "color": "#b48ae0", "prog": false}, {"year": "червень 1962", "name": "Подорожчання", "desc": "м’ясо й масло; розстріл у Новочеркаську", "color": "#a6a6a6", "prog": false}, {"year": "14.10.1964", "name": "Усунення Хрущова", "desc": "пленум ЦК КПРС", "color": "#b48ae0", "prog": false}]}, {"type": "text", "kicker": "Боротьба за владу", "title": "Смерть Сталіна і «колективне керівництво»", "badges": [], "paras": ["**5 березня 1953 р.** помер **Йосип Сталін**, який майже 30 років одноосібно керував СРСР. Наступника він не призначив, тому владу поділили між собою його найближчі соратники.", "**Георгій Маленков** очолив уряд — Раду Міністрів СРСР. **Лаврентій Берія** став міністром внутрішніх справ: йому підпорядковувалися міліція й органи держбезпеки. **Микита Хрущов** керував апаратом ЦК КПРС, а у вересні 1953 р. його обрали **першим секретарем ЦК КПРС**.", "Таке правління назвали **«колективним керівництвом»**, але кожен із трьох хотів стати першим. Боротьба між ними тривала кілька років.", "Усі троє розуміли, що жити, як за Сталіна, країна далі не може: табори переповнені, села зубожіли, люди бояться арештів. Тому вже навесні 1953 р. почалися перші зміни."], "imgs": [{"key": "s002_image3", "cap": "Георгій Маленков, голова Ради Міністрів СРСР у 1953 – 1955 рр."}, {"key": "s002_image2", "cap": "Микита Хрущов"}, {"key": "s002_image4", "cap": "Лаврентій Берія"}]}, {"type": "cols", "title": "Як Хрущов переміг суперників (1953 – 1957)", "badges": [], "intro": null, "blocks": [{"h": "Як усували суперників", "paras": ["**26 червня 1953 р.** Хрущов і Маленков за допомогою військових заарештували **Берію** під час засідання в Кремлі. Його боялися всі: він керував міліцією й держбезпекою. У грудні 1953 р. Берію розстріляли.", "У **лютому 1955 р.** за наполяганням Хрущова **Маленков** мусив піти з посади голови уряду.", "У **червні 1957 р.** більшість Президії ЦК на чолі з **Молотовим, Маленковим і Кагановичем** проголосувала за відставку Хрущова. Але він скликав пленум ЦК, і члени ЦК його підтримали."]}, {"h": "Чому переміг Хрущов", "paras": ["Хрущов керував партійним апаратом і призначив на керівні посади в Москві й областях своїх прихильників.", "Його підтримали військові: у 1957 р. міністр оборони **Георгій Жуков** військовими літаками доправив на пленум членів ЦК з усієї країни.", "Пленум назвав суперників Хрущова **«антипартійною групою»** й вивів їх із керівництва. Їх не заарештували й не розстріляли, а з КПРС виключили лише в 1961 – 1962 рр."]}]}, {"type": "defs", "title": "Хто керував Україною: перші секретарі ЦК КПУ", "badges": [], "items": [{"name": "Олексій Кириченко", "paras": ["**1953 – 1957 рр.** У червні 1953 р. замінив Леоніда Мельникова, якого звинуватили в насадженні російської мови в західних областях.", "Перший після 1920-х рр. **українець** на цій посаді. Хрущов, який у 1938 – 1949 рр. сам очолював компартію України, висував людей, з якими тоді працював."], "img": {"key": "kyrychenko", "cap": "Олексій Кириченко. Фото: TASS / distributed by Associated Press / Wikimedia Commons, Public domain"}}, {"name": "Микола Підгорний", "paras": ["**1957 – 1963 рр.** Керував КПУ, коли запровадили раднаргоспи й республіка отримала більше прав в економіці.", "У 1963 р. Хрущов перевів його до Москви на посаду секретаря ЦК КПРС."], "img": {"key": "podgorny", "cap": "Микола Підгорний, 1973 р. Фото: Kari Hakli / Wikimedia Commons, CC BY 4.0"}}, {"name": "Петро Шелест", "paras": ["**1963 – 1972 рр.** Захищав економічні інтереси УРСР і підтримував українську мову в межах дозволеного.", "У 1972 р. його усунули й звинуватили в «націоналізмі» (тема «застій»)."], "img": {"key": "s023_image40", "cap": "Петро Шелест."}}], "note": null}]}, {"id": "s2", "num": "II", "title": "Перші кроки десталінізації (1953 – 1955)", "sub": "Амністія, політична реабілітація, повстання в таборах ГУЛАГу", "cover": {"key": "s003_image5", "cap": ""}, "cards": [{"type": "text", "kicker": "Перші кроки", "title": "Десталінізація. Амністія 1953 р.", "badges": ["НМТ: поняття"], "paras": ["**Десталінізація** — відмова влади від найжорстокіших методів сталінського правління: масових репресій, свавілля органів держбезпеки, величезної системи таборів ГУЛАГу й **культу особи** Сталіна.", "Десталінізація мала межі. Однопартійна диктатура, планова економіка й цензура залишилися. Нові керівники засуджували злочини Сталіна, але не саму радянську систему.", "**27 березня 1953 р.** Президія Верховної Ради СРСР оголосила **амністію** — звільнення від покарання. На волю вийшли близько **1,2 млн** осіб, засуджених на строк до 5 років, а також літні люди, хворі, вагітні жінки й матері малих дітей. Політичних в’язнів, які мали строки по 10 – 25 років, вона майже не стосувалася.", "Серед звільнених було багато кримінальних злочинців, і в містах зросла злочинність. У 1953 – 1955 рр. з місць ув’язнення до міст і сіл УРСР повернулися понад **330 тис.** осіб."], "imgs": [{"key": "amnesty53", "cap": "Указ «Про амністію» в газеті «Правда», 28 березня 1953 р. Фото: ЦК КПСС / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Перші кроки", "title": "Політична реабілітація", "badges": ["НМТ: поняття"], "paras": ["**Політична реабілітація** — відновлення доброго імені й прав людини, яку несправедливо засудили з політичних мотивів. Суд скасовував вирок і визнавав людину невинною, навіть якщо її вже розстріляли.", "Тим, хто вижив, повертали свободу, членство в партії, іноді житло й роботу. Родичі отримували **довідку про реабілітацію** — часто це був перший офіційний документ про те, що їхніх рідних засудили безпідставно.", "У 1953 – 1955 рр. реабілітували передусім відомих партійців і військових. Навесні 1954 р. створили комісії для перегляду справ політв’язнів, а в 1956 р. спеціальні комісії поїхали просто в табори й звільняли людей на місці.", "У **вересні 1955 р.** амністували тих, кого засудили за співпрацю з окупантами в роки війни. Але учасників **ОУН і УПА** влада й далі вважала «ворогами» і не реабілітувала."], "imgs": [{"key": "reab_dovidka", "cap": "Довідка військового трибуналу, грудень 1956 р.: вироки 1934 і 1938 рр. скасовано, справу припинено «за відсутністю складу злочину». Фото: невідомий автор / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Перші кроки", "title": "Повстання в таборах ГУЛАГу (1953 – 1954)", "badges": ["НМТ: дата"], "paras": ["Після смерті Сталіна в’язні **особливих таборів** чекали звільнення. Але амністія їх не стосувалася, а режим не змінився: виснажлива праця, номери на одязі, два листи на рік, постріли охорони за найменшу провину.", "Влітку **1953 р.** спалахнули повстання в **Норильську** (травень – серпень) і **Воркуті** (липень – серпень), у **травні – червні 1954 р.** — у **Кенгірі** (Казахстан). В’язні не виходили на роботу, обирали комітети й вимагали, щоб до них приїхала комісія з Москви.", "Значну частину повсталих становили українці — передусім вояки УПА й члени ОУН, засуджені на 10 – 25 років. Одним з керівників Норильського повстання був **Євген Грицяк**.", "Війська придушили повстання, а в Кенгірі проти в’язнів кинули танки. Загалом під час придушення повстань загинули сотні людей."], "imgs": [{"key": "vl_ch_kengir", "cap": "Національний склад в’язнів Кенгірського табору. Власна діаграма за даними дослідників."}]}, {"type": "map", "title": "Повстання в таборах ГУЛАГу (1953 – 1954)", "steps": [{"key": "vl_gulag", "label": "Крок 1"}]}, {"type": "text", "kicker": "Перші кроки", "title": "Чого домагалися повсталі й чого досягли", "badges": ["НМТ: дата"], "paras": ["__Вимоги в’язнів:__ переглянути справи й скоротити 25-річні строки; зняти номери з одягу й ґрати з вікон бараків; запровадити 8-годинний робочий день і платити за працю; дозволити листування й побачення з рідними; покарати охоронців, які стріляли у в’язнів.", "Повстання жорстоко придушили, а їхніх керівників судили. Але влада зрозуміла, що стара табірна система не працює. Режим пом’якшили: зняли номери, дозволили листування, почали платити за працю.", "Комісії масово переглядали справи в’язнів, кількість таборів зменшувалася. У 1956 р. ГУЛАГ реорганізували, а в **1960 р.** ліквідували.", "У програмі НМТ ГУЛАГ названо **ГУТАБ** (Головне управління таборів), а його ліквідацію пов’язано з повстаннями 1953 – 1954 рр.: саме вони започаткували демонтаж табірної системи."], "imgs": [{"key": "vl_ch_vorkuta", "cap": "Загиблі під час придушення Воркутинського повстання. Власна діаграма за офіційними даними."}, {"key": "norilsk_mem", "cap": "Меморіал «Норильська Голгофа» на місці табірного кладовища. Фото: Uosnorilsk / Wikimedia Commons, CC BY-SA 4.0"}]}]}, {"id": "s3", "num": "III", "title": "Крим у складі УРСР", "sub": "Чому Кримську область передали Україні. Нові й ліквідовані області УРСР", "cover": {"key": "s006_image8", "cap": ""}, "cards": [{"type": "text", "kicker": "Крим", "title": "Чому Кримську область передали УРСР", "badges": ["НМТ: дата"], "paras": ["У **травні 1944 р.** радянська влада виселила з Криму всіх **кримських татар** — близько 190 тис. осіб, а згодом також греків, болгар і вірмен. Села спорожніли, сади й виноградники занепадали.", "На місце депортованих влада привезла переселенців — переважно з Росії, згодом і з України. Люди з центральних областей Росії не вміли господарювати в посушливому степу й у горах. Урожаї зменшувалися, і багато переселенців поверталися додому.", "Крим залежав від материка: прісна вода, електроенергія, хліб і промислові товари надходили з України. Єдиний сухопутний шлях на півострів пролягав через Україну.", "**19 лютого 1954 р.** Президія Верховної Ради СРСР видала указ про передачу **Кримської області зі складу РРФСР до складу УРСР**. **26 квітня 1954 р.** це рішення затвердила Верховна Рада СРСР і змінила Конституцію СРСР."], "imgs": [{"key": "stamp1954", "cap": "Поштова марка СРСР 1954 р. до 300-річчя Переяславської ради («возз’єднання України з Росією»). Радянська пропаганда пов’язувала передачу Криму з цією річницею. Фото: Post of USSR / Wikimedia Commons, Public domain"}]}, {"type": "doc", "title": "Указ про передачу Кримської області", "quote": ["«Ураховуючи спільність економіки, територіальну близькість і тісні господарські та культурні зв’язки між Кримською областю та Українською РСР, Президія Верховної Ради Союзу Радянських Соціалістичних Республік постановляє:", "Затвердити спільне подання Президії Верховної Ради РРФСР і Президії Верховної Ради УРСР про передачу Кримської області зі складу Російської Радянської Федеративної Соціалістичної Республіки до складу Української Радянської Соціалістичної Республіки»."], "source": "Указ Президії Верховної Ради СРСР, 19 лютого 1954 р. Переклад, повний текст", "comment": ["Указ підписали голова Президії Верховної Ради СРСР **Климент Ворошилов** і секретар **Микола Пєгов**. Передачу оформили за законами СРСР: спершу її схвалили президії обох республік, потім — союзна Президія.", "Після 1954 р. Україна вкладала в Крим великі кошти. У 1961 р. почали будувати **Північнокримський канал** від Каховського водосховища; першу чергу відкрили 1963 р.", "__Слова з документа:__ **подання** — офіційна пропозиція; **Президія Верховної Ради** — постійний орган, що ухвалював укази між сесіями парламенту."], "img": null}, {"type": "text", "kicker": "Крим", "title": "Населення Криму за переписами 1939 – 1989 рр.", "badges": [], "paras": ["Перепис **1939 р.** засвідчив, що кримські татари становили п’яту частину населення півострова.", "Перепис **1959 р.** не зафіксував у Криму кримських татар як окрему групу: після депортації 1944 р. влада заборонила їм повертатися.", "Частка українців після 1954 р. поступово зростала, але більшість населення Криму становили росіяни.", "Кримські татари почали масово повертатися на батьківщину лише наприкінці 1980-х рр. У 1989 р. Верховна Рада СРСР визнала депортацію незаконною і злочинною."], "imgs": [{"key": "chart_1_18", "cap": "Дані всесоюзних переписів населення 1939, 1959, 1979, 1989 рр."}]}, {"type": "map", "title": "Зміни адміністративно-територіального устрою УРСР", "steps": [{"key": "vl_admin1", "label": "1954 р."}, {"key": "vl_admin2", "label": "1954 – 1962 рр."}]}, {"type": "defs", "title": "Зміни адміністративно-територіального устрою УРСР", "badges": ["НМТ: карта"], "items": [{"name": "1954 р.", "paras": ["**7 січня** — утворено **Черкаську область** з частин Київської, Кіровоградської, Полтавської й Вінницької.", "**15 лютого** — **Ізмаїльську область** приєднали до Одеської.", "**19 лютого** — до УРСР передали **Кримську область**."], "img": null}, {"name": "1959 р.", "paras": ["**21 травня** — **Дрогобицьку область** приєднали до Львівської.", "Відтоді кількість і межі областей УРСР майже не змінювалися. У 1991 р. Кримська область стала **Автономною Республікою Крим**."], "img": null}, {"name": "Нові назви", "paras": ["1954 — Кам’янець-Подільська → **Хмельницька**", "1958 — Ворошиловградська → **Луганська**", "1961 — Сталінська → **Донецька**", "1962 — Станіславська → **Івано-Франківська**"], "img": null}], "note": "Після 1954 р. УРСР отримала ті кордони, у яких Україна 1991 р. стала незалежною державою."}]}, {"id": "s4", "num": "IV", "title": "XX з’їзд КПРС і лібералізація", "sub": "Доповідь про культ особи, реабілітація, XXII з’їзд, межі відлиги", "cover": {"key": "s019_image33", "cap": ""}, "cards": [{"type": "text", "kicker": "XX з’їзд КПРС", "title": "Доповідь «Про культ особи та його наслідки» (1956)", "badges": ["НМТ: дата", "НМТ: поняття"], "paras": ["**XX з’їзд КПРС** відбувся в Москві **14 – 25 лютого 1956 р.** В останній день, **25 лютого**, на закритому засіданні, без іноземних гостей і журналістів, Хрущов виголосив доповідь **«Про культ особи та його наслідки»**.", "**Культ особи** — безмежне звеличення одного керівника: йому приписують усі успіхи, його рішення вважають безпомилковими, його портрети й пам’ятники стоять усюди.", "Хрущов розповів, що Сталін знищив тисячі відданих партії комуністів, дозволяв катувати заарештованих, виселяв цілі народи й припустився тяжких помилок на початку війни з Німеччиною.", "У газетах доповідь не надрукували. Її читали на закритих партійних і комсомольських зборах по всій країні, тож про неї швидко дізналися мільйони людей. Повністю в СРСР її опублікували лише 1989 р."], "imgs": [{"key": "s017_image25", "cap": "Брошура з текстом доповіді, яку розсилали партійним організаціям, 1956 р."}, {"key": "stamp_xx", "cap": "Поштова марка СРСР «XX з’їзд КПРС», 1956 р. Фото: Post of USSR / Wikimedia Commons, Public domain"}]}, {"type": "cols", "title": "Про що Хрущов сказав, а про що змовчав", "badges": [], "intro": "Хрущов засуджував не радянську систему, а лише «перекручення», яких припустився Сталін. Тому про багато злочинів у доповіді не сказано.", "blocks": [{"h": "Що засудили", "paras": ["• культ особи Сталіна", "• репресії проти членів партії й військових, «великий терор» 1937 – 1938 рр.", "• катування під час слідства", "• депортації чеченців, інгушів, калмиків, карачаївців і балкарців", "• помилки Сталіна на початку німецько-радянської війни"]}, {"h": "Про що змовчали", "paras": ["• колективізацію й «розкуркулення»", "• **Голодомор 1932 – 1933 рр.**", "• репресії проти української інтелігенції", "• депортації кримських татар і німців, виселення українців із західних областей", "• участь у репресіях самих делегатів: Хрущов у 1938 – 1949 рр. очолював компартію України"]}]}, {"type": "doc", "title": "Доповідь Хрущова: уривок", "quote": ["«Культ особи набув таких жахливих розмірів головним чином тому, що сам Сталін усіляко підтримував звеличення своєї персони…", "Масові виселення з рідних місць цілих народів… Українці уникли цієї долі лише тому, що їх надто багато і нікуди було вислати. А то він би й їх виселив»."], "source": "Доповідь М. Хрущова, 25 лютого 1956 р. Переклад-переказ, скорочено", "comment": ["Хрущов перекладав відповідальність за злочини на Сталіна й Берію. Але багато хто з присутніх у залі, зокрема й сам Хрущов, брав участь у репресіях і підписував списки людей для арешту.", "Слова про українців показують, як Хрущов пояснював депортації: не провиною народів, а свавіллям Сталіна.", "__Слова з документа:__ **персона** — особа; **виселення** — примусове переселення, депортація."], "img": null}, {"type": "carousel", "title": "Культ особи Сталіна: джерела доби", "badges": ["НМТ: поняття"], "note": null, "items": [{"key": "s020_image34", "name": "", "desc": "Плакат «Під проводом великого Сталіна — вперед до комунізму!»", "cap": ""}, {"key": "s021_image36", "name": "", "desc": "Плакат «Спасибі рідному Сталіну за щасливе дитинство!»", "cap": ""}, {"key": "s021_image38", "name": "", "desc": "Плакат «Працювати так, щоб товариш Сталін спасибі сказав!»", "cap": ""}, {"key": "s018_image27", "name": "", "desc": "Сталін серед піонерів. Картина доби культу особи.", "cap": ""}, {"key": "s021_image35", "name": "", "desc": "Плакат «Найкращому другові дітей — великому Сталіну слава!»", "cap": ""}, {"key": "s019_image30", "name": "", "desc": "Поштова марка СРСР зі станцією метро «Сталінська».", "cap": ""}]}, {"type": "text", "kicker": "XX з’їзд КПРС", "title": "Наслідки XX з’їзду", "badges": [], "paras": ["За Сталіна портрет «вождя» висів у кожній школі й установі, його ім’ям називали міста, заводи, станції метро. Після з’їзду портрети й пам’ятники почали знімати. Комісії масово переглядали справи засуджених. У 1956 – 1959 рр. з таборів і заслання повернулися сотні тисяч людей, багатьох реабілітували, часто посмертно.", "Колишнім учасникам ОУН і УПА, яких звільнили, часто забороняли повертатися в західні області УРСР. Кримським татарам не дозволили повернутися до Криму.", "Цензура стала м’якшою: з’явилися нові журнали й книжки, письменники почали писати про буденне життя людей. СРСР став відкритішим для іноземців: у 1957 р. в Москві відбувся Всесвітній фестиваль молоді й студентів.", "У **жовтні 1961 р.** на **XXII з’їзді КПРС** Хрущов знову засудив Сталіна. У ніч на **1 листопада** тіло Сталіна винесли з Мавзолею й поховали біля Кремлівської стіни. Міста й заводи перейменували: **Сталіно** стало **Донецьком**, Сталінград — Волгоградом."], "imgs": [{"key": "s022_image39", "cap": "Західноєвропейська карикатура 1961 р. на винесення тіла Сталіна з Мавзолею. Підпис німецькою: «Цап-відбувайло…»"}]}, {"type": "defs", "title": "Лібералізація і відлига", "badges": ["НМТ: поняття"], "items": [{"name": "Лібералізація", "paras": ["Послаблення контролю держави над життям людей: менше репресій і цензури, більше свободи у творчості, побуті, спілкуванні.", "За Хрущова лібералізація була **обмеженою**: що дозволено, вирішувала влада."], "img": null}, {"name": "Відлига", "paras": ["Неофіційна назва доби **1953 – 1964 рр.**, коли режим став м’якшим після сталінських «морозів».", "Назва походить від повісті Іллі Еренбурга «Відлига» (1954)."], "img": null}, {"name": "Межі відлиги", "paras": ["КПРС і далі була єдиною партією, а цензура залишилася.", "У 1956 р. радянські війська придушили повстання в Угорщині, а в 1962 р. в Новочеркаську розстріляли робітників."], "img": null}], "note": "**Десталінізація** — відмова від сталінських методів і культу Сталіна; **лібералізація** — ширше послаблення контролю в усіх сферах; **відлига** — назва самої доби."}]}, {"id": "s5", "num": "V", "title": "Реформи в економіці", "sub": "Раднаргоспи, промисловість, село, цілина, кукурудза", "cover": {"key": "s025_image41", "cap": ""}, "cards": [{"type": "text", "kicker": "Економіка", "title": "Зміни в управлінні господарством. Раднаргоспи", "badges": ["НМТ: поняття"], "paras": ["У 1953 – 1956 рр. союзний уряд передав під управління УРСР близько **10 тис.** підприємств. Частка промисловості, якою керувала республіка, зросла з **30 до 70 %**.", "У **1957 р.** Хрущов вирішив, що промисловістю мають керувати не московські міністерства, а органи в регіонах. Більшість галузевих міністерств ліквідували, а замість них створили **ради народного господарства — раднаргоспи**.", "**Раднаргосп** — орган, який керував усіма заводами й будівництвом свого економічного району (однієї чи кількох областей). Раднаргоспи діяли в **1957 – 1965 рр.**", "В УРСР спершу утворили **11 раднаргоспів**. Республіка отримала більше прав, але плани, як і раніше, складав **Держплан СРСР** у Москві."], "imgs": [{"key": "s026_image42", "cap": "Радянська карикатура на початок роботи раднаргоспів."}]}, {"type": "defs", "title": "Як змінилося управління заводом", "badges": ["НМТ: поняття"], "note": "Спершу між заводом і Москвою стало менше ланок. Але згодом над раднаргоспами створили нові органи, і управління знову ускладнилося. Схема спрощена.", "items": [{"name": "До 1957 р.", "paras": ["Держплан СРСР → Рада Міністрів СРСР → Рада Міністрів УРСР → Міністерство харчової промисловості УРСР → **Київський овочеконсервний завод**"], "img": null}, {"name": "1957 р.", "paras": ["Держплан СРСР → Рада Міністрів УРСР → Київський раднаргосп → **Київський овочеконсервний завод**"], "img": null}, {"name": "1963 р.", "paras": ["Держплан СРСР → Раднаргосп СРСР → Раднаргосп УРСР → Київський раднаргосп → **Київський овочеконсервний завод**"], "img": null}]}, {"type": "map", "title": "Раднаргоспи в УРСР", "steps": [{"key": "vl_rnh1957", "label": "1957 р."}, {"key": "vl_rnh1960", "label": "1960 р."}, {"key": "vl_rnh1962", "label": "1962 р."}]}, {"type": "cols", "title": "Що дали раднаргоспи", "badges": [], "intro": null, "blocks": [{"h": "Що вдалося", "paras": ["• Управлінців стало менше, а рішення ухвалювали ближче до заводів.", "• УРСР і місцеві керівники отримали більше влади над економікою.", "• Сусідні заводи різних галузей почали співпрацювати, місцеві ресурси використовували ощадливіше.", "• Заводи стали випускати більше побутових товарів."]}, {"h": "Що не вдалося", "paras": ["• Кожен раднаргосп дбав передусім про свій район, а не про всю країну. Це назвали **«місництвом»**.", "• Зв’язки між заводами різних районів порушувалися: деталі з іншої області було важко отримати.", "• Кількість і межі раднаргоспів постійно змінювали (11 → 14 → 7), над ними створювали нові органи.", "• У 1965 р., уже після Хрущова, уряд ліквідував раднаргоспи й відновив міністерства."]}]}, {"type": "text", "kicker": "Економіка", "title": "Промисловість і будівництво", "badges": [], "paras": ["На Дніпрі збудували великі гідроелектростанції: **Каховську** (1956) і **Кременчуцьку** (1959 – 1960). Водосховища затопили десятки сіл, їхніх мешканців переселили.", "Хрущов оголосив курс на **«хімізацію»**: будували заводи мінеральних добрив, пластмас, штучного волокна.", "Розвивалося машинобудування. У Києві випускали літаки **Олега Антонова** (Ан-10, Ан-24), у Дніпропетровську — ракети конструкторського бюро **Михайла Янгеля**. **6 листопада 1960 р.** відкрили першу лінію **київського метро**.", "Як і раніше, найбільше грошей держава витрачала на важку промисловість і військове виробництво. Одягу, взуття, меблів і продуктів людям бракувало."], "imgs": [{"key": "kakhovka_weld", "cap": "Зварниця Раїса Молдован на будівництві Каховської ГЕС, 1950-ті рр. Фото: Vsevolod Tarasevich / Wikimedia Commons, CC BY 4.0"}, {"key": "an24", "cap": "Літак Ан-24 конструкторського бюро О. Антонова (Київ), серійно випускали з 1962 р. Фото: SDASM Archives / Wikimedia Commons, No restrictions"}]}, {"type": "text", "kicker": "Економіка", "title": "Село: від послаблень до нових обмежень", "badges": [], "paras": ["У **1953 р.** держава підвищила **закупівельні ціни** на зерно, м’ясо й молоко, списала борги колгоспів і зменшила податок із присадибних ділянок. Колгоспникам стали платити **аванс** протягом року, а не лише після збору врожаю.", "У **1958 р.** ліквідували **машинно-тракторні станції (МТС)**, а їхню техніку колгоспи мусили викупити. Через це багато колгоспів заборгували державі. Дрібні колгоспи влада **укрупнювала** — об’єднувала у великі.", "Наприкінці 1950-х Хрущов вирішив, що присадибні господарства заважають будувати комунізм. Присадибні ділянки зменшили, у **1959 р.** заборонили тримати худобу в містах і селищах, а колгоспників змушували продавати корів колгоспам.", "У **1963 р.** через неврожай СРСР уперше масово закупив зерно за кордоном — у Канаді, США, Австралії."], "imgs": [{"key": "s007_image10", "cap": "Трудова книжка колгоспника із записом трудоднів за 1948 – 1960 рр."}]}, {"type": "text", "kicker": "Економіка", "title": "Освоєння цілини (з 1954 р.)", "badges": [], "paras": ["У **1954 р.** почали розорювати **цілинні й перелогові землі** в степах Казахстану, Сибіру, Уралу й Поволжя. Так керівництво СРСР хотіло швидко збільшити збір зерна.", "На цілину їхала переважно молодь за **комсомольськими путівками**. З УРСР до 1956 р. туди виїхали близько **80 тис.** осіб; республіка відправляла також техніку й посівне зерно.", "Перші врожаї були рекордні: у **1956 р.** СРСР зібрав найбільше зерна за всю свою історію до того часу.", "Але степ розорали, не подбавши про захист ґрунту від вітру. На початку 1960-х пилові бурі знесли родючий шар ґрунту на величезних площах, і врожаї зменшилися."], "imgs": [{"key": "s010_image15", "cap": "Плакат «На цілину!», 1954 р."}, {"key": "s010_image13", "cap": "Проводи добровольців на цілинні землі."}, {"key": "s011_image16", "cap": "Комсомольська путівка на збирання врожаю на цілинних землях, 1956 р."}, {"key": "s011_image18", "cap": "Комбайн на цілинному полі."}]}, {"type": "map", "title": "Освоєння цілинних земель (з 1954 р.)", "steps": [{"key": "vl_cilyna", "label": "Крок 1"}]}, {"type": "text", "kicker": "Економіка", "title": "Збір зерна в СРСР (1953 – 1964)", "badges": [], "paras": ["Після початку освоєння цілини збір зерна швидко зріс: у **1956 р.** країна зібрала **125 млн т** — у півтора раза більше, ніж 1953 р.", "Але врожаї сильно коливалися: усе залежало від погоди в степу. У посушливі роки цілина давала мало зерна.", "У **1963 р.** збір упав до **107,5 млн т**. У містах з’явилися черги за хлібом, і СРСР уперше масово закупив зерно за кордоном.", "Отже, цілина збільшила збір зерна, але не зробила постачання хліба надійним."], "imgs": [{"key": "chart_1_37", "cap": "Валовий збір зерна, млн т. Джерело: статистичні щорічники «Народное хозяйство СССР»."}]}, {"type": "defs", "title": "Екстенсивний та інтенсивний шлях розвитку", "badges": [], "items": [{"name": "Екстенсивний шлях", "paras": ["Виробляють більше за рахунок **нових ресурсів**: нових земель, робітників, заводів.", "Приклад: **освоєння цілини** — зерна більше, бо більше ріллі.", "Коли вільні землі й робочі руки закінчуються, зростання зупиняється."], "img": null}, {"name": "Інтенсивний шлях", "paras": ["Виробляють більше з **тих самих ресурсів**: кращі добрива, техніка, сорти, організація праці.", "Приклад: вищий урожай з **одного гектара**.", "Потрібні наука, нові технології й зацікавленість працівників у результаті."], "img": null}], "note": "Радянська економіка розвивалася переважно **екстенсивно**, і цілина — найяскравіший приклад цього."}, {"type": "text", "kicker": "Економіка", "title": "Кукурудзяна кампанія (1955 – 1964)", "badges": [], "paras": ["Хрущов вважав, що **кукурудза** дасть достатньо кормів для худоби, а отже, у країні побільшає м’яса й молока. Її називали «царицею полів».", "Посіви кукурудзи в СРСР за 1953 – 1962 рр. збільшили майже вдесятеро. Її сіяли навіть там, де вона не могла визріти: на півночі й у Сибіру.", "Хімічна промисловість не встигала виробляти добрива, машинобудування — комбайни для кукурудзи, а сховищ для силосу не вистачало.", "В Україні кукурудза росла добре, але її посіви витісняли інші культури. Загалом кормів від цієї кампанії не стало набагато більше, а Хрущова прозвали «кукурудзяником»."], "imgs": [{"key": "s035_image47", "cap": "Хрущов з качаном кукурудзи."}]}, {"type": "carousel", "title": "Кукурудза на плакатах доби", "badges": [], "note": "Плакати пояснювали прямо: більше кукурудзи — більше кормів, а отже більше м’яса й молока.", "items": [{"key": "s036_image48", "name": "", "desc": "«Кукурудзу не дарма ми так цінуємо високо: кукурудза — це м’ясо, сало, масло, молоко»", "cap": ""}, {"key": "s036_image49", "name": "", "desc": "«Де кукурудзу з любов’ю ростять — там великий приріст поросят!»", "cap": ""}, {"key": "s036_image50", "name": "", "desc": "«Тато, мама, кукурудза і я»", "cap": ""}, {"key": "s036_image51", "name": "", "desc": "«Молодь, на кукурудзяний фронт!»", "cap": ""}]}, {"type": "text", "kicker": "Економіка", "title": "«Наздогнати й перегнати Америку»", "badges": [], "paras": ["У **травні 1957 р.** Хрущов закликав за кілька років **наздогнати США** за виробництвом м’яса, молока й масла на душу населення.", "Щоб звітувати про успіхи, місцеві керівники забивали молодняк і навіть племінну худобу, скуповували м’ясо в магазинах і здавали його державі як вироблене в колгоспах. Худоби в країні поменшало.", "Найвідоміший приклад — Рязанська область: у 1959 р. вона здала державі втричі більше м’яса, ніж передбачав план, а наступного року не виконала й половини плану.", "**1 червня 1962 р.** держава підвищила ціни на **м’ясо** на 30 % і на **масло** на 25 %. У Києві, Дніпропетровську, Донецьку з’явилися листівки із закликами протестувати."], "imgs": [{"key": "s038_image52", "cap": "Плакат «У мирному змаганні доженемо США!»"}, {"key": "s038_image53", "cap": "Гасло на фермі: «Доженемо США з виробництва молока й м’яса»."}]}]}, {"id": "s6", "num": "VI", "title": "Соціальна політика й повсякдення", "sub": "Пенсії, робочий день, хрущовки, побутова техніка, грошова реформа", "cover": {"key": "kyiv_fortepan", "cap": ""}, "cards": [{"type": "defs", "title": "Що змінилося в житті людей", "badges": [], "items": [{"name": "Праця", "paras": ["У 1956 – 1960 рр. робітників і службовців перевели на **7-годинний** робочий день, у суботу й перед святами працювали менше.", "Робітникам дозволили звільнятися за власним бажанням. Раніше тих, хто самовільно залишав роботу, судили."], "img": null}, {"name": "Пенсії й допомога", "paras": ["У **1956 р.** ухвалили закон про **державні пенсії**: пенсії значно підвищили.", "Відпустку у зв’язку з вагітністю й пологами збільшили до **112 днів**.", "Колгоспники отримали право на пенсію лише за законом **1964 р.**"], "img": null}, {"name": "Освіта", "paras": ["У **1956 р.** скасували плату за навчання в старших класах і вишах, яку запровадили 1940 р.", "Про шкільну реформу 1958 р. — у частині 2."], "img": null}], "note": "Ці зміни помітно полегшили життя людей. Але на них потрібні були великі кошти, а економіка росла дедалі повільніше."}, {"type": "text", "kicker": "Соціальна політика", "title": "Хрущовки: масове житлове будівництво", "badges": [], "paras": ["Після війни мільйони людей жили в бараках, підвалах і **комунальних квартирах**, де кілька родин мали спільну кухню й ванну.", "**31 липня 1957 р.** ЦК КПРС і уряд ухвалили постанову про розвиток житлового будівництва. Почали зводити п’ятиповерхові будинки з готових бетонних панелей. Їх назвали **«хрущовками»**.", "Квартири були маленькі: тісна кухня, низькі стелі, суміщений санвузол; ліфтів у будинках не було. Але вперше мільйони родин отримали від держави окреме житло."], "imgs": [{"key": "s041_image56", "cap": "Будівництво кварталу п’ятиповерхових будинків, кінець 1950-х рр."}, {"key": "s041_image54", "cap": "Плакат «Будувати швидко, дешево, добре!»"}, {"key": "s041_image55", "cap": "Квартал п’ятиповерхових хрущовок, сучасне фото з висоти."}]}, {"type": "text", "kicker": "Соціальна політика", "title": "Побут: нові речі в квартирах", "badges": [], "paras": ["Наприкінці 1950-х рр. заводи почали масово випускати побутову техніку: холодильники, пральні машини, телевізори, радіоприймачі, магнітофони.", "Телевізор поступово ставав звичною річчю в міських квартирах. Перший в Україні телецентр запрацював у Києві ще 1951 р.", "Купити техніку було непросто. Вона коштувала кілька місячних зарплат, а в магазинах її бракувало. Люди записувалися в черги й чекали місяцями.", "У селах побут змінювався повільніше: багато сіл УРСР електрифікували лише в 1960-х рр."], "imgs": [{"key": "s042_image58", "cap": "Холодильник 1950-х рр."}, {"key": "s042_image59", "cap": "Телевізор 1950-х рр."}, {"key": "s042_image57", "cap": "Магнітофон, 1960-ті рр."}, {"key": "s042_image60", "cap": "Покупці оглядають пральну машину."}]}, {"type": "text", "kicker": "Соціальна політика", "title": "Гроші: облігації і реформа 1961 р.", "badges": [], "paras": ["За Сталіна людей щороку змушували купувати **облігації державних позик**: частину зарплати віддавали державі в борг.", "У **квітні 1957 р.** держава оголосила, що відкладає виплати за цими облігаціями на **20 років**. Мільйони людей утратили надію швидко повернути свої гроші.", "**1 січня 1961 р.** уряд розпочав **грошову реформу**: старі гроші обміняли на нові в співвідношенні **10 : 1**, ціни й зарплати теж зменшили вдесятеро. Але деякі дешеві товари після реформи подорожчали."], "imgs": [{"key": "s043_image61", "cap": "Новорічна карикатура 1961 р.: «У добрий час!» — новий карбованець вітає новий рік."}, {"key": "s043_image68", "cap": "100 карбованців зразка 1961 р."}, {"key": "s043_image62", "cap": "1 карбованець зразка 1961 р."}]}]}, {"id": "s7", "num": "VII", "title": "Криза й усунення Хрущова (1962 – 1964)", "sub": "Подорожчання, Новочеркаськ, неврожай 1963 р., жовтневий пленум 1964 р.", "cover": {"key": "s016_image24", "cap": ""}, "cards": [{"type": "text", "kicker": "Криза", "title": "Невдоволення 1962 – 1963 рр. Новочеркаськ", "badges": [], "paras": ["На початку 1960-х економіка зростала повільніше, у магазинах бракувало м’яса, масла, а згодом і хліба.", "Після подорожчання **1 червня 1962 р.** у місті **Новочеркаську** (РРФСР) застрайкували робітники електровозобудівного заводу. **2 червня** колону мітингувальників зустріли солдати й відкрили вогонь. Загинули **26** людей, а згодом сімох учасників розстріляли за вироком суду.", "Влада приховувала ці події аж до кінця 1980-х рр.", "У **1963 р.** після неврожаю в містах з’явилися черги за хлібом, його продавали за нормою. Уряд закупив за кордоном близько **12 млн т** зерна."], "imgs": [{"key": "novoch", "cap": "Мітингувальники в Новочеркаську, 1 червня 1962 р. Справжнє фото: приховане знімання КДБ. Фото: KGB / Wikimedia Commons, Public domain"}, {"key": "s066_image93", "cap": "Солдати стримують мітингувальників. Реконструкція подій: кадр із художнього фільму."}, {"key": "s066_image94", "cap": "Гасла мітингувальників 1962 р. Реконструкція подій: кадр із художнього фільму."}]}, {"type": "text", "kicker": "Криза", "title": "Усунення Хрущова (жовтень 1964 р.)", "badges": [], "paras": ["Партійна верхівка була невдоволена Хрущовим: він постійно перебудовував органи влади, у **1962 р.** поділив обкоми партії на «промислові» й «сільські», ухвалював важливі рішення сам.", "**14 жовтня 1964 р.** пленум ЦК КПРС звільнив Хрущова з усіх посад, офіційно — «за станом здоров’я». Усунення готували, зокрема, його висуванці **Леонід Брежнєв** і **Микола Підгорний**.", "Першим секретарем ЦК КПРС став **Леонід Брежнєв**, головою уряду — **Олексій Косигін**. Хрущова відправили на пенсію; він помер 1971 р.", "Усунутого керівника не заарештували й не розстріляли, як Берію в 1953 р. Це теж наслідок відлиги.", "Надгробок Хрущову 1975 р. створив скульптор **Ернст Неізвєстний** — один із тих митців, яких Хрущов вилаяв на виставці в Манежі 1962 р. Білий і чорний камінь нагадують про суперечливість цього політика."], "imgs": [{"key": "khr_tomb", "cap": "Надгробок Микити Хрущова на Новодівичому кладовищі в Москві. Скульптор Ернст Неізвєстний, 1975 р. Фото: Sergey A. Demidov / Wikimedia Commons, CC BY 4.0"}, {"key": "s005_image7", "cap": "Леонід Брежнєв вручає Хрущову нагороду (імовірно, квітень 1964 р.). За пів року Брежнєв посів його місце."}]}]}, {"id": "s8", "num": "VIII", "title": "Узагальнення", "sub": "Етапи десталінізації · що часто плутають на НМТ · стрічка часу", "cover": {"key": "s043_image64", "cap": ""}, "cards": [{"type": "table", "title": "Етапи десталінізації і реформ", "rows": [["Етап", "Події", "Що змінилося"], ["1953 – 1955", "смерть Сталіна, арешт Берії, амністія, повстання в таборах, Крим — до складу УРСР, цілина", "перші звільнення, «колективне керівництво», послаблення для села"], ["1956 – 1958", "XX з’їзд КПРС, раднаргоспи, хрущовки, перемога Хрущова над «антипартійною групою», ліквідація МТС", "масова реабілітація, лібералізація, більше прав УРСР в економіці"], ["1959 – 1964", "XXII з’їзд КПРС, грошова реформа, подорожчання, Новочеркаськ, неврожай 1963 р.", "криза реформ, утиски інтелігенції (частина 2), усунення Хрущова"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "Крим", "paras": ["**19 лютого 1954 р.** — указ Президії ВР СРСР (лютий 1954 р. — дата з програми).", "**26 квітня 1954 р.** — закон Верховної Ради СРСР."], "img": null}, {"name": "З’їзди", "paras": ["**XX з’їзд (1956)** — доповідь про культ особи.", "**XXII з’їзд (1961)** — тіло Сталіна винесли з Мавзолею."], "img": null}, {"name": "Раднаргосп", "paras": ["Орган управління промисловістю економічного району (**1957 – 1965**).", "Це **не** колгосп і **не** сільрада."], "img": null}, {"name": "Повстання", "paras": ["**Норильськ, Воркута** — 1953 р., **Кенгір** (Казахстан) — 1954 р.", "**ГУТАБ** у програмі НМТ — те саме, що **ГУЛАГ**."], "img": null}], "note": null}, {"type": "tl_periods", "title": "Стрічка часу: хто керував і що відбувалося (1953 – 1965)", "note": "Кириченко, Підгорний, Шелест — перші секретарі ЦК КПУ. З жовтня 1964 р. КПРС очолив Леонід Брежнєв.", "x_from": 1952, "x_to": 1966, "ticks": [[1953, "1953"], [1955, "1955"], [1957, "1957"], [1959, "1959"], [1961, "1961"], [1963, "1963"], [1965, "1965"]], "events": [[1954.13, "Крим"], [1956.15, "XX з’їзд"], [1961.8, "XXII з’їзд"]], "prog": [], "rows": [{"name": "Керівник КПРС", "segs": [{"a": 1953.2, "b": 1964.8, "color": "#e97132", "sub": "Микита Хрущов"}, {"a": 1964.8, "b": 1966, "color": "#a6a6a6", "sub": ""}]}, {"name": "Керівник КПУ", "segs": [{"a": 1953.45, "b": 1957.95, "color": "#d9b26f", "sub": "Кириченко"}, {"a": 1957.95, "b": 1963.5, "color": "#e07f36", "sub": "Підгорний"}, {"a": 1963.5, "b": 1966, "color": "#c9824f", "sub": "Шелест"}]}, {"name": "Табори", "segs": [{"a": 1953.4, "b": 1954.5, "color": "#e05a47", "sub": "повстання"}]}, {"name": "Цілина", "segs": [{"a": 1954.0, "b": 1960.0, "color": "#a9dda0", "sub": "освоєння цілини"}]}, {"name": "Кукурудза", "segs": [{"a": 1955.0, "b": 1964.8, "color": "#8ccf84", "sub": "кукурудзяна кампанія"}]}, {"name": "Раднаргоспи", "segs": [{"a": 1957.4, "b": 1965.8, "color": "#9cc6de", "sub": "раднаргоспи"}]}]}]}]}, {"id": "p2", "num": 2, "title": "Україна в умовах десталінізації (1953 – 1964)", "part": "Частина 2. Шістдесятники, дисиденти, культура", "sub": "Підпілля й УРСС, шістдесятники й «Сучасник», Биківня, арешти 1965 р., освіта, наука, мистецтво, церква", "cover": {"key": "horska_shevchenko", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Україна в умовах десталінізації»", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **1959 р.** — утворення Української робітничо-селянської спілки", "• **1959 р.** — утворення Клубу творчої молоді «Сучасник» у м. Київ", "• у частині 1: **1953 – 1954 рр.**, **лютий 1954 р.**, **1956 р.**"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• **«шістдесятники», «дисиденти»**", "• у частині 1: «десталінізація», «культ особи», «лібералізація», «політична реабілітація», «відлига», «раднаргосп»"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії", "light": false}, {"k": "p", "paras": ["• портрети треба впізнавати: **Левко Лук’яненко, Василь Стус, Василь Симоненко**", "• Катерина Білокур, Іван Світличний, Алла Горська, Ліна Костенко, Євген Сверстюк, Лесь Танюк, Сергій Корольов"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятка й уміння", "light": false}, {"k": "p", "paras": ["• картина Катерини Білокур **«Хата в Богданівці»** (1955)", "• характеризувати антирежимний рух і його течії, особливості розвитку культури", "• визначати причини виникнення й значення антирежимного руху"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 28 «Україна в умовах десталінізації»."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Опір режиму: підпілля й перші дисиденти", "sub": "Повернення в’язнів, підпільні групи, Українська робітничо-селянська спілка", "cover": {"key": "s047_image74", "cap": ""}, "cards": [{"type": "tl_events", "title": "Стрічка часу: опір і культура (1956 – 1965)", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "лютий 1956", "name": "XX з’їзд КПРС", "desc": "засудження культу особи", "color": "#e97132", "prog": true}, {"year": "1958 – 1959", "name": "Шкільна реформа", "desc": "батьки обирають мову навчання", "color": "#9cc6de", "prog": false}, {"year": "1959", "name": "УРСС", "desc": "Лук’яненко, Кандиба, Вірун", "color": "#e05a47", "prog": true}, {"year": "1959", "name": "Клуб «Сучасник»", "desc": "клуб творчої молоді в Києві", "color": "#a9dda0", "prog": true}, {"year": "січень 1961", "name": "Арешт членів УРСС", "desc": "суд у Львові", "color": "#a6a6a6", "prog": false}, {"year": "1962", "name": "Биківня", "desc": "Симоненко, Горська, Танюк", "color": "#b48ae0", "prog": false}, {"year": "1964", "name": "Знищення вітража", "desc": "Київський університет", "color": "#a6a6a6", "prog": false}, {"year": "4.09.1965", "name": "«Тіні забутих предків»", "desc": "протест у кінотеатрі «Україна»", "color": "#e97132", "prog": false}]}, {"type": "text", "kicker": "Опір режиму", "title": "Після УПА: опір наприкінці 1950-х рр.", "badges": [], "paras": ["Збройне підпілля **ОУН** і загони **УПА** радянська влада знищила на початку 1950-х рр. Окремі повстанці переховувалися ще кілька років.", "Після амністій 1955 – 1956 рр. до західних областей повернулися **десятки тисяч** колишніх вояків УПА, членів ОУН і депортованих. Багато хто з них не змирився з радянською владою.", "Наприкінці 1950-х — на початку 1960-х рр. виникали невеликі **підпільні групи**: **Український національний комітет** у Львові, **Об’єднана партія визволення України**, згодом **Український національний фронт**. Їхні учасники писали й поширювали листівки, збирали заборонену літературу.", "КДБ швидко викривав такі групи. Їхніх учасників судили за **«антирадянську агітацію»** й засуджували до тривалого ув’язнення, а декого — до розстрілу."], "imgs": [{"key": "s045_image70", "cap": "Із доповідної записки КДБ про становище в західних областях, кінець 1950-х рр. (мова оригіналу)."}]}, {"type": "doc", "title": "Донесення КДБ про антирадянські групи", "quote": ["«Управлінням КДБ по Запорізькій області припинено ворожу діяльність антирадянської групи в місті Мелітополі, що складалася з 13 осіб і яка в 1960 – 1961 рр. сім разів поширювала антирадянські листівки, виготовлені за допомогою саморобних кліше.", "У місті Черкаси виявлено антирадянську групу з трьох осіб, які поширили в лютому – березні цього року понад 900 листівок…", "На території Кримської області встановлено антирадянську групу під назвою «Вільна Таврія», що складалася з 10 учнів 8 – 9 класів і виготовила та поширила понад 100 антирадянських листівок»."], "source": "Доповідна записка КДБ УРСР, початок 1960-х рр. Переклад, скорочено", "comment": ["Групи виникали не лише на заході України: документ називає Мелітополь, Черкаси, Крим.", "У групі «Вільна Таврія» були **школярі 8 – 9 класів** — ровесники тих, хто сьогодні вивчає цю тему.", "__Слова з документа:__ **кліше** — форма для друку; **антирадянська агітація** — так влада називала будь-яку критику радянського ладу, за неї судили."], "img": null}, {"type": "text", "kicker": "Опір режиму", "title": "Дисиденти", "badges": ["НМТ: поняття"], "paras": ["**Дисиденти** (від латинського dissidens — незгодний) — люди, які відкрито не погоджувалися з офіційною ідеологією й політикою влади. Влада переслідувала їх: звільняла з роботи, виключала з вишів, арештовувала.", "Українські дисиденти виступали за **права людини**, вільний розвиток **української мови й культури**, а частина з них — за право України на **власну державу**.", "На відміну від підпілля ОУН, дисиденти не мали зброї й не закликали до збройної боротьби. Вони посилалися на **Конституцію СРСР**, яка на папері гарантувала свободу слова і право республік на вихід із Союзу.", "Дисидентський рух в Україні мав кілька **течій**: національно-визвольну, правозахисну й релігійну. Він зародився наприкінці 1950-х — на початку 1960-х рр."], "imgs": [{"key": "kgb1965", "cap": "Донесення КДБ УРСР до ЦК КПУ про протест у кінотеатрі «Україна», 8 вересня 1965 р. Фото: Qypchak / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Опір режиму", "title": "Українська робітничо-селянська спілка (1959 – 1961)", "badges": ["НМТ: дата"], "paras": ["У **1959 р.** юрист **Левко Лук’яненко**, який працював у Глинянах на Львівщині, разом зі **Степаном Віруном**, **Іваном Кандибою** й іншими однодумцями заснував підпільну **Українську робітничо-селянську спілку (УРСС)**.", "Лук’яненко написав проєкт програми. Спілка хотіла домогтися **виходу УРСР зі складу СРСР** мирним шляхом — через **референдум**, як дозволяла Конституція СРСР. Учасники вважали себе прихильниками марксизму й соціалізму.", "У спілці було близько **десяти** осіб. На початку **1961 р.** КДБ заарештував усіх учасників. У травні 1961 р. Львівський обласний суд засудив Лук’яненка до **розстрілу**, згодом вирок замінили на **15 років** ув’язнення. Інших учасників засудили до 7 – 15 років ув’язнення.", "УРСС стала першою після розгрому ОУН і УПА організацією, яка домагалася незалежності України законними засобами."], "imgs": [{"key": "s069_image95", "cap": "Левко Лук’яненко."}]}, {"type": "doc", "title": "Програма УРСС і слідство", "quote": ["«Ми боремося за самостійну Україну… Методи досягнення цієї мети — мирні, конституційні…", "Перший етап цього періоду боротьби — боротьба за демократичні свободи, за політичні права. Другим етапом нашої боротьби буде боротьба за вихід України з Союзу і утворення самостійної держави…", "УРСС розцінює сучасне економічне і політичне становище України як колоніальне»."], "source": "Проєкт програми Української робітничо-селянської спілки, 1959 р. (скорочено)", "comment": ["На допиті Лук’яненко заявив, що агітація за вихід УРСР із СРСР не злочин: **стаття 17 Конституції СРСР** проголошувала право союзної республіки на вихід зі складу СРСР.", "Слідчий КДБ, піднявши Конституцію над головою, відповів: «Конституція існує для закордону».", "__Слова з документа:__ **колоніальне становище** — коли країною керують ззовні й використовують її багатства в чужих інтересах."], "img": null}, {"type": "text", "kicker": "Персоналія", "title": "Левко Лук’яненко (1928 – 2018)", "badges": ["НМТ: персоналія", "портрет"], "paras": ["Народився на Чернігівщині в селянській родині. Закінчив юридичний факультет Московського університету й працював юристом на Львівщині.", "У **1959 р.** заснував **Українську робітничо-селянську спілку**. У 1961 р. його засудили до розстрілу. Він провів 72 дні в камері смертників, після чого вирок замінили на 15 років ув’язнення.", "Після звільнення **1976 р.** став одним із засновників **Української Гельсінської групи**. У грудні 1977 р. його знову заарештували, а 1978 р. засудили до 10 років таборів і 5 років заслання. Загалом в ув’язненні й на засланні він провів понад чверть століття.", "У 1988 р. очолив Українську Гельсінську спілку, у 1990 р. — **Українську республіканську партію**. Написав текст **Акта проголошення незалежності України** (1991). Був народним депутатом і послом України в Канаді.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "luk_cc0", "cap": "Левко Лук’яненко в роки незалежності. Фото: A1 / Wikimedia Commons, CC0"}]}]}, {"id": "s2", "num": "II", "title": "Шістдесятники", "sub": "Нове покоління інтелігенції, клуб «Сучасник», Биківня", "cover": {"key": "shist_fdc", "cap": ""}, "cards": [{"type": "text", "kicker": "Шістдесятники", "title": "Хто такі шістдесятники", "badges": ["НМТ: поняття"], "paras": ["**Шістдесятники** — покоління молодої інтелігенції, яке прийшло в культуру наприкінці 1950-х — у 1960-х рр., за доби відлиги. Серед них були поети, письменники, критики, художники, режисери, науковці.", "Вони виросли за Сталіна, а після XX з’їзду зрозуміли, що влада роками казала неправду. Шістдесятники хотіли писати й малювати вільно, поза канонами **соціалістичного реалізму**, — про життя й почуття людини, а не про виробничі успіхи.", "Вони досліджували заборонені теми історії й культури України, повертали читачам імена й твори репресованих митців, захищали **українську мову** від русифікації.", "Спершу шістдесятники не висували політичних вимог. Але коли влада почала їх переслідувати, багато хто з них став **дисидентом**."], "imgs": [{"key": "horska_mother", "cap": "Алла Горська. «Мати з дитиною», 1962 р. WikiArt"}]}, {"type": "doc", "title": "Чому вони не змовчали", "quote": ["«…То було молоде покоління, яке пішло в університети, яке могло вже подумати про щось інше, а не тільки про елементарні умови існування… Чорновіл, наприклад, був редактором комсомольської загальноукраїнської газети. Дзюба був одним із найважливіших критиків у Спілці письменників України. Стус був аспірантом в Інституті літератури в Києві.", "Одним словом, люди на найвищих щаблях, які в комуністичному істеблішменті могли далеко піти… Вони відчували, що проповідувати те, у що не віриш, просто робити кар’єру, дивитись, як твій народ російщать, — це багно»."], "source": "Історик Валентин Мороз про шістдесятників (скорочено)", "comment": ["Валентин Мороз — історик, учасник руху опору; у 1965 р. КДБ заарештував його разом з іншими шістдесятниками.", "Мороз пояснює, що шістдесятники могли зробити добру кар’єру, але не захотіли заради неї говорити те, у що не вірили, хоча за це їх переслідували.", "__Слова з документа:__ **істеблішмент** — правляча верхівка; **російщати** — русифікувати."], "img": null}, {"type": "text", "kicker": "Шістдесятники", "title": "Клуб творчої молоді «Сучасник» (1959)", "badges": ["НМТ: дата"], "paras": ["У **1959 р.** в **Києві** виник **Клуб творчої молоді «Сучасник»**. Його очолив молодий режисер **Лесь Танюк**. Офіційно клуб діяв при комсомолі.", "Лекції про літературу читали **Іван Дзюба, Іван Світличний і Євген Сверстюк**, про історію — Михайло Брайчевський. Відбувалися творчі вечори молодих поетів — **Ліни Костенко, Василя Симоненка, Івана Драча, Миколи Вінграновського**. Діяла театральна студія.", "Члени клубу святкували Шевченківські дні, збирали народні пісні, їздили по Україні, вивчали заборонені теми історії.", "Подібні клуби з’явилися в інших містах, зокрема **«Пролісок»** у Львові (1962). У 1963 – 1964 рр. влада закрила клуби."], "imgs": [{"key": "s050_image76", "cap": "Учасники клубу творчої молоді."}]}, {"type": "text", "kicker": "Шістдесятники", "title": "Биківня: правда про розстріли (1962)", "badges": [], "paras": ["У **1962 р.** члени клубу **Василь Симоненко, Алла Горська й Лесь Танюк** знайшли місця таємних поховань у **Биківнянському лісі** під Києвом і на Лук’янівському та Васильківському кладовищах.", "Вони з’ясували, що там поховано тисячі людей, яких **НКВС розстріляв у 1937 – 1941 рр.** Влада стверджувала, що це жертви нацистів.", "Шістдесятники звернулися до Київської міської ради з **меморандумом**: вимагали оприлюднити правду й створити меморіал. Відповіді вони не отримали, а за авторами почав стежити КДБ.", "Лише **1989 р.** влада визнала, що в Биківні поховані жертви НКВС. Тепер там діє **Національний історико-меморіальний заповідник «Биківнянські могили»**."], "imgs": [{"key": "bykivnia", "cap": "Національний історико-меморіальний заповідник «Биківнянські могили», сучасне фото. Фото: Аимаина хикари / Wikimedia Commons, CC0"}]}, {"type": "map", "title": "Опір режиму й шістдесятники", "steps": [{"key": "vl_opir", "label": "Крок 1"}]}, {"type": "text", "kicker": "Персоналія", "title": "Лесь Танюк (1938 – 2016)", "badges": [], "paras": ["Театральний режисер, перекладач, громадський діяч. Ще студентом театрального інституту заснував і очолив **Клуб творчої молоді «Сучасник»** (1959).", "Разом із Симоненком і Горською шукав місця поховань жертв НКВС у **Биківні** (1962).", "Його вистави в Києві забороняли, а з середини 1960-х рр. йому фактично не давали працювати в Україні. Понад двадцять років Танюк ставив вистави в Москві й інших містах.", "Наприкінці 1980-х рр. повернувся до Києва, став одним із засновників **Народного руху України**, багато років був народним депутатом.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "s074_image100", "cap": "Лесь Танюк."}]}, {"type": "text", "kicker": "Персоналія", "title": "Іван Світличний (1929 – 1992)", "badges": [], "paras": ["Літературознавець і критик, один із лідерів шістдесятників. У його київській квартирі збиралися молоді митці, читали заборонені книжки й самвидав.", "Виступав із лекціями в клубі «Сучасник», допомагав молодим поетам друкувати твори.", "У **1965 р.** його вперше заарештували й тримали під слідством близько **8 місяців**. У **1972 р.** заарештували вдруге й засудили до 7 років таборів і 5 років заслання.", "На засланні 1981 р. переніс тяжкий інсульт, після якого вже не одужав. Помер 1992 р. в незалежній Україні.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "horska_svitlychny", "cap": "Алла Горська. Портрет Івана Світличного, 1965 р. WikiArt"}]}, {"type": "text", "kicker": "Персоналія", "title": "Євген Сверстюк (1927 – 2014)", "badges": [], "paras": ["Літературний критик, філософ, есеїст, один із провідних шістдесятників. Виступав у клубі «Сучасник».", "З 1965 р. брав участь у протестах проти арештів інтелігенції. За це його звільнили з роботи.", "У **1970 р.** написав есей **«Собор у риштованні»** на захист роману Олеся Гончара «Собор», який влада засудила. Есей поширювали в **самвидаві**: його передруковували на машинці й передавали з рук у руки.", "У **1972 р.** його заарештували й засудили до 7 років таборів і 5 років заслання. У 1987 р. став одним із засновників Українського культурологічного клубу, з 1993 р. очолював Український ПЕН-клуб.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "s073_image99", "cap": "Євген Сверстюк."}]}, {"type": "text", "kicker": "Персоналія", "title": "Алла Горська (1929 – 1970)", "badges": [], "paras": ["Художниця-монументалістка, одна з лідерок шістдесятників. Народилася в Ялті в російськомовній родині, а українську мову вивчила вже дорослою — свідомо.", "Була серед організаторів клубу «Сучасник», оформлювала вистави його театральної студії. Разом із Симоненком і Танюком шукала місця поховань у **Биківні** (1962).", "У **1964 р.** разом з іншими художниками створила вітраж **«Шевченко. Мати»** в Київському університеті. Влада знищила вітраж, а Горську виключили зі Спілки художників.", "Підписувала листи на захист заарештованих. У **1970 р.** її вбили у Василькові за нез’ясованих обставин. Багато дослідників вважають, що до вбивства був причетний КДБ.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "horska_photo", "cap": "Алла Горська. Фото: SemenetsOlena / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Персоналія", "title": "Василь Симоненко (1935 – 1963)", "badges": ["НМТ: персоналія", "портрет"], "paras": ["Поет і журналіст з Полтавщини, працював у черкаських газетах. Один з найяскравіших поетів-шістдесятників. Його першу збірку **«Тиша і грім»** видали **1962 р.**", "Писав про любов до України, про гідність людини й про злочини сталінської доби. Багато його віршів цензура не пропускала, і їх поширювали в **самвидаві**, а після його смерті потрапили за кордон.", "Член клубу «Сучасник». Разом із Горською й Танюком шукав місця поховань жертв НКВС у **Биківні** (1962).", "У 1962 р. його жорстоко побили працівники міліції на залізничній станції в Смілі. Симоненко тяжко захворів і помер **13 грудня 1963 р.** у 28 років."], "imgs": [{"key": "s071_image97", "cap": "Василь Симоненко."}]}, {"type": "text", "kicker": "Персоналія", "title": "Ліна Костенко (нар. 1930)", "badges": [], "paras": ["Поетеса з Київщини, одна з найвідоміших шістдесятниць. Збірки **«Проміння землі»** (1957), **«Вітрила»** (1958) і **«Мандрівки серця»** (1961) зробили її відомою.", "Виступала на вечорах клубу «Сучасник». Відмовлялася писати так, як вимагала цензура. Після 1961 р. її книжки майже **16 років** не видавали.", "У 1965 р. підтримала протести проти арештів шістдесятників, а 1966 р. прийшла на суд у Львові над заарештованими й кидала їм квіти.", "Наприкінці доби застою вийшов її історичний роман у віршах **«Маруся Чурай»** (1979). Ліна Костенко пише й сьогодні: навесні 2026 р. вийшла її нова збірка.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "s075_image101", "cap": "Ліна Костенко."}]}]}, {"id": "s3", "num": "III", "title": "Влада й митці: від відлиги до арештів (1962 – 1965)", "sub": "Хрущов у Манежі, знищений вітраж, перші арешти, протест 1965 р.", "cover": {"key": "dziuba_kgb", "cap": ""}, "cards": [{"type": "text", "kicker": "Кінець відлиги", "title": "Хрущов і художники (1962 – 1963)", "badges": [], "paras": ["**1 грудня 1962 р.** Хрущов відвідав у московському **Манежі** виставку до 30-річчя Московської спілки художників. Побачивши роботи художників-авангардистів, він розлютився й грубо лаяв художників.", "Хрущов називав картини «неподобством», казав, що його онук намалює краще, вимагав «заборонити все» й погрожував відправити художників «на лісоповал».", "Навесні 1963 р. Хрущов зустрівся з письменниками й митцями і вимагав від них «партійності». В Україні на нарадах критикували за «формалізм» і «націоналізм» Івана Драча, Миколу Вінграновського, Ліну Костенко.", "Відлига в культурі закінчилася: цензура посилилася, клуби творчої молоді закрили."], "imgs": [{"key": "s051_image77", "cap": "Хрущов на виставці в Манежі, 1 грудня 1962 р."}]}, {"type": "text", "kicker": "Кінець відлиги", "title": "Знищений вітраж (1964)", "badges": [], "paras": ["До **150-річчя Тараса Шевченка** (1964) **Алла Горська, Опанас Заливаха, Людмила Семикіна, Галина Севрук і Галина Зубченко** створили вітраж **«Шевченко. Мати»** для вестибюля Київського університету.", "На вітражі гнівний Шевченко однією рукою пригортав скривджену жінку — Україну, а в другій тримав «Кобзар». Над ними був напис зі слів поета: «Возвеличу малих отих рабів німих! Я на сторожі коло їх поставлю слово».", "У березні 1964 р., ще до офіційного відкриття, партійне керівництво університету наказало **знищити вітраж**. Згодом бюро Спілки художників визнало його «ідейно ворожим». Горську й Семикіну виключили зі Спілки художників."], "imgs": [{"key": "horska_vitrazh", "cap": "Е

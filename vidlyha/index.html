сник», допомагав молодим поетам друкувати твори.", "У **1965 р.** його вперше заарештували й тримали під слідством близько **8 місяців**. У **1972 р.** заарештували вдруге й засудили до 7 років таборів і 5 років заслання.", "На засланні 1981 р. переніс тяжкий інсульт, після якого вже не одужав. Помер 1992 р. в незалежній Україні.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "horska_svitlychny", "cap": "Алла Горська. Портрет Івана Світличного, 1965 р. WikiArt"}]}, {"type": "text", "kicker": "Персоналія", "title": "Євген Сверстюк (1927 – 2014)", "badges": [], "paras": ["Літературний критик, філософ, есеїст, один із провідних шістдесятників. Виступав у клубі «Сучасник».", "З 1965 р. брав участь у протестах проти арештів інтелігенції. За це його звільнили з роботи.", "У **1970 р.** написав есей **«Собор у риштованні»** на захист роману Олеся Гончара «Собор», який влада засудила. Есей поширювали в **самвидаві**: його передруковували на машинці й передавали з рук у руки.", "У **1972 р.** його заарештували й засудили до 7 років таборів і 5 років заслання. У 1987 р. став одним із засновників Українського культурологічного клубу, з 1993 р. очолював Український ПЕН-клуб.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "s073_image99", "cap": "Євген Сверстюк."}]}, {"type": "text", "kicker": "Персоналія", "title": "Алла Горська (1929 – 1970)", "badges": [], "paras": ["Художниця-монументалістка, одна з лідерок шістдесятників. Народилася в Ялті в російськомовній родині, а українську мову вивчила вже дорослою — свідомо.", "Була серед організаторів клубу «Сучасник», оформлювала вистави його театральної студії. Разом із Симоненком і Танюком шукала місця поховань у **Биківні** (1962).", "У **1964 р.** разом з іншими художниками створила вітраж **«Шевченко. Мати»** в Київському університеті. Влада знищила вітраж, а Горську виключили зі Спілки художників.", "Підписувала листи на захист заарештованих. У **1970 р.** її вбили у Василькові за нез’ясованих обставин. Багато дослідників вважають, що до вбивства був причетний КДБ.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "horska_photo", "cap": "Алла Горська. Фото: SemenetsOlena / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Персоналія", "title": "Василь Симоненко (1935 – 1963)", "badges": ["НМТ: персоналія", "портрет"], "paras": ["Поет і журналіст з Полтавщини, працював у черкаських газетах. Один з найяскравіших поетів-шістдесятників. Його першу збірку **«Тиша і грім»** видали **1962 р.**", "Писав про любов до України, про гідність людини й про злочини сталінської доби. Багато його віршів цензура не пропускала, і їх поширювали в **самвидаві**, а після його смерті потрапили за кордон.", "Член клубу «Сучасник». Разом із Горською й Танюком шукав місця поховань жертв НКВС у **Биківні** (1962).", "У 1962 р. його жорстоко побили працівники міліції на залізничній станції в Смілі. Симоненко тяжко захворів і помер **13 грудня 1963 р.** у 28 років."], "imgs": [{"key": "s071_image97", "cap": "Василь Симоненко."}]}, {"type": "text", "kicker": "Персоналія", "title": "Ліна Костенко (нар. 1930)", "badges": [], "paras": ["Поетеса з Київщини, одна з найвідоміших шістдесятниць. Збірки **«Проміння землі»** (1957), **«Вітрила»** (1958) і **«Мандрівки серця»** (1961) зробили її відомою.", "Виступала на вечорах клубу «Сучасник». Відмовлялася писати так, як вимагала цензура. Після 1961 р. її книжки майже **16 років** не видавали.", "У 1965 р. підтримала протести проти арештів шістдесятників, а 1966 р. прийшла на суд у Львові над заарештованими й кидала їм квіти.", "Наприкінці доби застою вийшов її історичний роман у віршах **«Маруся Чурай»** (1979). Ліна Костенко пише й сьогодні: навесні 2026 р. вийшла її нова збірка.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "s075_image101", "cap": "Ліна Костенко."}]}]}, {"id": "s3", "num": "III", "title": "Влада й митці: від відлиги до арештів (1962 – 1965)", "sub": "Хрущов у Манежі, знищений вітраж, перші арешти, протест 1965 р.", "cover": {"key": "dziuba_kgb", "cap": ""}, "cards": [{"type": "text", "kicker": "Кінець відлиги", "title": "Хрущов і художники (1962 – 1963)", "badges": [], "paras": ["**1 грудня 1962 р.** Хрущов відвідав у московському **Манежі** виставку до 30-річчя Московської спілки художників. Побачивши роботи художників-авангардистів, він розлютився й грубо лаяв художників.", "Хрущов називав картини «неподобством», казав, що його онук намалює краще, вимагав «заборонити все» й погрожував відправити художників «на лісоповал».", "Навесні 1963 р. Хрущов зустрівся з письменниками й митцями і вимагав від них «партійності». В Україні на нарадах критикували за «формалізм» і «націоналізм» Івана Драча, Миколу Вінграновського, Ліну Костенко.", "Відлига в культурі закінчилася: цензура посилилася, клуби творчої молоді закрили."], "imgs": [{"key": "s051_image77", "cap": "Хрущов на виставці в Манежі, 1 грудня 1962 р."}]}, {"type": "text", "kicker": "Кінець відлиги", "title": "Знищений вітраж (1964)", "badges": [], "paras": ["До **150-річчя Тараса Шевченка** (1964) **Алла Горська, Опанас Заливаха, Людмила Семикіна, Галина Севрук і Галина Зубченко** створили вітраж **«Шевченко. Мати»** для вестибюля Київського університету.", "На вітражі гнівний Шевченко однією рукою пригортав скривджену жінку — Україну, а в другій тримав «Кобзар». Над ними був напис зі слів поета: «Возвеличу малих отих рабів німих! Я на сторожі коло їх поставлю слово».", "У березні 1964 р., ще до офіційного відкриття, партійне керівництво університету наказало **знищити вітраж**. Згодом бюро Спілки художників визнало його «ідейно ворожим». Горську й Семикіну виключили зі Спілки художників."], "imgs": [{"key": "horska_vitrazh", "cap": "Ескіз вітража «Шевченко. Мати», 1964 р. WikiArt"}]}, {"type": "text", "kicker": "Після відлиги", "title": "Протест у кінотеатрі «Україна» (1965)", "badges": [], "paras": ["Після усунення Хрущова влада вирішила придушити рух шістдесятників. У **серпні – вересні 1965 р.** КДБ заарештував понад 20 осіб: Івана Світличного, братів Горинів, Опанаса Заливаху, Валентина Мороза та інших.", "**4 вересня 1965 р.** у київському кінотеатрі **«Україна»** відбувалася прем’єра фільму Сергія Параджанова **«Тіні забутих предків»**. Літературний критик **Іван Дзюба** вийшов на сцену й розповів про арешти. Його підтримали **В’ячеслав Чорновіл** і **Василь Стус**, який закликав глядачів устати на знак протесту.", "Того ж року Дзюба написав працю **«Інтернаціоналізм чи русифікація?»** про становище української мови й культури.", "Протест у кінотеатрі «Україна» вважають першим публічним виступом проти політичних арештів в Україні після війни. Про подальшу долю дисидентів — у темі «доба застою»."], "imgs": [{"key": "stus80", "cap": "Василь Стус. Фото з кримінальної справи КДБ, 1980 р. Фото: Official KGB photo from Stus file after arrest 1980 / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Персоналія", "title": "Василь Стус (1938 – 1985)", "badges": ["НМТ: персоналія", "портрет"], "paras": ["Поет, перекладач, літературознавець. Народився на Вінниччині, виріс на Донбасі. Після педагогічного інституту вчителював, служив в армії, з **1963 р.** навчався в аспірантурі Інституту літератури в Києві.", "**4 вересня 1965 р.** на прем’єрі «Тіней забутих предків» підтримав протест Івана Дзюби. Його виключили з аспірантури.", "У **1972 р.** Стуса заарештували й засудили до 5 років таборів і 3 років заслання. Після повернення в **1979 р.** він вступив до **Української Гельсінської групи**, а 1980 р. його засудили вдруге — до 10 років таборів і 5 років заслання.", "Загинув **4 вересня 1985 р.** у таборі на Пермщині під час голодування. У 1989 р. його перепоховали в Києві. Збірку віршів «Палімпсести» Стус написав у неволі.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "s070_image96", "cap": "Василь Стус. Фото з архіву КДБ."}]}]}, {"id": "s4", "num": "IV", "title": "Освіта й наука", "sub": "Шкільна реформа 1958 – 1959 рр., Академія наук, кібернетика, космос", "cover": {"key": "sputnik", "cap": ""}, "cards": [{"type": "text", "kicker": "Освіта", "title": "Шкільна реформа 1958 – 1959 рр.", "badges": [], "paras": ["У грудні **1958 р.** ухвалили союзний закон **«Про зміцнення зв’язку школи з життям»**, у квітні **1959 р.** — такий самий закон УРСР.", "Обов’язковою стала **8-річна** школа замість 7-річної. Щоб отримати повну середню освіту, треба було вчитися **11 років**: у 9 – 11 класах учні опановували робітничу професію на виробництві. У 1964 р. від цього відмовилися й повернули 10-річну школу.", "**Стаття 9** закону УРСР дозволила батькам самим обирати, якою мовою навчатиметься дитина, і звільняти її від вивчення української мови. Без російської не можна було вступити до більшості вишів і зробити кар’єру, тому в містах батьки віддавали дітей до російських шкіл.", "Так закон посилив **русифікацію**: кількість українських шкіл і частка учнів, які навчалися українською, у 1960-х рр. зменшувалися."], "imgs": [{"key": "s053_image78", "cap": "Учні в класі, кінець 1950-х рр."}, {"key": "s053_image80", "cap": "Урок у старших класах."}]}, {"type": "text", "kicker": "Освіта", "title": "Якою мовою навчалися школярі УРСР", "badges": [], "paras": ["За десять років частка учнів, які навчалися **українською мовою**, зменшилася з 81 до 64 %, а частка тих, хто навчався російською, зросла майже вдвічі.", "У великих містах українських шкіл було зовсім мало. У 1958/1959 навчальному році українською навчалися **26,5 %** учнів Києва, **8,1 %** — Одеси, **4,1 %** — Харкова, **1,2 %** — Донецька.", "Стаття 9 закону 1959 р. закріпила цю тенденцію: російську мову вивчали обов’язково, а українську в російських школах — за бажанням батьків.", "Проти русифікації школи виступали письменники **Максим Рильський** і **Микола Бажан**, а згодом шістдесятники."], "imgs": [{"key": "chart_2_31", "cap": "Частка учнів загальноосвітніх шкіл УРСР за мовою навчання. Джерело: ZN.UA, «Мова не на часі»."}]}, {"type": "text", "kicker": "Наука", "title": "Наука в УРСР", "badges": [], "paras": ["У 1946 – 1962 рр. Академію наук УРСР очолював біохімік **Олександр Палладін**, а з **1962 р.** — **Борис Патон**, який керував нею до 2020 р.", "У Києві **Сергій Лебедєв** у 1948 – 1951 рр. створив **МЕСМ** — першу в континентальній Європі електронну обчислювальну машину. У 1962 р. **Віктор Глушков** очолив **Інститут кібернетики** АН УРСР.", "Інститут електрозварювання під керівництвом **Бориса Патона** розробляв нові способи зварювання металів. Хірург **Микола Амосов** проводив у Києві складні операції на серці.", "У Дніпропетровську конструкторське бюро **Михайла Янгеля** створювало ракети, зокрема бойові. Найбільше грошей держава давала на науку, пов’язану з армією, а гуманітарні науки суворо контролювала партія."], "imgs": [{"key": "s056_image81", "cap": "Віктор Глушков (праворуч у першому ряду) зі співробітниками біля обчислювальної машини."}, {"key": "amosov", "cap": "Микола Амосов, 1980-ті рр. Фото: Published by the Embassy of the Union of Soviet Socialist Republics to the United States of America - photographer uncredited / Wikimedia Commons, Public domain"}]}, {"type": "carousel", "title": "Наука доби відлиги: люди й відкриття", "badges": [], "note": null, "items": [{"key": "s058_image83", "name": "", "desc": "Борис Патон — президент Академії наук УРСР з 1962 р.", "cap": ""}, {"key": "glushkov_env", "name": "", "desc": "Віктор Глушков на поштовому конверті. Фото: Бендель Пётр Эмильевич (1905 – 1989) / Wikimedia Commons, Public domain", "cap": ""}, {"key": "yangel_stamp", "name": "", "desc": "Михайло Янгель на поштовій марці України. Фото: Post of Ukraine / Wikimedia Commons, Public domain", "cap": ""}, {"key": "mesm_house", "name": "", "desc": "Київ, Феофанія, вулиця Академіка Лебедєва: тут у 1948 – 1951 рр. створювали МЕСМ. Фото: Олекса-Київ / Wikimedia Commons, CC BY 3.0", "cap": ""}, {"key": "s059_image85", "name": "", "desc": "Сергій Корольов (праворуч) і Юрій Гагарін перед стартом, 12 квітня 1961 р.", "cap": ""}, {"key": "gagarin", "name": "", "desc": "Юрій Гагарін, 1961 р. Фото: Arto Jousi / /Suomen valokuvataiteen museo / Alma Media / Uuden Suomen kokoelma; Restored by Adam Cuerden / Wikimedia Commons, Public domain", "cap": ""}]}, {"type": "text", "kicker": "Персоналія", "title": "Сергій Корольов (1907 – 1966)", "badges": [], "paras": ["Народився в **Житомирі**, навчався в Київському політехнічному інституті, потім у Москві. З юності захоплювався планеризмом і ракетами.", "У **1938 р.** його заарештували за сфабрикованою справою, катували, відправили на золоті копальні Колими. Потім він працював у «шарашці» — тюремному конструкторському бюро. Звільнили його **1944 р.**", "З **1946 р.** — головний конструктор ракет. Під його керівництвом **4 жовтня 1957 р.** запустили **перший штучний супутник Землі**, а **12 квітня 1961 р.** **Юрій Гагарін** здійснив перший політ людини в космос.", "Ім’я Корольова було державною таємницею: у газетах його називали лише «головним конструктором». Широкий загал дізнався про нього тільки після його смерті 1966 р."], "imgs": [{"key": "s078_image104", "cap": "Сергій Корольов."}]}]}, {"id": "s5", "num": "V", "title": "Література, мистецтво, церква", "sub": "Повернення заборонених імен, нове покоління митців, Катерина Білокур, антирелігійна кампанія", "cover": {"key": "prym_bird", "cap": ""}, "cards": [{"type": "cols", "title": "Література доби відлиги", "badges": [], "intro": null, "blocks": [{"h": "Старше покоління", "paras": ["Почали знову видавати частину творів **реабілітованих** письменників, яких розстріляли в 1930-х рр. (Микола Куліш, Григорій Косинка, Михайль Семенко). Але чимало творів залишалися забороненими.", "**Олександр Довженко** написав кіноповість **«Поема про море»** (1956) про будівництво Каховської ГЕС.", "**Григорій Тютюнник** — роман **«Вир»** (1960 – 1962); **Олесь Гончар** — роман **«Тронка»** (1963).", "**Володимир Сосюра** таємно писав поему «Розстріляне безсмертя» — її надрукували лише в 1980-х рр."]}, {"h": "Шістдесятники", "paras": ["**Ліна Костенко** — «Проміння землі» (1957), «Вітрила» (1958), «Мандрівки серця» (1961).", "**Василь Симоненко** — «Тиша і грім» (1962).", "**Іван Драч** — «Соняшник» (1962).", "Також **Микола Вінграновський, Дмитро Павличко, Борис Олійник**.", "Молоді поети говорили про людину, свободу й Україну новою мовою, без офіційних гасел. Їхні збірки швидко розкуповували, а вечори поезії збирали повні зали."]}]}, {"type": "text", "kicker": "Культура", "title": "Образотворче мистецтво", "badges": [], "paras": ["Художники відроджували традиції українського народного й монументального мистецтва. **Алла Горська, Віктор Зарецький, Галина Зубченко** створювали мозаїки для громадських будівель.", "**Тетяна Яблонська**, визнана художниця соціалістичного реалізму, у 1960-х рр. звернулася до народних мотивів. **Катерина Білокур** і **Марія Приймаченко** — майстрині **народного «наївного» мистецтва**.", "Монументальні твори шістдесятників влада часто знищувала або закривала. Чимало мозаїк Горської на Донеччині зруйновано вже під час російсько-української війни."], "imgs": [{"key": "prym_lion", "cap": "Марія Приймаченко. «Лев зламав дуба», 1963 р. WikiArt"}, {"key": "horska_symonenko", "cap": "Алла Горська. Портрет Василя Симоненка, 1964 р. WikiArt"}]}, {"type": "text", "kicker": "Культура", "title": "Кіно: «Тіні забутих предків» (1964)", "badges": [], "paras": ["У **1964 р.**, до 100-річчя Михайла Коцюбинського, на Київській кіностудії імені Довженка режисер **Сергій Параджанов** зняв фільм **«Тіні забутих предків»** за його повістю.", "Фільм знімали в гуцульських селах на Верховинщині. Оператором був **Юрій Іллєнко**, головну роль Івана зіграв **Іван Миколайчук**, музику написав **Мирослав Скорик**. Актори говорили гуцульською говіркою, і Параджанов відмовився дублювати фільм російською.", "Стрічка здобула нагороди на міжнародних кінофестивалях, зокрема в Мар-дель-Плата (Аргентина, 1965). З неї почалося **українське поетичне кіно**.", "На прем’єрі фільму в Києві **4 вересня 1965 р.** відбувся протест проти арештів інтелігенції. У 1973 р. Параджанова заарештували й ув’язнили."], "imgs": [{"key": "paradzhanov", "cap": "Сергій Параджанов, 1980-ті рр. Фото: Мечитов, Юрий Михайлович / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "carousel", "title": "Мистецтво шістдесятих: твори", "badges": [], "note": null, "items": [{"key": "mosaic_mariupol", "name": "", "desc": "Мозаїка в Маріуполі, 1960-ті рр. Автори за описом на Вікісховищі: Г. Зубченко, Г. Пришедько, А. Горська. Фото: ОпоОпо / Wikimedia Commons, CC0", "cap": ""}, {"key": "s064_image89", "name": "", "desc": "Марія Приймаченко. Птахи.", "cap": ""}, {"key": "s064_image90", "name": "", "desc": "Марія Приймаченко. Звір.", "cap": ""}, {"key": "s064_image91", "name": "", "desc": "Марія Приймаченко. Хоровод під сонцем.", "cap": ""}, {"key": "bilokur_dam", "name": "", "desc": "Катерина Білокур. «У Богданівці біля греблі», 1955 р. WikiArt", "cap": ""}]}, {"type": "text", "kicker": "Персоналія", "title": "Катерина Білокур (1900 – 1961)", "badges": [], "paras": ["Народилася в селі **Богданівка** (нині Київщина) у селянській родині. Школи не закінчила: читати й писати навчилася сама. Батьки не пускали її вчитися малювати, а до художнього технікуму її не прийняли без документа про освіту.", "Малювати навчилася сама: пензлі робила з котячої шерсті, фарби — з рослин. Про неї дізналися 1940 р., коли в Полтаві відбулася її виставка.", "Малювала здебільшого квіти й старанно виписувала кожну пелюстку. У **1954 р.** її картини показали на міжнародній виставці в Парижі. У **1956 р.** їй надали звання **народної художниці УРСР**.", "Усе життя прожила в Богданівці, де тепер діє її **музей-садиба**."], "imgs": [{"key": "s077_image103", "cap": "Катерина Білокур біля своєї картини."}]}, {"type": "monument", "title": "Катерина Білокур. «Хата в Богданівці» (1955)", "badges": ["НМТ: пам’ятка"], "img": {"key": "bilokur_hata", "cap": "Катерина Білокур. «Хата в Богданівці», 1955 р. Олія. WikiArt"}, "paras": ["Картину Катерина Білокур написала **1955 р.** у рідному селі Богданівка.", "Ліворуч — стара хата під солом’яною стріхою, тин, сад і верби. Праворуч — пишний букет: мальви, маки, флокси, айстри, кожну квітку виписано окремо.", "На одному полотні художниця поєднала пейзаж і натюрморт: за букетом видно її село.", "Цю картину треба **впізнавати** на НМТ. Прикмети: хата зі стріхою ліворуч і великий букет праворуч."]}, {"type": "text", "kicker": "Церква", "title": "Держава і церква", "badges": [], "paras": ["У 1958 – 1964 рр. Хрущов розгорнув нову **антирелігійну кампанію**. Він обіцяв, що в СРСР скоро не буде віруючих.", "В УРСР закривали храми й монастирі: кількість відкритих православних храмів скоротилася майже вдвічі. У **1961 р.** влада закрила **Києво-Печерську лавру** й намагалася закрити Почаївську. Храми, навіть пам’ятки архітектури, руйнували або перетворювали на склади й клуби.", "**Українська греко-католицька церква**, заборонена 1946 р., і далі діяла лише підпільно. Частина її священників повернулася із заслання.", "Главу УГКЦ митрополита **Йосипа Сліпого**, який провів у таборах 18 років, у лютому **1963 р.** звільнили на прохання Папи Римського Івана XXIII й відправили до Рима. Повернутися в Україну йому не дозволили."], "imgs": [{"key": "s065_image92", "cap": "Антирелігійний плакат «Бога нема!»"}, {"key": "slipyj", "cap": "Йосип Сліпий у Римі. Фото: Pkravchenko / Wikimedia Commons, CC BY-SA 3.0"}]}]}, {"id": "s6", "num": "VI", "title": "Підсумки теми", "sub": "Поняття · персоналії · що часто плутають · стрічка часу всієї теми", "cover": {"key": "bilokur_self55", "cap": ""}, "cards": [{"type": "table", "title": "Поняття теми «Україна в умовах десталінізації»", "rows": [["Поняття", "Що означає"], ["Десталінізація", "відмова від масових репресій, свавілля держбезпеки, системи ГУЛАГу й культу особи Сталіна; однопартійна диктатура збереглася"], ["Культ особи", "безмежне звеличення одного керівника, якому приписують усі успіхи й безпомилковість"], ["Лібералізація", "послаблення контролю держави над суспільством: менше репресій і цензури"], ["Політична реабілітація", "відновлення доброго імені й прав несправедливо засуджених з політичних мотивів"], ["Відлига", "неофіційна назва доби 1953 – 1964 рр. (за повістю І. Еренбурга)"], ["Раднаргосп", "рада народного господарства — орган управління промисловістю економічного району (1957 – 1965)"], ["Шістдесятники", "покоління молодої інтелігенції, яке прийшло в культуру за доби відлиги"], ["Дисиденти", "люди, які відкрито не погоджувалися з офіційною ідеологією й політикою влади"]]}, {"type": "table", "title": "Персоналії теми", "rows": [["Хто", "Чим відомий у добу відлиги"], ["Левко Лук’яненко (портрет)", "засновник Української робітничо-селянської спілки (1959); розстріл йому замінили 15 роками ув’язнення"], ["Василь Стус (портрет)", "поет; 4 вересня 1965 р. підтримав протест на прем’єрі «Тіней забутих предків»"], ["Василь Симоненко (портрет)", "поет-шістдесятник, збірка «Тиша і грім» (1962); Биківня; помер 1963 р."], ["Іван Світличний", "літературознавець, один із лідерів шістдесятників; арешт 1965 р."], ["Алла Горська", "художниця, «Сучасник», Биківня, знищений вітраж «Шевченко. Мати» (1964)"], ["Ліна Костенко", "поетеса: «Проміння землі», «Вітрила», «Мандрівки серця»"], ["Євген Сверстюк", "критик, філософ, лектор «Сучасника»; есей «Собор у риштованні» (1970)"], ["Лесь Танюк", "режисер, голова Клубу творчої молоді «Сучасник» (1959)"], ["Сергій Корольов", "конструктор ракет; перший супутник (1957), політ Гагаріна (1961)"], ["Катерина Білокур", "народна художниця; картина «Хата в Богданівці» (1955)"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "1959 р. — двічі", "paras": ["**УРСС** — підпільна організація Лук’яненка (Львівщина).", "**«Сучасник»** — легальний клуб творчої молоді в **Києві**."], "img": null}, {"name": "Два поняття", "paras": ["**Шістдесятники** — покоління в культурі.", "**Дисиденти** — ті, хто відкрито виступав проти політики влади. Багато шістдесятників стали дисидентами."], "img": null}, {"name": "Симоненко і Стус", "paras": ["**Симоненко** помер 1963 р., за Хрущова.", "**Стус** загинув у таборі 1985 р., його арешти — 1972 і 1980 рр."], "img": null}, {"name": "Дві художниці", "paras": ["**Білокур** — Богданівка, квіти, **«Хата в Богданівці»**.", "**Приймаченко** — Болотня, фантастичні звірі."], "img": null}], "note": null}, {"type": "tl_events", "title": "Стрічка часу всієї теми (1953 – 1965)", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "1953 – 1954", "name": "Повстання в таборах", "desc": "Норильськ, Воркута, Кенгір", "color": "#e05a47", "prog": true}, {"year": "лютий 1954", "name": "Крим — до складу УРСР", "desc": "указ 19 лютого", "color": "#e97132", "prog": true}, {"year": "1956", "name": "XX з’їзд КПРС", "desc": "засудження культу особи", "color": "#e97132", "prog": true}, {"year": "1957", "name": "Раднаргоспи", "desc": "управління за регіонами", "color": "#9cc6de", "prog": false}, {"year": "1959", "name": "УРСС", "desc": "Л. Лук’яненко", "color": "#e05a47", "prog": true}, {"year": "1959", "name": "«Сучасник»", "desc": "клуб творчої молоді в Києві", "color": "#a9dda0", "prog": true}, {"year": "1962", "name": "Новочеркаськ; Манеж", "desc": "розстріл робітників; виставка в Манежі", "color": "#a6a6a6", "prog": false}, {"year": "1964", "name": "Усунення Хрущова", "desc": "пленум ЦК КПРС, 14 жовтня", "color": "#b48ae0", "prog": false}]}, {"type": "text", "kicker": "Підсумки", "title": "Чим завершилася доба відлиги", "badges": [], "paras": ["За **1953 – 1964 рр.** радянський режим відмовився від масового терору: сотні тисяч людей повернулися з таборів, багатьох реабілітували. Але однопартійна диктатура, цензура й планова економіка залишилися.", "УРСР отримала більше прав в управлінні економікою, а 1954 р. — **Кримську область**. Українці вперше очолили компартію республіки.", "Реформи Хрущова в економіці часто були поспішними й непродуманими. На початку 1960-х рр. їхніми наслідками стали подорожчання, дефіцит, неврожай і протести.", "За відлиги сформувалося покоління **шістдесятників**, а з ним — **дисидентський рух**. Після 1964 р. влада почала переслідувати шістдесятників, але зупинити цей рух уже не змогла."], "imgs": [{"key": "kyiv_fortepan", "cap": "Київ, площа Калініна (нині майдан Незалежності), 1961 р. Фото: Fortepan / Wikimedia Commons, CC BY-SA 3.0"}]}]}]}];

ах", "розширення посівів кукурудзи", "поширення приватних фермерських господарств на селі", "створення машинно-тракторних станцій у колгоспах", "упровадження «Продовольчої програми» в сільському господарстві", "реалізація заходів з випередження США у виробництві м’яса й молока на душу населення"], "ok": [0, 2, 6], "expl": "Надпрограми Хрущова — освоєння цілини, розширення посівів кукурудзи й намір наздогнати США за виробництвом м’яса й молока на душу населення. «Продовольча програма» — 1982 р., за Брежнєва.", "src": "ЗНО 2020 – пробний тест (№ 30)"}, {"id": "z20668", "q": "Проаналізуйте уривок з історичного джерела:\n«...Партійні організації не завжди враховують ту обставину, що останнім часом повернулося з місць ув’язнення значне число осіб реабілітованих або відбувших термін покарання. Серед них є особи, особливо із числа буржуазних націоналістів, які ідейно не роззброїлися. ЦК КПРС вимагає від партійних та радянських органів уживати рішучих заходів до тих, які намагаються відновити свою минулу антирадянську діяльність…»\nЩо стало передумовою появи цитованого документа?", "sec": "s2", "g": "gutab", "t": "single", "opts": ["формування багатопартійності в республіках СРСР", "зародження правозахисного дисидентського руху в УРСР", "виникнення руху «шістдесятників» серед молоді", "ліквідація Головного управління таборів (ГУТабу)"], "ok": [3], "expl": "Лист ЦК КПРС з’явився, коли табірну систему ГУТАБу (ГУЛАГу) згортали й з ув’язнення поверталися сотні тисяч людей. Багатопартійності тоді не було, а дисиденти й шістдесятники заявили про себе пізніше.", "src": "ЗНО 2020 – основна сесія (№ 16)"}, {"id": "z21316", "q": "«У багатьох з нас одразу після ХХ з'їзду було багато наївного, рожевого оптимізму, багато ілюзій, побудованих на піску, і багатьом здавалося, що всі проблеми народного життя вирішуються одним махом, і нам нічого не лишається, як з високо піднятими прапорами урочисто марширувати до комунізму», - згадував український дисидент І. Світличний про настрої, що охопили суспільство в результаті", "sec": "s4", "g": "xx_spohad", "t": "single", "opts": ["декларування створення нової спільноти - «радянський народ».", "розвінчання й засудження «культу особи» Й. Сталіна.", "впровадження політики плюралізму та гласності.", "проголошення гасла «Кадри вирішують усе!»."], "ok": [1], "expl": "Світличний згадує, на що сподівалися люди, коли дізналися про доповідь Хрущова із засудженням культу особи Сталіна. Інші варіанти — з інших десятиліть.", "src": "ЗНО 2020 – додаткова сесія (№ 17)"}, {"id": "z21329", "q": "Рішення Верховної Ради СРСР про передання Кримської області до складу УРСР", "sec": "s3", "g": "krym3", "t": "three", "opts": ["прийнято з міркувань економічної доцільності.", "ухвалено з метою забезпечення лояльності української політичної еліти до союзного керівництва.", "передбачало створення головної військово-морської бази СРСР.", "сприяло залученню іноземних інвестицій в економіку півострова.", "приурочено святкуванню 300-річчя Переяславської ради.", "наголошувало на захисті прав і свобод кримських татар.", "визначало статус півострова як адміністративно-територіальної одиниці республіки."], "ok": [0, 4, 6], "expl": "Указ пояснював передачу спільною економікою, територіальною близькістю й тісними господарськими зв’язками, а пропаганда пов’язувала її з 300-річчям Переяславської ради. Крим увійшов до УРСР як звичайна область.", "src": "ЗНО 2020 – додаткова сесія (№ 30)"}, {"id": "z22189", "q": "Про кого з керівників СРСР йдеться в уривку з історичного джерела?\n«Навіть найкрутіші його реформи – створення раднаргоспів, ліквідація багатьох міністерств і відомств – носили верхівковий характер. Але вони… не зачіпали суті виробничих відносин, не претендували на те, щоб… послабити задушливий прес державної опіки...»", "sec": "s8", "g": "hrushch_ref", "t": "single", "opts": ["Й. Сталіна", "М. Хрущова", "Л. Брежнєва", "М. Горбачова"], "ok": [1], "expl": "Створення раднаргоспів і ліквідація багатьох міністерств — реформи Хрущова. Автор уривка показує, що вони змінювали лише форму управління, а не саму радянську економіку.", "src": "ЗНО 2012 – додаткова сесія (№ 43)"}, {"id": "z22244", "q": "За якого керівника СРСР започатковано процес, відображений на малюнку з радянського журналу?", "sec": "s4", "g": "hrushch_mal", "t": "single", "img": ["q_d9199c7d03"], "opts": ["М. Хрущова", "Л. Брєжнєва", "Ю. Андропова", "М. Горбачова"], "ok": [0], "expl": "На малюнку бабуся з онукою дивляться, як швидко зводять нові будинки. Масове житлове будівництво з бетонних панелей почалося за Хрущова наприкінці 1950-х рр.", "src": "ЗНО 2013 – додаткова сесія (№ 38)"}, {"id": "z22313", "q": "Установіть послідовність створення радянських агітаційних плакатів.", "sec": "s8", "g": "plakat_seq", "t": "seq", "oimg": ["q_d8d0c38965", "q_140d805389", "q_f5e32078d7", "q_63099a0794"], "opts": ["Б", "А", "В", "Г"], "expl": "Спершу — плакат про продподаток (неп, 1921 р.), далі — «Сто тисяч червоноармійців на фронт соціалістичної перебудови села» (колективізація), потім — «На трактор дівчата сідають сміливо» (1941 – 1945 рр.), останнім — «Цілину піднімемо!» (доба Хрущова).", "src": "ЗНО 2014 – додаткова сесія (№ 52)"}, {"id": "z24877", "q": "Гідротехнічну споруду, зображену на картосхемі жирною лінією, зведено в УРСР з метою", "sec": "s3", "g": "kanal", "t": "single", "img": ["q_54b7135c7c"], "opts": ["спрямування течії Дніпра в інше русло.", "реалізації однієї з «надпрограм М. Хрущова».", "поліпшення економічного стану півострова.", "унаочнення дружби між українцями й кримськими татарами."], "ok": [2], "expl": "На картосхемі — Північнокримський канал від Каховського водосховища. Його почали будувати 1961 р., щоб дати посушливому Криму дніпровську воду для полів і міст.", "src": "ЗНО 2021 – додаткова сесія (№ 16)"}, {"id": "z26144", "q": "«У багатьох з нас одразу після ХХ з’їзду було багато наївного, рожевого оптимізму, багато ілюзій, побудованих на піску, і багатьом здавалося, що всі проблеми народного життя вирішуються одним махом, і нам нічого не лишається, як з високо піднятими прапорами урочисто марширувати до комунізму», – згадував український дисидент І. Світличний про настрої, що охопили суспільство в результаті", "sec": "s4", "g": "xx_spohad", "t": "single", "opts": ["декларування створення нової спільноти – «радянський народ».", "розвінчання й засудження «культу особи» Й. Сталіна.", "впровадження політики плюралізму та гласності.", "проголошення гасла «Кадри вирішують усе!»."], "ok": [1], "expl": "Світличний згадує, на що сподівалися люди, коли дізналися про доповідь Хрущова із засудженням культу особи Сталіна. Інші варіанти — з інших десятиліть.", "src": "НМТ 2022 – основна сесія (№ 11)"}, {"id": "z26235", "q": "Рішення Верховної Ради СРСР про передання Кримської області до складу УРСР", "sec": "s3", "g": "krym3", "t": "three", "opts": ["прийнято з міркувань економічної доцільності.", "ухвалено з метою забезпечення лояльності української політичної еліти до союзного керівництва.", "передбачало створення головної військово-морської бази СРСР.", "сприяло залученню іноземних інвестицій в економіку півострова.", "приурочено святкуванню 300-річчя Переяславської ради.", "наголошувало на захисті прав і свобод кримських татар.", "визначало статус півострова як адміністративно-територіальної одиниці республіки."], "ok": [0, 4, 6], "expl": "Указ пояснював передачу спільною економікою, територіальною близькістю й тісними господарськими зв’язками, а пропаганда пов’язувала її з 300-річчям Переяславської ради. Крим увійшов до УРСР як звичайна область.", "src": "НМТ 2023 – демоваріант (№ 30)"}, {"id": "z26952", "q": "Створення 1957 року на території УРСР «раднаргоспів» є свідченням", "sec": "s5", "g": "radnar_meta", "t": "single", "opts": ["прагнення позбавити компартію можливості втручатися в управління економікою.", "пошуку ефективної моделі управління промисловістю та сільським господарством.", "успіхів у відбудові промисловості та сільського господарства республіки.", "продовження політики колективізації селянських господарств у республіці."], "ok": [1], "expl": "Створюючи раднаргоспи, Хрущов шукав, як краще керувати промисловістю: з Москви важко було знати потреби кожного регіону. Вплив компартії на економіку від цього не зменшився.", "src": "НМТ 2023 – 2 сесія (№ 17)"}, {"id": "z27723", "q": "«…Завдання семирічки в галузі сільського господарства ми зможемо виконати за п’ять років… Розрахунки показують, що посіви кукурудзи мають орієнтовно складати 9–10 млн га і дорівнювати приблизно половині всієї площі зернових…»\nНаведений уривок документа є свідченням реалізації", "sec": "s5", "g": "semyrichka", "t": "single", "opts": ["планів повоєнної відбудови України.", "однієї з надпрограм М. Хрущова.", "заходів «реформ О. Косигіна».", "«Продовольчої програми»."], "ok": [1], "expl": "Уривок — про розширення посівів кукурудзи на половину площі зернових. Кукурудзяна кампанія — одна з надпрограм Хрущова; реформи Косигіна й «Продовольча програма» були пізніше.", "src": "НМТ 2024 – демоваріант (№ 17)"}, {"id": "z35472", "q": "Яка із зображених карикатур візуалізує особливості соціально-економічного життя в період «відлиги»?", "sec": "s6", "g": "kar_iowa", "t": "single", "oimg": ["q_54a52e451d", "q_eb5bb0abb7", "q_f72c695061", "q_ccf2e3c5ab"], "opts": ["А", "Б", "В", "Г"], "ok": [0], "expl": "На карикатурі А радянська корова випереджає американську: Хрущов закликав наздогнати США за виробництвом молока й м’яса. Решта карикатур — про пізніші часи: порожні полиці, мітинги, «бізнес».", "src": "НМТ 2026 – демоваріант (№ 18)"}, {"id": "z36526", "q": "Рішення Верховної Ради СРСР про передання Кримської області до складу УРСР", "sec": "s3", "g": "krym3", "t": "three", "opts": ["прийнято з міркувань економічної доцільності.", "ухвалено з метою забезпечення лояльності української політичної еліти до союзного керівництва.", "передбачало створення головної військово-морської бази СРСР.", "сприяло залученню іноземних інвестицій в економіку півострова.", "приурочено до святкування  для розвитку особистих підсобних господарств", "переведення колгоспів та радгоспів на господарський розрахунок", "підвищення закупівельних цін на сільськогосподарську продукцію", "установлення надбавок за здачу колгоспами понадпланової продукції"], "ok": [2], "expl": "У 1950-х рр. держава кілька разів підвищувала закупівельні ціни на зерно, м’ясо й молоко. Госпрозрахунок у колгоспах і радгоспах намагалися запровадити пізніше.", "src": "Коніщева/Тест 2 № 37"}, {"id": "ct_K4.56", "q": "У чому виявилися ознаки демократизації суспільства в умовах десталінізації?", "sec": "s4", "g": "demokratyzatsia", "t": "three", "opts": ["започаткування політики гласності в суспільстві", "запровадження в державі інституту президентства", "масове звільнення політв’язнів із таборів ГУЛАГу", "ліквідація монополії Комуністичної партії на владу", "розширення прав і повноважень союзних республік", "ослаблення ідеологічного тиску на науку й культуру", "реабілітація учасників українського визвольного руху"], "ok": [2, 4, 5], "expl": "За відлиги з таборів звільнили сотні тисяч політв’язнів, республіки отримали більше прав, а цензура й ідеологічний тиск на науку й культуру послабшали. Решта варіантів — із пізніших часів.", "src": "Коніщева/Тест 4 № 56"}, {"id": "ct_K7.38", "q": "У який період історії УРСР і СРСР з’явився зображений плакат?", "sec": "s5", "g": "tsilyna_plakat", "t": "single", "img": ["q_f4d7f2b516"], "opts": ["відбудови", "«відлиги»", "«застою»", "перебудови"], "ok": [1], "expl": "Плакат «На нові землі їдьмо з нами!» кликав молодь освоювати цілину в Казахстані, на Алтаї й у Сибіру. Цілинна кампанія — одна з надпрограм Хрущова.", "src": "Коніщева/Тест 7 № 38"}, {"id": "ct_V5.37", "q": "За якого періоду постали нові явища в економіці України,  про які свідчать фото документи?", "sec": "s5", "g": "econ_foto", "t": "single", "img": ["q_73d9da9174"], "opts": ["у першому повоєнному десятилітті", "за «відлиги»", "у період «застою»", "за «перебудови»"], "ok": [1], "expl": "На фото — люди біля телевізорів у магазині, новий пасажирський літак і спуск на воду великого судна. Усе це прикмети кінця 1950-х — початку 1960-х рр., тобто відлиги.", "src": "Власов/Варіант 5 № 37"}, {"id": "n101", "q": "Яку посаду обійняв М. Хрущов у вересні 1953 р.?", "sec": "s1", "g": "hrushch_post", "t": "single", "opts": ["першого секретаря ЦК КПРС", "голови Президії Верховної Ради СРСР", "міністра внутрішніх справ СРСР", "голови Ради Міністрів СРСР"], "ok": [0], "expl": "Після смерті Сталіна уряд очолив Г. Маленков, МВС — Л. Берія, а Хрущов керував апаратом ЦК. У вересні 1953 р. його обрали першим секретарем ЦК КПРС, і цей пост допоміг йому усунути суперників.", "src": "нове (за зразком ЗНО)"}, {"id": "n102", "q": "Установіть послідовність подій боротьби за владу в СРСР після смерті Й. Сталіна.", "sec": "s1", "g": "borotba_seq", "t": "seq", "opts": ["арешт Л. Берії під час засідання в Кремлі", "обрання М. Хрущова першим секретарем ЦК КПРС", "відставка Г. Маленкова з посади голови уряду", "усунення з керівництва «антипартійної групи» В. Молотова, Г. Маленкова, Л. Кагановича"], "expl": "Берію заарештували 26 червня 1953 р., Хрущова обрали першим секретарем ЦК КПРС у вересні 1953 р., Маленков пішов з посади голови уряду в лютому 1955 р., а «антипартійну групу» усунули в червні 1957 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n103", "q": "Хто в червні 1953 р. замінив Л. Мельникова на посаді першого секретаря ЦК КПУ?", "sec": "s1", "g": "kyrychenko", "t": "single", "opts": ["П. Шелест", "О. Кириченко", "М. Підгорний", "Л. Мельников"], "ok": [1], "expl": "Мельникова звинуватили в насадженні російської мови в західних областях. Його посаду обійняв Олексій Кириченко — перший за багато років українець на чолі КПУ. Підгорний очолював КПУ в 1957 – 1963 рр., Шелест — з 1963 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n111", "q": "Кого звільнила від покарання амністія, оголошена 27 березня 1953 р.?", "sec": "s2", "g": "amnistia53", "t": "single", "opts": ["вояків Червоної армії, які в роки війни потрапили в німецький полон", "керівників повстань у таборах Норильська, Воркути й Кенгіра", "засуджених на строк до 5 років, літніх, хворих і матерів малих дітей", "політичних в’язнів, засуджених на 10 – 25 років за «зраду батьківщини»"], "ok": [2], "expl": "Амністія звільнила близько 1,2 млн осіб, передусім засуджених на короткі строки. Політичних в’язнів із вироками 10 – 25 років вона майже не стосувалася, тому вони й далі лишалися в особливих таборах.", "src": "нове (за зразком ЗНО)"}, {"id": "n112", "q": "Чого вимагали в’язні під час повстань у таборах Норильська, Воркути й Кенгіра?", "sec": "s2", "g": "vymohy", "t": "single", "opts": ["передати табори під нагляд Червоного Хреста й випустити всіх іноземців", "дозволити створювати в таборах осередки комуністичної партії", "перевести політв’язнів до в’язниць у тих областях, де вони жили", "переглянути справи, скоротити 25-річні строки й зняти номери з одягу"], "ok": [3], "expl": "Повсталі вимагали переглянути справи й скоротити 25-річні строки, зняти номери з одягу та ґрати з вікон бараків, платити за працю й дозволити листування з рідними.", "src": "нове (за зразком ЗНО)"}, {"id": "n113", "q": "Повстання в’язнів якого табору влада придушила із застосуванням танків?", "sec": "s2", "g": "kengir", "t": "single", "opts": ["Кенгірського (Казахстан)", "Магаданського (Колима)", "Воркутинського (Комі АРСР)", "Норильського (Красноярський край)"], "ok": [0], "expl": "У Кенгірі проти в’язнів кинули танки. Значну частину повсталих становили українці — колишні вояки УПА й члени ОУН.", "src": "нове (за зразком ЗНО)"}, {"id": "n114", "q": "Що змінилося в таборах після придушення повстань в’язнів?", "sec": "s2", "g": "taboru_pislia", "t": "single", "opts": ["табори одразу закрили, а всіх в’язнів звільнили без перегляду їхніх справ", "режим пом’якшили: зняли номери з одягу, дозволили листування", "в’язнів із західних областей перевели до таборів ближче до їхніх родин", "режим посилили: заборонили листування з рідними й збільшили норми виробітку"], "ok": [1], "expl": "Повстання жорстоко придушили, але влада зрозуміла, що стара табірна система не працює. Режим пом’якшили, комісії почали масово переглядати справи, а кількість таборів зменшувалася.", "src": "нове (за зразком ЗНО)"}, {"id": "n121", "q": "Як у 1962 р. перейменували місто Станіслав і Станіславську область?", "sec": "s3", "g": "pereimen", "t": "single", "opts": ["на Червоноград і Червоноградську", "на Хмельницький і Хмельницьку", "на Івано-Франківськ і Івано-Франківську", "на Тернопіль і Тернопільську"], "ok": [2], "expl": "Станіслав став Івано-Франківськом у 1962 р. Кам’янець-Подільську область перейменували на Хмельницьку раніше — у 1954 р.", "src": "нове (за зразком ЗНО)"}, {"id": "n122", "q": "Яку назву отримало місто Сталіно після XXII з’їзду КПРС (1961 р.)?", "sec": "s4", "g": "stalino", "t": "single", "opts": ["Дніпропетровськ", "Краматорськ", "Луганськ", "Донецьк"], "ok": [3], "expl": "Після XXII з’їзду, коли Хрущов знову засудив Сталіна, міста, названі його ім’ям, перейменували: Сталіно — на Донецьк, Сталінград — на Волгоград. Луганськ отримав цю назву 1958 р. (до того — Ворошиловград).", "src": "нове (за зразком ЗНО)"}, {"id": "n123", "q": "Чому після депортації 1944 р. господарство Криму занепадало?", "sec": "s3", "g": "krym_zanepad", "t": "single", "opts": ["переселенці з Росії не вміли господарювати в посушливому степу й горах", "влада заборонила вирощувати на півострові виноград і фрукти через нестачу води", "після війни більшість кримських заводів вивезли на Урал і до Сибіру", "Крим відрізали від материка й перестали постачати туди прісну воду й електроенергію"], "ok": [0], "expl": "На місце депортованих кримських татар привезли переселенців переважно з Росії. Вони не знали місцевих умов, урожаї зменшувалися, сади й виноградники занепадали, і чимало переселенців поверталися додому.", "src": "нове (за зразком ЗНО)"}, {"id": "n125", "q": "Яку область утворили в УРСР у січні 1954 р.?", "sec": "s3", "g": "cherkasy", "t": "single", "opts": ["Житомирська", "Черкаська", "Кіровоградська", "Хмельницька"], "ok": [1], "expl": "Черкаську область утворили 7 січня 1954 р. з частин Київської, Кіровоградської, Полтавської й Вінницької. Хмельницька — це перейменована того ж року Кам’янець-Подільська, а не нова область.", "src": "нове (за зразком ЗНО)"}, {"id": "n132", "q": "Про що М. Хрущов НЕ сказав у доповіді «Про культ особи та його наслідки»?", "sec": "s4", "g": "xx_promovchav", "t": "single", "opts": ["депортації чеченців, інгушів і калмиків", "репресії проти членів партії й військових", "Голодомор 1932 – 1933 рр. в Україні", "катування заарештованих під час слідства"], "ok": [2], "expl": "Хрущов засуджував не радянську систему, а «перекручення» Сталіна. Тому про колективізацію, Голодомор і репресії проти української інтелігенції в доповіді не йшлося.", "src": "нове (за зразком ЗНО)"}, {"id": "n133", "q": "Що зробили з тілом Й. Сталіна після XXII з’їзду КПРС (жовтень 1961 р.)?", "sec": "s4", "g": "mavzoley", "t": "single", "opts": ["кремували, а прах розвіяли над Москвою-рікою", "перевезли до Грузії й поховали в рідному місті Горі", "залишили в Мавзолеї поруч із тілом В. Леніна", "винесли з Мавзолею й поховали біля Кремлівської стіни"], "ok": [3], "expl": "На XXII з’їзді Хрущов знову засудив Сталіна. У ніч на 1 листопада 1961 р. його тіло винесли з Мавзолею й поховали біля Кремлівської стіни.", "src": "нове (за зразком ЗНО)"}, {"id": "n134", "q": "Звідки походить назва доби «відлига»?", "sec": "s4", "g": "vidlyha_nazva", "t": "single", "opts": ["від назви повісті Іллі Еренбурга (1954 р.)", "від назви вірша Василя Симоненка (1962 р.)", "з доповіді М. Хрущова на XX з’їзді КПРС", "з промови Г. Маленкова після смерті Й. Сталіна"], "ok": [0], "expl": "«Відлига» — неофіційна назва доби 1953 – 1964 рр., коли режим став м’якшим після сталінських «морозів». Назва походить від повісті Іллі Еренбурга «Відлига».", "src": "нове (за зразком ЗНО)"}, {"id": "n141", "q": "Що держава оголосила у квітні 1957 р. щодо облігацій державних позик? Вона", "sec": "s6", "g": "oblihatsii", "t": "single", "opts": ["відтепер їх треба купувати щомісяця", "відкладає виплати за ними на 20 років", "негайно виплатить усі борги з відсотками", "обміняє їх на квартири в нових будинках"], "ok": [1], "expl": "За Сталіна людей змушували щороку купувати облігації — частину зарплати віддавали державі в борг. У 1957 р. виплати відклали на 20 років, і мільйони людей утратили надію швидко повернути гроші.", "src": "нове (за зразком ЗНО)"}, {"id": "n145", "q": "Як обмінювали гроші під час грошової реформи 1961 р.?", "sec": "s6", "g": "reforma61", "t": "single", "opts": ["5 старих карбованців на 1 новий", "1 старий карбованець на 10 нових", "10 старих карбованців на 1 новий", "100 старих карбованців на 1 новий"], "ok": [2], "expl": "З 1 січня 1961 р. старі гроші обміняли на нові у співвідношенні 10 : 1. Ціни й зарплати теж зменшили вдесятеро.", "src": "нове (за зразком ЗНО)"}, {"id": "n146", "q": "Що таке «комунальна квартира»?", "sec": "s6", "g": "komunalka", "t": "single", "opts": ["окрема квартира, яку держава безкоштовно надає родині в новому будинку", "квартира, яку родина купила в кредит у міської ради на 20 років", "гуртожиток для робітників одного заводу з кімнатами на 4 – 6 осіб", "квартира, де кілька родин мають спільну кухню й ванну"], "ok": [3], "expl": "Після війни мільйони людей жили в бараках, підвалах і комунальних квартирах. Масове житлове будівництво наприкінці 1950-х рр. дало багатьом родинам окреме житло.", "src": "нове (за зразком ЗНО)"}, {"id": "n151", "q": "Що стало приводом до страйку робітників у Новочеркаську в червні 1962 р.?", "sec": "s7", "g": "novocherkask", "t": "single", "opts": ["підвищення цін на м’ясо й масло", "закриття заводу й звільнення робітників", "арешт керівників профспілки заводу", "запровадження карток на хліб"], "ok": [0], "expl": "1 червня 1962 р. держава підвищила ціни на м’ясо й масло. У Новочеркаську застрайкували робітники електровозобудівного заводу, а 2 червня солдати відкрили вогонь по мітингувальниках, загинули 26 людей.", "src": "нове (за зразком ЗНО)"}, {"id": "n152", "q": "Як закінчилося перебування М. Хрущова при владі?", "sec": "s7", "g": "usunennia", "t": "single", "opts": ["його заарештували й засудили, як свого часу Л. Берію", "пленум ЦК КПРС у жовтні 1964 р. звільнив його з усіх посад", "делегати XXII з’їзду КПРС проголосували за його відставку", "він помер на посаді, і владу перебрав О. Косигін"], "ok": [1], "expl": "14 жовтня 1964 р. пленум ЦК КПРС звільнив Хрущова, офіційно — «за станом здоров’я». Його не заарештували, а відправили на пенсію: це теж наслідок відлиги.", "src": "нове (за зразком ЗНО)"}, {"id": "n153", "q": "Хто став першим секретарем ЦК КПРС після усунення М. Хрущова?", "sec": "s7", "g": "pislia_hrushch", "t": "single", "opts": ["О. Косигін", "М. Підгорний", "Л. Брежнєв", "П. Шелест"], "ok": [2], "expl": "Першим секретарем ЦК КПРС став Леонід Брежнєв, головою уряду — Олексій Косигін. Усунення Хрущова готували, зокрема, Брежнєв і Підгорний.", "src": "нове (за зразком ЗНО)"}, {"id": "n161", "q": "Які події відбулися в СРСР у 1953 – 1964 рр.?", "sec": "s8", "g": "podii_53_64", "t": "three", "opts": ["арешт Л. Берії", "Чорнобильська катастрофа", "розстріл робітників у Новочеркаську", "Всесвітній фестиваль молоді й студентів у Москві", "Голодомор в Україні", "ухвалення Декларації про державний суверенітет України", "створення Української Гельсінської групи"], "ok": [0, 2, 3], "expl": "Берію заарештували 1953 р., фестиваль відбувся в Москві 1957 р., розстріл у Новочеркаську — 1962 р. Голодомор (1932 – 1933) був раніше, Українську Гельсінську групу створили 1976 р., Чорнобильська катастрофа сталася 1986 р., Декларацію про державний суверенітет ухвалили 1990 р.", "src": "нове (за зразком ЗНО)"}, {"id": "m1s2_3", "q": "Кого амністія 1953 р. майже не стосувалася?", "sec": "s2", "g": "amnistia53", "t": "single", "opts": ["засуджених на малі строки", "політичних в’язнів", "літніх і хворих", "вагітних жінок"], "ok": [1], "expl": "Політв’язні мали строки по 10 – 25 років, а амністія звільняла засуджених на строк до 5 років, літніх, хворих, вагітних і матерів малих дітей.", "src": "нове (власне)"}, {"id": "m1s2_6", "q": "Хто становив значну частину повсталих у таборах?", "sec": "s2", "g": "", "t": "single", "opts": ["німецькі військовополонені", "колишні партійні працівники", "колишні офіцери царської армії", "українці — учасники ОУН і УПА"], "ok": [3], "expl": "В особливих таборах було багато українців, засуджених на 10 – 25 років за участь у визвольному русі. У Кенгірі українці становили майже половину в’язнів.", "src": "нове (власне)"}, {"id": "m1s3_5", "q": "Яку назву 1954 р. отримала Кам’янець-Подільська область?", "sec": "s3", "g": "", "t": "single", "opts": ["Чернівецька", "Тернопільська", "Вінницька", "Хмельницька"], "ok": [3], "expl": "Кам’янець-Подільську область 1954 р. перейменували на Хмельницьку.", "src": "нове (власне)"}, {"id": "m1s3_6", "q": "До якої області 1954 р. приєднали Ізмаїльську?", "sec": "s3", "g": "", "t": "single", "opts": ["до Одеської", "до Херсонської", "до Вінницької", "до Миколаївської"], "ok": [0], "expl": "Ізмаїльську область приєднали до Одеської 15 лютого 1954 р.", "src": "нове (власне)"}, {"id": "m1s4_6", "q": "Що стало одним із наслідків політики десталінізації в другій половині 1950-х рр.?", "sec": "s4", "g": "", "t": "single", "opts": ["зняття портретів і пам’ятників Сталіна", "припинення переслідування інакодумців", "скасування керівної ролі партії", "ліквідація ідеологічного контролю"], "ok": [0], "expl": "Після ХХ з’їзду портрети й пам’ятники Сталіна почали знімати. Партія й ідеологічний контроль залишилися.", "src": "кахут учителя (№ 9)"}, {"id": "m1s8_3", "q": "Період 1953 – 1964 рр. відомий в історії України під назвою", "sec": "s8", "g": "", "t": "single", "opts": ["доба десталінізації", "доба застою", "доба перебудови", "доба відбудови"], "ok": [0], "expl": "1953 – 1964 рр. — доба десталінізації, або відлига. Відбудова була до неї, застій і перебудова — після.", "src": "кахут учителя (№ 78)"}]}, "2": {"n": 30, "pass": 75, "timer": true, "quota": {"s1": 6, "s2": 5, "s3": 5, "s4": 5, "s5": 5, "s6": 4}, "pool": [{"id": "z10239", "q": "Установіть відповідність між прізвищем діяча та сферою його діяльності.", "sec": "s6", "g": "diyach_sfera", "t": "match", "opts": ["кіномистецтво", "електрозварювання", "поетичне мистецтво", "образотворче мистецтво", "літакобудування"], "ok": [2, 4, 0, 3], "left": ["Л. Костенко", "О.Антонов", "Л. Биков", "А. Горська"], "expl": "Ліна Костенко — поетеса, Олег Антонов — авіаконструктор, Леонід Биков — кіноактор і режисер, Алла Горська — художниця. Варіант «електрозварювання» тут зайвий.", "src": "ЗНО 2017 – пробний тест (№ 26)"}, {"id": "z19385", "q": "Укажіть один з осередків шістдесятників в Україні.", "sec": "s2", "g": "suchasnyk", "t": "single", "opts": ["Меджліс кримськотатарського народу в Сімферополі", "Українська робітничо-селянська спілка у Львові", "Організація українських націоналістів у Відні", "Клуб творчої молоді «Сучасник» у Києві"], "ok": [3], "expl": "Осередком шістдесятників у Києві був Клуб творчої молоді «Сучасник». Українська робітничо-селянська спілка — підпільна організація на Львівщині, а не клуб митців.", "src": "ЗНО 2020 – пробний тест (№ 19)"}, {"id": "z22086", "q": "Установіть послідовність описаних подій.", "sec": "s4", "g": "nauka_seq", "t": "seq", "opts": ["«Інститут електрозварювання АН УРСР на чолі з академіком Є. Патоном застосував новий метод автоматичного дугового зварювання під флюсом корпусів танків. Завдяки цьому покращилася якість танків, зросли темпи їхнього виробництва».", "«Українські вчені досягли значних результатів: уведено в дію перший експериментальний атомний реактор, в Інституті електротехніки АН УРСР під керівництвом С. Лебедєва створено першу в СРСР малу електронно-обчислювальну машину «МЕОМ».", "«Науково-технічна революція сприяла швидкому становленню кібернетики, із якою пов’язувалися перспективи розбудови атомної енергетики, реактивної авіації. Тому у структурі АН УРСР створюється Інститут кібернетики, який очолив академік В. Глушков».", "«У рамках створення ракетно-космічного комплексу «Морський старт» конструкторське бюро «Південне» (Дніпропетровськ) на чолі з академіком В. Уткіним створило унікальну ракету-носій «Зеніт–3SL», яка вперше у світовій практиці стартувала в космос із плавучої платформи»."], "expl": "Метод зварювання корпусів танків застосували в роки Другої світової війни, МЕОМ (МЕСМ) С. Лебедєва — 1950 – 1951 рр., Інститут кібернетики В. Глушкова — 1962 р., ракета «Зеніт» стартувала з плавучої платформи вже в незалежній Україні (1999 р.).", "src": "ЗНО 2010 – додаткова сесія (№ 60)"}, {"id": "z22131", "q": "Що було характерним для українського дисидентського руху середини 1950 – початку 1960-х рр.?", "sec": "s1", "g": "dys_rysa", "t": "single", "opts": ["організаційне становлення (гуртки, спілки, об’єднання), прагнення досягти мети конституційними методами (агітаційно-пропагандистські акції)", "проведення масових мирних акцій протесту та громадянської непокори (демонстрації, мітинги, бойкоти дій місцевої адміністрації)", "поєднання масових акцій протесту (демонстрації, мітинги) з акціями, спрямованими на дезорганізацію владних структур (страйки, повстання)", "орієнтація на насильницьку боротьбу (підготовка терористичних актів, замахів на урядовців), перехід на нелегальне становище"], "ok": [0], "expl": "Перші дисиденти гуртувалися в невеликі спілки й хотіли діяти мирно, за Конституцією: писали програми й листівки. Масових протестів і насильства не було.", "src": "ЗНО 2011 – додаткова сесія (№ 45)"}, {"id": "z39220", "q": "Поєднайте уривок джерела (1–4) з ім’ям мисткині (А – Д), про творчість якої в ньому йдеться.", "sec": "s5", "g": "myst_match", "t": "match", "opts": ["Тетяна Яблонська", "Алла Горська", "Катерина Білокур", "Марія Примаченко", "Соломія Крушельницька"], "ok": [3, 2, 0, 1], "left": ["«Художниця малювала тварин протягом усього життя: вони і добрі, і злі, і дурнуваті та хитрі. Навіть найстрашнішого звіра чи жахливий четвертий енергоблок майстриня розцяцьковувала…»", "«Квіти, намальовані нею, упізнають одразу, бо вони ніби висять у повітрі й випромінюють світло… Між тим, художниця, як і всі українські селяни в СРСР на той час, не мала навіть паспорта. Однак сила її таланту була такою, що пробилася навіть крізь \"залізну завісу\"…»", "«Картина \"Хліб\"…є однією з найпопулярніших її картин. Художниця зобразила період сільського життя за кілька років після закінчення Другої світової війни. Картина виконана ніби в тогочасній пропагандистській манері, але насправді вона глибинна і дає варіативність під час прочитання…»", "«Партійне керівництво назвало твір [вітраж \"Шевченко. Мати\"] формалістично-ворожим: \"Чому мати-Україна така сумна? Який суд, яку кару і на кого накликає Тарас? І взагалі, чому це Україна за ґратами?\" Замість офіційного відкриття, щойно вітраж було закінчено, його розтрощили на тисячі друзок…»"], "expl": "Фантастичних звірів малювала Марія Приймаченко, квіти, що ніби світяться, — Катерина Білокур, картину «Хліб» — Тетяна Яблонська, вітраж «Шевченко. Мати» створювала Алла Горська з іншими художниками. Соломія Крушельницька — співачка.", "src": "НМТ 2026 – 2 сесія (№ 24)"}, {"id": "z37267", "q": "Дисидентський рух в УРСР наприкінці 1950 – на початку 1960-х рр.", "sec": "s1", "g": "dys_3", "t": "three", "opts": ["використовував ненасильницькі форми боротьби.", "виступав за діяльність у межах Конституції УРСР.", "був локалізований на території Західної України.", "організовував багатотисячні демонстрації у великих містах.", "підтримував тісні зв’язки із Заходом.", "охоплював різні соціальні групи населення.", "був спрямований проти засад марксизму-ленінізму."], "ok": [0, 1, 5], "expl": "Перші дисиденти не мали зброї, посилалися на Конституцію й походили з різних середовищ — учителі, юристи, робітники, селяни. Масових демонстрацій і сталих зв’язків із Заходом тоді не було, і діяли вони не лише на заході України.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38006", "q": "Яка організація або спілка об’єднувала Аллу Горську, Василя Симоненка, Леся Танюка та Івана Світличного?", "sec": "s2", "g": "suchasnyk", "t": "single", "opts": ["Українська робітничо-селянська спілка (УРСР)", "самвидав «Український вісник»", "Клуб творчої молоді «Сучасник»", "Українська громадська група сприяння виконанню Гельсінських угод (УГГ)"], "ok": [2], "expl": "Горська, Симоненко, Танюк і Світличний були членами Клубу творчої молоді «Сучасник» у Києві. Українська Гельсінська група й «Український вісник» з’явилися пізніше, у добу застою.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38545", "q": "Що свідчить про появу дисидентського руху в Україні?", "sec": "s1", "g": "dys_poyava", "t": "single", "opts": ["діяльність Української Гельсінської групи", "вихід самвидаву «Український вісник»", "протест у кінотеатрі «Україна»", "створення Української робітничо-селянської спілки"], "ok": [3], "expl": "Першою дисидентською організацією вважають Українську робітничо-селянську спілку. Українська Гельсінська група й «Український вісник» з’явилися пізніше, а протест у кінотеатрі «Україна» — 1965 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z1617", "q": "Розвиток якої галузі промисловості Української РСР у 1950—1980-х рр. пов’язаний з іменем конструктора О. К. Антонова?", "sec": "s4", "g": "antonov", "t": "single", "opts": ["автомобілебудівної", "верстатобудівної", "суднобудівної", "авіабудівної"], "ok": [3], "expl": "Олег Антонов — авіаконструктор. Його київське конструкторське бюро створювало літаки «Ан», зокрема пасажирський Ан-24.", "src": "ЗНО 2013 – пробний тест (№ 39)"}, {"id": "z8234", "q": "На фото зображено", "sec": "s5", "g": "slipyi_foto", "t": "single", "img": ["q_d2b7608433"], "opts": ["А. Мельника, голову Проводу українських націоналістів.", "А. Волошина, президента Карпатської України.", "В. Липинського, засновника українського монархічного руху.", "Й. Сліпого, митрополита Української греко-католицької церкви."], "ok": [3], "expl": "На фото — митрополит Йосип Сліпий, глава Української греко-католицької церкви. Він провів у таборах 18 років, а в лютому 1963 р. його звільнили й відправили до Рима.", "src": "ЗНО 2015 – додаткова сесія (№ 37)"}, {"id": "z36498", "q": "Визначте ім'я зображеного на фото діяча.", "sec": "s5", "g": "slipyi_foto", "t": "single", "img": ["q_b30d661dfe"], "opts": ["А. Мельник, голова Проводу українських націоналістів", "А. Волошин, президент Карпатської України", "В. Липинський, засновник українського монархічного руху.", "Й. Сліпий, митрополит Української греко-католицької церкви"], "ok": [3], "expl": "На фото — митрополит Йосип Сліпий, глава Української греко-католицької церкви. Він провів у таборах 18 років, а в лютому 1963 р. його звільнили й відправили до Рима.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z22072", "q": "Як «велике явище другої половини XX ст., дивне своєю появою в пору відлиги та стоїчним протистоянням неосталінізму» охарактеризовано творчість", "sec": "s2", "g": "60_tvorch", "t": "single", "opts": ["Ю. Смолича, М. Хвильового.", "В. Симоненка, І. Світличного.", "О. Теліги, Є. Маланюка.", "П. Панча, А. Головка."], "ok": [1], "expl": "Ці слова — про шістдесятників, що почали творити за відлиги. Василь Симоненко й Іван Світличний належали до цього покоління, а Хвильовий, Теліга, Маланюк, Смолич, Панч, Головко — до старших поколінь.", "src": "ЗНО 2010 – додаткова сесія (№ 46)"}, {"id": "z24878", "q": "Діячів, зображених на фото, єднає приналежність до", "sec": "s2", "g": "60_foto", "t": "single", "img": ["q_511c322637"], "opts": ["дисидентського руху.", "Української робітничо-селянської спілки.", "руху «шістдесятників».", "організаторів повстань у сталінських концтаборах."], "ok": [2], "expl": "На фото — Василь Симоненко (ліворуч) і Василь Стус (праворуч), поети-шістдесятники. Симоненко помер 1963 р. і дисидентом не був; до УРСС і табірних повстань вони стосунку не мали.", "src": "ЗНО 2021 – додаткова сесія (№ 17)"}, {"id": "z34357", "q": "У якій галузі мистецтва уславилися Тетяна Яблонська, Катерина Білокур, Марія Примаченко?", "sec": "s5", "g": "zhyvopys", "t": "single", "opts": ["кінематографі", "живописі", "літературі", "архітектурі"], "ok": [1], "expl": "Тетяна Яблонська, Катерина Білокур і Марія Приймаченко — художниці. Білокур і Приймаченко — майстрині народного «наївного» живопису.", "src": "НМТ 2025 – 2 сесія (№ 17)"}, {"id": "ct_K2.38", "q": "Укажіть прізвище зображеного на фото історичного діяча:", "sec": "s3", "g": "dziuba", "t": "single", "img": ["q_ca6e8ad29f"], "opts": ["І. Дзюба", "С. Параджанов", "М. Руденко", "В. Стус"], "ok": [0], "expl": "На фото — літературний критик Іван Дзюба. У 1965 р. він виступив на прем’єрі «Тіней забутих предків» проти арештів і написав працю «Інтернаціоналізм чи русифікація?».", "src": "Коніщева/Тест 2 № 38"}, {"id": "n201", "q": "Що було характерним для опору режиму в УРСР наприкінці 1950-х — на початку 1960-х рр.?", "sec": "s1", "g": "pidpillia", "t": "single", "opts": ["масова збройна боротьба загонів УПА в Карпатах і на Волині", "загальний страйк шахтарів Донбасу з вимогою незалежності", "діяльність опозиційних партій у Верховній Раді УРСР", "поява невеликих підпільних груп, які поширювали листівки"], "ok": [3], "expl": "Збройне підпілля ОУН і УПА знищили на початку 1950-х рр. Згодом виникали невеликі групи — Український національний комітет у Львові, Об’єднана партія визволення України. Їхні учасники писали й поширювали листівки.", "src": "нове (за зразком ЗНО)"}, {"id": "n202", "q": "Прочитайте уривок з доповідної записки КДБ УРСР (початок 1960-х рр.): «Управлінням КДБ по Запорізькій області припинено ворожу діяльність антирадянської групи в місті Мелітополі… У місті Черкаси виявлено антирадянську групу з трьох осіб… На території Кримської області встановлено антирадянську групу під назвою „Вільна Таврія“, що складалася з 10 учнів 8 – 9 класів». Про що свідчить документ?", "sec": "s1", "g": "kdb_doc", "t": "single", "opts": ["антирадянські групи діяли не лише в західних областях УРСР", "КДБ не вдавалося викрити жодної підпільної групи", "антирадянські групи об’єднувалися довкола УРСС", "підпільні групи складалися переважно з вояків УПА"], "ok": [0], "expl": "Документ називає групи в Мелітополі, Черкасах і Криму, тобто не лише на заході України. У «Вільній Таврії» були навіть школярі. КДБ такі групи швидко викривав.", "src": "нове (за зразком ЗНО)"}, {"id": "n203", "q": "Чим дисиденти відрізнялися від учасників підпілля ОУН?", "sec": "s1", "g": "dys_3", "t": "single", "opts": ["підтримували політику КПРС щодо національних мов", "не мали зброї й посилалися на Конституцію СРСР", "боролися за повернення до сталінських порядків", "діяли лише за кордоном, у середовищі еміграції"], "ok": [1], "expl": "Дисиденти не закликали до збройної боротьби. Вони посилалися на Конституцію СРСР, яка на папері гарантувала свободу слова й право республік на вихід із Союзу.", "src": "нове (за зразком ЗНО)"}, {"id": "n204", "q": "Кого називають дисидентами?", "sec": "s1", "g": "dys_poniattia", "t": "single", "opts": ["учасників збройного підпілля, які після війни переховувалися в лісах", "письменників, які писали лише за канонами соціалістичного реалізму", "людей, які відкрито не погоджувалися з офіційною ідеологією й політикою влади", "партійних керівників, які виступали проти реформ М. Хрущова"], "ok": [2], "expl": "Слово «дисидент» походить від латинського dissidens — незгодний. Влада переслідувала таких людей: звільняла з роботи, виключала з вишів, арештовувала.", "src": "нове (за зразком ЗНО)"}, {"id": "n205", "q": "Як влада карала учасників підпільних груп, викритих КДБ наприкінці 1950-х — на початку 1960-х рр.?", "sec": "s1", "g": "kdb_sud", "t": "single", "opts": ["обмежувалися попередженням і відпускали під нагляд комсомолу", "виселяли за кордон без права повернутися до СРСР", "призначали штраф і звільняли з роботи без суду", "засуджували за «антирадянську агітацію» до багатьох років таборів"], "ok": [3], "expl": "КДБ швидко викривав такі групи. Навіть за листівки суд давав багато років таборів, а декого засудив до розстрілу.", "src": "нове (за зразком ЗНО)"}, {"id": "n211", "q": "Що в 1962 р. виявили члени клубу «Сучасник» у Биківнянському лісі під Києвом?", "sec": "s2", "g": "bykivnia", "t": "single", "opts": ["місця таємних поховань людей, розстріляних НКВС у 1937 – 1941 рр.", "місця поховань в’язнів Сирецького концтабору", "братські могили воїнів, загиблих під час оборони Києва 1941 р.", "залишки давньоруського городища часів Київської Русі"], "ok": [0], "expl": "Шістдесятники з’ясували, що там поховано тисячі жертв НКВС, а влада казала, що це жертви нацистів. Правду визнали лише 1989 р.; тепер там заповідник «Биківнянські могили».", "src": "нове (за зразком ЗНО)"}, {"id": "n212", "q": "У чиїй київській квартирі на початку 1960-х рр. збиралися молоді митці, читали заборонені книжки й самвидав?", "sec": "s2", "g": "svitlychnyi", "t": "single", "opts": ["Максима Рильського", "Івана Світличного", "Леся Танюка", "Олеся Гончара"], "ok": [1], "expl": "Літературознавець Іван Світличний — один із лідерів шістдесятників. Він читав лекції в «Сучаснику» й допомагав молодим поетам. У 1965 р. його вперше заарештували.", "src": "нове (за зразком ЗНО)"}, {"id": "n213", "q": "Хто читав у Клубі творчої молоді «Сучасник» лекції про літературу?", "sec": "s2", "g": "suchasnyk", "t": "single", "opts": ["С. Вірун, І. Кандиба, В. Луцьків", "О. Гончар, М. Рильський, М. Бажан", "І. Дзюба, І. Світличний, Є. Сверстюк", "С. Параджанов, Ю. Іллєнко, І. Миколайчук"], "ok": [2], "expl": "Клуб діяв у Києві з 1959 р. при комсомолі. Про літературу там говорили Дзюба, Світличний і Сверстюк, про історію — Михайло Брайчевський, а молоді поети читали свої вірші.", "src": "нове (за зразком ЗНО)"}, {"id": "n214", "q": "Як називався клуб творчої молоді, що з 1962 р. діяв у Львові?", "sec": "s2", "g": "prolisok", "t": "single", "opts": ["«Сучасник»", "«Соняшник»", "«Вітрила»", "«Пролісок»"], "ok": [3], "expl": "Після київського «Сучасника» клуби з’явилися в інших містах, у Львові — «Пролісок» (1962). У 1963 – 1964 рр. влада клуби закрила.", "src": "нове (за зразком ЗНО)"}, {"id": "n216", "q": "Установіть відповідність між діячем і фактом його (її) діяльності в 1959 – 1965 рр.", "sec": "s6", "g": "60_match", "t": "match", "opts": ["заснував Українську робітничо-селянську спілку", "разом з іншими художниками створила вітраж «Шевченко. Мати»", "очолив Клуб творчої молоді «Сучасник»", "у його квартирі збиралися молоді митці й читали самвидав", "написав працю «Інтернаціоналізм чи русифікація?»"], "ok": [2, 3, 1, 4], "left": ["Лесь Танюк", "Іван Світличний", "Алла Горська", "Іван Дзюба"], "expl": "Танюк — режисер, голова «Сучасника»; Світличний — критик, у його квартирі збиралися шістдесятники; Горська — художниця, співавторка вітража 1964 р.; Дзюба — автор праці 1965 р. Варіант про УРСС зайвий: жоден із цих діячів її не засновував.", "src": "нове (за зразком ЗНО)"}, {"id": "n221", "q": "Яка подія 1 грудня 1962 р. засвідчила, що ставлення М. Хрущова до митців змінилося?", "sec": "s3", "g": "manezh", "t": "single", "opts": ["відвідини виставки художників у московському Манежі", "закриття Київської кіностудії художніх фільмів імені О. Довженка", "нагородження молодих поетів Шевченківською премією в Кремлі", "дозвіл видати в СРСР твори письменників-емігрантів"], "ok": [0], "expl": "На виставці в Манежі Хрущов грубо лаяв художників-авангардистів, назвав їхні роботи «неподобством» і погрожував їм. Навесні 1963 р. він вимагав від митців «партійності», цензура посилилася.", "src": "нове (за зразком ЗНО)"}, {"id": "n222", "q": "Що сталося з вітражем «Шевченко. Мати» в Київському університеті навесні 1964 р.?", "sec": "s3", "g": "vitrazh", "t": "single", "opts": ["його перенесли до Національного музею Т. Шевченка в Києві", "його знищили за наказом партійного керівництва ще до відкриття", "його урочисто відкрили до 150-річчя від дня народження Т. Шевченка", "його вивезли на міжнародну виставку українського мистецтва до Парижа"], "ok": [1], "expl": "Вітраж створили Алла Горська, Опанас Заливаха, Людмила Семикіна, Галина Севрук і Галина Зубченко. Його знищили, визнали «ідейно ворожим», а Горську й Семикіну виключили зі Спілки художників.", "src": "нове (за зразком ЗНО)"}, {"id": "n223", "q": "Під час прем’єри якого фільму 4 вересня 1965 р. в київському кінотеатрі «Україна» відбувся протест проти арештів інтелігенції?", "sec": "s3", "g": "kinoteatr", "t": "single", "opts": ["«Земля»", "«Білий птах з чорною ознакою»", "«Тіні забутих предків»", "«Поема про море»"], "ok": [2], "expl": "На прем’єрі Іван Дзюба вийшов на сцену й розповів про арешти. Цей протест вважають першим публічним виступом проти політичних арештів в Україні після війни.", "src": "нове (за зразком ЗНО)"}, {"id": "n224", "q": "Що з наведеного стосується біографії Василя Стуса 1960-х рр.?", "sec": "s3", "g": "stus", "t": "single", "opts": ["працював у черкаських газетах і видав у 1962 р. першу збірку «Тиша і грім»", "був засуджений до розстрілу за створення Української робітничо-селянської спілки", "очолював Клуб творчої молоді «Сучасник» і ставив вистави його театральної студії", "навчався в аспірантурі Інституту літератури, звідки його виключили 1965 р."], "ok": [3], "expl": "З 1963 р. Стус навчався в аспірантурі. Після протесту на прем’єрі у вересні 1965 р. його звідти виключили. Арештували його пізніше, у 1972 р. Інші варіанти стосуються Л. Танюка, Л. Лук’яненка й В. Симоненка.", "src": "нове (за зразком ЗНО)"}, {"id": "n225", "q": "Яку працю про становище української мови й культури написав Іван Дзюба в 1965 р.?", "sec": "s3", "g": "dziuba", "t": "single", "opts": ["«Інтернаціоналізм чи русифікація?»", "«Репортаж із заповідника імені Берії»", "«Собор у риштованні»", "«Лихо з розуму»"], "ok": [ ", "opts": ["юристи, заснували підпільну спілку", "літературні критики, читали лекції в «Сучаснику»", "художники, створили вітраж в університеті", "учені, працювали в Академії наук"], "ok": [1], "expl": "Усі троє — літературні критики, які читали в клубі «Сучасник» лекції про літературу.", "src": "нове (власне)"}]}}, "tests": {"t1": {"name": "Тест 1 · допуск", "tasks": [{"id": "T1.1", "n": 1, "t": "single", "q": "Якою цифрою на картосхемі позначено регіон, що увійшов до складу УРСР у 1954 році?", "sec": "", "g": "", "img": ["q_3ca5fab25f"], "opts": ["1", "2", "3", "4"]}, {"id": "T1.4", "n": 2, "t": "single", "q": "Коли відбувалися події, описані в уривку з історичного джерела: «Вони були першими, хто підняв повстання в серці ГУЛАГу.., які струснули основи радянської репресивної машини. Їхнім прапором був чорний — з червоною смугою. Тоді одночасно застрайкувало понад 20 тисяч політв'язнів Норильська, 70 % з яких були українцями.»?", "sec": "", "g": "", "opts": ["1941-1945 рр", "1946-1947 рр", "1953-1954 рр", "1959-1961 рр"]}, {"id": "T1.5", "n": 3, "t": "single", "q": "У 1957 р. Центральне розвідувальне управління США підготувало доповідь з характеристикою регіонів України за ступенем сприяння американським силам спеціальних операцій на випадок можливої війни з СРСР. Якому з регіонів надано таку характеристику: «У цьому регіоні спеціальні сили можуть отримати значну підтримку місцевого населення включно з його активною участю в діях проти радянського режиму…»?", "sec": "", "g": "", "opts": ["Східній Україні", "Центральній Україні", "Південній Україні", "Західній Україні"]}, {"id": "T1.6", "n": 4, "t": "single", "q": "Що було однією зі складових політики десталінізації (1953-1964 рр.)?", "sec": "", "g": "", "opts": ["Реорганізація партійного апарату та створення національних комуністичних партій", "Ліквідація ГУЛАГу, відновлення в правах незаконно звинувачених і засуджених осіб", "Скасування монополії КПРС на владу, передання влади З'їзду народних депутатів СРСР", "Лі звищами митців і фактами їхньої творчої біографії.", "sec": "", "g": "", "opts": ["поет, прозаїк, автор збірок «Тиша і грім», «Земне тяжіння», «Лебеді материнства»", "художниця, графік, автор полотен «Прип’ять. Пором», «Біля річки», співавтор вітражу «Тарас Шевченко»", "поет, автор збірок «Протуберанці серця», «Корінь і крона», сценаріїв фільмів «Криниця для спраглих», «Камінний хрест»", "поетеса, автор збірок «Проміння землі», «Мандрівки серця», романів у віршах «Маруся Чурай», «Берестечко»", "кінорежисер, автор фільмів «Українська рапсодія», «Квітка на камені», «Тіні забутих предків», «Цвіт граната»"], "left": ["А. Горська", "В. Симоненко", "Л. Костенко", "І. Драч"]}, {"id": "T2.40", "n": 23, "t": "match", "q": "Установіть відповідність між прізвищем діяча та висловлюванням, що йому належить.", "sec": "", "g": "", "opts": ["«Потрібно примусити себе працювати: фізично і розумово, важко і багато. Для цього необхідні мотиви, надзавдання! Для мене таким “надзавданням” були спочатку хірургія, а згодом - наука і написання книг...»", "«За фахом я математик, і мій науковий потяг до питань теоретичної фізики пояснюється тим, що в цій галузі багато захоплюючих проблем, успішне розв’язання яких залежить від розробки математичних методів...»", "«Враховуючи їх виняткове значення для нашого народного господарства, а також відсутність у Союзі будь-якого досвіду їх побудови і експлуатації, я прийняв рішення якомога швидше створити малу електронну лічильну машину»", "«Найцікавіша частина нашої роботи - це краса в техніці... Конструктор часто може йти від краси до техніки, від рішень естетичних до рішень технічних. Ми добре знаємо, що красивий літак літає добре, а негарний - погано, або й взагалі не літатиме...»", "«Вже 10 років пройшло, як ми розробили нову технологію високочастотного електрозварювання живих тканин. Ми маємо відповідні свідоцтва, міжнародні сертифікати, які дозволяють проводити такі хірургічні операції безпосередньо на людині...»"], "left": ["Б. Патон", "О. Антонов", "С. Лебедєв", "М. Амосов"]}, {"id": "T2.44", "n": 24, "t": "match", "q": "Установіть відповідність між портретами діячів (А – Г) та уривками про них.", "sec": "", "g": "", "img": ["q_adce4ae72c"], "opts": ["А починалося все восени 1965 року - під час прем'єри фільму Сергія Параджанова «Тіні забутих предків» у кінотеатрі «Україна» в Києві він крикнув: «Встаньте, хто не згоден з владою!» Він разом з Іваном Дзюбою, В'ячеславом Чорноволом, Юрієм Бадзьом закликали партійних керівників і населення столиці засудити арешти української інтелігенції.", "Сталін любив гуляти з українським режисером нічним Кремлем. Про що вони говорили, певно, йшлося в тих щоденникових записах, які не збереглися. Але сам він розумів, що відбувається, хоча й мав до того ілюзії щодо комунізму. Так, у щоденнику він чітко пише про 6 мільйонів загиблих українців під час Голодомору, саме від нього доходить до нас перша інформація про чорносвитників", "За розподілом був спрямований штатним пропагандистом райкому партії в Радехівський район Львівської області, де й поселився з дружиною. Робота була пов’язана з постійними поїздками по селах району. Разом зі Степаном Віруном і Василем Луцьківим вирішили створити підпільну партію — Українську робітничо-селянську спілку (УРСС).", "У ті роки він, уже не голова Спілки письменників, але депутат і кандидат у члени ЦК, гостро відчуває своє безсилля: «25.01.1981. Вчора на парткомі знову виступив про черговий наступ на історичні пам’ятки Києва, про сваволю київських городничих, про розтрощену альтанку на Володимирській гірці, зруйнований будинок Сошенка, а перед тим спалили музей Заньковецької…", "Перетворення не надто відомого поета й журналіста з Черкас на «обранця, вустами якого промовляє доля нації» (за словами діаспорного критика І. Кошелівця) відбулося фактично протягом двох-трьох років (1964-66) після передчасної смерті."], "left": ["А", "Б", "В", "Г"]}, {"id": "T1.44", "n": 25, "t": "seq", "q": "Установіть послідовність створення радянських агітаційних олодування.", "Його новела «Модри Камень» написана в романтично-піднесеному стилі. Несміливе і нерозквітле кохання, яке зароджувалось між радянським бійцем і словацькою дівчиною, виступає як засудження війни. Це засудження значно глибше за інші фактори, бо немає нічого страшнішого за вбите прекрасне людське почуття.", "У 1956 р. написав кіноповість «Поема про море» про будівництво Каховської ГЕС і затоплення придніпровських сіл. Його ім’я згодом присвоїли Київській кіностудії.", "У 1948 його відзначено найвищою тоді нагородою - Сталінською премією, але в 1951 митець знову зазнав гострих нападів критики, приводом до чого була стаття в газеті \"Правда\", яка обвинувачувала його у \"буржуазному націоналізмі\" за патріотичну поезію \"Любіть Україну\", написану 1944 р.", "Ще студентом театрального інституту заснував і очолив клуб творчої молоді. Його вистави в Києві забороняли, тож понад двадцять років він ставив їх у Москві та інших містах."], "left": ["Олесь Гончар", "Володимир Сосюра", "Лесь Танюк", "Олександр Довженко"]}, {"id": "T1.50", "n": 24, "t": "match", "q": "Установіть відповідність між назвами періодів в історії України та поняттями й термінами, які потрібно використовувати, характеризуючи їх.", "sec": "", "g": "", "opts": ["Реформа, раднаргоспи, культ особи, демократизація, реабілітація, «шістдесятники».", "Холодна війна, голод, «жданівщина», радянізація, «безрідний космополітизм».", "П’ятирічка, колективізація, «закон про п’ять колосків», Голодомор, масові репресії, «розстріляне відродження».", "«Розвинутий соціалізм», номенклатура, дефіцит, правозахисники, «самвидав», неосталінізм.", "Мобілізація, евакуація, Голокост, «новий порядок», рух Опору, депортація."], "left": ["Радянська модернізація (1929-1938)", "Україна в Другій світовій війні (1939–1945)", "Післявоєнна відбудова (1945-початок 1950-х)", "Десталінізація (1953-1964)"]}, {"id": "T2.37", "n": 25, "t": "seq", "q": "Встановіть хронологічну послідовність наведених у документах подій", "sec": "", "g": const COURSE_API = "https://script.google.com/macros/s/AKfycby3DMmeIAWr-c2QOMcjTxfcIMSboKj_o34F9ujiw5DmC69fDWWMmt4AKW-o6x52E6u8/exec";

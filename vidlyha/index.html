скіз вітража «Шевченко. Мати», 1964 р. WikiArt"}]}, {"type": "text", "kicker": "Після відлиги", "title": "Протест у кінотеатрі «Україна» (1965)", "badges": [], "paras": ["Після усунення Хрущова влада вирішила придушити рух шістдесятників. У **серпні – вересні 1965 р.** КДБ заарештував понад 20 осіб: Івана Світличного, братів Горинів, Опанаса Заливаху, Валентина Мороза та інших.", "**4 вересня 1965 р.** у київському кінотеатрі **«Україна»** відбувалася прем’єра фільму Сергія Параджанова **«Тіні забутих предків»**. Літературний критик **Іван Дзюба** вийшов на сцену й розповів про арешти. Його підтримали **В’ячеслав Чорновіл** і **Василь Стус**, який закликав глядачів устати на знак протесту.", "Того ж року Дзюба написав працю **«Інтернаціоналізм чи русифікація?»** про становище української мови й культури.", "Протест у кінотеатрі «Україна» вважають першим публічним виступом проти політичних арештів в Україні після війни. Про подальшу долю дисидентів — у темі «доба застою»."], "imgs": [{"key": "stus80", "cap": "Василь Стус. Фото з кримінальної справи КДБ, 1980 р. Фото: Official KGB photo from Stus file after arrest 1980 / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Персоналія", "title": "Василь Стус (1938 – 1985)", "badges": ["НМТ: персоналія", "портрет"], "paras": ["Поет, перекладач, літературознавець. Народився на Вінниччині, виріс на Донбасі. Після педагогічного інституту вчителював, служив в армії, з **1963 р.** навчався в аспірантурі Інституту літератури в Києві.", "**4 вересня 1965 р.** на прем’єрі «Тіней забутих предків» підтримав протест Івана Дзюби. Його виключили з аспірантури.", "У **1972 р.** Стуса заарештували й засудили до 5 років таборів і 3 років заслання. Після повернення в **1979 р.** він вступив до **Української Гельсінської групи**, а 1980 р. його засудили вдруге — до 10 років таборів і 5 років заслання.", "Загинув **4 вересня 1985 р.** у таборі на Пермщині під час голодування. У 1989 р. його перепоховали в Києві. Збірку віршів «Палімпсести» Стус написав у неволі.", "__Ця постать з’явиться й у темі__ «Україна в період загострення кризи радянської системи» (доба застою)."], "imgs": [{"key": "s070_image96", "cap": "Василь Стус. Фото з архіву КДБ."}]}]}, {"id": "s4", "num": "IV", "title": "Освіта й наука", "sub": "Шкільна реформа 1958 – 1959 рр., Академія наук, кібернетика, космос", "cover": {"key": "sputnik", "cap": ""}, "cards": [{"type": "text", "kicker": "Освіта", "title": "Шкільна реформа 1958 – 1959 рр.", "badges": [], "paras": ["У грудні **1958 р.** ухвалили союзний закон **«Про зміцнення зв’язку школи з життям»**, у квітні **1959 р.** — такий самий закон УРСР.", "Обов’язковою стала **8-річна** школа замість 7-річної. Щоб отримати повну середню освіту, треба було вчитися **11 років**: у 9 – 11 класах учні опановували робітничу професію на виробництві. У 1964 р. від цього відмовилися й повернули 10-річну школу.", "**Стаття 9** закону УРСР дозволила батькам самим обирати, якою мовою навчатиметься дитина, і звільняти її від вивчення української мови. Без російської не можна було вступити до більшості вишів і зробити кар’єру, тому в містах батьки віддавали дітей до російських шкіл.", "Так закон посилив **русифікацію**: кількість українських шкіл і частка учнів, які навчалися українською, у 1960-х рр. зменшувалися."], "imgs": [{"key": "s053_image78", "cap": "Учні в класі, кінець 1950-х рр."}, {"key": "s053_image80", "cap": "Урок у старших класах."}]}, {"type": "text", "kicker": "Освіта", "title": "Якою мовою навчалися школярі УРСР", "badges": [], "paras": ["За десять років частка учнів, які навчалися **українською мовою**, зменшилася з 81 до 64 %, а частка тих, хто навчався російською, зросла майже вдвічі.", "У великих містах українських шкіл було зовсім мало. У 1958/1959 навчальному році українською навчалися **26,5 %** учнів Києва, **8,1 %** — Одеси, **4,1 %** — Харкова, **1,2 %** — Донецька.", "Стаття 9 закону 1959 р. закріпила цю тенденцію: російську мову вивчали обов’язково, а українську в російських школах — за бажанням батьків.", "Проти русифікації школи виступали письменники **Максим Рильський** і **Микола Бажан**, а згодом шістдесятники."], "imgs": [{"key": "chart_2_31", "cap": "Частка учнів загальноосвітніх шкіл УРСР за мовою навчання. Джерело: ZN.UA, «Мова не на часі»."}]}, {"type": "text", "kicker": "Наука", "title": "Наука в УРСР", "badges": [], "paras": ["У 1946 – 1962 рр. Академію наук УРСР очолював біохімік **Олександр Палладін**, а з **1962 р.** — **Борис Патон**, який керував нею до 2020 р.", "У Києві **Сергій Лебедєв** у 1948 – 1951 рр. створив **МЕСМ** — першу в континентальній Європі електронну обчислювальну машину. У 1962 р. **Віктор Глушков** очолив **Інститут кібернетики** АН УРСР.", "Інститут електрозварювання під керівництвом **Бориса Патона** розробляв нові способи зварювання металів. Хірург **Микола Амосов** проводив у Києві складні операції на серці.", "У Дніпропетровську конструкторське бюро **Михайла Янгеля** створювало ракети, зокрема бойові. Найбільше грошей держава давала на науку, пов’язану з армією, а гуманітарні науки суворо контролювала партія."], "imgs": [{"key": "s056_image81", "cap": "Віктор Глушков (праворуч у першому ряду) зі співробітниками біля обчислювальної машини."}, {"key": "amosov", "cap": "Микола Амосов, 1980-ті рр. Фото: Published by the Embassy of the Union of Soviet Socialist Republics to the United States of America - photographer uncredited / Wikimedia Commons, Public domain"}]}, {"type": "carousel", "title": "Наука доби відлиги: люди й відкриття", "badges": [], "note": null, "items": [{"key": "s058_image83", "name": "", "desc": "Борис Патон — президент Академії наук УРСР з 1962 р.", "cap": ""}, {"key": "glushkov_env", "name": "", "desc": "Віктор Глушков на поштовому конверті. Фото: Бендель Пётр Эмильевич (1905 – 1989) / Wikimedia Commons, Public domain", "cap": ""}, {"key": "yangel_stamp", "name": "", "desc": "Михайло Янгель на поштовій марці України. Фото: Post of Ukraine / Wikimedia Commons, Public domain", "cap": ""}, {"key": "mesm_house", "name": "", "desc": "Київ, Феофанія, вулиця Академіка Лебедєва: тут у 1948 – 1951 рр. створювали МЕСМ. Фото: Олекса-Київ / Wikimedia Commons, CC BY 3.0", "cap": ""}, {"key": "s059_image85", "name": "", "desc": "Сергій Корольов (праворуч) і Юрій Гагарін перед стартом, 12 квітня 1961 р.", "cap": ""}, {"key": "gagarin", "name": "", "desc": "Юрій Гагарін, 1961 р. Фото: Arto Jousi / /Suomen valokuvataiteen museo / Alma Media / Uuden Suomen kokoelma; Restored by Adam Cuerden / Wikimedia Commons, Public domain", "cap": ""}]}, {"type": "text", "kicker": "Персоналія", "title": "Сергій Корольов (1907 – 1966)", "badges": [], "paras": ["Народився в **Житомирі**, навчався в Київському політехнічному інституті, потім у Москві. З юності захоплювався планеризмом і ракетами.", "У **1938 р.** його заарештували за сфабрикованою справою, катували, відправили на золоті копальні Колими. Потім він працював у «шарашці» — тюремному конструкторському бюро. Звільнили його **1944 р.**", "З **1946 р.** — головний конструктор ракет. Під його керівництвом **4 жовтня 1957 р.** запустили **перший штучний супутник Землі**, а **12 квітня 1961 р.** **Юрій Гагарін** здійснив перший політ людини в космос.", "Ім’я Корольова було державною таємницею: у газетах його називали лише «головним конструктором». Широкий загал дізнався про нього тільки після його смерті 1966 р."], "imgs": [{"key": "s078_image104", "cap": "Сергій Корольов."}]}]}, {"id": "s5", "num": "V", "title": "Література, мистецтво, церква", "sub": "Повернення заборонених імен, нове покоління митців, Катерина Білокур, антирелігійна кампанія", "cover": {"key": "prym_bird", "cap": ""}, "cards": [{"type": "cols", "title": "Література доби відлиги", "badges": [], "intro": null, "blocks": [{"h": "Старше покоління", "paras": ["Почали знову видавати частину творів **реабілітованих** письменників, яких розстріляли в 1930-х рр. (Микола Куліш, Григорій Косинка, Михайль Семенко). Але чимало творів залишалися забороненими.", "**Олександр Довженко** написав кіноповість **«Поема про море»** (1956) про будівництво Каховської ГЕС.", "**Григорій Тютюнник** — роман **«Вир»** (1960 – 1962); **Олесь Гончар** — роман **«Тронка»** (1963).", "**Володимир Сосюра** таємно писав поему «Розстріляне безсмертя» — її надрукували лише в 1980-х рр."]}, {"h": "Шістдесятники", "paras": ["**Ліна Костенко** — «Проміння землі» (1957), «Вітрила» (1958), «Мандрівки серця» (1961).", "**Василь Симоненко** — «Тиша і грім» (1962).", "**Іван Драч** — «Соняшник» (1962).", "Також **Микола Вінграновський, Дмитро Павличко, Борис Олійник**.", "Молоді поети говорили про людину, свободу й Україну новою мовою, без офіційних гасел. Їхні збірки швидко розкуповували, а вечори поезії збирали повні зали."]}]}, {"type": "text", "kicker": "Культура", "title": "Образотворче мистецтво", "badges": [], "paras": ["Художники відроджували традиції українського народного й монументального мистецтва. **Алла Горська, Віктор Зарецький, Галина Зубченко** створювали мозаїки для громадських будівель.", "**Тетяна Яблонська**, визнана художниця соціалістичного реалізму, у 1960-х рр. звернулася до народних мотивів. **Катерина Білокур** і **Марія Приймаченко** — майстрині **народного «наївного» мистецтва**.", "Монументальні твори шістдесятників влада часто знищувала або закривала. Чимало мозаїк Горської на Донеччині зруйновано вже під час російсько-української війни."], "imgs": [{"key": "prym_lion", "cap": "Марія Приймаченко. «Лев зламав дуба», 1963 р. WikiArt"}, {"key": "horska_symonenko", "cap": "Алла Горська. Портрет Василя Симоненка, 1964 р. WikiArt"}]}, {"type": "text", "kicker": "Культура", "title": "Кіно: «Тіні забутих предків» (1964)", "badges": [], "paras": ["У **1964 р.**, до 100-річчя Михайла Коцюбинського, на Київській кіностудії імені Довженка режисер **Сергій Параджанов** зняв фільм **«Тіні забутих предків»** за його повістю.", "Фільм знімали в гуцульських селах на Верховинщині. Оператором був **Юрій Іллєнко**, головну роль Івана зіграв **Іван Миколайчук**, музику написав **Мирослав Скорик**. Актори говорили гуцульською говіркою, і Параджанов відмовився дублювати фільм російською.", "Стрічка здобула нагороди на міжнародних кінофестивалях, зокрема в Мар-дель-Плата (Аргентина, 1965). З неї почалося **українське поетичне кіно**.", "На прем’єрі фільму в Києві **4 вересня 1965 р.** відбувся протест проти арештів інтелігенції. У 1973 р. Параджанова заарештували й ув’язнили."], "imgs": [{"key": "paradzhanov", "cap": "Сергій Параджанов, 1980-ті рр. Фото: Мечитов, Юрий Михайлович / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "carousel", "title": "Мистецтво шістдесятих: твори", "badges": [], "note": null, "items": [{"key": "mosaic_mariupol", "name": "", "desc": "Мозаїка в Маріуполі, 1960-ті рр. Автори за описом на Вікісховищі: Г. Зубченко, Г. Пришедько, А. Горська. Фото: ОпоОпо / Wikimedia Commons, CC0", "cap": ""}, {"key": "s064_image89", "name": "", "desc": "Марія Приймаченко. Птахи.", "cap": ""}, {"key": "s064_image90", "name": "", "desc": "Марія Приймаченко. Звір.", "cap": ""}, {"key": "s064_image91", "name": "", "desc": "Марія Приймаченко. Хоровод під сонцем.", "cap": ""}, {"key": "bilokur_dam", "name": "", "desc": "Катерина Білокур. «У Богданівці біля греблі», 1955 р. WikiArt", "cap": ""}]}, {"type": "text", "kicker": "Персоналія", "title": "Катерина Білокур (1900 – 1961)", "badges": [], "paras": ["Народилася в селі **Богданівка** (нині Київщина) у селянській родині. Школи не закінчила: читати й писати навчилася сама. Батьки не пускали її вчитися малювати, а до художнього технікуму її не прийняли без документа про освіту.", "Малювати навчилася сама: пензлі робила з котячої шерсті, фарби — з рослин. Про неї дізналися 1940 р., коли в Полтаві відбулася її виставка.", "Малювала здебільшого квіти й старанно виписувала кожну пелюстку. У **1954 р.** її картини показали на міжнародній виставці в Парижі. У **1956 р.** їй надали звання **народної художниці УРСР**.", "Усе життя прожила в Богданівці, де тепер діє її **музей-садиба**."], "imgs": [{"key": "s077_image103", "cap": "Катерина Білокур біля своєї картини."}]}, {"type": "monument", "title": "Катерина Білокур. «Хата в Богданівці» (1955)", "badges": ["НМТ: пам’ятка"], "img": {"key": "bilokur_hata", "cap": "Катерина Білокур. «Хата в Богданівці», 1955 р. Олія. WikiArt"}, "paras": ["Картину Катерина Білокур написала **1955 р.** у рідному селі Богданівка.", "Ліворуч — стара хата під солом’яною стріхою, тин, сад і верби. Праворуч — пишний букет: мальви, маки, флокси, айстри, кожну квітку виписано окремо.", "На одному полотні художниця поєднала пейзаж і натюрморт: за букетом видно її село.", "Цю картину треба **впізнавати** на НМТ. Прикмети: хата зі стріхою ліворуч і великий букет праворуч."]}, {"type": "text", "kicker": "Церква", "title": "Держава і церква", "badges": [], "paras": ["У 1958 – 1964 рр. Хрущов розгорнув нову **антирелігійну кампанію**. Він обіцяв, що в СРСР скоро не буде віруючих.", "В УРСР закривали храми й монастирі: кількість відкритих православних храмів скоротилася майже вдвічі. У **1961 р.** влада закрила **Києво-Печерську лавру** й намагалася закрити Почаївську. Храми, навіть пам’ятки архітектури, руйнували або перетворювали на склади й клуби.", "**Українська греко-католицька церква**, заборонена 1946 р., і далі діяла лише підпільно. Частина її священників повернулася із заслання.", "Главу УГКЦ митрополита **Йосипа Сліпого**, який провів у таборах 18 років, у лютому **1963 р.** звільнили на прохання Папи Римського Івана XXIII й відправили до Рима. Повернутися в Україну йому не дозволили."], "imgs": [{"key": "s065_image92", "cap": "Антирелігійний плакат «Бога нема!»"}, {"key": "slipyj", "cap": "Йосип Сліпий у Римі. Фото: Pkravchenko / Wikimedia Commons, CC BY-SA 3.0"}]}]}, {"id": "s6", "num": "VI", "title": "Підсумки теми", "sub": "Поняття · персоналії · що часто плутають · стрічка часу всієї теми", "cover": {"key": "bilokur_self55", "cap": ""}, "cards": [{"type": "table", "title": "Поняття теми «Україна в умовах десталінізації»", "rows": [["Поняття", "Що означає"], ["Десталінізація", "відмова від масових репресій, свавілля держбезпеки, системи ГУЛАГу й культу особи Сталіна; однопартійна диктатура збереглася"], ["Культ особи", "безмежне звеличення одного керівника, якому приписують усі успіхи й безпомилковість"], ["Лібералізація", "послаблення контролю держави над суспільством: менше репресій і цензури"], ["Політична реабілітація", "відновлення доброго імені й прав несправедливо засуджених з політичних мотивів"], ["Відлига", "неофіційна назва доби 1953 – 1964 рр. (за повістю І. Еренбурга)"], ["Раднаргосп", "рада народного господарства — орган управління промисловістю економічного району (1957 – 1965)"], ["Шістдесятники", "покоління молодої інтелігенції, яке прийшло в культуру за доби відлиги"], ["Дисиденти", "люди, які відкрито не погоджувалися з офіційною ідеологією й політикою влади"]]}, {"type": "table", "title": "Персоналії теми", "rows": [["Хто", "Чим відомий у добу відлиги"], ["Левко Лук’яненко (портрет)", "засновник Української робітничо-селянської спілки (1959); розстріл йому замінили 15 роками ув’язнення"], ["Василь Стус (портрет)", "поет; 4 вересня 1965 р. підтримав протест на прем’єрі «Тіней забутих предків»"], ["Василь Симоненко (портрет)", "поет-шістдесятник, збірка «Тиша і грім» (1962); Биківня; помер 1963 р."], ["Іван Світличний", "літературознавець, один із лідерів шістдесятників; арешт 1965 р."], ["Алла Горська", "художниця, «Сучасник», Биківня, знищений вітраж «Шевченко. Мати» (1964)"], ["Ліна Костенко", "поетеса: «Проміння землі», «Вітрила», «Мандрівки серця»"], ["Євген Сверстюк", "критик, філософ, лектор «Сучасника»; есей «Собор у риштованні» (1970)"], ["Лесь Танюк", "режисер, голова Клубу творчої молоді «Сучасник» (1959)"], ["Сергій Корольов", "конструктор ракет; перший супутник (1957), політ Гагаріна (1961)"], ["Катерина Білокур", "народна художниця; картина «Хата в Богданівці» (1955)"]]}, {"type": "defs", "title": "Що часто плутають на НМТ", "badges": [], "items": [{"name": "1959 р. — двічі", "paras": ["**УРСС** — підпільна організація Лук’яненка (Львівщина).", "**«Сучасник»** — легальний клуб творчої молоді в **Києві**."], "img": null}, {"name": "Два поняття", "paras": ["**Шістдесятники** — покоління в культурі.", "**Дисиденти** — ті, хто відкрито виступав проти політики влади. Багато шістдесятників стали дисидентами."], "img": null}, {"name": "Симоненко і Стус", "paras": ["**Симоненко** помер 1963 р., за Хрущова.", "**Стус** загинув у таборі 1985 р., його арешти — 1972 і 1980 рр."], "img": null}, {"name": "Дві художниці", "paras": ["**Білокур** — Богданівка, квіти, **«Хата в Богданівці»**.", "**Приймаченко** — Болотня, фантастичні звірі."], "img": null}], "note": null}, {"type": "tl_events", "title": "Стрічка часу всієї теми (1953 – 1965)", "note": "Відстані між подіями однакові для наочності.", "items": [{"year": "1953 – 1954", "name": "Повстання в таборах", "desc": "Норильськ, Воркута, Кенгір", "color": "#e05a47", "prog": true}, {"year": "лютий 1954", "name": "Крим — до складу УРСР", "desc": "указ 19 лютого", "color": "#e97132", "prog": true}, {"year": "1956", "name": "XX з’їзд КПРС", "desc": "засудження культу особи", "color": "#e97132", "prog": true}, {"year": "1957", "name": "Раднаргоспи", "desc": "управління за регіонами", "color": "#9cc6de", "prog": false}, {"year": "1959", "name": "УРСС", "desc": "Л. Лук’яненко", "color": "#e05a47", "prog": true}, {"year": "1959", "name": "«Сучасник»", "desc": "клуб творчої молоді в Києві", "color": "#a9dda0", "prog": true}, {"year": "1962", "name": "Новочеркаськ; Манеж", "desc": "розстріл робітників; виставка в Манежі", "color": "#a6a6a6", "prog": false}, {"year": "1964", "name": "Усунення Хрущова", "desc": "пленум ЦК КПРС, 14 жовтня", "color": "#b48ae0", "prog": false}]}, {"type": "text", "kicker": "Підсумки", "title": "Чим завершилася доба відлиги", "badges": [], "paras": ["За **1953 – 1964 рр.** радянський режим відмовився від масового терору: сотні тисяч людей повернулися з таборів, багатьох реабілітували. Але однопартійна диктатура, цензура й планова економіка залишилися.", "УРСР отримала більше прав в управлінні економікою, а 1954 р. — **Кримську область**. Українці вперше очолили компартію республіки.", "Реформи Хрущова в економіці часто були поспішними й непродуманими. На початку 1960-х рр. їхніми наслідками стали подорожчання, дефіцит, неврожай і протести.", "За відлиги сформувалося покоління **шістдесятників**, а з ним — **дисидентський рух**. Після 1964 р. влада почала переслідувати шістдесятників, але зупинити цей рух уже не змогла."], "imgs": [{"key": "kyiv_fortepan", "cap": "Київ, площа Калініна (нині майдан Незалежності), 1961 р. Фото: Fortepan / Wikimedia Commons, CC BY-SA 3.0"}]}]}]}];

    c.blocks.forEach(b => { if (b.k === 'sep') groups.push([]); else groups[groups.length - 1].push(b); });
    const g = groups.filter(x => x.length);
    const rb = b => b.k === 'h' ? `<h3 class="${b.light ? 'l' : ''}">${md(b.text)}</h3>` : b.k === 'date' ? `<span class="pill">${md(b.text)}</span>`
      : b.k === 'img' ? fig(b) : b.k === 'muted' ? `<div class="muted">${(b.paras || []).map(p => `<p>${md(p)}</p>`).join('')}</div>` : paras(b.paras);
    const body = g.map(x => {
      const asPanel = g.length > 1 && x.some(b => b.k === 'h' || b.k === 'date');
      return asPanel ? `<div class="sub">${x.map(rb).join('')}</div>` : x.map(rb).join('');
    }).join('');
    return `${chips(c.badges)}${h2(c.title)}${body}`;
  },
};

/* ---------- навігація ---------- */
const P = id => LESSONS.find(l => l.id === id);
function secProgress(L, s) { const seen = store.get(`seen_${L.id}-${s.id}`, []).length; return Math.min(seen, s.cards.length); }
function partProgress(L) { let a = 0, b = 0; L.sections.forEach(s => { a += secProgress(L, s); b += s.cards.length; }); return [a, b]; }

function index() {
  document.title = TITLE;
  const L0 = LESSONS[0];
  /* тема «лише уроки» в спільній оболонці: посилання назад на полицю тем (у повному курсі його додає course.js) */
  const back = typeof SHELL_URL === 'string' && SHELL_URL && typeof LESSONS_ONLY !== 'undefined' && LESSONS_ONLY ? SHELL_URL : '';
  app.innerHTML = `<div class="wrap">${back ? `<a class="lnk tback" href="${back}">← Усі теми</a>` : ''}
    <div class="hero"><img src="${im(L0.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L0.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(TITLE)}</h1>
      <div class="sub">Мобільна версія презентацій: ${PARTS_WORD}, кожна поділена на короткі розділи.</div></div>
    <div class="h2">Частини</div><div class="sec-list">${LESSONS.map(L => {
      const [a, b] = partProgress(L);
      return `<button class="part-btn" data-go="${L.id}"><span class="th"><img src="${im(L.cover.key).src}" alt=""></span>
        <span><h3>${esc(L.part)}</h3><div class="st">${a ? `Переглянуто ${a} з ${b} карток` : `${L.sections.length} розділів`}</div>
        <div class="prog-mini"><i style="width:${Math.round(100 * a / b)}%"></i></div></span></button>`; }).join('')}</div>
    <p class="cap" style="margin-top:18px">Прогрес зберігається лише на цьому пристрої.${back ? ' Бліци й тести з цієї теми з’являться згодом.' : ''}</p>${brandHtml()}</div>`;
  wireGo(); window.scrollTo(0, 0);
}

function partHome(L) {
  document.title = `${L.part} — ${TITLE}`;
  const i = LESSONS.indexOf(L), next = LESSONS[i + 1];
  const secs = L.sections.map(s => {
    const seen = secProgress(L, s), n = s.cards.length, done = seen >= n;
    return `<button class="sec-btn${done ? ' done' : ''}" data-go="${L.id}-${s.id}"><span class="num">${done ? '✓' : s.num}</span>
      <span><h3>${md(s.title)}</h3><div class="st">${seen ? `Переглянуто <b>${seen} з ${n}</b>` : `${n} карток`}</div>
      <div class="prog-mini"><i style="width:${Math.round(100 * seen / n)}%"></i></div></span></button>`;
  }).join('');
  const nextBtn = next ? `<button class="btn" data-go="${next.id}" style="margin-top:20px">Далі: ${esc(next.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:20px" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>
       <p class="cap">Посилання працює, якщо файли лежать в одній папці.</p>` : '');
  app.innerHTML = `${MODE === 'all' ? `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${L.num}</span></div></div>` : ''}
  <div class="wrap">
    <div class="hero"><img src="${im(L.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(L.title)}</h1>
      <div class="part">${esc(L.part)}</div><div class="sub">${esc(L.sub)}</div></div>
    <div class="h2">Розділи</div><div class="sec-list">${secs}</div>
    ${L.program ? `<div class="h2">Що треба знати для НМТ</div><section class="card">${R.generic({ ...L.program, title: '' })}</section>` : ''}
    ${nextBtn}
  </div>`;
  wireGo(); window.scrollTo(0, 0);
}

let obs = null;
function section(L, s) {
  document.title = `${s.num}. ${s.title} — ${TITLE}`;
  const k = L.sections.indexOf(s), next = L.sections[k + 1], nextPart = LESSONS[LESSONS.indexOf(L) + 1];
  const cards = s.cards.map((c, i) => `<section class="card" data-i="${i}">${(R[c.type] || R.generic)(c, i)}</section>`).join('');
  let end = next ? `<button class="btn" data-go="${L.id}-${next.id}">Далі: розділ ${next.num}. ${esc(next.title)} →</button>`
    : nextPart ? `<button class="btn" data-go="${nextPart.id}">Далі: ${esc(nextPart.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>` : '');
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="${L.id}">← Розділи</button><span class="ttl">${s.num}. ${md(s.title)}</span></div><div class="prog"><i id="pr"></i></div></div>
  <div class="wrap">
    ${s.cover && s.cover.key ? `<div class="hero">${fig(s.cover)}</div>` : ''}
    <div class="sec-head"><div class="kick">Частина ${L.num} · розділ ${s.num}</div><h1>${md(s.title)}</h1><div class="sub">${md(s.sub)}</div></div>
    <div class="cards">${cards}</div>
    <div class="end">${end}<button class="btn ghost" data-go="${L.id}">До розділів</button></div>
  </div>`;
  wireGo();
  s.cards.forEach((c, i) => {
    if (c.type === 'carousel' && c.items.length > 1) {
      const car = document.getElementById('car' + i), dots = document.getElementById('dots' + i).children;
      car.addEventListener('scroll', () => {
        const kk = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 12));
        [...dots].forEach((d, j) => d.classList.toggle('on', j === kk));
      }, { passive: true });
    }
    if (c.type === 'map' && c.steps.length > 1) {
      const st = document.getElementById('st' + i), mp = document.getElementById('mp' + i);
      st.querySelectorAll('button').forEach(b => b.onclick = () => {
        st.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
        mp.innerHTML = fig({ key: c.steps[+b.dataset.i].key, cap: c.cap || '' });
      });
    }
  });
  const key = `seen_${L.id}-${s.id}`, seen = new Set(store.get(key, []));
  if (obs) obs.disconnect();
  obs = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { seen.add(+e.target.dataset.i); store.set(key, [...seen]); } });
  }, { threshold: 0.35 }) : null;
  if (obs) app.querySelectorAll('.card').forEach(el => obs.observe(el));
  window.scrollTo(0, 0);
}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;
}, { passive: false });
lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const pr = document.getElementById('pr'); if (!pr) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  pr.style.width = (max > 0 ? Math.min(100, 100 * scrollY / max) : 100) + '%';
}, { passive: true });
route();
</script>
</body>
</html>

 без них не пояснити зміну керівництва УРСР."]}]}, "sections": [{"id": "s1", "num": "I", "title": "Влада: від Хрущова до Брежнєва", "sub": "Усунення Хрущова, «стабільність кадрів», номенклатура, етапи доби «застою»", "cover": {"key": "s008_image8", "cap": ""}, "cards": [{"type": "tl_periods", "title": "Стрічка часу: хто керував СРСР і УРСР (1964 – 1985)", "note": "Після Брежнєва Генеральними секретарями були Юрій Андропов (1982 – 1984) і Костянтин Черненко (1984 – 1985). У жовтні 1964 р. усунули Хрущова, у травні 1972 р. Щербицький змінив Шелеста, у березні 1985 р. Генеральним секретарем став Горбачов.", "x_from": 1963.5, "x_to": 1986.5, "ticks": [[1965, "1965"], [1970, "1970"], [1975, "1975"], [1980, "1980"], [1985, "1985"]], "events": [[1964.8, "жовтень 1964"], [1972.4, "травень 1972"], [1985.2, "березень 1985"]], "prog": [[1965, 1965.3, "1965"], [1972, 1972.3, "1972"]], "rows": [{"name": "Генсек ЦК КПРС", "segs": [{"a": 1964.8, "b": 1982.85, "color": "#e97132", "sub": "Леонід Брежнєв"}, {"a": 1982.9, "b": 1984.1, "color": "#e97132", "sub": ""}, {"a": 1984.15, "b": 1985.2, "color": "#c9824f", "sub": ""}]}, {"name": "Голова Ради Міністрів СРСР", "segs": [{"a": 1964.8, "b": 1980.8, "color": "#d9b26f", "sub": "Олексій Косигін"}, {"a": 1980.85, "b": 1985.75, "color": "#c09659", "sub": "Микола Тихонов"}]}, {"name": "Перший секретар ЦК КПУ", "segs": [{"a": 1963.5, "b": 1972.4, "color": "#6ea8c9", "sub": "Петро Шелест"}, {"a": 1972.45, "b": 1986.5, "color": "#5b93bd", "sub": "Володимир Щербицький (до 1989 р.)"}]}, {"name": "Етапи доби", "segs": [{"a": 1965, "b": 1970.9, "color": "#a9dda0", "sub": "реформи"}, {"a": 1971, "b": 1982, "color": "#a6a6a6", "sub": "наростання кризи"}, {"a": 1982.1, "b": 1985.2, "color": "#e05a47", "sub": "зміна генсеків"}]}]}, {"type": "text", "kicker": "Влада", "title": "Як усунули Хрущова (жовтень 1964 р.)", "badges": [], "paras": ["Реформи Микити **Хрущова** зачепили інтереси партійних і господарських керівників: він поділив обкоми на промислові й сільські, обмежив термін перебування на посадах, постійно переводив чиновників з місця на місце. Керівники втомилися від постійних змін і прагнули стабільності.", "Восени 1964 р. група членів Президії ЦК КПРС на чолі з Леонідом **Брежнєвим** домовилася усунути Хрущова. Змову підтримав і перший секретар ЦК КПУ Петро **Шелест**.", "У **жовтні 1964 р.** пленум ЦК КПРС звільнив Хрущова з усіх посад «за станом здоров’я». Першим секретарем ЦК (з 1966 р. — Генеральним секретарем) став Брежнєв, головою Ради Міністрів СРСР — Олексій **Косигін**."], "imgs": [{"key": "khrushchev", "cap": "Микита Хрущов, 1960-ті рр. Фото: Junge, Heinz / Wikimedia Commons, CC BY-SA 3.0 de"}]}, {"type": "text", "kicker": "Влада", "title": "Чому цю добу називають «застоєм»", "badges": ["НМТ: поняття"], "paras": ["Нове керівництво пообіцяло апаратові «**стабільність кадрів**»: міністри й секретарі обкомів обіймали посади по 15 – 20 років. Старішало й Політбюро: на початку 1980-х рр. середній вік його членів сягнув 70 років.", "Після 1970 р. керівництво СРСР згорнуло реформи, а господарство розвивалося дедалі повільніше. Населення жило спокійніше, ніж за Сталіна й Хрущова, проте радянська економіка дедалі більше відставала від західної.", "**Застій** — період 1965 – 1985 рр. в історії СРСР, коли влада намагалася зберегти незмінною радянську систему, а в економіці, політиці й суспільстві наростали кризові явища.", "Сам вислів «застійні явища» вжив Михайло Горбачов у 1986 р., коли починав перебудову."], "imgs": [{"key": "brezhnev", "cap": "Леонід Брежнєв, керівник КПРС і СРСР у 1964 – 1982 рр. Фото: Vladimir Musaelyan / Wikimedia Commons, CC0"}, {"key": "ustinov_br", "cap": "Брежнєв і міністр оборони Дмитро Устинов, початок 1980-х рр. Фото: Юрий Васильевич Абрамочкин / Wikimedia Commons, CC BY 4.0"}]}, {"type": "defs", "title": "Три етапи доби «застою»", "badges": [], "items": [{"name": "І. 1965 – 1970 рр.", "paras": ["Нове керівництво скасувало найсуперечливіші реформи Хрущова і спробувало прискорити розвиток господарства.", "**Косигінська реформа** дала підприємствам трохи більше самостійності.", "Восьма п’ятирічка (1966 – 1970) стала найуспішнішою за всі роки «застою»."], "img": null}, {"name": "ІІ. 1971 – 1982 рр.", "paras": ["Керівництво СРСР згорнуло реформу, бо партійний апарат і міністерства не хотіли втрачати контроль над підприємствами.", "Господарство зростало дедалі повільніше, товарів бракувало дедалі більше.", "Влада посилила переслідування інакодумців: у 1972 р. відбулася друга хвиля арештів."], "img": null}, {"name": "ІІІ. 1982 – 1985 рр.", "paras": ["Менш ніж за два з половиною роки померли Брежнєв і двоє його наступників — Андропов і Черненко.", "Андропов зміцнював трудову дисципліну й боровся з корупцією.", "Криза стала очевидною, і в 1985 р. пленум ЦК КПРС обрав Генеральним секретарем Михайла Горбачова, значно молодшого за попередників."], "img": null}], "note": null}, {"type": "carousel", "title": "Керівники СРСР доби «застою»", "badges": [], "note": "Генеральний секретар ЦК КПРС фактично керував державою, Рада Міністрів (уряд) — господарством. Фото: В. Мусаелян, AP, ТАРС / Wikimedia Commons, суспільне надбання.", "items": [{"key": "s004_image2", "name": "", "desc": "Леонід Брежнєв — генсек ЦК КПРС 1964 – 1982", "cap": ""}, {"key": "kosygin", "name": "", "desc": "Олексій Косигін — голова Ради Міністрів 1964 – 1980", "cap": ""}, {"key": "andropov", "name": "", "desc": "Юрій Андропов — генсек 1982 – 1984", "cap": ""}, {"key": "chernenko", "name": "", "desc": "Костянтин Черненко — генсек 1984 – 1985", "cap": ""}, {"key": "tikhonov", "name": "", "desc": "Микола Тихонов — голова Ради Міністрів 1980 – 1985", "cap": ""}]}, {"type": "cols", "title": "Номенклатура", "badges": ["НМТ: поняття"], "intro": null, "blocks": [{"h": "Хто до неї належав", "paras": ["**Номенклатура** — керівники, яких призначали на посади лише з дозволу партійних комітетів, а також сам перелік таких посад.", "До неї належали секретарі парткомів, міністри, директори заводів, голови колгоспів, ректори, редактори газет.", "Призначення залежало від партійного комітету, а не від виборців чи працівників. Тому номенклатурник відповідав перед вищим начальником, а не перед людьми.", "Слово «номенклатура» в перекладі з латини означає «перелік імен»."]}, {"h": "Що вона мала", "paras": ["Службові квартири, дачі й автомобілі з водіями.", "«Закриті» магазини й розподільники, де продавали дефіцитні товари за нижчими цінами.", "Окремі лікарні, санаторії, поїздки за кордон.", "За Брежнєва номенклатурники майже не втрачали посад: «стабільність кадрів» обернулася довічним перебуванням на посадах, а в багатьох республіках породила корупцію."]}]}]}, {"id": "s2", "num": "II", "title": "Ідеологія", "sub": "«Розвинений соціалізм» замість обіцянки комунізму, Конституції 1977 і 1978 рр., «радянський народ»", "cover": {"key": "s015_image17", "cap": ""}, "cards": [{"type": "text", "kicker": "Ідеологія", "title": "Розвинений соціалізм замість комунізму", "badges": ["НМТ: поняття"], "paras": ["Хрущов у програмі КПРС 1961 р. пообіцяв, що «нинішнє покоління радянських людей житиме при комунізмі» і що його основу збудують до 1980 р. Невдовзі стало зрозуміло, що обіцянку не виконати.", "Нове керівництво не відмовилося від неї відкрито, а відсунуло комунізм у невизначене майбутнє. У 1967 р. Брежнєв оголосив, що в СРСР уже збудовано **розвинений соціалізм**, — тривалий етап, після якого колись настане комунізм.", "Ідеологи стверджували, що в СРСР зникають відмінності між класами, між містом і селом, між народами і що склалася «**нова історична спільність — радянський народ**». Насправді народи мали зближуватися на основі російської мови."], "imgs": [{"key": "s25", "cap": "Поштовий блок СРСР до XXV з’їзду КПРС, 1976 р. Фото: Почта СССР: / Wikimedia Commons, Public domain"}, {"key": "s015_image15", "cap": "Плакат 1970-х рр.: «Держава — це ми, трудовий радянський народ!»"}]}, {"type": "doc", "title": "Конституція УРСР 1978 р.: керівна роль КПРС", "quote": ["Керівною і спрямовуючою силою радянського суспільства, ядром його політичної системи, державних і громадських організацій є Комуністична партія Радянського Союзу. КПРС існує для народу і служить народові.", "Озброєна марксистсько-ленінським ученням Комуністична партія визначає генеральну перспективу розвитку суспільства, лінію внутрішньої і зовнішньої політики СРСР, керує великою творчою діяльністю радянського народу…"], "source": "Конституція Української РСР 1978 р., стаття 6", "comment": ["Конституцію СРСР ухвалили в **жовтні 1977 р.**, а Конституцію УРСР на її зразок — **20 квітня 1978 р.** Їх називали конституціями «розвиненого соціалізму».", "Стаття 6 закріпила в основному законі керівну роль Комуністичної партії. Інших партій бути не могло.", "Конституції проголошували свободу слова, зборів і совісті, але влада й далі ув’язнювала дисидентів, які посилалися на ці свободи."], "img": {"key": "const77", "cap": "Поштова картка СРСР на честь Конституції 1977 р."}}]}, {"id": "s3", "num": "III", "title": "Керівництво УРСР", "sub": "Петро Шелест і Володимир Щербицький, усунення Шелеста 1972 р. і його наслідки", "cover": {"key": "s021_image29", "cap": ""}, "cards": [{"type": "text", "kicker": "Керівництво УРСР", "title": "Петро Шелест, перший секретар ЦК КПУ", "badges": ["поза програмою"], "paras": ["Петро Шелест народився 1908 р. на Харківщині, був інженером, директором авіаційного заводу, потім партійним керівником Києва й Київської області. У 1963 р. він очолив Компартію України, а в 1964 р. взяв участь у змові проти Хрущова.", "Шелест був відданим комуністом: підтримав уведення військ до Чехословаччини 1968 р., а за його керівництва відбулися арешти дисидентів **1965 р.** і січня **1972 р.**", "Водночас він домагався, щоб республіка сама керувала більшою частиною своїх підприємств, на офіційних заходах виступав українською і захищав українську культуру від русифікації."], "imgs": [{"key": "shelest", "cap": "Петро Шелест, 1972 р. Фото: Richard Nixon Presidential Library - Photo Gallery / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Керівництво УРСР", "title": "Шелест і українська культура", "badges": ["поза програмою"], "paras": ["За Шелеста в республіці вийшла 26-томна «**Історія міст і сіл Української РСР**» (1967 – 1974) — перше видання, де описано кожне місто й село України.", "У 1965 р. на **Хортиці** створили державний заповідник, а в 1969 р. під Києвом, у **Пирогові**, — музей народної архітектури та побуту.", "У 1970 р. в Києві відкрили Палац культури «Україна» — найбільшу концертну залу республіки.", "У 1965 р. міністр вищої освіти УРСР Юрій Даденков запропонував поступово перевести виші республіки на українську мову. Шелест цей задум підтримав, але Москва була невдоволена, і керівництво республіки від нього відмовилося."], "imgs": [{"key": "s018_image22", "cap": "Музей народної архітектури та побуту в Пирогові (Київ), заснований 1969 р."}, {"key": "s019_image25", "cap": "«Історія міст і сіл Української РСР»"}, {"key": "palats", "cap": "Палац «Україна» (1970) Фото: Artemka / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Керівництво УРСР", "title": "Чому усунули Шелеста (1972 – 1973)", "badges": ["поза програмою"], "paras": ["Брежнєв не довіряв Шелестові: той сперечався з союзними міністерствами й захищав інтереси республіки. Москва підозрювала його в «місництві» й поблажливості до націоналістів.", "У **травні 1972 р.** Шелеста перевели до Москви заступником голови Ради Міністрів СРСР, а Компартію України очолив **Володимир Щербицький**. Через рік Шелеста відправили на пенсію.", "У 1973 р. журнал «Комуніст України» розкритикував його книжку «**Україно наша Радянська**» (1970): автора звинуватили в ідеалізації запорозького козацтва та «економічному автаркізмі», тобто в прагненні до господарської відокремленості республіки. Книжку вилучили з бібліотек."], "imgs": [{"key": "s019_image26", "cap": "Книжка П. Шелеста «Україно наша Радянська» (1970)"}]}, {"type": "text", "kicker": "Керівництво УРСР", "title": "Володимир Щербицький, перший секретар ЦК КПУ", "badges": ["поза програмою"], "paras": ["Володимир Щербицький народився 1918 р. у Верхньодніпровську, працював на Дніпропетровщині і належав до кола давніх соратників Брежнєва. У 1961 – 1963 і 1965 – 1972 рр. він очолював уряд УРСР, а з 1971 р. був членом Політбюро ЦК КПРС.", "Щербицький беззастережно виконував рішення Москви. На офіційних заходах виступав російською, підтримував курс на зросійщення шкіл і видавництв.", "Комуністичну партію України він очолював 17 років — довше за будь-кого іншого. У вересні 1989 р., уже за перебудови, його відправили на пенсію; у 1990 р. він помер."], "imgs": [{"key": "s016_image20", "cap": "Володимир Щербицький, 1980-ті рр."}]}, {"type": "defs", "title": "Що змінилося в Україні після 1972 р.", "badges": ["НМТ: уміння"], "items": [{"name": "Ідеологія", "paras": ["Секретарем ЦК КПУ з ідеології став **Валентин Маланчук**, який розгорнув кампанію проти «українського буржуазного націоналізму».", "З партії виключили тисячі людей, з університетів та інститутів АН УРСР звільнили багатьох істориків і філологів."], "img": null}, {"name": "Мова й освіта", "paras": ["Влада закривала українські школи й переводила вищі навчальні заклади на російську мову.", "Українських книжок, газет і фільмів ставало дедалі менше; дисертації дозволяли писати лише російською."], "img": null}, {"name": "Інакодумці", "paras": ["Арешти, що почалися в січні 1972 р., переросли в найбільшу хвилю переслідувань доби «застою».", "До початку 1980-х рр. майже всіх відомих дисидентів ув’язнили або вислали."], "img": null}, {"name": "Господарство", "paras": ["Москва перестала зважати на господарські інтереси республіки, які обстоював Шелест.", "Майже всі великі підприємства України підпорядковувалися союзним міністерствам у Москві."], "img": null}], "note": null}, {"type": "text", "kicker": "Керівництво УРСР", "title": "Радянські пам’ятники часів Щербицького", "badges": [], "paras": ["У 1981 р. над Дніпром відкрили меморіальний комплекс Музею історії Великої Вітчизняної війни з монументом «**Батьківщина-мати**» заввишки понад 100 м. Монумент за задумом Євгена Вучетича завершили скульптор **Василь Бородай** і група архітекторів.", "У 1982 р. до 1500-ліття Києва на теперішній Європейській площі відкрили **Республіканський музей В. І. Леніна** — тепер це Український дім.", "Такі споруди мали показати силу радянської держави. Монумент «Батьківщина-мати» стоїть і нині, а в 2023 р. радянський герб на щиті замінили тризубом."], "imgs": [{"key": "mm2", "cap": "Монумент «Батьківщина-мати» (1981) з радянським гербом на щиті, фото 2010 р. Фото: Peter Collins from Maidenhead, UK / Wikimedia Commons, CC BY-SA 2.0"}, {"key": "ukr_house", "cap": "Колишній музей В. І. Леніна, тепер Український дім Фото: Olga Loboda 0806 / Wikimedia Commons, CC BY-SA 4.0"}]}]}, {"id": "s4", "num": "IV", "title": "Економіка: реформа і застій", "sub": "Перші кроки нового керівництва, косигінська реформа, промисловість, атомна енергетика, сільське господарство", "cover": {"key": "rivne_npp", "cap": ""}, "cards": [{"type": "cols", "title": "Перші кроки нового керівництва (1964 – 1965)", "badges": [], "intro": null, "blocks": [{"h": "Управління промисловістю", "paras": ["У **1965 р.** нове керівництво ліквідувало **раднаргоспи** — ради народного господарства економічних районів, які створив Хрущов.", "Керувати промисловістю знову стали галузеві **міністерства**: союзні — у Москві, союзно-республіканські — у Москві й Києві водночас.", "Більшість заводів УРСР знову підпорядкували Москві. Уряд УРСР керував лише місцевою промисловістю.", "Хрущовський поділ обкомів партії на промислові й сільські скасували ще раніше, у листопаді 1964 р."]}, {"h": "Село й селяни", "paras": ["Селянам повернули більшу частину відрізаних присадибних ділянок і зменшили податки на худобу.", "Мешканцям міст і селищ знову дозволили тримати худобу, хоча кількість її обмежували.", "Державні закупівельні ціни на зерно й м’ясо підвищили, а колгоспам за понадпланову продукцію платили на 50 % більше."]}]}, {"type": "text", "kicker": "Економіка", "title": "Косигінська реформа (1965 р.)", "badges": [], "paras": ["Реформу підготував голова Ради Міністрів СРСР Олексій **Косигін** разом з економістами. Її ухвалив пленум ЦК КПРС у вересні 1965 р.", "Обов’язкових планових показників для підприємств стало менше. Роботу заводу оцінювали вже не за кількістю виробленої продукції, а за тим, скільки її **продано** і який отримано **прибуток**.", "Частину прибутку завод залишав собі — на розвиток виробництва, премії працівникам, будівництво житла й дитсадків. Це мало зацікавити працівників у результатах праці. Цей порядок назвали **госпрозрахунком**.", "Ціни й зарплати, як і раніше, встановлювала держава; вона ж керувала постачанням. Тому самостійність підприємств виявилася дуже обмеженою."], "imgs": [{"key": "s024_image30", "cap": "Радянський плакат: «Як працював, так і заробив»"}]}, {"type": "defs", "title": "Чим закінчилася реформа", "badges": [], "items": [{"name": "Перші успіхи", "paras": ["Восьму п’ятирічку (1966 – 1970) назвали «**золотою**»: промислове виробництво в УРСР зросло приблизно на 50 %.", "Збудували сотні нових заводів, почалося масове виробництво холодильників, телевізорів, автомобілів «Запорожець»."], "img": {"key": "zaz968", "cap": "ЗАЗ-968 «Запорожець» (виробляли з 1971 р.) Фото: Novoklimov / Wikimedia Commons, CC0"}}, {"name": "Чому реформу згорнули", "paras": ["Міністерства й партійні комітети не хотіли віддавати підприємствам права розпоряджатися грошима.", "Заводові, який перевиконав план, наступного року завдання збільшували.", "«Празька весна» 1968 р. налякала радянських керівників: в економічних реформах вони побачили загрозу владі партії."], "img": null}, {"name": "«Нафтодолари»", "paras": ["З 1970-х рр. СРСР продавав за кордон дедалі більше нафти й газу із Сибіру. Ціни на нафту після 1973 р. різко зросли.", "На ці гроші держава купувала зерно й товари, тож керівники вважали, що реформи вже не потрібні."], "img": null}], "note": null}, {"type": "text", "kicker": "Економіка", "title": "Господарство зростало дедалі повільніше", "badges": [], "paras": ["Діаграма показує, на скільки відсотків у середньому за рік зростали основні показники господарства УРСР у кожній п’ятирічці.", "Після «золотої» восьмої п’ятирічки промисловість зростала вдвічі повільніше, а сільське господарство в 1981 – 1985 рр. додавало лише пів відсотка на рік.", "Це офіційні дані. Радянська статистика завищувала результати, тому насправді господарство сповільнювалося ще більше."], "imgs": [{"key": "chart_1_25", "cap": "Середньорічні темпи зростання в УРСР за п’ятирічками, %. Джерело: підручник С. Кульчицького «Історія України», 11 клас (2011), § 18; офіційна статистика УРСР."}]}, {"type": "text", "kicker": "Економіка", "title": "Промисловість: багато заводів, мало нових технологій", "badges": [], "paras": ["Господарство розвивалося **екстенсивно**: щоб виробити більше, будували нові заводи й залучали нових робітників, а не оновлювали обладнання й не підвищували продуктивність.", "Перевагу надавали важкій та оборонній промисловості. Південний машинобудівний завод у Дніпропетровську виготовляв міжконтинентальні ракети, а товарів повсякденного вжитку бракувало.", "Устаткування старіло, на виробництво одиниці продукції йшло набагато більше металу й енергії, ніж на Заході. Видобуток вугілля на Донбасі з другої половини 1970-х рр. почав скорочуватися.", "Нові досягнення науки впроваджували повільно, і то переважно у військовому виробництві."], "imgs": [{"key": "pivdenmash", "cap": "Головна прохідна Південного машинобудівного заводу в Дніпрі Фото: Половко Сергей Николаевич / Wikimedia Commons, CC BY-SA 4.0"}]}, {"type": "text", "kicker": "Економіка", "title": "Атомна енергетика", "badges": [], "paras": ["Електроенергії бракувало, а донецьке вугілля дорожчало. Тому в 1970-х рр. в Україні почали будувати атомні електростанції.", "Першою дала струм **Чорнобильська АЕС** (1977 р.), за нею — Рівненська (1980 р.), Південноукраїнська (1982 р.) і Запорізька (1984 р.).", "Поруч зі станціями збудували нові міста енергетиків: Прип’ять, Кузнецовськ (тепер Вараш), Южноукраїнськ (тепер Південноукраїнськ), Енергодар.", "Станції будували поспіхом, щоб виконати план, а місцевих жителів про ризики не попереджали. Чорнобильська катастрофа 1986 р. показала, до чого це призводить."], "imgs": [{"key": "zap_npp", "cap": "Запорізька АЕС в Енергодарі, найбільша в Європі Фото: Ralf1969 / Wikimedia Commons, CC BY-SA 3.0"}, {"key": "puaes", "cap": "Південноукраїнська АЕС (Миколаївщина) Фото: Tatiana Bashinskaya / Wikimedia Commons, CC BY 3.0"}]}, {"type": "map", "title": "Енергетика УРСР у 1970 – 1980-х рр.", "steps": [{"key": "zs_energy", "label": "Крок 1"}]}, {"type": "text", "kicker": "Економіка", "title": "Сільське господарство", "badges": [], "paras": ["У село вкладали величезні кошти: купували техніку й добрива, осушували болота на Поліссі й зрошували степи на півдні. У 1971 р. **Північнокримський канал**, який будували з 1961 р., довели до Керчі: дніпровська вода зрошувала степовий Крим.", "Проте продукція сільського господарства зростала дедалі повільніше: на 3,2 % за рік у 1966 – 1970 рр. і лише на 0,5 % у 1981 – 1985 рр. Колгоспники мало заробляли й не були зацікавлені в результаті, техніка ламалася, зібране зерно й овочі гнили через брак сховищ.", "Влада оголосила тисячі малих сіл «**неперспективними**» і перестала будувати в них школи, клуби, дороги. Молодь з таких сіл виїжджала до міст.", "Добрива й отрутохімікати вносили понад норму, вони потрапляли в річки. Через осушення боліт міліли річки Полісся."], "imgs": [{"key": "s030_image33", "cap": "Збирання картоплі в колгоспі, 1970-ті рр."}, {"key": "s028_image31", "cap": "Плакат: «Меліорація — основа високих урожаїв»"}, {"key": "s030_image34", "cap": "Студенти, яких прислали збирати врожай"}]}, {"type": "text", "kicker": "Економіка", "title": "Продовольча програма (1982 р.) і дефіцит", "badges": ["НМТ: поняття"], "paras": ["М’яса, молока, ковбаси, фруктів у магазинах постійно бракувало. З 1970-х рр. СРСР щороку купував мільйони тонн зерна у США, Канаді й Аргентині.", "У **травні 1982 р.** пленум ЦК КПРС ухвалив **Продовольчу програму**, яка мала до 1990 р. забезпечити населення продуктами. Програму не виконали.", "**Дефіцит** — нестача товарів, коли попит перевищує пропозицію. Він був постійною рисою планової економіки: ціни встановлювала держава, а не ринок.", "Дефіцитні речі діставали «по блату» — через знайомих, які мали доступ до товарів."], "imgs": [{"key": "s032_image35", "cap": "Газетна сторінка про Продовольчу програму СРСР, 1982 р."}, {"key": "s032_image36", "cap": "Порожні вітрини гастроному, 1980-ті рр."}]}]}, {"id": "s5", "num": "V", "title": "Суспільство: як жили люди", "sub": "Населення й міграції, місто і село, мова, зарплати й житло, черги й дефіцит", "cover": {"key": "s007_image7", "cap": ""}, "cards": [{"type": "text", "kicker": "Суспільство", "title": "Населення УРСР за переписами", "badges": [], "paras": ["Населення України зростало, але щоразу повільніше: за 1959 – 1970 рр. — на 5,2 млн, а за 1979 – 1989 рр. — лише на 1,9 млн осіб.", "Сім’ї в містах мали переважно одну-двох дітей. Скорочувалася й тривалість життя чоловіків.", "Частка **українців** зменшилася з 76,8 % у 1959 р. до 72,7 % у 1989 р., а частка **росіян** зросла з 16,9 % до 22,1 %. Росіяни переїжджали на нові заводи Донбасу, Придніпров’я, Криму, а випускників українських вишів і технікумів направляли працювати в Сибір і Казахстан."], "imgs": [{"key": "chart_1_32", "cap": "Переписи населення УРСР 1959, 1970, 1979, 1989 рр."}]}, {"type": "text", "kicker": "Суспільство", "title": "Місто і село", "badges": [], "paras": ["У середині 1960-х рр. міських жителів в Україні вперше стало більше, ніж сільських. До 1989 р. в містах жили вже дві третини населення.", "Молодь їхала з сіл на заводи й будови, у містах отримувала квартиру й вищу зарплату. У селах лишалися переважно люди старшого віку.", "На селі бракувало робочих рук, тому щоосені студентів, школярів, інженерів і службовців відправляли в колгоспи збирати врожай."], "imgs": [{"key": "chart_1_33", "cap": "Частка міського і сільського населення УРСР за переписами, %."}]}, {"type": "text", "kicker": "Суспільство", "title": "Рідна мова за переписами", "badges": [], "paras": ["Частка людей, які називали рідною українську мову, з кожним переписом зменшувалася, а частка тих, хто називав російську, зростала.", "Причини цього — переселення росіян, зросійщення шкіл і вищої освіти, а також те, що без російської мови важко було зробити кар’єру.", "Найшвидше українська мова виходила з ужитку у великих містах Сходу й Півдня та в Києві. Докладніше про русифікацію — у частині 2."], "imgs": [{"key": "chart_1_34", "cap": "Частка населення УРСР, що назвало рідною мовою українську або російську, %."}]}, {"type": "text", "kicker": "Суспільство", "title": "Зарплати, пенсії, житло", "badges": [], "paras": ["Зарплати поступово зростали. У 1965 р. колгоспники отримали право на державну пенсію, а з **1966 р.** їм гарантовано платили грошима, а не «трудоднями».", "Різниця в зарплаті між кваліфікованим і некваліфікованим працівником, між інженером і робітником була невеликою. Цю **«зрівнялівку»** вважали справедливою, але вона не заохочувала працювати краще.", "Панельні будинки зводили масово, проте в черзі на безкоштовну квартиру стояли по 10 – 15 років. Хто мав гроші, вступав до **житлово-будівельного кооперативу**. Багато сімей отримали садові ділянки по 6 соток."], "imgs": [{"key": "panel", "cap": "Панельні багатоповерхівки 1970 – 1980-х рр. у Києві. Фото: Levshev / Wikimedia Commons"}, {"key": "kyiv_fort", "cap": "Вулиця в Києві, 1970-ті рр. Фото: Fortepan"}, {"key": "s011_image12", "cap": "Черга до магазину"}]}, {"type": "defs", "title": "Рівень життя: гроші є, товарів немає", "badges": ["НМТ: поняття"], "items": [{"name": "Що покращилося", "paras": ["Більшість родин придбала телевізор, холодильник, пральну машину.", "З’явилися універмаги й магазини самообслуговування.", "Медицина й освіта були безкоштовними, а квартплата й проїзд — дешевими."], "img": null}, {"name": "Чого бракувало", "paras": ["Грошей у людей ставало більше, а товарів — ні. Тому полиці порожніли, а за м’ясом, меблями, взуттям, автомобілями стояли довгі черги.", "Лікарням і закладам побуту бракувало сучасного обладнання.", "Номенклатура купувала дефіцитні товари в «закритих» магазинах, тож нерівність була помітною."], "img": null}, {"name": "Тіньова економіка", "paras": ["Звичними стали крадіжки з підприємств і **тіньова економіка**: підпільні цехи, перепродаж дефіцитних товарів.", "Престижними стали професії, що давали доступ до дефіциту: продавець, комірник, товарознавець.", "Поширювався алкоголізм, зростала кількість побутових злочинів."], "img": null}], "note": null}, {"type": "text", "kicker": "Суспільство", "title": "Пропаганда й погляд ззовні", "badges": [], "paras": ["Радянська пропаганда переконувала, що на Заході панують злидні, а в СРСР — добробут.", "Американський журнал TIME порівняв ціни в доларах. Робітник у Нью-Йорку заробляв близько 266 доларів на тиждень, у Москві — близько 57. Плата за квартиру в Москві була в десятки разів нижчою, а лікар приймав безкоштовно.", "Зате щоб купити «Жигулі», москвич мусив працювати понад три роки, а житель Нью-Йорка заробляв на автомобіль менш ніж за пів року. На кольоровий телевізор москвич заробляв 19 тижнів, а житель Нью-Йорка — три.", "Обидва зображення — джерела: перше показує, у чому влада переконувала громадян, друге — як радянське життя бачили на Заході."], "imgs": [{"key": "s043_mix", "cap": "Угорі: радянський плакат «У них — безправ’я, безробіття, злидні. У нас — рівноправ’я, свобода, добробут». Унизу: інфографіка журналу TIME «Ціни двох міст: Нью-Йорк і Москва», початок 1980-х рр., автор Найджел Голмс"}]}]}, {"id": "s6", "num": "VI", "title": "Узагальнення", "sub": "Чому система опинилася в кризі, керівники, поняття, стрічка часу", "cover": null, "cards": [{"type": "defs", "title": "Чому радянська система опинилася в кризі", "badges": [], "items": [{"name": "Економіка", "paras": ["• екстенсивний розвиток, застаріле обладнання", "• повільне впровадження нових технологій", "• хронічний дефіцит, низька якість товарів", "• криза колгоспного села, закупівлі зерна за кордоном"], "img": null}, {"name": "Влада й ідеологія", "paras": ["• старіння керівництва, «стабільність кадрів»", "• корупція в номенклатурі", "• зневіра людей у комунізмі", "• переслідування інакодумців"], "img": null}, {"name": "Суспільство", "paras": ["• відплив молоді із сіл", "• зросійщення", "• тіньова економіка й алкоголізм", "• забруднення довкілля великими заводами й хімізацією сільського господарства"], "img": null}], "note": "Усі ці проблеми накопичувалися поволі, і доки в країну надходили гроші за нафту, керівництво їх не помічало. Коли в середині 1980-х рр. ціни на нафту впали, криза стала очевидною."}, {"type": "table", "title": "Хто керував СРСР і УРСР", "rows": [["Посада", "Хто", "Роки", "Чим запам’ятався"], ["Генсек ЦК КПРС", "Леонід Брежнєв", "1964 – 1982", "Усунув Хрущова; «стабільність кадрів», розвинений соціалізм, Конституція 1977 р."], ["Голова Ради Міністрів СРСР", "Олексій Косигін", "1964 – 1980", "Господарська реформа 1965 р."], ["Перший секретар ЦК КПУ", "Петро Шелест", "1963 – 1972", "Захищав інтереси республіки й українську культуру; усунутий 1972 р."], ["Перший секретар ЦК КПУ", "Володимир Щербицький", "1972 – 1989", "Повне підпорядкування Москві, посилення русифікації й переслідувань"], ["Генсек ЦК КПРС", "Юрій Андропов", "1982 – 1984", "Боротьба за дисципліну й проти корупції (частина 2)"], ["Генсек ЦК КПРС", "Костянтин Черненко", "1984 – 1985", "Повернення до брежнєвських порядків (частина 2)"]]}, {"type": "table", "title": "Поняття частини 1", "rows": [["Поняття", "Що означає"], ["Застій", "Період 1965 – 1985 рр. в історії СРСР, коли влада намагалася зберегти незмінною радянську систему, а в економіці, політиці й суспільстві наростали кризові явища."], ["Номенклатура", "Керівники, яких призначали на посади лише з дозволу партійних комітетів, і перелік таких посад; привілейована правляча верства."], ["Розвинений соціалізм", "Ідеологічне поняття: оголошений у 1967 р. етап, що мав передувати комунізму. Ним замінили нездійсненну обіцянку збудувати комунізм до 1980 р."], ["Дефіцит", "Нестача товарів і послуг, коли попит перевищує пропозицію; постійна риса радянської планової економіки."]]}, {"type": "tl_events", "title": "Стрічка часу: події частини 1", "note": "Відстані між подіями однакові для наочності. Програмні дати теми (1965, 1970 – 1972, 1972, 1976) — у стрічці частини 2.", "items": [{"year": "жовтень 1964", "name": "Усунення Хрущова", "desc": "першим секретарем ЦК КПРС став Брежнєв", "color": "#e97132", "prog": false}, {"year": "1965", "name": "Косигінська реформа", "desc": "скасовано раднаргоспи; госпрозрахунок", "color": "#a9dda0", "prog": false}, {"year": "1966 – 1970", "name": "«Золота» п’ятирічка", "desc": "найвищі темпи зростання за роки «застою»", "color": "#a9dda0", "prog": false}, {"year": "травень 1972", "name": "Щербицький", "desc": "замість Шелеста очолив КПУ", "color": "#6ea8c9", "prog": false}, {"year": "1977", "name": "Перша АЕС", "desc": "Чорнобильська АЕС дала струм", "color": "#a9dda0", "prog": false}, {"year": "квітень 1978", "name": "Конституція УРСР", "desc": "«розвиненого соціалізму»", "color": "#e97132", "prog": false}, {"year": "травень 1982", "name": "Продовольча програма", "desc": "мета — подолати нестачу продуктів", "color": "#b48ae0", "prog": false}, {"year": "листопад 1982", "name": "Смерть Брежнєва", "desc": "генсеком став Андропов", "color": "#e97132", "prog": false}]}]}]}, {"id": "p2", "num": 2, "title": "Україна в період загострення кризи радянської системи (1965 – 1985)", "part": "Частина 2. Опір, культура, кінець доби", "sub": "Дисиденти й Українська Гельсінська група, кримські татари й віруючі, русифікація, наука, культура, Андропов і Черненко", "cover": {"key": "s053_image56", "cap": ""}, "program": {"type": "generic", "title": "Програма НМТ: тема «Україна в період загострення кризи радянської системи»", "badges": [], "blocks": [{"k": "h", "text": "Дати", "light": false}, {"k": "p", "paras": ["• **1965 р.** — перша хвиля масових арештів діячів антирежимного руху", "• **1970 – 1972 рр.** — видання самвидавного «Українського вісника»", "• **1972 р.** — друга хвиля масових арештів", "• **1976 р.** — створення Української Гельсінської групи"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Поняття", "light": false}, {"k": "p", "paras": ["• у частині 2: **«самвидав», «тамвидав», «правозахисник»**", "• у частині 1: «застій», «номенклатура», «розвинений соціалізм», «дефіцит»"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Персоналії", "light": false}, {"k": "p", "paras": ["• Іван Дзюба, Валерій Марченко, Петро Григоренко, Микола Руденко, В’ячеслав Чорновіл, Михайло Брайчевський, Сергій Параджанов, Іван Миколайчук, Олесь Гончар, Леонід Биков, Володимир Івасюк, Мустафа Джемілєв, Микола Амосов, Олег Антонов"], "italic": false}, {"k": "sep"}, {"k": "h", "text": "Пам’ятки й уміння", "light": false}, {"k": "p", "paras": ["• картина Марії Приймаченко **«Гороховий звір»** (1971)", "• **пам’ятний знак на честь заснування Києва** (скульптор Василь Бородай, 1982)", "• пояснювати вимоги й значення дисидентського руху, політику зросійщення, явища культури"], "italic": false}, {"k": "sep"}, {"k": "muted", "paras": ["Програма НМТ з історії України (наказ МОН № 696 від 26.06.2018), тема 29."]}]}, "sections": [{"id": "s1", "num": "VI", "title": "Дисидентський рух", "sub": "Хто такі дисиденти, самвидав і тамвидав, хвилі арештів 1965 і 1972 рр., «Український вісник», Українська Гельсінська група", "cover": {"key": "s047_image49", "cap": ""}, "cards": [{"type": "tl_periods", "title": "Стрічка часу: дисидентський рух (1965 – 1985)", "note": "Третя хвиля арештів почалася наприкінці 1970-х рр. і тривала до середини 1980-х рр. Шкала часу пропорційна.", "x_from": 1964.5, "x_to": 1986, "ticks": [[1965, "1965"], [1970, "1970"], [1975, "1975"], [1980, "1980"], [1985, "1985"]], "events": [[1965.7, "вересень 1965"], [1975.6, "Гельсінкі, 1975"], [1985.2, "березень 1985"]], "prog": [[1965, 1965.3, "1965"], [1970, 1972.6, "1970 – 1972 · 1972"], [1976, 1976.3, "1976"]], "rows": [{"name": "Хвилі арештів", "segs": [{"a": 1965.6, "b": 1966.5, "color": "#b48ae0", "sub": "1965"}, {"a": 1972.0, "b": 1973.3, "color": "#b48ae0", "sub": "1972"}, {"a": 1979.5, "b": 1985, "color": "#b48ae0", "sub": "третя хвиля"}]}, {"name": "Самвидав", "segs": [{"a": 1965.9, "b": 1970, "color": "#6ea8c9", "sub": "самвидав"}, {"a": 1970, "b": 1972.1, "color": "#e97132", "sub": "Вісник"}]}, {"name": "Правозахисники", "segs": [{"a": 1976.85, "b": 1986, "color": "#a9dda0", "sub": "Українська Гельсінська група"}]}, {"name": "Перший секретар ЦК КПУ", "segs": [{"a": 1964.5, "b": 1972.4, "color": "#5b93bd", "sub": "Петро Шелест"}, {"a": 1972.45, "b": 1986, "color": "#d9b26f", "sub": "Володимир Щербицький"}]}]}, {"type": "defs", "title": "Хто такі дисиденти", "badges": [], "items": [{"name": "Звідки вони взялися", "paras": ["Багато дисидентів починали як **шістдесятники** — молоді поети, художники, науковці часів «відлиги».", "Коли влада почала згортати «відлигу», частина з них перейшла від творчості до відкритого протесту."], "img": null}, {"name": "Чого вимагали", "paras": ["Щоб влада дотримувалася законів і Конституції СРСР: не обмежувала свободи слова, судила відкрито.", "Захистити українську мову й культуру від русифікації.", "Звільнити політичних в’язнів; дозволити кримським татарам повернутися додому."], "img": null}, {"name": "Хто належав до руху", "paras": ["Здебільшого інтелігенти: письменники, літературознавці, історики, кінорежисери, вчителі.", "Їх було небагато — кілька сотень людей, але про них знали й за кордоном."], "img": null}], "note": "Дисидент (від латин. dissidens — «незгодний») — людина, яка відкрито не погоджується з офіційною ідеологією і владою. Про шістдесятників і дисидентів часів «відлиги» йшлося в темі 28."}, {"type": "defs", "title": "Течії дисидентського руху", "badges": [], "items": [{"name": "Національна", "paras": ["Захищали права українського народу, мову й культуру, критикували русифікацію.", "Іван Дзюба, В’ячеслав Чорновіл, Валерій Марченко, Михайло Брайчевський."], "img": null}, {"name": "Правозахисна", "paras": ["Домагалися, щоб влада виконувала власні закони й міжнародні угоди про права людини.", "Українська Гельсінська група: Микола Руденко, Петро Григоренко, Левко Лук’яненко."], "img": null}, {"name": "Релігійна", "paras": ["Греко-католики, баптисти, п’ятидесятники, свідки Єгови захищали право вірити й молитися."], "img": null}, {"name": "Кримськотатарська", "paras": ["Кримські татари боролися за повернення на батьківщину, з якої їх 1944 р. виселила радянська влада.", "Рух очолював Мустафа Джемілєв."], "img": null}], "note": null}, {"type": "cols", "title": "Як боролися дисиденти і чим відповідала влада", "badges": ["НМТ: поняття"], "intro": null, "blocks": [{"h": "Методи дисидентів", "paras": ["• листи-протести до керівників УРСР і СРСР, до ООН", "• **самвидав** і **тамвидав**", "• публічні протести, як-от виступ на прем’єрі «Тіней забутих предків» 1965 р.", "• підтримка репресованих і їхніх родин", "• правозахисні групи, що збирали факти порушень прав людини й передавали їх за кордон"]}, {"h": "Методи влади", "paras": ["• звільнення з роботи, виключення з партії й творчих спілок", "• «громадський осуд» на зборах, викривальні статті в газетах", "• арешти, закриті суди, вироки до таборів суворого режиму й заслання", "• примусове «лікування» в психіатричних лікарнях", "• позбавлення громадянства й видворення за кордон"]}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Самвидав і тамвидав", "badges": ["НМТ: поняття"], "paras": ["**Самвидав** — твори, яких радянська цензура не пропускала до друку. Їх передруковували на машинці чи переписували від руки й таємно передавали з рук у руки.", "Так поширювали вірші й статті дисидентів, листи-протести, заборонені книжки, звернення до влади. За зберігання самвидаву могли ув’язнити.", "**Тамвидав** — твори, які таємно переправляли за кордон і там друкували. Так у Канаді, США й Західній Європі вийшли праці Дзюби, Чорновола, Брайчевського. Частину накладу потім таємно завозили до СРСР.", "**Правозахисник** — той, хто відстоює права й свободи людини, зокрема перед державою, що їх порушує."], "imgs": [{"key": "s052_image54", "cap": "Книжка В. Чорновола «Правосуддя чи рецидиви терору? Лихо з розуму», видання за кордоном"}, {"key": "s052_image55", "cap": "Праця М. Брайчевського «Приєднання чи возз’єднання?», видання в Торонто"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Перша хвиля арештів (1965 р.)", "badges": ["НМТ: дата"], "paras": ["Наприкінці **серпня — на початку вересня 1965 р.** КДБ заарештував у Києві, Львові, Івано-Франківську, Луцьку та інших містах понад 20 молодих інтелігентів. Серед них — Іван Світличний, брати Михайло й Богдан Горині, художник Панас Заливаха, Михайло Осадчий, Валентин Мороз.", "Їх звинуватили в «антирадянській агітації»: вони читали й поширювали самвидав. Суди в 1966 р. були закриті. Більшість заарештованих засудили на строк від кількох місяців до шести років таборів.", "Це були перші масові арешти української інтелігенції після смерті Сталіна. Вони показали, що «відлига» скінчилася."], "imgs": [{"key": "kgb65", "cap": "Спеціальне повідомлення КДБ УРСР до ЦК КПУ про протест у кінотеатрі «Україна», вересень 1965 р. Фото: Qypchak / Wikimedia Commons, Public domain"}]}, {"type": "doc", "title": "Протест у кінотеатрі «Україна» (1965 р.)", "quote": ["Після виступу режисера-постановника Параджанова на сцену піднявся літературний критик Дзюба Іван Михайлович, який звернувся до глядачів із промовою.", "«Зараз відбуваються масові політичні арешти української інтелігенції та молоді в Києві, Львові та інших містах. Повторюється 1937 рік. Молодь повинна заявити протест владі, затаврувати ганьбою за несправедливість».", "Присутній у залі кореспондент Чорновіл звернувся до публіки із закликом підвестися з місць на знак протесту проти «політичних репресій»."], "source": "Спецповідомлення КДБ УРСР до ЦК КПУ, вересень 1965 р. (переклад з рос.)", "comment": ["На прем’єрі фільму **«Тіні забутих предків»** Іван **Дзюба**, В’ячеслав **Чорновіл** і Василь **Стус** уперше в СРСР публічно виступили проти політичних арештів.", "Частина глядачів підвелася й аплодувала, але адміністрація кінотеатру перервала виступ.", "Учасників протесту покарали: Чорновола звільнили з роботи, Стуса виключили з аспірантури."], "img": {"key": "s051_image53", "cap": "Друга сторінка повідомлення з підписом голови КДБ УРСР В. Нікітченка"}}, {"type": "text", "kicker": "Дисидентський рух", "title": "Іван Дзюба", "badges": ["НМТ: персоналія"], "paras": ["Іван Дзюба (1931 – 2022) — літературознавець і критик з Донеччини. На початку 1960-х рр. він уже був відомим шістдесятником, а 1962 р. втратив роботу в журналі «Вітчизна» «за ідеологічні помилки».", "4 вересня 1965 р. Дзюба виступив на прем’єрі «Тіней забутих предків». У грудні того ж року він надіслав Петрові Шелесту й Володимиру Щербицькому працю **«Інтернаціоналізм чи русифікація?»**. Цифрами й цитатами з Леніна він довів, що національна політика КПРС веде до знищення української мови й культури.", "Праця розійшлася в самвидаві, а 1968 р. вийшла друком за кордоном. У 1972 р. Дзюбу заарештували, а 1973 р. засудили до п’яти років таборів і п’яти років заслання. Того ж року він написав прохання про помилування, і його звільнили.", "У незалежній Україні Іван Дзюба був міністром культури (1992 – 1994), його обрали академіком."], "imgs": [{"key": "dziuba", "cap": "Іван Дзюба, фото з кримінальної справи КДБ, 1972 р. Фото: КДБ УРСР / Wikimedia Commons, Public domain"}, {"key": "s078_image88", "cap": "Іван Дзюба в роки незалежності"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Михайло Брайчевський", "badges": ["НМТ: персоналія"], "paras": ["Михайло Брайчевський (1924 – 2001) — історик і археолог, автор праць про походження Русі й заснування Києва.", "У 1966 р. він написав працю **«Приєднання чи возз’єднання?»**. Брайчевський довів, що Переяславська угода 1654 р. не була «возз’єднанням двох братніх народів», як твердили радянські історики, а стала початком поневолення України Московською державою.", "Праця поширювалася в самвидаві, а 1972 р. вийшла друком у Канаді. Брайчевського звільнили з Інституту історії АН УРСР і на багато років позбавили змоги друкуватися. Зректися своїх поглядів він відмовився."], "imgs": [{"key": "s086_image96", "cap": "Михайло Брайчевський"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "В’ячеслав Чорновіл", "badges": ["НМТ: персоналія"], "paras": ["В’ячеслав Чорновіл (1937 – 1999) — журналіст із Черкащини. У 1965 р. він закликав глядачів кінотеатру «Україна» підвестися на знак протесту.", "Його викликали свідком на закриті суди над тими, кого заарештували в 1965 р., але свідчити Чорновіл відмовився. Він зібрав документи цих процесів і в 1966 – 1967 рр. написав праці **«Правосуддя чи рецидиви терору?»** і **«Лихо з розуму»**. За це суд засудив його до трьох років ув’язнення.", "У 1970 – 1972 рр. Чорновіл видавав «Український вісник». Його заарештовували ще в 1972 і 1980 рр.; загалом він провів в ув’язненні й на засланні 15 років.", "Наприкінці 1980-х рр. Чорновіл став одним із лідерів Народного Руху України, а 1991 р. посів друге місце на виборах Президента України."], "imgs": [{"key": "chornovil", "cap": "В’ячеслав Чорновіл, 1990-ті рр. Фото: М.Яковенко, В.Білецький / Wikimedia Commons, Public domain"}, {"key": "s080_image90", "cap": "В’ячеслав Чорновіл"}]}, {"type": "doc", "title": "Лист-протест 139 (квітень 1968 р.)", "quote": ["Звертаємося до Вас із питання, що глибоко хвилює різні кола радянської громадськості.", "Протягом кількох останніх років у Радянському Союзі відбуваються політичні процеси над молодими людьми з середовища творчої і наукової інтелігенції.", "Наприклад, усі процеси в Києві, Львові та Івано-Франківську 1965 – 1966 рр., на яких засуджено понад 20 осіб, відбувалися в закритому порядку — всупереч тому, що прямо й недвозначно гарантовано Конституцією СРСР…"], "source": "Лист до Л. Брежнєва, О. Косигіна, М. Підгорного, 1968 (переклад з рос.)", "comment": ["Лист підписали **139** науковців, письменників, художників і робітників з України. Серед них — Сергій Параджанов, Олег Антонов, Ліна Костенко, Іван Драч.", "Автори не виступали проти радянської влади: вони вимагали, щоб вона дотримувалася власних законів.", "Багатьох підписантів звільнили з роботи або виключили з партії."], "img": {"key": "s047_image47", "cap": "Перші підписи під листом"}}, {"type": "text", "kicker": "Дисидентський рух", "title": "«Український вісник» (1970 – 1972 рр.)", "badges": ["НМТ: дата"], "paras": ["У **1970 – 1972 рр.** у самвидаві виходив журнал **«Український вісник»**. Його редактором і видавцем був В’ячеслав **Чорновіл**, але імен укладачів журнал не називав.", "«Вісник» повідомляв про арешти, суди й обшуки, публікував листи-протести і твори, заборонені цензурою. Так в Україні та за кордоном дізнавалися про порушення прав людини.", "Вийшло шість випусків. Їх передруковували на машинках, а за кордоном видали окремими книжками.", "Під час арештів 1972 р. КДБ шукав саме авторів «Вісника». У 1974 р. інші укладачі випустили ще один номер, а відновив журнал Чорновіл уже за перебудови, 1987 р."], "imgs": [{"key": "s009_image10", "cap": "В’ячеслав Чорновіл, фото з кримінальної справи"}, {"key": "s048_image51", "cap": "Протокол КДБ: згадка про «антирадянський журнал “Український вісник”» і працю Дзюби"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Друга хвиля арештів (1972 р.)", "badges": ["НМТ: дата"], "paras": ["У **січні 1972 р.** КДБ провів у Києві, Львові та інших містах сотні обшуків і заарештував десятки людей. Приводом стала справа бельгійського студента Ярослава Добоша, якого звинуватили у зв’язках з українськими емігрантами.", "Серед заарештованих — В’ячеслав Чорновіл, Іван Світличний, Євген Сверстюк, Василь Стус, Ірина Калинець, а у квітні — Іван Дзюба. У 1973 р. ув’язнили Валерія Марченка й Сергія Параджанова.", "Їх судили за статтею про «антирадянську агітацію і пропаганду» й засуджували до 5 – 12 років таборів і заслання. Сотні людей, які підписували листи на захист заарештованих, втратили роботу.", "Ця хвиля, що збіглася з усуненням Шелеста, була найбільшою за всю добу «застою»."], "imgs": [{"key": "s009_image9", "cap": "Василь Стус, фото з кримінальної справи"}, {"key": "perm36", "cap": "Табір «Перм-36», де тримали українських політв’язнів Фото: Gerald Praschl / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Валерій Марченко", "badges": ["НМТ: персоналія"], "paras": ["Валерій Марченко (1947 – 1984) — літературознавець, журналіст і перекладач з Києва, онук історика Михайла Марченка.", "У **1973 р.** його заарештували за статті, що поширювалися в самвидаві. Його засудили до шести років таборів і двох років заслання. В ув’язненні в нього почалася тяжка хвороба нирок.", "Після повернення він написав відкритого листа проти посиленого вивчення російської мови в школах. У 1983 р. Марченка заарештували вдруге й засудили до десяти років таборів і п’яти років заслання.", "Важкохворий Марченко помер у тюремній лікарні 1984 р. Йому було 37 років."], "imgs": [{"key": "s084_image94", "cap": "Валерій Марченко"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Василь Стус", "badges": ["персоналія теми 28"], "paras": ["Василь Стус (1938 – 1985) — поет і перекладач. Він народився на Вінниччині, а виріс у Донецьку. У 1965 р. він разом із Дзюбою та Чорноволом протестував у кінотеатрі «Україна», за що його виключили з аспірантури.", "У 1972 р. Стуса заарештували й засудили до п’яти років таборів і трьох років заслання. У 1979 р. він вступив до Української Гельсінської групи, а 1980 р. його засудили вдруге — до десяти років таборів і п’яти років заслання.", "Вірші він писав і в таборі, але більшість із них у нього відібрали. Стус помер у карцері табору в Пермській області у вересні 1985 р.", "У 1989 р. його перепоховали в Києві."], "imgs": [{"key": "s041_image45", "cap": "Василь Стус серед друзів"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Гельсінська нарада (1975 р.)", "badges": [], "paras": ["**1 серпня 1975 р.** у Гельсінкі керівники 33 європейських держав, США і Канади підписали Заключний акт Наради з безпеки і співробітництва в Європі.", "Для СРСР головним було те, що держави визнали непорушність кордонів, які склалися після Другої світової війни.", "Водночас СРСР пообіцяв поважати права людини й основні свободи: свободу думки, совісті, переконань, право вільно обмінюватися інформацією.", "Текст угоди надрукували в радянських газетах. Дисиденти побачили в ньому законну підставу вимагати від влади виконувати взяті зобов’язання."], "imgs": [{"key": "helsinki", "cap": "Підписання Заключного акта в Гельсінкі, 1 серпня 1975 р. Фото: Horst Sturm / Wikimedia Commons, CC BY-SA 3.0 de"}, {"key": "s054_image57", "cap": "Леонід Брежнєв підписує Заключний акт"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Українська Гельсінська група (1976 р.)", "badges": ["НМТ: дата"], "paras": ["**9 листопада 1976 р.** у Києві правозахисники оголосили про створення **Української громадської групи сприяння виконанню Гельсінських угод** (Української Гельсінської групи, УГГ). Її очолив письменник Микола **Руденко**.", "Серед десяти засновників — Петро **Григоренко**, Левко Лук’яненко, Олесь Бердник, Оксана Мешко, Ніна Строката, Олекса Тихий, Мирослав Маринович.", "Група збирала факти порушення прав людини в Україні й передавала їх за кордон, захищала політв’язнів і вимагала, щоб Україна мала власне представництво на міжнародних нарадах.", "Влада відповіла арештами. До середини 1980-х рр. більшість членів групи опинилася в таборах; Олекса Тихий, Юрій Литвин, Валерій Марченко, Василь Стус загинули в ув’язненні."], "imgs": [{"key": "s055_image58", "cap": "Засновники Української Гельсінської групи"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Микола Руденко", "badges": ["НМТ: персоналія"], "paras": ["Микола Руденко (1920 – 2004) — письменник і філософ з Луганщини, учасник Другої світової війни. Він редагував журнал «Дніпро» і був секретарем парторганізації Спілки письменників України.", "У 1970-х рр. Руденко розчарувався в марксизмі й написав праці з економіки, у яких критикував радянську систему. За це його виключили з партії і зі Спілки письменників.", "У **1976 р.** він став засновником і першим головою Української Гельсінської групи. У 1977 р. Руденка заарештували й засудили до семи років таборів і п’яти років заслання.", "У 1987 р. його звільнили й змусили виїхати за кордон. У 1990 р. Руденко повернувся в Україну."], "imgs": [{"key": "s085_image95", "cap": "Микола Руденко"}]}, {"type": "text", "kicker": "Дисидентський рух", "title": "Петро Григоренко", "badges": ["НМТ: персоналія"], "paras": ["Петро Григоренко (1907 – 1987) — генерал-майор Радянської армії, родом із Запорізької області. У 1961 р. він на партійній конференції розкритикував привілеї номенклатури.", "У 1964 р. Григоренка заарештували за створення «Спілки боротьби за відродження ленінізму», позбавили генеральського звання й запроторили до психіатричної лікарні.", "Після звільнення він захищав кримських татар, за що з 1969 р. його знову п’ять років «лікували» в психіатричних лікарнях.", "У 1976 р. Григоренко став одним із засновників Московської й Української Гельсінських груп. У 1977 р. він виїхав на лікування до США, і влада позбавила його громадянства СРСР."], "imgs": [{"key": "s079_image89", "cap": "Петро Григоренко"}]}]}, {"id": "s2", "num": "VII", "title": "Кримські татари й віруючі", "sub": "Рух за повернення кримських татар, Мустафа Джемілєв, релігійне дисидентство", "cover": {"key": "s058_image60", "cap": ""}, "cards": [{"type": "text", "kicker": "Кримські татари", "title": "Рух кримських татар за повернення додому", "badges": [], "paras": ["У травні **1944 р.** радянська влада виселила всіх кримських татар до Середньої Азії. Десятки тисяч людей загинули в дорозі й у перші роки на засланні.", "У 1967 р. указ Президії Верховної Ради СРСР зняв із кримських татар звинувачення в зраді, але права повернутися до Криму їм так і не дали.", "Кримські татари збирали підписи під петиціями (по кілька десятків тисяч під кожною), посилали делегації до Москви, проводили мітинги. Тих, хто самовільно повертався, міліція виселяла знову.", "Кримських татар підтримували Петро Григоренко й українські правозахисники. Масово повернутися на батьківщину кримські татари змогли лише наприкінці 1980-х рр."], "imgs": [{"key": "s058_image59", "cap": "Мустафа Джемілєв у молоді роки"}]}, {"type": "text", "kicker": "Кримські татари", "title": "Мустафа Джемілєв", "badges": ["НМТ: персоналія"], "paras": ["Мустафа Джемілєв народився в Криму 1943 р., за пів року до депортації, і виріс в Узбекистані.", "Із 1960-х рр. він був лідером руху кримських татар за повернення на батьківщину. Шість разів його засуджували; загалом він провів у таборах і на засланні 15 років.", "У 1975 – 1976 рр., протестуючи проти несправедливого вироку, Джемілєв голодував 303 дні. Його годували примусово.", "У 1991 – 2013 рр. він очолював Меджліс кримськотатарського народу, а з 1998 р. був народним депутатом України. Після окупації Криму 2014 р. Росія заборонила йому в’їзд на півострів."], "imgs": [{"key": "dzhem", "cap": "Мустафа Джемілєв, 2014 р. Фото: Katarzyna Czerwińska / Wikimedia Commons, CC BY-SA 3.0 pl"}, {"key": "s089_image99", "cap": "Мустафа Джемілєв"}]}, {"type": "text", "kicker": "Віруючі", "title": "Релігійне дисидентство", "badges": [], "paras": ["Радянська влада вела атеїстичну пропаганду, закривала храми, не допускала вірян до керівних посад.", "Українську греко-католицьку церкву радянська влада заборонила ще 1946 р. Її священники й віряни молилися таємно — по хатах і в лісах. У 1982 р. Йосип Тереля створив **Ініціативну групу захисту прав віруючих і Церкви**, яка вимагала легалізувати УГКЦ.", "Незареєстровані громади баптистів, п’ятидесятників, свідків Єгови влада переслідувала за «порушення законодавства про культи». Їхніх проповідників ув’язнювали, а дітей могли забрати з родин.", "Релігійні тексти теж поширювали самвидавом."], "imgs": [{"key": "s048_image50", "cap": "Акафіст, передрукований на машинці, — релігійний самвидав"}]}]}, {"id": "s3", "num": "VIII", "title": "Освіта, русифікація, наука", "sub": "Загальна середня освіта, зросійщення шкіл і вишів, учені, багатотомні видання", "cover": {"key": "ure", "cap": ""}, "cards": [{"type": "defs", "title": "Освіта", "badges": [], "items": [{"name": "Середня освіта", "paras": ["До середини 1970-х рр. УРСР перейшла до **обов’язкової середньої освіти**: десятирічну школу закінчували майже всі.", "Будували нові школи, професійно-технічні училища (ПТУ) і технікуми."], "img": null}, {"name": "Якість навчання", "paras": ["Школи мусили звітувати про стовідсоткову успішність, тому слабких учнів «витягали» до атестата.", "Підручники й програми були перевантажені ідеологією."], "img": null}, {"name": "Вища освіта", "paras": ["Кількість вишів і студентів зростала.", "Вступ до престижних вишів часто залежав від зв’язків і хабарів."], "img": null}, {"name": "Реформа 1984 р.", "paras": ["Запровадили **одинадцятирічне навчання** з шести років.", "Посилили трудове навчання в школах."], "img": null}], "note": null}, {"type": "defs", "title": "Русифікація шкіл і вишів", "badges": ["НМТ: уміння"], "items": [{"name": "«Вільний вибір»", "paras": ["Батькам дозволяли самим обирати мову навчання дітей.", "Але без російської мови важко було вступити до вишу чи отримати добру роботу, тож багато хто віддавав дітей до шкіл з російською мовою навчання."], "img": null}, {"name": "Постанови 1978 і 1983 рр.", "paras": ["Після постанови ЦК КПРС **1978 р.** російську мову почали вчити з першого класу й навіть у дитячих садках.", "За постановою **1983 р.** вчителям російської мови в селах і селищах підвищили зарплату на **15 %**, а класи, де було понад 25 учнів, на уроках цієї мови ділили на дві групи.", "Батьки могли звільнити дітей від вивчення української мови."], "img": null}, {"name": "Наслідки", "paras": ["Вищі навчальні заклади, наука й більшість газет майже повністю перейшли на російську мову.", "У Криму не лишилося жодної української школи, а у великих містах Сходу й Півдня їх лишилися одиниці."], "img": null}], "note": null}, {"type": "map", "title": "Скільки учнів навчалося українською (1991/1992 н. р.)", "steps": [{"key": "zs_schools", "label": "Крок 1"}]}, {"type": "defs", "title": "Учені УРСР", "badges": [], "items": [{"name": "Віктор Глушков", "paras": ["Директор Інституту кібернетики АН УРСР.", "Його інститут створив обчислювальні машини «Мир» і «Дніпро»."], "img": {"key": "glushkov", "cap": "Художній маркований конверт 1983 р. Фото: Бендель Пётр Эмильевич (1905 – 1989) / Wikimedia Commons, Public domain"}}, {"name": "Борис Патон", "paras": ["Президент Академії наук УРСР з 1962 р.", "Його Інститут електрозварювання розробив способи зварювання металів, зокрема в космосі: у 1969 р. метал уперше зварили на орбіті."], "img": null}, {"name": "Василь Ремесло", "paras": ["Селекціонер з Миронівки.", "Вивів сорт пшениці «Миронівська 808», яким засівали мільйони гектарів у СРСР і за кордоном."], "img": null}], "note": "Наукових працівників в УРСР ставало дедалі більше, але наукові досягнення впроваджували у виробництво повільно, трохи швидше — у військову промисловість. Про Миколу Амосова й Олега Антонова розповідають окремі слайди."}, {"type": "text", "kicker": "Наука", "title": "Микола Амосов", "badges": ["НМТ: персоналія"], "paras": ["Микола Амосов (1913 – 2002) — хірург, учений і письменник. Він закінчив медичний інститут і заочно — індустріальний, під час війни працював польовим хірургом.", "З 1952 р. Амосов працював у Києві. Він одним із перших у СРСР почав робити операції на серці зі штучним кровообігом. У **1963 р.** уперше в СРСР замінив хворий мітральний клапан серця штучним.", "Амосов створив Інститут серцево-судинної хірургії (тепер — його імені), написав популярні книжки «Думки і серце», «Роздуми про здоров’я», виступав за здоровий спосіб життя."], "imgs": [{"key": "amosov", "cap": "Микола Амосов, 1984 р. Фото: Published by the Embassy of the Union of Soviet Socialist Republics to the United States of America - photographer uncredited / Wikimedia Commons, Public domain"}, {"key": "s090_image100", "cap": "Микола Амосов у останні роки життя"}]}, {"type": "text", "kicker": "Наука", "title": "Олег Антонов", "badges": ["НМТ: персоналія"], "paras": ["Олег Антонов (1906 – 1984) — авіаконструктор. З 1946 р. він очолював конструкторське бюро, яке 1952 р. переїхало до Києва (тепер — компанія «Антонов»).", "Його бюро створило понад 20 типів літаків марки **«Ан»**: легкий Ан-2, пасажирські Ан-10 і Ан-24, вантажний Ан-22 «Антей» — тоді найбільший літак світу.", "Остання велика робота Антонова — найбільший серійний вантажний літак **Ан-124 «Руслан»** (перший політ — 1982 р.). Уже після його смерті бюро збудувало Ан-225 «Мрія».", "У 1968 р. Антонов підписав лист-протест 139."], "imgs": [{"key": "s063_image62", "cap": "Олег Антонов біля моделі літака"}, {"key": "antei65", "cap": "Ан-22 «Антей» на поштовій марці СРСР, 1965 р."}]}, {"type": "text", "kicker": "Наука", "title": "Ан-124 «Руслан» і багатотомні видання", "badges": [], "paras": ["Літаки Антонова збирали на заводах Києва й Харкова. «Руслан» міг перевозити 120 тонн вантажу.", "Учені-гуманітарії підготували багатотомні праці: «Історія Української РСР» (8 томів), «Історія української літератури» (8 томів), «Історія українського мистецтва» (6 томів), «Археологія Української РСР» (3 томи), «Історія міст і сіл УРСР» (26 томів), «Українська радянська енциклопедія».", "У цих виданнях і нині можна знайти багато фактів, але їх писали за обов’язковими ідеологічними схемами, і про багато подій там не сказано правди."], "imgs": [{"key": "an124", "cap": "Ан-124 «Руслан» Фото: K.M. ABU BAKAR SIDDIQUE / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "s064_image68", "cap": "«Археологія Української РСР» у трьох томах"}]}]}, {"id": "s4", "num": "IX", "title": "Література, кіно, музика, мистецтво", "sub": "Олесь Гончар і «Собор», поетичне кіно, Биков, Івасюк, Приймаченко, пам’ятні знаки", "cover": {"key": "s066_image76", "cap": ""}, "cards": [{"type": "text", "kicker": "Література", "title": "Олесь Гончар", "badges": ["НМТ: персоналія"], "paras": ["Олесь Гончар (1918 – 1995) — письменник, який виріс на Полтавщині, учасник Другої світової війни. У 1959 – 1971 рр. він очолював Спілку письменників України.", "Його романи «Прапороносці», «Людина і зброя», «Тронка», «Циклон», «Берег любові», «Твоя зоря» видавали великими тиражами, їх вивчали в школах.", "У **1968 р.** вийшов роман **«Собор»** — про те, як у степовому промисловому місті хочуть зруйнувати старий козацький собор. У романі йдеться про історичну пам’ять і про партійних кар’єристів, яким вона заважала.", "Партійні ідеологи розгорнули проти «Собору» кампанію, і в 1971 р. Гончара усунули з посади голови Спілки письменників."], "imgs": [{"key": "s083_image93", "cap": "Олесь Гончар"}, {"key": "sobor_nm", "cap": "Троїцький собор у Новомосковську (тепер Самар) — прообраз собору з роману Фото: Mvidyakin / Wikimedia Commons, CC BY-SA 3.0"}]}, {"type": "doc", "title": "Кампанія проти роману «Собор» (1968 р.)", "quote": ["Щойно прочитав «Собор». Орлиний, соколиний роман ви написали, роман-набат! О, як засичить ота наша ретроградська гидь, узнавши сама себе…", "Здавалося б, усе минулося, «прошло без сучка й задоринки»: народ, від якого забрано й приховано історію його духу, як приховують від прийомної дитини, хто її батьки і куди вони поділися, — народ цей звик, «безмолвствует» — і раптом «Собор»!"], "source": "Із листа письменника Григора Тютюнника до Олеся Гончара, 1968 р. (скорочено)", "comment": ["Кампанію почав перший секретар Дніпропетровського обкому Олексій **Ватченко**: він упізнав себе в одному з персонажів роману. На пленумі ЦК КПУ «Собор» назвали «ідейно хибним».", "На Дніпропетровщині людей, які підтримали роман, виключали з партії й комсомолу, звільняли з роботи. Про це розповів «Лист творчої молоді Дніпропетровська» (1968), який написав поет Іван Сокульський. За цей лист його 1970 р. засудили до чотирьох з половиною років таборів.", "Аж до кінця 1980-х рр. роман фактично був під забороною."], "img": null}, {"type": "text", "kicker": "Література", "title": "Література під забороною", "badges": ["персоналія теми 28"], "paras": ["Усе, що не вкладалося в «соціалістичний реалізм», не друкували. Поети-шістдесятники або замовкали, або писали «в шухляду».", "Ліну **Костенко** не друкували понад десять років. Лише 1977 р. вийшла збірка «Над берегами вічної ріки», а 1979 р. — історичний роман у віршах «**Маруся Чурай**».", "Твори Василя Стуса, Ігоря Калинця, Миколи Руденка в Україні поширювалися тільки в самвидаві, а друком виходили за кордоном.", "Керівні посади в літературі обіймали письменники, яким влада довіряла, — наприклад, Павло Загребельний, голова Спілки письменників з 1979 р."], "imgs": [{"key": "kostenko", "cap": "Ліна Костенко Фото: keymaster / Wikimedia Commons, GFDL"}, {"key": "churai79", "cap": "Перше видання роману «Маруся Чурай», 1979 р."}]}, {"type": "text", "kicker": "Кіно", "title": "Українське поетичне кіно", "badges": [], "paras": ["У 1960 – 1970-х рр. на Київській кіностудії імені Довженка виникло **українське поетичне кіно**. Режисери показували життя українського села через обряди, фольклор, символи й мальовничі кадри.", "Початок йому поклали **«Тіні забутих предків»** Сергія Параджанова (1964) за повістю Михайла Коцюбинського. Далі вийшли «Криниця для спраглих» і «Білий птах з чорною ознакою» Юрія Іллєнка, «Камінний хрест» Леоніда Осики, «Пропала грамота» Бориса Івченка, «Вавилон ХХ» Івана Миколайчука.", "Влада вважала такі фільми проявом «українського буржуазного націоналізму». Деякі з них роками лежали на полиці, інші виходили в обмежений прокат."], "imgs": [{"key": "s066_image72", "cap": "Афіша фільму «Тіні забутих предків» (1964)"}, {"key": "s066_image73", "cap": "Афіша фільму «Білий птах з чорною ознакою» (1971)"}]}, {"type": "text", "kicker": "Кіно", "title": "Сергій Параджанов", "badges": ["НМТ: персоналія"], "paras": ["Сергій Параджанов (1924 – 1990) — кінорежисер, вірменин за походженням, народився в Тбілісі. З 1950-х рр. він працював на Київській кіностудії.", "Фільм **«Тіні забутих предків»** (1964) приніс йому світову славу. Параджанов знімав його в Карпатах, у масових сценах грали гуцули. Прем’єра 4 вересня 1965 р. перетворилася на протест проти арештів.", "Він підписав лист-протест 139 і виступав на захист заарештованих. У 1969 р. в Єревані зняв фільм «Колір граната».", "У грудні 1973 р. Параджанова заарештували за сфабрикованими звинуваченнями й засудили до п’яти років таборів. Його звільнили 1977 р. після міжнародної кампанії на захист митця."], "imgs": [{"key": "parajanov", "cap": "Сергій Параджанов. Фото Ю. Мечитова Фото: Мечитов, Юрий Михайлович / Wikimedia Commons, CC BY-SA 4.0"}, {"key": "s081_image91", "cap": "Параджанов за ґратами (постановочне фото)"}]}, {"type": "text", "kicker": "Кіно", "title": "Іван Миколайчук", "badges": ["НМТ: персоналія"], "paras": ["Іван Миколайчук (1941 – 1987) — актор, сценарист і режисер з Буковини. Студентом він зіграв Івана в «Тінях забутих предків».", "Він був співавтором сценарію й зіграв одну з головних ролей у фільмі «**Білий птах з чорною ознакою**» (1971), знімався в «Пропалій грамоті» (1972).", "За участь у поетичному кіно Миколайчукові кілька років майже не давали ролей. У 1979 р. він як режисер зняв «**Вавилон ХХ**», а 1981 р. — «Така пізня, така тепла осінь».", "Миколайчук помер у 46 років. У 1988 р. йому посмертно присудили Шевченківську премію."], "imgs": [{"key": "s082_image92", "cap": "Іван Миколайчук"}, {"key": "s066_image74", "cap": "Афіша фільму «Вавилон ХХ» (1979)"}]}, {"type": "text", "kicker": "Кіно", "title": "Леонід Биков", "badges": ["НМТ: персоналія"], "paras": ["Леонід Биков (1928 – 1979) — актор і режисер з Донеччини. Глядачі полюбили його за ролі в комедіях «Максим Перепелиця» (1955) і «Альошкіна любов» (1960).", "На Київській кіностудії імені Довженка він зняв фільми про Другу світову війну, у яких сам зіграв головні ролі: «**В бій ідуть лише “старі”**» (1973, про льотчиків-винищувачів) і «**Ати-бати, йшли солдати…**» (1976).", "Биков показував війну не через подвиги генералів, а через долі звичайних людей. Обидва фільми стали одними з найпопулярніших у СРСР.", "Він загинув в автокатастрофі 1979 р."], "imgs": [{"key": "s087_image97", "cap": "Леонід Биков у фільмі «В бій ідуть лише “старі”»"}, {"key": "s066_image75", "cap": "Афіша фільму «В бій ідуть тільки “старики”» (1973)"}]}, {"type": "text", "kicker": "Музика", "title": "Володимир Івасюк", "badges": ["НМТ: персоналія"], "paras": ["Володимир Івасюк (1949 – 1979) — композитор і поет з Буковини, студент медичного інституту, а згодом — консерваторії у Львові.", "Його пісні «**Червона рута**» і «**Водограй**» (1970) у виконанні Софії Ротару й ансамблю «Смерічка» стали відомими на весь СРСР. Він написав понад сотню пісень.", "Івасюка часто викликали до КДБ. У квітні 1979 р. він зник, а в травні його знайшли повішеним у лісі під Львовом.", "Влада оголосила це самогубством, але багато хто вважав, що композитора вбили. Його похорон у Львові перетворився на мовчазну акцію протесту."], "imgs": [{"key": "s088_image98", "cap": "Володимир Івасюк"}, {"key": "s067_image77", "cap": "Автограф пісні «Червона рута», 1970 р."}, {"key": "smer79", "cap": "Ансамбль «Смерічка», 1979 р. Фото: Sascha1952 / Wikimedia Commons, CC0"}]}, {"type": "monument", "title": "М. Приймаченко «Гороховий звір» (1971)", "badges": [], "img": {"key": "pea", "cap": "Марія Приймаченко. «Гороховий звір», 1971 р. Зображення: wikiart.org"}, "paras": ["Марія **Приймаченко** (1909 – 1997) — художниця з села Болотня на Київщині, найвідоміша представниця **наївного мистецтва** в Україні.", "Вона не мала художньої освіти й малювала гуашшю фантастичних звірів, квіти й птахів, яких вигадувала сама. Багато робіт мають підписи-примовки.", "«Гороховий звір» (1971) — одна з таких істот: червоний звір із рожевою гривою стоїть серед стручків гороху й синіх квітів на жовтому тлі.", "Роботи Приймаченко виставляли в Парижі, Варшаві, Монреалі. У 1966 р. Приймаченко отримала Шевченківську премію."]}, {"type": "monument", "title": "Знак на честь заснування Києва (1982)", "badges": [], "img": {"key": "s068_image79", "cap": "Пам’ятний знак на честь заснування Києва, скульптор В. Бородай"}, "paras": ["Пам’ятний знак відкрили **22 травня 1982 р.** у Наводницькому парку над Дніпром, коли відзначали **1500-ліття Києва**.", "Автор — скульптор **Василь Бородай**. Він зобразив легендарних засновників міста — братів Кия, Щека, Хорива і сестру Либідь — на човні, що пливе Дніпром.", "Дату заснування міста, 482 р., влада визначила умовно, щоб відзначити ювілей. Святкування мало підкреслити «дружбу народів» і давність Києва як «матері міст руських».", "Цей пам’ятник — один із символів сучасного Києва."]}]}, {"id": "s5", "num": "X", "title": "Кінець доби «застою»", "sub": "Смерть Брежнєва, Андропов і Черненко, обрання Горбачова", "cover": {"key": "s071_image83", "cap": ""}, "cards": [{"type": "text", "kicker": "Кінець доби", "title": "Юрій Андропов (1982 – 1984)", "badges": [], "paras": ["Леонід Брежнєв помер **10 листопада 1982 р.** Останні роки він тяжко хворів і фактично не керував державою.", "Генеральним секретарем ЦК КПРС став **Юрій Андропов**, який перед тим 15 років очолював КДБ.", "Андропов почав боротися за трудову дисципліну: міліція з’ясовувала в магазинах, кінотеатрах і лазнях, чому люди в робочий час не на роботі. Він звільнив частину корумпованих чиновників і заговорив про потребу економічних змін.", "Водночас за Андропова дисидентів переслідували ще жорсткіше. Він був невиліковно хворий і помер у лютому 1984 р."], "imgs": [{"key": "andropov", "cap": "Юрій Андропов Фото: TASS / Wikimedia Commons, Public domain"}]}, {"type": "text", "kicker": "Кінець доби", "title": "Костянтин Черненко (1984 – 1985) і прихід Горбачова", "badges": [], "paras": ["Наступником Андропова став 72-річний **Костянтин Черненко**, давній помічник Брежнєва. Через хворобу він уже ледве міг працювати.", "За Черненка спроби змін припинилися. Боротьбу з корупцією згорнули, а соратника Сталіна В’ячеслава Молотова поновили в партії.", "Черненко помер **10 березня 1985 р.** Наступного дня пленум ЦК КПРС обрав Генеральним секретарем 54-річного **Михайла Горбачова**.", "Так закінчилася доба «застою» і почалася «перебудова»."], "imgs": [{"key": "s073_image85", "cap": "Костянтин Черненко"}, {"key": "s075_image87", "cap": "Обкладинка журналу TIME, березень 1985 р.: «Новий господар Москви»"}]}, {"type": "carousel", "title": "«П’ятирічка пишних похоронів» (1982 – 1985)", "badges": [], "note": "За два роки й чотири місяці на Красній площі поховали трьох генеральних секретарів. Одинадцяту п’ятирічку (1981 – 1985) люди жартома прозвали «п’ятирічкою пишних похоронів», а телевізійні трансляції — «перегонами на лафетах».", "items": [{"key": "s070_image82", "name": "", "desc": "Листопад 1982 р. — похорон Леоніда Брежнєва", "cap": ""}, {"key": "s072_image84", "name": "", "desc": "Лютий 1984 р. — похорон Юрія Андропова", "cap": ""}, {"key": "s074_image86", "name": "", "desc": "Березень 1985 р. — похорон Костянтина Черненка", "cap": ""}]}]}, {"id": "s6", "num": "XI", "title": "Узагальнення", "sub": "Персоналії, поняття, що часто плутають на НМТ, стрічки часу", "cover": null, "cards": [{"type": "table", "title": "Персоналії НМТ: дисиденти", "rows": [["Хто", "Роки", "Чим відомий"], ["Іван Дзюба", "1931 – 2022", "«Інтернаціоналізм чи русифікація?» (1965); протест у кінотеатрі «Україна»"], ["В’ячеслав

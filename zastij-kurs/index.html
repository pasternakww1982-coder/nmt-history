const QUIZ = {"blitz": {"1": {"n": 30, "pass": 75, "timer": true, "quota": {"s1": 6, "s2": 6, "s3": 6, "s4": 7, "s5": 5}, "pool": [{"id": "z744", "q": "Яке явище радянської дійсності другої половини 1960–1980-х рр. відображає карикатура?", "sec": "s5", "g": "kar_krad", "t": "single", "img": ["q_887304dea1"], "opts": ["низьку якість обслуговування в торговельних закладах", "розкрадання державного майна на робочих місцях", "технологічну відсталість харчової промисловості", "систематичне пияцтво на робочому місці"], "ok": [1], "expl": "Чоловік хвалиться, що працює неподалік — на м’ясокомбінаті, а з кишень у нього тягнеться ковбаса. Тих, хто виносив продукцію з роботи, називали «несунами»: розкрадання державного майна стало буденним явищем.", "src": "ЗНО 2013 – 1 сесія (№ 39)"}, {"id": "z799", "q": "Поява в середині 1970-х рр. концепції «розвиненого соціалізму» стала одним із проявів", "sec": "s2", "g": "rozv_soc", "t": "single", "opts": ["політико-ідеологічної кризи радянської моделі розвитку.", "утвердження принципів політичного плюралізму.", "активізації дисидентського правозахисного руху.", "становлення багатопартійності в суспільстві."], "ok": [0], "expl": "Хрущов обіцяв збудувати комунізм до 1980 р. Коли стало ясно, що цього не буде, Брежнєв оголосив про «розвинений соціалізм» — довгий етап перед комунізмом. Влада визнала, що мета недосяжна, тому це прояв ідеологічної кризи. Плюралізму й багатопартійності в СРСР тоді не було.", "src": "ЗНО 2013 – 2 сесія (№ 38)"}, {"id": "z1133", "q": "Укажіть ключові положення Конституції УРСР 1978 р.", "sec": "s2", "g": "konst", "t": "three", "opts": ["УРСР є організацією диктатури трудящих і експлуатованих мас пролетаріату та найбіднішого селянства, що скинули владу буржуазії", "державною мовою УРСР є українська мова, УРСР забезпечує її функціонування в усіх сферах суспільного життя і вільний розвиток інших мов", "уся влада в УРСР належить народові, який здійснює державну владу через Ради народних депутатів, що становлять політичну основу УРСР", "УРСР складається із семи областей і Молдавської Автономної Радянської Соціалістичної Республіки, кожна з яких має власні органи влади", "керівною і спрямовуючою силою радянського суспільства, ядром його політичної системи є Комуністична партія Радянського Союзу", "найвищим законодавчим і розпорядчим органом державної влади УРСР є Рада Народних Комісарів УРСР, яку обирає з’їзд Рад республіки", "основу економічної системи УРСР становить соціалістична власність на засоби виробництва у формі державної та колгоспно-кооперативної власності"], "ok": [2, 4, 6], "expl": "Конституція УРСР 20 квітня 1978 р. проголошувала, що влада належить народові через Ради народних депутатів, «ядро» політичної системи — КПРС (ст. 6), а основа економіки — соціалістична власність. «Диктатура трудящих мас» і Раднарком — з конституцій 1919 – 1929 рр., склад із семи областей і Молдавської АРСР — з Конституції 1937 р. Українська мова стала державною лише в Законі про мови 1989 р.", "src": "ЗНО 2013 – 2 сесія (№ 55)"}, {"id": "z958", "q": "У якому році В. Щербицький став Першим секретарем ЦК КПУ?", "sec": "s3", "g": "", "t": "single", "opts": ["1965 р.", "1972 р.", "1976 р.", "1982 р."], "ok": [1], "expl": "Володимир Щербицький очолив ЦК КПУ в травні 1972 р., замінивши Петра Шелеста, і керував республікою до 1989 р.", "src": "ЗНО 2012 – 2 сесія (№ 45)"}, {"id": "z8235", "q": "Зміна партійно-політичного керівництва УРСР у 1972 р. супроводжувалася", "sec": "s3", "g": "kerivn72", "t": "single", "opts": ["зростанням цін на продукти харчування.", "прийняттям нової конституції республіки.", "впровадженням «косигінської реформи».", "хвилею арештів дисидентів."], "ok": [3], "expl": "У 1972 р. почалася друга хвиля арештів (Чорновіл, Стус, Світличний, Сверстюк, Дзюба), а в травні Шелеста замінив Щербицький. Обидві події — частина наступу Москви на «український буржуазний націоналізм». Нову Конституцію УРСР ухвалили 1978 р., косигінська реформа почалася 1965 р.", "src": "ЗНО 2015 – додаткова сесія (№ 38)"}, {"id": "z12115", "q": "Одна з характерних ознак суспільно-політичного життя СРСР наприкінці 1970-х - на початку 1980-х рр. - це", "sec": "s2", "g": "konst", "t": "single", "opts": ["скорочення масштабів бюрократичного апарату.", "легалізація неформальних громадських організацій.", "конституційне закріплення концепції «розвиненого соціалізму».", "розмежування повноважень партійних і радянських органів влади."], "ok": [2], "expl": "Конституція СРСР 1977 р. (а за нею Конституція УРСР 1978 р.) записала, що в країні збудовано «розвинений соціалізм», і закріпила керівну роль КПРС. Апарат управління тоді не скорочувався, а неформальних організацій влада не допускала.", "src": "ЗНО 2017 – основна сесія (№ 18)"}, {"id": "z12123", "q": "Установіть відповідність між подією періоду «застою» та її наслідком.", "sec": "s3", "g": "nasl", "t": "match", "opts": ["проведення перших альтернативних виборів до Верховної Ради УРСР", "«друга хвиля» масових арештів дисидентів", "активізація та організаційне оформлення дисидентського правозахисного руху", "відновлення вертикальної системи управління економікою", "юридичне закріплення однопартійної політичної системи"], "ok": [1, 3, 4, 2], "left": ["зміна політичного керівництва УРСР", "ліквідація рад народного господарства", "ухвалення Конституції УРСР", "підписання СРСР Гельсінського Заключного акту Наради з питань безпеки та співробітництва в Європі"], "expl": "Зміна керівництва УРСР 1972 р. збіглася з другою хвилею арештів; після ліквідації раднаргоспів (1965) економікою знову керували союзні міністерства; Конституція 1978 р. юридично закріпила владу однієї партії; Гельсінський акт 1975 р. підштовхнув дисидентів створити Українську Гельсінську групу. Альтернативні вибори до Верховної Ради УРСР відбулися лише 1990 р.", "src": "ЗНО 2017 – основна сесія (№ 26)"}, {"id": "z13800", "q": "Яку думку намагався донести до населення радянської України автор зображеної листівки-карикатури?", "sec": "s2", "g": "", "t": "single", "img": ["q_ea40921988"], "opts": ["безперспективність боротьби за незалежність України", "декларативний характер положень Основного Закону Української РСР", "територіальні зазіхання радянської Росії на територію України", "економічна залежність УРСР від радянської Росії"], "ok": [1], "expl": "У Конституції записано право республіки вийти з СРСР, але на малюнку Україна прикута ланцюгом до Москви. Автор показує, що конституційні права існували лише на папері.", "src": "ЗНО 2018 – пробний тест (№ 18)"}, {"id": "z13801", "q": "Що було однією з характерних особливостей економічного розвитку СРСР та УРСР на початку 1980-х рр.?", "sec": "s5", "g": "def_rysa", "t": "single", "opts": ["скорочення частки сировинно-видобувної промисловості", "стрімке зростання дефіциту товарів народного споживання", "скорочення видатків на потреби військово-промислового комплексу", "запровадження ринкових механізмів управління народним господарством"], "ok": [1], "expl": "На початку 1980-х рр. товарів народного споживання ставало дедалі менше: їх «діставали» через черги й знайомства. Військові витрати й частка сировинної промисловості тоді зростали, ринкових механізмів не запроваджували.", "src": "ЗНО 2018 – пробний тест (№ 19)"}, {"id": "z15000", "q": "Укажіть прояви політико-ідеологічної кризи радянського ладу в середині 1960-х – на початку 1980-х рр.", "sec": "s2", "g": "kryza3", "t": "three", "opts": ["поява концепції «розвиненого соціалізму»", "стрімка русифікація середньої та вищої освіти", "проведення політики десталінізації", "посилення репресій проти інакомислячих", "формування багатопартійності", "започаткування масового страйкового руху", "придушення повстань політв’язнів ГУЛАГу"], "ok": [0, 1, 3], "expl": "Ознаки кризи: замість обіцяного комунізму оголосили «розвинений соціалізм», посилили русифікацію освіти, ув’язнювали інакодумців. Десталінізація — доба «відлиги», повстання в таборах ГУЛАГу — 1953 – 1954 рр., страйки й багатопартійність — кінець 1980-х рр.", "src": "ЗНО 2018 – основна сесія (№ 30)"}, {"id": "z17443", "q": "Однією з характерних рис соціально-економічного розвитку УРСР на початку 1980-х рр. було", "sec": "s5", "g": "def_rysa", "t": "single", "opts": ["скорочення соціальних видатків.", "впровадження фермерських господарств на селі.", "зростання дефіциту товарів широкого вжитку.", "згортання ринкових механізмів управління економікою."], "ok": [2], "expl": "На початку 1980-х рр. товарів широкого вжитку ставало дедалі менше: люди стояли в чергах і «діставали» потрібне через знайомства. Соціальні видатки не скорочували, фермерських господарств і ринкових механізмів не було.", "src": "ЗНО 2019 – основна сесія (№ 18)"}, {"id": "z19386", "q": "Яке поняття доцільно використати для характеристики стану економіки УРСР в 1970-ті – на початку 1980-х рр.?", "sec": "s1", "g": "", "t": "single", "opts": ["«відбудова»", "«лібералізація»", "«застій»", "«перебудова»"], "ok": [2], "expl": "«Застоєм» називають стан економіки СРСР і УРСР у 1970-х – на початку 1980-х рр.: темпи зростання щороку падали, нові технології майже не впроваджували, товарів бракувало. «Відбудова» — 1945 – початок 1950-х рр., «лібералізація» — доба «відлиги», «перебудова» — 1985 – 1991 рр.", "src": "ЗНО 2020 – пробний тест (№ 20)"}, {"id": "z20672", "q": "На якій характерній ваді радянської моделі економіки акцентує увагу наведена карикатура?", "sec": "s5", "g": "kar_def", "t": "single", "img": ["q_1e88cb7244"], "opts": ["корупції", "дефіциті", "бюрократизації", "безробітті"], "ok": [1], "expl": "Дві довжелезні черги й питання «Скажіть, ви останній?» — карикатура на дефіцит: щоб купити щось потрібне, доводилося годинами стояти в черзі.", "src": "ЗНО 2020 – основна сесія (№ 20)"}, {"id": "z22132", "q": "Екстенсивний розвиток економіки, який, на думку вчених, «...наприкінці 1970 – на початку 1980-х рр. в СРСР, в тому числі й в Україні, цілком вичерпав свої можливості» – це", "sec": "s4", "g": "", "t": "single", "opts": ["спосіб збільшення обсягів виробництва внаслідок кількісного приросту таких факторів виробництва, як трудові ресурси, фінанси, машини, верстати, устаткування, сировина.", "процес докорінних якісних змін у техніці та технології виробництва, організації праці, пов’язаний із перетворенням науки на безпосередню продуктивну силу суспільства.", "зростання обсягів виробництва за рахунок впровадження досягнень науково-технічного прогресу, підвищення якості трудових ресурсів, форм організації виробництва.", "метод господарювання, що поєднує централізоване керівництво з господарською самостійністю підприємств у використанні фінансів і реалізації готової продукції."], "ok": [0], "expl": "Екстенсивний розвиток — виробництво зростає тому, що будують нові заводи, залучають більше робітників і сировини, а не тому, що працюють краще. Решта варіантів описують інтенсивний розвиток (нові технології, якість) і госпрозрахунок.", "src": "ЗНО 2011 – додаткова сесія (№ 46)"}, {"id": "z22191", "q": "Чим супроводжувалася зміна політичного керівництва УРСР у 1972 р.?", "sec": "s3", "g": "kerivn72", "t": "single", "opts": ["хвилею арештів дисидентів", "зростанням цін на продукти харчування", "прийняттям нової Конституції республіки", "впровадженням «косигінської реформи»"], "ok": [0], "expl": "У 1972 р. почалася друга хвиля арештів (Чорновіл, Стус, Світличний, Сверстюк, Дзюба), а в травні Шелеста замінив Щербицький. Обидві події — частина наступу Москви на «український буржуазний націоналізм». Нову Конституцію УРСР ухвалили 1978 р., косигінська реформа почалася 1965 р.", "src": "ЗНО 2012 – додаткова сесія (№ 45)"}, {"id": "z22192", "q": "Яке явище радянської дійсності 1980-х рр. відображає карикатура?", "sec": "s5", "g": "kar_def", "t": "single", "img": ["q_33baf1a2ee"], "opts": ["хронічний дефіцит", "житлову проблему", "зростання безробіття", "інфляційні процеси"], "ok": [0], "expl": "Натовп кидається до магазину, щойно «щось дають», — так виглядав хронічний дефіцит. Безробіття й відкритої інфляції в СРСР офіційно не було.", "src": "ЗНО 2012 – додаткова сесія (№ 46)"}, {"id": "z22261", "q": "Укажіть складові «косигінської реформи» другої половини 1960-х рр.", "sec": "s4", "g": "kosyg", "t": "three", "opts": ["запровадження на великих промислових підприємствах «держприймання» готової продукції", "ліквідація монополії держави у сфері зовнішніх торговельних зв’язків", "відновлення галузевої системи управління промисловістю через союзні та союзно-республіканські міністерства", "дозвіл на індивідуальну підприємницьку діяльність у сфері виробництва товарів широкого вжитку", "розширення господарської самостійності підприємств шляхом скорочення кількості планових показників", "упровадження семирічного плану розвитку народного господарства", "визначення прибутку й рентабельності ключовими показниками ефективності роботи підприємств"], "ok": [2, 4, 6], "expl": "Косигінська реформа (з 1965 р.): замість раднаргоспів знову запрацювали міністерства, підприємствам скоротили кількість планових показників, головними стали прибуток і рентабельність. Семирічка — план Хрущова (1959 – 1965), «держприймання», індивідуальна трудова діяльність і кінець монополії зовнішньої торгівлі — 1986 – 1988 рр., доба перебудови.", "src": "ЗНО 2013 – додаткова сесія (№ 55)"}, {"id": "z23820", "q": "Наведена карикатура акцентує увагу на одній із характерних вад радянської моделі економіки.\nДошка пошани\nНе проходьте повз! Сидоров – прогульник!\n– Що з того, що ми з тобою на різних дошках, усе одно зарплати однакові.\nПартійно-радянське керівництво намагалося подолати цю ваду", "sec": "s4", "g": "kosyg_doc", "t": "single", "img": ["q_971ede81c5"], "opts": ["здійсненням «реформи О. Косигіна».", "реалізацією однієї з «надпрограм М. Хрущова».", "посиленням боротьби з нетрудовими доходами.", "проведенням антиалкогольної кампанії."], "ok": [0], "expl": "Зарплата не залежала від того, як людина працює: і передовик, і прогульник отримували майже однаково. Косигінська реформа (1965) мала це змінити: частина прибутку лишалася підприємству на премії працівникам.", "src": "ЗНО 2021 – основна сесія (№ 17)"}, {"id": "z24879", "q": "Укажіть одну з характерних рис соціально-економічного розвитку УРСР на початку 1980-х рр.", "sec": "s5", "g": "def_rysa", "t": "single", "opts": ["скорочення видатків на соціальну сферу", "упровадження фермерських господарств на селі", "зростання дефіциту товарів широкого вжитку", "згортання ринкових механізмів управління економікою"], "ok": [2], "expl": "На початку 1980-х рр. товарів широкого вжитку ставало дедалі менше: люди стояли в чергах і «діставали» потрібне через знайомства. Соціальні видатки не скорочували, фермерських господарств і ринкових механізмів не було.", "src": "ЗНО 2021 – додаткова сесія (№ 18)"}, {"id": "z26025", "q": "На якому явищі радянської дійсності 1970-х – 1980-х років фокусують увагу зображені карикатури?", "sec": "s5", "g": "kar_pip", "t": "single", "img": ["q_bda07d1e5f"], "opts": ["невідповідності фаху (освіти) відповідальних осіб займаним керівним посадам", "нецільовому (неефективному) використанні посадовцями свого робочого часу", "отриманні посадовцями нетрудових (незаконних) доходів на своїх посадах", "умисному спотворенні (підробленні) посадовими особами звітних даних"], "ok": [3], "expl": "Художник малює на плакаті величезну свиню, а насправді вона худа, — так показано приписки: керівники завищували у звітах показники, щоб видати план за виконаний.", "src": "НМТ 2022 – демоваріант (№ 12)"}, {"id": "z26223", "q": "На якому явищі радянської дійсності 1970-х – 1980-х років фокусують увагу зображені карикатури?", "sec": "s5", "g": "kar_pip", "t": "single", "img": ["q_e84fc61b33"], "opts": ["невідповідності фаху (освіти) відповідальних осіб займаним керівним посадам", "нецільовому (неефективному) використанні посадовцями свого робочого часу", "отриманні посадовцями нетрудових (незаконних) доходів на своїх посадах", "умисному спотворенні (підробленні) посадовими особами звітних даних"], "ok": [3], "expl": "Художник малює на плакаті величезну свиню, а насправді вона худа, — так показано приписки: керівники завищували у звітах показники, щоб видати план за виконаний.", "src": "НМТ 2023 – демоваріант (№ 18)"}, {"id": "z27724", "q": "Що призвело до виникнення в Українській РСР явища, до якого привертає увагу карикатура?", "sec": "s4", "g": "dyrekt", "t": "single", "img": ["q_66afe89b90"], "opts": ["тотальний дефіцит товарів широкого вжитку в торгівельній мережі", "директивне планування виробництва, розподілу й споживання товарів", "низький рівень культури обслуговування покупців", "постійне зростання цін в державних закладах торгівлі"], "ok": [1], "expl": "Карикатура — про товари, які ніхто не купує: їх випускали, бо так велів план. Директивне планування визначало, що й скільки виробляти, не зважаючи на попит покупців. Тому одних товарів бракувало, а інші залежувалися на складах.", "src": "НМТ 2024 – демоваріант (№ 18)"}, {"id": "z34328", "q": "Яке явище радянської дійсності 1980-х років відображено карикатуристом?", "sec": "s5", "g": "kar_def", "t": "single", "img": ["q_372869ed38"], "opts": ["занепад культури", "фінансові проблеми", "хронічний дефіцит", "зростання безробіття"], "ok": [2], "expl": "Взуття в магазині немає, тож людина просить начистити шкарпетки чорним кремом. Карикатура висміює хронічний дефіцит товарів.", "src": "НМТ 2025 – 1 сесія (№ 18)"}, {"id": "z39213", "q": "Що було характерним для соціально-економічного розвитку УРСР періоду «застою»?", "sec": "s4", "g": "", "t": "single", "opts": ["широке впровадження комп’ютерних технологій", "децентралізація системи управління економікою", "загострення продовольчої проблеми", "ліквідація приватної власності в закладах сфери обслуговування"], "ok": [2], "expl": "Колгоспи й радгоспи не забезпечували країну продуктами: м’яса, молока, ковбаси в магазинах бракувало, СРСР купував зерно за кордоном. У 1982 р. ухвалили Продовольчу програму, але ситуація не поліпшилася. Управління економікою тоді, навпаки, централізували.", "src": "НМТ 2026 – 2 сесія (№ 19)"}, {"id": "z35263", "q": "Визначте одну з особливостей економічного розвитку УРСР на початку 1980-х рр.", "sec": "s4", "g": "temp", "t": "single", "opts": ["примусовий вихід України з рубльової зони", "істотне уповільнення темпів розвитку економіки республіки", "запровадження ринкових механізмів управління господарством", "скорочення капіталовкладень на потреби військово-промислового комплексу"], "ok": [1], "expl": "На початку 1980-х рр. економіка УРСР зростала дуже повільно — звідси й назва доби. Із рублевої зони Україна вийшла лише 1992 р., ринкових механізмів у той час не було, а військові витрати, навпаки, зростали.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36036", "q": "Установіть відповідність між процесами 1960-х – 1980-х рр. та їхніми наслідками.", "sec": "s1", "g": "", "t": "match", "opts": ["Закріплення в законодавстві керівної ролі комуністичної партії, збереження формального характеру прав і свобод громадян.", "Обмеження можливостей громадянської активності, ліквідація політичного плюралізму, посилення ідеологічного тиску.", "Розширення прав союзних республік і посилення їхньої політичної самостійності.", "Повернення до жорстких методів командно-адміністративного управління, зниження ефективності виробництва та гальмування економічного розвитку.", "Використання судових переслідувань, ув’язнень і примусового психіатричного лікування як засобів боротьби з інакодумством."], "ok": [0, 1, 3, 4], "left": ["Поширення ідеології «розвиненого соціалізму»", "Посилення контролю КПРС над суспільно-політичним життям", "Згортання економічних реформ другої половини 1960-х рр.", "Репресивна політика щодо дисидентського руху"], "expl": "«Розвинений соціалізм» закріпили в конституціях 1977 і 1978 рр. разом із керівною роллю партії. Посилення контролю КПРС не залишало місця для громадської активності, згортання косигінської реформи повернуло жорстке планування, а дисидентів садили до таборів і психіатричних лікарень. Розширення прав республік у той час не відбувалося.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36469", "q": "Доберіть до події (1–4) періоду «застою» її наслідок (А – Д).", "sec": "s3", "g": "nasl", "t": "match", "opts": ["проведення перших альтернативних виборів до Верховної Ради УРСР", "«друга хвиля» масових арештів дисидентів", "активізація та організаційне оформлення дисидентського правозахисного руху", "відновлення вертикальної системи керування економікою", "юридичне закріплення однопартійної політичної системи"], "ok": [1, 3, 4, 2], "left": ["зміна політичного керівництва УРСР", "ліквідація рад народного господарства", "ухвалення Конституції УРСР", "підписання СРСР Гельсінського Заключного акта Наради з питань безпеки та співробітництва в Європі"], "expl": "Зміна керівництва УРСР 1972 р. збіглася з другою хвилею арештів; після ліквідації раднаргоспів (1965) економікою знову керували союзні міністерства; Конституція 1978 р. юридично закріпила владу однієї партії; Гельсінський акт 1975 р. підштовхнув дисидентів створити Українську Гельсінську групу. Альтернативні вибори до Верховної Ради УРСР відбулися лише 1990 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36511", "q": "Характерними рисами політико-ідеологічної кризи радянського ладу в середині 60-х – на початку 80-х років XX ст. були", "sec": "s2", "g": "kryza3", "t": "three", "opts": ["поява концепції «розвиненого соціалізму»", "стрімка русифікація середньої та вищої освіти", "проведення політики десталінізаціі", "посилення репресій проти інакодумців", "формування багатопартійності", "започаткування масового страйкового руху", "придушення повстань політв’язнів ГУТАБу"], "ok": [0, 1, 3], "expl": "Ознаки кризи: замість обіцяного комунізму оголосили «розвинений соціалізм», посилили русифікацію освіти, ув’язнювали інакодумців. Десталінізація — доба «відлиги», повстання в таборах ГУЛАГу — 1953 – 1954 рр., страйки й багатопартійність — кінець 1980-х рр.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36575", "q": "Що стало причиною зниження темпів економічного розвитку в СРСР у період «застою» (70–80-ті роки XX ст.)?", "sec": "s4", "g": "", "t": "single", "opts": ["наростання технічної та технологічної відсталості підприємств", "впровадження у виробництво досягнень науково-технічної революції", "посилення командно-адміністративних методів керування економікою", "поглиблення концентрації, спеціалізації та кооперування виробництва"], "ok": [0], "expl": "Обладнання заводів старіло, а нові технології впроваджували повільно — швидко лише у військовому виробництві. Тому темпи зростання падали. Впровадження досягнень науково-технічної революції пришвидшило б розвиток, а не сповільнило.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37727", "q": "Який захід мав подолати негативні явища в економіці СРСР, висміювані на плакаті 1965 року?\nНе тішся, Володю, Брак – не обнова!", "sec": "s4", "g": "kosyg_doc", "t": "single", "img": ["q_6367d27a5a"], "opts": ["впровадження «госпрозрахунку» за реформою О. Косигіна", "розширення об’єктів Продовольчої програми Л. Брежнєва", "перехід на територіальне управління за реформами М. Хрущова", "запровадження політики «прискорення» в роки перебудови"], "ok": [0], "expl": "Плакат 1965 р. висміює «план за валом»: завод звітує про пари взуття, а якість нікого не цікавить. Реформа О. Косигіна переводила підприємства на госпрозрахунок: оцінювати їх мали за реалізованою продукцією й прибутком.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38190", "q": "Позначте проблему періоду «застою», на якій наголошено в карикатурі.", "sec": "s5", "g": "", "t": "single", "img": ["q_e8f5ce5840"], "opts": ["розпивання алкоголю на робочих місцях", "низький рівень кваліфікації робітників", "розкрадання державного майна", "невиконання Продовольчої програми"], "ok": [0], "expl": "Карикатура висміює пияцтво на робочому місці: «рекорди» механізатора — п’яна аварія. Пияцтво було поширеним лихом доби «застою»; з ним боротимуться антиалкогольною кампанією 1985 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38324", "q": "Яку назву мала політика, складником якої був пропагандистський плакат?\nОсь наш прибуток!", "sec": "s4", "g": "kosyg_doc", "t": "single", "img": ["q_416fd5aa10"], "opts": ["косигінська реформа", "ждановщина", "хрущовські надпрограми", "перебудова"], "ok": [0], "expl": "Плакат «Ось наш прибуток!» пропагує головну ідею косигінської реформи (1965): підприємство має працювати з прибутком і частину його залишати собі.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z38774", "q": "Явище радянської дійсності, до якого привернуто увагу на карикатурі, –", "sec": "s5", "g": "kar_def", "t": "single", "img": ["q_7053fd16af"], "opts": ["масове безробіття.", "товарний дефіцит.", "невпинна інфляція.", "«ножиці цін»."], "ok": [1], "expl": "Сцена біля універмагу: дефіцитну річ продають «з рук» дорожче — у перепродажу. Це наслідок товарного дефіциту. Безробіття й «ножиці цін» — явища інших періодів.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z26934", "q": "Укажіть прояви політико-ідеологічної кризи радянського ладу в 1965–1985 рр.", "sec": "s2", "g": "kryza3", "t": "three", "opts": ["поява концепції «розвиненого соціалізму»", "стрімка русифікація середньої та вищої освіти", "проведення політики «десталінізації»", "посилення репресій проти інакодумців", "формування багатопартійності", "започаткування масового страйкового руху", "придушення повстань політв’язнів ГУЛагу (ГУТабу)"], "ok": [0, 1, 3], "expl": "Ознаки кризи: замість обіцяного комунізму оголосили «розвинений соціалізм», посилили русифікацію освіти, ув’язнювали інакодумців. Десталінізація — доба «відлиги», повстання в таборах ГУЛАГу — 1953 – 1954 рр., страйки й багатопартійність — кінець 1980-х рр.", "src": "НМТ 2023 – 1 сесія (№ 30)"}, {"id": "z32157", "q": "Що призвело до виникнення в УРСР явища, на якому акцентує увагу карикатура?", "sec": "s4", "g": "dyrekt", "t": "single", "img": ["q_8ca54e919f"], "opts": ["тотальний дефіцит товарів широкого вжитку в торговельній мережі", "директивне планування виробництва, розподілу й споживання товарів", "низький рівень культури обслуговування покупців", "постійне зростання цін у державних закладах торгівлі"], "ok": [1], "expl": "Карикатура — про товари, які ніхто не купує: їх випускали, бо так велів план. Директивне планування визначало, що й скільки виробляти, не зважаючи на попит покупців. Тому одних товарів бракувало, а інші залежувалися на складах.", "src": "НМТ 2025 – демоваріант (№ 19)"}, {"id": "b01", "q": "М. Хрущова усунули з посади першого секретаря ЦК КПРС", "sec": "s1", "g": "hrush64", "t": "single", "opts": ["у березні 1953 р.", "у жовтні 1964 р.", "у травні 1972 р.", "у листопаді 1982 р."], "ok": [1], "expl": "У жовтні 1964 р. пленум ЦК КПРС відправив Хрущова у відставку. Першим (з 1966 р. — генеральним) секретарем став Леонід Брежнєв. Березень 1953 р. — смерть Сталіна, травень 1972 р. — усунення Шелеста, листопад 1982 р. — смерть Брежнєва.", "src": "за зразком ЗНО"}, {"id": "b02", "q": "Хто очолював уряд СРСР (Раду Міністрів) у 1964 – 1980 рр.?", "sec": "s1", "g": "", "t": "single", "opts": ["М. Тихонов", "О. Косигін", "М. Підгорний", "Ю. Андропов"], "ok": [1], "expl": "Олексій Косигін був головою Ради Міністрів СРСР з 1964 до 1980 р. і почав економічну реформу 1965 р. Андропов з 1967 р. очолював КДБ, Тихонов замінив Косигіна 1980 р.", "src": "за зразком ЗНО"}, {"id": "b03", "q": "Курс на «стабільність кадрів» за Л. Брежнєва призвів до", "sec": "s1", "g": "", "t": "single", "opts": ["регулярних альтернативних виборів керівників", "швидкого висунення молодих керівників", "старіння й незмінності керівного складу", "скорочення кількості партійних службовців"], "ok": [2], "expl": "Брежнєв пообіцяв партійним керівникам, що їх не перемішуватимуть, як за Хрущова. Люди десятиліттями сиділи на тих осаду в уряді СРСР, а 1973 р. відправили на пенсію.", "src": "за зразком ЗНО"}, {"id": "b08", "q": "Хто очолював Компартію України в 1963 – 1972 рр.?", "sec": "s3", "g": "", "t": "single", "opts": ["М. Підгорний", "О. Кириченко", "П. Шелест", "В. Щербицький"], "ok": [2], "expl": "Петро Шелест керував КПУ з 1963 р. до травня 1972 р. Підгорний очолював її перед ним (1957 – 1963), Кириченко — у 1953 – 1957 рр., Щербицький — після нього (1972 – 1989).", "src": "за зразком ЗНО"}, {"id": "b09", "q": "В. Щербицький до того, як очолити ЦК КПУ 1972 р., був головою", "sec": "s3", "g": "", "t": "single", "opts": ["Академії наук УРСР", "КДБ СРСР", "Ради Міністрів УРСР", "Спілки письменників України"], "ok": [2], "expl": "Щербицький двічі очолював уряд республіки — Раду Міністрів УРСР (1961 – 1963 і 1965 – 1972), а в 1972 – 1989 рр. був першим секретарем ЦК КПУ.", "src": "за зразком ЗНО"}, {"id": "b10", "q": "Продовольчу програму СРСР ухвалили 1982 р., щоб", "sec": "s4", "g": "", "t": "single", "opts": ["подолати нестачу продуктів харчування", "розпустити колгоспи й радгоспи", "перейти до вільного ринку продовольства", "скоротити закупівлі техніки для села"], "ok": [0], "expl": "Колгоспи й радгоспи не могли нагодувати країну, СРСР купував зерно за кордоном. Програма обіцяла вирішити продовольчу проблему до 1990 р., але не змінювала колгоспної системи, тому не допомогла.", "src": "за зразком ЗНО"}, {"id": "b11", "q": "Що свідчило про екстенсивний шлях розвитку промисловості УРСР у 1970-х рр.?", "sec": "s4", "g": "", "t": "single", "opts": ["перехід підприємств на вільні ринкові ціни", "швидке впровадження новітніх технологій", "зниження енерго- й матеріаломісткості виробництва", "будівництво нових заводів замість оновлення старих"], "ok": [3], "expl": "Виробництво нарощували кількістю: нові заводи, нові шахти, більше сировини й робітників. Застаріле обладнання не міняли, енергії й металу на одиницю продукції витрачали дедалі більше.", "src": "за зразком ЗНО"}, {"id": "b23", "q": "Вислів «застійні явища», від якого походить назва доби, у 1986 р. вжив", "sec": "s1", "g": "", "t": "single", "opts": ["Л. Брежнєв", "Ю. Андропов", "В. Щербицький", "М. Горбачов"], "ok": [3], "expl": "Михайло Горбачов, починаючи перебудову, назвав роки правління Брежнєва часом «застійних явищ». Звідси й назва доби — «застій».", "src": "за зразком ЗНО"}, {"id": "b24", "q": "Найуспішнішою за темпами зростання економіки в добу «застою» була", "sec": "s1", "g": "", "t": "single", "opts": ["одинадцята п’ятирічка (1981 – 1985)", "восьма п’ятирічка (1966 – 1970)", "десята п’ятирічка (1976 – 1980)", "дев’ята п’ятирічка (1971 – 1975)"], "ok": [1], "expl": "У 1966 – 1970 рр. діяла косигінська реформа, і господарство зростало найшвидше за всі роки «застою». Після згортання реформи темпи щоп’ятирічки падали.", "src": "за зразком ЗНО"}, {"id": "b25", "q": "У якому році Л. Брежнєв оголосив, що в СРСР збудовано «розвинений соціалізм»?", "sec": "s2", "g": "", "t": "single", "opts": ["1961 р.", "1967 р.", "1977 р.", "1982 р."], "ok": [1], "expl": "У 1967 р., до 50-річчя Жовтневого перевороту, Брежнєв оголосив, що в СРСР збудовано розвинений соціалізм. 1961 р. — програма КПРС з обіцянкою комунізму, 1977 р. — Конституція «розвиненого соціалізму».", "src": "за зразком ЗНО"}, {"id": "b26", "q": "Конституції СРСР 1977 р. і УРСР 1978 р. проголошували свободу слова й зборів. Що відбувалося насправді?", "sec": "s2", "g": "", "t": "single", "opts": ["газети вільно критикували рішення Політбюро ЦК КПРС", "дисидентів, які посилалися на ці свободи, ув’язнювали", "громадяни обирали депутатів з кількох кандидатів", "у республіці легально діяли кілька політичних партій"], "ok": [1], "expl": "Права в конституціях існували лише на папері. Правозахисники вимагали їх дотримуватися — і потрапляли за це до таборів. Багатопартійність і альтернативні вибори з’явилися лише наприкінці 1980-х рр.", "src": "за зразком ЗНО"}, {"id": "b27", "q": "Що характеризує діяльність П. Шелеста на посаді першого секретаря ЦК КПУ?", "sec": "s3", "g": "", "t": "single", "opts": ["засудив уведення радянських військ до Чехословаччини 1968 р.", "захищав господарські інтереси республіки перед союзними міністерствами", "виступав за вихід Української РСР зі складу Радянського Союзу", "став одним із засновників Української Гельсінської групи"], "ok": [1], "expl": "Шелест був відданим комуністом: підтримав уведення військ до Чехословаччини 1968 р., за нього заарештовували дисидентів. Водночас він сперечався з союзними міністерствами, домагався, щоб республіка сама керувала частиною підприємств, і виступав українською. За це Москва звинуватила його в «місництві».", "src": "за зразком ЗНО"}, {"id": "b28", "q": "Після 1972 р. майже всі великі підприємства Української РСР підпорядковувалися", "sec": "s3", "g": "", "t": "single", "opts": ["обласним радам народних депутатів", "трудовим колективам самих підприємств", "раднаргоспам економічних районів УРСР", "союзним міністерствам у Москві"], "ok": [3], "expl": "Після ліквідації раднаргоспів (1965) і усунення Шелеста (1972) великими заводами УРСР керували союзні міністерства. Уряд республіки відповідав лише за місцеву промисловість.", "src": "за зразком ЗНО"}, {"id": "b29", "q": "У середині 1960-х рр. в Українській РСР уперше", "sec": "s5", "g": "", "t": "single", "opts": ["колгоспникам дозволили виходити з колгоспів", "кількість населення почала зменшуватися", "сільське населення перевищило міське", "міських жителів стало більше, ніж сільських"], "ok": [3], "expl": "За переписом 1970 р. в містах жило вже понад половину населення УРСР, а 1989 р. — дві третини. Населення республіки до кінця 1980-х рр. ще зростало, хоча й дедалі повільніше.", "src": "за зразком ЗНО"}, {"id": "b30", "q": "Що змінилося для колгоспників у 1965 – 1966 рр.?", "sec": "s5", "g": "", "t": "single", "opts": ["колгоспи перетворили на фермерські господарства", "отримали державні пенсії й гарантовану оплату грошима", "їм заборонили мати присадибні ділянки", "дістали право вільно  розроблення власної концепції реформування УРСР на засадах ринкової економіки.", "Категорична відмова від підтримки курсу «перебудови», ініціювання заходів, спрямованих на усунення М. Горбачова від влади."], "ok": [1], "expl": "Щербицький на словах підтримував перебудову, але гальмував зміни в УРСР: в Україні довше, ніж у Москві, переслідували інакодумців і забороняли неформальні організації. Його відправили у відставку лише 1989 р.", "src": "ЗНО 2010 – 2 сесія (№ 47)"}, {"id": "z1202", "q": "Установіть відповідність між митцями та сферами їхньої творчості.", "sec": "s4", "g": "", "t": "match", "opts": ["живопис", "поезія", "оперний спів", "театр", "пісенна та хорова музика"], "ok": [4, 3, 2, 1], "left": ["О. Білаш, П. Майборода", "Н. Ужвій, А. Роговцева", "Є. Мірошниченко, А. Coлов’яненко", "Б. Олійник, І. Драч"], "expl": "Білаш і Майборода — пісні й хорова музика; Ужвій і Роговцева — актриси театру; Мірошниченко й Солов’яненко — оперні співаки; Олійник і Драч — поети.", "src": "ЗНО 2010 – 2 сесія (№ 55)"}, {"id": "z1686", "q": "Установіть відповідність між прізвищами митців і фактами їхньої творчої біографії.", "sec": "s4", "g": "", "t": "match", "opts": ["поет, прозаїк, автор збірок «Тиша і грім», «Земне тяжіння», «Лебеді материнства»", "художниця, графік, автор полотен «Прип’ять. Пором», «Біля річки», співавтор вітражу «Тарас Шевченко»", "поет, автор збірок «Протуберанці серця», «Корінь і крона», сценаріїв фільмів «Криниця для спраглих», «Камінний хрест»", "поетеса, автор збірок «Проміння землі», «Мандрівки серця», романів у віршах «Маруся Чурай», «Берестечко»", "кінорежисер, автор фільмів «Українська рапсодія», «Квітка на камені», «Тіні забутих предків», «Цвіт граната»"], "ok": [1, 0, 3, 2], "left": ["А. Горська", "В. Симоненко", "Л. Костенко", "І. Драч"], "expl": "Горська — художниця, співавторка вітража «Шевченко»; Симоненко — збірки «Тиша і грім», «Земне тяжіння»; Костенко — «Маруся Чурай»; Драч — «Протуберанці серця», сценарій «Криниці для спраглих». Зайвий опис — Параджанов.", "src": "ЗНО 2012 – пробний тест (№ 53)"}, {"id": "z1745", "q": "Установіть відповідність між прізвищами учасників опозиційного руху в Україні та їх характеристиками.", "sec": "s1", "g": "", "t": "match", "opts": ["Історик, публіцист, автор есе «Репортаж із заповідника ім. Берії», «Хроніка опору».", "Поет, літературний критик, автор поезії «На колимськім морозі калина».", "Журналіст, літературний критик, автор збірки «Лихо з розуму».", "Письменник, один із засновників Української Гельсінської групи.", "Генерал, правозахисник, учасник руху за відновлення прав кримськотатарського народу."], "ok": [3, 0, 1, 2], "left": ["М. Руденко", "В. Мороз", "В. Стус", "В. Чорновіл"], "expl": "Микола Руденко — письменник, засновник Української Гельсінської групи (1976); Валентин Мороз — історик, автор «Репортажу із заповідника імені Берії»; Василь Стус — поет; В’ячеслав Чорновіл — журналіст, автор «Лиха з розуму». Генерал-правозахисник, що захищав кримських татар, — Петро Григоренко.", "src": "ЗНО 2011 – пробний тест (№ 52)"}, {"id": "z1809", "q": "Установіть відповідність між прізвищами митців та їхніми творчими здобутками.", "sec": "s4", "g": "", "t": "match", "opts": ["роман у віршах «Маруся Чурай»", "кінофільм «Вавилон–XX»", "опера «Тарас Шевченко»", "кінофільм «У бій ідуть одні \"старики\"»", "роман «Собор»"], "ok": [4, 3, 1, 0], "left": ["О. Гончар", "Л. Биков", "І. Миколайчук", "Л. Костенко"], "expl": "Гончар — роман «Собор», Биков — фільм «В бій ідуть лише “старі”», Миколайчук — «Вавилон ХХ», Ліна Костенко — роман у віршах «Маруся Чурай». Оперу «Тарас Шевченко» написав Г. Майборода.", "src": "ЗНО 2010 – пробний тест (№ 56)"}, {"id": "z4976", "q": "Укажіть портрет видатного вченого в галузі електрозварювання, металургії та технології металів.", "sec": "s3", "g": "", "t": "single", "oimg": ["q_52ec8996c0", "q_9c38afe015", "q_2b284f4bfd", "q_cc15cda5e0"], "opts": ["А", "Б", "В", "Г"], "ok": [0], "expl": "На фото А — Борис Патон, з 1962 р. президент Академії наук УРСР. Його Інститут електрозварювання розробив способи зварювання металів, зокрема в космосі.", "src": "ЗНО 2014 – пробний тест (№ 38)"}, {"id": "z6685", "q": "Установіть відповідність між прізвищем діяча та висловлюванням, що йому належить.", "sec": "s3", "g": "", "t": "match", "opts": ["«Потрібно примусити себе працювати: фізично і розумово, важко і багато. Для цього необхідні мотиви, надзавдання! Для мене таким \"надзавданням\" були спочатку хірургія, а згодом — наука і написання книг...»", "«За фахом я математик, і мій науковий потяг до питань теоретичної фізики пояснюється тим, що в цій галузі багато захоплюючих проблем, успішне розв’язання яких залежить від розробки математичних методів...»", "«...Тільки розробка нової архітектури обчислювальних систем дозволить вирішити проблему створення суперЕОМ, продуктивність яких збільшується необмежено при нарощуванні апаратних засобів...»", "«Найцікавіша частина нашої роботи — це краса в техніці... Конструктор часто може йти від краси до техніки, від рішень естетичних до рішень технічних. Ми добре знаємо, що красивий літак літає добре, а негарний - погано, або й взагалі не літатиме...»", "«Вже 10 років пройшло, як ми розробили нову технологію високочастотного електрозварювання живих тканин. Ми маємо відповідні свідоцтва, міжнародні сертифікати, які дозволяють проводити такі хірургічні операції безпосередньо на людині...»"], "ok": [4, 3, 2, 0], "left": ["Б. Патон", "О. Антонов", "В. Глушков", "М. Амосов"], "expl": "Патон — електрозварювання (навіть живих тканин); Антонов — літаки «Ан»; Глушков — кібернетика й обчислювальні машини; Амосов — хірургія й книжки про здоров’я.", "src": "ЗНО 2014 – основна сесія (№ 48)"}, {"id": "z7023", "q": "Установіть послідовність подій дисидентського руху в Українській РСР.", "sec": "s1", "g": "dys_seq", "t": "seq", "opts": ["створення Л. Лук'яненком Української робітничо-селянської спілки", "участь В. Стуса в акції протесту в кінотеатрі «Україна» проти масових арештів дисидентів", "початок випуску В. Чорноволом «самвидавського» журналу «Український вісник»", "заснування М. Руденком Української громадської групи сприяння виконанню Гельсінських угод"], "expl": "Українська робітничо-селянська спілка — 1959 – 1961 рр.; протест у кінотеатрі «Україна» — вересень 1965 р.; «Український вісник» — 1970 р.; Українська Гельсінська група — листопад 1976 р.", "src": "ЗНО 2015 – пробний тест (№ 51)"}, {"id": "z8902", "q": "Які цілі діяльності Української Гельсінської групи?\nОзнайомлювати світове співтовариство з фактами порушення прав людини в Україні.\nСприяти реформуванню радянської політичної системи в Україні.\nОзнайомлювати українську громадськість із Загальною декларацією прав людини.", "sec": "s1", "g": "ugg_task3", "t": "single", "opts": ["1, 2", "2, 3", "1, 3", "1, 2, 3"], "ok": [2], "expl": "УГГ хотіла, щоб люди знали свої права (Декларація прав людини) і щоб світ знав про їх порушення в Україні. Реформувати політичну систему СРСР група не намагалася — вона вимагала дотримуватися вже чинних законів і угод.", "src": "ЗНО 2009 – основна сесія (№ 55)"}, {"id": "z8917", "q": "Установіть послідовність суспільно-політичних подій 1950–1970-х років.", "sec": "s1", "g": "dys_seq", "t": "seq", "opts": ["Виступ на ХХ з’їзді КПРС М. Хрущова з доповіддю «Про культ особи та його наслідки».", "Суд у Львові над членами Української робітничо-селянської спілки –Л. Лук’яненком, І. Кандибою та іншими.", "Поява праці І. Дзюби «Інтернаціоналізм чи русифікація?»", "Утворення Української громадської групи сприяння виконанню Гельсінських угод."], "expl": "Доповідь Хрущова про культ особи — 1956 р.; суд над членами УРСС — 1961 р.; праця І. Дзюби «Інтернаціоналізм чи русифікація?» — 1965 р.; Українська Гельсінська група — 1976 р.", "src": "ЗНО 2009 – основна сесія (№ 70)"}, {"id": "z8961", "q": "У яких роках в українській науці відбулися описані нижче зрушення?\n«В Інституті надтвердих матеріалів виготовлено перші штучні алмази, у Фізико-технічному інституті побудовано найбільший у світі на той час прискорювач електронів, в Інституті фізики розгорнулися дослідження в галузі фізики атомного ядра завдяки уведенню в дію ядерного реактора».", "sec": "s3", "g": "", "t": "single", "opts": ["1950-х рр.", "1960-х рр.", "1970-х рр.", "1980-х рр."], "ok": [1], "expl": "Штучні алмази, найбільший прискорювач електронів у Харкові, ядерний реактор в Інституті фізики — здобутки 1960-х рр., коли науку УРСР ще активно розбудовували.", "src": "ЗНО 2008 – основна сесія (№ 44)"}, {"id": "z8964", "q": "Чи правильне твердження?\nПіднесення опозиційного руху в Україні в другій половині 1960-х – на початку 1970-х рр. було передусім спричинено:\n1) подіями в Чехословаччині, які отримали назву «Празька весна»;\n2) інтервенцією СРСР в Афганістан та згортанням міжнародної політики «розрядки».", "sec": "s1", "g": "", "t": "single", "opts": ["обидва варіанти правильні", "тільки 1-й варіант правильний", "тільки 2-й варіант правильний", "обидва варіанти не правильні"], "ok": [3], "expl": "Опозиційний рух піднявся передусім через згортання «відлиги», арешти 1965 р. і посилення русифікації. «Празька весна» 1968 р. не була головною причиною, а війна в Афганістані почалася 1979 р. — значно пізніше. Тому обидва твердження неправильні.", "src": "ЗНО 2008 – основна сесія (№ 47)"}, {"id": "z9001", "q": "Укажіть період піднесення напряму кіномистецтва – українського поетичного кіно (режисери Л. Осика, Ю. Іллєнко, І. Миколайчук, С. Параджанов).", "sec": "s4", "g": "poet_kino", "t": "single", "opts": ["друга половина 1940-х – перша половина 1950-х рр.", "друга половина 1950-х – перша половина 1960-х рр.", "друга половина 1960-х – 1970-і рр.", "1980-і – 1990-і рр."], "ok": [2], "expl": "Поетичне кіно почалося з «Тіней забутих предків» (1964 – 1965) і тривало до 1970-х рр. («Білий птах з чорною ознакою», «Камінний хрест», «Вавилон ХХ»).", "src": "ЗНО 2007 – основна сесія (№ 26)"}, {"id": "z10123", "q": "Установіть послідовність віх дисидентського руху в Українській РСР.", "sec": "s1", "g": "dys_seq", "t": "seq", "opts": ["створення Л. Лук’яненком Української робітничо-селянської спілки", "участь В. Стуса в акції протесту в кінотеатрі «Україна» проти масових арештів дисидентів", "початок випуску В. Чорноволом «самвидавського» журналу «Український вісник»", "заснування М. Руденком Української громадської групи сприяння виконанню Гельсінських угод"], "expl": "Українська робітничо-селянська спілка — 1959 – 1961 рр.; протест у кінотеатрі «Україна» — вересень 1965 р.; «Український вісник» — 1970 р.; Українська Гельсінська група — листопад 1976 р.", "src": "ЗНО 2016 – додаткова сесія (№ 28)"}, {"id": "z12552", "q": "Що було характерним для діяльності дисидентів в УРСР?", "sec": "s1", "g": "", "t": "single", "opts": ["підготовка до збройного повстання", "здійснення низки терористичних актів", "викривання антигуманної суті комуністичного режиму", "заклики до скасування депутатської недоторканності"], "ok": [2], "expl": "Дисиденти не готували повстань і терактів: вони писали листи-протести, поширювали самвидав, розповідали світові правду про переслідування в СРСР.", "src": "ЗНО 2017 – додаткова сесія (№ 18)"}, {"id": "z12554", "q": "С. Параджанов, І. Миколайчук, Л. Биков – видатні представники українського", "sec": "s4", "g": "kino", "t": "single", "opts": ["кіномистецтва.", "образотворчого мистецтва.", "театрального мистецтва.", "хореографічного мистецтва."], "ok": [0], "expl": "Сергій Параджанов («Тіні забутих предків»), Іван Миколайчук («Вавилон ХХ»), Леонід Биков («В бій ідуть лише “старі”») — кінорежисери й актори.", "src": "ЗНО 2017 – додаткова сесія (№ 20)"}, {"id": "z14988", "q": "У царині якого мистецтва творили діячі, зображені на фото?", "sec": "s4", "g": "kino", "t": "single", "img": ["q_8e5e3fb7a2"], "opts": ["кіно", "театру", "музики", "архітектури"], "ok": [0], "expl": "На фото — кінорежисери Олександр Довженко й Сергій Параджанов.", "src": "ЗНО 2018 – основна сесія (№ 18)"}, {"id": "z15522", "q": "Які поняття пов’язані з розвитком дисидентського руху в Україні в 1960–1970-ті рр.?", "sec": "s1", "g": "dys_terms", "t": "three", "opts": ["«дефіцит»", "«самвидав»", "«люстрація»", "«правозахисник»", "«гласність»", "«тамвидав»", "«розвинений соціалізм»"], "ok": [1, 3, 5], "expl": "Самвидав, тамвидав і правозахисник — поняття дисидентського руху. Дефіцит — економіка, «розвинений соціалізм» — офіційна ідеологія, гласність — перебудова, люстрація — незалежна Україна.", "src": "ЗНО 2018 – додаткова сесія (№ 30)"}, {"id": "z16556", "q": "Один з творців української естрадної музики, автор 107 пісень, 53 інструментальних творів, автор найкращих пісень року в СРСР - «Червона рута» (1971 р.) та «Водограй» (1972 р.) - це", "sec": "s4", "g": "", "t": "single", "opts": ["Л. Биков.", "В. Івасюк.", "І. Миколайчук.", "С. Параджанов."], "ok": [1], "expl": "Володимир Івасюк — композитор, автор «Червоної рути» й «Водограю». Загинув 1979 р. за нез’ясованих обставин; його похорон у Львові перетворився на мовчазний протест.", "src": "ЗНО 2019 – пробний тест (№ 19)"}, {"id": "z18364", "q": "Опозиційний рух в Українській РСР в роки «застою» мав форму", "sec": "s1", "g": "", "t": "single", "opts": ["дисидентства.", "багатопартійності.", "незалежних профспілок.", "збройної боротьби."], "ok": [0], "expl": "В Українській РСР 1965 – 1985 рр. опозиція існувала як дисидентський рух: окремі люди й невеликі групи відкрито не погоджувалися з владою. Партії й незалежні профспілки з’явилися лише наприкінці 1980-х рр., збройна боротьба (УПА) закінчилася на початку 1950-х рр.", "src": "ЗНО 2019 – додаткова сесія (№ 18)"}, {"id": "z18376", "q": "Укажіть осіб, які були членами Української Гельсінської групи.", "sec": "s1", "g": "", "t": "three", "opts": ["В. Чорновіл", "О. Гончар", "І. Драч", "В. Стус", "Л. Костенко", "А. Горська", "М. Руденко"], "ok": [0, 3, 6], "expl": "До Української Гельсінської групи належали Микола Руденко (засновник і голова), Василь Стус і В’ячеслав Чорновіл (вступили 1979 р.). Гончар, Драч, Костенко й Горська рнаціоналізм чи русифікація?» і надіслав її Шелесту й Щербицькому. Праця розійшлася самвидавом і вийшла за кордоном.", "src": "ЗНО 2020 – основна сесія (№ 17)"}, {"id": "z20670", "q": "Проаналізуйте фрагмент історичного документа\nта виконайте завдання до нього.\n«...Відчувалася загальна потреба якогось “роз’яснення”, якогось виступу в цій справі [арештів]. Офіційні кола мовчали. Серед тих, хто багато в чому не погоджувався з офіційною національною політикою, не знайшлося кому виступити одверто, принципово й на всю широчінь питання. Тоді довелося взятися за цю справу мені. У вересні–грудні 1965 року я написав, а наприкінці того ж року надіслав на адресу Шелеста й Щербицького працю “Інтернаціоналізм чи русифікація?”, у якій звинувачував КПРС і КПУ в антидемократизмі та проведенні жорсткої русифікації під виглядом інтернаціоналізму».\n«Працю», згадану в уривку документа, автор написав під впливом арештів", "sec": "s1", "g": "dzyuba", "t": "single", "opts": ["дисидентів.", "колаборантів.", "остарбайтерів.", "номенклатурників."], "ok": [0], "expl": "Ідеться про арешти 1965 р. — першу хвилю арештів дисидентів. Саме на них відповів Іван Дзюба своєю працею «Інтернаціоналізм чи русифікація?».", "src": "ЗНО 2020 – основна сесія (№ 18)"}, {"id": "z20671", "q": "Проаналізуйте фрагмент історичного документа\nта виконайте завдання до нього.\n«...Відчувалася загальна потреба якогось “роз’яснення”, якогось виступу в цій справі [арештів]. Офіційні кола мовчали. Серед тих, хто багато в чому не погоджувався з офіційною національною політикою, не знайшлося кому виступити одверто, принципово й на всю широчінь питання. Тоді довелося взятися за цю справу мені. У вересні–грудні 1965 року я написав, а наприкінці того ж року надіслав на адресу Шелеста й Щербицького працю “Інтернаціоналізм чи русифікація?”, у якій звинувачував КПРС і КПУ в антидемократизмі та проведенні жорсткої русифікації під виглядом інтернаціоналізму».\nЯкою була реакція компартійного керівництва УРСР на згадану в докуме неосталінізму» охарактеризовано творчість", "sec": "s1", "g": "", "t": "single", "opts": ["Ю. Смолича, М. Хвильового.", "В. Симоненка, І. Світличного.", "О. Теліги, Є. Маланюка.", "П. Панча, А. Головка."], "ok": [1], "expl": "Шістдесятники — покоління молодих митців часів «відлиги», серед них поет Василь Симоненко й літературний критик Іван Світличний. Хвильовий і Смолич — 1920-ті рр., Теліга й Маланюк — письменники-емігранти, Панч і Головко — офіційні радянські письменники.", "src": "ЗНО 2010 – додаткова сесія (№ 46)"}, {"id": "z22073", "q": "Однією з ознак дисидентського руху в Україні в 1970-х рр. є", "sec": "s1", "g": "", "t": "single", "opts": ["фінансування незалежними профспілками.", "залучення до нелегальної роботи лише українців.", "налагодження конструктивного діалогу з владою.", "використання мирних, ненасильницьких методів боротьби."], "ok": [3], "expl": "Дисиденти боролися мирно: листи-протести, самвидав, звернення до міжнародних організацій. Профспілки їх не фінансували, серед них були люди різних національностей, а влада діалогу з ними не вела — їх ув’язнювали.", "src": "ЗНО 2010 – додаткова сесія (№ 47)"}, {"id": "z22082", "q": "Установіть відповідність між прізвищами кінорежисерів та їхніми кінострічками.", "sec": "s4", "g": "", "t": "match", "opts": ["«Звенигора», «Арсенал».", "«Тіні забутих предків», «Цвіт гранату».", "«Вавилон – XX», «Така пізня, така тепла осінь».", "«Криниця для спраглих», «Білий птах з чорною ознакою».", "«Камінний хрест», «Тривожний місяць вересень»."], "ok": [1, 2, 3, 4], "left": ["С. Параджанов", "І. Миколайчук", "Ю. Іллєнко", "Л. Осика"], "expl": "Параджанов — «Тіні забутих предків», Миколайчук — «Вавилон ХХ», Іллєнко — «Криниця для спраглих», «Білий птах з чорною ознакою», Осика — «Камінний хрест». «Звенигора» й «Арсенал» — фільми Довженка 1920-х рр.", "src": "ЗНО 2010 – додаткова сесія (№ 56)"}, {"id": "z22142", "q": "Установіть послідовність віх дисидентського руху в Українській РСР.", "sec": "s1", "g": "dys_seq", "t": xpl": "Ознайомлення з Декларацією прав людини, виконання Заключного акта Наради з безпеки й співробітництва в Європі, акредитація іноземних журналістів — це завдання Української Гельсінської групи (1976).", "src": "ЗНО 2021 – основна сесія (№ 18)"}, {"id": "z23823", "q": "Проаналізуйте фрагмент історичного документа й виконайте завдання 18-20 до нього.\n«…організація ставить за мету вирішення чотирьох головних завдань: ознайомлення широких кіл української громадськості з Декларацією прав людини; сприяння виконанню статей заключного Акта з питань безпеки й співробітництва в Європі; домагання того, щоби на всіх міжнародних нарадах... Україну як суверенну європейську державу й члена ООН було представлено окремою делегацією; акредитування в Україні представників зарубіжної преси».\nДіяльність організації засвідчувала", "sec": "s1", "g": "ugg_doc2", "t": "single", "opts": ["розвиток дисидентського руху.", "загострення проблеми дефіциту.", "започаткування «хрущовських реформ».", "розгортання нової хвилі процесу реабілітації."], "ok": [0], "expl": "Поява Української Гельсінської групи (1976) — новий етап дисидентського руху: правозахисники об’єдналися в організацію й відкрито вимагали від влади дотримуватися прав людини.", "src": "ЗНО 2021 – основна сесія (№ 20)"}, {"id": "z23828", "q": "З'ясуйте, у якій сфері творчості здобув популярність кожен з указаних митців.", "sec": "s4", "g": "", "t": "match", "opts": ["література", "театральне мистецтво", "образотворче мистецтво", "кіномистецтво", "естрадне мистецтво"], "ok": [3, 4, 0, 2], "left": ["Л. Биков", "В. Івасюк", "В. Стус", "А. Горська"], "expl": "Биков — кіно, Івасюк — естрадна пісня, Стус — література, Горська — живопис і монументальне мистецтво.", "src": "ЗНО 2021 – основна сесія (№ 25)"}, {"id": "z24887", "q": "З'ясуйте, до якої серії нумізматичної колекції належить кожна з пам'ятних (ювілейних) монет, зображених на фото.", "sec": "s4", "g": "", "t": "match", "rimg": ["q_966bdd6ec5", "q_334862b873", "q_ff3c3fcf10", "q_2ba46f970a"], "opts": ["«Піонери генетики»", "«Світила медицини»", "«Лідери правозахисного руху»", "«Творці крилатих машин»", "«Підкорювачі космосу»"], "ok": [4, 2, 1, 3], "left": ["", "", "", ""], "expl": "На монетах — Сергій Корольов (підкорювачі космосу), Петро Григоренко (лідери правозахисного руху), Микола Амосов (світила медицини) й Олег Антонов (творці крилатих машин).", "src": "ЗНО 2021 – додаткова сесія (№ 26)"}, {"id": "z26033", "q": "Доберіть до кожної назви нумізматичної колекції відповідну пам’ятну (ювілейну) монету, зображену на фото.", "sec": "s4", "g": "coins", "t": "match", "oimg": ["q_9adcf7dac3", "q_bf7e9c2fb5", "q_f90f716f04", "q_c1a612c09e", "q_eb39f92b56"], "opts": ["А", "Б", "В", "Г", "Д"], "ok": [2, 0, 3, 4], "left": ["«Живописці соціалістичного реалізму»", "«Українське наївне мистецтво»", "«Поети-шістдесятники України»", "«Українське поетичне кіно»"], "expl": "Марія Примаченко — наївне мистецтво; Тетяна Яблонська — живописниця соціалістичного реалізму («Хліб»); Василь Симоненко — поет-шістдесятник; Іван Миколайчук — поетичне кіно. Зайва монета — Павло Тичина.", "src": "НМТ 2022 – демоваріант (№ 20)"}, {"id": "z26146", "q": "На фото зображено видатного українського", "sec": "s4", "g": "mykol_photo", "t": "single", "img": ["q_a54ddab800"], "opts": ["актора.", "художника.", "композитора.", "оперного співака."], "ok": [0], "expl": "На фото — Іван Миколайчук, актор («Тіні забутих предків», «Білий птах з чорною ознакою») і режисер («Вавилон ХХ»).", "src": "НМТ 2022 – основна сесія (№ 13)"}, {"id": "z26232", "q": "Установіть послідовність подій суспільно-культурного життя, що відображені в цитованих документах.", "sec": "s1", "g": "", "t": "seq", "opts": ["«Зворотною стороною буржуазного націоналізму є безрідний космополітизм, який проявляється в плазуванні та низькопоклонстві перед іноземщиною. Безрідний космополітизм є зброєю в боротьбі проти соціалізму...»", "«Комуністи у своїх виступах піддали критиці новий роман О. Гончара “Собор”. Висловлюючи жаль, що зрілий майстер художнього слова як у кривому дзеркалі показав працю, побут, духовний світ металургів і колгоспників Подніпров’я…»", "«...Репресії показали, що в дискусії з українськими “дисидентами” влада не знайшла більш переконливих аргументів, ніж застосування сили, а умови в таборах переконали мене в тім, що простір застосування цієї сили не знає кінця...»", "«Низька технічна оснащеність наукових лабораторій, різке зниження життєвого рівня і соціальна незахищеність призвели до масового виїзду багатьох вчених за кордон, переходу їх до комерційних структур…»"], "expl": "Боротьба з «безрідним космополітизмом» — кінець 1940-х рр. (ждановщина), критика роману «Собор» — 1968 р., лист В. Стуса про репресії 1972 р. — 1970-ті рр., виїзд науковців за кордон через бідність — 1990-ті рр.", "src": "НМТ 2023 – демоваріант (№ 27)"}, {"id": "z26929", "q": "Доберіть до назви нумізматичної колекції (1–4) відповідну пам’ятну (ювілейну) монету, зображену на фото (А – Д).", "sec": "s4", "g": "coins", "t": "match", "oimg": ["q_cc94ecdebe", "q_da52e53d0a", "q_b897c9c2fd", "q_246504a56b", "q_01765529a0"], "opts": ["А", "Б", "В", "Г", "Д"], "ok": [2, 0, 3, 4], "left": ["«Живописці соціалістичного реалізму»", "«Українське наївне мистецтво»", "«Поети-шістдесятники України»", "«Українське поетичне кіно»"], "expl": "Марія Примаченко — наївне мистецтво; Тетяна Яблонська — живописниця соціалістичного реалізму («Хліб»); Василь Симоненко — поет-шістдесятник; Іван Миколайчук — поетичне кіно. Зайва монета — Павло Тичина.", "src": "НМТ 2023 – 1 сесія (№ 24)"}, {"id": "z26958", "q": "Визначте авторство (А – Д) зображених на фото картин (1–4).", "sec": "s4", "g": "paint", "t": "match", "rimg": ["q_5a63f4c6d2", "q_575297a8cd", "q_6684ec6d78", "q_95332217df"], "opts": ["Т. Яблонська", "К. Білокур", "М. Примаченко", "В. Касіян", "Г. Нарбут"], "ok": [4, 0, 1, 2], "left": ["", "", "", ""], "expl": "Картини: ілюстрація з козаками — Георгій Нарбут, «Хліб» — Тетяна Яблонська, квіти біля хати — Катерина Білокур, «звір» — Марія Примаченко. Зайвий — графік Василь Касіян.", "src": "НМТ 2023 – 2 сесія (№ 23)"}, {"id": "z28444", "q": "Про активізацію дисидентського руху в Україні в другій половині 1970-х рр. свідчить", "sec": "s1", "g": "ugg_akt", "t": "single", "opts": ["створення Української робітничо-селянської спілки.", "поява праці І. Дзюби «Інтернаціоналізм чи русифікація?».", "організація в Києві та Львові клубів творчої молоді «Сучасник» і «Пролісок».", "діяльність Української громадської групи сприяння виконанню Гельсінських угод."], "ok": [3], "expl": "Українська громадська група сприяння виконанню Гельсінських угод з’явилася в листопаді 1976 р. — це і є друга половина 1970-х. УРСС — 1959 – 1961 рр., праця Дзюби — 1965 р., клуби творчої молоді — початок 1960-х рр.", "src": "НМТ 2024 – 2 сесія (№ 17)"}, {"id": "z34340", "q": "Які поняття пов'язані з розвитком дисидентського руху в Україні в 1960-1970-ті рр.?", "sec": "s1", "g": "dys_terms", "t": "three", "opts": ["«дефіцит»", "«самвидав»", "«люстрація»", "«правозахисник»", "«гласність»", "«тамвидав»", "«розвинений соціалізм»"], "ok": [1, 3, 5], "expl": "Самвидав, тамвидав і правозахисник — поняття дисидентського руху. Дефіцит — економіка, «розвинений соціалізм» — офіційна ідеологія, гласність — перебудова, люстрація — незалежна Україна.", "src": "НМТ 2025 – 1 сесія (№ 30)"}, {"id": "z34357", "q": "У якій галузі мистецтва уславилися Тетяна Яблонська, Катерина Білокур, Марія Примаченко?", "sec": "s4", "g": "", "t": "single", "opts": ["кінематографі", "живописі", "літературі", "архітектурі"], "ok": [1], "expl": "Тетяна Яблонська, Катерина Білокур і Марія Примаченко — художниці, їхні картини є в програмі НМТ.", "src": "НМТ 2025 – 2 сесія (№ 17)"}, {"id": "z35473", "q": "На чию адресу лунали такі звинувачення партійних функціонерів:\n«…комісія, проаналізувавши наданий матеріал, а також вивчивши матеріали зарубіжної антирадянської преси і радіо за період з 1966 по 1972 рік дійшла висновку, що підготовлений матеріал “Інтернаціоналізм чи русифікація?” є від початку й до кінця пасквілем на радянську дійсність, на національну політику КПРС і практику комуністичного будівництва в СРСР»?", "sec": "s1", "g": "dzyuba", "t": "single", "opts": ["Миколи Руденка", "Євгена Сверстюка", "Валерія Марченка", "Івана Дзюби"], "ok": [3], "expl": "Працю «Інтернаціоналізм чи русифікація?» написав Іван Дзюба наприкінці 1965 р. У 1972 р. її оголосили «пасквілем на радянську дійсність», а автора заарештували.", "src": "НМТ 2026 – демоваріант (№ 19)"}, {"id": "z35484", "q": "Установіть послідовність створення документів, уривки з яких наведено.", "sec": "s1", "g": "", "t": "seq", "opts": ["«Ми, партія Українська робітничо-селянська спілка (УРСС), є партія інтернаціоналістів. Боротьбу за самостійну Україну ми розвиватимемо разом із громадянами інших національностей, які населяють Україну...»", "«У книзі… “Україно наша Радянська” непомірно багато місця відводиться минулому України, її дожовтневій історії, водночас слабо показуються такі епохальні події, як перемога Великого Жовтня, боротьба за побудову соціалізму...»", "«Сприяти ознайомленню широких кіл української громадськості з Декларацією прав людини. Домагатися, щоб цей міжнародний правовий документ став основним у відносинах поміж особою і державою...»", "«Соціалістичне самоврядування реалізується в умовах широкої гласності шляхом участі всього колективу та його громадських організацій у виробленні найважливіших рішень і контролі за їх виконанням, виборності керівників і єдиноначальності в управлінні підприємством...»"], "expl": "Програма Української робітничо-селянської спілки — 1959 – 1960 рр.; критика книжки П. Шелеста «Україно наша Радянська» — 1973 р.; декларація Української Гельсінської групи — 1976 р.; закон про «соціалістичне самоврядування» на підприємствах — 1987 р. (перебудова).", "src": "НМТ 2026 – демоваріант (№ 27)"}, {"id": "z39173", "q": "Оцінку діяльності членів якої організації містить джерело:\n«Правозахисники відкрито апелювали до радянського законодавства та міжнародних документів. Вони першими поєднали боротьбу українців за право на національне самовизначення з тематикою прав людини, чим сформували ненасильницьку, легальну й правову основу для здобуття українцями незалежності й демократії…»?", "sec": "s1", "g": "", "t": "single", "opts": ["Народного Руху України", "Української головної визвольної ради", "Українського національно-демократичного об’єднання", "Української Гельсінської групи"], "ok": [3], "expl": "Правозахисники, які спиралися на радянські закони й міжнародні документи про права людини, — це члени Української Гельсінської групи (1976). Рух (1989) і УНДО — пізніші організації, УГВР — керівний орган підпілля 1944 р.", "src": "НМТ 2026 – 1 сесія (№ 19)"}, {"id": "z39268", "q": "Позначте факти біографії діяча, зображеного на фото.", "sec": "s1", "g": "stus", "t": "three", "img": ["q_3dd09c15b4"], "opts": ["написання памфлету «Інтернаціоналізм чи русифікація?»", "участь в діяльності Української Гельсінської групи (УГГ)", "заснування підпільного українського часопису «Український вісник»", "участь в акції протесту в кінотеатрі «Україна» проти арештів дисидентів", "членство в Українській робітничо-селянській спілці (УРСС)", "участь у повстанні політичних в’язнів Норильського табору", "написання збірок віршів «Круговерть», «Зимові дерева»."], "ok": [1, 3, 6], "expl": "На фото — Василь Стус. Він виступав на прем’єрі «Тіней забутих предків» 1965 р., написав збірки «Круговерть» і «Зимові дерева», у таборі вступив до Української Гельсінської групи. «Інтернаціоналізм чи русифікація?» — праця Дзюби, «Український вісник» — Чорновола.", "src": "НМТ 2026 – 2 сесія (№ 29)"}, {"id": "z35264", "q": "Укажіть діяча, який був сценаристом у фільмі, реклама якого зображена.", "sec": "s4", "g": "mykol", "t": "single", "img": ["q_f9185a70b8"], "opts": ["Іван Миколайчук", "Сергій Параджанов", "Богдан Ступка", "Леонід Биков"], "ok": [0], "expl": "На афіші — фільм «Білий птах з чорною ознакою» (1971) режисера Юрія Іллєнка. Сценарій він написав разом з Іваном Миколайчуком, який зіграв у фільмі одну з головних ролей.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36030", "q": "До якого періоду в історії СРСР доречно віднести зображену карикатуру?", "sec": "s5", "g": "", "t": "single", "img": ["q_a38b020f29"], "opts": ["Перші повоєнні роки (1945-1953 рр.)", "Політична та економічна лібералізація суспільства (1953-1964 рр.)", "Загострення кризи радянської системи (1965-1985 рр.)", "Розпад Радянського Союзу та відродження незалежності України (1985-1991 рр.)"], "ok": [2], "expl": "Над заводом виросла багатоповерхова вежа контор і дирекцій, а до верхівки доводиться добиратися гелікоптером. Це карикатура на розростання управлінського апарату й бюрократизм — типову ваду доби «застою» (1965 – 1985).", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36434", "q": "З'ясуйте хронологію появи понять, пов’язаних з історією України другої половини XX ст.", "sec": "s5", "g": "", "t": "seq", "opts": ["відбудова", "реабілітація репресованих", "розвинений соціалізм", "гласність"], "expl": "Відбудова — після 1945 р.; реабілітація репресованих — після 1953 – 1956 рр.; «розвинений соціалізм» — з 1967 р.; гласність — з 1986 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36463", "q": "Розгляньте колаж.\nОдну з головних ролей у цьому фільмі зіграв", "sec": "s4", "g": "mykol", "t": "single", "img": ["q_cb8deeebb3"], "opts": ["Данило Ільченко.", "Іван Миколайчук.", "Леонід Биков.", "Лесь Сердюк."], "ok": [1], "expl": "На афіші — фільм «Білий птах з чорною ознакою» (1971) режисера Юрія Іллєнка. Одну з головних ролей зіграв Іван Миколайчук, співавтор сценарію.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36499", "q": "Через «самвидав» протягом 1970-х – початку 1980-х рр. поширювали інформацію про", "sec": "s1", "g": "samvyd", "t": "single", "opts": ["порушення свободи слова, судові і позасудові репресії в Україні, становище українських політв’язнів у тюрмах і таборах.", "проблеми та досягнення передової української радянської науки, її роль у піднесенні розвитку народного господарства республіки.", "здобутки й перспективи радянської економіки, роль Комуністичної партії Радянського Союзу в покращенні добробуту радянських людей.", "про боротьбу народів за свою свободу, духовне та соціальне розкріпачення, роль СРСР у зміцненні миру у всьому світі."], "ok": [0], "expl": "Самвидав поширював те, про що мовчала офіційна преса: арешти й закриті суди, умови в таборах, порушення свободи слова. Решта варіантів — теми офіційної радянської пропаганди.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z36580", "q": "Доберіть до фото (1–4) уривок з історичного джерела (А – Д), у якому йдеться про цього українського діяча.", "sec": "s4", "g": "paradzh", "t": "match", "rimg": ["q_542798a6fa", "q_4ff186ce90", "q_0de17095a3", "q_4f6eb9aea7"], "opts": ["«Україна – це моя Батьківщина, моя друга Батьківщина. Там я створив свій перший шедевр \"Тіні забутих предків\", там я став генієм, там у мене народився син. Україна мені подарувала все»", "«Комуністи у своїх виступах піддали критиці новий роман \"Собор\". Висловлюючи жаль, що зрілий майстер художнього слова як у кривому дзеркалі показав працю, побут, духовний світ металургів і колгоспників Подніпров'я»", "«\"Тіні забутих предків\" дуже яскраво передають його акторську сутність. Він так зіграв роль гуцула Івана Палійчука, закоханого у прекрасну Мавку (Ларису Кадочникову), ніби народився для неї»", "«Його бачення майбутнього України значно випереджало погляди сучасників, які усіляке намагалися консервувати застарілу та неефективну радянську систему. Це була Людина яка зробила все, щоб омріяна Незалежність України стала дійсністю»", "«Один із ключових інтелектуалів українського дисидентського руху, який своїми працями та громадянською позицією суттєво вплинув на формування української національної ідеї у ХХ столітті»"], "ok": [2, 0, 1, 3], "left": ["", "", "", ""], "expl": "Іван Миколайчук зіграв Івана Палійчука в «Тінях забутих предків»; Параджанов називав Україну своєю другою батьківщиною; Олеся Гончара критикували за «Собор»; В’ячеслав Чорновіл — політик, чиє бачення майбутнього України випереджало час.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37255", "q": "Хто з діячів виголосив ці слова під час судового процесу над ним?\n«Я відмовляюся від адвоката Медведчука і взагалі від будь-якого радянського адвоката. Я вимагаю адвоката з міжнародної правової організації».", "sec": "s1", "g": "stus", "t": "single", "opts": ["В’ячеслав Чорновіл", "Василь Стус", "Левко Лук’яненко", "Іван Дзюба"], "ok": [1], "expl": "Так сказав Василь Стус на суді 1980 р.: адвокат Віктор Медведчук, призначений владою, фактично допомагав обвинуваченню. Стуса засудили до 10 років таборів; він загинув у таборі 1985 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37626", "q": "Хто був редактором зображеного видання?", "sec": "s1", "g": "visnyk", "t": "single", "img": ["q_54c1057233"], "opts": ["В'ячеслав Чорновіл", "Іван Дзюба", "Левко Лук'яненко", "Петро Григоренко"], "ok": [0], "expl": "«Український вісник» — самвидавський журнал, який у 1970 – 1972 рр. видавав В’ячеслав Чорновіл. Там описували арешти, суди й інші порушення прав людини в Україні.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37638", "q": "Позначте імена діячів культури, чиї творчі здобутки пов’язані з кіномистецтвом.", "sec": "s4", "g": "", "t": "three", "opts": ["Георгій Нарбут", "Леонід Биков", "Сергій Параджанов", "Іван Миколайчук", "Микола Самокиш", "Володимир Івасюк", "Микола Пимоненко"], "ok": [1, 2, 3], "expl": "З кіно пов’язані Леонід Биков, Сергій Параджанов, Іван Миколайчук. Нарбут, Самокиш і Пимоненко — художники, Івасюк — композитор.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z37903", "q": "Упорядкуйте за хронологією події другої половини XX століття.", "sec": "s1", "g": "dys_seq", "t": "seq", "opts": ["перша хвиля арештів українських дисидентів", "початок видання часопису «Український вісник»", "заснування Української Гельсінської групи", "ухвалення останньої Конституції УРСР"], "expl": "Перша хвиля арештів — 1965 р.; «Український вісник» — 1970 р.; Українська Гельсінська група — 1976 р.; остання Конституція УРСР — 1978 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "z10239", "q": "Установіть відповідність між прізвищем діяча та сферою його діяльності.", "sec": "s4", "g": "", "t": "match", "opts": ["кіномистецтво", "електрозварювання", "поетичне мистецтво", "образотворче мистецтво", "літакобудування"], "ok": [2, 4, 0, 3], "left": ["Л. Костенко", "О.Антонов", "Л. Биков", "А. Горська"], "expl": "Костенко — поезія, Антонов — літаки, Биков — кіно, Горська — образотворче мистецтво. Електрозварювання — сфера Бориса Патона.", "src": "ЗНО 2017 – пробний тест (№ 26)"}, {"id": "z9021", "q": "Укажіть завдання, що ставила перед собою Українська громадська група сприяння виконанню Гельсінських угод:\nДомагатися припинення втручання у внутрішні справи соціалістичних країн Східної Європи.\nОзнайомити широкі кола української громадськості з Загальною Декларацією прав людини.\nДомагатися акредитування в Україні представників зарубіжної преси.\nДобиватися ліквідації системи ГУЛАГу та реабілітації незаконно засуджених.\nОзнайомити світову громадськість з фактами порушень прав людини в Україні.\nДобиватися внесення до Конституцій СРСР та УРСР положень про свободу слова, друку, віросповідання, мітингів, зборів.\nДомагатися щоб на міжнародних нарадах з питань безпеки та співробітництва в Європі Україна була представлена окремою делегацією.", "sec": "s1", "g": "ugg_task3", "t": "single", "opts": ["2, 3, 5, 7", "1, 3, 5, 6", "2, 4, 6, 7", "1, 3, 4, 7"], "ok": [0], "expl": "УГГ хотіла, щоб люди знали свої права (Декларація прав людини), щоб світ знав про порушення прав в Україні, щоб в Україні працювали іноземні журналісти й щоб Україна мала окрему делегацію на міжнародних нарадах. Східна Європа й ГУЛАГ не були її темами.", "src": "ЗНО 2007 – основна сесія (№ 46)"}, {"id": "z23822", "q": "Проаналізуйте фрагмент історичного документа й виконайте завдання 18-20 до нього.\n«…організація ставить за мету вирішення чотирьох головних завдань: ознайомлення широких кіл української громадськості з Декларацією прав людини; сприяння виконанню статей заключного Акта з питань безпеки й співробітництва в Європі; домагання того, щоби на всіх міжнародних нарадах... Україну як суверенну європейську державу й члена ООН було представлено окремою делегацією; акредитування в Україні представників зарубіжної преси».\nХто з осіб, зображених на фото, був одним із засновників цієї організації?", "sec": "s1", "g": "ugg_doc2", "t": "single", "oimg": ["q_3fdb2e9e70", "q_163b613f42", "q_af9d7991c0", "q_89e4db1fa3"], "opts": ["А", "Б", "В", "Г"], "ok": [3], "expl": "Серед засновників Української Гельсінської групи (1976) — Микола Руденко, Петро Григоренко, Левко Лук’яненко (фото Г), Олесь Бердник, Оксана Мешко.", "src": "ЗНО 2021 – основна сесія (№ 19)"}, {"id": "z25590", "q": "Про активізацію дисидентського руху в Україні в другій половині 1970-х рр. свідчить", "sec": "s1", "g": "ugg_akt", "t": "single", "opts": ["створення Української робітничо-селянської спілки.", "поява праці І. Дзюби «Інтернаціоналізм чи русифікація?»", "організація в Києві та Львові клубів творчої молоді «Сучасник» і «Пролісок».", "діяльність Української громадської групи сприяння виконанню Гельсінських угод."], "ok": [3], "expl": "Українська громадська група сприяння виконанню Гельсінських угод з’явилася в листопаді 1976 р. — це і є друга половина 1970-х. УРСС — 1959 – 1961 рр., праця Дзюби — 1965 р., клуби творчої молоді — початок 1960-х рр.", "src": "ЗНО 2011 – 2 сесія (№ 47)"}, {"id": "z28421", "q": "Узгодьте дисидента, зображеного на фото (1–4), з фактом його біографії (А – Д).", "sec": "s1", "g": "", "t": "match", "rimg": ["q_56c67c9a8b", "q_f6f3008766", "q_e313947ef8", "q_6754ca6961"], "opts": ["організатор створення Української робітничо-селянської спілки", "учасник повстання політичних в’язнів у Норільському концтаборі", "автор збірок віршів «Круговерть», «Зимові дерева»", "організатор, редактор і видавець «самвидавного» часопису «Український вісник»", "автор памфлету «Інтернаціоналізм чи русифікація?»"], "ok": [2, 3, 4, 0], "left": ["", "", "", ""], "expl": "На фото — Василь Стус (збірки «Круговерть», «Зимові дерева»), В’ячеслав Чорновіл («Український вісник»), Іван Дзюба («Інтернаціоналізм чи русифікація?») і Левко Лук’яненко (Українська робітничо-селянська спілка). Норильське повстання 1953 р. — з життя інших в’язнів ГУЛАГу.", "src": "НМТ 2024 – 1 сесія (№ 24)"}, {"id": "z36925", "q": "Що спільного в діяльності історичних постатей, зображених на фото?", "sec": "s1", "g": "", "t": "single", "img": ["q_149db8d8b7"], "opts": ["були активними членами Української Гельсінської групи", "зазнали переслідувань як політичні в’язні радянського режиму", "брали активну участь у видавництві й поширенні самвидаву", "були учасниками протесту 1965 року в кінотеатрі «Україна»"], "ok": [2], "expl": "На фото — поет Василь Симоненко і Василь Стус. Твори обох поширювалися самвидавом. Симоненко помер 1963 р.: він не був ані політв’язнем, ані членом Української Гельсінської групи, ані учасником протесту 1965 р.", "src": "тренувальне завдання osvita.ua (не з реального тесту)"}, {"id": "b14", "q": "Указ Президії Верховної Ради СРСР 1967 р. щодо кримських татар", "sec": "s2", "g": "", "t": "single", "opts": ["дозволив їм масово повернутися до Криму й отримати землю", "зняв із них звинувачення в зраді, але не дав повернутися", "відновив Кримську автономію з кримськотатарським урядом", "дозволив діяльність Меджлісу кримськотатарського народу"], "ok": [1], "expl": "Указ 1967 р. скасував звинувачення в зраді, висунуте під час депортації 1944 р., але права повернутися до Криму не дав. Масове повернення почалося наприкінці 1980-х рр., Меджліс обрали 1991 р.", "src": "за зразком ЗНО"}, {"id": "b15", "q": "Українська греко-католицька церква в 1970-х – на початку 1980-х рр.", "sec": "s2", "g": "", "t": "single", "opts": ["відкрито проводила богослужіння в Києві", "мала офіційну реєстрацію в західних областях", "діяла в підпіллі, бо була заборонена з 1946 р.", "отримала право відкрити духовну семінарію"], "ok": [2], "expl": "УГКЦ заборонили 1946 р. Її священники служили таємно, по хатах і в лісах, а віряни домагалися легалізації церкви. Легальною вона стала лише 1989 – 1990 рр.", "src": "за зразком ЗНО"}, {"id": "b16", "q": "Генерал Петро Григоренко став відомим правозахисником насамперед тому, що", "sec": "s2", "g": "", "t": "single", "opts": ["очолював Меджліс кримськотатарського народу", "редагував самвидавський «Український вісник»", "створив Українську робітничо-селянську спілку", "обстоював право кримських татар повернутися до Криму"], "ok": [3], "expl": "Григоренко захищав кримських татар, за що його виключили з партії, позбавили звання й двічі запроторили до психіатричних лікарень. У 1976 р. він став одним із засновників Української Гельсінської групи, а 1978 р. його позбавили громадянства. Меджліс очолив Мустафа Джемілєв, УРСС створив Левко Лук’яненко, «Український вісник» редагував В’ячеслав Чорновіл.", "src": "за зразком ЗНО"}, {"id": "b17", "q": "Яким було становище української мови в УРСР наприкінці 1970-х – на початку 1980-х рр.?", "sec": "s3", "g": "", "t": "single", "opts": ["її вивчення в школах посилили й розширили", "її витісняли з вишів, науки й міських шкіл", "її оголосили державною мовою республіки", "вона була єдиною мовою навчання у вишах"], "ok": [1], "expl": "Після постанов 1978 і 1983 рр. російську мову вивчали з першого класу й навіть у садочках, учителям російської підвищили зарплату, від української мови можна було звільнити. Державною українську оголосили

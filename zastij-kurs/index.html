робітниками міліції", "розкрадання державного майна на робочих місцях", "стрімке зростання цін на товари широкого вжитку", "поглиблення технологічної відсталості легкої промисловості"]}, {"id": "1.13", "n": 11, "t": "single", "q": "На яке явище в житті радянських людей у період «застою» вказує карикатура?", "sec": "", "g": "", "img": ["q_2613c6433d"], "opts": ["низький рівень соціального захисту населення", "хронічний дефіцит товарів широкого вжитку", "політичну активність старшого покоління", "дитячу безпритульність"]}, {"id": "1.15", "n": 12, "t": "single", "q": "Яке явище радянської дійсності 1970-1980-х рр. відображено на карикатурі?", "sec": "", "g": "", "img": ["q_40f4f6d1b6"], "opts": ["незадовільні умови праці співробітників закладів торгівлі", "низький рівень культури обслуговування у сфері торгівлі", "падіння в суспільстві престижу торговельних професій", "дефіцит товарів широкого вжитку в торговельних мережах"]}, {"id": "1.17", "n": 13, "t": "single", "q": "На якій проблемі радянської дійсності 1970-1980-х рр. фокусує увагу зображена карикатура? Напис на карикатурі: «– Молоді люди! Походили б для тренування з моєю заявою... – Що ти, бабцю! Ми більше п’ятдесяти кілометрів не ходимо!»", "sec": "", "g": "", "img": ["q_25a3c997a0"], "opts": ["соціальній незахищеності людей похилого віку", "непопулярності легкоатлетичного спорту", "погіршенні стану здоров’я молодого покоління", "бюрократизмі державного управлінського апарату"]}, {"id": "1.19", "n": 14, "t": "single", "q": "Яке визначення відповідає поняттю «номенклатура»?", "sec": "", "g": "", "opts": ["система управління, за якої частина функцій центральної влади переходить до місцевих органів самоврядування", "система, за якої функціонують і ведуть боротьбу за владу партії різної політичної орієнтації", "політика розміщення промислових об’єктів без урахування наявної сировинної бази, трудових ресурсів тощо", "узагальнююча назва посадовців різних рівнів, що є ланками командно-адміністративної системи"]}, {"id": "1.24", "n": 15, "t": "single", "q": "«Самвидав» – це один із методів боротьби дисидентів у СРСР й УРСР, що полягав у", "sec": "", "g": "", "opts": ["друкуванні в державних засобах масової інформації критичних матеріалів.", "поширенні серед населення української національної символіки.", "неофіційному виготовленні та розповсюдженні літературних і публіцистичних творів.", "написанні листів-протестів до вищого партійно-радянського керівництва."]}, {"id": "1.26", "n": 16, "t": "single", "q": "Особливість дисидентського руху в Україні в 1970-1980-х рр. полягала в тому, що рух", "sec": "", "g": "", "opts": ["зосереджувався на захисті лише соціальних прав людини, залишаючи поза увагою проблеми захисту релігійних свобод.", "був орієнтований на розв’язання гострих економічних проблем, перебуваючи під контролем незалежних профспілок.", "не набув широкої підтримки серед населення через жорстокість репресивних заходів влади та апатію в суспільстві.", "не викликав занепокоєння партійного керівництва та спецслужб, оскільки влада не вбачала в ньому загрози існуючому режиму."]}, {"id": "1.30", "n": 17, "t": "single", "q": "Із якою подією пов'язані діячі, зображені на фото?", "sec": "", "g": "", "img": ["q_c5ca175c71"], "opts": ["заснуванням Української робітничо-селянської спілки", "акцією протесту в кінотеатрі «Україна» проти арештів дисидентів", "створенням Української Гельсінської групи", "повстанням політичних в'язнів у Норільському концтаборі"]}, {"id": "1.34", "n": 18, "t": "single", "q": "«…[організація] ставить за мету: 1) Сприяти ознайомленню широких кіл української громадськості з Декларацією Прав Людини. 2) …активно сприяти виконанню гуманітарних статей Заключного Акта Наради з питань безпеки i співпраці в Європі. 3) Домагатися, щоб на всіх міжнародних нарадах… Україна як суверенна європейська держава i член ООН була представлена окремою делегацією. 4) З метою вільного обміну інформацією та ідеями домагатися акредитування на Україні представників зарубіжної преси…» Яка організація ставила перед собою таку мету?", "sec": "", "g": "", "opts": ["Українська Гельсінська група", "Українська робітничо-селянська спілка", "Український національний фронт", "Українська головна визвольна рада"]}, {"id": "1.38", "n": 19, "t": "single", "q": "Факти з життя якого українського суспільно-політичного діяча подано нижче? «Юрист, правозахисник, один із засновників Української робітничо-селянської спілки. Арештований за «антирадянську агітацію та пропаганду» й засуджений до страти, згодом заміненої п’ятнадцятирічним ув’язненням. Автор книги «Сповідь у камері смертників». Нагороджений медаллю імені Святого Володимира «Борцям за волю України». Герой України.", "sec": "", "g": "", "opts": ["Л. Лук’яненка", "І. Дзюби", "В. Чорновола", "Є. Сверстюка"]}, {"id": "1.42", "n": 20, "t": "single", "q": "Про кого з громадських діячів ідеться у спогадах сучасника: «...за своїм покликанням і з ласки Божої – поет. Він поет не тільки непересічний, а рідкісний своїм талантом і культурою. Доля призначила йому в житті ще й роль політв'язня...»?", "sec": "", "g": "", "opts": ["С. Параджанова", "П. Загребельного", "В. Стуса", "В. Чорновола"]}, {"id": "2.18", "n": 21, "t": "single", "q": "У яких твердженнях ідеться про Василя Стуса? 1. Був заарештований за гострі публіцистичні публікації й відкриті виступи на захист української інтелігенції й, зокрема, за безпрецедентну працю «Інтернаціоналізм чи русифікація?». 2. Його арешт у січні 1972 р. й засудження спричинені літературною діяльністю, зверненнями до вищих партійних інстанцій з протестом проти порушень прав людини. 3. Був членом-засновником Української Громадської Групи сприяння виконанню Гельсінських угод, засуджений за антирадянську агітацію та пропаганду. 4. Організатор, редактор і видавець підпільного журналу «Український вісник», у якому друкував матеріали самвидаву, хроніку українського національного спротиву. 5. Помер у карцері в таборі для політв’язнів уночі 4 вересня 1985 р., відбуваючи друге ув’язнення.", "sec": "", "g": "", "opts": ["1, 2", "2, 3", "2, 5", "4, 5"]}, {"id": "2.17", "n": 22, "t": "single", "q": "Укажіть рядок з іменами дисидентів, яких було ув’язнено 1972-1973 рр. під час другої хвилі арештів.", "sec": "", "g": "", "opts": ["Іван Світличний, В’ячеслав Чорновіл, Валерій Марченко", "Микола Руденко, Олекса Тихий, Іван Кандиба", "Степан Хмара, Михайло Горинь, Левко Лук’яненко", "Левко Лук’яненко, Іван Кандиба, Степан Вірун"]}, {"id": "2.21", "n": 23, "t": "single", "q": "У яких твердженнях ідеться про В’ячеслава Чорновола? 1. Відбув 15-річне ув’язнення за головування в Українській робітничо-селянській спілці (УРСС). 2. Редактор «самвидавського» журналу «Український вісник». 3. Засуджений до 14 років таборів та заслання за написання творів «Мойсей», «Хроніка опору», «Репортаж із заповідника ім. Берії». 4. Відіграв важливу роль у розбудові незалежної України, лідер «Народного руху» (1992-1999 рр.). 5. За «антирадянську агітацію і пропаганду» вкотре був ув’язнений у 1980 р.; в’язні називали його «Табірним генералом».", "sec": "", "g": "", "opts": ["1, 3", "2, 3", "1, 4, 5", "2, 4, 5"]}, {"id": "1.39", "n": 24, "t": "single", "q": "Особливість розвитку освіти України середини 1960 – початку 1980-х рр. – це", "sec": "", "g": "", "opts": ["поява навчальних закладів нового типу – гімназій, ліцеїв, колегіумів.", "переорієнтація профтехосвіти на підготовку фахівців сфери обслуговування, бізнесу.", "завершення переходу до обов’язкової загальної середньої освіти.", "збільшення кількості шкіл з українською мовою викладання."]}, {"id": "1.43", "n": 25, "t": "single", "q": "«Цей славнозвісний і водночас “багатостраждальний” твір мало не скинув з п’єдесталу вже визнаного класика соціалістичного реалізму. Центральний образ роману – пам’ятка козацької минувшини… Основна увага в ньому приділена викриттю негативних явищ радянської дійсності, таких як бюрократія, кар’єризм, безправ’я селян, чиновницьке недбальство, зневажливе ставлення до довкілля й пам’яток історії та культури...» Хто є автором твору, про який ідеться в уривку з документа?", "sec": "", "g": "", "opts": ["О. Гончар", "В. Стус", "О. Довженко", "В. Чорновіл"]}, {"id": "1.44", "n": 26, "t": "single", "q": "«Цей славнозвісний і водночас “багатостраждальний” твір мало не скинув з п’єдесталу вже визнаного класика соціалістичного реалізму. Центральний образ роману – пам’ятка козацької минувшини… Основна увага в ньому приділена викриттю негативних явищ радянської дійсності, таких як бюрократія, кар’єризм, безправ’я селян, чиновницьке недбальство, зневажливе ставлення до довкілля й пам’яток історії та культури...» Укажіть фото, на якому зображено пам’ятку, що стала «центральним образом роману».", "sec": "", "g": "", "img": ["q_5fd373593b"], "opts": ["А", "Б", "В", "Г"]}, {"id": "1.46", "n": 27, "t": "single", "q": "На фото зображено", "sec": "", "g": "", "img": ["q_f3de2aec60"], "opts": ["Є. Сверстюка, філософа, письменника, дисидента, автора збірки «Блудні сини України».", "С. Параджанова, кінорежисера, автора фільмів «Тіні забутих предків», «Колір гранату».", "В. Стуса, поета, автора збірок «Круговерть», «Зимові дерева»; члена Української Гельсінської групи.", "М. Руденка, письменника, автора збірки поезій «Всесвіт у тобі»; керівника Української Гельсінської групи."]}, {"id": "2.15", "n": 28, "t": "single", "q": "Яке поняття є зайвим в логічному ланцюжку: «Українська робітничо-селянська спілка – \"Український вісник\" – Конституція розвиненого соціалізму – Українська гельсінська група»?", "sec": "", "g": "", "opts": ["\"Український вісник\"", "Українська гельсінська група", "Конституція розвиненого соціалізму", "Українська робітничо-селянська спілка"]}, {"id": "2.34", "n": 29, "t": "match", "q": "Установіть відповідність між подією (явищем) і діячем.", "sec": "", "g": "", "opts": ["М. Джемілєв", "О. Гончар", "В. Чорновіл", "М. Руденко", "І. Миколайчук"], "left": ["Утворення Української Гельсінської групи", "Вихід журналу «Український вісник»", "Боротьба за права кримсько-татарського народу", "Формування українського поетичного кіно"]}, {"id": "2.35", "n": 30, "t": "match", "q": "Установіть відповідність між подією та роком.", "sec": "", "g": "", "opts": ["1965 р.", "1970 р.", "1972 р.", "1976 р.", "1978 р."], "left": ["обрання на посаду першого секретаря ЦК КПУ В. Щербицького", "перша хвиля арештів дисидентів в Українській РСР", "утворення Української Гельсінської групи", "поява першого випуску «самвидавчого» журналу «Український вісник»"]}, {"id": "2.38", "n": 31, "t": "match", "q": "Установіть відповідність між уривком (1–4) та діячем (А – Д), якого він стосується.", "sec": "", "g": "", "opts": ["В. Чорновіл", "Л. Лук'яненко", "А. Горська", "І. Дзюба", "Т. Яблонська"], "left": ["Чернігівський обласний суд у м. Городні (де жив брат Віктор, а Хрипівка з батьками лишень за два кілометри) визнав мене за особливо небезпечного рецидивіста і засудив до десяти років ув'язнення та п'яти років заслання. 20.10.1978 року мене привезли до тої ж самої Сосновки Мордовської АРСР, в якій 17 років тому почав був своє в'язенське життя. Тільки тоді була то велика зона, а тепер через дорогу від неї маленька в'язниця", "От і радіємо з денаціоналізації народів, з «успіхів» русифікації, із того, що, мовляв, понад десять мільйонів неросіян у Союзі, за останнім переписом, назвали «рідною» російську мову і зреклися своєї мови. І ставимо це в заслугу «великому и могучему русскому языку», забуваючи, що тургенєвський гімн рідній мові породжений прямо протилежним настроєм, що Тургенєв нікого не хотів русифікувати", "\"Ідея створення Руху виникла спонтанно, вона йшла знизу. Прийшов час \"розвалу імперії\", так званої перебудови. Він закликав низи до дії, а серед інтелігенції, колишніх політв'язнів, політичних діячів виявилися люди, які вирішили очолити цей рух. Я пригадую, як у вересні ми вивели на вулиці Львова 200-250 тис. осіб. Це була природна потреба різко змінити ситуацію, яка на цей момент склалася в країні: ішло розвалювання комуністичної системи, дуже активізувалися народні маси, і це треба було оформити\".", "Належачи до групи \"шістдесятників\", брала активну участь в українському правозахисному русі. Брала участь у акціях протесту проти розправ над українськими правозахисниками. Певним захистом було те, що вона у групі митців виконувала монументальні художні роботи у Донецьку та Краснодоні, які вважались важливими та мали ідеологічний ухил. Зокрема, панно у меморіальному комплексі \"Молода гвардія\"."]}, {"id": "2.40", "n": 32, "t": "match", "q": "Установіть відповідність між візуальним джерелом (1–4) і поняттям (А – Д).", "sec": "", "g": "", "img": ["q_61087a5c09"], "opts": ["самвидав", "тамвидав", "дефіцит", "номенклатура", "хрущовка"], "left": ["Зображення 1", "Зображення 2", "Зображення 3", "Зображення 4"]}, {"id": "S1", "n": 33, "t": "seq", "q": "Установіть послідовність подій.", "sec": "", "g": "", "opts": ["Початок господарської реформи О. Косигіна", "Введення радянських військ до Афганістану", "Ухвалення Конституції СРСР «розвиненого соціалізму»", "Усунення М. Хрущова з посади першого секретаря ЦК КПРС"]}, {"id": "S5", "n": 34, "t": "seq", "q": "Установіть послідовність подій в економічному житті УРСР.", "sec": "", "g": "", "opts": ["Початок будівництва Чорнобильської АЕС", "Ліквідація раднаргоспів і відновлення галузевих міністерств", "Ухвалення Продовольчої програми СРСР", "Ухвалення Конституції УРСР «розвиненого соціалізму»"]}, {"id": "S4", "n": 35, "t": "seq", "q": "Установіть послідовність подій культурного життя України.", "sec": "", "g": "", "opts": ["Вихід друком роману О. Гончара «Собор»", "Загибель композитора В. Івасюка", "Прем’єра фільму С. Параджанова «Тіні забутих предків»", "Вихід на екрани музичного фільму «Червона рута» з піснями В. Івасюка"]}, {"id": "2.32", "n": 36, "t": "seq", "q": "Розгляньте зображення. Установіть хронологічну послідовність подій і явищ, які вони ілюструють.", "sec": "", "g": "", "img": ["q_e4f06a6982"], "opts": ["Зображення А", "Зображення Б", "Зображення В", "Зображення Г"]}, {"id": "2.24", "n": 37, "t": "three", "q": "Укажіть особливості суспільних відносин у другій половині 1960-х – середині 1980-х рр.", "sec": "", "g": "", "opts": ["високі темпи зростання кількості жителів міст", "спад зростання кількості інтелігенції", "зменшення народжуваності", "збільшення народжуваності серед населення села", "зміни в етнічному складі населення і зменшення частки українців", "зменшення кількісного складу номенклатурно-бюрократичного апарату", "зменшення частки росіян в загальній структурі населення"]}, {"id": "2.26", "n": 38, "t": "three", "q": "Які з наведених явищ є характерними для СРСР в період загострення кризи радянської системи?", "sec": "", "g": "", "opts": ["До кінця четвертої п'ятирічки питома вага вироблених в Україні найважливіших видів продукції промисловості в загальносоюзному обсязі становила: чавуну – 47,8%, сталі – 30,6%, прокату – 33,2%, залізної руди – 53%. Республіка знову стала однією з провідних індустріальних країн Європи. Водночас значно відстає легка промисловість (79%) і сільське господарство (91 %).", "привілейована правляча верства, еліта або \"політичний клас\", відносно закрита соціальна каста \"соціалістичного\" суспільства – в країнах, що еволюційно знаходяться на перехідному етапі від традиційного до індустріального суспільства, коли відсутнє громадянське суспільство та нерозвинена політична традиція та культура.", "Найчастіше хабар вимагали при перевірці підприємств податковою службою, пожежною службою та під час операцій з ПДВ. Крім цього, опитувані скаржилися на примус до дачі хабара чи оплату без квитанції зайвих послуг під час взаємодії не лише з податковою, але й з міністерством внутрішніх справ.", "політичний термін, що позначає політику максимальної відкритості у діяльності державних установ і свободи інформації, у вузькому сенсі – основний компонент політики перебудови, що полягав в істотному ослабленні цензури і знятті існуючих у радянському суспільстві численних інформаційних бар'єрів.", "Основний закон СРСР на юридичному рівні закріплював однопартійну політичну систему, охарактеризував чинний етап розвитку радянського суспільства як закономірний етап на шляху до комунізму", "сукупність дій та умов, спрямованих на зміцнення російської національно-політичної переваги в країнах, що входять до складу Росії, чи перебувають в сфері її впливу, за допомогою переходу чи переведення осіб неросійської національності на російську мову й російську культуру та їхньої подальшої асиміляції.", "економіка, організована на основі саморегуляції, при якій координація дій учасників здійснюється державою, а саме законодавчою та судовою владою безпосередньо, а виконавчою тільки опосередковано, шляхом запровадження різних податків, зборів, пільг тощо; тільки рішення самих покупців, постачальників товарів і послуг визначають структуру розподілу."]}, {"id": "2.28", "n": 39, "t": "three", "q": "Що було характерним для соціальних процесів та рівня життя населення України від середини 1960-х – початку 1980-х рр.", "sec": "", "g": "", "opts": ["ефективне, раціональне використання людських ресурсів та інтелектуального потенціалу", "хронічний дефіцит на споживчому ринку різноманітних товарів", "зближення оплати праці робітників та інженерно-технічних працівників", "динаміка вікового складу змінювалася за лінією омолодження населення України", "міграційні процеси, основний напрямок яких – переселення із сіл у міста", "подолано відставання від країн Заходу за рівнем споживання на душу населення", "відсутність системи соціального забезпечення (пенсії, інвалідність) колгоспників"]}, {"id": "N3b", "n": 40, "t": "three", "q": "Що характеризує період, коли Компартію України очолював В. Щербицький (1972–1989 рр.)?", "sec": "", "g": "", "opts": ["ліквідація галузевих міністерств і створення раднаргоспів", "беззастережне виконання вказівок союзного центру", "запровадження багатопартійності й скасування цензури", "обстоювання перед Москвою розширення господарських прав республіки", "посилення русифікації в освіті, науці та видавничій справі", "децентралізація управління промисловістю й передання заводів республіці", "ідеологічні «чистки» в науці й культурі, які проводив секретар ЦК КПУ з ідеології В. Маланчук"]}], "pass_pct": 75, "minutes": 60}, "t2": {"name": "Тест 2 · контрольний", "tasks": [{"id": "2.2", "n": 1, "t": "single", "q": "У яких твердженнях ідеться про Петра Шелеста? 1. Був нагороджений чотирма зірками Героя Радянського Союзу та Героя Соціалістичної праці, а також сімома орденами Леніна. 2. Став першим секретарем ЦК Компартії України в 1972 р. 3. Сприяв деякою мірою українізації закладів освіти, радіо і телебачення республіки. 4. Наприкінці кар’єри розкритикований на політбюро ЦК КПРС за «недоліки у справі інтернаціонального виховання трудящих і примиренське ставлення до проявів націоналізму». 5. Автор книги «Інтернаціоналізм чи русифікація».", "sec": "", "g": "", "opts": ["1, 3", "2, 4", "3, 4", "3, 5"]}, {"id": "2.1", "n": 2, "t": "single", "q": "Наведене фото може слугувати для ілюстрації СРСР в", "sec": "", "g": "", "img": ["q_4bc01b050e"], "opts": ["1945-1953 рр.", "1953-1964 рр.", "1965-1982 рр.", "1985-1991 рр."]}, {"id": "NEW_SHCH", "n": 3, "t": "single", "q": "Прочитайте характеристику діяча та вкажіть його прізвище. «Очолював Компартію України сімнадцять років — довше за будь-кого з попередників. Публічно виступав лише російською, беззастережно підтримував курс Москви на «злиття націй», а відстоювання економічних інтересів республіки вважав проявом «місництва». Залишався на чолі республіканської парторганізації й у перші роки «перебудови»».", "sec": "", "g": "", "opts": ["М. Підгорний", "П. Шелест", "В. Щербицький", "О. Кириченко"]}, {"id": "2.10", "n": 4, "t": "single", "q": "Які явища були характерні для суспільного розвитку України в 1970 – на початку 1980-х років? 1. Домінування подвійної моралі, що виправдовувала незаконні способи задоволення особистих потреб. 2. Різке наростання товарного дефіциту, продовження урбанізаційних процесів 3. Різке прискорення темпів зростання реальних доходів населення.", "sec": "", "g": "", "opts": ["1, 3", "1, 2", "2, 3", "1, 2, 3"]}, {"id": "1.5", "n": 5, "t": "single", "q": "Ліквідація раднаргоспів у другій половині 1960-х рр. призвела до", "sec": "", "g": "", "opts": ["ліквідації директивного планування.", "утворення вільних економічних зон.", "розширення господарських прав республік.", "посилення централізованості планування."]}, {"id": "1.6", "n": 6, "t": "single", "q": "Прочитайте уривок із книги М. Горбачова «Життя і реформи» та виконайте завдання. «Реформа була для свого часу досить сміливою, перш за все в плані розширення самостійності підприємств і товарно-грошових відносин між ними. Добре пам’ятаю, яке пожвавлення вона викликала в суспільстві, які породила надії, надавши позитивний вплив на розвиток економіки у восьмій п’ятирічці, мабуть, найбільш успішній у післявоєнні роки». Описана реформа проводилася під керівництвом", "sec": "", "g": "", "opts": ["М. Хрущова.", "О. Косигіна.", "М. Підгорного.", "П. Шелеста."]}, {"id": "1.8", "n": 7, "t": "single", "q": "Стан народного господарства УРСР у 1970-1980-х рр. характеризувався", "sec": "", "g": "", "opts": ["стрімким зростанням обсягів сільськогосподарського виробництва.", "пріоритетним розвитком підприємств легкої та харчової промисловості.", "переходом до інтенсивних методів господарювання.", "падінням темпів промислового виробництва."]}, {"id": "1.10", "n": 8, "t": "single", "q": "Що було однією з особливостей економічного розвитку УРСР в 1970 – на початку 1980-х рр.?", "sec": "", "g": "", "opts": ["прогресуючий занепад у рамках загальносоюзної економіки", "зниження матеріало- та енергомісткості виробництва", "посилення процесів децентралізації управління промисловістю", "зростання конкурентоспроможності продукції"]}, {"id": "2.5", "n": 9, "t": "single", "q": "Укажіть особливості економічного розвитку УРСР у 70-х – на початку 80-х рр. ХХ ст. 1. Збереження ролі однієї з найважливіших паливно-енергетичних, металургійних та машинобудівних баз країни 2. Істотне зменшення капіталовкладень у сільське господарство республіки 3. Поліпшення умов праці в колгоспах, культурно-побутового обслуговування селян, стимулювання продуктивності праці 4. Інтенсифікація сільськогосподарського виробництва дала змогу експортувати зернові до Канади та США 5. Нарощування виробництва забезпечувалося залученням додаткових обсягів сировини, робочої сили, створенням поряд з існуючими нових потужностей 6. Продовження орієнтації важкої промисловості на першочергове обслуговування підприємств ВПК", "sec": "", "g": "", "opts": ["1, 3, 4", "2, 4, 6", "3, 4, 5", "1, 5, 6"]}, {"id": "2.7", "n": 10, "t": "single", "q": "Укажіть характерні риси соціально-економічної ситуації в УРСР у 70-х – першій половині 80-х рр. 20 ст. 1. Активне залучення іноземних інвестицій у підприємства ВПК 2. Впровадження досягнень НТР, зокрема мікропроцесорних технологій, у виробництво товарів народного споживання 3. Нестача окремих видів продовольства та дефіцит товарів повсякденного попиту 4. Мілітаризація промисловості 5. Швидке зростання реальних доходів населення", "sec": "", "g": "", "opts": ["1, 2", "1, 4", "3, 4", "4, 5"]}, {"id": "2.8", "n": 11, "t": "single", "q": "Встановіть, яке визначення найкраще описує наведену фотографію", "sec": "", "g": "", "img": ["q_69953c5a05"], "opts": ["надмірне, проти потреб товарообігу, збільшення кількості паперових грошей з наступним їх швидким знеціненням, яке проявляється зростанням загального рівня цін та зниженням купівельної спроможності грошей.", "радянське ідеологічне поняття, яке було вигадано та запроваджено з метою прикрити провал історичної програмної цілі монопольно правлячої в СРСР КПРС – «побудови матеріально-технічної бази комунізму в СРСР».", "в державному праві прийняття електоратом (виборцями) рішення з конституційних, законодавчих чи інших внутрішньо- чи зовнішньополітичних питань.", "Перевищення попиту над пропозицією; засвідчує про розбіжність між попитом та пропозицією та відсутність рівноважної ціни, є типовим явищем в умовах планової економіки"]}, {"id": "1.14", "n": 12, "t": "single", "q": "Яке явище радянської дійсності другої половини 1960-х – 1980-х рр. відображено на карикатурі?", "sec": "", "g": "", "img": ["q_0db68b5187"], "opts": ["бюрократизацію", "дефіцит", "корупцію", "плюралізм"]}, {"id": "1.16", "n": 13, "t": "single", "q": "На якій проблемі радянської дійсності 1970-1980-х рр. акцентує увагу зображена карикатура? Напис на карикатурі: «Сьогодні у нашому тресті розшукуються: [підписи під фотографіями] пішла до хімчистки; пішов на об'єкт; відійшов покурити; пішла до іншого відділу».", "sec": "", "g": "", "img": ["q_813b53595a"], "opts": ["розгулі організованої злочинності", "посиленні репресій проти інакомислячих", "низькому рівні трудової дисципліни", "зростанні безробіття"]}, {"id": "1.20", "n": 14, "t": "single", "q": "\"Спеціальне обслуговування в медичних установах, можливості для відпочинку на державних дачах і всесоюзних курортах, забезпечення дефіцитними товарами, окремі санаторії та будинки відпочинку\", – привілеї, властиві в радянській Україні", "sec": "", "g": "", "opts": ["непманам.", "\"шістдесятникам\".", "номенклатурі.", "дисидентам."]}, {"id": "1.21", "n": 15, "t": "single", "q": "Обов'язковість носіння дітьми та молоддю УРСР зображених значків свідчить про", "sec": "", "g": "", "img": ["q_23b13fc308"], "opts": ["ідеологізацію суспільного життя.", "рівні фізичної підготовки.", "етапи формування нової соціальної групи.", "заходи естетичного виховання."]}, {"id": "1.25", "n": 16, "t": "single", "q": "Прочитайте уривок з інтерв’ю колишнього голови КДБ УРСР М. Голушки: «У карних кодексах… було передбачено відповідальність за антирадянську агітацію та пропаганду, наклепи на існуючий лад (ст. 62, 187 КК УРСР), застосування яких асоціюється із переслідуванням за інакомислення». Відповідні статті Кримінального кодексу використовувалися владою для боротьби з", "sec": "", "g": "", "opts": ["дисидентством.", "номенклатурою.", "«лисенківщиною».", "багатопартійністю."]}, {"id": "1.27", "n": 17, "t": "single", "q": "Розгляньте фото палітурок видань і виконайте завдання. Ці візуальні джерела доречно використати для створення презентації", "sec": "", "g": "", "img": ["q_3a89d526ba"], "opts": ["«Ідеологізація культурного життя в Україні».", "«Українські письменники-шістдесятники».", "«Засоби масової інформації Радянської України».", "«Дисидентський рух в Україні»."]}, {"id": "1.32", "n": 18, "t": "single", "q": "Укажіть одну з ознак дисидентського руху в Україні в другій половині 1960 – першій половині 1980-х рр.?", "sec": "", "g": "", "opts": ["координація масових антиурядових акцій з московськими групами", "поширення руху лише в західних областях України", "мирний, ненасильницький характер боротьби", "домінування релігійної течії, її підтримка православною церквою"]}, {"id": "1.28", "n": 19, "t": "single", "q": "Що стало наслідком підписання СРСР угоди, уривок з якої процитовано: «...Держави-учасниці поважатимуть права людини та основні свободи, включаючи свободу думки, совісті, релігії та переконань, для всіх, незалежно від раси, статі, мови та релігії...»?", "sec": "", "g": "", "opts": ["початок «косигінської реформи»", "створення Української Гельсінської групи", "зародження Народного руху України", "завершення «хрущовської відлиги»"]}, {"id": "1.29", "n": 20, "t": "single", "q": "Прочитайте уривок зі спогадів режисера Ю. Іллєнка та дайте відповідь на запитання. «Увечері 4 вересня 1965 року у кінотеатрі «Україна» зібралася вся еліта Києва. Фільм був розкручений... тому його й використали організатори акції протесту. ...Із зали піднімається _____ з букетом. Говорить теплі слова, вручає квіти, раптом повертається і звертається до зали: «Почалися арешти, повторюється 37-й рік...» ...Вскакує _____ і кричить українською крізь гул запущеної чекістами сирени: «Хто проти тиранії – встаньте!» Прізвища яких громадських діячів пропущено в уривку?", "sec": "", "g": "", "opts": ["Л. Лук’яненко, В. Чорновіл", "В. Чорновіл, М. Руденко", "І. Дзюба, В. Стус", "В. Стус, Л. Лук’яненко"]}, {"id": "1.36", "n": 21, "t": "single", "q": "«…[організація] ставить за мету: 1) Сприяти ознайомленню широких кіл української громадськості з Декларацією Прав Людини. 2) …активно сприяти виконанню гуманітарних статей Заключного Акта Наради з питань безпеки i співпраці в Європі. 3) Домагатися, щоб на всіх міжнародних нарадах… Україна як суверенна європейська держава i член ООН була представлена окремою делегацією…» Хто з діячів, зображених на фото, був членом цієї організації?", "sec": "", "g": "", "img": ["q_dc3b503ad1"], "opts": ["А", "Б", "В", "Г"]}, {"id": "2.19", "n": 22, "t": "single", "q": "Укажіть портрет правозахисника, засновника Української робітничо-селянської спілки, автора книги «Сповідь у камері смертників».", "sec": "", "g": "", "img": ["q_9877b815a5"], "opts": ["А", "Б", "В", "Г"]}, {"id": "2.20", "n": 23, "t": "single", "q": "Якому з наведених на фото історичних діячів належить така характеристика: «Український поет, правозахисник, член Української Гельсінської групи. Засуджений за «антирадянську агітацію і пропаганду», помер у таборі для політв’язнів. Автор поетичної збірки «Дорога болю», лауреат Державної премії ім. Т. Шевченка (посмертно)».", "sec": "", "g": "", "img": ["q_7b2a453102"], "opts": ["А", "Б", "В", "Г"]}, {"id": "1.40", "n": 24, "t": "single", "q": "Проголошення керівництвом СРСР курсу на «зближення та злиття націй у “нову історичну спільноту – радянський народ”...» призвело до", "sec": "", "g": "", "opts": ["посилення процесу русифікації та скорочення сфери вживання української мови.", "зростання в суспільстві інтересу до надбань української культури.", "скасування цензури на літературні твори мовами національних меншин.", "збільшення в школах кількості навчальних годин з історії України."]}, {"id": "2.12", "n": 25, "t": "single", "q": "Хто з наведених шістдесятників в подальшому пов'язав свою діяльність з дисидентським рухом? 1. Дмитро Павличко 2. Валентин Мороз 3. Ліна Костенко 4. Василь Стус 5. Іван Світличний 6. Іван Драч", "sec": "", "g": "", "opts": ["1, 2, 3", "2, 4, 5", "3, 4, 6", "1, 3, 6"]}, {"id": "2.22", "n": 26, "t": "single", "q": "Якого твору О. Гончара стосуються цитовані нижче звинувачення? «...товариш Гончар, зрілий майстер художнього слова, автор відомих творів «Прапороносці», «Людина і зброя», в своєму новому романі... як в кривому дзеркалі змалював працю, побут та духовний світ металургів і колгоспників Подніпров’я, провівши ворожий водорозділ між керівниками та масами».", "sec": "", "g": "", "opts": ["«Берег любові»", "«Тронка»", "«Собор»", "«Таврія»"]}, {"id": "2.4", "n": 27, "t": "single", "q": "У яких уривках ідеться про особливості економічного розвитку УРСР у 70-х – на початку 80-х рр. ХХ ст.? 1. «Так, у межиріччі Дніпра, Десни та Прип'яті було споруджено Чорнобильську АЕС. В цілому, в УРСР було розміщено 40% атомних потужностей країни». 2. «На території України було створено 11 економічних адміністративних районів, а в межах всього СРСР – 102 3. Одночасно ліквідувалося 10 союзних і 15 союзно-республіканських міністерств. Зокрема, в Україні було ліквідовано 11 промислових і будівельних міністерств, а два міністерства перетворені з союзно-республіканських на республіканські».", "sec": "", "g": "", "opts": ["1, 2, 3", "1", "2", "3"]}, {"id": "2.23", "n": 28, "t": "single", "q": "Яка риса притаманна розвитку української культури в середині 1960 — на початку 1980-х рр.?", "sec": "", "g": "", "opts": ["розширення сфери вживання української мови", "розквіт нових жанрів літератури та мистецтва", "духовне розкріпачення письменників і митців", "панування методу соціалістичного реалізму"]}, {"id": "2.36", "n": 29, "t": "match", "q": "Установіть відповідність між роком (1–4) та уривком джерела (А – Д), що стосується подій цього року.", "sec": "", "g": "", "opts": ["Про призначеного на посаду першого секретаря ЦК КПУ можна було сказати, що він був виразником москвофільства, можна так сказати. Він вважав, що в Україні потрібно проводити курс Москви. Він ніколи не виступав із критикою, не наголошував на тому, що слід виборювати для України паритетні умови постачання з союзної скарбниці товарів, ресурсів і так далі.", "І я почав діяти. Спочатку сам. А у вересні Микола Руденко запропонував створити українську правозахисну організацію.. Я пристав на пропозицію, побачивши в ній сміливий і політичне вельми прозорливий крок…. Таким чином, усього нас стало 10 осіб: Бердник, Григоренко, Кандиба, я, Матусевич, Маринович, Мешко, Руденко, Строката, Тихий.", "Перед новим радянським керівництвом для подолання кризового стану економіки було два можливих шляхи: радикальні реформи (тобто такі, що стосуються основ соціалістичного ладу, його характерних принципів) та часткові реформи (які не стосувалися основ соціалістичного ладу і спрямовувалися на пом'якшення економічної кризи, але не були здатні подолати її в цілому). В підсумку радянське керівництво обрало другий шлях, що в підсумку і визначило їхній крах.", "Установлено, що з 139 членів та кандидатів у члени Центрального Комітету партії, обраних на XVII з'їзді партії, було заарештовано та розстріляно (головним чином у 1937-1938 рр.) 98 чоловік, тобто 70 відсотків. Це відбулося внаслідок зловживань владою з боку Сталіна, який почав застосовувати масовий терор проти кадрів партії.", "В новоствореній організації об'єдналися люди різних політичних переконань – від ліберальних комуністів до тих, хто сповідував ідеї інтегрального націоналізму. Але домінували в ній настрої національної демократії. Опівдні в будинку культури Київського політехнічного інституту відкрилися Установчі збори Народного Руху України за перебудову."], "left": ["1956 рік", "1965 рік", "1972 рік", "1976 рік"]}, {"id": "2.37", "n": 30, "t": "match", "q": "Установіть відповідність між афішею фільму чи нотами пісні (1–4) та митцем (А – Д), чиє ім’я з ними пов’язане.", "sec": "", "g": "", "img": ["q_209461a674"], "opts": ["І. Миколай const COURSE_API = "https://script.google.com/macros/s/AKfycby3DMmeIAWr-c2QOMcjTxfcIMSboKj_o34F9ujiw5DmC69fDWWMmt4AKW-o6x52E6u8/exec";

   Дані: LESSONS (масив частин), IMGS (ключ → {src,w,h}), MODE ('all' | 'one'), NEXT_FILE (для окремого файлу). */
const TITLE = typeof COURSE_TITLE === 'string' ? COURSE_TITLE : 'Стародавня історія України';
const PFX = typeof STORE_PREFIX === 'string' ? STORE_PREFIX : 'mob_';

  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} }
};
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const BRAND = typeof COURSE_BRAND === 'string' ? COURSE_BRAND : '';
const brandHtml = () => BRAND ? `<p class="brand">${esc(BRAND)}</p>` : '';
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b class="a">$1</b>').replace(/__(.+?)__/g, '<b class="a2">$1</b>');
const paras = ps => `<div class="txt">${(ps || []).map(p => `<p>${md(p)}</p>`).join('')}</div>`;

function im(key) { return IMGS[key]; }
function fig(ref, boxed) {
  if (!ref || !im(ref.key)) return '';
  const i = im(ref.key), cap = ref.cap || '';
  return `<figure class="fig"><div class="pic${boxed ? ' boxed' : ''}" data-src="${i.src}" data-cap="${esc(cap)}">
    <img src="${i.src}" width="${i.w}" height="${i.h}" alt="${esc(cap)}" loading="lazy"><span class="zoom-hint">⤢</span></div>
    ${cap ? `<figcaption class="cap">${capHtml(cap)}</figcaption>` : ''}</figure>`;
}
function chips(b) {
  if (!b || !b.length) return '';
  return `<div class="chips">${b.map(x => `<span class="chip${/поза програмою/i.test(x) ? ' off' : /документ/i.test(x) ? ' doc' : ''}">${esc(x)}</span>`).join('')}</div>`;
}
const h2 = t => t ? `<h2>${md(t)}</h2>` : '';
/* підпис: опис — звичайним шрифтом, автор і ліцензія — дрібно, щоб не відволікали від зображення */
const CREDIT = /((?:^|[.;,]\s+|\s)(?:Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення)[^:]{0,25}:.*|(?:^|[.;,]\s+)(?:Суспільне надбання|Public domain|Wikimedia Commons|CC BY|CC0).*|\s*\((?:фото|малюнок)[^)]*\)\s*)$/i;
function capHtml(cap) {
  if (!cap) return '';
  const m = String(cap).match(CREDIT);
  if (!m || m.index === 0 && !/^\s*(Фото|Малюнок|Ілюстрація|Карта|Мапа|Джерело|Автор|Зображення|Суспільне|Public|Wikimedia|CC)/i.test(cap)) return md(cap);
  const head = cap.slice(0, m.index).replace(/[.;,\s]+$/, ''), tail = m[0].replace(/^[.;,\s]+/, '');
  return `${head ? md(head) + (/[.!?…»]$/.test(head) ? '' : '.') + ' ' : ''}<span class="cr">${esc(tail)}</span>`;
}

const PERIODS_DEFAULT = null;

  text(c) {

  carousel(c, id) {

    return `${chips(c.badges)}${h2(c.title)}<div class="car" id="car${id}">${its}</div>
      ${c.items.length > 1 ? `<div class="dots" id="dots${id}">${c.items.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><div class="swipe">гортайте вбік →</div>` : ''}
      ${c.note ? `<div class="tip"><p>${md(c.note)}</p></div>` : ''}${c.credits ? `<div class="cap"><span class="cr">Фото: ${esc(c.credits)}</span></div>` : ''}`;
  },
  defs(c) {
    return `${chips(c.badges)}${h2(c.title)}<div class="defs">${c.items.map(it => `<div class="def"><h3>${md(it.name)}</h3>${paras(it.paras)}${it.img ? fig(it.img) : ''}</div>`).join('')}</div>
      ${c.note ? `<div class="tip"><p>${md(c.note)}</p></div>` : ''}`;
  },
  map(c, id) {

    const btns = st.length > 1 ? `<div class="steps" id="st${id}" style="grid-template-columns:repeat(${st.length},1fr)">${st.map((x, i) =>
      `<button class="${i === 0 ? 'on' : ''}" data-i="${i}">${esc(x.label)}</button>`).join('')}</div>` : '';
    return `<div class="chips"><span class="chip">Карта</span></div>${h2(c.title)}${btns}<div id="mp${id}">${fig({ key: st[0].key, cap: c.cap || '' })}</div>
      <div class="rot">Натисніть на карту, щоб збільшити. Зручніше дивитися, повернувши телефон горизонтально.</div>`;
  },
  monument(c) { return `${chips(c.badges)}${h2(c.title)}${fig(c.img)}${paras(c.paras)}`; },
  doc(c) {
    return `<div class="chips"><span class="chip doc">Документ</span></div>${h2(c.title)}
      <div class="quote">${c.quote.map(q => `<p>${md(q)}</p>`).join('')}<div class="src">${esc(c.source)}</div></div>
      ${c.img ? fig(c.img) : ''}<div class="sub">${paras(c.comment)}</div>`;
  },
  cols(c) {
    return `${chips(c.badges)}${h2(c.title)}${c.intro ? `<p>${md(c.intro)}</p>` : ''}${c.blocks.map(b => `<div class="sub"><h3>${md(b.h)}</h3>${paras(b.paras)}</div>`).join('')}`;
  },
  table(c) {
    const head = c.rows[0];
    return `${h2(c.title)}${c.rows.slice(1).map(r => `<div class="trow"><h3>${md(r[0])}</h3>${r.slice(1).map((v, j) =>
      `<div class="kv"><span>${esc(head[j + 1])}</span><div>${md(v)}</div></div>`).join('')}</div>`).join('')}`;
  },
  tl_events(c) {
    return `<div class="chips"><span class="chip">НМТ: дата</span></div>${h2(c.title)}<div class="tlv">${c.items.map(e => `<div class="ev"><i style="background:${e.color}"></i>
      <span class="y${e.prog ? ' yprog' : ''}">${esc(e.year)}</span><b>${md(e.name)}</b><span>${md(e.desc)}</span></div>`).join('')}</div>
      <div class="legend"><span class="sw"></span>дата з програми НМТ</div>${c.note ? `<div class="muted"><p>${md(c.note)}</p></div>` : ''}`;
  },
  tl_periods(c) {
    const X = v => (100 * (v - c.x_from) / (c.x_to - c.x_from));
    const rows = c.rows.map(r => `<div class="row"><div class="nm">${md(r.name)}</div><div class="tr">${r.segs.map(g =>
      `<div class="sg" style="left:${X(g.a)}%;width:${Math.max(1.2, X(g.b) - X(g.a))}%;background:${g.color}"></div>`).join('')}</div>
      ${r.segs.some(g => g.sub) ? `<div class="sb">${r.segs.filter(g => g.sub).map(g => md(g.sub)).join(' · ')}</div>` : ''}</div>`).join('');
    const ev = c.events.map(([v, l]) => `<div class="evl" style="left:${X(v)}%"></div><div class="evt" style="left:${X(v)}%">${esc(String(l).replace(/ ?до н\.е\.| ?р\.$/g, ''))}</div>`).join('');
    const ax = `<div class="ax">${c.prog.map(([a, b]) => `<div class="pr" style="left:${X(a)}%;width:${X(b) - X(a)}%"></div>`).join('')}
      ${c.ticks.map(([v, l], i) => `<div class="tk${i % 2 ? ' lo' : ''}" style="left:${X(v)}%">${esc(l)}</div>`).join('')}</div>`;
    const pr = c.prog.length ? `<div class="legend"><span class="sw"></span>${c.prog.map(p => esc(p[2])).join(' · ')} — дата з програми НМТ</div>` : '';
    return `<div class="chips"><span class="chip">НМТ: дата</span></div>${h2(c.title)}<div class="gp">${ev}${rows}${ax}</div>${pr}
      ${c.note ? `<div class="muted"><p>${md(c.note)}</p></div>` : ''}`;
  },
  chrono() {
    const m = ['2000 р.<br>до н.е.', '1000 р.<br>до н.е.', '1 р. н.е.<br><b class="a2">Різдво Христове</b>', '1000 р.<br>н.е.', '2000 р.<br>н.е.'];
    return `<h2>Шкала часу</h2><div class="ends"><span>← давніше</span><span>ближче до нас →</span></div>
      <div class="scale"><div class="line"></div><div class="marks">${m.map(a => `<div class="m"><i></i><span>${a}</span></div>`).join('')}</div></div>
      <p class="cap">До н.е. рахунок іде назад: 2000 р. до н.е. давніше, ніж 1000 р. до н.е.</p>`;
  },
  periods(c) {
    const rows = c.rows.map((p, i) => `${i === 0 ? '<div class="pgroup">Кам’яний вік</div>' : i === 3 ? '<div class="pgroup">Доба металів</div>' : ''}
      <div class="per"><div class="c" style="background:${p[5]}"></div><div><h3>${p[0]}</h3>${p[1] ? `<div class="s">${p[1]}</div>` : ''}
       <div class="d">${p[2]}</div><div class="r"><span>Знаряддя:</span> ${p[3]}</div><div class="r"><span>Нове:</span> ${p[4]}</div></div></div>`).join('');
    return `${chips(c.badges)}${h2(c.title)}<p>${md(c.intro)}</p>${rows}`;
  },
  generic(c) {
    const groups = [[]];
    c.blocks.forEach(b => { if (b.k === 'sep') groups.push([]); else groups[groups.length - 1].push(b); });
    const g = groups.filter(x => x.length);
    const rb = b => b.k === 'h' ? `<h3 class="${b.light ? 'l' : ''}">${md(b.text)}</h3>` : b.k === 'date' ? `<span class="pill">${md(b.text)}</span>`
      : b.k === 'img' ? fig(b) : b.k === 'muted' ? `<div class="muted">${(b.paras || []).map(p => `<p>${md(p)}</p>`).join('')}</div>` : paras(b.paras);
    const body = g.map(x => {
      const asPanel = g.length > 1 && x.some(b => b.k === 'h' || b.k === 'date');
      return asPanel ? `<div class="sub">${x.map(rb).join('')}</div>` : x.map(rb).join('');
    }).join('');
    return `${chips(c.badges)}${h2(c.title)}${body}`;
  },
};

/* ---------- навігація ---------- */
const P = id => LESSONS.find(l => l.id === id);
function secProgress(L, s) { const seen = store.get(`seen_${L.id}-${s.id}`, []).length; return Math.min(seen, s.cards.length); }
function partProgress(L) { let a = 0, b = 0; L.sections.forEach(s => { a += secProgress(L, s); b += s.cards.length; }); return [a, b]; }

function index() {
  document.title = TITLE;
  const L0 = LESSONS[0];
  /* тема «лише уроки» в спільній оболонці: посилання назад на полицю тем (у повному курсі його додає course.js) */
  const back = typeof SHELL_URL === 'string' && SHELL_URL && typeof LESSONS_ONLY !== 'undefined' && LESSONS_ONLY ? SHELL_URL : '';
  app.innerHTML = `<div class="wrap">${back ? `<a class="lnk tback" href="${back}">← Усі теми</a>` : ''}
    <div class="hero"><img src="${im(L0.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L0.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(TITLE)}</h1>
      <div class="sub">Мобільна версія презентацій: ${PARTS_WORD}, кожна поділена на короткі розділи.</div></div>
    <div class="h2">Частини</div><div class="sec-list">${LESSONS.map(L => {
      const [a, b] = partProgress(L);
      return `<button class="part-btn" data-go="${L.id}"><span class="th"><img src="${im(L.cover.key).src}" alt=""></span>
        <span><h3>${esc(L.part)}</h3><div class="st">${a ? `Переглянуто ${a} з ${b} карток` : `${L.sections.length} розділів`}</div>
        <div class="prog-mini"><i style="width:${Math.round(100 * a / b)}%"></i></div></span></button>`; }).join('')}</div>
    <p class="cap" style="margin-top:18px">Прогрес зберігається лише на цьому пристрої.${back ? ' Бліци й тести з цієї теми з’являться згодом.' : ''}</p>${brandHtml()}</div>`;
  wireGo(); window.scrollTo(0, 0);
}

function partHome(L) {
  document.title = `${L.part} — ${TITLE}`;
  const i = LESSONS.indexOf(L), next = LESSONS[i + 1];
  const secs = L.sections.map(s => {
    const seen = secProgress(L, s), n = s.cards.length, done = seen >= n;
    return `<button class="sec-btn${done ? ' done' : ''}" data-go="${L.id}-${s.id}"><span class="num">${done ? '✓' : s.num}</span>
      <span><h3>${md(s.title)}</h3><div class="st">${seen ? `Переглянуто <b>${seen} з ${n}</b>` : `${n} карток`}</div>
      <div class="prog-mini"><i style="width:${Math.round(100 * seen / n)}%"></i></div></span></button>`;
  }).join('');
  const nextBtn = next ? `<button class="btn" data-go="${next.id}" style="margin-top:20px">Далі: ${esc(next.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:20px" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>
       <p class="cap">Посилання працює, якщо файли лежать в одній папці.</p>` : '');
  app.innerHTML = `${MODE === 'all' ? `<div class="bar"><div class="bar-in"><button class="back" data-go="home">← Усі частини</button><span class="ttl">Частина ${L.num}</span></div></div>` : ''}
  <div class="wrap">
    <div class="hero"><img src="${im(L.cover.key).src}" alt=""></div><div class="hero-cap">${capHtml(L.cover.cap)}</div>
    <div class="home-head"><div class="kick">Історія України · підготовка до НМТ</div><h1>${esc(L.title)}</h1>
      <div class="part">${esc(L.part)}</div><div class="sub">${esc(L.sub)}</div></div>
    <div class="h2">Розділи</div><div class="sec-list">${secs}</div>
    ${L.program ? `<div class="h2">Що треба знати для НМТ</div><section class="card">${R.generic({ ...L.program, title: '' })}</section>` : ''}
    ${nextBtn}
  </div>`;
  wireGo(); window.scrollTo(0, 0);
}

let obs = null;
function section(L, s) {
  document.title = `${s.num}. ${s.title} — ${TITLE}`;
  const k = L.sections.indexOf(s), next = L.sections[k + 1], nextPart = LESSONS[LESSONS.indexOf(L) + 1];
  const cards = s.cards.map((c, i) => `<section class="card" data-i="${i}">${(R[c.type] || R.generic)(c, i)}</section>`).join('');
  let end = next ? `<button class="btn" data-go="${L.id}-${next.id}">Далі: розділ ${next.num}. ${esc(next.title)} →</button>`
    : nextPart ? `<button class="btn" data-go="${nextPart.id}">Далі: ${esc(nextPart.part)} →</button>`
    : (MODE === 'one' && NEXT_FILE ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${NEXT_FILE[0]}">Далі: ${esc(NEXT_FILE[1])} →</a>` : '');
  app.innerHTML = `<div class="bar"><div class="bar-in"><button class="back" data-go="${L.id}">← Розділи</button><span class="ttl">${s.num}. ${md(s.title)}</span></div><div class="prog"><i id="pr"></i></div></div>
  <div class="wrap">
    ${s.cover && s.cover.key ? `<div class="hero">${fig(s.cover)}</div>` : ''}
    <div class="sec-head"><div class="kick">Частина ${L.num} · розділ ${s.num}</div><h1>${md(s.title)}</h1><div class="sub">${md(s.sub)}</div></div>
    <div class="cards">${cards}</div>
    <div class="end">${end}<button class="btn ghost" data-go="${L.id}">До розділів</button></div>
  </div>`;
  wireGo();
  s.cards.forEach((c, i) => {
    if (c.type === 'carousel' && c.items.length > 1) {
      const car = document.getElementById('car' + i), dots = document.getElementById('dots' + i).children;
      car.addEventListener('scroll', () => {
        const kk = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 12));
        [...dots].forEach((d, j) => d.classList.toggle('on', j === kk));
      }, { passive: true });
    }
    if (c.type === 'map' && c.steps.length > 1) {
      const st = document.getElementById('st' + i), mp = document.getElementById('mp' + i);
      st.querySelectorAll('button').forEach(b => b.onclick = () => {
        st.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
        mp.innerHTML = fig({ key: c.steps[+b.dataset.i].key, cap: c.cap || '' });
      });
    }
  });
  const key = `seen_${L.id}-${s.id}`, seen = new Set(store.get(key, []));
  if (obs) obs.disconnect();
  obs = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { seen.add(+e.target.dataset.i); store.set(key, [...seen]); } });
  }, { threshold: 0.35 }) : null;
  if (obs) app.querySelectorAll('.card').forEach(el => obs.observe(el));
  window.scrollTo(0, 0);
}
function wireGo() { app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; }); }


/* ---------- повноекранний режим ---------- */
const FS = {
  el: document.documentElement,
  can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  off: false,                       // учень сам вимкнув кнопкою — не вмикаємо знову
  enter() {
    if (!this.can() || this.on()) return Promise.resolve();
    try {
      const r = this.el.requestFullscreen ? this.el.requestFullscreen({ navigationUI: 'hide' }) : this.el.webkitRequestFullscreen();
      return Promise.resolve(r).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} },
};
const fsb = document.getElementById('fsb');
function fsPaint() {
  if (!FS.can()) { fsb.hidden = true; return; }
  fsb.hidden = false;
  fsb.textContent = FS.on() ? '⤡' : '⤢';
  fsb.setAttribute('aria-label', FS.on() ? 'Вийти з повного екрана' : 'На весь екран');
}
fsb.addEventListener('click', e => {
  e.stopPropagation();
  if (FS.on()) { FS.off = true; FS.exit(); } else { FS.off = false; FS.enter(); }
});
document.addEventListener('click', e => { if (!FS.off && !FS.on() && e.target !== fsb) FS.enter(); }, true);
document.addEventListener('fullscreenchange', fsPaint);
document.addEventListener('webkitfullscreenchange', fsPaint);
function lockLandscape(wide) {
  try { if (wide && FS.on() && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
fsPaint();

/* ---------- перегляд зображень ---------- */
const lb = document.getElementById('lb'), lbv = document.getElementById('lbv'), lbi = document.getElementById('lbi');
/* Масштаб — transform (translate + scale) з опорою в точці між пальцями: зображення не «стрибає».
   Щипок двома пальцями, перетягування одним, подвійний дотик — збільшити/повернути; на комп’ютері — коліщатко й подвійний клік. */
const V = { s: 1, x: 0, y: 0, bw: 0, bh: 0 };
function vbox() { return { W: lbv.clientWidth, H: lbv.clientHeight }; }
function lbFit() {
  const { W, H } = vbox(), iw = lbi.naturalWidth || 1, ih = lbi.naturalHeight || 1, k = Math.min(W / iw, H / ih);
  V.bw = iw * k; V.bh = ih * k; lbi.style.width = V.bw + 'px'; lbi.style.height = V.bh + 'px';
  V.s = 1; V.x = (W - V.bw) / 2; V.y = (H - V.bh) / 2; lbApply();
}
function lbApply() {
  const { W, H } = vbox(), w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  lbi.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function zoomAt(ns, px, py) {
  ns = Math.max(1, Math.min(6, ns));
  const qx = (px - V.x) / V.s, qy = (py - V.y) / V.s;
  V.s = ns; V.x = px - qx * ns; V.y = py - qy * ns; lbApply();
}
function setZoom(z) { const { W, H } = vbox(); zoomAt(z, W / 2, H / 2); }
function openLb(p) {
  lbi.onload = lbFit; lbi.src = p.dataset.src; document.getElementById('lbc').innerHTML = md(p.dataset.cap); lb.classList.add('open');
  if (lbi.complete && lbi.naturalWidth) lbFit();
  if (!FS.off) FS.enter();
}
app.addEventListener('click', e => { const p = e.target.closest('.pic'); if (p) openLb(p); });
/* щипок на зображенні в уроці відкриває перегляд (а не збільшує всю сторінку) */
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;
  const p = e.target.closest('.pic'); if (!p) return;
  e.preventDefault(); openLb(p);
}, { passive: false });
function closeLb() { lb.classList.remove('open'); unlockOrientation(); }
document.getElementById('lbX').onclick = closeLb;
document.getElementById('lbIn').onclick = () => setZoom(V.s * 1.6);
document.getElementById('lbOut').onclick = () => setZoom(V.s / 1.6);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
window.addEventListener('resize', () => { if (lb.classList.contains('open')) lbFit(); });
const rel = t => { const r = lbv.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
let g = null, lastTap = 0;
lbv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]);
    g = { t: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, qx: ((a.x + b.x) / 2 - V.x) / V.s, qy: ((a.y + b.y) / 2 - V.y) / V.s };
  } else if (e.touches.length === 1) {
    const a = rel(e.touches[0]), now = Date.now();
    if (now - lastTap < 300) { zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); lastTap = 0; g = null; return; }
    lastTap = now; g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y };
  }
}, { passive: false });
lbv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!g) return;
  if (g.t === 'pinch' && e.touches.length >= 2) {
    const a = rel(e.touches[0]), b = rel(e.touches[1]), d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(1, Math.min(6, g.s0 * d / g.d0)), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    V.s = ns; V.x = mx - g.qx * ns; V.y = my - g.qy * ns; lbApply();
  } else if (g.t === 'pan' && e.touches.length === 1) {
    const a = rel(e.touches[0]); V.x = g.x0 + a.x - g.px; V.y = g.y0 + a.y - g.py; lbApply();
  }
}, { passive: false });
lbv.addEventListener('touchend', e => {
  if (e.touches.length === 1) { const a = rel(e.touches[0]); g = { t: 'pan', px: a.x, py: a.y, x0: V.x, y0: V.y }; }   // з двох пальців на один — далі перетягування
  else if (!e.touches.length) g = null;
}, { passive: false });
lbv.addEventListener('wheel', e => { e.preventDefault(); const a = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), a.x, a.y); }, { passive: false });
lbi.addEventListener('dblclick', e => { const a = rel(e); zoomAt(V.s > 1.05 ? 1 : 2.5, a.x, a.y); });

/* ---------- маршрути ---------- */
function route() {
  if (lb.classList.contains('open')) closeLb();
  const h = location.hash.slice(1);
  const m = h.match(/^(p\d)-(s\d+)$/);
  if (m) { const L = P(m[1]); const s = L && L.sections.find(x => x.id === m[2]); if (s) return section(L, s); }
  if (P(h)) return partHome(P(h));
  if (MODE === 'one') return partHome(LESSONS[0]);
  index();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const pr = document.getElementById('pr'); if (!pr) return;
  const max = document.documentElement.scrollHeight - innerHeight;

/* Курс: вхід учня, бліци після частин, замки, Тест 1 і Тест 2, відправлення результатів у Google-таблицю.
   Дані: QUIZ ({blitz:{1:{n,pass,quota,pool}}, tests:{t1:{tasks}}}), COURSE_API (адреса Apps Script). */
const API = (typeof COURSE_API === 'string' && COURSE_API) || '';
const LET = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Є'];
const TYPE = { single: 'Одна правильна відповідь', three: 'Три правильні з семи', seq: 'Послідовність', match: 'Відповідність' };
const LBLRE = /^(?:Місцезнаходження |Місце |малюнок )?([А-ЕЄ]|\d)$/;
const isLbl = q => q.opts.every(o => LBLRE.test(o));
const lab = (q, j, k) => isLbl(q) && !(q.t === 'seq' && q.oimg) ? q.opts[j].match(LBLRE)[1] : q.t === 'three' ? k + 1 : LET[k];
/* порядок показу в бліці: мітки — як є (послідовність із мітками — за абеткою), решта — навмання */
function showOrder(q) {
  const idx = [...q.opts.keys()];
  if (!isLbl(q) || (q.t === 'seq' && q.oimg)) return shuffle(idx);
  return q.t === 'seq' ? idx.sort((a, b) => q.opts[a].localeCompare(q.opts[b], 'uk')) : idx;
}
const mlist = (q, order) => isLbl(q) ? '' : `<div class="mlist">${order.map((j, k) => `<div class="mo"><b class="a2">${LET[k]}</b> ${optHtml(q, j)}</div>`).join('')}</div>`;
const maxOf = q => q.t === 'single' ? 1 : q.t === 'match' ? 4 : 3;
function grade12(pc) { const t = [25, 33, 41, 49, 56, 63, 70, 77, 84, 91]; let g = 2; t.forEach((v, k) => { if (pc >= v) g = k + 3; }); return g; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (p, m) => m ? Math.round(1000 * p / m) / 10 : 0;
/* кількість частин курсу = кількість бліців; короткі перевірки після розділів — QUIZ.mini['<частина>-<розділ>'] */
const NP = Object.keys(QUIZ.blitz || {}).length || 3;
const PARTS_N = Array.from({ length: NP }, (_, i) => i + 1);
const MINI = QUIZ.mini || {};
const PASS = n => (QUIZ.blitz[n] && QUIZ.blitz[n].pass) || 75;
/* спільна оболонка кількох тем: один вхід на сторінці оболонки (SHELL_URL), учень — у спільному сховищі hist_*,
   прогрес теми — під власним префіксом; кожен запит до сервера несе позначку теми (TOPIC) */
const SH = (typeof SHELL_URL === 'string' && SHELL_URL) || '';
const TOPIC_ID = (typeof TOPIC === 'string' && TOPIC) || '';
const G_ = {
  get(k, d) { try { const v = localStorage.getItem('hist_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hist_' + k, JSON.stringify(v)); } catch (e) {} },
};
const ukey = u => u ? (u.cls + '|' + u.name).toLowerCase() : '';
if (SH) {   // на телефоні інший учень, ніж той, чий прогрес теми збережено, — прогрес цієї теми стираємо (черга лишається: там свої імена)
  const u = G_.get('user', null), own = store.get('owner', null) ?? ukey(store.get('user', null));
  if (u && own !== ukey(u)) {
    try { Object.keys(localStorage).filter(k => k.startsWith(PFX) && !k.startsWith(PFX + 'seen_') && k !== PFX + 'queue').forEach(k => localStorage.removeItem(k)); } catch (e) {}
    store.set('owner', ukey(u));
  } else if (u && own == null) store.set('owner', ukey(u));
}
const toShell = () => { location.replace(SH); };

/* ---------- учень і прогрес ---------- */
const U = {
  get user() { return SH ? G_.get('user', null) : store.get('user', null); },
  prog() { return store.get('prog', {}); },
  setProg(k, v) { const p = this.prog(); p[k] = v; store.set('prog', p); },
  passed(k) { const r = this.prog()[k]; return !!(r && r.pass); },
};
const unlocked = num => num === 1 || U.passed('b' + (num - 1));
const testOpen = id => id === 't1' ? PARTS_N.every(n => U.passed('b' + n)) : U.passed('t1');

/* ---------- зв’язок із сервером: черга, щоб нічого не губилося без інтернету ---------- */
const Net = {
  async call(body) {
    if (!API) throw new Error('no api');
    const u = U.user; if (u && u.pin && body.pin == null) body = { ...body, pin: u.pin };
    if (TOPIC_ID && body.topic == null) body = { ...body, topic: TOPIC_ID };
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), cache: 'no-store', redirect: 'follow' });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(); if (j.error) throw new Error(j.error); return j;
  },
  send(op, data) {
    const u = U.user; if (!u) return;
    const q = store.get('queue', []);
    q.push({ op, name: u.name, cls: u.cls, pin: u.pin, at: new Date().toISOString(), ...(TOPIC_ID ? { topic: TOPIC_ID } : {}), ...data });
    store.set('queue', q); this.flush();
  },
  busy: false,
  async flush() {
    if (this.busy || !API) return; this.busy = true;
    try {
      let q = store.get('queue', []);
      while (q.length) {
        const item = q[0], res = await this.call(item);
        q = store.get('queue', []); q.shift(); store.set('queue', q);
        if (item.op === 'test') this.onTest(item, res);
      }
    } catch (e) { const it = store.get('queue', [])[0], u = U.user;
      if (e.message === 'pin' && it && u && it.name === u.name && it.cls === u.cls) { this.busy = false; return badPin(); } /* інакше немає зв’язку — спробуємо пізніше */ }
    this.busy = false; paintSync();
  },
  onTest(sent, res) {
    U.setProg(sent.test, { ...res, at: sent.at });
    store.set('draft_' + sent.test, null);
    if (location.hash === '#' + sent.test) route();
  },
};
function paintSync() {
  const el = document.getElementById('sync'); if (!el) return;

  const b = document.getElementById('syncgo'); if (b) b.onclick = () => Net.flush();
}
window.addEventListener('online', () => Net.flush());
setInterval(() => Net.flush(), 60000);

async function pullProg() {

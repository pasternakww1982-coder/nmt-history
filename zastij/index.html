<style>

/* Layout: exam booklet — sticky answer-sheet bar on top, one task per "page", review as a marked-up booklet */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --surface2:#f8f6f2; --ink:#1e1b18; --muted:#6c645c; --line:#ddd7cf;
  --accent:#c4581a; --accent-ink:#ffffff; --accent-soft:#f6e3d6;
  --ok:#2f7d4f; --ok-soft:#dcefe3; --bad:#b3362c; --bad-soft:#f6dedb; --part:#a7741b; --part-soft:#f4ead3;
  --quote:#f6efe6;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161616; --surface:#222020; --surface2:#1c1b1a; --ink:#f2f0ed; --muted:#a59d94; --line:#3a3633;
  --accent:#e97132; --accent-ink:#161616; --accent-soft:#3c2618;
  --ok:#5fbf86; --ok-soft:#1d3427; --bad:#ef7a6e; --bad-soft:#3d1f1c; --part:#e2b354; --part-soft:#3a2f17;
  --quote:#2a2421; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#161616; --surface:#222020; --surface2:#1c1b1a; --ink:#f2f0ed; --muted:#a59d94; --line:#3a3633;
  --accent:#e97132; --accent-ink:#161616; --accent-soft:#3c2618;
  --ok:#5fbf86; --ok-soft:#1d3427; --bad:#ef7a6e; --bad-soft:#3d1f1c; --part:#e2b354; --part-soft:#3a2f17;
  --quote:#2a2421; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,.cell:focus-visible,img.zoom:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* intro */
.intro{display:grid;gap:22px}
.intro h1{font-size:clamp(30px,5vw,44px);line-height:1.1}
.intro .lead{color:var(--muted);max-width:62ch;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px}
.facts div{display:flex;flex-direction:column;gap:4px}
.facts b{font:600 26px/1 var(--f-mono)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.tbl-wrap{overflow-x:auto}
table.struct{border-collapse:collapse;width:100%;font-size:15px}
table.struct th,table.struct td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.struct th{font-weight:600;color:var(--muted);font-size:13px}
table.struct td:first-child{white-space:nowrap;font-family:var(--f-mono)}
.rules{margin:0;padding-left:20px;display:grid;gap:6px;max-width:68ch}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* test bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:grid;gap:10px}
.bar .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{font:600 20px/1 var(--f-mono);font-variant-numeric:tabular-nums}

ли здатні подолати її в цілому). В підсумку радянське керівництво обрало другий шлях, що в підсумку і визначило їхній крах.", "Установлено, що з 139 членів та кандидатів у члени Центрального Комітету партії, обраних на XVII з'їзді партії, було заарештовано та розстріляно (головним чином у 1937-1938 рр.) 98 чоловік, тобто 70 відсотків. Це відбулося внаслідок зловживань владою з боку Сталіна, який почав застосовувати масовий терор проти кадрів партії.", "В новоствореній організації об'єдналися люди різних політичних переконань – від ліберальних комуністів до тих, хто сповідував ідеї інтегрального націоналізму. Але домінували в ній настрої національної демократії. Опівдні в будинку культури Київського політехнічного інституту відкрилися Установчі збори Народного Руху України за перебудову."]}, {"n": 30, "type": "match", "max": 4, "stem": "Установіть відповідність між афішею фільму чи нотами пісні (1–4) та митцем (А – Д), чиє ім’я з ними пов’язане.", "left": ["Зображення 1", "Зображення 2", "Зображення 3", "Зображення 4"], "right": ["І. Миколайчук (як режисер)", "Л. Биков", "С. Параджанов", "Ю. Іллєнко", "В. Івасюк"], "img": "z2_30.png"}, {"n": 31, "type": "match", "max": 4, "stem": "Установіть відповідність між діячем (1–4) та фактами його біографії (А – Д).", "left": ["Іван Світличний", "Петро Григоренко", "Євген Сверстюк", "Алла Горська"], "right": ["У 1959, 1960, 1961, 1965, 1972 роках його звільняли з роботи за політичними мотивами. Переслідуваний протягом років за участь у \"Самвидаві\" у січні 1972 року засуджений за статтею 62 ч. I КК УРСР за виготовлення і розповсюдження документів \"самвидаву\" до семи років таборів", "український письменник, філософ, громадський діяч, засновник Української Гельсінської Групи. Герой України.", "український літературознавець, мовознавець, літературний критик, поет, перекладач. Репресований радянською владою в 1965 і 1972 рр. Після другого терміну ув'язнення – інвалід, так і не зміг повернутись до активної діяльності", "радянськ const BRAND_NAME = 'Ліцей біотехнологій № 177';
function brandHTML(){ return `<div class="brand"><img src="${BRAND_IMG}" alt=""><span>${BRAND_NAME}</span></div>`; }
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = document.getElementById('app');
const VAR = id => SET.variants.find(v => v.id===id) || null;
const MULTI = SET.variants[0].parts.length > 1;

let S = load() || fresh();
function fresh(){ return {phase:'intro', name:'', cls:'', variant: SET.variants.length===1 ? SET.variants[0].id : null, attempt:null,
  ans:{}, cur:{}, part:null, deadline:null, start:null, end:null, sent:null, result:null, keys:null, filter:'all'}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && s.ans ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const newAttempt = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
const parts = () => (VAR(S.variant) || SET.variants[0]).parts;
const partOf = id => parts().find(p => p.id===id);
const curPart = () => partOf(S.part) || parts()[0];
const ansOf = (pid, n) => (S.ans[pid] || {})[n];
function setAns(pid, n, v){
  S.ans[pid] = S.ans[pid] || {};
  if(v==null || (Array.isArray(v) && (!v.length || v.every(x=>x==null))) || v==='') delete S.ans[pid][n]; else S.ans[pid][n] = v;
  save();
}
function answered(t, a){
  if(a==null) return false;
  if(t.type==='single') return true;
  if(t.type==='num') return String(a).trim()!=='';
  if(t.type==='three') return a.length>0;
  return a.some(x=>x!=null);
}
const units = t => t.rowNums ? t.rowNums.length : 1;
const doneUnits = (t, a) => t.rowNums ? (Array.isArray(a) ? a.filter(x=>x!=null).length : 0) : (answered(t, a) ? 1 : 0);
const label = t => t.label || String(t.n);
const lastNum = p => { const t = p.tasks[p.tasks.length-1]; return t.rowNums ? t.rowNums[t.rowNums.length-1] : t.n; };
const unitsIn = p => p.tasks.reduce((s,t)=>s+units(t),0);
const doneIn = p => p.tasks.reduce((s,t)=>s+doneUnits(t, ansOf(p.id, t.n)),0);
const doneAll = () => parts().reduce((s,p)=>s+doneIn(p),0);
const totalAll = () => parts().reduce((s,p)=>s+unitsIn(p),0);

/* ---------- зв’язок із сервером ---------- */
async function post(url, payload, waits){
  for(const wait of (waits||[0,2500,6000,12000])){
    if(wait) await new Promise(r=>setTimeout(r,wait));
    try{ const r = await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),cache:'no-store'});
         const j = await r.json(); if(j && typeof j.ok !== 'undefined') return j; }catch(e){}
  }
  return null;
}
const who = () => ({test:SET.id, attempt:S.attempt, name:S.name, cls:S.cls, variant:S.variant});

function syncDeadline(remain){
  const d = Date.now() + remain;
  if(!S.deadline || Math.abs(S.deadline - d) > 3000){
    const add = S.deadline ? d - S.deadline : 0;
    S.deadline = d; save();
    if(S.phase==='test' && Math.abs(add) >= 50000) toast(add > 0 ? `Учитель подовжив час: +${Math.round(add/60000)} хв` : `Учитель змінив час: ${Math.round(add/60000)} хв`);
  }
}
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 6000);
}
const left = () => S.deadline ? Math.max(0, S.deadline - Date.now()) : SET.duration*60000;
function fmt(ms){ const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,'0');
  return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${String(m).padStart(2,'0')}:${x}`; }

/* ---------- вступ ---------- */
// Спільний набір (напр., другий блок НМТ): варіант називає вчитель, предмет на вибір учень обирає сам. id варіанта = «v1-eng».
function chooseHTML(resume){
  const C = SET.choose, dis = resume ? 'disabled' : '';
  return `<div class="eyebrow" style="margin-top:4px">Варіант — за вказівкою вчителя</div>
    <div class="varpick">${C.variants.map(v=>`<button type="button" data-cv="${v.id}" class="${S.cv===v.id?'on':''}" ${dis}>${esc(v.name)}</button>`).join('')}</div>
    <div class="eyebrow" style="margin-top:4px">${esc(C.label||'Предмет на вибір')}</div>
    <div class="varpick">${C.electives.map(e=>`<button type="button" data-ce="${e.id}" class="${S.ce===e.id?'on':''}" ${dis}>${esc(e.name)}</button>`).join('')}</div>`;
}
function renderIntro(){
  const resume = S.phase==='test' || S.phase==='wait';
  const vs = SET.variants;
  app.innerHTML = `<div class="wrap intro">${brandHTML()}
    <div class="eyebrow">${esc(SET.eyebrow)}</div>
    <h1>${esc(SET.title)}</h1>
    <p class="lead">${esc(SET.lead)}</p>
    <div class="facts">${(SET.facts||[]).map(f=>`<div><b>${esc(f[0])}</b><span class="eyebrow">${esc(f[1])}</span></div>`).join('')}</div>
    ${(SET.structure||[]).map(st=>`<div class="panel tbl-wrap">${st.title?`<div class="eyebrow" style="margin-bottom:8px">${esc(st.title)}</div>`:''}
      <table class="struct"><tr><th>Завдання</th><th>Форма</th><th>Бали</th></tr>${st.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table></div>`).join('')}
    <ul class="rules">${(SET.rules||[]).map(r=>`<li>${esc(r)}</li>`).join('')}
      <li>Під час роботи фіксуються вихід зі сторінки, інше вікно й розділений екран — учитель це бачить.</li></ul>
    <div class="panel stud"><div class="eyebrow">Хто пише</div>
      <div class="fields"><label>Прізвище та ім’я<input id="sname" type="text" autocomplete="name" maxlength="80" value="${esc(S.name)}" ${resume?'disabled':''}></label>
      <label>Клас<input id="sclass" type="text" maxlength="20" placeholder="напр., 11-А" value="${esc(S.cls)}" ${resume?'disabled':''}></label></div>
      ${SET.choose ? chooseHTML(resume) : vs.length>1 ? `<div class="eyebrow" style="margin-top:4px">${SET.variantLabel||'Варіант'} — за вказівкою вчителя</div>
      <div class="varpick">${vs.map(v=>`<button type="button" data-v="${v.id}" class="${S.variant===v.id?'on':''}" ${resume?'disabled':''}>${esc(v.name)}${v.note?`<small>${esc(v.note)}</small>`:''}</button>`).join('')}</div>` : ''}
      <p class="hint" id="shint">Результат автоматично надійде вчителеві: ім’я, клас, бали й відповіді. Потрібне підключення до інтернету.</p></div>
    <div class="actions"><button class="btn primary" id="go">${resume?'Продовжити':'Почати'}</button></div>
  </div>`;
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { S.variant = b.dataset.v; save(); app.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on', x===b)); });
  app.querySelectorAll('[data-cv],[data-ce]').forEach(b => b.onclick = () => {
    if(b.dataset.cv) S.cv = b.dataset.cv; else S.ce = b.dataset.ce;
    S.variant = S.cv && S.ce ? `${S.cv}-${S.ce}` : null; save();
    app.querySelectorAll('[data-cv]').forEach(x=>x.classList.toggle('on', x.dataset.cv===S.cv));
    app.querySelectorAll('[data-ce]').forEach(x=>x.classList.toggle('on', x.dataset.ce===S.ce)); });
  const hint = (m) => { const h=document.getElementById('shint'); h.textContent=m; h.classList.add('err'); };
  document.getElementById('go').onclick = async () => {
    if(!resume){
      const n=document.getElementById('sname').value.trim(), c=document.getElementById('sclass').value.trim();
      if(n.length<3 || !c){ hint('Впишіть прізвище, ім’я та клас, щоб учитель отримав ваш результат.'); (n.length<3?document.getElementById('sname'):document.getElementById('sclass')).focus(); return; }
      if(SET.choose && !S.cv){ hint('Виберіть варіант, який назвав учитель.'); return; }
      if(SET.choose && !S.ce){ hint('Виберіть предмет на вибір.'); return; }
      if(!S.variant){ hint('Виберіть варіант, який назвав учитель.'); return; }
      S.name=n; S.cls=c;
    }
    if(monCanFs()) monFsReq();   // повний екран — лише в момент дотику, поки браузер це дозволяє
    const b=document.getElementById('go'); b.disabled=true; b.textContent='Зачекайте…';
    if(!S.attempt){ S.attempt = newAttempt(); save(); }
    const j = await post('/start', who(), [0,2000,5000]);
    b.disabled=false; b.textContent = resume?'Продовжити':'Почати';
    if(!j){ hint('Немає зв’язку із сервером. Перевірте інтернет і спробуйте ще раз.'); return; }
    if(j.closed){ S.attempt=null; save(); hint('Зараз почати не можна: учитель закрив прийом.'); return; }
    if(j.already){ S.attempt=null; save(); hint('Ви вже здали цю роботу. Якщо це помилка, скажіть учителю — він може дозволити повторну спробу.'); return; }
    if(!j.ok){ S.attempt=null; save(); hint('Сервер не прийняв запит (' + (j.error||'помилка') + '). Повідомте вчителя.'); return; }
    applyStart(j);
  };
}
function applyStart(j){
  if(j.variant && VAR(j.variant)) S.variant = j.variant;
  if(j.done){ S.phase='done'; save(); render(); return; }
  if(j.wait){ S.phase='wait'; save(); render(); return; }
  syncDeadline(j.remain);
  if(!S.start) S.start = Date.now();
  if(!S.part) S.part = parts()[0].id;
  S.phase='test'; save(); monGo(); render();
}

/* ---------- очікування старту ---------- */
let waitT = null;
function renderWait(){
  const v = VAR(S.variant);
  app.innerHTML = `<div class="wrap wait">${brandHTML()}<div class="dot"></div>
    <h1 style="font-size:clamp(28px,6vw,40px)">Очікуйте старту</h1>
    <p class="lead" style="margin:0">Час (${SET.duration} хв) запуститься для всіх одночасно, коли вчитель натисне «Почати». Сторінка відкриється сама — не закривайте її.</p>
    <div class="panel" style="display:grid;gap:6px"><div><b>${esc(S.name)}</b>, ${esc(S.cls)}</div>${SET.variants.length>1?`<div>${esc(v?v.name:'')}${v&&v.note?` <span class="topic">· ${esc(v.note)}</span>`:''}</div>`:''}</div>
    <div class="actions"><button class="btn" id="fsw">На весь екран</button><button class="btn" id="chg">Змінити дані</button></div>
    <p class="hint" id="whint" style="color:var(--muted);font-size:14px"></p></div>`;
  document.getElementById('fsw').onclick = () => monFsReq();
  document.getElementById('chg').onclick = () => { clearTimeout(waitT); S.phase='intro'; S.attempt=null; save(); render(); };
  pollStart();
}
async function pollStart(){
  clearTimeout(waitT);
  const j = await post('/start', who(), [0]);
  if(S.phase!=='wait') return;
  const h = document.getElementById('whint');
  if(j && j.ok && !j.wait){ applyStart(j); return; }
  if(h) h.textContent = j ? '' : 'Немає зв’язку із сервером — перевірте інтернет.';
  waitT = setTimeout(pollStart, 2500);
}

/* ---------- режим: «бланк як на НМТ» (широкий екран) або «режим для телефона» ---------- */
const MODE_KEY = 'nmt2-ui-mode';
function storedMode(){ try{ return localStorage.getItem(MODE_KEY); }catch(e){ return null; } }
function blankMode(){ const m = storedMode(); if(m==='blank') return true; if(m==='phone') return false; return window.innerWidth >= 900; }
function setMode(m){ try{ localStorage.setItem(MODE_KEY, m); }catch(e){} }
let lastBlank = null, rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => {
  if(S.phase==='test' && !storedMode() && blankMode()!==lastBlank && !document.querySelector('.ov,.lb2')) renderTest(); }, 250); });
function cellsRow(cols, mk){ return cols.map((c,ci)=>`<td>${mk(ci)}</td>`).join(''); }
function sheetHTML(note, cols, rows, mk){
  return `<div class="sheet"><div class="sh-note">${note}</div><table class="grid"><tr>${rows?'<th></th>':''}${cols.map(c=>`<th>${c}</th>`).join('')}</tr>
    ${(rows||[null]).map((r,ri)=>`<tr>${r!=null?`<th class="rh">${r}</th>`:''}${cellsRow(cols, ci=>mk(ri,ci))}</tr>`).join('')}</table></div>`;
}
const cell = (on, attrs, aria) => `<button class="cell ${on?'on':''}" ${attrs} aria-label="${aria}" aria-pressed="${on?'true':'false'}"></button>`;
function blankBody(t, a){
  const LET = letOf(t);
  const list = (labs, items) => `<ol class="opts">${items.map((o,i)=>`<li><span class="L">${labs[i]}</span><span>${o}</span></li>`).join('')}</ol>`;
  if(t.type==='single'){
    const L = LET.slice(0, t.opts.length);
    return list(L, t.opts) + sheetHTML('Позначте одну відповідь.', L, null, (r,c)=>cell(a===c, `data-a="${c}"`, LET[c]));
  }
  if(t.type==='three'){
    const arr=a||[], N=t.opts.map((_,i)=>i+1);
    return list(N, t.opts) + sheetHTML('Позначте три відповіді.', N, null, (r,c)=>cell(arr.includes(c+1), `data-k="${c+1}"`, c+1))
      + `<div class="counter" id="cnt">Обрано ${arr.length} з 3</div>`;
  }
  if(t.type==='match'){
    const rows=t.left.length, arr=a||Array(rows).fill(null), L=LET.slice(0,t.right.length);
    const rl = r => t.rowNums ? t.rowNums[r] : r+1;
    let h = '';
    if(t.leftimgs) h += `<div class="igrid">${t.leftimgs.map((f,i)=>`<figure><span class="L">${i+1}</span><img class="zoom" tabindex="0" src="img/${f}" alt="Зображення ${i+1}"></figure>`).join('')}</div>${t.itemcap?`<div class="topic">${t.itemcap}</div>`:''}`;
    else if(!t.left.every(o=>/^\s*\d+\s*$/.test(o))) h += list(t.left.map((_,r)=>rl(r)), t.left);
    const bare = t.right.every((o,i)=>o.trim()===`Територія ${LET[i]}`);
    if(!bare) h += list(L, t.right);
    if(t.srcnote) h += `<div class="topic">${t.srcnote}</div>`;
    return h + sheetHTML('У кожному рядку позначте одну букву.', L, t.left.map((_,r)=>rl(r)), (r,c)=>cell(arr[r]===c, `data-r="${r}" data-c="${c}"`, `${rl(r)} — ${LET[c]}`));
  }
  if(t.type==='seq'){
    const arr=a||[null,null,null,null], L=LET.slice(0,4);
    let h = '';
    if(t.itemimgs) h += `<div class="igrid">${t.itemimgs.map((f,i)=>`<figure><span class="L">${LET[i]}</span><img class="zoom" tabindex="0" src="img/${f}" alt="Зображення ${LET[i]}"></figure>`).join('')}</div>${t.itemcap?`<div class="topic">${t.itemcap}</div>`:''}`;
    else h += list(L, t.items) + (t.itemcap?`<div class="topic">${t.itemcap}</div>`:'');
    return h + sheetHTML('У рядку 1 позначте найдавніше, у рядку 4 — найпізніше.', L, [1,2,3,4], (r,c)=>cell(arr[r]===c, `data-q="${r}" data-c="${c}"`, `${r+1} — ${LET[c]}`));
  }
  return null;
}

/* ---------- завдання ---------- */
function picHTML(t){
  if(!t.img) return '';
  return `<figure class="pic"><img class="zoom" tabindex="0" src="img/${t.img}" alt="Рисунок до завдання ${t.n}">${t.imgcap?`<figcaption>${t.imgcap}</figcaption>`:''}</figure>`;
}
function srcHTML(t){ return t.src ? `<figure class="src"><blockquote>${t.src}</blockquote>${t.srccap?`<figcaption>${t.srccap}</figcaption>`:''}</figure>` : ''; }
function passageHTML(t, rev){ if(!t.passage) return ''; const p = t.passage.split(`(${t.n}) ___`).join(`<mark class="gap">(${t.n}) ___</mark>`); return `<details class="passage" ${rev?'':'open'}><summary>Текст до завдань</summary>${p}</details>`; }
const tState = (rev, sel, isKey) => !rev ? (sel?'on':'') : (sel&&isKey ? 'right' : sel ? 'wrong' : isKey ? 'key' : '');
function normNum(s){ return String(s==null?'':s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(',', '.'); }
function short(s){ const d=document.createElement('div'); d.innerHTML=s; s=d.textContent; return s.length>70 ? s.slice(0,68).replace(/\s+\S*$/,'')+'…' : s; }
function taskHTML(t, a, rev, blank){
  const LET = letOf(t);
  const dis = rev ? ' disabled' : '';
  let h = passageHTML(t, rev) + srcHTML(t) + picHTML(t) + `<div class="stem">${t.stem}</div>`;
  if(blank && !rev){ const b = blankBody(t, a); if(b!=null) return h + b; }
  if(t.type==='single'){
    h += `<div class="tch">${t.opts.map((o,i)=>`<button class="opt ${tState(rev,a===i,t.ans===i)}" data-a="${i}"${dis}><span class="L">${LET[i]}</span><span>${o}</span></button>`).join('')}</div>`;
  }
  if(t.type==='three'){
    const arr=a||[];
    h += `<div class="tch">${t.opts.map((o,i)=>`<button class="opt ${tState(rev,arr.includes(i+1),rev&&t.ans.includes(i+1))}" data-k="${i+1}"${dis}><span class="L">${i+1}</span><span>${o}</span></button>`).join('')}</div>`;
    if(!rev) h += `<div class="counter" id="cnt">Обрано ${arr.length} з 3</div>`;
  }
  if(t.type==='groups'){
    const arr=a||t.groups.map(()=>null);
    h += `<div class="tch groups">${t.groups.map((g,gi)=>{ const v=arr[gi], k=rev?t.ans[gi]:null;
      return `<div class="grp"><div class="gq">${g.q}</div>${g.opts.map((o,oi)=>`<button class="opt ${tState(rev,v===oi,k===oi)}" data-g="${gi}" data-o="${oi}"${dis}><span class="L">${oi+1}</span><span>${o}</span></button>`).join('')}</div>`; }).join('')}</div>`;
  }
  if(t.type==='match'){
    const rows=t.left.length, arr=a||Array(rows).fill(null);
    if(t.leftimgs) h += `<div class="igrid">${t.leftimgs.map((f,i)=>`<figure><span class="L">${i+1}</span><img class="zoom" tabindex="0" src="img/${f}" alt="Зображення ${i+1}"></figure>`).join('')}</div>${t.itemcap?`<div class="topic">${t.itemcap}</div>`:''}`;
    const bare = t.right.every((o,i)=>o.trim()===`Територія ${LET[i]}`);
    if(!bare) h += `<ol class="refs">${t.right.map((o,i)=>`<li><span class="L">${LET[i]}</span><span>${o}</span></li>`).join('')}</ol>`;
    if(t.srcnote) h += `<div class="topic">${t.srcnote}</div>`;
    h += `<div class="tch">${t.left.map((o,r)=>{
      const v=arr[r], k=rev?t.ans[r]:null;
      const echo = v==null ? (rev?'<span>Без відповіді</span>':'Оберіть букву') : bare ? `→ територія <b>${LET[v]}</b>` : `→ <b>${LET[v]}</b> — ${esc(short(t.right[v]))}`;
      const keyEcho = rev && v!==k ? `<div class="echo">Правильно: <b>${LET[k]}</b>${bare?'':' — '+esc(short(t.right[k]))}</div>` : '';
      const rl = t.rowNums ? t.rowNums[r] : r+1;
      return `<div class="mrow"><div class="who"><span class="L">${rl}</span><span>${o}</span></div>
        <div class="chips" style="grid-template-columns:repeat(${t.right.length},minmax(0,1fr))">${t.right.map((_,c)=>{ const sel=v===c; const used=!rev && !sel && arr.includes(c);
          return `<button class="chip ${tState(rev,sel,k===c)} ${used?'used':''}" data-r="${r}" data-c="${c}" aria-label="${rl} — ${LET[c]}"${dis}>${LET[c]}</button>`; }).join('')}</div>
        <div class="echo ${rev&&v!==k?'bad':''}">${echo}</div>${keyEcho}</div>`; }).join('')}</div>`;
  }
  if(t.type==='seq'){
    const arr=a||[null,null,null,null];
    const lab = c => t.itemimgs ? `<span><span class="lab">${LET[c]}.</span>Зображення ${LET[c]}</span>` : `<span><span class="lab">${LET[c]}.</span>${t.items[c]}</span>`;
    if(t.itemimgs) h += `<div class="igrid">${t.itemimgs.map((f,i)=>`<figure><span class="L">${LET[i]}</span><img class="zoom" tabindex="0" src="img/${f}" alt="Зображення ${LET[i]}"></figure>`).join('')}</div>`;
    h += `<div class="tch">${[0,1,2,3].map(c=>{ const pos=arr.indexOf(c); return `<button class="card ${pos>=0?'on':''}" data-s="${c}"${dis}><span class="num">${pos>=0?pos+1:''}</span>${lab(c)}</button>`; }).join('')}</div>`;
    if(t.itemcap) h += `<div class="topic">${t.itemcap}</div>`;
    const ord = arr.map(v=>v==null?'…':LET[v]).join(' → ');
    h += rev ? `<div class="order"><span>Ваш порядок: <span class="mono">${ord}</span></span><span>Правильний: <span class="mono">${t.ans.map(v=>LET[v]).join(' → ')}</span></span></div>`
             : `<div class="order"><span>Ваш порядок: <span class="mono">${ord}</span></span><button class="btn sm" id="reset" ${arr.some(x=>x!=null)?'':'disabled'}>Скинути</button></div>
                <div class="counter">Торкайтеся подій від найдавнішої до найпізнішої. Повторний дотик знімає номер.</div>`;
  }
  if(t.type==='num'){
    if(rev){
      const ok = a!=null && a!=='' && Math.abs(parseFloat(normNum(a)) - t.ans) < 1e-9;
      h += `<div class="numbox ${a==null||a===''?'':ok?'right':'wrong'}"><label>Ваша відповідь</label><div class="val">${a==null||a===''?'—':esc(a)}</div>${ok?'':`<label>Правильна відповідь</label><div class="val">${esc(String(t.ans).replace('.',',').replace('-','−'))}</div>`}</div>`;
    } else {
      h += `<div class="numbox"><label for="numin">Ваша відповідь (число)</label>
        <input id="numin" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="14" value="${esc(a==null?'':a)}" placeholder="напр., −3 або 2,5">
        <div class="counter" id="numhint">Ціле число або десятковий дріб через кому. Відповідь зберігається сама.</div></div>`;
    }
  }
  return h;
}

/* ---------- екран тесту ---------- */
let tick = null;
function renderTest(){
  const P = parts(), p = curPart(), i = S.cur[p.id]||0, t = p.tasks[i];
  const BL = lastBlank = blankMode();
  document.body.classList.toggle('blank', BL);
  const tabs = MULTI ? `<div class="tabs">${P.map(x=>`<button class="tab ${x.id===p.id?'on':''}" data-p="${x.id}"><b>${esc(x.tab||x.title)}</b><span>${doneIn(x)}/${unitsIn(x)}</span></button>`).join('')}</div>`
                     : `<span class="count">Виконано <span class="mono" id="cntall">${doneIn(p)}</span>/${unitsIn(p)}</span><span class="sp"></span>`;
  const lastOfPart = i===p.tasks.length-1, pIdx = P.indexOf(p), nextP = P[pIdx+1];
  const nextLabel = !lastOfPart ? '→' : nextP ? `${esc(nextP.title)} →` : 'Завершити';
  const modeSw = BL ? `<div class="tmode">Бланк як на НМТ. <button type="button" id="mode">Режим для телефона</button></div>`
                    : `<div class="tmode">Режим для телефона. <button type="button" id="mode">Бланк як на НМТ</button></div>`;
  const navg = BL ? `<div class="nav">${p.tasks.map((x,k)=>`<button class="${answered(x,ansOf(p.id,x.n))?'done':''} ${k===i?'cur':''}" data-go="${p.id}:${k}">${esc(label(x))}</button>`).join('')}</div>` : '';
  const qsec = `<section class="q">
      <div class="qhead"><span class="qnum">${esc(label(t))}</span>${MULTI?`<span class="qpart">${esc(p.title)}</span>`:''}<span class="qtype">${TYPE_LABEL[t.type]}</span></div>
      <div id="tbody" class="q" style="margin:0">${taskHTML(t, ansOf(p.id,t.n), false, BL)}</div>
      ${modeSw}
    </section>`;
  app.innerHTML = BL
   ? `<div class="bar"><div class="in"><div class="top">
      <span class="timer mono" id="timer">${fmt(left())}</span>${tabs}
      <button class="btn" id="finb">Завершити${MULTI?'':' тест'}</button><span id="fsslot"></span></div>${navg}</div></div>
    <div class="wrap">${qsec}
      <div class="navrow"><button class="btn" id="prev" ${i===0?'disabled':''}>← Попереднє</button><span class="pos mono">${esc(label(t))} / ${lastNum(p)}</span><button class="btn primary" id="next">${lastOfPart && !nextP ? 'Завершити' : lastOfPart ? esc(nextP.title)+' →' : 'Наступне →'}</button></div></div>`
   : `<div class="bar"><div class="in"><div class="top">
      <span class="timer mono" id="timer">${fmt(left())}</span>${tabs}
      <button class="btn" id="tasks" aria-label="Усі завдання">${MULTI?'☰':'Усі завдання'}</button><span id="fsslot"></span></div></div></div>
    <div class="wrap">${qsec}</div>
    <div class="bottom"><div class="in"><button class="btn" id="prev" ${i===0?'disabled':''}>←</button><span class="pos">${esc(label(t))} / ${lastNum(p)}</span><button class="btn primary" id="next">${nextLabel}</button></div></div>`;
  const go = (pid, k) => { S.part=pid; S.cur[pid]=k; save(); renderTest(); window.scrollTo(0,0); };
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => go(b.dataset.p, S.cur[b.dataset.p]||0));
  document.getElementById('prev').onclick = () => { if(i>0) go(p.id, i-1); };
  document.getElementById('next').onclick = () => { if(!lastOfPart) go(p.id, i+1); else if(nextP) go(nextP.id, S.cur[nextP.id]||0); else confirmFinish(); };
  const tb = document.getElementById('tasks'); if(tb) tb.onclick = openDrawer;
  const fb = document.getElementById('finb'); if(fb) fb.onclick = confirmFinish;
  app.querySelectorAll('.nav [data-go]').forEach(b => b.onclick = () => { const [pid,k] = b.dataset.go.split(':'); go(pid, +k); });
  document.getElementById('mode').onclick = () => { setMode(BL ? 'phone' : 'blank'); renderTest(); };
  bindTask(p, t);
  monFsBtn();
  clearInterval(tick);
  const upd = () => { const l=left(); const el=document.getElementById('timer'); if(el){ el.textContent=fmt(l); el.classList.toggle('low', l<10*60*1000);} if(l<=0 && S.phase==='test') finish(); };
  tick = setInterval(upd, 1000);
}
function refreshCounts(){
  const P = parts();
  app.querySelectorAll('[data-p]').forEach(b => { const x = P.find(q=>q.id===b.dataset.p); b.querySelector('span').textContent = `${doneIn(x)}/${unitsIn(x)}`; });
  const c = document.getElementById('cntall'); if(c) c.textContent = doneIn(curPart());
  const cp = curPart(); app.querySelectorAll('.nav [data-go]').forEach(b => { const k = +b.dataset.go.split(':')[1], x = cp.tasks[k]; if(x) b.classList.toggle('done', answered(x, ansOf(cp.id, x.n))); });
}
function bindTask(p, t){
  const box = document.getElementById('tbody');
  const commit = a => { setAns(p.id, t.n, a); box.innerHTML = taskHTML(t, ansOf(p.id,t.n), false, blankMode()); bindTask(p, t); refreshCounts(); };
  box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ const v=+b.dataset.a; commit(ansOf(p.id,t.n)===v?null:v); });
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ let a=(ansOf(p.id,t.n)||[]).slice(); const k=+b.dataset.k;
    if(a.includes(k)) a=a.filter(x=>x!==k); else if(a.length<3) a.push(k); else { const c=document.getElementById('cnt'); if(c){ c.textContent='Уже обрано 3 — спершу зніміть один із варіантів'; c.classList.add('flash'); setTimeout(()=>{ c.textContent='Обрано 3 з 3'; c.classList.remove('flash'); },1800);} return; }
    commit(a); });
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const a=(ansOf(p.id,t.n)||t.groups.map(()=>null)).slice(); const g=+b.dataset.g, o=+b.dataset.o;
    a[g] = a[g]===o ? null : o; commit(a); });
  box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const a=(ansOf(p.id,t.n)||Array(t.left.length).fill(null)).slice(); const r=+b.dataset.r, c=+b.dataset.c;
    if(a[r]===c) a[r]=null; else { const o=a.indexOf(c); if(o>=0) a[o]=null; a[r]=c; } commit(a); });
  box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ let a=(ansOf(p.id,t.n)||[null,null,null,null]).filter(x=>x!=null); const c=+b.dataset.s;
    if(a.includes(c)) a=a.filter(x=>x!==c); else a.push(c); while(a.length<4) a.push(null); commit(a); });
  box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const a=(ansOf(p.id,t.n)||[null,null,null,null]).slice(); const r=+b.dataset.q, c=+b.dataset.c;
    if(a[r]===c) a[r]=null; else { const o=a.indexOf(c); if(o>=0) a[o]=null; a[r]=c; } commit(a); });
  const rs=document.getElementById('reset'); if(rs) rs.onclick=()=>commit(null);
  const ni=document.getElementById('numin');
  if(ni){
    ni.oninput = () => {
      const clean = ni.value.replace(/[^0-9,.\-−–]/g,'').replace(/\./g, ',');
      if(clean!==ni.value){ const pos = ni.selectionStart - (ni.value.length-clean.length); ni.value = clean; try{ ni.setSelectionRange(pos,pos); }catch(e){} }
      setAns(p.id, t.n, clean.trim()); refreshCounts();
      const h = document.getElementById('numhint'), v = normNum(clean);
      if(h){ const bad = v!=='' && !/^-?\d+(\.\d+)?$/.test(v); h.textContent = bad ? 'Перевірте запис: потрібне одне число, напр. −3 або 2,5.' : 'Ціле число або десятковий дріб через кому. Відповідь зберігається сама.'; h.classList.toggle('flash', bad); }
    };
    ni.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); ni.blur(); } };
  }
  box.querySelectorAll('img.zoom').forEach(img=>{ img.onclick=()=>openLB(img.src,img.alt); });
}
function openDrawer(){
  const P = parts();
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="drawer" role="dialog" aria-modal="true" aria-label="Завдання">
    ${P.map(p=>`<div class="row"><h4>${esc(p.title)}</h4><span class="count">Виконано <span class="mono">${doneIn(p)}</span> з ${unitsIn(p)}</span></div>
      <div class="navg">${p.tasks.map((x,i)=>`<button class="${answered(x,ansOf(p.id,x.n))?'done':''} ${p.id===curPart().id && i===(S.cur[p.id]||0)?'cur':''}" data-go="${p.id}:${i}">${esc(label(x))}</button>`).join('')}</div>`).join('')}
    <div class="row"><button class="btn" id="close">Закрити</button><button class="btn primary" id="fin">Завершити${MULTI?' (обидва предмети)':' тест'}</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector('#close').onclick=()=>ov.remove();
  ov.querySelector('#fin').onclick=()=>{ ov.remove(); confirmFinish(); };
  ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ ov.remove(); const [pid,k]=b.dataset.go.split(':'); S.part=pid; S.cur[pid]=+k; save(); renderTest(); window.scrollTo(0,0); });
}
function confirmFinish(){
  const miss = parts().map(p=>({p, m:p.tasks.filter(x=>doneUnits(x,ansOf(p.id,x.n))<units(x)).map(x=>label(x))})).filter(x=>x.m.length);
  const ov = document.createElement('div'); ov.className='ov';
  ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h3>Завершити${MULTI?' обидва предмети':' тест'}?</h3>
    <p style="margin:0">${miss.length ? miss.map(x=>`${MULTI?esc(x.p.title)+' — без':'Без'} відповіді: <span class="mono">${x.m.join(', ')}</span>.`).join('<br>') : 'Ви відповіли на всі завдання.'}</p>
    <p style="margin:0">Після завершення змінити відповіді не можна. Залишилося часу: <b class="mono">${fmt(left())}</b>.</p>
    <div class="actions"><button class="btn primary" id="yes">Завершити</button><button class="btn" id="no">Повернутися</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#no').onclick=()=>ov.remove();
  ov.querySelector('#yes').onclick=()=>{ov.remove(); finish();};
}
function finish(){ clearInterval(tick); monStop(); S.phase='done'; S.end=Date.now(); S.sent='pending'; save(); render(); window.scrollTo(0,0); send(); }
const arr = x => Array.isArray(x) ? x : (x==null ? [] : [x]);
function normRes(j){ const per = {}; for(const k in (j.per||{})) per[k] = arr(j.per[k]); return Object.assign({}, j, {parts:arr(j.parts), per}); }
let sending=false, resendT=null;
async function send(){
  if(sending || S.sent==='ok' || S.phase!=='done') return;
  sending=true; S.sent='pending'; save(); showSent(); clearTimeout(resendT);
  const j = await post('/result', Object.assign(who(), {start:S.start, end:S.end, answers:S.ans, mon:monSummary()}));
  sending=false;
  if(j && j.ok){ S.sent='ok'; S.result=normRes(j); save(); render(); checkReview(); return; }
  S.sent='fail'; save(); showSent();
  resendT = setTimeout(send, 20000);   // повторюємо самі, поки не вийде
}
function sentHTML(){
  const w = `${esc(S.name)}, ${esc(S.cls)}`;
  if(S.sent==='ok') return `<div class="sent ok">✓ Результат надіслано вчителеві · ${w}.</div>`;
  if(S.sent==='fail') return `<div class="sent bad">Не вдалося надіслати результат: немає зв’язку із сервером. Сторінка пробує ще раз кожні 20 секунд — не закривайте її. Відповіді збережено на цьому пристрої. <button class="btn sm" id="resend">Надіслати зараз</button></div>`;
  return `<div class="sent">Надсилаємо результат учителеві…</div>`;
}
function showSent(){ const b=document.getElementById('sentbox'); if(!b) return; b.innerHTML=sentHTML(); const rs=document.getElementById('resend'); if(rs) rs.onclick=()=>send(); }

function openLB(src, alt){
  const ov=document.createElement('div'); ov.className='lb2'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML=`<div class="tools"><button data-z="-1" aria-label="Зменшити">−</button><button data-z="1" aria-label="Збільшити">+</button><button data-x aria-label="Закрити">✕ Закрити</button></div><div class="sc"><img alt="${esc(alt)}"></div>`;
  const img=ov.querySelector('img'); img.src=src; document.body.appendChild(ov);
  let z=1; const fit=()=>{ const w=ov.querySelector('.sc').clientWidth-8; img.style.width=Math.min(w*z, img.naturalWidth*3||w*z)+'px'; };
  img.onload=fit; fit();
  ov.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ z=Math.min(4,Math.max(1,z+(+b.dataset.z))); fit(); });
  img.ondblclick=()=>{ z = z>1?1:2.5; fit(); };
  ov.querySelector('[data-x]').onclick=()=>ov.remove();
}

/* ---------- результат і розбір ---------- */
function ansText(t,a){
  const LET = letOf(t);
  if(a==null || a==='') return '—';
  if(t.type==='single') return LET[a];
  if(t.type==='num') return String(a);
  if(t.type==='three') return a.slice().sort().join(', ');
  if(t.type==='seq') return a.map(v=>v==null?'…':LET[v]).join(' → ');
  if(t.type==='groups') return a.map(v=>v==null?'–':v+1).join('');
  return a.map((v,i)=>`${t.rowNums?t.rowNums[i]:i+1}${v==null?'–':LET[v]}`).join(' ');
}
function keyText(t){
  const LET = letOf(t);
  if(t.type==='single') return LET[t.ans];
  if(t.type==='num') return String(t.ans).replace('.',',').replace('-','−');
  if(t.type==='three') return t.ans.join(', ');
  if(t.type==='seq') return t.ans.map(v=>LET[v]).join(' → ');
  if(t.type==='groups') return t.ans.map(v=>v+1).join('');
  return t.ans.map((v,i)=>`${t.rowNums?t.rowNums[i]:i+1}${LET[v]}`).join(' ');
}
let reviewTimer=null, checking=false;
async function checkReview(){
  if(S.keys || checking || !S.attempt || S.sent!=='ok') return;
  checking=true; const j = await post('/review', who(), [0,3000]); checking=false;
  if(j && j.open && j.keys){ S.keys=j.keys; save(); render(); return; }
  S.reviewMsg = !j ? 'Немає зв’язку із сервером — перевірте інтернет.' : '';
  save(); const b=document.getElementById('revbox'); if(b){ b.innerHTML=reviewBoxHTML(); bindReviewBox(); }
  clearTimeout(reviewTimer); reviewTimer = setTimeout(checkReview, 60000);   // онлайн: перевіряємо раз на хвилину
}
function reviewBoxHTML(){
  if(S.sent!=='ok') return '';
  return `<div class="panel" style="padding:14px 16px"><b>Розбір відкриє вчитель, коли всі здадуть.</b> Правильні відповіді й пояснення з’являться на цій сторінці самі — не закривайте її або відкрийте пізніше в цьому самому браузері.
    ${S.reviewMsg?`<div class="hint err" style="margin-top:6px;color:var(--bad)">${esc(S.reviewMsg)}</div>`:''}
    <div class="actions" style="margin-top:10px"><button class="btn sm" id="revcheck">Перевірити зараз</button></div></div>`;
}
function bindReviewBox(){ const b=document.getElementById('revcheck'); if(b) b.onclick=()=>{ S.reviewMsg=''; checkReview(); }; }
const plural = n => { const a=n%10, b=n%100; return a===1&&b!==11?'бал':a>=2&&a<=4&&(b<12||b>14)?'бали':'балів'; };
const gradeWord = g => g==null?'':g>=10?'високий рівень':g>=7?'достатній рівень':g>=4?'середній рівень':'початковий рівень';
function renderDone(){
  const R = S.result;
  const used = S.end && S.start ? Math.min(SET.duration*60000, S.end - S.start) : null;
  if(!R){
    app.innerHTML = `<div class="wrap res"><div class="eyebrow">Роботу завершено</div><h2 style="margin:6px 0 10px">Рахуємо результат…</h2>
      <div id="sentbox">${sentHTML()}</div>
      <p class="foot">Бали рахує сервер, тож потрібне підключення до інтернету. Відповіді збережено на цьому пристрої — їх не буде втрачено.</p></div>`;
    showSent(); return;
  }
  let head;
  if(SET.grade12){
    const sc = R.parts[0].scale;
    head = `<div class="score">
      <div><div class="big">${R.grade}<small> / 12</small></div><div class="eyebrow" style="margin-top:8px">оцінка · ${gradeWord(R.grade)}</div></div>
      <div><div class="rate">${R.pts} / ${R.max}</div><div class="eyebrow" style="margin-top:8px">тестових балів · ${String(R.pct).replace('.',',')}%</div></div>
      ${used!=null?`<div><div class="rate">${fmt(used)}</div><div class="eyebrow" style="margin-top:8px">витрачено часу</div></div>`:''}</div>
      <p class="foot" style="margin:0">Оцінка — за відсотком набраних балів.${SET.noScale?'':` Для орієнтиру: на НМТ ${R.pts} ${plural(R.pts)} ${sc?`${R.pts%10===1&&R.pts%100!==11?'дав би':'дали б'} <b>${sc}</b> за шкалою 100–200`:(R.pts%10===1&&R.pts%100!==11?'не подолав би':'не подолали б')+' поріг'}.`}</p>`;
  } else {
    head = `<div class="subj">${R.parts.map(p=>`<div class="card2"><div class="eyebrow">${esc(p.title)}</div>
        ${p.scale?`<div class="big2">${p.scale}<small> / 200</small></div>`:`<div class="fail">Поріг не подолано</div>`}
        <div class="topic">${p.pts} з ${p.max} тестових балів${p.scale?'':` (потрібно щонайменше ${p.pass})`}</div></div>`).join('')}</div>
      ${used!=null?`<p class="foot" style="margin:0">Витрачено часу: <span class="mono">${fmt(used)}</span> з ${SET.duration} хв.</p>`:''}`;
  }
  app.innerHTML = `<div class="wrap res">${brandHTML()}<div class="eyebrow">Результат</div>${head}
    <div id="sentbox">${sentHTML()}</div>
    ${S.keys ? reviewHTML(R) : `<div id="revbox">${reviewBoxHTML()}</div>`}
    ${SET.footnote?`<p class="foot">${esc(SET.footnote)}</p>`:''}
    ${S.sent==='ok'?`<p class="foot"><button class="btn sm" id="newstud">Інший учень на цьому телефоні</button></p>`:''}</div>`;
  const ns=document.getElementById('newstud'); if(ns) ns.onclick=()=>{ if(confirm('Очистити цю сторінку для іншого учня? Ваш результат уже у вчителя.')){ try{ localStorage.removeItem(KEY); localStorage.removeItem(KEY+'-mon'); }catch(e){} location.reload(); } };
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f; save(); renderDone();});
  const rs=document.getElementById('resend'); if(rs) rs.onclick=()=>send();
  bindReviewBox();
  app.querySelectorAll('img.zoom').forEach(img=>{ img.onclick=()=>openLB(img.src,img.alt); });
}
function reviewHTML(R){
  const f = S.filter||'all';
  const sec = parts().map(p=>{
    const keys = S.keys[p.id] || [], per = (R.per||{})[p.id] || [];
    const list = p.tasks.map((t0,i)=>Object.assign({}, t0, {ans:keys[i]?keys[i].ans:null, expl:keys[i]?keys[i].expl:''}, {_s:per[i]||0}))
      .filter(t => f==='all' || t._s < t.max);
    return `${MULTI?`<div class="ptitle">${esc(p.title)}</div>`:''}${list.length ? list.map(t=>{
      const a=ansOf(p.id,t.n), s=t._s, m=t.max, st = s===m?'full': s===0?'zero':'part';
      return `<article class="rv ${st}">
        <div class="head"><span class="qnum">${esc(label(t))}</span><span class="pill ${st}">${s} з ${m} ${m===1?'бала':'балів'}</span>${t.topic?`<span class="topic">${t.topic}</span>`:''}</div>
        <div class="q" style="margin:0">${taskHTML(t,a,true)}</div>
        <div class="topic">Ваша відповідь: <span class="mono">${esc(ansText(t,a))}</span> · Правильна: <span class="mono">${esc(keyText(t))}</span></div>
        ${t.expl?`<div class="expl"><b>Пояснення.</b> ${t.expl}</div>`:''}
      </article>`; }).join('') : '<p>Помилок немає — усі завдання виконано на повний бал.</p>'}`;
  }).join('');
  return `<div class="actions"><div class="filter"><button class="btn ${f==='all'?'on':''}" data-f="all">Усі завдання</button><button class="btn ${f==='err'?'on':''}" data-f="err">Лише з помилками</button></div></div>
    <div class="legend"><span><i class="sw" style="background:var(--ok)"></i>ваша правильна відповідь</span><span><i class="sw" style="background:var(--bad)"></i>ваша хибна відповідь</span><span><i class="sw" style="box-shadow:inset 0 0 0 3px var(--ok)"></i>правильна відповідь, яку ви не обрали</span></div>${sec}`;
}

function render(){
  document.body.classList.add('touch'); if(S.phase!=='test') document.body.classList.remove('blank');
  if(S.phase==='test' && S.deadline && left()<=0){ S.phase='done'; S.end = S.deadline; S.sent = S.sent || 'pending'; save(); }
  if(S.phase==='done') return renderDone();
  if(S.phase==='wait') return renderWait();
  if(S.phase==='test') return renderTest();
  return renderIntro();
}
render();
if(S.phase==='test') post('/start', who(), [0,3000]).then(j => { if(j && j.ok && !j.wait && j.remain!=null){ syncDeadline(j.remain); } if(j && j.done && S.phase==='test'){ finish(); } });
if(S.phase==='done' && S.sent!=='ok') send();
if(S.phase==='done' && S.sent==='ok' && !S.keys) checkReview();
</script>
